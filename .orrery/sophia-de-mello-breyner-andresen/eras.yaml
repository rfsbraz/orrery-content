stage: eras
summary: >
  Independently re-checked franchise-research's eras: [] ruling against the
  finalized 52-work bibliography (up from 45) rather than inheriting it: the
  7 additions are all extended/apocrypha entries falling inside years the
  ruling already covered (1972, 1981, 1991, 1995, 1997, 2002 x2), none a
  new-genre-first work or a gap-closer over six years, so the shape argument
  is unchanged. Then searched independently, in Portuguese, for a received
  periodisation the scaffold might have missed: Infopedia's own career
  essay, Instituto Camoes's career page, pt.wikipedia, the Publico obituary
  (Luis Miguel Queiros, "Uma vida vertical", 3 Jul 2004), and three
  academic pieces on Livro Sexto's political register (Gabriela Silva 2019,
  Revista do CESP; a UCS Antares paper; a PUCSP paper). None periodise her
  career into named eras. The one real candidate hinge - Livro Sexto (1962)
  as a "moment of turning" (Carlos Mendes de Sousa, quoted secondhand,
  original not reached) into more overtly anti-dictatorship "poesia civil" -
  is treated by every source read as an intensification of one continuous
  ethical/aesthetic project, not a break into a named "before" and "after":
  Infopedia's essay explicitly threads the same ethical stance through
  Livro Sexto (1962), Contos Exemplares (1962) and O Nome das Coisas (1977)
  as one unbroken line. That makes it the same shape as the already-ruled-out
  theatre turn: a real, single hinge, not a periodisation scheme with two
  named halves. Checked a publishing-historical (rung 4) angle too: her
  catalogue is fragmented across concurrent publishers by genre (Atica and
  Figueirinhas for the children's books, others for poetry/prose) rather
  than a clean single-publisher-per-era split, and Assirio & Alvim's 2015
  "Obra Poetica" explicitly frames itself as one continuous volume meant to
  be read in strict publication-date sequence, which argues against a
  periodisation rather than for one. Verdict unchanged: eras: [], and the
  existing file's reasoning (fourteen lifetime poetry collections
  1944-1997, no gap over six years; the five plays as the one real
  late-career genre turn) still holds unmodified, so the content file
  itself was not touched. validate.py --slug sophia-de-mello-breyner-andresen
  is clean except the one expected theme.art error.
