stage: spoiler-audit
summary: >
  Engine re-verified first: spoilerAfter exists only on AuraEvent
  (events/lifeEvents), and this wing sets none (eras.yaml/orders.yaml
  empty, all 17 events biography/publication facts). So the entire
  exposure was in ungated prose (synopses, startHere), not boundaries.
  Read every synopsis, note, lifeEvent and franchise event on the wing.
  Found and fixed two load-bearing spoilers, both in the children's
  books this wing's classroom-canon door sends young readers to; left
  everything else (30 poetry entries, the tale collections, plays,
  events) as premise/received-framing only, verified against a fetched
  source each time, not memory.
produced:
  newWorkIds: []
  newAuthorIds: []
  spoilerAfterSet: []
  spoilerAfterLoosened: []
  changedProse:
    - {file: works.yaml, change: "o-cavaleiro-da-dinamarca synopsis rewritten to publisher jacket copy (ending removed); note records the jacket's stopping point, flagged loosenable if a curator wants the arrival gestured at back"}
    - {file: works.yaml, change: "a-fada-oriana synopsis rewritten to setup only (resolution removed, no jacket anywhere states it); note records why"}
    - {file: franchise.yaml, change: "startHere classroom-canon description: same o-cavaleiro-da-dinamarca fix, was duplicated prose"}
    - {file: "i18n/pt-PT/franchise.yaml", change: "classroom-canon description mirrored (same commit) - the pt-PT overlay had a faithful translation of the same spoiler"}
forStages:
  wing-audit: >
    Passed-on discrepancy, not a spoiler: works.yaml names O Colar's
    leads "Vanina and Pietro"; pt.wikipedia's O Cavaleiro da Dinamarca
    summary names the inset Venice tale's pair "Vanina e Guidobaldo".
    Both could be right (the play needn't reuse the tale's names) but
    worth confirming against the Porto Editora reading guide already
    cited on O Colar's entry.
openQuestions:
  - "O Cavaleiro da Dinamarca jacket gestures at the arrival ('parece ajuda-lo') - a curator could restore that much; the final chapter's specifics (snow, wolves) should stay out."
verdict: >
  Two load-bearing spoilers found and rewritten, both aimed at the
  school-age reader this wing's second door serves; one shipped in
  duplicate across a synopsis and a startHere path, in two languages.
  No spoilerAfter boundary needed anywhere - this shelf is poetry,
  biography and prizes, the engine has nothing to gate. Both rewrites
  follow the publisher's own current jacket copy, each with a note so a
  later enrichment pass doesn't put the endings back.
