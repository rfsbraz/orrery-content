stage: press-archaeology
summary: >
  Dug contemporary Portuguese press, an official parliamentary
  retrospective, a national-radio centenary feature, a 2026 Agência Lusa
  wire report, and the Panteão Nacional's own records. lifeEvents: 8 -> 14
  (6 new). Franchise events.yaml created: 0 -> 3. One correction to
  received wisdom (both Wikipedias give the wrong hospital for her
  death). The 23-year dark run (1976-1998) aura_density.py flagged is
  closed; a second, smaller run it exposed once the first closed
  (1947-1958, 12 yrs) is narrowed to 11 yrs and left documented, not
  padded - genuine effort found nothing load-bearing there beyond what
  marriage-1946 already carries. Aura ratio: 0.15 -> 0.33. validate.py
  --slug sophia-de-mello-breyner-andresen clean except the expected
  missing theme.art error.
produced:
  changedProse:
    - {file: content/authors/sophia-de-mello-breyner-andresen.yaml, change: "lifeEvents 8->14; corrected death hospital in bio + death-2004; trimmed a duplicated sentence off marriage-1946; deepened constituent-assembly-1975 (impact low->high); header rewritten"}
    - {file: content/franchises/sophia-de-mello-breyner-andresen/events.yaml, change: "new file, 3 entries"}
  newLifeEventIds:
    - sophia-de-mello-breyner-andresen-husband-arrested-1959
    - sophia-de-mello-breyner-andresen-writing-as-politics-1982
    - sophia-de-mello-breyner-andresen-separation-divorce-1986
    - sophia-de-mello-breyner-andresen-gulbenkian-children-1992
    - sophia-de-mello-breyner-andresen-vida-literaria-1994
    - sophia-de-mello-breyner-andresen-panteao-2014
  newFranchiseEventIds:
    - sophia-de-mello-breyner-andresen-mar-novo-origin-1958
    - sophia-de-mello-breyner-andresen-o-nome-das-coisas-pascoaes-prize-1977
    - sophia-de-mello-breyner-andresen-ilhas-prizes-1989
  corrections:
    - claim: "Died at Hospital Pulido Valente (both Wikipedias, unclear secondary reference)."
      correction: "Died at Hospital da Cruz Vermelha, per three Lisbon papers filed within two days (Público, JN same-day; CM next day), all naming the same hospital and ~15-day admission."
    - claim: "\"First Portuguese woman writer honoured\" at the National Pantheon (scaffold's death-2004 description)."
      correction: "Second woman given Pantheon honours overall, after fado singer Amália Rodrigues (2001, per panteaonacional.gov.pt's own page). No source asserts a 'first woman writer' distinction, so the fully-sourced claim replaces it; moved to its own 2014 lifeEvent."
counts:
  before: {lifeEvents: 8, franchiseEvents: 0}
  after: {lifeEvents: 14, franchiseEvents: 3}
auraDensity:
  before: {ratio: 0.15, longestDarkRun: "1976-1998 (23 yrs)"}
  after: {ratio: 0.33, longestDarkRun: "1947-1957 (11 yrs)"}
rejected:
  - item: "\"Prémio da Crítica\" (career-wide critics' prize)"
    why: "Three sources, three years, possibly two different bodies conflated: DGLB says 1980, pt.wikipedia's list says 1983 (different org name), DN says 1984. Held out rather than shipped with a guessed date."
  - item: "Jorge de Sena's 1978 death"
    why: "Well documented (their correspondence was later published), but no source ties it to a reaction, dedication or shift in her own work. Fails the origin-story bar, not the sourcing bar."
  - item: "Daughter Sofia's childhood illness as the origin of O Rapaz de Bronze"
    why: "One source (Observador/Isabel Nery) names an illness as prompting the first children's tales generally, no date, no specific tie to that one book among eight."
  - item: "Her old-age hypochondria anecdotes"
    why: "Sourced but reads as personality trivia, not a fact that recolors a work or period."
  - item: "A dated fact for 1947-1957 specifically"
    why: "Searched the illness-origin angle, Coral (1950)/No Tempo Dividido (1954) reception, and the founding-generation magazine context (Távola Redonda, Árvore) - the last is real but generic and already implicit in poesia-debut-1944. Nothing cleared the bar."
whatTheRecordWouldNotGive: >
  Nothing was paywalled or dead outright (web.archive.org covered every
  Público 202). 1947-1957 is under-covered because it predates her public
  political life (1958 Delgado campaign is the earliest dated political
  act found) and Isabel Nery's biography (only pre-published in excerpt
  here) treats it as domestic, not press-worthy. A human with the family's
  own papers or the full 2019 biography could likely do better.
forStages:
  eras: "No change - the 1958 political turn and 1974-76 parliamentary interlude read as punctuation on a continuous output, matching franchise-research's ruling."
  event-resonance: "New evidence for both close calls, not a ruling: portuguese-censorship-1926 now has a direct throughline via 1958-59 (Delgado, Revolta da Sé, prison code) and 1969 (CNSPP); carnation-revolution-1974 now has a deepened 1975 lifeEvent with concrete parliamentary acts."
  visual-language: "theme.yaml untouched. New entries carry concrete visual anchors (Sagres monument model, PIDE file, prison cipher letter, the Nov-1975 siege, the 2014 cortège) for whenever art-rotation runs. organisation/illustration_type/images_required left unset on all new entries, per the skill's rule."
  reading-orders: "No change - new material is lifeEvents/events, not works."
openQuestions:
  - "Is 1947-1957 genuinely quiet, or does it need a source class this pass didn't reach (family papers, the full Isabel Nery biography)? Left dark and documented."
  - "The three-way year conflict on \"Prémio da Crítica\" (1980/1983/1984) - one award or two similarly-named ones? Left out of lifeEvents entirely rather than guessed."
