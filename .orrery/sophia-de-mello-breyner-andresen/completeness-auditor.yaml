stage: completeness-auditor
summary: >
  Read the BNP's own dedicated Sophia bibliography in full
  (purl.pt/19841/1/bibliografia/bibliografia.html), not spot-checked, plus
  both Wikipedias and targeted secondary sources. No date on the original
  45 works was wrong; BNP corroborates every one. Found seven real missing
  works: a periodical poem sequence folded whole into No Tempo Dividido
  (same containedIn shape as three existing works), a 1981 selection, a
  1995 bilingual Expo '98 selection with an unpublished poem, and four
  periodical tales later gathered into the already-catalogued Quatro
  Contos Dispersos. 45 -> 52 works (core 29 unchanged, extended 10 -> 12,
  apocrypha 6 -> 11). Resolved both flagged open questions (below).
  Considered and rejected three further candidates (Singraduras, the
  Jorge de Sena correspondence volumes, Poesia Sempre I/II), documented in
  works.yaml's own exclusion header. Fixed one scaffold sourcing error: O
  Tesouro was cited to BNP, which does not in fact list it. validate.py
  --slug sophia-de-mello-breyner-andresen clean except the expected
  missing theme.art error.
