counts:
  before: { works: 45, core: 29, extended: 10, apocrypha: 6 }
  after: { works: 52, core: 29, extended: 12, apocrypha: 11 }
rejected:
  - item: "Singraduras (1991)"
    why: "one already-published poem (from Navegacoes, 1983) in a fine-press print run; no new text, not reprinted whole elsewhere. In the header."
  - item: "Sophia/Jorge de Sena correspondence volumes (2006, 2010)"
    why: "posthumous two-way letters, absent from BNP's own Sophia bibliography, not authored work. In the header."
  - item: "Poesia Sempre I and II (1964)"
    why: "real BNP-listed titles, but whether they anthologise her own poems or multiple poets under joint editorship with Alberto de Lacerda was not established. Left out, in the header."
openQuestions:
  - "RESOLVED: 11 Poemas (1971) new-work-vs-selection stays unresolved after a wider sweep (BNP, publisher pages, academic sources); held at extended, note now records the sweep happened."
  - "RESOLVED: Os Ciganos co-credit. Pedro Sousa Tavares is real and sourced (journalist, Sophia's grandson, this was his literary debut). Added a minimal author entity (born/died null) and withAuthorIds link; authorRole left default since Sophia remains primary."
  - "NEW: Poesia Sempre I/II - real anthologies, multi-author scope unresolved (see rejected above)."
  - "NEW: the four new Quatro Contos Dispersos component tales are matched to the 2008 book by title/plot against an independent review, not an explicit BNP cross-reference like the wing's other containedIn works carry. High confidence (exact title/date/theme matches) but not a primary-source lock."
forStages:
  press-archaeology: "No new lifeEvents-worthy facts; incidental find: Os Ciganos sourcing describes her estate being catalogued post-2004 and a draft surfacing in 2009, unevaluated for aura-worthiness."
  reading-orders: "Default order grew 45->52 with new same-year ties beyond the existing 1958/2001 ones, notably 1972 and 2002. Unresolved, curated order already out of scope."
  eras: "No change; new works fall inside years the ruled-empty eras.yaml already covers."
  visual-language: "No change; theme.yaml untouched."
  event-resonance: "No change to globalEvents."
