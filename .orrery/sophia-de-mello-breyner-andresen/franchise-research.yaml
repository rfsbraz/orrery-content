stage: franchise-research
summary: >
  New wing scaffolded from scratch: 45 works (29 core, 16 extended/apocrypha)
  across four genres - 14 lifetime poetry collections (1944-1997), 2 tale
  collections plus 4 individually catalogued tales (2 containedIn their
  parent), 8 core children's books plus 1 posthumous co-credited one, 5
  late stage plays (1993-2001), 1 essay - cross-checked title-by-title
  against the Biblioteca Nacional de Portugal's own dedicated bibliography
  and both Wikipedias. An 8-lifeEvent author entity (birth, 1944 debut,
  1946 marriage, 1964 Grande Premio, 1969 CNSPP co-founding, 1975
  Constituent Assembly election, 1999 Camoes Prize, 2004 death). A
  luminous light-background theme (palette + displayFace + signature only,
  no art block), grounded in the sea/Hellenic-light register every source
  names as her defining voice. eras.yaml ruled empty with sourced
  reasoning; globalEvents all excluded, two flagged as close calls.
  validate.py --slug sophia-de-mello-breyner-andresen is clean except the
  one expected error (no theme.art block).
