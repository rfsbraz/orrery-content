stage: visual-metadata
summary: >
  Read the shared 124-candidate TSV sweep (pt/en/no markets), then verified
  by hand: fetched every cover URL with ?default=false, checked dimensions,
  and looked at every image (no HTTP check alone). Two of the TSV's
  best-looking hits (Geografia, Contos Exemplares) turned out to be plain
  typeset title pages, not jacket art, once opened - rejected on sight
  despite passing every automated check. Swept the author's full Open
  Library work list directly (89 records) to find three more legitimate
  covers the TSV's title-matching missed (O Rapaz de Bronze) or covered
  with a different, less-canonical edition than the one used here. No
  retailer watermarks (Bertrand/WOOK img URLs in the TSV were excluded on
  sight, per the skill). All 7 shipped covers are Open Library-hosted,
  clean, and each is the closest edition on Open Library to the work's own
  first-edition publisher and year (Figueirinhas/Ática originals wherever
  Open Library has them).
produced:
  coversSet:
    - {work: historias-da-terra-e-do-mar, edition: "1984 Edições Salamandra", note: "matches first-edition publisher and year exactly"}
    - {work: a-menina-do-mar, edition: "1998 Figueirinhas"}
    - {work: a-fada-oriana, edition: "1976 Edições Ática", note: "same publisher house as the 1958 first edition"}
    - {work: o-cavaleiro-da-dinamarca, edition: "1964 Figueirinhas", note: "matches first-edition publisher and year exactly"}
    - {work: a-floresta, edition: "2004 Figueirinhas", note: "same publisher as the 1968 first edition"}
    - {work: a-arvore, edition: "2004 Figueirinhas", note: "same publisher as the 1985 first edition"}
    - {work: o-rapaz-de-bronze, edition: "Figueirinhas, ISBN 9789726890201", note: "found by sweeping the author's full OL work list, not in the shared TSV"}
  coversRejected:
    - {work: geografia, reason: "OL's only cover (id 4013977) is a typeset title page, no jacket art, on any edition"}
    - {work: contos-exemplares, reason: "OL's only cover (id 12935571) is a typeset title page, no jacket art, on any edition"}
    - {work: poesia, reason: "featured 1944 debut, self-published Cadernos de Poesia edition, no OL record under this or any near-variant title"}
  coversEmpty: 42
  portraitSet: true
  portraitRejected:
    - {candidate: "crop of File:José Régio e Sophia de Mello Breyner.png (135x201)", reason: "re-checked the full 758x1040 source: she is a small, blurred, three-quarter-turned figure in a group photo; no crop clears a usable portrait size, same conclusion the prior pass reached"}
produced_portrait:
  file: "Sophia_Mello_Breyner_Andersen.png"
  artist: "Bottelho (Portuguese painter, 1964-2014)"
  licence: "CC BY-SA 3.0"
  corroboration: "both pt.wikipedia's infobox and her Wikidata entity (P18) independently use this same file as her representative image"
gates: >
  Before: 0/52 works had images.cover, no author portrait. After:
  python scripts/validate.py --slug sophia-de-mello-breyner-andresen -
  0 errors, 0 warnings on this wing (2340 works, 200 authors, 11
  achievements, all references resolve catalogue-wide). 7 unique cover
  URLs on 7 works (checked no repeats), 1 portrait, both fields new -
  editions.yaml and pedro-sousa-tavares.yaml untouched.
forStages:
  pipeline-audit: >
    7/52 works covered (13%), consistent with this catalogue's documented
    ~20% ceiling for a non-anglophone literary author outside Open
    Library's anglophone-heavy scans. The 42 uncovered works were not
    individually commented (would have meant ~40 near-identical "no OL
    cover found" notes on a file that already carries a long top-of-file
    editorial note); the featured debut (poesia) and the two title-page
    traps (geografia, contos-exemplares) are commented since a future pass
    would otherwise re-search or re-fetch the same dead ends.
verdict: >
  7 of 52 works now carry a real, eyeballed, non-watermarked cover from
  Open Library, each matched to the closest edition to the work's own
  first printing; 2 further OL hits were caught and rejected as title-page
  scans rather than jacket art. The author portrait gap flagged by
  franchise-research is resolved with a properly licensed, properly
  credited illustration corroborated by both Wikipedias and Wikidata as
  her standing representative image, after re-confirming (not assuming)
  that the only photographic candidate genuinely does not clear a usable
  size. Everything else stays honestly empty.
