stage: wing-audit
summary: >
  Numbers re-derived, not inherited: 52 works (29/12/11), 14 lifeEvents, 3
  franchise events, 18 aura, 7 covers, 31 editions over 29 works, 14/14 core
  poetry spine, 31 valid ISBN check digits, all 85 URLs live. Four covers
  opened and looked at, five OL records and five pt-PT entries checked.
  Four stale comments fixed, eleven findings routed.

gates:
