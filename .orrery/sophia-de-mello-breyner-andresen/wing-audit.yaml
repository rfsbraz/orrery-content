  i18n: "pt-PT 383/399, no regression, nothing PARTIAL/MISSING here"
  artRotation: "organisation and pacing hold; the 1 problem reported is the composition axis, not this gate"

vaninaResolution: >
  Both right, different works. Porto Editora's O Colar reading guide (already
  cited there) names the leads Vanina and Pietro Alvisi; "Vanina e Guidobaldo"
  is the inset tale inside O Cavaleiro da Dinamarca. works.yaml was correct;
  O Colar's note now records it.

pedroSousaTavaresCheck: >
  Correct; nothing else carries the error. sol.sapo.pt: "a proposta DA TIA, a
  poetisa Maria Andresen de Sousa Tavares".

