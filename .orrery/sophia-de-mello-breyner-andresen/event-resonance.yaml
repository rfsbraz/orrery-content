stage: event-resonance
summary: >
  Event resonance resolved: one global event included (portuguese-censorship-1926,
  the Estado Novo regime that shaped her entire adult writing life), the remaining
  eighteen global events overlapping her 1919-2004 lifetime excluded. The Carnation
  Revolution was the second close call - it freed her from censorship and brought
  her into politics - but her published works show no thematic shift in response;
  she had written her major poetry collections under censorship and ultimately
  chose writing as her true political participation over political office.
  validate.py --slug sophia-de-mello-breyner-andresen clean except the expected
  theme.yaml error (no art: block, visual-language stage pending).
included:
  - portuguese-censorship-1926: >
      The Estado Novo's censorship regime directly constrained her writing
      practice across her entire adult life and made opposition to it central
      to her political identity and activism (CNSPP 1969, "Cantata da Paz",
      Constituent Assembly 1975).
excluded:
  - world-war-ii-1939: lived through it, age 19-24; no sourced engagement found
  - pulp-magazines-1926: English-language genre-magazine phenomenon, unconnected
  - penguin-paperback-1935: English-language mass-market publishing, unconnected
  - armed-services-editions-1943: US WWII military-book program, unconnected
  - lady-chatterley-trial-1960: UK obscenity trial, unconnected to her work or censorship history
  - fantasy-paperback-boom-1965: English-language genre-publishing phenomenon, unconnected
  - carnation-revolution-1974: ended censorship and brought her into politics briefly, but her published works show no response; she had written her major poetry under censorship and ultimately chose writing as her true political participation
  - chain-bookshop-1982: English-language retail-industry shift, unconnected
  - online-bookselling-1995: she died in 2004; no sourced engagement found
  - comics-code-authority-1954: US comics industry, unconnected
  - satanic-verses-fatwa-1989: no sourced connection found
  - sept-11-2001: she was 81-82, near the end of her writing life; no sourced engagement found
  - world-war-i-1914: predates her birth by 5 years
  - elementary-education-act-1870: predates her birth by 49 years
  - berne-convention-1886: predates her birth by 33 years
  - financial-crisis-2008: postdates her death by 4 years
  - ebook-and-self-publishing-2007: postdates her death by 3 years
