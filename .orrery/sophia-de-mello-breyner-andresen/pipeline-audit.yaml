findings:
  - id: reading-orders-wrote-i18n
    severity: footprint-violation-harmless
    what: >
      reading-orders (commit 334a923) created
      content/i18n/pt-PT/franchises/sophia-de-mello-breyner-andresen/franchise.yaml
      from scratch - 65 lines of full pt-PT prose for both new startHere
      paths plus the completionist note. author.md's footprint table gives
      content/i18n/<locale>/** exclusively to translation; reading-orders'
      own row is orders.yaml, franchise.yaml (startHere) - base language only.
    evidence: >
      git show 334a923 -- content/i18n/pt-PT/franchises/.../franchise.yaml
      (new file, 65 insertions). reading-orders.yaml's own handoff lists the
      i18n file under `produced.files` and `changedProse`, so the stage knew
      it was writing outside its documented lane.
    consequence: >
      Harmless this run. translation's commit (985ec0a) reads the overlay in
      full, verifies it against the base file, and extends it with ONLY the
      missing top-level `description` field - its own handoff says
      explicitly "its startHere prose was not touched." No rework. No
      collision either: reading-orders (stage-order position 4) fully
      merged (8687355) long before translation (position 9) started, so
      there was never a window for two agents to fight over this file.
    proposedEdit:
      file: .claude/commands/author.md
      change: >
        In the file-footprint table, change the reading-orders row from
        "orders.yaml, franchise.yaml (startHere)" to "orders.yaml,
        franchise.yaml (startHere, base language) - and, same commit, its
        own-locale overlay for that same field only (content/i18n/<locale>/
        franchises/<slug>/franchise.yaml startHere), never any other i18n
        field." This converts a silent violation into a documented,
        deliberate carve-out, so a later pipeline-audit does not have to
        re-derive from git that it was intentional and safe, and so
        translation's skill can be told to trust an existing startHere
        overlay rather than re-verify it from scratch line by line.
      alternative: >
        If the tighter reading is preferred - no stage but translation ever
        writes under content/i18n/** - the fix is in
        .claude/skills/reading-orders/SKILL.md instead: forbid the direct
        i18n write and require the drafted pt-PT prose to go into
        reading-orders.yaml's own forStages.translation field so translation
        writes it under its own footprint.
    expectedSaving: >
      Not tokens (the prose still has to be composed once either way, and
      this run's version already avoided a second composition pass). The
      saving is architectural: single ownership of content/i18n/**, and
      removing the latent risk that a future wing runs these two stages
      closer together or re-triggers reading-orders (e.g. on /refresh) after
      translation has already localized the file, producing real conflict
      instead of this run's lucky non-collision.

  - id: eras-tier-first-build-sonnet
    severity: tier-deviation-clean-outcome
    what: >
      author.md's model/effort table states "eras | opus on a first build,
      else sonnet." This is a first build (the wing was scaffolded the same
      session), but eras ran sonnet/high per the supplied cost table.
    evidence: "costTable.eras: {model: sonnet, effort: high}; commit bc9b77e is the wing's first and only eras commit."
    consequence: >
      No harm found. eras.yaml shipped empty (no periodization applies to
      a 52-work, four-genre single-author shelf with no received critical
      periodization), sourced against the full bibliography (bc9b77e), for
      113,626 tokens - and wing-audit's independent re-check (5508cbe)
      raised no objection to the empty-eras call.
    proposedEdit:
      file: .claude/commands/author.md
      change: >
        Split the eras tier row: "opus on a first build where a
        periodization is a live candidate (the scheme is actually being
        decided); sonnet suffices when a first build's bibliography itself
        rules out any span (too small or too narrow a shelf for a scheme to
        divide), since the claim being shipped is a documented absence,
        checkable by re-reading the bibliography, not an editorial scheme."
      caveat: >
        Do not action this off one data point. A missed periodization is
        exactly the silent, permanent failure mode the table prices opus
        for; this finding says the current run's downgrade happened to be
        safe, not that the row should change without a second wing
        confirming the same shape (empty eras, first build, sonnet, clean
        wing-audit result).
    expectedSaving: "Unknown/unclaimed - flagged for confirmation, not a proposed change to act on yet."

  - id: visual-metadata-editions-ran-sequential
    severity: minor-missed-parallelism
    what: >
      author.md's stage order lists step 8 "Artefacts, parallel:
      visual-metadata - editions" and their footprints are disjoint
      (works.yaml images/author portrait vs editions.yaml). This run ran
      them sequentially instead: visual-metadata committed 18:54:56 and
      merged 18:55:28; editions did not start until after, committing
      19:00:50.
    evidence: "git log --pretty='%h %ad %s' --date=iso-strict, commits c931100/99ec13b then 4f28698/393c4fb."
    consequence: >
      No token waste, no rework - just unclaimed wall-clock. visual-metadata
      ran 616,991 ms; if launched concurrently with editions (991,834 ms)
      rather than after it, roughly that duration could have overlapped.
    proposedEdit: "None filed - noting the miss is enough; this is a scheduling choice for the orchestrator's own dispatch, not a skill or command wording problem."
    expectedSaving: "~10 minutes of wall clock next run, if the orchestrator dispatches both agents in the same batch."

  - id: translation-attempt1-untracked-cost
    severity: measurement-gap
    what: >
      translation attempt 1 was interrupted by an external session restart
      with zero on-disk progress and discarded. It has no commit (nothing to
      derive cost from in git) and no tokens/calls/duration in the supplied
      cost table.
    evidence: "Stated in the orchestrator's prompt to this stage; no corresponding commit exists on the branch between editions' merge (393c4fb, 19:02:34) and translation attempt 2 (985ec0a, next day 06:41:27)."
    consequence: >
      The run's true total cost is a floor, not the real number - attempt 1
      spent something before it died, and that spend is invisible to every
      future pipeline-audit reading only the cost table and git log.
    proposedEdit:
      file: .claude/commands/author.md
      change: >
        In "Record what each stage cost, as it finishes," add: "A stage
        that is interrupted or restarted still cost something. Log what is
        known before it died (even a rough call count read off the
        transcript) rather than dropping the line - pipeline-audit's total
        should be a floor with a labelled gap, not a silent undercount."
    expectedSaving: "Not a token saving - a measurement-accuracy fix."

alreadyFine:
  - "validate.py scoping: 11 of 12 handoff-recorded runs used --slug sophia-de-mello-breyner-andresen; the one unscoped run (translation, 985ec0a handoff) was a deliberate one-line confirmatory grep against the full catalogue output, not a repeated habit. Large improvement over the John Shirley baseline's eleven catalogue-wide runs."
  - "Parallel-group and never-collide discipline held exactly as author.md's table warns: press-archaeology/eras genuinely overlapped (eras committed 17:26:55, press-archaeology 17:45:02, merged together 17:46:38) and neither shares a file with the other; event-resonance fully merged (17:52:37) before reading-orders started (18:07:50), so the two franchise.yaml-writing stages never overlapped; art-rotation fully merged (18:42:11) before visual-metadata started (18:54:56), so the two authors/<id>.yaml-writing stages never overlapped either."
  - "Shared metadata sweep worked as designed: the orchestrator ran scripts/metadata/lookup.py once (producing .orrery-lookup.tsv, 124 rows) ahead of the artefact stages, per stage-order step 8. editions' own handoff confirms it started from that file and made only targeted follow-up BNP fetches for the 8 core-poetry gaps the sweep missed, rather than re-running the sweep itself."
  - "tok/call spread across all 13 executed stages is 2,557-3,805 - a narrow band, none showing the high-tokens/high-calls/low-tokens-per-call death-by-fetches shape the skill names as the most common and most fixable failure. Nothing here resembles the baseline's visual-metadata (170 calls, 1,942 tok/call)."
  - "visual-metadata's sonnet/low tier: 3 of wing-audit's findings trace to it (cavaleiro-cover-provenance, rapaz-cover-record, portrait-is-a-drawing) - exactly the failure mode author.md predicts and prices for at this tier ('a watermarked scrape or an omnibus cover passes every automated check. Cut effort, not tier'). All three were caught downstream and fixed in one 7-line mechanical patch (06ccf1a) rather than needing a re-dispatch. The tiering choice is validated, not contradicted, by this run."
  - "Orchestrator's direct-fix commit (06ccf1a) cross-checked line by line against wing-audit's own fixesApplied/findings routing (5508cbe): the six items applied (cnspp-1969 date, Obra Poetica date agreement, two section-banner labels, two cover-provenance comment softenings, portrait-credit medium, one bio tense-consistency pass) are exactly the ones wing-audit itself called trivial/mechanical. The one finding needing real research (dark-run-1947-1957, needs family papers) was correctly left unfixed; the three pipeline findings (dead theme.preset, schema-lags-validator, undocumented emblem) and the curatorsCall items were correctly left for a human. No scope creep."
  - "No footprint violations found in franchise-research, completeness-auditor, press-archaeology, event-resonance, spoiler-audit, visual-language, art-rotation, visual-metadata, editions or wing-audit - each commit's added fields were checked against that stage's table row and match."
  - "world-events did not run and has no cost-table entry; nothing in the branch history or any handoff suggests it should have (Sophia's 1919-2004 lifetime sits inside the catalogue's existing global-events coverage, no handoff flags a missing decade). Consistent with a correctly-untriggered stage, not a silent skip."

