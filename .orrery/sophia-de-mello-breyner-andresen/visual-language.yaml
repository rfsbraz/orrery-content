forStages:
  asset-prompt: >
    The emblem (a held spiral seashell, for O Búzio de Cós) and the
    classical/Aegean motifs (Ítaca, Cíclades, "Os Gregos") only become
    literally available from Dual (1972) and O Nome das Coisas (1977)
    onward per works.yaml's own synopses - earlier life events (the 1919
    birth, the 1944 debut, the 1946 marriage) should draw from the garden/
    house-of-memory and domestic motifs instead, not retroject the Hellenic
    material backward. The prison-code (1959) and political (1969, 1975,
    1982, 1969-CNSPP) life events are the wing's hardest cases for §4a
    variety within the "no cell, no podium, no likeness" constraint the
    avoid list sets - lean on the folded/illegible-page and closed-door
    motifs, and vary which object (page, door, bench, table) carries each
    one so five political events do not converge on the same still life.
    14 life events + 3 franchise events + 1 world event is enough assets
    that the composition-type rotation (§4a) needs to be tracked across all
    18, not just the life events.
