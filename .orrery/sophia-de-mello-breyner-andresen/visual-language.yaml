distinctness: >
  The real risk was luis-de-camoes, not the other five Portuguese-poet
  wings: every source calls the sea "probably the most central theme" of
  this author's work, and Camões's own wing already built this catalogue's
  sea-and-daylight register in detail (salt-crusted manuscript paper,
  verdigris patina on ship's bronze, a monsoon coastline, a colonial
  ledger). Drawing this wing as "a sea poet" without a sharper claim would
  only redraw his territory in a paler palette. The bibliography supplies
  the sharper claim: her sea is named as Aegean, not Atlantic or Indian
  Ocean - "O Rei de Ítaca" and "Cíclades" in O Nome das Coisas (1977), "Os
  Gregos" in Dual (1972), and her last book's title, O Búzio de Cós e
  Outros Poemas (1997), a shell named for Kos. Camões's record is two
  decades actually spent at sea and on colonial coasts, administered and
  crossed; hers is a Lisbon-trained classicist's inherited horizon, looked
  at from a fixed place (a window, a garden, a held shell), never a voyage
  or a colonial desk. Concretely: this line stays one steady weight
  throughout where Camões's dries into a broken stipple; this
  backgroundTexture is cool stone, not paper at all, where his is warm
  sun-bleached laid paper with a salt bloom; this accent only ever touches
  a shell's interior or painted wood, where his only ever touches oxidised
  bronze - and both avoid lists name the other wing for that boundary, the
  pattern Camões's own avoid list uses for joao-tordo. Fernando Pessoa
  (sharing displayFace spectral) rules the coast out of his own wing on
  purpose ("enters only at a remove"), so no collision there. Cesário
  Verde and Florbela Espanca share signature filament but neither register
  overlaps (near-black gaslit Lisbon commerce; a scorched Alentejo heath).
  Almeida Garrett and Eça de Queirós are both gaslit interior-nocturnal
  registers this wing does not touch.
