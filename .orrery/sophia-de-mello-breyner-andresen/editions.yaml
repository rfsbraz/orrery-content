stage: editions
summary: >
  Wrote editions.yaml from scratch: 31 entries, 29 of 52 works covered (2
  works - Contos Exemplares, Histórias da Terra e do Mar - carry two genuinely
  different objects each). Core poetry spine is complete, 14 of 14, all still
  in print under Assírio & Alvim's 2013-2019 "Obras de Sophia de Mello
  Breyner Andresen" reissue series. Every ISBN-13 recomputed digit by digit
  and cross-checked against a Biblioteca Nacional de Portugal record actually
  opened (batch-fetched via catalogo.bnportugal.gov.pt/ipac20, plain ISBN
  query, no dashes needed). Did not run scripts/metadata/lookup.py; started
  from the pre-supplied .orrery-lookup.tsv (124 candidates), verified or
  discarded every row in it, then filled real gaps in the core poetry spine
  the sweep had missed (8 of 14 titles) via targeted BNP lookups. Two ISBN
  hazards found and resolved without silent correction, both written into the
  file's own header per CURATION's doctrine: (1) O Colar's number,
  978-972-37-1716-7, is ALSO attributed by a second BNP record to Histórias
  da Terra e do Mar's 2013 printing - a live BNP cataloguing duplicate, not a
  reason to drop O Colar's own number, which three independent retailer
  records corroborate; Histórias already has its own separately-confirmed
  ISBN recorded. (2) O Nu na Antiguidade Clássica's 2019 edition (224p) looked
  suspicious for a 1975 essay until the publisher's own synopsis confirmed it
  bundles the reissued essay with a new poetry anthology - genuine, recorded.
  wook.pt, bertrand.pt and assirio.pt all 403 an automated fetch; verification
  for candidates only found there ran through BNP and portoeditora.pt
  (same publishing group, reachable) instead.
