rejected:
  - item: "Prosa (Assirio & Alvim, 2021, 9789723721294, 512p)"
    why: "collected-prose omnibus gathering Contos Exemplares, Historias da Terra e do Mar, Quatro Contos Dispersos and more, already catalogued individually. Same treatment as Obra Poetica."
  - item: "Marine Rose (Black Swan, 1988), Log Book (Carcanet, 1997), shores horizons voyages (Orchid Press, 2005)"
    why: "career-spanning English selected-poems anthologies, no single workId to attach to."
  - item: "The Girl from the Sea & Other Stories (Dedalus, 2020, 9781912868032)"
    why: "eight children's tales translated together across several works (A Fada Oriana, A Floresta, O Rapaz de Bronze...), not a translation of the single picture book its title echoes."
  - item: "Coral e outros poemas / Poemas Escolhidos (Companhia das Letras, Brazil, 9788535930795 / 9788535905519)"
    why: "978-85 prefix, pt-BR themed selections, different objects from the pt-PT works of the same near-title. Poemas Escolhidos already flagged in works.yaml's own note."
  - item: "lookup.tsv's 2015 Obra Poetica ISBNs (9789723718249, 9789722121491)"
    why: "collected-works reissues, already excluded by works.yaml's own header."
openQuestions:
  - "O Colar / Historias da Terra e do Mar share an ISBN at BNP - resolved in favour of both works' own independently-corroborated numbers; see file header. Not escalating further, both entries ship correct."
  - "Quatro Contos Dispersos' 2008 Figueirinhas first edition (978-972-661-214-8) is confirmed real but not recorded as a second entry, to keep to one edition where the two aren't genuinely different objects (both plain trade paperbacks). A curator wanting the historical first edition on record can add it; the ISBN is in this file's note on the current entry."
  - "10 extended-tier poetry anthologies/selections (Antologia, Grades, 11 Poemas, the 1981 Poemas Escolhidos, Signo, Primeiro Livro de Poesia, Mar, Orpheu e Eurydice, Ilhas - Poemas Escolhidos) plus O Anjo de Timor, O Tesouro and three unproduced/small-press plays (Nao Chores Minha Querida, Filho de Alma e Sangue, O Azeiteiro) have no ISBN-bearing edition findable in any source checked. Real market gaps, not a research shortfall - these are small-press, out-of-print, or never-reissued objects."
forStages:
  visual-metadata: "No overlap touched - coverUrl left null everywhere per SCHEMA's image-rights rule; every cover candidate surfaced was a retailer scrape (img.bertrand.pt / img.wook.pt)."
