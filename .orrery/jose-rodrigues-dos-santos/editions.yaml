stage: editions
summary: >
  34 of 34 works given a verified pt-PT edition (content/franchises/
  jose-rodrigues-dos-santos/editions.yaml). 28 novels/essays/interview
  volumes sourced to the current publisher's own product page (gradiva.pt
  2001-2022 era, planetadelivros.pt 2022-present); 24 of those cross-checked
  against an independent OpenLibrary record. The three war-reportage essays
  and both remaining interview volumes (out of print at both publishers)
  rest on the BNP ipac20 catalogue and, for one, an OpenLibrary record of a
  Harvard Library MARC entry. Every ISBN check digit verified by hand and by
  `lookup.py --verify-isbns` (34 editions, 0 suspect); every prefix checked
  against the Portugal/Brazil table (two genuine Brazilian editions found
  and excluded: "O Sétimo Selo" via Editora Record, "O Segredo de Espinosa"
  via Planeta do Brasil).
checkDigitFailuresCaught:
  - >
    "Conversas de Escritores": gradiva.pt's own product page prints
    "ISBN: 378-989-616-366-2" - 378 is not a real Bookland prefix, so the
    number fails outright, not just its check digit. BNP's own catalogue
    record for the same book (978-989-616-366-2) passes its check digit and
    is independently corroborated by OpenLibrary; that number is used, cited
    to BNP, with Gradiva's page cited only as the source of the error.
  - >
    "O Protocolo Caos": OpenLibrary carries a user-contributed, check-digit-
    valid ISBN (978-989-777-955-8) tracing to no library or publisher
    source, disagreeing with Planeta's own current product page
    (978-989-777-933-6). The publisher's own catalogue entry is used.
notableResearch:
  - >
    "O Codex 632" and "A Fórmula de Deus" both got 2026 Gradiva
    20th-anniversary reissues; gradiva.pt's own pages for the original
    2005/2006 printings now link to the anniversary edition as the "physical
    book" option, meaning the original ISBN is ebook-only there today. The
    anniversary edition is recorded as the current pt-PT edition of each;
    the superseded original ISBNs are not recorded as second entries.
  - >
    The three war-reportage essays share one "Fora de Colecção" numbering
    (174/180/185) and BNP's own first-edition record catalogues all three
    under one three-ISBN block whose volume-to-ISBN order does not agree
    with every later, single-volume record for the same numbers. The mapping
    used in editions.yaml follows the majority of later records (four
    independent editions for "Da Crimeia a Dachau", a legal-deposit-paired
    combined record for "De Saigão a Bagdade", four editions plus an
    OpenLibrary/Harvard MARC record for "A Verdade da Guerra") over the one
    dissenting first-edition listing. Full citation trail is in the file
    header and each entry's own note.
gaps: []
forStages:
  visual-metadata: "No conflict: this file never sets coverUrl."
validatorResult: >
  `python scripts/validate.py --slug jose-rodrigues-dos-santos` - 0 errors,
  0 new warnings (3 pre-existing warnings unrelated to editions.yaml: two
  handoff word-count soft-caps and one pre-existing eras/comunicacao gap).
  `python scripts/metadata/lookup.py jose-rodrigues-dos-santos --verify-isbns`
  - 34 editions, 0 suspect. All 34 ISBNs unique, all 34 works covered, no
  duplicates.
