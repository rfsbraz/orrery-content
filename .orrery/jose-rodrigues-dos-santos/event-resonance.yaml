stage: event-resonance
summary: >
  Ruled on the 11 global events that overlap this author's lifetime (born
  1964, alive today; the pre-birth events - both world wars, the pulp,
  Penguin and Armed Services milestones, the Lady Chatterley trial, the 1870
  Education Act - never reached the arithmetic gate and needed no ruling).
  2 included, 9 excluded. aura_density.py: 25 -> 16 (5 franchise events + 9
  author life events + 2 included globals, down from 11 uncurated
  lifetime-fallback hits).
produced:
  franchise: "franchise.yaml globalEvents block only; nothing else in that file touched"
  include:
    - financial-crisis-2008: >
        A Mão do Diabo (2012) turns on Tomás Noronha decrypting a DVD that
        could expose the architects of the 2008 crash itself - the event
        named directly in the book's own synopsis, not inferred.
    - portugal-bailout-2011: >
        The same novel opens with Noronha made redundant in a wave of
        university budget cuts, the domestic face of the post-bailout
        austerity that held Portuguese public spending down from 2011 to
        2014. Two distinct real events, one novel, each answered by a
        different plot thread already present in the sourced synopsis.
  exclude:
    - sept-11-2001: >
        Real, sourced professional connection found (RTP's own archive
        confirms he reported live from Ground Zero for the one-year
        anniversary special in 2002) but no novel answers the attacks
        themselves; a claimed detail about him personally ordering the
        on-air terrorism call that day turned up only in a search-engine
        synthesis, never in a page actually opened, so it was not used.
    - covid-19-pandemic-2020: "wrote and published through it (2021); no sourced link to any novel."
    - fantasy-paperback-boom-1965: "writes historical thriller, not fantasy; not his category."
    - carnation-revolution-1974: >
        The paradigm case the skill itself names for a Portuguese author,
        checked deliberately. Colonial-era Portugal recurs across his
        fiction (O Anjo Branco, Saga do Lótus, A Filha do Capitão), but no
        work dramatizes the Revolution itself, and his own childhood
        timeline (Colonial War in Tete until age eight, then Lisbon,
        Penafiel, Macau) has him already elsewhere by 1974 with no sourced
        account tying the family's path to the Revolution specifically.
        "It ended censorship that let him later write critically about
        Salazar" was considered and rejected as exactly the "shaped the
        era" sentence the skill warns against - no source has him or a
        critic making that connection.
    - chain-bookshop-1982: "generic publishing-industry background; no sourced connection to how his books reached readers."
    - online-bookselling-1995: "generic publishing-industry background; traditionally published throughout, no sourced Amazon-era angle."
    - ebook-and-self-publishing-2007: "traditionally published by Gradiva then Planeta throughout; no self-publishing or ebook-launch angle."
    - prestige-fantasy-adaptation-2011: "writes historical thriller, not fantasy; unrelated genre."
    - booktok-2020: "an established bestseller since 2005; no sourced BookTok-driven discovery angle."
validatorResult: >
  python scripts/validate.py --slug jose-rodrigues-dos-santos - one error,
  the expected pre-existing "no art: block" (visual-language's, unchanged by
  this stage). Two pre-existing warnings (the completeness-auditor handoff
  word count, the comunicacao 1992 era-coverage gap), both predating this
  stage's edit, both unchanged before and after.
auraDensityResult: "25 -> 16 aura entries; longest dark run still 4 years (2012-2015), unchanged."
forStages:
  reading-orders: >
    Only franchise.yaml's globalEvents block was touched; every other field
    on that file (id, name, kind, description, authorIds, themePreset,
    features, sources) is exactly as franchise-research left it. No orders
    exist yet for this wing (the Noronha series is publisher-numbered and
    already publication-order, per franchise-research's handoff) - nothing
    here changes that.
openQuestions: []
