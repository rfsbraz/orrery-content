stage: press-archaeology
summary: >
  lifeEvents 0 -> 9 (authors/jose-rodrigues-dos-santos.yaml); events.yaml
  created with 5 franchise events. 14 aura entries, none a restatement of a
  works.yaml note. Two reception ruptures anchor the run: historians
  publicly disputing the Auschwitz duology's framing of the gas chambers
  (2020) and the Codex 632/Saga do Lótus historical claims (2023).
  aura_density.py: 34 works, longest dark run 4 years (2012-2015), under
  the 5-year gate. art_rotation.py --check: clean after two organisation
  swaps made during this run (below).
produced:
  authorLifeEvents:
    - jrs-born-1964
    - jrs-father-death-1986
    - jrs-gulf-war-debut-1991
    - jrs-cnn-huambo-1994
    - jrs-cnn-albania-1998
    - jrs-rtp-director-conflict-2004
    - jrs-rtp-disciplinary-cleared-2007
    - jrs-gradiva-to-planeta-2022
    - jrs-sorbonne-thesis-2022
  franchiseEvents:
    - jrs-cronicas-de-guerra-origin-2001
    - jrs-o-ultimo-segredo-church-row-2011
    - jrs-saga-do-lotus-origin-2016
    - jrs-auschwitz-holocaust-framing-2020
    - jrs-colombo-historians-dispute-2023
  correctionsToPriorStages: >
    None to works.yaml. One corroboration: franchise-research's unconfirmed
    Gradiva-bio claim of a second (Paris) doctorate, correctly left out of
    the bio for one source, is now independently confirmed: three outlets
    report a Sorbonne thesis defended 16 Nov 2022, RTP separately reports
    its subject (fascism's Marxist origins) - now sourced as
    jrs-sorbonne-thesis-2022.
  artRotationFixes: >
    Church row moved mosaic -> layered-stack (it and the Auschwitz event,
    both loud, landed in one viewport despite being 9 years apart); the
    2007 RTP-disciplinary event moved beside -> marginalia (broke a
    5-cell mid-weight plateau, 1998-2011). Both still content-fit, not just
    arithmetic: layered-stack still reads as "accumulated press exchange",
    marginalia as the honest weight for a cleared disciplinary process.
rejectedForSourcing:
  - >
    The Sorbonne-thesis disclosure traces to one Instagram post laundered
    through three tabloids citing the same post: kept, but written as a
    self-disclosure and graded low rather than the higher grade its
    "second doctorate" framing might invite from a less careful telling.
  - >
    The 2025 RTP election-night removal / PCP-interview affair (amply
    sourced, including a June 2025 report of the whole Information
    Direction being pushed out over the fallout): rejected on editorial
    grounds, not sourcing - a dispute over his day job with no mark on any
    novel; connecting it to O Protocolo Caos's disinformation theme would
    have been invented, not received.
  - >
    The 2014 Sócrates interview and 2015 Greek-election/Quintanilha
    controversies (both in pt.wikipedia, both cleared by regulators): same
    reasoning - real, well documented, no mark on the fiction.
  - >
    An exact year for the original (Lisbon) doctorate: only found via an
    AI-generated encyclopedia (Grokipedia), not treated as a source here.
    Left undated; the Crónicas de Guerra trilogy is dated by its own
    2001-2002 publication instead.
  - >
    The exact quote behind "career management decision" for the
    Gradiva-to-Planeta move: found only in a search-engine synthesis, never
    in a page this stage actually opened. Held out; the event uses only
    facts confirmed in nit.pt and flash.pt.
whatTheRecordWouldNotGive: >
  The two real gaps were a paywall and a missing snapshot, not language.
  Público paywalls most of its 2001-2011 archive past a short teaser, so
  the 2001 RTP resignation and 2007 dismissal proceeding rest on
  pt.wikipedia alone (the 2001 Público original has no Wayback snapshot,
  checked via the CDX API). A Público subscription could source both
  better.
forStages:
  eras: >
    No new works, subseries or canonTier changes. Two dates worth knowing:
    2001-2002 is a real nonfiction cluster tied to a PhD, and 2022 (Gradiva
    to Planeta) is a real hinge independent of any single work.
  visual-language: >
    Still the only thing standing between this wing and a clean
    validate.py run. This stage's events lean on document/archive imagery
    (artifact-spread, layered-stack) plus one portrait-of-absence; keep
    document textures in mind alongside the newsroom-cipher palette.
  art-rotation: >
    Already self-checked clean (art_rotation.py --check) as of this
    commit. Re-run rather than assume once eras.yaml exists - a
    chapter-gate plate changes the screenful math.
  translation: >
    9 lifeEvents + 5 events, all English-only (no regression - this wing
    had no translated aura before). jrs-saga-do-lotus-origin-2016 keeps its
    Portuguese quote verbatim in the base file (Cervantes/Tordo precedent);
    a pt-PT overlay translates only title/description, never quote.
openQuestions:
  - >
    jrs-auschwitz-holocaust-framing-2020 is the wing's highest-stakes
    entry: a living author's own broadcast remarks on the Holocaust,
    sharply disputed by named historians (NiT, two Sábado pieces read past
    their paywall teasers for direct quotes). Written to state what was
    said and disputed on both sides with no verdict of its own - a curator
    should read it in full before merge given the topic.
