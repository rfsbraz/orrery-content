stage: visual-language
summary: >
  Wrote theme.yaml's `art` block, the only validator error left on this wing.
  Visual law: a newsroom in the hour after the broadcast ends, carried into
  the historical fiction too, because verification (not conspiracy staging)
  is what actually connects Tomás Noronha's cryptology thrillers to the
  Gulbenkian/Macau/Auschwitz/Mozambique historical novels - the author's own
  30-year journalism career is the throughline, per franchise-research's
  scaffold notes.
produced:
  theme: >
    content/franchises/jose-rodrigues-dos-santos/theme.yaml - added `art`
    only (emblem, motifs, atmosphere, lineCharacter, backgroundTexture,
    accentUse, avoid). Removed the stale top-of-file comment claiming `art`
    was "deliberately absent". Palette/preset/displayFace/signature/notes
    untouched.
  emblem: >
    A hand-ruled cipher square on graph paper (rows/columns of single
    letters, one phrase pencilled and corrected once) - sourced to the
    historian-cryptanalyst premise every one of the 14 Noronha novels turns
    on (franchise.yaml's own description) and to the author's real habit of
    re-checking the primary record, the same habit behind the 2023 Columbus/
    fascism-origin dispute in events.yaml. Deliberately a flat square, never
    a wheel or disc, so it cannot read as the shared orrery rings.
  motifs: >
    Telex ribbon, the cipher square recurring at smaller scale, a redacted/
    stamped archive page, an open-reel tape recorder or shortwave dial (the
    correspondent years), a hand-inked great-circle route on a plain world
    map, a control room after the broadcast with one monitor still lit -
    all drawn from works.yaml synopses and the author entity's own bio, none
    from generic thriller marketing.
  distinctness: >
    Checked via theme_digest.py --exclude, then read Chuck Palahniuk, Harlan
    Coben, José Luís Peixoto and Michael Connelly in full (closest by
    displayFace/signature/register). Coben and Peixoto share this wing's
    exact displayFace+signature pair, so the divide is stated in the art
    block's own header comment: neither is anywhere near a newsroom or an
    archive. Palahniuk shares the cold teal-cast near-black register; this
    wing's line breaks from his (his never varies, this one doubles back on
    a verified fact) and its paper is wire-service stock, not his photocopy
    grey. Jo Nesbø's emblem is a numeric ledger; this wing's is a letter
    grid. Connelly's paper is warm sepia manila; this wing's is cold and
    thinner.
validatorResult: >
  python scripts/validate.py --slug jose-rodrigues-dos-santos - zero errors
  (the `no art: block` error is gone). Three pre-existing warnings, all
  documented by earlier stages and none this stage's to fix: two handoff
  word-count warnings (completeness-auditor, reading-orders) and the
  comunicacao (1992) era-coverage gap eras.yaml already flagged as
  intentional. python scripts/asset_audit.py jose-rodrigues-dos-santos
  reports `art:yes` and lists all 16 outstanding jobs (2 era plates, 9 life
  events, 4 franchise events, 1 world event).
forStages:
  art-rotation: >
    No organisation/illustration_type changes needed from this stage; already
    self-checked clean per press-archaeology's handoff. Re-run its own check
    regardless per its own protocol.
  wing-audit: >
    Nothing new to flag - the only prior open item (comunicacao's era-gap
    warning) is unrelated to this stage and already documented as intentional
    in eras.yaml.
  asset-prompt (future, per-asset): >
    Quote the `art` block verbatim in STYLE per VISUAL.md §5. The emblem's
    cipher square is available as the `emblem-seal` asset's subject if one is
    ever scoped; nothing in this wing currently uses that illustration type.
    Remember the orrery rings are decided per-image in the sky or another
    incidental carrier - never the cipher square, never a wheel.
