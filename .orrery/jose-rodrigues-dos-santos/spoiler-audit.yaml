stage: spoiler-audit
summary: >
  Audited every rendered string in the wing against publisher copy fetched
  for 24 titles from the author's own Portuguese AND English synopsis pages.
  3 fixes. 0 spoilerAfter set, 0 loosened - the wing had none and needs
  none. Its only load-bearing spoiler sat in an unrendered `note:`.
produced:
  changedProse:
    - jose-rodrigues-dos-santos/a-filha-do-capitao   # synopsis + note
    - jose-rodrigues-dos-santos/o-anjo-branco        # note only (unrendered)
  changedOrders: [jose-rodrigues-dos-santos/auschwitz-duology-in-order]
  mirrored: "pt-PT orders.yaml overlay, same commit; works.yaml has no overlay yet, so its edits create no locale debt"
  boundariesSet: []
  boundariesLoosened: []
fixed:
  - >
    A Filha do Capitao, synopsis: "a love that survives the war" resolved
    what both jackets leave open - neither goes past the attraction being
    born, and the press quotes the publisher itself prints pull the other
    way. Likely factually wrong as well as unsafe; cut to the jacket's reach.
  - >
    O Anjo Branco, note: "Opens weeks after the death of Luis, the
    protagonist of A Vida num Sopro (2008)". A protagonist's death, on
    neither jacket (checked in Portuguese, the language A Vida num Sopro is
    judged in). It shipped to nobody - the app's `Work` type has no `note`
    field at all, verified - but sat one enrichment pass from a synopsis, on
    the book the wizard offers newcomers. Redacted; continuity kept, and the
    note now disarms the trap without restating it.
  - >
    auschwitz-duology-in-order: "the three converge only at that book's
    close" removed (EN + pt-PT). The convergence is jacket copy; its
    position in the book is not, and gave away the shape of book 1's payoff.
    Replaced with book 1's own jacket wording.
checkedNoChange:
  - >
    Both duologies (the prequel vector): the Auschwitz pair ship the SAME
    jacket synopsis, covering the convergence, the alliance, the
    Sonderkommando uprising and "can magic save them all?" - so neither
    spoils the other and the order's "already allies... organising the
    revolt" is inside the publisher's own copy. Gulbenkian book 1's jacket
    opens on Kaloust dying in a Lisbon hotel, so the order's "his exile and
    death" spoils nothing; public biography anyway.
  - >
    try-o-anjo-branco: after the note fix, nothing rendered anywhere in the
    wing connects O Anjo Branco to A Vida num Sopro. Clean both ways.
  - >
    All 9 lifeEvents and 5 events re-read for fiction leakage: none. The
    Columbus thesis is argued at length on Codex 632's own jacket; the
    saga's fascism thesis is the author's own words in the quoted interview.
    Both included globals are real history.
  - >
    Every other synopsis verified against its own jacket, left alone. The
    reveal-shaped four: O Protocolo Caos (the unmasking as Noronha is the
    jacket's first line), O Ultimo Segredo, A Chave de Salomao, O Jardim dos
    Animais com Alma ("her husband, Tomas Noronha" - jacket on books 11+12).
forStages:
  translation: >
    One rendered string changed (a-filha-do-capitao synopsis); the
    o-anjo-branco note is curator-only, never translated. works.yaml has no
    pt-PT overlay yet, so translating current text inherits the fix free.
    The Auschwitz rationale is already mirrored - do not redo it.
    USEFUL: the author's site has a full Portuguese mirror at
    joserodriguesdossantos.com/portfolio/<pt-slug>/ - right-language copy for
    every synopsis, incl. titles the EN pages omit.
  visual-language: "Nothing is gated, so no shield copy renders here and no art has to hide anything."
  art-rotation: "No entity added, removed or re-organised; the rotation math is untouched."
  wing-audit: "Zero spoilerAfter here is the correct state, not a gap."
validatorResult: >
  validate.py --slug jose-rodrigues-dos-santos, identical before/after: 1
  error, the expected pre-existing "no art: block" (visual-language's), plus
  the pre-existing warnings (handoff word counts, the documented comunicacao
  1992 era-coverage orphan).
i18nResult: >
  i18n_coverage.py - orders.yaml stays fully covered (the rewrite landed in
  both languages together); everything else unchanged from the starting
  point, still the translation stage's to close.
openQuestions:
  - >
    Wizard honesty, not a spoiler: try-o-anjo-branco says "No series to
    commit to" while the book continues the Branco family of A Vida num
    Sopro. Stating that continuity is safe (incidental per the skill), but
    adding it is an editorial call on a pair reading-orders already declined
    an order for. Left to a curator.
  - >
    Loosenable: the Auschwitz rationale's removed timing clause. The order
    argues fine without it, so it went; restoring it costs nothing.
