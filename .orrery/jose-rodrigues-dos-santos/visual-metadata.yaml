stage: visual-metadata
summary: >
  12/34 covers (35%), 1/1 portrait, 0/1 header. Every image URL fetched live
  and looked at, not assumed. The headline finding: Bertrand's own product
  images (`img.bertrand.pt`) carry a "B" logo watermark in the bottom-right
  corner at every size tested (default, 300x, 500x, 1000x, 2000x) - this
  contradicts `scripts/metadata/providers.py`'s Bertrand docstring ("clean,
  unwatermarked covers... no retailer mark anywhere on the image"), which is
  either stale or was never actually corner-checked at the sizes the tool
  builds. 24 of the 25 Bertrand candidates `lookup.py` surfaced were rejected
  on sight of this mark; only Open Library covers made it into the wing, each
  corner-zoomed individually before use. Coverage still lands well above the
  skill's own ~20% ceiling for a Portuguese-market author, because several
  Noronha titles have real jackets on Open Library under English, French,
  Brazilian or Spanish editions that a title-only pt-PT search misses.
produced:
  covers: "12 works.yaml entries got images.cover, all Open Library, all corner-verified"
  gapsDocumented: "22 works.yaml entries got a `# No cover` comment naming what was checked and why it failed"
  portrait: "authors/jose-rodrigues-dos-santos.yaml - Commons, CC BY-SA 3.0"
  header: "franchise.yaml - left empty, comment documents 3 rejected candidates"
coverage:
  covers: "12/34 (35%)"
  portrait: "1/1"
  header: "0/1 (documented gap)"
