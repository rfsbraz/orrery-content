watermarkFinding: >
  Every `img.bertrand.pt` cover fetched (25 of them, across a-formula-de-deus,
  a-mulher-do-dragao-vermelho, a-vida-num-sopro, o-jardim-dos-animais-com-alma,
  sinal-de-vida, o-magico-de-auschwitz, a-mao-do-diabo, o-reino-do-meio,
  o-protocolo-caos, o-codex-632, o-homem-de-constantinopla, a-verdade-da-guerra,
  conversas-de-escritores, novas-conversas-de-escritores,
  um-milionario-em-lisboa, o-segredo-de-espinosa, o-sexto-sentido,
  a-filha-do-capitao, a-amante-do-governador,
  a-ultima-entrevista-de-jose-saramago, vaticanum, cronicas-de-guerra-i/ii,
  imortal) carries a translucent grey-tan "B"-in-a-box logo in the bottom-right
  corner, confirmed by corner-cropping and 3-4x zooming every one, and tested
  at five different `/NNNx` size suffixes to rule out a size-specific artefact.
  This is not visible at the tiny default preview a first glance sees, only on
  close inspection - exactly the kind of mark this skill warns can "pass every
  automated check ever written." Also caught the same way: an OpenLibrary
  cover for sinal-de-vida turned out to be the same WOOK scrape (diagonal
  "wook" watermark) already known to be unusable, laundered through a
  permitted host - the exact trap CURATION §4 names. Two more OpenLibrary
  covers (a-chave-de-salomao, o-ultimo-segredo, and the en-language cover for
  o-codex-632/a-formula-de-deus) turned out on inspection to be scanned title
  pages, not jacket art, and were rejected the same way.
  Flagging for whoever next touches `scripts/metadata/providers.py`: the
  Bertrand class's own docstring claim should be corrected or re-verified: the
  wing this session found does not match it.
gapsDocumented: >
  22 works, each with a `# No cover` comment stating what was checked and why
  it came up empty. Two are worth surfacing directly:
  - o-anjo-branco is one of this wing's 3 featured works and the target of
    the wizard's try-o-anjo-branco startHere path. No Open Library cover
    (single edition, none uploaded), no Bertrand listing under any phrasing
    tried, only a watermarked WOOK jacket. Genuinely absent, not missed.
  - o-pavilhao-purpura: Open Library's only "O Pavilhão Púrpura" match is an
    unrelated 2016 novel by Domingos Amaral - verified by author before
    rejecting, a real same-title collision rather than a lazy guess.
  The other 20 gaps split: several titles are too recent (2022-2025 Planeta
  releases: a-mulher-do-dragao-vermelho, o-sexto-sentido, o-segredo-de-
  espinosa) for an Open Library record to exist yet; the rest have an Open
  Library work record with no cover uploaded, or no record at all, and every
  Bertrand alternative found for them carries the watermark documented above.
  comunicacao (1992, a small publisher, 133 pages) has no record anywhere
  checked - expected for this category per the skill's own carve-out, not a
  search failure.
portrait: >
  File:Rodrigues_Dos_Santos_2014_b.jpg on Commons - Siren-Com's own work, CC
  BY-SA 3.0, 2267x3200 native, shot at a Paris FNAC signing (the file's own
  description gives "16 mai 2004" but the filename and context - the book
  being signed is the 2014 French edition of A Chave de Salomão - point to
  2014; not load-bearing either way for a portrait, so left unresolved rather
  than guessed at). Chosen over two companion shots from the same event: one
  has an "fnac" branded microphone flag in frame, one is shot against a bright
  event-logo wordmark cropping into the subject's head. This one is a clean
  head-and-shoulders portrait on a plain background.
header: >
  Left empty. Three candidates researched and rejected, documented in a
  franchise.yaml comment: RTP's own headquarters (public-domain, self-
  published Commons photo, but the only angle available is a delivery gate
  with a truck in frame, not a newsroom); Macau's Leal Senado square (real
  biographical and Saga do Lótus tie, but every Commons photo is a sunlit
  tourist scene with modern high-rises behind it - and two files nominally
  matching the building's name turned out on inspection to be an unrelated
  statue and a flower macro, a search-relevance false positive worth knowing
  about); the Gulbenkian Foundation's 1969 museum building (clean, quiet, no
  crowd, but postdates Calouste Gulbenkian's own life by 14 years - using it
  as "the world the books live in" would overstate what it actually is).
validatorResult: >
  python scripts/validate.py --slug jose-rodrigues-dos-santos - zero errors,
  the same 3 pre-existing warnings as every prior stage (2 handoff word-count
  soft-caps, the documented comunicacao 1992 era-coverage gap), all predating
  this stage and unchanged by it. 12 unique cover URLs for 12 covered works -
  no duplicates, no franchise image reused across works. All 12 cover URLs
  plus the portrait URL fetched live with `scripts/fetch.py --check`
  (`?default=false` on every OpenLibrary one): 13/13 200, real image bytes,
  not a blank placeholder.
forStages:
  translation: >
    No change to what any prior stage scoped - this stage touched only
    images blocks (works.yaml, franchise.yaml, the author file), never prose.
  wing-audit: >
    Nothing new to flag beyond what's already on record from earlier stages
    (the auschwitz life event's curator-read request, the comunicacao
    era-coverage gap). 35% cover coverage against a ~20% baseline expectation
    is a genuinely strong result for this author, not a number to second-guess.
openQuestions:
  - >
    scripts/metadata/providers.py's Bertrand docstring says its covers are
    "clean, unwatermarked" - this session found a persistent watermark on
    every one fetched, at every size tried. Worth a maintainer looking at
    directly; this run worked around it by hand rather than editing the
    tool.
  - >
    editions (running in parallel on the same base) may independently surface
    ISBNs this stage didn't check against Open Library's ISBN-batch endpoint;
    if it finds pt-PT ISBNs for any of the 22 gapped works, re-running
    `covers.openlibrary.org/b/isbn/<isbn>-L.jpg?default=false` against them
    is cheap and could close a few gaps this title-based sweep couldn't.
