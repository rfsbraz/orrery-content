stage: editions
summary: >
  0 editions to 57, across 26 of 37 works (English UK/US originals plus
  pt-PT translations). lookup.py --markets en,pt swept ~460 candidate rows
  in one call; every ISBN used was then opened individually at its
  publisher, OpenLibrary or a Portuguese retailer, and every check digit
  recomputed by hand. validate.py --slug jk-rowling: 0 errors, 0 new
  warnings. Catalogue-wide: 884 works, 48 authors, 0 errors, the
  pre-existing 41 comment-policy warnings on other wings unchanged.
produced:
  editionCount: 57 (31 en/en-US, 26 pt-PT)
  workCoverage: 26 of 37 works
  notCovered: >
    7 apocrypha/contributor entries (forewords/essays in OTHER authors'
    books - low store-link value, scoped out), 3 Pottermore Presents ebook
    shorts and From the Wizarding Archive (ASIN-only or uncatalogued
    digital releases, no stable ISBN-13 found anywhere).
philosopherSorcererStone: >
  One work, edition-level title variant: UK edition carries no title
  override; US edition carries language en-US and title "...Sorcerer's
  Stone" (9781338878929, Scholastic 2023). Checked all other 36 works
  individually - this is the ONLY US title variant in the bibliography.
cursedChild: >
  The Special Rehearsal Edition Script (2016) and the Definitive
  Collector's Edition (25 Jul 2017) are textually different, not just
  reprints (Wikipedia's "Script publication" section). Recorded: the
  Definitive Edition only, UK (9780751565362, confirmed live/in-print on
  littlebrown.co.uk) and US (9781338216660), both jacketed "...Official
  Playscript of the Original West End Production." The pt-PT translation
  (Sept 2018) postdates the Definitive text by a year, so it's that text.
fantasticBeastsScreenplays: >
  Two collisions, both resolved by reading each edition's own product page,
  not its title string. (1) English AND Portuguese Fantastic Beasts must
  distinguish the 2001 companion book from the 2016 screenplay under
  near-identical bare titles - English used works.yaml's existing id split;
  Portuguese resolved fresh here via Presença's own pages (companion book:
  "Biblioteca de Hogwarts" series, new-preface reissue synopsis; screenplay:
  "HP Guiões e Argumentos" series, screenwriting-debut synopsis) - this
  Portuguese-side collision was not previously flagged. (2) The third
  screenplay is "The Complete Screenplay" (Kloves co-write), never
  "The Original" like the first two - confirmed on UK, US, AND Portuguese
  ("argumento completo e oficial") product pages. No entry blurs the two.
portugueseMarket: >
  Yes, extensively: 26 pt-PT editions across 22 of 37 works, all Editorial
  Presença. Presença relaunched the full septology as "HP Clássicos" in
  October 2024 (sequential ISBNs 9789722375047-108, each confirmed on
  presenca.pt) - used here over any older printing. Cormoran Strike stands
  at 7 of 8 in Portuguese (Hallmarked Man, Sept 2025, not yet translated).
  Every pt-PT ISBN starts 978-972; Brazilian (pt-BR) Rocco/Nova Fronteira
  editions under different titles were found and excluded throughout. One
  trap avoided: some "pt"-market lookup rows were Pottermore ebooks reusing
  a UK 978-178 ISBN block for Portuguese-titled text - not recorded as
  pt-PT given that ambiguity (noted in the file header).
unverified: >
  Ink Black Heart's UK entry is the 2022 hardcover; no UK paperback ISBN
  was confirmed. From the Wizarding Archive has no OpenLibrary record at
  all and was not chased further - start from Pottermore Publishing's own
  catalogue if it ever needs one.
forStages:
  visual-metadata: >
    No coverUrl fields added anywhere in editions.yaml; cover-rights
    judgement on any candidate images the lookup sweep surfaced is your
    stage's call, not this one's.
  wing-audit: >
    26 of 37 works carry an edition; the other 11 are deliberate (7
    apocrypha + 3 Pottermore Presents + 1 Wizarding Archive), reasons in
    the file header. Recompute this fraction if works.yaml grows.
openQuestions:
  - >
    Scoping out the 7 apocrypha entries and the 3 Pottermore Presents/
    Wizarding Archive items is a reasonable, not the only reasonable,
    boundary call on what a completionist store-link layer should cover.
  - >
    format is set only where directly confirmed at the source opened;
    several entries (companion volumes, some Strike novels) omit it for
    that reason, not because no such fact exists.
