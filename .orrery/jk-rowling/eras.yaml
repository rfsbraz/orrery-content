stage: eras
summary: >
  0 eras to 2, covering all 37 works with no orphans and one deliberate
  uncovered stretch (2009-2011, in which she published nothing). Both
  boundaries are sourced; neither is decade-rounded. validate.py green at 78
  warnings, the starting count.
produced:
  - >
    the-harry-potter-years, "The Harry Potter Years", 1997-2008, provenance
    publishing. Every book she published in those eleven years is a Harry
    Potter book, all from Bloomsbury in the UK. Boundaries: Philosopher's
    Stone 26 June 1997, Deathly Hallows 21 July 2007, and the last Potter
    title of all, The Tales of Beedle the Bard, 4 December 2008.
  - >
    the-post-potter-years, "The Post-Potter Years", 2012-present, provenance
    author. Boundary is Rowling's own phrase in the 23 February 2012 Little,
    Brown announcement, "a publishing team that will be a great partner in
    this new phase of my writing life", corroborated by the move away from
    Bloomsbury and by The Casual Vacancy (27 September 2012) being her first
    publication since Harry Potter.
provenance:
  - >
    Strongest citation in the file, and the one everything downstream rests
    on: lagardere.com/en/press-release/little-brown-to-publish-j-k-rowlings-first-novel-for-adults/
    quotes Rowling naming both periods in one statement, the closed one ("the
    Harry Potter series, which has been published so brilliantly by
    Bloomsbury") and the opening one ("this new phase of my writing life").
  - >
    Dates: the Wikipedia articles for Philosopher's Stone, Deathly Hallows,
    Beedle the Bard and The Casual Vacancy, read for publisher and date.
  - >
    "Post-Potter" as received shorthand: time.com/3013543 (21 July 2014) and
    time.com/3924640 (17 June 2015), both using it unintroduced. Two clean
    uses, both from one outlet.
negativeResults:
  - >
    No published periodisation of her career was found. Gale's Children's
    Literature Review entry covers "Rowling's career through 2005" and names
    no phases. Errington's descriptive bibliography (Bloomsbury Academic,
    2015) is exhaustive on editions and silent on periods; its 1997-2013 range
    is coverage, not an argued boundary. Britannica's biography 403s both
    fetchers and was not read. Searched in English only, the language of her
    publication, press and criticism.
rejected:
  - >
    Splitting the Potter run at Goblet of Fire. The "darker from book four"
    reading is a claim about the novels' tone in reviews and fan writing, not
    a career periodisation.
  - >
    A Robert Galbraith era (2013-present). A hard publishing fact and the
    Bachman analogue, but it fails the fit test: it names a strand running
    through these years, not a stretch of them, and would file The Christmas
    Pig, The Ickabog and the Fantastic Beasts screenplays under a crime
    pseudonym.
  - >
    A Wizarding World era (2016-2022). Dated at both ends, but four Strike
    novels publish inside the same window.
  - >
    A boundary at 2019 or 2020. Rests on contested public argument, not the
    publishing record.
forStages:
  press-archaeology: >
    The 2014-2019 dark run sits wholly inside the post-Potter era, so the
    plates neither cover nor disguise it. 2012 and 2013 are now both anchored
    (era plate, existing Galbraith lifeEvent), so the bare years are the
    better spend. Separately: the author bio says "Since 2011 has also
    published adult fiction under her own name"; it is 2012. That file is
    yours this session, so the fix is yours.
  reading-orders: >
    Two eras, so one entry-path hinge: everything before 2009 is Harry Potter,
    everything from 2012 is not. A Galbraith-only reader lands mid-era, not at
    an era start. The 2009-2011 gap is intentional, not a defect.
  wing-audit: >
    The 2009-2011 stretch holds zero works and is deliberate; the eras skill
    supersedes the "era coverage gaps" finding, so do not fill it. Zero works
    sit outside every era.
  translation: >
    eras.yaml joins the pt-PT MISSING list beside the wing's other six files.
openQuestions:
  - >
    Weakest decision: ending era one at 2008 rather than 2007. The received
    phrase points at the seven novels; the extra year keeps Beedle the Bard,
    the 2008 charity prequel and the Anelli foreword inside the period they
    belong to. Cutting at 2007 orphans exactly those three, verified by
    running the validator both ways. Recorded in the era's own note.
  - >
    "The Post-Potter Years" is a received label on an author-sourced boundary,
    the right way round, but both clean uses are from one outlet. A third
    strengthens the label; the boundary does not depend on it.
