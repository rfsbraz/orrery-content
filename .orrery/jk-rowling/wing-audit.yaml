stage: wing-audit
wing: jk-rowling
verdict: ship-after-visual-metadata-redo
summary: >
  Read end to end against the artefacts. Found and fixed 7 defects no stage
  caught; flagged 4 covers and 3 seam issues for their owners. Gates
  re-derived, all unchanged from baseline: validate.py 884 works, 48 authors,
  0 errors, 80 warnings (3 on this wing, all handoff word-cap); i18n_coverage
  129/140, jk-rowling absent from PARTIAL; art_rotation --check organisation
  rotation and pacing both hold; aura_density 0.46/work, 4-yr dark run;
  event_density unchanged.
fixed:
  - >
    "Two adult novels under her own name" was false in 6 places - only The
    Casual Vacancy exists (works.yaml's own section header says "1 novel").
    4 of the 6 are rendered prose: franchise.yaml description and the
    the-complete-shelf path, plus both pt-PT mirrors. Corrected to one, with
    the two header comments (franchise.yaml, works.yaml).
  - >
    eras.yaml the-harry-potter-years claimed "every book she published in
    these eleven years is a Harry Potter book". Three forewords to other
    authors' books (2000, 2002, 2006) sit inside 1997-2008. Reworded to
    "every book of her own", naming the contributor credits; pt-PT mirrored.
    Also drops the "eleven years" arithmetic on a twelve-year span.
  - >
    editions.yaml: 4 Bloomsbury 2014 entries (Chamber, Azkaban, Phoenix,
    Hallows) cited an OpenLibrary URL for a DIFFERENT ISBN. Each entry's own
    ISBN was fetched and confirmed to resolve to the right title; sources
    repointed. The ISBNs were right, the citations were not.
  - >
    editions.yaml header counts: "31 en/en-US" and "26 pt-PT across 22
    works" are 32 across 26 and 25 across 25. Corrected.
  - >
    franchise.yaml comment still said "No editions.yaml, so editions stays
    off"; 57 editions exist and the capability is live.
  - >
    events.yaml header said no layout-grammar fields are set; all four
    entries carry organisation/illustration_type/images_required.
  - >
    pt-PT gender-advocacy entry rendered "sustained public criticism" as
    "críticas públicas sustentadas". In Portuguese that reads as
    well-founded, not persistent - the same false friend the translation
    pass caught and fixed one entry earlier ("prolongado"), missed here, on
    the wing's most sensitive line. Now "continuadas".
flagged:
  visual-metadata: >
    4 of 27 covers carry burned-in marks the contact-sheet pass missed. The
    Casual Vacancy: a library barcode label top-left (the exact defect its
    own note says was rejected and replaced). Troubled Blood: a green
    "BEST SELLER" retail sticker bottom-right. Career of Evil: a
    "Copyrighted Material" watermark, an Amazon Look Inside scrape. The Ink
    Black Heart: a Large Print edition jacket. Re-source these four.
  visual-metadata-resolved: >
    All 4 re-sourced on jk-rowling/followup-covers, each candidate downloaded
    and opened before acceptance (not trusted from URL alone). The Casual
    Vacancy: b/id/10716247, same Sphere 2013 paperback, no barcode. Troubled
    Blood: b/id/12431452, same UK Little, Brown jacket design, no sticker.
    Career of Evil: b/id/11416690, same UK Little, Brown jacket design, no
    watermark. The Ink Black Heart: b/id/14808853, the genuine UK Little,
    Brown hardback (isbn 9780751584202, confirmed via littlebrown.co.uk and
    Hachette Australia) rather than the Large Print jacket - this also
    surfaced that the littlebrown-2022-en edition row's own isbn13
    (9780751584189) resolves to a Sphere paperback SKU, not the hardcover its
    format/note claim; the editions.yaml ISBN itself was left uncorrected
    (out of scope here) and needs an editions-stage look. Also found and
    fixed in passing: fantastic-beasts-the-secrets-of-dumbledore had no
    images.cover and its only derived (ISBN-based) cover was a dead link;
    added a verified cover from the scholastic-2022-us edition row (28 of 37
    works now carry a declared cover). validate.py clean; check-covers 29/29
    live.
  translation: >
    pseudonyms[].note renders (components/about-the-author.tsx:83) and is
    untranslated - 3 notes, the Robert Galbraith one load-bearing. Not
    a wing miss alone: no pt-PT author overlay in the catalogue carries it,
    and i18n_coverage.py's author fields are ["bio"] plus lifeEvents, so it
    reports this wing 100% while a rendered field is English. Same blind
    spot on startHere.paths[].note and orders[].debated - both rendered,
    both translated here anyway.
  spoiler-audit: >
    Order of the Phoenix's synopsis ("refuse to believe Harry's account of
    the previous summer", "a fight the Ministry insists is not coming")
    settles the Goblet of Fire ending that Goblet's own synopsis carefully
    withholds, and says more than Bloomsbury's jacket. Sibling prose,
    ungated by construction; the same standard that rewrote Deathly Hallows.
checkedClean: >
  All 37 works land inside an era; 2009-2011 holds zero, deliberate. format
  set on exactly the 4 works needing it, and rendered (work-card.tsx:116).
  12 spot-checked ISBNs resolve to the correct work. All 18 globals
  accounted for: 11 named, 7 predate her birth. Both curated orders match
  works.yaml's subseries exactly, no drift. theme displayFace/signature both
  implemented. images.cover is consumed (editions.ts:68); header correctly
  omitted. pt-PT clean of Brazilian gerund and vocabulary; spoiler wording
  preserved in every rewritten synopsis. impact:high at 50% is 4th of 21
  wings, high but in range.
openQuestions:
  - >
    27 questions collected from the 11 prior handoffs, each resolved or
    routed in the run report. None vanished silently; the spoiler-audit
    skill-doc one was already fixed in commit 2dfa806.
