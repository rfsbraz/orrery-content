  reading-orders: unchanged, all new works are apocrypha/extended and marginal.
  event-resonance: unchanged from the scaffold.
  spoiler-audit: unaffected, no plot content in the new works.
  visual-language: unaffected.
  editions: >
    One lead: the March 2017 Fantastic Beasts re-edition (new foreword and
    content) is real and sourced, deliberately left for this stage.
  visual-metadata: unaffected.
openQuestions:
