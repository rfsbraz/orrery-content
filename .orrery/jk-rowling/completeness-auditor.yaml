stage: completeness-auditor
summary: >
  Bibliography grows from 30 to 37 works. Added 1 extended work (From the
  Wizarding Archive, 2024) and 6 apocrypha contributor entries (4 forewords
  to other people's books, 2 essays in multi-author collections). No
  existing work's date, tier or credit changed. validate.py green
  catalogue-wide: 884 works, 0 errors, comment-policy warning count on other
  wings unchanged (41, same as the scaffold's baseline).
produced:
  newWorkIds:
    - jk-rowling/from-the-wizarding-archive
    - jk-rowling/families-just-like-us
    - jk-rowling/magic-mcneil-brown
    - jk-rowling/moving-britain-forward
    - jk-rowling/harry-a-history
    - jk-rowling/a-love-letter-to-europe
    - jk-rowling/the-women-who-wouldnt-wheesht
  changedProse: []
