    This pass decided the foreword/anthology scope questions rather than
    escalating, per this session's explicit instruction. SCHEMA.md's own
    caution about bulk contributor entries affecting the derived order
    (canonTier is display-only) still applies; a curator could reasonably
    trim some back out. Sourcing for each is in its own note.
  - >
    Carried forward unchanged: Cursed Child's authorRole reasoning,
    theme.yaml shipped complete, and the domestic-abuse/gender-advocacy
    threads remain named but unasserted. The Women Who Wouldn't Wheesht
