stage: visual-metadata
summary: >
  Portrait sourced (Wikimedia Commons, CC BY 2.0). Header deliberately left
  out: the app dropped franchise.images.header from the wing page the same
  day, so the field renders nowhere - commented rather than populated.
  Covers: 27 of 37 works (73%), all Open Library, all fetched with
  ?default=false and looked at on a contact sheet. 5 initial candidates were
  rejected on sight and replaced from the same work's other editions; 10
  works stay bare, each commented with what was checked. validate.py green,
  scoped and catalogue-wide (884 works, 0 errors, 79 warnings total - this
  wing's 2 are its pre-existing soft-cap notices, unchanged; the other 77
  sit on other wings, also unchanged; this handoff added none once trimmed
  under its own soft cap). lookup.py --check-covers: 27/27 live. 27 unique
  cover URLs for 27 works, no repeats.
produced:
  portrait: >
    jk-rowling.yaml images.portrait: a 2010 White House Easter Egg Roll
    photo, pre-cropped to head-and-shoulders (600x800) by the Commons
    uploader. CC BY 2.0, "Daniel Ogren, CC BY 2.0". Preferred over two 1999
    National Press Club candidates (also genuine, CC BY-SA 2.0) on framing
    and dignity - one shows her mid-toast with a wine glass.
  covers: >
    All 7 novels, all 3 companion volumes, Cursed Child, 1 of 3 Fantastic
    Beasts screenplays (the solo-Rowling one), Casual Vacancy, all 8
    Cormoran Strike novels (the 2023/2025 latecomers only surfaced via
    direct title search, not the bulk author sweep), both children's
    novels, Very Good Lives, and 3 of 7 apocrypha contributions (Magic,
    Moving Britain Forward, Harry, A History - covers of the host books,
    credited to their own primary authors).
rejectedOnSight:
  - "Casual Vacancy: burned-in library discard stamp; replaced."
  - "Goblet of Fire: burned-in retail price sticker; replaced."
  - "The Silkworm: blank proof jacket, no art; replaced with the real one."
  - >
    Troubled Blood: the scan literally reads "COVER TO BE REVEALED", a
    pre-release placeholder; replaced.
  - >
    Very Good Lives: first candidate was "Vidas Muito Boas", the Brazilian
    edition; replaced with an English one.
  - >
    "Short Stories from Hogwarts of Heroism...": the one OL match
    (OL30668340W) has contaminated metadata - its full_title and a sibling
    edition both append an unrelated author (Paul McCusker). Not used.
emptySlots:
  - "2 of 3 Fantastic Beasts screenplays: an OL edition and ISBN exist, no cover was ever uploaded to either."
  - "2 of 3 Pottermore Presents shorts: no OL record under any title tried."
  - "From the Wizarding Archive (2024, audio-first): no OL record."
  - "Families Just Like Us: one OL record, no cover uploaded."
  - "Harry Potter prequel (2008 charity card): no OL record for the anthology."
  - "A Love Letter to Europe, The Women Who Wouldn't Wheesht: no OL record found by title, publisher or looser search."
forStages:
  editions: >
    OL work ids for all 27 covers sit in each coverSource. The Running
    Grave and The Hallmarked Man only surface via direct title search, not
    a bulk author sweep at any limit tried - worth knowing if their ISBNs
    get the same treatment. Both Fantastic Beasts screenplay sequels have a
    real OL edition and ISBN (9781781102343, 9781789391367) despite no
    cover - useful for editions.yaml regardless.
  wing-audit: >
    Portrait live; header intentionally absent (confirmed against the app's
    page.tsx - franchise.images.header is read nowhere after PR #135);
    covers 27/37. Treat both as resolved states, not gaps.
openQuestions:
  - >
    Jack Thorne, John Tiffany, Steve Kloves (collaborator stubs) got no
    portraits - their own files frame them as minimal, and the brief was
    Rowling's own portrait. Addable later without new research.
  - "Magic's cover is genuine but small (159x258, the largest OL holds for it)."
  - >
    Moving Britain Forward's plain type-and-quote jacket looked unusual
    enough to double-check for a scan defect; found none - appears to be
    the real published design.
