openQuestions:
  - >
    The 1993 flight (rowling-flees-marriage-1993) is the only dated entry for
    both the manuscript-smuggling story and the marriage rupture - chose
    immersion (impact:high, the wing's designated rupture device) over
    artifact-spread, and kept the documentary thread inside it via modifier:
    fold-reveal rather than splitting a second organisation onto an undated
    aspect of the same story. Full reasoning in the run report.
  - >
    rowling-gender-advocacy-2025 was judged to warrant the same immersion
    weight as 1993 (impact:high, the single most consequential fact in the
    wing per franchise-research/press-archaeology); given a different
    illustration_type (symbolic-still-life, not portrait-of-absence) and no
    modifier, so it does not read as evidentiary. Full reasoning in the run
    report.
  - >
    beside sits at 25%, below LAYOUT's "around half" target and below the
    ~33-35% three shipped wings (stephen-king, tana-french, john-shirley)
    actually landed at (checked their art_rotation.py output before
    finalising). Deliberate: this wing's press-archaeology pass left an
    unusually dense proportion of high/med-impact lifeEvents, so more events
    earned a distinct organisation on their own fit rather than defaulting.
    Cap was never close (4 of a 12 ceiling).
