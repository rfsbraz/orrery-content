coverage:
  before: "120/140 files (pt-PT); jk-rowling's 9 files entirely missing
    (franchise, works, eras, events, orders, plus authors/jk-rowling.yaml,
    jack-thorne.yaml, john-tiffany.yaml, steve-kloves.yaml)"
  after: "129/140 files (pt-PT); jk-rowling complete on all 9, 0 partial"
