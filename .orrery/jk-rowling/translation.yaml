  Created content/i18n/pt-PT/franchises/jk-rowling/{franchise,eras,events,
  orders,works}.yaml and content/i18n/pt-PT/authors/{jk-rowling,jack-thorne,
  john-tiffany,steve-kloves}.yaml from scratch (no pt-PT overlay existed
  before this stage - this is the wing's first translation pass, so nothing
  to re-sync against a stale prior overlay). Translated the franchise
  description, all 3 startHere paths (title/description/note), both eras
  (title/description/themes), all 4 franchise events, both orders
  (name/rationale/debated), the jk-rowling bio + all 12 lifeEvents (title/
