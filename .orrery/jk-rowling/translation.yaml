title_handling: >
  Never translated a work `title`. A published title cited inside translated
  prose uses the real pt-PT Editorial Presença edition title from
  editions.yaml when one exists (all 7 Potter novels, Cursed Child, both
  companion volumes with a Portuguese edition, all three Fantastic Beasts
  screenplays, Casual Vacancy, all 7 translated Strike novels, both
  children's novels, Very Good Lives). The Hallmarked Man has no pt-PT
  edition yet (confirmed against editions.yaml, which carries only its
  English entries) and stays English wherever cited. The 7 apocrypha
  contributions and the 3 Pottermore Presents shorts likewise have no pt-PT
  edition and stay English. Their host-book titles (Families Just Like Us,
  Magic, Moving Britain Forward, Harry, A History, A Love Letter to Europe,
  The Women Who Wouldn't Wheesht) are the real published English titles of
  those OTHER authors' books, not prose - left untranslated on purpose, per
  the brief. No translated title was invented anywhere; `works.yaml`'s own
  `title` field was never touched.

screenplay_and_edition_distinctions: >
  Fantastic Beasts and Where to Find Them (the 2001 in-universe book) and its
  2016 screenplay are cited with their own distinct Portuguese titles
  ("Monstros Fantásticos e Onde Encontrá-los" for the book, "...: O
  Argumento Original" for the screenplay), matching the split editions.yaml
  already resolved. Secrets of Dumbledore is cited as "Monstros Fantásticos -
  Os Segredos de Dumbledore" - editions.yaml's actual pt-PT title field has
  no "Argumento Completo" suffix (that phrase is descriptive back-cover copy
  on the Presença product page, not the title itself), so the overlay
  matches the title as published rather than inventing a parallel "Argumento
  Completo" naming scheme. Philosopher's/Sorcerer's Stone: the Portuguese
  edition follows the UK original throughout (Presença publishes no
  "Sorcerer's" variant), so no US-title handling was needed on the pt-PT
  side.

apocrypha_host_titles: >
  All 7 foreword/essay entries: translated the synopsis and note-adjacent
  prose describing each host book, left the host book's own title in
  English untouched, per the brief's instruction not to translate a title
  that is another author's actual published book name.

spoiler_preservation: >
  Re-checked every rewritten synopsis against spoiler-audit.yaml's specific
  wording choices before translating, not just against the plain English
  meaning:
  - Prisoner of Azkaban: kept premise-level only (no name, no relationship to
    Harry's parents) - "diz-se que anda atrás de Harry" states pursuit, not
    identity or motive.
  - Deathly Hallows: spoiler-audit changed "Dumbledore left them" to "set
    them" specifically because "left" reads posthumous. Translated as
    "a tarefa que Dumbledore lhes confiou" (entrusted/confided) rather than
    "deixou" (left) or "tinha deixado" (had left) - "confiou" carries no
    death implication in Portuguese, preserving the exact same ambiguity the
    English word swap was built to create.
  - Beedle the Bard: kept the jacket-sourced cross-reference ("já familiar a
    quem leu o último romance de Harry Potter") and continued withholding
    the tale's title, matching spoiler-audit's flaggedItemOne resolution
    exactly - named the fact the jacket makes unavoidable, not the fact
    nothing requires.
  - Crimes of Grindelwald: "escaped" was cut in English because it implies
    the first film's capture ending; the Portuguese synopsis has no
    equivalent word introduced in translation - checked specifically for
    this, since a translator reaching for a natural verb ("teria escapado")
    could reintroduce exactly what was removed.
  - Secrets of Dumbledore: followed the official Warner Bros. line the
    English synopsis was rewritten to (Dumbledore "entrusts" Newt rather
    than any account of why he can't act himself) - translated that
    sentence directly, added nothing.
  - Cursed Child: kept only the premise-required fact (Harry has a son,
    nineteen years later) and none of the additional detail
    (battle/outcome/survivors/child count) the work's own jacket copy adds -
    matches spoiler-audit's cursedChildAndDeathlyHallows ruling, and the
    orders.yaml/startHere prose repeating "assumes you already know how that
    story resolves" was translated to name no outcome either.
  Also spot-checked the 5 curator-only `note:` fields recording what jacket
  copy was checked and what a retail blurb would give away - confirmed these
  render nowhere (validate.py's own finding, carried into this wing's
  eras/works `note:` fields too) and left them untranslated, matching
  works.yaml's stated convention.

sensitive_lifeEvents: >
  rowling-flees-marriage-1993 and rowling-gender-advocacy-2025 translated in
  the same factual, sourced, neither-softened-nor-sensationalized register as
  the English. Specific judgment calls: "disputes that the abuse was
  sustained" rendered as "contesta que o abuso tenha sido prolongado" rather
  than a literal cognate of "sustentado" (which reads in Portuguese as
  financially supported, not temporally prolonged - a false-friend trap
  worth flagging). Every attributed reaction in the gender-advocacy entry
  (Radcliffe's statement via the Trevor Project, the Supreme Court's own
  wording, Rowling's own quotes) is translated as a direct quote in
  quotation marks with the same attribution, adding no characterization the
  English didn't have; "she denies... it has drawn criticism" stays in that
  same both-sides structure. Rowling's own tweet, essay language and the
  2023 "death threats" quote are all translated directly, matching this
  catalogue's dominant practice of translating quotes rather than leaving
  them English (per the lee-child precedent, since stephen-king.yaml's one
  English-verbatim quote is the outlier, not the norm).

character_names_open_question: >
  Character first names (Harry, Ron, Hermione, Dumbledore, Robin, Cormoran
  Strike) are left as in the English source throughout, treated as proper
  nouns, NOT rewritten to the Editorial Presença in-book localizations. This
  is a real gap, not an oversight: European-Portuguese Harry Potter editions
  do localize some character names (most notably Dumbledore's first name,
  "Albus" -> "Alvo," well corroborated), but attempts this session to verify
  others (specifically whether "Ron" is kept as "Ron" or localized to "Rony"
  in the EUROPEAN, not Brazilian, Presença edition) turned up conflicting
  signals - sources that read as Brazilian-Portuguese in register
  ("dublagem" rather than "dobragem") kept surfacing "Rony," while the
  Portuguese Wikipedia's own prose about Ron Weasley uses "Ron" and reserves
  "Ronald Abílio Weasley" explicitly for "a tradução brasileira." Rather than
  translate the one name I could source ("Alvo Dumbledore") and guess at the
  rest, all character first names were left untranslated for consistency and
  flagged here for wing-audit or a native reviewer to settle with a copy of
  the actual Presença edition in hand - "Ron" appears exactly once (Deathly
  Hallows synopsis, and again in the gender-advocacy lifeEvent) and "Albus
  Dumbledore" exactly once (Beedle the Bard synopsis), so the fix if needed
  is small and localized.

register: >
  estar a + infinitive throughout (no Brazilian gerund, checked with a
  targeted grep); ecrã/casa de banho/argumento vocabulary confirmed, no
  "roteiro," "quadrinhos," "ônibus," "celular" anywhere. "Vocês" appears once
  inside a direct quote (Radcliffe's statement) - not a Brazilianism when
  plural, unlike singular "você," which does not appear. "Trouxa" not used
  (no in-story Muggle reference in any translated synopsis); "argumento" used
  consistently for screenplay, matching editions.yaml's own pt-PT title
  fields ("O Argumento Original"). "Espelho de Ojesed" used for the Mirror
  of Erised in the rowling-mother-dies-1990 lifeEvent, the standard published
  Portuguese translation of that wordplay name.

verification: >
  Content-only repo, no app checkout to render from - could not do the
  skill's "read the rendered page" step; flagging the gap rather than
  faking it. Checked instead: validate.py --slug jk-rowling (0 errors, the
  same 2 pre-existing handoff-length warnings from earlier stages, the 5
  comment-policy warnings this stage's own first draft introduced were
  caught by validate.py and rewritten to drop pipeline-stage references
  before this handoff was written); validate.py catalogue-wide (884 works,
  48 authors, 11 achievements, 0 errors, 41 comment-policy warnings total -
  the same pre-existing count every prior handoff on this wing reports,
  confirming this stage's own first-draft comments, caught and rewritten
  before this handoff, landed net-zero); i18n_coverage.py
  (129/140, was 120/140, 0 regression); a full field-by-field re-read of all
  9 new files against the English base (id preservation, no
  workIds/orderId/fit/dates/impact/sources/quote-on-non-epigraph-events in
  any nested overlay, no translated work `title` anywhere, no `note` field
  translated in works.yaml/eras.yaml); a targeted grep sweep for Brazilian
  vocabulary and gerund constructions across every new file (see register
  above).

gates:
  validate: "green, --slug jk-rowling and catalogue-wide; only pre-existing
    handoff-length warnings from earlier stages remain on this wing"
  i18n_coverage: "129/140 pt-PT (was 120/140); jk-rowling complete, 0
    regression elsewhere"

open_questions_for_curator:
  - >
    Character first-name localization (Ron/Rony above all, possibly others -
    Neville, Draco, Snape, etc. never came up in the translated prose so
    were never checked) is unresolved; see character_names_open_question.
    Low urgency (2 total occurrences across all translated files) but a
    real accuracy gap against a genuine published edition, not a stylistic
    choice.
  - >
    "From the Wizarding Archive" is cited by its English title in
    orders.yaml's cormoran-strike debated block (as one of the works the
    derived default interleaves with the Strike novels) - correctly, since
    it has no Portuguese edition (confirmed against editions.yaml and the
    editions stage's own openQuestions), but worth a second look if a
    Portuguese edition of that 2024 release ever surfaces.
