stage: visual-language
wing: jk-rowling
verdict: kept-with-one-revision
summary: >
  franchise-research's theme.art (ink and paper, not wand-sparkle: cool
  damp-slate near-black, manuscript-paper ink, one aged postbox-red accent,
  fraunces, thread signature) is judged sound against the grown bibliography
  (30 to 37 works), the two eras (eras.yaml) and the four scaffolded
  franchiseEvents (press-archaeology.yaml). Made one addition to the `avoid`
  list closing a VISUAL.md SS3c gap the original block left open; nothing
  else changed. `python scripts/validate.py --slug jk-rowling` clean (0
  errors, the one pre-existing franchise-research word-count warning
  unchanged); full-catalogue validate.py also clean (884 works, 0 errors, 41
  comment-policy warnings unchanged from the completeness-auditor baseline).
  `asset_audit.py jk-rowling` reports art:yes and lists 18 jobs (2 era
  plates, 12 life events, 4 franchise events; the world-event slot already
  has its tint).
judgement:
  fitsAll37Works: >
    Yes, and not by accident. The theme is built on the author's writing
    *process* (cafe table, biro, manuscript paper, postbox, rejection
    letters, a train) rather than on any book's fictional content, so it
    does not have to compromise between four genres' native registers - it
    sits above all of them. Cross-checked against the 7 bibliography
    additions (4 forewords, 2 essays, 1 audio anthology) landing 2000-2024:
    none needs its own visual idiom, all read as another instance of "a
    writer's page," which is exactly what the emblem already licenses.
    Nothing in motifs, atmosphere, lineCharacter, backgroundTexture or
    accentUse names a Harry Potter object, scene or setting - the wing's own
    `avoid` list already forecloses that reading before it can start, for
    the adjacent Fantastic Beasts/Cursed Child material specifically.
  fitsBothEras: >
    Holds. The theme's founding image (exercise book, cafe table, pram) is
    era-one biography used as the wing's origin myth, the same way Stephen
    King's rescued-from-the-trash Carrie pages or Pratchett's forged sword
    are one-time hinge events standing for a whole career, not a claim that
    every later image must recreate that scene. The one soft spot: the
    atmosphere text's "broke, grieving" and its "Edinburgh and Manchester"
    place-names describe era-one circumstances specifically (she was
    neither broke nor obscure by 2012). Read as intended - an aesthetic
    register (grounded, unglamorous, never a "success" postcard) rather
    than a literal claim about her later finances - it still works for
    post-Potter events (the Galbraith unmasking, the gender-advocacy
    lifeEvent, Ickabog's 2020 lockdown release), all of which are quieter,
    consequence-first moments the existing "never a glamorised cosy-author
    scene" avoid clause already steers correctly. Not revised: the
    alternative (softening "broke and grieving" to something vaguer) would
    have cost the block's specificity for a risk that didn't materialise
    against any of the 4 actual scaffolded franchise events or 12 lifeEvents.
  avoidsTheSafeStillLifeTrap: >
    The `motifs` list is action- and place-forward (a rain-streaked window
    with a table seen from outside, a train compartment, a stairwell, a
    typewriter beside rejection letters) rather than a menu of tabletop
    objects, and VISUAL.md SS3a's own worked failure (seven of eleven Mãe
    sketches converging on the same three-quarter tabletop) has an obvious
    escape route here: cafe/street/stairwell/train are all peopled-scene or
    place-portrait compositions by nature, not still-lifes. asset-prompt
    still owns the actual SS4a rotation math per sketch; nothing here forces
    it, but nothing here defaults to it either the way an object-only motif
    list would.
  genericityCheck: >
    Ran `theme_digest.py --exclude jk-rowling`. Two real adjacencies, both
    already reasoned about in the wing's own preamble comment and both hold
    up: displayFace fraunces and signature thread are each already shared
    with 3-4 other wings, and jk-rowling now sits in both groups at once
    (with john-shirley and tana-french specifically). Distinctness survives
    on the fields that actually carry mark-making: lineCharacter (dry,
    scratchy ballpoint vs. Shirley's smeared felt-tip xerox-punk vs.
    French's incised dry-point), backgroundTexture (ruled exercise-book
    paper vs. Shirley's photocopy stock vs. French's soft-cut board), and
    palette (postbox red hue ~5, checked at scaffold time against both
    Shirley's magenta ~330-340 and Lee Child's flare-red ~344; bg cool
    damp-slate hue vs. Shirley's magenta-black and French's peaty green).
    No two of the three converge on the same axis simultaneously.
revision:
  what: >
    Added one clause to the first `avoid` entry (theme.yaml, the
    Harry-Potter-iconography prohibition), naming the wing's two
    highest-impact franchiseEvents by what they actually are - the main
    series finale (a sales/reception fact, 8.3m copies in a day) and the
    Cursed Child premiere (a publishing-status fact, "the eighth story," no
    more novels planned) - and stating plainly that neither is a
    character's visual identity entering culture, so neither earns
    VISUAL.md SS3c's fictional-character allowance.
  why: >
    Before the edit, the block gave two contradictory signals with no
    tiebreaker: an absolute, no-exceptions ban on all Potter iconography,
    sitting inside a house style (SS3c) that explicitly allows a character
    or scene reference for a franchise event "fundamentally about the
    fiction itself." This wing was always going to produce the strongest
    test of that boundary in the whole catalogue - nowhere else is the
    source material this visually saturated - so leaving the tension
    unresolved would have handed art-rotation a live judgement call on the
    two costliest assets in the wing (both "high"/"med" impact) with no
    guidance beyond a blanket rule that a stricter house policy could, in
    principle, override. Resolved it in the wing's favour of restraint by
    checking the actual two candidates against SS3c's own test (a sales
    figure and a publishing-status fact are both named in SS3c itself as
    exactly the kind of industry fact that does NOT qualify) rather than by
    softening the ban in the abstract.
forStages:
  art-rotation: >
    Two things to carry forward. First, the genre-register question is
    settled, not open: draw every work (Strike novels, Casual Vacancy,
    screenplays, Cursed Child, the children's novels) in the same
    ink-and-paper writing-life register as the Potter-era material - do not
    reach for a separate "hardboiled noir" or "literary fiction" treatment
    for the Galbraith/Strike or Casual Vacancy material, the theme was built
    specifically so that split is unnecessary. Second, on SS3c specifically:
    checked all 4 scaffolded franchiseEvents (philosophers-stone-quiet-
    launch-1997, stouffer-lawsuit-thrown-out-2002, deathly-hallows-
    finale-2007, cursed-child-premiere-2016) against the SS3c test and none
    crosses it - all four are industry, legal or publication-status facts,
    none is about a character's own visual identity entering culture. Draw
    the finale as a queue/bookshop-midnight scene and the premiere as a
    marquee/curtain-call scene (theme.yaml's avoid list now says this
    explicitly), not as a staged scene from the books or the play. If a
    later stage adds a franchiseEvent that genuinely is about a piece of
    Potter iconography's own cultural life (the closest real candidate
    would be something like the scar or a specific costume becoming a
    dated-but-enduring pop-culture reference point in its own right, the way
    SS3c's own Cruise-as-Reacher example works), that is the one shape of
    event this wing's avoid list does not foreclose - but it does not exist
    among the events scaffolded so far, so this is a note for vigilance, not
    an instruction to go looking for one.
  editions: unaffected, theme.art carries no bibliographic content.
  visual-metadata: >
    theme.art is complete and unchanged in substance; the wing's first era
    plate (the-harry-potter-years, per VISUAL.md SS7) should be generated
    first to become the anchor image before any life-event or
    franchise-event asset.
openQuestions:
  - >
    The "broke, grieving... Edinburgh and Manchester" atmosphere language is
    era-one-specific on its face; judged above as fine when read as register
    rather than literal biography, and left unedited rather than
    generalised, since no post-2012 event in the current 12 lifeEvents / 4
    franchiseEvents actually strained against it. A future stage hitting a
    counterexample (a lavish, successful-author moment with no grounding
    angle) should revisit this note rather than assume the wording forces a
    glossy treatment - it does not; "never a glamorised cosy-author scene"
    already rules that out separately.
  - >
    The fraunces+thread double-adjacency with john-shirley and tana-french
    is judged safe on lineCharacter/backgroundTexture/palette alone; not
    re-litigated at the preset/palette level since SS3's skill instructions
    reserve those fields to scaffold and this stage does not touch them.
