stage: event-resonance
summary: >
  globalEvents block added to franchise.yaml: one include (covid-19-pandemic-2020),
  ten excludes. The pandemic triggered The Ickabog's online release and donation
  campaign. All other candidates either predate her publishing career, lack evidence
  of reaching the page, or address contexts she did not engage with in the work.
produced:
  globalEventsBlock: >
    Franchise now carries globalEvents/include (1) and globalEvents/exclude (10).
    No inherited markers found; all events were considered de novo.
considered:
  - >
    sept-11-2001 (med): She lived through it and published during the years
    after (books 5-7, 2003-2007). The darkening tone was planned from the
    start; no evidence 9/11 reshaped or reached into the specific anxiety
    texture of these books. Exclude.
  - >
    financial-crisis-2008 (low): Main series complete by 2007. The Casual
    Vacancy (2012) touches on social and class conflict in a small English
    town, but there is no evidence the specific 2008 financial crisis shaped
    or reached into its writing - the social texture predates any direct
    causal link. Exclude.
  - >
    covid-19-pandemic-2020 (high): The Ickabog was released free online during
    the UK lockdown (May 2020) with royalties donated to pandemic-relief
    charities; an explicit and sourced tie at the work level. Include.
  - >
    fantasy-paperback-boom-1965 (med): Born 31 July 1965; event dated 1 October
    1965. She inherited the commercial category this event created, not as
    inheritance of an inherited category but as the normal baseline when she
    started publishing in 1997. Her work does not engage with or reflect on this
    1965 event as something she writes out of. Exclude.
  - >
    carnation-revolution-1974 (med): A decisive cultural event for Portuguese
    literature; she is not Portuguese and the event does not resonate with her
    work. Exclude.
  - >
    chain-bookshop-1982 (low): Industry infrastructure her career benefited
    from; the work does not engage with or reflect the event. Exclude.
  - >
    online-bookselling-1995 (med): Infrastructure (Amazon launch) that affected
    distribution but not the creation or content of her work. Exclude.
  - >
    ebook-and-self-publishing-2007 (med): After the main series ended. Ebooks
    became a distribution channel for her later work, but there is no evidence
    the specific 2007 Kindle launch shaped the creation of her writing. Exclude.
  - >
    prestige-fantasy-adaptation-2011 (low): Game of Thrones launch made fantasy
    culturally prestigious. Her Harry Potter film franchise had already achieved
    this; she did not write differently in response to a 2011 cultural shift.
    Exclude.
  - >
    booktok-2020 (low): Contemporary platform that has exposed her historical
    works to new readers; the event did not shape the creation of those works.
    Exclude.
  - >
    portugal-bailout-2011 (med): She is not Portuguese; this event does not
    resonate with her work. Exclude.
forStages:
