stage: franchise-research
summary: >
  New wing scaffolded from scratch. 30 works (18 core, 9 extended, 1
  apocrypha), 4 global author entities (jk-rowling plus three minimal
  collaborator stubs), a full franchise.yaml and a complete theme.yaml
  including its art block. validate.py is green catalogue-wide: 877 works,
  48 authors, 11 achievements, 0 errors, 0 new warnings (the pre-existing
  41 comment-policy warnings on other wings are unchanged).
produced:
  authors:
    - >
      jk-rowling (bio, identity, pseudonyms - Robert Galbraith, plus the two
      in-story fictional bylines Newt Scamander and Kennilworthy Whisp -
      plus 6 lifeEvents: birth, the 1990 train idea, her mother's death, the
      twelve rejections and Bloomsbury's acceptance, the pen-name origin,
      the 2013 Galbraith unmasking)
    - >
      jack-thorne (minimal collaborator stub, for withAuthorIds on Cursed
      Child only)
    - >
      john-tiffany (minimal collaborator stub, for withAuthorIds on Cursed
      Child only; born left null, sources give only "c. 1971")
    - >
      steve-kloves (minimal collaborator stub, for withAuthorIds on
      Fantastic Beasts - The Secrets of Dumbledore only)
  franchise: >
    jk-rowling/franchise.yaml (identity, description, authorIds,
    themePreset only; no globalEvents, no startHere - those are
    event-resonance's and reading-orders' calls, and an unruled default
    would silently claim things nobody verified)
  works: >
    30 total - 7 main-series novels, 3 in-universe companion volumes
    (Quidditch Through the Ages, Fantastic Beasts and Where to Find Them,
    The Tales of Beedle the Bard), the Cursed Child playscript, 3 Fantastic
    Beasts screenplays, The Casual Vacancy, 8 Cormoran Strike novels as
    Robert Galbraith, 2 standalone children's novels (Ickabog, Christmas
    Pig), 1 nonfiction book, 3 Pottermore Presents ebook shorts, 1 charity
    short-story contribution (apocrypha)
  theme: >
    jk-rowling/theme.yaml written in full, including the art block -
    palette, displayFace, signature, plus the complete art language (an
    "ink and paper, not wand-sparkle" register: cool damp-slate near-black,
    manuscript-paper ink, one aged postbox-red accent, fraunces, thread
    signature). validate.py hard-errors any theme.yaml lacking a complete
    art block, so the choice was either write the whole thing now or leave
    the file out entirely; it is written in full here rather than left out,
    matching how the Anna Sewell and John Shirley wings resolved the same
    fork. Treat it as adoptable as-is or revisable, not as a placeholder.
bibliographyJudgement:
  - >
    Cross-checked Wikipedia's own day-precision "Written works" bibliography
    table (fetched and read directly, not summarised) against the ISFDB
    bibliography (isfdb.org/cgi-bin/ea.cgi, which resolves pseudonymous and
    co-written credits per title) and, for every disputed credit, that
    specific work's own Wikipedia article. All three agree on every title,
    date and credit line used.
  - >
    Robert Galbraith needed no new schema handling, as scoped: pseudonyms
    plus publishedAs, the same shape as Stephen King and Richard Bachman,
    applied to all 8 Cormoran Strike novels.
  - >
    Harry Potter and the Cursed Child - authorRole co-author, withAuthorIds
    jack-thorne and john-tiffany, format play. Sourced and settled, not left
    uncertain: Wikipedia's own summary line states the play is "written by
    Jack Thorne from an original story by Thorne, J. K. Rowling, and John
    Tiffany," and the article's infobox separately credits Thorne for
    "script and story" against Rowling and Tiffany for "story" only.
    Rowling co-originated the story and holds one of its three author
    credits; the produced script's prose is Thorne's alone. A note on the
    work states this plainly rather than defaulting to bare authorIds,
    which would have implied she wrote the text herself.
  - >
    A correction to the request issue's own scoping notes (orrery-content
    issue 83), which describes "the five Fantastic Beasts films," all
    "written by Rowling herself as screenplays." Verified independently
    rather than carried forward: only three Fantastic Beasts films were
    ever made (a planned longer arc was cut short after the second film's
    reception), and only three screenplay books exist to match. The third,
    Fantastic Beasts - The Secrets of Dumbledore, is also not a Rowling
    solo screenplay - Warner Bros. brought on veteran Harry Potter
    screenwriter Steve Kloves as co-writer in late 2019 (Wikipedia's
    production-history section, citing contemporary Warner Bros. press
    coverage), the film's own "Screenplay by" credit names both, and the
    published book is titled "The Complete Screenplay" rather than "The
    Original Screenplay" like the first two, itself a signal of the
    different authorship, corroborated by ISFDB and matching retail
    listings. That work carries authorRole co-author and withAuthorIds
    steve-kloves; the first two screenplays stay solo Rowling credits.
  - >
    The 2001 in-universe book Fantastic Beasts and Where to Find Them and
    the 2016 film screenplay of the same title are two different works
    under two different id slugs - jk-rowling/fantastic-beasts-and-where-to-
    find-them for the book, jk-rowling/fantastic-beasts-and-where-to-find-
    them-original-screenplay for the screenplay. Flagged loudly because
    docs/SCHEMA.md's own worked example for the format field uses the
    shorter, book-matching id for the screenplay. That example predates
    this wing and was written before the naming collision was visible;
    this wing's ids are the ones that avoid it.
  - >
    Quidditch Through the Ages and the 2001 Fantastic Beasts book carry
    publishedAs (Kennilworthy Whisp, Newt Scamander respectively) for their
    in-story fictional bylines - Rowling's name did not appear on the first
    edition of the Fantastic Beasts book at all. Recorded as pseudonym
    entries on her author page too, distinguished in their notes from the
    Galbraith pseudonym as a charity-book device rather than a concealed
    identity.
  - >
    canonTier: the seven novels, Cursed Child, all three Fantastic Beasts
    screenplays, The Casual Vacancy, the eight Strike novels and the two
    standalone children's novels are core - genuine standalone narrative
    works whatever their medium. The three in-universe companion or
    reference volumes, the nonfiction book and the three Pottermore
    Presents shorts are extended. The 2008 charity short story is
    apocrypha (authorRole contributor) - a single 800-word piece in a
    thirteen-author anthology, not a book of her own.
  - >
    Pottermore Presents (Hogwarts - An Incomplete and Unreliable Guide plus
    the two Short Stories from Hogwarts volumes) is tagged as its own
    subseries on ISFDB's own explicit numbered-trio grouping, not an
    invented one - all three published together on 6 September 2016.
rejected:
  - >
    featured started at 4 works (Philosopher's Stone, Deathly Hallows, The
    Casual Vacancy, The Cuckoo's Calling) and validate.py enforces a cap of
    3. Dropped The Casual Vacancy: real as her first adult novel, but The
    Cuckoo's Calling is the sharper hinge, an entire second identity kept
    secret and then unmasked, and the cap forces a choice between the two
    beginnings of her post-Potter writing life.
  - >
    A handful of forewords or introductions to OTHER people's books
    (Families Just Like Us, 2000; Magic, ed. McNeil and Brown, 2002; a
    chapter in Gordon Brown's Moving Britain Forward, 2006; Melissa
    Anelli's Harry, A History, 2008; A Love Letter to Europe, 2016) are not
    included. All are genuinely hers per Wikipedia's own bibliography
    table, but each is a few paragraphs in someone else's book rather than
    a standalone piece, a different shape from every other apocrypha entry
    here.
  - >
    "From the Wizarding Archive - Volumes 1 and 2" (2024), an audio-first
    Wizarding World Digital release compiling earlier web writing, is not
    included - whether it is a discrete bibliographic work or a new
    edition of already-listed material is not settled by the sourcing
    gathered so far.
  - >
    No title anywhere in the 30 was dropped for lack of a source - every
    one resolves against at least two independent sources (Wikipedia's
    bibliography table plus ISFDB, or that specific work's own Wikipedia
    article).
forStages:
  completeness-auditor: >
    30 works scaffolded from Wikipedia's bibliography table plus ISFDB,
    cross-agreeing on every title, date and credit used. Close the three
    items listed under rejected above (the five minor forewords, the 2024
    audio release, and confirm nothing else is missing) and verify short
    fiction or franchise-agnostic anthology pieces this pass did not chase
    down.
  press-archaeology: >
    lifeEvents holds 6 anchors (birth, the 1990 train idea, her mother's
    death, the rejections and acceptance, the pen-name origin, the 2013
    Galbraith unmasking); aura_density.py reports a 6-year dark run,
    2014-2019. Two significant, well-documented threads are deliberately
    not in this entry and need real editorial judgment, not defaulting -
    the domestic abuse she has described from her first marriage
    (Wikipedia's own article covers it, citing her own 2023 Guardian
    interview and a 2020 BBC News piece, so a two-source bar is already
    met, but weighing it against the aura standard of whether it changes
    how a reader reads the work needs more care than this entry gives it)
    and her public advocacy on sex and gender since around 2019-2020, which
    is current, contested, and by a wide margin the single most
    consequential "does this change the reading" question anywhere in this
    wing - it has visibly affected some readers' and some collaborators'
    relationship to the books, which is itself a fact pattern needing real
    judgment, not a data point this scaffold should be asserting on its
    own.
  eras: >
    0 eras. A 28-year career across four genres (children's fantasy, adult
    literary fiction, hardboiled crime under a pseudonym, screenwriting)
    has real periodisation to find; not attempted here.
  reading-orders: >
    0 orders, no startHere. Two structural facts worth carrying forward -
    the Harry Potter novels have one unambiguous publication and in-story
    order with no debate to research, and Cursed Child is universally
    marketed as following Deathly Hallows directly ("the eighth story");
    the Cormoran Strike novels likewise have a single agreed order.
    Entry-path recommendations (where does a new reader start - the
    novels, or is a Galbraith-only reader plausible) are entirely
    unresearched.
  event-resonance: >
    No globalEvents ruling yet. One candidate worth a first look: the 2020
    UK COVID-19 lockdown is directly and explicitly tied to The Ickabog
    (free online release timed to the lockdown, proceeds to
    pandemic-relief charities), a rare case where the connection is
    already sourced in works.yaml's own note rather than needing fresh
    research.
  spoiler-audit: >
    One gate already flagged and worked around - The Tales of Beedle the
    Bard's note references a tale that plays a role late in the main
    series without naming which one or how, because works.yaml entries
    cannot carry spoilerAfter (validate.py says it is "not honoured by the
    app here"). Confirm whether that is the right level of caution or
    whether it should say even less.
  visual-language: >
    theme.yaml already has a complete art block (see produced.theme above)
    - review and either adopt or revise rather than starting from nothing.
  editions: >
    0 editions. Rowling is translated into 84 or more languages per
    Wikipedia; wide open for a Portuguese-market pass in particular.
  visual-metadata: >
    No images anywhere (no author portrait, no franchise header, no work
    covers) - fully open.
openQuestions:
  - >
    Cursed Child's authorRole is set to co-author rather than the schema's
    default author, on the reasoning that "author" would misstate who
    wrote the produced text. If a later read of the schema's intent
    disagrees (for example treating story-originator credit as enough for
    the default author role, with the Thorne-wrote-the-script distinction
    living only in the note), that is a one-line change, not a
    re-research.
  - >
    theme.yaml is written complete in this pass, including its art block,
    rather than left for a later pass to write from scratch - flagged
    because at least one other recent wing build (Harlan Coben) resolved
    the same validate.py fork the opposite way, by leaving theme.yaml out
    entirely and parking a proposed palette in its own openQuestions
    instead. Both satisfy the validator; this wing picked the version that
    ships a reviewable, sourced art language now rather than a proposal.
  - >
    The five minor forewords and the 2024 audio release (see rejected) are
    genuine boundary calls about what counts as part of a completionist
    bibliography, not oversights - a second look could reasonably go
    either way on any of them.
  - >
    The domestic-abuse and gender-advocacy threads flagged under
    press-archaeology above are, by a wide margin, the highest-stakes
    editorial decisions this wing will need. Nothing about either is
    asserted anywhere in this scaffold; they are named here only so the
    next pass knows both exist and neither was overlooked by accident.
