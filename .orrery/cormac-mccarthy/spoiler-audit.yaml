stage: spoiler-audit
summary: >
  Audited every reader-facing surface of the wing against an anonymous-newcomer
  read: all 17 work synopses, both order rationales plus the one debated block,
  the four startHere paths and their notes, the nine franchise events, the eight
  author lifeEvents, and both era descriptions. This wing has no characters.yaml
  and no work connections, so the two densest leak vectors are absent. One
  load-bearing fix landed: the Stella Maris synopsis ended "the ideas and losses
  that will end in her death," which states the outcome The Passenger's opening
  pages are built to disclose and spoils Stella Maris for anyone reading the
  earlier-set companion first (the exact cost reading-orders flagged). Reworded
  to premise level (her genius, diagnosis and losses) with no death outcome, and
  guarded with a non-rendering "#" comment so enrichment does not restore it from
  jacket copy. Everything else checked and left as written, recorded below.
  Note: spoilerAfter is honored only on events, lifeEvents and character
  appearances (SCHEMA "Spoilers"); it does NOTHING on works[].synopsis, so no
  work carries or needs one, and the Passenger/Stella Maris cross-spoiler was
  fixed by rewriting prose, not by a decorative gate.
produced:
  reworded:
    - id: cormac-mccarthy/stella-maris
      field: synopsis
      why: >
        Dropped "that will end in her death." Alicia's death is The Passenger's
        opening/jacket premise (recommended-first book), but stating it on Stella
        Maris's own card leaks the fate for a Stella-Maris-first reader. Rewrite,
        not gate, since synopses have no working boundary.
      new_synopsis: >
        Set a decade before her brother's story, mathematics prodigy Alicia
        Western checks herself into a Wisconsin psychiatric facility in 1972,
        and across dialogue-only sessions with her psychiatrist circles her
        genius, her diagnosis, and the losses she cannot reason her way past.
        McCarthy's last novel, published six weeks after its companion.
  gated: []   # no event/lifeEvent/character-appearance needed a spoilerAfter
  checked_no_change:
    - "The Passenger synopsis: 'sister's death a decade before' is the novel's
       own opening image and jacket premise (a hunter finds Alicia's body); it
       is the recommended-first book, so this is legitimate premise, not a gate
       target. Left as is."
    - "Passenger/Stella Maris order rationale: names a cost ('a sibling whose
       fate The Passenger's opening pages are built to disclose') without naming
       the fate. Premise-level, kept."
    - "Border Trilogy order rationale: 'puts both men on the same New Mexico
       ranch' discloses the two protagonists recur and converge, but that is the
       trilogy's marketed premise (omnibus jacket). Incidental, kept."
    - "startHere: try-the-road states no ending; the-masterpiece (Blood Meridian)
       names extremity not the kid/judge fate; all four paths premise-only. Kept."
    - "events.yaml (9): all reception/adaptation/awards facts, no plot reveals;
       every spoilerAfter correctly null. No event lands a death or outcome
       inside a novel's frame. Kept."
    - "author lifeEvents (8): biography, no plot; nulls correct. eras.yaml:
       setting/period summaries, no resolutions. Kept."
forStages:
  translation: >
    The Stella Maris synopsis was reworded; the new English string is above and
    in works.yaml. There is still NO content/i18n/pt-PT/franchises/cormac-mccarthy
    directory (confirmed absent), so nothing to mirror this pass, but when a
    translation pass runs here it must render the reworded synopsis (no "ends in
    her death" outcome), never an earlier draft. Copy the prose exactly.
openQuestions:
  - "The Passenger synopsis names the sister's death as premise. Judged safe
     because it is the book's opening image and jacket copy and the recommended-
     first read; a curator wanting maximum shielding could soften it too, at the
     cost of over-gating a book's own opening."
  - "The Border Trilogy rationale discloses both protagonists survive into book
     three. Treated as marketed premise; loosenable was never the issue, but a
     curator could argue the survival of John Grady and Billy is a mild leak."
