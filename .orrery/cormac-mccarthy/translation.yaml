stage: translation
summary: >
  Built the pt-PT overlay for this wing from scratch (previously absent
  entirely): content/i18n/pt-PT/authors/cormac-mccarthy.yaml and five files
  under content/i18n/pt-PT/franchises/cormac-mccarthy/ (franchise, works,
  eras, events, orders). i18n_coverage.py moved cormac-mccarthy off the
  MISSING list entirely; pt-PT now reports 102/110 files fully covered, up
  from a baseline where this wing contributed all 6 of its files to the
  missing count and 0 to covered. No other locale's numbers changed.
  Translated: the author bio and all 7 lifeEvents, the franchise description
  and all 4 startHere paths (title/description/note), both eras
  (title/description/themes), all 9 franchise events, both orders
  (name/rationale, plus the one debated entry), and all 17 work synopses.
  validate.py --slug cormac-mccarthy is clean bar the pre-existing missing
  theme.art (visual-language's scope, untouched here). Every nested id
  (lifeEvents, startHere paths, eras, events, orders, works) was diffed
  programmatically against the base files and matches exactly, so nothing
  merges as a silent no-op.
produced:
  filesAdded:
    - content/i18n/pt-PT/authors/cormac-mccarthy.yaml
    - content/i18n/pt-PT/franchises/cormac-mccarthy/franchise.yaml
    - content/i18n/pt-PT/franchises/cormac-mccarthy/works.yaml
    - content/i18n/pt-PT/franchises/cormac-mccarthy/eras.yaml
    - content/i18n/pt-PT/franchises/cormac-mccarthy/events.yaml
    - content/i18n/pt-PT/franchises/cormac-mccarthy/orders.yaml
  workTitles:
    ptTitled: >
      13 works carry their published Relógio D'Água title (Paulo Faria) as
      the inline [[work:id|display]] text everywhere they are linked: O
      Guarda do Pomar, Nas Trevas Exteriores, Filho de Deus, Suttree,
      Meridiano de Sangue, Belos Cavalos, A Travessia, Cidades da Planície,
      Este País Não É para Velhos, A Estrada, O Passageiro, Stella Maris, O
      Conselheiro. Each was checked against editions.yaml before use, not
      assumed from memory.
    keptEnglish: >
      The Stonemason, The Gardener's Son, The Sunset Limited and The Kekulé
      Problem have no pt-PT edition in editions.yaml, so their titles stay
      English everywhere, including in the header comments that record why.
  spoilerHandling: >
    Translated the CURRENT, already-reworded Stella Maris synopsis verbatim
    in sense: genius, diagnosis and the losses she cannot reason past, with
    no death outcome anywhere in the Portuguese text. Added a file-header
    comment in works.yaml (pt-PT) restating why the clause is absent, so a
    future translator does not fold a fuller draft back in from jacket copy.
  registerNotes: >
    European Portuguese throughout (a/o Tennessee, ficção, não-ficção,
    inconsciente, decénio-era diacritics checked); no progressive-gerund
    Brazilianisms, no lexical ones (ecrã, argumento not roteiro,
    autocarro-class terms did not arise). "Sudoeste"/"oeste" kept lowercase
    as a common geographic noun, matching the tana-french wing's "oeste da
    irlanda" precedent, not a proper-name capitalisation.
forStages:
  wing-audit: >
    Coverage is now full for this wing specifically; the two PARTIAL/MISSING
    lists left in the pt-PT report belong entirely to other wings
    (agatha-christie, robert-jordan, stephen-king, terry-pratchett events and
    author files) and predate this pass. No render-check.mjs sweep was run
    (no app checkout available from this content-repo session); the id-match
    diff against every base file is the verification performed here, per
    CURATION §5's artefact standard, and a live pt-PT page read is still
    worth doing before this wing is called fully audited.
openQuestions:
  - "The Sunset Limited's subtitle, 'A Novel in Dramatic Form', is quoted
     untranslated inside the pt-PT synopsis rather than glossed, since it is
     the work's own published subtitle (edition data, not free prose) and no
     Portuguese edition exists to source a translated form from. A curator
     preferring a bracketed gloss for a Portuguese reader could add one
     without it being a translated title."
  - "'O Período do Oeste' (era 2 title) is a translation choice for
     'The Western Period' rather than a cognate: pt-PT has no single settled
     term for the US literary/geographic 'Western' register the way it does
     for 'faroeste' as a film genre. A native reviewer weighing 'oeste' vs.
     a genre-flavoured alternative is the kind of close call this pass
     surfaces rather than resolves unilaterally."
