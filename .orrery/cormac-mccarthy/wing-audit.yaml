stage: wing-audit
summary: >
  Audited the whole wing against the artefact, not the reports. validate.py
  --slug cormac-mccarthy GREEN (0 errors, 0 warnings this wing). One trivial
  fix committed (7246de4): theme.yaml header still called the file "a stub"
  with art "unset by design" after visual-language populated the full art
  block. Covers, ISBNs, eras, globalEvents, pt-PT parity and the spoiler
  reword all re-derived and hold. Wing is the DENSEST in the catalogue
  (1.12 aura/work, highest of 15), so it is not thin; the one real soft spot
  is a self-contradicting hand-added event.

baseline:
  validate: "GREEN, 624 works, all references resolve"
  aura: "19 aura / 17 works = 1.12 (catalogue-high); longest dark run 6y 1970-1975"
  isbns: "lookup.py --verify-isbns: 29 editions, 0 suspect (re-run here)"
  globals: "17 global ids in franchise block all resolve to global.yaml; 1 include + 16 exclude = every global explicitly ruled, none left to default"

findings:
  blocking: []
  coherence:
    - id: atph-film-2000-contradicts-own-comment
      severity: med
      owner: press-archaeology
      detail: >
        events.yaml header (lines 5-9) states the 2000 All the Pretty Horses
        film was "considered and left out ... industry trivia rather than
        aura", yet the orchestrator later added event
        all-the-pretty-horses-film-2000. Comment and data now contradict.
        The event's own rationale ("an early marker for how hard McCarthy's
        prose is to film") is the thinnest of the five hand-adds and it is
        what tips this wing to catalogue-highest density. Resolve one way:
        drop the event (as the comment argues) or delete the comment. A
        curator/press call, not mine to silently ratify.
  soft:
    - id: cities-of-the-plain-event-thin
      severity: low
      owner: press-archaeology
      detail: >
        cities-of-the-plain-completes-trilogy-1998 records what closed (the
        trilogy) with no external reception fact (no sales/award/review),
        unlike the-crossing-1994 (a real NYT bestseller). Defensible as a
        structural milestone; a curator could downgrade or cut.
    - id: passenger-cover-low-res
      severity: low
      owner: visual-metadata
      detail: >
        the-passenger cover (OL id 12968819) is 147x218px, vs ~330x500 for
        the other covers. Correct book, clean, no watermark - just low-res.
        A higher-res edition scan would render better.

  checked_clean:
    - "Aura 26/28->19 is NOT events removed: press counts predate
       event-resonance narrowing globals from ~15 to 1. 18 wing + 1 = 19."
    - "1970-1975 dark run RULED honest: pre-fame obscurity, only Child of God
       (1973, sold poorly, no award). Do not force a fill; optional low
       Child-of-God-reception event is the sole candidate, absence no defect."
    - "Eras: both parse, all 17 works in a span (0 orphans), 1980-1984 gap
       holds no work, boundaries real, rejected late period sound."
    - "theme: fraunces + rule in the app's validated sets; palette distinct
       from peixoto/king; one accent/face/signature."
    - "Covers: 3 eyeballed (Blood Meridian, ATPH, Passenger) - right books, no
       watermark; ATPH is the clean English NBA edition."
    - "Spoiler reword holds base AND pt-PT (no death on Stella Maris either
       side; Passenger names it only as its own opening premise)."
    - "pt-PT European register; all 11 events + 7 life events + 17 synopses
       id-match base; 4 no-edition works kept English."
    - "No em dashes, no AI attribution, no jargon in prose; comments green."

collated_curator_decisions:
  - "Subseries name: 'The Passenger' (== its first work) vs 'The Passenger
     Series' (English Wikipedia label); renaming kills the title collision."
  - "Sunset Limited / Stonemason tier: extended vs core (the 'Novel in
     Dramatic Form' subtitle argues Sunset Limited up)."
  - "featured cap at 3: no room for Suttree or the Passenger pair."
  - "1970-1975 aura: ruled honest; optional Child of God 1973 event only if
     a curator judges it clears the bar."
  - "atph-film-2000 event vs its excluding comment (findings) - needs a call."
  - "Typewriter (Olivetti Lettera 32, ~1963-2009) as a distinct lifeEvent
     alongside 1984 SFI: real, sourced, undecided."
  - "kudzu/Southern-gothic clause on theme avoid list: keep or drop."
  - "pt-PT calls: 'O Período do Oeste' for Western Period; 'A Novel in
     Dramatic Form' quoted untranslated."
  - "achievements absent: legitimate; 2 eras + Border Trilogy order could
     support badges if wanted."

not_applicable:
  - "the-kekule-problem no cover/edition: a magazine essay, never a book."
  - "no characters/connections: no figure crosses subseries; complete."
  - "3 works no pt-PT edition: no Relogio D'Agua title exists; English kept."

caveats:
  - "No app checkout here, so the 'field the app never reads' grep
     (images.cover etc.) was not run. Wing uses only fields live on other
     wings, so risk low but unverified from here."
