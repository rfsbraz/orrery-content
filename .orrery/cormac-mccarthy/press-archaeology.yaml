  biocorrection: >
    The author bio said McCarthy's Santa Fe Institute affiliation began "from
    2014." Two independent SFI-authored pieces (a 2022 friendship retrospective
    by former Miller Scholar Laurence Gonzales, and SFI's own 2023
    in-memoriam) both date it to 1984, when Murray Gell-Mann, met at their
    shared 1981 MacArthur ceremony, co-founded the Institute and brought
    McCarthy in at the start. Corrected in the bio prose and given its own
    dated lifeEvent.
britt_ruling: >
  Declined, not shipped. The 2024 Vanity Fair profile's claim that earns this
  a slot under CURATION's aura standard - a relationship beginning when Britt
  was 16 and McCarthy in his 40s - rests on one source: her own account as
  told to one journalist. Every other outlet found (Daily Beast, Slate, AOL,
  Yahoo, assorted Substacks) reacts to or repeats that same profile rather
  than independently confirming the age or the nature of the relationship.
  Two genuinely independent records exist and were checked directly: the
  Wittliff Collections' own finding aid names Britt as a correspondent in
  McCarthy's papers, and a 2026 Cormac McCarthy Journal piece (Stacey Peebles,
  "On Augusta Britt") examines his correspondence with Guy Davenport and
  Robert Coles that references her. Both corroborate that she was real and
  significant to him; neither corroborates the specific claim that would
  justify the entry. One source, however credible, is not two (CURATION.md
  §6), and distress is not content. A short, sourced note recording this
  reasoning (not the claim itself) sits above lifeEvents in the author file.
forStages:
