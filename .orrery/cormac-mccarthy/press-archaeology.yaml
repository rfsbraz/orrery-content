    the-road-oprah-pulitzer-2007 states McCarthy dedicated the novel to his
    son and calls it a love story for him; this is biographical, not plot,
    and carries no spoilerAfter. No new event references a work's ending or
    twist.
  translation: >
    11 new lifeEvents/events plus the bio's corrected SFI sentence are
    untranslated English prose on a wing with no i18n files yet (pre-existing
    baseline, not a regression from this pass).
  event-resonance: >
    the-road-oprah-pulitzer-2007 and no-country-best-picture-2008 both touch
    2007-2008 screen/media culture and could plausibly pull in a relevant
    global.yaml entry if one exists for that window; not checked here since
    this stage writes wing-scoped events only.
openQuestions:
  - "New dark run, not yet researched: 1975-1980 (6 years), surfaced only
    after the deeper 1983-1994 and 1966-1973 runs were fixed. This is the
    stretch after Suttree's drafting and before the 1981 MacArthur; Suttree
    itself (published 1979 after a gestation of roughly two decades) is an
    unpromoted candidate the franchise-research handoff already named. Worth
    a dedicated look before assuming the years are genuinely quiet; not
    chased further this pass to avoid forcing thin material past the
    3-8-facts guidance, already exceeded (11 facts added, all load-bearing)."
