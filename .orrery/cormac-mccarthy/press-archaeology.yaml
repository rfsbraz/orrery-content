stage: press-archaeology
summary: >
  0 -> 11 aura entries (6 lifeEvents, 5 franchise events), all newly sourced
  from press, prize, and institutional records read directly. The flagged
  1983-1994 dark run is gone: covered now by the 1984 Santa Fe Institute
  entry, the 1987 Erskine/Fisketjon editor handoff, Blood Meridian's 1985
  reception-reversal, and All the Pretty Horses' 1992 breakthrough. Fixing
  that run exposed two further dark runs the 12-year one had been masking
  (1966-1973, then 2012-2019); both are also closed, by a 1966 marriage/Ibiza
  entry plus a 1969 Guggenheim, and by The Counselor's 2013 reception.
  validate.py --slug cormac-mccarthy is clean bar the pre-existing missing
  theme.art. aura_density.py now reports 26 aura (17 works, 1.53/work) and a
  new longest dark run of 6 years (1975-1980), smaller each time but not
  personally researched this pass; see openQuestions. The Augusta Britt
  matter was investigated and declined; see below.
