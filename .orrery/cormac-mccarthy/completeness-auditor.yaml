stage: completeness-auditor
summary: >
  16 -> 17 works. Added "The Gardener's Son" (1996 screenplay book, extended
  tier), the one real gap the franchise-research handoff flagged. Verified
  every other date and tiering against the Wikipedia bibliography table, each
  work's own dedicated article, and (for the new entry) the Library of
  Congress catalogue record via OpenLibrary. validate.py --slug
  cormac-mccarthy is clean bar the expected missing theme.art.
produced:
  newWorkIds:
    - cormac-mccarthy/the-gardeners-son
  changedDates: []
verified:
  - "All 12 novel years confirmed against the bibliography's Novels table and
    each novel's own first-edition ISBN row: 1965, 1968, 1973, 1979, 1985,
    1992, 1994, 1998, 2005, 2006, 2022 (The Passenger), 2022 (Stella Maris).
    No corrections."
  - "The Stonemason: confirmed 1995, not 1994. Its dedicated Wikipedia page
    says written in the late 1980s, first performed 1995, and is categorized
    '1995 plays'; the bibliography table's ISBN row also reads 1995. No
    source anywhere gives 1994; works.yaml already had this right."
  - "The Sunset Limited 2006, The Counselor 2013, The Kekule Problem 2017:
    each confirmed against its own dedicated Wikipedia article (premiere/
    publication dates) and the bibliography table. No corrections."
  - "Border Trilogy: the bibliography table itself labels the three novels
    'Book 1/2/3 in the Border Trilogy'. Grouping and order hold."
  - "The Passenger/Stella Maris: both dated 2022 on their own articles
    (Oct 25 and Dec 6) and the bibliography table, which groups them under a
    'Passenger Series' header and labels the rows 'Book 1'/'Book 2 in The
    Passenger Series'. The subseries grouping holds. See openQuestions for a
    naming nuance this surfaced."
  - "The 3 rejected screenplays (Cities of the Plain 1978, Whales and Men late
    1980s, No Country for Old Men 1987) and 4 rejected magazine stories: the
    bibliography table itself marks the screenplays '(Unpublished)' with no
    ISBN, and lists the stories in a separate ISBN-less Short fiction table.
    Correctly excluded; no book exists to list."
addedWork:
  id: cormac-mccarthy/the-gardeners-son
  title: "The Gardener's Son"
  published: 1996
  canonTier: extended
  reasoning: >
    Real, purchasable published work in the same class as The Counselor: a
    McCarthy screenplay published as a standalone book. Confirmed on three
    independent records: the dedicated Wikipedia article (Ecco Press, 1996,
    ISBN 0-88001-481-4, written 1976, aired as a PBS teleplay Jan 1977), the
    Cormac_McCarthy_bibliography table (same year/ISBN, filed under
    Screenplays alongside The Counselor), and the Library of Congress
    catalogue record via OpenLibrary (publisher Ecco Press, LCCN 96013611,
    "a screenplay", 93pp). Dated 1996 (book publication), matching how The
    Counselor is dated by its screenplay-book release rather than its film's;
    the 1977 teleplay broadcast is recorded in the synopsis, not as
    `published`. Placed chronologically between The Stonemason (1995) and
    The Sunset Limited (2006) in the derived order; sits between no other
    pair.
forStages:
  visual-language: "the-gardeners-son is new and untouched by theme/art work."
  editions: "the-gardeners-son has no editions.yaml entry yet (ISBN
    0-88001-481-4, Ecco Press 1996, confirmed above)."
  press-archaeology: "no change to lifeEvents scope; the new work does not
    add a life-event candidate beyond what franchise-research already
    named."
openQuestions:
  - "The Passenger Series vs The Passenger: English Wikipedia's own
    bibliography table names the group 'The Passenger Series' (its header
    and both row labels), not 'The Passenger'. franchise-research chose
    'The Passenger' on the strength of Czech and Greek editions that print
    Stella Maris on the book itself as 'The Passenger, 2'; that evidence is
    real but is a different kind of source than the English bibliography's
    own label, and the two disagree on the exact string. Both names are
    defensible; a curator weighing the English-Wikipedia label more heavily
    could rename the subseries to 'The Passenger Series', which would also
    remove the identical-to-a-work-title collision noted in
    franchise-research's handoff. Left unchanged since it is not a factual
    error, only a naming choice."
  - "The Sunset Limited / The Stonemason as extended rather than core:
    unchanged from franchise-research's ruling, still open per its own
    handoff. The Sunset Limited's paperback subtitle 'A Novel in Dramatic
    Form' is confirmed on its own Wikipedia article; Wikipedia's bibliography
    still files it under Plays."
  - "featured cap (Blood Meridian, All the Pretty Horses, The Road) and the
    absence of characters.yaml / globalEvents: both carried over unchanged
    from franchise-research; not re-litigated by this pass."
