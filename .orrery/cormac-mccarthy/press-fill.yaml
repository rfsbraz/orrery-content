stage: press-archaeology-delta
summary: >
  Closed the flagged 1975-1980 dark run (6 years, unresearched) with two
  sourced, dated entries rather than padding. In 1976, midway through
  Suttree's two-decade draft, McCarthy separated from Anne DeLisle and left
  Knoxville for El Paso, Texas, the move that anchors the rest of his life
  and the biographical hinge the eras stage already treats as sourced fact;
  corroborated independently by Wikipedia and the Irish Times obituary, and
  given its own high-impact lifeEvent (it recolors Suttree, written on both
  sides of the move). Suttree's 1979 publication gets its own franchise
  event: Jerome Charyn's New York Times review (read directly, not
  laundered through Wikipedia's citation of it) calling it a doomed
  "Huckleberry Finn," alongside Broyard, Davenport and Foote, and its
  continued failure to outsell 5,000 hardcover copies. A candidate 1976
  Rockefeller/Lyndhurst grant was checked for and not found in the sources
  read; the bio already dates a second Guggenheim to 1976 under the 1969
  entry, so it was not duplicated. The second DeLisle divorce is already
  dated 1981 in the existing lifeEvent, outside this window, so nothing
  there needed changing.
  validate.py --slug cormac-mccarthy is clean bar the pre-existing missing
  theme.art. aura_density.py now reports 28 aura (17 works, 1.65/work), and
  1975-1980 no longer appears as a dark run. Fixing it exposed a second
  6-year run tied with it all along and masked by it: 2014-2019, which
  includes The Kekule Problem's 2017 publication with no aura entry of its
  own. That window was not researched this pass; the scope here was strictly
  the flagged 1975-1980 gap.
produced:
  lifeEventIds:
    - mccarthy-delisle-separation-el-paso-1976
  franchiseEventIds:
    - suttree-reception-1979
forStages:
  translation: >
    Two new entries (one lifeEvent, one franchise event), untranslated
    English prose on a wing with no i18n files yet, consistent with the
    pre-existing baseline.
openQuestions:
  - "New dark run, exposed rather than created by this pass and not
    researched: 2014-2019 (6 years), tied with 1975-1980 all along but
    masked by it since the density script reports only the first max found.
    Falls between The Counselor (2013) and the 2022 Passenger/Stella Maris
    duology, and includes The Kekule Problem's 2017 publication with no
    aura entry. Worth a dedicated press-archaeology-delta pass rather than
    assuming those years are quiet."
