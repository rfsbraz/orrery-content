stage: visual-metadata
summary: >
  covers 16/17. Author portrait and franchise header both filled. Every cover
  resolved via the work's own Open Library work id (Path A), fetched with
  ?default=false and eyeballed in contact sheets, not trusted on HTTP status
  alone. Three of the work's own highest-ranked Open Library covers were
  rejected and swapped for a clean edition of the same work: All the Pretty
  Horses (a Russian Azbuka edition with a Boston Public Library barcode over
  the art), The Orchard Keeper and Suttree/Child of God (torn sticker
  fragments on the used-book scans), and The Crossing (a faded price-sticker
  remnant). The Counselor keeps its movie tie-in cover on purpose: that is
  the book's own published jacket, released alongside the film per the
  synopsis already on file, and it is clean; a UK Picador scan of the same
  screenplay was rejected instead for a library barcode.
