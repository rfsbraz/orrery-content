    theme.art is still bare (validate.py's only remaining error for this
    wing) and is this stage's job, not this one's - covers, portrait and
    header are all in place for it to draw from.
openQuestions:
  - "The Kekulé Problem (cormac-mccarthy/the-kekule-problem) has no cover and
    cannot get one honestly: it was published only inside Nautilus magazine
    (online, then as that issue's print cover story) and has never appeared
    as its own book. No Open Library work record exists for it under either
    title tried, and a sweep of the author's full Open Library bibliography
    (33 works) found nothing else it could be filed under. A curator who
    later decides a magazine-cover image is an acceptable stand-in would be
    making a different call than this stage did; the essay's own single
    published form has no book jacket to license."
  - "The Counselor's cover is a movie-poster-style tie-in jacket (cast
    photography, 'Now a Major Motion Picture' banner). Kept because it is
    the actual, correctly-titled published edition and reads cleanly with no
    watermark, but it is a different visual register from every other cover
    in the wing, which are all photographic or typographic book jackets with
    no film imagery. A curator preferring a text-only alternative would need
    to accept a UK 'Counsellor' spelling variant instead, since every clean
    US-spelled edition on Open Library uses this same movie-tie-in design."
