stage: event-resonance
summary: >
  Ruled globalEvents for McCarthy's wing: one include (lady-chatterley-trial-1960),
  sixteen excludes. McCarthy's work is predominantly historical (Blood Meridian set
  1840s, Border Trilogy 1930s-50s) or philosophical (The Passenger/Stella Maris on
  consciousness, quantum mechanics, language), and most global events either predate
  his career (1965), predate his lifetime (born 1933), or lived-through-but-unwritten
  (WWII, 9/11, financial crisis). Only the Lady Chatterley verdict resonates: it
  established the permissive literary space McCarthy's entire career benefits from,
  opening what novels could describe when his first book landed four years later.
  validate.py --slug cormac-mccarthy is clean except the expected missing theme.art.
produced:
  includes:
    - lady-chatterley-trial-1960  # opened the permissive decades; McCarthy's career begins four years later writing graphic violence and language this verdict made publishable
  excludeCount: 16
  excludes:
    - sept-11-2001               # lived through it; No Country (set 1980) and The Road (post-apocalyptic) don't engage with it
    - financial-crisis-2008      # lived through it; no book answers it
    - covid-19-pandemic-2020     # no evidence his late novels respond to the pandemic
    - world-war-i-1914           # pre-lifetime
    - world-war-ii-1939          # lived through it as a child; no book engages it
    - pulp-magazines-1926        # pre-lifetime
    - penguin-paperback-1935     # pre-career; format distribution, not thematic resonance
    - armed-services-editions-1943  # pre-career
    - fantasy-paperback-boom-1965   # McCarthy didn't write fantasy
    - carnation-revolution-1974     # geographic/cultural specificity; American author
    - chain-bookshop-1982           # distribution infrastructure; no thematic resonance
    - online-bookselling-1995       # distribution infrastructure; no thematic resonance
    - ebook-and-self-publishing-2007 # late-career; didn't affect his writing
    - prestige-fantasy-adaptation-2011 # McCarthy didn't write fantasy
    - booktok-2020                  # late phenomenon; no evidence of influence
    - portugal-bailout-2011         # geographic/cultural specificity; American author
forStages:
  reading-orders: >
    startHere is not yet populated. globalEvents block is now ruled and stable;
    do not clobber it if reading-orders writes franchise.yaml during its own pass.
openQuestions: null
