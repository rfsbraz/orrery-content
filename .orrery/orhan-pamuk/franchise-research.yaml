stage: franchise-research
summary: >
  Scaffolded the Orhan Pamuk wing from scratch: franchise.yaml, works.yaml
  (22 works: 11 core novels, 11 extended), theme.yaml's non-art fields, and
  the orhan-pamuk global author entity. Verified rather than trusted the
  request issue's translator framing: Maureen Freely and Erdağ Göknar are
  not evenly matched "two principal translators" - Freely has translated
  five books, Göknar exactly one (My Name Is Red). Confirmed the İ/I
  dotting trap is real and transcribed every Turkish title
  character-for-character from Turkish-language sources rather than from an
  English secondary source's romanization. validate.py --slug orhan-pamuk is
  clean except for the expected missing theme.art block, which is explicitly
  out of this stage's scope (the error fires because the author entity
  already carries 3 scaffolded lifeEvents - see forStages.visual-language).
