stage: eras
summary: >
  One era ships, and one only: "The Family Sagas" (1982-1983, Cevdet Bey ve
  Oğulları + Sessiz Ev). Of the three-phase shape franchise-research floated,
  only the first third survived. Everything from 1985 on sits outside every
  era; the reasons are in eras.yaml's header. Searched in Turkish (the
  language of his criticism) and English.
verdicts:
  - candidate: early realist/modern period (the two first novels)
    verdict: RECEIVED shape, neutral label ours, rung 2
    boundary: >
      SOURCED. Beyaz Kale (1985) is named as the break by TEİS ("bir geçiş
      eseri", "yazarın ilk postmodern anlatısıdır"), by the Gale Biographical
      Encyclopedia of the Modern Middle East and North Africa ("an important
      turning point ... he broke with the realist tradition"), and by Demir
      ("Postmodernizme Geçiş"). Pamuk dates his own voice to Kara Kitap.
    shipped: true
  - candidate: postmodern period from 1985
    verdict: INVENTED as a period
    why: >
      Start given as 1985 or 1990 depending on source; contents disputed (TEİS
      counts Kar among the postmodern novels, Demir puts Kar in a later
      period); no end, the technique runs to Veba Geceleri (2021). A manner of
      writing, not a span with two ends.
    shipped: false
  - candidate: contemporary-Istanbul / international period from Kar (2002)
    verdict: INVENTED, refuted by the author and the shelf
    why: >
      Pamuk calls Kar "my first and last political novel". The four novels
      after it are a love story, a street vendor's Istanbul, a conte
      philosophique, and a 1901 Ottoman historical novel. The Nobel (2006)
      falls between books and cuts nothing.
    shipped: false
  - candidate: Fethi Demir's five-part classification
    verdict: first period corroborated and shipped; second and third not
    why: >
      The only full periodisation in any source consulted, one scholar's, and
      TEİS reports it as his rather than adopting it. He renamed his own third
      period from "tematik romanlar" to "küresel romanlar" in 2025. A plate
      cannot assert as received a label its only author has revised. Same bar
      the García Márquez file applied to Lukavská.
    shipped: partially
