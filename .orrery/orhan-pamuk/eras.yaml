gates:
  validate: >
    Same single pre-existing error (theme.yaml has no `art:` block). Wing
    warnings 0 -> 22, all era-coverage on works from 1985 on, all expected and
    answered in the file header. Closing them would mean inventing periods.
  i18n_coverage: >
    pt-PT 346/366 files fully covered; the whole wing is still in MISSING and
    has no overlay, so nothing regressed.
filesWritten:
  - content/franchises/orhan-pamuk/eras.yaml
forStages:
  translation: >
    3 translatable fields (title, description, note). "The Family Sagas"
    renders a phrase Pamuk wrote in English; the Turkish quotations inside the
    description are received forms and stay untranslated, glossed as they are.
  visual-language: >
    One era plate, `chapter-gate` / `atmospheric-motif-field` / 1 image. Its
    register is the pre-1985 Nişantaşı apartment world: three generations
    under one roof, an Istanbul family watching the Ottoman century end.
  wing-audit: >
    The 22 era-coverage warnings are not a defect to close; the eras skill
    supersedes the coverage finding and this wing is the case for it.
  achievements: >
    An `era_reader` badge on `the-family-sagas` could count at most 2, below
    the useful threshold. None written.
openQuestions:
  - "Whether a 2-of-24 era earns a full-bleed plate is the one curatorial call. The alternative, eras: [], would under-report a periodisation Turkish criticism does make. Ruling: ship it."
  - "Demir's second and third periods are recoverable if another scholar takes them up. Nothing in Turkish or English currently does."
