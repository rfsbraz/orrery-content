stage: completeness-auditor
summary: >
  Resolved all three items franchise-research flagged, via primary sources
  beyond both Wikipedias (orhanpamuk.net book pages, Yapı Kredi's own
  catalogue and 3 June 2026 press release, NYPL research catalogue,
  Goodreads, secondhand-market cross-checks). Added two works, corrected
  one entry's synopsis/note, removed none. 22 -> 24 works (core 11
  unchanged, extended 11 -> 13). validate.py --slug orhan-pamuk clean
  except the expected missing theme.art block.
counts:
  before: { works: 22, core: 11, extended: 11, apocrypha: 0 }
  after: { works: 24, core: 11, extended: 13, apocrypha: 0 }
threeFlaggedItems:
  - item: "The Secrets of the Black Book"
    finding: >
      Real: "Kara Kitap'ın Sırları" (Yapı Kredi, 2013), a study of writing
      Kara Kitap built from Pamuk's own notebooks/drawings, compiled
      ("hazırlayan") by Darmin Hadzibegovic. Genuinely absent from both
      Wikipedias, not a stage miss; confirmed via orhanpamuk.net (id=106),
      Yapı Kredi's catalogue, kitapi.net (ISBN 9789750826504), two
      secondhand listings. Added as orhan-pamuk/kara-kitabin-sirlari,
      extended/nonfiction. authorRole stays default `author` (Pamuk's own
      archive, not a contribution to someone else's book) - see the
      work's own note for the reasoning.
  - item: "Kelimeler ve Resimler (2026)"
    finding: >
      Not a reader: Yapı Kredi's own press release states Pamuk recounts
      his military service and first-book struggles "for the first time,"
      plus never-before-published photos/drawings. Added as
      orhan-pamuk/kelimeler-ve-resimler, extended/essay-collection. The
      subtitle's "bir hikâye" is not named separately by any source, so
      it stays folded into the one entry rather than split out.
  - item: "Hatıraların Masumiyeti / Manzaradan Parçalar English editions"
    finding: >
      Split result. Hatıraların Masumiyeti DOES have one: "The Innocence
      of Memories" (Faber & Faber, tr. Ekin Oklap), confirmed via NYPL's
      catalogue record plus Goodreads/Amazon - the "Turkish only" read
      came from Goodreads merging both editions under one record whose
      displayed date is the Turkish original. This also fixed a mixup in
      the exclusion list: the "Innocence of Memories" (2015) documentary
      film is correctly excluded, but orhanpamuk.net's listing for that
      title actually describes the companion BOOK, which is this same
      Hatıraların Masumiyeti record. Rewrote its synopsis/note; no date
      change. Manzaradan Parçalar stays Turkish-only, reconfirmed via its
      own Turkish Wikipedia infobox - no English edition found anywhere.
added:
  - {work: orhan-pamuk/kara-kitabin-sirlari, year: 2013, tier: extended, insertsBetween: "Şeylerin Masumiyeti (2012) and Kafamda Bir Tuhaflık (2014)"}
  - {work: orhan-pamuk/kelimeler-ve-resimler, year: 2026, tier: extended, insertsBetween: "new last work, after Uzak Dağlar ve Hatıralar (2022)"}
