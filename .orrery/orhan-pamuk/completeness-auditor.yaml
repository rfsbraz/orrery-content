  catalogue snippets, not just Wikipedia prose - all agree. Ben Bir Ağacım
  stays excluded (orhanpamuk.net confirms pure excerpt selection). The
  Naive and Sentimental Novelist's English-first dating reconfirmed
  against the same Wikipedia table.
openQuestions:
