stage: completeness-auditor
summary: >
  Re-verified all 30 scaffolded works against ISFDB, WorldCat and primary-
  sourced Wikipedia articles: every existing date and credit held, zero
  corrections. Added two works with real sourced content: The Bovadium
  Fragments (2025, world-first publication) and A Secret Vice: Tolkien on
  Invented Languages (2016, extended critical edition with restored
  manuscript material) - wing now 32 works (3/11/18). Corrected the
  Collected Poems (2024) note, which understated its own newness (73/195
  poems previously unpublished, not "largely a re-gathering"). subseries:
  null re-confirmed everywhere. Left unresolved: Songs for the Philologists
  (1936), a real multi-author pamphlet find, scoped as a curator call.
