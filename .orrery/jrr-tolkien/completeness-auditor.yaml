  editions: "Same two works/ISBNs as visual-metadata above."
openQuestions:
  - "Songs for the Philologists (1936): 30-song pamphlet, 13 songs Tolkien's (with E. V. Gordon and Leeds colleagues), first print of those 13 poems later reprinted whole in Collected Poems (2024). Not added - genuine multi-author-anthology scope call, a curator decision. Would be apocrypha/1936/anthology/contributor if added."
  - "The Lord of the Rings 1954 dating: now corroborated by the dedicated LOTR article's Publication History, citing Carpenter's 1977 biography (pp.220-221) for all three UK volume dates. Prior openQuestion resolved."
  - "The Children of Húrin: ISFDB's own title record says 2006; WorldCat (OCLC 78790549) and Wikipedia's Guardian/NYT-sourced publication history both say 2007. Kept 2007 on the two agreeing sources; worth a title-page check."
  - "The Old English Exodus (1981) and Finn and Hengest (1982) rest on the Wikipedia bibliography's own publisher/imprint citation only - not independently checkable against ISFDB (doesn't carry these) or WorldCat (JS-gated search). Uncontested elsewhere, but single-sourced."
  - "The Fall of Númenor (2022) exclusion re-checked: already rests on four independent published reviews agreeing it repackages existing material. Sound, not under-precedented as previously flagged; preserved here in case a curator wants a final look."
  - "The six author-entity stubs all still resolve correctly against the finalized works.yaml. A Secret Vice's editors (Fimi, Higgins) and Bovadium's essayist (Ovenden) are named in-note only, matching the existing one-off-credit convention - no seventh entity needed. Outside this stage's footprint to change; noted for whoever owns author files."
