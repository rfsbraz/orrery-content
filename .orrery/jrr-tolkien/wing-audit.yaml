stage: wing-audit
wing: jrr-tolkien

summary: >
  First end-to-end read of the wing. Five gates re-derived from scratch, not
  inherited: validate 0 errors / 6 warnings, pt-PT 100% on all 11 wing files,
  event density inside budget, aura 30 entries over 32 works (0.94/work, the
  densest multi-work wing in the catalogue), and art rotation re-run BY HAND
  across the true 29-event river, where the reported 0/0 becomes 0 rotation
  problems and 2 pacing problems - the gate only ever saw 17 of the 29. Three
  false facts found in prose that reaches a reader, all in one lifeEvent and
  all mirrored into pt-PT. One rejected edition rests on arithmetic that is
  simply wrong. Five stale counts fixed in place. The wing's own biggest
  structural call is recorded in a field the app has never read.

gates:
  validate:
    command: "python3 scripts/validate.py --slug jrr-tolkien"
    result: "0 errors. 6 warnings: 3 handoff-length (eras 1615w, spoiler-audit 1952w, translation 823w) + 3 works outside every era (2021, 2024, 2025)"
    verdict: >
      Green. The three era warnings are the documented deliberate absence
      (eras.yaml's own header); see notApplicableNotAbsent. Guards falsified
      rather than trusted: a bogus displayFace and a bogus signature both
      fire; moving a work outside every era fires; a bogus globalEvents
      include id does NOT fire (confirmed unvalidated, so all 19 were
      checked by hand instead). Working tree restored and re-validated after
      every test.
  i18n_coverage:
    command: "python3 scripts/i18n_coverage.py"
    result: "pt-PT 166/180 files fully covered; no jrr-tolkien or Tolkien-author file in the PARTIAL list"
    verdict: >
      100% for this wing, re-derived field by field rather than read off the
      script: 32/32 synopses, 4/4 eras (title + description + themes), 1/1
      event, 1/1 order (name + rationale + all four debated entries),
      franchise description + all 5 startHere paths, both authors' bio and
      every lifeEvent (16 + 12), and the 4 collaborator stubs. Zero missing
      slots. The 14 PARTIAL files all belong to other wings and predate this
      branch.
  event_density:
    command: "python3 scripts/event_density.py"
    result: "19 global events, {med 11, low 6, high 2}; high budget 2 used of ~17; no decade over the budget of 3"
    verdict: >
      Inside budget on every axis. The empty pre-1870 decades are Cervantes'
      and Poe's span, not this wing's, and are a world-events question if
      they are anyone's. This wing adds nothing to global.yaml.
  aura_density:
    command: "python3 scripts/aura_density.py jrr-tolkien"
    result: "32 works, 30 aura entries, 0.94 per work, span 1925-2025, longest dark run 14 yrs (1982-1995)"
    verdict: >
      The 30 is TRUE and does include Christopher Tolkien - verified by
      reading aura_density.py's discovery model (it takes franchise.yaml's
      own authorIds, which the event-resonance branch fixed in 9366d4c), not
      by trusting the number. Arithmetic checks out by hand: 16 + 12
      lifeEvents + 1 franchise event + 1 global = 30. Against the catalogue
      this is the densest multi-work wing after cormac-mccarthy and
      cervantes (both tiny shelves): robert-jordan 0.93, agatha-christie
      0.38, stephen-king 0.29, edgar-allan-poe 0.08. The 14-year dark run is
      real and is a finding - see missing.
  art_rotation:
    command: "python3 scripts/art_rotation.py --check jrr-tolkien"
    gate_line_1_organisation: "organisation rotation holds across all 17 events: no organisation over its cap, no neighbour repeats"
    gate_line_2_pacing: "pacing holds: no two loud cells touching or sharing a screenful, no plateau (contour #=#.====#===.#=.=)"
    exit_code: 1
    verdict: >
      READ THE GATE LINES, NOT THE EXIT CODE, AND THEN DO NOT TRUST THE GATE
      LINES EITHER. Two separate things:
      (a) exit code 1 comes from the third, composition axis ("21 asset(s)
      with no issue at all"), which is the documented pre-art state and is
      not this gate;
      (b) both gate lines are computed over 17 events, not 29. The checker
      never sees Christopher Tolkien's 12 lifeEvents (see pipelineFinding).
      Re-derived by hand over the TRUE 29-event merged river using
      art_rotation.py's own CAP_FRACTION, INTENSITY, VIEWPORT_SHARE and
      pacing_problems():
        organisation: 0 problems. artifact-spread 6 (21%), beside 4,
        full-bleed-vista 3, diptych 3, layered-stack 3, immersion 2,
        medallion 2, mosaic 2, interlude 2, marginalia 1, passage 1. Cap is
        9; interlude cap 4, used 2; epigraph 0. No neighbour repeats.
        pacing: 2 problems, contour "#=#.====#=#===.##==.====#===.":
          - christopher-tolkien-raf-service-1943 and
            auden-wilson-reception-split-1956 run back to back, both loud
          - the same pair land within one screenful (1.36 viewports across
            3 cells)
      Both are the single issue art-rotation's own handoff disclosed and
      left unfixed on purpose; the script counts it as two because two
      distinct rules catch it. So the honest number for this wing is
      0 organisation / 2 pacing, not 0/0.

blocking:
  - id: gilson-beaumont-hamel-and-the-wars-first-day
    owner: press-archaeology
    where: "content/authors/jrr-tolkien.yaml, jrr-tolkien-somme-tcbs-deaths-1916; mirrored in content/i18n/pt-PT/authors/jrr-tolkien.yaml"
    checked: >
      Tolkien Gateway (citing John Garth's "Tolkien and the Great War"),
      the 11th Suffolks 1 July 1916 roll at great-war.ccan.co.uk, and King
      Edward's School's own Roll of Honour, against the English Wikipedia
      J. R. R. Tolkien article the entry sources.
    found: >
      Two errors in one sentence. (1) "on the war's first day" - it was the
      first day of the BATTLE OF THE SOMME, 1 July 1916. The war began in
      1914, and the same paragraph opens "Tolkien reached the Somme as a
      signals officer in July 1916", so the sentence contradicts itself two
      lines up. Even the Wikipedia sentence it was drawn from says "the
      first day of the Somme". (2) "at Beaumont Hamel" is single-sourced to
      that same Wikipedia sentence and is contradicted by every dedicated
      source: Gilson was a 2nd Lieutenant in the 11th (Cambridgeshire)
      Battalion, Suffolk Regiment, 101st Brigade, 34th Division, which
      attacked at La Boisselle from Becourt. Beaumont Hamel was a different
      division's sector.
    impact: "A false fact in reader-facing prose, in both locales."
  - id: gb-smith-first-aid-post
    owner: press-archaeology
    where: "same lifeEvent, both locales"
    checked: >
      Tolkien Gateway (sourced to webmatters' Carte de Route), West Bromwich
      Local History Society, Council of Elrond, and the Wikipedia "Great War
      and Middle-earth" article the entry cites.
    found: >
      "Geoffrey Bache Smith was killed later that year when a shell struck a
      first-aid post" is unsupported by anything reachable. The record is
      consistent across sources: Smith was hit by shrapnel from a German
      barrage on 29 November 1916, several miles behind the front line, gas
      gangrene set in, and he died on 3 December. No source places a
      first-aid post in it. press-archaeology deliberately held Smith's
      DEATH DATE out as unverified (correctly - the prose says only "later
      that year") and then shipped an unverified MANNER in the same
      sentence.
    note: >
      Verified as instructed that neither the held-out 3 December date nor
      the Smith last-letter quotation appears anywhere in the wing's prose.
      They do not. Only the manner leaked.
  - id: as-duas-torres-check-digit-is-arithmetically-wrong
    owner: editions
    where: "content/franchises/jrr-tolkien/editions.yaml header, 'WHAT WAS CHECKED AND NOT SHIPPED (pt-PT)'"
    checked: "EAN-13 check digit re-derived for the number as printed."
    found: >
      The file states that the "As Duas Torres" candidate ISBN
      978-972-104-144-8 "FAILS its own check digit (digits 9-7-8-9-7-2-1-0-4-
      1-4-4 sum to 109, which forces a check digit of 1; the number as
      printed ends in 8)". The weighted sum is 102, not 109, and the forced
      check digit is 8 - the number as printed is VALID. The stated ground
      for excluding a pt-PT edition of a core work does not exist. (The
      Fellowship candidate 978-989-777-392-1 is also check-digit valid, but
      its exclusion rests on a real BNP/publish_places conflict, which
      stands.)
    impact: >
      Not reader-facing, but it is a rejection recorded in a content file as
      settled fact, it is false, and it is the reason the wing's only core
      work with any Portuguese edition carries one volume instead of two.
      It also undermines the header's own claim that "every isbn13 below was
      re-derived by hand (EAN-13 check-digit arithmetic)" - that claim is
      true of the 47 shipped ISBNs (all re-verified here, all valid) and
      false of the one rejection.

missing:
  - id: authorRole-is-inverted-on-nine-works
    owner: completeness-auditor
    checked: "docs/SCHEMA.md's own definition, plus how every other wing uses the field (valter-hugo-mae, jo-nesbo, tana-french, edgar-allan-poe, chuck-palahniuk, karin-slaughter)."
    found: >
      SCHEMA is explicit that authorRole says what THIS author (the one in
      authorIds) did to the volume: "the format says what the volume is,
      authorRole says what this author did to it", and "a book where the
      author wrote only an introduction (contributor) or assembled the
      volume (editor)". Every other wing uses it that way. This wing uses it
      to describe CHRISTOPHER's role instead. The result is that nine works
      carry authorRole: editor with authorIds: [jrr-tolkien] - Unfinished
      Tales, The Letters, The Monsters and the Critics, The History of
      Middle-earth, The Children of Hurin, The Story of Kullervo, Beren and
      Luthien, The Fall of Gondolin, The Nature of Middle-earth - which
      states that J. R. R. Tolkien edited books he did not live to see. The
      Collected Poems is the starkest: authorRole: editor, no withAuthorIds
      at all, so the data says Tolkien edited his own collected poems (Scull
      and Hammond did). works.yaml's STRUCTURAL CALL ONE is built entirely
      on the wrong reading, so this is a whole-header question, not nine
      line edits.
    severity: "Not reader-facing today only because the app never reads the field - see pipelineFinding."
  - id: works-header-says-no-other-entry-uses-co-author
    owner: completeness-auditor
    checked: "every authorRole value in works.yaml, plus the 1925 title page itself (the cover image is a scan of it)."
    found: >
      STRUCTURAL CALL ONE states "No other book below carries a comparably
      direct 'co-author' designation from Tolkien himself, so no other entry
      uses this role." Two entries use it: the-silmarillion and
      sir-gawain-and-the-green-knight-middle-english-text (1925, for E. V.
      Gordon). The Silmarillion's own note scopes the claim correctly ("every
      OTHER Christopher Tolkien-edited work"); the header does not, and the
      header is the thing a future agent reads. Separately, the 1925 entry's
      own cover is a title-page scan reading "Edited by J. R. R. Tolkien and
      E. V. Gordon", which argues for editor over co-author on that entry.
  - id: fourteen-year-dark-run-1982-1995
    owner: press-archaeology
    checked: "aura_density.py, then by hand against both authors' lifeEvents and the works published in the window."
    found: >
      No dated aura anywhere between 1981 and 1996, while the wing publishes
      Mr. Bliss (1982), Finn and Hengest (1982), The Monsters and the
      Critics (1983) and the first nine History of Middle-earth volumes. The
      wing QUOTES Christopher's 1983 Book of Lost Tales foreword three times
      (works.yaml's unfinished-tales note, theme.yaml, the 1981 debate event)
      without ever giving it a dated slot. Tested the obvious fix and it is
      the wrong one: re-dating
      christopher-tolkien-completes-history-of-middle-earth-1983 from 1996 to
      1983 makes the run WORSE (25 yrs, 1984-2008). What the window needs is
      its own event, not a moved one.
  - id: finn-and-hengest-and-old-english-exodus-dates
    owner: completeness-auditor
    checked: >
      Tolkien Gateway's dedicated articles (sourced to Hammond and Scull's
      Descriptive Bibliography) - deliberately a source the completeness
      audit did not use, on the two works it flagged as single-sourced.
    found: >
      Both disagree with works.yaml, in the same direction. Finn and Hengest:
      "released 20 January 1983 ... published in 1983 (though dated 1982)";
      works.yaml has 1982. The Old English Exodus: "released 28 January 1982
      ... published in 1982 (though dated 1981)"; works.yaml has 1981. So the
      wing is recording the imprint year where a second source records the
      release year. Neither changes era membership; Finn and Hengest would
      move one slot in the derived default order. This closes
      completeness-auditor's own open question ("not independently checkable")
      - a second source now exists and it dissents.
  - id: christopher-header-count
    owner: press-archaeology
    checked: "counted works.yaml."
    found: >
      christopher-tolkien.yaml's header opens "24 of J. R. R. Tolkien's 28
      catalogued works here reached print only through his 45 years of
      editing". Both numbers are wrong for this wing: it holds 32 works, 22
      of them posthumous, and 13 carry christopher-tolkien in withAuthorIds.
      The real 24 is his lifetime volume count, which is not a statement
      about this wing. Left for the owning stage rather than fixed here
      because choosing the replacement claim is editorial, unlike the five
      arithmetic corrections in mechanicalFixes.
  - id: comment-policy-breaches-the-scanner-cannot-see
    owner: "the stage that wrote each; curator to rule on the last one"
    checked: "read every content comment in the wing against CURATION §2, then read validate.py's PROCESS_COMMENT regex."
    found: >
      Four comments are §2 breaches that the scan misses because none uses a
      listed word:
        - franchise.yaml: "features is left unset here: which capabilities
          this data actually earns is a call that needs the rest of the wing
          (events, spoiler boundaries) to already exist before it can be made
          honestly" - status journaling, and now moot (see checkedClean:
          every capability auto-activates correctly).
        - franchise.yaml: "the widest ... gap the request issue flags in the
          whole catalogue" - "the request issue" is pipeline coordination.
        - works.yaml STRUCTURAL CALL THREE: "though whether that holds is
          worth revisiting once the rest of the wing exists".
        - works.yaml, Songs for the Philologists: "the scope case this
          catalogue treats as a call for a human editor rather than an
          automatic inclusion. Real, and unresolved, not overlooked" -
          addressing the curator without the word, plus status journaling.
      Not fixed here: each needs a replacement sentence, which is a rewrite,
      not a correction.
  - id: bbc-radio-1955-1956
    owner: eras
    checked: "Wikipedia, The Lord of the Rings (1955 radio series), Broadcast history."
    found: >
      eras.yaml/success says "the BBC condensed it into twelve radio episodes
      in 1956". The source says "During 1955 and 1956 ... in twelve
      episodes". Small, reader-facing, and mirrored in pt-PT ("em doze
      episodios radiofonicos em 1956").
  - id: fifteen-year-gestation
    owner: press-archaeology
    checked: "against this wing's own prose."
    found: >
      christopher-tolkien.yaml's first-reader-1930 event calls The Lord of
      the Rings' gestation "fifteen-year"; jrr-tolkien.yaml's writes-lotr-1937
      calls it "Twelve years" in its own title and "across twelve years" in
      its body (1937-1949). One of the two is wrong; they render in the same
      river.
  - id: roverandom-editors-unrecorded
    owner: completeness-auditor
    checked: "eras.yaml against works.yaml."
    found: >
      eras.yaml's the-christopher-tolkien-years note names Roverandom (1998)
      as edited by Christina Scull and Wayne Hammond. works.yaml's roverandom
      entry has no withAuthorIds and no note mentioning either. Minor, but the
      two files disagree about the same book.
  - id: editions-minor
    owner: editions
    found: >
      Three History of Middle-earth entries (vol05, vol06, vol12) carry no
      `year` although Open Library gives one for each. The block's comment
      says "All twelve are HarperCollins' current UK paperback reissue line"
      while vol01 and vol02 are recorded as hardcover, 1991. And Open
      Library's record for 9780261103559 (Finn and Hengest) names the
      publisher as Firebird Distributing, not HarperCollins as recorded.

stale:
  - "franchise-research's open question on the six author-entity stubs is still open, and the wing is now visibly inconsistent about it: Verlyn Flieger and Carl F. Hostetter get entities and withAuthorIds; Christina Scull, Wayne Hammond, E. V. Gordon, Alan Bliss, Joan Turville-Petre, Guy Gavriel Kay, Donald Swann, Dimitra Fimi, Andrew Higgins and Richard Ovenden are named in notes only. completeness-auditor re-confirmed the line holds but explicitly put it 'outside this stage's footprint to change'. Nobody has ruled."
  - "Songs for the Philologists (1936) was raised by completeness-auditor as a curator scope call and never answered. It is still recorded inside works.yaml's header as unresolved, which is where §2 says it must not live."
  - "The Road Goes Ever On is dated 1967 in works.yaml and 1968 by the Tolkien Estate's own timeline (US October 1967 vs UK March 1968). eras raised it, correctly noted it changes no era membership, and left it. Still open; my own attempt at a third source was 403'd."
  - "press-archaeology's open question on Rob Gilson and Christopher Wiseman having neither stubs nor a ruling is still unanswered, and is now load-bearing: the Gilson error above sits in the one lifeEvent that leans on both names."
  - "visual-metadata's open question stands: externalIds.openLibrary is empty on all 32 works, while ~30 verified OL work ids sit in cover-field comments where no script can use them. Re-running this wing means re-doing those searches."
  - "the-bovadium-fragments (2025) has no cover; visual-metadata verified all three OL editions carry no covers field and asked for a re-check 'in a few months'. Correct as of today - re-check before ship if that is much later."
  - "event-resonance's handoff reports 'all 21 global events' and 'exclude: 20 events'. There are 19 and 18. The DATA is right (all 19 ids resolve, every one has an explicit ruling); only the handoff's arithmetic is off."
  - "christopher-tolkien-completes-history-of-middle-earth-1983 carries date: 1996. Ids are permanent so this cannot be renamed, and 1996 is the better anchor (tested). Recording it so the next reader does not read the id as the date - every other event in both author files has a matching id year."
  - "Process debt, not content: .orrery/jrr-tolkien/eras.yaml (1615 words) and spoiler-audit.yaml (1952 words) are both far over the 700-word soft cap, as is translation.yaml (823). spoiler-audit argues its own case for the overrun in its last openQuestion and it is a reasonable case. Flagged, not fixed."

mechanicalFixes:
  - "franchise.yaml header: '3 core, 11 extended, 16 apocrypha' -> '18 apocrypha'. The completeness commit itself says 3/11/18; the header was never updated when two works were added."
  - "franchise.yaml header: 'the other 27 works below' -> 'the other 30 works below' (32 works, 2 named)."
  - "eras.yaml header: 'Twenty of the thirty-two works in this wing were published after Tolkien died' -> 'Twenty-two'. Counted: 22 works published after 1973-09-02."
  - "eras.yaml, the-last-years note: 'almost two thirds of this wing was still to come' -> 'more than two thirds' (22/32 = 69%). Same arithmetic as the line above; fixing four siblings and leaving this one would have been worse."
  - "theme.yaml: '30 works of wildly different publication date' -> '32 works'. Written by visual-language AFTER the work list closed at 32, and contradicted eleven lines later by its own '32 works'."
  - "theme.yaml: '20 of its 32 works reached print only after his 1973 death' -> '22 of its 32'."
  - "All six are statements of fact re-derived from works.yaml, with no editorial judgement inside them. validate.py --slug jrr-tolkien re-run after: 0 errors, same 6 warnings."

checkedClean:
  - "The four spoiler-audit redactions hold in BOTH locales, read from the shipped files rather than from either handoff's quotation of itself: the-adventures-of-tom-bombadil stops at 'the most enigmatic of the figures' / 'a mais enigmatica das figuras'; smith-of-wootton-major stops at 'living an ordinary life as the village smith' / 'vive uma vida comum como o ferreiro da aldeia'; jrr-tolkien/chronological's debated[2] says 'Gondolin's own years run latest of the three' / 'os anos de Gondolin sao os mais tardios das tres' with no Turin death; jrr-tolkien-cbe-death-1973 ends 'the pair whose names he had chosen for the two of them' / 'o par cujos nomes escolhera para os dois'. Nothing loosened, nothing restored."
  - "The sideways-propagation check passes on every mid-pipeline correction. The Frodo cousin/nephew fix (63d976f) landed in franchise.yaml's two-novels path and is mirrored in pt-PT ('a sequela muito maior que o seu primo herda'); works.yaml already said cousin. The Christopher Tolkien authorIds fix (9366d4c) is live and is what makes aura_density's 30 true. All four spoiler rewrites predate the overlay, so translation copied the current English by construction, and I confirmed it did. The ONE case where a fact is out of sync between locales is the Gilson/Smith errors, which are consistently wrong in both - so fixing them requires touching both files in the same commit."
  - "The 1967 co-author letter, the wing's single load-bearing structural source, corroborates independently: J. R. R. Tolkien named Christopher his literary executor and specifically his co-author for the Silmarillion material in 1967. The Silmarillion ruling is sound on its source. What is wrong is how the ruling is encoded (see the authorRole finding), not the ruling."
  - "The History of Middle-earth grouping stress-tested and left standing. It is documented against all three rejected alternatives, and the honest mitigation is already in place: editions.yaml records all twelve volumes individually with 'Volume N of 12' rather than letting volume 1's ISBN stand for the set, and orders.yaml/chronological explicitly excludes HoME with its reason. The 2002 index volume is correctly out of scope in both files. It stays a curator's call, not a defect."
  - "All 47 edition ISBNs re-derived by hand: every check digit valid, zero duplicates, 32/32 works covered. Then resolved every one against openlibrary.org/isbn/<isbn>.json: all 47 return a record, and title, publisher and year match the YAML in every case. Not a single dead or wrong ISBN."
  - "All 31 cover URLs fetched and size-checked; none under 5KB, none erroring. Eight opened and LOOKED AT: the Bodleian header (real photograph, correct building, no watermark), the J. R. R. Tolkien 1925 portrait (clean head-and-shoulders, public domain), The Hobbit (Ballantine authorized edition), The Lord of the Rings (correct book - note it is an angled slipcase product shot rather than a flat cover, see curatorsCall), the 1925 Sir Gawain title page (reads 'Edited by J. R. R. Tolkien and E. V. Gordon', exactly as the comment claims), the History of Middle-earth boxed set, Essays Presented to Charles Williams (Tolkien named on the spine strip), The Battle of Maldon (correct 2023 Grybauskas edition) and The Father Christmas Letters (exact catalogued title, Tolkien's own art). No retailer watermarks, no wrong works."
  - "All 90 non-ISBN source URLs across the wing's seven franchise files and both author files fetched with --check: 90/90 resolve. No dead citations."
  - "globalEvents is doing its job, which nothing validates. All 19 global.yaml events are explicitly ruled on - 1 include, 18 exclude - every id resolves, and none is left to the arithmetic lifetime default. I confirmed the validator is blind here by planting a bogus id and watching it stay silent. The exclusions read correctly against the author, including the two hard ones (WWII, which Tolkien denied on the record, and fantasy-paperback-boom-1965, which his own book caused rather than shaped him)."
  - "eras.yaml is the strongest layer in the wing. All four periods parse; no overlap; every one of the 29 in-span works lands in exactly one era (4/4/2/19, matching the eras handoff exactly); the one gap year (1974) holds no work. The boundaries are named events, not decades in costume - an Oxford chair, a finished typescript, a resignation, a publisher's last book - and three of the four titles are Carpenter's own words with the fourth flagged in its own note as a stand-in. The overlap rule (earlier part keeps the shared years) is stated once and applied uniformly."
  - "theme.yaml, which validate.py opens only for two fields. displayFace: fraunces and signature: beam are both in the app's live registries (I read them out of the failing-case warnings: faces are fraunces/instrument-serif/sourceSerif/spectral, signatures beam/filament/none/rule/thread - both wider than SCHEMA.md's stated set). All five palette keys present. Contrast computed, not eyeballed: ink on bg 13.7:1, muted on surface 4.62:1 - the usual failure point clears AA. The art block is a real design system, not genre costume: one emblem, one line character, one accent rule, and an avoid list that rules out the two obvious reaches (the Ring, the Silmarils) and the two neighbouring wings' territory by name."
  - "Capabilities. franchise.yaml sets no features block, so all four auto-detect. I read lib/content/capabilities.ts rather than assuming: river and companion need timeline.length > 0 (29), wizard needs startHere paths (5), editions needs editions (47). Nothing lights up half-empty; leaving features unset is the right call. Only the COMMENT explaining it is stale."
  - "visual-metadata introduced no drift into works.yaml. Its commit (0a663b4) is 369 insertions and 0 deletions across all five files it touched, and the works.yaml diff contains nothing outside images blocks and their comments. Diffed rather than assumed, per CURATION §5."
  - "The two works the completeness audit added (a-secret-vice, the-bovadium-fragments) are covered by every downstream layer: era (2016 in-span; 2025 documented outside), cover (a-secret-vice yes; bovadium documented absent), edition (both), synopsis, pt-PT synopsis, spoiler ruling (bovadium's 'final explosion' is an overturned redaction with its reason recorded), and both are named in orders.yaml/chronological's exclusion list. No hole with a title."
  - "Achievements: this wing has none, and none of the catalogue's 11 references it. Correct - see notApplicableNotAbsent."
  - "No id was reused or silently repointed: every startHere workIds entry, the order's 7 orderedWorkIds, and every [[work:]]/[[author:]] inline reference resolves to the work it names (spot-checked the two most reusable ids by hand - the two Sir Gawain entries are distinct works with distinct ids, distinct covers and distinct editions, and each is referenced correctly)."

notApplicableNotAbsent:
  - "Three works with no era (The Nature of Middle-earth 2021, The Collected Poems 2024, The Bovadium Fragments 2025). NOT a gap. The Tolkien Estate's timeline stops at 2018 and says why; nobody periodises what has followed. A post-Christopher era would be a coinage. validate.py warns for each and the warning should stay unclosed. Do not tile the gap."
  - "No era before 1925. Carpenter's Parts 2 and 3 are real sourced periods and are omitted because they are EMPTY under publication-year keying, not unsourced. If a pre-1925 work is ever added, Part 3 is the era to add and its citation is already recorded."
  - "Christopher Tolkien has no portrait. Genuinely none exists free-licensed: Wikidata Q82032 has no P18, fr/de Wikipedia infoboxes have none, Commons has none, Openverse has none, and English Wikipedia's own image is explicit non-free fair use. Consistent with his 1975 retreat from public life. Not a search failure."
  - "The Bovadium Fragments has no cover. All three of its Open Library editions carry no covers field at all; it is a June 2025 book. Absent from the record, not from this wing's effort."
  - "pt-PT editions: one, for volume 3 of The Lord of the Rings. Tolkien is an English author; the buyable object for 31 of 32 works IS the English edition. Two Portuguese candidates were checked and held out (one correctly, one on bad arithmetic - see blocking). Wook and Bertrand block automated fetches, so a human with a browser is the honest next step and is recorded as such."
  - "No achievements. Absence is a legitimate state and the right one here: the wing's orders are one chronological route and a derived default, and a franchise_complete badge over 32 works including scholarly Old English editions and a twelve-volume grouped entry would be a badge nobody earns. Generic badges would be worse than none."
  - "pseudonyms: [] on both authors. Neither Tolkien used one. Nothing missing."
  - "subseries: null on all 32 works, set explicitly rather than omitted. Verified there is genuinely no numbered sequence anywhere in the bibliography; the three Great Tales share a retrospective label, not a marketed series."
  - "One franchise event. Deliberate and explained in events.yaml's own header: what would otherwise sit there is carried as sourced notes on the works or as Christopher's lifeEvents. With 28 lifeEvents behind it, the river is not thin."
  - "Zero spoiler boundaries. Deliberate, and I re-derived the reasoning rather than accepting it: the wing's 29 timeline entries are biography, scholarship and publishing history, and not one of them narrates a plot. spoiler-audit's four fixes were all rewrites because three of the four sit on fields that cannot carry a gate, and it falsified that guard on purpose (inserting a spoilerAfter on a work made validate.py hard-error). This is the correct shape, not an audit that did not happen."

pipelineFinding:
  - id: art_rotation-cannot-see-withAuthorIds-only-authors
    detail: >
      Confirmed at the source. wing_assets() discovers authors by walking
      works.yaml's per-work authorIds; Christopher Tolkien appears there only
      under withAuthorIds, so the checker sees 17 of the wing's 29 events and
      computes BOTH gate lines over the wrong river. Here that is the
      difference between the reported 0 pacing problems and the true 2. The
      app renders the other river entirely - it merges every author in
      franchise.yaml's authorIds. aura_density.py already reads
      franchise.yaml's authorIds directly and gets it right, so the fix is to
      teach wing_assets() to do the same. art-rotation found this itself,
      graded by hand around it, and disclosed it; the gap is the tooling's.
      Any wing with a co-author who never appears in a work's authorIds
      (robert-jordan, lee-child are the named precedents) has the same silent
      hole.
  - id: authorRole-and-contributionTitle-are-inert
    detail: >
      Grepped the app for every field this wing leans on. work.images.cover
      is read (lib/content/editions.ts:68, the coverFor fix). author
      images.portrait is read. franchise.startHere, globalEvents, debated,
      theme.displayFace and theme.signature are all read. But authorRole and
      contributionTitle appear NOWHERE in the app - not in components, not in
      lib, and not on the Work interface in lib/content/types.ts. They exist
      only in content YAML, catalogue-wide. This is the images.cover failure
      exactly: this wing's single biggest structural call, STRUCTURAL CALL
      ONE, is a taxonomy of J. R. R. Tolkien / Christopher Tolkien authorship
      expressed entirely in a field no reader will ever see. It also means
      the inversion above harms nobody today and will harm everybody the day
      the field is implemented.
  - id: franchise-images-header-is-inert
    detail: >
      franchise.images.header / headerCredit / headerSource are declared on
      the Franchise interface (lib/content/types.ts:255-264) with a comment
      claiming the field "is declared here and rendered by the franchise
      page". It is not. Grepping app/, components/ and lib/ for any read of
      it returns nothing; the franchise page's header element is typographic
      and uses author portraits. So visual-metadata sourced, licensed and
      credited a Bodleian header for this wing that renders nowhere - and the
      credit is a CC BY licence condition, which makes an unrendered credit
      more than cosmetic. This is app-side and catalogue-wide (15 wings set
      it).
  - id: comment-policy-scan-is-english-only
    detail: >
      validate.py's PROCESS_COMMENT regex is a list of English phrases, so
      every pt-PT overlay comment in the catalogue is unscanned. This wing's
      overlays contain explicit stage narration that would fire instantly in
      English: "foram reescritas pela auditoria de spoilers desta ala"
      (pt-PT works.yaml and authors/jrr-tolkien.yaml) and "dirigida a quem
      cura a ala" (pt-PT eras.yaml). Pre-existing and catalogue-wide - the
      same phrasing appears in hp-lovecraft, edgar-allan-poe,
      miguel-de-cervantes, tana-french, gillian-flynn, harlan-coben,
      joao-tordo and jose-luis-peixoto overlays, and the translation stage
      followed the hp-lovecraft precedent by design. Do not fix this wing
      alone; fix the scan, or rule that overlay comments are out of scope.
    also: >
      Even in English the regex has blind spots this wing exercises: "a call
      for a human editor" (curator without the word), "worth revisiting
      once", "the request issue", "the next real step". See the missing
      entry.
  - id: art_rotation-check-exit-code-conflates-three-axes
    detail: >
      --check returns 1 if ANY of composition, organisation or pacing has a
      problem, and the composition axis is expected to be non-empty before
      art intake ("21 asset(s) with no issue at all"). So the exit code is 1
      on every pre-art wing and carries no information about the two axes
      that are actually this gate. Anyone gating CI on the exit code will
      either block every wing or learn to ignore it.
  - id: schema-doc-drift
    detail: >
      docs/SCHEMA.md lists three display faces (fraunces, spectral,
      sourceSerif) and four signatures; the app implements four faces
      (adding instrument-serif) and five signatures (adding filament). The
      wing-audit SKILL.md repeats SCHEMA's list. Harmless here because both
      chosen values are valid, but the doc is what a stage picks from.

curatorsCall:
  - id: silmarillion-third-vs-first
    detail: >
      the-essentials places The Silmarillion third; jrr-tolkien/chronological
      places it first. reading-orders flagged this as deliberate. Having read
      both as shipped: it is coherent, not incoherent. Each is sourced
      separately, the order's own debated[0] names the-essentials as the
      majority practice and says why, and the two startHere descriptions
      point at different readers in plain language ("most readers who bounce
      off it do so by trying it first" vs "for a completionist or a
      re-reader"). A reader meets one, not both, and the wizard's fit tags
      separate them. Nothing to fix; the tension is documented and reads as
      an argument, not a mistake. Recording the verdict so it is not
      re-opened.
  - id: home-scope
    detail: >
      Whether The History of Middle-earth stays one grouped entry is a real
      call and stays yours. My read: it should stay. It is documented against
      all three options, editions.yaml already gives the twelve volumes their
      individual reality, and the alternative floods a 32-work derived order
      with 12 near-identical 1983-1996 rows. If you take the other view,
      reading-orders is right that jrr-tolkien/chronological has to be
      revisited too.
  - id: songs-for-the-philologists
    detail: >
      Still the wing's one genuinely open scope question, raised twice and
      never ruled: a 1936 privately-printed pamphlet, 13 of its 30 songs
      Tolkien's, all 13 reprinted in the 2024 Collected Poems. Ruling
      either way is fine; leaving it open is not, because the open question
      is currently living inside works.yaml's header where CURATION §2 says
      it must not.
  - id: lotr-cover-is-a-slipcase-product-shot
    detail: >
      The Lord of the Rings' cover is HarperCollins' 2022 deluxe illustrated
      edition photographed at an angle in its slipcase, on white. It is the
      right book and the choice is argued (it presents the novel as ONE
      volume, matching STRUCTURAL CALL TWO). But it is a product photograph,
      not a jacket, and it will sit in a grid of flat covers on the wing's
      most prominent work. That is a design judgement, so per CURATION §5 it
      goes to you with a browser rather than to another agent.
  - id: authorRole-semantics
    detail: >
      The authorRole inversion above is fixable two ways and the choice is
      yours: re-encode this wing to the schema's meaning (which loses the
      per-work Christopher taxonomy, because the schema has no field for a
      collaborator's role), or extend the schema so withAuthorIds entries can
      carry their own role. The second is what this wing actually needs and
      what would make STRUCTURAL CALL ONE expressible. Either way the app
      reads neither field today.
  - id: jrrt-lifeevent-count
    detail: >
      J. R. R. Tolkien carries 16 lifeEvents against CURATION §6's
      "approximately 6-12 across a career", 6 of them high. Christopher's 12
      is in range. Not routed as a defect - the wing is two lives in one
      river and its aura-per-work is the highest of any large wing here, so
      cutting would be a real loss - but if you want the river tighter, the
      candidates are the med-impact biographical run (meets-edith-1909,
      21st-birthday-proposal-1913, marries-edith-1916), which is three
      events on one relationship.
