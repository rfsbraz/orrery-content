stage: eras
summary: >
  Four eras, all sourced, none coined. Three cover Tolkien's own working life
  and take their spans from Humphrey Carpenter's authorised 1977 biography,
  whose part titles print their own date ranges, corroborated by the Tolkien
  Estate's own two-part timeline (which breaks at 1949/1950, exactly where
  Carpenter's "Success" opens). The fourth is a publishing era, not a creative
  one: Christopher Tolkien's forty-five years of editing, 1975-2018, bounded by
  his September 1975 resignation from New College and by The Fall of Gondolin,
  the book the Estate's own timeline ends on and names as his last. Three
  works (2021, 2024, 2025) deliberately sit outside every era.
produced:
  franchiseFiles:
    - content/franchises/jrr-tolkien/eras.yaml
  eraIds:
    - the-hobbit-years
    - success
    - the-last-years
    - the-christopher-tolkien-years
  eras:
    - id: the-hobbit-years
      title: The Hobbit Years
      period: "1925-1949"
      provenance: critical
      verdict: >
        REAL SHAPE, WRONG NAME. The span is Carpenter's Parts 4 and 5
        ("1925-1949 (I)" and "1925-1949 (II)"), rung 2. The label is a neutral
        stand-in: his own two titles for the band are the Hobbit's first
        sentence, which cannot be a heading, and "The third age", which is
        received but names Middle-earth's Third Age to any reader of this wing.
        Boundary verdict: RECEIVED at both ends - 1925 is the Oxford chair,
        1949 is the finished Lord of the Rings typescript, and the Estate's own
        timeline half also ends at 1949.
      works: 4
    - id: success
      title: Success
      period: "1950-1966"
      provenance: critical
      verdict: >
        RECEIVED, rung 2. Carpenter's Part 6 is "1949-1966: Success", his word
        verbatim, attributed in the description rather than asserted. Boundary
        verdict: RECEIVED, with a documented tie-break - 1949 goes to the era
        above (matching the Estate), and the 1959-1966 years Carpenter's Part 7
        also claims are held here.
      works: 4
    - id: the-last-years
      title: The Last Years
      period: "1967-1973"
      provenance: critical
      verdict: >
        RECEIVED label, rung 2 (Carpenter's Part 7, "1959-1973: Last years").
        Boundary verdict: CLOSING DATE RECEIVED (his death, 2 September 1973),
        OPENING DATE OURS. Carpenter opens the part at 1959 on a dated event,
        his retirement from the Merton chair, but those years are claimed by
        Part 6 as well and are held there under this file's uniform
        overlap rule, so the span opens at 1967 instead. This is the ONLY date
        in the file neither source states, and it is flagged in the era's own
        note.
      works: 2
    - id: the-christopher-tolkien-years
      title: The Christopher Tolkien Years
      period: "1975-2018"
      provenance: publishing
      verdict: >
        RECEIVED as a publishing-historical fact, rung 4. Both ends are dated
        events: he resigned his New College fellowship in September 1975 to
        work on nothing but his father's papers (the same year the first
        posthumous volume appeared), and The Fall of Gondolin (2018) is where
        the Estate's own timeline stops, with its own sentence that it was
        "Christopher Tolkien's last publication" and that he "dedicated more
        than forty-five years to studying, editing and publishing his father's
        works". Locus's obituary walks the same sequence independently.
      works: 19
  languagesSearched: >
    English only, correctly - Tolkien is an English author published in
    English, and the authorised biography, the Estate and the obituaries are
    all English-language primary sources.
  sourcesRefused: >
    oxforddnb.com (Shippey's ODNB life of Tolkien, 302 redirect to a paywall)
    and britannica.com (403). The Guardian and Tolkien Society obituaries of
    Christopher Tolkien 404 at their guessed URLs; nytimes.com 403s. None of
    these gaps is load-bearing - the Estate's own timeline and Wikipedia's
    Christopher Tolkien article, itself sourced to Ovenden and McIlwaine's
    "The Great Tales Never End" (Bodleian, 2022, pp. 26-27, "Timeline"),
    carry every claim the fourth era rests on, and Locus corroborates.
forStages:
  event-resonance: >
    The four boundaries you can hang life events on, all dated and all already
    sourced in eras.yaml: the Rawlinson and Bosworth chair at Oxford (elected
    21 July 1925, arriving from Leeds); the finished Lord of the Rings
    typescript (1949) after Allen & Unwin rejected the Silmarillion in
    December 1937 and asked for a Hobbit sequel instead; the valedictory
    address at Merton (5 June 1959) that opens Carpenter's last part; and
    Christopher Tolkien's resignation from New College in September 1975 to
    work exclusively on the papers. Two more that eras.yaml names but does not
    turn on: the 1965 unauthorised American paperback, which is what actually
    made the book a phenomenon, and Edith's death on 29 November 1971. NOTE
    THE AXIS TRAP before you place anything: this wing's era membership is
    computed from PUBLICATION year, and twenty of thirty-two works are
    posthumous, so an event about the composition of the legendarium
    (1916-1917 Gondolin, c. 1914 Kullervo, the 1930s Silmarillion drafts) will
    land nowhere near the work it produced. That is expected and documented in
    eras.yaml's header; do not "fix" it by moving an era.
  reading-orders: >
    Era membership as computed, so a path can be described against it: The
    Hobbit Years (1925-1949) holds the Gawain edition, The Hobbit, On
    Fairy-Stories, Farmer Giles of Ham. Success (1950-1966) holds The
    Homecoming of Beorhtnoth, The Lord of the Rings, The Adventures of Tom
    Bombadil, Tree and Leaf. The Last Years (1967-1973) holds The Road Goes
    Ever On and Smith of Wootton Major - two works only. The Christopher
    Tolkien Years (1975-2018) holds nineteen, i.e. most of the wing, including
    The Silmarillion, Unfinished Tales, The History of Middle-earth and all
    three Great Tales. The Nature of Middle-earth (2021), The Collected Poems
    (2024) and The Bovadium Fragments (2025) have NO era. Practical
    consequence: a naive publication-order walk spends its last two thirds
    inside one era plate, so any curated path that wants to feel shaped has to
    do that work itself - the era spine will not supply it after 1975.
  visual-language: >
    All four plates are `chapter-gate` + `symbolic-still-life`, one image each,
    following the Poe and Lovecraft precedent (keyed type; note that
    `establishing-landscape` is in the opaque set and would file an era plate
    wrong). The fourth era is the one that needs its own visual idea rather
    than a fifth variation on rings and Silmarils: it is about manuscripts,
    a converted barn, half-erased fair copies and a son's handwriting, not
    about Middle-earth.
openQuestions:
  - "The first era's title is the one real editorial call in the file. Carpenter names the 1925-1949 band twice and neither title transplants: 'In a hole in the ground there lived a hobbit' breaks the ENTERING <title> plate grammatically, and 'The third age' is a received term that, on a Middle-earth shelf, would tell almost every reader something false. 'The Hobbit Years' is a flat neutral stand-in over his span. If there is an appetite for the received term with a gloss, this is the place to overrule."
  - "'The Last Years' opens at 1967, not at Carpenter's 1959. Carpenter's Parts 6 and 7 overlap by seven years because he narrates the public career and the private life in parallel; eras cannot overlap here, so one uniform rule (the earlier part keeps the shared years) resolves it, and the Estate's own 1949/1950 timeline break corroborates that rule at the one boundary the Estate speaks to. But it is a rule chosen here, and the alternative cut - Success 1950-1958, The Last Years 1959-1973 - would move The Adventures of Tom Bombadil (1962) and Tree and Leaf (1964) onto the late plate."
  - "Whether the posthumous era belongs in this wing's eras.yaml at all is a genuine question and it was decided yes. It is not a period of Tolkien's creative life - he was dead for all of it - and it is drawn on rung 4 (a fact about the publishing record), not on rung 2. The case for keeping it: nineteen of thirty-two works fall inside it and would otherwise render with no plate, and its span is stated by the Estate rather than assembled here. The case against: a reader may take a plate reading THE CHRISTOPHER TOLKIEN YEARS as a claim that Tolkien had a period called that."
  - "Three works carry no era and validate.py warns for each: The Nature of Middle-earth (2021), The Collected Poems (2024), The Bovadium Fragments (2025). This is deliberate and recorded in eras.yaml's header - the Estate's timeline stops at 2018 and nobody periodises what has come since. A post-Christopher era (2021-) would be a coinage. Do not close this warning by extending the fourth era."
  - "No era is drawn before 1925. Carpenter's Parts 2 (1892-1916, 'Early years') and 3 (1917-1925, 'The making of a mythology') are real sourced periods, and they are omitted because they are EMPTY under publication-year keying, not because they are unsourced - nothing in this wing was published before 1925. If works.yaml ever gains a pre-1925 item, Part 3 is the era to add, and it already has its citation."
  - "Carpenter's Part 3 title would have been an actively misleading plate anyway: the only work this catalogue holds from 1917-1925 is the Gawain and the Green Knight student edition, a Leeds philological collaboration with E. V. Gordon and not the mythology the part is named for."
  - "Minor, and works.yaml's call rather than this file's: the Tolkien Estate's timeline dates The Road Goes Ever On to 1968 where works.yaml has 1967 (US October 1967 against UK March 1968). It changes no era membership - both years sit inside The Last Years - so it is left alone here."
  - "Sourcing not obtained: Shippey's ODNB life of Tolkien (paywalled) and Britannica (403), either of which would be a second independent periodisation of the lifetime alongside Carpenter. The Tolkien Society's own biographical sketch (David Doughan) was read in full and is NOT usable as one - its headings ('Professor Tolkien, The Inklings and Hobbits', 'The Storyteller', 'The Cult', 'Other Writings') are thematic strands that cut across each other chronologically, not a partition. It does corroborate the shape."
