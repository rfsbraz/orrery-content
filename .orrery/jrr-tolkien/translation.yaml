stage: translation
wing: jrr-tolkien

summary: >
  Built the pt-PT overlay for the whole wing, which had none before this run:
  content/i18n/pt-PT/franchises/jrr-tolkien/{franchise,works,eras,events,
  orders}.yaml plus the 6 author files this wing owns (jrr-tolkien,
  christopher-tolkien, and the four minimal collaborator stubs baillie-tolkien,
  carl-f-hostetter, humphrey-carpenter, verlyn-flieger - all co-author bios
  that belong to no franchise and would otherwise silently ship in English,
  the exact SKILL.md trap #3). Coverage: 155/180 files before, 166/180 after,
  zero regression on the other 165. All four spoiler-audit redactions
  translated from the CURRENT English exactly, none loosened or restored.

produced:
  files:
    - content/i18n/pt-PT/franchises/jrr-tolkien/franchise.yaml (new, 11 slots)
    - content/i18n/pt-PT/franchises/jrr-tolkien/works.yaml (new, 32 slots,
      CUIDADO COM SPOILERS header)
    - content/i18n/pt-PT/franchises/jrr-tolkien/eras.yaml (new, 12 slots)
    - content/i18n/pt-PT/franchises/jrr-tolkien/events.yaml (new, 2 slots)
    - content/i18n/pt-PT/franchises/jrr-tolkien/orders.yaml (new, name +
      rationale + debated, the last untracked by the coverage script)
    - content/i18n/pt-PT/authors/jrr-tolkien.yaml (new, bio + 16 lifeEvents)
    - content/i18n/pt-PT/authors/christopher-tolkien.yaml (new, bio + 12
      lifeEvents)
    - content/i18n/pt-PT/authors/baillie-tolkien.yaml (new, bio)
    - content/i18n/pt-PT/authors/carl-f-hostetter.yaml (new, bio)
    - content/i18n/pt-PT/authors/humphrey-carpenter.yaml (new, bio)
    - content/i18n/pt-PT/authors/verlyn-flieger.yaml (new, bio)
  coverage: "155/180 -> 166/180 files fully covered. The 14 remaining PARTIAL
    files (agatha-christie, robert-jordan, stephen-king, terry-pratchett,
    harlan-coben, lee-child events/authors) predate this run and belong to
    other wings; none regressed."
  spoilerAudit: >
    Preserved verbatim, no reveal added back: the-adventures-of-tom-bombadil's
    synopsis stops at "enigmática" (never says what Bombadil is proof
    against); smith-of-wootton-major's stops at the wandering (never says
    what Smith does with the star); jrr-tolkien/chronological's third
    debated entry states only relative generations, never Túrin's death;
    jrr-tolkien-cbe-death-1973's description names the gravestone names, not
    Beren and Lúthien's ending. CUIDADO COM SPOILERS header added to
    works.yaml naming both work ids, wording matched to
    hp-lovecraft/works.yaml's precedent. `note:` left untranslated on both
    (and on every other works.yaml/eras.yaml entry), matching the
    catalogue-wide convention confirmed in SKILL.md and in the edgar-allan-poe
    and hp-lovecraft overlays.
  registerCalls: >
    "Middle-earth"->"Terra-Média", "the Shire"->"o Condado",
    "First/Second/Third Age"->"Primeira/Segunda/Terceira Era": established
    Portuguese-market Tolkien terms, confirmed via Bertrand.pt's own
    catalogue ("Contos Inacabados de Númenor e da Terra-Média"), not
    invented. All 32 titles kept English throughout: this wing's
    editions.yaml carries exactly one pt-PT edition (Europa-América's "O
    Regresso do Rei", 2002), and it covers only the third volume of a work
    this catalogue treats as one single 1954 novel, so no work here has a
    published Portuguese title to use. Every direct quotation (Auden,
    Wilson, Muir, Tolkien's own letters and 1955 Auden letter, Christopher's
    2012/1983 words, the Tolkien Estate's website) kept verbatim in English
    inside the translated prose - the hp-lovecraft.yaml/miguel-de-cervantes.yaml
    convention against inventing Portuguese wording presented as someone's
    exact words.

checked: >
  python3 scripts/i18n_coverage.py: pt-PT 166/180 (was 155/180 before this
  run), no file regressed. python3 scripts/validate.py --slug jrr-tolkien: 0
  errors (same 3 pre-existing era-boundary warnings as before this run,
  unrelated to translation - the 2021/2024/2025 works deliberately outside
  every era per eras.yaml's own header). Every overlay file confirmed to
  carry no forbidden field (id/sources/isbn13/language/workId/title outside
  era-or-event-or-lifeEvent/orderedWorkIds/workIds/orderId/fit/dates/impact)
  by walking the parsed YAML. NOT checked: the rendered page. This wing isn't
  merged to content main or deployed yet, so there is no live pt-PT franchise
  page, author page or account-only surface to open and read - the standard
  live sweep this skill otherwise requires should run once this ships.

forStages:
  none: >
    This wing's pipeline has no stage queued after translation (matching
    visual-metadata.yaml's own note that it was already last in line).
    Flag for whoever next touches this wing: an English rewrite of any of
    the four spoiler-redacted passages, or of any synopsis/era/event/order/
    lifeEvent field, must be mirrored in this overlay in the same commit, or
    the two locales will quietly disagree.

openQuestions:
  - "The LOTR pt-PT title gap is structural, not a translation gap: until a
    pt-PT edition of the whole novel (or of the Fellowship/Two Towers
    volumes) is sourced, every reference to The Lord of the Rings, The
    Hobbit and The Silmarillion in this locale will keep rendering in
    English by design. Not this stage's call to fix - editions is content
    work, per SKILL.md's own 'Adding a new locale' section."
  - "Register calls a native reviewer should sanity-check: 'drogaria' for
    the 1965 American drugstore-paperback boom (eras.yaml, success) reads
    fine to me but is also common in pt-BR; 'dactilografado' for
    'typescript' (eras.yaml, the-hobbit-years) is the pt-PT spelling, not
    dactiloscrito (which means something else, fingerprinting); 'elfa' for
    'elf-woman' (works.yaml, beren-and-luthien) follows established Tolkien
    fan usage but I have no editions.yaml citation for it."
  - "debated (orders.yaml) and themes (eras.yaml) were both translated in
    full even though i18n_coverage.py's PROSE map doesn't count either as a
    slot - SCHEMA.md's own file-tree example names orders.yaml's overlay
    'rationales, debated', and SKILL.md flags themes by name as a field that
    scored complete while shipping English on every wing. Coverage read
    166/180 either way; flagging so the next auditor doesn't miss that both
    are real translated prose, not padding."
  - "No addition to content/events/global.yaml was needed this run:
    franchise.yaml only includes the pre-existing world-war-i-1914 (already
    fully covered in pt-PT catalogue-wide), it doesn't add a new global
    event, so SKILL.md's 'your scope is the wing plus any shared file this
    run touched' left nothing outside the wing to translate."
