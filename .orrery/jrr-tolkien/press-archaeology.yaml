stage: press-archaeology
summary: >
  Built lifeEvents for both Tolkiens: 16 for J. R. R. Tolkien (birth through
  burial, 1892-1973) and 12 for Christopher Tolkien (birth through his 2020
  death and the 2021 Nature of Middle-earth), plus one franchise events.yaml
  entry (the 1955-1956 Auden/Wilson reception split). Sourced against
  Wikipedia's dedicated Tolkien-family and Great War articles, all citing
  Carpenter's 1977 biography, Tolkien's Letters, or contemporary press.
  Removed both authors' header comments narrating why lifeEvents had been
  left empty, now moot.
produced:
  authorFiles:
    - content/authors/jrr-tolkien.yaml
    - content/authors/christopher-tolkien.yaml
  franchiseFiles:
    - content/franchises/jrr-tolkien/events.yaml
  lifeEventCount: {jrr-tolkien: 16, christopher-tolkien: 12}
  franchiseEventIds: [auden-wilson-reception-split-1956]
forStages:
  eras: >
    Sourcing supports 1911 (T.C.B.S. formed) or 1909 (first invented-language
    notebook) over 1914 as the juvenilia era's true opening. Bigger call:
    Christopher's lifeEvents show the "1974-2020 posthumous editing era" has
    real internal joints - Silmarillion construction (1973-77), the
    systematic History of Middle-earth project (1977-96), the medieval works
    and Great Tales (1996-2020) - plus a possible coda (Nature of
    Middle-earth, 2020-2021, edited by Hostetter after Christopher's own
    death). Worth 3-4 sub-eras rather than one; the sourced events support
    the split either way.
  event-resonance: >
    franchise.yaml has no globalEvents yet (not my footprint). Two
    global.yaml entries name this wing directly in their own text and should
    likely be included: the-first-world-war-1914-07-28 and
    fantasy-paperback-boom-1965. Also see the authorIds openQuestion below -
    it's squarely a franchise-judgement call.
  visual-language: >
    Both Tolkiens now have varied lifeEvents (document-facsimile, portrait-
    of-absence, archive-stack); none needed a real-person likeness or a
    fictional-character exception - every death is drawn by absence/object
    per VISUAL.md §3.
  art-rotation: >
    organisation/illustration_type assigned and Holds-valid on every entry,
    no adjacent repeats within either author's list, but this is a first
    pass done before the rest of the wing exists - re-check the combined cap
    once eras/franchise events are final.
openQuestions:
  - "Christopher Tolkien is withAuthorIds-only in franchise.yaml (authorIds: [jrr-tolkien]), so aura_density.py/wing_digest.py currently can't see any of his 12 new lifeEvents at all - not my footprint to fix, but whoever owns franchise.yaml should confirm whether the app's own timeline has the same blind spot. If it does, this stage's Christopher Tolkien work never reaches a reader."
  - "aura_density.py reports a 52-year dark run (1974-2025) - partly the authorIds blind spot above, partly real: Christopher's editorial output was genuinely sporadic (a volume every 1-5 years), which trips the script's strict every-calendar-year model even where the record isn't actually silent. Re-run once authorIds is resolved before trusting this number."
  - "G. B. Smith's exact death date (commonly cited elsewhere as 3 December 1916) isn't independently confirmed by anything I fetched, so the Somme lifeEvent says only 'later that year'. A well-known quote from Smith's last letter to Tolkien is likewise held out for the same reason - couldn't verify exact wording."
  - "Rob Gilson and Christopher Wiseman (the T.C.B.S.'s other two members) have neither a stub file nor a ruling on needing one - franchise-research's call, not mine, flagged only because the Somme lifeEvent leans on both names."
  - "The WWI-allegory correction (see jrr-tolkien.yaml's file header) is this run's main finding: Tolkien's on-record denial is specifically of WWII allegory (the Ring as atomic bomb), not WWI - his WWI debt is real but narrower (one landscape, one character) and never framed by him as allegorical either. Worth protecting in era/cover framing against the popular flattening."
