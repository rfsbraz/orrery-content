forStages:
  completeness-auditor: >
    First-draft spine sourced almost entirely from Wikipedia's own
    bibliography and Christopher Tolkien articles - re-verify every date
    and credit against primary sources (title pages, ISFDB). Check
    specifically: whether The Collected Poems of J. R. R. Tolkien (2024)
    has enough first-published content to earn its tier note's claim;
    whether the two items in notIncluded's last line belong in the wing;
    and whether subseries: null (no numbered sequence anywhere in this
    bibliography) still holds.
  press-archaeology: >
    jrr-tolkien.yaml and christopher-tolkien.yaml both have lifeEvents: []
    with sourced candidate events already named in each file's own header
    comment - build lifeEvents from those. Wikipedia only was used;
    Carpenter's Letters and Ovenden & McIlwaine's "The Great Tales Never
    End" would strengthen every claim.
  eras: >
    No eras.yaml yet. The bibliography's shape suggests: juvenilia/Kullervo
    era (1914-1918), Leeds/Oxford-scholarship-and-Hobbit years
    (1920-1937), The Lord of the Rings years (1937-1949), the long
    unpublished-Silmarillion retirement (1949-1973), and the 45-year
    posthumous Christopher Tolkien editing era (1974-2020) - whether that
    last one needs internal sub-eras (it spans Unfinished Tales through
    The Nature of Middle-earth) is an open call.
  reading-orders: >
    Do not build a naive publication-order path without accounting for
    the Silmarillion co-author call and the History of Middle-earth
    grouping (works.yaml's own header, STRUCTURAL CALL ONE/THREE) - a
    plain walk puts 2024's scholarly poetry collection ahead of 2007's
    Children of Húrin in a reader's mind. Obvious paths this data already
    supports: the two novels alone; +Silmarillion as "the essentials"; the
    three Great Tales as their own short arc; full publication order for
    completionists (already free via default).
  visual-language: >
    theme.yaml has a validated displayFace/signature but no art: block
    (hard validator error, left unresolved - out of scope here). Candidate
    anchors: the One Ring / Silmarils, the manuscript-and-editorial quality
    unusual to this wing (most of it is literally "edited from Christopher
    Tolkien's father's drafts"), the WWI origin of the earliest tales.
openQuestions:
  - "Silmarillion alone gets authorRole: co-author (sourced to Tolkien's 1967 letter); the three Great Tales get editor+apocrypha despite comparable synthesis work, for lack of an equally direct co-author source. A curator with deeper access might find one."
  - "The History of Middle-earth as ONE grouped apocrypha entry (not 12 ids, not excluded) is the single biggest structural call in the wing (works.yaml STRUCTURAL CALL THREE) - revisit once eras/reading-orders exist."
  - "The Lord of the Rings as one work (published: 1954, not 3) rests on Tolkien's own Wikipedia biography quoting printing costs - confirm against a primary source."
  - "The Fall of Númenor exclusion is the least-precedented exclusion in the wing (repackaging BOOKS' worth of material, not just already-published tales like the Lovecraft/Poe precedent) - worth a second look."
  - "6 thin author stubs (baillie-tolkien, humphrey-carpenter, carl-f-hostetter, verlyn-flieger) vs. prose-only mentions (E. V. Gordon, Alan Bliss, Joan Turville-Petre, Guy Gavriel Kay, Donald Swann, Scull, Hammond, Sibley) is a line this scaffold drew, not one the schema mandates."
