stage: event-resonance
summary: >
  1 global event included, 8 excluded. Bryndza's career is defined by the
  2007 Kindle/KDP platform that made self-publishing viable; every other
  global event in his lifetime either predates his career, falls outside
  his genres, or shaped an era he lived through without reaching his page.

produced:
  filesWritten:
    - "content/franchises/robert-bryndza/franchise.yaml (globalEvents
      block added)"

candidates: 8

forStages:
  reading-orders: >
    No impact. The timeline will render ebook-and-self-publishing-2007,
    which provides industrial context for his breakthrough path. No other
    candidates were included.
  visual-language, editions, visual-metadata: No change to their open items.

resonanceRulings:
  include:
    - ebook-and-self-publishing-2007:
        reasoning: >
          The Kindle platform and Amazon KDP that launched in 2007 directly
          enabled Bryndza's entire career: he self-published Coco Pinchard
          via KDP (2012-2015), was discovered by Bookouture on the ebook
          bestseller lists, and returned to self-publishing with his own
          imprint Raven Street (2022-present). Without this infrastructure,
          his first collapsed traditional deal would have ended his writing
          altogether.

  exclude:
    - sept-11-2001:
        reasoning: >
          He was 22, an actor in training; no evidence 9/11 reached the
          page in his work (crime thrillers and romcoms alike). Living
          through a historical event is not resonance.

    - chain-bookshop-1982:
        reasoning: >
          He was 3 years old; not relevant to his career or output.

    - online-bookselling-1995:
        reasoning: >
          He was 16; Amazon's online bookshop predates the self-publishing
          infrastructure that actually enabled him (Kindle/KDP, 2007). The
          more specific and causal event is already included.

    - financial-crisis-2008:
        reasoning: >
          He was 28-29 and had not yet published (career began 2012); no
          evidence the financial crisis shaped his writing.

    - prestige-fantasy-adaptation-2011:
        reasoning: >
          He writes crime thrillers and romantic comedies, not fantasy; the
          genre shift in screen culture does not reach his page.

    - portugal-bailout-2011:
        reasoning: >
          He is British, not Portuguese; though he was in Slovakia at the
          time, the Portuguese bailout had no direct bearing on his work or
          circumstances.

    - covid-19-pandemic-2020:
        reasoning: >
          He was 40-41 and already established (Girl in the Ice, 2016,
          over a million copies sold); he lived through the pandemic but
          no evidence it shaped the work published during or after it.

    - booktok-2020:
        reasoning: >
          He was an established crime author (born 2016 with Girl in the
          Ice); BookTok is primarily romance and YA, genres he does not
          write in.

openQuestions: []

notes: >
  All 8 excluded events passed the lifetime filter (born 1979, still
  living). The test applied: each was examined for whether it created
  conditions the author's work exists inside and the books show it. The
  ebook platform is unique in the list as one of the rare cases where
  infrastructure directly shaped his specific path rather than being
  generic background every author of the era shares - he would not have
  been published at all without it, and his entire career arc (initial
  breakthrough via self-publishing, publisher discovery via ebook
  bestseller lists, return to self-publishing) is built on it. Every
  other candidate failed the test: either he lived through it without
  writing about it, it belonged to the wrong genre or country, or it
  postdated his already-established presence.
