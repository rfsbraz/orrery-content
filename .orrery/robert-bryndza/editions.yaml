stage: editions
summary: >
  0 -> 43 editions across 23 of 25 works (23 en, 1 sk, 18 pt-PT, 1 pt-BR).
  The two gaps (The Burning Lie, forthcoming; Breaking Point, never sold) are
  both correct by fact, not oversight. lookup.py's author sweep found the
  first ~16 pt-PT candidates in one call; the rest (a further ~9 titles, plus
  every English Raven Street ISBN) came from fetching robertbryndza.com's and
  almadoslivros.pt's own Shopify product JSON directly, which exposes the
  barcode field without screen-scraping. Every ISBN's check digit is verified
  and every work match is by synopsis, not by translating a title.

produced:
  filesWritten:
    - "content/franchises/robert-bryndza/editions.yaml (new file, 43 entries)"
    - "content/franchises/robert-bryndza/works.yaml (two dead source URLs
      fixed: fatal-witness's long product slug and coco-pinchard-3's /books/
      path, both replaced with their working current URLs)"

hitRate: >
  23 of 25 works carry at least one edition. Erika Foster 9/9, Kate Marshall
  5/5, Fear the Silence 1/1, Coco Pinchard 5/5, Miss Wrong and Mr Right 1/1,
  Bitch Hollywood 1/1, Jamie Day 1/2 (The Quiet Kill; The Burning Lie is
  forthcoming 2027-03-04, no ISBN exists), Breaking Point 0/1 (never sold, no
  ISBN, consistent with every prior check). Both gaps were verified absent,
  not merely unsearched: The Burning Lie has no announcement of an ISBN
  anywhere, and Breaking Point is a newsletter-only giveaway confirmed by two
  independent sources already in works.yaml.

reissueQuestion: >
  Answered per work rather than assumed. Every one of the 21 novels once
  self-published or Bookouture-published now has a live Raven Street
  Publishing ISBN on the author's own shop (fetched product-by-product,
  robertbryndza.com being Shopify) - except Bitch Hollywood, confirmed absent
  from the current shop (both "bitch-hollywood" and "lost-in-crazytown"
  product handles 404). So Bitch Hollywood's only edition is its 2012
  CreateSpace original; every other pre-Raven-Street title is superseded, not
  doubled. This file follows a ONE-ENGLISH-EDITION-PER-WORK rule (the Karin
  Slaughter wing's precedent) rather than recording every historical ISBN
  alongside the current one - the reissue lineage is stated in the header and
  on each affected entry's note instead. Two structural findings along the
  way:
    - Six of the nine Erika Foster novels (Girl in the Ice through Deadly
      Secrets, originally Bookouture 2016-2018) are sold direct from the
      author only as a "large print" line (GBP 19.95 vs GBP 14.95 for the
      later standard-format novels) - real and current, recorded with a note
      so a reader is not surprised by the format, rather than silently
      treated as the standard edition.
    - Three Kate Marshall listings on the author's own site (Nine Elms,
      Shadow Sands, Darkness Falls - books #1-3) carry a duplicate ISBN,
      9781914547263, which actually belongs to The Lost Victim (#5) - the
      same number, and that book's own `sku`, appears on four different
      product pages. Verified twice, including a cache-busting refetch, to
      rule out a caching artifact. Recording it a third and fourth time would
      have both failed this skill's own duplicate-ISBN check and sent a
      reader to the wrong book, so those three instead use their original
      Little, Brown Book Group (Sphere) paperback ISBNs, independently
      confirmed on OpenLibrary against the correct work and author key. This
      is a defect on the source site, not a schema or catalogue problem - the
      note lives on the three affected entries and the file header, not as a
      correction attempted on robertbryndza.com.

slovakEdition: >
  Recorded, without an isbn13. Bitch Hollywood's true first edition was the
  Slovak translation, Mrcha Hollywood (Marenčin PT, March 2012), months ahead
  of the English CreateSpace release - already established in works.yaml's
  own CO-AUTHOR note. Martinus.sk, the largest Slovak bookshop, carries this
  exact title/year/publisher as a real retail listing (cover image, an 8.98
  reader rating, two records under slightly different byline orderings) - but
  its own ISBN field for both records reads "0", a value distinct from the
  "null" the same result set uses elsewhere for a different kind of gap. That
  reads as a real, in-print (well, at some point) book that was simply never
  assigned an ISBN, the schema's own documented case (`isbn13` omitted, not
  guessed), not a search failure. OpenLibrary and Google Books returned
  nothing under this title at all, consistent with a small 2012 press run
  from before either brother had any track record.

deadUrls: >
  Both fixed, and both are shop-route changes exactly as spoiler-audit's
  handoff described - the one nuance is which two: spoiler-audit.yaml itself
  names "the fatal-witness product page (with and without trailing slash)"
  and "the /books/ path for Coco Pinchard 3", not Fear the Silence (whose
  existing works.yaml URL was re-checked and is live). Fixed:
    - Fatal Witness: the long slug
      .../products/fatal-witness-the-unmissable-new-erika-foster-crime-thriller-detective-erika-foster-7/
      404s; the working current URL is
      https://www.robertbryndza.com/products/fatal-witness (200, verified).
    - Coco Pinchard 3: .../books/coco-pinchard-the-consequences-of-love-and-sex-coco-pinchard-3/
      404s; the working current URL is
      https://www.robertbryndza.com/products/the-consequences-of-love-and-sex
      (200, verified). This is also the sourced URL for that work's own
      Raven Street edition in editions.yaml.
  Both replacements are cited as sources on their editions.yaml entries too,
  so the same live URL now backs both files rather than diverging.

ptCoverage: >
  Essentially complete for the two established crime series plus the
  standalone: Erika Foster 9/9, Kate Marshall 5/5, Fear the Silence 1/1 (15
  of 15), all Alma dos Livros, cross-checked against Bertrand where both
  carry the same ISBN. Coco Pinchard's Portuguese run started only in 2026
  and covers the core trilogy so far (3/5) - the two prequel novellas, Miss
  Wrong and Mr Right, Bitch Hollywood and both Jamie Day books have no
  Portuguese edition, a real market fact stated in the file rather than a
  research gap. One entry (Coco Pinchard book 3) is in pre-order as this file
  is written, ships 12 August 2026, ISBN already live - recorded with that
  status on the note. Two title pairs are close enough in Portuguese wording
  to be a genuine trap for a title-based match and were resolved by synopsis
  instead: "A Noite Está a Chegar" is Shadow Sands, not The Night Stalker;
  "Silêncio Mortal" is Devil's Way, not Fear the Silence. Cold Blood carries
  two real, differently-registered Portuguese-language editions under the
  identical title "Sangue Frio" - Alma dos Livros' pt-PT (978-989- prefix)
  and Gutenberg's Brazilian pt-BR (978-85- prefix) - both recorded, correctly
  tagged, not collapsed into one.

forStages:
  visual-metadata: >
    No coverUrl written anywhere in this file (out of scope per this skill).
    OpenLibrary cover ids surfaced for several English ISBNs during lookup
    (e.g. Nine Elms 14751490, Shadow Sands 14744619, Darkness Falls 12423317)
    and Alma dos Livros' own Shopify CDN serves clean, unwatermarked covers
    for every pt-PT edition recorded here (checked at almadoslivros.pt/
    products/<handle>.json, `images[0].src`) - both are candidates worth
    revisiting from that stage rather than re-fetched here.
  wing-audit: >
    Two things worth a second look, neither touched here per this skill's
    "touch only editions.yaml" rule: (1) the-lost-victim's Alma dos Livros
    product description (a-vitima-perdida) is genuinely garbled - an
    unrelated AI-chat interface HTML fragment sits where jacket copy should
    be, on the retailer's own site, not this catalogue's; the two real lines
    of text inside it still matched the work's synopsis, so the ISBN is
    trustworthy, but the source page itself is a curiosity, not a defect
    here. (2) fear-the-silence's synopsis/jacket discrepancy that
    spoiler-audit flagged (Croatian-island death vs. hospital-then-island) is
    unrelated to editions and was not investigated further.

gates: >
  validate.py --slug robert-bryndza: 0 errors, 3 warnings, all three
  pre-existing handoff-length warnings on other stages' files (not this
  one's). Two comment-narration warnings this file initially raised
  ("this pass", "completeness-auditor's sourcing") were rewritten to state
  the fact plainly and are gone on re-run. Every isbn13 passes valid_isbn13;
  no isbn13 repeats across the 42 ISBN-bearing entries; every workId resolves
  and all 23 covered works match works.yaml exactly, confirmed by script
  rather than by eye.
