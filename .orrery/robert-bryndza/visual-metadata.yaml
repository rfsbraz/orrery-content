stage: visual-metadata
summary: >
  Portrait sourced (Wikidata P18 discovery -> Commons, CC BY-SA 4.0, licence
  read from the file itself). 14/25 covers (56%), all via Open Library Path
  A, none via Path B (no editions.yaml exists on this wing yet), one
  Openverse/festival/publisher-press check not needed because Commons
  already cleared the bar. No franchise header: confirmed the app dropped
  header rendering entirely (orrery app PR #135, "drop the curated header
  image from the wing page"), matching jk-rowling's franchise.yaml, which
  carries no images block at all. Left franchise.yaml untouched.

produced:
  filesWritten:
    - "content/authors/robert-bryndza.yaml (images block: portrait, 3
      lifeEvents unchanged)"
    - "content/franchises/robert-bryndza/works.yaml (images block on 14 of
      25 works; a data-decision comment on the other 11 explaining the
      empty slot)"
  filesUnchanged:
    - "content/franchises/robert-bryndza/franchise.yaml (no images block;
      the app renders no franchise header since PR #135, confirmed against
      the orrery app repo's own git history, not assumed)"

portrait:
  status: found
  file: "File:Robert Bryndza (2019) III.jpg"
  credit: "Jindřich Nosek (NoJin), CC BY-SA 4.0"
  source: "https://commons.wikimedia.org/wiki/File:Robert_Bryndza_(2019)_III.jpg"
  sourcing: >
    Reached via the expanded ranking's tier 2b: Wikidata (Q28530319) carries
    a P18 claim pointing at "Robert Bryndza (2019).jpg" on Commons, dated to
    a May 2019 sitting. Read that file's own extmetadata rather than trusting
    the Wikidata claim: LicenseShortName "CC BY-SA 4.0", AttributionRequired
    true, Artist "Jindřich Nosek (NoJin)", Restrictions empty (no personality
    flag), Credit "Own work". The Commons category for the subject holds
    three frames from the same sitting (I, II, III); this handoff uses III
    for the most headroom and a direct gaze among the three - all three
    share identical rights. Cross-checked: Czech Wikipedia's own infobox
    (cswiki, the only Wikipedia edition that carries an article on him -
    English Wikipedia has none, confirmed by eras.yaml's own prior search)
    uses the sibling frame I from the same session, independently confirming
    both the subject's identity and the "own work" claim. 1024x1280, well
    within the portrait slot's target ratio and minimum width. Because tier
    2b produced a clean hit, tiers 3 onward (Openverse, festival/photo-a-thon
    accounts, Wikinews, Library of Congress, publisher press rooms including
    Bookouture's and Raven Street's, the Czech Bestseller Award's own
    photography, and Slovak-language press) were not needed and were not
    searched - the ranking says work down the list, not exhaust it once an
    upstream tier clears the bar.

covers:
  hitRate: "14/25 (56%)"
  method: >
    Path A throughout: one openlibrary.org/search.json call by author name
    returned 68 records across every language edition published under
    "Robert Bryndza"; cover_i was read for the English-language work record
    of each of the 25 works, editions.json fetched for every record with no
    cover_i to check whether an edition-level cover existed that the search
    index missed (deadly-secrets was rescued this way), and covers.openlibrary.org/b/isbn/<isbn>-L.jpg?default=false
    was checked directly for every remaining ISBN found via
    scripts/metadata/lookup.py's TSV sweep. No editions.yaml exists on this
    wing yet (the editions stage had not run in this worktree), so Path B
    via a curated ISBN list was not available; every ISBN checked came from
    the author-search sweep or the lookup.py table instead. All 14 covers
    were downloaded and tiled into a contact sheet and looked at one by one:
    no retailer watermarks, no barcodes or library stamps, no Large Print or
    omnibus editions among the ones actually used (a Large Print Deadly
    Secrets and an alternate A Very Coco Christmas cover were both
    considered and passed over in favour of the standard trade edition and
    the work-level representative cover respectively).
  found:
    - "the-girl-in-the-ice (OL20033467W)"
    - "the-night-stalker (OL20033466W)"
    - "dark-water (OL21634514W)"
    - "cold-blood (OL25769388W)"
    - "deadly-secrets (OL25769387W, rescued via editions.json after the
      search index's cover_i was blank)"
    - "fatal-witness (OL28184502W)"
    - "nine-elms (OL20631456W)"
    - "shadow-sands (OL20761816W)"
    - "darkness-falls (OL24545804W)"
    - "devils-way (OL31204765W)"
    - "coco-pinchard-the-consequences-of-love-and-sex (OL25130670W)"
    - "a-very-coco-christmas (OL34961788W)"
    - "coco-pinchards-must-have-toy-story (OL45026422W - flagged below)"
    - "miss-wrong-and-mr-right (OL25869499W, corroborated by an Internet
      Archive scan of the physical book)"
  missing:
    - id: last-breath
      reason: "2 English editions on Open Library, neither with a cover"
    - id: lethal-vengeance
      reason: "1 English edition (Raven Street 2024), no cover"
    - id: chasing-shadows
      reason: "1 English edition (2025), no cover yet"
    - id: the-lost-victim
      reason: "1 English edition (Raven Street 2024), no cover"
    - id: the-quiet-kill
      reason: "no Open Library work record at all (2026, too recent);
        checked by title search and by the author's full 68-record sweep"
    - id: the-burning-lie
      reason: "forthcoming 2027-03-04, no Open Library record exists"
    - id: fear-the-silence
      reason: "2 English editions (Raven Street 2023), neither with a cover"
    - id: the-not-so-secret-emails-of-coco-pinchard
      reason: "3 self-published English editions (CreateSpace 2012/2014),
        none with a cover"
    - id: coco-pinchards-big-fat-tipsy-wedding
      reason: "split across 2 unmerged Open Library work records, 3
        self-published editions between them, none with a cover"
    - id: bitch-hollywood
      reason: "1 edition under each of its two titles (Bitch Hollywood,
        Lost in Crazytown), neither with a cover"
    - id: breaking-point
      reason: "apocrypha, never sold, no ISBN, no Open Library record"

flaggedForCurator:
  - subject: "coco-pinchards-must-have-toy-story's cover"
    detail: >
      The only cover found for this work sits on an Open Library work
      (OL45026422W) and author (OL16228804A, "Robert Bryndza " with a
      trailing space) record that Open Library has not merged with the
      canonical author record (OL7527807A) the other 13 covers came from.
      It traces to a single Internet Archive scan (ia:isbn_9781515226598).
      Title and 2015 publication year match this work exactly and the
      jacket art (alphabet blocks, a toy robot, "Robert Bryndza" on the
      cover) matches the series' branding, so it was used, but it is the one
      cover on this wing not resolved through the main author identity - a
      good candidate to re-check once Open Library merges the duplicate
      author record, in case a better edition surfaces under it.
  - subject: "franchise header"
    detail: >
      Confirmed against the orrery app repo directly (git log, commit
      90bdbd2, "fix: drop the curated header image from the wing page
      (#135)") rather than assumed from the brief: the app deleted the
      header-rendering code from the wing page. jk-rowling's franchise.yaml
      (added after #135) carries no images block at all, which is the
      pattern this wing now matches. lee-child's franchise.yaml still
      carries a header field from before #135 - that is a vestigial leftover
      the app no longer reads, not a model to follow.

forStages:
  editions: >
    No editions.yaml existed in this worktree when this stage ran, so cover
    sourcing used Open Library's author-level search and per-ISBN checks
    directly rather than a curated ISBN list. Once editions.yaml exists,
    re-running scripts/metadata/lookup.py --verify-isbns and --check-covers
    against it may surface a Path B cover this pass did not have inputs for,
    particularly on the 11 works currently bare.
  wing-audit: >
    14/25 covers, 1/1 portrait, 0/1 header (by design, not a gap - see
    flaggedForCurator above). The coco-pinchards-must-have-toy-story cover
    rests on an unmerged Open Library author record; worth a name check if
    Open Library's data changes.

gates: >
  python3 scripts/validate.py --slug robert-bryndza: green, same 3
  pre-existing handoff-length warnings as before this stage, no new
  warnings or errors. 14 works.yaml cover URLs are unique (no repeats). All
  15 image URLs (14 covers + 1 portrait) fetched fresh with --refresh
  immediately before this handoff was written and confirmed 200 with a real
  image body; the 14 covers were also downloaded, tiled into a contact
  sheet and looked at individually before being written.

