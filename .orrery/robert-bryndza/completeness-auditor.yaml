forStages:
  press-archaeology: >
    Confirmed via robertbryndza.com's own "How I Almost Gave Up On Writing"
    blog post (Sep 2017, author's own account): wrote the Bitch Hollywood/
    Lost in Crazytown manuscript in English Oct-Dec 2011 while his husband
    Jan translated it into Slovak in parallel; the Slovak edition (Mrcha
    Hollywood) published first, March 2012, months ahead of the English
    CreateSpace edition. Confirms the scaffold's LA-year and Slovakia-move
    life events and their ordering. Also independently corroborated: The
    Quiet Kill is stated as his "23rd book" in press coverage - consistent
    with 21 novels (9 Erika Foster + 5 Kate Marshall + Fear the Silence +
    5 Coco Pinchard + Miss Wrong and Mr Right, all published before Quiet
    Kill) plus Bitch Hollywood counted in his own personal tally, giving 22,
    then Quiet Kill as the 23rd - which only works if Breaking Point stays
    uncounted, another independent confirmation it is genuinely apocrypha
    rather than a book he considers part of his numbered run.
  eras: No change to the two-era boundary; nothing found moves it.
  reading-orders: >
    No new works to route. The Jamie Day series still has exactly two
    entries (The Quiet Kill published, The Burning Lie forthcoming
    2027-03-04) - checked specifically per the brief, given how young the
    series is, and found no third-book announcement anywhere (author's own
    site, Goodreads, book-tracking sites all stop at #2).
  visual-language, visual-metadata, editions: No change to their open items.

openQuestions: []

notes: >
  Breaking Point (apocrypha): kept. Goodreads alone was a thin source, so
  checked robertbryndza.com directly - its own newsletter signup section
  reads "Sign up and I'll send you a free short story Breaking Point as a
  thank you!", which is the author's own primary confirmation, not a
  secondhand listing. Also found an independent third-party review
  (worcestersource.wordpress.com, May 2026) from a reader who actually
  received and read the 18-page story. Two independent traces beyond
  Goodreads clears the bar the brief set. No ISBN exists because it was
  never sold - that is consistent with a newsletter-exclusive giveaway, not
  a reason to doubt it.

  Completeness sweep: robertbryndza.com/collections/all currently lists
  23 titles for sale (9 Erika Foster + 5 Kate Marshall + 2 Jamie Day +
  Fear the Silence + 5 Coco Pinchard + Miss Wrong and Mr Right) - exactly
  the 25 scaffolded works minus Bitch Hollywood (out of print, not sold
  through the current shop) and Breaking Point (never sold). The
  Goodreads author list (43 entries across 2 pages) adds nothing beyond
  translations, omnibuses and audiobook editions of the same 25 works - no
  new title, no anthology contribution, no foreword. No third Jamie Day
  book found anywhere. Amazon's author-store page returned a bot-block
  (HTTP 202) rather than content; not used as a source, but robertbryndza.com
  plus Goodreads plus booknotification.com (already cited in the file for
  the Jamie Day dates) gave three independent, agreeing traces, which is
  enough triangulation without it.

  Reissue check: nothing in the 25 is a hidden reissue. The current shop's
  Coco Pinchard lineup matches the scaffolded five title-for-title; no sixth
  or renamed entry anywhere in Goodreads' listings, which would be the first
  place a re-covered edition shows up as a separate record.

  Slovak/English identity question: resolved as one book, not two - the
  scaffold already had this right. Bryndza's own 2017 blog post states
  Mrcha Hollywood "is the Slovak language translation of my book Lost in
  Crazytown" (his current name for the same text originally titled Bitch
  Hollywood at its 2012 CreateSpace release, retitled for its 2013
  re-release) - confirms it is a single manuscript across two languages and
  two English-language titles, correctly recorded as the one work
  robert-bryndza/bitch-hollywood already is. No change made.

  The work list is genuinely final: three independent sources agree on the
  same 25, the one flagged item (Breaking Point) now clears its sourcing
  bar with two more traces than it had, and the specific risk areas named
  in the brief (Jamie Day's third book, a Coco Pinchard reissue, the
  Slovak/English split) were each checked and closed rather than assumed.
