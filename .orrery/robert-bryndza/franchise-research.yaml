# Issue #63's premise, verified rather than trusted: same byline, not a
# pseudonym split - every edition, romcom and crime alike, credits "Robert
# Bryndza"; his own current imprint sells both today. Two clean, bounded
# eras, not a dual identity: Coco Pinchard was written first (2010) but a
# co-written comic novel (Bitch Hollywood, with his husband Jan) was
# actually published first, in Slovak translation, March 2012; four more
# Coco Pinchard novels followed through 2015; the crime debut (2016) is a
# one-time switch with no return to romcom since and no crime before it.

