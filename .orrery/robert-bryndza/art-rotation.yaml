registerShiftHinge: >
  The 2015->2016 hinge is carried by TWO consecutive beats rather than one.
  the-traditional-publishing-years' chapter-gate is the structural reset for
  the genre switch itself (one per era, fixed, already correct) - that is the
  wing's existing answer to "biggest visual weight" for the switch. A year
  later, girl-in-the-ice-million-sales-2017 is the switch's commercial
  vindication (over a million copies, 24 countries, the sentence "the
  commercial foundation the rest of the catalogue is built on"), and it is now
  the wing's one `immersion` - the biggest weight the EVENT axis can give
  anything, reserved for exactly the moment press-archaeology flagged as a
  candidate. `anchor-with-satellites` composes it explicitly: one anchor (The
  Girl in the Ice) with the 24 translated editions/territories as satellites,
  which is close to literal rather than a stretch. illustration_type moved
  from press-media-collage (mosaic's "public noise" register - crowds, press)
  to atmospheric-motif-field, immersion's own overwhelming-scale register, and
  echoes (without repeating a neighbour) the same type on the era-2 plate one
  beat earlier - two beats of one arc, not two unrelated ruptures.

  This is why kate-marshall-launch-2019 moved off full-bleed-vista: it sits
  immediately after the new immersion cell, so both loud would touch
  regardless of which one changed. Two considerations pointed at demoting
  Kate Marshall rather than the sales milestone: impact is `med` against the
  milestone's `high`, and full-bleed-vista's establishing-landscape reads
  fine in `beside` too (beside holds every type except the 3 artifact ones) -
  nothing about the image concept had to change, only its frame.

theCollapsedDealCounterfactual: >
  Weighed immersion for bryndza-slovakia-manuscript-deal-2012 (the collapsed
  2010 deal / "very low ebb" moment) too, since press-archaeology named it
  the other real rupture. Rejected on the tool's own adjacency rule, not just
  taste: in the organisation-rotation sequence (era plates excluded) this
  event's immediate predecessor is bryndza-born-1979, already
  full-bleed-vista/LOUD - making the deal-event loud too would create a real
  touching-loud violation the checker would catch, not a judgement call to
  relitigate. It also sits the same year as era 1's own chapter-gate, so (like
  raven-street-publishing-2022 the same year as era 3's gate) it reads as an
  immediate footnote to a reset the era plate already delivered, which is a
  second, independent reason `artifact-spread` - the two-manuscript,
  submission/deal story it already depicts literally - is the better fit
  regardless of the adjacency rule. Left unchanged.

ravenStreetEraPlate: >
  Reviewed the-raven-street-years against visual-language's flag (the one
  asset holding both shelves - crime 7 of 9 works there - compose as two
  object clusters at the era's own cold baseline). Its fields were already
  correct for that brief: chapter-gate (fixed, one per era),
  symbolic-still-life (an object-cluster type, not a scene type - fits "two
  clusters" far better than an atmospheric or landscape type would), 1 image.
  No field changed. The actual two-cluster composition is an /asset-prompt
  concern, out of scope here; flagged forward below so it isn't lost.

otherChanges: >
  raven-street-publishing-2022 (beside -> floating-object) and
  fear-the-silence-czech-award-2024 (floating-object -> medallion) swapped
  slots rather than just resolving the neighbour-repeat that opened up once
  kate-marshall-launch-2019 took `beside`. Both are better fits on their own
  terms: fear-the-silence-czech-award-2024 IS an honour (Czech Bestseller
  Award), and medallion's Use line is literally "honours...recognition" -
  a better home than floating-object's "keepsake...minor beat," and its
  existing illustration_type (emblem-seal) is already in medallion's Holds
  list, so only the organisation moved. raven-street-publishing-2022 sits the
  same year as era 3's own chapter-gate (see the collapsed-deal reasoning
  above) - the era plate already carries the "full circle" weight, so the
  event reads naturally as the intimate, object-level footnote
  floating-object's own spec calls "a minor beat," with the physical first
  Raven Street book (book-object, unchanged) as that object.

