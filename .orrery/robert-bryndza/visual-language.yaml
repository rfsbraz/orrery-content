stage: visual-language
summary: >
  theme.art written, the wing's one outstanding validate.py error cleared.
  One visual law for two registers: a single dip-pen instrument held two
  ways (ruled/exact for procedural material, loose/busy for comedy) rather
  than two illustration systems, unified by one emblem - a lit window seen
  from outside, in the dark - grounded in the fact that almost this entire
  bibliography (Coco Pinchard past book 1, and all seventeen crime novels)
  was written by an Englishman living in Slovakia, about England.

produced:
  filesWritten:
    - "content/franchises/robert-bryndza/theme.yaml (art: block added -
      emblem, motifs, atmosphere, lineCharacter, backgroundTexture,
      accentUse, avoid; palette/displayFace/signature/notes untouched)"

theSolution: >
  Three things carry both registers without averaging them into a
  crime-comedy compromise mood: one dip-pen instrument held two ways
  (ruled/exact vs. loose/busy - the pattern Connelly and Slaughter's
  theme.art already use for a single register with two dispositions,
  applied here across two genres); one emblem (the lit window) sourced from
  the author's biography rather than either genre, so it covers 2012-present
  honestly instead of being a crime motif retrofitted onto the comedies -
  it also echoes Coco Pinchard's own epistolary form; and one accent rule
  (rose-coral marks exactly one warm light source per image, in a
  procedural scene as much as a comic one, never repainted as a genre
  costume) that extends theme.yaml's existing palette note into the art
  block. Checked against Tana French, the catalogue's other two-register
  wing: her atmosphere field's approach (registers stated as explicitly
  distinct, never blended, with one bridging entry called out as neither)
  is the structural model this wing's atmosphere field follows; the content
  and instrument both differ throughout.

forStages:
  art-rotation: >
    atmosphere states the rule directly: draw each event at the temperature
    its own era/subject calls for, never averaged. Era-1/Coco Pinchard
    material gets the warm, crowded, indoor treatment; era-2/3 crime events
    (all 3 lifeEvents, 4 of 5 franchise events) get cold/wet/procedural.
    fear-the-silence-czech-award-2024 is crime-register despite being an
    award. the-raven-street-years era plate is the one asset holding both
    shelves at once (per eras.yaml) - compose as two object clusters at the
    era's own cold baseline (crime is 7 of 9 works), with the accent
    signalling the comedy shelf rather than warming the whole plate.
    Dartmoor motifs carry real Hound-of-the-Baskervilles risk - avoid names
    it, worth a second look on any generated image. Generate the-self-
    published-comedies (warm) and one cold era plate early, before picking
    an anchor (VISUAL.md §5d), to prove the one-instrument approach holds
    across both registers before it is locked in for the whole wing.
  editions, visual-metadata: No change to their open items.

gates: >
  validate.py --slug robert-bryndza: 0 errors (was 1, present since
  franchise-research). asset_audit.py robert-bryndza: art:yes, 11 jobs
  listed (3 era plates, 3 life events, 5 franchise events), previously
  blocked.

