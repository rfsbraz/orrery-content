stage: press-archaeology
summary: >
  0 -> 3 author lifeEvents, 0 -> 5 franchise events. Dark run 2012-2019 (8yr)
  -> 2013-2014 (2yr); aura ratio 0.36 -> 0.68 (9 -> 17 entries; all 9 prior
  entries were default-included global.yaml events, none author-specific).
  One correction to already-live prose: "sold a million copies within five
  months" did not match the contemporary record and is now "within a year"
  - see notes.

produced:
  newWorkIds: []
  newAuthorIds: []
  filesWritten:
    - "content/authors/robert-bryndza.yaml (3 lifeEvents added; bio's 'five
      months' corrected to 'a year')"
    - "content/franchises/robert-bryndza/events.yaml (new file, 5 events)"
    - "content/franchises/robert-bryndza/works.yaml (the-girl-in-the-ice
      synopsis: same five-months -> a-year correction)"

  lifeEvents:
    - "bryndza-born-1979 (low) - the birth floor; Lowestoft, day
      uncorroborated, year only; notes forward to Jamie Day (2026) sharing
      the hometown."
    - "bryndza-slovakia-manuscript-deal-2012 (high) - the real origin of the
      whole career: the collapsed 2010 UK deal, the low ebb of late 2011,
      the dual English/Slovak manuscript, the 17 Jan 2012 phone call."
    - "bryndza-erika-foster-idea-2015 (high) - the Kate Bush 50 Words for
      Snow origin of The Girl in the Ice, and the decision to finally write
      crime, from two independent contemporary interviews."

  franchiseEvents:
    - "girl-in-the-ice-million-sales-2017 (high) - the breakout; redated,
      see the correction in notes."
    - "kate-marshall-launch-2019 (med) - the second series, second setting;
      fills the worst part of the old dark run."
    - "raven-street-publishing-2022 (med) - the return to self-publishing on
      his own imprint, dated to Fatal Witness (Jul 2022) via three
      independent bibliographic/retail records."
    - "fear-the-silence-czech-award-2024 (med) - Czech Bestseller Award
      (Translated Fiction) 2023, corroborated by an independent Czech
      trade page beyond Bryndza's own account."
    - "jamie-day-launch-2026 (high) - The Quiet Kill's real origin: a failed
      draft about a homeless squatter that a rookie-cop scene took over.
      Corrects a deliberate-stretch framing - his own account is that it
      happened completely without planning."

forStages:
  eras: >
    No change to the romcom(2012-2015)/crime(2016-present) boundary; every
    new event sits inside one side, none straddles it. Two new anchors sit
    right at the seam: the Jan 2012 Slovak deal and the 2015 Erika Foster
    decision (crime's actual planning, a year before the 2016 debut).
  reading-orders: >
    No new works to route. jamie-day-launch-2026's "completely without
    planning" account is worth a line wherever a Jamie Day entry path gets
    built - a reader expecting a strategic new direction is getting an
    accident that worked.
  visual-metadata, editions: No change to their open items.

openQuestions:
  - "raven-street-publishing-2022 is dated to its first published title
    (Fatal Witness) because no dateable launch announcement exists anywhere
    checked (the imprint's own pages carry no date; trade coverage came up
    empty). A confirmed announcement date should replace this proxy if one
    ever surfaces."
  - "No TV/film adaptation of Erika Foster has actually happened, despite
    rumours since at least 2016 and a standing rights-inquiry contact on
    Raven Street's own site. Left out entirely rather than written as a
    non-event; a real deal would be a strong future franchise event."

notes: >
  CORRECTION, flagged loudly: "sold a million copies within five months" was
  already live (author.yaml bio, works.yaml's the-girl-in-the-ice synopsis)
  and does not match the contemporary record. Bryndza's own blog post
  announcing the milestone is dated 6 February 2017, a year after the
  February 2016 release ("this time last year I was nervously gearing up
  for the book launch"); Bookouture's press release is headlined "in less
  than a year" and its image asset is timestamped 2017/02. Both contemporary
  sources put the milestone at roughly twelve months, not five - the "five
  months" figure looks like today's marketing copy compressing the timeline
  in retrospect, unsupported by anything dated at the time. Corrected to
  "within a year" in both places and in the new franchise event.

  Two things were checked and confirmed absent from the record rather than
  left unsearched: a dateable Raven Street Publishing launch announcement,
  and any actual TV/film deal for Erika Foster (see openQuestions).

  All 8 new entries clear the two-source bar where it applies; none touch
  health, finance, legal or family trouble as CURATION defines them - the
  near-poverty detail in the 2012 event is ordinary career-origin texture,
  the same class of fact already used single-sourced elsewhere in this
  catalogue. Nothing was held out under the bar this run, so no rejection
  notes were needed.
