stage: reading-orders
summary: >
  orders.yaml: not created - zero orders earn a slot. franchise.yaml
  startHere: added, two paths (was none). pt-PT overlay for both paths
  added in the same commit (new file - none existed for this wing).
ordersConsidered:
  - candidate: "Curated restatement of the derived default"
    verdict: >
      REJECTED, fails divergence. Both individually catalogued poems carry
      `containedIn` the 1887 book (works.yaml), so the derived default
      already skips them: the real walk is 2 works, unambiguous
      chronological order, no same-year tie to break. Nothing to sequence,
      no community/publisher/author-stated order exists. orders.yaml not
      created.
pathsConsidered:
  - id: classroom-canon
    verdict: SOURCED
    source: >
      DGE, Aprendizagens Essenciais, Português 11.º ano
      (dge.mec.pt/sites/default/files/Curriculo/Aprendizagens_Essenciais/
      11_portugues.pdf), fetched and read directly: Anexo 1 sets "Cesário
      Verde - Cânticos do Realismo (O Livro de Cesário Verde) (leitura
      integral de 'O Sentimento dum Ocidental')" - his only syllabus entry.
      Corroborated independently by works.yaml's own note on that poem
      (Serrão's "obra-prima", three essays discussing it individually).
    judgementCall: >
      Read as "which door" evidence, not just "what's assigned" (the
      critical-consensus corroboration answers the stronger claim; DGE
      confirms it is also nearly every Portuguese reader's actual first
      Verde). workIds points at the containing book, not the poem alone,
      matching almeida-garrett/classroom-canon's precedent of citing the
      whole work even where DGE assigns less than all of it; the poem is
      named in prose instead of double-listed since it's containedIn the
      book already listed.
  - id: everything
    verdict: "SOURCED (mechanical) - orderId: default, no other sourcing needed."
  - candidate: "Path on the standalone poem only, not the book"
    verdict: "CONSIDERED, NOT SHIPPED - the book is the real acquirable object."
  - candidate: "Third path isolating the 1964 critical edition"
    verdict: "REJECTED as padding - no source recommends reading it alone."
sparseShelfRuling: >
  Shelf resolves to 2 walkable works after containedIn - thinner than the
  skill's own sparse-author example. Shipped 2 paths, not 1 or 0, because
  the DGE finding is real independent sourcing (not our judgement) and the
  two paths diverge on something actionable: the book + its one essential
  poem, vs. also taking on the 254-page 1964 scholarly apparatus.
obraCompletaFraming: >
  Never appears alone in a path - only inside "everything", described
  plainly as scholarly apparatus rather than a second creative work
  (echoes works.yaml's existing framing, not a new claim).
i18n: >
  content/i18n/pt-PT/franchises/cesario-verde/franchise.yaml created (did
  not exist before). Both paths translated; wing's top-level `description`
  still untranslated (i18n_coverage.py: 4/5) - not this stage's artefact,
  flagged as a known gap.
gates: >
  validate.py --slug cesario-verde: 1 pre-existing error (theme.yaml no
  `art:` block), unchanged. i18n_coverage.py: franchise.yaml now PARTIAL
  4/5 (was unlisted) - improvement, not a regression.
forStages:
