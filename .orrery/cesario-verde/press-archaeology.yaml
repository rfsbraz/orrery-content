stage: press-archaeology
summary: >
  Verified all 7 scaffolded lifeEvents against Joel Serrão's "Tábua
  biobibliográfica de Cesário Verde" (Colóquio/Letras n.93, 1986), read off
  the page scans at coloquio.gulbenkian.pt (the site's HTML has no OCR text;
  fetched the page JPEGs directly and read them as images). One correction
  (Ortigão's real wording), one day-precision upgrade (brother's death),
  new texture on 3 more events. Opened
  content/franchises/cesario-verde/events.yaml (new), 2 entries closing
  most of the 1887-1964 dark run. Aura 1.75->2.25/work (7->9); dark run
  78yrs->45yrs. validate.py --slug cesario-verde clean except the expected
  missing theme.art block.
added:
  - "Birth event: 1857 flight to Linda-a-Pastora from Lisbon
    cholera/yellow-fever outbreaks - dates the farm's origin. (Tábua p.6)"
  - "Ortigão event: 'Esplêndida' (Diário de Notícias, 22 Mar 1874, under
    'Fantasias do Impossível') set off a real scandal over its
    'baudelairianismo'; Fialho de Almeida and Teófilo Braga also reacted
    publicly. The never-published 1874 volume was announced in A República,
    27 Dec 1874. (Tábua pp.9-10)"
  - "TB-onset event: 1880 letter to Macedo Papança - after 'O Sentimento dum
    Ocidental' passed unnoticed, Verde calls Lisbon 'um cadáver de cidade'.
    Sources the 'growing disillusionment' the scaffold asserted but never
    quoted. (Tábua p.14)"
  - "Brother's death: day-precision, 20 March 1882, aged 24 (was bare
    '1882'). (Tábua p.15)"
  - "Death event, biggest addition, highest-impact entry in the wing:
    Sousa Martins's May 1886 diagnosis ('irremediavelmente perdido');
    Verde's own 16 June letter admitting his fear; the death scene (5am,
    19 Jul, Largo de São Sebastião 64, after weeks at Caneças); last words
    per brother Jorge Verde; the press's own indifference (Jornal do
    Comércio: 'Cesário Verde morre quase ignorado'). (Tábua pp.17-18)"
  - "New franchise event, 1901: second edition, textually identical to
    1887, first launched to general readers - 14 years on. Flagged by the
    brief. (Tábua p.19)"
  - "New franchise event, 1919: fire at Linda-a-Pastora burns papers/books
    that may have been Cesário's own estate. Biggest single find of the
    pass - the actual, dated reason nothing beyond the printed record was
    ever recovered, Serrão's 1964 'poesias dispersas' included. (Tábua p.19)"
corrected:
  - claim: "Ortigão's jab, as scaffolded, is 'mais Cesário, menos Verde'."
    correction: >
      Real words (Tábua pp.9-10) are «seja menos verde e mais cesário» -
      same two clauses, reversed, punning on both his surname and his given
      name. The popular version is a paraphrase, not the primary quote.
      Fixed in the lifeEvent and bio prose; paraphrase now named as such.
rejected:
  - "A dated Pessoa-cites-Verde moment (brief's specific ask): en/pt
    wikipedia and Caeiro's own pt.wikipedia page all describe a diffuse
    influence across many poems, no single dated citation; Infopedia
    doesn't mention Pessoa. Stays bio prose. WebSearch was unavailable this
    session (budget exhausted) - a fresh search or the Gray de Castro
    (2013) book is next."
  - "Unrequited-love anchor for 'O Sentimento dum Ocidental': not in the
    Tábua (p.14) or elsewhere checked. completeness-auditor's Camões-
    tricentenary dating is the real answer; lead closed."
  - "Third sibling Adelaide, died 1859 (Tábua p.6: 'Eugénia'; pt.wikipedia
    infobox: 'Eufémia', 1856-1859, anginas not TB): sources disagree on her
    name, neither independently corroborated, not named in any poem. Held
    out for the conflict, flagged for a future pass."
  - "1885 Victor Hugo quip and 'homem de letras' letter (Tábua p.17): real
    but texture, not aura. Left out."
darkRun:
  before: "78 years, 1887-1964."
  after: "45 years, 1920-1964 (1901 and 1919 events close 1887-1918)."
  whatStaysDark: >
    Honest dark, not unlooked-at: the Tábua (1986) names nothing here,
    Infopedia is silent, en/pt.wikipedia describe the Pessoa-generation
    embrace only in general, undated terms - no centenary, curriculum date
    or rediscovery found anywhere checked. Canonization ran on cumulative
    modernist citation, not one reported event. Next: Colóquio/Letras
    beyond n.93, Hemeroteca Municipal de Lisboa's press archive, Gray de
    Castro's book.
eventResonance: >
  Nothing to flag - 1857 epidemic and TB deaths are family-scale, not
  named epidemic years; the 1919 fire is a private accident.
artRotation: >
  Footprint fields left unset throughout. In prose: 1886 death is now the
  loudest cell by far, wants spacious treatment. 1874 Ortigão is next
  loudest (real scandal, three named critics). The two franchise events
  (1901, 1919) are quiet single-fact entries. 1880/1857 additions are
  quiet texture folded into existing cells.
openQuestions:
  - "1919 fire scoped scope: culture, not world - arguable."
  - "Adelaide's 1859 death: add once the name conflict resolves?"
