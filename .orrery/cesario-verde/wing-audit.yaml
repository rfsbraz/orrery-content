stage: wing-audit
verdict: >
  Full-wing audit, 11 prior stages. Baseline re-derived: validate.py 0
  errors/1 pre-existing warning; i18n_coverage.py full pt-PT coverage;
  aura_density.py 4 works/9 aura/2.25 per work, dark run 45yrs
  (1920-1964); art_rotation.py --check 0 rotation/pacing problems - all
  match prior handoffs. 3 real defects found and fixed directly, all
  mechanical/factual (no editorial judgement needed). Everything else
  checked clean or is a legitimate absence. Ready for pipeline-audit and
  integration, no follow-up round needed.

findings:
  blocking:
    - id: birth-order-self-contradiction
      what: >
        content/authors/cesario-verde.yaml called Cesário "the eldest of
        the surviving children" (bio + born-1855 lifeEvent) - but the same
        bio, 16 lines later, calls his sister Maria Júlia his "elder
        sister", and her own lifeEvent dates her 1853-1872, two years
        before his 1855 birth and no infancy death. Verified against
        pt.wikipedia's infobox directly (fetched): confirms 1853. No
        source checked ever says "eldest of the surviving children" - an
        unsourced claim contradicted by data three paragraphs away in the
        same file.
      fix: >
        "eldest of the surviving children"/"eldest surviving child" ->
        "eldest son" in bio + born lifeEvent (EN + pt-PT overlay,
        "filho varão mais velho"). Sourced correction paragraph added to
        the header comment, matching the wing's existing ferragens-
        correction pattern.
      owner: "fixed directly (wing-audit)"
    - id: macedo-papanca-quote-dropped-word
      what: >
        tuberculosis-onset-1877 lifeEvent (EN + pt-PT) quotes the 1880
        letter to Macedo Papança as "não obteve um olhar, um sorriso, uma
        observação". Checked against the Tábua biobibliográfica p.14 page
        scan directly: the real quote has "um desdém" between "sorriso"
        and "observação", dropped from both.
      fix: "Restored 'um desdém' in both files; EN gloss now 'a look, a smile, a hint of disdain, a remark'."
      owner: "fixed directly (wing-audit)"
    - id: apercebida-vs-desapercebida
      what: >
        works.yaml's o-sentimento-dum-ocidental note quotes the Tábua as
        "passou quase apercebida". Checked against the p.14 page scan: the
        actual word is "desapercebida" (unnoticed) - the shipped quote
        dropped the "des-" and reversed the source's word.
      fix: "Corrected to 'desapercebida'; the EN gloss was already right."
      owner: "fixed directly (wing-audit)"
  missing: []
  stale: []
  checkedAndClean:
    - "Ortigão quote pair (real vs. paraphrase): consistently distinct everywhere, EN+PT. Cross-checked the whole 1874 scandal narrative against Tábua p.9-10 scans - verbatim match."
    - "Family trade (ferragens, not textile): consistent everywhere. Re-verified against Infopedia/pt.wikipedia/Tábua p.5 directly. Noted en.wikipedia says 'fruit products' instead - a 4th, weaker claim not addressed by the wing's existing correction; not acted on given two stronger agreeing Portuguese sources already in file (see curator's call)."
    - "containedIn dates (1880/1887 o-sentimento; 1884/1887 nos): arithmetic re-derived, and cross-checked against pt.wikisource's TOC for the 1887 book (fetched) - Naturais section has exactly 15 poems incl. both, Crise Romanesca 7, totalling works.yaml's claimed 22."
    - "Death lifeEvent (diagnosis, 16 June letter, death scene, last words, obituaries): fetched and read Tábua p.17-18 scans directly, every quoted fragment verbatim. Jorge-as-sole-survivor claim independently checked against all sibling death years."
    - "1901/1919 franchise events: fetched and read Tábua p.19 scan directly, matches."
    - "eras.yaml's core citations (Serrão, Mourão-Ferreira, Macedo p.20, Margarido p.57): fetched and read both essay page scans directly, both quotes verbatim including bracketed-ellipsis omissions. The wing's largest structural call (eras: []) holds up under direct verification."
    - "1887 cover (visual-metadata): followed the OL redirect and opened the actual image - genuine unwatermarked 1887 wrapper scan, matches works.yaml's note. Also verified the Projecto Adamastor 2013 ebook edition's ISBN/publisher/year against the publisher's own page directly - matches editions.yaml."
    - "theme.yaml contrast ratios: re-derived WCAG ratios from raw hex myself (14.94:1 / 5.75:1 / 5.19:1) - matches the file's claims."
    - "displayFace: sourceSerif, signature: filament: SCHEMA.md's prose is stale (doesn't list them) but grepped the app directly - both are real implemented, tested values; validate.py already checks against the real set, not the stale prose. Not a wing-specific issue (3-5 other wings already use them)."
    - "theme.art.emblem: not in SCHEMA.md's example block but used by 20+ other wings; theme.art is documented as /asset-prompt-only, so absence from app grep is expected."
    - "containedIn, format: poem/poetry-collection: grepped the app - containedIn has dedicated test suites and is read by the order-deriver and achievement evaluation; both formats are in the app's type + have EN/PT i18n labels. Not inert."
    - "globalEvents completeness: diffed global.yaml's 22 ids against franchise.yaml's exclude list programmatically - exact match, include: [] correctly empty. Re-verified the Berne Convention '~7 weeks' gap (52 days)."
    - "startHere/capabilities/achievements-characters-orders absence: paths resolve, features:{} auto is proportionate to a well-paced 9-entry aura, and the three missing files are legitimate not-applicable absences for this wing's size."
    - "Sanctuary-rule scan: grepped every content + overlay file for pipeline vocabulary - zero real hits."
    - "spoiler-audit's zero-boundaries ruling and death-detail judgement: re-read against CURATION SS6 myself, agree, no basis to reopen."
    - "art-rotation's 3x portrait-of-absence reuse: re-read against LAYOUT.md/theme.art.avoid, sits at the stated ~1/3 cap tied to a real named motif pair, not unexplained repetition."

notApplicableNotAbsent:
  - "eras.yaml: [] - re-verified core citations above; a received periodisation does not exist to be had, not a coverage gap."
  - "No orders.yaml - derived default is already the whole 2-work walkable shelf."
  - "No achievements.yaml/characters.yaml - legitimate absences for this wing's size."
  - "1/4 works with a cover, 3/4 with editions - proportionate to SCHEMA's own ~20% ceiling guidance for this exact case (19th-c. Portuguese poet, two poems never independently book-published)."
  - "1901 edition's publisher/imprint - genuinely unrecoverable online per editions.yaml's own header, not an unfinished search."

curatorsCall:
  - "translation's editorialCall (dropped English glosses on already-Portuguese quotes): reads naturally to me but needs a native pt-PT judgement this audit can't make; carrying forward unresolved, not duplicating as new."
  - "en.wikipedia's 'shopkeeper and exporter of fruit products' claim (see checkedAndClean): not acted on, but worth a look if anyone wants to know where it came from."

inheritedOpenQuestions:
  - "editions.yaml: 1901 edition's publisher/imprint needs archival access."
  - "translation.yaml: native pt-PT read of the rendered pages - this worktree has no app either, so still open, not duplicated as new."
  - "completeness-auditor's Verde-letters bibliography question: still unsettled."

gates: >
  validate.py --slug cesario-verde: 0 errors, 1 pre-existing warning
  unrelated to this stage's edits (spoiler-audit.yaml word count).
  i18n_coverage.py: cesario-verde still fully covered pt-PT (all 3 fixes
  mirrored base+overlay in the same commit). aura_density.py/art_rotation.py:
  unchanged (prose-only fixes).

changes: >
  content/authors/cesario-verde.yaml (bio + header + 2 lifeEvents),
  content/i18n/pt-PT/authors/cesario-verde.yaml (bio + 2 lifeEvents),
  content/franchises/cesario-verde/works.yaml (1 note field). All three are
  factual/quotation corrections verified directly against primary sources,
  not editorial calls.

recommendation: >
  Ready for pipeline-audit and final integration. Every routing-table
  category was checked; the three real defects were within this stage's
  own mechanical-fix footprint and are fixed; the remaining open items are
  pre-existing, correctly-scoped gaps needing a human or the app attached.
