stage: art-rotation
verdict: >
  All 9 event sketches graded (7 lifeEvents, 2 franchise events; eras.yaml is
  [], no era plates). Before: organisation 'beside' 9/9 over cap, contour
  `=========` (a 9-cell plateau). After: 7 of 16 organisations used (medallion
  x2, artifact-spread x2, full-bleed-vista, beside, mosaic, immersion,
  interlude x1 each), no neighbour repeats, no organisation over cap. Contour
  `#==#==#=.` - loud at born-1855 (full-bleed-vista), ortigao-review-1874
  (mosaic), death-1886 (immersion); quiet only at the closing
  linda-a-pastora-fire-1919 (interlude); mid elsewhere. No two loud cells
  touch or share a screenful, no plateau.
highImpactDeathsJudgment: >
  4 of 7 lifeEvents are impact:high, all the tuberculosis chain (sister's
  death 1872, Verde's own onset 1877, brother's death 1882, Verde's own death
  1886). Graded organisation independently of impact per LAYOUT.md - grading
  all 4 loud would break the adjacency/screenful rules on a 9-event wing and
  flatten the wing into the "aestheticised dying-young-poet melancholy"
  theme.art.avoid explicitly warns against. Only cesario-verde-death-1886 got
  immersion: it is the actual end of the story, and portrait-of-absence (the
  emptied room at Largo de São Sebastião 64) matches §4-impact's "room after
  the fact, not the fact" and the theme's "never a sickbed" rule. The other
  three got real MID weight, not quiet throwaways: sister-julia-death-1872 and
  brother-joaquim-death-1882 both got medallion (a memorial keepsake, not a
  passing aside) with portrait-of-absence, using the theme's own paired
  motifs - "empty chair at a family table" for the sister, "closed shutter on
  a farmhouse window" for the brother - which visual-language's art.motifs
  names as "the oblique correlate for the two tuberculosis deaths 'Nós'
  names directly", clearly a matched pair for these two specific events (not
  for Verde's own death, the third and escalated instance). Reusing medallion
  for both, non-adjacent, is a deliberate rhyme distinct in scale from the
  loud immersion reserved for Verde's own end. tuberculosis-onset-1877 got
  artifact-spread (document-facsimile: the sourced 1880 letter to Macedo
  Papança quoted in the event's own description) - a real turning point but
  onset, not a death, so evidence of the toll rather than the rupture itself.
  Net: portrait-of-absence appears 3 times (~1/3 cap), a deliberate exception
  since it is the theme's one prescribed motif for this chain and organisation
  escalates meaningfully across the three uses (mid, mid, loud).
otherChoices: >
  born-1855 -> full-bleed-vista/establishing-landscape (LAYOUT's own first use
  is "birthplace... opening of a period"; also CURATION's every-wing-opens-on-
  birth rule). curso-superior-letras-1873 -> beside/relationship-tableau
  (ordinary-weight: enrollment, meeting Silva Pinto, first poems). ortigao-
  review-1874 -> mosaic + anchor-with-satellites/press-media-collage (a real
  multi-voice press episode: Ortigão's jab as anchor, Fialho de Almeida,
  Teófilo Braga and the failed Dec-1874 book announcement as satellites - all
  sourced in the event text). segunda-edicao-1901 -> artifact-spread/
  book-object (visual-language's own handoff already flagged this as "pure
  ledger/commerce register"). linda-a-pastora-fire-1919 -> interlude/
  atmospheric-motif-field, the wing's one true silence and closing event -
  "no manuscript... is ever recovered" is LAYOUT's "missing records" case for
  interlude verbatim; closing quiet also gives the contour an exhale after
  the death's immersion three events earlier.
changes: >
  content/authors/cesario-verde.yaml - organisation/illustration_type/
  images_required/modifier added to all 7 lifeEvents; nothing else touched.
  content/franchises/cesario-verde/events.yaml - same 4 fields added to both
  franchise events; nothing else touched.
gates: >
  Before: art_rotation.py --check cesario-verde - 9 organisation-rotation
  problems, contour `=========`, 1 pacing problem. After: 0
  organisation-rotation problems, 0 pacing problems, contour `#==#==#=.`. The
  tool's composition axis ("0 of 9 assets read") stays flagged and exit code
  stays 1 - expected, no GitHub art issues exist yet on a fresh wing, not this
  stage's to close. validate.py --slug cesario-verde: 0 errors, exit 0 (1
  pre-existing warning on spoiler-audit.yaml's word count, not from this
  stage).
forStages:
  asset-prompt: >
    Two-register lineCharacter from visual-language: ruled steel-nib for the
    commercial-urban events (curso-superior, ortigao-review, tb-onset's
    letter, the 1901 book), loose pencil for the two medallion countryside
    motifs (empty chair, closed shutter) and the interlude's Linda-a-Pastora
    aftermath. Verde's own death (immersion) is an urban interior (Lumiar) -
    ruled register, not the pencil one. The mosaic's anchor-with-satellites
    needs the As Farpas jab as anchor with 3 satellite vignettes, all sourced
    directly in the event description.
  wing-audit: >
    Organisation-rotation and pacing axes both clean. The composition axis
    reads "0 of 9 read" until /asset-prompt opens issues - expected, not a
    finding. portrait-of-absence at 3/9 (~1/3 cap) is by design, not
    unexplained repetition - see highImpactDeathsJudgment above.
