stage: visual-language
verdict: >
  art: block written on content/franchises/cesario-verde/theme.yaml - all
  seven keys (emblem, motifs, atmosphere, lineCharacter, backgroundTexture,
  accentUse, avoid). asset_audit.py cesario-verde now reports art:yes and
  lists 9 jobs (7 life-event, 2 franchise-event; no eras or covers exist for
  this wing yet, so nothing else was gated on this). validate.py --slug
  cesario-verde: 0 errors, exit 0 (one pre-existing warning on a different
  stage's handoff word count, not touched here).
distinctness: >
  luis-de-camoes (verdigris, hue ~128) is the nearest green in the catalogue
  and the only wing this stage opened in full. Camões draws his record's
  outdoor half - pale sun-bleached daylight, salt-worn paper, bronze/brass
  patina; this wing draws Verde's indoor-scaled half of the same city/country
  duality - near-black gaslit dusk, newsprint-and-ledger paper, paint a
  shopkeeper chose. Concretely: Camões's accent only ever touches oxidised
  metal (a clasp, a rivet, a hinge gone green with age); this wing's accent
  only ever touches paint or bound cloth (a shopfront frame, a ledger's
  spine tape) and its avoid list explicitly rules out patina on bare metal.
  Camões's line dries out toward stipple in equatorial sun; this wing's line
  is a two-register contrast (ruled steel-nib for commerce, loose pencil for
  remembered country) with no drying/fading behaviour at all. Confirmed this
  is reflected in the actual YAML: see art.atmosphere's closing sentence and
  art.accentUse/avoid, which name luis-de-camoes directly, the same pattern
  Camões's own avoid list uses for joao-tordo.
changes: >
  content/franchises/cesario-verde/theme.yaml - added the `art:` block only.
  palette, preset, displayFace, signature and notes are untouched from
  scaffold, per the skill's own restriction.
gates: >
  Before: theme.art absent, validate.py --slug cesario-verde failed 1 error
  (no art block). After: art present, validate.py --slug cesario-verde exits
  0 (2288 works, 198 authors, all references resolve; 1 unrelated pre-existing
  warning on .orrery/cesario-verde/spoiler-audit.yaml's word count, not this
  stage's file). asset_audit.py cesario-verde: art:yes, 9 jobs listed (7
  life-event, 2 franchise-event).
forStages:
  asset-prompt: >
    Two-register lineCharacter (ruled steel-nib for commerce/urban subjects,
    loose pencil for remembered countryside) is the load-bearing field - name
    which register a given event calls for, or both if the event genuinely
    sits on the seam (e.g. the 1901 second-edition franchise event is pure
    ledger/commerce register; the two tuberculosis-death life events reach
    for the oblique empty-chair/closed-shutter motif and the countryside
    register). Only 7 life-events + 2 franchise-events exist to sequence
    against each other for §4a monotony - no eras, no covers yet, so the
    rotation only has to be checked across 9 assets, not a longer run.
  wing-audit: >
    theme.art is now present; the one validate.py error this stage existed
    to close is gone. No other gaps were touched.
