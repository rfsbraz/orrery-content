stage: editions
summary: >
  content/franchises/cesario-verde/editions.yaml created (did not exist
  before). 7 editions over 3 of the wing's 4 works: o-livro-de-cesario-verde
  (Projecto Adamastor 2013 free ebook w/ readUrl, Oficina do Livro 2007
  illustrated paperback, Caixotim 2004 scholarly reissue), obra-completa-de-
  cesario-verde (Dom Quixote 2001 "Poesia Completa" reissue, Portugália 1964
  first edition with no isbn13), o-sentimento-dum-ocidental (Campo das Letras
  2005 pt-PT standalone chapbook, University of Massachusetts Dartmouth 2011
  English translation by Richard Zenith). nos carries zero editions - no
  standalone publication of it was found anywhere checked.
sourcingMethod: >
  scripts/metadata/lookup.py's 61-row TSV covered the fetching half; every
  isbn13 below was independently checked digit-by-digit and cross-referenced
  against either a Biblioteca Nacional de Portugal catalogue record (fetched
  directly, permalinks cited) or an OpenLibrary ISBN record carrying a real
  library MARC source_record (Library of Congress or Harvard, not bare
  user-contributed data - checked per candidate via openlibrary.org/isbn/
  <isbn>.json before trusting it). Two ISBN-10s (Dom Quixote's
  972-20-1951-1, Campo das Letras' 9896250138) were converted to 13-digit
  form and rechecked from scratch rather than trusted as given.
realFindNotShipped: >
  Livros Horizonte's ISBN for Obra Completa (972-24-0829-1 / 978972240829 5),
  already recorded in works.yaml's own note and repeated by OpenLibrary,
  turned out on a direct BNP ISBN lookup to now resolve to a different book
  (Jorge Correia Jesuíno's "Processos de liderança," same publisher, later
  printings under the same number) - a live "buy button" hazard, not shipped.
  Left undocumented in works.yaml itself per this skill's "touch only
  editions.yaml" rule; flagging here and in the PR body since a future pass
  touching that file's note should know the ISBN it cites no longer safely
  identifies the book.
the1901Edition: >
  Checked specifically per the task brief (the segunda-edicao-1901 franchise
  event). Real per Joel Serrão's bibliographic table, but no publisher/
  imprint surfaced in the Biblioteca Nacional de Portugal catalogue (ISBN-
  less keyword and title search) or OpenLibrary's edition list for this work.
  Not recorded - see editions.yaml's own header for the full reasoning,
  including why the OpenLibrary "1900 Editora Ulisseia" record is not it.
gates: >
  Before: no editions.yaml for this wing (editions capability was auto/off).
  After: scripts/validate.py --slug cesario-verde exits 0, 2288 works/198
  authors/11 achievements, all references resolve; the one warning shown
  (spoiler-audit.yaml handoff word count) predates this stage and is
  untouched by it.
forStages:
  wing-audit: >
    Editions capability now activates (editions.yaml exists). Coverage is
    3/4 works, 7 editions, 2 markets (pt-PT, en) - the en edition exists only
    for o-sentimento-dum-ocidental, nowhere else in this wing.
  completeness-auditor: >
    If works.yaml or the wing's canon changes later, recheck coverage against
    the fraction stated in editions.yaml's own header comment before trusting
    it as current.
openQuestions:
  - "The 1901 second edition's actual publisher/imprint - needs a human with
    archival access (a physical BNP card catalogue or similar), not another
    automated pass; the online catalogue and OpenLibrary were both checked
    and came up empty."
