summary: >
  Scaffolded from scratch: franchise.yaml, works.yaml (28 works: 12 core, 13
  extended, 3 apocrypha), theme.yaml's non-art fields, eca-de-queiros.yaml
  (4 lifeEvents), plus a minimal ramalho-ortigao.yaml stub for the
  O Mistério da Estrada de Sintra co-authorship. Request issue's bibliography
  (4 titles) confirmed but far from complete; real count is 28. Posthumous
  handling follows the existing Saramago precedent (ordinary work + note),
  not a new structure - the issue's own named precedent (Cesário
  Verde/Florbela Espanca) does not exist in this catalogue yet, so Saramago
  is the actual model checked. Portuguese-original-title convention followed
  per Pessoa's wing; moot in practice since nothing here was first published
  in another language.
