stage: completeness-auditor
summary: >
  Cross-checked the 28-work bibliography against the main Portuguese
  Wikipedia article's own "Obras" list, the Universidade de Coimbra Centro
  de Literatura Portuguesa's dated publication list for the "Edição Crítica
  das Obras de Eça de Queirós" (1992-2024), the Fundação Eça de Queirós
  shop, and period bookseller listings. Resolved the four thin entries and
  the Textos de Imprensa gap; found two further works. 28 -> 31 works (core
  12 unchanged, extended 13 -> 14, apocrypha 3 -> 5), one canonTier
  correction. validate.py --slug eca-de-queiros clean except the expected
  missing theme.art block.
counts:
  before: { works: 28, core: 12, extended: 13, apocrypha: 3 }
  after: { works: 31, core: 12, extended: 14, apocrypha: 5 }
fourFlaggedItems:
  - {item: "Dicionário de Milagres", finding: "real, unfinished (only A/B entries exist); stays apocrypha, now documented"}
  - {item: "Contos Vol. II", finding: "real, 4 named stories re-edited from manuscript 2003; stays extended"}
  - {item: "Almanaques e Outros Dispersos", finding: "real, scattered periodical texts ed. Irene Fialho 2011; stays extended"}
  - {item: "Lendas de Santos", finding: "real, 3 saint narratives the editors call unfinished; retiered extended -> apocrypha"}
textosDeImprensa: >
  Resolved into one grouped entry rather than left out. Six real,
  separately-dated volumes (1995/2002/2004/2005/2019/2024, one per
  periodical) confirmed against Coimbra's own publication list - matches
  Wikipedia's "Vols. I-VI." One entry, published: 1995 (earliest volume),
  following this catalogue's own The History of Middle-earth precedent.
added:
  - {work: eca-de-queiros/correspondencia, year: 1925, tier: apocrypha, insertsBetween: "the 1900 semipóstumo works and Cartas Inéditas de Fradique Mendes (1929)"}
  - {work: eca-de-queiros/cartas-publicas, year: 2009, tier: extended, insertsBetween: "Contos Vol. II (2003) and Almanaques e Outros Dispersos (2011)"}
  - {work: eca-de-queiros/textos-de-imprensa, year: 1995, tier: extended, insertsBetween: "A Tragédia da Rua das Flores (1980) and Contos Vol. II (2003)"}
corrected:
  - {work: eca-de-queiros/lendas-de-santos, change: "canonTier extended -> apocrypha; synopsis/note rewritten; no reorder"}
  - {work: eca-de-queiros/dicionario-de-milagres, change: "synopsis/note rewritten with real contents"}
  - {work: eca-de-queiros/contos-vol-ii, change: "synopsis/note rewritten with real contents"}
  - {work: eca-de-queiros/almanaques-e-outros-dispersos, change: "synopsis/note rewritten with real contents"}
  - {work: eca-de-queiros/alves-e-companhia, change: "note/sources extended with independent composition-date corroboration (pt.wikipedia main article, written 1884)"}
  - {work: eca-de-queiros/a-tragedia-da-rua-das-flores, change: "note/sources extended with independent composition-date corroboration (pt.wikipedia main article, written 1877-78)"}
rejected:
  - item: "Philidor (Bouchardy, 1863; Eça's Portuguese stage translation, re-edited 2021)"
    why: "translated play by another author - same authorRole gap as As Minas de Salomão, now a second instance, noted in the header rather than added"
  - item: "Nine 1992-2021 'Edição Crítica' re-editions of already-listed novels"
    why: "scholarly re-editions, not new works - editions.yaml's job; named in the header so a later pass does not rediscover them"
canonTierReview: >
  Checked all 31 against SCHEMA.md rather than accepting franchise-research
  outright; one change (above). Kept: A Capital extended (near-complete
  novel, unlike the two true fragments now apocrypha); O Conde de Abranhos
  extended against Alves & Companhia's core (translation counts differ,
  3 vs 0). Core spine unchanged.
fradiqueMendesStressTest: >
  Nothing contradicts the pseudonym ruling - neither new work touches
  Fradique, no birth/death date surfaced, and the 2014 critical edition of
  A Correspondência de Fradique Mendes re-edits the existing 1900 work.
openQuestions:
  - "authorRole still has no 'sole translator of another author's work' value - now attested twice (As Minas de Salomão, Philidor); a curator/schema call."
  - "Textos de Imprensa's volume-to-Roman-numeral mapping is unresolved; not load-bearing since published:1995 is the earliest confirmed date regardless."
  - "Whether A Capital's incompleteness should move it to apocrypha is a judgment call worth a second opinion."
forStages:
  press-archaeology: no new lifeEvents-worthy facts beyond what franchise-research already flagged.
  reading-orders: no change; additions don't touch the 12-work core spine or the no-subseries finding.
  eras: no change.
  visual-language: no change.
