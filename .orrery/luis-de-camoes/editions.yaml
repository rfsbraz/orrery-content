stage: editions
summary: >
  Wrote content/franchises/luis-de-camoes/editions.yaml from scratch (new
  file): 9 verified editions across 3 of the wing's 6 works. The shared
  metadata sweep's TSV yielded no usable ISBN candidates once self-published
  Os Lusíadas reprints (Independently Published, Lulu, Creative Media
  Partners) were filtered out - real coverage came from fetching Portuguese
  publisher sites directly (Porto Editora, Guerra e Paz, Assírio & Alvim,
  E-primatur) plus corroborating web search. Os Lusíadas got 5 editions
  (pt-PT x2 led by Porto Editora's 2024 500th-anniversary hardcover, pt-BR
  x1, en x2: Landeg White/Oxford and William C. Atkinson/Penguin, the two
  translations works.yaml's own translationNote names as most recommended).
  Cartas got 2, both Guerra e Paz (2024 letters+poems collection leading,
  the 2011 illustrated Contradança second). Rimas got 2, led by E-primatur's
  2022 complete "Lírica" volume (Maria Vitalina Leal de Matos) over Assírio
  & Alvim's in-print but sonnets-only "Sonetos" selection. Filodemo,
  Anfitriões and El-Rei Seleuco got none: every source found for the three
  plays was an omnibus ("Teatro") spanning all three under one ISBN
  (E-primatur 2020, Assírio & Alvim 2024), excluded per the catalogue's
  standing rule against an omnibus ISBN standing in for one work. E-primatur
  also publishes an "Épica & Cartas" omnibus bundling Os Lusíadas with
  Cartas, same exclusion, same rule - both catalogue works already have real
  standalone editions recorded so the gap costs nothing.
produced:
