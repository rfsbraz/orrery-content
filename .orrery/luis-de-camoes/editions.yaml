    - "E-primatur 'Teatro' Vol III (9789898872432): omnibus of all 3 plays, excluded"
    - "Assírio & Alvim 'Teatro' 2024 (9789723723571): same 3-play omnibus, excluded"
    - "Edições Caixotim's 2005 standalone Filodemo (pref. Vanda Anastácio): cited in academic sources, no ISBN or live storefront found"
