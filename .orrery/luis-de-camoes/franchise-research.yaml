stage: franchise-research
summary: >
  New wing scaffolded from nothing: 5 works (Os Lusíadas, Rimas, Filodemo,
  Anfitriões, El-Rei Seleuco), author entity with born: null, theme
  (sun-bleached-carta preset), eras/events/orders left honestly empty.
produced:
  newWorkIds:
    - luis-de-camoes/os-lusiadas
    - luis-de-camoes/rimas
    - luis-de-camoes/filodemo
    - luis-de-camoes/anfitrioes
    - luis-de-camoes/el-rei-seleuco
  authorEntity: "luis-de-camoes (born: null, died: 1580-06-10, 4 lifeEvents)"
  theme: sun-bleached-carta (palette + fraunces + rule; no art block)
  filesCreated:
    - content/authors/luis-de-camoes.yaml
    - content/franchises/luis-de-camoes/franchise.yaml
    - content/franchises/luis-de-camoes/works.yaml
    - content/franchises/luis-de-camoes/theme.yaml
    - content/franchises/luis-de-camoes/eras.yaml (empty, reasoned)
    - content/franchises/luis-de-camoes/events.yaml (empty, reasoned)
    - content/franchises/luis-de-camoes/orders.yaml (empty, reasoned)
  filesDeliberatelyNotCreated:
    - editions.yaml (no ISBN research attempted; out of scope this stage)
    - achievements.yaml (no earnable criteria for a 5-work wing)
rejected:
  - Excluded, O Parnaso de Luís Vaz - lost in his lifetime, never printed.
    Same reasoning as Cervantes's excluded Las semanas del jardín.
  - Excluded, Disparates da Índia (also Os Disbarates da Índia) - active,
    sourced scholarly contestation of Camonian authorship. Same reasoning
    as Cervantes's excluded La conquista de Jerusalén.
  - Excluded, Sátira do Torneio - no confirmed independent print history at
    all, distinct from the authorship dispute above.
  - Rejected naming, "queimados"/"esganados" for the two 1572 editions -
    named in the request issue's own scoping note (flagged there as
    unsourced recollection) but not found in any source checked, including
    a 2024 critical edition. The two real editions are documented under
    different names (pelican facing left = genuine, right = later
    counterfeit); recorded as a correction in works.yaml rather than
    dropped silently.
forStages:
  press-archaeology: >
    Aura is thin by design: 4 firmly-dated lifeEvents only (1553 departure,
    1570 return, 1572 publication, 1580 death). The Ceuta eye injury and the
    Mekong shipwreck are covered in bio prose, not lifeEvents, because
    sources disagree on their actual years (1549-51; 1559-66) and on key
    details (accident vs combat; swam vs raft; whether "Dinamene" is a real
    person) - a `date:` field would force false precision. aura_density.py
    flags the resulting 1581-1645 dark run.
  eras: eras.yaml is empty by design (see its own header comment); revisit
    once press-archaeology's fuller life picture exists.
  reading-orders: >
    No startHere/orders. The real entry-path question (which English
    translation of Os Lusíadas) lives in that work's translationNote
    instead - restate it as reader-facing prose if a wizard gets built,
    the same pattern Cervantes's start-with-don-quixote path uses.
  visual-language: theme non-art fields set and reasoned against all 7
    other Lusophone wings via theme_digest.py; art block untouched.
  completeness-auditor: >
    5 works from en/pt Wikipedia plus targeted searches only - not checked
    against a dedicated Portuguese bibliographic source (BNP, Instituto
    Camões). Check for individually-catalogued letters (a genre named in
    pt.wikipedia's overview, not sourced here as a standalone work) and
    re-verify Sátira do Torneio before re-adding it.
  visual-metadata: 5/5 works have no cover; author portrait unset (a copy
    of a lost original exists but its rights/authenticity are unvetted).
  editions: 5/5 works have no editions.yaml entry; none attempted.
openQuestions:
  - "El-Rei Seleuco: included (apocrypha) rather than excluded like
    Disparates da Índia, because it is consistently named one of Camões's
    three comedies in tertiary sources despite the real authorship dispute.
    A curator reading the sourcing differently can move it to rejected
    without disrupting anything else in the wing."
  - "El-Rei Seleuco's print year is genuinely disputed across sources
    (1616, 1645, 1654 all appear). Used 1645 on a specialist 2005 journal
    article's own title; worth a dedicated re-check."
  - "born: null follows the john-tiffany.yaml precedent per orrery-content
    #106's own scoping note (already resolved prior to this stage, not
    re-litigated). Confirmed no validator floor issue: a null born exempts
    this author from the lifeEvent-dated-to-born check."
