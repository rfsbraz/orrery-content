stage: spoiler-audit
summary: >
  Zero spoiler boundaries set, verified rather than assumed. Four of six
  works have no narrative surface (an epic on a voyage whose outcome is
  history, a lyric collection, prose letters, and a Plautus adaptation
  whose double identities are its premise). The two candidates were the
  plays with a recognition plot, and both were settled on primary
  evidence. All 11 gate-capable entities (5 franchise events, 6
  lifeEvents) carry publication or biographical history only and stay
  correctly null. One prose edit, a factual correction, not a spoiler fix.
produced:
  boundariesSet: []
  boundariesLoosened: []
  prose:
    - file: content/franchises/luis-de-camoes/works.yaml
      entity: luis-de-camoes/rimas
      field: synopsis
      change: >
        The "Sôbolos rios que vão" clause had the shipwreck legend
        inverted, calling it "the loss of the Lusíadas manuscript in the
        Mekong shipwreck". The tradition is the opposite - the manuscript
        was the one thing saved - as the author bio and the Os Lusíadas
        note both already state. Rewritten to match, and given the relative
        pronoun the sentence was missing.
  rulings:
    - entity: luis-de-camoes/filodemo
      verdict: not a spoiler, unchanged
      basis: >
        "a servant of noble birth unknown even to himself" is the play's
        front matter, not its reveal: the Argumento printed ahead of Act I
        (pt.wikisource, "Auto de Filodemo") names the Danish princess, the
        shipwreck, the twins raised by a shepherd, Filodemo serving his
        uncle "sem saber o parentesco que entre ambos havia" - and then
        both marriages, which the synopsis withholds. The reader meets all
        of it before the first line. The autobiographical tie to Camões's
        frustrated court love affair, which the Ceuta lifeEvent also names,
        points at that same premise rather than at a resolution, so it is
        not the Almeida Garrett shape; and the play's shipwrecked-castaway
        backstory is nowhere linked to Camões's own Mekong shipwreck.
    - entity: luis-de-camoes/el-rei-seleuco
      verdict: not a spoiler, unchanged
      basis: >
        "an aging king intends to marry the woman his own son loves" is
        pt.wikipedia's own framing of the auto ("a intenção do rei de
        desposar a mulher que o seu filho ama"). The resolution, Seleucus
        renouncing Stratonice to Antiochus, is stated nowhere; naming her
        his stepmother describes Plutarch's source, not the play's outcome.
    - entity: luis-de-camoes/anfitrioes
      verdict: not a spoiler, unchanged
      basis: >
        Jupiter's impersonation is the premise Plautus's own prologue hands
        the audience. The unmasking and Hercules's birth are not stated.
    - entity: luis-de-camoes/os-lusiadas
      verdict: not a spoiler, unchanged
      basis: >
        The plot is da Gama's real voyage; the synopsis gives premise plus
        the interrupting-narrator character, both jacket material.
        Adamastor, the Ilha dos Amores, the Máquina do Mundo and the Canto
        X close are named nowhere.
    - entity: "luis-de-camoes/rimas, luis-de-camoes/cartas"
      verdict: no narrative surface
      basis: >
        The one narrative item named, the lovesick-ward hospital letter, is
        in the title of the 2024 edition that prints it.
    - entity: "franchise.yaml startHere (3 paths), eras.yaml, orders.yaml"
      verdict: clean
      basis: >
        The paths sell on the epic's stature, the translation choice and
        the Rimas' obscurity - none of it touches what a reader meets
        inside a work. eras and orders ship empty, comments only.
    - entity: "events.yaml (5) and lifeEvents (6)"
      verdict: correctly ungated
      basis: "All eleven are publication, reception or biographical facts."
  guardVerified: >
    validate.py's refusal of spoilerAfter outside events and lifeEvents was
    tested by breaking it: the field added to two works.yaml entries
    produced two hard errors. File restored.
  i18n: "Nothing to mirror - works.yaml has no pt-PT overlay yet."
forStages:
  translation: >
    Carry the corrected Rimas synopsis, not a cached earlier string: the
    legend saved the Lusíadas manuscript and lost everything else, and the
    Parnaso was lost in Mozambique, not the Mekong.
  enrichment: >
    Do not restate Filodemo's ending. Its Argumento gives away both
    marriages, so a summary drawn from the primary text ships the
    resolution unless deliberately cut; the synopsis stops at the premise
    on purpose.
openQuestions:
  - >
    Unrelated to spoilers, flagged because it is reader-facing: the
    "everything" startHere path calls the two undisputed comedies the ones
    "behind the national theatre he never lived to see rebuilt in his
    name". No source in this wing supports a national theatre named for
    Camões. Worth a check or a cut.
  - "validate.py: 1 error, theme.yaml's missing art: block, the expected pre-visual-language state."
