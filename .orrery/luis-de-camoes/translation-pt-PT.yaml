stage: translation-pt-PT
summary: >
  Full pt-PT coverage added for the three files i18n_coverage.py flagged
  missing (works.yaml 6/6, events.yaml 10/10, authors/luis-de-camoes.yaml
  13/13) and the one partial file (franchise.yaml's top-level description,
  6/7 -> 7/7). The three startHere paths already carried in franchise.yaml
  from the reading-orders stage were read and left untouched. New files:
  content/i18n/pt-PT/franchises/luis-de-camoes/{works,events}.yaml,
  content/i18n/pt-PT/authors/luis-de-camoes.yaml. Extended:
  content/i18n/pt-PT/franchises/luis-de-camoes/franchise.yaml (added
  description).
produced:
  filesTranslated:
    - franchises/luis-de-camoes/works.yaml: "6 synopses"
    - franchises/luis-de-camoes/events.yaml: "5 events, title+description (none carry quote)"
    - authors/luis-de-camoes.yaml: "bio + 6 lifeEvents, title+description"
    - franchises/luis-de-camoes/franchise.yaml: "description added; startHere left as-is"
  noteFieldsLeftInEnglish: >
    works.yaml's five `note:` blocks (os-lusiadas, rimas, filodemo,
    el-rei-seleuco, cartas) stay in the base language, matching the
    established convention already stated in the eca-de-queiros,
    jose-saramago and jose-luis-peixoto pt-PT overlays: note is curatorial
    annotation, not reader-facing prose, and i18n_coverage.py does not gate
    on it. Stated in this file's own header comment, not narrated as a
    process decision.
  hedgingPreserved: >
    The bio's epistemic hedges carried through as hedges, not firmed into
    statements: "segundo a melhor estimativa disponível" (born, null in the
    base), "por tradição" / "a tradição diz que" (the Macau grotto, the
    shipwreck location and survival), "as fontes divergem" / "não
    concordam" (the eye wound's cause, the shipwreck year and manner of
    reaching shore), "o registo não resolve qual" (the Goa imprisonment's
    cause), and the Dinamene sentence keeps the "tratada... como mais
    provavelmente uma invenção poética do que uma pessoa documentada"
    construction rather than dropping her as fictional outright. The
    corrected Rimas synopsis (spoiler-audit's fix: the Lusíadas manuscript
    was saved, the Parnaso was what got lost, in Mozambique not the Mekong)
    was translated from the current base file, not an earlier cached
    version.
  registerCalls:
    - "King Sebastian / King Sebastião -> D. Sebastião throughout (standard pt-PT reference form for the monarch, not a title translation)"
    - "'Ceuta service' / naval skirmish -> 'escaramuça naval'; 'swordfight' -> 'duelo de espada' (period-appropriate, not a modern 'luta')"
    - "'demi-monde' (Cartas synopsis) -> 'meios boémios de Lisboa' rather than a narrower reading limited to prostitution, since the English term covers Lisbon's wider disreputable/bohemian fringe"
    - "'hospital's ward for the lovesick' -> 'enfermaria dos apaixonados'"
    - "Latin epitaph ('Ingrata patria...') kept in Latin; only its English gloss was translated, to 'Pátria ingrata, não possuirás os meus ossos'"
    - "'Sôbolos rios que vão' and all original Portuguese work titles carried through unchanged, never re-translated"
  spoilerAuditCrossCheck: >
    Re-read .orrery/luis-de-camoes/spoiler-audit.yaml before translating;
    zero spoiler gates on this wing (verified, not an oversight), so no
    boundary needed preserving in the Portuguese prose either. Filodemo's
    synopsis stops at the premise in both languages, matching the
    audit's explicit instruction not to restate the play's two marriages.
verification:
  coverage: "python scripts/i18n_coverage.py --slug luis-de-camoes: pt-PT 358/378 before, 362/378 after; luis-de-camoes no longer appears in either MISSING or PARTIAL"
  validate: "python scripts/validate.py --slug luis-de-camoes: 0 errors, 2 pre-existing warnings (press-archaeology and art-rotation handoff word-count caps, unrelated to this stage)"
openQuestions: []
