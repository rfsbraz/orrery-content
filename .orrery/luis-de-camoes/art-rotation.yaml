stage: art-rotation
summary: >
  Graded all 11 events onto the organisation grammar (6 author lifeEvents,
  5 franchise events; eras.yaml stays empty, no plates to grade). Went from
  a flat 9/11 `beside` plateau to eight distinct organisations: beside 2,
  artifact-spread 2, immersion 2, full-bleed-vista 1, medallion 1,
  layered-stack 1, diptych 1, marginalia 1. `beside` sits well under
  LAYOUT.md's "around half" guidance (18% not ~50%) - a deliberate reading
  of this specific wing rather than a shortfall: three entries carry
  illustration types `beside` cannot hold at all (document-facsimile,
  manuscript-proof), two earn a loud rupture the life itself insists on
  (Mozambique, death), and two more (the national-myth medallion, the
  holiday-renaming diptych) are stronger, more specific fits than a plain
  beside would be. No content was rewritten - only organisation,
  illustration_type, images_required and (once) modifier, matching the
  stage's stated footprint.
produced:
  changedFiles:
    - content/authors/luis-de-camoes.yaml (6 lifeEvents graded)
    - content/franchises/luis-de-camoes/events.yaml (5 franchise events graded)
  organisationDistribution:
    beside: 2
    artifact-spread: 2
    immersion: 2
    full-bleed-vista: 1
    medallion: 1
    layered-stack: 1
    diptych: 1
    marginalia: 1
  contour: "#==#=#====."
  notableChoices:
    - id: camoes-ceuta-eye-1549
      organisation: full-bleed-vista / establishing-landscape
      why: >
        No birth event exists (born: null) so this is literally the wing's
        opening entry - full-bleed-vista's own Use line ("the opening of a
        period. A pause") fits without having to invent a birth to open on.
        Landscape only, per §3's ban on the wound/eyepatch standing in for
        his likeness already flagged in theme.yaml's avoid list.
    - id: camoes-returns-to-lisbon-1570
      organisation: immersion / portrait-of-absence
      why: >
        The two-year Mozambique marooning, near-loss of the manuscript and
        the stolen, never-recovered "Parnaso" collection is the life's
        biggest rupture short of death - impact: high, and immersion's "the
        total stop" is earned rather than decorative here. portrait-of-absence
        ("a person shown by what they left, never directly") reads the loss
        without staging a body or a wound.
    - id: camoes-lusiadas-published-1572
      organisation: artifact-spread / book-object
      why: >
        Moved off `mosaic` (now spent on the 1880 national-myth entry,
        a better fit for "public noise"). artifact-spread's own Use line
        ends "publication proof. Evidence." - exactly this moment - and its
        0.73 viewport share is also what keeps the two immersion cells
        (1570, 1580) from ever sharing a screenful with each other.
    - id: luis-de-camoes-national-myth-1880
      organisation: medallion / emblem-seal
      why: >
        medallion's Use line ("honours, memorials, membership, recognition,
        legacy, symbolic remembrance") is closer to what this entry actually
        is - a public monument plus a national commemoration that fixes his
        legacy - than mosaic's "sudden fame, controversy, press response"
        framing, which reads more as reception noise than as monument-building.
        Also load-bearing for pacing: keeping this entry mid rather than loud
        is what lets `luis-de-camoes-fanshawe-1655` sit safely at plain
        `beside` between the 1580 immersion and this entry without a
        two-loud-in-one-screenful violation.
    - id: luis-de-camoes-dia-de-portugal-1978
      organisation: diptych / symbolic-still-life
      why: >
        The entry is explicitly a before/after - the same 10 June date
        carrying the Estado Novo's "Dia de Camões, de Portugal e da Raça"
        framing, then the 1978 law's "Dia de Portugal, de Camões e das
        Comunidades Portuguesas" - diptych's Use line ("genuine before/after")
        names this exact shape. images_required: 2 per LAYOUT.md's diptych spec.
    - id: luis-de-camoes-rimas-1932-critical-edition
      organisation: layered-stack / manuscript-proof, modifier fold-reveal
      why: >
        "Two centuries of accretion" across multiple editions (65 sonnets in
        1595 to 352 by 1861) is accumulation, not a single document -
        layered-stack's Use line names exactly this ("multiple editions...
        years of revision") over artifact-spread's single-document case.
        fold-reveal earns its place on content: the 1932 edition claims to
        work from the 1595/1598 originals but "still leans on large parts of
        Faria e Sousa's own corrupted readings" - an upper layer that only
        partially reveals what's underneath it, which is fold-reveal's exact
        device ("the concealed layer visible enough to read the relationship").
  epigraphConsidered: >
    camoes-departs-for-india-1553 carries a sourced verbatim quote ("Ingrata
    patria, non possidebis ossa mea") that would make a clean epigraph.
    Left as `beside` / journey-transit instead: LAYOUT.md's epigraph schema
    repurposes the lifeEvent's own `title` field into the quote's attribution,
    which is a content edit beyond this stage's stated footprint
    (organisation/illustration_type/images_required/modifier only). A future
    pass that owns event prose can make that call; 1 of the epigraph cap's
    2-3 stays unspent here on purpose rather than force it through this
    stage's narrower footprint.
verification:
  - command: python3 scripts/art_rotation.py --check luis-de-camoes
    result: >
      "organisation rotation holds across all 11 events: no organisation over
      its cap, no neighbour repeats." / "pacing holds: no two loud cells
      touching or sharing a screenful, no plateau." Exit code stays 1 only on
      the composition axis (0 of 11 assets have an issue yet - expected on a
      freshly graded wing, not this stage's to fix per the skill).
  - command: python3 scripts/validate.py --slug luis-de-camoes
    result: >
      OK - 2211 works, 194 authors, 11 achievements, all references resolve.
      Only the pre-existing press-archaeology handoff-length warning remains,
      unrelated to this stage.
next: >
  Ready for /asset-prompt: 11 art issues to open (era plates: none, this wing
  has no eras). Read theme.yaml's art block for the shared visual language
  and this file's notableChoices for the organisation reasoning before
  drafting prompts; the diptych entry needs 2 sibling prompts (--slot 1/2),
  everything else needs 1.
