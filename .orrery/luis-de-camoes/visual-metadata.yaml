stage: visual-metadata
summary: >
  Sourced covers for 2/6 works and researched the author portrait, which
  stays empty. Os Lusíadas: Porto Editora's 2010 Portuguese paperback,
  chosen over Open Library's own representative cover for the work
  (a title-page scan carrying a visible library donation stamp). Cartas:
  "Contradança - Cartas e Poemas de Camões" (Guerra e Paz, 2011), the exact
  edition the work's own note already names as the first standalone
  collection of the letters. Rimas, Filodemo, Anfitriões and El-Rei Seleuco
  checked exhaustively (title search plus a full sweep of Camões's 450-work
  Open Library author page) and carry no cover on Open Library at all.
  Portrait: the file both Wikipedias and Wikidata (P18) use, "Camões, por
  Fernão Gomes.jpg" (the Retrato a Vermelho), is a 19th-century copy of a
  lost original with no documented history before an 1755 rediscovery
  resting on a hedged secondhand note, and unknown to Camões's own earliest
  biographers - not a verifiable life portrait, so left empty rather than
  shipped as though the attribution were settled. No stronger candidate
  exists. validate.py --slug luis-de-camoes stays at 0 errors; wing_digest
  covers 0/6 -> 2/6.
produced:
  portrait:
    subject: luis-de-camoes
    result: empty
    reasoning: >
      Checked and rejected: "Camões, por Fernão Gomes.jpg" (Wikidata P18,
      both en/pt Wikipedia infoboxes) - a copy made 1819-1844 of an original
      said to be signed/dated to 1573-1575, but with no continuous record
      before an 1755 "rediscovery" identified only by a note whose own
      writer hedges the claim, and never mentioned by Camões's earliest
      biographers (Pedro de Mariz, Manuel Severim de Faria). Also checked
      and rejected: "Anonimo - Camoes.jpg" (Commons, dated 1720, unknown
      author, 140 years posthumous) and every other portrait/engraving
      turned up by a Commons category and search sweep (Gérard, Meunier,
      Legrand, Pauwels, an 1854 engraving) - all explicit later imaginings,
      none claiming a life likeness.
  covers:
    added: 2
    list: >
      os-lusiadas (Porto Editora 2010 paperback, OL30674736M, ISBN
      9789720049568), cartas (Contradança, Guerra e Paz 2011, OL22337625W)
    rejected: >
      os-lusiadas's own Open Library "representative" cover (id 5943496,
      work OL848771W) - a title-page scan of the Imprensa Nacional facsimile
      with a visible "OFERTA" library stamp and accession seal, replaced
      with a clean edition from the same work's other 367 editions; a 1655
      Fanshawe English cover on the same work (id 14304151, wrong language
      for this work's own Portuguese-titled record); el-rei-seleuco's only
      real Open Library cover hits (ids 9447983, 6644716) - both belong to
      Júlio Dantas's own "adaptação a scena moderna" of the play
      (OL16833257W/OL15349653W, authored under a different Open Library
      author id), not the 1645 Camões comedy itself.
  emptyRemaining: >
    rimas, filodemo, anfitrioes, el-rei-seleuco - all confirmed cover-less
    on Open Library, not merely unsearched: every work-titled record found
    by direct title search plus a full offset-paginated sweep of Camões's
    450-entry OL author page carries no cover id. Consistent with this
    catalogue's other sparse pre-20th-century Portuguese wings (Saramago,
    Almeida Garrett) - a first-print play or a scattered lyric collection
    from the 16th-17th century has never had an illustrated edition Open
    Library scanned.
  toolCalls: "~45 (batched OpenLibrary/Wikidata/Commons/Wikipedia fetches, two WebSearch calls for the portrait provenance question, no per-URL sequential fetching)"
