stage: audit-fixes
summary: >
  Targeted follow-up on wing-audit.yaml's three routed findings. No stage
  re-run: direct edits against the base/overlay content and one bibliography
  correction, re-verified from primary sources rather than copied from the
  audit's own notes. validate.py stays 0 errors, i18n_coverage stays fully
  covered, aura_density's dark run shrinks from 211 years (1656-1866) to 90
  (1686-1775).
fixed:
  - id: ptpt-inline-refs-dropped
    finding: F1 (blocking)
    action: >
      Found 10 [[work:...]] links in the base files, not 8: 8 in
      content/authors/luis-de-camoes.yaml (4 in bio, 4 across lifeEvents)
      and 2 in content/franchises/luis-de-camoes/events.yaml's descriptions
      (fanshawe-1655, rimas-1932-critical-edition) - matching wing-audit's
      own "8 ... and 2 in events.yaml" count. Inserted the identical
      [[work:<id>|...]] markup at the equivalent point in each pt-PT
      sentence, translating only the display text after the `|`, in both
      content/i18n/pt-PT/authors/luis-de-camoes.yaml and
      content/i18n/pt-PT/franchises/luis-de-camoes/events.yaml. All 10 now
      present in both overlays; matched sentence to sentence against the
      base, not placed by guess.
  - id: standalone-filodemo-edition-exists
    finding: editions correction
    action: >
      Re-verified both counts by hand rather than trusting the audit's own
      note. (a) Livros Cotovia's 2004 "Filodemo" (ISBN 978-972-795-088-1,
      check digit re-verified valid) is a genuine standalone edition, but
      it is out of print, not unfindable: casadellibro.com lists it
      "Descatalogado por distribuidor," agapea.com "Sin existencias," and
      both AbeBooks and IberLibro show 0 copies (new or used) against this
      ISBN; wook.pt returned HTTP 403 to automated access (checked
      directly, twice) so could not be confirmed either way, but Livros
      Cotovia itself closed permanently in 2020-2021 (shop and site both
      shut), removing even a direct-from-publisher route, which is
      consistent with every other retailer's answer. Rewrote
      editions.yaml's OMNIBUS EXCLUSIONS note to say "out of print"
      rather than falsely claim no standalone edition was found; did not
      add an editions.yaml entry, since out-of-print is not a purchasable
      state. (b) Confirmed the Caixotim 2005 book is "Teatro Completo"
      (Caixotim Clássicos, Porto, preface/notes by Vanda Anastácio) - a
      three-play omnibus, not the standalone "Comédia de Filodemo" the
      prior note called it - and moved its mention into the
      omnibus-exclusion list alongside the E-primatur and Assírio & Alvim
      "Teatro" volumes it belongs with.
  - id: dark-run-1656-1866
    finding: F2 (press-archaeology)
    action: >
      Verified all three candidates independently (dates, publication
      details, and the specific claims) rather than copying works.yaml's
      existing mentions verbatim - one correction surfaced in the process
      (Faria e Sousa's edition was printed in Lisbon, not Madrid; Madrid
      was where he lived and worked, not where his son had the book
      printed after his 1649 death). Added three new franchise events to
      events.yaml (base + pt-PT), in the wing's existing 5-event schema
      and style, each carrying an inline [[work:...]] link per the F1
      convention:
        - luis-de-camoes-faria-e-sousa-1685: the corrupted Rimas text
          (Lisbon, 1685, published posthumously by his son Pedro).
        - luis-de-camoes-mickle-1776: Mickle's free, expansive "Epic of
          Commerce" translation, confirmed via an academic (SciELO)
          source as still the most-read English Lusíadas today, not just
          the works.yaml note's own claim.
        - luis-de-camoes-juromenha-1861: the Visconde de Juromenha's
          six-volume edition (1860-1869; sonnets volume specifically
          1861), which grew the Rimas from 65 to 352 sonnets.
      Updated events.yaml's header comment (base + pt-PT count line) to
      name the 1656-1866 span honestly - no longer omitted alongside
      1581-1654, 1881-1931 and 1979-2011 - and to state it is not actually
      dark, only the narrower gaps between the three new events remain
      quiet (1686-1775, 1777-1860, 1862-1866). aura_density.py's reported
      dark run drops from 211 years (1656-1866) to 90 (1686-1775), the
      longest genuinely quiet stretch left in the wing.
verified:
  - "validate.py --slug luis-de-camoes: 0 errors (2 pre-existing, unrelated warnings on press-archaeology.yaml and art-rotation.yaml handoff length)"
  - "i18n_coverage.py: luis-de-camoes does not appear in the PARTIAL list - full pt-PT coverage holds with the 10 new links and 3 new events"
  - "aura_density.py luis-de-camoes: 6 works, aura 11 -> 14, longest dark run 211 yrs (1656-1866) -> 90 yrs (1686-1775)"
