stage: eras
summary: >
  eras: [] - the correct, complete outcome, now tested rather than inherited.
  Camões scholarship does not periodise his career, and the bibliography could
  not carry such a periodisation even if it did: only Os Lusíadas (1572) was
  printed in his lifetime, so every phase a biography marks out closes before
  the first work's published year. The array was already empty; the header
  comment was rewritten with the sourced reasoning and the near misses.
produced:
  eras: []
  changedFiles:
    - content/franchises/luis-de-camoes/eras.yaml (header comment only; array unchanged)
verdict:
  proposed: "(none)"
  rung: "no rung holds - author framing, critical consensus, fandom and the publishing record each tested"
  boundary: "n/a - no boundary both has provenance and contains a work"
  reasons:
    - "Published years are 1572, 1587, 1587, 1595, 1645, 2011; he died 1580. Any life-derived era (Ceuta, the seventeen years in Portuguese Asia, the 1570 return) spans years holding zero works."
    - "The lyric is undatable and its canon unfixed by scholarly disagreement: Berardinelli (1980) gathers the ~400 poems ever attributed and declines to say which are his; Azevedo Filho (1985-2001) admits a 'corpus minimo' of 133 sonnets. Neither yields a composition chronology."
    - "The one received division of the lyric is formal, not temporal: medida velha vs medida nova, both worked across his whole life, and internal to a single work entry (Rimas)."
    - "Rung 4 rejected on fit, not truth: 'one work in his lifetime, five posthumous' is real, but nobody calls the posthumous printings a period, and the span would run 1587-2011."
  nearMisses:
    - "Landeg White's Collected Lyric Poems (Princeton) orders the poems by Camões's travels - the translator's arrangement of one volume, presented as a reading, not a received periodisation."
    - "pt.wikipedia's 'fase inicial tipicamente clássica' turning manneirist belongs to the Renaissance-vs-Maneirismo argument; no date, no named period, and a live critical position we cannot assert."
  languages: [pt-PT, pt-BR, en]
  sourcesThatRefused:
    - "britannica.com Camões biography and Literary-works - 403 to fetch.py and WebFetch"
    - "luisdecamoes.pt (Diretório de Camonística) - TLS hostname mismatch"
    - "aedah.pt 'Vida e obra de Luís de Camões' PDF - 403"
    - "aeaveiro.pt copy of Azevedo Filho's Introdução à Lírica de Camões - 404 (used at second hand)"
    - "pt.wikipedia has no 'Lírica de Luís de Camões' or 'Rimas (Camões)' article; the lyric sits inside the main biography"
  notReachable:
    - "Saraiva & Lopes and Hernâni Cidade are print-only; probed via academic citation, which cites them on canon and letter attribution, never on a periodisation."
forStages:
  art-rotation: "No era plates exist to rotate. Rotation for this wing is the four author lifeEvents only."
  visual-language: "No eras to describe; the art language carries the wing from the six works and the lifeEvents alone."
  wing-audit: >
    Do not read "no eras" as a coverage gap. The eras skill's rule 4 overrides
    wing-audit's "era coverage gaps" finding - provenance outranks tidiness,
    and an era invented to fill this hole would be worse than the hole. The
    reasoning and sources are in the content file's header comment.
  translation: "eras.yaml has no translatable strings; no pt-PT overlay is needed or affected."
openQuestions:
  - >
    Britannica refused every fetch, and it is the one high-value tertiary
    reference unread here. Nothing in the Portuguese scholarship suggests it
    periodises, but a pass with working access should check its Literary works
    section before treating the negative as final.
