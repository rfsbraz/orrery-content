stage: visual-language
summary: >
  Settled theme.art on top of franchise-research's sun-bleached-carta
  concept (pale, salt-bleached driftwood ground, verdigris accent) and the
  tested-negative eras. Six fields written: an emblem of a salt-crusted,
  cockled manuscript quire clasped with a verdigris-touched brass fastening
  (the Mekong-shipwreck legend the palette itself is built on); motifs drawn
  from the actual bibliography and life record rather than maritime genre
  furniture - sun-bleached manuscript pages, a colonial estate-administrator's
  ledger (the Provedor-mor dos Defuntos e Ausentes post), weathered ship
  fittings, a fragment of classical statuary standing for the epic's Olympian
  machinery, a monsoon tropical coastline named by its actual places (Goa,
  Macau, the Mekong mouth, Mozambique Island), and a shuttered courtyard
  interior for the plays and letters; atmosphere of glare, dry heat and
  exposure rather than gothic interior or postcard tropics; a dip-pen line
  that runs sun-dry and stipples out at the end of each stroke rather than
  holding one weight; sun-bleached laid paper with a salt-mineral bloom, no
  wet wash; verdigris confined to one small oxidised-metal element per image;
  and an avoid list naming ship-in-a-bottle, age-of-sail costume drama,
  compass-rose kitsch, postcard-tropical imagery, and (per docs/VISUAL.md
  §3) any bandage or eyepatch standing in for the author's own lost eye.
produced:
  file: content/franchises/luis-de-camoes/theme.yaml
  field: art
  fields_written: [emblem, motifs, atmosphere, lineCharacter, backgroundTexture, accentUse, avoid]
  collision_check:
    tool: scripts/theme_digest.py --exclude luis-de-camoes
    adjacent_wings_read_in_full:
      - joao-tordo   # Atlantic-editorial: nearest neighbour by "the sea is in the record"
      - almeida-garrett  # unmerged wing/almeida-garrett branch, read via git show for its art block shape and Lusophone collision set
    verdict: >
      No collision. joao-tordo is near-black, wet, nocturnal, rain-bled
      Lisbon winter with a wet-brush bleeding line - this wing is pale, dry,
      sun-bleached, tropical daylight with a disciplined dip-pen line that
      dries out rather than bleeds; both the atmosphere and lineCharacter
      fields name that difference explicitly so a future prompt writer does
      not drift toward it. The other six Lusophone wings (parlour mauve,
      teal desk, volcanic basalt, umber village, sunbaked wheat-gold,
      gaslit theatre) are all interior or landscape dark-ground registers
      with no daylight-open-sea equivalent, which is the gap this wing's
      palette already committed to filling.
verification:
  - command: python3 scripts/validate.py --slug luis-de-camoes
    result: "OK - only the pre-existing press-archaeology word-count warning remains; the theme.art error is gone"
  - command: python3 scripts/asset_audit.py luis-de-camoes
    result: "art:yes; 11 jobs now listed (6 life-event, 5 franchise-event)"
next: >
  Ready for the next pipeline stage to write asset prompts against this
  art block (era plates first per docs/VISUAL.md §7, though this wing has
  no eras to plate; life events then franchise events, each with the anchor
  image once one exists).
