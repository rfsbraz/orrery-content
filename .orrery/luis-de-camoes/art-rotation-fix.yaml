stage: art-rotation-fix
summary: >
  Re-graded the 3 franchise events audit-fixes added (faria-e-sousa-1685,
  mickle-1776, juromenha-1861), which had landed with organisation values
  that either repeated a neighbour or left the run flat: a 7-consecutive-mid
  plateau from fanshawe-1655 through dia-de-portugal-1978, with
  faria-e-sousa-1685 also repeating 'beside' from fanshawe-1655 right next
  to it. Fixed by re-grading the 3 new events plus one existing neighbour
  (national-myth-1880) that the plateau math required touching; no other
  event changed.
changes:
  - id: luis-de-camoes-faria-e-sousa-1685
    from: "beside / book-object"
    to: "artifact-spread / book-object"
    why: >
      Was repeating fanshawe-1655's 'beside'. Faria e Sousa's rewritten Rimas
      is a flawed textual artifact that stood as the base text for two
      centuries - artifact-spread's own Use line ("publication proof.
      Evidence.") fits a wrong turn presented as exhibit A better than the
      generic workhorse cell.
  - id: luis-de-camoes-mickle-1776
    from: "floating-object / book-object"
    to: "beside / book-object"
    why: >
      floating-object's Use line ("a keepsake, a ticket... a minor beat") is
      the wrong register for a translation that stayed the most-read English
      Lusíadas for over a century - not a small private object. Plain
      beside fits an ordinary, medium-weight reception event and breaks
      neighbour ties on both sides (faria-e-sousa now artifact-spread,
      juromenha now layered-stack).
  - id: luis-de-camoes-juromenha-1861
    from: "artifact-spread / document-facsimile"
    to: "layered-stack / archive-stack"
    why: >
      The event's own content is quantity, not a single document: sonnets
      65 -> 352 across a six-volume edition built on manuscript songbooks
      "barely studied before." layered-stack's Use line ("multiple editions
      ... years of revision. Quantity - versus artifact-spread's single
      document") names this shape directly, the same accumulation register
      the original stage used for the 1932 critical edition. Left plain
      (no fold-reveal): 1932's modifier reads a text that half-conceals what
      it claims to fix; Juromenha's own act is inflation, not concealment,
      so borrowing the modifier would blur two different failures into one
      picture. Not adjacent to 1932's layered-stack (national-myth-1880
      sits between), so the repeated organisation is a rhyme, not a
      neighbour violation.
  - id: luis-de-camoes-national-myth-1880
    from: "medallion / emblem-seal"
    to: "mosaic / press-media-collage"
    why: >
      Only neighbour touched outside the 3 new events, needed to break the
      plateau rather than to fix a bad original call - the art-rotation
      stage picked medallion specifically to keep this entry mid, load-
      bearing for pacing at the time. Three new mid events now sit between
      it and the 1580 immersion, which was the only thing medallion's
      choice was protecting against, so the original tension is gone and
      mosaic's own fit (a statue by public subscription, a nationwide
      tricentenary run by five named intellectuals, a royal decree - "many
      voices at once") can be used instead. This is what turns the run of
      7 mid cells into 4 mid / 1 loud / 2 mid, clearing the plateau.
contour:
  before: "#==#=#=======."
  after: "#==#=#====#==."
verification:
  - command: python3 scripts/art_rotation.py --check luis-de-camoes
    result: >
      "organisation rotation holds across all 14 events: no organisation
      over its cap, no neighbour repeats." / "pacing holds: no two loud
      cells touching or sharing a screenful, no plateau." Exit code stays 1
      only on the composition axis (0 of 14 assets have an issue yet - not
      this stage's to fix per the skill).
  - command: python3 scripts/validate.py --slug luis-de-camoes
    result: >
      OK - 2211 works, 194 authors, 11 achievements, all references
      resolve. Only the 2 pre-existing handoff-length warnings remain
      (press-archaeology.yaml, art-rotation.yaml), unrelated to this fix.
next: >
  Ready for /asset-prompt on the 3 new events plus national-myth-1880 (its
  organisation and illustration_type changed, so its art issue needs
  reopening against the new spec if one already exists). Everything else
  in the wing is untouched.
