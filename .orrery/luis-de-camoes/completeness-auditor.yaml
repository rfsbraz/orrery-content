openQuestions:
  - >
    Cartas' published year (2011) follows the same convention this wing
    already uses for Rimas: dated to the first time the corpus was gathered
    and printed as its own dedicated thing, not to the fuller edition that
    followed. The 2011 "Contradança - Cartas e Poemas de Camões" (Guerra e
    Paz) is sourced on its own publisher's explicit "pela primeira vez em
    edição própria" claim; a curator who weighs that differently against the
    fuller, more scholarly 2024 Madamu edition (which some retail listings
    describe as the definitive collection) can move the date without
    disrupting anything else in the wing - the derived order is unaffected
    either way, since Cartas sits last regardless.
  - >
    The exact number of authentically-Camonian letters is unsettled across
    sources consulted (4 firmly, a 5th disputed by its own editors, a 6th
    only since 2022; the government's own 2024 commemorative account still
    says "three or four"). Recorded as unsettled in the work's note rather
    than picking a number.
  - >
    El-Rei Seleuco's authorship dispute (Camões vs. a closer stylistic fit
    to Gil Vicente per some critics) remains open and is not this stage's
    call - only the print-date confusion (1616/1645/1654) was resolved, with
    primary-source evidence (the 1645 printer's own dedication, and the 1616
    edition's documented two-comedy contents) showing 1616 and 1654 are both
    traceable errors rather than genuine rival datings.
  - >
    Checked for other missing top-level bibliographic categories via BNP's
    digital collection (221 Camões-authored records) - every item found is
    an edition or anthology of the same six works already catalogued (mostly
    Os Lusíadas and Rimas reprintings), nothing else surfaced.
