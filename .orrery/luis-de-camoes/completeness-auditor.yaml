  changedDates: []
  retieredWorks: []
forStages:
  eras: >
    Still empty by design per franchise-research's own header comment; Cartas
    (2011) doesn't change that reasoning, since it's a modern editorial
    compilation, not a life event to hang an era on.
  reading-orders: >
    Cartas needs no startHere entry - it's a minor apocryphal work, not an
