stage: completeness-auditor
summary: >
  5 works -> 6. Added Cartas (2011, apocrypha), his surviving prose
  correspondence, missing from the franchise-research pass entirely.
  Corrected and firmed up El-Rei Seleuco's note with primary-source evidence
  resolving its print-date dispute; date itself (1645) was already right.
  Verified the three excluded works (Parnaso, Disparates da Índia, Sátira do
  Torneio) against independent sourcing beyond Wikipedia; all three holds.
  No reorders: Cartas lands last in the derived chronological order.
