stage: pipeline-audit
summary: >
  Luís de Camões run: 2,128,935 tokens, 761 tool calls, ~9.98M ms agent
  wall-clock across 16 dispatched stages (14 scheduled + 2 follow-ups).
  Top three stages (franchise-research, press-archaeology, wing-audit) are
  34.4% of tokens. No death-by-fetches shape found (all stages sit in a
  2,100-4,200 tokens/call band; the baseline's 1,942 tok/call visual-metadata
  outlier did not recur - lookup.py appears to have been used as intended).
  One real footprint violation found, directly responsible for the run's
  second follow-up pass. All validate.py calls recorded in this wing's own
  handoffs were --slug-scoped; no catalogue-wide redundancy found.

