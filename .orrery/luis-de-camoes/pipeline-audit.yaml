findings:
  - id: F1
    priority: 1
    title: "audit-fixes wrote art-rotation's exclusive fields, forcing a second follow-up dispatch"
    what: >
      audit-fixes (commit 4184c1c) added three new franchise events
      (faria-e-sousa-1685, mickle-1776, juromenha-1861) to fill a
      1656-1866 sourcing gap wing-audit flagged, and set organisation,
      illustration_type and images_required on all three itself. Per
      author.md's footprint table those fields belong exclusively to
      art-rotation ("events.yaml ... the organisation / illustration_type /
      images_required / modifier fields"). audit-fixes is not on the
      footprint table at all - it exists under wing-audit's "trivial
      mechanical fixes" allowance, which does not cover assigning visual
      grammar to brand-new events without the full-timeline pacing view
      art-rotation's own pass requires.
      The values it picked were wrong: commit 2f2f015 (art-rotation-fix)
      records "a beside neighbour repeat and a 7-consecutive-mid plateau
      across fanshawe-1655 through dia-de-portugal-1978" caused directly by
      the three ungraded insertions, requiring a full second subagent
      dispatch to re-run art_rotation.py --check, re-grade the 3 events
      plus a 4th (national-myth-1880, medallion -> mosaic) to clear the
      plateau, and re-validate.
    evidence:
      - "commit 4184c1c: +organisation/+illustration_type/+images_required on all 3 new events, written by audit-fixes"
      - "commit 2f2f015 (art-rotation-fix) message: 'audit-fixes added 3 franchise events ... without a rotation pass, producing a beside neighbour repeat and a 7-consecutive-mid plateau'"
      - "author.md footprint table: art-rotation owns organisation/illustration_type/images_required/modifier exclusively"
      - "art-rotation-fix cost: 99,649 tokens, 27 calls, 311,960 ms - a full dispatched agent that exists only to fix this"
    proposedEdit:
      file: .claude/skills/audit-fixes/SKILL.md (or wherever the audit-fixes stage prompt/pattern lives)
      wording: >
        Add: "If this pass adds or restores any event to events.yaml, do not
        set organisation / illustration_type / images_required / modifier
        yourself - those fields belong to art-rotation. Either leave them
        unset and hand off to a follow-up art-rotation pass, or, if you must
        unblock validate.py in the same pass, run
        `python scripts/art_rotation.py --check` yourself before declaring
        done and fix anything it flags before finishing - the same
        obligation any stage that touches events already has."
      alsoConsider: >
        author.md's footprint table currently only documents stage
        ownership for the 14 named stages; it does not say what a
        wing-audit-triggered fix pass is bound by. Naming audit-fixes (and
        any future *-fix pass) as bound by the same footprint table it
        operates under, explicitly, would close this for every field, not
        just this one - the same shape would recur for a fix pass that adds
        a work and sets its own images: or synopsis:.
    expectedSaving: >
      ~99,649 tokens, 27 calls, and one full agent dispatch (~312k ms)
      avoided on any future wing where a fix pass adds events - this is not
      a one-off, the trigger (wing-audit finding a sourcing gap that's
      cheapest to fill with new events) will recur on other authors with
      long posthumous tails.

  - id: F2
    priority: 2
    title: "franchise-research cost is driven by sourcing difficulty, not wing size"
    what: >
      franchise-research was the single most expensive stage (294,460
      tokens, 96 calls) despite this being one of the smallest wings built
      (5 works at scaffold time, 6 after completeness-auditor) - and its
      cost is within 1.3% of the John Shirley baseline run's
      franchise-research (290,845 tokens, 90 calls), a wing of unknown but
      presumably larger size. The handoff (.orrery/luis-de-camoes/franchise-research.yaml)
      shows why: three works rejected on sourced authorship-contestation
      grounds (Disparates da Índia, O Parnaso, Sátira do Torneio, each
      argued individually against a named precedent from another wing), a
      born: null entity that required checking rather than assuming, a
      rejected naming claim ("queimados"/"esganados" for the 1572
      editions) chased down against a 2024 critical edition and replaced
      with sourced terminology, and two lifeEvents (Ceuta injury, Mekong
      shipwreck) deliberately left dateless because sources disagree on
      the year and on core facts. None of that scales with work count; all
      of it scales with how contested and thinly-documented the source
      material is.
    evidence:
      - "this run: 294,460 tok / 96 calls, 5-6 works"
      - "John Shirley baseline (SKILL.md): 290,845 tok / 90 calls"
      - ".orrery/luis-de-camoes/franchise-research.yaml: 3 individually-argued exclusions, 1 rejected-naming chase, 2 dateless lifeEvents by design"
    proposedEdit: >
      No skill-file change proposed - this is a genuine cost-of-quality
      finding, not a process gap. Worth recording as a standing note in
      pipeline-audit's own SKILL.md baseline section (alongside the John
      Shirley numbers) so a future audit doesn't re-derive it: "franchise-research's
      cost tracks source contestation, not work count - a 5-work wing with
      a legendary/disputed biography can cost as much as a 40-work wing
      with a settled one. Do not propose shrinking this stage's budget on
      small-wing evidence alone."
    expectedSaving: "none proposed; this finding argues against a cut, not for one."

  - id: F3
    priority: 3
    title: "editions' 65 calls for 3/6 works is proportionate, not under- or over-searched"
    what: >
      editions (179,055 tokens, 65 calls, 2,755 tok/call) landed editions
      for only 3 of 6 works, but the handoff shows this was a real-coverage
      finding, not a shortfall: scripts/metadata/lookup.py's TSV "yielded no
      usable ISBN candidates once self-published Os Lusíadas reprints
      (Independently Published, Lulu, Creative Media Partners) were
      filtered out," forcing direct fetches against four Portuguese
      publisher sites (Porto Editora, Guerra e Paz, Assírio & Alvim,
      E-primatur). The three plays (Filodemo, Anfitriões, El-Rei Seleuco)
      were excluded for a documented reason - every source found for them
      is a multi-play omnibus under one ISBN, which the catalogue's
      standing rule against omnibus-ISBN-as-single-work-edition correctly
      excludes - not because search stopped early. tokens/call (2,755) is
      lower than the baseline editions stage (4,670), so the lookup.py-first
      workflow is doing its job even where its output needed heavy manual
      follow-up.
    evidence:
      - ".orrery/luis-de-camoes/editions.yaml: 6 named excluded-candidates with reasons (out of print, wrong-market ISBN prefix, omnibus)"
      - "this run: 2,755 tok/call vs John Shirley baseline editions: 4,670 tok/call"
    proposedEdit: "none - already fine."
    expectedSaving: "n/a"

alreadyFine:
  stages:
    - name: visual-metadata
      why: "2,691 tok/call vs baseline's 1,942 tok/call at nearly 3x the calls; lookup.py-first workflow evidently followed, no death-by-fetches shape."
    - name: editions
      why: "see F3."
    - name: press-archaeology, world-events, eras
      why: "ran concurrently per the cost table note; each stayed within its own footprint (events.yaml/authors, events/global.yaml, eras.yaml respectively) with no cross-writes found in the commits checked."
    - name: event-resonance
      why: "cheapest stage in the run (47,647 tok, 16 calls); zero-candidate outcome recorded with reasoning (commit a2a6359), not silent."
    - name: validate.py usage
      why: "every --slug-taggable command found in this wing's own .orrery/*.yaml handoffs used --slug luis-de-camoes; no catalogue-wide validate.py call found in any handoff checked (art-rotation, visual-language, editions, translation-pt-PT, art-rotation-fix, audit-fixes, spoiler-audit, reading-orders, visual-metadata, wing-audit). The baseline's known 11-catalogue-wide-validation problem did not recur here."
    - name: press-archaeology's spoilerAfter:null
      why: >
        press-archaeology's commit (cf05abf) sets spoilerAfter: null on 7
        new lifeEvents/events while scaffolding them - spoilerAfter is
        listed under spoiler-audit's cross-cutting footprint. Checked
        whether this was a violation: null is the unset/placeholder value
        required by the schema when an event is created, not an asserted
        spoiler ruling, and spoiler-audit's own pass (e9e5bbf) left it
        untouched with "no boundaries needed" - i.e. the placeholder was
        confirmed correct by the owning stage, not silently overridden by
        a non-owning one. Not counted as a violation.

unresolvedOrNotReached:
  - "Cross-run trend beyond the John Shirley baseline already in SKILL.md: did not run `gh pr list --state merged` for prior wing PR bodies (Eça de Queirós, Orhan Pamuk, James Patterson, Almeida Garrett) to compare franchise-research/editions costs across more than 2 data points - out of the 15-call budget this run. Worth doing in a pipeline-audit that isn't also chasing a footprint violation."
  - "Did not check ordering/parallelism claims (press-archaeology/world-events/eras concurrent, visual-metadata/editions concurrent) against actual file-touch disjointness beyond the footprint table - took the cost-table note's word for it."

recommendationsSummary:
  - "F1 (priority 1, footprint violation + process gap): audit-fixes must not set organisation/illustration_type/images_required/modifier when it adds events; either leave them for a follow-up art-rotation pass or self-check with art_rotation.py --check before finishing. Saves ~100k tokens and a full agent dispatch on any future wing whose audit-fixes pass adds events."
  - "F2: no change - franchise-research's cost is source-contestation-driven, not size-driven; record as a standing baseline note so it isn't mistaken for waste on a future small wing."
  - "F3: no change - editions' effort was proportionate to real market coverage, not under-searched."
