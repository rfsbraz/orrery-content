forStages:
  visual-metadata: "la-ninfa-de-porcelana is now extended/picture-book, not core/novella - its river weight and any cover search should follow the other children's books, not the 20 novels."
  editions: "Amor's published year is contested (2011 her site vs 2012 LC record, see the work's own note) - do not assume either is settled when sourcing an edition."
  press-archaeology: "No change to the two flagged uncertainties (Salvador Allende family degree, US citizenship year) - out of scope here as instructed, both left exactly as handed off."

openQuestions:
  - "La ninfa de porcelana / La gorda de porcelana (1984): confirmed via its own English Wikipedia article (\"The Porcelain Fat Lady\", categorized as a children's book) and multiple Spanish sources calling it a \"cuento\" that this is a children's story, not a novella - moved core -> extended, format novella -> short synopsis rewritten to match the actual plot (Don Cornelio and the porcelain figure Fantasía), which the prior synopsis had wrong (invented a \"seller warns him\" beat not in any source). The 2017 reissue as a colouring book under the current title is a reissue of the same story, not a different work; published stays 1984."
  - "Amor (2012): the German-first-publication claim is corroborated (her own site's summary text says so outright), but the German edition's own year could not be found with the tools available this run. The Spanish year is itself contested between her site (2011) and the Library of Congress record for the first trade edition (2012, kept here). Worth a second pass with access to a German-language catalogue (DNB blocked automated fetches this run)."
  - "The 4 unpublished plays (1971-1975) and \"Dos Palabras\" exclusions both re-confirmed independently across English and Spanish Wikipedia - no source found anywhere suggests any of the plays were ever issued as books, and \"Dos Palabras\" is consistently the opening story inside Cuentos de Eva Luna, never separately published. Both exclusions hold."
  - "El Reino del Dragón de Oro's 2003-vs-2004 date is settled: Spanish Wikipedia's own dedicated article states 2003 explicitly as the publication date; the existing note correctly attributes 2004 to an English-edition/LoC-deposit artifact. No change needed."
  - "The 3 Perla books' English-original status rests only on the scaffold's original single source (her own site's book-page structure); OpenLibrary's edition records for Perla the Mighty Dog credit no translator on any language edition (English, Spanish, German, Italian, Dutch), which is consistent with but does not independently prove English-original composition. Not fully re-verified beyond that."
