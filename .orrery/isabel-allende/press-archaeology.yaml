    - allende-daughter-of-fortune-oprah-2000
rejected:
  - "1978 temporary separation from Miguel Frías: single-sourced (her own
    timeline, which Wikipedia's own citation for it also points back
    to). Held out."
  - "The Florida ban's district/court specifics: the one solid source
    (Infobae) doesn't give more; PEN America and English-language
    coverage weren't reachable this run."
  - "FOLLOW-UP - Isabel Allende Foundation program milestones in
    2004-2013 (a named lead): isabelallendefoundation.org failed TLS
    verification on every URL tried, and no Wayback snapshot gave dated
    program-level detail. A tooling gap, not a confirmed quiet stretch."
  - "FOLLOW-UP - Nicolás Allende's Jan. 1999 marriage to Lori Barra: real
    and dated but no stated bearing on any work or era; held out on
    editorial grounds."
  - "FOLLOW-UP - the Feb. 2003 Gonzalo Contreras 'commercial vs.
    literary' spat (La Tercera, corroborated via Wikipedia's own citation
    though the original link is dead): real but 2003 isn't one of the
    flagged silences (My Invented Country already covers it)."
  - "FOLLOW-UP - the 2007 TED talk 'Tales of Passion': considered for the
    2005-2009 stretch, but the 2006 Olympic flag-bearer fact closes that
    sub-run more cleanly (independently documented, not self-reported)."
forStages:
  eras: >
    1975 (flight) - 1988 (Gordon marriage, California) is exile properly
    speaking; 1990 (democracy restored) is when that changes personally.
    1996-2006 reads as a "memoir and mission" stretch bridging early
    fiction and the later historical novels. FOLLOW-UP: the new 2010
    National Prize entry ("years of being the eternal candidate," per La
    Tercera) is a "finally embraced at home" beat worth a look for
    whatever era covers 2004-2014.
  visual-language: >
    Existing lifeEvents lean document/place (letter, coup, exile,
    divorce, death, medal); only the birth needs a vista. FOLLOW-UP: the
    3 new lifeEvents are a ceremony, a public civic tableau (the Olympic
    flag, several named women), and an award reached by videoconference -
    same document/ceremony register. The 2 new franchise events are a
    book-object cell (1985 Knopf hardback) and a TV-studio cell (Oprah's
    Book Club) - both fictional-character-free, like the existing two.
openQuestions:
  - "Web search access ran out partway through both this stage's original
    run and this follow-up; everything added is sourced to a URL
    actually fetched and checked (200). A second pass with search could
    still find more for the Florida ban and might settle the citizenship
    tie-break outright."
  - "1977-1980 (4 years) remains the worst dark run, unchanged by this
    follow-up: ordinary Caracas day-jobs per her own timeline and the
    Guardian CV, read as genuinely quiet rather than under-researched."
  - "The Miguel Frías 1962 marriage date (her site) vs. Spanish
    Wikipedia's 1959+4=1963 arithmetic: unresolved, flagged for a later
    pass with a primary record."
  - "FOLLOW-UP - isabelallendefoundation.org is unreachable with this
    run's tooling (TLS cert failures). Worth a second look with working
    access or a search-engine query rather than a direct fetch."

auditFixesApplied:
  stage: audit-fixes-press
  branch: isabel-allende/audit-fixes-press
  summary: >
    Applied wing-audit's press-archaeology-owned findings against
    content/authors/isabel-allende.yaml, content/franchises/isabel-allende/
    franchise.yaml and both pt-PT mirrors. The 2010 National Prize title
    fix (wing-audit id national-prize-title-contradicts-its-own-description)
    landed on content/authors/isabel-allende.yaml's own lifeEvent, not
    content/franchises/isabel-allende/events.yaml: that event has never
    lived in the franchise events file, confirmed by grep; this handoff's
    own "produced.franchiseEventIds" list above never included it either.
  fixed:
    - id: dangling-cross-reference-in-rendered-prose
      what: >
        Rewrote both dangling rendered strings self-contained (bio's
        citizenship line, coup lifeEvent's cousin-degree line) in EN and
        pt-PT; neither references "see above" / "the header" anymore.
    - id: unsourced-nobel-claim
      what: >
        Cut "Nobel-adjacent" from franchise.yaml's description (curator's
        own recommendation) and removed pt-PT's upward-resolved "sempre
        cotada para o Nobel" entirely, both locales.
    - id: national-prize-title-contradicts-its-own-description
      what: >
        Retitled the 2010 lifeEvent "after months of campaigning" to match
        its own "months of open lobbying" description, in
        content/authors/isabel-allende.yaml and its pt-PT mirror (not
        events.yaml - see summary above).
    - missing: "Salvador-Allende-degree sourcing overclaim"
      what: >
        Header now states plainly that only the timeline and English
        Wikipedia's infobox state the degree directly, Levine corroborates
        the tie, and Ojito/NYT corroborates closeness only, not the degree.
    - missing: "uncle usage wider than documented"
      what: >
        Header now also records her own site's interview page (interviewer
        says "your uncle," uncorrected) and HarperCollins' jacket copy
        ("her uncle") alongside es.wikipedia's "tío segundo."
    - missing: "foundation founding year contested"
      what: >
        Added a header paragraph noting 1995 (her bio PDF) vs. December
        1996 (her timeline); content stays 1996-12 pending a tie-breaker.
    - stale: "1996 foundation event in the clear / four-strings miscount"
      what: >
        Header corrected to three ungated strings (bio, Paula's synopsis,
        La suma de los días' synopsis) and to note the foundation event
        itself only says "in her daughter's name," not the death outright.
  notFixed: >
    sept-11-2001-wrongly-excluded (event-resonance-owned),
    ninfa-synopsis-beat-not-in-the-story (completeness-auditor-owned) and
    translator-header-still-wrong (editions-owned) are out of this branch's
    footprint (content/works.yaml, content/franchises/isabel-allende/
    franchise.yaml globalEvents) and were left for their owning stages.
