stage: press-archaeology
summary: >
  Built 11 lifeEvents and 2 franchise events, closing five dark runs down
  to a worst case of 4 years (1977-1980). Resolved the Salvador Allende
  family-degree question as "first cousin." Checked the citizenship-year
  conflict (1993 vs. 2003) hard and left it genuinely unresolved.

  FOLLOW-UP: event-resonance's removal of six padding global events
  exposed three real silences (2004-2013/10yr, 1997-2002/6yr,
  1982-1986/5yr). Researched all three from the author's own record and
  added 5 more entries, each independently corroborated beyond her own
  timeline: lifeEvents for the 2004 American Academy of Arts and Letters
  election, the 2006 Olympic flag-bearer role at the Turin opening
  ceremony, and the 2010 National Prize for Literature (won after years
  of open lobbying, per La Tercera); franchise events for the 1985 Knopf
  English translation of La casa de los espíritus and the February 2000
  Oprah's Book Club selection of Daughter of Fortune. Distributed across
  the three windows, these brought every sub-run under 5 years; the
  wing's worst dark run is back to the original 1977-1980 stretch.
