    timeline, which Wikipedia's own citation for it also points back
    to). Held out."
  - "The Florida ban's district/court specifics: the one solid source
    (Infobae) doesn't give more; PEN America and English-language
    coverage weren't reachable this run."
  - "FOLLOW-UP - Isabel Allende Foundation program milestones in
    2004-2013 (a named lead): isabelallendefoundation.org failed TLS
    verification on every URL tried, and no Wayback snapshot gave dated
    program-level detail. A tooling gap, not a confirmed quiet stretch."
  - "FOLLOW-UP - Nicolás Allende's Jan. 1999 marriage to Lori Barra: real
    and dated but no stated bearing on any work or era; held out on
    editorial grounds."
  - "FOLLOW-UP - the Feb. 2003 Gonzalo Contreras 'commercial vs.
    literary' spat (La Tercera, corroborated via Wikipedia's own citation
    though the original link is dead): real but 2003 isn't one of the
    flagged silences (My Invented Country already covers it)."
  - "FOLLOW-UP - the 2007 TED talk 'Tales of Passion': considered for the
    2005-2009 stretch, but the 2006 Olympic flag-bearer fact closes that
    sub-run more cleanly (independently documented, not self-reported)."
forStages:
  eras: >
    1975 (flight) - 1988 (Gordon marriage, California) is exile properly
    speaking; 1990 (democracy restored) is when that changes personally.
    1996-2006 reads as a "memoir and mission" stretch bridging early
    fiction and the later historical novels. FOLLOW-UP: the new 2010
    National Prize entry ("years of being the eternal candidate," per La
    Tercera) is a "finally embraced at home" beat worth a look for
    whatever era covers 2004-2014.
  visual-language: >
    Existing lifeEvents lean document/place (letter, coup, exile,
    divorce, death, medal); only the birth needs a vista. FOLLOW-UP: the
    3 new lifeEvents are a ceremony, a public civic tableau (the Olympic
    flag, several named women), and an award reached by videoconference -
    same document/ceremony register. The 2 new franchise events are a
    book-object cell (1985 Knopf hardback) and a TV-studio cell (Oprah's
    Book Club) - both fictional-character-free, like the existing two.
openQuestions:
