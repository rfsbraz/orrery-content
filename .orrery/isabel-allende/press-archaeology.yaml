    still find more for the Florida ban and might settle the citizenship
    tie-break outright."
  - "1977-1980 (4 years) remains the worst dark run, unchanged by this
    follow-up: ordinary Caracas day-jobs per her own timeline and the
    Guardian CV, read as genuinely quiet rather than under-researched."
  - "The Miguel Frías 1962 marriage date (her site) vs. Spanish
