stage: eras
wing: isabel-allende
summary: >
  eras: [] - a documented negative, not an empty slot. No source in either
  language periodises this career. Four candidate shapes were tested against
  real sources and all four failed; the file records each rejection with its
  citation so nobody re-derives them. validate.py --slug isabel-allende: 0
  errors, the same 2 pre-existing warnings as before this stage (handoff word
  cap, no theme.art). No work was orphaned, because no span was drawn.

produced:
  - content/franchises/isabel-allende/eras.yaml

decisions:
  - "MAGICAL REALISM THEN REALISM: rejected on the author's own words. Her site's interview page has her listing the mode's presence book by book (absent from Of Love and Shadows, 1984; abundant in City of the Beasts, 2002) and rejecting the label for her work generally. Britannica keeps her 'in the magic realist tradition' with no end date. The mode alternates, so it draws no line."
  - "POST-BOOM: real periodisation, wrong object. It periodises Spanish American fiction, and her whole output sits inside it (Spanish Wikipedia's posboom classification; Lila McDowell Carlsen's chapter in A History of Chilean Literature, CUP 2021). Movement membership, not a career phase - the same verdict the Garcia Marquez wing reached on 'dictator novels'."
  - "TRILOGIA INVOLUNTARIA: correctly a subseries, and the arithmetic alone settles it. Members are 1982, 1998 and 2000, with sixteen years and seven other books between the first two; no span holds them without holding most of the shelf. The one book-length study of the three is Karen Wooley Martin's Isabel Allende's House of the Spirits Trilogy: Narrative Geographies (Tamesis, 2010), which treats them as a narrative unit, not a period."
  - "AFTER PAULA: the sharpest rupture in the life, and nobody has read it as one in the work. The scholarship is about the memoir (Linda S. Maier, Hispania 2003), not the catalogue. Her own timeline records the coma and the death as life events with no creative framing."
  - "Two further shapes recorded in the file so they are not re-proposed: the Venezuelan exile years 1975-1988 (a Wikipedia biography section, which the trap registry explicitly says is not a periodisation) and a historical-fiction turn from 2006 (contradicted by the shelf: it starts in 1998 and never becomes exclusive)."
  - "The book-length criticism is organised by novel (Cox, Critical Companion, Greenwood 2003) or by theme (Craig, Rewriting American Identity, Palgrave 2013). Neither has a period chapter, which is the strongest single negative available for a living author with no obituary to consult."

forStages:
  press-archaeology: "No era spans exist, so nothing constrains where lifeEvents fall. Two anchors already carry sourced dates from this stage's reading of her own timeline: Paula's porphyria coma (1991) and her death on 6 December 1992. Her site contradicts itself on the Foundation's founding year (the bio PDF says 1995 in one line and 1996 in another; the timeline says December 1996) - do not assert one without a second source."
  reading-orders: "Publication order is the only chronological frame this wing has; there is no era layer to align a path to."
  visual-language: "The wing will never render an era plate, so theme.art carries the whole visual load."
  translation: "eras.yaml is comment-only with no translatable strings; the pt-PT overlay has nothing to add here."

openQuestions:
  - "General web search was unavailable this build (the engines reachable from here all refused automated queries), so discovery ran on structured indexes instead: OpenAlex, Crossref, Dialnet, SciELO, OpenLibrary, Wikipedia and direct publisher and author URLs. That corpus is strong on scholarship and weak on the literary press. A human with a browser could usefully check the Spanish-language press retrospectives around the 40th anniversary of La casa de los espiritus (2022) for a periodisation this build could not see."
  - "Two sources refused automated fetches and were cited from catalogue records instead: Boydell and Brewer (403) for the Martin monograph, and Google Books (429 throughout) for phrase searching inside criticism. Neither gap changes the verdict; both are places to retest."
  - "isabelallende.com 200s every URL including invented ones, serving a navigation shell for anything unrouted. Size-compare against a known-good page before treating a fetch from that host as a hit."
