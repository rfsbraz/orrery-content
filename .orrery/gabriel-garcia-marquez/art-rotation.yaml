  pacingCheck: >
    Manually re-derived the loud/mid/quiet string against LAYOUT.md's own
    classification (immersion, full-bleed-vista, chapter-gate, mosaic loud;
    passage, interlude, marginalia, epigraph quiet; the rest mid) before
