stage: art-rotation
summary: >
  Re-derived the organisation/pacing judgment fresh across the whole merged
  timeline (19 lifeEvents + 8 franchise events + 1 era, 27 event sketches for
  the rotation/pacing count per LAYOUT.md's era-plate exclusion) now that
  theme.yaml's art block is finalized, rather than trusting press-
  archaeology's pre-assignment as-is - its own handoff said plainly it had
  been checked by hand but never run through art_rotation.py --check, since
  no art issues existed yet. Found the checker had never actually been run:
  garcia-marquez-writes-cien-anos-1965 (immersion) and garcia-marquez-fame-
  barcelona-1967 (full-bleed-vista) are consecutive with nothing between
  them, both loud, and land in one screenful - a real pacing violation the
  hand-check missed. Fixed by changing writes-cien-anos-1965 from immersion
  to diptych (see decisions). Also added modifier: fold-reveal to
  garcia-marquez-mala-hora-disavowed-edition-1962, the sourced event visual-
  language actually built the wing's emblem from (see decisions) - a fit
  that could not have been assigned before visual-language ran, which is
  exactly the re-check this stage exists to do. Every other organisation/
  illustration_type choice on the wing was walked by hand against LAYOUT.md's
  Holds lists and against the finalized torn-newsprint/foxed/hand-corrected
  visual language and held up; nothing else changed.
  art_rotation.py --check gabriel-garcia-marquez: 0 organisation-rotation
  problems, 0 pacing problems (the separate composition axis still reports
  1 problem - "0 of 28 assets could be read" - expected, since no art issues
  exist yet; not this stage's gate). validate.py --slug gabriel-garcia-
  marquez: 0 errors, 23 warnings, all pre-existing (eras-coverage gaps on
  works.yaml + three handoff word-count soft-caps), none new.
