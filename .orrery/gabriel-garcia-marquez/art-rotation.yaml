decisions:
  writes-cien-anos-1965-immersion-to-diptych: >
    Rather than downgrading fame-barcelona-1967 (the textbook full-bleed-
    vista case - LAYOUT.md's own "Use" line for that organisation is
    literally "arrival, migration, a new city, the opening of a period," and
    that is exactly what 1967 is), re-read what writes-cien-anos-1965 is
    actually made of: a private collapse (sold the car, wrote 18 months on
    credit) that becomes a public triumph (sold out its first print run in a
    week, defined the Boom). That is not one rupture, it is two states -
    LAYOUT.md's diptych spec names the exact shape ("genuine before/after -
    ... private then public") almost verbatim. diptych holds symbolic-still-
    life (unchanged from the immersion assignment) and is `mid`, which
    resolves both flagged pacing problems: the two loud cells no longer
    touch or share a screenful, and immersion drops to 1/27, well inside its
    1-2 cap, now spent on the wing's one unambiguous largest rupture (the
    2014 death) rather than split across two.
  disavowed-edition-1962-fold-reveal: >
    visual-language's emblem (finalized after press-archaeology's pass) is
    built directly from this event: "a single line... corrected by a human
    hand: a looser, slightly wet ink stroke struck through the printed
    words, a replacement pencilled above it" is the wing's own description
    of the 1962 proofreader's edit and its 1966 restoration. That could not
    have been weighed when press-archaeology assigned diptych/book-object,
    because theme.art did not exist yet. fold-reveal's spec - "an upper
    surface partially conceals a lower one..., the concealed layer visible
    enough to read the relationship" - describes this exact pair of editions
    once the emblem exists to compare it against, and diptych is on
    fold-reveal's compatible list. No other entry got a modifier: walked the
    rest of the wing against all five modifiers' compatible-organisation
    lists and use cases, and none earned its place the way this one does -
    adding one without a comparable reason would just be decoration.
  everything_else_unchanged: >
    The remaining 26 organisation/illustration_type pairs (of 28 total) were
    re-checked, not re-decided: each still fits its moment under the
    finalized newsprint/foxed/hand-corrected/gold-accent visual language
    (which governs surface treatment, not subject register), still holds
    correctly per LAYOUT.md, and still paces correctly per art_rotation.py.
    press-archaeology's own hand-check was right about all of them; the one
    thing it could not have caught without running the tool was the loud-
    adjacency, and the one thing it could not have caught before visual-
    language ran was the fold-reveal fit.
rejected:
  - >
    Considered leaving both 1965 and 1967 as loud and instead re-ordering
    which of the two is `immersion` vs `full-bleed-vista` (swap them).
    Rejected: swapping labels does not change adjacency or screenful
    overlap, and full-bleed-vista/place-portrait is a materially better fit
    for "moved to Barcelona for seven years" than immersion/place-related
    types would be (immersion's Holds do not include place-portrait at all).
  - >
    Considered adding a modifier to garcia-marquez-en-agosto-nos-vemos-
    published-2024 (artifact-spread/manuscript-proof, also an unfinished-
    manuscript story) since pull-focus is compatible with artifact-spread.
    Rejected: the emblem's corrected-line motif is specifically about a
    correction restored by a human hand, which is the 1962/1966 story, not
    the 2024 one (an unfinished draft published as-is, no correction). Using
    the same modifier on a second entry for a looser reason would blur the
    one deliberate echo rather than add a second one.
forStages:
  asset-prompt: >
    garcia-marquez-writes-cien-anos-1965 is now a diptych and needs two
    complete prompts, one per slot, per LAYOUT.md's n-images-means-n-prompts
    rule: panel 1 the private collapse (the sold car, the household on
    credit, symbolic-still-life register - draw the objects, not Mercedes or
    García Márquez as likenesses), panel 2 the public triumph (the finished
    book's sudden success). garcia-marquez-mala-hora-disavowed-edition-1962
    keeps its existing two book-object panels but now carries modifier:
    fold-reveal - the prompt for whichever panel represents the disowned
    1962 printing should compose it with the 1966 restoration's corrected
    text visible beneath/behind it per fold-reveal's spec, not as two
    independent covers. Every other entry's prompt brief is unchanged from
    what press-archaeology's organisation/illustration_type already implied.
  wing-audit: >
    Footprint is exactly the two files listed under produced, touching only
    the organisation/illustration_type/images_required/modifier fields named
    in this stage's remit - no lifeEvent text, date, or sourcing changed, and
    eras.yaml was read and re-verified but not written to (already correct).
    Both flagged issues here (the loud-adjacency, the emblem-echo fit) are
    now resolved and not open items for a later pass.
