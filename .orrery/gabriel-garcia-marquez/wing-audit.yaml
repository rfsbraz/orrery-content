stage: wing-audit
wing: gabriel-garcia-marquez
summary: >
  Every number below was re-derived from the artefact, not read off a prior
  handoff. Baseline: validate.py --slug 0 errors / 26 warnings (20 works
  outside every era + 6 handoff word-count caps); aura_density 25 works, 28
  aura, 1.12 per work, longest dark run 4 yrs (1972-1975), under the 5-year
  gate; art_rotation --check 0 organisation-rotation and 0 pacing problems
  (the third composition axis reports "0 of 28 assets could be read", which
  is the expected pre-art state and not this gate); i18n_coverage all six
  pt-PT files COMPLETE; 36 editions / 0 suspect ISBNs; 23 of 25 works carry a
  live cover, all 24 image URLs served a real image. Three defects reach a
  reader and are BLOCKING: a false dated fact in a rendered pseudonym note,
  reader-facing English prose in the pt-PT locale that every coverage check
  reports green, and an unsourced precedence claim. Two open editorial
  questions carried since completeness-auditor now have evidence behind them
  and a recommendation each. Two tooling defects found outside this wing.

produced:
  - >
    content/franchises/gabriel-garcia-marquez/theme.yaml - one mechanical
    fix only: art.lineCharacter's final continuation line was indented two
    spaces past the block, so the folded scalar parsed with a hard newline
    and two leading spaces before "line." Re-indented; the string now folds
    to a single paragraph. No word changed.

blocking:
  - id: septimus-pseudonym-note-wrong-decade
    owner: press-archaeology
    where: >
      content/authors/gabriel-garcia-marquez.yaml, pseudonyms[0].note; mirrored
      in content/i18n/pt-PT/authors/gabriel-garcia-marquez.yaml
    checked: >
      The note dates the Septimus byline to "the late 1940s". The wing's own
      lifeEvent garcia-marquez-barranquilla-group-1950, two entries below it,
      dates the same byline "from 1950 to 1952". The wing's own cited source
      settles it: English Wikipedia's Gabriel Garcia Marquez article reads
      "In 1948 and 1949, he wrote for El Universal in Cartagena. From 1950
      until 1952, he wrote a 'whimsical' column under the name of 'Septimus'
      for the local paper El Heraldo in Barranquilla." Verified against the
      raw wikitext, not a search snippet.
    found: >
      The note is wrong by a period and contradicts the event beside it. Its
      second clause, "before he wrote under his own name", is also doubtful:
      he was a bylined reporter at El Universal in 1948-1949, before Septimus,
      not after. pseudonyms[].note IS rendered to readers
      (orrery/components/about-the-author.tsx:83), so this is live prose, not
      a curator field. The pt-PT overlay faithfully translated the error
      ("no final da decada de 1940 ... antes de escrever com o proprio nome").
    action: >
      Correct to 1950-1952 and drop or re-source the "before he wrote under
      his own name" clause; re-mirror the pt-PT overlay in the same change.

  - id: debated-untranslated-in-pt-PT
    owner: translation
    where: >
      content/i18n/pt-PT/franchises/gabriel-garcia-marquez/orders.yaml -
      gabriel-garcia-marquez/tres-libros carries no `debated`
    checked: >
      orders.yaml's `debated` is rendered to readers by
      orrery/components/orders/order-selector.tsx lines 92-98, under the
      t("orders.debated") disclosure, and orrery/lib/content/index.ts:97 puts
      "debated" in PROSE_LISTS precisely so an overlay can translate it.
      Counted the catalogue: 21 wings carry `debated` in their base
      orders.yaml; 20 of them translate it in their pt-PT overlay. This wing
      is the only one that does not.
    found: >
      A Portuguese reader who opens "Tres livros, uma so historia" and expands
      the disclosure gets two paragraphs of English. The overlay's own header
      states the reason: "`debated` nao se traduz: e curador-facing ... e nao
      chega ao leitor", citing docs/SCHEMA.md. SCHEMA is what is wrong here
      (see stale.schema-debated-curator-facing). i18n_coverage.py reports this
      file COMPLETE because its PROSE map for orders.yaml is ["name",
      "rationale"] only - the identical failure its own inline comments record
      having already shipped twice, for eras `themes` and events `quote`.
    action: >
      Translate both `debated` strings into pt-PT and correct the overlay
      header's claim. Separately worth adding "debated" to i18n_coverage.py's
      PROSE map so the third instance is the last.

  - id: macondo-precedence-unsourced
    owner: completeness-auditor
    where: >
      works.yaml - ojos-de-perro-azul note ("Macondo's second recorded
      appearance in his fiction after La hojarasca") and la-hojarasca note
      ("Macondo's first appearance in his fiction")
    checked: >
      La hojarasca (book, 1955) and "Monologo de Isabel viendo llover en
      Macondo" (Mito, 1955) are both 1955. Spanish Wikipedia's Macondo article
      lists both and dates the Monologo 1955, and establishes no order between
      them. No source consulted here orders the two within the year.
    found: >
      Both notes assert a precedence the record does not carry. spoiler-audit
      already flagged the synopsis/note mismatch on ojos-de-perro-azul; the
      audit-fixes pass softened the SYNOPSIS to "one of the earliest" but left
      the NOTE asserting "second", so the wing now hedges in the reader-facing
      field and asserts in the curator field, which is backwards. The
      audit-fixes commit (10ea372) states its own reasoning as "the
      collection's own note and eras.yaml both hold La hojarasca as Macondo's
      actual first appearance" - it resolved the contradiction by treating the
      wing's own unsourced note as the evidence, which is circular. The edit
      it made is still the right one; the note it deferred to is what needs a
      source or a hedge.
    action: >
      Soften both notes to what the record supports (both 1955, order not
      established), or cite a source that orders them. Cheap and safe either
      way; the synopsis is already correct.

missing:
  - id: translation-note-is-inert
    owner: curator (schema), then press-archaeology
    checked: >
      grep for `translationNote` across orrery lib/, components/, app/ and
      types.ts: zero hits. The Work type does not model it. docs/SCHEMA.md
      says so itself at the end of its own translationNote section ("It
      renders nowhere in the app yet").
    found: >
      The wing's single most interesting translation fact - Garcia Marquez
      reported to have called Rabassa's English better than his own Spanish -
      currently reaches no reader at all. See curatorsCall.translation-note
      for the recommendation.

  - id: erendira-aggregator-sources
    owner: completeness-auditor
    checked: >
      works.yaml/erendira cites xpressenglish.com and supersummary.com among
      its five sources. CURATION §4 rules aggregators out as sources. The
      claim they were carrying (that "El mar del tiempo perdido" belongs to
      this collection) is independently confirmed by the es.wikipedia article
      on the collection, which IS already cited on the same entry - re-checked
      directly against its raw wikitext, which lists all six stories exactly
      as works.yaml names them.
    found: >
      Two sub-bar citations sitting next to a good one. Drop them; the claim
      does not need them.

  - id: duas-solidoes-exclusion-undocumented
    owner: completeness-auditor
    checked: >
      editions found "Duas Solidões" (ISBN 9789722073301, Dom Quixote, 2021)
      credited to both García Márquez and Vargas Llosa and asked what it is.
      Established, and then verified against the catalogue records myself
      rather than the research summary. Biblioteca Nacional de Portugal
      (permalink
      catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&uri=full%3D3100024~!2086402~!0):
      "Duas solidões : o romance na América Latina / Gabriel García Márquez,
      Mario Vargas Llosa ; ed. Luis Rodríguez Pastor ; trad. J. Teixeira de
      Aguilar", Alfragide: D. Quixote, 2021, 1a ed, 175 p., ISBN
      978-972-20-7330-1, original title "Dos soledades. La novela en América
      Latina" - Vargas Llosa entered as co-autor, Rodríguez Pastor as ed. lit.
      The Spanish original is Alfaguara, April 2021, 168 pp, ISBN
      9788420454160.
      It is the transcript of a public dialogue the two men held in Lima in
      September 1967 under the Universidad Nacional de Ingeniería, and it is
      NOT a 2021 publication event: OpenLibrary OL5721508M records "La novela
      en América Latina: diálogo", C. Milla Batres, Lima, 1968, 58 p., LCCN
      70414703, with the note "The dialogue, sponsored by the Departamento de
      Extensión Cultural de la Universidad Nacional de Ingenieria, was held on
      September 4, 1967." Further re-editions in 1988 (Perú Andino) and 1991
      (UNI, 2a ed). The 2021 volume is the first commercial edition, expanded
      with a prologue by Juan Gabriel Vásquez, an editorial apparatus by six
      further contributors, two period interviews, a photo selection and
      Vargas Llosa's present-day assessment; the Portuguese edition adds a
      preface by Pedro Mexia. The dialogue itself is short - most of the 168
      pages is third-party material.
    found: >
      CORRECTLY EXCLUDED, but the exclusion is undocumented, and this is the
      one absent exclusion that will actually cost a reader something: a
      Portuguese reader browsing a Portuguese bookshop finds a 2021 Dom
      Quixote book under García Márquez's name that this bibliography does not
      list. It is exactly the trap-defusing note CURATION §2 permits.
      The grounds are already this catalogue's own, twice over: it is compiled
      and introduced by someone else rather than assembled by García Márquez
      (the stated basis for excluding Gabo periodista, "García Márquez habla
      de García Márquez en 33 grandes reportajes" and "Para que no se las
      lleve el viento"), and it is a multi-author volume in which his own
      words are one component among several (the stated basis for excluding
      Chile, el golpe y los gringos and the standalone La Soledad de América
      Latina). Be honest in the note about the one adjacent case that cuts the
      other way: El olor de la guayaba is also a book-length transcribed
      conversation and IS catalogued (extended, authorRole co-author). The
      distinguishing fact is that Guayaba was assembled and published as a
      book by its two participants, while this is a third-party editor's
      transcript of a single public event.
    action: >
      Add it to works.yaml's CONSIDERED AND LEFT OUT header with the BNP and
      OpenLibrary permalinks and the 1968-first-publication fact. Do not add a
      work entry. Recommend NOT adding an event either: the 2021 Alfaguara
      release was paired with a reissue of Historia de un deicidio and read by
      the press as a posthumous détente after the 1976 punch, which is
      genuinely tempting, but the wing already carries three Vargas Llosa
      entries (the 1971 thesis, the 1976 punch, the 2007 reissue) and a fourth
      would make one feud the loudest thing on the timeline.

  - id: achievements-absent
    owner: curator
    checked: >
      content/achievements.yaml holds 11 achievements catalogue-wide, none
      referencing this wing.
    found: >
      Absence is a legitimate state and generic badges are worse than none.
      But this wing has two specific, non-generic hooks another wing would
      not: a real received era holding exactly five books (macondo-cycle) and
      a curated order the author named himself (tres-libros). An era_reader
      against macondo-cycle with count <= 5 would be earnable and specific.
      Raised as an option, not a gap.

stale:
  - id: works-header-contradicts-eras
    owner: completeness-auditor
    where: works.yaml header, the "TRES DE MIS LIBROS" paragraph
    found: >
      It says the Macondo periodisation "belongs in eras.yaml rather than
      guessed at here (which is why eras.yaml names both shapes without
      claiming either)". eras.yaml does claim it - macondo-cycle ships with
      provenance: critical and three sources. Prose contradicting prose; the
      parenthesis was true before the eras stage ran and is false now.
      Two more in the same header: it calls itself "this draft", and it says
      the per-work translator information "belongs in editions.yaml's own
      translator field once that stage runs" - editions.yaml exists and
      carries it.

  - id: theme-notes-and-displayface-comment
    owner: visual-language
    where: theme.yaml `notes:` field and the inline comment on `displayFace`
    found: >
      `notes:` still ends "the full `art` block is visual-language's job once
      the bibliography and any eras are settled" - the art block is directly
      below it. The displayFace comment still reads "open to revision at
      visual-language once the full aura exists to weigh it against".
      visual-language ran, corrected the comment above `art:`, and missed
      both of these. Both are also CURATION §2 violations (naming a stage,
      addressing a future pass) inside content. See
      stale.validator-misses-half-the-stage-names for why nothing caught them.

  - id: schema-debated-curator-facing
    owner: curator (schema)
    where: docs/SCHEMA.md, end of the translationNote section
    found: >
      It calls `debated` on orders.yaml a curator-facing field that renders
      nowhere. It does render (order-selector.tsx:92-98). This exact sentence
      is what the pt-PT overlay cited when it declined to translate it.

  - id: aura-density-implements-a-removed-rule
    owner: curator (tooling)
    where: scripts/aura_density.py (and scripts/stage_plan.py, and .claude/skills/wing-audit/SKILL.md)
    checked: >
      docs/SCHEMA.md is explicit: "A global event renders on a wing if and
      only if that wing names it in `include`. There is no arithmetic default
      and no implicit membership", and "`exclude` gates nothing". The app
      agrees - orrery/lib/content/index.ts relevantGlobalEvents() filters on
      `include` alone. But aura_density.py still counts a global as reaching a
      wing when `lo_life <= year <= hi_life`, stage_plan.py still prints "~4
      still reaching", and this skill's own §2 still teaches the arithmetic
      default as current.
    found: >
      Catalogue-wide, aura_density.py inflates aura counts and understates
      dark runs on any wing whose franchise.yaml has no globalEvents block.
      Checked for THIS wing specifically and the number is unaffected: every
      global event inside 1927-2014 is either excluded or is
      ebook-and-self-publishing-2007, which is also the one `include`, so
      "reaching" is {ebook-2007} under both readings and the 4-year dark run
      stands either way.

  - id: validator-misses-half-the-stage-names
    owner: curator (tooling)
    where: scripts/validate.py, the PROCESS_COMMENT regex and its `note:` gate
    found: >
      The pipeline-vocabulary regex names franchise-research, completeness,
      press-archaeology, world-events, event-resonance, reading-orders,
      spoiler-audit, visual-metadata and wing-audit - but NOT visual-language,
      eras, art-rotation, editions, translation or asset-prompt. Both theme.yaml
      violations above say "visual-language" and pass clean. Separately the
      note-field scan matches `^-?\s*note:` only, so theme.yaml's `notes:`
      field is never scanned at all. A check that only ever produces reassuring
      output is not a check.

  - id: pr-body-carries-none-of-the-record
    owner: curator (the run's orchestrator)
    checked: >
      PR #860 ("Add the Gabriel García Márquez wing", draft, branch
      wing/gabriel-garcia-marquez, tracking issue #98). Its entire body is
      "Tracks #98." Zero comments.
    found: >
      Nine stages have run and the durable record of what they added,
      rejected, and could not source exists nowhere except in .orrery/
      handoffs, which CURATION §2 says are deleted before merge. CURATION §7
      makes the PR body the place the rejections and the curator questions
      survive. As it stands, the two editorial questions carried since
      completeness-auditor, the eras stage's unverified Harss lead, the
      one-sourced 1981 M-19 accusation and every documented exclusion vanish
      at merge. This is the staleness sweep's "curator questions raised and
      never answered" case, one step earlier: they were never raised where a
      curator would see them.

  - id: visual-metadata-coverage-arithmetic
    owner: none (handoff only, content is correct)
    found: >
      The visual-metadata handoff reports "22/25 works covered" and "extended
      13/13" while listing 12 extended titles. Re-derived from works.yaml: 11
      core + 12 extended + 2 apocrypha = 25; 23 carry a cover, 2 do not
      (en-agosto-nos-vemos, el-cataclismo-de-damocles). Real coverage is
      23/25, not 22/25. The content is right; only the report was not
      re-derived.

