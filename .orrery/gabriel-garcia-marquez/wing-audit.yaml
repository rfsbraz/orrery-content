notApplicableNotAbsent:
  - "20 of 25 works outside every era - the record periodises nothing after 1967."
  - "0 achievements - opt-in, and generic badges are worse than none (an option is raised above, not a gap)."
  - "0 spoilerAfter - eleven standalone novels, argued and documented by spoiler-audit."
  - "2 works with no cover - En agosto nos vemos (2024, no OL cover exists for any of its three ISBNs) and El cataclismo de Damocles (a 1986 speech pamphlet, OL work record has no covers field). Both checked directly."
  - "4 works with no edition - Obra periodistica (scholarly Spanish-only), Diatriba (no pt-PT found), and both apocrypha entries. Named in editions.yaml's own header."
  - "0 pt-PT edition for En agosto nos vemos, El olor de la guayaba, Vivir para contarla, Diatriba - real market gaps, not lookup failures."
  - "franchise.images.header unsourced - the field is declared in the schema and rendered by no app code."
  - "0 quote fields on events - no epigraph organisation is used anywhere on the wing."
  - "1 era rather than several - only one periodisation is received."

curatorsCall:
  - id: en-agosto-nos-vemos-canon-tier
    recommendation: KEEP core
    reasoning: >
      canonTier is defined by this catalogue, and restated in works.yaml's own
      header, as a publication-KIND judgement, not a fame, quality or
      authority one. En agosto nos vemos is a complete novel in his usual
      adult mode, released by Knopf and Penguin, over 250,000 pre-orders, a
      2024 New York Times bestseller. It had the most normal trade-book life
      of any book on this shelf. `apocrypha` here means "never had one" - the
      speech pamphlet and the unproduced screenplay. Demoting a bestseller
      into that tier would be using the tier to carry a moral judgement it
      does not express, and would break the tier's own stated definition on
      the same file where it is written down. The objection is real and it is
      an AUTHORITY question; the schema has no field for authorship
      authority, and inventing one is not a wing-level decision. The
      circumstance is already carried honestly and four times over: on the
      work's own note, on a high-impact franchise event, in the franchise
      description and in the author bio. Nothing is hidden by leaving the tier
      alone. One consequential edit if this ruling stands: the note's closing
      sentence ("worth weighing on its own terms rather than resolved by the
      general rule applied above") is an open question addressed to a reader
      of the pipeline, which CURATION §2 forbids in content - collapse it to
      the statement of fact once the call is made.
  - id: translation-note
    recommendation: MOVE it, and the reason is stronger than a taxonomy argument
    reasoning: >
      Two independent grounds, both checked. First, the field is inert:
      `translationNote` appears nowhere in the app's lib/, components/, app/
      or its Work type, and SCHEMA says so itself. Wherever this fact belongs,
      it currently reaches nobody. Second, it fails the field's own stated
      bar. SCHEMA defines translationNote for the case where "the divergence
      between translations is itself documented and consequential" - which
      English Dostoevsky, which English Cervantes - a choice the reader makes
      before any edition enters the picture. There is no such choice here:
      Rabassa's 1970 translation is the only English translation, and
      editions.yaml confirms it is still the one in print (Harper Perennial
      Modern Classics, 2025). A reader has nothing to decide. What the note
      actually contains is a reception anecdote about an author praising his
      translator, which is a fine fact in the wrong container.
      Recommended home: a franchise event dated 1970, owned by
      press-archaeology. It is CURATION §6 tier 4 (a reception rupture with a
      mark on the canon), it would render in the River where the current field
      renders nowhere, and 1970 currently carries no aura at all while Relato
      de un naufrago publishes into it. Note that events.yaml's header
      currently records the opposite decision ("The Rabassa translation
      anecdote stays on cien-anos-de-soledad's own translationNote in
      works.yaml rather than duplicated here") and would need updating with it.
      Weakest point in this recommendation: the anecdote is secondhand in both
      its sources, which the existing note states honestly and any event must
      keep stating.
  - id: erendira-cover-depiction
    recommendation: a design call, raised not routed
    reasoning: >
      Cover 39690 is the genuine 1979 Harper/Perennial "Innocent Erendira and
      Other Stories" jacket, correctly licensed, clean, and the right edition.
      Its illustration is a nude adolescent girl, which is the book's own
      subject. Nothing is wrong with the sourcing; whether the wing wants that
      image at the size the app renders covers is a judgement about the page,
      not about the data, and CURATION §5 says a design question goes to the
      curator with a browser rather than to a content stage.

