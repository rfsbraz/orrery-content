checkedAndClean:
  - >
    DARK-RUN GATE, re-derived by hand as well as by script. Publishing years
    run 1955-2024; aura years are 1927, 1950, 1955, 1958, 1959, 1961 (x2),
    1962, 1964, 1965, 1967, 1968, 1971, 1976, 1981, 1982, 1985, 1986, 1989,
    1994, 1999, 2002, 2007 (x2), 2012, 2013, 2014, 2016, 2019, 2024. The only
    run of 4+ dark publishing years is 1972-1975, between the 1971 thesis and
    the 1976 punch. 4 < DARK_RUN_LIMIT 5, the script prints no "<--" marker
    and no flag line. GATE GENUINELY SATISFIED. Note it sits one year off the
    gate, and press-archaeology's own handoff flagged that risk itself.
  - >
    GLOBALEVENTS IDS. Loaded content/events/global.yaml (19 entries) and
    checked every id in include and exclude against it programmatically: 1
    include, 15 exclude, 0 nonexistent ids. The fabrication regression from
    the first event-resonance attempt is genuinely corrected. The 3 unruled
    ids (elementary-education-act-1870, world-war-i-1914, pulp-magazines-1926)
    all predate his 1927 birth, and under include-only semantics silence is
    the correct state for them.
  - >
    MACONDO CYCLE MEMBERSHIP. Re-derived from works.yaml: works published
    1955-1967 are exactly La hojarasca (1955), El coronel (1961), La mala hora
    (1962), Los funerales de la Mama Grande (1962) and Cien anos de soledad
    (1967) - five, matching the era's own count and orders.yaml's claim that
    nothing else in this bibliography falls in that span. The next work is
    1970. Both load-bearing claims hold arithmetically.
  - >
    THE MACONDO CYCLE'S SOURCE, read rather than trusted. Fetched the
    Cambridge Core page for Raymond Leslie Williams, "Cien años de soledad and
    the Macondo Cycle", chapter 2 of A Companion to Gabriel García Márquez
    (Boydell & Brewer, pp. 33-76, DOI 10.1017/9781800105331.003) and extracted
    its text. Both quotations eras.yaml attributes to it are verbatim and not
    laundered: the abstract reads "This novel was the culmination of the
    'cycle of Macondo' fictions that García Márquez began constructing in the
    early 1950s and continued to elaborate, in short fictions and novels,
    until 1967", and the chapter body contains "The five books of the cycle of
    Macondo made that observation prophetic." The term, both endpoints and the
    count of five are the critic's, not this catalogue's.
  - >
    THE DICTATOR-NOVEL REJECTION, confirmed from the same artefact. eras.yaml
    claims the Companion "pairs that novel with the political writings rather
    than with El general en su laberinto". The book's own contents list, read
    off the same page, reads: "1 García Márquez, the Modernists, and the Boom
    / 2 Cien años de soledad and the Macondo Cycle / 3 El otoño del patriarca
    and the Political Writings / 4 ... cándida Eréndira y de su abuela
    desalmada / 5 Recent Writing / 6 Epilogue". The claim is exact. One
    honest nuance to record rather than route: that contents list DOES divide
    the post-1967 career into three blocks, and chapter 5 is called "Recent
    Writing". Under this catalogue's own rule that a book's chapter headings
    are not a periodisation (CURATION §4, stated there for Wikipedia section
    headings), none of that is a named, dated phase, so eras.yaml's conclusion
    stands - but its wording, "no critic, reference work or obituary divides
    the later career into named phases", is a shade stronger than the evidence.
    "Names no dated phase" would be exactly true.
  - >
    THE GUARDIAN OBITUARY, checked directly rather than via the eras handoff.
    Nick Caistor's 17 April 2014 obituary uses "period" four times and every
    one is a historical period, not a creative one: his early childhood, "the
    period of political violence in the 1950s", "his period in exile during
    the 1950s". It names no phase of the writing career. eras.yaml's use of it
    is accurate.
  - >
    STARTHERE SOURCING, spot-checked against the live pages rather than the
    handoff. All four phrases quoted from the LA Times guide ("Start with the
    stories", "intimidated by the legend", "exemplary collections",
    "primer-like") are present on latimes.com, and all four from the Penguin
    guide ("Before you start", "first appearance of Macondo", "Leaf Storm",
    "Innocent") are present on penguin.co.uk. Received, not coined.
  - >
    ERAS COVERAGE. 20 works fall outside every era and validate.py warns on
    each. This is NOT APPLICABLE, not absent: eras.yaml's header states the
    negative result and cites the Guardian obituary as a career retrospective
    that names no phase. Per the eras skill's provenance rule, an honestly
    uncovered career outranks tiling. Do not close it by adding a span.
  - >
    PERIOD FORMAT. The one era's `period` is "1955-1967", a form the strata
    walk parses. One era means no overlap is possible.
  - >
    CAPABILITIES. features is {}, so all four are auto. Checked each against
    orrery/lib/content/capabilities.ts: river needs timeline.length > 0 (28),
    wizard needs startHere.paths.length > 0 (2), companion needs
    timeline.length > 0 (28), editions needs editions.yaml (36 editions across
    21 works). No capability lights up on empty data; none is forced off over
    a layer that has since filled.
  - >
    THEME AGAINST THE APP'S OWN REGISTRY, not just SCHEMA. orrery/lib/theme.ts
    DISPLAY_FACES implements fraunces, spectral, sourceSerif and
    instrument-serif; SIGNATURES implements beam, thread, rule, filament,
    none. `spectral` and `beam` are both real and will render as chosen.
    Contrast recomputed from the hex values: ink/bg 14.1:1, ink/surface
    12.1:1, muted/surface 4.82:1 (the palette comment claims 4.8 AA and is
    accurate), muted/bg 5.62:1, accent/bg 7.59:1. Readability floor met
    everywhere. theme.palette is consumed by lib/theme.ts:57; `preset` /
    `themePreset` are typed as bare strings and read by no app code, which is
    a catalogue-wide known state, not this wing's defect.
  - >
    TRANSLATION FRESHNESS against the three post-spoiler-audit fixes. Read the
    pt-PT works overlay directly: el-amor gives "atraves do casamento dela com
    outro homem" (the corrected single marriage, not "two marriages");
    ojos-de-perro-azul gives "um dos primeiros contos" (the corrected hedge,
    not "first"); erendira describes all six shorter stories including "uma
    povoacao costeira decadente ..." for El mar del tiempo perdido;
    cien-anos-de-soledad stops at "ao longo de cem anos" with no ending
    disclosed, matching the spoiler redaction. The overlay is current, not
    stale. Coverage is also real rather than counted: 25/25 works, 8/8 events,
    19/19 lifeEvents, bio, the pseudonym note, eras title/description/themes,
    both startHere paths with their notes. The only untranslated reader-facing
    string on the wing is `debated`, above.
  - >
    ERENDIRA CONTENTS, re-verified against a source the erendira entry's own
    weak citations were standing in for: the Spanish Wikipedia article on the
    collection lists exactly the six stories works.yaml names, El mar del
    tiempo perdido among them. The missing sixth-story description is
    correctly restored and describes the right story.
  - >
    EL AMOR SYNOPSIS FIX. Fermina Daza marries once, to Juvenal Urbino;
    Florentino Ariza never marries. "through her marriage to another man" is
    correct and "two marriages" was not. The fix introduced no new error.
  - >
    IMAGES. All 23 cover URLs plus the portrait fetched: 24/24 HTTP 200 with
    real image bytes. Six were downloaded and looked at, not just
    HTTP-checked: cien-anos (Harper & Row jungle jacket, clean, and
    OL28176709M confirms Harper & Row 1970), la-hojarasca (Sudamericana,
    clean), erendira (Perennial "Innocent Erendira", clean), la-mala-hora
    (circus tent and rooster, clean, but see cleanup), viva-sandino (confirms
    the works.yaml comment exactly - retitled "El asalto", jacket states
    "Titulo anterior: Viva Sandino", library sticker present and honestly
    disclosed), obra-periodistica (confirms "Textos costenos, Obra periodistica
    1, 1948-1952" and the disclosed 128x224 size). No watermarks, no retailer
    marks. work.images.cover IS consumed by the app
    (orrery/lib/content/editions.ts:68), so this is not the inert-field trap.
  - >
    EDITIONS. Independently recomputed all 36 ISBN-13 check digits: 0 bad. All
    17 pt-PT ISBNs carry a Portugal prefix (14x 978-972, 3x 978-989), zero
    Brazilian 978-85/978-65. No duplicate ISBNs, no duplicate edition ids.
    lookup.py --verify-isbns re-run independently: 36 editions, 0 suspect.
    Translator-by-work cross-checked against works.yaml's header claim and it
