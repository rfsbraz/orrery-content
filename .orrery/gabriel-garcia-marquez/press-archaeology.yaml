stage: press-archaeology
wing: gabriel-garcia-marquez
summary: >
  Built the author's first lifeEvents (now 18) and the franchise's first
  events.yaml (6). The trivial 13-year dark run stage_plan.py flagged
  (2012-2024, an empty aura) closed, then reopened eight times as each
  closure exposed the next real gap - closed each with dated, sourced facts
  across the full 1927-2024 span. One 5-year dark run remained after that
  pass: 2002-2006. This follow-up confirmed the unchecked lead from that
  pass's own handoff - his mother's death - and closed it: Luisa Santiaga
  Márquez Iguarán died 9 June 2002 in Cartagena at 97, contemporary press
  obituary sourced (El Mundo's "Crónica" supplement, 16 June 2002, plus
  fr.wikipedia.org and it.wikipedia.org corroborating the 1905-2002 dates
  against Gerald Martin's and Dasso Saldívar's biographies). No dark run of
  5+ years remains: aura_density.py now reports 25 works, 38 aura, 1.52/work,
  longest dark run 4 years (1961-1964, unexamined in this pass - a different
  stretch than the one this pass targeted). validate.py --slug
  gabriel-garcia-marquez: 1 error, the expected theme.art gap (visual-
  language's to resolve).

produced:
  - content/authors/gabriel-garcia-marquez.yaml (added lifeEvent
    garcia-marquez-mother-death-2002; updated the header comment that
    previously (wrongly) recorded 2002-2006 as fully checked)

decisions:
  - >
    The mother's death was the right lead: contemporary Spanish press (El
    Mundo, published one week after her death, "La mujer que creó al
    creador") gives an exact date (9 June 2002), place (her Manga,
    Cartagena apartment), age (97), and two load-bearing details beyond the
    bare fact - she was the real-life model for Úrsula Iguarán and refused
    to read Cien años de soledad ("why would I, when I've lived it"), and
    she had her own documented Alzheimer's in her final years, years before
    her son's own memory loss became public in 2012. That parallel is real
    and sourced, not invented, and it recolors the 2012 dementia entry
    already in the file.
  - >
    Sourcing chain: no dedicated Wikipedia article on her exists (checked
    en/es directly, both 404 or silent). fr.wikipedia.org and
    it.wikipedia.org both carry her 1905-2002 dates, footnoted to Gerald
    Martin's authorized biography (Une vie, Grasset 2009) and Dasso
    Saldívar's García Márquez: El viaje a la semilla (Alfaguara 1997) on
    the French side, and to the El Mundo obituary directly on the Italian
    side (its own footnote 27 links the same URL fetched here). Three
    independently-editored sources agreeing on the same year, one of them a
    dated contemporary press piece with the exact day - comfortably past
    the two-source bar for a family death.
  - >
    organisation: interlude (grief, matching this wing's one prior use of
    interlude for a silence - the 1981 Pinochet vow), illustration_type:
    portrait-of-absence, both already in the wing's vocabulary; no adjacent-
    organisation conflict (neighbours are floating-object/1999 and
    diptych/2007). impact: med, in line with sibling family-life entries
    (marriage, Castro friendship) rather than the high-impact ruptures.

forStages:
  eras: >
    No change from the prior handoff's read - the 1999-2002 stretch (cancer,
    memoir, mother's death) plausibly belongs with the "late memoir/decline"
    era it already proposed opening at 1999. Not claimed in eras.yaml,
    untouched.
  visual-language: >
    24 lifeEvents + 6 franchise events now span 11 organisations; the new
    entry adds no new organisation or illustration_type to the wing's
    vocabulary.
  wing-audit: >
    Footprint is exactly content/authors/gabriel-garcia-marquez.yaml; no
    other file touched.

openQuestions:
