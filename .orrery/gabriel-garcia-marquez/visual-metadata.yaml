stage: visual-metadata
wing: gabriel-garcia-marquez
summary: >
  22/25 works now carry a licensed Open Library cover: all 11 core novels,
  all 4 story collections, all 5 nonfiction/memoir/journalism titles that
  have any Open Library record, the one play, and one of the two
  apocrypha entries. Three are honestly bare: En agosto nos vemos (2024,
  no cover on either Open Library work record despite being a bestseller
  from major publishers - too recent, evidently), El cataclismo de
  Damocles (a single 1986 speech pamphlet, no covers field on its OL work
  record at all), and the franchise header (not sourced - see below). The
  author portrait is filled from the current English/Spanish Wikipedia
  infobox photo. lookup.py's default --limit 100 only surfaced 11 of the
  25 works (the author has 441 OL works, mostly translation/edition
  duplicates, so the top 100 by whatever OL's internal ranking is cuts off
  before most of the extended/apocrypha tier); raising --limit to 400
  still timed out mid-run, so the other 14 works were resolved by direct
  title search instead (see openQuestions). Eight of the lookup/search
  hits were rejected on sight and swapped for a cleaner edition of the
  same work: one plain library binding with no jacket art at all
  (la-mala-hora), one German-language edition standing in as the
  "representative" cover for a work everyone will expect in Spanish or
  English (cien-anos-de-soledad), and six with a library barcode, spine
  sticker, or ownership stamp visible on the jacket (el-otono-del-
  patriarca, memoria-de-mis-putas-tristes, ojos-de-perro-azul,
  doce-cuentos-peregrinos, diatriba-de-amor-contra-un-hombre-sentado, and
  obra-periodistica less cleanly - see its own note). Every cover URL
  written was fetched with ?default=false and confirmed to serve a real
  image, and every one was downloaded and looked at, not just HTTP-checked.
  validate.py --slug gabriel-garcia-marquez: 0 errors, 24 warnings, all
  pre-existing (eras.yaml coverage gaps for works published outside
  1955-1967, and four handoff-length warnings on other stages' files) -
  none introduced by this stage.

produced:
  - content/franchises/gabriel-garcia-marquez/works.yaml (images block on 22 of 25 works)
  - content/authors/gabriel-garcia-marquez.yaml (images.portrait block)

coverage:
  core: "11/11 - la-hojarasca, el-coronel-no-tiene-quien-le-escriba, la-mala-hora, cien-anos-de-soledad, el-otono-del-patriarca, cronica-de-una-muerte-anunciada, el-amor-en-los-tiempos-del-colera, el-general-en-su-laberinto, del-amor-y-otros-demonios, memoria-de-mis-putas-tristes covered; en-agosto-nos-vemos bare (no OL cover exists yet for a 2024 release)"
  extended: "13/13 covered - los-funerales-de-la-mama-grande, erendira, ojos-de-perro-azul, doce-cuentos-peregrinos (story collections, 4/4); relato-de-un-naufrago, el-olor-de-la-guayaba, la-aventura-de-miguel-littin-clandestino-en-chile, noticia-de-un-secuestro, vivir-para-contarla, yo-no-vengo-a-decir-un-discurso, obra-periodistica (nonfiction/memoir/journalism, 7/7); diatriba-de-amor-contra-un-hombre-sentado (play, 1/1)"
  apocrypha: "1/2 - viva-sandino covered (its sole edition with any cover at all, retitled El asalto, sticker and all); el-cataclismo-de-damocles bare (OL work record carries no covers field)"
  totals: "22/25 works covered; portrait filled; header not sourced"

rejectedAndSwapped:
  - work: gabriel-garcia-marquez/la-mala-hora
    rejected: "10096558 (OL work's own representative cover, a 1968 EDHASA printing) - a plain grey cloth binding with a library call-number sticker, no jacket art visible at all."
    used: "168230, Plaza y Janés (2006) - clean, illustrated (circus tent and rooster)."
  - work: gabriel-garcia-marquez/cien-anos-de-soledad
    rejected: "12627383 (OL work's own representative cover) - a Fischer Verlag German edition, 'Hundert Jahre Einsamkeit'. Correctly licensed and a real edition of the work, but not the language a reader searching this catalogue's Spanish-titled entry is likely to recognize."
    used: "10114038, Harper & Row's 1970 first English-language edition (Rabassa's translation) - the jacket most associated with the novel in the anglophone market, and clean."
  - work: gabriel-garcia-marquez/el-otono-del-patriarca
    rejected: "10097268 (OL work's own representative cover, Sudamericana 1996) - same illustration as the one used, but with a 'SPANISH FICTION' library spine sticker over one corner."
    used: "7985786, a later Sudamericana printing (2015) of the identical art, clean."
  - work: gabriel-garcia-marquez/memoria-de-mis-putas-tristes
    rejected: "10830348 (OL work's own representative cover) - a library barcode sticker across the top-left corner."
    used: "12786073, Alfred A. Knopf's US first English-language edition (2005), clean."
  - work: gabriel-garcia-marquez/ojos-de-perro-azul
    rejected: "10099963 (OL work's own representative cover, Editorial Diana 2004) - a small library barcode sticker over one corner."
    used: "7341179, Debolsillo (2010), clean."
  - work: gabriel-garcia-marquez/doce-cuentos-peregrinos
    rejected: "8299653 (OL work's own representative cover, Editorial Diana 1992) - a library barcode sticker partly covering the illustration."
    used: "7985783, Editorial Sudamericana (2015), clean."
  - work: gabriel-garcia-marquez/diatriba-de-amor-contra-un-hombre-sentado
    rejected: "10100905 (OL work's own representative cover, Grijalbo Mondadori 1995) - a small library call-number sticker over one corner."
    used: "168215, Mondadori 'Biblioteca García Márquez' (2006), clean."
  - work: gabriel-garcia-marquez/obra-periodistica
    rejected: "9645552, a plain blue cloth binding with no title visible at all; 11689834, the same edition stamped with a library's ownership ink across the jacket."
    used: "5266685, Grijalbo Mondadori's own edition of vol. 1 'Textos costeños' (1981, matching this entry's own `published` date) - clean but only 128x224px, well under this catalogue's usual resolution. Every cover id on this work record was checked; this is the best of three."
  - work: gabriel-garcia-marquez/viva-sandino
    rejected: "none - only two editions exist on Open Library for this work, and only one carries any cover."
    used: "9838369, Editorial Nueva Nicaragua's second edition (1983), retitled 'El asalto' on the cover itself. A library call-number sticker sits over its lower third; kept for want of any alternative."

bareAndWhy:
  - work: gabriel-garcia-marquez/en-agosto-nos-vemos
    checked: "Both OL work records for 'Until August' (OL37580159W, 5 editions; OL42544992W, 1 edition) - neither carries a cover, and covers.openlibrary.org/b/isbn returns nothing for any of the three ISBNs checked (9780593802007 Knopf US, 9798890980588 Knopf Spanish, 9781405964272 Penguin UK). A major 2024 release from two large publishers with genuinely no cover indexed yet - an Open Library gap, not a rights gap."
  - work: gabriel-garcia-marquez/el-cataclismo-de-damocles
    checked: "OL468779W's own work JSON carries no `covers` field at all (confirmed by fetching the record directly). A single occasional speech, also collected inside Yo no vengo a decir un discurso, never independently jacketed."
  - entity: "franchise.yaml header"
    checked: "Not sourced. This catalogue has a standing, confirmed finding that franchise.images.header is declared in the schema but rendered by zero app code right now. Sourcing a Colombian-coast landscape or a García Márquez house photo defensibly enough to cite a licence is real research time (Openverse/Commons sweep, a look at whether Aracataca or a Barranquilla/Barcelona building has a usable Commons photo); spending it on a field nothing displays is work a curator cannot see the value of. Left for whichever stage first makes the field render, or for a future pass if that changes."

portrait:
  used: "https://upload.wikimedia.org/wikipedia/commons/0/0f/Gabriel_Garcia_Marquez.jpg - Jose Lara / Flickr, CC BY-SA 2.0, AttributionRequired true, no Restrictions flag. Current English AND Spanish Wikipedia infobox photo (confirmed via each language's own pageimages API). 427x640, below this skill's ~800px practical minimum but the best-vetted option found."
  rejected: "Wikidata Q5878's other P18 claim, 'Gabriel García Márquez 02.jpg' (CC BY-SA 4.0, 3300x4924, a genuinely nice seated portrait). Rejected on a rights-veracity ground, not a quality one: its own extmetadata states DateTimeOriginal 2017-10-24 and Credit 'Own work' by uploader Gorup de Besanez - three years after García Márquez's 2014 death, so whatever this photo actually is (most likely a re-photographed print or slide), the uploader's own-work claim cannot be the true chain of rights, and no alternative authorship is stated to fall back on."

openQuestions:
  - "lookup.py's default --limit 100 is tuned for a wing with far fewer OL author-search hits than this one; García Márquez has 441 OL works (mostly per-translation duplicates), so the tool surfaced covers for only 11 of the 25 catalogued works on the first pass. Raising --limit to 400 still hadn't returned inside a 400s timeout when checked. The other 14 works here were resolved by direct openlibrary.org/search.json title queries instead (one call per title, batched), which is a fine substitute for a wing this size but costs more calls than the tool's own pitch promises. Whether lookup.py should paginate past its first author-search page, or accept a --timeout/background pattern, is worth raising with whoever maintains it - noted here rather than changed, since this stage's footprint is content, not tooling."
  - "obra-periodistica's cover (5266685) is only 128x224px - real, correctly matching edition (Grijalbo Mondadori 1981 'Textos costeños', vol. 1), no sticker or stamp, but visibly small if the app ever renders covers above thumbnail size for this tier. Every other cover id on the same OL work record is worse (blank cloth or library-stamped), so this isn't a search failure, just a thin source."
  - "Not fully cross-checked: whether any of the 22 covered works has a BETTER pt-PT (Portugal) edition cover than the Spanish/English one used, given this catalogue's declared Portugal-based readership elsewhere. Spanish-language covers were preferred as the original-language default per the skill's own Path A guidance, without a systematic pt-PT sweep beyond what --markets pt returned in the one lookup.py run that completed (which found nothing usable in Portuguese for this author)."

forStages:
  i18n: "No prose changed; images-only fields carry no translatable strings (comments are English-only content, per policy, and not user-facing)."
  wing-audit: "3 open questions above, none blocking; the tooling limit finding may be worth surfacing beyond this wing."
