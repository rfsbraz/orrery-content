stage: eras
wing: gabriel-garcia-marquez
summary: >
  [] to 1 era: macondo-cycle, "The Macondo Cycle", 1955-1967, provenance
  critical. Of the two candidate shapes flagged upstream, one held and one did
  not. Nothing after 1967 is periodised, so 1968-2024 is left uncovered.

produced:
  - content/franchises/gabriel-garcia-marquez/eras.yaml

verdicts:
  macondo-cycle: >
    RECEIVED, rung 2, and its boundary is received separately rather than
    rounded. Raymond Leslie Williams, "Cien anos de soledad and the Macondo
    Cycle", chapter 2 of A Companion to Gabriel Garcia Marquez (Boydell &
    Brewer, 2021), names the term, dates the cycle from the early 1950s to
    1967, and counts "the five books of the cycle of Macondo", which matches
    the five works this catalogue holds in 1955-1967. Gale's Literature and Its
    Times gives the same term and the same two dates independently, and a 2013
    dissertation enumerates the cycle work by work. All three URLs and the
    quotations are on the entry itself.
  dictator-novels: >
    INVENTED as a periodisation; the grouping itself is real. Both novels are
    catalogued as novela del dictador alongside Valle-Inclan, Asturias,
    Carpentier and Roa Bastos: a genre shared with other writers across 1926 to
    the 2000s, not a phase of this career. No source in either language treats
    1975 and 1989 as the ends of a period of his own work, and a span drawn
    there would swallow Cronica de una muerte anunciada and El amor en los
    tiempos del colera. Full reasoning sits in the content file's header.
  tres-libros: >
    No label exists, and none is needed: all three fall inside 1955-1967 and
    the criticism defining the cycle counts them among its books, so the
    author's grouping sits inside the era. The note stays on each work.
  post-1967: >
    No periodisation exists. Nick Caistor's Guardian obituary, the fullest
    retrospective reached, is chronological and names no phase.
    https://www.theguardian.com/books/2014/apr/17/gabriel-garcia-marquez-obituary

corrections:
  - >
    The Wikipedia line flagged upstream ("It signals the end of the Macondo
    period") is not used and not laundered: it is a bare assertion behind a
    footnote, and full-text search of both Wikipedias returns 0 hits for
    "Macondo cycle" and 0 for "ciclo de Macondo". The criticism cited instead
    reaches the same boundary independently.

languagesSearched:
  - "English: reference works, criticism, dissertation catalogues, the Guardian obituary"
  - "Spanish: es.wikipedia full-text, Spanish criticism and university sources, Centro Gabo site search (no hits)"

sourcesThatRefused:
  - "Google Books API 429; DuckDuckGo and Mojeek rate-limited or captcha'd after the first queries; Bing RSS unusable"
  - "britannica.com 403; nytimes.com 403; elpais.com 404 on constructed obituary URLs"
  - "Internet Archive search-inside for Harss, Into the Mainstream (1967): item intomainstreamco00hars exists, its text and search endpoints 403/404"

forStages:
  visual-language: >
    The wing now has aura, which flips theme.yaml's missing `art:` block from a
    warning to a validator ERROR. Only error in the catalogue; clears when the
    art block lands.
  art-rotation: "Era carries chapter-gate / atmospheric-motif-field / images_required 1."
  translation: >
    3 new translatable fields (title, description, note). Render the title as
    the Portuguese form of "o ciclo de Macondo", not a new label; the two
    English quotations stay quotations.
  wing-audit: >
    20 works sit outside every era (1970 onward). Answered, not an open gap: no
    source periodises after 1967. Do not close it by adding a span.
  reading-orders: "The five books of 1955-1967 are a named received grouping, so a sourced entry path is available where no publisher sequence is."

openQuestions:
  - >
    Naming, a curator's call: shipped as "The Macondo Cycle", the form the two
    reference works use, with "el ciclo de Macondo" glossed in the description.
    The rival case is language-follows-the-author, which would title it in
    Spanish as the Tordo wing does in Portuguese. Both forms are received, so
    this is house style, not sourcing. The id is permanent either way.
  - >
    Unverified lead worth a browser session: a Tecnologico de Monterrey lecture
    page says Luis Harss's Los nuestros (1966) is "quiza el primer libro en
    donde Garcia Marquez habla expresamente del final de algo que llamo el
    'ciclo de Macondo'". If that holds, the era moves to rung 1. Harss could
    not be reached; unused in the file.
    https://convocatorias-internacionales.tec.mx/es/evento/ciclo-de-macondo-gabriel-garcia-marquez
  - "Carried untouched, none an eras question: En agosto nos vemos's core tier, the Rabassa translationNote field, El ano de la peste's tier."
