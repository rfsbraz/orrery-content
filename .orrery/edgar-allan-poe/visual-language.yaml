stage: visual-language
summary: "theme.yaml art block written (emblem, motifs, atmosphere, lineCharacter, backgroundTexture, accentUse, avoid); validator's theme.art error is gone, 17 assets now unlocked"
produced:
  themeArtSet: true
forStages:
  art-rotation: >
    17 jobs now open per asset_audit.py: 6 era plates, 8 life events, 3
    franchise events, 0 world events. Motifs are deliberately spread across
    all six eras' material worlds (unsold pamphlets, editor's desk, candle
    in a dark room, sealed letter or bottle, mourning token, press/masthead,
    bare rented room) so no single era plate is starved for a distinct
    object to draw. The emblem (a dip-pen laid across a slashed galley
    proof) is about Poe's editing/reviewing career, not any one tale, so it
    reads across every era without spoiling anything.
  visual-metadata: >
    Spoiler safety is now load-bearing in `avoid`, not just in the redacted
    prose: no bricked niche/trowel, no heart or floorboard, no cat behind a
    wall, no ape at a window, no shrouded doorway figure, no dismantled
    body, no card in a rack. A sourced period plate (Dore/Rackham/Clarke)
    chosen for a work cover should be checked against this same list before
    use - per-tale covers are visual-metadata's surface, not this stage's,
    and spoiler-audit's handoff flagged that period illustration almost
    always draws the climax. Also avoided outright: the raven-on-a-bust
    silhouette, since it is the genre's own marketing shorthand for this
    author and franchise-research's palette notes already ruled it out.
    Real-person constraint (Poe himself) is unchanged by this stage - his
    portrait stays a sourced photograph/engraving per VISUAL.md SS3, never
    generated; life-event sketches draw his rooms, objects and consequences,
    never his face.
openQuestions:
  - "Checked against Stephen King as the closest neighbour (shared displayFace fraunces, shared signature beam, adjacent near-black bg) rather than against a full read of all 21 other wings; differentiated on era (1830s-40s America vs modern Maine), line technique (steel-engraver hatching vs scratchboard cut) and material world (candlelit interior/print culture vs small-town roadside). A curator who wants a second neighbour checked (Tana French and John Shirley also share fraunces, on different genres) can re-run theme_digest.py."
  - "The emblem's `why` leans on Poe's reputation as a severe magazine critic (the Tomahawk Man nickname), which is well-attested general knowledge but was not re-verified against a primary source in this pass, unlike press-archaeology's sourced lifeEvents. Worth a citation check if the emblem is ever challenged."
