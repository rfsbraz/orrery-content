  structuralDecision: >
    Departed from the usual "a short-story collection is one work"
    convention. Poe's own seven lifetime books cover a minority of his
    tales and stop, for poetry, in 1845 - before Ulalume, Annabel Lee, The
    Bells, Eldorado, For Annie and A Dream Within a Dream existed. He died
    before any complete-works volume of his own. Individual poems/tales
    are therefore the work unit; the seven historical books are
    documented in notes, never invented as work entries. Full reasoning
    in works.yaml's header.
  validator: >
    Clean except one unavoidable error: theme.yaml has no `art:` block,
    which is the next visual stage's job by design (its own skill example
    ships the same way). Verified this is not scaffold-specific: removing
    this wing's files leaves the rest of main green, so any wing would
    fail this same check before its own visual pass runs.

forStages:
  completeness-auditor: >
    Wide first pass, not closed. Exclusions with reasons are in works.yaml
    ("NOT INCLUDED"): one dubious attribution, three doubtful/lost items,
    two unfinished 1847 fragments, five minor essays held below this
    draft's nonfiction bar, plus the Light-House fragment and the disputed
    Animal Magnetism attribution. All dates/venues came from one secondary
    source (Wikipedia's bibliography) cross-checked only against the Poe
    Society of Baltimore's tale index - worth a primary-source pass,
    especially the ~15 poems dated "never published in his lifetime."
    Synopses came from general knowledge, not a fresh read; least
    confidence sits in the ~40 minor extended tales/poems.
  press-archaeology: >
    Only the birth lifeEvent is seeded. Strong sourced candidates already
    visible in the bio: the Allan foster family, the West Point dismissal,
    the 1836 marriage to 13-year-old cousin Virginia Clemm, her 1847
    death, and the unexplained 1849 death (found delirious in someone
    else's clothes, dead four days later) - likely this wing's strongest
    single anchor.
  eras: >
    A chronology is visible but unbuilt: early poetry/Gothic tales
    (1827-1839), the Dupin/ratiocination cluster (1841-1845), and a late
    1845-1849 run running past his own death. Not sourced or written here.
  reading-orders: >
    No startHere paths scaffolded - with no lifetime "complete tales" of
    his own, a citable entry point needs real sourcing, not a guess.
  visual-language: >
    palette/displayFace/signature set (tarnished-gothic; accent #9c7a3d
    checked against every existing wing via theme_digest.py); no art
    block, the one validator error, by design.
  visual-metadata: 141 works need covers; no author portrait or header
    image yet. Poe is heavily Commons/LOC-covered (public-domain 1840s
    daguerreotypes/engravings), so sourcing should be easier than most.
  editions: No ISBNs checked; most tales/poems never had a Poe-published
    book, so editions will mostly need posthumous "Complete" anthologies.

openQuestions:
  - "Tiering ~40 minor tales/poems core vs extended is this draft's own
     call, not received - see works.yaml's canonTier note. A narrower
     'core' spine is a legitimate alternative reading."
  - "The Conchologist's First Book is tiered apocrypha/authorRole:author
     for real original material (preface, Cuvier translation,
     classification) atop Thomas Wyatt's base text - closer to a
     contributor/adapter credit than a typical apocrypha entry; worth a
     second look."
  - "The Balloon-Hoax is filed as a tale (core); Wikipedia's own
     bibliography files it under essays instead, a defensible alternative."
