forStages:
  wing-audit: >
    The essentials/meet-dupin startHere overlay named in this run's brief as
    possibly stale from the spoiler redaction was checked against
    content/franchises/edgar-allan-poe/franchise.yaml and against git
    history: commit 731e7af (the redaction itself) already rewrote both the
    English and the pt-PT overlay for essentials and meet-dupin in the same
    diff. Compared both paths word for word against the current English and
    found them already in sync - no re-sync was needed, only verification.
    Two editorial calls worth a second look. (1) The pseudonym note ("a
    Bostonian") is left untranslated, matching the explicit convention
    already documented in robert-jordan.yaml and jk-rowling.yaml (neither
    translates pseudonym notes); i18n_coverage.py does not gate this field
    either way, so it is a precedent call, not a script requirement. (2)
    Several poem synopses quote a title's own first line verbatim in
    English inside quotation marks (to-1829-bowers-whereat, to-1829-should
    -my-early-life) because that opening line IS the only way the base data
    distinguishes two same-titled 1829 poems - left in English deliberately,
    same treatment as an inline work reference's underlying id.
  translation: >
    editions.yaml correctly has no pt-PT overlay and none was added:
    SCHEMA.md states editions are deliberately never overlaid (an edition's
    title must be a real published fact, not translated prose), and the 8
    pt-PT editions already in the base file are themselves the Portuguese
    market data, not something to translate again.
openQuestions:
  - "No unresolved translation gap remains in this wing per
     i18n_coverage.py, but that script does not check startHere `note`
     fields or achievement text (none exist for this wing) - both are
     covered by hand here (the 3 startHere notes were already translated by
     reading-orders/spoiler-audit) and confirmed present."
  - "Register calls that would benefit from a native pt-PT read: 'raciocínio'
     for Poe's own coinage 'tale of ratiocination' (kept as an English
     quoted phrase where it names the term itself, translated as prose
     elsewhere); and Griswold's byline 'Ludwig' and the epithet 'Tomahawk
     Man' style terms are kept as proper nouns/titles, untranslated."
