    - "content/i18n/pt-PT/franchises/edgar-allan-poe/works.yaml (new, 145 synopses)"
    - "content/i18n/pt-PT/franchises/edgar-allan-poe/eras.yaml (new, 6 eras - title, description, themes)"
    - "content/i18n/pt-PT/franchises/edgar-allan-poe/events.yaml (new, 3 franchise events - title, description)"
