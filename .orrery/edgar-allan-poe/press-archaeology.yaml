forStages:
  eras: >
    Three natural boundaries are now sourced: early 1827-1836 (Allan
    breaks, army, West Point), middle 1836-1846 (marriage, the SLM/Burton's/
    Graham's/Broadway Journal editor years, with Rue Morgue 1841 and The
    Raven 1845 as anchors), late 1847-1850 opened by Virginia's death,
    closed by Poe's own and the Griswold aftermath.
  event-resonance: "No globalEvents included or excluded this pass."
  spoiler-audit: "All ten new entries are biographical/reception fact, not
    plot; spoilerAfter null throughout."
  visual-language: >
    Organisations hand-assigned and rotation-checked across the merged
    chronology (1 vista, 4 beside, 3 artifact-spread, 1 passage, 2
    immersion, 1 mosaic): no consecutive repeats, no loud cell touching
    another. immersion sits at its 2-per-wing cap (Virginia 1847, Poe 1849)
    - genuinely the two biggest ruptures, and only two years apart, which
    is a fact of this life, not a pacing choice to fix. The 1849 death
    sketch has real documented objects (Dr. Carter's cane with its
    concealed sword, the ill-fitting borrowed clothes) rather than invented
    ones.
  art-rotation: "11 life/franchise events exist now, none illustrated yet."
openQuestions:
  - "The Philosophy of Composition (1846) was deliberately NOT given a
     lifeEvent despite looking like classic 'how I wrote it' material:
     eapoe.org's own chronology calls it 'largely fictional, by Poe's own
     admission.' Per this session's new interview-bar rule, a self-
     described performance fails the origin-story test outright; the
     correction is folded into the Raven event's own description instead."
  - "A November 1848 laudanum incident, often cited elsewhere as a suicide
     attempt after the Whitman engagement collapsed, was not independently
     verified against a primary eapoe.org source this session and does not
     appear in eapoe.org's master chronology; held out rather than added on
     one unverified recollection. Reading eapoe.org's Whitman letters
     directly (only the index was fetched) could confirm it properly."
  - "The Raven's payment is given differently across sources (eapoe.org:
     about $15; other accounts: $9); the event states both rather than
     picking one."
