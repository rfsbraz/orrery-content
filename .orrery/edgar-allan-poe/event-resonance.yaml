stage: event-resonance
summary: No global events resonate with Poe's creative work; all candidates predate his lifetime or lack demonstrable connection to his books.
produced:
  globalEventsIncluded: []
  globalEventsExcluded:
    - sept-11-2001: "152 years after his death; a 21st-century cultural rupture unconnected to his work"
    - financial-crisis-2008: "159 years after his death; Poe lived through financial hardship but this specific modern crisis does not appear in his books"
    - covid-19-pandemic-2020: "171 years after his death; no connection to his work"
    - world-war-i-1914: "65 years after his death; WWI trauma and shell-shock literature never reached Poe's page"
    - world-war-ii-1939: "90 years after his death; no connection to his creative work"
    - pulp-magazines-1926: "77 years after his death; Poe's detective and horror tales became foundational to the genre the pulps later formalized, but he did not write toward that category—his influence on pulps is not pulps' influence on him"
    - penguin-paperback-1935: "86 years after his death; this event concerns posthumous distribution of his work, not his creative process or what shaped his books"
    - armed-services-editions-1943: "94 years after his death; again, distribution of his already-written work"
    - lady-chatterley-trial-1960: "111 years after his death; about Victorian-era obscenity law, not Poe's work or concerns"
    - fantasy-paperback-boom-1965: "116 years after his death; Poe wrote detective fiction, horror, and lyric poetry—not fantasy—and had no creative investment in a market category that emerged posthumously"
    - carnation-revolution-1974: "Poe was American; Portuguese political upheaval has no connection to his work"
    - chain-bookshop-1982: "133 years after his death; modern retail mechanics have no bearing on his creative work"
    - online-bookselling-1995: "146 years after his death; Amazon's catalogue model is unconnected to how he wrote"
    - ebook-and-self-publishing-2007: "158 years after his death; modern publishing platforms postdate him entirely"
    - prestige-fantasy-adaptation-2011: "162 years after his death; Game of Thrones and contemporary fantasy TV have no connection to Poe's work"
    - booktok-2020: "171 years after his death; social-media-driven discovery of his work is a fact of his posthumous reception, not his creative life"
    - portugal-bailout-2011: "Poe was American; Portuguese economic crisis is unconnected to his work"
    - elementary-education-act-1870: "21 years after his death; universal schooling affected his posthumous readership but not his creative output"

forStages:
  reading-orders: "Poe's timeline carries no global events. The reading-order stage will work with only the author's own lifeEvents (birth seeded, others pending press-archaeology) and the eras already built. This is a thin aura ground: 6 eras with no global-event texture, so reading paths will rely entirely on biographical structure and work grouping."

openQuestions:
  - "The global.yaml catalogue presently contains no events from Poe's 1809-1849 lifetime—all entries are 1870 or later. If future world-events passes surface events from the 19th-century American literary or cultural landscape (the Transcendentalist movement, the rise of periodical publishing, the Gothic novel's influence from Britain, the telegraph's arrival), this stage should be re-run to assess resonance."
