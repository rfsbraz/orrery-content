stage: visual-metadata
summary: "portrait sourced (Annie daguerreotype, June 1849, via Getty), 23/145 works covered; header left absent per current convention"
produced:
  portraitSourced: true
  worksCovered: 23
forStages:
  editions: >
    None of the 23 covers used here came from editions.yaml (this wing has
    none yet); each was resolved by Open Library title search, not by an
    existing ISBN. Where editions later gets added, cross-check the same 23
    OL work ids so a real edition-level coverUrl can supersede the
    work-level cover.
  wing-audit: >
    Weakest picks, worth a second look: the-tell-tale-heart uses a 1948
    Chiltern Library cover (a figure watching a sleeping man) chosen over
    the far higher-edition-count "giant red heart" cover, which was rejected
    for showing the story's own central image against theme.yaml's avoid
    list; the-cask-of-amontillado and the-pit-and-the-pendulum both use
    single-edition 1980s Troll Associates children's-adaptation covers
    (real, illustrated, credited, but thin provenance at edition_count 1).
    the-murders-in-the-rue-morgue rejected four illustrated candidates
    outright (a hand with a razor, a 1932 film still, a drawn ape beside a
    man, a degraded library-binding scan) before landing on an abstract
    Penguin Classics pattern cover with no figure at all - safe but bland.
    the-mystery-of-marie-roget, eureka and the-spectacles were left bare:
    marie-roget's only real illustrated candidate depicted the drowned
    victim, which the tale's own redacted synopsis withholds; eureka and
    the-spectacles both resolved only to the same generic marbled-binding
    library scan already rejected elsewhere as degraded. About a dozen
    minor tales (berenice, ligeia, valdemar, imp-of-the-perverse among them)
    share a near-identical abstract blue-swirl template from what looks
    like one small POD imprint's house style - real, licensable, safe, but
    not designed art; flag if a later pass finds better editions.
    tamerlane's cover is a facsimile of the actual 1827 pamphlet, which is
    the strongest single match in the set.
openQuestions:
  - "The Ultima Thule daguerreotype (Nov 1848) is the other well-attested
     Poe photograph and the one some editions actually prefer, but only
     later engravings/copies made from it are on Commons under a checkable
     licence, not the plate itself; Annie was used instead. If a curator
     finds Ultima Thule newly uploaded to Commons under its own file with a
     read licence, it's worth a side-by-side reconsideration."
  - "122 of 145 works remain uncovered, almost all minor magazine-only
     pieces (album verse, single-joke squibs, essays) that likely never had
     a standalone illustrated edition; not swept individually beyond the
     essentials/meet-dupin/featured tier and the best-known handful checked
     here, per the effort budget for this pass."
  - "franchise.yaml's images.header was deliberately left unset, matching
     jk-rowling and robert-bryndza's most recent visual-metadata commits
     (both note 'header correctly omitted'), which record that header
     images were removed from the app's franchise-page rendering this
     session."
