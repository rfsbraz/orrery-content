forStages:
  reading-orders: >
    The era spine is biographical/publishing, not thematic, so it does not itself
    supply an entry path. Three things it does supply. (1) The three Dupin tales
    straddle an era boundary (1841 and 1842 in the-philadelphia-years, 1844 in
    the-new-york-years), so a detective-first path crosses a plate; that is
    correct and should not be smoothed. (2) The two obvious front doors sit in
    different eras, The Murders in the Rue Morgue (1841, Philadelphia) and The
    Raven (1845, New York), so a "start at the famous thing" path will not begin
    at era one. (3) poems-written-in-youth holds 28 works, all poems, none of
    them famous except To Helen and Israfel, so a chronological path opens on the
    thinnest material in the wing; a publication-order path may want to say so.
  art-rotation: >
    6 era plates, all organisation chapter-gate / illustration_type
    symbolic-still-life / images_required 1, so 6 image slots. The eras are
    unevenly weighted in years (2 to 6) but evenly enough in works (12 to 38)
    that no plate carries a near-empty period.
  visual-language: >
    Each era has a distinct material world to draw from, which suits the
    still-life type: three thin unsold verse volumes and a West Point subscription
    list (1827-1831); a Baltimore attic, a prize contest, an unpublished
    collection in manuscript (1832-1834); an editor's desk in Richmond and the
    Messenger (1835-1837); the Philadelphia magazine offices, Burton's and
    Graham's, and the Gothic interiors of the great tales (1838-1843); a New York
    newsroom, a hoax printed as news, his own weekly paper (1844-1845); a rented
    country cottage, a deathbed, a cosmological lecture and the late lyrics
    (1846-1849). The tonal arc runs from unnoticed apprentice verse to celebrity
    to bereavement, which the palette can track without any era needing a
    horror-first reading.
openQuestions:
  - "the-philadelphia-years closes at 1843 and the-new-york-years opens at 1844, cut on the 6 April 1844 move (Mabbott's Annals). That puts the eight or nine 1844 works published after the move on the correct side, at the cost of the two or three published in that year's first three months, which were Philadelphia work. The alternative cut, running Philadelphia through 1844 to match the 'six years in Philadelphia' phrasing, would misplace the larger group. Exact first-publication months for the early-1844 pieces were not checked against eapoe.org's per-item pages; only the move date is verified here."
  - "the-fordham-years opens at 1846 although the move happened during that year, after two intermediate addresses, so the 1846 pieces published before it (The Philosophy of Composition ran in Graham's for April 1846) fall on the Fordham side. Both this and the 1844 cut are recorded in the era notes."
  - "the-messenger-years runs to the end of 1837 so that the lean fifteen months in New York after the editorship ended are covered rather than orphaned. The label names the magazine; the last stretch of the span is outside it."
  - "No era is drawn around the tales of ratiocination, and none around a Gothic or horror phase. Neither is a received periodisation of Poe's career (the first names a kind of tale, the second a mode he used throughout), and both would overlap the residence eras. Recorded in the file header so a later pass does not re-derive it."
  - "Only English-language scholarship and institutional sources were searched, which is the right corpus for an American author writing in English. The French reception (Baudelaire's fourteen years of translation, the Symbolists' claim on him) periodises Poe's afterlife rather than his working life, so it was not treated as a source for these spans."
