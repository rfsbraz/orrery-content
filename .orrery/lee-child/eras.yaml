stage: eras
wing: lee-child
outcome: "eras: [] - no received periodisation exists; positive argument written into the file header"

verdict: >
  Lee Child ships eras: []. Jack Reacher is one continuous procedural series
  (31 novels, 1997-2026) plus short fiction and nonfiction, and no critic,
  reference work, settled fan consensus or the author himself divides the
  career into named creative periods. This matches the Butcher and Flynn
  precedents (a career with a visible shape that nobody periodises), reached
  by a different route: the concurrent-series argument that gave Butcher/Coben
  eras:[] does NOT apply here (Reacher is one braid, not many), so the decision
  rested entirely on the one genuine candidate boundary below.

co_authorship_boundary_verdict: >
  This was the whole question, and the answer is that it is a byline change,
  not a received reading-experience period. It is REAL as a publishing fact
  (rung 4): novels 1-24 (Killing Floor 1997 - Blue Moon 2019) are Lee Child
  solo; from the 25th, The Sentinel (2020), through Chain Reaction (2026),
  every novel is co-written with Andrew Grant writing as Andrew Child, per
  Wikipedia's series article ("Starting with the 25th novel... The Sentinel
  (2020), all subsequent books... co-authored by and credited to both
  brothers") and Child's Jan 2020 BBC handover announcement. But it fails the
  "fit, not truth" test three ways, and each is sourced in the file header:
    1. Its own authors frame it as continuity, not a new chapter. Andrew's
       stated aim is "to make everything the same, only different"; Lee says
       he "would have been extremely proud if I had written it myself"; the
       cover deliberately still reads "Lee Child" so readers register no
       boundary (CrimeReads "Past and Present" interview). A period the
       producers engineered to be invisible is not one the site announces.
    2. The reading shift readers actually discuss does not fall on 2020. The
       perceived decline is commonly dated to Night School (2016, 21st novel,
       still solo Lee Child), and is a diffuse, contested reader argument, not
       a named phase. An open debate about where/whether the series turned is
       the opposite of a settled fandom period (the Butcher test), and its
       line does not match the byline's.
    3. The byline split is not even clean: Many Happy Returns (2023) is a solo
       Lee Child Reacher story published mid-"co-authorship", so a co-authored
       era dated 2020 would be false to its own contents.
  A full-bleed "ENTERING ..." plate at 2020 would be our periodisation dressed
  as received: our opinion in a serif font. Rung 4 was the strongest rung with
  anything on it, and it does not hold.

ladder_results:
  rung_1_author: >
    Fails as a period. Child frames the handover as succession and continuity,
    gives it no period name, and the byline is kept identical on purpose.
  rung_2_critical_scholarly: >
    None. Reference works, publisher pages and press are all chronological.
    Heather Martin (Child's own biographer), writing directly on how Reacher
    changed ("The Evolution of Jack Reacher", CrimeReads), describes a
    continuous evolution and names no phases - the best-placed person to
    periodise, declining to. No academic periodisation of the series found.
  rung_3_fandom: >
    Fan discussion of a quality/style shift is real and broad but UNNAMED,
    contested, and not aligned to any single boundary (dated variously to
    Night School 2016 and to the 2020 handover). Not settled - it is an open
    argument, which per the skill is the opposite of a period.
  rung_4_publishing_fact: >
    The co-authorship transition (see verdict above). Real fact, wrong fit.

orphans: "N/A - eras:[] has no spans, so no work can be orphaned. validate.py green, zero new warnings on this wing."

languages_searched: "English only. Correct corpus: Lee Child is an anglophone British/US author writing in English; his critics, press and fandom are anglophone."

sources_that_refused: "None material. Chicago Sun-Times review body is JS-gated to fetch.py (nav-only extract), but its substance was recovered via the CrimeReads and search corpus; not relied on as a sole citation."

gates:
  validate: "green (--slug lee-child), 717 works / all references resolve; 2 pre-existing handoff-length warnings only, no new warnings, no orphan-works warnings"
  form: "eras.yaml parses as a genuine empty list ([]), matching the jim-butcher / gillian-flynn precedent, not an empty file (verified via yaml.safe_load)"
  i18n: "no prose values added (comments only), so no pt-PT overlay obligation and no i18n regression"

uncertainty: >
  The one live risk is that the co-authorship is genuinely on its way to
  becoming a received period and simply has not been named yet - the discourse
  volume is unusually high for a "no era" verdict. If the series' close (after
  Chain Reaction) draws a critical retrospective that cuts it at 2020, or a
  named "Andrew Child era" settles in fandom, this is a clean call to revisit.
  The file header says exactly this, so the reopening condition is recorded in
  content, not just here.
