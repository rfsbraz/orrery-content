stage: press-archaeology
wing: lee-child
summary: >
  Added 5 new sourced aura entries (4 franchise events in a new
  content/franchises/lee-child/events.yaml, 1 author lifeEvent), plus fixed
  a miscounted novel-count in the new lifeEvent's own description (16 to 17)
  caught on re-read. validate.py green throughout, zero new warnings
  attributable to lee-child content (the one warning in this wing's .orrery
  handoffs is completeness-auditor's pre-existing 1317-word handoff, not
  this stage's to fix). Before: 46 works, 5 aura, 0.11/work, longest dark
  run 12yrs (2008-2019). After: 46 works, 11 aura, 0.24/work, longest dark
  run 4yrs (1997-2000, before the series had any screen or prize history to
  draw on). No wing-flagged dark run remains for lee-child.

dark_run_2008_2019_closed_with: >
  Four franchise events tracing the character's screen life end to end,
  each with two or three independently-read sources: (1) the 2012 Jack
  Reacher film - Tom Cruise (5'7") cast against the books' 6'5" Reacher,
  with Child's contemporary public defense quoted directly ("100 per cent
  of Reacher with 90 per cent of the height"); (2) the weaker 2016 sequel,
  Never Go Back, which underperforms the first film and ends Cruise's run
  (his own TSA-agent cameo noted in passing, not given its own entry); (3)
  the genuinely sourced reversal - in a November 2018 interview (read via
  Fox News and Gulf News, both independent of each other) Child says "the
  readers were terribly upset about it and I think, ultimately, the readers
  were right," and repeats the same verdict in a separate 2025 Independent
  interview (read via SlashFilm's account of it); (4) the February 2022
  Amazon Prime series recasting Reacher as Alan Ritchson (6'3", read and
  verified against SlashFilm's own height comparison piece, not just
  reported), which Child credits directly with finally getting the size
  right. This is exactly the arc the brief flagged as the obvious material,
  and it closes the run cleanly: no gap left inside 2008-2019 wider than 4
  years (2008-2011).

second_dark_run_2002_2006_found_and_closed: >
  aura_density.py's *next*-longest run only surfaced after the first fix
  landed (12yr run was masking it): 2002-2006, 5 years, also over the
  routing threshold. Closed with one entry not in the original brief: The
  Enemy (2004), Child's first Reacher prequel, wins the Barry Award for
  Best Novel and the Nero Award and is nominated for the Dilys Award in
  2005, per that novel's own Wikipedia page, the Nero Award's own winners
  list (a separate article, independent corroboration), and a 2007
  crime-fiction blog contemporary enough to have covered it firsthand. This
  is a genuinely new find via research, not one of the four adaptation
  events, and left the wing with no run at or above 5 years anywhere in its
  1997-2026 span.

rejected:
  - "A first #1 New York Times bestseller claim: an early AI search summary
    named two different candidate titles inconsistently and no publisher or
    Times list was found to settle which book actually did it first. Left
    out rather than shipping a guess."
  - "Lee Child's own TSA-agent cameo in Never Go Back: real and sourced
    (Wikipedia), but a walk-on with nothing behind it beyond its own
    existence. Folded into the Never Go Back entry's description rather
    than given a slot of its own."
  - "International Thriller Writers: Wikipedia lists Child only as a
    'notable member' with no date or role attached to his involvement, and
    he was not a founder or co-president (Gayle Lynds and David Morrell
    were); too thin to date or to earn a slot. His actual presidency (2009,
    Mystery Writers of America, not ITW) sits outside both dark runs and
    was not chased further."
  - "Lee Child's US naturalization/citizenship: searched specifically since
    it would explain his cross-Atlantic life during the empty stretch;
    no source gives a year or confirms it happened at all (only that he
    moved to the US in 1998 and holds British citizenship). Did not
    fabricate a date; left out."
  - "The Enemy's in-fiction setting (last night of 1989, Cold War ending):
    a real, decisive-looking resonance, but ruling on a global.yaml
    inclusion is event-resonance's call, not this stage's; not touched."

what_the_record_would_not_give: >
  Both searched-for personal-life anchors for the empty decades (US
  citizenship, any health/family news) come up genuinely empty in the
  open record, not just under-searched: multiple direct queries returned
  nothing beyond what the existing lifeEvents already state. For a living,
  press-friendly author who talks readily about craft and casting, the
  absence of citizenship/health/family reporting reads as a real gap in
  what's public, not a gap in what was checked - consistent with the
  restraint the existing scaffold already exercised on this point.

residual_gap: >
  None of 5+ consecutive years remains anywhere in the wing's 1997-2026
  span. The next-thinnest stretch is 1997-2000 (4 years, the debut-novel
  years, before the series had any prize or screen history yet to draw
  aura from) - a real, honest silence rather than an under-searched one,
  and not touched further this run.
