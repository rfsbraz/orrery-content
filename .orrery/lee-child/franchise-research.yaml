stage: franchise-research
wing: lee-child
summary: >
  Scaffolded the Lee Child wing: identity verified (Lee Child = pen name of
  James Dover Grant, British, b. 1954, Coventry; Jack Reacher debuted in
  Killing Floor, 1997) against Wikipedia and the BBC's own 2020 report, not
  assumed from the issue brief. 34 works in works.yaml: 31 Jack Reacher
  novels (subseries "Jack Reacher"), two short-fiction collections (No
  Middle Name 2017, Safe Enough 2024), one nonfiction essay (The Hero,
  2019). Two author entities: content/authors/lee-child.yaml (full bio, 3
  lifeEvents, portrait) and content/authors/andrew-child.yaml (thin
  co-author entity per the brief - no lifeEvents, no bibliography of his own
  Andrew Grant-credited work, which stays out of scope for this wing).

co_authorship_finding: >
  Verified the byline progression (Wikipedia's Lee Child and Andrew Grant
  pages, cross-checked): novels 1-24 (Killing Floor 1997 through Blue Moon
  2019) are Lee Child alone. Books 25-31 - The Sentinel (2020) through the
  forthcoming Chain Reaction (2026) - all carry withAuthorIds:
  [andrew-child], authorRole: co-author, still jointly credited on the
  cover. No solo Andrew Child novel exists yet despite the January 2020
  announcement of a full handover; Grant's own solo work (as Andrew Grant)
  predates and sits outside this co-authorship, out of scope here. Recorded
  the 2020 BBC handover announcement as a lifeEvent on lee-child.yaml since
  it explains the byline change at book 25.

short_fiction_handling: >
  No Middle Name (2017) is entirely Reacher material - two novellas, ten
  stories, including every individually-published Reacher ebook single from
  2011-2017 (Second Son, Deep Down, High Heat, and others, confirmed against
  Wikipedia's contents list) - so none of those get separate entries. Safe
  Enough (2024) is different: twenty stories spanning Child's career, and
  cross-referencing its contents against Wikipedia's "other short stories"
  table shows several are not Reacher pieces (a Sherlock Holmes tribute
  anthology, an Edward Hopper-inspired one, a Nicotine Chronicles one) - so
  it carries subseries: null, unlike No Middle Name. Left uncatalogued:
  magazine-only Reacher stories never collected, and the crossover novellas
  with other authors' characters (Slaughter's Will Trent, Finder's Nick
  Heller, Reichs's Temperance Brennan, Rose's Butterfield Institute) - real
  completionist data, flagged for completeness-auditor rather than papered
  over.

capabilities: >
  river and companion await press-archaeology's timeline events (globalEvents
  alone does not trigger them); wizard and editions stay off - no startHere,
  no editions.yaml. globalEvents is populated and ruled: sept-11-2001
  included on Reacher's own documented post-2001 habits, not assumed from the
  author's lifespan; ebook-and-self-publishing-2007 included because it
  explains the 2011-2017 ebook-single run behind the wing's short-fiction
  shape. Full reasoning and exclusions are in franchise.yaml's comments.

theme_draft_for_visual_language: >
  Not written to theme.yaml (a partial palette-without-art hard-errors
  validate.py). Proposed preset name: "hitchhiker-noir". Palette sketch:
  bg a flat asphalt charcoal (near #17181a), ink a cold white-grey (#e8e8e6),
  accent a faded highway-yellow (#c9a227) for the road-line motif every book
  shares - Reacher travels by bus, on foot, by thumb, never owning a car.
  displayFace: sourceSerif (plain, fast, unornamented prose, closer to
  Connelly's register than to anything gothic). signature: rule (a firm,
  straight architectural line - the road itself, and the military-precision
  voice). Every existing crime wing (Connelly's LA dusk, Slaughter's Georgia
  humidity, French's wet peat, Nesbo's Nordic cold, Flynn's newsprint grey)
  is regional and settled; this wing's register is the opposite, a
  placeless American interstate at night, which is why none of the existing
  palettes overlap it.

open_questions:
  - "Featured cap used 2 of 3 (Killing Floor, The Sentinel). A curator could
    argue for a third (e.g. Chain Reaction once released, or Never Go Back
    for its film) - left open rather than filled speculatively."
  - "Whether the uncatalogued magazine-only short stories and cross-author
    crossover novellas listed above earn individual apocrypha entries is
    completeness-auditor's call, not mine - the source list is in
    works.yaml's header comment and this handoff."
  - "eras.yaml, orders.yaml, events.yaml, editions.yaml, achievements.yaml:
    none written. A thirty-one-book procedural series may not earn eras at
    all (no coined periodization exists in any source checked) - that
    judgement belongs to the eras skill, not assumed here."
