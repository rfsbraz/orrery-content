checked_and_deliberately_not_added:
  crossover_novellas: >
    Good and Valuable Consideration (2014, with Joseph Finder's Nick Heller,
    in FaceOff), Faking a Murderer (2017, with Kathy Reichs's Temperance
    Brennan, in MatchUp), and Cleaning the Gold (2019, with Karin Slaughter's
    Will Trent) are all real, two-source-confirmed titles (jackreacher.com
    plus Wikipedia's in-story chronology, which footnotes each collaborator).
    Not added: each is co-written with a named author who has no global
    entity in this repo, and creating one purely to catalogue a single
    crossover story is the scope call this skill reserves for the curator,
    not the auditor. Full bibliographic data is in this file if the decision
    is to add them.
  andrew_child_solo_short_fiction: >
    New Kid in Town (2022, in the Hotel California anthology) and Bat Out of
    Hell (2025, in the Don Bruns anthology of the same name) are both
    confirmed via multiple independent retail/publisher listings (Amazon US
    and UK, Audible US and UK, Apple Books, Blackstone Publishing) as
    Andrew Child's own solo work, with no Lee Child involvement at all - a
    genuine, if easy to miss, first: solo Andrew Child work exists, just not
    yet a novel. (One aggregator, FantasticFiction, credits both brothers;
    the five independent primary retail/publisher listings do not, and are
    weighted higher.) Not added to this wing: Lee Child is not merely
    secondary here, he is absent, and whether solo-Andrew Reacher work
    belongs in a wing titled for his brother is exactly the scope question
    this skill reserves for the curator - and it will recur at larger scale
    if/when Andrew publishes a solo novel.
  fractional_serial_chapters: >
    Like a Charm (2004), The Chopin Manuscript (2007) and The Copper
    Bracelet (2009, print-collected as Watchlist, 2010) are each a
    multi-author round-robin serialized novel to which Child contributed a
    single chapter, credited by chapter number rather than a distinct title
    of his own (the one exception, "The Snake Eater by the Numbers" from
    Like a Charm, has its own title and is already collected in Safe
    Enough). Not added as separate works: Child is one of over a dozen
    authors on a single collaborative novel in each case, not the author of
    a distinguishable piece.
  the_line_up_2010: >
    "Lee gives the inside story on Reacher and his origins" per
    jackreacher.com - reads as a promotional essay/interview with no
    distinct title of its own. Not added, for the same reason as the serial
    chapters: no standalone authored piece to catalogue.

