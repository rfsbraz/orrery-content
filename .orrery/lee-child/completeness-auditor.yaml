stage: completeness-auditor
wing: lee-child
summary: >
  Audited the 34-work scaffold against jackreacher.com's own bibliography
  page, Wikipedia's Jack Reacher (novel series) article, and independent
  retail/publisher/review pages for every title. Works before: 34. Works
  after: 46 (12 added, 0 removed, 0 dates corrected). validate.py green
  throughout, no new warnings on this wing.

final_count_by_subseries:
  total_works: 46   # was 34
  jack_reacher_core_novels: 31   # unchanged: killing-floor (1997) through chain-reaction (forthcoming 2026-10-20)
  extended_tier: 4   # no-middle-name, the-hero, safe-enough, reacher-the-stories-behind-the-stories
  apocrypha_tier: 11
  apocrypha_solo_reacher_stories: 4   # the-christmas-scorpion, smile, the-fourth-man, many-happy-returns
  apocrypha_editor_or_contributor: 7   # killer-year-stories-to-die-for, first-thrills,
                                       # best-american-mystery-stories-2010, jack-reachers-rules,
                                       # anatomy-of-innocence, the-nicotine-chronicles,
                                       # how-to-write-a-mystery

verified_not_corrected:
  novel_count_and_co_authorship_boundary: >
    Fetched en.wikipedia.org/wiki/Jack_Reacher_(novel_series) directly (not
    just the scaffold's inherited claim). Confirmed verbatim: "Starting with
    the 25th novel in the series, The Sentinel (2020), all subsequent books
    in the series have been co-authored by and credited to both brothers."
    31 novels stands (1997-2026, forthcoming 20 Oct 2026), and books 25-31
    (the-sentinel through chain-reaction) all correctly carry
    withAuthorIds:[andrew-child]/authorRole:co-author already. No correction
    needed. Note: a WebSearch AI-summary independently claimed Andrew Child
    has written solo since book 29 (In Too Deep, 2024) - checked against the
    primary Wikipedia source and found false; not acted on.
  no_middle_name_and_safe_enough_contents: >
    Cross-referenced Wikipedia's own "No Middle Name" contents list (a
    novella plus ten stories, all named) against the scaffold's claim: all
    eleven previously-uncollected Reacher singles (Second Son, Deep Down,
    Guy Walks into a Bar, James Penney's New Identity, High Heat, Everyone
    Talks, Not a Drill, Small Wars, The Picture of the Lonely Diner, Maybe
    They Have a Tradition, No Room at the Motel) are confirmed inside it.
    None needed a separate entry.

correction_made:
  safe_enough_synopsis: >
    The scaffold's synopsis said Safe Enough held "several" Reacher pieces.
    Checked against jackreacher.com's own list of Child's other short
    fiction (which matches fourteen of Safe Enough's twenty story titles to
    named prior anthology appearances, none of them Reacher) plus dozens of
    independent Goodreads reviews stating plainly that Reacher is absent
    from the book. Corrected: Safe Enough holds exactly one Reacher
    connection, an exclusive new Jack Reacher/Maggie Bird crossover written
    with Tess Gerritsen (confirmed via Goodreads review text and the
    official short-story list); the other nineteen are non-Reacher.
    Rewrote the synopsis and added a note plus two further sources
    (Goodreads, jackreacher.com). Does not reorder anything; corrects a
    description, not a date.

