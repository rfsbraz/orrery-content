stage: reading-orders
wing: lee-child
summary: >
  Shipped one order (lee-child/chronological-inuniverse, 31 novels) and a
  3-path startHere. Orders before: 0. Orders after: 1. startHere before:
  none. startHere after: 3 paths. validate.py green (--slug lee-child, then
  full catalogue), zero new warnings after two wording fixes.

order_shipped:
  lee-child/chronological-inuniverse:
    type: chronological-inuniverse
    basis: >
      Wikipedia's Jack Reacher (novel series) chrono-order column, cross-checked
      against two independent guides (bookseriesinorder.com, T.L. Branson's
      tlbranson.com) that agree on the identical sequence with no disputed
      placements: The Enemy, The Secret, Night School, The Affair (the four
      prequels, in that order) ahead of Killing Floor, then the remaining 27
      novels unchanged from publication order.
    scope_and_exclusions: >
      Novels only (31 of 46 works). Excluded and why: No Middle Name (a single
      catalogue entry whose own contents span roughly 1974 to the present,
      so it has no one timeline position); Safe Enough (one Reacher connection
      inside 19 unrelated stories, not itself a Reacher-timeline entry); The
      Hero and Reacher: The Stories Behind the Stories (outside Reacher's
      story entirely); the four uncollected solo Reacher stories (The
      Christmas Scorpion, Smile, The Fourth Man, Many Happy Returns) - only
      one source (tlbranson.com) places any of these on a timeline, and it
      places two of the four while omitting the other two from its own
      chronological list, short of the two-source bar the novel sequence
      clears easily.
    spoiler_vector: >
      Named in the rationale and debated, not just flagged structurally: the
      four prequels were written well after (and with knowledge of)
      everything that follows them, so this order is framed as a reread/
      completionist arrangement, not a way in - matching how jackreacher.com
      and tlbranson.com themselves frame it.

rejected_with_reasons:
  - "A second 'integrated' order (publication order with prequels re-slotted,
     the wheel-of-time shape): doesn't apply here. WoT's New Spring needs
     integration because it's released outside the numbered sequence. All
     four Reacher prequels are numbered mainline novels already sitting at
     their own publication-year slot in the derived default, so the default
     already delivers 'meet each prequel where Child published it.'"
  - "A 'novels only, publication order' order mirroring jim-butcher's Dresden
     order (skip the 11 editor/contributor/nonfiction entries): rejected.
     Butcher's case filters out two complete, competing fantasy series
     sharing no universe with Dresden. Lee Child's excluded works are
     periphery, not a rival series, already rendered compact/cover-less by
     canonTier: apocrypha (docs/SCHEMA.md), and no source recommends
     skipping them as a strategy."
  - "An order split at the co-authorship handover (solo Lee Child through
     Blue Moon vs. Andrew Child co-writing from The Sentinel on): rejected,
     consistent with eras.yaml's verdict on the same boundary - both authors
     frame it as continuity, and it's the same continuous story, not a
     different reading experience to sequence."
  - "The '61 Hours -> Never Go Back Virginia arc' claim from an AI search
     summary: did not hold up. The real connective thread is narrower (just
     those two novels, via the Susan Turner thread) and both already sit
     sequentially in the derived default with nothing to reorder; the
     broader 'books 14-18 must be read together' framing overstates it
     (Worth Dying For and A Wanted Man are self-contained)."

startHere_paths:
  - "start-with-killing-floor: workIds [killing-floor], fit new/taste+arc.
     Sourced: jackreacher.com's own 'Books in order' page lists it first;
     T.L. Branson, SlashFilm, Parade, Dexerto all independently open their
     guides at the same title."
  - "whole-shelf: orderId default, fit returning+completionist/complete."
  - "chronological: orderId lee-child/chronological-inuniverse, fit
     completionist/complete, with a note steering new readers away from it -
     matches SKILL.md's rule to tag the fit honestly and name the spoiler
     cost in the reader-facing prose itself, not only in debated."

gates:
  validate: "green, --slug lee-child then full catalogue; two self-caught
    pipeline-vocabulary warnings ('second pass', 'handoff') fixed before
    landing, zero warnings remaining beyond the 4 pre-existing handoff-length
    ones on this wing"
  i18n: "lee-child carries zero pt-PT translation already (per
    completeness-auditor); this stage's English-only prose adds more
    untranslated content to an already-0%-covered wing, which is not a
    regression against the starting number - translation is a later stage"
  pt-PT_overlay: "not written this stage; nothing to mirror into yet"

