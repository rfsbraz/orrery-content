stage: press-archaeology
summary: >
  Built the biographical spine: 4 new lifeEvents on
  content/authors/aj-finn.yaml (the required birth entry; the 2013
  fabricated-surgery emails; the 2016 mid-auction identity reveal; the 2019
  New Yorker exposure and statement) and 4 new events on
  content/franchises/aj-finn/events.yaml (the 2018 #1 bestseller debut; the
  2019 plot-similarity allegations and their rebuttal; the 2021 film's
  three-times-delayed release; the 2024 End of Story return). Both real
  controversies franchise-research and completeness-auditor flagged are now
  sourced and written up: the fabrication reporting against the
  two-independent-source bar (New Yorker as the fact-checked primary
  account, the Guardian's own separately-sourced reporting from Little,
  Brown as the second), and the plot-similarity allegations at this repo's
  ordinary bar (industry/press dispute, not a health/family/legal claim),
  precise about what was alleged and what came of it (a correction, no
  lawsuit). aura_density.py's longest dark run is now 2 years (2022-2023),
  down from 4 (2021-2024), on a per-work ratio of 8.5. validate.py --slug
  aj-finn is clean except the expected missing theme.yaml `art:` block.
produced:
  newLifeEventIds:
    - ajf-born-1979
    - ajf-jake-surgery-emails-2013
    - ajf-auction-identity-revealed-2016
    - ajf-new-yorker-trail-of-deceptions-2019
  newFranchiseEventIds:
    - aj-finn-woman-in-the-window-number-one-2018
    - aj-finn-plot-similarity-allegations-2019
    - aj-finn-film-adaptation-delayed-2021
    - aj-finn-end-of-story-return-2024
  filesWritten:
    - content/authors/aj-finn.yaml
    - content/franchises/aj-finn/events.yaml
  rejected: >
    Nothing found rose to a separate entry beyond what shipped. Two
    candidates were folded rather than given their own slot: the 1999 Duke
    Chronicle essay (Mallory's own account of using his mother's real
    cancer to win college sympathy) is real and self-disclosed but reads as
    the same pattern as the 2019 entry a decade earlier, not a distinct
    rupture - it is one sentence inside ajf-new-yorker-trail-of-deceptions-2019
    rather than its own event. Scott Rudin's own, unrelated conduct history
    surfaced in the film's production record and was left out entirely: it
    belongs to Rudin's biography, not Finn's or this franchise's.
  correction: >
    None. No prior wrong date or fact was found in this wing's existing
    content to correct.
forStages:
  eras: >
    No hinge candidates beyond franchise-research's own reasoning (two
    novels, six years apart, nothing to divide). The 2019 rupture sits
    inside the gap between the two books, not at a boundary a third work
    would need.
  visual-language: >
    New sourced motifs, all avoiding a real-person likeness (VISUAL.md §3):
    a birthplace/Charlotte establishing landscape; a facsimile of the "Jake"
    surgery emails (document-facsimile, artifact-spread); a
    network-constellation of publishing houses around a withdrawn-then-not-
    withdrawn manuscript for the 2016 auction; a portrait-of-absence for the
    2019 immersion entry (deliberately not a likeness - the emptiness behind
    a fabricated story is the subject); press-media-collage treatments for
    the 2018 debut, the 2019 plot-similarity dispute (paired with
    artifact-spread for Mallory's own exculpatory outline), the delayed 2021
    film, and an aftermath-scene for the 2024 return.
  reading-orders: No change to the two-standalone structure.
  world-events: >
    Not routed to. The 2020 COVID production delay is recorded as part of
    the film's own event (a franchise fact - the film was pulled from its
    calendar slot) rather than a global event, since nothing about the
    novels themselves answers the pandemic the way this skill's bar for a
    world event requires.
openQuestions:
  - "The remaining 2022-2023 dark run reads as genuinely quiet, not
    unresearched: the Washington Post's 2024 review itself frames these
    years as Mallory working chiefly as a blurb-writer for other authors'
    thrillers while End of Story remained unfinished, which is texture, not
    a dateable rupture worth its own entry."
  - "Two of the four lifeEvents (2013, 2019) and one franchise event (2019
    plot-similarity) needed the elevated two-source bar and got it; the
    2016 auction-reveal lifeEvent rests on the New Yorker's reporting alone,
    at the ordinary bar, since it is an industry/business reaction rather
    than a health, family or legal claim - flagged here in case a curator
    reads it differently."
  - "Mallory's exact birth date (day and month) remains unconfirmed - the
    live English Wikipedia infobox carries only the bare year 1979, per
    franchise-research's own finding; the birth lifeEvent is dated to the
    year only, matching `born: 1979`."

auditFixesApplied:
