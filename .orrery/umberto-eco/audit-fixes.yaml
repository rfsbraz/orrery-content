stage: audit-fixes
wing: umberto-eco
summary: >
  Two corrective passes over the same files, recorded together. The first
  answered event-resonance's dark-run finding; the second cleared the
  defects wing-audit routed. Nothing here changed an editorial judgement
  that was already sound - each edit either corrected a false statement or
  recorded a decision that had only been assumed.

firstPass:
  origin: press-archaeology follow-up
  what: >
    Excluding two global events had widened the worst dark run from 4 years
    to 13 (1956-1968). Added six dated, sourced entries and enriched one;
    closing 1956-1968 exposed three further runs (8, 6, 5 years) a worse one
    had hidden, all closed in the same pass. Files: authors +4 lifeEvents
    and one enrichment, events.yaml +3.
  leads: >
    Bompiani discovering Eco through Filosofi in libertà and hiring him in
    1959 (en.wikipedia) - the pamphlet's own 1958 date flagged then, fixed
    in the second pass. Opera aperta's two moments from it.wikipedia's
    Ricezione section (60+ press articles June 1962-Feb 1963; Lévi-Strauss's
    1967 rejection and Eco's reply). Guerriglia semiologica placed at
    Vision '67, New York, by three independent sources. Apocalittici e
    integrati researched and not added: no dated reception to anchor to.
    Eco's 1958 RAI departure enriched the 1954 entry rather than becoming
    its own. Gaps closed: 1997-2004 (Luther Blissett; the 2000 Scuola
    Superiore presidency), 1979-1984 (Strega 1981, Médicis 1982), 1991-1995
    (Rorty 1992). aura_density: 30 -> 26 entries, worst run 4 years.

secondPass:
  origin: wing-audit findings
  lutherBlissettDenial: >
    The entry claimed Eco denied the rumour "on the record to Il Messaggero
    on 6 March 1999". That paper only referred back to a denial already made
    ("who has already denied it"). No source names where or when he first
    gave it, so the entry now says that, with Panorama's 25 February
    speculation and La Repubblica's same-day interview carrying the
    chronology instead. Mirrored into pt-PT.
  filosofiInLiberta: >
    published: 1958, from it.wikipedia's Opere line ("Filosofi in libertà,
    come Dedalus, Torino, Taylor, 1958"), the only source that dates the
    pamphlet; en.wikipedia's 1959 is the year Bompiani approached Eco. Pen
    name set to Dedalus here and on the author entity, with the English
    "Daedalus" spelling recorded in the synopsis and the pseudonyms note
    rather than dropped. No order contains the pamphlet, so ordering and
    aura_density are unaffected.
  beyondTheNovelsDebated: >
    The 18 theory titles are no longer excluded on "never translated or a
    university press": Kant and the Platypus went to Harcourt/Mariner and
    The Search for the Perfect Language to Blackwell, as works.yaml's own
    cover comments record. The reason given is now density and a specialist
    readership. Sette anni di desiderio left the "no English edition found"
    bucket (nine now, not ten) for its own entry - en.wikipedia's Faith in
    Fakes names it and Il costume di casa as that selection's two source
    volumes, so its translated part is already on the list. Both synopses
    and the pt-PT overlays follow.
  globalEvents: >
    All 19 now ruled. world-war-i-1914 and elementary-education-act-1870
    excluded: pre-birth with nothing inheriting them. pulp-magazines-1926
    excluded on argument, not omission - his popular forms are the
    feuilleton, American comic books and Italian 1930s-40s comics and
    magazines, not the Anglo-American genre sorting Amazing Stories began,
    the same ground as comics-code-authority-1954. covid-19-pandemic-2020
    and booktok-2020 excluded: he died in February 2016 and all four
    posthumous volumes gather writing dated 1955-2016.
  formatsAndCitations: >
    format: nonfiction on belief-or-nonbelief and
    non-sperate-di-liberarvi-dei-libri, so only the seven novels default.
    The Rorty entry now also cites it.wikipedia, the only page carrying the
    1990 Tanner Lectures. The imbecilli entry drops the unsupported "reported
    first by La Stampa" for Il Fatto Quotidiano and Il Post, both 11 June
    2015, which is what the cited pages footnote for the remark itself.
  epigraphQuote: >
    pt-PT now carries a Portuguese rendering. The base string is not Eco's
    words: Postille a «Il nome della rosa», then Bouzaher's French-edition
    introduction (p. 18, 1985), then Wikiquote's English. Both file headers
    record the chain.

gates:
  validate: "0 errors; 4 warnings, all pre-existing handoff word counts"
  aura_density: "67 works, 26 aura, 0.39/work, 1956-2022, longest dark run 4 yrs (1963-1966) - unchanged"
  i18n_coverage: "pt-PT 208 -> 209/224 files fully covered; authors/umberto-eco.yaml 36/36"

