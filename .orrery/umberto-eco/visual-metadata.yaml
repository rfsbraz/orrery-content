stage: visual-metadata
summary: >
  Sourced covers for 38/67 works (57%): all 7 novels, all 20 works the
  beyond-the-novels order selects, plus 11 bonus extended-tier titles. Added
  a franchise header (Gerrit Dou, "The Astronomer by Candlelight", Commons,
  public domain) and an author portrait (CC0 1984 Dutch press photo,
  Commons). The wing's own trap - 40+ years of Bompiani/Harcourt/Vintage/
  Picador covers to choose wrong among - resolved into a real pattern: six
  of seven novels share one live Houghton Mifflin Harcourt/Harvest/Mariner
  design family (Mariner is now the HarperCollins imprint this file's
  bibliography note already names as current publisher of all seven); only
  Queen Loana has no cover in that family on Open Library and falls back to
  Vintage UK. lookup.py's default 100-work limit missed almost the whole
  extended tier (it surfaces OL's most-reprinted records first, i.e. the
  novels); --limit 500 found real candidates for the rest. validate.py
  --slug umberto-eco: 0 errors. 38 unique cover URLs for 38 covered works,
  no repeats.

produced:
  files: [content/authors/umberto-eco.yaml, content/franchises/umberto-eco/franchise.yaml,
    content/franchises/umberto-eco/works.yaml]
  fieldsAdded: [images (portrait), images (header), images.cover/coverCredit/coverSource on 38 works]
  fieldsTouched: []

coverage:
  covers: "38/67 (57%); novels 7/7; beyond-the-novels order 20/20; 11 further bonus titles"
  header: "1/1, franchise.yaml"
  portrait: "1/1, authors/umberto-eco.yaml"

rejectedOnInspection: >
  Header: Schalken's "A Scholar by Candlelight" (a private dealer's own
  glare-lit photo of the framed painting, "own collection" credit, not
  trustworthy); an anonymous "Scholar's Study at Oxford or Cambridge"
  drawing (MET, CC0, too bright a Victorian parlour for this wing's near-
  black-shadow register); de Poorter's "A Scholar in His Study"
  (Rijksmuseum, public domain, too dim once cropped to a wide band).
  Covers: a-passo-di-gambero and the-sign-of-three each have a second
  cataloged cover id that no longer resolves to an image; a-passo-di-
  gambero also had a washed-out near-monochrome duplicate scan under the
  same ISBN.

gaps: >
  29 works bare, all in the specialist semiotic/aesthetic-theory half of
  the extended tier that orders.yaml's own beyond-the-novels rationale
  already sets aside as "read as a single theoretical argument." Not
  searched: the boundary was completeness against a curated reader-facing
  order plus bonus coverage wherever a clean candidate turned up cheaply,
  not a percentage target. The five Carmi-illustrated children's books and
  five apocrypha entries were not attempted at all - a likely next target,
  since picture books are exactly the kind of title Open Library tends to
  hold real jacket art for.

notableChoices:
  novelFamily: >
    The HMH/Harvest/Mariner family across six novels was discovered, not
    assumed - each novel's candidates were pulled and viewed independently,
    and the same lineage kept winning the cleanest/most-current comparison.
  rizzoliTrilogy: >
    History of Beauty, On Ugliness and The Infinity of Lists share one
    Rizzoli illustrated-history design, found the same independent way.
  header: >
    Dou's candlelit-scholar painting matches visual-language.yaml's STYLE
    line almost verbatim without touching the abbey library the avoid list
    rules out, and depicts no scene from any of the seven novels.
  portrait: >
    A CC0 press photo, also the current Wikipedia infobox image and a
    Commons Featured Picture; already a clean tall portrait crop, no
    personality-rights flag.

forStages:
  editions: >
    Every ISBN in a cover's works.yaml comment is the edition whose OL
    record actually carries that cover - cross-check editions.yaml against
    those specific printings. Queen Loana's cover edition (Vintage UK,
    9780099481379) is deliberately not the same family as the other six;
    worth carrying forward rather than "fixing" to match.
  translation: >
    No prose changed, only images blocks and data-decision comments.
  wing-audit: >
    Two OL data-quality quirks worked around, not fixed upstream: Inventing
    the Enemy is split across five separate OL work records (used the
    best-corroborated); The Open Work's Harvard/Hutchinson co-edition is
    filed under publisher "Harvard University" for a Hutchinson ISBN.
    Neither affects the image shown. externalIds.openLibrary remains empty
    throughout works.yaml per the bibliography's own note - untouched here.

openQuestions: []
