stage: reading-orders
summary: >
  Built startHere (3 paths) and one order (umberto-eco/beyond-the-novels,
  20 works). The Name of the Rose is the entry point, checked rather than
  assumed against a Guardian obituary and a live reddit.com/r/suggestmeabook
  thread, both cited on the path. Baudolino and Numero Zero were checked as
  alternate "easier entry" candidates and rejected (see entryPath below).
  No prequel-spoiler vector exists: all seven novels are standalone, no
  shared characters, nothing set earlier than something Eco had already
  published. The Name of the Rose's own Latin problem (confirmed by
  completeness-auditor) is surfaced on the entry path's own `note:` field,
  not left as an abstract tiering fact.
  validate.py --slug umberto-eco: 1 error (the pre-existing expected
  theme.art gap), 3 pre-existing oversized-handoff warnings untouched here,
  0 new warnings.

produced:
  files:
    - content/franchises/umberto-eco/orders.yaml
    - content/franchises/umberto-eco/franchise.yaml (startHere block +
      header comment)
  orders: 1
  startHerePaths: 3

entryPath:
  chosen: umberto-eco/the-name-of-the-rose
  rejectedAlternates:
    baudolino: >
      AS Byatt's Guardian review calls it "Eco's most readable tale" but in
      the same sentence "his least satisfactory," inside a
      mixed-to-negative verdict on the novel - not a start-here
      recommendation; promoting the phrase would misuse the source.
    numero-zero: >
      No citable critical or community consensus found beyond low-traffic
      blog listicles, which CURATION.md's trap registry already
      disqualifies as sourcing. No path built on it.

extendedTierNavigation:
  order: umberto-eco/beyond-the-novels
  criteria: >
    Two receivable signals, not the curating agent's own literary judgment:
    format/venue (essay-collection, illustrated cultural history, or a
    named public lecture series, versus a single-throughline theoretical
    monograph) and English translation history (recorded per-entry in
    works.yaml) as a market signal of judged general-reader interest. 20 of
    55 extended works cleared both; 18 are the specialist theory the task
    flagged as the risk (A Theory of Semiotics, The Role of the Reader,
    Kant and the Platypus among them); 10 more are untranslated
    journalism/essay volumes held out on the translation signal alone
    despite matching genre, named explicitly in the order's own `debated`;
    6 are children's/illustrated fables, a different register; 1 (How to
    Write a Thesis) fits neither bucket and is named as such. Closer calls
    (Interpretation and Overinterpretation included on venue over
    difficulty; Apocalittici e integrati only partially translated) are
    flagged in the order's `debated`, not smoothed over.

forStages:
  spoiler-audit: >
    All new prose was written to need no gate: no plot beyond back-cover
    premise, no reveal named to justify a warning. No spoilerAfter was
    added anywhere. This stage does not run spoiler-audit's own checklist.
  wing-audit: >
    Re-derive beyond-the-novels' declared scope against works.yaml if a
    future completeness pass adds extended-tier works - sort a new title
    into the accessible order, the specialist-by-translation-absence group,
    or a fresh category, not left to default silently; `debated` already
    names all 35 excluded works so the diff is mechanical. Also worth a
    second read: the Interpretation and Overinterpretation and Apocalittici
    e integrati inclusions named above as closer calls.

openQuestions: []
