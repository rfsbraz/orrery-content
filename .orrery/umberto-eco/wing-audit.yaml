stage: wing-audit
wing: umberto-eco

summary: >
  First end-to-end read of the finished wing. Five gates re-derived from
  scratch rather than inherited, and every "0 errors / fully covered /
  nothing outstanding" claim in the twelve upstream handoffs re-tested
  against the artefact. The wing is in genuinely good shape: the seven
  novel synopses hold at jacket level in both languages, the five pt-PT
  title substitutions are letter-perfect against editions.yaml, the
  Weaver/Brock/Dixon mapping agrees across works.yaml and editions.yaml,
  the 2014 revised Name of the Rose note is corroborated by its own cited
  MARC record without overclaiming, all 138 source URLs resolve, and the
  20/35 split in beyond-the-novels reconciles exactly against works.yaml.
  Four real defects found. The largest is not this wing's fault and is not
  fixable inside it: franchise.images.header is dead content catalogue-wide,
  because the app deleted its rendering on 2026-07-27 and nobody told the
  pipeline. Two false facts reach a reader. One published year is wrong and
  was flagged by an upstream stage that had no owner to route it to.

gates:
  validate:
    command: "python3 scripts/validate.py --slug umberto-eco"
    result: "0 errors, 3 warnings (all handoff word counts on other stages: press-archaeology 736, franchise-research 1625, completeness-auditor 847)"
    verdict: >
      Green, before and after this stage's one edit. Guards falsified rather
      than trusted: a bogus displayFace fires, a bogus signature fires, and a
      bogus globalEvents include id does NOT fire - confirmed unvalidated, so
      all 19 global events were ruled by hand instead. Working tree restored
      and re-validated after every test. No work is orphaned outside an era
      span because eras is deliberately empty, so that warning class cannot
      fire here.
  i18n_coverage:
    command: "python3 scripts/i18n_coverage.py"
    result: "pt-PT 208/224 files fully covered; authors/umberto-eco.yaml 35/36 (missing: quote)"
    verdict: >
      Re-derived field by field, not read off the script: 67/67 synopses,
      7/7 franchise events, 17/17 lifeEvents, bio, franchise description,
      all 3 startHere paths (both notes included), the order's name +
      rationale + all 4 debated entries, and both collaborator bios. Every
      inline [[work:]] link survives the overlay with its id intact - checked
      pairwise base against pt-PT for all 91 prose fields, zero drift. The
      one uncovered field is the epigraph `quote`, deliberately left English;
      six other wings do the same. See curatorsCall - the argument for
      leaving it is weaker here than elsewhere, because the base is already a
      translation of Italian.
  event_density:
    command: "python3 scripts/event_density.py"
    result: "19 global events, {med 11, low 6, high 2}; high budget 2 used of ~17; no decade over the budget of 3"
    verdict: >
      Inside budget on every axis. This wing adds nothing to global.yaml.
      The empty pre-1870 decades belong to the Cervantes and Poe spans, not
      to this one.
  aura_density:
    command: "python3 scripts/aura_density.py umberto-eco"
    result: "67 works, 26 aura, 0.39 per work, span 1956-2022, longest dark run 4 yrs (1963-1966)"
    verdict: >
      The 4-year figure is TRUE and the saga behind it resolves correctly.
      Arithmetic checked by hand: 17 lifeEvents + 7 franchise events + 2
      included globals = 26. The wing is not flagged, and it is one of only
      22 of 34 wings under the 5-year gate. Proportionate against comparable
      shelves: agatha-christie 86 works/0.38, stephen-king 95/0.29,
      terry-pratchett 75/0.35, margaret-atwood 69/0.36. Eco sits at the
      median for a wing of its size, not below it.
  art_rotation:
    command: "python3 scripts/art_rotation.py --check umberto-eco"
    gate_line_1_organisation: "organisation rotation holds across all 24 events: no organisation over its cap, no neighbour repeats"
    gate_line_2_pacing: "pacing holds: no two loud cells touching or sharing a screenful, no plateau (contour #===#==.==.=.#===#==.=#=)"
    exit_code: 1
    verdict: >
      Both gate lines pass and, unlike the Tolkien wing, the checker really
      does see the whole river: 24 is the complete graded set (17 lifeEvents
      + 7 franchise events), because eras is empty so there is no
      chapter-gate slot, and the two collaborator authors carry
      `lifeEvents: []`. Exit code 1 is the composition axis ("24 assets with
      no issue at all"), the documented pre-art state, not this gate.

blocking:
  - id: header-image-is-dead-content
    owner: curator (then visual-metadata)
    what: >
      `franchise.images.header` renders nothing. The app deleted its wing-page
      header image in orrery commit 90bdbd2, "fix: drop the curated header
      image from the wing page (#135)", on 2026-07-27. Grepping the app for
      any consumer returns only the type declaration in lib/content/types.ts,
      whose own comment still claims "it is declared here and rendered by the
      franchise page" - now false. app/[locale]/f/[slug]/page.tsx reads author
      portraits and nothing else.
    evidence: >
      grep -rn "franchise.images|.images?.header" over app/, components/, lib/
      returns zero call sites; git log -S headerCredit names the deleting
      commit and its date.
    scope: >
      Not this wing's defect and not fixable inside it. 24 of 34 wings set the
      field. docs/SCHEMA.md still documents it as "a wide banner for the
      wing"; the visual-metadata skill devotes a section to it, including the
      instruction that "the app crops a horizontal band". This wing paid the
      full cost a week after the rendering was removed - one sourced,
      licensed, credited Commons painting plus three candidates researched
      and rejected on record.
    action: >
      Decide, catalogue-wide: restore the rendering, or retire the field from
      SCHEMA and from the visual-metadata skill and stop sourcing headers.
      Until then visual-metadata should not source another one.

  - id: luther-blissett-denial-misattributed
    owner: press-archaeology
    what: >
      umberto-eco-luther-blissett-rumor-1999 states Eco "denied it on the
      record to Il Messaggero on 6 March 1999". Its own cited source says
      something different: Il Messaggero of that date *reported* a denial,
      and the sentence it quotes has the parenthesis "(who has already denied
      it)" - the denial predates the article and was not given to that paper.
    evidence: >
      en.wikipedia.org/wiki/Luther_Blissett_(pseudonym): "On 6 March 1999, Il
      Messaggero reported a denial by Eco, stating: 'It's pointless to ask who
      is hiding behind the Luther Blissett of Q. Is it Umberto Eco (who has
      already denied it)?...'"
    checkedAndCorrect: >
      Everything else in the entry verifies verbatim: Der Spiegel 25 May 1997
      naming Eco a founder; the same-year anonymous pamphlet ascribing the
      project to a secret circle of Bologna semiologists under Eco; Panorama
      25 February 1999 naming him; La Repubblica's same-day Lipperini
      interview with Q's four authors.
    action: >
      Reword to what the source carries ("Italian papers reported his standing
      denial") or find the original denial and date it. Mirrored into pt-PT,
      so the fix is needed twice.

  - id: filosofi-in-liberta-published-year
    owner: completeness-auditor
    what: >
      umberto-eco/filosofi-in-liberta carries `published: 1959`. Neither
      cited source supports it and one contradicts it. `published` drives the
      derived default order, the River layer and every era comparison, so a
      wrong year silently reorders the walk.
    evidence: >
      it.wikipedia.org/wiki/Umberto_Eco, Opere: "Filosofi in libertà, come
      Dedalus, Torino, Taylor, 1958, poi in Il secondo diario minimo" - year,
      city and publisher. en.wikipedia.org/wiki/Umberto_Eco, the wing's only
      cited source for the entry, gives no year at all: it says Bompiani
      approached Eco in 1959 having "become aware of Eco through his short
      pamphlet ... which had originally been published in a limited print run
      of 550". 1959 is the year of the approach, not of the pamphlet.
    related: >
      audit-fixes.yaml flagged exactly this and routed it to "whichever stage
      owns works.yaml's bibliographic dates". No such stage ran afterwards, so
      it was never actioned - the failure mode this audit exists to catch.
      The 1959 lifeEvent (Bompiani noticing him) is unaffected and correct.
    secondary: >
      The same it.wikipedia line spells the pen name "Dedalus" for this title.
      works.yaml has `publishedAs: "Daedalus"` here and `"Dedalus"` on
      ammazza-luccellino, and the author's `pseudonyms` note presents that
      split as settled fact ("again, as the Italian spelling 'Dedalus'"). The
      two encyclopedias disagree about which spelling this pamphlet carried;
      the note should say so rather than adjudicate. Owner: press-archaeology.

  - id: beyond-the-novels-debated-overclaims
    owner: reading-orders
    what: >
      The order's `debated` renders to a reader (components/orders/order-selector.tsx,
      under "Contested placements"), and two of its factual generalisations are
      contradicted by works.yaml sitting beside them.
    detail_1: >
      "every one either never translated into English or translated by a
      university press for an academic readership", of the 18 excluded theory
      titles. Kant e l'ornitorinco was published in English by Harcourt/Mariner
      - a trade house - and works.yaml's own cover comment on that entry records
      "Mariner Books, November 2000". La ricerca della lingua perfetta reached
      English through Blackwell, also not a university press. The exclusions
      themselves are defensible; the reason given for them is not accurate as
      stated.
    detail_2: >
      Sette anni di desiderio is placed in the "no English-language edition of
      any of them was found" bucket, and its works.yaml synopsis says "no
      English translation was found". The Wikipedia article for Faith in Fakes /
      Travels in Hyperreality lists Eco (1973) *and* Eco (1983) - Il costume di
      casa and Sette anni di desiderio - as its two source volumes. So the
      English selection this order admits under il-costume-di-casa is drawn
      partly from a book the same order excludes for having no translation.
      The order already handles this exact case honestly for Apocalittici e
      integrati ("only partially translated ... included anyway"); the
      treatment is inconsistent, not wrong-headed.
    action: >
      Soften the university-press generalisation to what is true, and give
      Sette anni di desiderio the Apocalittici treatment - either admit it or
      exclude it while naming the partial translation. Mirrored into pt-PT.

missing:
  - id: five-global-events-never-ruled
    owner: event-resonance
    what: >
      5 of the 19 events in global.yaml carry no include and no exclude:
      world-war-i-1914, elementary-education-act-1870, pulp-magazines-1926,
      covid-19-pandemic-2020, booktok-2020.
    why_it_matters: >
      The handoff's stated reason is that "pre-birth/post-death events never
      reach the arithmetic gate". That gate no longer exists. SCHEMA is
      explicit: "A global event renders on a wing if and only if that wing
      names it in include. There is no arithmetic default and no implicit
      membership: silence means absent" - and `exclude` "gates nothing", it
      exists precisely as "the record of a judgement already made, so a later
      pass knows the ground was covered". Nothing renders wrong today; the
      cost is that the next pass re-litigates five events, and the stale
      lifetime model may propagate to other wings.
    the_one_worth_arguing: >
      pulp-magazines-1926 is the only pre-birth candidate with a real case:
      SCHEMA's own worked example of a legitimate include is an event that
      "predates him; created the category he writes in", and Apocalittici e
      integrati, Il superuomo di massa and Queen Loana are all built on mass
      and serial culture. The honest verdict is probably still exclude, on the
      same "same broad category, not the same event" ground this wing already
      applied correctly to comics-code-authority-1954: the 1926 event is
      Amazing Stories and Anglo-American genre sorting, while Eco's material
      is Italian comics and American comic books. But it should be argued and
      recorded, not skipped.
    context: >
      Not an outlier - Eco's 5 unruled is 10th best of 34 wings. The two most
      recent builds (john-grisham, jrr-tolkien) rule on all 19, so full
      coverage is the emerging standard.

  - id: five-covers-are-128px-thumbnails
    owner: visual-metadata
    what: >
      5 of the 38 recorded covers return a 128px-wide image from their `-L`
      (large) URL, because Open Library holds no larger scan: opera-aperta
      (128x200), apocalittici-e-integrati (128x198),
      semiotica-e-filosofia-del-linguaggio (128x192), the-sign-of-three
      (128x190), on-the-medieval-theory-of-signs (128x192). All 38 were
      downloaded with ?default=false and measured; the other 33 are 400-500px
      tall.
    evidence: >
      Opened and looked at. They are the right books and carry no watermark,
      but at card size they render visibly soft against the 33 sharp ones.
    action: >
      Either find a larger scan or clear the slot and let the typographic
      fallback render, which on a museum page is the better of the two.

  - id: two-nonfiction-dialogues-render-as-novels
    owner: completeness-auditor
    what: >
      umberto-eco/belief-or-nonbelief and
      umberto-eco/non-sperate-di-liberarvi-dei-libri carry no `format`, so
      they default to `novel`. Both are book-length published dialogues.
    why_it_matters: >
      components/river/work-card.tsx prints the format badge only when
      `w.format && w.format !== "novel"`, so these two are the only works in
      the wing besides the seven novels that render with no badge at all - a
      reader browsing the river cannot tell them from the fiction. Every other
      one of the 58 non-novels declares a format.
    action: 'Set format: nonfiction on both.'

  - id: two-events-cite-a-source-that-does-not-carry-them
    owner: press-archaeology
    what: >
      Two entries cite a page that does not contain part of what they claim.
      umberto-eco-rorty-overinterpretation-1992 cites only
      en.wikipedia.org/wiki/Umberto_Eco, which carries the 1992 volume, the
      four names and the intentio lectoris citation, but does not mention the
      Tanner Lectures at all (grepped; zero hits). The Tanner-Cambridge-1990
      link is on it.wikipedia and should be cited there.
      umberto-eco-imbecilli-controversy-2015 says the remark was "reported
      first by the newspaper La Stampa"; the two cited pages footnote Il Fatto
      Quotidiano and Il Post, not La Stampa.
    also: >
      umberto-eco-opera-aperta-reception-1962 opens "provoked, in Eco's own
      later account" - it.wikipedia attributes that characterisation to
      Peyronie's 2024 study, not to Eco. Plausible (Eco's 1967 second edition
      discusses the reception) but not established by the cited page.
      umberto-eco-opera-aperta-levi-strauss-1967's tail, "a rejoinder he kept
      refining ... through Lector in fabula (1979)", is also not on the cited
      page; the rest of that entry verifies word for word.

stale:
  - id: schema-curated-sets-are-out-of-date
    owner: curator
    what: >
      docs/SCHEMA.md lists displayFace as "fraunces, spectral, sourceSerif"
      and signature as "beam, thread, rule, none". The validator's own error
      text, falsified deliberately, reports the app's real sets as
      ['fraunces', 'instrument-serif', 'sourceSerif', 'spectral'] and
      ['beam', 'filament', 'none', 'rule', 'thread'], and theme_digest shows
      wings already using ivar and double-rule. SCHEMA also documents the
      `theme.art` block without `art.emblem`, which validate.py has since made
      mandatory (object + why) and which all 34 wings now carry.
    impact_on_this_wing: none - fraunces and thread are valid in both lists.

  - id: wing-audit-skill-table-is-stale
    owner: curator
    what: >
      This skill's own "what the validator does not cover" table says
      "theme.yaml at all - the file is never opened". It is opened:
      validate.py checks displayFace, signature and the art block's required
      keys. The genuinely unchecked entry the table names correctly is
      globalEvents include/exclude ids - falsified here, a bogus id passes
      silently.

  - id: name-of-the-rose-sales-figure
    owner: press-archaeology
    what: >
      The reader-facing synopsis says the novel "sold over 50 million copies
      worldwide" (en.wikipedia's figure, verified). franchise.yaml's own
      startHere header quotes the Guardian obituary at "over 10 million
      copies" (also verified verbatim - the Guardian says "more than 10m").
      Both are honestly sourced and the 10m sits in a comment, so no reader
      sees the contradiction, but a fivefold gap between two of the wing's own
      cited sources deserves one reconciling clause rather than silence.

  - id: daterange-renders-nowhere-on-this-wing
    owner: art-rotation
    what: >
      Four entries carry `dateRange` (rai-corsari 1954-1958, bustina
      1985-2016, luther-blissett 1997-1999, name-of-the-rose-prizes
      1981-1982). The app reads it in exactly one place -
      components/river/passage.tsx, whose comment says "unlike every other
      organisation here, the meta line reads event.dateRange". No entry on
      this wing is graded `passage`, so all four spans are invisible to a
      reader. Everything else falls back to `date`, which is present, so
      nothing breaks. Either grade one of them passage or accept the field as
      curator-only here.

checkedAndClean:
  nameOfTheRoseSynopsisBothLanguages: >
    Read side by side, in full. EN stops at "on a trail that runs into the
    abbey's labyrinthine library"; pt-PT stops at "numa pista que os leva até
    à biblioteca labiríntica da abadia". Neither states the age or nature of
    the library's secret, the killer, the motive or the mechanism, and the
    unsourced "decades-old secret" clause spoiler-audit removed is gone from
    both. The pt-PT is not looser: "decifrando" for "piecing together" is a
    shade more active but adds no information, and "A estreia de Eco na
    ficção" is if anything more precise than "Eco's debut novel". No forward
    momentum toward a resolution that the English withholds.
  fivePtTitleSubstitutions: >
    Letter for letter against editions.yaml, all five exact: O Nome da Rosa
    (Gradiva 2011), A Misteriosa Chama da Rainha Loana (Gradiva 2018), Número
    Zero (Gradiva 2015), Obra Aberta (Relógio d'Água 2016), Filósofos em
    Liberdade (Gradiva 2025). Every other inline reference in the pt-PT
    overlay correctly keeps its original title, including
    belief-or-nonbelief, trattato-di-semiotica-generale, la-struttura-assente,
    il-costume-di-casa, cinque-scritti-morali and
    interpretation-and-overinterpretation - none of which has a pt-PT edition
    recorded.
  translatorMappingAcrossTwoFiles: >
    Both files agree, checked entry by entry rather than summary against
    summary. editions.yaml: Weaver on the-name-of-the-rose, foucaults-pendulum,
    the-island-of-the-day-before, baudolino; Brock on
    the-mysterious-flame-of-queen-loana; Dixon on the-prague-cemetery and
    numero-zero. works.yaml's synopses and header credit exactly the same
    seven. No discrepancy.
  revisedNameOfTheRose2014: >
    Accurate, and it does not overclaim. openlibrary.org/isbn/9780544176560.json
    returns contributions ["Weaver, William, 1923-2013, translator", "Dixon,
    Richard, translator"] - both credited - and by_statement "translated from
    the Italian by William Weaver, including the author's postscript ;
    [translations for the 2014 edition by Richard Dixon]", which is the
    editions.yaml quotation verbatim. notes reads '"New edition" statement
    from page 577; with corrections and revisions', matching the file's "page
    577" citation. Dixon's own Wikipedia bibliography lists "Author's
    revisions to The Name of the Rose by Umberto Eco, 2014" as its own dated
    line. The record also settles the stage's second open question: the same
    entry's translation_of is "Il nome della rosa / Postille a Il nome della
    Rosa", so Postille genuinely does ship inside this printing and its
    absence from editions.yaml is correct.
  beyondTheNovelsInventory: >
    Reconciles exactly. 55 extended-tier works, 20 in the order, 35 excluded.
    The `debated` list names 18 theory + 6 children's/illustrated + 1 study
    guide + 10 untranslated journalism = 35, and the set of ids it names is
    identical to the set works.yaml actually leaves out - no work is silently
    unaccounted for. All 20 ordered ids are extended tier; none is core or
    apocrypha. The two named closer calls hold up (see curatorsCall); the two
    factual overclaims inside the same block do not (see blocking).
  auraEventsSpotChecked: >
    Five of the newly-added entries checked against their own cited pages, not
    against the handoff. Opera aperta 1962: it.wikipedia's Ricezione section
    gives "Fra giugno 1962 e febbraio 1963 apparvero in Italia oltre sessanta
    articoli", "dall'adesione alla netta contestazione", Barilli and
    Pagliarani, Gruppo 63, and the Marxist charge of "estendere indebitamente
    alla letteratura modelli ricavati dalla musica contemporanea" - the entry
    is a faithful translation of all of it. Lévi-Strauss 1967: same section,
    "proprietà strutturali precise, paragonabili alla rigidità di un
    cristallo", and Eco's situated-interpreter reply - exact. Strega/Médicis:
    en.wikipedia's The Name of the Rose, "the Strega Prize in 1981 and Prix
    Medicis Étranger in 1982" - exact, and the same sentence confirms the
    50-million figure. Rorty 1992: the volume, the three respondents and
    Collini as editor are all on the cited page, plus the infobox's own
    citation of Interpretation and Overinterpretation p.25 for intentio
    lectoris. Luther Blissett: every element verifies except the denial's
    venue (see blocking).
  otherLifeEventsSpotChecked: >
    Legion of Honour: it.wikipedia's honours table gives Ufficiale 2003 and
    "Commendatore ... Parigi, 13 gennaio 2012", plus "Cavaliere di gran croce
    ... Roma, 9 gennaio 1996" - all three dates in the entry are exact.
    Tanner 1990: "conferenze Tanner (Università di Cambridge, 1990)" and the
    IASS secretary/vice-president/honorary-president-from-1994 sequence -
    exact. Scuola Superiore 2000: founded 2000, coordinates Bologna's
    humanities doctorates, 2001 Master in Editoria Cartacea e Digitale -
    exact. Imbecilli 2015: "Nel giugno 2015", Turin honorary degree in
    communication, "legioni di imbecilli", the Nobel-laureate comparison -
    exact but for the La Stampa attribution.
  guardianObituaryQuotations: >
    Every phrase franchise.yaml attributes to Ian Thomson's obituary is
    verbatim: "the book's baggage of arcane erudition was designed to flatter
    the average reader's intelligence", "Not since One Hundred Years of
    Solitude had there been such a consensual success", "more than 10m copies",
    "the emperor of international bestsellerdom". So is the 1986 lifeEvent's
    long quotation ("I feel blackmailed by journalists, by myself, by my
    publisher...") and the "too grotesque-looking" monks with the approved
    sets.
  covers: >
    All 38 fetched with ?default=false and opened. The seven novel covers were
    looked at side by side: correct titles, correct author, English-language,
    no watermark, no retailer mark, no omnibus. Queen Loana is plainly the
    Vintage UK jacket (its spine reads VINTAGE), exactly as recorded and
    deliberately outside the other six's publisher lineage. One wording nit in
    the visual-metadata handoff: the six are one publisher *lineage*
    (Harvest/HMH/Mariner), not one visual design family - the jackets look
    nothing alike. 38 unique URLs for 38 works, no repeats.
  portrait: >
    Real, 2440x3667, a genuine tall portrait crop, CC0 Nationaal Archief press
    photo. Rendered and looked at.
  sourceLinks: >
    All 138 sources/coverSource/portraitSource/headerSource URLs across the
    wing's seven content files and three author files return HTTP 200. No dead
    citation.
  spoilerBoundaries: >
    Zero spoilerAfter across 24 events is the correct state, not an audit that
    did not happen. All 24 entries were read in full: every one is biography,
    career, honour, prize, reception or translation history. Not one describes
    a novel's content. The four curator-only `note` fields spoiler-audit added
    are genuinely unreachable - `note` is absent from the Work interface in
    lib/content/types.ts, confirmed by reading it, so it cannot leak.
    `translationNote` is likewise absent from that interface, matching SCHEMA's
    own statement that it renders nowhere; the Latin warning a reader actually
    needs was correctly surfaced on the startHere path's `note`, which IS
    rendered.
  capabilities: >
    `features: {}` - all four auto, and all four are earned by real data:
    river/companion by 26 aura entries, wizard by a three-path startHere,
    editions by a 63-entry editions.yaml. No half-empty feature, nothing
    switched off while a layer was thin.
  themeAndPalette: >
    displayFace fraunces and signature thread are both in the app's real
    implemented sets (verified by falsifying the validator, which prints
    them). All five palette keys present. Contrast measured: ink on bg 14.71,
    ink on surface 13.70, muted on surface 4.75 - above the 4.5 floor where
    this usually fails. accent on surface is 3.87, fine for the single
    non-text element accentUse restricts it to, and it would not carry body
    text. The accent #6f7a4c is unique in the catalogue; the only duplicated
    accent anywhere is #c8a24a, on other wings.
  referenceResolution: >
    Two references chased to the thing itself rather than to the fact that
    they resolve. startHere.beyond-the-novels points at
    umberto-eco/beyond-the-novels, which is the 20-work order and not a
    renamed leftover; startHere.everything points at `default`, and the
    derived order really is 67 works, which is what its description claims
    ("All sixty-seven works").
  ptRegister: >
    Read four synopses and both collaborator bios in full for register.
    European Portuguese throughout: "académica", "argumentista", "investigar",
    "entediados", "vê-se envolvido", "por trás de", "Tradução de". No
    Brazilianism found, and the Buñuel film titles carry their Portuguese
    distribution title with the reasoning recorded. Semiotics vocabulary
    matches Eco's own Portuguese reception.
  commentPolicy: >
    Swept all seven content files, three author files and all seven pt-PT
    overlays for stage names, pipeline nouns and coordination language. One
    violation found and fixed in place (see trivialFixesMade). Everything else
    is clean, including the two collaborator stubs both prior stages worried
    about.

trivialFixesMade:
  - file: content/franchises/umberto-eco/franchise.yaml
    what: >
      The header-image comment cited "visual-language.yaml's STYLE line",
      naming a pipeline handoff inside a content file - the same CURATION §2
      violation visual-language and translation each caught in their own
      files. Rewritten to attribute the atmosphere to theme.yaml, where a
      reader can actually find it. No editorial judgement changed; the
      quotation and the reasoning are the same.

notApplicableNotAbsent:
  eras: >
    `eras: []` is complete, not 0% coverage. The negative record in the file's
    own header is unusually strong (Treccani, both obituaries, Britannica,
    Harvard UP, two scholarly handbooks, the publishing history), and the
    bibliography actively contradicts the split everyone reaches for: 20 books
    precede the first novel and 40 nonfiction titles follow it. 67 works
    outside every era span is the correct state here. Do not close it.
  achievements: >
    No achievements.yaml, correctly. eras is empty so era_reader is
    impossible; franchise_complete over 67 works including two anthologies Eco
    edited and two co-authored dialogues would demand books he did not write;
    and a bare order_complete on beyond-the-novels would be the generic "read
    all of these" badge the skill warns is worse than none. Nothing specific
    enough to mark.
  coverCoverage: >
    38 of 67 is the honest ceiling of the effort spent, not a gap to close to
    100. The 29 bare works are the specialist theory the wing's own order sets
    aside, plus the children's books and apocrypha, and the file says so. The
    five children's picture books are the one genuinely promising untried
    target named by visual-metadata, and that remains a fair next step rather
    than a defect.
  editionsCoverage: >
    63 entries over 31 of 67 works. All seven novels carry it/en/pt-PT. The
    absences are documented per entry and distinguish "not researched" from
    "researched, nothing verifiable" - which is the honest artefact, not a
    hole.
  subseries: >
    All seven novels are standalone. No subseries anywhere is correct, and the
    prequel-spoiler check that follows from it is recorded rather than assumed.
  danBrownVisualSeparation: >
    Not yet checkable, and not a finding. visual-language asked for the
    Brown/Eco separation to be re-tested once both wings have generated
    assets; this wing has none (24 assets with no issue at all). Re-open after
    /asset-prompt and art intake, not now.

curatorsCall:
  - id: interpretation-and-overinterpretation-on-venue
    view: >
      The call holds. Admitting it on venue rather than difficulty is the
      right instinct: the Tanner Lectures are a public humanities series, and
      Cambridge published it as a staged argument with three named respondents
      answering in turn - a reader can follow a disagreement without following
      a monograph. It is also the one book in the order that most directly
      explains what the other nineteen are for. The `debated` entry is honest
      that it is the most demanding title on the list, which is the disclosure
      that makes the inclusion fair. Keep it.
  - id: apocalittici-e-integrati-partially-translated
    view: >
      The call holds, and it is the model the order should apply consistently.
      Apocalypse Postponed selects exactly the general-audience mass-culture
      material, so the translated portion is the portion this order is about;
      excluding the whole book because the academic half stayed in Italian
      would punish it for the part the order does not want. The problem is not
      this ruling - it is that Sette anni di desiderio has the same shape and
      did not get the same treatment (see blocking).
  - id: epigraph-quote-left-in-english
    view: >
      Worth a second look, unlike on the wings this convention came from. The
      rule is "keep the author's words verbatim", but the base string is
      already an English rendering of Italian, sourced through Wikiquote
      citing the introduction to a *French* edition. So a pt-PT reader is not
      being shown Eco's words; they are being shown a third-hand English
      translation of them, inside a design element whose whole point is
      verbatim authorial voice. Either cite and quote the Italian original
      from Postille a «Il nome della rosa» and let the locale carry a
      Portuguese rendering beside it, or accept the English and say in the
      entry that it is a translation. Owner: translation, with the curator.
  - id: two-calls-upstream-flagged-and-this-audit-ratifies
    view: >
      franchise-research asked for a second opinion on tiering Storia della
      bellezza and Storia della bruttezza `extended` with a plain nonfiction
      format rather than apocrypha-as-edited-anthology. Keep them as they are:
      Eco wrote the connecting text and both are marketed as his, and forcing
      authorRole: editor would drag them into apocrypha, which the validator
      then makes compact rows - the wrong rendering for two illustrated
      histories that are among his most browsed books. press-archaeology asked
      about the 1942 Ludi Juveniles prize predating the work span: keep it.
      It is the only entry that shows the ideology Ur-Fascism dissects being
      put to Eco personally, and the 1995 essay is the wing's single most
      cited non-novel. Neither of these is a defect.

