    assets carry an art issue yet) is unbuilt, per SKILL.md's own note that
    this is expected pre-/asset-prompt and not this stage's line to clear.
  validate: "python3 scripts/validate.py --slug umberto-eco - 0 errors,
    1540 works/75 authors/11 achievements, all references resolve. 3
    pre-existing handoff-length warnings on this slug (press-archaeology,
    franchise-research, completeness-auditor), none new from this stage."
erasDecision: >
  Confirmed rather than assumed: eras.yaml's own comment is a sourced
  ruling (Treccani, the NYT obituary, two scholarly handbooks, the
  publishing record) that no critic, publisher or the author himself ever
  cut this career into named periods, and that the obvious semiotician/
  novelist split is contradicted by the bibliography's own thirty-six years
  of parallel output. `[]` is correct; there is no chapter-gate slot.
