stage: art-rotation
wing: umberto-eco
summary: >
  Reviewed all 24 events (17 author lifeEvents, 7 franchise events) that
  press-archaeology's two passes graded with organisation/illustration_type/
  images_required/modifier inline, against the now-finished
  visual-language.yaml register (the forgery writing-table emblem, its
  avoid list). Every pairing still holds: no illegal organisation/
  illustration_type combination, no cap broken, no neighbour repeat, no
  avoid-list conflict (none of these 24 entries depicts a banned scene -
  they cover the author's life and the works' reception, not the novels'
  plots). eras.yaml confirmed empty by design (no periodisation - the
  file's own sourced ruling holds), so no chapter-gate slot exists to grade.
  No file changed.
verification:
  fitReview: >
    Walked all 24 Holds pairings by hand against LAYOUT.md: the birth
    (full-bleed-vista/establishing-landscape) satisfies CURATION's opening
    floor; the epigraph (umberto-eco-poison-a-monk-1978) carries quote,
    sources, images_required 0 and no illustration_type, correctly; the one
    diptych (umberto-eco-martini-dialogue-1996) carries images_required 2
    with editorial-portrait for both real people (Eco, Martini), a legal
    diptych type; all three artifact-spread entries use document-facsimile
    or book-object, never routed through beside. No modifier is set on any
    entry; reviewed each against the compatibility table and none earns one
    strongly enough to add.
  caps: >
    beside 6/24 (25%, at its named cap of 6, not over), artifact-spread
    4/24, marginalia 3/24, floating-object/mosaic/medallion/immersion 2/24
    each (immersion at its 1-2/wing ceiling), full-bleed-vista/epigraph/
    diptych 1/24 each. No organisation but beside approaches the ~40%
    general cap. illustration_type spread: book-object widest at 4/24
    (17%), well under the ~third repetition cap; nothing else repeats past 3.
  pacingContour: "#===#==.==.=.#===#==.=#= - five loud cells (1932 birth,
    1962 Opera aperta press storm, 1986 Annaud-film immersion, 1999 Luther
    Blissett mosaic, 2016 death), none touching, none sharing a screenful
    across the 1932-2018 span; longest same-intensity run is 3 mid cells,
    short of the 5-cell plateau limit."
  artRotationCheck: >
    python3 scripts/art_rotation.py umberto-eco --check - "organisation
    rotation holds across all 24 events: no organisation over its cap, no
    neighbour repeats" and "pacing holds: no two loud cells touching or
    sharing a screenful, no plateau." Both axes read directly from this
