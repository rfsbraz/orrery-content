stage: visual-language
summary: >
  Settled theme.yaml's art block, the wing's sole pre-existing validator
  error. theme_digest.py --exclude umberto-eco flagged three wings sharing
  both displayFace (fraunces) and signature (thread) - Cervantes, Rowling,
  Shirley - plus Tolkien on face alone; all four read in full, none
  colliding on subject (paperwork-vs-fiction, cafe/exercise-book,
  xerox-punk, manuscript-revision-between-two-hands respectively). Accent
  (#6f7a4c) and background (#120f0c) were already unique before this stage,
  so the real risk was subject, not hue - and the one genuine subject
  adjacency, Dan Brown (a symbologist reading a hidden meaning out of an
  image, against Eco's own literal semiotics), shares no palette axis but
  was read in full and separated on atmosphere and explicit prohibition
  (avoid bans the loupe and the mirror-reflection device by name).
  Emblem realised as an object native to both of Eco's registers at once -
  a forged document's careful copy caught mid-stroke - rather than the
  abbey library (spoiler-adjacent, one novel's set) or a card catalogue
  (already Tolkien's index-slip motif).
  validate.py --slug umberto-eco: 0 errors (down from 1); 3 pre-existing
  oversized-handoff warnings untouched. Two first-pass theme.yaml comments
  named spoiler-audit.yaml directly and were rewritten to state the
  constraint as fact before this ran clean.

