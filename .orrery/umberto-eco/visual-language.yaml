  fieldsTouched: []

emblem:
  object: >
    A writing table lit by one lamp, two sheets of paper side by side: an
    aged document in a settled hand, and its careful copy nearly finished
    but for one flourish still mid-stroke, the same pen laid across both.
  spansBothRegisters: >
    The Prague Cemetery's forger, Baudolino's "gifted liar," Foucault's
    Pendulum's editors manufacturing a fake conspiracy from real
    manuscripts, and on the nonfiction side Faith in Fakes: Travels in
    Hyperreality and A Theory of Semiotics (codes and sign production) all
    converge on the same act: a sign, genuine or counterfeit, made to mean
    something. Not one book's plot.

spoilerAuditIncorporated: >
  All four do-not-draw flags are in art.avoid, each paired with what stays
  in bounds: the abbey's hidden room and its contents (abbey, scriptorium,
  stacks stay drawable); the pendulum's scene and the editors' fate (the
  pendulum as a still object or museum interior stays drawable); any image
  whose whole idea is one man being two; what Queen Loana's protagonist
  recovers (attic, comics, magazines, Piedmont fog stay drawable). The
  wing's pre-existing notes (no rose, no swinging pendulum, no monk's
  habit) are restated rather than contradicted.

forStages:
  art-rotation: >
    The emblem is a writing table with two documents and one pen, not a
    building, garment or swinging object, so it should rotate cleanly
    across life events, franchise events and era plates. accentUse names
    four interchangeable single-touch options (lamp foot, cord, pen
    ferrule, box hinge) - pick one per image, never more, never a fill.
    lineCharacter's "short, considered segments" is load-bearing for
    keeping every asset in one hand: deliberately not a continuous
    confident stroke (drifts toward Cervantes) and not a doubled revision
    stroke (drifts toward Tolkien).
  visual-metadata: >
    STYLE guidance to quote verbatim: "A private scholar's study at night:
    warm lamplight over a crowded desk, the rest of a book-lined room in
    near-black shadow. A fine dip-pen line laid down in short, considered
    segments, as though checking a mark against a model rather than
    writing freely. Warm candlelit parchment ground, one aged
    bronze/verdigris accent on a single small object, never a fill."
  wing-audit: >
    The Dan Brown separation rests on atmosphere and prohibition rather
    than any palette-axis difference (the two wings share no face,
    signature or accent) - worth re-checking once both wings have actual
    generated assets to compare, not just written language. Also check the
    emblem's "two documents, one pen" composition against whatever the
    editions/covers stages surface for the seven novels' real jacket art,
    to rule out accidental resemblance to a specific cover.

