stage: eras
summary: >
  No received periodisation of Eco's career exists. eras.yaml ships empty
  ([]) with the full negative record in its header. The candidate framing
  this wing was expected to carry, "semiotician until 1980, novelist
  afterwards", fails on Eco's own bibliography: 20 books precede Il nome
  della rosa and 40 non-fiction titles follow it, with major theory
  (Semiotica e filosofia del linguaggio 1984, I limiti dell'interpretazione
  1990, La ricerca della lingua perfetta 1993, Kant e l'ornitorinco 1997,
  Dire quasi la stessa cosa 2003, Dall'albero al labirinto 2007, Scritti sul
  pensiero medievale 2012) arriving after the novel that supposedly ended the
  academic phase. The two registers run in parallel for 36 years.
  validate.py --slug umberto-eco: 0 errors, 3 pre-existing warnings (two
  oversized earlier handoffs, theme.art unset), no new orphan warnings.

produced:
  files:
    - content/franchises/umberto-eco/eras.yaml
  eras: 0

sourcesRead: >
  English: NYT obituary (Kandell, headlined "Best-Selling Academic Who
  Navigated Two Worlds", body: Eco "infused his seven novels with many of his
  scholarly preoccupations"; his own line, "I think of myself as a serious
  professor who, during the weekend, writes novels"); Guardian obituary
  (Thomson); Britannica; Harvard UP on Confessions of a Young Novelist ("his
  long career as a theorist and his more recent work as a novelist... their
  fruitful conjunction"); Chronicle of Higher Education (Romano); Paris
  Review Art of Fiction 197 (intro only, rest paywalled); Cambridge New
  Essays on Umberto Eco chapter list; Metzler Umberto Eco-Handbuch chapter
  list; OpenLibrary sweep of book-length studies. Italian: Treccani
  Enciclopedia Italiana V Appendice (Camerino, 1992) and Lessico del XXI
  Secolo (2012); la Repubblica obituary; it.wikipedia biography and Opere
  list. Refused or absent: britannica.com and nytimes.com 403 live (read via
  the Wayback Machine); treccani.it "Il Contributo italiano alla storia del
  Pensiero" has no Eco entry (empty shell); the Paris Review interview body
  and Cambridge/Metzler chapter texts are paywalled, so only their titles and
  structure were read.

forStages:
  event-resonance: >
    The wing has no era plates, so nothing gates a chapter here and every
    event stands on its own date. The 1980 debut at 48 is the strongest
    anchor on the timeline precisely because it is a life event and not an
    era boundary: it changed his fame, not his output. Worth pairing with the
    fact the eras header rests on, that the theory never stopped, so the
    event reads as an addition rather than a turn.
  reading-orders: >
    Do not build an order that assumes a "theory then fiction" chronology
    breaks cleanly at 1980; it does not. The two-register split already in
    works.yaml (7 core novels vs the academic shelf) is the real structure of
    this career, and the sources back it: the standard reference works divide
    Eco by kind of writing, never by period.
  wing-audit: >
    eras: [] is deliberate and complete. Per the eras skill this supersedes
    the "era coverage gaps" finding: 67 works outside all era spans is the
    correct state here, not a defect, and closing it would require inventing
    a periodisation the sources refuse. The rung-4 fallbacks were checked and
    rejected for fit, not for truth: Bompiani covers 1959-2015 and all seven
    novels (nearly the whole shelf), and La nave di Teseo covers only the
    four posthumous volumes.

openQuestions:
  - "Eco's own intellectual autobiography, written for The Philosophy of Umberto Eco (Library of Living Philosophers, Open Court 2017), was not read; it is the one document that could carry a rung-1 self-periodisation, and no open copy was reachable."
