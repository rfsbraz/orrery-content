stage: press-archaeology
wing: umberto-eco
summary: >
  Built the author's first lifeEvents (13) and the franchise's first
  events.yaml (3 entries). Closed the flagged 1983-1994 dark run and five
  further 5+-year silences the tool's single-worst-run report did not name:
  1966-1973, 1975-1981, 1983-1994, 1996-2000, 2002-2006 and 2012-2022 were
  all dark before this pass, found by scanning the full 1956-2022 span
  year by year against the wing's only prior aura (14 catalogue-wide
  globals). aura_density.py: 67 works, 30 aura (14 globals + 13 lifeEvents
  + 3 franchise events), 0.45/work, longest dark run now 4 years
  (1956-1959, before Eco's first book). art_rotation.py --check:
  organisation-rotation and pacing both hold clean; the composition axis
  reports "0 of 16 read" because no art issues exist yet, the documented
  expected state. validate.py --slug umberto-eco: 1 error, the theme.art
  block missing, the documented flip once an author gains lifeEvents,
  visual-language's to resolve next.

produced:
  - content/authors/umberto-eco.yaml (lifeEvents: 13 entries)
  - content/franchises/umberto-eco/events.yaml (new file, 3 entries)

decisions:
  - >
    Closing only the flagged 1983-1994 run would have relocated the
    problem, not fixed it: five more 5+-year gaps sat under the same 14
    globals across 1956-2022. All six are closed with dated, sourced
    material, each checked individually load-bearing for its own window
    by removing it and re-running aura_density.py: 1966-1973 (Milan
    Polytechnic/NYU 1969, Bologna/Versus/DAMS 1971), 1975-1981 (the 1975
    professorship, the 1978 "poison a monk" origin of Il nome della
    rosa), 1983-1994 (Bustina di Minerva 1985, the 1986 Annaud film and
    its fallout, the 1990 Tanner Lectures), 1996-2000 (the Martini
    dialogue), 2002-2006 (the Weaver-to-Brock translator handoff on Queen
    Loana), 2012-2022 (the 2012 Legion of Honour promotion, the 2015
    "legions of idiots" speech, the 2016 death, the 2018 Ur-Fascism
    reissue).
  - >
    13 lifeEvents plus 3 franchise events runs over CURATION's 6-12/3-8
    guideline: the density problem was six windows wide, not one, and every
    entry independently passes the aura standard - none is filler.
  - >
    The Martini dialogue and the Queen Loana translator handoff are
    franchise events, not lifeEvents: both are about what happened to a
    specific book, not the author's own life.
  - >
    One epigraph (the 1978 quote, verbatim per Wikiquote's citation to
    Bouzaher's French-edition introduction), under the 2-3/wing cap, high
    impact: it is the stated origin of the poisoned-page murder mechanism
    driving the plot, not colour.
  - >
    Art-rotation's footprint set in the same pass since none existed: one
    fix held pacing (the 2012 honour moved medallion to marginalia,
    LAYOUT.md's listed use for "minor honours"), breaking a five-cell mid
    plateau between the 1986 and 2016 immersions.
  - >
    No claim here goes beyond what two Wikipedia articles and the
    Guardian's obituary record as settled fact about a man dead since 2016.

forStages:
  eras: >
    A flat "semiotician-then-novelist" split reads wrong against these
    dates, not right: fiction begins in 1978/1980 at the midpoint of a
    research and teaching career running unbroken 1954-2016, and the
    heaviest institution-building years (Bologna post 1971, Versus founded
    1971, full professorship 1975) sit immediately BEFORE the novels start,
    not after they stop. 1975 is now doubly anchored (the Trattato and the
    professorship land the same year) - the strongest single-year case for
    a boundary this wing has, if the seam drawn is "formation" versus "dual
    practice" rather than theory-versus-fiction.
  event-resonance: >
    Ur-Fascism's 21st-century resurgence (the 2018 franchise event) is
    framed as a reception change to a specific work, not a world event
    answered by the author: no source checked here named a specific
    political trigger for the "renewed attention," so none is claimed. A
    stronger dated trigger, if one surfaces, would fit this skill better
    than world-events.
  wing-audit: >
    Two calls worth a second read: (1) the 1942 Ludi Juveniles prize
    predates the work span (1956) and does not help the dark-run gate,
    kept for its direct foreshadowing of Ur-Fascism - arguable as over the
    line for a ten-year-old's essay contest. (2) The 2015 "legions of
    idiots" entry is graded beside/med rather than mosaic/high specifically
    to avoid a loud-cell collision with the 2016 death one event later - a
    pacing-driven call, not a read of the event's own weight.

openQuestions:
  - >
    "Towards a Semiological Guerrilla Warfare" (Florence, 1965-1969) is a
    real, oft-cited Eco text; no source checked here gave it a specific
    delivery year, so it was held out rather than dated to a guess.
  - >
    English Wikipedia calls Eco's father an accountant; Italian Wikipedia
    calls him a state railway employee. Unresolved; the birth lifeEvent
    omits the father's profession rather than picking one.
