whackAMole:
  question: >
    Does umberto-eco needing a press-archaeology follow-up (unlike
    john-gwynne's zero-pass result) mean the event-resonance skill fix does
    not reliably prevent this, or is there a structural reason this wing was
    always going to need one?
  dataPoints:
    - wing: margaret-atwood
      passes: 3
      tokens: ~563000
      note: "the original case, before the skill's re-run-after-ruling instruction existed"
    - wing: haruki-murakami
      passes: 1
      tokens: ~138000
      note: "first wing under the new skill coaching"
    - wing: john-gwynne
      passes: 0
      tokens: 0
      note: "skill worked cleanly on both stages' first attempt"
    - wing: umberto-eco
      passes: 1
      tokens: ~244000 (follow-up alone) / ~537740 (both press-archaeology passes)
      note: "same one-pass shape as murakami"
  read: >
    The fix is not the thing that varies. On all four wings the same
    mechanism ran: event-resonance re-ran aura_density.py after ruling, per
    its own skill text ("Re-run aura_density.py again after you finish
    ruling, not only before"), and on every wing where a gap opened it was
    caught immediately and routed rather than silently patched. That part
    has a 100% catch rate across all four data points, umberto-eco included -
    event-resonance's own handoff here states the widening in its summary
    line and hands the exact window to press-archaeology in forStages,
    exactly per the skill. So "does the fix reliably prevent this" is the
    wrong question: the skill was never a *prevention* mechanism, it is a
    *detection-and-non-patching* mechanism, and it worked on eco exactly as
    designed.

    Whether a wing needs zero or several follow-up dispatches after that
    detection is a separate fact: how much of the wing's aura density in a
    given stretch depended on the global events that are about to be pulled
    out. Two things specific to eco made that true here in a way it evidently
    was not for gwynne:

    1. Margin, not magnitude. press-archaeology's own main pass on this wing
       was the best single-pass result measured so far (closed 6 dark runs in
       one dispatch, 0.45 aura/work, residual gap down to 4 years) - and it
       still wasn't enough margin, because the two globals event-resonance
       correctly excluded (lady-chatterley-trial-1960,
       fantasy-paperback-boom-1965) happened to sit at 1960 and 1965, inside
       the one 4-year window (1956-1959) press-archaeology had deliberately
       left thin as "before Eco's first book." Removing them didn't create a
       new problem, it removed the only padding an already-tight stretch had.
       A wing whose own material is denser everywhere (which the read below
       suggests gwynne's is) has no such single point of failure for a
       correct exclusion to expose.
    2. A real tooling gap compounds it. event-resonance's own handoff names
       it directly: "aura_density credits only an event's bare date:, not
       dateRange, so your own 1954-1958 RAI-corsari lifeEvent registers only
       at 1954, before the works span starts." Eco's four dateRange entries
       (rai-corsari 1954-1958, bustina 1985-2016, luther-blissett 1997-1999,
       name-of-the-rose-prizes 1981-1982 - wing-audit's own count) are an
       unusually high share of his 26 aura entries for this wing's size, so
       this wing is more exposed than most to aura_density undercounting
       real coverage it already has. This is the same shape as the
       art_rotation.py gap found on the Tolkien wing: a measurement tool
       reporting a gap that the underlying data doesn't actually have,
       because it only reads one field of a two-field date representation.

    Net: this is not "the skill fix doesn't reliably prevent it" (it isn't a
    prevention mechanism and has a clean catch rate on all four wings so
    far) and it isn't purely "it varies" either. It is a specific, named
    structural exposure - thin margin at the exact dates of two individually-
    correct exclusions, amplified by a real aura_density.py date-field gap -
    that a wing with a longer, earlier-starting career and more dateRange
    entries is more likely to hit than one without. Recommend: propose the
    dateRange fix to aura_density.py as its own small, high-leverage change
    (give an event's date span credit for the years dateRange actually
    covers, not just the bare date) - that is a tooling fix with a real
    expected saving (fewer wings needing a press-archaeology follow-up for
    reasons that are actually already-covered ground the tool can't see),
    unlike the skill's detection logic, which needs no change.

systemicFindings:
  - id: franchise-images-header-dead-content-third-instance
    confirmed: true
    read: >
      Confirmed a third time. wing-audit's own grep (zero call sites in app/,
      components/, lib/ besides the stale type-comment in
      lib/content/types.ts) plus its citation of the deleting commit
      (90bdbd2, 2026-07-27, "fix: drop the curated header image from the wing
      page (#135)") holds up: the field renders nowhere. This wing paid the
      full cost after the removal - one licensed, credited Commons painting
      (Gerrit Dou) sourced and set, per visual-metadata.yaml's summary, with
      three more candidates researched and rejected along the way (per
      wing-audit's blocking entry). Recommendation: stop asking
      visual-metadata to source a header until the app decision is made.
      wing-audit's own framing - "the coverFor() failure repeating" - is the
      right analogy: a previously-fixed instance of "a stage keeps doing real
      work for a field the app silently stopped reading" recurring because
      nobody updated the skill or SCHEMA after the app change. The fix costs
      one skill edit (remove the header-sourcing instruction from
      visual-metadata's SKILL.md, or gate it behind a checked "does the app
      render this" note) against a recurring cost of ~1 wing's worth of
      research per build until the app decision lands - 24-34 wings have
      already paid it depending on when counted, per wing-audit. Recommend
      pausing the instruction now rather than waiting for a fourth
      confirmation.
  - id: schema-displayFace-signature-enums-stale
    confirmed: true
    exactGap: >
      Read scripts/validate.py directly (lines ~39-40):
      DISPLAY_FACES = {"fraunces", "spectral", "sourceSerif", "instrument-serif"}
      SIGNATURES = {"beam", "thread", "rule", "filament", "none"}
      docs/SCHEMA.md (~lines 852-857) documents displayFace as "fraunces,
      spectral, sourceSerif" (3 of 4 - missing instrument-serif) and
      signature as "beam (...), thread (...), rule (...), or none" (4 of 5 -
      missing filament). This wing is unaffected (fraunces/thread are valid
      in both lists) but any future wing choosing instrument-serif or
      filament off SCHEMA's own documented list would not find it there.
    proposedEdit: >
      docs/SCHEMA.md: add "instrument-serif" to the displayFace list and
      "filament" to the signature list, matching validate.py's DISPLAY_FACES
      and SIGNATURES verbatim (curator fix, not this stage's to make).
  - id: event-resonance-arithmetic-gate-misconception-is-a-real-skill-gap
    confirmed: skill-file documentation gap, not purely in-context reasoning
    evidence: >
      .claude/skills/event-resonance/SKILL.md's own "What the engine already
      does for free" section (~lines 108-115) states in the skill's own
      voice: "the app now filters global events to the span of the authors'
      lifetimes... A dead author's window closes at death... That rule alone
      fixed the world wars for Tordo, Sanderson, King and Pratchett... costs
      no curation, and never needs re-running." The phrase "arithmetic gate"
      recurs later in the same file (~line 140, "the shape of an event that
      survives the arithmetic gate") describing this same lifetime filter as
      a live, load-bearing mechanism. This is the direct source of eco's
      event-resonance handoff opening line: "Ruled on the 14 global events
      overlapping this author's 1932-2016 lifetime (pre-birth/post-death
      events never reach the arithmetic gate)." Meanwhile the skill's own
      later "two directions" section and SCHEMA.md both state the opposite
      for the *curation* layer: "There is no arithmetic default... silence
      means absent," and wing-audit's finding on this wing states plainly
      "That gate no longer exists." The skill file has not been reconciled
      after the opt-out-to-opt-in migration it itself describes ("carried
      over mechanically when this layer moved from opt-out to opt-in"): one
      section still teaches curators to trust a lifetime arithmetic filter
      as a reason to skip ruling, while another section and SCHEMA say
      explicitly that no such default exists for whether an event needs a
      recorded ruling. This is a live documentation trap, not a one-off
      reasoning error - audit-fixes.yaml had to hand-rule all 5 skipped
      globals afterward (world-war-i-1914, elementary-education-act-1870,
      pulp-magazines-1926, covid-19-pandemic-2020, booktok-2020) once
      wing-audit caught it.
    proposedEdit: >
      .claude/skills/event-resonance/SKILL.md, "What the engine already does
      for free" section: state plainly that the lifetime filter governs
      *rendering* only and does not exempt a pre-birth/post-death event from
      needing an explicit ruling - i.e. reword "costs no curation, and never
      needs re-running" to something like "narrows which events are worth a
      sentence-test, but every event in global.yaml still needs an include or
      exclude ruling regardless of lifetime overlap; see SCHEMA's 'no
      arithmetic default' rule below." Expected saving: prevents a repeat of
      this exact 5-event gap (caught late by wing-audit, cleared by a
      dedicated audit-fixes pass) on a future wing.

