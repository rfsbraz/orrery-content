findings:
  - id: retry-cost-not-captured
    what: >
      editions and visual-metadata both failed once on a transient 529 before
      the successful retry reported here. The failed attempt's token spend is
      not in the table and is not recoverable from this worktree (a killed
      subagent leaves no transcript this stage can read).
    evidence: "Orchestrator's cost table note: '(retry after 1 failed attempt, 529 error)' on both rows, no token figure given for the failed half."
    proposedEdit: >
      Orchestrator: capture and report the token count of a failed dispatch
      (even a partial one) alongside the successful retry's, so the run total
      and per-stage share this stage computes are not survivor-biased.
    expectedSaving: "Not a token saving - a measurement-accuracy fix so future audits aren't quietly undercounting retried stages."
  - id: press-archaeology-two-pass-total-is-the-real-line-item
    what: >
      press-archaeology's main pass (293,690 tok) and follow-up (244,050 tok)
      are one stage's total cost on this wing, 537,740 tokens / 16.6% of the
      run - larger than any single dispatch including editions. The follow-up
      was the correct response to event-resonance's finding (see whackAMole
      below), not waste, but the cross-run ledger should track it as one
      number so three wings' press-archaeology totals become comparable.
    evidence: "press-archaeology.yaml (main) + press-archaeology.yaml (follow-up, same file, same stage) diffed via git show 9c8f777 -- content/authors/umberto-eco.yaml content/franchises/umberto-eco/events.yaml"
    proposedEdit: "No skill edit. Record for cross-run trend only (see whackAMole)."
    expectedSaving: none
  - id: event-resonance-reading-orders-could-run-in-parallel
    what: >
      event-resonance (737,820ms) and reading-orders (802,722ms) both write
      only to franchise.yaml, on fully disjoint blocks (globalEvents vs
      startHere/paths - confirmed by diff, see footprint check), and neither
      depends on the other's output per their own handoffs. They ran
      sequentially in this build.
    evidence: "git show 20456df -- content/franchises/umberto-eco/franchise.yaml (globalEvents only) vs git show 03aa851 -- content/franchises/umberto-eco/franchise.yaml (startHere/paths only), zero line overlap."
    proposedEdit: >
      .claude/commands/author.md: note event-resonance and reading-orders as
      a parallelizable pair when both have their inputs (press-archaeology,
      completeness-auditor) ready, same caution as any parallel pair -
      worktree isolation, not shared checkout.
    expectedSaving: "~737,820ms of wall clock (the shorter of the two), not token cost - a wall-clock-only saving."

