stage: pipeline-audit
wing: umberto-eco
summary: >
  Audited the run, not the wing. 16 successful dispatches, ~3,238,839 tokens,
  1,182 tool calls, two retries after transient 529 errors. No footprint
  violations across the three named collision pairs - every overlap on a
  shared file resolves to disjoint fields when diffed. Three systemic findings
  confirmed against current source (dead header field, stale SCHEMA enums,
  and a real documentation gap in event-resonance's own skill text). The
  press-archaeology follow-up this wing needed is analysed as a third
  whack-a-mole data point: the skill's post-ruling re-check caught the
  widened gap immediately and correctly declined to patch it in place, same
  as every prior wing; whether a follow-up dispatch is then required looks
  like a fact about that wing's own date density near the excluded globals,
  not a reliability gap in the fix.

