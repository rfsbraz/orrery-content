  - "editions and visual-metadata both reached for scripts/metadata/lookup.py first per their own handoffs (editions: --verify-isbns 63/63 clean; visual-metadata: had to raise --limit to 500 after the default 100 missed the extended tier) - their elevated call counts are the accepted judgement-fetches the skill carves out, not death-by-fetches, and the retry status (full fresh run after a 529) explains the absolute cost better than a process failure does."
  - "art-rotation: 4,421 tok/call is the run's highest ratio but total cost (106,100 tok, 24 calls) is the run's lowest - a small context read a few times to confirm a clean grading, not a loop. Leave it."
  - "Tier fit: eras (opus, 165,637 tok) produced eras: [] - a heavily-sourced decision NOT to periodise - and audit-fixes/spoiler-audit/wing-audit (opus) all made judgement calls with a silent-and-permanent failure mode (a wrong split, a leaked reveal, an unrouted defect). No tier move proposed in either direction."
  - "Stage-record completeness: 14 distinct stage names in the cost table, 14 handoff files in .orrery/umberto-eco/. No stage ran silently; the spoiler-audit-skipped-without-a-note failure mode from a prior wing does not recur here."

