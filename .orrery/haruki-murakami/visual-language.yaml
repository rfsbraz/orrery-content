stage: visual-language
summary: >
  theme.art settled: an old, dry masonry well seen from directly above,
  never entered, as emblem - sourced to The Wind-Up Bird Chronicle's own
  synopsis ("a dry well") and to spoiler-audit's explicit clearance of
  wells/dry shafts as jacket-backed and safe. theme_digest.py --exclude
  haruki-murakami flags the wing's real risk: its accent (#c98a3a) sits in
  the same warm gold-amber family as brandon-sanderson/robert-jordan's
  shared #c8a24a, and all three plus jim-butcher (#d98a3d) share the
  spectral face over a near-black ground - the tightest cluster on that
  axis in the catalogue. Read in full and differentiated: Sanderson
  (instrument/ruled) and Jordan (textile/woven) are both refused as
  material, taking a soft-pencil line that blurs only at the seam between
  ordinary and uncanny; Jim Butcher's carried-light-in-the-dark noir device
  is refused for accentUse (a record player's dial, a drink, a cigarette -
  never a lit window seen from outside, already his and joao-tordo's
  device). Two more neighbours pre-claim "jazz" as venue/instrument
  (michael-connelly's trumpet-bell accent, joao-tordo's jazz-bar motif), so
  this wing's music motif is the record object itself, never the room or
  the instrument. jose-luis-peixoto's own motifs also name a well - found by
  a direct grep, not the digest, which only catches hex/face/signature
  matches - but his is daylight, exterior, sunbaked Alentejo; this wing's is
  unlit, seen from above, urban, never in daylight. All of the above is
  written into theme.yaml's own header comment, not just here.
produced:
  franchiseFiles:
    - content/franchises/haruki-murakami/theme.yaml
  artFields: [emblem, motifs, atmosphere, lineCharacter, backgroundTexture, accentUse, avoid]
  checked: >
    theme_digest.py --exclude haruki-murakami (31 wings); full theme.yaml
    read for brandon-sanderson, robert-jordan, jim-butcher, michael-connelly,
    joao-tordo and jose-luis-peixoto (the six it or a direct text search
    flagged as adjacent). validate.py --slug haruki-murakami: 0 errors, the
    2 pre-existing handoff-length warnings (press-archaeology, eras)
    unchanged. asset_audit.py haruki-murakami: art:yes, 18 jobs listed.
forStages:
  art-rotation: >
    18 jobs ready (2 era plates, 15 life events, 3 franchise events). No
    still-life should flatlay the whole motifs list per VISUAL.md SS4c - one
    leading object per image. The orrery's own rings are a separate
    per-image decision, not addressed by this wing's art block.
  visual-metadata: >
    Quote the `art` block verbatim in STYLE per VISUAL.md SS5 for every
    asset. Carrying spoiler-audit's two hard constraints forward since this
    is the stage that writes per-asset prompts: a Hard-Boiled Wonderland
    asset keeps the Tokyo-Calcutec and walled-Town strands as two unrelated
    scenes, never one figure/mirrored self; a Killing Commendatore asset
    never shows the painting's small figure or a freshly opened pit. VISUAL.md
    SS3 as normal: Murakami himself is photographed, never generated.

    Separate note, not an art-block matter: works.yaml titles are native
    Japanese script (風の歌を聴け etc., per this catalogue's "original title,
    permanently" rule - the first non-Latin-script wing here). The app's
    three display faces and body font (Geist, Fraunces, Spectral, Source
    Serif 4, Instrument Serif; all next/font/google, subsets: ["latin"])
    have no CJK glyphs in any of those families. Standard browser fallback
    means the titles will very likely render correctly anyway, just through
    the visitor's system font rather than the wing's chosen face - a
    design-consistency gap, not broken content. Unverified and unverifiable
    without a browser, which this pipeline's policy forbids for content
    checks (docs/CURATION.md SS5). Not fixed here: the titles are correct as
    native script, and romanizing them would be a content decision outside
    this stage's footprint.
  wing-audit: >
    Same CJK-glyph-coverage note as above, restated here since it is a
    cross-cutting rendering question rather than an `art` block defect:
    flag for the curator's own eye, not a defect for this stage or
    wing-audit to resolve.
openQuestions:
  - >
    The well emblem is grounded in one novel's own synopsis text rather than
    a cross-book pattern; Norwegian Wood's well-known field-well is real but
    absent from this catalogue's note for that work, so it was left uncited
    rather than reached for.
