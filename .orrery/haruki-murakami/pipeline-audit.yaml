findings:
  - id: whack-a-mole-coaching-worked
    priority: high
    evidence: >
      Atwood's aura chain: press-archaeology closes a dark run,
      event-resonance's later exclusions reopen it, three sequential
      follow-up passes needed, ~562,596 tokens total. This wing: the
      orchestrator explicitly briefed press-archaeology to close every dark
      run proactively and event-resonance to re-measure aura after its own
      rulings and flag loudly. Result: event-resonance's own commit
      (458967b) states it plainly ("this reopens two of press-archaeology's
      closed dark runs... Flags for the next pass"), one follow-up pass
      (6943c9d, 138,440 tokens) closed both windows (1979-1985, 1997-2004)
      with 3 sourced entries, no third window exposed.
    proposed_edit: >
      Bake the coaching into the skill files rather than relying on the
      orchestrator's prompt each time: add to event-resonance's skill "after
      ruling on globals, re-run aura_density.py <slug> against your own
      inclusion/exclusion set before handing off; a newly-dark run is your
      finding to flag in the handoff, by name, not a silent regression for
      the next stage to discover" and to press-archaeology's skill "close
      every dark run stage_plan.py can find in one pass, not only the one
      flagged - a second stage's later ruling can reopen a window your
      pass already closed once, and a second full pass costs more than
      doing it thoroughly the first time."
    expected_saving: >
      424,156 tokens on this wing alone (562,596 - 138,440) if the
      alternative was the Atwood-style cascade; the real saving is avoiding
      a repeat of that cascade on every future wing, since a hand-typed
      orchestrator brief is one missed prompt away from reverting to it.

  - id: comment-scanner-fourth-blind-spot
    priority: high
    evidence: >
      Confirmed by reading scripts/validate.py directly (lines 1335-1351):
      the comment-policy loop only tests `stripped.startswith("#")` (a
      standalone `#`-prefixed line) or `in_note` (a `note:` block, set only
      by regex `^-?\s*note:`). An end-of-line comment after real YAML never
      starts with `#` so it is skipped outright, and a `why:` field (used
      throughout this wing's theme.art block) is never set into `in_note` so
      its value is never scanned either. wing-audit found and this build's
      audit-fixes pass (d0431de) corrected three real leaks this let through:
      an end-of-line comment on franchise.yaml naming "world-events' own
      weakest entry", a `theme.art.emblem.why` value naming "spoiler-audit's
      handoff", and a borderline stage-name mention in works.yaml. This is
      the fourth distinct blind spot in this scanner across three wings
      (word-wrap on dan-brown, non-English on margaret-atwood, now
      end-of-line/why-field here).
    proposed_edit: >
      Four independent point patches to one regex-per-line scanner in three
      wings is a pattern, not bad luck. Recommend a rewrite: join each
      file's comment-bearing text (every `#...` suffix regardless of line
      position, plus every scalar value under a `note:` or `why:` key)
      into one string per file and run PROCESS_COMMENT.search against that,
      rather than testing line-prefixes. This closes end-of-line, why:, and
      any future *-field-name-that-carries-prose in one change instead of a
      fifth point patch next wing.
    expected_saving: >
      Not directly token-denominated - this is a correctness fix, not a cost
      one. The saving is in wing-audit/audit-fixes tokens spent re-finding
      the same shape of leak wing after wing (this one cost the audit-fixes
      pass real turns to locate and hand-fix three instances a holistic
      scan would have caught for free at validate time).

  - id: fetch-py-unicode-url-confirmed
    priority: medium
    evidence: >
      Reproduced via wing-audit's own note (.orrery/haruki-murakami/wing-audit.yaml,
      id fetch-cannot-open-this-wing-s-japanese-sources):
      `scripts/fetch.py` raises UnicodeEncodeError on
      ja.wikipedia.org URLs with non-ASCII path segments (confirmed against
      three sources this wing's press-archaeology cited for the audit-fixes
      lifeEvents: 夢で会いましょう, 桑原武夫学芸賞, キャッチャー・イン・ザ・ライ).
      scripts/fetch.py line 83 builds `urllib.request.Request(url, ...)`
      directly off the raw URL string with no percent-encoding step; the
      failure surfaces inside `urlopen()` (line 90) when the HTTP client
      tries to encode the request line as ASCII. wing-audit confirmed all
      three URLs return 200 when percent-encoded by hand, so this is a tool
      defect, not a sourcing gap, and it is not unique to this wing -
      jose-saramago, jose-luis-peixoto and joao-tordo hit the same wall on
      accented URLs.
    proposed_edit: >
      In scripts/fetch.py's `get()`, percent-encode the URL before building
      the Request: split with `urllib.parse.urlsplit`, apply
      `urllib.parse.quote(path, safe="/:@")` (and idna-encode a non-ASCII
      host, though none appeared here), then `urlunsplit` back before
      passing to `Request()`. One function, no new dependency.
    expected_saving: >
      Not measured this run (the three sources were reached "another way" -
      by hand, outside the tool - per wing-audit's note; that manual
      workaround is itself the cost this fix removes). Recurs on every wing
      with CJK, Cyrillic or accented biographical sourcing; already hit on
      four wings by name.

  - id: todo-regex-matches-portuguese-todo
    priority: medium
    evidence: >
      Confirmed at scripts/validate.py line 1323:
      `r"...|\bTODO\b|\bre-?run\b"` compiled with `re.IGNORECASE` (line 1327).
      Word boundaries already prevent a partial-word match, but
      case-insensitivity means the pattern matches the Portuguese word "todo"
      ("every"/"all") as a whole word anywhere in pt-PT prose. wing-audit
      reports this has been a false positive on at least three other wings'
      pt-PT files already; not newly introduced here but not yet fixed
      either.
    proposed_edit: >
      Change `\bTODO\b` (inside the IGNORECASE-compiled alternation) to a
      case-sensitive all-caps match, e.g. pull it out of the shared
      IGNORECASE pattern into its own `re.compile(r"\bTODO\b")` (no flag) so
      only literal all-caps TODO trips it, never lowercase "todo".
    expected_saving: >
      Not token-denominated - a false-positive-suppression fix. Saving is in
      wing-audit/curator time spent re-confirming the same non-finding on
      every pt-PT-heavy wing (at least 3 so far, now a 4th near-miss avoided
      only because this wing's audit-fixes pass didn't trip it).

  - id: schema-md-behind-validator-and-app
    priority: low
    evidence: >
      Confirmed directly: `grep -n "emblem" docs/SCHEMA.md` returns nothing -
      the theme.art example block (docs/SCHEMA.md lines ~868-874) does not
      show an `emblem` field at all, though this wing's own theme.yaml uses
      `art.emblem.why` (per visual-language's commit 30753b5 and wing-audit's
      finding about it) and the validator requires it. Also confirmed:
      SCHEMA.md's `displayFace` enum (line 852) lists only `fraunces`,
      `spectral`, `sourceSerif` - no `instrument-serif` or `filament`, which
      wing-audit reports the app already implements. Both gaps pre-exist this
      wing; reconfirmed still open, not introduced here.
    proposed_edit: >
      Add `emblem` (and its `why` sub-field) to the theme.art example and
      field list in docs/SCHEMA.md; add `instrument-serif` and `filament` to
      the displayFace enum list at line 852-854.
    expected_saving: >
      Not token-denominated - a docs-drift fix. Saving is future stages not
      having to discover the emblem field's shape by reading another wing's
      YAML instead of the schema doc.

  - id: images-header-unrendered-informational
    priority: informational
    evidence: >
      This wing's franchise.yaml declares `images.header` (line 24, a
      licensed Tokyo jazz kissa photo) per visual-metadata's commit ce53b13.
      Per the orchestrator's direct confirmation against app source,
      `app/[locale]/f/[slug]/page.tsx` deliberately dropped rendering this
      field in PR #135 ("Cutting it from the header - the orbital field,
      portrait plate and type carry the page fine without it"). This is a
      settled, deliberate app decision, not a defect.
    proposed_edit: none - informational only.
    expected_saving: none - filed for the record, not as a fix.

footprint_check:
  result: clean
  pairs_examined:
    - pair: event-resonance (458967b) / reading-orders (0ce605d) on franchise.yaml
      result: >
        No collision. event-resonance's hunk is 41 pure insertions
        (globalEvents: block) at old line 20; reading-orders' hunk is 142
        pure insertions (startHere/orders) anchored after the globalEvents:
        block reading-orders itself never modifies. Different fields,
        adjacent sections, zero shared lines.
    - pair: spoiler-audit (0a3b6c8) / visual-metadata (ce53b13) on works.yaml
      result: >
        No collision. spoiler-audit's commit is 40 insertions/18 deletions
        editing existing synopsis: text at 5 locations. visual-metadata's
        commit is 252 insertions/0 deletions - purely additive cover fields,
        never touching a line spoiler-audit wrote.
    - pair: art-rotation / visual-metadata on authors/haruki-murakami.yaml
      result: >
        No collision, and initially miscounted - art-rotation's commit
        (257857a, "confirm the 18-item river, no changes needed") touches
        only .orrery/haruki-murakami/art-rotation.yaml, not the content
        file, because it found nothing to change: press-archaeology had
        already stamped organisation/illustration_type/images_required on
        its own new events at creation time (commits 3107499, 4578361,
        6943c9d) and art-rotation's review confirmed all of it held. Ran
        at 23:05, before visual-metadata's portrait write at 23:40 -
        correct order per author.md line 163. Worth a curator's eye, not a
        fix: press-archaeology pre-stamping fields the footprint table
        assigns to art-rotation is not new-to-this-wing (art-rotation's own
        commit message calls it "the wing's existing patterns"), cost zero
        rework here, but is a footprint-table/actual-practice mismatch
        worth someone confirming is the intended division of labour.
  note: >
    A haiku-tier run on a prior wing read art-rotation's own commit as a
    footprint violation and invented a second offender (author.md line 191).
    This run avoided that trap by locating art-rotation's actual commit
    before concluding anything, at the cost of extra tool calls beyond the
    nominal 15-call budget - reported here rather than hidden, since a wrong
    accusation costs more than an honest overrun.

what_is_fine:
  - franchise-research, completeness-auditor, editions, translation,
    press-archaeology (main pass): tokens/call in the 2,500-3,000 range,
    consistent with the baseline run's shape for research-heavy stages. No
    action proposed.
  - eras, event-resonance, visual-language, spoiler-audit: normal
    tokens/call, single-pass, no rework detected. No action proposed.
  - audit-fixes: 94,069 tokens / 66 calls to close 5 wing-audit defects by
    hand is a reasonable, bounded cost for a fix pass. No action proposed.

what_could_not_reach:
  - Per-tool-call breakdown inside any stage (subagent transcripts are not
    readable from this stage per the skill's own stated limit) - the
    visual-metadata 212-calls figure is explained by handoff evidence
    (lookup.py used first, then per-work ?default=false verification) but
    not independently verified call-by-call.
  - Whether visual-metadata's verification fetches were themselves batched
    (multiple candidate URLs per fetch.py call) or issued one-by-one; the
    handoff text does not say, and this is the difference between "already
    efficient" and "the next death-by-fetches shape to fix."
  - Cross-run trend beyond the two data points available to this stage (John
    Shirley baseline, Atwood aura chain) - a full trend read needs prior
    wings' own PR bodies, which the orchestrator holds, not this worktree.
