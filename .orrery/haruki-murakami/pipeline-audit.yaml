stage: pipeline-audit
wing: haruki-murakami
summary: >
  15 dispatches, 13 stages, ~3,190,815 tokens / 1,341 calls. Top three by
  tokens: press-archaeology (346,253, 10.9%), visual-metadata (325,195,
  10.2%), editions (297,699, 9.3%) - 30.4% of the run between them. Zero
  footprint violations found across all three named collision pairs, and one
  suspected fourth (art-rotation/authors file) resolved clean once its
  actual commit was located. The aura whack-a-mole coaching (explicit briefs
  to press-archaeology and event-resonance) measurably worked: one follow-up
  pass at 138,440 tokens versus the Atwood wing's three-pass, 562,596-token
  chain for the same failure shape - a 424,156-token saving from two lines of
  orchestrator prompt. Recommend baking it into the skill files. Confirmed
  4 of the 5 systemic findings as described or worse; the fifth (images.header)
  is correctly filed as informational, not a defect.

