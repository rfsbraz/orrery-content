stage: editions
summary: >
  Built content/franchises/haruki-murakami/editions.yaml from scratch: 55
  entries covering 27 of 29 works with at least one edition (23 of 29 with a
  pt-PT edition too). English side sourced from each work's own Wikipedia
  infobox, cross-checked against OpenLibrary edition records and, for the
  current Vintage/Vintage Classics reissues, penguin.co.uk product pages for
  imprint/format. pt-PT side sourced entirely from the Biblioteca Nacional de
  Portugal's ipac20 catalogue (browser User-Agent, per CURATION Sec.4),
  swept across all 10 result pages for "Murakami Haruki" (91 records) rather
  than queried work-by-work - this is how the Portuguese publisher
  (Casa das Letras/Leya, one dominant translator Maria João Lourenço) and
  its full reprint history per title were established. lookup.py's
  --markets pt run surfaced only one genuine pt-PT hit (Sputnik Sweetheart /
  Casa das Letras) plus four pt-BR editions mislabelled "pt" by OpenLibrary's
  known pt-PT/pt-BR merge (CURATION Sec.4) - Objetiva, Alfaguara Brasil and
  Estação Liberdade (x2), all excluded. Every isbn13 verified computationally
  (script, not by hand) against its own check digit; 55/55 pass.
  validate.py --slug haruki-murakami: 0 errors, 2 pre-existing warnings (not
  from this file).

  The three superseded-edition cases confirmed by completeness-auditor
  (Hear the Wind Sing, Pinball 1973, Norwegian Wood - each a Kodansha
  English Library, Japan-only Birnbaum translation later superseded by a
  general-release one) are recorded exactly on the chuck-palahniuk/fight-club/
  noticias-1999-pt precedent: current translation first, superseded one
  second with a `note`. A FOURTH case turned up independently while sourcing
  Hard-Boiled Wonderland and the End of the World's current edition: Alfred
  Birnbaum's 1991 Kodansha International translation - the general-release
  text for 33 years, never Japan-only - was replaced in December 2024 by a
  brand-new Jay Rubin translation retitled "End of the World and Hard-Boiled
  Wonderland" (word order reversed to match the Japanese original). Recorded
  the same way, with the note distinguishing it from the other three (this
  one WAS the general-release text, unlike the Kodansha English Library
  editions).

  Norwegian Wood also gets a genuinely different pt-PT case, found
  independently: Civilização's 2004 translation (Alberto Gomes) predates and
  is superseded by Casa das Letras' Maria João Lourenço translation (current
  since 2016) - the same superseded-but-real pattern, in Portuguese.

  A real check-digit catch: BNP's own result page renders the 2007 1st
  edition of Dança, Dança, Dança as ISBN 978-972-46-1715-0, which fails its
  check digit (that root, with a 2 checksum, belongs to the neighbouring Em
  Busca do Carneiro Selvagem entry on the same page instead). Every later
  reprint entry for Dança, Dança, Dança in the same catalogue agrees on
  978-972-46-1751-0, which passes - that is what is recorded, with the
  discrepancy written into the entry's own note per the Wee Free Men model
  (SCHEMA.md / CURATION.md Sec.4).

  Three edition-level facts found in BNP's results and deliberately not
  recorded under any workId, since none is a translation of a whole listed
  work: "Sono" (a single-story Kat Menschik gift edition of "Sleep," one of
  The Elephant Vanishes' seventeen stories), "Os Assaltos à Padaria" (pairs
  "The Second Bakery Attack" with the revised "Pan" piece Let's Meet in a
  Dream's own note already describes), and "O Sétimo Homem e Outros Contos"
  (a 2026 comics adaptation, not a translation at all).

produced:
  - content/franchises/haruki-murakami/editions.yaml

decisions:
  - >
    Which edition to record when several exist: the most recent one BNP or
    OpenLibrary/the publisher's own site attests, per SCHEMA.md's own
    default. Applied even where the specific copy on a shelf might be an
    earlier printing of the same unchanged ISBN root (Casa das Letras rarely
    changes the ISBN between reprints of the same translation).
  - >
    The Hear the Wind Sing / Pinball 1973 omnibus (English: Knopf 2015;
    Portuguese: Casa das Letras 2016) is recorded as two entries sharing one
    ISBN, one per workId, each noting the shared object explicitly so a
    future duplicate-ISBN audit (CURATION's own audit checklist, item 6)
    does not mistake it for a transcription error.
  - >
    Absolutely on Music's pt-PT edition is translated "do inglês" (from Jay
    Rubin's English translation, not the Japanese original) per its own BNP
    record - stated in that entry's note since it is a genuine exception to
    every other pt-PT entry in this file.
  - >
    Birthday Stories ships with no translator field: the anthology reprints
    other authors' own English texts, and no edition record found credits a
    translator for Murakami's own "Birthday Girl" piece specifically. Recorded
    as an honest gap in the note rather than guessed.

forStages:
  visual-metadata: >
    editions.yaml now exists (55 entries, 27 of 29 works). The two omnibus
    pairs (Hear the Wind Sing/Pinball 1973 in both languages) share one ISBN
    across two workIds - a cover sourced for one already covers the other,
    no second fetch needed. Do not add coverUrl or attempt to source a cover
    for "Sono," "Os Assaltos à Padaria," or the 2026 comics adaptation under
    any of this wing's workIds - see this file's own header for why none of
    the three has one. The Vintage Classics 2022 "Murakami Collectible
    Classics" gift hardbacks (Norwegian Wood, Kafka on the Shore) and the
    2023 Sputnik Sweetheart hardback are recent enough that OpenLibrary likely
    holds a real publisher-supplied cover image rather than a retailer scrape
    - worth checking first before any other source for those three.
  wing-audit: >
    0 errors, 55/55 ISBNs verified by script (not by hand) against their own
    check digits - including one real BNP check-digit failure caught and
    written up (Dança, Dança, Dança's 1st-edition entry) rather than silently
    corrected. Four works have an English edition but no pt-PT one found in
    BNP's holdings (After the Quake, The Strange Library, Murakami T,
    Birthday Stories) - a market fact, not a research gap, per the sweep
    covering all 91 BNP records for this author. Two works (Let's Meet in a
    Dream, The Tale of KAHO) have no edition of any kind, both genuinely
    untranslated. Killing Commendatore's 2018 Portuguese 1st edition carries
    two ISBNs (978-989-780-034-4 and 978-989-780-085-6) that BNP does not
    resolve to a specific volume; Norwegian Wood's 1989 Kodansha English
    Library two-volume set is the same shape (two ISBN-10s on one OpenLibrary
    record, Internet Archive holds a scan of each volume but neither page
    states which ISBN is which) - both are stated as open in the entries'
    own notes rather than guessed at.

openQuestions:
  - >
    Which ISBN maps to which physical volume, in both two-ISBN cases above
    (Killing Commendatore pt-PT 1st ed.; Norwegian Wood's Kodansha English
    Library two-volume set) - a human with the physical books or a more
    detailed library record could resolve this; not attempted here since
    guessing would misattribute a real ISBN to the wrong object.
  - >
    Whether Wind-Up Bird Chronicle's, Wild Sheep Chase's and 1Q84's current
    Vintage/Vintage Classics English ISBNs are genuinely still the newest
    in-print printing, or whether a still-newer "Murakami Collectible
    Classics" gift hardback (the series Norwegian Wood and Kafka on the
    Shore already belong to) has since extended to them too - worth a
    re-check on penguin.co.uk the next time this file is audited, since that
    series was still being rolled out title by title as of this pass.
