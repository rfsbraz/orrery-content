stage: spoiler-audit
summary: >
  Four synopses rewritten, no boundary set, none loosened. Every ruling was
  made against the book's own publisher copy (Vintage/Knopf product pages,
  pulled per title) rather than from memory, and against the Wikipedia plot
  where the question was how far into the book a thing is disclosed. Read in
  full: all 29 synopses, 3 franchise events, 15 author lifeEvents, 2 era
  descriptions, 5 startHere paths, orders.yaml, franchise.description,
  theme.notes. Each fix carries a curator-only `note` recording what is
  deliberately unstated, so a later enrichment pass does not pull the fuller
  blurb back in. validate.py --slug haruki-murakami: the same 1 error
  (theme.art, pre-existing) and 2 handoff warnings as before, no new ones.
produced:
  files:
    - content/franchises/haruki-murakami/works.yaml (4 synopses, 5 notes)
  rewritten:
    - {id: hard-boiled-wonderland-and-the-end-of-the-world, bounds: "how the Tokyo strand and the walled Town relate (late reveal); old text: 'converge on a question of which self is real'"}
    - {id: killing-commendatore, bounds: "what the found object releases, what the painting records (mid-book, no jacket copy); old text also invented a statuette the novel lacks"}
    - {id: pinball-1973, bounds: "the outcome of the search; 'ultimately unresolved' stated the ending's shape, and wrongly"}
    - {id: 1q84, bounds: "the link between Aomame and Tengo; jacket keeps it as 'the profound and tangled connections that bind them'"}
  boundariesSet: []
  boundariesLoosened: []
checkedAndSafe: >
  The Wind-Up Bird Chronicle: nothing on Noboru Wataya, nothing on how
  Kumiko's storyline resolves; cat, wife, well and Manchuria are all jacket
  copy. Kafka on the Shore: names neither the Johnnie Walker figure nor any
  resolution of the prophecy; the Oedipal frame is stated openly in the book
  and the converging paths are jacket copy. Norwegian Wood: the friend's
  suicide is backstory delivered in the opening chapters (jacket: "the tragic
  death of their best friend years before"); Naoko's own fate is untouched.
  Sputnik Sweetheart, Colorless Tsukuru, South of the Border, Dance
  Dance Dance, A Wild Sheep Chase, After Dark, The City and Its Uncertain
  Walls: all at or inside their jacket copy, none resolving an open ending;
  the Rat's fate is not stated. The Strange Library's stated threat is its
  setup and the escape plot is jacket copy. Events: the
  1Q84 blackout entry describes marketing and no plot; the Hong Kong entry
  says "over its sexual content" and never specifies the passages; the Kaho
  entry quotes the publisher's own campaign message. No lifeEvent states a
  plot outcome - the Manchuria line (1991) and the "surrendered shadow" line
  (2016 Andersen speech) are jacket- or opening-chapter level. Eras,
  startHere prose and orders.yaml carry premises and craft judgments only.
elephantVanishesCheck: >
  Resolved, no fix needed, recorded in the work's own note. "The Wind-up Bird
  and Tuesday's Women" became the Chronicle's opening chapter, so the shared
  material is that novel's first act, which the Chronicle's own jacket
  describes (missing cat, then missing wife). Neither direction leaks: the
  collection's synopsis names no story, and the novel's says nothing about how
  the short story ends.
forStages:
  visual-language: >
    Do not depict: the two Hard-Boiled Wonderland strands as one figure, one
    mind or one mirrored self (keep them two unrelated scenes if both appear);
    the small figure from the Killing Commendatore painting, or the opened
    pit; Aomame and Tengo as children or together. Safe and jacket-backed:
    unicorn skulls, the walled Town, wells and dry shafts, cats, two moons
    over Tokyo, a jazz bar, a shadowless street.
  translation: >
    No content/i18n/pt-PT/franchises/haruki-murakami/ exists, so nothing was
    mirrored and no coverage moved. When the overlay is built, translate the
    four rewritten synopses from their current text: do not re-summarise from
    Portuguese blurbs or Wikipedia, which restore the reveals these four
    deliberately omit. `note` fields are curator-only and untranslated.
  wing-audit: >
    Softest call: dropping "once childhood classmates" from 1Q84. The fact
    lands inside Book 1 and appears in most reviews, but the publisher's copy
    withholds it on purpose. Loosenable, and losing it costs little.
openQuestions:
  - >
    Rulings rest on US Vintage/Knopf jacket copy only. WebSearch was at budget
    (200/200) from the start, as for reading-orders, and penguin.co.uk pages
    are id-addressed, so the UK Harvill Secker blurbs were not pulled as a
    second jacket. Where the houses differ the UK copy is usually fuller,
    which would loosen rather than tighten these calls.
