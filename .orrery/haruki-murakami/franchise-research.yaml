stage: franchise-research
wing: haruki-murakami
summary: >
  Scaffolded the wing from scratch: franchise.yaml, works.yaml (27 works: 15
  core novels, 11 extended collections/nonfiction, 1 apocrypha), the global
  author entity, theme.yaml (preset/palette/displayFace/signature only).
  Verified the request issue's own recollection rather than trusting it -
  accurate on Hear the Wind Sing/Pinball 1973, but incomplete: the same
  Japan-only-then-superseded translation pattern also applies to Norwegian
  Wood, a third novel the issue never mentioned. validate.py --slug
  haruki-murakami: 0 errors, 1 expected warning (no theme.art, the
  documented state for a wing with no aura yet).

produced:
  - content/franchises/haruki-murakami/franchise.yaml
  - content/franchises/haruki-murakami/works.yaml
  - content/franchises/haruki-murakami/theme.yaml
  - content/authors/haruki-murakami.yaml

decisions:
  - >
    published: original Japanese year, except The Elephant Vanishes (1993)
    and Blind Willow, Sleeping Woman (2006) - both selected and first
    published as books in English, with a matching Japanese edition
    following years later (2005/2009). A second fault-line-3 wrinkle beyond
    the issue's framing, found independently.
  - >
    title: native Japanese script (e.g. 風の歌を聴け), Hepburn romanization
    in a note on every entry - the catalogue's first non-Latin-script wing.
    Flagged below as the loudest open question.
  - Dance Dance Dance: no subseries (Wikipedia calls it the trilogy's "later epilogue", not its fourth book); the link is a note instead.
  - "Absolutely on Music: authorRole co-author (Seiji Ozawa, no catalogue entry), no withAuthorIds - jo-nesbo/stemmer-fra-balkan precedent."
  - "Birthday Stories: apocrypha, authorRole editor, contributionTitle Birthday Girl - jo-nesbo/books-to-die-for precedent."
  - >
    No author lifeEvents scaffolded. Adding either obvious anchor (birth;
    the sourced 1978 Yakult Swallows origin story) flips validate.py's
    theme.yaml check from warning to blocking error, since any lifeEvent
    counts as aura that needs theme.art - out of scope here. Both facts are
    in bio prose instead. press-archaeology: read validate.py ~1010-1048
    before adding the first lifeEvent; theme.art needs to land with or
    before it.

forStages:
  completeness-auditor:
    - "Let's Meet in a Dream (1981, co-written with Shigesato Itoi): one uncorroborated Japanese-Wikipedia source, left out - worth a second-source check."
    - "No contributor/editor sweep run beyond Birthday Stories (see jo-nesbo's own apocrypha section for the pattern)."
    - "OpenLibrary 503'd throughout; no ISFDB entry exists for Murakami. Cross-checked only against each work's own English Wikipedia article (not the navbox, which had two wrong original-title fields)."
  editions:
    - "Hear the Wind Sing, Pinball 1973, AND Norwegian Wood each need two edition entries: a superseded Japan-only Kodansha English Library translation (Birnbaum) plus the current general-release translation (Goossen 2015 omnibus; Rubin 2000). Discontinued editions had real ISBNs; editions.yaml's note field records superseded status, no schema change needed."
    - "Split-translator books: Elephant Vanishes, Blind Willow (by story), 1Q84 (by book-group), Killing Commendatore, Men Without Women, Novelist as a Vocation (by volume/half), Underground (abridged combination of two separate JP source books). translator is a free string; confirmed sufficient."
    - "Per-work translator already sourced in each works.yaml entry's own note; Birnbaum through 1994, then Rubin/Gabriel, Goossen from 2014 on."

openQuestions:
  - >
    LOUDEST: native-script title vs. Hepburn romanization. First
    non-Latin-script wing; SCHEMA/LAYOUT/VISUAL say nothing about CJK glyph
    support in the three display faces or the work-reference renderer. If
    it renders as tofu or a silent font fallback, every source checked here
    uses the romanization instead - a one-file fix since ids don't change.
    Settle (and ideally render-test) before merge.
  - "docs/CONCEPT.md (which the skill cites for SS4/4a/6/9) does not exist in this worktree - only CURATION/SCHEMA/LAYOUT/VISUAL/GENERATOR-PROJECT/PROMPT-MODULES/TOOLING.md are present. Proceeded on SCHEMA+CURATION alone; worth confirming nothing in CONCEPT SS6 contradicts theme.yaml's choices."
