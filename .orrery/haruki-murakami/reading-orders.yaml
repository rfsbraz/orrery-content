stage: reading-orders
summary: >
  Shipped zero orders.yaml entries and a 5-path startHere. No formal order
  earns a slot: the Trilogy of the Rat (Hear the Wind Sing, Pinball 1973, A
  Wild Sheep Chase) is real and received - three independent Wikipedia
  articles name it, all hedged "so-called" - but is only 3 works, already
  adjacent in the derived default, and excludes Dance Dance Dance by that
  same sourced consensus ("later epilogue," not a fourth book). A "Beyond
  the Novels" completionist order for the 12-work extended tier was also
  rejected: the real disparity found (5 titles with a hard external
  distinction against 7 without) only excludes 2-3 of 12, too thin to clear
  the divergence bar at this tier's size (Atwood's own version cut 43 to
  27). Both shipped as startHere paths instead (workIds, each <=5 works). A
  third candidate, a translation-order for the dual-translation novels, was
  rejected outright per the catalogue's settled Nesbo precedent (see below).
  startHere ships essentials (The Wind-Up Bird Chronicle, sourced to a
  Guardian "if you only read one" piece r/murakami's own mods pinned, a
  Vulture #1 ranking, and organic reddit convergence), the-famous-one
  (Norwegian Wood, same Guardian piece's "the entry point," flagged
  atypical - the famous-book trap, resolved the way this catalogue resolved
  it for Atwood/Gilead), trilogy-of-the-rat (3 works, returning/
  completionist only, explicitly not an entry point), beyond-the-novels (5
  works, each sourced to a real award or adaptation, naming the 7 left
  out), and everything (orderId: default). validate.py: 0 errors beyond
  the pre-existing theme.art one, 0 new warnings.
produced:
  files:
    - content/franchises/haruki-murakami/orders.yaml (new, empty list + findings header)
    - content/franchises/haruki-murakami/franchise.yaml (startHere added)
  startHere:
    - {id: essentials, workIds: 1, fit: "new/returning, taste"}
    - {id: the-famous-one, workIds: 1, fit: "new, taste"}
    - {id: trilogy-of-the-rat, workIds: 3, fit: "returning/completionist, taste"}
    - {id: beyond-the-novels, workIds: 5, fit: "completionist, taste"}
    - {id: everything, orderId: default, fit: "completionist, complete"}
dualTranslationFact: >
  Resolved as NOT this stage's territory. The request issue called it
  "reading-order-adjacent"; checked against this catalogue's settled Nesbo
  position and does not survive it - a translation's release date is a
  licensing fact, not the author's sequence, regardless of the 26-year gap
  for Hear the Wind Sing/Pinball 1973 or Norwegian Wood's own version.
  Already documented in works.yaml's header; editions.yaml's from here.
  orders.yaml's header records the rejection so it is not re-opened later.
prequelSpoilerCheck: >
  One genuine case, needing no fix. The Elephant Vanishes (1993, in
  beyond-the-novels) contains "The Wind-up Bird and Tuesday's Women,"
  which the Chronicle's own Wikipedia article confirms was "subsequently
  updated as" that 1994 novel's first chapter - a real preview of its
  missing-cat, mystery-phone-call opening. Already safe by construction:
  1993 precedes 1994 in the derived default and nothing here reorders
  either book. Only other cross-work reuse found is a character name
  (Noboru Wataya, unrelated character, in both "Family Affair" and the
  Chronicle) - no plot content shared.
forStages:
  spoiler-audit: >
    Verify prequelSpoilerCheck independently. All 5 paths' prose re-read as
    an anonymous newcomer (SKILL.md SS7): no plot reveals, only premises and
    nonfiction subject matter. trilogy-of-the-rat's note quotes Murakami's
    own "immature" self-assessment (already sourced in works.yaml) and
    Vulture's "forced" verdict on A Wild Sheep Chase - craft judgments, not
    spoilers.
  translation: >
    No content/i18n/pt-PT/franchises/haruki-murakami/ exists (confirmed,
    matching eras.yaml's own finding). orders.yaml ships empty (nothing to
    translate); franchise.yaml's 5 new paths need pt-PT for
    title/description/note x5 (15 fields), never workIds/orderId/fit
    (SKILL.md SS11).
  wing-audit: >
    beyond-the-novels' central/peripheral line is this stage's softest call:
    Novelist as a Vocation and What I Talk About When I Talk About Running
    got real broadsheet coverage (Guardian, NYT, Hindu, Telegraph) but no
    hard external marker (award, adaptation) like the 5 shipped titles, and
    Novelist as a Vocation's reception is genuinely mixed, not positive -
    worth a second look. The Strange Library and Murakami T were dropped on
    a plainer call (no award, modest reception).
openQuestions:
  - >
    WebSearch was at budget (200/200, confirmed directly) from the start of
    this stage, matching jose-saramago's own finding. Research ran through
    scripts/fetch.py against Wikipedia, Vulture's ranked-list article, and a
    Guardian piece surfaced via r/murakami's own pinned mod post (a genuine
    canonical-guide signal, not a search result) - lithub.com's equivalent
    piece resolved to a navigation shell with no article text, the same
    dead end franchise-research's handoff already found for a different
    lithub URL.
