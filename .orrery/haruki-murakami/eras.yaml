stage: eras
wing: haruki-murakami
summary: >
  Real, received periodisation exists and it is unusually strong: Murakami
  named his own two periods and the scholarship adopted the names. Shipped two
  eras, Detachment (1979-1993) and Commitment (1994-present), both
  provenance: author. The labels are Murakami's own katakana loanwords
  デタッチメント / コミットメント from his book of conversations with the
  psychologist Hayao Kawai (村上春樹、河合隼雄に会いにいく, Iwanami Shoten,
  5 December 1996; conversations recorded November 1995, quoted at pp. 12-13
  and 70). The division is stated as settled convention by A. K. Byron in New
  Voices in Japanese Studies 9 (2017), whose article opens "The career of
  novelist Haruki Murakami has conventionally been divided into two periods:
  detachment and commitment", and independently by Lee Eunlye in The Korean
  Journal of Japanology 130 (2022). Zero orphaned works: all 29 works,
  1979-2026, fall inside a span, verified by breaking the span on purpose and
  watching the validator's orphan warning fire, then go quiet again.

produced:
  - content/franchises/haruki-murakami/eras.yaml

verdicts:
  detachment:
    label: RECEIVED
    rung: 1 (author's own term), corroborated at rung 2 (scholarly convention)
    boundary: >
      START 1979 is the first novel, not a boundary anyone draws, and is
      flagged as such on the entry. END 1993 is sourced: every account puts the
      hinge at The Wind-Up Bird Chronicle, whose first instalment is 1994.
  commitment:
    label: RECEIVED
    rung: 1 (author's own term), corroborated at rung 2 (scholarly convention)
    boundary: >
      START 1994 is sourced but has a contested edge, kept and flagged rather
      than smoothed: the usual reading opens the period at The Wind-Up Bird
      Chronicle (Byron citing Tanaka Atkins 2012; Lee 2022 independently),
      while Haruo Yoshida (1997) built a book on Underground (1997) as the
      watershed instead and later withdrew the assessment. The two candidates
      are three years apart and the argument is about the edge, not about
      whether the period exists, which is itself evidence it does. END is left
      open because no source closes it.

decisions:
  - >
    Boundary drawn at 1993/1994 rather than 1994/1995. The Wind-Up Bird
    Chronicle was published in Japanese in two instalments (Books 1-2, April
    1994; Book 3, August 1995), so sources cite it as [1994], [1995] and
    [1994-95] interchangeably; works.yaml dates it 1994. Era membership is
    computed from the published year, so a 1995 boundary would have put the
    one novel every source names as the hinge on the detachment side.
  - >
    Titles are the bare received terms, Detachment and Commitment, in Latin
    script. The Japanese received form is a katakana transliteration of these
    same two English words, so nothing is being translated by us, and the
    wing's unresolved CJK glyph-support question does not touch the era
    plates. "Detachment" was used pejoratively by some Japanese critics
    (Karatani 1990); the descriptions attribute that reading rather than
    asserting it.
  - >
    provenance: author on both, the highest rung that holds. The critical
    convention is recorded in the file header rather than in the field, since
    the field takes one value.
  - >
    Layout: both are chapter-gate with images_required 1, and the two
    illustration types differ (symbolic-still-life, atmospheric-motif-field)
    so no neighbour repeats. establishing-landscape was deliberately avoided:
    it is in OPAQUE_TYPES and would file a plate opaque, and validate.py's
    _edge_regime already forces `plate` for chapter-gate.

shortFictionAndNonfiction: >
  Addressed explicitly in the file header rather than left to the year
  arithmetic. The scheme is not novels-only, and this is not a concession: the
  two books most often produced as evidence of the commitment turn are a work
  of nonfiction (Underground, 1997) and a short-story collection (after the
  quake, 2000), both of which sit in the commitment span and belong there.
  The lighter nonfiction is the honest weak spot and is flagged as such: What
  I Talk About When I Talk About Running (2007), Absolutely on Music (2011),
  Murakami T (2020) and the edited anthology Birthday Stories (2002) fall
  inside the commitment span by publication year and by nothing else, and the
  era note says so. The Elephant Vanishes (1993) collects stories written
  1983-1990, so it lands in detachment on either its compilation year or its
  writing years and nothing turns on which is used. Precedent followed is
  margaret-atwood/eras.yaml, whose Staines scheme covers poetry and criticism
  alongside the novels and documents that reach in its header.

rejected:
  - "A break at Hard-Boiled Wonderland (1985) for the turn to the fantastic: real as a description of the books, drawn as a period boundary by nobody."
  - "A break at Norwegian Wood (1987) for the swerve into realism: well sourced as a fact about one book (Paris Review 2004 calls it his first realistic novel) and as the commercial event that pushed him out of Japan, but Murakami's own division runs straight through it."
  - "The expatriate years, roughly 1986 to June 1995 (Princeton, Tufts, Harvard): real and dateable, but Murakami folds it into the commitment turn rather than setting it beside one. It belongs on the author's lifeEvents, not on a plate."
  - "A kitchen-table or pre-professional first period covering the two novels written while he still ran the jazz bar Peter Cat (1974-1981): Murakami calls those two books immature and flimsy, but that is a verdict on two books, and carving 1979-1981 out would contradict the criticism, which puts all three Rat Trilogy novels in detachment."
  - "A late style opening at 1Q84 (2009): searched for and not found; Lee 2022 reads 1Q84 through the same two terms."

validation: >
  python3 scripts/validate.py --slug haruki-murakami: 1 error, and it is the
  expected one. Adding any aura at all (eras, events or author lifeEvents)
  flips theme.yaml's missing `art:` block from a warning into a blocking error
  (validate.py ~1023-1047). eras.yaml triggers it exactly as
  franchise-research predicted lifeEvents would. It is visual-language's to
  close and nothing here can. Zero era-coverage warnings: no work is orphaned.
  Falsified rather than trusted, per CURATION §5 - narrowing the detachment
  span to 1982-1993 made the validator name the three works it stranded, and
  restoring it silenced them.

forStages:
  event-resonance: >
    The era boundary is an event-dense year and the events are already
    sourced: Murakami returned from the United States in June 1995, between the
    Kobe earthquake (January 1995) and the Aum Shinrikyo sarin attack on the
    Tokyo subway (March 1995). Every story in after the quake is deliberately
    set in the single month between the two. The Wind-Up Bird Chronicle won
    the Yomiuri Prize, awarded by Kenzaburo Oe, previously one of his harshest
    critics. Note the two-instalment publication (April 1994 / August 1995)
    before dating anything to "1995".
  reading-orders: >
    The two eras cut the shelf at The Wind-Up Bird Chronicle, which is also the
    novel most often recommended as an entry point. The Trilogy of the Rat is
    already a works.yaml subseries and sits wholly inside detachment; Dance
    Dance Dance (1988) does too, which keeps the "fourth Rat book" question a
    reading-order matter rather than an era one.
  art-rotation: >
    Two era plates to prompt, both organisation chapter-gate,
    images_required 1, no images block yet. detachment is
    symbolic-still-life, commitment is atmospheric-motif-field. Do not switch
    either to establishing-landscape: it is in OPAQUE_TYPES. Era plates are
    excluded from art_rotation.py's frequency cap by design (VISUAL.md §4b
    fixes theirs). art_rotation.py did not run here, exiting with "no wing at
    content/franchises/haruki-murakami/" from inside this worktree.
  wing-audit: >
    Era coverage is complete with no gaps and no orphans, but the eras skill's
    override applies regardless: coverage is not the standard here, provenance
    is. The one open item is theme.art, which is visual-language's.
  translation: >
    This wing has no content/i18n/pt-PT/franchises/haruki-murakami/ directory
    at all, so eras.yaml ships with no pt-PT overlay. The Japanese terms in
    the descriptions (デタッチメント / コミットメント) are the received forms and
    stay as they are in any locale; the English words Detachment and Commitment
    are the received terms too, not glosses.

openQuestions:
  - >
    The era titles are single abstract nouns, which is what the sources give
    and may read thin on a full-bleed "ENTERING COMMITMENT" plate. Any
    expansion would be a coinage, so the flat received term was preferred over
    a fuller invented one. Worth a curator's eye at render time.
  - >
    Web search was unavailable for this pass (the session's budget was
    already spent), so every source was reached by constructing URLs and by
    querying the Crossref and Wikipedia APIs directly. Languages searched:
    English and Japanese, plus one Korean-journal article read in its English
    abstract. Refused or unreachable: britannica.com (403), nytimes.com (403),
    the Paris Review interview (served, but only its free preamble; the
    interview body is paywalled), lithub.com's "The Birth of My Kitchen-Table
    Fiction" (the URL serves a navigation shell with no article), the
    University of Minnesota Press page for Strecher's The Forbidden Worlds of
    Haruki Murakami (the constructed ISBN URL resolved to an unrelated title,
    caught before it was cited). Strecher and Rubin's book-length studies were
    therefore not read directly; the periodisation does not rest on them.
