stage: event-resonance
wing: haruki-murakami
summary: >
  Ruled on the 13 global.yaml events that fall inside Murakami's 1949-alive
  lifetime (pre-1949 entries left unruled as implausible on their face, per
  precedent). One include: covid-19-pandemic-2020, on a sourced 2024 Guardian
  interview where Murakami names the walled town in The City and Its
  Uncertain Walls (2023) as his own lockdown metaphor. Twelve excluded, none
  clearing the one-sentence resonance test. Wrote the ruling into
  content/franchises/haruki-murakami/franchise.yaml's globalEvents field.

produced:
  - content/franchises/haruki-murakami/franchise.yaml (globalEvents: 1 include, 12 exclude)

decisions:
  - >
    covid-19-pandemic-2020 included on primary-source evidence, not
    inference: John Self's Guardian interview (23 Nov 2024) has Murakami
    saying the walled town "was also a metaphor of the worldwide lockdown...
    that was one of the major themes of this novel," about a 1980 novella he
    rewrote in 2020-21 without leaving home. Distinct from the 1995 Kobe
    earthquake/sarin material already on his lifeEvents (the direct subject
    of two other books); this is a different book, a different decade, his
    own stated connection.
  - >
    Twelve excluded after checking each against a real source, not a shrug:
    sept-11-2001 and financial-crisis-2008 (no sourced link to any book or
    essay - his terrorism material is the 1995 sarin attack, already
    carried), lady-chatterley-trial-1960 (his real censorship fight is Hong
    Kong 2018, a different law, already a franchise event), fantasy-
    paperback-boom-1965 (wrong genre lineage - his surrealism runs through
    Kafka/Carver/noir, not epic fantasy), carnation-revolution-1974 and
    portugal-bailout-2011 (Portugal-specific, no connection to a Japanese
    author), chain-bookshop-1982, online-bookselling-1995 and ebook-and-
    self-publishing-2007 (generic industry texture; searched for a specific
    tie - his own real launch-day events, already franchise events, are
    publisher-marketing stories, not chain-display or retail-format ones -
    and found none), prestige-fantasy-adaptation-2011 (names Game of
    Thrones-style prestige fantasy TV specifically; his own adaptations are
    literary arthouse film), booktok-2020 (individual fan TikToks exist, as
    for most backlist novelists; no source ties a sales spike specifically
    to the platform rather than to his ordinary sales), comics-code-
    authority-1954 (US comics self-censorship; he was five and writes no
    comics).
  - >
    IMPORTANT, flagged per this stage's own load-bearing-check instruction:
    this ruling reopens TWO of press-archaeology's closed dark runs, not
    one. aura_density.py haruki-murakami now reports 1997-2004 (8yr) as
    longest; a second run at 1979-1985 (7yr) sits right behind it once the
    first is patched (verified by temporarily restoring sept-11-2001 to
    include: the reported longest run shifts to 1979-1985 at 7yr, still
    over the 5yr limit). Both were being closed by globals that used to
    render on every wing by lifetime default before this stage opted the
    catalogue into explicit include/exclude: chain-bookshop-1982 (1982,
    inside 1979-1985) and sept-11-2001 (2001, inside 1997-2004). Neither
    exclusion is wrong on the resonance merits - restoring either as a
    padding include would be exactly the "favor to the aura number" this
    skill forbids - but the wing is not actually at press-archaeology's
    claimed 4-year maximum anymore and needs a fresh pass with real
    lifeEvents or franchise events for both windows before it is called done.

forStages:
  press-archaeology: >
    Two dark runs need real, sourced material, not a re-litigation of the
    globals just excluded: 1979-1985 (early Peter Cat/pre-fame years, between
    the 1978 Yakult epiphany and the 1986 Europe departure) and 1997-2004
    (the Underground/after-the-quake publication years through Sputnik
    Sweetheart and Kafka on the Shore, after the ultramarathon entry and
    before the NYC marathon one). aura_density.py haruki-murakami reproduces
    both; re-run it after adding material, not just after adding it once.
  wing-audit: >
    Do not treat this wing as complete on press-archaeology's original "4yr
    max" claim - it no longer holds post-curation. Confirm a re-measure
    happened before signing off. globalEvents itself is fully ruled (13 of
    13 lifetime-reachable events have a decision); no "inherited from the
    lifetime default" markers remain.
  reading-orders: >
    franchise.yaml now carries a globalEvents block above `sources:`; no
    other field this stage owns is adjacent to what reading-orders adds, but
    it is the same file - re-read the current version before editing rather
    than a stale copy.

openQuestions:
  - >
    Whether the 2021 radio-show criticism of PM Suga's COVID handling (his
    own public commentary, not fiction) is worth a franchise or lifeEvent
    entry alongside the walls-of-COVID novel connection was not decided here
    - out of scope for globalEvents, noted for whoever next touches
    lifeEvents.
