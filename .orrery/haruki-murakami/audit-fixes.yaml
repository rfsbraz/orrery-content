# This file accumulates follow-up fix passes on top of the original wing
# build, in chronological order. The first entry (press-archaeology) predates
# wing-audit and is kept verbatim as the historical record; the second
# (this pass) closes wing-audit's own findings.

- stage: press-archaeology
  wing: haruki-murakami
  summary: >
    Follow-up pass to close the two dark runs event-resonance reopened by
    correctly excluding sept-11-2001 and chain-bookshop-1982:
    1979-1985 (7yr) and 1997-2004 (8yr). Both close with real, sourced
    lifeEvents; no padding used. aura_density.py haruki-murakami: 29 works,
    19 aura, 0.66/work, longest dark run now 4yr (1982-1985) - under the 5yr
    limit and, since it is also the wing's new worst figure, no third window
    was exposed by closing the first two. art_rotation.py --check: 18 event
    sketches, no organisation over cap, no neighbour repeats, no plateau, no
    loud-cell violation - the only reported issue is the pre-existing "0 of
    20 assets could be read" no-art-block state, unchanged in kind from
    before this pass. validate.py --slug haruki-murakami: 0 errors (the
    theme.art error and the two pre-existing handoff-length warnings are
    untouched by this pass).

  produced:
    - content/authors/haruki-murakami.yaml (lifeEvents: +3 entries, header note extended)

  decisions:
    - >
      1979-1985 closes on ONE new lifeEvent, dated 1981: by his own account
      (Lit Hub's excerpt of his Wind/Pinball introduction), Murakami sold
      Peter Cat shortly after finishing Pinball, 1973 (1980), decided to
      write full time, and immediately began A Wild Sheep Chase (1982) -
      which he calls the true beginning of his career, distinct from his
      first two "kitchen-table novels." Splits the 7yr run into 2yr and 4yr,
      both under the limit. The Gunzo Prize (won April 1979, the 22nd Gunzo
      Prize for New Writers) and the Noma Literary Newcomer's Prize (1982,
      for A Wild Sheep Chase) were both verified but not given their own
      slots: Gunzo lands on a year the book's own publication already
      occupies and would not have been load-bearing once this entry closed
      the window; Noma is folded into this entry's prose instead (Gunzo's own
      editors disliked the new novel; the Noma Prize and the public are what
      let the bet stick).
    - >
      1997-2004 closes on TWO new lifeEvents, both leaning on Japanese
      Wikipedia where English coverage of Murakami is thin (flagged and
      cross-checked per this skill's own non-English rule): the 1999 Kuwabara
      Takeo Prize, won for Yakusokusareta Basho de ("The Place That Was
      Promised"), his second, cult-side volume of Aum Shinrikyo interviews
      that some English editions of Underground later folded in - confirmed
      on both en.wikipedia's Murakami infobox and ja.wikipedia's dedicated
      prize article; and the April 2003 Hakusuisha publication of his own
      Japanese translation of The Catcher in the Rye, the first new Japanese
      version in nearly forty years, displacing Nobuko Hashimoto's 2.5-
      million-copy 1964 standard - confirmed on ja.wikipedia's dedicated book
      article (exact date, publisher, ISBN) and corroborated by Murakami's
      own translator practice already on en.wikipedia and his citing
      Salinger as an influence there. Together these split the 8yr run into
      2yr, 3yr and 1yr, none over the limit.
    - >
      Leads checked and NOT used: Underground's English translation (June
      2000, Birnbaum/Gabriel, Harvill/Vintage) - real and dated, but adds
      nothing the existing 1995 Kobe-sarin lifeEvent doesn't already cover,
      since that entry already carries Underground's genesis and reception;
      an English-translation-date entry for a book already on file would
      have been the promotion-not-aura trap this skill warns against.
      Sputnik Sweetheart, After the Quake and Kafka on the Shore: no award or
      translation milestone specific to any of the three surfaced in reach
      (English or Japanese Wikipedia) beyond ordinary publication and
      review coverage. No personal/family event for this window cleared the
      two-source bar, or was found at all.
    - >
      Organisation/illustration_type assigned against the wing's existing
      rotation rather than by default: 1981 as artifact-spread/manuscript-
      proof (a document beat, following the 1978 floating-object and
      preceding the 1986 beside - keeps the run of MID-intensity cells at
      exactly 4, the cap, not 5), 1999 as medallion/emblem-seal (matching the
      2023 Asturias entry's own award pattern), 2003 as marginalia/isolated-
      object (a minor, side-practice beat, matching the 1996/2011 marginalia
      entries). art_rotation.py --check run after each edit, not just once.

  forStages:
    wing-audit: >
      Both windows event-resonance flagged are closed with real sourced
      material; re-measure confirmed (4yr worst, not the stale "already
      closed" claim from the original press-archaeology pass). No other
      field touched.

- stage: audit-fixes
  wing: haruki-murakami
  summary: >
    Closes wing-audit's one blocking finding, its two missing-startHere/
    sanctuary findings that content can fix, and its two stale prose
    findings. validate.py --slug haruki-murakami: 0 errors (unchanged from
    wing-audit's own run; same 4 pre-existing soft-cap/false-positive
    warnings). i18n_coverage.py: pt-PT 198/213 files fully covered, no
    regression, authors/haruki-murakami.yaml still 31/33 (missing only
    `quote`, the same deliberate omission wing-audit already cleared).

  produced:
    - content/franchises/haruki-murakami/franchise.yaml
    - content/i18n/pt-PT/franchises/haruki-murakami/franchise.yaml
    - content/franchises/haruki-murakami/theme.yaml
    - content/franchises/haruki-murakami/works.yaml
    - content/i18n/pt-PT/franchises/haruki-murakami/works.yaml

  decisions:
    - >
      [blocking] everything-path-miscounts-the-bibliography: the `everything`
      startHere description said "sixteen novels, six story collections, six
      works of nonfiction and one edited anthology". works.yaml's own format
      tally is 16 novels, 6 short-story collections, 1 novella (The Strange
      Library), 5 nonfiction, 1 anthology - the novella was miscounted into
      nonfiction at the scaffold and never corrected. Reworded to name the
      novella explicitly in both franchise.yaml and its pt-PT mirror
      ("dezasseis romances, seis coletaneas de contos, uma novela, cinco
      obras de nao-ficcao e uma antologia editada"). Total of 29 was already
      right and is unchanged.
    - >
      [missing] no-arc-path-in-starthere: trilogy-of-the-rat (Hear the Wind
      Sing, Pinball 1973, A Wild Sheep Chase - one narrator, one friend,
      three linked early novels) was tagged fit.commitment: [taste] only,
      leaving `arc` (SCHEMA.md's "a series/thread" tag) unserved anywhere on
      this wing despite having exactly one path that is a textbook arc.
      Added `arc` alongside the existing `taste`, matching how margaret-
      atwood's the-maddaddam-arc path tags fit.commitment: [arc].
    - >
      [missing] sanctuary-leaks-the-scanner-cannot-see: three pipeline
      references the comment scanner can't reach (it only reads `#`-prefixed
      lines and `note:` blocks, never a `why:` value or an end-of-line
      comment). theme.yaml's art.emblem.why named "spoiler-audit's handoff"
      by stage; reworded to state the underlying fact (wells are named on
      the jacket copy itself, so drawing one discloses nothing new) without
      the attribution. franchise.yaml's globalEvents exclude list had an
      end-of-line comment reading "world-events' own weakest entry"; reworded
      to "a thin global entry on its own". works.yaml's two cover comments
      (south-of-the-border, running) named "this wing's own visual-language
      motif"; reworded to "this wing's own recurring art motif" - same
      meaning, no stage name.
    - >
      [stale] underground-1997-ruling (synopsis half only - the 1997 date
      ruling itself needed no action): the English synopsis garden-paths -
      "interviews with survivors of, and in a companion volume with members
      of, the cult" reads as survivors OF THE CULT. Restructured to
      "survivors of the 20 March 1995 sarin gas attack..., and, in a
      companion volume, with members of the cult behind it", matching the
      pt-PT translation's already-clear structure. No fact changed.
    - >
      [stale] three-pt-pt-wobbles: the-elephant-vanishes' "reunidos por
      primeira vez" is a Spanish-ism, corrected to "pela primeira vez".
      the-wind-up-bird-chronicle's "a mulher que se esvai" now reads "a
      mulher desaparecida", matching franchise.yaml's own essentials path,
      which already renders the same vanished-wife concept that way inside
      this same wing. what-i-talk-about-when-i-talk-about-running's "Um
      memoir" now reads "Um livro de memorias" - no English left in the
      pt-PT prose.

  notTouched:
    - >
      header-image-is-inert and cjk-note-does-not-survive-merge are app-side/
      orchestrator-owned findings, not content fixes - left for the curator
      and the run report respectively, per wing-audit's own routing.
      which-printing-owns-9780385352123, six-penguin-urls-carry-a-borrowed-id
      and pt-edition-id-says-vintage-classics are editions' stale findings,
      none reader-facing and none blocking; left as recorded.
      fetch-cannot-open-this-wing-s-japanese-sources is a tooling defect
      (scripts/fetch.py), not a content fix.

  forStages:
    the-curator: >
      All five wing-audit findings routed to content are closed. Re-run
      validate.py/i18n_coverage.py after merge to confirm no drift; nothing
      else on this wing is pending.
