stage: art-rotation
summary: >
  Reviewed press-archaeology's own grading (both the original 15-lifeEvent
  pass and the audit-fixes follow-up that closed 1979-1985 and 1997-2004)
  against the now-finished visual-language register (the dry masonry well,
  the turntable, the solitary meal, the watching cat, doubled doors,
  the empty dawn road, the lamplit apartment) rather than re-grading blind.
  Confirmed every organisation, illustration_type and images_required;
  changed nothing. The three audit-fixes entries (full-time-writer-1981,
  kuwabara-takeo-prize-1999, catcher-in-the-rye-translation-2003) already
  carry complete grading from that pass and hold up under a fit/pace review:
  1981 as artifact-spread/manuscript-proof (a document beat for "sells the
  bar, starts the real novel"), 1999 as medallion/emblem-seal (matching the
  wing's other honours, asturias-2023), 2003 as marginalia/isolated-object
  (matching the wing's other side-practice beats, ultramarathon-1996 and
  catalunya-fukushima-2011). eras.yaml's two chapter-gate plates
  (detachment/symbolic-still-life, commitment/atmospheric-motif-field) use
  neither establishing-landscape nor any other OPAQUE_TYPES member, and
  issue_sync.py forces --chroma on every chapter-gate regardless of type
  besides, so the plates are keyed twice over rather than by luck.
  art_rotation.py haruki-murakami --check: 0 organisation-rotation and 0
  pacing problems (contour below); its exit code stays 1 only on the
  composition/issue-history axis (0 of 20 assets have an issue yet, the
  expected pre-asset-prompt state), which this stage does not chase per its
  own skill file. validate.py --slug haruki-murakami: 0 errors, the same 2
  pre-existing handoff-length warnings (press-archaeology, eras) untouched.
