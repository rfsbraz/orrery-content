stage: wing-audit
wing: haruki-murakami
summary: >
  First audit of the Haruki Murakami wing (29 works, 2 eras, 3 franchise
  events, 15 lifeEvents, 1 included global, 0 orders, 5 startHere paths, 26
  covers, 55 editions, full pt-PT). Every gate re-run and every headline
  number re-derived from the YAML or the scripts, never read off a prior
  handoff; all of them hold. The four risks the brief named came back clean:
  all four spoiler redactions survive pt-PT intact (Killing Commendatore
  reintroduces neither the invented statuette nor the reveal), the four
  superseded-translation notes each state the supersession plainly, both
  files carry ISBN 9780385352123 for the Wind/Pinball omnibus, and the two
  dark runs event-resonance reopened are genuinely closed with real material
  (4yr worst, re-derived). The real defects are elsewhere and none of the
  thirteen stages could have seen them alone: one false count in
  reader-facing prose that has been wrong since the scaffold and is now
  mirrored in Portuguese, a franchise header image the app reads nowhere,
  and the wing's loudest open question (CJK glyphs) sitting only in a file
  that is deleted before merge.

gates:
  validate: >
    `python3 scripts/validate.py --slug haruki-murakami` - OK, 0 errors, 1456
    works, 71 authors, 11 achievements, all references resolve. 4 warnings:
    three handoff-length soft caps on this wing's own .orrery files
    (eras 1460w, press-archaeology 1159w, editions 1158w against a 700 cap)
    and one false positive on the pt-PT franchise.yaml (see findings). 170
    warnings on other wings suppressed by --slug. Green again after this
    stage's mechanical fixes.
  i18n: >
    `python3 scripts/i18n_coverage.py` - pt-PT 198/213 files fully covered.
    None of this wing's four franchise overlay files appears in the partial
    list. authors/haruki-murakami.yaml is 31/33, missing only `quote` on the
    two epigraph lifeEvents - the same deliberate omission five other author
    files carry. Re-derived independently: 29/29 synopses, 3/3 event
    title+description, 2/2 era title+themes+description, 15/15 lifeEvent
    title+description, the bio, the franchise description and 5/5 startHere
    paths. Zero dangling overlay ids. The overlay is also the newest commit
    on the branch, so no base prose postdates it.
  eventDensity: >
    `python3 scripts/event_density.py` - 19 global events, {med 11, low 6,
    high 2}, high budget 2 used of ~17, no decade over the budget of 3. Every
    decade this wing publishes into (1970s-2020s) carries at least one global
    event. The empty decades are 1580s-1860s, 1880s, 1890s and 1900s, all
    outside this author entirely.
  auraDensity: >
    `python3 scripts/aura_density.py haruki-murakami` - 29 works, 19 aura,
    0.66 per work, span 1979-2026, longest dark run 4 yrs (1982-1985), not
    flagged. Re-derived by hand from the three YAML sources: 15 lifeEvents +
    3 franchise events + 1 included global = 19, and by walking every year in
    the span, three separate 4-year runs (1982-85, 1987-90, 2012-15) tie for
    longest, so 4 is the true worst case, not one window that happens to
    report. Cross-wing, 0.66 is in the top quartile (median ~0.38; only
    anna-sewell, dan-brown, cormac-mccarthy, cervantes, jrr-tolkien, robert-
    jordan and gillian-flynn are denser), so the wing is not thin for its
    size.
  artRotation: >
    `python3 scripts/art_rotation.py --check haruki-murakami` - both gate
    lines pass: "organisation rotation holds across all 18 events: no
    organisation over its cap, no neighbour repeats" and "pacing holds: no
    two loud cells touching or sharing a screenful, no plateau". Contour
    #====.#.=.==...===. The single reported problem is the composition axis
    ("only 0 of 20 assets could be read"), the expected pre-art state, not
    this gate.

reDerived:
  works: >
    29 (16 core, 12 extended, 1 apocrypha). Formats: 16 novel, 6
    short-story-collection, 2 nonfiction, 2 essay-collection, 1 novella, 1
    memoir, 1 anthology. 3 featured (norwegian-wood, the-wind-up-bird-
    chronicle, 1q84), exactly at the cap.
  eraMembership: >
    Parsed both `period` strings and walked every work's `published` year
    against them: detachment 1979-1993 holds 9, commitment 1994-present holds
    20, 29 of 29 inside exactly one span, zero orphans, zero overlap, no
    interior gap. eras.yaml's own header claim re-derives exactly. Both
    boundaries are sourced and the contested edge (Yoshida 1997 vs the usual
    1994) is kept rather than smoothed - provenance: author on both, the
    highest rung, and the file earns it.
  editions: >
    55 entries over 27 of 29 works (31 en, 24 pt-PT; 23 of 29 works carry a
    pt-PT edition). All 55 ISBN-13s pass the check digit under this stage's
    own routine. Exactly two ISBNs repeat and both are the documented omnibus
    pairs (9780385352123 across hear-the-wind-sing/pinball-1973 en;
    9789897415029 across the same two pt-PT). No dangling workId. The four
    ISBN-10 to ISBN-13 conversions recorded in notes (Kodansha 1985/1987,
    Kodansha International 1991, Kodansha 1989, Civilizacao 2004) were each
    recomputed by hand and all four are right.
  supersededEditions: >
    All four re-read against their primary entries. Each superseded note
    names the supersession outright and none contradicts its primary: the
    1987 and 1985 Kodansha English Library Birnbaum printings say "Superseded,
    not currently in print... Ted Goossen's 2015 Wind/Pinball translation is
    the current, generally available English edition"; the 1989 Kodansha
    Norwegian Wood says "superseded outside Japan only by Jay Rubin's 2000
    translation" and the 2000 Rubin entry independently carries "the
    authorized version for publication outside Japan"; the 1991 Kodansha
    International Hard-Boiled Wonderland says "Superseded by Jay Rubin's
    December 2024 retranslation" and explicitly distinguishes itself from the
    other three ("this WAS the general-release English text throughout").
    A fifth, pt-PT case (Civilizacao 2004, trad. Alberto Gomes) is recorded
    the same way and agrees with the current Casa das Letras entry above it.
  omnibusIsbn: >
    Checked by reading both files directly, not by trusting either report.
    editions.yaml carries 9780385352123 on both knopf-2015-en entries;
    works.yaml's cover comments carry 9780385352123 on both novels. They
    match. See findings for the one thing that does not (which printing owns
    the ISBN).
  spoilerRedactions: >
    All four bounded synopses read side by side, English against pt-PT.
    killing-commendatore: "encontra no sotao um quadro do homem mais velho
    que nunca ninguem viu. Desenterra-lo desencadeia uma sucessao de
    acontecimentos que so consegue encerrar descendo a um outro mundo" - no
    statuette (spoiler-audit's factual correction holds), no bell, and
    nothing about what the object releases or the painting records.
    hard-boiled-wonderland states both strands and no relation between them.
    pinball-1973 ends at the search with no outcome. 1q84 keeps the bond at
    "as suas duas historias vao-se aproximando", never "colegas de infancia".
    Nothing was restored from a fuller Portuguese blurb. translation's claim
    is accurate.
  darkRunClosure: >
    Commit 6943c9d added THREE lifeEvents, not four (full-time-writer-1981,
    kuwabara-takeo-prize-1999, catcher-in-the-rye-translation-2003). Judged
    against the aura standard on their own reading, independently of the
    number they close: 1981 is med and load-bearing (selling Peter Cat and
    starting the novel he calls his real beginning explains the shelf);
    1999 is low but not trivia (it is the wing's only dated fact about the
    second Aum volume that Underground's own works.yaml note depends on);
    2003 is low and earns its slot as the wing's only dated evidence of the
    translator career the bio asserts. None reads as padding. The Gunzo and
    Noma prizes were verified and folded into prose rather than given slots,
    which is the right call.
  globalEvents: >
    19 events in global.yaml, 13 inside his lifetime, 13 of 13 ruled (1
    include, 12 exclude), and every one of the 13 ids resolves - the
    validator checks neither, so this was done by hand. The include
    (covid-19-pandemic-2020) rests on Murakami naming the connection himself
    in a dated Guardian interview, not on inference. The pre-1949 entries
    are left unruled as a class, which is the settled precedent.
  covers: >
    All 26 cover URLs plus the portrait and header fetched: 28/28 return a
    real image (36KB-108KB for covers), zero placeholders. Every one is an
    OpenLibrary `/b/id/` URL, so the `?default=false` placeholder trap does
    not apply to the recorded form. Seven covers, the portrait and the header
    were downloaded and LOOKED AT at full size: the shared Wind/Pinball
    jacket (genuine Chip Kidd "WIND / PINBALL - TWO NOVELS", English, clean),
    norwegian-wood (English illustrated Vintage, no film tie-in, no crease),
    underground (English, subway map over a body), killing-commendatore
    (English, yellow eye on blue linen - shows neither the painting's figure
    nor an opened pit), running (English, lone runner), colorless (English,
    four colour bars), murakami-t (English, sewn T-shirt label). No
    watermark, no retailer mark, no library sticker, no wrong language on any
    of them. Portrait is an unobstructed 1027x1217 headshot with nobody else
    in frame; the header is the Jazz Masako doorway exactly as captioned.
  auraGrading: "19 entries: 4 high, 10 med, 5 low. Only five low - sparse and load-bearing, not a timeline made of texture."
  theme: >
    displayFace `spectral` and signature `thread` both re-checked against the
    app's own registries (lib/theme.ts DISPLAY_FACES, SIGNATURES), not just
    against SCHEMA. All five palette keys present. Contrast re-computed:
    ink/bg 14.75:1, ink/surface 13.33:1, muted/bg 5.70:1, muted/surface
    5.15:1, accent/bg 6.28:1 - the floor holds everywhere including
    muted-on-surface, which is where it usually fails.
  sources: >
    All 96 `sources:` URLs across the wing swept: 90 return 200, one returns
    202 (japannews.yomiuri, a bot challenge, alive) and five return 308. See
    findings - the five redirect correctly but by ISBN, not by their own path.

mechanicalFixes:
  - >
    works.yaml header: the canonTier convention said "the 6 short-story
    collections... and the 6 nonfiction books" when the file holds 6
    collections, 1 novella and 5 nonfiction. Corrected to name the novella.
  - >
    works.yaml section headers: "Short story collections (6)" holds 7 entries
    (the sixth is the novella) and "Nonfiction (6)" holds 5. Corrected to
    "Short story collections (6), plus the one novella" and "Nonfiction (5)".
    The two errors have cancelled since the scaffold, which is why 15+6+5+1
    and 16+6+5+1 both came out right and nobody looked.
  - >
    works.yaml pinball-1973 cover comment: dropped "Flagged for editions:
    both novels' editions.yaml entries should point at..." - coordination
    addressed at another stage, and stale besides, since editions.yaml
    already does. Restated as the fact ("Both novels' editions.yaml entries
    cite that one omnibus, ISBN 9780385352123").

blocking:
  - id: everything-path-miscounts-the-bibliography
    owner: reading-orders (base prose), translation (pt-PT mirror)
    finding: >
      franchise.yaml's `everything` startHere description tells a reader the
      wing holds "sixteen novels, six story collections, six works of
      nonfiction and one edited anthology". Re-derived from works.yaml by
      `format`: 16 novels, 6 short-story collections, ONE NOVELLA (The
      Strange Library), 5 nonfiction and 1 anthology. The total, 29, is
      right; the breakdown is not, and it is rendered prose on the wizard's
      most-used path. The pt-PT overlay mirrors it exactly ("seis coletaneas
      de contos, seis obras de nao-ficcao"), so both locales are wrong. The
      error dates to the original scaffold, where "Nonfiction (6)" was
      written over five entries and the novella was filed under collections
      and counted nowhere - an inflation and an omission that cancelled, so
      every later stage's arithmetic checked out. Fix the base and mirror it.

missing:
  - id: header-image-is-inert
    owner: the curator (app-side); NOT visual-metadata's to fix in content
    finding: >
      `franchise.images.header` is modelled in the app's
      `lib/content/types.ts` (both on Author and Franchise) and read by
      nothing. Grepped app/, components/ and lib/ for every form of
      `images.header` and `headerCredit`: the only hits are the type
      declarations themselves. `app/[locale]/f/[slug]/page.tsx` says so in
      its own comment - "Desktop keeps the typographic header". So this
      stage's licensed, rights-checked, credited Jazz Masako photograph -
      chosen over Golden Gai on a real rights judgement - renders nowhere.
      This is the `coverFor()` failure again, and it is catalogue-wide: 22 of
      32 wings carry an `images.header`. Either build the render or drop the
      field; leaving it is coverage that looks real and is not.
  - id: cjk-note-does-not-survive-merge
    owner: THE ORCHESTRATOR must carry this into the PR body by hand
    finding: >
      `.orrery/` does not exist on origin/main - handoffs are deleted before
      merge, verified by listing the tree. visual-language's precise finding
      therefore dies with its handoff. The fact itself was verified here
      directly rather than taken on trust: `app/[locale]/layout.tsx` declares
      six font families (Geist, Geist_Mono, Fraunces, Spectral,
      Source_Serif_4, Instrument_Serif) and every one carries
      `subsets: ["latin"]`. This wing's chosen face is `spectral`. So no
      face in the app can render 風の歌を聴け and every native title on the
      wing will fall back to the visitor's system font. What survives to main
      is weaker: franchise.yaml's and works.yaml's headers say only that
      glyph support is "untested, not confirmed working", which is now
      out of date - it has been tested, in the app source, and it fails.
      Two actions: put the finding in the run report, and tighten the two
      content comments from "unconfirmed" to the established fact.
  - id: no-arc-path-in-starthere
    owner: reading-orders
    finding: >
      All five paths tag `commitment` as `taste` except `everything`
      (`complete`). Nothing serves `arc` ("a series/thread"), and the wing
      has exactly one: trilogy-of-the-rat, three linked novels with a shared
      narrator, currently tagged `taste`. A reader who answers "a series or
      thread" gets a fallback match when an exact one exists. Adding `arc`
      to that path's `fit.commitment` costs nothing and closes the matrix's
      one real hole.
  - id: sanctuary-leaks-the-scanner-cannot-see
    owner: visual-language, event-resonance, visual-metadata (one each)
    finding: >
      Three pipeline references the validator's comment scan does not reach,
      found by hand-grepping the wing in both locales. (1) theme.yaml line 49,
      inside `art.emblem.why`: "spoiler-audit's handoff clears wells and dry
      shafts by name as jacket-backed and safe to draw" - names a stage and
      a file that will not exist after merge, and the scanner only reads `#`
      comments and `note:` blocks, never a `why:` value. Owner
      visual-language; the substance (wells are jacket-backed) should stay,
      the attribution should go. (2) franchise.yaml line 69, an END-OF-LINE
      comment: "world-events' own weakest entry". The scanner's regex does
      contain `\bworld-events\b`, but it skips trailing comments entirely -
      it only tests a line that STARTS with `#`. Owner event-resonance.
      (3) works.yaml lines 310 and 867, "this wing's own visual-language
      motif" - borderline, naming the theme.art block by its stage's name;
      owner visual-metadata, low. The pt-PT files were grepped separately for
      Portuguese and mixed-language narration (the Atwood trap) and are
      clean.
  - id: fetch-cannot-open-this-wing-s-japanese-sources
    owner: the curator (tooling)
    finding: >
      `python3 scripts/fetch.py "https://ja.wikipedia.org/wiki/桑原武夫学芸賞"`
      fails with "UnicodeEncodeError: 'ascii' codec can't encode characters"
      and returns 0 bytes. This wing cites three such URLs (夢で会いましょう,
      桑原武夫学芸賞, キャッチャー・イン・ザ・ライ) and they are the sole or
      primary support for the Let's Meet in a Dream entry and for two of the
      three lifeEvents that close the dark runs. Confirmed by hand that all
      three return 200 when percent-encoded, so the citations are live and
      this is a tool defect, not a sourcing one - but the pipeline's own
      re-verification path cannot open the evidence this wing rests on.
      One-line fix: percent-encode the path (and IDNA the host) before the
      request. Other wings (jose-saramago, jose-luis-peixoto, joao-tordo)
      cite accented URLs and hit the same wall.

stale:
  - id: which-printing-owns-9780385352123
    owner: editions
    finding: >
      The two files agree on the ISBN and disagree on the book. works.yaml's
      cover comment says "Vintage, 2016 US paperback of Ted Goossen's 2015
      Knopf translation, ISBN 9780385352123"; editions.yaml records Alfred A.
      Knopf, 2015, hardcover for the same number. The conflict is in
      OpenLibrary itself and both stages reported their source faithfully:
      OL60103157M (the coverSource) returns publisher Vintage, publish_date
      2016, physical_format Paperback, isbn_13 9780385352123, while
      /isbn/9780385352123.json resolves to a different record entirely
      (OL27185733M). The jacket art is the same either way, so nothing
      reaches a reader wrong. Cleanest fix: let editions.yaml own the
      printing identity and let the works comment say only that it is the
      Wind/Pinball omnibus jacket.
  - id: six-penguin-urls-carry-a-borrowed-id
    owner: editions
    finding: >
      Six penguin.co.uk citations all sit under `/books/55817/` for six
      different books, and all six return 308. Followed each: every one lands
      on the correct book, because penguin resolves by the ISBN tail and
      ignores the id. Live today; six citations break together the day it
      stops. The resolved ids are a-wild-sheep-chase 357548, kafka-on-the-
      shore 357849, killing-commendatore 436095, men-without-women 433807,
      sputnik-sweetheart 357525, the-wind-up-bird-chronicle 439564.
  - id: pt-edition-id-says-vintage-classics
    owner: editions
    finding: >
      `haruki-murakami/norwegian-wood/vintage-classics-2023-pt` is a Casa das
      Letras pt-PT edition. Edition ids are not referenced by user data, so
      this is a rename, not a migration.
  - id: dateranges-that-never-render
    owner: press-archaeology (cleanup only)
    finding: >
      The app reads `dateRange` in exactly one place,
      `components/river/passage.tsx`; `eventYear()` prefers `date` for
      sorting. Five entries on this wing carry one and only
      princeton-tufts-1991 is a `passage`. haruki-murakami-kobe-sarin-1995
      carries `dateRange: "1995"`, which would say nothing even where it did
      render. Harmless, but it is data that looks like it does something.
  - id: underground-1997-ruling
    owner: completeness-auditor
    finding: >
      completeness-auditor left `published: 1997` open. Ruling: KEEP 1997 and
      close the question. Andaguraundo (Kodansha, 20 March 1997) is a
      complete standalone Japanese book under exactly this title, and the
      English edition translates it and appends abridged material from a
      second one - materially different from The Elephant Vanishes and Blind
      Willow, where no book of that selection existed in any language and the
      English compilation genuinely was its first existence. What does need
      fixing is the English synopsis, which garden-paths: "interviews with
      survivors of, and in a companion volume with members of, the cult
      behind the 20 March 1995 sarin gas attack" parses as survivors OF THE
      CULT. The pt-PT overlay already reads correctly ("entrevistas com
      sobreviventes, e, num volume complementar, com membros da seita
      responsavel pelo ataque"), so here the base is the weaker of the two.
  - id: three-pt-pt-wobbles
    owner: translation
    finding: >
      the-elephant-vanishes reads "reunidos POR primeira vez" - a Spanish-ism;
      European Portuguese is "pela primeira vez".
      the-wind-up-bird-chronicle renders "his vanished wife" as "a mulher que
      se esvai" ("the woman who is fading away"), where franchise.yaml's own
      essentials path renders the same phrase "a mulher desaparecida" - two
      renderings of one string inside one wing, and the synopsis has the
      looser one. what-i-talk-about opens "Um memoir sobre corridas de fundo",
      leaving "memoir" in English where "livro de memorias" is the register.
      Everything else read as native pt-PT throughout.
  - id: three-handoffs-over-the-soft-cap
    owner: no action needed
    finding: >
      eras 1460w, press-archaeology 1159w, editions 1158w against a 700 cap,
      plus this file at 3630w. Pre-existing, already warned, and the files
      are deleted at merge, so the only cost is the context every later stage
      paid to read them - and no stage runs after this one.

pipelineFindings:
  - >
    The comment scanner in validate.py never tests an END-OF-LINE comment. It
    skips any line that does not start with `#` unless it is inside a `note:`
    block, so `- financial-crisis-2008  # world-events' own weakest entry`
    is invisible to a regex that explicitly contains `world-events`.
  - >
    `\bTODO\b` under re.IGNORECASE matches the ordinary Portuguese word
    "todo". Four wings carry the resulting false positive (stephen-king,
    robert-jordan, joao-tordo and this one) and every one of the four is a
    reader-facing Portuguese sentence. A check nobody can trust is a check
    nobody reads: require uppercase, or exclude pt-PT overlay prose.
  - >
    SCHEMA.md is behind both the validator and the app on theme.yaml.
    validate.py REQUIRES `art.emblem` with `object` and `why`; SCHEMA's
    theme.art block does not mention `emblem` at all. The app's DISPLAY_FACES
    holds four faces (SCHEMA lists three - `instrument-serif` is missing) and
    SignatureKind holds five (SCHEMA lists four - `filament` is missing).

notApplicableNotAbsent:
  - "0 achievements, wing or shared. Legitimate. The two eras are unusually well-founded and would carry an `era_reader` badge (9 works / 20 works) if the curator ever wants one, but a wing whose only badge would be a count is better with none."
  - "0 orders.yaml entries. orders.yaml records three candidates researched and rejected with the argument for each; the reasoning holds - a curated order over three already-adjacent books restates the default."
  - "0 spoilerAfter boundaries on 19 aura entries. Not an audit that did not happen: spoiler-audit read all 29 synopses, 3 events, 15 lifeEvents, 2 eras and 5 paths and protected by prose redaction instead. Re-checked - no event or era states a plot outcome."
  - "3 works with no cover and 2 with no edition of any kind. The Tale of KAHO (July 2026) and Let's Meet in a Dream have no translation in any market; Birthday Stories has a real English edition whose only OpenLibrary scan is 95x135px. All three are commented in place."
  - "6 works with no pt-PT edition, after a 91-record sweep of the whole BNP catalogue. A market fact."
  - "`pseudonyms: []`. He has none. An author with none is not missing anything."
  - "The author overlay's 31/33 (missing: quote). Both epigraph quotes are Murakami's own verbatim words with no published Portuguese rendering; five other author files omit theirs the same way."
  - "Era titles staying `Detachment`/`Commitment` in pt-PT. They are Murakami's own English loanwords, katakana in the Japanese; translating them would coin something he did not say."
  - "26/29 covers is 26 of the 27 English-published works, not 90% of a 100% target."

curatorsCall:
  - >
    Native Japanese script vs Hepburn romanization for `title`. The wing's
    own loudest open question since franchise-research, restated by
    completeness-auditor and visual-language and still open thirteen stages
    later. It is now decidable rather than speculative: the app has no CJK
    glyphs in any face, so the choice is between correct titles rendered in
    the visitor's system font and romanized titles rendered in the wing's own
    face. A one-file change either way; ids do not move.
  - >
    Whether `images.header` gets built in the app or dropped from content
    across all 22 wings that carry one.
  - >
    spoiler-audit's own softest call, dropping "once childhood classmates"
    from 1Q84. Agreed on review: the publisher withholds it deliberately and
    losing it costs the synopsis nothing.
  - >
    reading-orders' softest call, leaving Novelist as a Vocation and What I
    Talk About When I Talk About Running out of beyond-the-novels. Agreed:
    each of the five shipped titles carries a hard external marker, and the
    path's note names everything it leaves out rather than pretending to be
    complete.

openQuestions:
  - >
    Not re-checked here and worth a later pass: whether Wind-Up Bird
    Chronicle, A Wild Sheep Chase and 1Q84 have since joined the "Murakami
    Collectible Classics" series Norwegian Wood and Kafka on the Shore
    already belong to (editions' own open question), and which ISBN maps to
    which physical volume in the two two-ISBN cases (Killing Commendatore
    pt-PT 1st ed., Norwegian Wood's Kodansha two-volume set).
