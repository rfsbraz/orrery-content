stage: completeness-auditor
summary: >
  Cross-checked all 27 scaffolded works against Wikipedia (per-work
  articles, not just the navbox), ISFDB (confirmed no author entry), and
  OpenLibrary (still unreachable). All 27 dates hold, including a caught
  trap: Novelist as a Vocation's Wikipedia short description says "2022
  book" but its own infobox/prose say 2015 - the scaffolded 2015 was right.
  Both English-first exceptions (Elephant Vanishes, Blind Willow) and the
  Norwegian Wood Birnbaum/Kodansha claim re-verified independently and hold.

  Added two real gaps: The Tale of KAHO (2026, Shinchosha, confirmed on
  AP/Mainichi and the publisher's site) - Murakami's actual first novel
  since 2023, missed because it is a month old; and Let's Meet in a Dream
  (1981, co-author w/ Shigesato Itoi), which franchise-research found but
  left out as single-sourced - now corroborated (Kodansha catalogue page,
  real ISBN) and added as extended/co-author, not apocrypha, per the
  absolutely-on-music/stemmer-fra-balkan precedent. It inserts into the
  chronological order between Pinball, 1973 (1980) and A Wild Sheep Chase
  (1982); The Tale of KAHO appends after everything else. Zero removals,
  zero other date changes. canonTier spot-check: no mistiering found.

  editions.yaml view: no schema change needed, and now precedented, not just
  plausible - chuck-palahniuk/fight-club/noticias-1999-pt already records a
  superseded-but-different translation via a plain note, distinct from the
  catalogue's normal same-text "most recent in-print" default.

  Two edition-level (not work-level) items found and deliberately not added
  as works: "Super-Frog Saves Tokyo" (2025 illustrated gift edition of an
  existing after-the-quake story) and "Pan-ya o Osou" (2013, Kat Menschik-
  illustrated combination of "The Second Bakery Attack" with an earlier
  story) - both flagged for editions below.

  validate.py --slug haruki-murakami: 0 errors, 1 expected warning
  (no theme.art, unchanged). 1454 -> 1456 works catalogue-wide.

produced:
  newWorkIds:
    - haruki-murakami/the-tale-of-kaho
    - haruki-murakami/lets-meet-in-a-dream
  changedProse:
    - "haruki-murakami/works.yaml: header count comments (novels, short-story collections) and the apocrypha-section note, resolving the Let's Meet in a Dream flag it was carrying"
    - "haruki-murakami.yaml: bio, fifteen novels -> sixteen"
  changedDates: []
  reordersCaused:
    - "lets-meet-in-a-dream (1981) inserts between pinball-1973 (1980) and a-wild-sheep-chase (1982) in the derived chronological order; no curated order exists yet to also update."
    - "the-tale-of-kaho (2026) appends after the-city-and-its-uncertain-walls; nothing else moves."

forStages:
  press-archaeology: >
    Birth (12 Jan 1949) and the April 1978 Yakult Swallows game remain the
    two lifeEvent anchors, still blocked on theme.art landing first
    (validate.py ~1010-1048). Two new candidates: The Tale of KAHO's 3 July
    2026 release, a dateable, well-covered public event (midnight queues,
    first sole-female-protagonist novel); and a recent-honours sweep
    (Murakami is alive and active), not attempted here.
  eras: >
    No eras.yaml exists. Bibliography now spans 1979-2026 (47 years). Two
    visible seams, not decided here: the 1994 translator handoff (Birnbaum's
    last novel is also his last "realist early" one), and the long-fiction
    era Wind-Up Bird Chronicle (1994) through 1Q84 (2009) already described
    in the file's own prose. Whether The Tale of KAHO opens a new era is
    left alone here.
  editions: >
    Confirms the three-superseded-translation plan (see summary). Two new
    edition-level finds: "Super-Frog Saves Tokyo" (Harvill Secker, 2 Oct
    2025, illustrated reissue of a story already in after-the-quake) and
    "Pan-ya o Osou" (パン屋を襲う, Shinchosha, 2013, illustrated by Kat
    Menschik, combines "The Second Bakery Attack" with an earlier story,
    first paired in German in 2012 with the same illustrator) - worth
    checking for an English Menschik edition, on The Strange Library's own
    model. Let's Meet in a Dream has no English edition, confirmed absent.

openQuestions:
  - >
    Underground's published: 1997 dates the first of two Japanese source
    volumes; the English edition abridges both, and no Japanese edition of
    that combination itself exists - a different modelling choice from
    Elephant Vanishes/Blind Willow, where no prior assembly existed in any
    language. Defensible either way since Andaguraundo was already a
    complete standalone book, unlike scattered short stories; left
    scaffolded, flagging the tension rather than resolving it.
  - "Native-script title vs. Hepburn romanization render-testing (franchise-research's own loudest open question) is unresolved - restated so it isn't lost."
  - "OpenLibrary unreachable again this pass. ISFDB confirmed directly: its author-search returns \"Author not found: Haruki\"."
