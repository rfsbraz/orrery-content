stage: wing-audit
summary: >
  Final critic pass on the Harlan Coben wing. Re-derived every baseline number
  myself; opened the artefacts (fetched and eyeballed 3 covers, verified the
  9/11 claim on the web, read both pt-PT spoiler fields, grepped the app for
  the fields this wing leans on). The build is clean and honest, not padded.
  One editorial grade to route, three stale content comments fixed in place,
  no blocking defects. validate.py --slug harlan-coben GREEN after fixes.

baselineReDerived:
  validate: "GREEN - 715 works, all references resolve. Only warnings are 5 handoff word-count soft-caps (.orrery/, deleted before merge)."
  i18n: "harlan-coben fully covered in pt-PT (not in the PARTIAL list); the 8 partials are all pre-existing on other wings."
  aura: "44 works, 16 entries, 0.36/work, span 1990-2026, longest dark run 4yr (1991-1994). No 5+yr run. Mid-pack proportion vs peers (Connelly 0.40, Nesbo 0.37); NOT the largest wing, so no thin-aura-on-big-wing problem."
  isbns: "71 editions, 0 suspect (lookup.py --verify-isbns)."
  covers: "42/44 resolve; 2 bare are documented not-applicable (Plot Twist forthcoming, Super D never sold separately)."
  art: "art:yes (theme.art complete). 0/16 sketches generated - the normal queued downstream state, not a content gap."

checkedClean:
  - "3 covers fetched and LOOKED AT (Deal Breaker, Think Twice, Malice Domestic 7): right book, no watermark, no omnibus/audio/title-page. Byte sizes 12-52KB, none the ~800B blank placeholder despite /b/isbn/ URLs lacking ?default=false."
  - "visual-metadata is an honest artefact: it documents 5 covers rejected on sight (library-barcode burn-ins on Hold Tight + Fool Me Once, an audiobook sleeve, a title-page scan, a blank endpaper) and replaced with clean /b/id/ scans."
  - "theme.yaml: displayFace sourceSerif and signature beam BOTH resolve in the app (lib/theme.ts DISPLAY_FACES + SIGNATURES). Palette distinct from neighbours - teal-grey bg ~150deg hue vs Tordo blue ~210deg; yellow accent #d2c83a vs Butcher amber #d98a3d / Sanderson golds. muted-on-surface and ink-on-bg both pass AA (recomputed)."
  - "images.cover IS consumed by the app (lib/content/editions.ts:68, work-card.tsx) - not the King inert-field bug."
  - "9/11 include is real: Long Lost (2009) plots through terrorists/Mossad/a black-ops prison; Ali Wilder is a 9/11 widow (web-confirmed). sept-11-2001 is reach:global, impact:med, franchise-agnostic."
  - "Spoiler seal intact EN + pt-PT: the Mickey/Live Wire cross-reveal (Brad's fate) is never stated; both reworded prose fields name only the family/timeframe overlap. Grepped pt-PT for mistério/resolv* - absent. All 15 spoilerAfter are on gated events/lifeEvents and null; zero ungated decoration."
  - "pt-PT register is European (agente desportivo, basquetebol, Caraibas, brochura), not pt-BR. 44-work count confirmed by hand. 4 apocrypha real and sourced (Malice Domestic 7, Death Do Us Part, Best American Mystery Stories 2011, Rise and Fall of Super D). Gone Before Goodbye handled as co-author + withAuthorIds[reese-witherspoon], cover credits both."
  - "eras:[] is sound - concurrent series (Myron 1995-2024 interleaved with standalones 1990-2025), no received periodisation, author names no phases. Complete, not 0%."

findings:
  curatorCall:
    - id: netflix-2018-impact-grade
      what: "coben-netflix-overall-deal-2018 is scope:industry, impact:high - the wing's sole non-biographical high and the rupture the eras:[] argument leans on."
      tension: >
        CURATION section 6 says 'Industry context - medium impact at most,
        never anchors', and 'high = recolors the text' vs 'med = explains the
        shelf'. The event's own description explains the shelf (later books
        'arrive with a Netflix adaptation already attached'), which is the MED
        test. By the letter of the standard this should be med.
      counter: >
        The stages consistently treat it as a genuine Coben-specific rupture,
        not generic industry weather - it reshaped how every later book is
        written and received. Defensible as high with an explicit rationale.
      owner: press-archaeology / curator
      severity: medium
      action: "Either regrade to med per section 6, or keep high and record why this deal transcends ordinary industry context. Father's-death high is unambiguously earned; this is the only arguable one."
    - id: deal-breaker-pt-title
      what: "Two rival out-of-print pt-PT translations of Deal Breaker; translation used the English title throughout and documented it. Curator may pick one to surface, or keep neither."
      owner: curator / translation
      severity: low

  staleFixedInPlace:
    - "franchise.yaml capabilities comment claimed 'nothing activates yet: no events.yaml/startHere/editions.yaml' - all three now exist, so river/companion/wizard/editions all auto-activate. Rewrote to match reality."
    - "events.yaml header said global events 'none claimed here yet - unresearched' - sept-11-2001 IS now claimed. Rewrote to name it."
    - "works.yaml standalone section header still read '19' after completeness fixed the top comment to 18; the section holds 18. Corrected to 18."
    - "franchise.yaml line 2 '(curator ruling, 2026-07-21)' tripped the validator's pipeline-narration warning; reworded to '(the standing rule for every wing)'. Cleared the warning; validate now shows only handoff-length soft-caps."

notApplicableNotAbsent:
  - "eras:[] - concurrent-series career with no received periodisation. Correct state."
  - "achievements absent - no achievements.yaml. Generic 'read all Myron' badges would be decoration; no era means no era_reader. Correct."
  - "16 works with no pt-PT edition; 2 works with no cover - checked absent / forthcoming, documented in-file."
  - "0 generated sketches - theme.art is set (art:yes); asset generation is the queued next stage, not a gap in this wing."

couldNotVerifyFromHere:
  - "Live rendered output (no dev server / render-check.mjs not run). Content verified via scripts + fetches; layout is a curator-with-browser check."
  - "Deep trade-press/anthology archives (PW early-90s) for further uncollected short fiction - press-archaeology named this unreachable. Low risk given the completeness sweep (ISFDB, essays page, Lazarus TV excluded)."

mostImportantCatch: >
  netflix-2018 is graded impact:high while being scope:industry, which
  CURATION section 6 caps at med - the one place the aura grading sits against
  the standard. Not a false fact, a judgement to ratify or regrade.

nothingElseWrongCredible: >
  Yes. The clean numbers are earned, not padded: the visual pass documents 5
  covers it rejected, the aura pass recomputed the dark run independently of
  the tool's fallback, translation documents the Deal Breaker ambiguity rather
  than resolving it silently. My own spot-checks (covers, 9/11, pt-PT register,
  app field reads) corroborate. The only substantive open item is the Netflix
  grade above.

gate: "python scripts/validate.py --slug harlan-coben GREEN (715 works, all refs resolve). Only warnings are 5 handoff soft-caps, deleted before merge."
