stage: eras
summary: >
  Ruled eras: [] with a positive argument. Wrote
  content/franchises/harlan-coben/eras.yaml as a reasoned comment block
  terminated by [] (the same form Butcher, Connelly and Flynn use; a valid empty
  list, not an empty file). validate.py --slug harlan-coben green, 3 pre-existing
  warnings unchanged, 0 new, no orphan warnings (an empty era list orphans
  nothing). No franchise.yaml or theme.yaml change needed.
verdict: >
  No received periodisation exists. This is the concurrent-series case the brief
  named, and it resolves the same way Michael Connelly and Jim Butcher did.
ladder:
  rung1_author: >
    Empty. Coben names no creative periods. He talks about "taking a break from
    Myron" for Tell No One and calls it his breakout, but that is a book, not a
    named phase; his own site lists novels in one flat chronological run.
  rung2_critical: >
    Empty for periodisation. No obituary (living, b. 1962). The two fullest
    career essays reached organise by character and chronology and name no dated
    periods: NoirFest ("Tell Everyone. The work and worlds of Harlan Coben") uses
    narrative section headers ("Begin at the Beginning", "Myron and More",
    "Beyond Bolitar") that carry no years - section headings are not a
    periodisation (trap registry) - and Martin Cid Magazine names only one undated
    "most recent phase" of adaptation/collaboration expansion.
  rung3_fandom: >
    Empty. No settled fan period names surfaced; reading-order aggregator sites
    list by series and publication only.
  rung4_publishing: >
    Two candidate boundaries exist and both fail the fit test, so both stay aura
    events rather than era plates. (a) Tell No One (2001): a real reception/tone
    pivot, but Myron continues past it (Promise Me 2006 -> Think Twice 2024), so a
    "standalone era from 2001" would render full-bleed over 5 concurrent Myron
    novels it does not describe. NoirFest states it directly: new Myron
    "instalments interspersing the standalone novels" "throughout these decades".
    (b) Netflix overall deal (2018, the wing's highest-impact event): a fact about
    adaptation, not a named period of the books; no source periodises the
    bibliography at 2018, and output after it stays braided (Wilde, Win, the
    Witherspoon co-authorship, the memoir).
concurrencyFact: >
  The load-bearing argument is the record, not the sourcing. Myron 1995-2024,
  standalones 1990-2025, fully interleaved, plus Mickey Bolitar (2011-2014),
  Wilde (2020-2022), Win (2021), Sami Kierce (2016-2025) launched across the span.
  There is no early/late sequence to cut.
boundariesUnsure: >
  None. No boundary was drawn, so none is at risk. The only judgement calls were
  whether the 2001 and 2018 ruptures rise to era boundaries; both were declined
  for the concurrency reason above, and both remain recorded as aura events
  (coben-tell-no-one-standalone-2001, coben-netflix-overall-deal-2018).
languages: >
  Searched in English, Coben's working language. An anglophone US author, so no
  foreign-language corpus applies.
sourcesRefusedOrThin: >
  No source refused. The two career essays (noirfest.com, martincid.com) are
  enthusiast/culture-webzine pieces, not top-tier criticism; they are cited as
  evidence that even dedicated career surveys name no dated periodisation, not as
  authorities coining one. If a named periodisation is ever wanted, the place to
  find it would be a print critical retrospective or an eventual obituary, neither
  of which exists yet.
forStages:
  reading-orders: >
    No eras to key entry paths against; the Myron/standalone concurrency documented
    here is the same fact that shapes any startHere reasoning.
  visual-language: >
    No era plates to illustrate; theme.art still owed, unaffected by this stage.
  translation: >
    eras.yaml is [] with no prose entries, so no pt-PT eras overlay is needed or
    should be created.
