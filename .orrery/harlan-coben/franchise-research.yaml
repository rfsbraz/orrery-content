stage: franchise-research
summary: >
  New wing scaffolded from scratch. 40 works (35 core, 5 extended), 2 global
  author entities, a thin franchise.yaml, no theme.yaml yet. validate.py is
  green (0 errors).
produced:
  authors:
    - harlan-coben (bio + identity only, lifeEvents left empty for a press pass)
    - reese-witherspoon (minimal collaborator stub, for withAuthorIds only)
  franchise: harlan-coben/franchise.yaml (identity, description, authorIds,
    themePreset only; no globalEvents, no startHere - owned by
    event-resonance and reading-orders)
  works: 40 total - 12 Myron Bolitar, 3 Mickey Bolitar, 2 Sami Kierce, 2
    Wilde, 1 Windsor Horne Lockwood III ("Win"), 18 standalones, 1 children's
    picture book, 1 forthcoming memoir (Plot Twist, 2026-09-08)
  theme: not written - see openQuestions
identityVerification: >
  Issue #61 flagged that a prior pass acted on a confidently-stated lead
  about the wrong person. Verified first: Wikipedia's infobox and
  harlancoben.com's bio agree exactly on birth date (1962-01-04), birthplace
  (Newark, NJ), Livingston upbringing, Amherst College, and Myron Bolitar as
  the breakout work. No ambiguity found.
bibliographyJudgement:
  - "Two independent primary sources (Wikipedia's raw 'Published works'
     table, fetched directly rather than AI-summarised, and harlancoben.com's
     own novel list) agree on all 39 fiction titles and years. One trap
     caught: an AI-summarised fetch of the same article scrambled Home
     (2016) and Think Twice (2024) against each other; the raw table and the
     awards-nomination years both confirm 2016/2024."
  - "Sami Kierce and Wilde are catalogued as subseries beyond the brief's
     Myron/Mickey - both are Wikipedia's/Goodreads' own groupings: the
     Hollywood Reporter bills Nobody's Fool as Fool Me Once's sequel; Wilde
     and The Match share a protagonist, corroborated independently."
  - "canonTier: 18 standalones are core (they dominate the shelf); Mickey
     Bolitar is extended (YA-imprint spin-off, not the adult spine); the
     picture book and the memoir are extended as genuinely his but off-genre."
  - "Gone Before Goodbye is authorRole: co-author with withAuthorIds:
     [reese-witherspoon] - Coben plotted and wrote it alongside her, per
     Wikipedia, not merely lending his name."
rejected:
  - "Nothing dropped for lack of a source - all 40 works resolve against a
     primary source, most against two independent ones."
forStages:
  press-archaeology: "lifeEvents empty; aura_density flags an 8-year dark
    run, 2012-2019."
  completeness-auditor: "40 works from two agreeing sources; foreign editions
    and franchise-agnostic anthology shorts not checked."
  eras: "0 eras, unresearched."
  reading-orders: "0 orders/startHere; each subseries' own numbering already
    matches publication order, but entry paths are unresearched."
  event-resonance: "no globalEvents ruling yet."
  visual-language: "must create theme.yaml itself - see openQuestions."
openQuestions:
  - "validate.py hard-errors any theme.yaml lacking a full art: block
     (~line 895), conflicting with the documented split where
     franchise-research sets palette/displayFace/signature and
     visual-language adds art later. Left theme.yaml unwritten rather than
     ship an invalid file or do visual-language's job. Palette drafted here
     to adopt verbatim: preset cul-de-sac-noir; bg #12181d, surface #1b2329,
     ink #e7ece9, muted #8b9896, accent #d99a3d (warm porch-light amber);
     displayFace sourceSerif (the register Connelly/Flynn/Nesbo/Slaughter
     already use for plain, fast prose); signature beam (every quiet-hairline
     thread slot already belongs to this catalogue's more atmospheric crime
     wings; Coben's shelf runs on one bold recurring device instead).
     Checked against every existing wing's palette first; none claims this
     cool suburban-dusk register."
  - "Win (1 novel) is tagged its own subseries on the publisher's/Wikipedia's
     explicit label, not just a recurring character - worth a second look
     once more Win novels exist or don't."
