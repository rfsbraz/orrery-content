added:
  - id: harlan-coben/malice-domestic-7
    what: >
      "A Simple Philosophy," a Coben short story, in Sharyn McCrumb's anthology
      Malice Domestic 7 (1998). authorRole: contributor, canonTier: apocrypha.
      A 1999 Anthony Award and Macavity Award finalist that a novel-only
      bibliography sweep does not surface, because it is filed under the
      anthology editor's name in most listings.
    source: >
      Two independent sources agreeing on title, host anthology, editor and
      year: Mystery Readers International's own Macavity Awards record
      (mysteryreaders.org/macavity-awards) and the anthology's own table of
      contents (booksreadingorder.com/malice-domestic-7). The 1999 Anthony
      nomination is corroborated separately by Wikipedia's own award table,
      fetched and read directly (not AI-summarized).
    reorders: >
      New insertion into the derived publication order at 1998, sitting
      between Back Spin (1997) and One False Move (1998).
  - id: harlan-coben/death-do-us-part
    what: >
      Mystery Writers of America Presents Death Do Us Part (2006), an MWA
      anthology Coben edited and also contributed an original story to
      ("Entrapped"). authorRole: editor, contributionTitle: Entrapped,
      canonTier: apocrypha.
    source: >
      Mystery Readers International's Macavity Awards record cites the book
      as "edited by Harlan Coben"; FictionDB's own anthology-appearance
      listing for "Entrapped" independently confirms the story, host book,
      and August 2006 publication.
    reorders: >
      New insertion at 2006, sitting between The Rise and Fall of Super D
      (2005) and Promise Me (2006).
  - id: harlan-coben/best-american-mystery-stories-2011
    what: >
      The Best American Mystery Stories 2011, the annual series' fifteenth
      volume. Coben was that year's guest editor and wrote its Introduction
      (series editor Otto Penzler writes the Foreword every year and is not
      named in withAuthorIds, having no author entity in this repo).
      authorRole: editor, contributionTitle: Introduction, canonTier:
      apocrypha.
    source: >
      Goodreads' own catalogue record (publication December 1, 2011, editor
      credit) quotes an actual line from Coben's introduction in a reader
      review, confirming he wrote original prose rather than only selecting
      stories; FantasticFiction's listing independently corroborates title,
      year and credit.
    reorders: >
      New insertion at 2011, sitting between Caught (2010) and Live Wire
      (2011) / Shelter (2011).
  - id: harlan-coben/the-rise-and-fall-of-super-d
    what: >
      A short story exclusive to the Dutton (US) hardcover edition of The
      Innocent (2005), never sold separately. canonTier: apocrypha,
      authorRole left at the default (author).
    source: >
      Coben's own FAQ page states it directly (in answer to a reader asking
      if it is a Myron Bolitar novel: "No, ... was a short story ... You can
      find it in the USA in hardcover editions of THE INNOCENT"),
      independently catalogued by Goodreads under the same title, author and
      2005 date.
    reorders: >
      New insertion at 2005, sitting between The Innocent (2005) and Death Do
      Us Part (2006) / Promise Me (2006).
checkedAndFoundComplete:
  - "Myron Bolitar count: exactly 12 (Deal Breaker 1995 through Think Twice
     2024), confirmed against Wikipedia's raw table, no 13th novel exists or
     is announced."
  - "Mickey Bolitar (3), Sami Kierce (2), Wilde (2), Win (1): each confirmed
     complete against the same table; no further entries in any thread."
  - "ISFDB's Harlan Coben author page (genre-fiction index, not
     author-primary) lists only The Magical Fantastical Fridge, already
     catalogued - no hidden genre-adjacent short fiction."
  - "No further announced or forthcoming novel beyond Plot Twist (Sept 8,
     2026): searched directly, nothing surfaced past that title."
  - "Harlan Coben's Lazarus (Prime Video, Oct 2025) is an original TV
     concept co-created with Danny Brocklehurst, not adapted from or tied to
     a novel - confirmed by press coverage explicitly distinguishing it from
     his novel-based Netflix deal. Correctly excluded, no book behind it."
  - "canonTier consistency: no core work mistagged extended or vice versa
     found on re-check; the header's own rationale (18 standalone thrillers
     core, Mickey trilogy/picture book/memoir extended for stated reasons)
     holds up against Wikipedia's even-handed treatment."
rejectedOrExcluded:
  - "Coben's own site lists several personal essays and opinion columns
     under 'Essays and Shorts' (New York Times, Bloomberg, Parade, the
     Newark Star-Ledger), including 'The Key to My Father' (NYT, June 2003).
     All are periodical pieces never gathered into a book of their own - the
     same reasoning already applied to uncollected periodical work on other
     wings in this catalogue (Peixoto's cronicas, Tordo's newspaper
     stories). None added."
  - "No withAuthorIds link created for Sharyn McCrumb (Malice Domestic 7's
     editor) or Otto Penzler (Best American Mystery Stories' series editor):
     it is their anthology/role, not Coben's, matching the precedent set by
     Tana French's and Chuck Palahniuk's apocrypha entries for editors
     without an author entity in this repo."
correctionsToHeaderComment: >
  Fixed a pre-existing miscount in works.yaml's own header comment (not a
  schema field, so it does not appear in the numbers above): it claimed "19
  standalone thrillers are core," but only 18 of the file's null-subseries
  core entries qualify - the 19th title in Wikipedia's own "Standalone
  novels" bucket is The Magical Fantastical Fridge, which this file
  (correctly) carries in its own picture-book section instead. Corrected the
  comment to state 18 and explain the discrepancy, changing no data. Not
  a reorder.
