stage: completeness-auditor
summary: >
  40 works before, 44 after. 0 errors before and after (python scripts/validate.py
  --slug harlan-coben); 1 pre-existing warning on franchise.yaml (pipeline-narration
  wording, "curator ruling") predates this stage and was left alone, out of scope
  for a works.yaml audit. No existing work's date, tier, subseries or
  withAuthorIds needed correcting: the scaffold's 40 novels/collections/nonfiction
  check out exactly against two independent primary sources (Wikipedia's raw
  "Published works" table, fetched and read directly; harlancoben.com's own novel
  list), re-verified in full this pass rather than trusted from the handoff.
