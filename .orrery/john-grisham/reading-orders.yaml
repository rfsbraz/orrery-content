stage: reading-orders
summary: >
  Added orders.yaml (4 orders) and startHere (4 paths). Orders pull the four
  subseries with a real multi-year gap out of the 58-work shelf: Jake
  Brigance (3 novels), Lacy Stoltz (2 novels + a short-story prequel), the
  Camino Island trilogy (3 novels), Theodore Boone (7 novels, the YA imprint).
  Mitch McDeere and Sebastian Rudd (2 works each) get no order, matching this
  catalogue's precedent (Coben's Win/Wilde/Sami Kierce, Connelly's Terry
  McCaleb/Catalina) that a two-book thread has nothing for a reader to feel
  pulled out of. startHere ships the two entry points independent guides
  converge on (The Firm, A Time to Kill), the sourced young-reader door
  (Theodore Boone), and the completionist default. A "Grisham essentials"
  order/path was researched and rejected - ranked-list outlets exist but do
  not converge on a shared shortlist.
produced: 2026-08-03
forStages:
  spoiler-audit: >
    No order moves a book earlier than it was published, and none of the
    four raises the prequel/front-loading spoiler vector. Two spots worth a
    second look: (1) john-grisham/lacy-stoltz-in-order opens with Witness to
    a Trial (2016), a short story published weeks before The Whistler
    specifically to introduce Lacy - framed as safe reading-first material
    with nothing to spoil, the one place in this wing "prequel" appears.
    (2) The Jake Brigance path/order both state Sycamore Row stands alone
    and A Time to Kill isn't required first - the one place this wing
    reassures a reader about entry order rather than just stating one; the
    wording stays at "a complete, self-contained trial" and never leans on
    either book's plot to make the case, but worth confirming independently.
  translation: >
    content/i18n/pt-PT/franchises/john-grisham/ does not exist - this wing
    has had no translation pass at all (works.yaml synopses and
    franchise.yaml's description are untranslated too), so there was no
    existing overlay to reconcile and none was created here (this stage's
    footprint is orders.yaml + franchise.yaml startHere only; translation
    owns content/i18n/**). When it runs, it needs pt-PT for 4 order
    names+rationales in orders.yaml and 4 path titles+descriptions+notes in
    startHere; ids, type, source, orderedWorkIds, workIds, orderId and fit
    stay untranslated per SKILL.md §11.
openQuestions:
  - >
    Camino Island as a startHere path: set aside. Novel Suspects (Hachette)
    pitches it only as a follow-up to A Painted House for a reader already
    past the legal thrillers, not as a first stop, and no second source
    corroborates it as an entry point. A second source naming Camino Island
    itself (not A Painted House) as the door in would make this citable.
  - >
    A "Grisham essentials" order: researched and rejected. Collider (sorted
    on Goodreads ratings), ScreenRant (a personal ranking) and a longtime-fan
    blog's own top 7 all rank his full catalogue but by different methods and
    without converging on a shared shortlist, unlike the two sourced entry
    points in startHere. INVENTED-if-attempted, not built.
  - >
    Mitch McDeere and Sebastian Rudd carry no order or path: real,
    publisher-confirmed subseries at two works each, but nothing an order
    would pull apart that the derived default doesn't already give directly
    - same call this catalogue makes for Coben's Win/Wilde/Sami Kierce and
    Connelly's Terry McCaleb/Catalina. Revisit if either thread reaches a
    third book.
  - >
    No jgrisham.com page groups works by character thread the way
    michaelconnelly.com/series/ or karinslaughter.com's series pages do (its
    own categories are Recent Releases / Classic Legal Thrillers / Reader
    Favorites / The Library), so none of the four orders qualify as
    `official-publication`; all four are `type: curated`, sourced to
    Wikipedia, Penguin Random House and the author's own book pages, which
    confirm the groupings but not an official numbered sequence.
