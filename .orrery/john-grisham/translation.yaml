stage: translation
summary: >
  Added the pt-PT overlay for the whole wing: franchise.yaml (description +
  4 startHere paths), works.yaml (58 synopses), events.yaml (1 franchise
  event), orders.yaml (4 reading orders), and authors/john-grisham.yaml
  (bio + 13 lifeEvents). No eras.yaml overlay: the base file is an empty
  list by design. Also translated authors/jim-mccloskey.yaml, the thin
  co-author entity this wing scaffolded for Framed's withAuthorIds
  reference - it belongs to no franchise and i18n_coverage.py flagged it as
  the one remaining gap after the wing's own files were done.
  Titles stay in English everywhere, including inline [[work:...]] display
  text: editions.yaml records 57 editions, all English, none pt-PT, so
  there is no published Portuguese title anywhere in this wing to cite.
  The seven spoiler-audit redactions and the corrected Ron Williamson
  lifeEvent are translated exactly as they now stand - no reveal restored.
produced: 2026-08-03
