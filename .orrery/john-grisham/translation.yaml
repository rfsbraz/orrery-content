legalTerminology: >
  Checked michael-connelly/lee-child/harlan-coben's existing pt-PT overlays
  before writing a single sentence and carried over their vocabulary
  unchanged (réu, procurador, xerife/ajudante do xerife, condado, ação
  coletiva, condenação injusta, veredicto, advogado de defesa). New calls
  this wing needed, none with catalogue precedent: "defensor público" for
  public defender, "litígio de indemnizações em massa" for mass-tort
  litigation, "tribunal de heranças e sucessões" for Mississippi's chancery
  court, "processo por morte indevida" for a common-law wrongful-death
  suit - all four described for what a Portuguese reader needs to
  understand rather than mapped onto a Portuguese legal category that
  doesn't actually match. Full reasoning for each is in the run report.
forStages: {}
openQuestions:
  - >
    Four gender calls made without an explicit English pronoun, resolved
    from the character's independently well-established gender (Reggie
    Love, Marlee, Lacy Stoltz, Mercer Mann) rather than left to guesswork -
    a native reviewer who knows the books should spot-check these four.
  - >
    witness-to-a-trial's ungendered "a judge" is left at the Portuguese
    generic masculine, since neither the wing's text nor its notes state a
    gender and nothing here should invent one.
  - >
    "yellow legal pads" in the author bio is rendered descriptively
    ("blocos de folhas amarelas pautadas") rather than as a fixed product
    term - worth checking against however the wing's own
    yellow-pad-brief theme phrases the same pads elsewhere.
  - >
    "Grisham's first whodunit" is rendered "o primeiro romance policial de
    enigma de Grisham", not the English loanword - a reviewer more steeped
    in Portuguese mystery criticism may already have a standard term.
