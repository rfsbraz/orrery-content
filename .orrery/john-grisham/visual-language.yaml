stage: visual-language
summary: >
  Settled theme.yaml's art block. Emblem: a yellow legal pad filled with
  fast illegible handwriting - the object under both Grisham's own drafting
  history (A Time to Kill, written longhand before work for three years)
  and the wing's already-scaffolded palette (pale legal-pad wash, navy ink,
  rubber-stamp red). Seven motifs centre the wing on that material plus the
  small county courthouse, its gallery seen from the back row (never the
  bench), a one-room storefront law practice, and case files - with
  deliberately smaller room for the baseball thread (Cove Creek Park) and
  the Washington-set thrillers, matching the 42-of-58-core-works weight
  toward legal material. Checked via the digest against every built
  crime/thriller wing; read Jo Nesbo, Gillian Flynn and Lee Child in full
  (the only wings sharing both this wing's face and signature) and
  differentiated explicitly - from Nesbo's ledger-page emblem (financial
  grid vs. a legal pad's free-running cursive) and from Karin Slaughter's
  kudzu-noir (this wing stays sunlit and civic, not swamp-gothic, despite
  sharing rural-South territory). Line character: a fast, functional
  ballpoint/fountain-pen line laid against a felt horizontal rule, as if
  drawn on the pad itself.
produced: 2026-08-03
forStages:
  art-rotation: >
    No eras exist for this wing (eras.yaml is an explicit, sourced empty
    list), so there is no era-plate anchor. Start the anchor from
    grisham-witnesses-1984-trial (immersion, impact high) - the DeSoto
    County courthouse gallery scene sets the register the other 13 assets
    match.

    The legal-pad emblem is one of seven motifs, not the default: with 14
    assets total, keep it to 3-4 and rotate the rest (courthouse building,
    gallery pews, law-office shingle, case file/banker's box, the Cove Creek
    ballfield, a federal-courthouse corridor for the Guantanamo op-ed and
    OpenAI-lawsuit events) so it doesn't harden into a logo.

    Any courtroom stays in the gallery - pews, windows, sun on the floor -
    never the bench or a gavel, on every asset that touches one
    (grisham-railroad-verdict-1996 and the 1984 trial both risk the cliche
    without this). grisham-cove-creek-park-1996 is the one asset that should
    show a ballfield - keep baseball out of the courtroom-heavy assets so
    the minority thread doesn't read as half the wing.
  visual-metadata: >
    Every asset here is biographical (13 lifeEvents + 1 franchise event; no
    eras, no generated covers/portraits). When sourcing the licensed author
    portrait or other real photography, avoid leaning on a film-still or
    poster from any of his adaptations (The Firm, The Pelican Brief, The
    Client, A Time to Kill, The Chamber, The Rainmaker, A Painted House,
    Christmas with the Kranks, Mickey) for identity or context - VISUAL.md
    SS3 and this wing's own art.avoid both rule that out on the generated
    side, and the same instinct applies to sourcing. The
    courthouse-vs-swamp distinction against Karin Slaughter's wing is a
    generated-art matter only.
openQuestions:
  - >
    The wing's non-art palette notes (already scaffolded, untouched here)
    call Nesbo and Christie "the only two LIGHT exceptions" among the
    catalogue's crime wings. Gillian Flynn's bg (#e2dfda) is also light on
    inspection - this is really the fourth pale-ground crime wing. Doesn't
    change anything decided here, but the comment itself is now inaccurate.
  - >
    The DC/federal-corridor motif has thin direct coverage: only the
    Guantanamo op-ed (2013) and the OpenAI lawsuit (2023, Manhattan, not DC)
    plausibly reach for it. Kept for the real Beltway-thriller bibliography
    (The Pelican Brief, The Broker, The Testament), but expect it to go
    unused across this wing's 14 biographical assets.
  - >
    The Widow (2025) is filed as core legal-adjacent material rather than a
    genre departure, consistent with its synopsis - a judgment call, since
    Grisham calls it "his first whodunit."
