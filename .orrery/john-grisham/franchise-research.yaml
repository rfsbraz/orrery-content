stage: franchise-research
summary: >
  Scaffolded the John Grisham wing from scratch: franchise.yaml, works.yaml
  (58 works), theme.yaml's non-art fields, and two global author entities
  (john-grisham, jim-mccloskey). 42 core novels, 11 extended (Theodore Boone
  x7, Ford County, Sparring Partners, The Innocent Man, Framed), 5 apocrypha
  (Mickey, The Tumor, Partners, Witness to a Trial, Don't Quit Your Day Job).
  Verified rather than assumed the request issue's "straightforward" framing
  and found real corrections along the way (see openQuestions and
  works.yaml's own header). validate.py --slug john-grisham is clean except
  for the expected missing theme.art block, which is explicitly out of this
  stage's scope.
