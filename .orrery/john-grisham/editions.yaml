stage: editions
summary: >
  Sourced and verified 57 of 58 works (98%), all English, all Doubleday-family
  or the correct alternate imprint. Every ISBN-13 check digit was
  independently recomputed (not trusted from OpenLibrary's own flag) and
  every OpenLibrary edition record was opened and read before its ISBN was
  recorded - nine records that looked like a plain trade hit from the title
  alone turned out to be a same-year Limited/Signed or Large Print edition
  once opened (The Brethren, The Rainmaker, The Pelican Brief, The Associate,
  The Broker, The Last Juror, The Confession, Guardians, Camino Winds) and
  were swapped for the real trade printing. All three complications named in
  the build brief resolved with real data rather than assumption: A Time to
  Kill's original 1989 Wynwood Press printing has no findable ISBN anywhere
  (OpenLibrary's dedicated Wynwood work record carries only an Amazon ASIN),
  so the current Dell 20th-anniversary paperback is recorded instead, per the
  skill's own "most recent in-print" default; all seven Theodore Boone books
  confirmed as Dutton Children's Books, never Doubleday; and the two 2016
  e-shorts (Partners, Witness to a Trial) turned out to have real digital
  ISBNs on their own PenguinRandomHouse.com pages even though OpenLibrary
  never indexed either one. Mickey (2004) is the one work with no edition at
  all: it is a screenplay, never published as a book in any form, print or
  digital - a market fact, not a research gap. validate.py --slug john-grisham
  is clean (0 errors); the sanctuary-rule warnings the first draft tripped
  (process narration like "this pass", "curator") were fixed in the same
  session.
produced: 2026-08-03
coverage:
  editionsAdded: 57
  worksCovered: 57
  worksTotal: 58
  worksWithoutEdition:
    - "john-grisham/mickey: a screenplay, never published as a book (print or
      digital); no ISBN exists to record."
notableFinds:
  - "Don't Quit Your Day Job (2010): its OpenLibrary record omits the
    publisher name, but the table of contents lists 'underwear salesman --
    John Grisham', which both confirms the correct MP Publishing edition
    against a dozen unrelated same-titled books and gives Grisham's essay a
    title works.yaml's own sources leave unestablished: 'The Underwear
    Salesman'. Reported here for the curator to fold into works.yaml -
    editions.yaml is not the place to change a work's note."
  - "Partners and Witness to a Trial (both 2016) are digital-only e-shorts
    with real ISBN-13s on their PenguinRandomHouse.com product pages
    (9780385541923, 9780385542579) that OpenLibrary has never indexed under
    any title search tried."
  - "The Tumor (2015) is a free promotional short from the Focused Ultrasound
    Foundation, outside Grisham's usual trade bibliography, but still carries
    a real self-published ISBN-13 (9781495179402) rather than none."
  - "The French Illusion (forthcoming Sep 29, 2026) already has a confirmed
    hardcover ISBN (9780385550543) on its own PenguinRandomHouse.com preorder
    page, matching works.yaml's forthcoming date exactly."
openQuestions:
  - "No Portuguese (pt-PT) edition run was attempted in this pass - English
    only. Grisham has been extensively translated into Portuguese; a pt-PT
    sweep is real future work, not a checked-and-absent finding."
  - "Theodore Boone: The Scandal (2016)'s OpenLibrary record has no
    `publishers` field at all; it is filed as Dutton on ISBN-block pattern
    matching (978-0-525-4263xx, identical to every other confirmed Dutton
    Boone hardcover) rather than on the record's own metadata, which is
    silent. A human with a browser could confirm this directly off a jacket
    or the publisher's own catalogue."
  - "Skipping Christmas: OpenLibrary holds two same-publisher Doubleday
    hardcover ISBNs eleven months apart (9780385506243, 'Nov 2001, 1st ed.'
    and 9780385508414, 'Oct 2002'); the earlier one is recorded as the true
    first edition, but neither record states outright which printing it is,
    so this rests on the publish-date field and the '1st ed.' tag alone."
  - "A Time to Kill's original Wynwood Press 1989 printing is real and
    historically significant (Grisham's famously small self-marketed debut)
    but has no findable ISBN in any source checked, print or digital -
    genuinely unrecoverable with the tools available here, not merely
    unsearched."
