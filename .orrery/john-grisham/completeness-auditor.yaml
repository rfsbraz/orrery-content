  filesNotTouched:
    - content/franchises/john-grisham/franchise.yaml
    - content/franchises/john-grisham/theme.yaml
    - content/authors/john-grisham.yaml
    - content/authors/jim-mccloskey.yaml
forStages:
  press-archaeology: >
    Aura plan unchanged: the 2012-2019 dark run is still the real gap. One
    new lead: Grisham gave a TEDx talk for the Focused Ultrasound Foundation
    in Charlottesville in December 2015, introducing The Tumor in person - a
    dateable public appearance inside that gap, sourced via
    appliedradiology.com (2016-03-23).
  reading-orders: >
    No change to the five-subseries structure. Partners/Sparring Partners
    and the Lacy Stoltz e-short/novel order are now independently confirmed
    via PenguinRandomHouse.com's own product pages, so both entry paths can
    be built without re-litigating either.
  eras: >
    No change; still no eras.yaml, candidate hinges unaffected.
  visual-language: >
    No change to theme.yaml.
openQuestions:
  - "Don't Quit Your Day Job (2010, apocrypha, authorRole: contributor)
    still has no found title for Grisham's individual essay. Checked NPR's
    own excerpt page for the anthology (npr.org/130083014) - it turns out
    to excerpt Winston Groom's essay, not Grisham's - plus further targeted
    searches for Grisham-specific content from the book (Little League,
    Sears, tax-law references). None surfaced a title. Stays excluded as a
    field, documented as a gap in the work's own note, per this stage's
    instruction not to coin one."
  - "Jim McCloskey's birth year (1942 in content/authors/jim-mccloskey.yaml,
    out of this stage's scope) is still not stated directly by any source
    checked. Confirmed he graduated Bucknell in 1964, which is consistent
    with a ~1942 birth year but does not pin it to a specific year or date.
    No obituary-style profile or dedicated Wikipedia page for the Centurion
    Ministries McCloskey was found (en.wikipedia.org/wiki/Jim_McCloskey
    resolves to an unrelated baseball player); the derived estimate stands
    unconfirmed."
  - "No Grisham work has been missed for 2025 or 2026: The Widow
    (October 21, 2025, confirmed via PenguinRandomHouse.com) and the
    announced The French Illusion (September 29, 2026, already scaffolded)
    are the only two titles found in that window. The only other
    2026-dated PRH listing is a reissue box set of three classic novels
    (no new content), correctly left uncatalogued as a work."
  - "The Tumor's 2015 date and the Partners/Sparring Partners split were
    both re-confirmed with additional corroborating sources beyond what
    franchise-research had (a TEDx-talk date for the former, PRH product
    pages for the latter); neither was a contested judgment call, both
    simply needed the extra citation this stage's mandate asked for."
