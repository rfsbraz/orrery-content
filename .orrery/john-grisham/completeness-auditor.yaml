stage: completeness-auditor
summary: >
  Verified all 58 works in the John Grisham bibliography (42 core, 11
  extended, 5 apocrypha) against primary/publisher sources rather than
  Wikipedia alone. No works added or removed and no date changed - every
  correction franchise-research already made held up, and every specific
  item the handoff asked for was independently re-checked and confirmed.
  Upgraded eight entries' sourcing from a single secondary citation to a
  publisher product page (PenguinRandomHouse.com) or the author's own site
  (jgrisham.com), and tightened the header's wording on three items that
  are now settled facts rather than open hedges. validate.py --slug
  john-grisham is clean except the expected missing theme.yaml `art:`
  block, explicitly out of this stage's scope.
produced:
  correctedWorkIds: []
  addedWorkIds: []
  removedWorkIds: []
  sourceUpgrades:
    - john-grisham/witness-to-a-trial
    - john-grisham/the-whistler
    - john-grisham/the-judges-list
    - john-grisham/sparring-partners
    - john-grisham/the-exchange
    - john-grisham/camino-ghosts
    - john-grisham/the-widow
    - john-grisham/mickey
  headerRewrites:
    - "The Tumor correction: added the December 4, 2015 retail date and the
      Foundation TEDx talk as corroboration, and named the more precise
      form of the Wikipedia self-contradiction (its own navbox says 2015,
      its prose bibliography says 2016 - not a rival source)."
    - "Lacy Stoltz spelling: moved from a hedge (worth pinning against a
      primary source) to a settled fact, now that jgrisham.com's own book
      excerpts confirm 'Stoltz' throughout both The Whistler and The
      Judge's List."
    - "The Gingerbread Man exclusion: added the film's own Wikipedia
      infobox citation ('Screenplay by Robert Altman (as Al Hayes)') and
      noted that the Grisham bibliography navbox itself contradicts that
      infobox by listing the film under his screenplays."
  filesWritten:
