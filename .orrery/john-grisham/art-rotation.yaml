stage: art-rotation
summary: >
  Graded the wing's 14-item river (13 lifeEvents + 1 franchise event; no
  eras.yaml content to grade). Kept the visual-language anchor
  (grisham-witnesses-1984-trial, immersion) untouched and changed three
  entries to fix a front-loaded cluster of loud cells: mississippi-legislature
  (beside -> floating-object, workplace-workshop -> isolated-object, a
  law-office shingle) opens more viewport share right after the birth vista so
  the reader never reaches the 1984 trial within the same screenful;
  firm-hollywood-deal-1990 (mosaic -> artifact-spread, press-media-collage ->
  manuscript-proof, the bootlegged typescript rather than a press collage,
  +pull-focus on the unpublished $600k figure) drops out of loud so it no
  longer neighbours the trial or the genre-boom event; and
  legal-thriller-boom-1991 (mosaic -> passage, press-media-collage ->
  serial-contact-sheet) moves the genre-wide credit onto its own dateRange
  (1989-1996) as a compressed-years transition instead of a second mosaic
  touching firm-hollywood-deal-1990. Also added a breakout modifier to
  time-to-kill-rejected-1989's layered-stack (one letter/the eventual small
  press breaking free of the rejection pile). Final distribution:
  artifact-spread 4 (28%), full-bleed-vista 2, floating-object 2, beside 2,
  immersion 1, layered-stack 1, passage 1, mosaic 1 (14 events total).
  Contour: #=#==.=#===#== - loud at born-1955, witnesses-1984-trial,
  cove-creek-park-1996, child-porn-comments-2014, none touching or sharing a
  screenful, longest same-intensity run is 3 (mid). illustration_type stays
  varied (document-facsimile peaks at 3/14, everything else at 1-2).
  `art_rotation.py --check john-grisham` reports 0 organisation-rotation
  problems and 0 pacing problems; `validate.py --slug john-grisham` is 0
  errors (3 pre-existing handoff-length warnings from earlier stages, not
  touched here).
produced: 2026-08-03
forStages:
  visual-metadata: >
    grisham-firm-hollywood-deal-1990 is now manuscript-proof (the bootlegged
    Firm typescript, not the legal pad - keep the yellow-pad emblem itself to
    the 3-4 assets visual-language already flagged, this one is a different
    object) and grisham-mississippi-legislature-1983 is isolated-object (the
    law-office shingle motif, marking the entry's 1990 close-of-practice
    detail even though the event date is 1983). john-grisham-legal-thriller-
    boom-1991 is now serial-contact-sheet: source/verify real-object material
    that reads as this wing's own case-file/manuscript system (banker's-box
    tabs, typed title pages) rather than book-cover art, since theme.yaml's
    art.avoid bars any adaptation poster/title-card styling and generic book
    covers risk drifting there anyway.
  asset-prompt: >
    Two modifiers are set and both need their compatible-organisation prompt
    text: pull-focus on firm-hollywood-deal-1990 (artifact-spread) should
    reveal a specific too-small-to-read detail on the manuscript/deal page -
    the unpublished-novel stamp or the studio figure, not an invented exact
    dollar amount rendered as legible type (house ban on in-image
    typography still applies); breakout on time-to-kill-rejected-1989
    (layered-stack) should show one item breaking free of the rejection pile,
    reading as the eventual small-press acceptance rather than as clutter.
openQuestions:
  - >
    A 14-item river is small enough that the ~40% organisation cap (5-6
    events) and the immersion/epigraph absolute caps (1-2, 2-3) never bound
    the composition - the actual limit at this scale is the screenful/loud-
    adjacency check, which is far more restrictive than any frequency cap.
    Concretely: with witnesses-1984-trial fixed as the wing's one immersion
    (correctly, per the visual-language anchor), no other loud organisation
    could sit within roughly two events of it without tripping the
    one-screenful rule, regardless of how far the wing was from any cap
    number - the fix here was reassigning organisations, not counting. A
    future small wing (sub-15 events) should expect the same: read the
    screenful check as the binding constraint from the start rather than
    checking the percentage caps first.
  - >
    Both changed illustration_types (manuscript-proof for the 1990 deal,
    isolated-object/shingle for the 1983 legislature entry) are plausible but
    not literally sourced to a specific described object in the lifeEvent
    text - the underlying facts (a bootlegged manuscript circulated; he
    closed his law office in 1990) are sourced, the choice of which object
    stands in for them visually is a composition judgement call, same as any
    other illustration_type assignment on this wing.
