stage: spoiler-audit
summary: >
  Audited every prose surface against the publisher's own copy for all 20 works
  (mattdinniman.com reproduces each book's back-cover copy on its product page).
  One real spoiler, rewritten: the This Inevitable Ruin synopsis named the
  crawler who shares the one-way rule with Donut, disclosing her survival across
  volumes whose own jackets never name her. Every other synopsis tracks its
  book's jacket and is ruled clean. No boundaries set or loosened: the wing has
  no events and no gated life events, and the whole fictional risk sits in
  ungated `works[].synopsis`, where rewriting is the only lever.

gatedFields:
  derivedFrom: [lib/content/types.ts, lib/spoilers/index.ts]
  finding: >
    `spoilerAfter` exists on one type only, `AuraEvent` (types.ts:80), carried
    by three things rather than the skill table's two: franchise/global
    `events[]`, `Author.lifeEvents[]`, and `Heteronym.lifeEvents[]`
    (types.ts:124). `Work`, `ReadingOrder`, `Era`, `Franchise` and
    `StartHerePath` have no such field. Moot here (no heteronyms, no events),
    but the table is still wrong.

produced:
  worksRewritten: [matt-dinniman/this-inevitable-ruin]
  boundariesSet: []
  boundariesLoosened: []
  deletions: []
  localeStringsInvalidated: []

spoilersFound:
  loadBearing:
    - where: works.yaml, matt-dinniman/this-inevitable-ruin, synopsis
      was: '"...only one of Donut and her rival Katia will be allowed to leave."'
      severity: load-bearing - a survival, the vector the skill flags as easiest
        to leak
      ruling: >
        Every element is book seven's own jacket copy, but the test asks whether
        the fact is on the jacket of the book it would spoil. Books 1-6 name
        Carl, Donut, Vrah and Shi Maria and never this character, so the synopsis
        told a reader mid-series that she is alive at book seven, in a series
        that kills named crawlers and repeatedly puts hers in doubt. "Rival" was
        the wing's word, not the publisher's: the jacket frames them as teammates
        ("thanks to Carl, Donut, and Katia"), which is what makes the rule land.
      fix: >
        Rewritten to keep the whole hook (Faction Wars, the NPC army, the dead
        staying dead, the one-of-two rule) and drop only the name. One clause,
        and unlike a shield it carries no over-redaction cost. A curator `note:`
        records why the jacket's wording is not used, so the next enrichment pass
        does not restore the name.
  incidental: []

checkedNotSpoilers:
  - dcc-1: >
      Survivors, the alien corporation, the rebuilt Earth, the reality show: all
      jacket. "Eighteen-level" is not, but it is Wikipedia's Premise paragraph
      and is container scale, not a reveal.
  - dcc-2 to dcc-6: >
      Each compresses its own back-cover copy with nothing added: the Over City
      and its ancient spell; the top-ten bounty and the seemingly useless book;
      one bubble / four castles / fifteen days; the tourists, Vrah, and prey that
      fights back; Shi Maria, the missing god's widow, captured-is-not-tamed.
      Book six rightly declines its own jacket's "after the shocking conclusion
      of the seventh level".
  - dcc-7 NPC army: >
      Kept: book seven's own premise, and its enabling condition (the failing
      System AI) is on book six's jacket.
  - dcc-8: >
      Lost agency, the unshareable plan, the AI's own phrase: all jacket. It
      omits that jacket's opening line about the aftermath outside the dungeon,
      which is book seven's outcome.
  - shivered-sky 1-3: >
      Near-verbatim from each volume's own copy, including "yet another terrible
      blow" and "this time, the winner takes all". Indigo continuing is
      series-level copy about the sole protagonist.
  - dominion-of-blades, hobgoblin-riot: >
      Jacket premise; the second's "as badly as the book's own opening promises"
      points at the front-matter joke printed on that jacket.
  - the-grinding: >
      The nuking of Tucson and the eyewitness-account frame read like an ending
      and a structural reveal, and both are printed on the jacket. The ruling
      that would have been wrong from memory.
  - kaiju, operation-bounce-house, trailer-park-fairy-tales: >
      Jacket throughout, including Kaiju's "become the most ruthless monster of
      them all", the publisher's own arc statement.
  - backstage-at-the-pineapple-cabaret: Publication form only, no plot content.
  - apocalypse, the-last-yong-shi: No synopsis exists.
  - orders.yaml: >
      Rationale and the one `debated` entry argue publication form only - what
      the novella is and why it has no position - and never touch which volume's
      events it sits inside.
  - franchise.yaml: >
      Read fresh as a newcomer: the DCC path sells book one's premise and the
      publisher numbering with no ending in it; the completionist path argues
      sequence and tonal jumps; the description is career shape.
  - author lifeEvents: >
      All 8 are real-world career and biography facts. None states a plot fact;
      the 2017 entry stays at that book's jacket premise. Correctly ungated - a
      publication fact must never carry a boundary.
  - events: >
      events.yaml and eras.yaml are empty by design; the two included global
      events carry no plot content and no boundary.

translations: >
  No locale overlay exists for this wing (nothing under content/i18n for the
  author or franchise - translation has not run), so nothing to mirror and no
  coverage delta. The rewrite will be picked up when translation runs.

engineLimits: >
  Works cannot carry a boundary, so a synopsis is protected only by its wording.
  Sufficient here, but it means a reader who has finished book six has no way to
  be shown the fuller sentence the jacket prints.

uncertain: []

validation: >
  `validate.py --slug matt-dinniman` fails only on the pre-existing
  `theme.yaml: no art: block` (visual-language has not run).
