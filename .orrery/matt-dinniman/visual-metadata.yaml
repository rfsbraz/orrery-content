stage: visual-metadata
summary: >
  Portrait found (Commons/WikiPortraits, CC BY 4.0). Covers: 13/20 works,
  all Open Library, all fetched with ?default=false and looked at. 8/8
  Dungeon Crawler Carl novels covered; 4 of those 8 needed a substitution
  because Open Library's record for the correct Ace ISBN carries the
  wrong (self-published) jacket image - a real, repeated Open Library data
  error on this wing, documented per-work in works.yaml.
