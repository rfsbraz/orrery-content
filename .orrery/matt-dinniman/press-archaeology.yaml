stage: press-archaeology
summary: >
  Added 8 lifeEvents (2017-2026): the 2019 Independent Audiobook Awards
  meeting with narrator Jeff Hays, the Dec 26 2019 start of Dungeon Crawler
  Carl, the March 2020 pandemic income collapse that forced its self-
  publication, the 2024 Ace Books print deal, the Aug 2024 Universal/Fuzzy
  Door TV option, the Jun 2026 Clarke Award shortlist, the Jun 2026 Peacock
  series order, plus one 2017 entry (Dominion of Blades) tying his
  self-described MMO wariness to its premise - the only pre-2019 anchor real
  effort turned up. One bio correction (Peacock status brought current:
  "in development" -> a real straight-to-series order, confirmed by
  Wikipedia's own current text, Deadline and Variety). Birth date searched
  again, hard: genuinely not there, not a shortcut.
  aura_density.py: 0 -> 8 entries, 0.40/work, worst dark run 24yr -> 14yr
  (2003-2016). validate.py --slug matt-dinniman: same one pre-existing error
  (no theme.art - visual-language's job).
