rejected:
  - item: "Exact/estimated birth date or year"
    why: >
      Re-checked his own site, Wikipedia (still "ca. 1970s"/missing-year
      category), Seattle Met + Gig Harbor Now (only "early 50s," a bracket),
      Grimdark + Audible interviews, a KOLD Tucson profile, Goodreads/Amazon/
      OpenLibrary author pages, a Sabino HS class-of-1989 alumni list (no
      match). Not estimated from his own loose "late 20s"/"just a kid" lines
      - that's the exact speculation this stage was told not to launder.
  - item: "'Sold about 50 copies' (2003 debut The Shivered Sky)"
    why: "One source only (a Substack blog paraphrasing an unread NYT profile) - held out under the never-launder-a-citation rule."
  - item: "Ace deal: 'first three books April 2024, expanded to six'"
    why: "Aggregated coverage only; Publishers Weekly's own Oct 2024 piece, read directly, just says 'books one through six,' no month. lifeEvent states the rights structure only."
  - item: "'Dandy House' self-pub imprint name"
    why: "Real (Locus's Clarke shortlist listing confirms it) but trivia - no bearing on how any book reads."
  - item: "Gig Harbor move year: 2012 (Seattle Met) vs. 2013 (Gig Harbor Now)"
    why: "Real 1-year discrepancy; bio already only says 'during the 2010s' - neither source contradicts it. Geography texture, not aura."
