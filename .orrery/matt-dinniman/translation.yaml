stage: translation
summary: >
  Full pt-PT overlay coverage for the wing: franchise.yaml (description +
  both startHere paths), works.yaml (synopsis + note for all 18 works that
  carry prose - apocalypse and the-last-yong-shi have neither in the base
  and correctly get no entry), orders.yaml (name/rationale/debated for
