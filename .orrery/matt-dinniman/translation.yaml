titlesLeftInEnglish: >
  Every work except book 1 of Dungeon Crawler Carl: no pt-PT edition exists
  for Operation Bounce House, Dominion of Blades, The Hobgoblin Riot,
  Trailer Park Fairy Tales, The Grinding, Kaiju: Battlefield Surgeon, all
  three Shivered Sky volumes, or Dungeon Crawler Carl books 2-8 plus
  Backstage at the Pineapple Cabaret (Kathartika's pt-PT program covers
  only book 1 so far - see editions.yaml). As always, `title` itself is
  never set in the works.yaml overlay for any work, per the hard rule.

registerCalls: >
  See PR body / run report for full detail and sourcing. Summary: "nível"
  for dungeon floors and "masmorra" for dungeon are sourced to Kathartika's
  own published pt-PT translation of book 1, not guessed. "Crawler" and the
  in-world proper nouns Over City / Faction Wars / the Spiral / the Grinder
  stay untranslated (no sourced PT equivalent anywhere) - flagged for a
  native reviewer. "The System"/"System AI" -> "o Sistema"/"IA do Sistema"
  (standard cross-work LitRPG vocabulary, not a coinage). RPG/VR/MMORPG/
  top 10/puzzle/reality show kept as loanwords, matching PT-PT gaming
  register. The dungeon-crawler-carl inline-link display text uses the
  published title "Carl, o Herói das Masmorras" only where the prose names
  that specific book (2 spots); mentions of the ongoing multi-book saga
  keep the English series name, since no PT series name is published.

proseNotExpressed: "None - every prose field this wing's base carries now has a pt-PT counterpart."

validator: "python3 scripts/validate.py --slug matt-dinniman green, 0 errors, only pre-existing handoff-length warnings."
