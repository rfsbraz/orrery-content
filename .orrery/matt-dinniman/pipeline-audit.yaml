findings:
  - id: world-events-skip-unrecorded
    priority: 1
    evidence: >
      grep -i "world" across all 19 .orrery/matt-dinniman/*.yaml handoffs and
      `git log --oneline main..matt-dinniman/pipeline-audit` returns zero
      hits tied to a world-events decision (the sole "world" match is an
      unrelated pt-PT translation commit). author.md line 88 triggers
      world-events on "the author extends the catalogue's span, or publishes
      in a decade global.yaml leaves empty" - stage_plan.py's baseline read
      marked it SKIP (Dinniman's decades already covered) but that reasoning
      is written nowhere durable. wing-audit.yaml's own
      checkedAndClean/notApplicableNotAbsent lists record other correct
      no-ops (eras: [], events.yaml: []) but not this one - wing-audit did
      not catch it either this time, unlike the precedent case the skill
      documents (spoiler-audit skipped silently, caught only because
      wing-audit happened to check).
    proposedEdit: >
      author.md line 89 already prescribes the pattern for a arithmetic-only
      skip (eras on a 1-2 work shelf: "write eras.yaml yourself with the
      reasoning and skip the stage"). Extend the same rule to world-events:
      a baseline-read SKIP needs one line in the scaffold commit message or
      franchise-research.yaml's `rejected`/`openQuestions` list, gated the
      same way. Add to author.md's trigger table row for world-events (line
      88): "a SKIP verdict still needs one recorded line (scaffold commit or
      franchise-research.yaml) - see the eras small-shelf precedent."
    expectedSaving: >
      Not tokens - auditability. This is the second wing running this exact
      scenario with the same miss; the cost is a repeat investigation (this
      one) every time nobody can tell a deliberate skip from an oversight.

  - id: footprint-violations-none-camoes-fix-held
    priority: null
    status: clean
    evidence: >
      `git show 2048a21` (press-archaeology) and `git show 8e3332b`
      (press-archaeology-birth) both grep clean for added
      organisation:/illustration_type:/images_required:/modifier: lines.
      franchise-research's scaffold (0463bd7) writes theme.yaml with
      "palette/displayFace/signature only" and its own handoff confirms "art
      left absent". art-rotation (2dabac4) and art-rotation-fix (d97c8aa) do
      write organisation: - correctly, it is their own field. Second wing
      running the same real scenario (a follow-up pass, press-archaeology-birth,
      adding content to an existing author entity) since the Luis de Camoes
      fix, and it held a second time.

  - id: validate-py-slug-discipline-clean
    priority: null
    status: clean
    evidence: >
      All 11 explicit validate.py invocations found across the 19 handoffs
      use `--slug matt-dinniman`; zero bare/catalogue-wide runs. Full fix of
      the John Shirley baseline's worst finding (11 catalogue-wide runs, 10
      avoidable). Nothing to propose.

  - id: event-resonance-tier-question
    priority: 2
    evidence: >
      Haiku pass's actual recorded justification for including
      fantasy-paperback-boom-1965 (commit 37303353): "Created the mass-market
      fantasy category his LitRPG series depends on" - a genre-word
      misattribution, since LitRPG's real lineage is Royal Road web-serial
      fiction and RPG-mechanic conventions, not the mass-market epic-fantasy
      paperback category this specific event created; the stress-test's own
      fix names it as sharing only "the word fantasy." Separately,
      online-bookselling-1995 was included on "Amazon's direct-to-reader
      channel enabled the self-publishing path" - the identical resonance
      already claimed by ebook-and-self-publishing-2007's "Kindle and Amazon
      KDP created the exact platform he used" - a real double-count of one
      fact (2020 Amazon self-pub) under two event ids. 2 real errors in a
      first pass of at most 13 rulings (4 include + 9 exclude pre-revision).
    argueForKeepingHaiku: >
      Combined event-resonance cost (57,432 + 82,878 = 140,310) still lands
      under a single sonnet-high pass would likely cost (reading-orders
      121,947 and spoiler-audit 120,062 are the closest sonnet/opus-high
      comparables on this wing, both single-pass). The two-tier design,
      cheap first pass plus a review before merge, may already be buying
      correctness for less than promoting the base tier would.
    argueAgainstHaiku: >
      author.md line 192's haiku/medium rationale is "the engine already
      filtered by lifetime; the agent writes one sentence or excludes, and
      the default is exclude" - assuming near-mechanical judgment. This run's
      two errors were not boundary calls of that kind: one is citing an
      event's specific defined content incorrectly, the other is failing to
      cross-check a candidate against a similar sibling already on the
      include list. Both need the contextual/comparative reasoning the tier
      assumes away. The stress-test is also currently ad hoc (orchestrator-
      dispatched, not in the trigger table) - itself a stage-that-ran-
      without-a-record risk if a future orchestrator simply forgets to
      dispatch it.
    proposedEdit: >
      Do not promote event-resonance's base pass off haiku on one data point.
      Instead codify the stress-test as event-resonance's own second half in
      author.md's trigger and tier tables, at sonnet/default, rather than
      leaving it an undocumented ad hoc habit - so it runs even when nobody
      remembers to ask for it.
    expectedSaving: "Not estimable from one run; the finding is a recommendation to make the safety net mandatory, not a token saving."

  - id: visual-metadata-cost-shape
    priority: 3
    evidence: >
      156 calls (highest of any stage this run), 242,158 tokens, 1,552
      tok/call - matches the skill's own "death by a thousand fetches"
      signature and is close to the John Shirley baseline's visual-metadata
      (330,252 tokens / 170 calls / 1,942 tok/call) - the same shape twice
      in a row. But the handoff shows real per-work verification driving the
      count: 4 of 8 DCC Ace-reissue covers had Open Library serving the
      wrong (self-published) jacket for the correct ISBN, caught only by
      fetching the publisher's own product photography via a third-party
      collector's-guide site and comparing pixel content per candidate, not
      by ISBN/date matching alone; a 5th mismatch (operation-bounce-house, a
      baked-in "Large Print" badge) needed the same per-candidate check.
    verdict: >
      Not clearly a violation - a 20-work, 5-language, self-pub-to-Ace
      catalogue with a documented, repeated Open Library data error requires
      exactly this shape of checking. Could not confirm from the handoff
      whether scripts/metadata/lookup.py --check-covers ran first (out of
      budget to check); flagging as the one thing to verify before proposing
      any change, since the skill's own guidance is to reach for it first.
    proposedEdit: >
      No firm edit given the twice-repeated identical shape at a similar
      tok/call. Recommend a future audit confirm lookup.py --check-covers
      usage directly and, if it is already used, treat this cost as
      structural to the stage rather than a habit to fix.

  - id: wing-audit-four-blocking-findings
    priority: 4
    evidence: >
      4 blocking findings vs "usually 0" on recent wings. Breakdown: (1)
      works.yaml's own note contradicts its own adjacent comment (Aug 22 vs
      Oct 22) - single-stage internal inconsistency; (2) works.yaml asserts
      "no self-pub edition", editions.yaml (written by a later stage)
      records one - a staleness gap, not a contradiction completeness-auditor
      could have caught when it wrote the note; (3) editions.yaml's own es
      note is internally wrong (a research gap); (4) translation uses a 2026
      title anachronistically for a 2020 event - single-stage accuracy miss.
    verdict: >
      Proportionate to how contested this wing's facts are, not systemic.
      3 of 4 are ordinary single-stage research/accuracy misses of the kind
      wing-audit exists to catch; only #2 is a genuine cross-stage ordering
      pattern (an earlier stage's true-at-the-time claim outlived a later
      stage's contradicting fact). That one is inherent to any pipeline
      where completeness-auditor precedes editions, not evidence of a
      stage failing to catch its own contradiction.
    proposedEdit: >
      For finding #2's pattern specifically: editions should flag back
      (one handoff line) when it records a fact that contradicts an
      existing works.yaml note, rather than leaving wing-audit as the only
      backstop for that specific ordering gap.
    expectedSaving: "Not estimable; a correctness/staleness fix, not a cost one."

