stage: wing-audit
summary: >
  Full-wing critic pass, every number re-derived. 4 blocking, 5 missing, 4
  stale. Evidence is in the report / PR body.
baseline:
  validate: "green - 0 errors, 3 inherited handoff-length warnings"
  i18n: "374/390 pt-PT; this wing in neither MISSING nor PARTIAL"
  aura: "20 works / 11 entries / 0.55 per work; dark run 2008-2016"
  artRotation: "0 organisation, 0 pacing; contour #.==#===#"
  eventDensity: "22 globals, 2 high of ~18, no decade over budget"
  assets: "13/20 covers (all fetched with ?default=false), 46 editions across 17 works"
blocking:
  - "works.yaml the-dungeon-anarchists-cookbook: `note:` says Aug 22 2024, the comment below says Oct 22 2024. Owner: completeness-auditor."
  - "works.yaml this-inevitable-ruin `note:` asserts no self-pub edition and no later reissue; editions.yaml records both. Owner: completeness-auditor."
  - "editions.yaml es note claims no Spanish volume before book 5; mattdinniman.com lists Spanish on books 1-3. Owner: editions."
  - "pt-PT uses the 2026 Kathartika title in the two sentences describing the September 2020 self-publication. Owner: translation."
missing:
  - "art-rotation: peacock-series-order-2026 holds a loud `mosaic` at impact:med while three identical press milestones got mid. Demoting leaves 4 trailing mids, still clearing MAX_FLAT_RUN=4."
  - "press-archaeology: no lifeEvent for the Aug 2024 bookstore/TikTok surge, the wing's only real crowd moment; and 2008-2016 is still dark, with the Yakima Herald-Republic archive the last lead."
  - "visual-metadata: the DCC shelf renders two jacket systems (I/IV/VII/VIII Ace, II/III/V/VI self-pub). Correct today; recheck when Open Library gets the Ace art."
  - "editions: three forthcoming FISCHER Tor volumes, none recorded."
  - "curator/app: `works[].note` is absent from the `Work` type and read by nothing - 753 of 2284 catalogue works carry one, 18 here, all translated. `Edition.note` and `themePreset` likewise. Same pattern as orrery#169."
stale:
  - "event-resonance handoff `aura.after: 0.65` never updated after 2 globals were dropped; true figure 0.55."
  - "works.yaml header 'two more volumes are planned' is firmer than the body's 'this isn't set in stone'."
  - "franchise.yaml startHere prose, and the this-inevitable-ruin edition note, narrate their own editing history - CURATION §2."
  - "everything-in-order description leads with DCC; the derived default opens on the 2003 Shivered Sky volumes."
checkedAndClean:
  - "theme.yaml: sourceSerif and beam both in lib/theme.ts; ink/bg 15.4, muted/surface 5.4, accent/bg 9.8; distinct from brandon-sanderson and chuck-palahniuk."
  - "eras: [] is the finished sourced state; nothing orphaned, no out-of-span warning."
  - "Living-person constraint holds: no person-depicting type used, explicit avoid line in theme.art, type repeats capped 2/9."
  - "Both surviving globalEvents pass the one-sentence test against global.yaml's re-read text."
  - "6 covers looked at: no watermark or badge. Printed volume numbers on II and V confirm the curated order; feral-gods does carry the Ace redesign."
  - "Spoiler fix verified against the live jacket. 103 source URLs swept, 101 live; both failures are bot-blocks."
  - "features {} leaves all four capabilities auto, and an 11-entry timeline is real data behind river and companion. achievements.yaml absent is correct - no era for era_reader."
  - "Author's site rechecked today: nothing new since the completeness audit. No `confidence: low` anywhere."
fixedDirectly:
  - "editions.yaml fischer-tor-2026-de note misnamed the forthcoming German volumes against the publisher page cited in its own entry; corrected to that page's titles."
notApplicableNotAbsent:
  - "eras: [] - no received periodisation exists."
  - "events.yaml [] - every candidate is correctly a lifeEvent."
  - "7 works with no cover and 3 with no edition - split volumes with no per-volume record, uncollected shorts in dead venues, one backmatter-only novella. The ceiling of open sources."
  - "No birthplace on the birth event, and empty pseudonyms/aka - none is sourceable, and he has none."
curatorsCall:
  - "born: 1975 rests on SF Encyclopedia alone; LOC, VIAF, GND and Wikidata carry nothing. The reasoning holds, but it renders flatly in a title for a living person."
  - "This Inevitable Ruin's self-pub edition: unresolved, needs a human on pages that 403 to fetchers."
  - "Book 3's reissue date: the site and Open Library disagree by two months, and the cadence favours Open Library."
forStages: "Owners are named on each blocking and missing finding above."
openQuestions:
  - "works[].note, Edition.note and themePreset are unread by the app - catalogue-wide, not this wing's to settle."
validate: "green after the fix - 0 errors, the 3 inherited warnings."
