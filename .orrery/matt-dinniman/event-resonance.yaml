# event-resonance handoff for matt-dinniman
# Completed 2026-08-09; revised 2026-08-09 after a corrective review re-applied
# the skill's one-sentence test to the three non-obvious rulings.

include:
  - ebook-and-self-publishing-2007  # Kindle and KDP are the literal mechanism he used: no publisher agreed first, he uploaded Dungeon Crawler Carl to Amazon himself in September 2020
  - covid-19-pandemic-2020  # Shut down the pet-show circuit in March 2020, eliminating his income and compelling him to finalize and publish Dungeon Crawler Carl in September 2020

exclude:
  - fantasy-paperback-boom-1965  # LitRPG's lineage runs through web-serial fiction (Royal Road) and game-mechanic conventions, not the mass-market epic-fantasy paperback category this event created; sharing the word "fantasy" is not an inheritance
  - online-bookselling-1995  # This event's actual content is catalogue depth and backlist rediscovery, neither of which describes his path; the self-publishing resonance it gets credited for belongs to ebook-and-self-publishing-2007 and would double-count it here
  - sept-11-2001  # No published work engages with the event or its cultural aftermath
  - financial-crisis-2008  # Lived through it as a working artist but no published work addresses it
  - chain-bookshop-1982  # His self-publishing path emerged independent of the physical bookshop retail model
  - satanic-verses-fatwa-1989  # Published before his career began; had no bearing on his work
  - prestige-fantasy-adaptation-2011  # While Game of Thrones normalized fantasy adaptation, his published books predate this shift and their content does not engage with it
  - booktok-2020  # Dungeon Crawler Carl found its audience through Royal Road serialization and Amazon self-publishing (2019-2020), not through BookTok
  - portugal-bailout-2011  # An American author living in the US; this European economic event had no bearing on his work

leftToDefault: []

reasoning:
  strongest: >
    COVID-19 (March 2020) is the strongest resonance in the catalogue for this
    author: his own lifeEvents show the pandemic ending his pet-show income and
    directly forcing the September 2020 self-publication of Dungeon Crawler Carl.

  revised: >
    Two of the four original includes did not survive a re-test against the
    skill's one-sentence rule and moved to exclude. fantasy-paperback-boom-1965:
    LitRPG's lineage is web-serial/RPG-mechanic (Royal Road), not the mass-market
    epic-fantasy paperback category this event built; the only honest sentence
    was "fantasy exists as a category and his books are fantasy-adjacent," the
    generic reasoning the skill rejects. online-bookselling-1995: its real
    content is catalogue depth and backlist rediscovery, which never happened to
    him; the self-publishing resonance credited to it belongs to
    ebook-and-self-publishing-2007 (Kindle/KDP, the platform he actually used) and
    duplicated it. ebook-and-self-publishing-2007 stayed, comment sharpened to
    name the mechanism directly.

  exclusions: >
    sept-11-2001 and financial-crisis-2008 - lived through both, no work answers
    them. prestige-fantasy-adaptation-2011 - his books predate the shift and
    don't engage it; the TV deal adapted already-successful work, didn't shape
    it. booktok-2020 - his audience came from Royal Road and KDP, before
    BookTok. chain-bookshop-1982, portugal-bailout-2011,
    satanic-verses-fatwa-1989 - no contact with his path (bypassed physical
    retail, US-based, pre-career).

aura:
  before: 0.45 entries per work; 14-year dark run (2003-2016)
  after: 0.65 entries per work; 9-year dark run (2008-2016)
  note: Aura density improved significantly from the pre-stage baseline. A dark run persists (2008-2016), but this stretch falls between his early works and the breakthrough, and is untouched by the corrective review (neither of the two events moved to exclude falls inside 2008-2016, so the dark run is unchanged by the revision). This is a candidate for press-archaeology if future curation finds franchise-specific events that can illuminate it.

pressArchaeology:
  - window: 2008-2016
    note: A 9-year stretch with no aura. Dinniman published The Grinding and Dominion of Blades during this period (2010s/2017-2018), but no franchise-specific or global events currently light them. If these works have documented cultural or life context (reviews, interviews, correspondence), press-archaeology may uncover franchise-specific events that belong in events.yaml rather than the global layer.
