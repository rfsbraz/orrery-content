stage: franchise-research
summary: >
  Scaffolded the matt-dinniman wing from scratch: franchise.yaml, works.yaml
  (20 works: 8-volume ongoing Dungeon Crawler Carl, its backmatter novella,
  The Shivered Sky trilogy, Dominion of Blades x2, 3 other standalones, 2
  uncollected shorts), content/authors/matt-dinniman.yaml (lifeEvents: []),
  theme.yaml (palette/displayFace/signature only), thin eras.yaml/events.yaml
  (both []). No orders.yaml, editions.yaml or achievements.yaml.
  validate.py --slug matt-dinniman clean (one expected warning: no theme.art
  yet, correct at this stage).
