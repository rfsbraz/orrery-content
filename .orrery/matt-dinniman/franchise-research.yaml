forStages:
  completeness-auditor: >
    Verify the 20-work draft. Two open gaps: the Unbroken story, and whether
    the 9th/10th DCC volume (Wikipedia: two more planned, ongoing as of
    2026-08-09) has an announced title/date. Dating is resolved, not open:
    mattdinniman.com gives each DCC volume an original self-pub date (used
    for `published`) and, for volumes 1-6 only, a separate Ace Books
    print-reissue date (2024-2025); volumes 7-8 published direct via Ace.
    Also worth a look: Backstage at the Pineapple Cabaret splitting by part
    (sourced only to ISFDB, the DCC fandom wiki 403'd), and Trailer Park
    Fairy Tales' "twelve stories" (his copy) vs ISFDB's six named titles.
  press-archaeology: >
    A real, well-sourced career-rupture arc is untouched: web-serial writer
    supporting himself drawing pet portraits at cat shows, forced into Amazon
    self-pub when COVID killed that income (2020), acquired by Ace Books
    within four years (2024), now Clarke Award shortlisted with a Peacock TV
    series in development (2026) - Wikipedia cites three independent
    local/regional profiles. lifeEvents deliberately left empty rather than
    half-built. Gap: no exact or yearly birth date sourced anywhere
    (Wikipedia: "ca. 1970s", "Year of birth missing" category) - its cited
    Seattle Met and Grimdark Magazine interviews weren't fetched here and may
    help. Also: he says only "plays bass in one band," no genre given - don't
    add "metal" unsourced.
  eras: >
    eras.yaml ships empty (nothing received/citable), but the raw chronology
    has real shape: a 2003-2019 pre-fame period across four genres, then the
    2019-present LitRPG period built on DCC, with the 2024 Ace acquisition
    as a possible inner divide.
  reading-orders: >
    One startHere path added (DCC #1-#8, receipted against the publisher's
    own numbering). Nothing else sourced. Worth noting: the derived default
    order opens on the 2003 teen trilogy, not DCC.
  visual-language: >
    theme.yaml sets palette (near-black/hazard-yellow-green #0c0f0a/#a8c53a),
    sourceSerif, beam signature, reasoned in-file; art left absent. First
    true LitRPG wing in the catalogue, no direct genre neighbour. Tonal comps
    worth a glance: brandon-sanderson (mechanism-like magic), margaret-atwood
    / chuck-palahniuk (media-and-society satire - DCC is a literal
    reality-TV apocalypse), jim-butcher (horror-comedy, quieter than DCC).
  visual-metadata: >
    No portrait/covers sourced (outside this stage's footprint). Wikipedia's
    infobox alt text references a 2025 AuthorCon photo - check Commons before
    assuming nothing is available.
openQuestions:
  - "Backstage at the Pineapple Cabaret: one apocrypha work as scaffolded, or split by part - its publication mechanism (Ace hardcover backmatter per unread secondary reporting) wasn't independently confirmed; the source that would confirm it 403'd."
  - "9th/10th (final) DCC volume(s): no announced title/date found; recheck, this can change fast for an active bestseller."
  - "Unbroken anthology contribution: add once a story title and release status are confirmed."
  - "No birth date/year sourced anywhere checked - blocks the standard birth-dated opening lifeEvent every wing is expected to carry."
  - "Trailer Park Fairy Tales: his copy says twelve stories, ISFDB names six - not independently reconciled against a table of contents."
