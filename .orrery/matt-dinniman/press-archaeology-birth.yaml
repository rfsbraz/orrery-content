stage: press-archaeology-birth
summary: >
  Narrow follow-up: the eras stage independently surfaced a source
  press-archaeology never reached, The Encyclopedia of Science Fiction
  (sf-encyclopedia.com), whose Dinniman entry gives an unhedged "(1975-
  )" dateline and "born Gig Harbor, Washington?: May 1975" checklist
  line - hedged only on the place. Fetched and read the entry directly to
  confirm the exact wording and hedging. Checked LOC, VIAF, GND and
  Wikidata authority records for a second source; none carry a birth date
  at all, so the year rests on SFE alone. Judged that acceptable for this
  one routine fact (not the CURATION-6 two-source bar, which covers
  health/finance/family/legal, not a birth date), on the strength of SFE's
  own editorial track record and its visible discrimination between what
  it hedges and what it doesn't. Did not adopt the Gig Harbor birthplace:
  it conflicts with the wing's own well-sourced record (KOLD interview,
  already-cited bio material) that Gig Harbor is where he settled as an
  adult in the 2010s, not where he grew up - which every source agrees was
  itinerant, following his father's Army postings, until the family landed
  in Tucson. SFE's own "?" on the place likely reflects the same tension.
