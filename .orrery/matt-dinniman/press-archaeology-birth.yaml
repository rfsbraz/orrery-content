rejected:
  - item: "Gig Harbor, Washington as birthplace"
    why: >
      SFE's own checklist line hedges this clause with a "?" while leaving
      the year/month unhedged. The wing's existing, already-sourced bio
      (KOLD interview, mattdinniman.com/about) establishes he grew up
      moving with his father's Army postings until the family settled in
      Tucson, and that Gig Harbor is where he and his wife settled as
      adults in the 2010s - not a birthplace claim, an adult-residence one.
      Not used; the new lifeEvent's title and description describe the
      Army-postings childhood instead and stay silent on an exact
      birthplace.
notContained: >
  No source checked (SFE included) states a specific birthplace with any
  confidence, or an exact birth day. Library-authority records (LOC, VIAF,
  GND, Wikidata) that sometimes carry independently-sourced birth dates
  have no date on file for this name at all, so the year has exactly one
  source. A human with access to Pierce County or Pima County vital
  records, or a Sabino High School yearbook for a class year consistent
  with a 1975 birth (roughly 1993), could likely pin both the exact date
  and the real birthplace; that is out of this stage's reach.
