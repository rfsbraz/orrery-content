stage: visual-language
summary: >
  Wrote theme.art on the matt-dinniman wing: emblem (a salvaged status
  gauge, welded from mismatched scrap, no numerals or readable markings),
  6 motifs (status gauge/bar, threshold plate marking a level change,
  salvaged/cannibalised wreckage as material, a spotlight/observation
  window implying an unseen broadcast audience, an alert Persian cat
  silhouette or show rosette for Princess Donut, a fortified gauntlet
  checkpoint), atmosphere (a dangerous game show being aired live, not an
  adventure - cold and clinical wherever the System's own marks appear,
  rough and endangered everywhere else; avoids both the anime-power-fantasy
  and cosy-progression-fantasy readings), lineCharacter (one ruling pen
  used two ways - dead straight and mechanically even for anything the
  System itself made, scored and gouged wherever the drawing meets flesh
  or wreckage; the contrast between the two is the wing's identity),
  backgroundTexture (cheap mass-market pulp paperback stock, laminated and
  weathered like reused hazard signage), accentUse (the hazard yellow-green
  lights exactly one status-reading mark per image - a needle, a fill-edge,
  a stencilled notch - never a fill, and the gauge is explicitly kept a
  single dial rather than concentric rings so it cannot be mistaken for the
  orrery motif), and avoid (floating HUD widgets, isekai/anime power-fantasy
  armour and glowing weapons, Donut played as a plush mascot, any likeness
  of the living author, glossy game-concept-art rendering, legible
  in-frame text standing in for the System's readouts).
distinctness: >
  Ran theme_digest.py --exclude matt-dinniman (45 wings). No accent, face
  or background collides outright. Two real adjacencies opened in full and
  addressed in-file: brandon-sanderson (cosmere-metallic) is the only other
  wing whose magic/game system is drawn as a documented mechanism rather
  than spectacle - kept apart by material and register, since Sanderson's
  mechanism is a magic law a scholar studies calmly on blueprint vellum in
  one steady ruled hand, while this wing's mechanism is a game a
  corporation runs on people for ratings, welded from stripped wreckage on
  cheap pulp paper, with its ruled marks breaking down into a scored hand
  wherever they meet the physical world. chuck-palahniuk (clinical-minimal)
  independently shares this wing's unvarying, no-visible-hand ruled line -
  kept apart because Palahniuk holds that line for an entire drawing (an
  institution's laminated calm, unbroken) while this wing only ever holds
  it for half a drawing, and the break itself - the instant a System-made
  mark gives way to flesh, wreckage or weather - is what the wing is
  actually about. One sentence: this wing's drawings differ from its
  nearest neighbours by staging a single visible fracture, inside every
  drawing, between an institution's calm ruled mark and a person's rough
  one, which neither Sanderson's uniformly calm hand nor Palahniuk's
  uniformly clinical one ever does - and that fracture is written into
  lineCharacter and the two comparison paragraphs in theme.yaml.
gates: >
  asset_audit.py matt-dinniman: art:yes, 9 jobs now listed (all life-event;
  0 eras, 0 franchise events, portrait/covers out of this stage's scope).
  validate.py --slug matt-dinniman: 0 errors, 0 art-related warnings (the
  theme.art gate is closed); 3 pre-existing warnings remain, unrelated to
  this stage (eras/reading-orders/spoiler-audit handoff files over the
  700-word soft cap, all inherited from earlier stages, none touched here).
forStages:
  asset-prompt: >
    9 life-event jobs ready (born-1975, dominion-of-blades-addiction-2017,
    meets-jeff-hays-2019, starts-dcc-2019, pandemic-ends-income-2020,
    ace-books-deal-2024, tv-rights-2024, clarke-award-shortlist-2026,
    peacock-series-order-2026). Every one of these is a §3 life event about
    the real, living author - draw the room/object/consequence per §3, never
    his face. None of the 9 is a moment about the fiction itself, so none
    currently license a §3c character reference (Carl, Donut, the dungeon)
    under that section's own test; the cat motif in theme.art is written
    for the day a franchise-event (a franchise milestone, an adaptation
    announcing its identity) actually calls for it, not for these 9.
  eras/franchise-research (future): >
    If a 9th/10th DCC volume, the Peacock series' own visual identity, or a
    franchise-event entry is ever added, the gauge/threshold-plate/broadcast
    motifs already cover it without a theme.art revisit - no new field is
    needed for ordinary series continuation.
