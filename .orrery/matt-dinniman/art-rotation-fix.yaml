stage: art-rotation-fix
summary: >
  Follow-up to wing-audit's `missing` finding on peacock-series-order-2026
  (graded mosaic at impact:med, level with the birth-convention event and the
  wing's one impact:high rupture). Verdict: agree, demoted. Re-read the
  event's description, sources and theme.yaml's art block independently
  before acting - not applied mechanically. Regraded to `beside /
  symbolic-still-life`, matching tv-rights-2024's own treatment as wing-audit
  suggested, with a sourced comment on the entry recording why. Contour
  before: `#.==#===#`. After: `#.==#====` - a trailing run of 4 mids
  (events 6-9: artifact-spread, beside, medallion, beside), clearing
  MAX_FLAT_RUN (fires at n>4) with room to spare, confirmed against the real
  tool rather than by arithmetic alone. `art_rotation.py --check matt-dinniman`
  reports 0 organisation-rotation and 0 pacing problems both before and after
  (composition axis stays 9/9 no-issue throughout - expected pre-asset-prompt,
  not this stage's to fix). `validate.py --slug matt-dinniman` stays 0
  errors, the same 3 inherited handoff-length warnings as baseline.
verdict: >
  Agree with wing-audit. Two things made the demotion hold up on independent
  review, not just on the audit's say-so: (1) tv-rights-2024 is the event
  this one is literally the follow-on to (option optioned in Aug 2024, series
  ordered in June 2026) - same impact:med, same two-outlet trade-press
  register (Deadline for the option; Deadline + Variety + the author's own
  site for the order), and it was already graded `beside`. Grading the sequel
  louder than the event it completes asserts a distinction the sourcing
  doesn't support - both are deal announcements, not reception. (2) mosaic's
  actual spec is "public noise, a crowd" - 4-9 press fragments, "many voices
  at once." What's sourced here is two trade outlets and the author's own
  announcement post: real coverage, but a professional deal report, not a
  crowd. The wing's one candidate for an actual crowd moment (the Aug 2024
  bookstore/TikTok surge press-archaeology flagged as still missing) is a
  different event entirely and isn't this one borrowing its weight.
  mosaic's own "adaptations" use-case is real and was the previous stage's
  stated reasoning for the pick, but "fits the word list" and "reads as a
  crowd" aren't the same test, and only the second is what the organisation
  is for.
produced:
  organisations:
    matt-dinniman-peacock-series-order-2026: "beside / symbolic-still-life (was mosaic / press-media-collage)"
  contourBefore: "#.==#===#"
  contourAfter: "#.==#===="
  organisationCounts: "beside 3/9 (33%), still well under its own ~60% soft ceiling; mosaic 0/9"
judgementCalls: >
  Considered artifact-spread (a deal document) and medallion (an honour-style
  seal) as alternatives to beside. artifact-spread already carries the
  Ace Books deal three events earlier and a TV series order isn't a physical
  document the way a signed print contract or hardcover is, so forcing it
  into an artifact type would be the weaker fit, not a stronger one.
  medallion is the immediately preceding event's organisation
  (clarke-award-shortlist-2026) - a repeat there would break the no-
  neighbour-repeat rule outright. Settled on beside / symbolic-still-life:
  beside because it is exactly what the paired event (tv-rights-2024) already
  uses for the same kind of moment, and symbolic-still-life because
  theme.yaml's own threshold-plate motif ("a gate, hatch or barricade meant
  to be passed once and not again") reads the event's own description of
  this as the beat that "caps" a seven-year journey - a one-way threshold,
  not a crowd scene. Did not reuse tv-rights-2024's network-constellation
  type: two TV-deal events three entries apart sharing an organisation is
  fine per the caps, but a distinct type keeps the pair from reading as the
  same picture twice.
livingPersonCheck: >
  Unchanged from the original art-rotation pass: no likeness of Dinniman.
  symbolic-still-life on this entry draws the threshold-plate object per
  theme.art's own motif list, not a person or a signing ceremony.
forStages:
  asset-prompt: >
    matt-dinniman-peacock-series-order-2026 is now beside / symbolic-
    still-life, images_required 1, no modifier - ground the prompt in
    theme.art's stamped/cast threshold-plate motif (a gate, hatch or
    barricade meant to be passed once, never again), consistent with the
    mechanical-vs-scored line split (this is a System-made mark, so held
    dead straight, no visible hand). Do not draw a press/media-collage
    treatment here; that register now belongs to whatever event eventually
    covers the wing's real crowd moment (Aug 2024 bookstore/TikTok surge),
    which press-archaeology still flags as missing and this stage did not
    add.
