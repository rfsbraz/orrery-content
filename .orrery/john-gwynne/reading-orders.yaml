stage: reading-orders
summary: >
  No ordering dispute exists here the way Wheel of Time or Discworld have
  one (eras.yaml found no periodisation; subseries already carries the
  structure), so the job was narrower: name the Banished Lands as one
  continuous 7-book throughline across its two component series, and answer
  which unconnected setting a newcomer should open with. Both answered by a
  real source: a Dec 2024 r/Fantasy thread ("Which John Gwynne series should
  I start with?", 31 comments, top answer +23), several commenters
  converging on the same admission-order warning and a genuine,
  non-invented split on which series to start with. Bloodsworn Saga and The
  Wolfheart Chronicles get no order of their own - already published in
  strict story order, so the default gives everything an order would. The
  Wolves of War gets no startHere path: forthcoming, no reception yet.
produced:
  - "orders.yaml (new; banished-lands-in-order, 7 novels)"
  - "franchise.yaml (startHere added; 4 paths)"
entryPathDecision: >
  Malice is a real, fandom-endorsed entry point but not the only one: five
  commenters in the same thread call Bloodsworn the stronger, better-paced
  series and recommend it for a reader unwilling to commit to four books
  first - the alternate-entry case the brief asked about, real rather than
  invented. Shipped as two separate paths (malice-start, bloodsworn-start),
  each naming its own cost, rather than one "true" answer.
admissionOrderFinding: >
  Real and explicit. Of Blood and Bone is a direct sequel (130 years later,
  same world), not a second on-ramp, and reader reports converge on that:
  the thread's top-voted comment warns against reading it before Faithful
  and the Fallen, and a second commenter (Kilroy0497) did exactly that and
  reports "wound up confused at first." Corroborated by works.yaml's own
  review sourcing - Publishers Weekly's review of A Time of Dread names a
  surviving character from the first tetralogy's war on the sequel's own
  back-cover copy. Reverse of the classic prequel-spoiler shape (nobody
  proposes reading the later book first), same reader-facing risk: written
  into banished-lands-in-order's rationale/debated and the malice-start /
  banished-lands-complete notes, at premise level, not naming the outcome.
completionistTierFinding: >
  Refines the brief's framing. Re-verified all six anthology stories against
  ISFDB: TWO carry a Faithful-and-the-Fallen tag, not one - "Better to Live
  Than to Die" (Blackguards 2015, "The Faithful and the Fallen universe")
  alongside the known "The Heir Apparent" (Unfettered III 2019). Not new -
  Blackguards' own synopsis states the tag - but its `subseries` field was
  left null where Heir Apparent's was set; flagged for completeness-auditor,
  not fixed here. The other four have no tie to any Gwynne setting ("The
  Message" is tagged to Tchaikovsky's Tales of the Apt; the rest blank), and
  none of the six has an ISFDB Award entry. Both tied stories are named in
  banished-lands-in-order's `debated` and the complete-shelf note; neither
  is added to the order, lacking a confirmed placement.
validator: "validate.py --slug john-gwynne -> 1 pre-existing error (theme.yaml art:), 2 pre-existing handoff-length warnings, 0 new - diffed against the pre-change baseline."
forStages:
  spoiler-audit: >
    Check banished-lands-in-order's rationale/debated and the malice-start /
    banished-lands-complete notes: they name that a character survives the
    first tetralogy's war and that cold-reading Of Blood and Bone causes
    confusion, without stating the outcome or the character - verify
    personally, the "order prose is under-checked" risk. Both
    unconnected-setting paths stay at premise level.
  wing-audit: >
    banished-lands-in-order is a partial order (7 of 17, novels only) and
    says so; its two universe-tied anthology stories are named in `debated`,
    not dropped silently. No order for Bloodsworn or Wolfheart - deliberate.
    Re-derive this order's scope after any future completeness pass: a new
    Banished Lands novel or timeline-placed story stales its 7-work list and
    "seven books" prose together. The Wolfheart startHere gap is
    deliberate - revisit once The Wolves of War publishes (2026-11-03).
openQuestions:
  - "One thread, not several guides - clears the weakest sourcing tier on
    many commenters converging inside it, not multiple sources. A second
    citation would help (grimdarkmagazine.com, beforewegoblog.com,
    palatinate.org.uk all 403 direct per eras.yaml; archive.org unchecked)."
  - "Blackguards' subseries: null vs Heir Apparent's populated field: a
    works.yaml inconsistency, flagged for completeness-auditor, not fixed
    here."
  - "Whether Of Blood and Bone's setup is a stated spoiler or just reader
    confusion was not settled; left open in orders.yaml's debated field
    rather than guessed."
