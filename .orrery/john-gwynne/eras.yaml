stage: eras
summary: >
  No received periodisation exists for this career. Searched the author's own
  framing, criticism, reference works, fandom and the publishing record, in
  English (his working and critical language) and Portuguese (this
  catalogue's reading language, where the question cannot arise - no title is
  translated into Portuguese, the Portuguese trade carries him as
  English-language import stock). Shipped `eras: []` with the full negative
  finding recorded in the file, the Grisham-wing pattern. The three shapes
  that look like boundaries all fail, and the failures are the useful part.
verdict: NONE RECEIVED - eras is empty and complete
laddersSearched:
  rung1_author: >
    Real material, wrong kind. Gwynne marks the 2021 move himself ("my first
    book in a new world away from the Banished Lands"; "I've spent my whole
    writing career in the Banished Lands, the best part of twenty years since
    I started writing Malice"), but what he names is a SETTING, which
    `subseries` already carries. In the same answer he hedges it ("there are
    also similarities. Family and friendship are themes that I will always
    write about") and by 2024 describes the whole shelf as one continuous
    method: "I had two rules as I started writing with Malice, and they have
    stayed with me"; "I have had a mantra through all my books. Epic and
    intimate"; the next book "will be inspired by mythology and history, as
    all my books are". On craft, 2021: "I've always approached writing combat
    in the same way." The author's own testimony argues AGAINST periodisation.
  rung2_critical: >
    Empty. No book-length study, no reference-work career article, no
    obituary (alive and publishing; The Wolves of War is announced for
    November 2026). Wikipedia's "Career" section is three undivided sentences
    running series by series, and its bibliography groups by series and
    nothing else. The fullest career profile, Palatinate (Feb 2025), narrates
    one unbroken line and reports the working method as invariant per project.
  rung3_fandom: >
    Empty. r/Fantasy - the forum that produced the Wheel of Time "slog" -
    discusses Gwynne book by book across review threads, bingo posts and
    top-novel polls with no phase term in circulation and no argument about
    where any period ends.
  rung4_publishing: >
    Fails on FIT, not truth - the trap the skill names. The tempting fact is a
    2021 Tor UK / Pan Macmillan -> Orbit move, and it is half true: Orbit has
    published him in the US since a 2013 Malice edition, unbroken through A
    Time of Courage (2020) into the Bloodsworn books. Only the UK imprint
    changed. "The Orbit years" would be false of the nine books it excluded;
    "the Tor UK years" would render a one-market fact full-bleed.
rejectedBoundaries:
  - shape: "2021 world change (Banished Lands -> Vigrið)"
    why: "A setting, already stated by `subseries`; an era plate would restate it in a larger font or coin a period name over the author's own word for it."
  - shape: "2021 publisher change"
    why: "Territorial, not authorial - Orbit is continuous in the US from 2013."
  - shape: "the 2021-2023 silence (Harriett Gwynne's death, Sept 2021; no writing until end of 2023)"
    why: >
      The one boundary in this career that can be dated and named, and not one
      to draw. No source periodises the work around it, one published novel
      stands on its far side, and the change Gwynne describes is to himself
      ("the loss made me more attuned to the fragility of life"), not to a
      body of work anyone has grouped since. It belongs to the author's life
      record, not to a full-bleed plate.
nearMiss: >
  Nils Shukla's Fantasy Hive review of The Shadow of the Gods (Mar 2021):
  "the characters you will find in this book are a far cry from the heroes of
  Gwynne's previous works. There are no heroes here." One reviewer, one book,
  at the same site whose interviews are the other main source - an observation
  about a novel, naming no period, picked up by nobody. Recorded in the file
  so a later pass does not mistake it for a periodisation.
languagesSearched: ["English (primary - his writing and critical language)", "Portuguese (no translations exist; Bertrand lists English imports only)"]
sourcesRefused: >
  grimdarkmagazine.com, kobo.com, beforewegoblog.com and palatinate.org.uk all
  403 direct requests; Grimdark and Palatinate were read through
  web.archive.org captures instead. Reddit's JSON endpoints 403; old.reddit.com
  search HTML works. Orbit's and Goodreads' author pages are JS shells with no
  bio in the served HTML.
validator: "validate.py --slug john-gwynne -> OK, 0 errors, 1 pre-existing warning (theme.yaml art: block, not this stage's). Guard verified by deliberate failure: a bogus era makes the validator emit 9 orphan warnings and escalate the theme.yaml warning to an error."
forStages:
  event-resonance: >
    The aura for this wing has to come from events and life events, not eras -
    there are no era plates and there will not be any. Two anchors are dated,
    sourced and first-person, both in the Fantasy Hive interviews cited in
    eras.yaml: the 2021 departure from the Banished Lands after ~20 years in
    one world, and the writing silence from April 2021 to the end of 2023.
    Handle the second with the register it deserves; the file explains why it
    is not an era, which is not the same as saying it is not an event.
  reading-orders: >
    `subseries` is doing ALL the periodising work in this wing, so it is also
    the only structural signal a reading path can lean on. The three real
    entry points are the ones the author's own framing supports: the Banished
    Lands as one seven-book run (Faithful and the Fallen then Of Blood and
    Bone, 130 years later), the Bloodsworn Saga standalone (needs no prior
    reading - he built it as a clean break), and The Wolfheart Chronicles as a
    third, unconnected door from Nov 2026. Do not import an era vocabulary
    that does not exist.
  wing-audit: >
    All 17 works fall outside every era and that is CORRECT, not a coverage
    defect - the eras skill supersedes the audit's "era coverage gaps" finding
    (provenance outranks tidiness). Do not close the gap by inventing an era.
    Separately, a real finding for whoever owns theme.yaml: while the wing has
    zero aura, the missing `art:` block is only a warning; the moment it gains
    any era, event or life event, validate.py escalates it to a BLOCKING
    error. Verified by deliberate test. So visual-language must land before
    event-resonance ships anything, or CI goes red.
openQuestions:
  - "The empty finding is a snapshot of a mid-career author. It is worth re-testing after the fourth setting lands (The Wolves of War, Nov 2026) and again whenever a first book-length study or a career retrospective appears - a fourth world may be the point at which critics start drawing lines."
