stage: franchise-research
summary: >
  Scaffolded the John Gwynne wing from scratch: 16 works (10 core novels, 6
  apocrypha anthology contributions), 1 author entity, franchise identity and
  a validated theme (displayFace/signature only). No prior content existed
  for this slug. Corrected two dates against the request issue's own
  recollection: Valour is 2014 (not 2013), Ruin is 2015 (not 2014).
