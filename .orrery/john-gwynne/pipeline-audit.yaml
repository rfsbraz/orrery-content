auraWhackAMoleSecondConfirmation:
  claim: >
    Second wing in a row (after haruki-murakami) where the post-margaret-
    atwood/haruki-murakami skill-file coaching on aura/dark-run handling
    worked as intended on the first pass, at zero extra dispatch cost.
  eventResonanceReDerivation: >
    Read .orrery/john-gwynne/event-resonance.yaml in full. It explicitly
    tested the counterfactual before ruling: excluding covid-19-pandemic-2020
    "would have reopened a 6-year gap, 2018-2023" is not asserted, it is the
    stage's own stated reason for checking, and the entry was kept on an
    independently sourced merit (Gwynne's 2021 Q&A: the pandemic halted his
    Viking re-enactment training "for the last year or so", the shieldwall
    practice credited for how he writes combat) rather than to game the
    count - the write-up frames it explicitly as "not a lived-through-it
    default" and cites the source before the inclusion. The
    forStages.press-archaeology block states the aura_density.py re-run
    happened AFTER finalizing the ruling, not only before: "dark run holds at
    3 years (2014-2016), unchanged from the pre-ruling figure despite aura
    dropping from 15 to 7". Both specific claims in the brief hold up exactly
    as described.
  pressArchaeologyReDerivation: >
    Read .orrery/john-gwynne/press-archaeology.yaml in full. Its summary
    states plainly that stage_plan.py flagged one dark run (2012-2019, the
    tool's documented single-worst-run limit) and that scanning the whole
    2012-2026 span by hand - per the skill's own "scan the whole span, not
    just the flagged window" instruction - surfaced a second, unflagged
    8-year-adjacent window at 2021-2026 (6 years, masked only by two
    catalogue-wide globals landing in 2020). Both were closed in the SAME
    dispatch with real, sourced, personal-to-Gwynne facts: the 2013 Gemmell
    Morningstar win + 2015-2017 Legend nomination streak inside the first
    window, The Fury of the Gods' 2024 NYT bestseller listing inside the
    second. This matches the brief's claim exactly - one dispatch, two
    windows closed, no follow-up pass needed.
  costOfKeepingItClean: >
    Zero additional tokens beyond the two stages' own single, normal
    dispatches (event-resonance 128,915 tokens/49 calls; press-archaeology
    218,515 tokens/87 calls - both already counted once in the cost table
    above, no rescue pass exists in the git log or the orchestrator's table).
    Compare margaret-atwood's 3-pass/~563k-token correction chain and
    haruki-murakami's 1-pass/~138k-token fix: john-gwynne needed 0 passes and
    0k tokens beyond ordinary stage work. The coaching baked into
    event-resonance's and press-archaeology's skill files after those two
    wings is now producing correct output on the FIRST attempt, which is
    exactly what "fix the skill, not the wing" is supposed to buy. Two data
    points running (haruki-murakami, john-gwynne) is not yet "always works",
    but it is no longer a single lucky result either.

footprintCheck:
  result: "No violations found on any of the three named pairs, and one of the three named pairs did not actually collide this run."
  pairs:
    - files: content/franchises/john-gwynne/franchise.yaml
      stages: [event-resonance (f0334f2), reading-orders (d50201a)]
      finding: >
        Disjoint sections, not rework. event-resonance's diff (+31 lines,
        pure insertion) added only the globalEvents block. reading-orders'
        diff (+106 lines, pure insertion, committed later in the same linear
        history) added only the startHere block further down the file.
        Neither diff touches a line the other wrote. Sequential in the
        merged history, not concurrent branches, so there was never a merge
        risk here either - the "collision pair" label describes two stages
        that share a file, not two stages that competed for the same lines.
    - files: content/franchises/john-gwynne/works.yaml
      stages: [spoiler-audit (04734e2), visual-metadata (88863d0)]
      finding: >
        Disjoint fields. spoiler-audit's diff (176 lines, mixed +/- - a real
        rewrite) touches synopsis text and orders.yaml's debated notes.
        visual-metadata's diff on the same file (137 lines, pure insertion,
        committed later) adds only images.cover/coverCredit/coverSource
        blocks. No overlapping line ranges, no field visual-metadata touched
        was previously written by spoiler-audit or vice versa.
    - files: content/authors/john-gwynne.yaml
      stages: [art-rotation (7a292f8), visual-metadata (88863d0)]
      finding: >
        Not a real collision this run. art-rotation's commit touches ONLY
        .orrery/john-gwynne/art-rotation.yaml (its own handoff, 84 lines) -
        its stated outcome was "confirm the 5-event grading, no plates to
        grade", and it made zero changes to any content file. Only
        visual-metadata touched content/authors/john-gwynne.yaml this run
        (adding portrait/header images, +12 lines, pure insertion). Worth
        the orchestrator knowing the pair as named doesn't reflect an actual
        shared-file touch on this wing - it may be a pairing that DOES
        collide on wings where art-rotation has plates to grade (which would
        add organisation/modifier fields to the same author file
        visual-metadata writes images to), just not this one.
  wingAuditOwnFix: >
    0cc06b3 ("null subseries on both anthology contributions, not one")
    touches only content/franchises/john-gwynne/works.yaml, a 2-line diff
    (both anthology entries' subseries field, string -> null). Exactly
    matches its stated footprint and its stated fix - no drift into
    orders.yaml, franchise.yaml, or either locale despite the earlier
    partial fix (bf032ac, during reading-orders) having touched only one of
    the two entries. Confirmed by reading the full diff, not just the commit
    subject.

systemicFindings:
  - id: authorRole-and-contributionTitle-unread-by-app
    status: confirmed, independently re-derived
    evidence: >
      Grepped the app repo (/home/rfsbraz/apps/orrery) directly: zero hits
      for "authorRole" and zero for "contributionTitle" across every .ts/.tsx
      file. lib/content/types.ts's Work interface (~lines 121-155) has no
      such fields at all - images, canonTier, subseries, format, featured,
      publishedAs, withAuthorIds, synopsis, externalIds are all there;
      authorRole and contributionTitle are not. docs/SCHEMA.md documents both
      (lines 209-210, 362-374) with the field's explicit stated purpose: let
      a wing record a contributor credit "without making a false claim" that
      the author wrote the whole book, anthology contribution as the worked
      example. scripts/validate.py (lines 789-798) DOES check the fields -
      valid role enum, apocrypha-tier requirement for non-author roles,
      contributionTitle-requires-non-author-role - so they are validated for
      internal consistency but genuinely never reach a reader; the app has no
      code path that reads them at all, not even to drop them silently.
      Counted the wing footprint myself in orrery-content: 14 wings on main
      use contributionTitle (brandon-sanderson, chuck-palahniuk,
      edgar-allan-poe, gillian-flynn, harlan-coben, hp-lovecraft, jk-rowling,
      john-grisham, jo-nesbo, jose-saramago, jrr-tolkien, lee-child,
      tana-french, valter-hugo-mae) + john-gwynne itself (7 occurrences in
      this worktree, not yet merged) = 15, matching wing-audit's count
      exactly.
    consequence: >
      Confirmed concretely for this wing: Blackguards and Unfettered III (the
      two anthology entries wing-audit just set subseries: null on) each
      carry authorRole: contributor and a contributionTitle naming the actual
      story - none of it renders. Post-fix, each entry shows as an ungrouped
      standalone work with no visible marker that it's a contribution rather
      than a Gwynne-authored book, and no visible story title. Same shape as
      the images.header-not-rendered finding from a prior wing: real,
      declared, unread. Reporting informational only, per this stage's
      remit - not proposing a content fix, this is app/schema work.
  - id: dateRange-undocumented-and-organisation-scoped
    status: confirmed, independently re-derived
    evidence: >
      Grepped docs/SCHEMA.md and docs/LAYOUT.md in orrery-content: zero
      mentions of dateRange in either. Grepped scripts/validate.py: zero
      mentions - the field is never format-checked. Grepped the app repo for
      every use: typed at lib/content/types.ts:61, read for sort ordering at
      lib/content/index.ts:304-306 ("First year of an event's date/dateRange,
      for sorting"), and rendered in exactly one place -
      components/river/passage.tsx:43, `event.dateRange ?? String(event.date)`
      - which only runs for events graded organisation: passage.
      components/timeline.tsx:12 and a translation-structure test reference
      it only as a date-presence fallback, not a render path. Counted the
      wing footprint: 12 wings on orrery-content main use dateRange in
      content/authors + john-gwynne = 13, matching wing-audit's count.
    consequence: >
      Confirmed the specific case wing-audit named: john-gwynne.yaml's
      gwynne-leaves-teaching-writes-malice-2001 lifeEvent carries dateRange
      "2001-2012" but is graded organisation: immersion, so a reader never
      sees the span the entry's own argument depends on (the two-year silence
      after Harriett's death is a separate, later entry entirely). The field
      genuinely does something real for 13 wings' worth of passage-graded
      events and genuinely nothing for however many of those 13 also set it
      on non-passage events (not counted here - out of this stage's 15-call
      budget to enumerate).
    proposedFix: >
      Document the field's actual scope rather than extend or remove it:
      SCHEMA.md should state plainly that dateRange only renders under
      organisation: passage and is otherwise curator-facing metadata with no
      reader-visible effect. Extending rendering to more organisations is a
      real design option but a heavier, riskier one (LAYOUT.md would need a
      per-organisation ruling on whether a range belongs in that treatment,
      not just a schema note) and stripping it from 13 wings throws away
      curator-facing information that is harmless where it currently sits
      inert. Documenting the true scope is the smallest honest fix and is
      also the one wing-audit itself reached for on the sibling authorRole
      finding (left as curatorsCall, not a mandate) - same posture applies
      here.

whatIsAlreadyFine: >
  Examined and proposing nothing for: event-resonance, press-archaeology
  (both the whack-a-mole subject, both healthy on cost and on the second-
  confirmation above), franchise-research, completeness-auditor, eras,
  editions (the retry cost 180,177 tokens once, cleanly, with no partial-work
  cleanup needed - the failure-recovery path worked as designed),
  translation, art-rotation (cheapest stage in the run at 97,124 tokens/30
  calls, correctly cheap for a dispatch that found nothing to grade),
  visual-language. Not proposing tier changes for wing-audit or spoiler-audit
  either - both opus, both carrying silent-failure-mode judgement calls
  (the six-book rendering bug, the Harriett ruling, nine synopsis rewrites
  against the wrong jacket) that justify the tier regardless of cost.

whatICouldNotReach: >
  No per-call transcript for any stage, so "high call count, unremarkable
  average" (reading-orders, spoiler-audit) could not be distinguished from a
  genuinely healthy pattern of many small necessary verifications versus a
  cheap-but-repetitive loop hiding inside a normal-looking average - flagging
  the distinction as unresolved rather than picking a side. Did not enumerate
  how many of the 13 dateRange-using wings set it on a non-passage-graded
  event (out of budget for this stage; the john-gwynne instance alone was
  enough to confirm the finding is real). Did not re-verify press-
  archaeology's or event-resonance's underlying historical/biographical
  claims - that is wing-audit's and the owning stage's job, not this one's,
  per this skill's own scope rule.

