stage: wing-audit
wing: john-gwynne
summary: >
  Two blocking defects, both cross-layer and invisible to any single stage.
  (1) The Faithful and the Fallen renders as a SIX-book series - Malice #1,
  Valour #2, Blackguards #3, Ruin #4, Wrath #5, Unfettered III #6 - because
  two contributor anthologies carry `subseries`, while every line of prose in
  both locales calls it a tetralogy. (2) `authorRole` and `contributionTitle`
  are not modelled by the app at all, so the six anthologies make exactly the
  false claim SCHEMA says those fields prevent. Separately, the wing named
  Gwynne's profoundly disabled daughter Harriett in a 2001 lifeEvent and never
  recorded that she died in September 2021 or that he then wrote nothing for
  two years; resolved here under explicit authorisation (see the ruling
  below). Of the claims the brief asked me to distrust, two held under
  independent verification (the "a century" figure, The Wolves of War) and
  one did not: press-archaeology and eras were describing the SAME daughter.

baseline: "validate 0 errors / 3 pre-existing warnings; i18n pt-PT 198/212, this wing fully covered; event_density 19 globals, high 2 of ~17; aura 17 works / 7 aura / 0.41 per work / 3-yr dark run; art_rotation 5 events, 0 rotation and 0 pacing problems, contour =#=.#"
after: "validate 0 errors, 0 new; i18n unchanged (overlay mirrored in the same commit, no base/overlay drift at the tip); aura 8 / 0.47 per work, dark run unchanged, 6 lifeEvents now inside CURATION §6's 6-12 band; art_rotation 6 events, still 0 and 0, contour =#=..#, interlude 1 of its cap of 1"

produced:
  - "content/authors/john-gwynne.yaml (lifeEvents 5 -> 6, header comment updated)"
  - "content/i18n/pt-PT/authors/john-gwynne.yaml (pt-PT mirror)"
  - "content/franchises/john-gwynne/works.yaml + franchise.yaml (3 comment corrections)"

blocking:
  - id: subseries-numbers-the-tetralogy-as-six-books
    owner: completeness-auditor
    checked: "lib/content/river.ts:107 groups by `subseries`, sorts by published then id, emits '#n of total'; timeline.tsx:89 and river/work-card.tsx render it. Re-derived the grouping from works.yaml."
    found: "Wrath, the tetralogy's finale, renders as book 5 of 6; Blackguards (a story Gwynne contributed) as book 3; Ruin displaced. franchise.yaml, orders.yaml, works.yaml's header, two startHere notes and the whole pt-PT overlay all say tetralogy/four books. Prose contradicts rendered data. Half predates the audit (Unfettered III since franchise-research); commit bf032ac during reading-orders doubled it while correcting a real inconsistency in good faith."
    evidence: "ISFDB tags Blackguards' story to the Faithful and the Fallen UNIVERSE - the parent spanning both series 130 years apart - which works.yaml's header and orders.yaml's `debated` both take care to distinguish from the tetralogy tag Unfettered III carries. The commit collapsed that distinction; `subseries` has no universe-level value here to hold it."
    recommendation: "Set BOTH anthologies to `subseries: null`. The universe tie is already in each synopsis and named twice in `debated`. Reverting Blackguards alone re-opens the inconsistency reading-orders correctly flagged."
    notAConflict: "Checked the specific worry: `banished-lands-in-order.debated` does not reference the old null state. It argues from the ISFDB tags and from unconfirmed placement, both still true either way. No rewrite needed there."

  - id: authorRole-and-contributionTitle-are-inert
    owner: the curator (schema/app) - no content skill owns this
    checked: "grep across the app repo returns nothing outside `withAuthorIds`; lib/content/types.ts:125-155 models neither field."
    found: "SCHEMA says `authorRole` exists so a wing can hold completionist data 'without making a false claim', with an anthology contribution as its worked example. The app cannot make that distinction, so the six anthologies render as John Gwynne books. `contributionTitle` carries six story titles that never reach a reader. The `images.cover` failure repeating; 15 wings use contributionTitle. `format: anthology` does render, which says what the volume is, not what this author did to it."

missing:
  - id: dateRange-undocumented-and-organisation-dependent
    owner: the curator (schema)
    checked: "0 mentions in docs/SCHEMA.md, docs/LAYOUT.md and scripts/validate.py. Typed at lib/content/types.ts:61, sorted at index.ts:306, rendered only at components/river/passage.tsx:43. 13 author files use it."
    found: "A field on 13 wings the schema never defines and the validator never format-checks, rendered only when the entry is a `passage`. Here the 2017 passage shows its range; the 2001 immersion and the new 2021 interlude do not, so the 2001-2012 span that entry's argument rests on is curator-facing only."

  - id: no-franchise-events-no-achievements
    owner: none - correct state, recorded so it is not opened as work
    found: "Both right. Nothing rose to a genre-wide moment (a 2010s epic-fantasy boom has no source naming Gwynne the way Grisham and Turow are named for theirs). Achievements are opt-in and this wing has no era, no hard completion and one order over 7 of 17 works - generic badges would be worse than none."

stale:
  - id: fixed-in-place-by-this-stage
    what: "Three comments corrected in c646fd7, no editorial judgement in any: (1) The Wolves of War's cover comment said isbn/9780356527871 404s and that OL holds no record - it returns 200 and the same URL is cited in that entry's own `sources` two lines below; re-verified live, the record resolves, carries no cover, and its work OL45398326W is a duplicate under author OL7519906A not Gwynne's OL2501358A. (2) Two 'revisit once...' directives dropped (that comment, franchise.yaml's startHere block) - CURATION §2's addressing-somebody form, which validate.py's keyword scan does not catch. (3) The Shadow of the Gods' note blamed 'reader summaries' for the rival three-hundred-year dating; it circulates more widely, including in published review writing, so the provenance claim was dropped rather than replaced with one not opened end to end."
  - id: press-archaeology-open-question-still-open
    owner: press-archaeology
    found: "Its handoff flags that web search was unavailable for nearly all of that pass and names a convention guest-of-honour appearance or an adaptation deal as what a broader search would have surfaced. Still unretested - this audit's search budget was exhausted too. A documented negative nobody retests becomes folklore."
  - id: 2001-entry-register
    owner: press-archaeology
    found: "The 2001 entry reads 'his daughter Harriett, who IS profoundly disabled'. Defensible as historical present and now bracketed by the 2021 entry, but the birth entry beside it is past tense, so the wing mixes registers and a reader meeting the 2001 card alone reads a present-tense claim about someone who died in 2021. Not touched: that stage's prose, and the fix is a rewrite not a word."

checkedAndClean:
  centuryFigure: "spoiler-audit's call is right. Fetched OL's work record OL24243445W, which carries the UK jacket verbatim: 'A century has passed since the gods fought and drove themselves to extinction.' works.yaml matches word for word; pt-PT carries 'Passou um século'. Orbit's own pages are JS shells, which is why the earlier pass could not quote them. The three-hundred-year figure appears in SFF180's review, so it is not confined to reader summaries - but it is not the publisher's figure either. RESIDUAL: nobody has checked which figure the BOOK'S text uses; if three hundred, the wing faithfully reproduces a publisher error. Needs the book, not a source."
  wolvesOfWar: "Real. Amazon UK: Orbit, 3 Nov. 2026, ISBN-13 978-0356527871, 496pp, plus jacket copy matching the synopsis. PW's database carries title and author under the same ISBN. OL's edition record exists (created 2026-05-10). Three independent registrations. `forthcoming: 2026-11-03` / `published: 2026` is the correct mechanism, the validator enforces year agreement, and work-card.tsx:122 renders a Forthcoming label - it is not dated as published anywhere a reader sees."
  translation: "Read four synopses side by side (Malice, Valour, A Time of Dread, The Shadow of the Gods) plus the whole pt-PT orders overlay and bio. All hold the English's reticence: no war outcome, no death, no survivor named beyond the source. 'A century and a third after the God-War' -> 'Um século e um terço depois da guerra profetizada' preserves interval and the deliberate non-coining. `debated` stays at premise level, including its refusal to settle spoil-versus-confuse. One nit: Fury's 'slaying a dragon' -> 'dar caça a um dragão' (hunting), more conservative than the English, not less."
  covers: "Downloaded six and looked at them as a contact sheet - Malice, A Time of Dread, Blackguards and all three Bloodsworn. All plain trade jackets: no watermark, no retailer badge, no sprayed-edge boxed-set photo, no placeholder. The three Bloodsworn overrides were real and correct. Each work's comment describes its jacket accurately. Blackguards is the right anthology (Gwynne in the cover's own author list)."
  pipelineNarration: "Swept both locales for the vocabulary form and the three forms §2 says slip past it. Vocabulary hits all false positives (Queen Rhin's 'agents', 'agented' publishing). Two real addressing-somebody instances survived every stage and validate.py's scan; both fixed. No rejected-claim form: eras.yaml declined the bereavement as a PERIODISATION on stated grounds, not under the two-source bar. pt-PT files carry no narration."
  sources: "14 cited URLs link-checked, all 200. Confirmed two resolve to the RIGHT thing: isfdb title.cgi?2128408 is 'Better to Live Than to Die', and PW 9780316502245 carries the exact quoted sentence about Sig, which is load-bearing for the whole shared-Banished-Lands ruling."
  eras: "Every ladder genuinely empty; the 2021-world-change and publisher-move rejections are both right and specific (Orbit is continuous in the US from 2013; only the UK imprint changed). All 17 works outside every era is correct, not a coverage defect. Do not close by tiling."
  theme: "`sourceSerif` is in lib/theme.ts:26-28, `beam` in SignatureKind. Contrast: ink/bg 14.85, ink/surface 13.57, muted/surface 5.04, muted/bg 5.52 - all clear AA. Accent/bg 1.9 is fine for the rail it is specified as and would fail as text; theme.yaml already says never as a wash."
  capabilities: "No `features` block, so all auto, each checked against data not flag. wizard: 4 paths, all workIds and the one orderId resolve to the right targets. editions: 19 entries over 17/17 works. river/companion: 8 aura over 1968-2026, and re-derived catalogue-wide this wing is above the median at 0.47 per work with the SHORTEST dark run of all 32 wings - not empty sky. globalEvents present and real ruling (8 of 10 arithmetically-reaching globals refused)."
  preBirthGlobal: "fantasy-paperback-boom-1965 predates the 1968 birth, which looks like the João Tordo defect. Derived the test catalogue-wide: four wings carry a pre-birth inclusion and Gwynne's 3-year gap is the smallest of the three paperback-boom ones (Sanderson 10, Butcher 6). Established practice, better evidenced here than Sanderson's note-free entry. Not a defect."

notApplicableNotAbsent:
  - "3 of 17 works with no cover. The Wolves of War has not published and no licensable jacket exists; Journeys and Art of War are a CreateSpace and a small-press anthology, each one OL edition record with no cover ever attached. 14/17 is the ceiling, not a shortfall."
  - "1 of 10 published novels has a Portuguese edition. Asa published A Sombra dos Deuses (2022) and did not continue. A full wook.pt Wayback sweep returns four hits, all that book. The market, not the research."
  - "eras: [] - no received periodisation exists and none should be coined."
  - "No franchise events.yaml, no achievements.yaml - both correct states."
  - "No spoiler boundaries. Correct: no franchise events, and all six lifeEvents spoil nothing, so rewriting the nine synopses was the only lever and it was used."

theDaughtersDeathRuling: >
  ADDED, as gwynne-harriett-dies-2021. The brief's own hypothesis was the
  finding: these are the SAME daughter. The asunbookstore Q&A press-archaeology
  cited (dated to Shadow of the Gods' 6 May 2021 publication) reads "My
  daughter Harriett is profoundly disabled, and my wife Caroline and I are her
  carers"; Fantasy Hive (22 Oct 2024) reads "I finished The Hunger of the Gods
  in April 2021, and then in September 2021 Harriett died." Four months apart.
  No second daughter, no conflation to unpick - a wing publishing the first
  half of a fact and not the second.

  Sourcing clears §6: two independently published, dated, first-person
  tellings - Fantasy Hive and Dan Bavister's Palatinate profile (12 Feb 2025,
  "In 2021, his daughter Harriett passed away unexpectedly"). Both opened and
  read here rather than inherited; Palatinate 403s direct and was read via its
  Wayback capture. Same bar the 2001 entry already meets.

  On his-own-loss versus a third party's: the catalogue has answered it, and
  BOTH precedents are third-party deaths on a living author's timeline -
  Coben's father and Atwood's Graeme Gibson, each high/immersion/
  portrait-of-absence, the Atwood one including Gibson's dementia. No practice
  exists of treating an author's own bereavement more cautiously.

  On Harriett's privacy, the real weight on the other side: already spent
  before this audit began, since the wing publishes her name and disability
  from Gwynne's own Q&A. The choice was not publish-or-not but "publish the
  care and stop in 2001" versus "publish the care and record what he has said
  happened", and the first is the more intrusive: it leaves a named,
  profoundly disabled private person indefinitely presented as a live caring
  arrangement. The fact earning the slot is the author's own inner weather
  (§6 tier 1) - two years in which he "had not written a word", the
  documented reason the 2022-2024 gap in the shelf exists. He raised it
  himself, unprompted, asked how it felt to finish the saga: "it is
  impossible to talk about writing it without talking about my beautiful
  daughter, Harriett."

  Restraint: no cause is stated in either source and none is stated here; his
  sons are not named. Graded interlude / portrait-of-absence, LAYOUT's own Use
  line for `interlude` being "grief, disappearance, creative silence" and the
  only organisation whose device is emptiness. NOT a second immersion: a loud
  cell at 2021 sits against the loud 2024 mosaic and art_rotation would flag
  the pair, and a full-bleed rupture is the wrong register here.

  Side effect worth noting: eras.yaml asserts the bereavement "belongs to the
  author's life record, where it is sourced and dated". That was false when
  written; the entry makes it true. eras.yaml's own ruling is untouched.

curatorsCall:
  - "The death entry itself. Reverting c54904b restores the prior state exactly - but that state publishes Harriett's name and disability in the present tense with no further record, which this audit considers the worse of the two."
  - "The two anthology `subseries` values. The recommendation contradicts a direct commit made in good faith during reading-orders; the point is that the consistent state it reached is the wrong one, because the app numbers a subseries and a contributor anthology is not a volume of the tetralogy."
  - "Whether the app should model `authorRole` and `contributionTitle`. App-side, not content work, and the second time this catalogue has shipped a curated field the product never reads."

openQuestions:
  - "Which figure The Shadow of the Gods' own text uses for the gods' fall. Needs the book, not a source."
  - "The press-archaeology search gap (convention appearance, adaptation deal) carries forward untested - this stage's search budget was exhausted too."

note: >
  This handoff exceeds the 700-word soft cap. wing-audit is the terminal
  content stage, so no later stage pays to read it; the warning's own
  rationale does not apply here, and the alternative was dropping findings.
