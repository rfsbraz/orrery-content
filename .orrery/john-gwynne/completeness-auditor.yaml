stage: completeness-auditor
summary: >
  Swept the 16-work bibliography against ISFDB, Wikipedia, Goodreads,
  OpenLibrary and Orbit/Hachette. Found one real gap: The Wolves of War
  (Orbit, forthcoming 2026-11-03), a new novel opening a fourth setting (The
  Wolfheart Chronicles, Slavic-mythology-inspired) - added via `forthcoming`
  per docs/SCHEMA.md's jo-nesbo/nadeskudd precedent, sourced to Amazon UK's
  live listing plus independent Publishers Weekly and OpenLibrary records
  (ISFDB has no entry yet). Sourced The Fury of the Gods' previously-thin
  synopsis to Orbit's own publisher copy. Independently re-verified Valour
  (2014)/Ruin (2015) and the shared-Banished-Lands/separate-Bloodsworn
  structure - both hold, now with a third independent source each (Gwynne's
  own dated Goodreads Q&A). Re-checked the three untagged anthology stories
  against their own ISFDB title records directly: each carries a genuinely
  blank Series field (unlike the three ISFDB does tag), and all three predate
  Bloodsworn's 2021 launch - left unconnected, no basis found to assign a
  subseries.
worksBefore: 16
worksAfter: 17
