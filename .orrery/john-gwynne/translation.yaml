stage: translation
summary: >
  Full pt-PT overlay for the wing: franchise description + 4 startHere
  paths, all 17 work synopses, the 5 author lifeEvents (+ bio), and the one
  order's rationale + both debated entries. i18n_coverage.py moves the wing
  from MISSING to fully covered (194/212 -> 198/212 files catalogue-wide, no
  other wing touched). validate.py --slug john-gwynne: 0 errors.
produced:
  - "content/i18n/pt-PT/authors/john-gwynne.yaml (new; bio + 5 lifeEvents)"
  - "content/i18n/pt-PT/franchises/john-gwynne/franchise.yaml (new; description + 4 startHere paths)"
  - "content/i18n/pt-PT/franchises/john-gwynne/works.yaml (new; 17 synopses)"
  - "content/i18n/pt-PT/franchises/john-gwynne/orders.yaml (new; rationale + 2 debated)"
spoilerPreservation: >
  Translated only from the already-corrected English strings in works.yaml
  and orders.yaml, never reconstructed from a jacket or filled in from
  outside knowledge of the series. The nine rewritten synopses (Malice,
  Valour, Wrath, all three Of Blood and Bone books, all three Bloodsworn
  books) hold the same boundary in Portuguese: no war outcome, no death, no
  survivor named beyond what the English already states. Ruin's synopsis and
  the six anthology synopses needed no redaction and are translated straight.
  banished-lands-in-order's rationale and both debated entries stay at
  premise level in Portuguese too - no outcome of the God-War, no character
  named as surviving it; "the tetralogy's finale" is rendered as "o desfecho
  da tetralogia," equally uncommitted about what that finale is. Two example
  checks: Valour's synopsis states only that "Corban foge da sua terra em
  busca de paz" and that Maquin "só quer vingança," matching the English's
  own avoidance of how Malice ends; the second debated entry states plainly
  that no source confirms a stated spoiler versus mere reader confusion,
  without resolving that question either.
titlesAndTerminology: >
  Only one inline work reference changes: the-shadow-of-the-gods's own title
  becomes "A Sombra dos Deuses" (Edições Asa, 2022) wherever the display text
  names that book itself (the author bio). Where the same work is referenced
  by its series name instead ("The Bloodsworn Saga," in franchise.yaml), the
  series name stays English, matching the treatment of every other
  series/setting name with no published Portuguese collection (Faithful and
  the Fallen, Banished Lands, Of Blood and Bone, The Wolfheart Chronicles).
  "The God-War" is paraphrased as "a guerra profetizada" rather than given a
  coined Portuguese name. None of this reaches into the real pt-PT edition's
  own jacket copy or terminology for any of it - the brief excluded it as a
  source, and nothing here was checked against it.
coAuthorBios: >
  None exist or were needed. The four anthology editors named in works.yaml
  prose (J. M. Martin, Ian Whates, Shawn Speakman, Petros Triantafyllou,
  Teresa Edgerton) and the one collaborator with his own Orrery wing (Adrian
  Tchaikovsky - he edited and owns the setting, per the-scent-of-tears' own
  note, and did not co-author the story) follow the existing
  anthology-contributor convention: named in prose, never a content/authors/
  file. Checked all 71 files under content/authors/ for the five names first.
checked: >
  i18n_coverage.py: pt-PT 198/212 (was 194/212); the 4 new files moved from
  MISSING to covered, the pre-existing partial list elsewhere unchanged.
  validate.py --slug john-gwynne: 0 errors, 3 pre-existing handoff-length
  warnings (not this file), 0 new. A first pass left 5 warnings for naming
  a curation stage in content comments; reworded to state the same facts
  without it.
forStages:
  wing-audit: >
    Confirm the spoiler boundary independently in Portuguese, especially
    banished-lands-in-order's rationale/debated: neither should imply more
    about the God-War's outcome or any character's fate than the English
    does, even where the sentences are not structured identically. Also
    worth a second look: the God-War paraphrase and the English-embedded
    proper nouns (Banished Lands, Vigrid, the Bloodsworn, Ben-Elim,
    Kadoshim, Jotun) - defensible given no confirmed terminology exists, but
    a native reviewer may find some of it more awkward than warranted.
openQuestions:
  - "English proper nouns embedded untranslated in Portuguese sentences
    (\"nas Banished Lands\") are more frequent here than on any other wing's
    overlay, because this shelf has zero confirmed setting/faction
    terminology. Revisit once a pt-PT edition beyond The Shadow of the Gods
    exists to check against."
