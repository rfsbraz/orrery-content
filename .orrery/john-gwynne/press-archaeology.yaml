stage: press-archaeology
wing: john-gwynne
summary: >
  Built the author's first lifeEvents (5) - no franchise events.yaml, nothing
  found rose from "personal to Gwynne" to "a genre-wide moment shared with
  other authors," the bar events.yaml carries here. stage_plan.py flagged one
  8-year dark run (2012-2019); scanning the whole 2012-2026 span by hand (per
  this skill's own documented lesson that the tool reports only the single
  worst run) found a second, un-flagged one hiding underneath at 2021-2026
  (6 years, masked only by two catalogue-wide globals landing in 2020).
  Closed both with real, sourced, dated facts: the David Gemmell Morningstar
  win (2013) and the tetralogy's three straight Legend nominations
  (2015-2017) inside the first window; The Fury of the Gods' first New York
  Times bestseller listing (2024) inside the second. aura_density.py: 17
  works, 15 aura (10 catalogue-wide globals reaching his 1968-alive lifetime
  + 5 lifeEvents), 0.88/work, longest dark run now 3 years (2014-2016).
  art_rotation.py --check: organisation-rotation and pacing both hold clean
  (0 problems on either axis); the composition axis reports "0 of 5 assets
  read" because no art issues exist yet for these events, the documented,
  expected state for a wing with no art intake run yet. validate.py --slug
  john-gwynne: 1 error, the theme.art block missing - the documented flip
  from warning to error the moment an author gains lifeEvents, visual-
  language's to resolve, not this stage's.

produced:
  - "content/authors/john-gwynne.yaml (lifeEvents 0 -> 5 entries; bio prose
    extended to carry the origin story and the Gemmell/NYT threads)"

decisions:
  - >
    The single highest-value find: Gwynne's own account of stepping back
    from lecturing at the University of Brighton to help care for his
    daughter Harriett, who is profoundly disabled, and starting to write
    during that time - the literal origin of Malice and the Banished Lands
    ("somehow during this time I started writing"). Not a single-source
    self-disclosure: it appears in his own "About the Author" page (archived
    2013, written around Malice's 2012 debut) and, six years later, in a
    dated 2021 bookshop Q&A that independently names his daughter Harriett
    and wife Caroline as her carers - two separately published tellings,
    clearing CURATION's two-source bar for a living author's family/health
    fact. Graded high impact and organisation: immersion (LAYOUT.md's
    biggest-rupture slot, capped at 1-2/wing) - it recolors the entire
    debut rather than just explaining the shelf. Dated 2001 from a second,
    independent anchor: his own 2021 Fantasy-Hive interview puts it at "the
    best part of twenty years since I started writing Malice." No source
    found states a more precise year; the comment says so rather than
    guessing a month.
  - >
    The birth event uses `beside`/`place-portrait`, not the usually-default
    `full-bleed-vista`, because the very next event chronologically (the
    2001 immersion above) is itself loud - LAYOUT.md names this exact
    substitution ("two loud cells cannot touch, so beside with a
    place-portrait is the quiet alternative") and it was needed here, not
    theoretical.
  - >
    Both dark runs closed on facts personal to Gwynne's own career rather
    than genre-wide padding: the Gemmell Morningstar win (2013, medallion/
    emblem-seal) and the three-book Legend nomination streak that never
    converts to a win (2015-2017, one passage/serial-contact-sheet entry for
    the whole streak, not three) inside 2012-2019; The Fury of the Gods
    becoming his first New York Times bestseller (2024, mosaic/press-media-
    collage) inside 2021-2026. The Legend-streak dates use the award's own
    ceremony years (2015/2016/2017, checkable against Wikipedia's David
    Gemmell Awards article), not the publication years Goodreads' bio quotes
    for the same three nominations (2014/2015/2016) - noted so the next pass
    doesn't read that as a discrepancy.
  - >
    Checked and explicitly held out, each for a stated reason: no film/TV
    option or adaptation for any Gwynne work turned up anywhere reachable
    (Wikipedia carries adaptation sections for comparable authors, none for
    Gwynne); no dated convention guest-of-honour appearance was found
    (general web search was unavailable for most of this run - see
    openQuestions); and the start date of his Viking re-enactment -
    repeatedly cited as shaping how he writes combat - is undated
    everywhere it is mentioned, so it stays in bio prose, not a dateless
    event.
  - >
    5 lifeEvents (1 low, 1 high, 3 med) sits toward the bottom of CURATION
    §6's 6-12 guideline and this skill's own decade-scaled table (a ~14-year
    active career, 2-4 lifeEvents/decade) - deliberately sparse, each entry
    individually load-bearing for either the dark-run gate or the bio's own
    narrative. No franchise events.yaml: the one candidate considered (a
    2010s epic-fantasy boom, echoing Grisham's 1990s-legal-thriller-boom
    precedent) had no source naming Gwynne as part of that conversation the
    way Grisham and Turow are named for theirs, so it was left out. The one
    family fact used (his daughter's disability) is the only place here
    CURATION's two-independent-source bar for a living person's family/
    health material was triggered, and it is met by two separately
    published tellings, both in Gwynne's own words, both already public.

forStages:
  eras: >
    Two candidate seams sit inside the new lifeEvents, neither decided here.
    The 2001-2012 pre-debut writing years (dateRange on the immersion entry)
    read as a coherent "becoming a novelist" period distinct from the
    published career that follows; separately, 2021's Bloodsworn launch is
    already the setting boundary franchise-research flagged (a fourth,
    Slavic-inspired setting opens again in 2026) - if eras.yaml is built for
    this wing, the four settings (Faithful and the Fallen / Of Blood and
    Bone sharing the Banished Lands, Bloodsworn's Vigrid, the Wolfheart
    Chronicles) are the far stronger periodisation signal than anything in
    the biography.
  event-resonance: >
    No lifeEvent here answers a content/events/global.yaml entry directly -
    the ten globals reaching this wing (financial-crisis-2008 through
    booktok-2020) do so purely because they fall inside Gwynne's 1968-alive
    lifetime window, not because any of his books responds to one by name.
    Nothing found in this pass changes that; no new global-event candidate
    surfaced either (the completeness-auditor's own note already ruled this
    out for world-events).
  wing-audit: >
    The only content file touched is content/authors/john-gwynne.yaml; nothing
    else in the wing or catalogue was modified. theme.art is the one open
    structural gap (validate.py's single error, expected and documented
    above) and belongs to visual-language, not to a follow-up press-
    archaeology pass. The eras sibling branch (touching only eras.yaml) was
    not read or touched.

openQuestions:
  - >
    This session's general web-search tool was unavailable for nearly all of
    this pass (budget exhausted before research began) and several direct
    search engines (DuckDuckGo, Bing, Ecosia, Marginalia) actively blocked
    or rate-limited scripted fetches once past the first couple of queries.
    Research leaned on direct URL fetches (Wikipedia, Goodreads, Pan
    Macmillan, Orbit/Hachette, the Fantasy-Hive interview, two independent
    first-person bio pages, and web.archive.org for Gwynne's own retired
    website) rather than open search. A convention guest-of-honour
    appearance or an adaptation deal, if either exists, is exactly the kind
    of fact a broader search would have been needed to surface - flagging
    this as a real gap in this pass's reach, not a considered "nothing
    exists" finding.
  - >
    The Fury of the Gods lifeEvent is dated 2024-10, the UK on-sale date
    independently confirmed against Orbit UK's own product page. The wing's
    existing works.yaml note (from the completeness-auditor stage) cites a
    more specific "number five on the New York Times Trade Fiction
    Paperback list in November 2024" claim; this pass could not
    independently re-verify that specific rank/list/month (the NYT's own
    bestseller pages are paywalled) so the lifeEvent states only the
    "instant bestseller" fact this pass could directly confirm, leaving the
    more specific figure resting on the earlier stage's own sourcing rather
    than restating it as newly verified.
