stage: press-archaeology
summary: >
  Built the wing's aura from 4 lifeEvents to 14, and created events.yaml with
  7 franchise events. The 1992 censorship/exile entry was rebuilt with the
  named official, the named grounds and the corrected move date; the PCP
  membership, the 1975 Diario de Noticias affair, the Claraboia rejection,
  Pilar del Rio, the 1949 political sacking, the 1977 Alentejo stay behind
  Levantado do Chao, the 2002 Ramallah remarks and the 2007 near-fatal
  pneumonia are all new and sourced. aura_density dark run 13 yrs -> 4 yrs.
  validate.py --slug jose-saramago green.
