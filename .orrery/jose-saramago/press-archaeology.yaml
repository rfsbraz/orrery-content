corrections:
  - claim: "Saramago moved to Lanzarote in 1992"
    correct: "The Aristeion veto is 1992; the move is February 1993"
    evidence: >
      His own autobiographical text on the Fundacao's site says "transferimos,
      minha mulher e eu, em Fevereiro de 1993, a nossa residencia para a ilha
      de Lanzarote"; Expresso's chronology gives 1993 for the move and 1992
      for the veto. The BBC, the Guardian obituary and both Wikipedias all
      compress the two into 1992. The lifeEvent keeps its 1992 id and date
      (the veto is the event) and states the February 1993 move in prose,
      with a note recording the compression.
  - claim: "The 1992 decision was Cavaco Silva's personally"
    correct: >
      The veto was exercised by Antonio de Sousa Lara, Under-Secretary of
      State for Culture in Cavaco Silva's government, on the stated grounds
      that the book offended Christian morality.
    evidence: "pt.wikipedia's article on the novel, sourced to TSF's 2004 follow-up with Sousa Lara; the pre-existing entry named only the government and the prime minister."
  - claim: "The 1975 Diario de Noticias affair was something done to Saramago"
    correct: >
      Both halves are true and only the second was in the wing. He was
      deputy editor-in-chief from April 1975; a workers' plenary, after a
      long hostile intervention by him, voted to dismiss 22 journalists who
      had signed a protest against the paper's editorial line, and 2 left in
      solidarity (the "case of the 24", 14-27 August 1975). Portugal's press
      council ruled the grounds illegal and illegitimate the following year.
      He was himself dismissed after the 25 November counter-coup.
    evidence: "Pedro Marques Gomes, Revista Tempo e Argumento 11(28), 2019, a peer-reviewed study of the case built on the participants' own testimony; corroborated by Diario de Noticias' own 2010 retrospective and Expresso's chronology."
  - claim: "Saramago spent early 1976 in Lavre"
    correct: "His own account says the beginning of 1976; Expresso's chronology says the beginning of 1977. Unresolved."
    evidence: "Recorded as a note on saramago-levantado-do-chao-1980, which is dated to the novel's publication rather than to the disputed stay."
verified:
  claraboia: >
    Real, and better documented than the lead suggested. Finished 5 January
    1953, a 319-page typescript signed with the pen name "Honorato", taken
    to a Lisbon publisher by a friend; no reply, manuscript never returned;
    found by the same publisher during an office move in 1989, who offered
    to publish it; he refused publication in his lifetime; published 17
    October 2011 by Editorial Caminho with his heirs' authorisation. Four
    independent sources (Fundacao Jose Saramago's own book page, AFP's
    report of the 2012 Madrid launch quoting Pilar del Rio, pt.wikipedia's
    dedicated article, en.wikipedia's Skylight article). Pilar del Rio at
    that launch: "Saramago suffered a great deal from that contempt", and
    afterwards he took twenty years to write another novel.
  pcp: >
    Joined 1969, while the party was illegal, and remained a member to his
    death (Nobel bio-bibliography; JN/Lusa; the PCP's own biographical
    note). Lisbon intellectuals' organisation, then the writers' cell after
    1974; elected presiding officer of the Lisbon municipal assembly in
    1989; CDU candidate at every European election 1989-2009 in unwinnable
    positions. Written without euphemism, as requested.
  nobel: >
    Real texture added: the lecture's opening line ("The wisest man I ever
    knew in my whole life could not read or write") and its subject, his
    illiterate swineherd grandfather Jeronimo Meirinho; the news reaching
    him at the Frankfurt Book Fair where Portugal was guest of honour;
    L'Osservatore Romano's objection and his reply, quoted from the NYT's
    12 October 1998 report as carried by en.wikipedia.
notFound:
  - >
    Why Lanzarote specifically, beyond Pilar del Rio being Spanish. The
    Fundacao's own page for the Lanzarote house is address and opening
    hours only; nothing sourceable was reached. A human with access to
    Cadernos de Lanzarote I or the documentary Jose e Pilar would settle it.
  - >
    The name of the Lisbon publisher that lost Claraboia. Not given by the
    Fundacao, by AFP, or by either Wikipedia; all say only "a Lisbon
    publisher".
  - >
    A citable figure for the Nobel's commercial effect. The Guardian
    obituary gives print runs of 150,000 in Portugal and Brazil and the NYT
    two million copies sold in Portugal, neither tied to the prize. No
    before/after number was found, so no sales-effect event was written.
blockedSources:
  - "WebSearch: the session's 200-call budget was already exhausted before this stage started. All discovery was done by constructing URLs, reading Wikipedia citation templates via action=raw, and one DuckDuckGo HTML query before that endpoint began returning 202. Startpage, Ecosia, Brave and Mojeek all refuse automated fetches."
  - "nytimes.com: 403 on every article URL, including the 1998 Nobel report and the 2010 obituary. Both are quoted only as carried by en.wikipedia's citations, never cited directly."
  - "expresso.pt: 403 live; its Saramago chronology was read through web.archive.org and is cited at the archive URL."
  - "independent.co.uk: 404 on the 2010 Saramago obituary URL; Pontiero's 1996 obituary there was not fetched, and his entry rests on en.wikipedia plus the two Guardian pieces."
rejected:
  - "The Vatican quote as previously phrased ('yet another ideologically slanted award'): not found in any source reached. Replaced with the L'Osservatore Romano line that pt.wikipedia carries and the Guardian's own paraphrase, plus Saramago's reply from the NYT report."
  - "The Guardian obituary's line that a bout of pneumonia left him seriously ill 'last year' (i.e. 2009): it conflicts with Expresso's precisely dated hospitalisation of 18 December 2007 to 22 January 2008, which the publisher's own first-edition jacket for A Viagem do Elefante independently supports. The 2007-08 illness is in; the undated 2009 line is not."
  - "A separate lifeEvent for the 1955-1981 translation work beyond the single 1955 entry, and separate entries for the 1988 marriage, the 1995 Camoes Prize, the 2007 Foundation and the honorary doctorates: prizes and institutions are texture, not aura, and the wing already carries the prize record in works and franchise metadata."
  - "'Honorato' as a pseudonyms entry on the author. It is the name on an unpublished 1953 typescript and on some magazine stories, with no adoption motive and no reveal in any source reached; it is recorded inside the 1953 lifeEvent instead."
  - "The 1924 death of his brother Francisco in infancy: it rests on his own autobiographical text alone and adds nothing a reader carries into the books; the birth entry already gives the Lisbon move."
forStages:
  eras: >
    Three dated hinges this stage established, in case the periodisation
    wants them: 1953 (Claraboia refused, and the silence that follows runs
    to the 1966 poems and the 1977 return to fiction); 1980 (Levantado do
    Chao, where he himself said the manner of narrating was born); February
    1993 (the move to Lanzarote, after which everything was written there).
    Note the correction: the exile begins in 1993, not 1992.
  spoiler-audit: >
    Every new entry carries spoilerAfter: null deliberately. The two that
    touch plot are saramago-alabardas-published-2014 (premise only, from the
    publisher's jacket) and saramago-blindness-cannes-2008 (premise only,
    from the Cannes synopsis). Worth a second opinion on the Claraboia
    entries, which describe the book's subject but not its events.
  art-rotation: >
    21 entries now exist with no organisation, illustration_type or
    images_required, and art_rotation.py already reports the resulting
    21-cell plateau. Two entries are natural epigraph candidates if the
    contour wants an artless cell: saramago-nobel-prize-1998 (the lecture's
    opening line, "The wisest man I ever knew in my whole life could not
    read or write", nobelprize.org) and saramago-diario-de-noticias-1975
    ("Being fired was the best luck of my life", the Guardian obituary).
  translation: >
    events.yaml is entirely new (14 translatable fields) and
    authors/jose-saramago.yaml grew from 9 to 29 untranslated fields. Both
    carry quoted Portuguese material rendered into English here; the pt-PT
    overlay should restore the originals rather than translate back:
    Saramago on the DN ("um instrumento nas maos do povo portugues, para a
    construcao do socialismo"), on the 1975 sacking, Pilar del Rio on
    Claraboia ("Saramago sofreu muito com esse desprezo"), and the 2008
    interview on the interrupted novel.
  wing-audit: >
    The weakest decision here is including saramago-ramallah-2002. It is a
    public political statement by a dead public figure, quoted from the
    Guardian's own December 2002 profile together with his clarification
    and the criticism it drew, and the request issue asked for politics not
    to be optional. It does not, however, have a mark on a specific book,
    which is the bar CURATION sets for reception ruptures. Worth a second
    reading.
openQuestions:
  - >
    Ratio: 0.63 aura per work reads high, but 12 of the 33 entries are
    global events reaching the wing that this stage did not add. The wing's
    own contribution is 21 entries over 52 works, 1 per 2.5, against a floor
    of 1 per 3-4. 14 lifeEvents also exceeds CURATION's "approximately 6-12"
    for a 63-year career; the press-archaeology skill supersedes that with
    2-4 per decade, which this meets. Trimming candidates, in order:
    saramago-translator-years-1955, saramago-dismissed-1949.
  - >
    The residual 4-year dark run is 1956-1959, and it is real rather than
    unresearched. Between the 1953 refusal and the 1966 poems he published
    nothing, worked as production manager at Estudios Cor and translated for
    money; the only dated events the record offers in those four years are
    job changes already covered by the 1955 entry. Filling them would mean
    lowering the bar. The other sub-threshold gaps (1961-1964, 1970-1973,
    1976-1979, 2003-2006, 2012-2017 split by the 2014 entry) were checked
    against Expresso's year-by-year chronology and contain prizes, honorary
    doctorates and stage adaptations, which is exactly the material this
    stage is meant not to promote.
