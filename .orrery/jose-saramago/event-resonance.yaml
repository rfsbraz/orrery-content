stage: event-resonance
summary: >
  Ruled on globalEvents for the jose-saramago wing: 1 include
  (carnation-revolution-1974), 13 excludes. validate.py --slug jose-saramago
  is green (0 errors, pre-existing era-orphan and handoff-length warnings
  only, none touching this change).
decisions:
  include:
    - id: carnation-revolution-1974
      why: >
        His own Nobel lecture narrates Levantado do Chão (1980) as running
        "from the beginning of the century to the April revolution of 1974
        which toppled dictatorship" - the novel's own ending. The revolution
        ends the Estado Novo censorship that had vetted every earlier
        Portuguese book, and its Alentejo land-reform aftermath (the Boa
        Esperança collective he lived among while researching) is the
        source of the novel's material; the same revolutionary process is
        the setting of his own 1975 Diário de Notícias removal, already a
        lifeEvent on this wing.
  exclude:
    - id: portugal-bailout-2011
      why: "announced April 2011, ten months after his June 2010 death"
    - id: world-war-i-1914
      why: "predates his 1922 birth by 8 years; only link is his father's service"
    - id: world-war-ii-1939
      why: "neutral Portugal; his own autobiography is silent on it; no novel answers it"
    - id: sept-11-2001
      why: "lived through it at 78-79; no source checked names it as occasion for a page"
    - id: financial-crisis-2008
      why: "lifelong capitalism/IMF critic since 1969; no source ties this crisis specifically to a text"
    - id: pulp-magazines-1926
      why: "Anglophone genre-magazine history, no Portuguese literary connection"
    - id: penguin-paperback-1935
      why: "UK paperback-retail history, no sourced Portuguese-market link"
    - id: armed-services-editions-1943
      why: "US military book-distribution programme, no plausible link"
    - id: lady-chatterley-trial-1960
      why: "UK obscenity-law fight; his own 1992 censorship battle is a distinct national dispute"
    - id: fantasy-paperback-boom-1965
      why: "a genre commercial category he does not write in"
    - id: chain-bookshop-1982
      why: "Anglophone retail trend, no sourced connection"
    - id: online-bookselling-1995
      why: "no sourced connection found"
    - id: ebook-and-self-publishing-2007
      why: "died 2010, no trace of him engaging ebooks/self-publishing"
verification: >
  Carnation Revolution / Levantado do Chão: Guardian review of "Raised from
  the Ground" (Le Guin, 26 Dec 2012) quotes Saramago's own 1998 Nobel
  lecture naming the 1974 revolution as the novel's endpoint. WWII silence:
  fetched his Nobel autobiography and josesaramago.org biography directly;
  both mention only his father's WWI service, nothing on 1939-1945.
  Financial crisis: fetched caderno.josesaramago.org and en.wikipedia
  directly; the blog (Sept 2008-2009) is documented as broad political
  commentary, never tied by any source checked to the crash specifically.
blockedSources: >
  WebSearch budget (200 calls) was already exhausted before this stage
  started. All checks used fetch.py directly against Wikipedia, the Nobel
  autobiography, josesaramago.org, the Guardian, and the author's own blog.
forStages:
  press-archaeology: >
    Ruling out lady-chatterley-trial-1960 and fantasy-paperback-boom-1965
    (both previously counted as "reaching" this wing under the old
    lifetime-arithmetic default) exposes a real 13-year gap in the wing's
    OWN aura (life events + franchise events), 1956-1968, between
    saramago-translator-years-1955 and saramago-joins-pcp-1969 -
    aura_density.py now reports it directly instead of it being masked by
    irrelevant global "reach". This is not under-research: eras.yaml
    already documents (and deliberately declines to model as an era) his
    own account of a 19-year absence from print, 1947-1966, corroborated by
    two obituaries. No global event in the catalogue answers this stretch
    either. Worth a second look only if a genuine anchor from this decade
    (not yet in any handoff) turns up; otherwise the wing's own record has
    already ruled it a real silence, not a gap to fill.
  reading-orders: "no blocking concern; franchise.yaml's only new field is globalEvents"
  wing-audit: >
    franchise.yaml's top capabilities comment (lines 14-34) still says "No
    eras.yaml" and "No globalEvents ruling has been made" - both now false
    (eras.yaml merged before this stage; this stage rules globalEvents).
    Out of this stage's declared footprint (globalEvents only, per
    .claude/commands/author.md's file-footprint table), flagged here per
    eras.yaml's own handoff, which flagged the same comment as stale and
    left it for whichever stage next touches franchise.yaml - that stage
    was this one, and its footprint still does not cover that comment.
openQuestions:
  - >
    No global.yaml entry represents the Cold War or Portugal's 1986 EEC
    accession; neither could be ruled on because neither exists in the
    catalogue. Not a gap in this stage - a world-events scope decision, if
    either is ever judged catalogue-worthy for other wings.
