stage: translation
summary: >
  First pt-PT pass for this wing: created the five overlay files this run
  needed (franchise.yaml, eras.yaml, events.yaml, works.yaml, authors/
  jose-saramago.yaml). i18n_coverage.py: 150/167 -> 155/168 files fully
  covered pt-PT-wide (168 counts the new events.yaml as a target); all five
  jose-saramago files moved from MISSING to fully covered, no other locale
  file regressed. validate.py green catalogue-wide, 0 errors; --slug
  jose-saramago shows only the pre-existing era-orphan warnings (works
  outside 1980-1991/1995-2005, unrelated to translation) and the pre-existing
  handoff-length warnings on other stages' files. This run added no entries
  to content/events/global.yaml or any other shared file, so no out-of-wing
  translation was owed.
coverage:
  before: "150/167 files (pt-PT); jose-saramago: MISSING franchise.yaml,
    works.yaml (52), eras.yaml (6), events.yaml (14), authors/
    jose-saramago.yaml (30) - 103 untranslated slots"
  after: "155/168 files (pt-PT); all 103 jose-saramago slots covered, 0
