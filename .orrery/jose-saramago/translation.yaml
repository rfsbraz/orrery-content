registerDecisions:
  - "AO90 orthography throughout (diretor not director, ação not acção,
    facto), matching the convention already set by joao-tordo and
    jose-rodrigues-dos-santos in this catalogue."
  - >-
    Grepped every file for the pt-BR tells the skill names specifically
    (estar+gerúndio, quadrinhos, roteiro, beisebol, tela, ônibus, banheiro,
    celular, arquivo-as-file, cartunista, resenha): none found. One real
    error caught by a second pass: "dactiloscrito" for the 1953 Claraboia
    typescript is not a Portuguese word (dactiloscopia is fingerprinting) -
    fixed to "texto dactilografado".
  - "Register matched to the terse base: single-sentence synopses stayed
    single sentences (e.g. provavelmente-alegria, o-lagarto); no entry
    ballooned past its English length."
originalPortugueseRecovered:
  - >-
    saramago-dismissed-1949: "por motivos políticos fiquei desempregado em
    1949" - Saramago's own autobiography, fetched directly from
    josesaramago.org/biografia/. Exact match to the English paraphrase.
  - >-
    saramago-claraboia-rejected-1953: "Saramago sofreu muito com esse
    desprezo" - Pilar del Río, already given verbatim by press-archaeology's
    own forStages note.
  - >-
    saramago-translator-years-1955: "ao mundo das letras... mas não como
    autor" - the same autobiography page.
  - >-
    saramago-joins-pcp-1969: "comunista inveterado" - L'Osservatore Romano's
    own words, sourced via pt.wikipedia's citation of the 1998 coverage.
  - >-
    saramago-diario-de-noticias-1975: "um instrumento nas mãos do povo
    português, para a construção do socialismo" and the "abandonar o Diário
    de Notícias" clause - Saramago's own words as quoted in Pedro Marques
    Gomes's peer-reviewed study (redalyc.org), which cites the Diário de
    Notícias' own 10 April 1975 front page.
  - >-
    saramago-nobel-prize-1998: both the epigraph quote and the lecture title
    are the Fundação José Saramago's own text - the prize citation and
    lecture title from josesaramago.org/distincoes/, the opening line
    ("O homem mais sábio que conheci em toda a minha vida não sabia ler nem
    escrever") from the full lecture text at josesaramago.org/conferencia/
    de-como-a-personagem-foi-mestre-e-o-autor-seu-aprendiz/.
freshlyTranslated:
  - >-
    Quotes with no locatable Portuguese original despite direct checks
    (Saramago's own autobiography, the Fundação's "Traduzido por Saramago"
    page, pt.wikipedia's Nobel and DN sections, the Expresso chronology, the
    dn.pt retrospective, redalyc's academic study): the Pontiero
    translator quote in events.yaml ("Lamentably, I can only write
    Portuguese..."), the Vatican-reply quote and the Ramallah/Auschwitz
    quote in saramago-nobel-prize-1998 and saramago-ramallah-2002, the 2008
    illness-interview quote in saramago-pneumonia-2007, "to my relief" in
    saramago-first-novel-1947, "best luck of my life" in
    saramago-diario-de-noticias-1975, and Cavaco Silva's funeral remark in
    saramago-death-2010. All are Guardian/NYT paraphrases or interviews
    without a found Portuguese source text, translated as ordinary prose.
    WebSearch was exhausted session-wide before this stage started (same
    constraint press-archaeology and completeness-auditor recorded); all
    checks used scripts/fetch.py directly against Fundação, Wikipedia,
    redalyc and archive.org URLs.
  - >-
    Newspaper-source quotes with no Portuguese original to recover because
    the source itself is English (NYT and Guardian obituary lines in
    eras.yaml's the-allegorical-novels, Encyclopaedia Britannica's line in
    the-historical-novels): translated fresh, no recovery attempted.
spoilerVerification: >
  Read a-caverna and as-intermitências-da-morte's current English synopses
  (post spoiler-audit rewrite) against the note on each entry and translated
  only what is there: a-caverna stops at "mudar-se para dentro do próprio
  Centro" (no chamber, no discovery); as-intermitências-da-morte stops at
  "decide fazer a sua própria experiência" (no falling for a man). Neither
  Portuguese rendering is more literal or complete than the English it
  translates - checked line by line against the current base text, not
  against any independently-known fuller synopsis. ensaio-sobre-a-cegueira's
  corrected asylum/eyewitness synopsis and a-maior-flor-do-mundo's softened
  ending were translated as-is with no added detail either.
verification: >
  Ran i18n_coverage.py before and after (numbers above) and validate.py
  --slug jose-saramago (0 errors) then catalogue-wide (0 errors, 1147
  works/53 authors/11 achievements, all references resolve). Caught and
  fixed 5 sanctuary-rule warnings on first validate.py pass: header comments
  in works.yaml and authors/jose-saramago.yaml named "handoff",
  "spoiler-audit" and "press-archaeology" - rewrote them to state the
  sourcing facts without naming the pipeline (docs/CURATION.md §2). Parsed
  all five overlay files with PyYAML and spot-checked the merge (lifeEvents
  titles, the epigraph quote) resolves field-by-field as expected. Could NOT
  render the live page: this is a content-only worktree
  (orrery-content) with no app checkout, so render-check.mjs and a rendered
  pt-PT page are unavailable pre-merge - the coverage script and validate.py
  are the whole of what this stage could check from here. Flagging this
  explicitly per CURATION §5 rather than implying a render check happened.
openQuestions:
  - >-
    saramago-dismissed-1949's base English says "the sentence is four words
    long" describing a quote that is not four words in either language. Not
    a translation artefact - the base line reads the same way before
    translation - but worth a second look by whoever next touches that
    lifeEvent's description.
  - >-
    "Discurso do Nobel" was chosen for the base's "Nobel lecture" label
    (paired with the Fundação's own lecture title "De como a personagem foi
    mestre e o autor seu aprendiz"); a native reviewer may prefer
    "Conferência Nobel" to match the Fundação's own section header
    ("Conferências"), which was kept for consistency across the whole
    lifeEvent title.
forStages:
  wing-audit: >
    All five overlay files are new and complete; no partial-translation
    debt left in this wing. The only outstanding items are the two
    openQuestions above and the render-check gap noted in verification,
    neither blocking for a branch merge.
