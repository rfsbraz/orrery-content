stage: completeness-auditor
summary: >
  Re-verified all 52 works against primary sources fetched directly (not
  the prior stage's read of them): the Fundação's own bibliography (pt/en),
  both Wikipedias' structured tables, and independent corroboration for
  every flagged single-sourced item. 52 works before and after. One date
  corrected, four entries got a second independent source, one work gained
  featured. validate.py --slug jose-saramago green (3/3 featured cap).
counts:
  before: { works: 52, featured: 2, singleSourced: 4 }
  after: { works: 52, featured: 3, singleSourced: 0 }
changed:
  - work: jose-saramago/a-estatua-e-a-pedra
    change: "published 1997 -> 1999; reorders the derived order"
    why: >
      1997 was the year of the spoken Turin lecture, not a publication;
      three independently read sources (Fundação's own product page,
      a literary blog, the academia.edu transcript) agree the first print
      edition was Italian, 1999. Moves from the 1997 cluster to sit beside
      Folhas Políticas (1999), before A Caverna (2000).
  - work: jose-saramago/ensaio-sobre-a-cegueira
    change: "featured: true added (3/3 cap)"
    why: >
      Sourced hinge beyond popularity: festival-cannes.com confirms the
      Meirelles film was Cannes 2008's opening film, in competition.
  - work: jose-saramago/democracia-e-universidade
    change: "sourcing/synopsis enriched, no date change"
  - work: jose-saramago/jose-rodrigues-migueis-e-jose-saramago-correspondencia
    change: "second independent source (Leya/Caminho catalogue) added"
  - work: jose-saramago/poetica-dos-cinco-sentidos-o-ouvido
    change: "second independent source (dedicated pt.wikipedia article) added"
confirmedUnchanged:
  - "Core 18-novel spine: three independent structured bibliographies (Fundação, pt.wikipedia list, en.wikipedia table) converge exactly."
  - "Folhas Políticas 1999 over the Fundação's own 1993: re-confirmed via en.wikipedia's table directly."
  - "Ricardo Reis 1984 / A Caverna 2000: pt.wikipedia's own list (not its prose) agrees with Fundação + en.wikipedia."
  - "O Embargo merge into Objecto Quase: pt.wikipedia's own adaptations paragraph states the 2010 film Embargo adapts a story taken FROM Objecto Quase - direct confirmation, no separate entry."
  - "Five posthumous picture books stay extended, not apocrypha: none are contributions, limited, unfinished or periodical per SCHEMA.md's own tier definitions."
rejected:
  - "1955 Hegel/Tolstoy/Baudelaire translations: paid hack work, not authored; schema has no translator authorRole; neither Fundação nor either Wikipedia bibliography counts them."
  - "Uncollected periodical crónicas: no book to anchor an entry to (unchanged from prior stage)."
openQuestions:
  - "A Estátua e a Pedra's reorder-causing correction disagrees with the Fundação's own listed date; worth a second look before merge."
  - "WebSearch quota was exhausted mid-session; no dedicated 2024-2026 posthumous-discovery news sweep was done beyond the two Wikipedia snapshots fetched (which show nothing new). Worth a cheap follow-up, not a blocker."
  - "WorldCat/BNP porbase were not reachable this session (403 / JS SPA); not treated as a gap given three other converging sources on the core 18."
forStages:
