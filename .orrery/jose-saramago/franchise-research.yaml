stage: franchise-research
summary: >
  Scaffolded the José Saramago wing from scratch: 52 works (18 core novels,
  31 extended, 3 apocrypha), a global author entity with 4 sourced life
  anchors, franchise.yaml, theme.yaml, and empty eras.yaml/orders.yaml with
  their reasoning recorded. validate.py --slug jose-saramago is green.
produced:
  newWorkIds: [52 work ids in works.yaml - see the file; too many to repeat here]
  newAuthorIds: [jose-saramago]
  capabilitiesActivated:
    - "river/companion: likely on (4 author lifeEvents exist; no franchise events.yaml yet)"
    - "wizard/editions: off (no startHere, no editions.yaml)"
forStages:
  completeness-auditor: >
    Verify against primary sources, not just this scaffold: (1) Folhas
    Políticas dated 1999 here vs 1993 on the Fundação's own bibliography
    page (see works.yaml's DATE NOTE); (2) A Estátua e a Pedra dated 1997
    (Turin lecture) though its first print edition was Italian, 1999; (3)
    Democracia e Universidade and the two correspondence volumes came from
    one source only (Fundação bibliography), uncross-checked; (4)
    periodical crónicas and his translation work (Hegel, Tolstoy, Baudelaire
    from 1955) are excluded entirely - judge whether anything there earns
    an apocrypha entry.
  press-archaeology: >
    Only 4 lifeEvents exist (birth, 1992 exile, 1998 Nobel, 2010 death).
    Not yet modelled: 1969 PCP membership (context for the Vatican's public
    objection to the Nobel); the 1975 Diário de Notícias affair (expelled
    24 journalists, then was himself dismissed); three relationships (Ilda
    Reis, Isabel da Nóbrega, Pilar del Río) and daughter Violante (b.
    1947); his brother Francisco's infant death in 1924; Claraboia's 1953
    rejection and 2011 posthumous discovery (currently only a work note).
  eras: >
    Portuguese Wikipedia's prose (its own synthesis, not yet checked
    against its cited source) frames a shift around 1995: 1980-1991 novels
    engage historical fact directly, 1995-2005 moves to unplaced settings.
    Worth reading the underlying source before treating this as received.
  reading-orders: >
    His unpunctuated dialogue and page-long sentences are well documented
    and "don't start with the hardest book" is common advice for him, but
    no citable ranked entry-point guidance was found here. The 5-volume
    Cadernos de Lanzarote subseries is the only existing structural hook.
  visual-metadata: >
    0/52 covers, no portrait. josesaramago.org's own shop sells covers and
    is a likely strong source; a Wikimedia Commons portrait was not
    searched for.
  editions: >
    No editions.yaml. Both Wikipedia bibliography tables fetched here
    already carry title/year/ISBN columns for the English translations -
    a starting list to verify, not search from scratch.
openQuestions:
  - >
    Folhas Políticas: used 1999 (English Wikipedia plus three independent
    bookshop sources sharing one ISBN) over the Fundação's own 1993 - could
    be a data-entry error, or an earlier differently-titled predecessor.
  - >
    featured is set on exactly two works (Levantado do Chão - where the
    "saramaguiano" style is said to first appear; Memorial do Convento -
    the international breakout). Ensaio sobre a Cegueira, his most
    internationally read novel, was deliberately left unflagged for lack of
    a sourced "hinge" claim beyond popularity - revisit if a better source
    turns up.
  - >
    Five posthumous illustrated children's books repackage or may
    repackage earlier prose (O Silêncio da Água, O Primeiro Barco, Uma Luz
    Inesperada confirmed; A Maior Flor do Mundo, O Lagarto not confirmed
    either way). All tiered extended, not apocrypha, since the words are
    entirely his own - reconsider if that reasoning doesn't hold.
