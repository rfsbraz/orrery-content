stage: wing-audit
summary: >
  Audited the finished wing across all 12 stages. Five gates re-derived, not
  inherited. Four blocking defects, all in prose or images a reader sees.
  One mechanical fix. The pipeline-trust pattern is confirmed on its third
  consecutive wing.
gates:
  validate: "OK - 1147 works, 53 authors, 11 achievements, all refs resolve. 34 warnings on this slug (handoff-length, era-orphan), unchanged here."
  i18nCoverage: "pt-PT 155/168 files fully covered; no jose-saramago file partial."
  eventDensity: "18 globals, 2 high of a ~17 budget, no decade over. The 1950s are empty catalogue-wide - this wing's dark-run decade."
  auraDensity: "52 works, 22 aura, 0.42/work, dark run 13 yrs (1956-1968). Mid-pack ratio; longest genuine modern dark run in the catalogue."
  artRotation: "0 organisation-rotation, 0 pacing problems. The '23 assets with no issue' line is the pre-art composition axis, not this gate."
blocking:
  - owner: completeness-auditor (+ translation to mirror)
    what: >
      as-intermitencias-da-morte reverses the English titles: Death at
      Intervals is Harvill Secker, London; Death with Interruptions is
      Harcourt, Orlando. The entry's own note calls Harcourt "the US
      jacket". Live in en and pt-PT.
  - owner: completeness-auditor
    what: >
      claraboia's note says he "never mentioned the manuscript again and it
      stayed in the publisher's archive". AFP/g1, cited on this wing's own
      1953 lifeEvent, says he recovered the typescript in 1989 and refused
      publication. Scaffold text (d2cf217), never revised.
  - owner: press-archaeology (+ translation to mirror)
    what: >
      saramago-dismissed-1949: "the sentence is four words long" precedes a
      seven-word quotation. Mirrored into pt-PT. Translation flagged it;
      nobody acted.
  - owner: visual-metadata
    what: >
      claraboia's cover 11290383 is Edicions 62's Catalan edition (jacket
      reads "Novel·la") on a core novel whose edition is Porto Editora
      pt-PT, with no note. Every other language swap here has one.
missing:
  - owner: visual-metadata
    what: >
      Levantado do Chão (featured) ships a library scan, barcode
      DCPL0000662317 across the jacket, undisclosed - unlike the Boston
      Public Library scan on A Bagagem do Viajante, which is. Six further
      non-pt covers carry no note; jangada and ilha-desconhecida are
      Companhia das Letras pt-BR, CURATION §4's named trap.
  - owner: press-archaeology
    what: >
      The 1966 return to print - "For 19 years, till 1966, when I got to
      publish Possible Poems, I was absent", his own Nobel words - has no
      dated event and sits inside the 13-year dark run.
  - owner: the curator
    what: >
      accent #8a1f24 is 2.04:1 on bg, lowest of 26 wings (next 2.78). The
      app renders --accent as link and button text. ink/bg 15.76 and
      muted/surface 4.67 are fine.
stale:
  - "None outstanding. franchise.yaml's capabilities comment, flagged by eras and event-resonance, was fixed at ce9a8b1."
mechanicalFixes:
  - "franchise.yaml: a comment narrating its own revision history ('the Portuguese Wikipedia prose synthesis this comment used to cite', CURATION §2) restated in the present tense."
checkedClean: >
  Featured tiering: no synopsis spoils another, and the Cannes hinge is
  primary-sourced (festival-cannes.com: "Film d'ouverture", "In
  Competition"). The 1975 Diário de Notícias entry carries both halves in
  both languages. The 1992 veto and February 1993 move stay distinct in
  both, two sources each. Claraboia's 1953 publisher is correctly unnamed;
  319 typescript pages and the 2013 facsimile's 245 sheets both check out.
  All 46 ISBN-13 check digits re-derived valid, all pt-PT, no duplicate
  edition ids. No duplicate or dangling work ids. Zero comment-policy
  warnings here. All 27 covers are /b/id/ URLs, so ?default=false does not
  apply. 14 source URLs swept, all live. displayFace fraunces and signature
  rule are implemented; work.images.cover is read at
  lib/content/editions.ts:68, not inert. All four capabilities auto-resolve
  correctly. validate.py and issue_sync.py both put chapter-gate ahead of
  OPAQUE_TYPES, so the era plate files keyed, not opaque.
notApplicableNotAbsent:
  - "No orders.yaml, no startHere: researched and ruled, not skipped."
  - "No achievements: no genuinely hard completion here to mark."
  - "No pseudonyms entry: Honorato has no motive or reveal in any source."
  - "27/52 covers, 46/52 editions: the open-source ceiling for this author; each bare slot carries its reason."
  - "28 works outside every era: the eras are received, not tiling."
pipelineFinding: >
  franchise-research pre-wrote theme.yaml's whole art block at scaffold
  (d2cf217), outside its footprint and unrecorded in its handoff;
  visual-language found it and fixed a real lineCharacter collision with
  Stephen King's wing. Diffs read directly, the account holds. art-rotation
  was unaffected (ae31f1a graded every field from empty). Third consecutive
  wing where the scaffold silently produced a later stage's declared
  deliverable, after two on Lovecraft. The silence is the damage: the bug
  was caught only because the next stage distrusted what it inherited.
curatorsCall:
  - "The accent contrast: nudging the carmine is a design decision, not an audit fix."
  - "The 1975 entry's title leads with his own dismissal and closes on 'the best luck of my life', giving the last word to his redemption over the 22 journalists. Accurate throughout; the framing is a judgement."
  - "Whether a non-Portuguese cover is acceptable here at all, or only with a note. The wing currently does both."
