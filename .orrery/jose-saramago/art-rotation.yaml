stage: art-rotation
summary: >
  Wing had no pre-existing organisation/illustration_type/images_required
  grading (checked before starting per this wing's own recurring pre-write
  pattern - see preWriteCheck below; this stage came up empty, unlike the
  last two that hit it). Graded all 21 events (14 lifeEvents + 7 franchise
  events) and both era plates from scratch onto docs/LAYOUT.md's grammar.
  art_rotation.py --check jose-saramago reports 0 organisation-rotation and
  0 pacing problems on both axes; validate.py is green catalogue-wide (0
  errors, only pre-existing warnings, none new). Neither A Caverna nor As
  Intermitências da Morte has any event/lifeEvent in this wing at all, so
  spoiler-audit's ending constraint was not actually live for this stage -
  see spoilerConstraint below for what that means going forward.
preWriteCheck:
  checked: >
    grep -n "organisation:" on both content/authors/jose-saramago.yaml and
    content/franchises/jose-saramago/events.yaml before making any edit, per
    the orchestrator's flag that two earlier stages on this wing (and one on
    the previous wing) found a downstream deliverable silently pre-written.
  found: "Nothing. Both greps returned empty; art_rotation.py --check confirmed it independently (21-cell 'beside' plateau, exactly LAYOUT.md's documented unset-default shape)."
  conclusion: >
    This wing's art-rotation stage was not affected by the pre-write pattern
    that hit visual-language (theme.art existed at scaffold time) and
    press-archaeology (aura partially pre-seeded). All 21 organisation/
    illustration_type/images_required assignments below are this stage's own
    work, graded once, not verified-and-kept.
rotation:
  sequence: >
    Chronological order the tool checks in (year, organisation, illustration_type):
    1922 full-bleed-vista/establishing-landscape (birth, Azinhaga) ->
    1947 beside/book-object (first novel) ->
    1949 marginalia/isolated-object (sacked) ->
    1953 artifact-spread/manuscript-proof+pull-focus (Claraboia rejected) ->
    1955 passage/process-diagram (26 translator years) ->
    1969 medallion/emblem-seal+breakout (joins PCP) ->
    1975 mosaic/press-media-collage (Diário de Notícias affair) ->
    1980 beside/place-portrait (Levantado do Chão) ->
    1986 diptych/symbolic-still-life x2 (Pilar del Río) ->
    1990 beside/public-event-tableau (La Scala) ->
    1992 immersion/establishing-landscape (Lanzarote exile) ->
    1996 layered-stack/archive-stack (Pontiero dies) ->
    1998 epigraph, no artwork (Nobel - "the wisest man I ever knew...") ->
    2002 beside/historical-context-tableau (Ramallah) ->
    2007 interlude/portrait-of-absence (pneumonia) ->
    2008 layered-stack/press-media-collage (Cannes) ->
    2010 immersion/portrait-of-absence (death) ->
    2011 diptych/book-object x2 (Claraboia published) ->
    2014 artifact-spread/manuscript-proof (Alabardas published) ->
    2018 marginalia/isolated-object (Último Caderno found) ->
    2022 medallion/book-object (A Viúva restored).
  eraPlates: >
    the-historical-novels (1980-1991): chapter-gate/establishing-landscape -
    Mafra's unfinished stonework, the exact motif visual-language.yaml names
    for this era's material. the-allegorical-novels (1995-2005): chapter-
    gate/atmospheric-motif-field - the empty pale-grey field visual-
    language.yaml names for the wing's blindness half. Both excluded from
    the organisation-rotation and pacing counts by construction (art_
    rotation.py: "each already IS the chapter-gate slot, one per era").
  intensityShape: >
    Contour printed by --check: #=.=.=#===#=.=.=#==.= - loud only 4 times
    (birth, DN-1975, exile, death), each earning it: a place that shapes a
    life, a firing he called his best luck, the censorship that exiled him,
    and the death itself. Immersion used exactly twice (its hard cap):
    exile and death, the two irreversible ruptures. Epigraph used once (cap
    2-3) on the Nobel lecture's own opening line, which is also the wing's
    only artless cell - the words stand in for a picture at the biggest
    single honour in the wing. No plateau, no two loud cells touching or
    sharing a screenful (both checked, both clean).
  firstAttemptCorrection: >
    First pass put Pilar del Río's 1986 entry at beside, which repeated
    'beside' from both its 1980 and 1990 neighbours (two organisation-
    rotation violations, art_rotation.py caught both). Re-cast the entry as
    diptych/symbolic-still-life (a real before/after: an obscure Portuguese
    career vs. one carried into Spanish in his wife's voice - the
    description's own line "so that his books reached the larger
    neighbouring language in his wife's voice" is literally private-then-
    public reach) rather than forcing a neighbour to change to make room -
    the fix reads as a genuine fit, not a workaround.
  besideRatio: >
    4 of 21 (19%), well under LAYOUT.md's ~50% target and its 75% ceiling.
    Not a problem per the gate (only an over-cap is flagged, never an
    under-target), and defensible here: press-archaeology's own aura
    standard means every one of these 21 entries already cleared a high/
    med/low editorial bar before this stage ever ran, so few of them read as
    the "ordinary, medium-weight" moments beside is meant for.
modifiers: >
  Two used, both earning their place rather than decorating: pull-focus on
  the 1953 Claraboia manuscript (a magnified inset on the "Honorato"
  pseudonym signature - a detail named in the sourced description but too
  small to read at the artifact-spread's normal scale) and breakout on the
  1969 PCP medallion (one element crossing the seal's rim - the natural home
  for visual-language.yaml's single deep-carmine accent, which that handoff
  says must sit on "exactly one element, never a fill").
spoilerConstraint: >
  Checked directly: neither A Caverna nor As Intermitências da Morte has an
  event or lifeEvent of its own anywhere in this wing's 21 graded entries -
  press-archaeology and spoiler-audit's work on those two titles lives
  entirely in works.yaml (synopsis/note fields), which this stage does not
  touch. The one place either book is even named is the-allegorical-novels
  era description (both are cited as examples of the run's shift), and that
  era's art is atmospheric-motif-field - an abstract tone layer with no
  scene, object or character in it, so it cannot depict either novel's
  ending regardless. Net: the safe-imagery constraint (pottery workshop/
  Center for A Caverna; Death's apartment with scythe and filing cabinets
  for As Intermitências) was never live for this stage and is carried
  forward untouched for whichever future stage first writes an event tied
  to either title by name - most likely asset-prompt, if a franchise event
  is ever added for one of their adaptations, or visual-metadata if a cover
  blurb is pulled in. Nothing to action now; nothing this stage needs from
  visual-metadata either, since it never generates art for individual works
  (VISUAL.md §4: work-cover "not generated: covers are licensed or absent").
gates:
  artRotation: "python scripts/art_rotation.py --check jose-saramago: 0 organisation-rotation problems, 0 pacing problems. (The composition-axis line still reports 23 assets with no issue at all - expected on a freshly graded wing per the skill, not this stage's to fix.)"
  validate: "python scripts/validate.py: OK, 1147 works, 53 authors, 11 achievements, all references resolve. 31 warnings on this slug, all pre-existing (handoff-length, era-orphan) - none introduced by this stage's edits (only organisation/illustration_type/images_required/modifier/quote/title fields touched, on the exact 3-file footprint: events.yaml, authors/jose-saramago.yaml, eras.yaml)."
forStages:
  asset-prompt: >
    Rotation and pacing are locked; write prompts entry by entry following
    the sequence above. Three things worth carrying in: (1) the epigraph
    entry (saramago-nobel-prize-1998) needs no prompt/issue at all -
    images_required: 0, per LAYOUT.md epigraph has no art job. (2) The two
    diptychs (saramago-pilar-del-rio-1986, saramago-claraboia-published-
    2011) each need 2 complete prompts, one per slot, per LAYOUT.md's "n
    images means n prompts" rule - never one prompt describing both panels.
    (3) The safe-imagery constraint for A Caverna/As Intermitências da
    Morte is not live on any entry graded here (see spoilerConstraint
    above) - it only becomes relevant if a future event names either title
    directly.
  visual-metadata: >
    No overlap with this stage's footprint - covers are licensed, not
    generated (VISUAL.md §4), so nothing here touches work-level art.
openQuestions:
  - >
    saramago-diario-de-noticias-1975 was also a legitimate epigraph
    candidate (press-archaeology flagged "Being fired was the best luck of
    my life" as sourced and ready). Kept as mosaic/press-media-collage
    instead - the DN quote is only sourced as "he said later" via a 2010
    obituary (undated, secondhand), weaker for an epigraph's required
    attribution than the Nobel line's primary-source lecture opening.
    Worth a second look if the wing ever wants a second epigraph (cap
    allows 2-3, this wing uses 1).
  - >
    saramago-ramallah-2002's organisation (beside/historical-context-
    tableau) is the least distinctive choice in the wing - press-
    archaeology's own handoff already flagged this entry as its weakest
    inclusion. If a future pass ever demotes or reworks that entry, its
    organisation should be re-graded alongside rather than left stranded.
