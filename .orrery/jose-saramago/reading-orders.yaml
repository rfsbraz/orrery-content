    globalEvents description is fine but sits in the same paragraph. This
    stage only touched the orders/startHere clause; the rest is unchanged
    and still needs the sweep those two prior handoffs already asked for.
  spoiler-audit: >
    Nothing new to check - no order or startHere prose was added this stage.
