stage: event-resonance
summary: >
  Ruled globalEvents on franchise.yaml: 2 include, 3 exclude. Read "lifetime"
  as Lovecraft's actual 1890-1937 life (matching Poe's 1809-1849 and
  Sewell's 1820-1878 precedent elsewhere in the catalogue), not stretched to
  the 1938-1959 span his work kept being newly published across after his
  death - but every candidate that fell in that posthumous stretch was
  still checked against the sourced record rather than dismissed on
  lifetime grounds alone, per the orchestrator's explicit ask. aura_density
  went 31 -> 30 (one exclude removed a global that had been reaching the
  wing on the script's own uncurated lifetime-overlap arithmetic); the dark
  run is unchanged at 4 years (1955-1958), matching press-archaeology's own
  prediction that excluding all three original lifetime-overlap candidates
  would not widen it. Validator green on this slug (0 errors; the 82
  era-coverage warnings are pre-existing and out of this file's scope).
produced:
  filesChanged: [content/franchises/hp-lovecraft/franchise.yaml]
  globalEvents:
    include:
      - id: world-war-i-1914
        note: >
          Supplies the literal narrative frame of Dagon (1917) - the
          testament of a merchant-marine officer whose ship is taken by an
          Imperial German sea-raider in the Pacific, one of Lovecraft's
          earliest weird tales and Wikipedia's own "World War I fiction"
          category for it. He also tried twice, in his own words, to serve
          in it: an aborted Army enlistment in 1917 (he passed the
          physical) and a Rhode Island National Guard attempt afterward,
          both undone by his mother pulling family connections. Sourced to
          en.wikipedia.org/wiki/Dagon_(short_story) and
          en.wikipedia.org/wiki/H._P._Lovecraft, read directly.
      - id: pulp-magazines-1926
        note: >
          The genre-magazine market this event names - "the crime and
          weird-fiction pulps of the early 1920s" the event's own
          description cites as Amazing Stories' predecessor - is the
          category Weird Tales belongs to, and Weird Tales was Lovecraft's
          only real professional market for two decades. Its editor
          Farnsworth Wright's rejections directly shape three entries
          already in this wing's own events.yaml/lifeEvents (the Mountains
          of Madness rejection chief among them). Endorsed by
          press-archaeology's own handoff as "the obvious include."
    exclude:
      - id: penguin-paperback-1935
        note: >
          Lived through it (falls inside 1890-1937), but had no book in
          print at all yet - his first collection was posthumous, Arkham
          House's 1939 The Outsider and Others - and never reached British
          paperback in his own lifetime; the earliest UK paperback editions
          date from the 1960s-70s. No book of his answers a sixpenny
          paperback revolution he was never inside.
      - id: world-war-ii-1939
        note: >
          17 months after his death, so outside strict lifetime; checked
          anyway given how close it sits to it and to the wing's own
          posthumous-publishing frame. Arkham House's 1939-1945 activity
          (founding 1939, second omnibus 1943) is already dated and sourced
          in this wing's own events.yaml in detail - down to Derleth
          subsidising the press from his own writing income - with no
          wartime paper-shortage or service detail anywhere in that sourced
          record. Nothing ties the war itself to how those specific books
          got made.
      - id: comics-code-authority-1954
        note: >
          Posthumous by 17 years, flagged by world-events as a candidate
          specifically because it sits inside this wing's remaining dark
          run's neighbourhood. Checked directly rather than dismissed on
          lifetime grounds: a claim (repeated across several fan-wiki
          summaries) that EC Comics adapted Lovecraft's "The Outsider" in
          Tales from the Crypt #34 ("Mirror, Mirror, On the Wall!", Feb-Mar
          1953) does not survive a primary-source check - neither the Grand
          Comics Database's own credits/notes for that issue
          (comics.org/issue/10293) nor the EC Comics Wiki's own synopsis
          (eccomics.fandom.com/wiki/Tales_from_the_Crypt_Vol_1_34) name
          Lovecraft or "The Outsider" anywhere; the credited writer is Al
          Feldstein and the synopsis is a Frankenstein-style
          brain-transplant story. No sourced Lovecraft adaptation into the
          EC horror-comics tradition the Code shut down turned up. Per
          CURATION §1, an unevidenced link is no link - excluded, not left
          silent, so a later pass does not re-chase the same unsourced
          claim.
verification:
  validate: "python scripts/validate.py --slug hp-lovecraft - 0 errors; only the pre-existing era-coverage warnings from the eras stage, none on franchise.yaml"
  auraDensity: "python scripts/aura_density.py hp-lovecraft - 111 works, 30 aura (was 31), 0.27/work, span 1916-1959, longest dark run 4 yrs (1955-1958), unchanged from before this ruling"
  lifetimeInterpretation: >
    Precedent check before ruling: edgar-allan-poe/franchise.yaml has no
    globalEvents key at all, with its own header comment stating "no global
    event in the shared catalogue falls inside Poe's 1809-1849 lifetime at
    all" - i.e. birth-to-death, not extended for his own real posthumous
    publication (Annabel Lee). anna-sewell/franchise.yaml rules on exactly
    one candidate, elementary-education-act-1870, which sits inside her
    1820-1878 life. Neither wing's posthumous stretch happened to contain a
    candidate event, so neither precedent was tested on this exact
    question, but both use strict birth-death language for "lifetime." This
    ruling follows that reading, while still individually checking (not
    silently dropping) the posthumous-stretch candidates this wing
    genuinely has that Poe and Sewell didn't.
forStages:
  reading-orders: >
    Only globalEvents changed on franchise.yaml; nothing else on the file
    was touched (id, name, description, authorIds, themePreset, sources are
    all as franchise-research left them). No overlap expected with
    startHere/features work.
  visual-metadata: >
    No image slots added or changed - globalEvents entries don't carry
    images_required; only franchise-level events.yaml/lifeEvents entries
    do, and none of those were touched this stage.
  translation: >
    franchise.yaml gained 5 new inline comments (2 include, 3 exclude) and
    one new header comment block. Per CURATION.md and this skill's own
    output contract, globalEvents notes are content YAML like any other -
    English only for now, same untranslated-until-covered status as the
    rest of this wing.
  wing-audit: >
    The lifetime-vs-posthumous-publishing-span question was this run's
    real judgment call, not the individual event rulings (those had clean
    sourced answers once checked). Worth a second opinion if this catalogue
    ever needs a general rule for heavily-posthumous wings rather than a
    per-wing precedent read: right now it rests on inferring intent from
    two wings (Poe, Sewell) whose posthumous stretches never happened to
    contain a candidate, not on an explicit statement anywhere in
    docs/SCHEMA.md or docs/CURATION.md.
  event-resonance: >
    (For whoever curates a future heavily-posthumous wing.) The
    comics-code-authority-1954 check is a useful cautionary tale on its
    own: an AI web search summarized several fan-wiki pages as confirming
    a Lovecraft-to-EC-Comics adaptation, and the claim evaporated on
    fetching the primary sources directly. Fetch the actual database/wiki
    page before writing a resonance note, not just a search engine's
    gloss of it.
