stage: eras
summary: >
  Shipped two eras, both sourced to Lovecraft's own biographical record
  rather than to Wikipedia's paragraph headings (explicitly not treated as
  a periodisation, per CURATION.md SS4's citation-laundering trap): The New
  York Years (1924-1925) and The Return to Providence (1926-1937), split at
  his 3 March 1924 marriage/move and 17 April 1926 return, both dated and
  quoted from hplovecraft.com's own biography (Donovan K. Loucks) and
  corroborated by S. T. Joshi's "I Am Providence" two-volume split. No era
  drawn for 1890-1923: real shape (the 1917 return to fiction after his
  1908-13 hiatus, UAPA membership, the 1923 Weird Tales debut) but no
  source checked gives it a received name, so it ships as an honest gap
  rather than an invented label. Validator green (0 errors) both scoped and
  catalogue-wide; my file itself carries zero warnings.
producedFiles:
  - content/franchises/hp-lovecraft/eras.yaml
eraScheme:
  new-york-years:
    period: "1924-1925"
    provenance: critical
    verdict: RECEIVED (rung 2, biography) - boundary verdict SEPARATE: sourced but
      deliberately short by one year (see dateAxisDecision)
    sources: [hplovecraft.com/life/biograph.aspx, en.wikipedia.org/wiki/H._P._Lovecraft]
    worksCovered: 11 (published 1924-1925)
  return-to-providence:
    period: "1926-1937"
    provenance: critical
    verdict: RECEIVED (rung 2, biography) - quotes hplovecraft.com's "time of his
      greatest flowering, both as a writer and as a human being" and Joshi's
      "greatest spurt of literary creativity he would ever experience",
      both attributed not asserted
    sources: [hplovecraft.com/life/biograph.aspx, hplovecraft.com/study/bios/iap.aspx, en.wikipedia.org/wiki/H._P._Lovecraft]
    worksCovered: 43 (published 1926-1937)
  preNineteenTwentyFour:
    verdict: left uncovered on purpose, not INVENTED-and-shipped, not silently
      dropped either - documented in the file's own header with what shape
      exists (1917 return to fiction, UAPA presidency, 1923 Weird Tales
      debut) and why no name was found for it
    worksLeftUncovered: 29 (published 1916-1923)
dateAxisDecision: >
  works.yaml's ONLY per-work date field is `published` (bare year); there is
  no composition-date field in the schema or the data. Wikipedia's own
  bibliography table (already this wing's primary source throughout) DOES
  carry composition dates in a separate "Date written" column alongside
  "Date published" - so composition dates exist in the source material, just
  not as a captured field here, and adding one is a schema change outside
  this stage's file footprint (eras.yaml only). Both biographical sources
  this periodisation rests on (Joshi, hplovecraft.com) describe Lovecraft's
  LIFE - where he lived and worked - not when his fiction reached print, so
  the periodisation itself is genuinely about composition/biography, stated
  honestly as such in the file header. But `validate.py`'s era-coverage
  check and the app's own era rendering both key on `published`, so the
  spans had to be expressed and checked in publication-year terms to be
  mechanically real rather than decorative. Net effect: 57 of 111 works
  (29 pre-1924, 28 posthumous 1938-1959) render with no era plate at all.
  This is not a boundary-tightening accident (docs/CURATION.md SS5's
  "orphans whatever fell in the slack" trap) - I did not narrow a wider
  span - it is the mechanical, inevitable consequence of checking a
  composition-anchored periodisation against a publication-only field for
  an author roughly half of whose posthumously-published fiction was
  written while he was alive. Recorded at length in the file's own header
  with two named concrete examples (Ward, Dream-Quest) rather than left for
  the next pass to rediscover via a wall of validator warnings with no
  context.
orphanReconciliation: >
  All 57 `published >range` warnings were expected and are individually
  accounted for by the file header's general accounting, not case-by-case
  notes per work (57 individual notes would bury the two that matter).
  29 are pre-1924 (no era claims those years at all - not an orphan in the
  "tightened span" sense, an honestly undrawn period). 28 are posthumous
  (1938, 7; 1939, 4; 1940, 3; 1941, 2; 1943, 3; 1944, 1; 1946, 1; 1949, 2;
  1959, 5) - every one published after Lovecraft's 15 March 1937 death, so
  none could sit inside a lifetime-bounded era regardless of where its
  boundary was drawn. The Case of Charles Dexter Ward (featured, composed
  1927, published 1941) and The Dream-Quest of Unknown Kadath (composed
  1926-27, published 1943) are named explicitly in the file as the
  clearest cases of work that belongs, by any biographical account, inside
  the Providence-return era and still renders with no plate.
boundaryOverlapNote: >
  1926 is claimed entirely by return-to-providence, not split with
  new-york-years, on the "majority of the year" convention the Poe wing's
  eras.yaml already uses for its own Philadelphia/New-York boundary
  (1843/1844) - Lovecraft left New York 17 April 1926, so roughly nine of
  that year's twelve months were in Providence. Flagged explicitly in both
  eras' `note` fields so a reader of the file does not need to infer it.
forStages:
  reading-orders: >
    No interaction expected - eras and orders are independent capabilities.
    Worth knowing if a startHere path gets built: the Randolph Carter arc
    (completeness-auditor's handoff) spans both a pre-1924 work (Statement
    of Randolph Carter, 1920, uncovered) and two posthumously-published
    ones (Dream-Quest 1943, Through the Gates of the Silver Key not in this
    era file's scope since apocrypha canonTier doesn't change that), so a
    Carter-arc reader will see zero era plates across that whole path. Not
    a defect in this file, just a fact worth having in view before writing
    startHere copy that implies era context exists everywhere.
  visual-metadata: >
    Deliberately left organisation/illustration_type/images_required/images
    entirely unset on both eras - out of this stage's scope per SKILL.md
    (the eras skill never mentions those fields; Poe's and King's eras.yaml
    carry them but those wings have already been through visual-metadata,
    this one hasn't). Both eras are `chapter-gate` slots by construction
    once art is drawn ("An era plate IS the chapter-gate slot by
    construction" - validate.py's own comment); whichever illustration_type
    is picked must be a KEYED type per the wing's own standing note in
    memory (era plates must stay keyed, LAYOUT's establishing-landscape is
    OPAQUE and would misfile the plate).
  wing-audit: >
    Two things worth a second look, both already flagged loudly in the file
    rather than hidden: (1) the pre-1924 gap - defensible under CURATION.md
    SS4 ("fewer beats coined") but a curator with access to sources this
    pass didn't check (e.g. a print-only academic periodisation) could
    still find a receivable name for it; (2) the 51% orphan rate (57/111)
    is unusually high for this catalogue - not a defect given the reasoning
    above, but worth comparing against other heavily-posthumous wings if
    any exist, to see whether this pattern recurs or is Lovecraft-specific.
openQuestions:
  - "Whether a future schema change (a composition-year field on works.yaml,
    populated from Wikipedia's own 'Date written' column, the same source
    already cited throughout this wing) is worth proposing so era membership
    could be computed on the axis these sources actually periodise - flagged
    as a real option, not a recommendation, since it is an app/schema change
    outside any single stage's mandate and affects every wing's date
    handling, not just this one."
