stage: franchise-research
summary: >
  Scaffolded the H. P. Lovecraft wing from scratch: author entity,
  franchise.yaml, a 111-work first-draft bibliography, theme.yaml. Both
  curation problems in orrery-content#66 got an explicit sourced ruling
  (see below), not left ambiguous. Validator green on this slug (0
  errors, 0 warnings).
produced:
  files:
    - content/authors/hp-lovecraft.yaml
    - content/franchises/hp-lovecraft/franchise.yaml
    - content/franchises/hp-lovecraft/works.yaml
    - content/franchises/hp-lovecraft/theme.yaml
  workCounts: {total: 111, fictionCore: 65, juvenilia: 5, poetryNonfiction: 3, collaborations: 38}
  tiering: "core = finished solo tales/novellas/the one novel; apocrypha = juvenilia, fragments, letter-excerpts, and EVERY collaboration/revision/ghostwrite regardless of Lovecraft's share; extended = Fungi from Yuggoth + 2 nonfiction"
  cthulhuMythosSubseries:
    count: 25
    test: "Necronomicon/Abdul Alhazred (sourced per-story via hplovecraft.com's quotes page) OR a named pantheon entity/race (Cthulhu, Yog-Sothoth, Nyarlathotep, Azathoth, Shub-Niggurath, Deep Ones, Great Race, Elder Things/Mi-Go). Applies to ghostwritten pieces too where the Mythos content is his own (Bishop trilogy, several Heald/de Castro pieces). NEVER a Derleth piece - those are excluded from the wing outright."
    deliberatelyUntagged: "dagon, the-temple - thematic ancestors, name no entity/Necronomicon, so the test doesn't reach them (noted in their synopses)"
  randolphCarterSubseries:
    count: 4
    works: [the-statement-of-randolph-carter, the-silver-key, the-dream-quest-of-unknown-kadath, through-the-gates-of-the-silver-key]
    note: "genuine author-continued character thread, Poe/Dupin precedent; 2 of these also touch Mythos entities but a work carries only one subseries value so the tighter thread won"
  featured: [the-call-of-cthulhu, the-case-of-charles-dexter-ward, the-haunter-of-the-dark]
  theme: {preset: cosmic-antiquarian, displayFace: spectral, signature: rule, accent: "#4a7d72", checkedAgainstDigest: true}
  deliberatelyOmitted: "eras.yaml, orders.yaml, editions.yaml, achievements.yaml, events.yaml all absent (empty is a supported state); franchise.yaml leaves features/startHere/globalEvents unset; author lifeEvents is []"
  authorBasics: "born 1890-08-20 Providence RI, died 1937-03-15 Providence RI (intestinal cancer, Jane Brown Memorial Hospital), buried Swan Point Cemetery - sourced in the author file header"
forStages:
  completeness-auditor: >
    Biggest deliberate gap: the amateur-journalism poetry/essay corpus
    (~300 items) is excluded on documented grounds in works.yaml's header,
    not overlooked - re-verify that call. published = first-publication
    year throughout (not composition), from Wikipedia's Lovecraft
    bibliography (sourced to Joshi & Schultz's Encyclopedia); worth a
    second primary source given how much is posthumous (1938-1959).
    4 nonextant juvenilia + "The Inevitable Conflict" (disputed authorship)
    checked and excluded.
  press-archaeology: >
    lifeEvents empty, first real pass. Racism is flagged as load-bearing
    (not characterised) in the author file's own header; it also surfaces
    in specific catalogued works with sourced notes worth reading first:
    facts-concerning-the-late-arthur-jermyn-and-his-family,
    the-rats-in-the-walls, the-horror-at-red-hook, medusas-coil. Birth
    event floor (CURATION.md SS6) applies as normal.
  eras: >
    eras.yaml absent. Providence / Kalem-Club-New-York / return-to-Providence
    is the standard sourceable periodisation (Joshi's own biography); not
    drawn at scaffold speed. 111 works, 1916-1959 published span - well
    above the skip-the-stage threshold.
  reading-orders: >
    No startHere/orders.yaml. A "famous handful" path and a Randolph
    Carter arc path both look citable (Poe wing has the same two-path
    shape) - verify a receipt exists before writing either.
  visual-metadata: "No portrait, no covers anywhere - not attempted this stage. Public domain, long dead; Commons/LoC coverage should be realistic."
  wing-audit: >
    Two of my own weakest calls: (1) poetry/nonfiction scope (1 cycle + 2
    essays vs. atomising ~300 poems like the Poe wing) departs from
    precedent, argued in works.yaml's header. (2) The Mythos membership
    test is my own construction from primary-source evidence, not copied
    from a published taxonomy - internally consistent but "Cool Air" and
    "The Rats in the Walls" were deliberately left untagged despite real
    scholarly discussion of their cosmic-horror themes.
openQuestions:
  - "Poetry/nonfiction scope: is 1 cycle + 2 essays right, or should completeness-auditor atomise more of the amateur corpus? Argued in works.yaml; flagged as a real precedent departure, not a shaky call."
  - "the-night-ocean and satans-servants: documented direction runs opposite the rest of the collaborations section (Barlow/Bloch as primary authors) - weakest fit for being in this bibliography at all, on the same principle that excluded Derleth."
  - "the-thing-in-the-moonlight and poetry-and-the-gods: authorRole direction genuinely unresolved in sources checked at scaffold speed, not a placeholder."
