stage: press-archaeology
summary: >
  First aura pass on this wing. lifeEvents 0 -> 17 on the author entity, and
  events.yaml created from scratch with 11 franchise events (posthumous
  publication and reception history). Aura went 3 -> 31 entries, ratio 0.03
  -> 0.28 per work, and the 24-year dark run flagged by stage_plan
  (1936-1959) closed to 4 years (1955-1958). Lovecraft's racism is written
  as sourced biographical fact at four points in the timeline rather than as
  one summary line, per the request issue (orrery-content#66). Validator
  green, art_rotation green on both axes.
produced:
  filesChanged:
    - content/authors/hp-lovecraft.yaml
    - content/franchises/hp-lovecraft/events.yaml
  lifeEvents: 17
  franchiseEvents: 11
  gates:
    validateBefore: "OK (0 errors, 0 warnings on this slug)"
    validateAfter: "OK (0 errors, 0 warnings on this slug); negative-controlled by breaking an inline work ref and confirming it errors"
    auraBefore: "111 works, 3 aura, 0.03/work, 1916-1959, 24 yr dark run (1936-1959)"
    auraAfter: "111 works, 31 aura, 0.28/work, 1916-1959, 4 yr dark run (1955-1958)"
    artRotation: "organisation caps hold, no neighbour repeats, contour #==.=.====#.====#==#====.==# - no two loud touching, no plateau"
    i18nCoverage: "pt-PT 150/166 -> 150/167 files fully covered; no file regressed. The wing was already wholly untranslated; events.yaml (22 fields) is new and authors/hp-lovecraft.yaml grew 1 -> 36 untranslated fields."
  racismTreatment:
    where: >
      Four entries, deliberately spread across the timeline instead of
      collected into one: hp-lovecraft-first-published-poem-1912 (the 1912
      Evening Bulletin poem), hp-lovecraft-argosy-feud-joins-uapa-1914 (the
      1913 Argosy letter that restarted his career),
      hp-lovecraft-red-hook-and-the-letters-1925 (the letters, Sonia
      Greene's 1948 memoir, and James F. Morton),
      hp-lovecraft-politics-shift-1930s (the documented partial moderation),
      plus the franchise event world-fantasy-award-retires-the-bust-2015.
    sourcing: >
      Primary and near-primary throughout: his own published verse
      (Joshi/Schultz encyclopedia entry giving the Evening Bulletin, March
      4, 1912); his own Argosy letters (Joshi 2010 and de Camp via
      Wikipedia); Sonia Greene's memoir in the Providence Sunday Journal,
      August 22, 1948, read page by page in Brown University's scan
      (bdr:425853) rather than cited from a summary; Wikipedia's Race
      section, sourced to Joshi, Schweitzer, Evans, Callaghan and Spencer;
      the Guardian's 2014 and 2015 reporting for the award campaign and
      Joshi's response.
    whatWasNotDone: >
      No slur is reproduced in the content. The 1912 poem whose title is
      itself a slur is named by date, form and argument, and the works.yaml
      convention (a period-typical racial slur, unnamed) is followed. No
      characterisation goes beyond what the cited scholarship states, in
      either direction - the moderation of the 1930s is recorded as
      moderation and explicitly not as abandonment.
  primarySourceFound: >
    Sonia H. Davis and Winfield Townley Scott, "Howard Phillips Lovecraft as
    His Wife Remembers Him," The Providence Sunday Journal, August 22, 1948,
    Books section pp. 8 and VI. Scanned complete and free at
    repository.library.brown.edu/studio/item/bdr:425853/ (the Brown
    repository landing page CAPTCHAs; the archive.org capture of its PDF
    endpoint serves the file). Pages 1-4 were read directly. It is the only
    sustained first-hand account of Lovecraft by an adult who lived with
    him, and it carries, in her words, his behaviour in New York, the money
    arrangements of the marriage, his refusal to see a doctor, and his own
    line "It is more important to know what to hate than it is to know what
    to love." Pages 5-6 were not read and may hold more.
corrections:
  - >
    content/authors/hp-lovecraft.yaml header stated the cause of death as
    "intestinal cancer compounded by chronic malnutrition", citing Wikipedia
    and hplovecraft.com. Neither source gives malnutrition. Both give cancer
    of the small intestine alone. The header now says so and records that
    the malnutrition claim is not carried by the cited sources.
  - >
    The same header's note that Lovecraft's racism "is not attempted here"
    and needed independent sourcing is superseded: it is now written into
    lifeEvents from its own sources, and the header points at them.
rejected:
  - "Lovecraft's diet and daily food spend (the 30-cents-a-day figure). Traces to biography retellings, not to a source that could be opened; his own letter claim about living three days on bread, beans and cheese survives only through a Wired feature quoting it. Left out."
  - "Nnedi Okorafor's own 2011 blog post. The page is a Blogger dynamic-view template and serves no post body to a fetch; the Guardian's 2014 report quotes it directly and is cited instead."
  - "Jean Cocteau's reported enthusiasm for Papy's 1954 translation. One French fan blog only. Held out; the Paris-Match coverage and the Denoel bibliographic record carry the entry without it."
  - "A second epigraph from the 1921 letter about amateur journalism ('a renewed will to live'). Two reputable transcriptions of the same letter disagree on the wording, so it is quoted only in the one phrase they agree on, inside prose, not as an epigraph."
  - "Chaosium's Call of Cthulhu roleplaying game (1981) and the wider adaptation record. Real and large, but it is franchise reach rather than a reception rupture, and this wing did not need a twelfth franchise event to close its gap."
recordDoesNotContain:
  - >
    1955-1958 is genuinely quiet and is the remaining 4-year dark run.
    Arkham House issued no books at all in 1955 or 1956, no previously
    unpublished Lovecraft reached print between 1949 and 1959, and the
    period sits between the French discovery and the 1960s paperback cult.
    Researched and found empty rather than skipped; a later pass should not
    re-search it without a new archive.
  - >
    American newspaper archives from Lovecraft's lifetime were not reachable
    without a subscription. The 1937 Boston Globe death notice and the
    Providence Journal's own contemporaneous coverage are cited in the
    scholarship but were not opened here. A human with a library card, or
    Brown's own digital repository, could get both.
  - >
    Edmund Wilson's 1945 New Yorker essay is paywalled at source. The date
    and title are confirmed against the ISFDB title record; the quotations
    come from Wilson's own Classics and Commercials (1950) as quoted in
    Wikipedia, not from the magazine page.
  - >
    scholarcommons.sc.edu blocks automated fetches, so a University of South
    Carolina thesis on Lovecraft's French reception could not be read. The
    France entry rests on French Wikipedia's bibliographic record and on
    Retronews's editorial about the 1954 Paris-Match coverage instead.
forStages:
  eras: >
    The periodisation the record supports, and which these events now
    anchor: Providence and amateur journalism (1914-1923), New York
    (1924-1926), the return to Providence (1926-1937). Boundary dates are
    exact and sourced here: joined the UAPA April 1914, married March 3
    1924, returned to Providence April 17 1926, died March 15 1937. Note
    that the wing's PUBLISHING span runs to 1959, so any era scheme has to
    decide what to do with the 22-year posthumous tail; events.yaml now
    covers it (Arkham House 1939, the omnibuses, The Shuttered Room 1959).
  event-resonance: >
    Three globals currently reach this wing on the lifetime default alone
    (world-war-i-1914, pulp-magazines-1926, penguin-paperback-1935) and
    count toward the 31 above. If they are excluded, the dark run stays at 4
    years: 1926 is independently lit by the return to Providence, and
    1934-1935 becomes a 2-year gap. pulp-magazines-1926 is the obvious
    include - Weird Tales was his only market and its editor's rejections
    shape three entries here.
  world-events: >
    1950s is the decade stage_plan flagged as having no global event. The
    remaining dark run in this wing is 1955-1958 and it is a real silence in
    the author's own record; a global event landing there would light it,
    but do not manufacture one for that reason.
  visual-metadata: >
    28 aura entries now need sketches (29 image slots: the diptych
    hp-lovecraft-mountains-of-madness-rejected-1931 takes 2, the epigraph
    hp-lovecraft-fear-of-the-unknown-1927 takes 0). Real photographs exist
    and are worth checking for the editorial-portrait-adjacent entries:
    Wikipedia carries the 1892 family portrait (the only known photograph of
    his father), Lovecraft and Sonia Greene on July 5 1921, his 1915 UAPA
    portrait, the June 1934 Florida photograph, the Samuel B. Mumford House,
    his gravestone, and the World Fantasy Award bust.
  reading-orders: "No change to the works; the eras note above is the useful part."
  translation: >
    All new prose is English-only. 22 new fields in
    franchises/hp-lovecraft/events.yaml and 35 new fields in
    authors/hp-lovecraft.yaml. Note the verbatim quotations: the epigraph's
    `quote` must not be translated away from a published English original -
    render it per the house rule for quotations, and the same care applies
    to the Sonia Greene and Edmund Wilson quotations inside descriptions.
  wing-audit: >
    My own weakest calls, in order. (1) 17 lifeEvents exceeds CURATION.md
    SS6's "approximately 6-12"; I scaled to the career per the
    press-archaeology density table instead, on a 111-work wing with a
    24-year dark run, and the ratio lands at 0.28 against the 1-per-3-to-4
    floor. Worth a second opinion. (2) The four racism entries are 14% of
    the aura; that proportion is a judgement, not a measurement. (3)
    hp-lovecraft-argosy-feud-joins-uapa-1914 uses `passage` for a
    1913-1916 stretch partly to break a six-cell mid plateau; the
    organisation fits the content but the reason it was chosen over `beside`
    was pacing. (4) The France entry (1954) is the thinnest-sourced of the
    28 and is also the one that keeps 1952-1958 from being a 7-year run.
openQuestions:
  - "Cause of death: the scaffold's malnutrition claim was removed as uncarried by its cited sources. If a curator has Joshi's biography to hand, pp. 387-388 would settle whether it belongs back in."
  - "Pages 5 and 6 of the 1948 Providence Sunday Journal memoir were not read. They may carry more on his last years and on the divorce; the scan is free at Brown."
