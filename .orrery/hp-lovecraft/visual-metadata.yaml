stage: visual-metadata
summary: >
  Portrait, header and 8/111 work covers added. Coverage is low by design,
  not by budget: Lovecraft published no book of his own in his lifetime
  except The Shadow over Innsmouth (1936, 400 copies), so almost the whole
  bibliography exists only as magazine contents that never had a jacket to
  photograph. Every "single-title" mass-market paperback a reader would
  expect to find (Panther/Ballantine/Del Rey's "At the Mountains of
  Madness," "The Colour Out of Space," "The Dunwich Horror" and others) was
  checked against Open Library's own page counts and tables of contents and
  turned out to be a themed multi-story collection bearing the lead story's
  name on the spine - using one of those jackets for the lead story alone
  would have credited an anthology's art to a tale that never had its own,
  which is exactly the trap docs/CURATION.md SS4 and the skill file warn
  against. A cover was kept only where an Open Library edition record
  independently confirmed a genuine solo printing: a Necronomicon Press or
  Hippocampus Press specialist pamphlet, or a Donald M. Grant illustrated
  deluxe edition. Validator green on this slug (0 errors, 0 new warnings;
  the 64 shown are the pre-existing era-coverage and handoff-length
  warnings already attributed to earlier stages).
produced:
  filesChanged:
    - content/authors/hp-lovecraft.yaml
    - content/franchises/hp-lovecraft/franchise.yaml
    - content/franchises/hp-lovecraft/works.yaml
  coverage:
    portrait: "1/1"
    header: "1/1"
    covers: "8/111 (7%)"
    uniqueCoverUrls: 8
  portrait:
    choice: "H. P. Lovecraft, June 1934 (Lucius B. Truesdell)"
    why: >
      The photograph hplovecraft.com's own gallery hosts and English
      Wikipedia's infobox uses - the single most reproduced likeness of
      him. Public domain (published without a copyright notice). Commons
      holds no scan of this specific print larger than 512x628; a 2020
      colourised derivative exists under a colourist's own CC BY 2.0, but
      the plain public-domain original was used instead of a modern
      recolouring.
    rejected: >
      The June 1934 Barlow "Florida" photograph (very high resolution,
      clearly PD) and the 1915 UAPA portrait (also PD) were both real
      candidates; Truesdell's photo was chosen for being the one already
      doing double duty as the canonical reference image everywhere else
      this author is discussed.
  header:
    choice: "Ladd Observatory, Brown University (Apavlo, public domain)"
    why: >
      Lovecraft petitioned to use its telescope as a teenager, wrote his
      own newspaper astronomy column out of what he learned there from
      1906, and kept an astronomical notebook for a decade before
      publishing fiction - the documented root of the cosmicism theme.yaml
      already names as this wing's emblem. A symmetrical, dead-centre
      front elevation at 2048x1536, sky and dome sitting in the middle
      third vertically.
    rejected: >
      135 Benefit Street (the real "Shunned House," CC BY 3.0) is an
      equally well-documented building but only available portrait-oriented
      (2112x2816) with a tree trunk dominating the frame - a poor source
      for a wide horizontal crop. Two other Ladd Observatory angles (CC
      BY-SA, higher resolution) were passed over for this one's cleaner
      symmetry and because the PD-dedicated file needed no attribution
      negotiation.
  covers:
    method: >
      Resolved candidates via scripts/metadata/lookup.py's title sweep plus
      targeted Open Library search.json queries per title, then verified
      every candidate's own editions.json (page count, table_of_contents,
      publisher) before trusting a title match - this is where the
      anthology trap actually got caught, not from the title string alone.
      Every kept URL was fetched with ?default=false and looked at; none
      carry a retailer watermark or library stamp except where noted below.
    kept:
      - {work: at-the-mountains-of-madness, publisher: "Donald M. Grant, 1990", note: "95pp illustrated hardcover"}
      - {work: the-case-of-charles-dexter-ward, publisher: "Del Rey, 1987", note: "127pp, featured work"}
      - {work: the-shadow-over-innsmouth, publisher: "Necronomicon Press, 1994", note: "stands in for the un-covered original 1936 Visionary Publishing Co. edition"}
      - {work: the-shadow-out-of-time, publisher: "Hippocampus Press, 2001", note: "136pp corrected text, ed. Joshi & Schultz"}
      - {work: supernatural-horror-in-literature, publisher: "Hippocampus Press, 2000", note: "The Annotated Supernatural Horror in Literature, ed. Joshi"}
      - {work: fungi-from-yuggoth, publisher: "Hippocampus Press", note: "annotated edition, illustrated by Jason C. Eckhardt"}
      - {work: history-of-the-necronomicon, publisher: "Necronomicon Press, 1989", note: "typographic title page, reproducing the 1938 Rebel Press memorial pamphlet - plain by period design, not a scan defect"}
      - {work: the-challenge-from-beyond, publisher: "Necronomicon Press, 1990", note: "dual-panel pamphlet pairing Lovecraft's horror round robin with an unrelated same-titled SF round robin on its back cover; both legitimately belong to this one physical object"}
    rejectedOnSight:
      - "Fungi from Yuggoth's own Necronomicon Press 1982 pamphlet (cover 12874576): a library-stamped title-page scan (Cumberland County Library), the exact degraded-scan pattern docs/CURATION.md flags. Replaced with the clean Hippocampus Press illustrated edition instead."
      - "Supernatural Horror in Literature's Dover 1973 'cover' (id 308435, surfaced by the bulk lookup.py sweep): resolves to an unrelated Open Library work, 'Corpus of ancient Near Eastern seals in North American collections' - a wrong-record match the title string alone would never have caught."
    featuredWorksWithNoCover:
      - "The Call of Cthulhu: every printing under this title is either a multi-story anthology or an unverifiable print-on-demand edition; no Necronomicon/Hippocampus solo pamphlet exists."
      - "The Haunter of the Dark: Necronomicon Press's only single-work release of it is an audio cassette (1995), not a book - not a legitimate source for a cover field."
    otherNamedGapsCommented: "the-dunwich-horror, the-colour-out-of-space, the-whisperer-in-darkness, herbert-west-reanimator each carry a one-line comment naming what was checked and why it came up empty, since these are famous enough to be re-searched by a later pass."
verification:
  validateBefore: "OK, fully green per the orchestrator's briefing (prior stage handoffs)"
  validateAfter: "OK - 0 errors, 0 errors catalogue-wide; 64 warnings on this slug, all pre-existing (57 era-coverage from the eras stage, 7 handoff-length from earlier stages' own handoffs); confirmed none are new by diffing the warning list against the non-era-coverage subset."
  everyUrlFetched: "All 10 image URLs (1 portrait, 1 header, 8 covers) fetched with ?default=false, confirmed non-placeholder byte sizes, and looked at directly - none show a retailer watermark, and the two initially-caught bad candidates (Fungi from Yuggoth's library-stamped scan, Supernatural Horror in Literature's wrong-work Dover id) were replaced, not shipped."
  duplicateCheck: "8 cover fields, 8 unique URLs - no repeats."
  omnibusChecks: "Every kept cover's Open Library edition record was read directly (page count and/or table_of_contents), not inferred from the title string; this is what caught that the Panther/Ballantine/Del Rey 'single-title' paperbacks are all Joshi/Derleth-edited multi-story collections."
forStages:
  editions: >
    Running in parallel on the same base; no file collision (editions.yaml
    untouched). If editions.yaml is later built for this wing, note that
    most 'single-title' Lovecraft paperbacks found during this pass are
    actually themed anthologies (At the Mountains of Madness, The Colour
    Out of Space, The Dunwich Horror, The Shadow Out of Time all have
    'and Other...'-style editions bundling 6-8 stories) - useful context
    before citing one as a specific work's edition.
  wing-audit: >
    Worth a second look: (1) history-of-the-necronomicon's cover is a bare
    typographic title page, not jacket art - kept because it is period-
    accurate for a 1938 memorial chapbook rather than a defect, but it is
    visually the thinnest of the eight. (2) the-challenge-from-beyond's
    cover shows two different round-robin stories on its two panels; the
    entry's comment explains why this is still one honest physical object
    rather than an anthology substitution, but it is a judgement call.
    (3) 7% cover coverage is intentionally low for this author specifically
    (see the works.yaml header's own COVERS note) - not comparable to a
    novel-writing author's expected coverage, and should not be read as
    this pass having under-searched.
openQuestions:
  - "Herbert West-Reanimator has a genuine June 1985 Necronomicon Press solo
    pamphlet (Open Library OL10449839M) but no cover in its record - if a
    curator or later pass finds a physical or scanned copy of that specific
    printing, it would close one of the more visible remaining gaps
    (adapted into the Re-Animator films, so a reader is likelier to look
    for it than for most apocrypha)."
  - "The original 1936 Visionary Publishing Co. edition of The Shadow over
    Innsmouth (his only lifetime book) has no cover anywhere in Open
    Library's record, predating ISBNs; the 1994 Necronomicon Press
    scholarly edition stands in for it. A library or archive scan of the
    actual 1936 dust jacket, if one surfaces, would be the more historically
    exact choice."
