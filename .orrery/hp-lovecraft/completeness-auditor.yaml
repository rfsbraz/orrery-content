stage: completeness-auditor
summary: >
  111 works checked, 111 kept - no additions, removals, or retiering. The
  65-work fiction spine and 38-work collaborations list were both verified
  title-by-title and date-by-date against the raw Wikipedia bibliography
  table (parsed directly from HTML, not summarised) and cross-checked
  against hplovecraft.com's own Necronomicon-quotes page for the Cthulhu
  Mythos subseries. Every date matched exactly; nothing missing or
  spurious. Three corrections landed, all documentation/attribution fixes:
  a missed fifth nonextant-juvenilia title, an undocumented entity (Yig) in
  the Mythos test's own named-entity list, and a real factual error on
  the-thing-in-the-moonlight (its note had the publication byline
  backwards). Validator green.
produced:
  filesChanged: [content/franchises/hp-lovecraft/works.yaml]
  worksBefore: 111
  worksAfter: 111
  corrections:
    - "Header: '4 nonextant juvenilia' -> 5, adding The Picture (1907) to the named exclusion list."
    - "Header: added Yig to the Mythos test's named-entity list (the exception clause already relied on it for the-curse-of-yig, undocumented)."
    - "the-thing-in-the-moonlight: authorRole co-author->author, contributionTitle removed, note rewritten. Prior note said published under Miske's name; Wikipedia's own infobox and a direct source check give the Jan 1941 Bizarre byline as Lovecraft alone, Miske (co-editor) added only a frame+title around Lovecraft's own letter text. Joshi's bibliography groups this with the-evil-clergyman/the-very-old-folk (both solo letter-extracts elsewhere in this wing), not as a developed collaboration. No reorder."
    - "poetry-and-the-gods: note expanded (not reversed) - Lovecraft's amateur byline was pseudonym Henry Paget-Lowe; piece absent from his own fiction lists/letters, surfaced only via George Wetzel's later republication. Added its dedicated Wikipedia article as a second source."
verification:
  soloFictionSpine: "All 65 titles/dates match Wikipedia's fiction table exactly, same order. Format split 57 short-story/6 novella/1 novel/1 reference matches the table's own column values."
  collaborations: "All 38 titles/dates/collaborators match Wikipedia's collaborations table exactly."
  juvenilia: "5 extant match exactly; nonextant exclusion count was off by one, fixed."
  fourFlaggedCases:
    the-night-ocean: "CONFIRMED as scaffolded - Joshi puts the finished text at ~90% Barlow's. Existing co-author tier/note already correct. Distinguished from Derleth: contemporaneous, byline-credited (Barlow with Lovecraft) during his life, not a posthumous invention."
    satans-servants: "CONFIRMED, direction even more one-way than stated - sources say no published prose is Lovecraft's, advice only. Existing note already correct."
    poetry-and-the-gods: "CONFIRMED genuinely unresolved against the story's dedicated Wikipedia article; note expanded with sourced facts, core call unchanged."
    the-thing-in-the-moonlight: "NOT actually unresolved on prose direction - it was factually backwards (see corrections). Fixed."
  cthulhuMythosSubseries: "All 25 tags reverified. The 19 stories on hplovecraft.com's Necronomicon page are all correctly tagged, with the one deliberate documented exception (through-the-gates-of-the-silver-key, tighter Randolph Carter thread wins per header rule). The 6 entity-test-only members checked out against their own synopses. One doc gap found+fixed (Yig)."
  derlethExclusion: "Reconfirmed: 16 titles match Wikipedia's Derleth list exactly; The Inevitable Conflict independently confirmed under Wikipedia's own Unknown Authorship heading."
  poetryNonfictionScope: >
    RULING: correct as scaffolded, settled not open. Poe wing atomises 34
    poems (~50-poem career total, roughly half his claim to being read).
    Lovecraft's bibliography lists ~300 amateur poem titles, mostly
    undatable-beyond-a-season occasional verse with nothing citable to say
    - atomising it would violate CURATION.md's received-not-invented and
    density rules, not complete the wing. Not for a later stage to revisit.
