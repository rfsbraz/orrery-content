stage: reading-orders
summary: >
  Shipped 2 orders and a 4-path startHere wizard on a shelf with no numbered
  series: 65 solo tales/novellas across four decades, 38 individually-sourced
  collaborations, and two subseries (Randolph Carter, 4 works; Cthulhu Mythos,
  25 works). Randolph Carter got a real reshuffle (chronological-inuniverse,
  sourced to Wikipedia citing S. T. Joshi's reading of The Silver Key's own
  internal chronology); Cthulhu Mythos got a thread-pulled-from-the-shelf
  order (curated, publication order only, no in-universe sequence claimed) -
  a "build the mythology" curated sequence was researched and explicitly
  rejected as unsourced. startHere ships an essentials path (4 works, sourced
  to 4 independent reading-guide publications converging on the same titles),
  a path per subseries pointing at its order, and the completionist default.
  Validator green on this slug: 0 errors, 61 warnings, all pre-existing (57
  era-coverage from the eras stage, 4 handoff-length notices on other stages'
  files) - orders.yaml and franchise.yaml introduced zero new warnings.
produced:
  filesChanged:
    - content/franchises/hp-lovecraft/orders.yaml (new)
    - content/franchises/hp-lovecraft/franchise.yaml (startHere added)
  orders:
    - id: hp-lovecraft/randolph-carter-in-order
      type: chronological-inuniverse
      reorders: "Dream-Quest, Statement, Silver Key, Through the Gates - moves
        Dream-Quest from last-published (1943) to narratively first, and
        Statement from first-published (1920) to second."
      whoItSuits: "A reader who wants Carter's life in order rather than the
        order the stories reached print."
      cost: "Dream-Quest is also the longest, most digressive entry to open
        on, versus the tight 1920 short that actually introduced Carter to
        readers."
      sources: [en.wikipedia.org/wiki/Randolph_Carter (citing Joshi),
        en.wikipedia.org/wiki/The_Silver_Key, en.wikipedia.org/wiki/Through_the_Gates_of_the_Silver_Key]
    - id: hp-lovecraft/cthulhu-mythos-in-order
      type: curated
      reorders: "Nothing - publication order restricted to the 25-work
        subseries. Makes no in-universe-sequence claim; the debated block
        says so explicitly, twice."
      whoItSuits: "A reader who came to Lovecraft through Cthulhu/the shared
        mythology, not the completist or the newcomer to his prose generally."
      cost: "No continuous cast/timeline to reward reading back-to-back;
        drops Dagon and The Temple, both real thematic ancestors excluded by
        this wing's own sourced Mythos-membership test (not by this order)."
      sources: [hplovecraft.com/creation/necron/stories.aspx, en.wikipedia.org/wiki/Cthulhu_Mythos]
  ordersRejected:
    - candidate: "Cthulhu Mythos 'build the mythology' curated order (front-load
        Call of Cthulhu/Dunwich/Mountains, then works that assume that
        context), per the orchestrator's own suggested framing to consider."
      reason: >
        Searched specifically for this. No source recommends a Mythos-internal
        sequence beyond publication order; one aggregate search result stated
        plainly "there is not a great way to start delving into the Cthulhu
        Mythos - chronological order doesn't have a clear advantage." Shipped
        the defensible fallback (plain chronological, honestly labelled as
        such) instead of inventing the smarter version.
  startHerePaths:
    - id: essentials
      workIds: [the-call-of-cthulhu, the-shadow-over-innsmouth, the-colour-out-of-space, the-dunwich-horror]
      fit: {experience: [new], commitment: [taste]}
      sourcing: "4 independent publications fetched directly (Book Riot, Reedsy
        Discovery, Penguin Random House, The Teeming Brain) converge on Call
        of Cthulhu (4/4, first pick in 3/4) and Dunwich Horror (4/4); Innsmouth
        and Colour Out of Space each corroborated by 2+ sources plus, for
        Colour, Lovecraft's own stated preference already in the work's
        synopsis."
    - id: meet-randolph-carter
      orderId: hp-lovecraft/randolph-carter-in-order
      fit: {experience: [new, returning], commitment: [taste, arc]}
    - id: the-cthulhu-mythos
      orderId: hp-lovecraft/cthulhu-mythos-in-order
      fit: {experience: [returning], commitment: [arc]}
    - id: the-whole-shelf
      orderId: default
      fit: {experience: [completionist], commitment: [complete]}
  famousBookTrap: >
    Checked and found no strong sourced case for excluding any specific famous
    title from "essentials" (At the Mountains of Madness got mixed signals -
    ranked high by 2 of 4 sources, not explicitly "avoid first" by any of
    them with a quotable line - so it was left out on convergence grounds
    only, not flagged as a trap; overclaiming a "don't start here" warning
    without a citable source would have violated this skill's own discipline
    on that point).
verification:
  validate: "python3 scripts/validate.py --slug hp-lovecraft - 0 errors, 61
    warnings, all pre-existing (57 era-coverage, 4 other-stage handoff-length
    notices); zero new warnings from orders.yaml or franchise.yaml."
  i18nCoverage: "orders.yaml (4 fields) added to the wing's existing fully-
    untranslated set; no regression, consistent with every prior stage on
    this wing (translation runs last)."
  divergenceCheck: "Both orders diffed against the derived default before
    shipping; Carter genuinely reshuffles (2 of 4 positions move), Mythos does
    not and says so in its own debated block rather than overclaiming."
forStages:
  wing-audit: >
    My own weakest calls, in order. (1) The Cthulhu Mythos order's grounding
    is a filtered-and-sorted-by-year thread, same shape as the six Discworld
    thread orders and this catalogue's own Poe/Dupin order, but those
    precedents have an externally-sourced grouping (L-Space's own thread
    taxonomy; Poe's own "Sequel to" subtitle) where this wing's 25-work
    Mythos list is its own construction (sourced per-story, not copied from
    a single external enumeration) - flagged explicitly in the order's own
    debated block, worth a second opinion on whether that clears this
    catalogue's "received, not invented" bar for an ADDITIONAL order object,
    as distinct from the subseries tag itself, which an earlier stage already
    shipped and this stage did not relitigate. (2) The Randolph Carter
    chronology rests on one Wikipedia article's synthesis (itself citing
    Joshi) rather than reading Joshi's own book directly - a human with the
    physical text could verify Statement's "late forties" dating first-hand.
  translation: >
    orders.yaml (4 new fields: 2x name, 2x rationale) and franchise.yaml's 4
    new startHere paths (title/description/note x4, 12 fields) are English
    only, per this wing's existing untranslated status. Per SKILL.md SS11,
    order overlays carry name/rationale/debated only; path overlays carry
    title/description/note only - never orderedWorkIds/workIds/orderId/fit.
openQuestions:
  - "Whether the Cthulhu Mythos order's self-sourced membership list needs a
    stronger external citation to justify an ADDITIONAL order object (as
    opposed to the subseries tag alone, already shipped) - see wing-audit
    note above. Not reversed here because the actionable-reason and
    divergence tests both pass cleanly and the order makes no claim beyond
    what its sources support, but it is the one call in this stage that
    rests most on precedent-by-analogy rather than a source naming this
    exact 25-work list."
