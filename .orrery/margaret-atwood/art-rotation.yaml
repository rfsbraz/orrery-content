stage: art-rotation
summary: >
  Reviewed press-archaeology's own grading of all 14 timeline entries (6
  lifeEvents, 8 franchise events) and eras.yaml's 3 chapter-gate plates
  against the now-finished visual-language (the sealed-jar/card-catalogue
  register), rather than re-grading blind. Confirmed every organisation and
  illustration_type; changed nothing. Two specific checks this stage existed
  to do: margaret-atwood-handmaids-tale-hulu-2017's mosaic/press-media-collage
  pairing already reads through press coverage rather than a rendered
  costume, so it needed no revision to honour visual-language's Gilead-
  costume constraint; and eras.yaml's three chapter-gate plates use
  atmospheric-motif-field and symbolic-still-life, never
  establishing-landscape, so none trips prepare_asset.py's automatic
  --opaque inference for a slot that must file as `plate` (keyed, not
  dissolved) - a live trap this wing's motifs sidestep by construction, not
  by luck: visual-language's landscape motifs (field-naturalist-kit,
  sealed-package, boreal-treeline) never asked for a pure establishing shot.
  Reproduced both gates myself rather than trusting the handoff:
  `art_rotation.py margaret-atwood --check` prints 0 organisation-rotation
  problems and 0 pacing problems (contour `#=.=#=.===#=#=`, sourced below);
  its exit code stays 1 only on the composition/issue-history axis (0 of 17
  assets have an issue yet), which is asset-prompt's job, not this stage's,
  per the skill's own instruction not to chase that line.
  `validate.py --slug margaret-atwood` is 0 errors, 3 pre-existing
  handoff-length warnings (press-archaeology, visual-language, eras - none
  new here).
produced:
  organisationsAssigned: "17 total (3 era plates, 14 events); 0 changed from press-archaeology's draft"
  distribution: >
    Across the 14 event sketches (era plates excluded per LAYOUT.md - each
    already IS the chapter-gate slot): artifact-spread, medallion, mosaic,
    beside and diptych at 2/14 (14%) each; full-bleed-vista, passage,
    interlude and immersion at 1/14 (7%) each. beside sits well under its own
    exempt ceiling; every other organisation is far under the ~40% cap; no
    two consecutive events share one (script-confirmed).
  contour: "#=.=#=.===#=#= - loud at born-1939, award-sweep-1986, hulu-2017 and gibson-death-2019; none touching, none sharing a screenful, longest same-intensity run is 3 (positions 8-10, all mid)."
  tieBreakNote: >
    testaments-booker-2019 (10-14, franchise-event) prints before
    gibson-death-2019 (09-18, life-event) in the contour: art_rotation.py's
    year_of() truncates to bare years and its tie-break sorts
    franchise-event before life-event alphabetically, so two same-year
    entries can print out of true date order. Documented in
    press-archaeology's own handoff as the reason gibson-death sits on
    immersion rather than the diptych it first tried; re-verified here that
    the resulting pair (mosaic, diptych, immersion) still clears both the
    touching-loud and shared-screenful checks.
  illustrationTypeSpread: >
    book-object is widest at 4/14 (29%, under the ~third cap): future-
    library-2015, alias-grace-giller-1996, oryx-and-crake-booker-2003,
    testaments-booker-2019 - four distinct organisations/moments (medallion,
    diptych, beside, diptych), not a repeated look. press-media-collage 3/14
    (21%): award-sweep-1986 and hulu-2017 share it but sit 31 years and
    5 events apart with different modifiers (anchor-with-satellites vs
    pull-focus); portrait-of-absence 2/14 (both deaths); the rest singletons.
  compatibilityCheck: >
    Walked every entry's illustration_type against its organisation's Holds
    list and every modifier against its compatible-organisation list in
    LAYOUT.md by hand: all pass. Both diptychs (alias-grace-giller-1996,
    testaments-booker-2019) correctly carry images_required: 2; the three
    era plates correctly hold atmospheric-motif-field or symbolic-still-life,
    never establishing-landscape.
