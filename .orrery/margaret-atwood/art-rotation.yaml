forStages:
  visual-metadata: >
    No illustration_type changed. margaret-atwood-handmaids-tale-hulu-2017
    stays mosaic/press-media-collage/pull-focus: the pull-focus inset should
    zoom on a press artefact (a headline word, a network chyron, an awards
    podium), never on the distant crowd's clothing - the organisation and
    type already keep the costume out of frame, but a careless inset choice
    could still put it back in. Both portrait-of-absence entries
    (father-death-1993, gibson-death-2019) stay consistent with never
    generating Atwood's own likeness.
  asset-prompt: >
    Two diptychs need two complete prompts each, one per slot per LAYOUT.md's
    n-images-means-n-prompts rule: alias-grace-giller-1996 and
    testaments-booker-2019 (both book-object). One anchor-with-satellites
    (mosaic, award-sweep-1986) and one pull-focus (mosaic, hulu-2017) need
    their modifier's compositional text; one breakout (artifact-spread,
    unburnable-book-2022) and one pull-focus (artifact-spread,
    edible-woman-delayed-1969) likewise. The five spoiler-bound avoid items
    in theme.art (no collapse-agent, no Flood convergence, no Blind Assassin
    authorship staging, no Alias Grace guilt imagery, no MaddAddam survivors
    assembled) apply to any prompt text drawn from those books' events, none
    of which currently exist as separate franchise events here.
  wing-audit: >
    Nothing to flag from this axis alone. The wing-audit forStages note in
    press-archaeology (three Handmaid's Tale franchise events across 36
    years) is an aura-density question, not an organisation one: art-wise
    the three are well differentiated (mosaic/anchor-with-satellites,
    mosaic/pull-focus, artifact-spread/breakout) and spaced across the
    timeline rather than clustered.
