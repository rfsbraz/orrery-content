stage: translation
summary: >
  Built the pt-PT overlay from scratch (none existed): franchise description
  and all 5 startHere paths, all 69 work synopses, all 8 franchise events,
  all 3 eras, both orders (name/rationale/debated), the author bio and all 6
  lifeEvents, plus the 6 co-author bio files this wing's build introduced
  (Beckwith, Christmas, Barkhouse, Steacy, Alderman, Tanaka) - a franchise-
  scoped pass alone would have missed these six, per this skill's own
  documented failure mode; caught by reading coverage's file-by-file
  breakdown instead. i18n_coverage.py: pt-PT 165/191 to 177/191 files fully
  covered, the 12-file gain being exactly this wing plus its co-authors,
  zero regression elsewhere. validate.py --slug margaret-atwood: 0 errors;
  the 3 remaining warnings are the pre-existing handoff-length ones on
  press-archaeology/visual-language/eras, not this stage's.
produced:
  files:
    - content/i18n/pt-PT/franchises/margaret-atwood/franchise.yaml
    - content/i18n/pt-PT/franchises/margaret-atwood/works.yaml
    - content/i18n/pt-PT/franchises/margaret-atwood/events.yaml
    - content/i18n/pt-PT/franchises/margaret-atwood/eras.yaml
    - content/i18n/pt-PT/franchises/margaret-atwood/orders.yaml
    - content/i18n/pt-PT/authors/margaret-atwood.yaml
    - content/i18n/pt-PT/authors/john-beckwith.yaml
    - content/i18n/pt-PT/authors/johnnie-christmas.yaml
    - content/i18n/pt-PT/authors/joyce-barkhouse.yaml
    - content/i18n/pt-PT/authors/ken-steacy.yaml
    - content/i18n/pt-PT/authors/naomi-alderman.yaml
    - content/i18n/pt-PT/authors/shelly-tanaka.yaml
  spoilerPreservation: >
    The four bounded synopses (Alias Grace, The Blind Assassin, Oryx and
    Crake, The Year of the Flood) and the maddaddam-trilogy order rationale
    were translated from the redacted English, never from an independent
    Portuguese blurb - the Bertrand editions for these titles run fuller
    than the English jacket, which is exactly the leak this wing's own
    spoiler pass warned the next stage against. Each stays at the English
    boundary: Alias Grace keeps "diz não se lembrar" (says she doesn't
    remember), never resolving guilt or innocence; Oryx and Crake names
    nobody as the cause of the collapse; The Year of the Flood uses "a tão
    temida inundação sem água" (the jacket's own phrase) with no account of
    how it happened; The Blind Assassin keeps the inner novel attributed to
    Laura, nothing on who actually wrote it; the trilogy rationale argues
    for publication order without naming who is left standing at the end.
    The reading-orders and art-rotation handoffs' own flagged risks (the
    maddaddam-trilogy rationale; the Hulu/costume event) were re-checked
    directly against this translation's text, not re-derived from scratch.
  realTitleConvention: >
    Used the published Bertrand/other pt-PT title as inline display text
    wherever editions.yaml records one, across 15 works and every file type
    (inline links and plain-prose mentions in orders.yaml alike): A História
    de Uma Serva, Os Testamentos, Olho de Gato, A Impostora, Chamavam-lhe
    Grace, O Assassino Cego, Órix e Crex, O Ano do Dilúvio, Colchão de
    Pedra, Semente de Bruxa, Senhora do Oráculo, A Morte Beijou-a ao de
    Leve, Afectuosamente, No Alto da Árvore, Entre Gatos e Pássaros (the
    last two drop their Portuguese-only subtitle, matching the unsubtitled
    English original). MaddAddam keeps its English spelling: editions.yaml
    records the Portuguese cover printing it unchanged. Kept English
    everywhere editions.yaml records no pt-PT edition (The Edible Woman,
    Life Before Man, Survival, and the rest of orders.yaml's debated block).
  registerNote: >
    "Handmaid" renders as lowercase "serva" throughout (matching A História
    de Uma Serva's own vocabulary), never "aia" - editions.yaml itself
    documents "aia" as the word in the rival Brazilian translation, "O Conto
    da Aia," so using it here would have planted the exact pt-BR contaminant
    this collection's own sourcing rule exists to keep out.
  unverifiedQuote: >
    Power Politics's epigraph-level opening couplet ("you fit into me / like
    a hook into an eye") is translated directly rather than lifted from Ana
    Luísa Amaral's published translation (Relógio D'Água) - not confirmed
    against that edition's actual wording, flagged in the overlay's own
    header for a native reviewer.
forStages:
  wing-audit: >
    Confirm the spoiler-preservation claim above by reading works.yaml's
    four bounded pt-PT synopses and orders.yaml's maddaddam-trilogy
    rationale side by side with the English and with this handoff's
    quoted lines - the boundary is the same, in different words, not a
    looser paraphrase. Also worth a second look: this content-only worktree
    has no running app to render, so verification here is coverage +
    validate.py + a close read of the overlay text, not a live pt-PT page;
    a rendered-page check (per this skill's own "check the rendered output,
    not the report" rule) is a deployment-stage concern this build cannot
    reach.
openQuestions:
  - "Power Politics's opening couplet translation (see unverifiedQuote) is
     the one line in this pass worth checking against the actual Relógio
     D'Água edition rather than treating as settled."
