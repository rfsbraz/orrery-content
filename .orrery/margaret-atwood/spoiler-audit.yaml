stage: spoiler-audit
summary: >
  Audited all 69 synopses, 8 franchise events, 7 lifeEvents, 3 era
  descriptions, 2 order rationales and 5 startHere paths. All 17 core novels
  were ruled against their own publisher copy, never from memory. Four
  load-bearing leaks found, all in ungated prose, all rewritten: the engine
  carries no boundary on a synopsis, order rationale or startHere
  description, re-verified in the app (spoilerAfter exists only on AuraEvent;
  Work has no note field at all in lib/content/types.ts, so work notes never
  reach a reader). Every event and lifeEvent stays spoilerAfter: null; none
  needed a boundary, none existed to loosen. The guard was falsified before
  being trusted - a spoilerAfter planted on the Oryx and Crake work entry
  produced the expected hard error, and the file was restored.
  validate.py --slug margaret-atwood: the pre-existing theme.art error and
  the two pre-existing handoff-length warnings, unchanged and not this
  stage's.
produced:
  files:
    - content/franchises/margaret-atwood/works.yaml
    - content/franchises/margaret-atwood/orders.yaml
    - content/franchises/margaret-atwood/franchise.yaml
  rewrites:
    - "Oryx and Crake synopsis: dropped the clause naming Crake and Oryx as
       the cause of the collapse. The jacket names both characters but
       attributes the ruined world to 'powerful corporations' and 'an
       uncontrolled genetic engineering ride'; the novel holds the agent back
       until late."
    - "The Year of the Flood synopsis: 'the engineered plague that ends Oryx
       and Crake's world' becomes the jacket's own 'the long-feared waterless
       flood'. Toby and Ren surviving is this book's jacket copy and stays."
    - "Alias Grace synopsis: 'a doctor asked to determine whether she
       remembers what she did' presumed guilt. Now follows the jacket, which
       keeps innocence, guilt and insanity all live."
    - "maddaddam-trilogy rationale: removed 'the identity of the three
       survivors glimpsed at its very end', which described the reveal it
       existed to protect. The ordering argument survives without it."
    - "Trilogy-level prose (order rationale, the-maddaddam-arc path): the
       world is bioengineered, which is jacket framing; whether the collapse
       was engineered is not stated."
  notes_added: [alias-grace, the-blind-assassin, oryx-and-crake, the-year-of-the-flood]
forStages:
  visual-language: >
    Four works must not be drawn past what the prose now withholds. Oryx and
    Crake: Snowman, the Crakers, the compounds - not the collapse or anyone
    causing it. The Year of the Flood: the emptied city and its two women,
    not the closing convergence. The Blind Assassin: never a hand or desk
    implying who wrote the inner novel. Alias Grace: nothing answering
    whether she did it. The MaddAddam order's art stops short of the
    trilogy's resolution.
  translation: >
    The four rewritten synopses and the order rationale are bounded prose,
    not summaries awaiting completion. No pt-PT overlay exists yet, so they
    ship English-only; when one lands it must carry the same bounds. The real
    risk is a translator reaching for a Portuguese blurb, which for these
    four books runs fuller than the English jacket, and restoring the reveal
    in pt-PT alone. Each of the four entries states in a note where its prose
    stops and why; work notes never render.
  wing-audit: >
    Two judgements to re-examine. The trilogy is described as a bioengineered
    civilization that collapses (jacket framing) while the plague itself is
    never called engineered - a line drawn deliberately, stated here so it
    reads as a rule rather than an inconsistency. And The Year of the Flood's
    synopsis says survivors exist, its own jacket copy while touching what
    Oryx and Crake reveals last; kept because book two cannot otherwise be
    described, with no character from book one's ending named. Both are
    loosenable.
openQuestions:
  - "Checked and already safe, recorded so it is not re-litigated: The
     Handmaid's Tale (no epilogue framing, no Offred's fate); The Testaments
     (three narrators and Aunt Lydia are jacket copy, the young narrators'
     parentage nowhere); the 2019 Booker event, which describes the joint
     award, the broken rule and Gibson's death and never the plot; The Robber
     Bride (Zenia's return is jacket copy); MaddAddam (survivors and Crakers
     are jacket copy); Stone Mattress (the publisher itself says a long-ago
     crime is avenged in the Arctic); the nine remaining core novels, all at
     or under their jackets; the eras and lifeEvents, biography and criticism
     with no plot in them."
  - "The 27 works on beyond-the-novels were swept for short-fiction twist
     endings and none states one: the collections describe scope and name
     stories by title only."
