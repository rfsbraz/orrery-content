  result: zero violations found
  collisionPairsChecked:
    - pair: "event-resonance / reading-orders on franchise.yaml"
      finding: >
        event-resonance (23b392a) wrote only the globalEvents block (3
        include, 12 exclude, 4 left unruled) plus its own header-comment
        update. reading-orders (562c590) wrote only startHere (5 paths) plus
        its own orders.yaml, and touched the header comment only to record
        that orders.yaml/startHere now exist. Sequential per the stage
        order. Disjoint fields, no collision.
    - pair: "spoiler-audit / visual-metadata on works.yaml"
      finding: >
        spoiler-audit (6750602) rewrote only `note`/`synopsis` prose fields
        (four bounded redactions). visual-metadata (df2a929) added only
        `cover`/`coverCredit`/`coverSource`/`images` fields, 274 lines later
        in the file's life. Sequential (spoiler-audit runs before
        visual-language/art-rotation/editions/visual-metadata in the commit
        order). Disjoint fields, no collision.
    - pair: "art-rotation / visual-metadata on authors/margaret-atwood.yaml"
      finding: >
        art-rotation's commit (4a8bd55, "confirm the 14-item river, no
        changes needed") touched zero content files this run - its full
        diff is 92 insertions to its own .orrery handoff only. It reviewed
        press-archaeology's pre-existing organisation/illustration_type/
        images_required grading (set in ef23b6a) and concurred without
        writing anything. visual-metadata (df2a929) then added only an
        `images` block (portrait + credit + source) to the same file. No
        collision was possible because there was nothing to collide with -
        confirmed by diff, not inferred from the commit message.
  auditFixChainScope: >
    All three audit-fix passes stayed inside the files they were dispatched
    to touch. Pass 1 (2b5cae1, 4a83c2a, 691f7dc, e9412de, 45bcca8): only
    works.yaml, events.yaml, franchise.yaml and their pt-PT overlays, one
    file per finding, matching the five findings routed to it. Pass 2
    (b20b09d, 66281cb): only events.yaml and authors/margaret-atwood.yaml
    plus pt-PT overlays, both additive (new dated events), zero deletions.
    Pass 3 (d65d2c9): only authors/margaret-atwood.yaml and events.yaml plus
