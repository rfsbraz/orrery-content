    editions.yaml, orders.yaml, theme.yaml or art-rotation's own handoff -
    no scope creep from a targeted fix into a full stage re-run.
  fourthConfirmedPrewriteOccurrence: >
    press-archaeology's handoff (.orrery/margaret-atwood/press-archaeology.yaml
    lines 115-120, section forStages.art-rotation) states outright: "Every
    entry already carries organisation/illustration_type/images_required/
    modifier... Read the sourcing notes before changing any grading." This
    is the same pattern confirmed on hp-lovecraft (silent, twice) and
    dan-brown (documented by the receiving stage after the fact) - but here
    the WRITING stage names it in its own handoff before the receiving stage
    ever has to notice. No rework resulted; art-rotation's whole
    contribution this run was independent verification. Worth naming as the
    version of this pattern every future wing should produce: not "stop
    press-archaeology from pre-writing the fields" (its own build needs
    art_rotation.py --check to pass while it works), but "always say so",
    which this run did.

whackAMoleAnalysis:
  chain: >
    press-archaeology's first pass closed a 12-year aura dark run
    (1983-1994) to 4 years (1961-1964, pre-career, under the 5-year
    DARK_RUN_LIMIT), landing at 29 entries / 0.42 per work. event-resonance
    then replaced the lifetime-arithmetic default (which had been counting
    every global event falling between her birth and today as reaching the
    wing) with an explicit 3-item include list, dropping aura from 29 to 17
    entries - a materially different, and individually correct, editorial
    ruling. Nobody re-ran aura_density.py between event-resonance and
    wing-audit. wing-audit found the 1961-1964 gap had become an 8-year gap
    (1961-1968), the wing's one real weak seam ("aura proportion, not
    accuracy"). Audit-fix pass 1 closed it with the 1966 Governor General's
    Award (18 entries / 0.26, longest run now 7 years, 2008-2014 - "a
    pre-existing stretch the longer one had been masking," per the fix
    commit's own note). Audit-fix pass 2 closed 2008-2014 with five dated
    events (Massey Lectures/Payback, the Year of the Flood tour, the Payback
    documentary, the Twitter debut, the Dan David Prize), which exposed
    1970-1975 as the new worst. Audit-fix pass 3 closed 1970-1975 (Survival's
    academic-reception controversy) and, on the same pass, the newly-exposed
    1961-1965 (the 1961 graduation, Double Persephone, the Woodrow Wilson
    move to Harvard), landing at 25 entries / 0.36 per work / 4-year longest
    run, clean.
  mechanicalCause: >
    Read scripts/aura_density.py directly (lines ~109-125): the script
    tracks a single `worst` tuple per wing, overwritten whenever a longer
    run is found, and never accumulates the full list of runs over its own
    DARK_RUN_LIMIT (5 years). It prints exactly one dark run per wing. Every
    party in this chain - wing-audit and all three audit-fix passes - could
    only ever see the single worst violation at a time. Fixing it and
    re-running the script was not a chosen "close worst, remeasure, repeat"
    methodology; it was the only sequence the tool's own output makes
    possible. Three dispatches (~562,596 tokens / 280 calls combined: pass 1
    162,249/117 + pass 2 224,425/80 + pass 3 175,922/83) were spent partly on
    discovering that a second and third violation existed at all, work a
    single tool call could have surfaced up front.
  recommendation: >
    Two changes, not one, because two distinct causes are stacked here.
    (1) Mechanical, cheap, and this run's actual saving opportunity:
    change scripts/aura_density.py to report every run >= DARK_RUN_LIMIT per
    wing, sorted longest first, not just the single worst. A wing-audit or
    audit-fix pass that can see "8 years here, 7 years there, 6 years over
    there" in one call can research and close all three in one dispatch
    instead of three - this alone would likely have collapsed passes 2 and 3
    into pass 1's dispatch. (2) Already open from dan-brown's
    aura-hole-recompute-dependency finding, and now confirmed a second time
    on a larger gap (8 years here vs. dan-brown's 4-to-9): re-run
    aura_density.py immediately after event-resonance, before the wing
    proceeds to spoiler-audit/editions/wing-audit, so a narrowing-caused
    regression is caught and fixed in the same cycle that caused it, by a
    lightweight press-archaeology follow-up, rather than surfacing stages
    later at wing-audit and costing a post-hoc fix chain. Fix (1) is a
    one-function edit to a script already read by every stage that touches
    aura; fix (2) is a stage_plan ordering change. Neither is "close the
    worst gap, re-measure, repeat" being validated as correct - that shape
    is a symptom of (1) not existing, not a procedure worth keeping.

