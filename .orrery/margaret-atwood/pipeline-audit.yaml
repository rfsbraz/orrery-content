status: complete

summary: >
  Audited the run's cost and process, not the wing's content. First wing on
  this catalogue with complete per-stage cost instrumentation from
  franchise-research through the final audit-fix pass - 3,489,891 tokens /
  1,462 tool calls / 16 agent dispatches across 13 named stages plus 3
  audit-fix follow-ups, all measured (dan-brown, one run earlier, had a
  5-of-15-stage gap). Confirmed zero footprint violations across all three
  named collision pairs by diffing each commit's touched fields, not just
  reading commit order; art-rotation made no content edits at all this run
  (a fourth confirmed occurrence of the hp-lovecraft pre-write pattern, this
  time named explicitly in press-archaeology's own handoff rather than
  discovered by diff). The run's real finding is the three-pass aura
  whack-a-mole: press-archaeology closed a 12-year dark run to 4, event-
  resonance's later narrowing of the global-event include list silently
  reopened an 8-year one nobody re-measured, and closing it took three
  sequential audit-fix dispatches (~562,596 tokens / 280 calls) because
  `scripts/aura_density.py` reports only the single longest dark run per
  wing, never the full list over threshold. Routed three systemic findings
  to docs/pipeline-runs.md's ledger (rows 16-18).

