fixes:
  - >
    margaret-atwood-survival-paraphrase-controversy-1974 - franchise event,
    mosaic/press-media-collage. Survival sold well from 1972 but the
    scholars who taught Canadian literature turned on it fast: Frank
    Davey's "Atwood Walking Backwards" (Open Letter 2:5, 1973), then
    George Woodcock's "Horizon of Survival" (Canadian Literature 55, 1973),
    then Davey's "Surviving the Paraphrase," delivered at the founding
    conference of the Association for Canadian and Quebec Literatures in
    spring 1974 - later academic accounts (Brydon and Kamboureli, Studies
    in Canadian Literature 32:2, 2007) say it "took the small world of
    Canadian literary criticism by storm." Dated to the 1974 delivery, not
    its 1976 print publication, since the dispute was already running.
    Sources: Wikipedia (Survival, Frank Davey), The Canadian Encyclopedia.
  - >
    margaret-atwood-double-persephone-harvard-1961 - author lifeEvent,
    medallion/book-object. Graduates University of Toronto in 1961 having
    studied under Northrop Frye and Jay Macpherson; the same year hand-sets
    and self-publishes her first book, Double Persephone (220 copies,
    flatbed press, self-designed linoblock cover), which wins the E.J.
    Pratt Medal, her first literary prize; leaves the same year for
    Radcliffe College at Harvard on a Woodrow Wilson Fellowship. Two
    independent, exactly-agreeing sources for dates/posts (Wikipedia,
    margaretatwood.ca); the Double Persephone details from Wikipedia's own
    article on the book.
  - >
    art-rotation: both placed without repeating an adjacent neighbour on
    the first attempt - checked explicitly against the prior pass's own
    mistake. 1974 sits between artifact-spread and passage, so mosaic;
    1961 sits between full-bleed-vista and beside, so medallion (echoing
    future-library-2015's medallion/book-object, non-adjacently).
