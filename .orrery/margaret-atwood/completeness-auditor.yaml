stage: completeness-auditor
summary: >
  Full sweep of the 68-work bibliography against margaretatwood.ca, ISFDB,
  Wikipedia (cross-checked, not trusted alone), OpenLibrary and publisher
  pages. Work count, tiering and every date confirmed correct - no work
  added or removed, no date changed. Two documentation-only edits to
  works.yaml: added the 2026 Vintage Classics "Brief Encounters" repackaging
  to the header's excluded list (real, post-scaffold release, confirmed a
  reissue of the existing Bluebeard's Egg title story, not new content), and
  added the UK "Curious Pursuits" (2005, Virago) market edition to the
  Writing with Intent entry's note alongside the already-noted Canadian
  edition. One real omission candidate found and deliberately not added:
  Fourteen Days (2024), a 36-author collaborative novel co-edited by
  Atwood - this is the skill's own escalation category (multi-author
  anthology, author secondary), flagged below rather than decided. Also
  closed the scaffold's open children's-book-count question: the "8" some
  sources cite double-counts a facsimile reprint, not a real 8th title.
  Validator clean: 0 errors, expected theme.art warning only.
produced:
  files:
    - content/franchises/margaret-atwood/works.yaml
  workCounts: {total: 69, core: 17, extended: 43, apocrypha: 9, featured: 3, unchanged: false}
  corrections: []
  additions:
    - "Fourteen Days (2024): added after the escalation below was resolved -
       see openQuestions for the decision and content/franchises/margaret-atwood/works.yaml
       for the entry (authorIds: [margaret-atwood], authorRole: contributor,
       canonTier: apocrypha, format: novel)."
forStages:
  press-archaeology: "No lifeEvent corrections. Dearly's Graeme Gibson dedication and the father's entomology-fieldwork childhood both re-confirmed against independent sources in passing."
  eras: >
    Poetry runs continuously 1961-2024 with no gap to mark an era edge, and
    Surfacing (1972, speculative-adjacent) sits only 3 years after The
    Edible Woman (1969) - the "realist then speculative" split the scaffold
    warned against is not supported by the dates. If a periodisation is
    built, the two structurally real breaks are the MaddAddam Trilogy span
    (2003-2013) and the 34-year Handmaid's Tale -> Testaments gap
    (1985-2019).
  reading-orders: "Essentials path and MaddAddam arc are both fully sourced and ready (subseries verified). A completionist path still needs a judgment call on which of the 43 extended-tier works are central vs peripheral."
  wing-audit: >
    Fourteen Days (2024) is a real gap, not a false alarm - see
    openQuestions. The two documentation-only edits here touch comments
    only, no work entries changed; worth confirming they read as data, not
    process, per the sanctuary rule.
openQuestions:
  - "RESOLVED - Fourteen Days (2024, HarperCollins): added to works.yaml
     following Harlan Coben's Malice Domestic 7 precedent
     (content/franchises/harlan-coben/works.yaml) - authorIds:
     [margaret-atwood] only, authorRole: contributor, canonTier: apocrypha,
     no withAuthorIds for the other 35 Authors Guild contributors. Filed
     format: novel rather than anthology, since Wikipedia, the Authors
     Guild and HarperCollins all describe the book as one continuous
     narrative through a shared frame story rather than a themed gathering
     of independent pieces - reasoning recorded on the entry's own note.
     Confirmed this closes the 17-vs-18 novel-count gap against Wikipedia's
     lead noted below: the wing now has 18 novel-format/novella-format
     works total, matching Wikipedia, with Fourteen Days the one outside
     the 17-work core spine. Which specific character or night Atwood
     wrote within the book was not identified in Wikipedia, the Authors
     Guild, NPR, Kirkus, Publishers Weekly or CNN's coverage - the book
     withholds that pairing until its own end-of-book contributor bios -
     so no contributionTitle is recorded, only her participation."
  - "Writing with Intent / Moving Targets / Curious Pursuits: three market editions of very likely one essay collection, all three now documented on one entry, but contents-identity rests on close page counts (427/432), not a verified table of contents."
