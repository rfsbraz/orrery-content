stage: press-archaeology
summary: >
  Scoped follow-up to close the 7-year dark run (2008-2014) the first
  audit-fix pass flagged as an open question. Five new entries, each a
  distinct dateable sourced fact, not padding: the run is gone (max gap
  inside it now 2 years). A different run (1970-1975) is now visible where
  it was masked by the longer one - same phenomenon as last time, not
  fixed here, out of this pass's scope.
leads:
  - lead: LongPen / Unotchit
    result: rejected - real, but invented 2004 / debuted 2006, entirely
      before the window.
  - lead: 2008 CBC Massey Lectures (Payback)
    result: added, margaret-atwood-payback-massey-lectures-2008
  - lead: Twitter join / early literary use
    result: added, margaret-atwood-twitter-2009 - her own Mar 2010 NYRB
      essay dates it to building the Year of the Flood tour site, June 2009.
  - lead: Year of the Flood theatrical/musical tour
    result: added, margaret-atwood-year-of-the-flood-tour-2009 - a touring
      choir singing 14 hymns written for the book, actors in character, a
      CD, and its own 2010 documentary (In the Wake of the Flood).
  - lead: Awards/honors 2008-2014
    result: partial - Kafka Prize is 2017 (out of window). LA Times
      "Innocent Award" doesn't exist; the real prize is the Innovator's
      Award (2012, real, left out to avoid stacking a second award-season
      entry). Dan David Prize (2010) added instead -
      margaret-atwood-dan-david-prize-2010 - a political controversy
      (boycott calls over Gaza, her on-record "we don't do cultural
      boycotts"), not just an award.
  - lead: personal/family event
    result: nothing found that clears the two-source bar for a living
      person.
  - lead: anything else found along the way
    result: added, margaret-atwood-payback-documentary-2012 - Baichwal's
      NFB film, Sundance premiere 20 Jan 2012.
fixes:
  - >
    margaret-atwood-payback-massey-lectures-2008 - franchise event,
    passage/journey-transit. Sources: Wikipedia (Payback book),
    winnipegfreepress.com.
  - >
    margaret-atwood-year-of-the-flood-tour-2009 - franchise event,
    mosaic/press-media-collage. Sources: cbc.ca (Mallick, 25 Sep 2009),
    Wikipedia (Year of the Flood), archived yearoftheflood.com tour page.
  - >
    margaret-atwood-payback-documentary-2012 - franchise event,
    beside/public-event-tableau. Sources: Wikipedia (Payback film),
    cbc.ca (20 Jan 2012). NYT/Globe and Mail reviews exist but 403'd on
    fetch, left uncited rather than laundered.
  - >
    margaret-atwood-twitter-2009 - author lifeEvent,
    floating-object/isolated-object. Sources: nybooks.com (Atwood's own
    essay), theatlantic.com, Wikipedia (main article).
  - >
    margaret-atwood-dan-david-prize-2010 - author lifeEvent,
    medallion/emblem-seal. Sources: archive.nytimes.com/artsbeat (Itzkoff,
    11 May 2010), Wikipedia (Dan David Prize + main article).
  - >
    art-rotation fix: first draft put the Massey Lectures entry on
    `beside`, repeating its neighbour (oryx-and-crake-booker-2003, also
    beside); art_rotation.py caught it, moved to passage/journey-transit
    (a multi-city tour is literally movement between places).
i18n: >
  pt-PT added for all 5 entries in both overlay files, mirroring existing
  conventions (dates/organisation/sources untranslated; quoted slogans/artifact
  names like "Own the Podium" kept in English, as the file already does for
  "The Unburnable Book"; the tour's own `note` left in the base language).
gates:
  validate: "OK, 0 errors, 1337 works, 62 authors, 11 achievements, all references resolve."
  aura: >
    23 entries (was 18), 0.33 per work, longest dark run now 6 yrs
    (1970-1975); 2008-2014 is closed (worst gap inside it is 2013-2014, 2
    years). 1970-1975 was always there, masked by 2008-2014 the same way
    2008-2014 was masked by 1961-1968 last pass - a new finding, not
    padded away.
  artRotation: >
    Organisation rotation holds across all 20 events: no cap exceeded, no
    neighbour repeats after the fix above. Pacing contour
    #==.=#=.==.#====#=#= - no two loud cells touching or sharing a
    screenful, no plateau.
  i18n: "margaret-atwood not in the pt-PT PARTIAL list - fully covered."
