stage: press-archaeology
summary: >
  Built the wing's first author-life and franchise aura: 6 lifeEvents on
  content/authors/margaret-atwood.yaml and 8 events on
  content/franchises/margaret-atwood/events.yaml, all newly written (both
  files carried none before this pass). Every entry graded onto the
  organisation/illustration_type/images_required layout grammar and checked
  against art_rotation.py --check, which holds clean (no cap over its limit,
  no neighbour repeats, no touching loud cells, no shared-screenful loud
  pair, no plateau). validate.py --slug margaret-atwood reports 0 content
  errors; its one error is the documented theme.art escalation
  (franchise-research's validator change makes a missing art: block a hard
  error once a wing has real events/lifeEvents to draw, where before it was
  only a warning) and belongs to visual-language, not this stage.
  aura_density.py's flagged 12-year dark run (1983-1994) is closed: the
  longest remaining gap is 4 years (1961-1964, before her first publication,
  not flagged), and the wing's ratio moved from 0.22 to 0.42 aura entries per
  work. Two corrections to leads handed down from franchise-research and
  completeness-auditor: the Graeme Gibson relationship began in 1973, not
  the "1983" some later summaries imply from compressed partnership-length
  descriptions, and their daughter Jess was born in 1976, not 1985 - so
  neither event actually falls inside the dark-run window, which the record
  simply does not explain any other way; the run needed genuinely different
  material (institutional history, prize sweeps, her father's death), not a
  reread of the family chronology.
produced:
  files:
    - content/authors/margaret-atwood.yaml
    - content/franchises/margaret-atwood/events.yaml
  lifeEvents:
    - "margaret-atwood-born-1939 (1939-11-18, low, full-bleed-vista): the
       mandatory birth floor."
    - "margaret-atwood-gibson-family-1973 (1976, dateRange 1973-1980, med,
       passage): the Polk divorce, the Gibson relationship's real start
       year, the Alliston farm, Jess's birth, the return to Toronto."
    - "margaret-atwood-writers-organizations-1981 (1981, dateRange
       1981-1986, med, medallion): Writers' Union of Canada president
       1981-82, then co-founder and co-president (her own bio says
       'President') of the new English-speaking Canadian PEN centre
       1984-86, immediately preceding The Handmaid's Tale."
    - "margaret-atwood-father-death-1993 (1993-01-05, high, interlude):
       Carl Atwood's death, which Morning in the Burned House (1995)
       elegizes - closes the dark run's tail end."
    - "margaret-atwood-future-library-2015 (2015-05-26, low, medallion):
       the Scribbler Moon handover, named inaugural contributor in 2014."
    - "margaret-atwood-gibson-death-2019 (2019-09-18, high, immersion):
       Gibson's dementia and death mid-Testaments-tour; ties to Dearly's
       dedication."
  franchiseEvents:
    - "margaret-atwood-edible-woman-delayed-1969 (industry, med,
       artifact-spread): the lost manuscript and four-year gap before her
       prose debut, per Atwood's own 1995 telling."
    - "margaret-atwood-handmaids-tale-award-sweep-1986 (culture, high,
       mosaic): GG Award 1985, Booker shortlist 1986, inaugural Arthur C.
       Clarke Award 1987 - closes the dark run's opening."
    - "margaret-atwood-cats-eye-booker-1989 (culture, med, beside): GG
       finalist 1988, Booker shortlist 1989."
    - "margaret-atwood-alias-grace-giller-1996 (culture, med, diptych):
       Giller Prize win, third unrewarded Booker shortlisting."
    - "margaret-atwood-oryx-and-crake-booker-2003 (culture, med, beside):
       Booker/Giller/GG triple shortlisting opening the MaddAddam Trilogy."
    - "margaret-atwood-handmaids-tale-hulu-2017 (culture, high, mosaic):
       the Hulu premiere, its Emmy sweep, and the red-robe protest uniform."
    - "margaret-atwood-testaments-booker-2019 (culture, high, diptych): the
       rule-breaking joint Booker win with Bernardine Evaristo, four weeks
       after Gibson's death."
    - "margaret-atwood-handmaids-tale-unburnable-book-2022 (culture, med,
       artifact-spread): the Sotheby's fireproof-edition auction for PEN
       America, answering the era's book-banning wave."
  auraDensity: "was 69 works / 15 aura / 0.22 ratio / 12-year dark run
    (1983-1994); now 69 / 29 / 0.42 / 4-year dark run (1961-1964, pre-career)."
  artRotationCheck: "clean - organisation rotation holds (no cap exceeded,
    no neighbour repeats), pacing holds (no touching loud cells, no
    shared-screenful loud pair, no plateau). Checked and iterated: an
    initial pass put the Testaments Booker win on immersion, which the same
    year as Gibson's death (year_of() truncates to bare years, and
    art_rotation.py's tie-break sorts 'franchise-event' before 'life-event'
    alphabetically, so the two land adjacent regardless of the true
    within-year order) produced two touching loud cells; regraded to
    diptych (an apt fit - two winners sharing one prize) and moved the
    death event from a first-drafted epigraph to immersion once closer
    sourcing showed its quote was released as a family statement rather
    than words distinctly Atwood's own, which also resolved the clash
    cleanly."
forStages:
  eras: >
    Three real periodisation signals now sit in the data. The
    1985-1987 award sweep and the 2019 Booker/Gibson-death coincidence are
    both genuine boundary candidates on top of the two already flagged by
    completeness-auditor (the MaddAddam Trilogy span 2003-2013, and the
    34-year Handmaid's Tale to Testaments gap). Her own institutional
    history (Writers' Union 1981-82, PEN 1984-86) sits right before the
    Handmaid's Tale breakthrough and could mark an "into the speculative
    turn" era opening if one is built, though completeness-auditor's own
    warning against a clean realist/speculative split (Surfacing, 1972, is
    already speculative-adjacent) still applies - an institutional/career
    boundary at 1984-85 is a different, defensible claim than a genre one.
  event-resonance: >
    Two candidates worth a look, both already reaching the wing by default
    as generic industry events with no author-specific tie: check whether
    online-bookselling-1995 or ebook-and-self-publishing-2007 deserve an
    Atwood-specific inclusion note, or whether they should simply be
    excluded as thin for this wing per the skill's own "a global event is
    thin gruel for an author-specific silence" standard - now moot for the
    dark run itself, since that's closed by author-specific material, but
    the defaults still count toward the aura ratio and are worth a
    deliberate include/exclude ruling on franchise.yaml rather than sitting
    on the implicit default.
  visual-language: >
    This stage's edits are exactly what flips
    scripts/validate.py's theme.art check from a warning to an error
    (franchise-research's own validator change: the check only errors once
    a wing has events, eras or lifeEvents to draw). The wing now has both,
    so theme.yaml needs its art: block before the wing validates clean.
  art-rotation: >
    Every entry already carries organisation/illustration_type/
    images_required/modifier, and art_rotation.py --check passes clean
    (rotation and pacing both hold) as of this commit. Read the sourcing
    notes before changing any grading: margaret-atwood-edible-woman-delayed-1969
    rests on a single first-person account (flagged in its own note), and
    margaret-atwood-writers-organizations-1981 records a real disagreement
    between Atwood's own bio and the PEN International archive project
    over "President" vs "co-president" without resolving it - a
    re-grading pass should not silently pick one framing over the other
    without re-checking both sources.
  wing-audit: >
    Two things worth a second look. (1)
    margaret-atwood-handmaids-tale-hulu-2017 and
    margaret-atwood-handmaids-tale-unburnable-book-2022 both belong to the
    same work as margaret-atwood-handmaids-tale-award-sweep-1986: three
    separate franchise events on one book across 36 years, each covering a
    genuinely distinct era of that book's public life (its own
    publication-era prizes, its television revival, its use in
    present-day censorship fights) rather than three takes on the same
    moment - worth confirming that reads as earned rather than as one book
    crowding out the other 68 works' share of the aura. (2) this run added
    14 new aura entries (6 lifeEvents + 8 franchise events) against the
    skill's own "3-8 new facts per press run" guidance, deliberately: this
    was the wing's first press-archaeology pass on a 69-work, 65-year,
    still-active career with zero author-specific aura and a flagged
    12-year dark run, and per-decade/per-work density targets both argued
    for more material than a touch-up pass would need. Worth confirming in
    review that the higher count reads as earned rather than as an
    over-fill of a wing that had nothing before.
openQuestions:
  - "The Writers' Union/PEN Canada life event records two sources
     disagreeing on whether Atwood's PEN Canada role was 'President' (her
     own bio) or 'co-president' alongside Eugene Benson (the PEN
     International archive project); recorded as a live disagreement
     rather than resolved. A curator with independent PEN Canada
     institutional records could settle it, but neither telling is
     currently in doubt as unsourced - it's a wording disagreement between
     two legitimate sources, not a documented-vs-undocumented question."
  - "margaret-atwood-edible-woman-delayed-1969 rests on Atwood's own 1995
     Hay Festival retelling, held to the ordinary sourcing bar rather than
     the living-person two-source bar since it concerns her own career
     rather than health/finance/family/legal matters. No independent
     account of the publisher's side was found in this pass; a future pass
     with access to a proper literary biography (rather than encyclopedic
     tertiary sources) might corroborate or complicate it."
  - "Whether the wing wants a fourth Handmaid's Tale franchise event for
     the 2025 news cycle (Alberta and other jurisdictions' book removals,
     referenced in a 2025 CBC piece found in passing) was not pursued -
     too recent to have settled reception, and three franchise events on
     one book already asks a real question for wing-audit above."
