stage: press-archaeology-fix
summary: >
  Closed all three wing-audit findings routed here. Added four dated
  lifeEvents formalizing facts already sourced in the bio prose (1917 law
  enrollment, 1948 paternity edict, 1985 Pessoa-papers poem discovery,
  1994 Dal Farra critical edition), correcting one misattribution along
  the way (the 1985 finder was Teresa Sobral Cunha, not Dal Farra, who
  only published the poem in 1994). Recorded the Infopédia birth-year
  variant on the existing born-1894 event. Resolved the aka finding:
  "Florbela d'Alma" is real and sourced but the record gives it no
  precise adoption date or stated motive, so it stays in aka with an
  explanatory comment rather than moving to pseudonyms. None of the four
  new lifeEvents carry organisation/illustration_type/images_required/
  modifier.
produced:
  changedFiles:
    - "content/authors/florbela-espanca.yaml (4 new lifeEvents; Infopédia
      note added to florbela-espanca-born-1894; aka explained in a new
      header comment; bio prose corrected on the Pessoa-poem finder; 1
      new top-level source URL)"
  newLifeEvents:
    - "florbela-espanca-lisbon-law-1917 (date: 1917, impact: med) - enrolls
      at the Faculdade de Direito da Universidade de Lisboa, one of a
      small number of women admitted that year; the exact frame the
      franchise description leans on. Sourced: pt.wikipedia (confirms
      1917, matriculation, 14-of-347 headcount - not restated here, see
      openQuestions) and DGLB's author page (independently confirms
      1917 and the move to Faculdade de Direito)."
    - "florbela-espanca-paternity-edict-1948 (date: 1948-07-19, impact:
      low) - her father formally acknowledges her via municipal edict,
      eighteen years after her death. Sourced: pt.wikipedia's own
      footnote cites the primary instrument directly - «Edital municipal
      de 19 de julho de 1948», Câmara Municipal de Lisboa - which is
      where the exact day/month came from; the body text's '18 anos
      após a morte dela' independently corroborates the year."
    - "florbela-espanca-pessoa-poem-found-1985 (date: 1985, impact: med)
      - a typewritten poem to her memory surfaces in Fernando Pessoa's
      papers. Sourced: Maria Lúcia Dal Farra's own essay (Agulha Revista
      de Cultura, 2017), which states plainly the poem was 'encontrado em
      1985 por Teresa Sobral Cunha' - not by Dal Farra, who only
      published it later; corroborated by Casa Fernando Pessoa's library
      catalogue record for Alma Errante (Kamenezki's 1932 book, inscribed
      to Pessoa 2-3-1932), which is the physical link explaining why the
      poem ended up in Pessoa's papers at all."
    - "florbela-espanca-trocando-olhares-1994 (date: 1994, impact: med) -
      Dal Farra's critical edition of Trocando Olhares is published,
      carrying the poem as its epigraph, attributed to Pessoa at the
      time. Sourced: pt.wikipedia's Trocando Olhares article (new source
      added to the file) and Dal Farra's own essay, whose footnote 9
      states she published the poem 'como epígrafe de Florbela Espanca,
      Trocando Olhares... Lisboa: Imprensa Nacional/Casa da Moeda, 1994'."
  corrections:
    - "Bio prose said the 1985 poem 'turned up... and was published as
      his by Maria Lúcia Dal Farra, the scholar who found it' - conflating
      two people and two dates. Dal Farra's own essay is explicit: Teresa
      Sobral Cunha found it in 1985; Dal Farra published it in 1994, as
      the Trocando Olhares epigraph. Bio corrected to name the actual
      finder and separate the two dates; the [[work:...]] link to
      Trocando Olhares was added at the same time since the edition is
      now itself a dated event."
  infopedia_finding:
    resolution: >
      Fetched infopedia.pt live (scripts/fetch.py, 200, cached). It gives
      1895 twice and no 1894 anywhere on the page, confirming the
      wing-audit's finding verbatim. A note is now attached to
      florbela-espanca-born-1894 explaining the resolution already
      implicit in the file: she was baptized 20 June 1895, seven months
      after an 8 Dec 1894 birth (an ordinary baptism lag), and Infopédia
      reads as dating her by the registration rather than the birth -
      every other source checked, and the wing's own "died on her own
      thirty-sixth birthday" framing, requires 1894.
  aka_finding:
    resolution: >
      "Florbela d'Alma" is real, not fabricated - not moved, not deleted.
      pt.wikipedia's lede states plainly she was "batizada como Flor Bela
      Lobo e que optou por se autonomear Florbela d'Alma da Conceição
      Espanca" (chose to name herself the fuller form); its body dates an
      earlier version of the signing name, "Flor d'Alma da Conceição," to
      her 1899-1908 primary-school years, without pinning the final,
      fuller self-naming to a specific moment. Treccani's own authority
      record for her independently uses "florbela-de-alma-da-conceicao-
      espanca" as her entry id, corroborating the full name as standing
      and real rather than a one-off variant.
      Checked against the skill's pseudonym-story rule: pseudonyms needs
      a dated adoption moment or a stated motive (Bachman's 1977 test-of-
      talent, Westmacott's 1946 unmasking). No source found states why
      she added "Espanca" (her father's own surname, which she was not
      legally entitled to until the 1948 edict, granted 18 years after
      her death) or dates that specific choice - only that she "chose"
      it, sometime in childhood. That is short of the bar, so it stays in
      aka rather than moving to pseudonyms; a header comment now explains
      what the fragment is and why it stays there, closing the "appears
      nowhere else in the wing" gap wing-audit flagged. Not flagging this
      as unverifiable - it is verified, just not event-worthy on the
      current record.
  aura_density:
    before: "4 entries, ratio 0.44, worst dark run 64 yrs (1931-1994)"
    after: "8 entries, ratio 0.89, worst dark run 36 yrs (1949-1984)"
verification: >
  validate.py --slug florbela-espanca: 0 errors, same single pre-existing
  warning as before this pass (art-rotation.yaml handoff length, unrelated
  to this file). aura_density.py florbela-espanca: 8 entries / 0.89 per
  work, span unchanged (1919-1994), worst dark run cut from 64 to 36 years
  (now 1949-1984, entirely post-death and not one of the four facts this
  pass was scoped to). All new sources fetched live via scripts/fetch.py
  and read in full context before use, not paraphrase-only: pt.wikipedia
  (main text + footnote landing on the exact 19 July 1948 edict date),
  DGLB author page, infopedia.pt, Dal Farra's Agulha essay (full
  Sobral-Cunha/Pizarro passage and footnote 9), Casa Fernando Pessoa's
  library catalogue record for Alma Errante.
