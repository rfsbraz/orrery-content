stage: event-resonance
summary: >
  Ruled on three global events falling within Espanca's 1894-1930 lifetime.
  All three excluded: her confessional, intimately personal poetry never
  engaged the war, international publishing phenomena, or the political
  sphere that drew censorship. Living through events is not the same as
  writing out of them. Include: zero. Exclude: three (all justified).
  Output: globalEvents block written to franchise.yaml.
produced:
  globalEvents:
    include: []
    exclude:
      - world-war-i-1914
      - pulp-magazines-1926
      - portuguese-censorship-1926
verdict:
  - event: world-war-i-1914
    decision: exclude
    resonance-test: She lived through the war (1914-1918, age 19-24), but her poetry never answers it. Livro de Mágoas was published in 1919, her first book, already in her mature confessional voice; the subject is grief, desire, longing - never politics or war-facing events. The First World War shaped the world she inhabited but not the world her poems inhabited.
  - event: pulp-magazines-1926
    decision: exclude
    resonance-test: The genre-magazine boom that brought Amazing Stories (April 1926) was an English-language publishing phenomenon entirely removed from her literary context. She wrote classical Portuguese sonnets in the tradition she inherited; mass-market pulp categorization and genre fiction mechanics do not appear in her work or her creative choices.
  - event: portuguese-censorship-1926
    decision: exclude
    resonance-test: While Portuguese press censorship (28 May 1926) was real and Portuguese, it targeted political and social writing; books escaped pre-publication review but could be seized afterward. Her intimate, confessional sonnets were never the target of regime concern - she wrote about desire, grief and spiritual renunciation, not politics. Charneca em Flor, finished in manuscript by May 1927 while censorship was in force, shows no signs of political self-constraint, because that was never the pressure she faced.
aura_density:
  before: "0 entries, ratio 0.00, worst dark run 76 yrs (1919-1994)"
  after: "unchanged (0 includes); exclusions do not affect output"
  note: >
    Dark run persists by design. Three published works (1919, 1923, nothing
    until 1931 posthumous) and eight posthumous editions (1931-1994) leave
    no aura entries to work with. The gap is publication/archival, not
    creative silence: she was writing actively 1923-1930. Press-archaeology
    has four prepared lifeEvents ready to close this window once visual-language
    sets theme.art (see press-archaeology.yaml). This stage does not fill
    dark runs with forced globals; it only preserves real ones.
forStages:
  press-archaeology: >
    No new dark-run closure needed from this stage. The existing 76yr window
    (1919-1994) is correctly identified as a publication/archival gap, not a
    curation gap. Prepared lifeEvents (birth, first divorce, brother's death,
    own death) are waiting for theme.art to commit.
  visual-language: >
    Once theme.art is set, paste the four preparedLifeEvents from
    press-archaeology.yaml; re-run validate.py --slug florbela-espanca to
    confirm the theme.art gate lifts.
openQuestions: []
