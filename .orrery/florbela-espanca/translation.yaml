titlesLeftInBaseLanguage: >
  All 9 work titles are untranslated, and correctly so: Florbela Espanca
  wrote in Portuguese, so every title in works.yaml already IS the
  Portuguese original (Livro de Mágoas, Livro de Sóror Saudade, Charneca em
  Flor, As Máscaras do Destino, Juvenília, Cartas, Diário do Último Ano, O
  Dominó Preto, Trocando Olhares). There is no English source title to
  translate from and no separate pt-PT edition title to give it - the base
  and the target language are the same for every title on this shelf. Per
  the hard rule this overlay carries no `title` field anywhere regardless.
englishStringsChanged: none. No base-language prose was edited alongside a
  translation on this run.
regionDiscriminatorNotes: >
  Ran the translated prose past the pt-PT vs pt-BR table before writing:
  "está a ler"-style constructions, ficheiro/ecrã/etc. do not occur in this
  wing's subject matter (no reading-app chrome in the overlaid fields), so
  nothing tripped the discriminator table either way. Nothing flagged for a
  native reviewer beyond ordinary proofreading.
poetryQuoteHandling: >
  Her own words are real Portuguese and were never re-translated from an
  English gloss. Two cases:
  (1) works.yaml's charneca-em-flor synopsis glosses her verse in English
  in the base file with no Portuguese original alongside it. Rather than
  translate that gloss back into invented Portuguese, sourced the real
  verse from the title poem ("Dispo a minha mortalha, o meu burel, / e já
  não sou, Amor, Sóror Saudade... / Sou a charneca rude a abrir em flor!" -
  Citador.pt and escritas.org both carry the full sonnet; she died 1930, so
  it is in the public domain) and quoted that instead - it is the actual
  text the base's gloss is describing.
  (2) Elsewhere in the base prose (the As Máscaras do Destino dedication
  "A meu Irmão, ao meu querido Morto", her own dismissive note on O Dominó
  Preto, and the "alma sonhadora, irmã gémea da minha" line from the poem
  found among Pessoa's papers), the Portuguese original already sits next
  to an English parenthetical gloss. Carried the Portuguese through
  unchanged and dropped the now-redundant gloss - same presentation
  precedent as the almeida-garrett overlay's inline quote handling.
