stage: editions-fix
summary: >
  Followed up wing-audit's editions finding: the header's claim that "Wook
  and Bertrand both refuse automated fetches" was over-broad (product pages
  ARE fetchable; only their search/author-listing endpoints 403/404). Tried
  the product-page route directly rather than assuming the ISBN gap was
  closed by that correction. ISBN not found - genuinely unfindable with the
  tools available, not just re-blocked by the same wall. Found and recorded
  a real discrepancy along the way: the file's "December 2007" date for the
  Colares printing has no source behind it anywhere checked, while an
  independently-accurate bibliography dates it 2005. Coverage unchanged
  (6/9); no edition added. validate.py --slug florbela-espanca green (1
  pre-existing, unrelated warning).
produced:
  changedFiles:
    - "content/franchises/florbela-espanca/editions.yaml (Juvenília header
      bullet rewritten: corrected the over-broad Wook/Bertrand blocker claim,
      added the 2005-vs-2007 year discrepancy with its source, and named
      exactly what a human with a browser still needs to check)"
  newEditions: []
findings:
  isbn-search:
    - "No ISBN for any Colares Editora printing of Juvenília surfaced from
      any source tried: wook.pt (domain-scoped search, found every other
      Espanca title but not this one), bertrand.pt (same), BNP's own
      catalogue (author=Espanca, Florbela / title=Juvenilia query returns
      'Não foram encontrados registos' - no record), OpenLibrary (the
      Poems work record's own edition list carries only the two pre-ISBN
      Livraria Gonçalves printings, 1946 and 1949 - nothing from Colares),
      WorldCat, Google Books, or general web search."
    - "Confirmed live (not assumed from the header's old claim) that Wook
      and Bertrand product pages fetch fine via scripts/fetch.py - the
      wing-audit's finding held up. What's actually blocked is discovering
      *which* product URL to fetch: wook.pt's own author-listing page for
      Florbela Espanca returns 200 but ships its book list client-side
      (no book data in the server HTML fetch.py sees), and a domain-scoped
      web search for 'Juvenília' against wook.pt and bertrand.pt separately
      turned up every other Espanca title on each site but no product page
      for this one. Either neither site currently stocks it, or its product
      page exists under a title/slug variant a text search didn't surface -
      genuinely undetermined from here."
  year-discrepancy:
    - "The file's prior header claimed 'a real December 2007 Colares Editora
      printing' with no source cited. lerflorbelaespanca.blogspot.com/p/obra.html
      - a detailed Espanca print-history bibliography whose other dates
      (1931 first edition, 1946 second edition) independently match
      OpenLibrary's own edition records for this work - dates the Colares
      printing '3ª ed., Sintra: Colares, 2005', with no 2007 mentioned
      anywhere on the page. Where 'December 2007' originally came from is
      unclear; it did not reproduce from any source checked in this pass.
      Recorded the discrepancy in the header rather than silently picking a
      year, since neither is corroborated by an ISBN either way."
verification: >
  validate.py --slug florbela-espanca green (1 warning, on
  art-rotation.yaml's handoff length, pre-existing and unrelated to this
  change - not introduced here). No edition was added, so no ISBN
  check-digit or metadata/lookup.py --verify-isbns run was needed; the two
  pre-ISBN OpenLibrary Juvenilia records (1946, 1949) cited above were
  read directly, not assumed. Coverage unchanged: 6 of 9 works.
forStages: {}
openQuestions:
  - "A human with a browser: does wook.pt or bertrand.pt actually stock a
    Juvenília listing (under any title/slug variant), and separately, which
    year does the real Colares printing carry - 1946 (matching OpenLibrary's
    second Livraria Gonçalves edition, if 'Colares' is a misattribution),
    2005 (per the blog bibliography), or a genuine 2007 reprint neither
    source recorded? Settling the year does not by itself supply an ISBN -
    none has surfaced for any of the three."
