  preparedLifeEvents: >
    Sourced and dated; not committed (theme.art gate - see summary). Paste
    verbatim once visual-language runs; organisation/illustration_type/
    images_required deliberately absent.

    - id: florbela-espanca-born-1894
      date: 1894-12-08
      title: Born in Vila Viçosa, raised there and in Évora
      impact: low
      description: >
        Born Flor Bela Lobo in the parish of Conceição, Vila Viçosa,
        Alentejo, baptized there 20 June 1895, daughter of her father's
        household maid Antónia da Conceição Lobo; raised in her father
        João Maria Espanca's home by his wife Mariana do Carmo Toscano
        alongside her birth mother. Grew up in Vila Viçosa - the charneca
        (heath) that gives Charneca em Flor its title - until the 1907
        move to Évora for secondary school.
      spoilerAfter: null
      sources: [https://pt.wikipedia.org/wiki/Florbela_Espanca, http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386]

    - id: florbela-espanca-first-divorce-1921
      date: 1921-04-30
      title: Divorces her first husband, Alberto Moutinho
      impact: med
      description: >
        Divorced from Alberto Moutinho, married on her own nineteenth
        birthday in 1913, by a Comarca de Vila Viçosa court judgment on 30
        April 1921; the marriage had effectively been over since her 1917
        return to Lisbon for law school while Moutinho stayed behind.
        Remarried two months later, to António Guimarães.
      spoilerAfter: null
      sources: [https://pt.wikipedia.org/wiki/Florbela_Espanca, http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386]

    - id: florbela-espanca-brother-apeles-death-1927
      date: 1927-06-06
      title: Brother Apeles dies in a plane crash in the Tejo
      impact: high
      description: >
        Brother Apeles, a naval officer and painter and the sibling she
        was closest to, died 6 June 1927 when the seaplane he was piloting
        to complete his pilot's-license tests crashed into the Tejo
        between Porto Brandão and Trafaria; body never recovered. Shadows
        her last two years and As Máscaras do Destino, dedicated to him.
      spoilerAfter: florbela-espanca/as-mascaras-do-destino
      sources: [https://pt.wikipedia.org/wiki/Florbela_Espanca, https://ruascomhistoria.wordpress.com/2011/07/29/quem-foi-o-tenente-espanca/, https://arquivovilavicosa.blogspot.com/2021/08/0161-desinformacao-e-informacao-na.html]

    - id: florbela-espanca-death-1930
      date: 1930-12-08
      title: Dies in Matosinhos, her own thirty-sixth birthday
      impact: high
      description: >
        Died in Matosinhos 8 December 1930, her own thirty-sixth birthday,
        from an overdose of barbiturates, after two earlier suicide
        attempts that October and November while reviewing Charneca em
        Flor's proofs; death certificate recorded the cause as pulmonary
        edema. Charneca em Flor reached print a month later, January 1931.
      spoilerAfter: null
      sources: [https://en.wikipedia.org/wiki/Florbela_Espanca, https://pt.wikipedia.org/wiki/Florbela_Espanca, https://www.cm-matosinhos.pt/servicos-municipais/cultura/figuras-de-matosinhos/poi/florbela-espanca-1894-1930]
  aura_density:
    before: "0 entries, ratio 0.00, worst dark run 76 yrs (1919-1994)"
    after: "unchanged (theme.art gate). Committing preparedLifeEvents ->
      4 entries, ratio 0.44, closes most of 1919-1930; 1931-1994 stays
