stage: translation-fix
summary: >
  Two independent follow-ups. (1) The press-archaeology-fix pass added four
  real lifeEvents to content/authors/florbela-espanca.yaml
  (florbela-espanca-lisbon-law-1917, florbela-espanca-paternity-edict-1948,
  florbela-espanca-pessoa-poem-found-1985, florbela-espanca-trocando-olhares-1994);
  translated all four into the existing pt-PT overlay
  (content/i18n/pt-PT/authors/florbela-espanca.yaml), nested-merged by id into
  the existing lifeEvents list, register matched to the four events already
  there. The same pass's sourced note-comment on born-1894 (the Infopédia
  birth-year discrepancy) is a `#` YAML comment, not a schema field, so it
  needs no overlay entry - confirmed by reading the base file. Also found and
  fixed a stale pt-PT bio: the same press-archaeology-fix pass rewrote the
  base bio's Pessoa-poem sentence (Teresa Sobral Cunha found the poem, not
  Dal Farra; it was published in 1994 as the epigraph to Dal Farra's critical
  edition of Trocando Olhares, not "published as his" by Dal Farra herself in
  1985) and the pt-PT bio overlay still carried the old, now-incorrect
  version. Rewrote that sentence in the overlay to match, keeping the
  [[work:florbela-espanca/trocando-olhares|Trocando Olhares]] inline
  reference. (2) wing-audit flagged "em Redondo" in
  content/i18n/pt-PT/franchises/florbela-espanca/works.yaml against "no
  Redondo" in the author overlay; confirmed "no Redondo" is standard,
  centuries-attested pt-PT usage for this toponym (Ciberdúvidas da Língua
  Portuguesa) and changed both works.yaml instances (trocando-olhares
  synopsis and note) to match.
