regionDiscriminatorNotes: >
  "no Redondo" vs "em Redondo": verified via web search (Ciberdúvidas da
  Língua Portuguesa, "«Na vila do/de Redondo»") that the definite article
  with this toponym is old (attested since the 15th century) and standard in
  ordinary pt-PT usage; the article-less form ("concelho de Redondo") is the
  more formal/official register, e.g. municipal documents. Since the wing's
  own author-bio overlay already used "no Redondo" and the works.yaml
  register is not formal-administrative, aligned both to "no Redondo" for
  in-wing consistency. No other pt-BR/pt-PT discriminators tripped in the new
  lifeEvent translations.
staleTranslationFound: >
  Yes - the pt-PT authors/florbela-espanca.yaml bio's Pessoa-poem sentence.
  Before: "...apareceu entre os papéis do próprio Fernando Pessoa em 1985 e
  foi publicado como sendo dele por Maria Lúcia Dal Farra, a investigadora
  que o encontrou; Dal Farra tem desde então atribuído a identificação do
  poema como sendo de Eliezer Kamenezki..." - this both misattributed the
  1985 discovery to Dal Farra (it was Teresa Sobral Cunha) and dropped the
  1994/Trocando-Olhares-epigraph context that the corrected base bio now
  states. After: rewritten to name Teresa Sobral Cunha as finder, state the
  1994 publication as the epigraph to Dal Farra's critical edition of
  Trocando Olhares (with the inline work reference restored), and keep the
  Pizarro/Kamenezki attribution sentence, which was already correct and
  unchanged in the base.
