stage: pipeline-audit
summary: >
  Audited the run, not the wing. 18 successful dispatches, 2,617,080 tokens,
  1,078 tool calls, across the standard 13-stage pipeline, a real wing-audit
  critic pass, and a 4-stage follow-up round that closed all 6 of its
  non-blocking findings. Footprint discipline held on its first real test
  after the Camões-wing incident: press-archaeology and press-archaeology-fix
  never wrote organisation/illustration_type/images_required/modifier, and
  press-archaeology-fix says so explicitly in its own handoff.
  franchise-research never wrote theme.art. One real process gap found:
  world-events has zero record anywhere in this wing's commits or handoffs -
  not run, not skipped-with-reason, just absent - the same failure shape the
  skill already flags for spoiler-audit on a prior wing. One tooling-adoption
  gap found: editions (94 calls, 193,058 tokens, 3rd priciest stage) shows no
  evidence of using scripts/metadata/lookup.py, while visual-metadata in the
  same wing used it correctly via a shared TSV. All validate.py invocations
  found in this wing's handoffs are --slug florbela-espanca; zero
  catalogue-wide runs detected (contrast: baseline wing had eleven).
