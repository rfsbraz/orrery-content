findings:
  - id: world-events-no-record
    priority: high
    what: >
      world-events never ran on this wing and left no trace: no commit in
      `git log main..wing/florbela-espanca`, no .orrery/florbela-espanca/
      handoff file, no mention of "world-events" anywhere across all 17
      handoff yamls. Confirmed by cross-referencing git log --all --grep
      world-events, which returns hits for six other wings (Camões, Almeida
      Garrett, Eça de Queirós, Pessoa, Lovecraft, Poe) but zero for
      florbela-espanca.
    evidence: >
      `.claude/commands/author.md` trigger table line 88: world-events
      triggers when "the author extends the catalogue's span, or publishes
      in a decade global.yaml leaves empty." Florbela Espanca (1894-1930)
      falls inside spans already covered by Pessoa (1888-1935) and Eça de
      Queirós, so a correct SKIP verdict is plausible - but plausible is not
      recorded. grep across all .orrery/florbela-espanca/*.yaml for
      "global.yaml|decade|catalogue's span" returns one unrelated hit
      (eras.yaml's "decadentism" as a literary-movement word).
    proposedEdit: >
      author.md's trigger table (or stage_plan.py) should write a one-line
      SKIP rationale to a run artifact even when the verdict is pure
      arithmetic over an existing file - e.g. append to the franchise-research
      or completeness-auditor handoff: "world-events: SKIP, [span] already
      covered by [wing]." This is the same gap the skill already names for
      spoiler-audit ("only wing-audit noticed, and only because it happened
      to check") - it is recurring, not a one-off.
    saving: >
      Cannot estimate a token saving - this is a recordkeeping gap, not a
      redundant call. The cost is un-auditability: a future pipeline-audit
      (or wing-audit) cannot tell an oversight from a correct skip without
      re-deriving the span check itself.
  - id: footprint-discipline-held
    priority: informational
    what: >
      Confirmed clean on the exact mistake that shipped on the immediately
      prior Camões wing. press-archaeology (696073d) and press-archaeology-fix
      (3dad411) never write organisation/illustration_type/images_required/
      modifier or theme.art - the only matches for those strings in their
      diffs are prose describing the gate ("theme.art gate", "illustration_type,
      images_required or modifier: [untouched]"), not assignments.
      press-archaeology-fix's own handoff states this explicitly: "None of
      the four new lifeEvents carry organisation/illustration_type/
      images_required/modifier." art-rotation's commit (d32386a) correctly
      shows 26 additions of those exact fields - that is its job, not a
      violation. franchise-research (da33d14) never writes theme.art.
    evidence: "git show 696073d / 3dad411 / d32386a; press-archaeology-fix.yaml"
    proposedEdit: none
    saving: n/a
  - id: editions-no-lookup-py
    priority: medium
    what: >
      editions (94 calls, 193,058 tokens, 3rd most expensive stage this run)
      shows no reference to scripts/metadata/lookup.py anywhere in its
      handoff. visual-metadata, running in the same wing shortly before it,
      explicitly used the tool ("shared lookup.py TSV, then resolved every
      title to an Open Library work id" - visual-metadata.yaml line 5), and
      per the skill's own cheap-tools section, lookup.py's TSV covers *both*
      edition and cover candidates for the whole wing in one call. editions
      landed 6/9 works at 94 calls without any mention of reusing or running
      that TSV.
    evidence: "grep -i lookup.py across editions.yaml (0 hits) vs visual-metadata.yaml (1 hit, line 5)"
    proposedEdit: >
      Add to the editions skill: "If visual-metadata already ran in this
      wing, its lookup.py TSV covers editions too - read it before fetching
      anything new." Also worth checking (out of this stage's 15-call budget)
      whether editions.yaml's actual fetch pattern looks like the ~360-
      sequential-fetch shape the skill's own baseline names, or whether the
      94 calls are legitimately one-by-one ISBN verifications lookup.py
      cannot replace.
    saving: >
      Cannot estimate precisely without reading editions.yaml's own body
      (out of budget this pass) - the skill's own comparable case (Jo Nesbo
      wing) put the ceiling at ~880k tokens saved when lookup.py replaces a
      from-scratch sequential-fetch pattern; this wing's editions stage at
      193,058 tokens total is smaller-scale, so the realistic saving here is
      a fraction of that, not the full figure.
  - id: validate-py-scoping-clean
    priority: informational
    what: >
      Every validate.py invocation recorded across all 17 handoffs uses
      --slug florbela-espanca. Zero catalogue-wide runs found, versus the
      baseline wing's eleven (ten of which should have been scoped).
    evidence: "grep -rn validate.py .orrery/florbela-espanca/*.yaml - 16 hits, all --slug"
    proposedEdit: none
    saving: n/a
  - id: followup-round-worth-it
    priority: informational
    what: >
      wing-audit found 0 blocking issues and 6 "missing" findings with
      owners (art-rotation x1, press-archaeology x3, editions x1,
      translation x1), plus 2 items explicitly routed to the curator
      (not stage work). All 6 owned findings were closed by 4 follow-up
      dispatches (452,827 tokens, 17.3% of the run) rather than merely
      documented in the PR body.
      Judgement: worth it. press-archaeology-fix fixed a real
      misattribution (the 1985 Pessoa-papers poem finder was Teresa Sobral
      Cunha, not Dal Farra - the handoff had conflated finder and
      publisher), nearly doubled aura density (0.44->0.89, worst dark run
      64yr->36yr), and resolved a dead `aka` field that "renders nowhere"
      unresolved. art-rotation-fix removed an illustration_type the wing's
      own theme.art explicitly forbids (open-country Alentejo landscape at
      landscape scale). editions-fix is not padding either: it re-verified
      wing-audit's own claim that wook.pt/bertrand.pt product pages fetch
      live, searched six independent sources (wook, bertrand, BNP catalogue,
      OpenLibrary, WorldCat, Google Books), confirmed the ISBN is genuinely
      unfindable, and surfaced a previously unsourced 2005-vs-2007 printing-
      date discrepancy nobody had flagged. translation-fix and art-rotation-fix
      were structurally required once press-archaeology-fix added 4 new
      lifeEvents (ungated/untranslated content cannot ship). None of the
      four follow-ups reads as busywork against its own handoff.
    evidence: "wing-audit.yaml findings list; press-archaeology-fix.yaml; editions-fix.yaml"
    proposedEdit: none
    saving: n/a
  - id: stalled-wing-audit-one-data-point
    priority: informational
    what: >
      wing-audit-ATTEMPT-1 (opus, xhigh) stalled at "baseline scripts" near
      the very start, ~600s, zero commits, zero tokens billed, and was
      abandoned for a fresh dispatch rather than resumed - consistent with
      this pipeline's "never resume to correct or continue" doctrine,
      extended here to a genuine infrastructure stall rather than a
      correction. This is one occurrence. It is not enough to conclude
      xhigh-effort opus dispatches stall more often than other tiers - that
      would need a rate across multiple wings' wing-audit attempts, which
      this repo (correctly, per its own anti-ledger rule) does not
      centralize; it would have to come from reading multiple wings' PR
      bodies, which is out of this stage's 15-call budget. Not proposing a
      skill change on n=1.
    evidence: "prompt-supplied cost table row wing-audit-ATTEMPT-1"
    proposedEdit: none
    saving: n/a
  - id: eras-opus-tier-negative-outcome
    priority: informational
    what: >
      eras ran opus/high on a first build (per author.md's own tier table,
      correct by design) and returned a sourced negative: no received
      periodisation exists, 148,164 tokens, 80 calls, 1852 tok/call (second-
      lowest tok/call in the table, i.e. many small individual lookups
      rather than one large read). Question raised: was opus earned given
      the answer turned out to be "nothing"?
      Judgement: yes, tentatively - the author.md rationale for opus here
      ("telling received framing from our own opinion is the hardest call
      in the repo") is about the asymmetric cost of a wrong negative (a real
      scholarly periodisation missed and never revisited), not about the
      sign of the outcome, and that asymmetry is present whether the
      finding is positive or negative. Not proposing a change, but flagging
      this as worth revisiting if a pattern of expensive negative eras
      results accumulates across other minor-bibliography wings - one
      instance is not that pattern.
    evidence: "cost table row eras; author.md tier table line 193; eras.yaml"
    proposedEdit: none
    saving: n/a
