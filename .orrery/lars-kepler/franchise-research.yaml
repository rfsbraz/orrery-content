  notIncluded:
    - "\"Hypnotisören - Black edition\" - a rewritten anniversary edition of the same novel, not a new work; noted on lars-kepler/hypnotisoren for the editions stage"
    - "\"Alex Ahndoril\" - the same two authors' second joint pen name since 2023, an unrelated puzzle-mystery series; recorded as a pseudonyms entry on both author files, not catalogued as works"
    - "Both authors' solo bibliographies under their own names - out of scope, same shape as Andrew Child's solo novels relative to lee-child; named in bio prose only"
forStages:
  completeness-auditor: >
    Sourced from Wikipedia (en+sv) and each work's own Bonniers catalogue
    page - re-verify dates/titles against a further primary source. No
    externalIds anywhere (left for enrich.py). Medusa's synopsis is jacket
    copy, unavoidable pre-release; revisit after 2026-09-21.
  press-archaeology: >
    Both authors lifeEvents: [] with sourced anchors in each file's header.
    events.yaml's header names 4 joint-event candidates (name origin, 2009
    Aftonbladet unmasking, 2012 film, an Apple TV+ adaptation) - the last
    needs its own check: Wikipedia's "Nocturne" (different credited
    writers) may or may not be the same production Bonniers/larskepler.com
    describe with Schreiber/Beetz/Graham/Camp attached.
  eras: >
    Empty by judgement, not the 1-2 work exception: 11 novels over 17 years
    could plausibly divide, but nothing sourced names a periodisation.
    Revisit after press-archaeology.
  reading-orders: >
    Empty; no startHere. No prequel/interleaving problem, but a genuine
    newcomer's-door question exists for an 11-book series. Swedish
    Wikipedia's "can be read in any order" claim is recorded but not turned
    into an order on its own authority. A "Joona Linna only" order (skip
    Playground/Sjömannen) is an unresearched candidate.
  visual-language: >
    theme.yaml has displayFace/signature, no art: block. Candidate anchors:
    the hypnosis/liminal-sleep thread across 4 titles, the recurring
    forensic-psychiatric setting, the Stockholm/NOA/SÄPO procedural texture.
openQuestions:
  - "themePreset 'hypnagogic-noir' (violet accent, hue ~295, the open lane between bog-noir and heartland-noir) is this stage's own read of the title pattern, not received - open to a stronger view."
  - "Apple TV+ 'Nocturne' vs the Schreiber/Beetz/Graham/Camp adaptation Bonniers describes: same production or two - unresolved, do not use either fact until checked."
  - "Whether Julia Stark / Alex Ahndoril (2023-) earns its own future wing is flagged, not decided."
  - "Sjömannen's recorded title includes its subtitle ('Sjömannen: Spänningsberättelser'); confidence that's the canonical form vs 'Sjömannen' alone is moderate, not high."
