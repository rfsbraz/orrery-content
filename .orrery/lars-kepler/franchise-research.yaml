stage: franchise-research
summary: >
  Scaffolded the Lars Kepler wing from scratch: 13 works (11 core Joona
  Linna novels including the forthcoming Medusa, 2 extended standalones),
  2 global author entities per orrery-content#64's ruling (two people,
  jointly credited, no separate "Lars Kepler" entity), franchise identity
  and a validated theme (displayFace/signature only). Corrected the request
  issue's own bibliography (it named only the first nine novels): added
  Sömngångaren (2024), the forthcoming Medusa (2026-09-21), Playground
  (2015) and Sjömannen (2025). Verified the Portuguese-family detail the
  issue flagged as unsourced - it holds, on two independent wikis, one
  tracing to the publisher's own author biography.
