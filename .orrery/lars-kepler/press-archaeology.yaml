    afterFirstPass: "13 works, 19 aura, 1.46/work, span 2009-2026, dark run 6yrs (2013-2018)"
    after: "13 works, 20 aura, 1.54/work, span 2009-2026, dark run 4yrs (2013-2016)"

forStages:
  eras: >
    Still empty by judgement. The franchise events (2008, 2009, 2012, 2017,
    2019, 2023-2026) could seed a periodisation if eras wants one, but
    nothing sourced names one outright.
  visual-language: >
    theme.yaml still has no `art:` block (unchanged, not this stage's
    footprint). Neither author has `images.portrait` yet, so every event
    above avoids `editorial-portrait` entirely (VISUAL.md §3): the
    pseudonym's invention is drawn as the manuscript and its secret
    submission (manuscript-proof), the unmasking and the Regissören
    controversy as press response (press-media-collage), never as a
    likeness of either author or of Bergman; the 2017 Dutch chart debut is
    drawn as the book itself (book-object), not a portrait.
  completeness-auditor: >
    No bibliography changes. One more contemporary source (an archived
    2009 Svenska Dagbladet review) is folded into
    alexander-ahndoril.yaml's own sources list.

openQuestions:
  - "2013-2016 (Stalker, Playground, the run-up to Kaninjägaren's own 2016
    Swedish publication) has no event surviving the sourcing bar and is
    now the wing's longest dark run, at 4 years - under the 5-year gate,
    not flagged by aura_density.py. Checked and empty across Swedish,
    English, French, German, Dutch and Italian Wikipedia, the authors'
    site in full (News Archive only reaches back to February 2020),
    Bonniers' catalogue, the CWA International Dagger shortlist history
    and Deckarakademin's winners list."
  - "A single 2009 SvD profile states Alexander took the surname Ahndoril
    at eighteen, on his first marriage - implying one before Alexandra.
    Single-sourced family history for a living person, held out under the
    two-independent-source bar; noted on his file without repeating the
    claim."
  - "A Polish 'Golden Bullet' award and three unspecified Swedish Crime
    Writers' Academy nominations (both from uncited Wikipedia lists)
    could not be corroborated anywhere else, including the Academy's own
    winners list - left out as a standing correction, not just for this
    wing's dark-run purposes."

auditFixesApplied:
