stage: press-archaeology
summary: >
  Nine dated, sourced aura entries added across the three files this stage
  owns: 2 lifeEvents each for Alexandra and Alexander (a birth plus one
  pre-Kepler career event apiece), 5 franchise events. Aura density: 10 ->
  19 entries, 0.77 -> 1.46 per work. Closed the reported 8-year dark run
  (2012-2019) to 6, and fully closed the second, unreported one behind it
  (2021-2026).

  The pen-name origin is now two sourced, dated franchise events: invention
  in 2008 (two failed joint attempts under their own names, then a third
  invented author, Lars for Stieg Larsson, Kepler for Johannes Kepler) and
  the August 2009 Aftonbladet unmasking, both primary-sourced against the
  authors' own retelling on larskepler.com/about plus contemporary press
  (Aftonbladet, 2009-08-11; Svenska Dagbladet's independent profile 17
  days later). Alexandra's 2004 Katapult Prize and Alexander's 2006
  Regissören/Bergman controversy cover each author's pre-Kepler career.
  The 2012 Hallström film/Oscar-entry, a 2019 audiobook prize for Lazarus,
  and the 2023-2026 Apple TV+ "Nocturne" adaptation (one production under
  three working titles, not two) complete the franchise events.

  One correction-by-omission: Swedish Wikipedia's uncited claim that
  Kaninjägaren won a 2016 "Adlibris" bestseller prize conflicts with the
  authors' own site, which dates the Adlibris Awards' founding to 2019 -
  left out. A Polish "Golden Bullet" award and three vague, undated
  Swedish Crime Writers' Academy nominations failed the same check
  (absent from the Academy's own winners list and from Polish Wikipedia)
  and were dropped too.

