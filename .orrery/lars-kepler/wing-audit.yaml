stage: wing-audit
wing: lars-kepler
status: complete

summary: >
  Audited the first wing in this catalogue built as two simultaneous
  co-authors. The identity shape holds everywhere I could test it: 13/13
  works carry both authorIds and publishedAs "Lars Kepler", franchise.yaml
  names both, no third "Lars Kepler" author entity exists, no withAuthorIds
  or authorRole is used, and every joint fact (pen name, unmasking, film,
  adaptations) sits in events.yaml rather than being split or duplicated
  across the two author files. Two blocking defects, both small and both
  reader-facing. The wing's biggest real problem is not content at all: the
  pen-name notes the reader sees on the wing page cannot be translated, so
  a Portuguese reader gets four English paragraphs. All four gates green,
  every number re-derived, four covers and the portrait opened, both
  Bonniers jackets refetched, translator credits re-read off OpenLibrary.

baseline:
  validate: "--slug lars-kepler: 0 errors; only warnings are handoff word-count on 4 handoffs"
  aura_density: "13 works, 10 aura, 0.77 per work, 2009-2026, longest dark run 4 yrs (2013-2016) - under the 5-yr gate"
  art_rotation: "--check: 0 organisation-rotation problems, 0 pacing problems; contour #==#=#===#. The third axis reports 10 assets with no issue - pre-art, not this gate"
  i18n_coverage: "pt-PT 208/223 files; lars-kepler absent from every PARTIAL list, all 6 overlays complete"
  event_density: "19 globals catalogue-wide; 0 reach this wing (globalEvents.include is [])"
after: "unchanged on all four; catalogue-wide warnings 168 -> 167 after the comment fixes below"

produced:
  - "content/franchises/lars-kepler/works.yaml (2 comment corrections)"
  - "content/franchises/lars-kepler/editions.yaml (1 comment correction)"
  - "content/authors/alexandra-coelho-ahndoril.yaml (1 comment correction)"

blocking:
  - id: hypnotisoren-boy-is-not-mute
    owner: spoiler-audit (with translation, same commit)
    checked: "Refetched the Bonniers jacket (albertbonniersforlag.se/bocker/153581) and the English jacket (larskepler.com/books/the-hypnotist)."
    found: >
      The synopsis says the son is "severely wounded and unable to speak".
      The Swedish jacket says he "svavar in och ut ur medvetslosheten"
      (drifts in and out of consciousness); the English jacket says he
      "can't remember what happened". Neither says he cannot speak. The
      detail is invented, and it is live in three places: works.yaml's
      synopsis, franchise.yaml's where-it-begins path ("a murder witness
      who cannot speak"), and the pt-PT overlay ("incapaz de falar").
    recommendation: >
      Replace with what a jacket supports, e.g. "severely wounded, drifting
      in and out of consciousness". Fix all three in one commit; the pt-PT
      overlay is a mirror and CURATION 3 forbids leaving it behind.

  - id: rabbit-hunter-missing-its-article
    owner: editions
    checked: "OpenLibrary work OL20641517W (6 editions) plus larskepler.com/books/the-rabbit-hunter."
    found: >
      editions.yaml records the Knopf 2020 English title as "Rabbit
      Hunter". The authors' own site titles it "The Rabbit Hunter", as does
      the one edition on that OL work with a fully catalogued title (Random
      House Large Print, "The rabbit hunter: A Joona Linna novel"); the
      five records reading "Rabbit Hunter" all lack a by_statement and look
      article-stripped by a bulk import. events.yaml and works.yaml both
      write "The Rabbit Hunter", so the wing contradicts itself.

missing:
  - id: pseudonym-notes-cannot-be-translated
    owner: the curator (app) - no content skill owns this
    checked: >
      Read lib/content/index.ts merge() myself. PROSE_LISTS is
      {themes, debated}; any other array is skipped, and pseudonyms is an
      array of objects so it fails even that. mergeList() is called only on
      lifeEvents and startHere.paths. components/about-the-author.tsx:83
      renders p.note through <Prose>.
    found: >
      Confirmed exactly as translation's handoff claimed. The note is read
      by the app and cannot be reached by an overlay. This wing is the
      worst-exposed case in the catalogue: both author entities carry both
      notes, so the pt-PT wing page shows four English paragraphs under
      Portuguese bios. Systemic - 20 pseudonym notes across 11 author
      entities. i18n_coverage reports this wing fully covered throughout,
      because it counts the fields it knows.
    recommendation: "Add pseudonyms to mergeList()'s call sites, keyed by name rather than id, or move the note to a scalar. Not a content fix."

  - id: apple-tv-deal-graded-above-the-aura-ceiling
    owner: press-archaeology
    checked: "Re-derived the wing's grading: 4 high / 4 med / 2 low across 10 entries; scopes are 2 author-life, 3 culture, 1 industry."
    found: >
      lars-kepler/nocturne-apple-tv-2023 is the wing's only scope: industry
      entry and is graded impact: high. CURATION 6 puts industry context at
      "medium impact at most, never anchors". Its sibling, the 2012
      Hallstrom film, is scope: culture / impact: med - the louder of the
      two facts is graded lower. Four full-bleed interruptions in a
      ten-entry timeline is already the top of the range.
    recommendation: >
      Regrade to med. Safe for art-rotation: intensity is read off
      organisation, not impact, so the contour #==#=#===# is unaffected.

  - id: portuguese-mother-rests-on-one-source-not-two
    owner: press-archaeology
    checked: >
      Opened both articles. English Wikipedia's footnote 1 on that exact
      sentence is Albert Bonniers Forlag's own author page (retrieved
      2017-11-02). Swedish Wikipedia states it in its own words under a
      2025-01 citation-needed banner, and its Kallor list names "Bonniers
      forfattarpresentation (2006)".
    found: >
      The fact holds and should stay. But both encyclopedias trace to the
      same publisher author presentation, so the comment's "two
      independently written encyclopedia articles ... converge" overstates
      it - this is one source with two restatements, and parentage falls
      inside CURATION 6's family category.
    recommendation: >
      Keep the fact (a publisher's own author biography is not a rumour,
      and the claim is benign and non-derogatory), but restate the comment
      as what it is: the claim traces to Albert Bonniers Forlag's author
      presentation, reproduced in both encyclopedia articles.

  - id: translator-lineage-header-overstates-its-method
    owner: editions
    checked: "Re-read all six English ISBN records off OpenLibrary myself."
    found: >
      Ann Long (both Hypnotisoren records), Laura A. Wideburg
      (Paganinikontraktet) and Neil Smith (Sandmannen) carry explicit
      by_statements and check out exactly. Spegelmannen, Spindeln and
      Kaninjagaren have no by_statement at all; the translator is inferred
      from a co-author key (OL7968563A = Alice Menzies, OL7476119A = Neil
      Smith - both resolved and correct). The header's blanket "every ISBN
      and translator credit below is read directly off that exact edition's
      own OpenLibrary record" is untrue for 3 of 9. Only Spegelmannen's own
      note discloses the method.

  - id: a-live-fact-in-a-field-no-reader-sees
    owner: press-archaeology
    checked: "lib/content/types.ts: Work has no note field (the note? at line 174 belongs to Edition); no component reads w.note. SCHEMA calls it an optional curator aside, so the field is inert by design, not by defect."
    found: >
      Somngangaren's note carries "Sweden's top-selling hardcover fiction
      title of 2024" - a dated, checkable commercial fact no reader can
      see, and its cited sources (Bonniers, larskepler.com) are not the
      year-end bestseller lists the note attributes it to.

  - id: dead-citation-on-the-2012-film
    owner: press-archaeology
    checked: "Swept 10 source URLs across the wing; 9 live."
    found: "svenskfilmdatabas.se/en/item/?type=film&itemid=73094 returns 403 to a browser UA. The event's other two sources are live, so nothing is unsupported, but a reader clicking it gets nothing."

  - id: the-second-pen-name-has-no-event
    owner: press-archaeology
    found: >
      "Alex Ahndoril" (2023) is a dated second joint pseudonym with a
      stated purpose and no dated event. Arguably correct as a note under
      CURATION 6 (no reveal, no stated motive, works out of scope) - but a
      couple who already own a famous shared pen name inventing another one
      is closer to a story than to a fact. Raised, not ruled.

stale:
  - id: fixed-in-place-by-this-stage
    what: >
      Four CURATION 2 comment violations. One was already being reported by
      validate.py and nobody could see it (next entry); three were not in
      the scanner's vocabulary at all. (1) works.yaml opened
      "First-draft bibliography" -
      false since the completeness audit closed it at 13, and the SKILL's
      own canonical staleness example; rewritten to state the bibliography
      is complete and keep the trap about shorter lists. (2) works.yaml
      "not assumed from the request issue's recollection" - dropped; the
      same warning survives lower down as "English Wikipedia's own
      bibliography section is three titles behind". (3) works.yaml
      "Nothing else on this skill's source ranking hosts..." and
      editions.yaml "per this skill's own method" - reworded without the
      skill reference. (4) alexandra-coelho-ahndoril.yaml "was found to
      clear the two-independent-source bar this pass" and "verified rather
      than repeated from the request issue's own recollection" - collapsed
      to the present tense. No editorial judgement in any of the four; the
      substance is unchanged.
  - id: slug-scoping-hides-a-wings-own-author-files
    owner: the curator (tooling)
    checked: >
      validate.py:1376 filters the report with
      `shown = [w for w in WARNINGS if SCOPE in w]` - a plain substring
      match of the slug against the warning string. Falsified it both ways:
      before the fix above, an unscoped run printed
      "content/authors/alexandra-coelho-ahndoril.yaml: line 21: comment
      reads as pipeline narration ('this pass')", and the --slug run
      counted it among the 168 "warnings on other wings".
    found: >
      Author entities are filenamed after the person, never the wing, so no
      warning on an author file can ever contain the franchise slug and
      every one is filed as another wing's. This wing carried a live
      CURATION 2 warning on its own author file for the whole build while
      every stage's handoff reported "--slug lars-kepler: 0 errors, only
      handoff-length warnings" - correctly, and blind. Two author files
      doubled the exposure. The catalogue's standing debt here is zero
      right now (that was the only author-file warning, and it is fixed),
      so this is a hole to close, not a backlog to clear.
    recommendation: >
      Resolve the wing's author ids from franchise.yaml and match those too,
      rather than the slug alone.
    correction: >
      An earlier read of this blamed line-wrapping. Wrong: PROCESS_COMMENT
      matched "this pass" fine, on one line. The other three violations
      above were missed for a different and duller reason - "first-draft",
      "request issue" and "this skill" are simply not in the vocabulary
      list, which has `skills/` but no bare "this skill".
  - id: handoff-numbers-superseded
    found: >
      press-archaeology reports aura "10 -> 19 entries, 0.77 -> 1.46 per
      work". True when it ran; event-resonance then set include: [] and the
      10 globals dropped out, leaving the 10 own entries I re-derived.
      Unlike the dan-brown case this cost the wing no aura - the exclusions
      are individually right and the 4-yr dark run is still under gate.
      spoiler-audit's "hypnotisoren ... stops short of what the jacket adds
      (a surviving sister)" is also now false: the sister was added by the
      later accuracy fix, correctly, since she is on the Swedish jacket.
  - id: github-issue-cited-inside-content
    owner: the curator
    found: >
      "orrery-content#64" appears in franchise.yaml and both author files.
      The ruling belongs in the data; the issue number is coordination and
      fails the "would a human typing this by hand write it" test. Left
      alone deliberately - the ruling is Rodrigo's own and he may want the
      pointer.

checkedAndClean:
  identityShape: >
    13/13 works carry authorIds [alexandra-coelho-ahndoril,
    alexander-ahndoril] and publishedAs "Lars Kepler"; franchise.yaml names
    both; content/authors holds exactly two Kepler-related entities and no
    "lars-kepler" author; no withAuthorIds, authorRole or contributionTitle
    anywhere (correct - this is not a joined-later shape); references to
    the two ids appear in exactly 7 files, all expected. Joint history sits
    in events.yaml (pen name 2008, unmasking 2009, film 2012, Dutch chart
    2017, audiobook prize 2019, Apple TV+ 2023) and is not duplicated onto
    either author. Each author's 2 lifeEvents are genuinely individual and
    pre-Kepler. The shared portrait is a real joint 2012 Rosenbad photo
    (opened it: both authors, evenly lit, 883x1280, EXIF Nikon D600
    2012-11-22, Alexandra holding a copy of The Hypnotist) - the right call
    for two people who have never appeared as Lars Kepler separately.
  hypnotisorenCorrection: >
    Verified against the Swedish jacket word by word. The daughter among
    the dead, "utplana hela familjen", the surviving son, and Joona
    realising "det finns annu en familjemedlem kvar i livet, en syster" and
    racing to find her "innan mordaren gor det" are all jacket copy. The
    correction is accurate and stops short of what the jacket goes on to
    add (Bark breaking his old vow, the "skrammande kedja av handelser").
    Bounded, not over-revealing. The pt-PT overlay mirrors the corrected
    text, so the fix reached the locale reader.
  sjomannenCorrection: >
    Correct. Bonniers says only "sex spanningsberattelser fran Lars Keplers
    unika universum" and then names Jurek Walter's story explicitly. The
    copy says nothing about the other five standing outside the series - if
    anything "unika universum" covers all six. The old claim was
    unsupportable and the replacement states exactly what the source
    carries.
  jurekArcNegative: >
    Holds. eras.yaml ships [] with a sourced header; orders.yaml ships one
    order (joona-linna-only, a filter of the derived default, not a
    reshuffle) and records the Jurek rejection in its header. Neither file
    coins the grouping anywhere. Sjomannen's jacket names Jurek but no
    source recommends the subset as a path.
  artRotation: "Re-ran --check myself: organisation rotation holds across all 10 events, pacing holds, no plateau. Both regrades are in the data (alexander-ahndoril-born-1967 is beside/place-portrait; lazarus-audiobook-prize-2019 is floating-object/emblem-seal)."
  globalEvents: >
    All 10 excluded ids exist in content/events/global.yaml - none
    fabricated. They are also exactly the complete set of global events
    inside the authors' lifetimes (born 1966/1967); the other 9 are all
    pre-1966. The reasoning is terse but per-event and defensible, not
    boilerplate: three distinct grounds, and the two Portugal entries name
    Alexandra's heritage specifically. Note the exclusions are documentary
    only - lib/content/index.ts:205 records that exclude no longer gates
    anything and only include renders. 0 includes is the right answer here.
  heritageNotConflated: >
    Checked specifically. editions.yaml's header states the heritage and
    the Porto Editora history are both real and that nothing found connects
    them (2010 start is the ordinary one-year translation lag; the house
    author bio names neither Portugal nor her ancestry). No file infers one
    from the other.
  theme: "displayFace sourceSerif and signature thread are both in the app's live registry (lib/theme.ts DISPLAY_FACES, SignatureKind). Contrast: ink/bg 15.3, ink/surface 14.1, muted/surface 5.8, muted/bg 6.3 - all clear AA. accent/bg is 3.5, fine for the sparse non-text use the file specifies. One accent, one face, one signature."
  capabilities: "No features: block, so all four are auto. river/companion on 10 timeline entries, wizard on 3 startHere paths, editions on 34 editions - none half-empty. eras: [] drives no capability, so it costs nothing."
  covers: "Opened four (Hypnotisoren, Playground, Mirror Man, Paganinikontraktet). All genuine publisher jackets, no watermark, no retailer mark, no library stamp, correct book and correct market in each case."
  sources: "9 of 10 spot-checked URLs live, including Aftonbladet's 2009 article, SvD's rygg-mot-rygg, the Bestseller 60 chart page, the LIBRIS JSON-LD record, Porto Editora, and the archived SvD Regissoren review."
  auraProportion: "0.77 per work is 5th-highest of 35 wings (median ~0.40). 10 entries over a 17-year shelf is proportionate, not thin. Spoiler boundaries: 0 spoilerAfter across all 10 entries, correct - every one is a publication, press, prize or biography fact."

notApplicableNotAbsent:
  - "eras: [] - documented, sourced negative. Nobody outside this repo periodises this authorship; the publisher numbers the books ordinally and the authors call it one continuous run."
  - "achievements: none. Correct. One order that is a filter of the default, no era, and a franchise_complete badge would demand a book not published until 2026-09-21."
  - "globalEvents.include: [] - 0 is the ruling, not a gap."
  - "3 of 13 works with no cover (Somngangaren, Medusa, Sjomannen): two are a 2024/2025 cataloguing lag and one is unpublished. Not a licensing gap."
  - "No English edition for Somngangaren/Medusa/Sjomannen and no Portuguese for Medusa/Sjomannen: they do not exist. A reserved ISBN is not a book."
  - "No franchise header image: franchise.images.header is rendered by zero app code, a carried-forward catalogue finding."

curatorsCall:
  - "The Portuguese-mother sourcing characterisation. My ruling: keep the fact, restate the comment to name the single underlying source (Bonniers' author presentation) rather than claiming two independent articles. Escalated because it touches the two-source bar for a living person."
  - "Whether orrery-content#64 should be cited inside three content files. Rodrigo made that ruling; the pointer is coordination by CURATION 2, but removing his own provenance marker is not mine to do."
  - "Whether the Regissoren controversy should say what it currently only implies: Alexander was publicly condemned in 2006 for fictionalising a real living person, and two years later the couple invented a fictional third author instead of writing under their own names. The wing holds both facts and draws no line between them. A real editorial link, but not one any source I found draws - so it may be ours, and ours does not ship."
