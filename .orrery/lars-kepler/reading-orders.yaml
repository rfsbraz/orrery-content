stage: reading-orders
summary: >
  One order shipped, one rejected, three-path startHere added - all sourced
  directly (re-fetched), not carried from eras' handoff unchecked.

  ORDER lars-kepler/joona-linna-only (curated): the eleven Joona Linna
  novels filtered from the derived default (not reordered), leaving out
  Playground and Sjömannen. Sourced to sv.wikipedia's bibliography split
  ("Joona Linna-serien" vs "Fristående verk") and Bonniers' own Medusa
  ("den elfte boken...") and Playground ("Serie: Playground") pages. Same
  shape as this catalogue's Discworld/Jo Nesbo thread orders.

  REJECTED: a "Jurek Walter arc" order (Sandmannen-Lazarus). Confirmed
  eras' finding - the connection is real but no source names or
  recommends the subset, so it stays a rejection, recorded in orders.yaml's
  header rather than shipped.

  STARTHERE: "Where it begins" (hypnotisoren, new/taste), "The Joona Linna
  series, front to back" (joona-linna-only, new+returning/arc),
  "Everything, in order" (default, completionist/complete). The first path
  claims only what the authors' FAQ states (every book stands alone;
  reading in order adds the Joona/Saga throughline) - no source checked
  recommends a different specific entry point, and the famous-book trap
  does not apply (Hypnotisören is the actual debut and a sourced
  bestseller, not an outlier or a rough opener). WebSearch was unavailable
  all stage (budget exhausted, same as eras); Google/Bing/DuckDuckGo each
  blocked on direct fetch too - see sourcesRefused.

  BLACK EDITION: out of scope by design - the entry-point path targets the
  work id, not an edition; which print edition to surface is an
  editions-stage/curator call.

