sourcesRefused:
  - "WebSearch (the tool) was unavailable for this whole stage - session budget already spent (same condition eras reported)."
  - "google.com/search redirected to a consent wall; html.duckduckgo.com/html returned its own captcha; bing.com/search returned unrelated results for the same query. None usable as a source or as a genuine negative-control test of 'nothing exists' beyond what larskepler.com, orderofbooks.com and CrimeReads' own search already showed directly."
  - "fantasticfiction.com returned HTTP 405 on direct fetch."

forStages:
  spoiler-audit: >
    Two findings, neither acted on here (outside this stage's footprint).
    First: an ongoing Joona/Saga personal throughline sits underneath the
    otherwise self-contained cases (the FAQ frames reading in order as how
    a reader "follows the full story" of the two leads) - a reader taking
    "every book stands alone" literally and skipping around risks meeting a
    later personal-arc development early, even though no single case's
    mystery depends on another. Second, an actual prequel-shaped case:
    Sjömannen (2025) collects a Jurek Walter backstory story, published
    seven years after Lazarus (2018), the last of the four novels where he
    is the antagonist (Sandmannen 2012, Stalker 2014, Kaninjägaren 2016,
    Lazarus 2018). The derived default naturally sequences Sjömannen after
    all four, so no order or path here creates the risk - but check
    Sjömannen's own synopsis in works.yaml for whether it names the
    connection more than its existing note does.
  editions: >
    See "BLACK EDITION" above - the entry-point path targets the work id,
    not an edition; which print edition an editions.yaml store link should
    surface for a new reader following it is undecided here.
  translation: >
    No pt-PT overlay exists yet for any lars-kepler file (confirmed:
    content/i18n/pt-PT/franchises/lars-kepler/ does not exist), consistent
    with translation running once at the end of this wing's build rather
    than per stage. orders.yaml and franchise.yaml's startHere block are
    both new prose owed a pt-PT overlay (order name/rationale/debated; path
    title/description/note) when that stage runs.

openQuestions:
  - "Whether an eventual editions.yaml should route the 'Where it begins' path's Hypnotisören to the original 2009 text or the 2019/2020 Black edition rewrite - an editions-stage/curator call, not resolved here."
  - "General web search was unavailable throughout this stage (see sourcesRefused), same condition eras reported for its own research. The findings above rest on the authors' own site, one aggregator (orderofbooks.com) and one genre-press site's own search (CrimeReads), which is a real but not exhaustive corpus for 'does any English-language reading guide single out book one.'"
