sourcesRefused:
  - "General web search was unavailable for the whole of this work: the WebSearch budget was spent before it started, and html.duckduckgo.com, lite.duckduckgo.com, Bing, Mojeek, Brave, Startpage, Ecosia, Qwant and every public SearXNG instance tried all answered with a captcha, a 403 or a 429. Every source above was reached by constructing its URL or by a site's own server-rendered search."
  - "dn.se, svd.se and expressen.se: search pages load but render their result lists client-side, so the archives could not be queried. Aftonbladet's is server-rendered and was used instead."
  - "dast.nu article pages return HTTP 500 on direct request; the review text quoted here comes from the site's own server-rendered search-result excerpts, which carry the full opening paragraph."
  - "diva-portal.org (Swedish academic repository) is behind an Anubis JavaScript challenge; crimetime.se and deckarlogg.se no longer resolve (Deckarlogg was reached at deckarlogg.wordpress.com)."
  - "Google Books API returned 429 on every attempt, so the published-criticism corpus could not be searched by phrase."

forStages:
  press-archaeology: >
    The 2009 unmasking is confirmed as an event and rejected as an era
    boundary (it lands after the debut was already out). Two further quotable
    author-voice passages surfaced while checking periodisation and are worth
    considering for aura: the authors' account of the tabloid journalists
    arriving at their holiday cottage with a torch, in their own words
    ("Admit it, you're Lars Kepler"), at larskepler.com/about/; and their
    framing of what the books are for, "These stories are a way for us to
    manage our own fears of people's cruelty [...] a journey from chaos to
    order, questions to answers, injustice to justice"
    (larskepler.com/keplers-universe/). Also unused here: Bonniers' 2020 and
    2025 claims that Kepler is the decade's biggest-selling authorship in
    Sweden, and the BookBeat Årets svenska deckarförfattare awards (2021,
    2023, 2025).
  reading-orders: >
    Two independent sources now say explicitly that the books can be read in
    any order, which strengthens the case franchise-research left open: the
    authors' own FAQ ("every book can be read as a stand-alone", with the
    added note that reading in order gives the protagonists' continuing
    story) and sv.wikipedia's "Litterär stil" section. Against a pure
    any-order framing, the publisher's own copy says Kaninjägaren "tar vid
    där den enorma succén Stalker slutade", so at least that one pair is
    sequential. Playground and Sjömannen sit outside the series in both the
    publisher's catalogue and sv.wikipedia's structure, which supports the
    unresearched "Joona Linna only" order candidate.
  visual-language: >
    No era plates will be rendered for this wing, so the art budget has no
    era-gate entries to fill and the visual anchors have to come from the
    works and the aura alone.
  translation: >
    eras.yaml carries no reader-facing prose (comments are not translated),
    so no pt-PT overlay is owed for it.

openQuestions:
  - "The Jurek Walter reading-arc (Sandmannen 2012 to Lazarus 2018) is a real shape with no received name in any source found. Ruling: it does not ship as an era. If it is ever wanted, it belongs in reading-orders as a themed path, not on a full-bleed plate."
  - "General web search was unavailable throughout (see sourcesRefused). The negative rests on the authors' own material, the publisher's catalogue, sv.wikipedia and two Swedish crime-criticism outlets, which is a strong corpus for this question but not an exhaustive sweep of the Swedish press; DN, SvD and Expressen archives specifically could not be queried."
