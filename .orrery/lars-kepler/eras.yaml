stage: eras
summary: >
  Documented empty finding, now sourced rather than assumed. All four
  candidate shapes were checked against the authors' own material, the
  publisher's catalogue, Swedish reference works and Swedish crime criticism,
  in Swedish and English. None of them is received: nobody outside this repo
  periodises this authorship. eras.yaml stays `[]`, with its header rewritten
  from franchise-research's judgement call into a cited negative that names
  what was checked and quotes the sources that carry it.

  (1) NAMED STORY ARCS - none. The authors' own FAQ frames the series as one
  continuous run whose parts are individually free-standing ("Yes, every book
  can be read as a stand-alone [...] They are both after all our main
  protagonists for the entire series", larskepler.com/keplers-universe/).
  Bonniers places each novel by ordinal position only: "sin fjärde thriller"
  (Sandmannen), "den sjunde boken om Joona Linna" (Lazarus), "Lars Keplers
  tionde bok om Joona Linna" (Sömngångaren), "den elfte boken i serien om
  Joona Linna och Saga Bauer" (Medusa). Swedish Wikipedia calls the series
  "episkt sammanhängande" while insisting the parts read free-standing, and
  divides the shelf only into "Joona Linna-serien" vs "Fristående verk" - a
  series/standalone split, not a chronological one. The single grouping
  anyone draws is one book-to-book link, Kaninjägaren "tar vid där den
  enorma succén Stalker slutade": a sequel, not a period. A Jurek Walter
  reading-arc (Sandmannen 2012 -> Lazarus 2018) is visible in retrospect but
  has no name in any source found, so it fails rung 3 for want of a received
  term, not for want of a shape.

  (2) A PRE-KEPLER / KEPLER SPLIT - not applicable and not forced. All 13
  works carry `publishedAs: "Lars Kepler"`; both authors' solo bibliographies
  and the later Alex Ahndoril pen name are out of scope by
  franchise-research's ruling, so the wing covers one uninterrupted joint
  authorship 2009-2026 with nothing inside it that a pen-name boundary could
  cut.

  (3) PLAYGROUND (2015) AS A DIVIDER - no. Bonniers catalogues it under a
  series of its own ("Serie: Playground", "Boken ingår i serien Playground")
  and pitches it as "en annan sida av Lars Kepler"; Swedish Wikipedia files
  it under "Fristående verk" alongside Sjömannen (2025), i.e. outside the
  series rather than between phases of it; DAST's 2015 review reads it the
  same way ("Nu har de skrivit en bok utan att ha med den finlandssvenske
  kriminalkommissarien"). The series does not pause around it: Stalker
  (2014), Playground (2015), Kaninjägaren (2016), and Kaninjägaren resumes
  directly from Stalker. Nothing found treats it as a before/after.

  (4) A PUBLISHER-MARKETED SUBSET - none. Bonniers markets the Joona Linna
  books as one numbered series and gives Playground its own one-title series.
  The English-language branding on larskepler.com is series-wide, not a
  subset: every Joona Linna title from The Hypnotist (2009) to The Spider is
  labelled "A Killer Instinct Novel - The Joona Linna Series".

  Rung 4 was checked too, since it is the usual safety net. The one strong
  publishing-record fact available is the August 2009 unmasking of the
  pseudonym, and it is a bad era by fit: Hypnotisören was already published
  when it happened, so a "years of anonymity" period would contain no
  completed work and every later book would fall in a single undifferentiated
  remainder. It belongs in events.yaml, where press-archaeology already has
  it queued, not here.

  Languages searched: Swedish (authors' and publisher's own Swedish copy,
  sv.wikipedia, DAST Magazine, Deckarlogg, Aftonbladet's archive) and English
  (larskepler.com, en.wikipedia via earlier stages, CrimeReads).

  validate.py --slug lars-kepler: 0 errors, same 1 pre-existing warning
  (theme.yaml has no `art:` block). No new "work outside all era spans"
  warnings, since no span was drawn. The comment-policy scanner was
  falsified against a planted violation before its silence on this file was
  trusted.

