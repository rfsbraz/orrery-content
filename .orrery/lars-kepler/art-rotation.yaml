  pacingCheck: >
    Manually classified all 10 organisations against LAYOUT.md's own
    loud/mid/quiet split before trusting the script's read: loud at
    Alexandra's 1966 birth (full-bleed-vista), the 2006 Regissoren
    controversy (mosaic), the 2009 Aftonbladet unmasking (mosaic), and the
    2023 Nocturne deal (full-bleed-vista); everything else mid (no quiet
    organisation used anywhere on this wing - a fair reading of a
    ten-event, fact-dense franchise timeline with no genuine silence or
    compressed-years stretch to spend an interlude/passage on). None of the
    four loud cells touch or share a screenful; longest same-intensity run
    is 3. Matches art_rotation.py's printed contour exactly.
  compatibilityCheck: >
    Walked all 10 entries' illustration_type against their organisation's
    Holds list in LAYOUT.md by hand: full-bleed-vista/establishing-landscape
    (x2) holds; beside/place-portrait holds (place-portrait is not one of
    beside's three excluded artifact types); medallion/book-object (x2)
    holds; mosaic/press-media-collage (x2) holds; artifact-spread/
    manuscript-proof holds; floating-object/emblem-seal holds. All pass.
    No entry carries images_required other than 1 - none of this wing's
    organisations (diptych, split-counterpoint) that would require 2 are
    in use, and none should be: no event on this timeline is a genuine
    two-state before/after or a simultaneous-realities pair. No modifier is
    set on any entry; reviewed each against the compatibility table and
    none earns one strongly enough to add.
decisions:
  alexander-birth-full-bleed-vista-to-beside: >
    Both authors' births are structurally the same kind of moment (place +
    parentage + early formation) and land back to back in the merged
    timeline with no event between them - press-archaeology graded each
    correctly in isolation but never checked the pair together, since the
    two files are graded separately by design. Downgrading the wing's true
    opening event (Alexandra's 1966 birth, chronologically first) was
    rejected: LAYOUT.md's own full-bleed-vista "Use" line - "birthplace,
    arrival, migration, a new city, the opening of a period. A pause" -
    is written for exactly this moment, and a wing should spend its
    opening breath once, at the actual start of the timeline, not split
    across two consecutive entries. Alexander's birth is regraded to
    beside/place-portrait instead: "ordinary and medium-weight events...
    most of a wing is this" fits a second origin story that the reader has
    already seen the shape of once, and place-portrait ("one meaningful
    location, oblique and remembered") is a genuine fit for Upplands Vasby
    distinct from the establishing-landscape register already spent on
    Helsingborg, which also improves illustration_type variety rather than
    just resolving the conflict.
  lazarus-audiobook-medallion-to-floating-object: >
    The 2017 Dutch chart debut and the 2019 audiobook prize are the wing's
    only two award/recognition-shaped franchise events and land adjacent in
    the merged timeline; both had been graded medallion independently. Kept
    the Dutch chart debut as medallion - LAYOUT.md's "honours... recognition,
    legacy" fits a first-ever chart-topping abroad, the more consequential
    of the two per the event's own sourcing (the first Kepler title
    anywhere to top a national bestseller list outside Sweden, contrasted
    against every earlier Dutch run peaking at No. 2). Regraded the 2019
    audiobook prize to floating-object instead of the reverse: its own
    sourcing comment already frames it as modest ("the sole prize win...
    in a decade otherwise light on dated, sourced recognition"), which
    matches floating-object's "a keepsake... a minor beat" far better than
    medallion's "honours, memorials... legacy" register - a genuine
    upgrade in fit, not just a conflict-breaker. illustration_type
    emblem-seal carries over unchanged; it is in floating-object's Holds
    list as well as medallion's.
  everything_else_unchanged: >
    The remaining 6 of 10 organisation/illustration_type pairs were
    re-checked, not re-decided: the 2004 Katapult Prize medallion/
    book-object, the 2006 Regissoren controversy mosaic/press-media-collage,
    the 2008 pen-name-invention artifact-spread/manuscript-proof, the 2009
    Aftonbladet unmasking mosaic/press-media-collage, the 2012 Hypnotisoren
    film beside/public-event-tableau, and the 2023 Nocturne deal
    full-bleed-vista/establishing-landscape all still fit their moment
    under the finalized sand-at-a-threshold visual language (which governs
    surface/subject treatment, not organisation), still hold correctly per
    LAYOUT.md, and still pace correctly. press-archaeology's own choices
    were right about all six; the two things it could not have caught
    grading three files separately were the birth-pair adjacency and the
    award-pair adjacency, both are cross-file effects invisible from inside
    any one file.
rejected:
  - >
    Considered swapping which birth gets full-bleed-vista (keep Alexander's
    loud, downgrade Alexandra's) instead of downgrading Alexander's.
    Rejected on the same LAYOUT.md "opening of a period" logic: Alexandra's
    1966 birth is the wing's true chronological first event, and spending
    the vista there rather than on the second, structurally identical birth
    is the more legible read for a reader moving down the page.
  - >
    Considered adding a modifier (anchor-with-satellites is compatible with
    mosaic) to the 2009 Aftonbladet unmasking, since its description
    genuinely has one anchor (the ten pieces of evidence published the same
    day) with satellite details (the British press guesses, the TV
    criminologist's profile, the tabloid tip line, the SvD follow-up).
    Rejected: mosaic's own spec already covers "public noise... deliberate
    hierarchy, modest overlap" without a modifier, and adding one here would
    be decoration rather than a fit no plain mosaic already achieves - the
    same discipline applied on other wings' art-rotation passes (a modifier
    only when it reveals something the base organisation cannot).
openQuestions:
  - >
    art_rotation.py's chronological sort is documented (per this stage's
    brief) as recently fixed to use the full date rather than a truncated
    year, so that same-year events tie-break correctly. That fix
    (630b1ab, "chore(art-rotation): sort the timeline by full date, not
    truncated year") exists on branch wing/aj-finn but has not yet reached
    main or lars-kepler/visual-merged - this worktree's copy of
    scripts/art_rotation.py still sorts wing_assets() on year_of()'s
    4-digit truncation. It does not affect this wing's result: none of the
    10 events share a year with an event of a different kind (the four
    lifeEvents are 1966/1967/2004/2006, the six franchise events are
    2008/2009/2012/2017/2019/2023, no overlap at all), so the truncated-
    year sort and a full-date sort produce the identical order here, and
    both were checked by hand against the source dates before trusting the
    tool's printed order. Flagging for whoever next merges lars-kepler's
    branches toward main: the fix itself is still owed to this line of
    wings.
