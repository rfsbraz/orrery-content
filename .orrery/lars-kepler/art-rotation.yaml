stage: art-rotation
wing: lars-kepler
summary: >
  Re-derived the organisation/pacing judgment fresh across the whole
  combined timeline (4 lifeEvents across the two co-authors + 6 franchise
  events, 10 event sketches total, no eras) now that visual-language.yaml's
  art block is finalized (the sand-at-a-threshold emblem), rather than
  trusting press-archaeology's pre-assignment as-is. This wing's shape is
  unusual for the pipeline - two separate living co-authors with their own
  lifeEvents files, interleaved with one shared franchise timeline - so the
  pre-assignment spanned three files instead of the usual two, and nothing
  in the individual choices was reasoned about the *combined* sequence.
  Read the full timeline in true chronological order (both authors' births,
  the 2004 Katapult Prize, the 2006 Bergman/Regissören controversy, the 2008
  pen-name invention, the 2009-08-11 Aftonbladet unmasking, the 2012
  Hallström film, the 2017 Dutch chart debut, the 2019 audiobook prize, the
  2023-2026 Nocturne adaptation) before touching anything - there is no
  same-year collision between different event kinds in this wing's data, so
  the tool's chronological ordering here is correct regardless of whether
  its sort fix (see openQuestions) has landed on this branch.
  Found two real pacing/rotation problems the pre-assignment missed by
  grading each file in isolation: the two authors' birth lifeEvents
  (1966-03-02, 1967-01-20) are adjacent in the merged timeline with nothing
  between them, and both had been independently graded full-bleed-vista -
  two loud cells touching, sharing a screenful, and repeating the same
  organisation on top of it. Separately, two franchise recognition events
  (Kaninjagaren's 2017 Dutch chart debut, the 2019 Lazarus audiobook prize)
  are also adjacent and had both been graded medallion - a neighbour
  repeat, though not a loud/pacing violation since medallion is mid.
  Fixed both: Alexander's birth regraded from full-bleed-vista to
  beside/place-portrait (see decisions); the 2019 audiobook prize regraded
  from medallion to floating-object, same illustration_type (emblem-seal).
  Every other organisation/illustration_type pairing on the wing was walked
  by hand against LAYOUT.md's Holds lists and against the finalized
  sand-threshold visual language and held up; nothing else changed.
  art_rotation.py --check lars-kepler: 0 organisation-rotation problems, 0
  pacing problems (the separate composition axis reports "0 of 10 assets
  could be read" - expected, no art issues exist yet; not this stage's
  gate). validate.py --slug lars-kepler: 0 errors, 2 pre-existing
  handoff-length warnings (eras.yaml, spoiler-audit.yaml), neither new from
  this stage.
