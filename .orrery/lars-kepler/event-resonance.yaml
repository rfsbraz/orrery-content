stage: event-resonance
summary: >
  All 10 global events within the authors' lifetime (1966-2026) were examined
  for genuine resonance to Lars Kepler's Joona Linna crime series and related
  works. None met the bar: the Joona Linna novels are procedural Swedish crime
  thrillers centred on detective work and investigation, not explorations of
  geopolitical crisis, economic systems, or industry disruption. The authors
  lived through each event; none of them reached the page.

reasoningPerEvent:
  sept-11-2001: >
    The authors were 34-35 when the attacks occurred, 8 years before their
    2009 debut. While post-9/11 security anxieties could plausibly shape a
    series involving SÄPO (Swedish Security Service) work, the Joona Linna
    novels do not engage with terrorism, geopolitical threat, or security
    response as content. They are domestic Stockholm crime procedurals focused
    on murder investigation and forensic puzzle-solving. The books show no
    evidence of having written from or about post-9/11 anxiety.

  financial-crisis-2008: >
    Months before the 2009 debut, during the global crash. While economic
    crisis can colour crime fiction (desperation, poverty, systemic breakdown),
    the Joona Linna series does not engage with economic themes, recession, or
    financial precarity as driving plot or setting. The synopses show murder,
    investigation, and procedural crime; not economic consequences.

  covid-19-pandemic-2020: >
    The authors were 53-54; they had published 9 books already (2009-2019).
    Books typically carry 1-2 year lead times; works published in 2020 were
    written in 2018-2019, before pandemic awareness. Forthcoming titles
    (Medusa, 2026) lack published text to assess. No evidence of engagement
    with pandemic, isolation, mortality, or lockdown as content in any
    published work.

  carnation-revolution-1974: >
    Alexandra was 8 years old; Alexander was 7. A formative historical event
    for Alexandra's Portuguese heritage and the wider democratic transition
    she lived through. However, the Joona Linna series is set in contemporary
    Stockholm and focuses on Swedish crime investigation. While heritage
    experience shapes a person, it did not reach the page of these books.

  chain-bookshop-1982: >
    An industry event (bookselling format) that happened when the authors
    were teenagers. By the time they published, chain bookshops were
    infrastructure. Industry change does not constitute page content unless
    the books explicitly engage with it as subject matter. These do not.

  online-bookselling-1995: >
    Amazon's 1995 launch occurred when the authors were 28-29. Online
    bookselling became the primary channel for their career post-2009, but the
    Joona Linna novels do not engage with e-commerce, digital distribution, or
    the change in reading discovery as content. This is an industry event.

  ebook-and-self-publishing-2007: >
    Kindle and open self-publishing arrived the year before their debut. They
    published traditionally through Bonnier, not self-published. Their books
    do not explore ebook production, digital publishing, or the disruption of
    traditional gatekeeping as subject matter. Industry event, not page content.

  prestige-fantasy-adaptation-2011: >
    Game of Thrones' premiere marks fantasy's entry into prestige television.
    Lars Kepler writes crime, not fantasy. The event has no resonance to their
    genre, their books, or their working environment. A different category
    entirely.

  booktok-2020: >
    Short-form video communities on TikTok created a new discovery channel for
    books in 2020. While this may have benefited Lars Kepler's backlist sales,
    it is a marketing and social-discovery phenomenon, not page content.
    Nothing in their books engages with social media, BookTok, or the shifting
    landscape of reader recommendation. Marketing event, not page content.

  portugal-bailout-2011: >
    April 2011: Portugal entered an EU/IMF bailout programme with austerity,
    emigration (100k+ leaving per year), and unemployment above 15% for three
    years. Alexandra is Portuguese; this was significant for her heritage
    country and family context. However, the Joona Linna series is Swedish
    crime fiction set in Stockholm. The bailout did not reach the page of her
    books; it was background context to her life, not to the prose.

conclusion: >
  The bar for inclusion is high: the event must pass through the author into
  the page. These ten did not. None of them created the conditions the Joona
  Linna series exists inside, nor do the books show them. Living through an
  event is not writing out of it, and industry infrastructure is not page
  content.

