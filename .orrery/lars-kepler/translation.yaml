stage: translation
wing: lars-kepler

summary: >
  Built the pt-PT overlay for the whole wing, which had zero coverage before
  this run: content/i18n/pt-PT/franchises/lars-kepler/{franchise,works,
  events,orders}.yaml plus both author files this wing owns
  (alexandra-coelho-ahndoril, alexander-ahndoril - a shared pen name modelled
  as two global author entities, per franchise.yaml's own header ruling).
  Coverage: 202/223 files before, 208/223 after, zero regression on the
  other 202. No eras.yaml overlay: the base file is an empty list (a sourced
  negative finding - see its header), so it carries no prose slot and none
  is expected. No theme.yaml overlay: confirmed against lib/content/index.ts
  in the app repo that theme.yaml is read without ever calling
  overlayFor(), so nothing in content/i18n/ can reach it regardless of
  locale - not this stage's gap to fix.

produced:
  files:
    - "content/i18n/pt-PT/franchises/lars-kepler/franchise.yaml (new, 7
      slots - description plus 3 startHere paths x title/description, note
      also translated though the coverage script doesn't count it)"
    - content/i18n/pt-PT/franchises/lars-kepler/works.yaml (new, 13 slots,
      CUIDADO COM SPOILERS header on hypnotisoren's synopsis)
    - "content/i18n/pt-PT/franchises/lars-kepler/events.yaml (new, 12 slots
      - 6 franchise events x title/description; no event here uses
      organisation epigraph, so no quote field exists to translate)"
    - "content/i18n/pt-PT/franchises/lars-kepler/orders.yaml (new, 2 slots
      - name plus rationale on the wing's one curated order,
      joona-linna-only; debated also translated in full though the
      coverage script doesn't count it, matching SCHEMA.md's own file-tree
      example and the jrr-tolkien translation handoff's precedent)"
    - "content/i18n/pt-PT/authors/alexandra-coelho-ahndoril.yaml (new, 5
      slots - bio plus 2 lifeEvents x title/description)"
    - "content/i18n/pt-PT/authors/alexander-ahndoril.yaml (new, 5 slots -
      bio plus 2 lifeEvents x title/description)"
  coverage: "202/223 -> 208/223 files fully covered. The 15 remaining
    PARTIAL files (agatha-christie, robert-jordan, stephen-king,
    terry-pratchett events/authors; harlan-coben, lee-child, anna-sewell,
    haruki-murakami, hp-lovecraft, joao-tordo, miguel-de-cervantes authors)
    predate this run and belong to other wings; none regressed."
  titleInTranslation: >
    editions.yaml (built by the editions stage) carries 11 real Porto
    Editora pt-PT editions across the 13 works, several not literal
    translations of the Swedish - confirmed via the Biblioteca Nacional de
    Portugal's own "Tít. orig." field per-entry. Followed the catalogue's
    established convention (jo-nesbo, etc.): every inline [[work:id|text]]
    reference uses the real published edition title where one exists, the
    original Swedish title otherwise. Used throughout franchise.yaml,
    orders.yaml and the two events mentioning a title inline:
    hypnotisoren -> "O Hipnotista"; paganinikontraktet -> "O Executor" (not
    literal - matched by series position, per editions.yaml's own note);
    eldvittnet -> "A Vidente" (not literal - matched by series position and
    the medium-witness fit); sandmannen -> "O homem da areia";
    kaninjagaren -> "O Caçador"; spegelmannen -> "O Homem-Espelho";
    spindeln -> "A Aranha"; somngangaren -> "O Sonâmbulo";
    playground -> "O Porto das Almas" (the most divergent: not a Joona
    Linna title in Portuguese disguise, confirmed against Playground
    word-for-word by the BNP's "Tít. orig." field). Kept the Swedish
    original where no pt-PT edition exists: medusa (unpublished), sjomannen
    (2025, too recent for any market's translation) - and for lazarus,
    whose Porto Editora edition keeps the original-language title
    unchanged, so "Lazarus" needed no substitution either way. Unlinked,
    plain-text mentions of a title outside the [[work:...]] syntax (e.g.
    "Playground and Sjömannen" in a startHere note) were left exactly as in
    the English base rather than swapped for the edition title, since that
    rule is specifically about the display text inside an inline
    reference, not about every prose mention of a work's name.
  spoilerSensitiveSynopsis: >
    hypnotisoren's synopsis was checked against Albert Bonniers Förlag's own
    Swedish product page (primary source, not a translation of a
    translation): man murdered, wife and daughter found killed at home, son
    survives but can't speak, Joona Linna realises a sister is still alive
    and races to find her via hypnotist Erik Maria Bark. English base
    already matched the jacket; pt-PT translates the same facts, nothing
    added or softened. Source check noted in works.yaml's header.
  registerCalls: >
    "changing room" -> "balneário" (not "vestiário", reads more Brazilian
    here); "detective" -> "detetive" throughout; institution names given as
    plain descriptive translations ("Departamento Nacional de Operações",
    "Serviço de Segurança sueco"), no established PT-market name found for
    either. "showrunner" kept as the loanword Portuguese entertainment press
    actually uses. "the Book of the Fair" (a Book Fair label) and the
    working title "Parallax" kept verbatim as named things, not translated
    as prose. The Malmberg/Svenska Dagbladet review quote
    (alexander-ahndoril.yaml) was translated from the English base's own
    rendering, not re-sourced in the original Swedish like hypnotisoren's
    synopsis was - see openQuestions.

checked: >
  i18n_coverage.py --slug lars-kepler: pt-PT 208/223 (was 202/223), no file
  regressed, lars-kepler clear of MISSING and PARTIAL. validate.py --slug
  lars-kepler: 0 errors (3 pre-existing unrelated handoff-length warnings).
  One real catch: a header comment showing the literal "[[work:id|text]]"
  syntax made the inline-reference regex flag the comment itself as a
  broken reference (it scans raw file text, comments included) - fixed by
  describing the convention in prose instead. Every overlay confirmed to
  carry no forbidden field by walking the parsed YAML. NOT checked: the
  rendered page - this wing isn't merged/deployed, so there's no live pt-PT
  page to read yet; run the standard live sweep once it ships.

forStages:
  none: >
    No stage is queued after translation for this wing (matching the
    jrr-tolkien translation handoff's own precedent). Flag for whoever next
    touches this wing: an English rewrite of hypnotisoren's synopsis, or of
    any other synopsis/event/order/lifeEvent/startHere field, must be
    mirrored in this overlay in the same commit, or the two locales will
    quietly disagree - hypnotisoren's synopsis in particular carries a
    spoiler-audit correction that this overlay now also depends on staying
    put.

openQuestions:
  - "pseudonyms[].note ('Lars Kepler'/'Alex Ahndoril' explainer on both
    author pages) cannot be translated through this overlay at all:
    lib/content/index.ts's merge() only copies scalars and PROSE_LISTS
    (themes, debated), and silently drops any other array - pseudonyms is
    an array of {name, note} objects. An overlay value for it would pass
    validate.py and then be ignored by the app. Left out of both author
    overlays rather than writing dead YAML; fixing it is app-side work
    (add pseudonyms to PROSE_LISTS or give it id-keyed merge handling)."
  - "The Malmberg/Svenska Dagbladet quote on alexander-ahndoril.yaml was
    translated from the English base's own rendering, not re-sourced in
    the original Swedish like hypnotisoren's synopsis was. A native
    reviewer with the 2006 Swedish original could sanity-check whether 'um
    dos contributos mais excitantes para a comédia da inteligência já
    feitos no nosso país' lands the same way."
  - "Regissören's gloss, '(The Director, 2006)', stays untranslated in both
    author files: this solo novel sits outside lars-kepler's own
    editions.yaml (13 Kepler-pseudonym works only), so there's no sourced
    pt-PT title to use, and inventing one is the exact mistake 'Never
    translate a published title' exists to prevent."
  - "No content/events/global.yaml addition needed: franchise.yaml's
    globalEvents block only excludes pre-existing global events, already
    fully covered in pt-PT, so nothing outside the wing needed translating."
