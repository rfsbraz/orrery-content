stage: visual-language
summary: >
  Set theme.yaml's art block. Emblem: a fine drift of pale sand at a
  threshold (windowsill, doorsill, foot of a bed), lit in one close band
  with no figure or footprint shown - drawn from the real folklore behind
  Sandmannen's own title (the Scandinavian sandman crosses a sleeper into
  dream by casting sand in their eyes), which doubles as the throughline
  franchise-research already named: four of eleven Joona Linna titles
  (Hypnotisören, Sandmannen, Sömngångaren, Spegelmannen) and the recurring
  hypnotist-psychiatrist Erik Maria Bark all turn on the same border
  between waking and sleep. No swinging pendant/watch (ruled out at
  scaffold and repeated in `avoid`) and no tape recorder/cassette deck
  (already the induction-session register of John Shirley's and Jose
  Rodrigues dos Santos's wings, checked via theme_digest.py and named in
  `avoid` so a future prompt writer doesn't reach for it). Motifs extend
  the threshold idea past the four hypnagogic titles to the rest of the
  13-work shelf: a forensic-psychiatric ward corridor (Medusa, Eldvittnet),
  the Stockholm archipelago at night (Paganinikontraktet), a high bridge
  over black water (Sandmannen), a caravan lit alone in a dark
  winter-shuttered campsite (Sömngångaren), a fixed surveillance frame on a
  lit window (Stalker), and a postcard/envelope at a letterbox (Spindeln).
  lineCharacter and backgroundTexture were each checked against every
  existing wing's own device before settling (theme_digest.py, plus full
  reads of the two adjacent wings) and rebuilt once each: a first line-
  character draft (crisp-except-at-the-threshold-blur) turned out to
  already be Haruki Murakami's device verbatim; the version now in the
  file (pressure that drops and regathers unpredictably along a single
  continuous stroke, no fixed location) is a different mechanism from that,
  from Tana French's doubled/retraced line, and from every ruled/technical-
  pen or hatching device already claimed elsewhere.
produced:
  themeFile: content/franchises/lars-kepler/theme.yaml
  fieldsSet: [art.emblem, art.motifs, art.atmosphere, art.lineCharacter,
    art.backgroundTexture, art.accentUse, art.avoid]
touchedOnlyArt: true
forStages:
  asset-prompt: >
    The emblem (sand at a threshold) and the accent (muted violet, one
    element, never a fill) are two separate concerns per docs/VISUAL.md
    §1a - do not let the sand drift double as the shared orrery-rings
    motif; the rings go in the sky or on a scene-native carrier as usual,
    decided per image.
  future visual-language passes: >
    If a later wing reaches for hypnosis/sleep-state/psychiatric imagery,
    this wing's sand-threshold emblem and its `avoid` entries (pocket
    watch/pendant/spiral, tape recorder/cassette deck, Nordic-noir cold,
    hospital-clinical brightness) are the territory already claimed here -
    check this file before settling on an overlapping device.
openQuestions: []
