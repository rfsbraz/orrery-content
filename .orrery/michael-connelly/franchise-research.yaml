stage: franchise-research
summary: >
  Scaffolded the Michael Connelly wing: 47 works across 6 subseries (Harry
  Bosch 26 core novels + 3 apocrypha short-fiction ebook collections, The
  Lincoln Lawyer 8, Jack McEvoy 3, Terry McCaleb 1, Renée Ballard 1, Catalina
  2), 2 standalones + 1 nonfiction (subseries: null). Author entity with 6
  sourced lifeEvents. characters.yaml: 6 figures (Bosch, Haller, Ballard,
  McEvoy, McCaleb, Rachel Walling), all sourced to the author's own
  "Series Order" page. theme.yaml set (palette, sourceSerif, thread); no art
  block. validate.py --slug michael-connelly clean except the expected
  missing theme.art.
