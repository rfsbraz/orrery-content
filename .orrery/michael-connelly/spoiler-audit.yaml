stage: spoiler-audit
summary: >
  Read every rendered field in the wing: all 47 work synopses, 7 franchise
  events, 9 author lifeEvents, 15 excluded global events, 6 character entries
  (descriptions, aka, every appearsIn note), all 4 order rationales and their
  debated blocks, all 5 startHere path descriptions and notes, the franchise
  description, the author bio, and the empty eras block. Two load-bearing
  reveals protected. (1) The Bosch/Haller half-brother relationship: a genuine
  late reveal in The Brass Verdict (2008), confirmed by the publisher test -
  Brass Verdict's own jacket presents the two as "two loners" forced to work
  together and never states the tie, while Resurrection Walk's (2023) jacket
  states "his half-brother, Harry Bosch" outright. That is the inverse case the
  skill names: a later book's blurb trading an earlier book's reveal. The tie
  lives only in ungated prose, so it is fixed by rewrite in six rendered places
  (there is no gateable field for a plot relationship). (2) Terry McCaleb's fate
  in The Narrows: gated with spoilerAfter on his The Narrows appearance, the
  wing's one boundary, mirroring Karin Slaughter's Tolliver. Also softened a
  Bosch-illness leak (a Desert Star development) out of two rendered fields.
  validate.py --slug michael-connelly clean but for the pre-existing, expected
  missing theme.art (visual-language's). No new warnings; the added data-decision
  comments pass the content-comment scanner.
produced:
  gated:
    - field: characters.yaml -> terry-mccaleb -> appearsIn[the-narrows]
      spoilerAfter: michael-connelly/the-narrows
      why: >
        McCaleb, a series lead, dies in The Narrows (his death is the book's
        inciting incident, but the author's own page frames it coyly as an
        "appearance," not jacket-stated). The row is now shielded for a reader
        who has not read The Narrows. Anchor is The Narrows: the work whose
        first read the fact damages, and where it is revealed. The row's note
        ("Small appearance") and his description state nothing of his fate, so
        no sibling prose defeats the gate (Randall Flagg sweep done).
  reworded:
    - where: characters.yaml -> mickey-haller.description
      from: "...chauffeured Lincoln. Bosch's younger paternal half-brother, sharing their late father, prominent defense attorney J. Michael Haller Sr. Lead of..."
      to: "...chauffeured Lincoln, son of the prominent defense attorney J. Michael Haller Sr. Lead of..."
      why: half-brother tie is a Brass Verdict reveal; kept the father (Haller's own backstory from Lincoln Lawyer #1, not the Bosch link).
    - where: franchise.yaml -> description
      from: "the legal thrillers of Bosch's half-brother [[work:...|Mickey Haller]]"
      to: "the legal thrillers of defense attorney [[work:...|Mickey Haller]]"
    - where: authors/michael-connelly.yaml -> bio
      from: "run alongside his half-brother Mickey Haller (a defense attorney), Detective Renée Ballard,"
      to: "run alongside defense attorney Mickey Haller, Detective Renée Ballard,"
    - where: events.yaml -> lincoln-lawyer-film-2011.description
      from: "the 2005 novel that introduced Bosch's defense-attorney half-brother [[character:...|Mickey Haller]]"
      to: "the 2005 novel that introduced defense attorney [[character:...|Mickey Haller]]"
      why: events render ungated (spoilerAfter null); the clause leaked the tie to every reader. Reworded rather than gated - a film-adaptation event should reach everyone, and a publication fact is never a gate anchor.
    - where: works.yaml -> the-reversal.synopsis
      from: "for once - with his half-brother Harry Bosch as his lead investigator."
      to: "for once - with Harry Bosch as his lead investigator."
    - where: works.yaml -> the-crossing.synopsis
      from: "as a defense investigator for his half-brother Mickey Haller on a murder case"
      to: "as a defense investigator for Mickey Haller on a murder case"
    - where: works.yaml -> resurrection-walk.synopsis
      from: "with Harry Bosch, slowed by age and illness but still working, as his investigator."
      to: "with Harry Bosch, slowed by age but still working, as his investigator."
      why: Bosch's diagnosed illness is a Desert Star (2022) development, not in Resurrection Walk's own jacket. Precautionary and loosenable.
    - where: characters.yaml -> harry-bosch -> appearsIn[resurrection-walk].note
      from: "slowed by age and illness but still active."
      to: "slowed by age but still active."
      why: same Desert Star protection as the resurrection-walk synopsis; loosenable.
  curatorNotesAdded:
    - "works.yaml -> the-brass-verdict.note: records that the half-brother tie is a late reveal held out of all rendered prose, so the next enrichment pass does not pull it from a later book's blurb (note is curator-only, never rendered)."
    - "works.yaml -> the-narrows.note: records that the unnamed FBI-agent husband is Terry McCaleb, left unnamed so the synopsis does not disclose his fate."
    - "characters.yaml header: documents the McCaleb gate and the wording-only protection of the blood tie."
  rulingsCheckedNoChange:
    - "A Darkness More Than Night synopsis ('a suspect he never expects: Harry Bosch himself'): kept. The jacket sells exactly this collision ('the two men find themselves at odds', 'his investigation tangles with Bosch's lines'); it is the book's marketed premise and reveals no outcome."
    - "The Fifth Witness / double-prize-year-2012 event (client accused of killing the foreclosing banker): kept - jacket premise and the Harper Lee Prize citation's own wording."
    - "The Poet's twin-brother suicide, Blood Work's heart transplant, Dark Sacred Night's Bosch/Ballard team-up, Nine Dragons' 'estranged daughter': all jacket premises, no fate leaked. Kept."
    - "Bosch's recurring departures from the LAPD (Lost Light, The Crossing 'forced out'): each is that book's own marketed status quo, a career change, not a twist. Kept."
    - "connections edges (a-darkness->blood-work, brass-verdict->black-echo, dark-sacred-night->late-show, proving-ground->fair-warning, ironwood->the-waiting, hollow->resurrection-walk): none disclose a survival or reveal about the earlier work. Kept."
    - "All 7 events and 9 lifeEvents are production/reception/biography with spoilerAfter null - correct; none needs a gate. No stray spoilerAfter on an ungated field anywhere in the wing (nothing to delete)."
  startHereVerdict: >
    Passed, no tightening needed. try-lincoln-lawyer's note names that a reveal
    happens ("brings Harry Bosch into Haller's casework and reveals how the two
    men are tied to each other") without stating the half-brother fact - the
    good pattern. try-ballard's note is reading-order guidance about a marketed
    partnership, not a plot leak. The other three paths state only reading-order
    consequences.
forStages:
  translation: >
    No pt-PT overlay exists for this wing (i18n_coverage lists all six connelly
    files as fully missing), so nothing was invalidated - but when the overlay
    is written it MUST translate the REWORDED base strings, not the originals a
    cached blurb would give. Copy exactly: (1) mickey-haller.description now
    "son of the prominent defense attorney J. Michael Haller Sr." with no
    half-brother clause; (2) franchise.description "defense attorney Mickey
    Haller" (was "Bosch's half-brother"); (3) author bio "defense attorney
    Mickey Haller" (was "his half-brother Mickey Haller (a defense attorney)");
    (4) events lincoln-lawyer-film-2011 "introduced defense attorney Mickey
    Haller" (was "Bosch's defense-attorney half-brother"); (5) the-reversal
    synopsis "with Harry Bosch as his lead investigator" (dropped "his
    half-brother"); (6) the-crossing synopsis "for Mickey Haller" (dropped "his
    half-brother"); (7) resurrection-walk synopsis "slowed by age but still
    working" (dropped "and illness"). The half-brother fact
    and Bosch's illness must appear in NO rendered locale string. The McCaleb
    gate is structure (spoilerAfter), no prose, nothing to translate.
  visual-metadata: "Unaffected. No spoiler-gated art; theme.art gap unchanged, still owned by visual-language."
  editions: "Unaffected. No editions.yaml touched."
openQuestions:
  - "Bosch-illness soften (resurrection-walk synopsis + Bosch's resurrection-walk appearsIn note) is precautionary and LOOSENABLE. Reasoning: the diagnosis is a Desert Star (2022) development and is not on Resurrection Walk's own jacket. If a curator confirms Bosch's decline is openly established by late-series marketing, 'slowed by age' can be restored to 'slowed by age and illness'. Cut here because it costs the wrongful-conviction premise nothing and the wing's asymmetry favours caution."
  - "The McCaleb gate carries the same faint tell the Karin/Tolliver gate does: a shielded row on his card, with his earlier rows plain, signals that something around The Narrows is spoiler-sensitive. Kept because a real protagonist death is exactly what the asymmetry protects and the cost is one shielded row - but it is a curator's call to loosen, same as the precedent."
  - "The half-brother tie is protected by wording alone because the engine has no gate for a plot relationship (not an appearance, not an event). If the curator wants it engine-enforced rather than prose-enforced, the only lever would be to invent a gated McCaleb-style appearance stating it behind The Brass Verdict - not recommended: it would add a roster row whose sole purpose is to carry a fact, against 'rewrite before redact' and 'keep the roster tight'. The rewrite is the correct remedy; flagging only because the task framing expected a gate."
