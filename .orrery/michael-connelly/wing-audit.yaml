stage: wing-audit
summary: >
  Audited the whole Michael Connelly wing against the artefacts, not the prior
  reports. Re-derived every number. The three orchestrator fixes hold (LCCN now
  00031025; "wing" gone from all rendered prose, remaining only in non-rendered
  comments; the two reveal-naming notes reworded). But two silent failures
  survive: the reworded note fields STILL carry reader-facing pipeline/meta text
  under the orrery#106 leak, and the aura figures the pipeline reported (28
  entries, 0.60/work, dark run closed to 4yr) are wrong - the artefact is 18
  entries, 0.38/work, with a 5-year dark run (1997-2001) the density gate still
  flags. One trivial fix made and committed. validate.py is RED on one expected
  error only: the missing theme.art block (visual-language stage, not part of
  this run).

baselineNumbers:
  validate: "FAILED, 1 error (theme.art missing) + 2 warnings (spoiler-audit & translation handoffs over 700 words). No content-comment-policy violations."
  aura_density: "18 entries / 47 works = 0.38 per work; longest dark run 5 yrs (1997-2001), TRIPS the 5+ alarm."
  event_density: "global layer healthy: 17 globals, 2 high used of ~4 budget, no over-budget decade. Wing includes 2 globals (2008, 2020), both resolve."
  isbns: "51/51 ISBN-13 check digits re-computed by hand, 0 bad."
  covers: "40/47 in works.yaml; 5 sampled OL cover URLs all return 200 image/jpeg (pixel/watermark check remains visual-metadata's - not re-done here)."
  i18n: "pt-PT at full coverage, no regression; register European; no reveal reintroduced in any rendered pt-PT string."

blocking:
  - id: note-fields-leak-pipeline-text
    owner: spoiler-audit
    what: >
      works.yaml the-narrows.note and the-brass-verdict.note render to readers
      (orrery#106) yet still contain internal coordination and a bug reference:
      "(see characters.yaml)", "so no later pass should name him here", "across
      all of these books", and verbatim "since note fields can surface to
      readers (orrery#106)". Fix #1 removed the NAMED reveal from these two
      notes but left the meta-explanation in the rendered field. A reader on
      those two work pages currently sees curation vocabulary and a tracker id.
    fix: >
      Reduce each note to its reader-facing content (the-narrows: the sequel-to-
      The-Poet + Cassie Black return; the-brass-verdict: "The first Bosch/Haller
      crossover.") and move the spoiler rationale into a # comment, which does
      not render. Routed, not done: choosing the reader-facing wording is
      editorial and spoiler-audit owns it.
  - id: theme-art-missing
    owner: visual-language (stage not run in this pipeline)
    what: >
      validate.py FAILS: theme.yaml has no art block, so the wing has no visual
      law. Every prior stage flagged this as expected. It is the 11th stage,
      never run here. The wing cannot pass validate or draw any sketch until it
      runs. Not a defect any of the ten stages introduced, but a hard blocker to
      shipping.

missing:
  - id: aura-numbers-overstated-and-dark-run-live
    owner: press-archaeology
    what: >
      press-archaeology's handoff (and this task's brief) report 28 aura
      entries / 0.60 per work with the dark runs closed to 4 yrs. Re-derived
      with aura_density.py: 18 entries, 0.38 per work, and a 5-year dark run
      1997-2001 that STILL trips the gate's 5+ alarm. The real trajectory was
      8 -> 18 (10 added), mis-stated as 18 -> 28. The 1997-2001 window (Trunk
      Music, Blood Work, Angels Flight, Void Moon, A Darkness) carries no aura.
      The wing is not thin overall, but the flagged silence is real and was
      reported as resolved when it is not.

stale:
  - id: a-darkness-note-overstates-2000
    owner: completeness-auditor
    what: >
      works.yaml a-darkness-more-than-night.note calls the 2001 date "an
      isolated outlier against all of the above". It is not isolated: the first
      edition's own copyright page is c2001 (recorded in editions.yaml) and the
      author's site says 2001. Wikipedia's infobox does give Nov 8 2000, so the
      2000 call is defensible as a release date, but the note overstates the
      certainty and leans partly on OL first_publish_year (a CURATION-4 junk
      field) and an LCCN whose 00-prefix is the CIP-assignment year, not the
      publication year. Reword to present it as the genuinely contested date it
      is. (Not fixed here: it is a sourcing judgement, not mechanical.)

checkedClean:
  - "Fix #2 holds: works.yaml cites lccn.loc.gov/00031025; 00046204 survives only in an editions.yaml comment documenting the correction."
  - "Fix #3 holds: no rendered field contains 'wing'; every remaining occurrence is a # comment, which does not render."
  - "Spoiler safety: grepped base + pt-PT for half-brother / meio-irmao / illness / McCaleb-death. No rendered surface names the blood tie or McCaleb's fate. Only one non-rendered pt-PT comment spells the tie out (safe, but more explicit than the base's restraint - minor)."
  - "McCaleb spoilerAfter gate resolves (characters.yaml terry-mccaleb the-narrows) and validate accepts it. The two taste-path startHere notes warn without naming."
  - "connections: all 6 declared later->earlier (correct direction), all resolve, rendered both ways."
  - "globalEvents: both includes resolve in global.yaml; all 17 catalogue globals addressed (2 include + 15 exclude)."
  - "capabilities all auto, all backed by real data (18 aura -> river/companion, 6 chars + 6 edges -> connections, startHere -> wizard, editions.yaml -> editions). No feature lit up half-empty."
  - "eras: [] correct (concurrent series, no received periodisation). theme displayFace=sourceSerif, signature=thread both in the app's set. ink/bg contrast high."
  - "editions: 51 entries (48 en + 3 pt-PT), ISBNs all valid, coverage 47/47 works."

trivialFixesMade:
  - "Corrected stale '(2001)' -> '(2000)' for A Darkness More Than Night in the jack-mcevoy-in-order debated block, base + pt-PT overlay in one commit (works.yaml canonical year is 2000; the parenthetical contradicted it). Committed."

curatorDecisionList:
  - "subseries dual-billing (Bosch/Ballard five books; Bosch/McCaleb A Darkness): tagged Harry Bosch on the unbroken-numbering tie-break. Dual billing IN the subseries field needs a schema change (one string per work). Curator/schema call."
  - "The Hollow date: publisher Oct 27 2026 used; author's site says Nov 3 2026 (twice). Documented on the work. Minor curator call."
  - "Crime Beat year: 2004 (Vascik first edition) used over 2005/2006. Contested, low stakes (extended, off-spine). Curator call."
  - "A Darkness More Than Night year: 2000 (Wikipedia release date) vs 2001 (copyright page + author site). Genuinely contested; note overstates 2000. Curator call - see stale finding."
  - "Anthology/short-fiction scope: 12 single-story anthology contributions excluded wholesale, though SCHEMA's own worked example endorses cataloguing them as contributor/apocrypha. Avalon (ABC development) and The Safe Man (audio drama) carry the most weight. Curator's scope call."
  - "Maggie McPherson absent from characters.yaml: appearsIn not sourceable cleanly. Add or leave out - curator/completeness call."
  - "McCaleb & Catalina orders: below this run's floor (2 books each), left to the derived default. Add if every named subseries should have an order. Curator call."
  - "orrery#106 (note fields render): the app bug behind the blocking finding. Fixing the app removes the leak surface; until then notes must stay clean. Curator/app call."
  - "AO90 spelling: pt-PT overlay uses post-reform spelling (detetive, atualidade, batizado) because the existing corpus gave no discriminator. Reconcile against a house convention if one exists. Native-reviewer call."
  - "pt-PT quoted callbacks 'resurrection walk' (the-proving-ground) and 'the hollow' (the-hollow) kept in English rather than translated as prose. Close call - native-reviewer call."

openQuestions:
  - "Clinton-carries-the-book (1994) is graded impact: high. Defensible as the visibility inflection point, but it is reception, not the author's inner weather; a med grade would be equally arguable. Left as press-archaeology's call, flagged not corrected."
