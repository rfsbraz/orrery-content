stage: visual-metadata
summary: >
  Covers 40/47. Every cover sourced from Open Library, work records verified
  against the omnibus/wrong-work/junk-year traps before drawing a cover id,
  then all 40 (plus rejected alternates) checked in labelled contact sheets -
  twice, since the first low-resolution pass missed audio-CD narrator credits
  and "cover not final"/"cover to be unveiled" placeholder banners that only
  read clearly at full size. Twelve works needed a second or third candidate
  after that re-check; each carries a data-decision comment naming the id
  rejected and why (full list in produced.rejectedOnQuality). Author portrait
  sourced and identity-checked against Wikipedia's own infobox photo choice.
  Franchise header matches theme.yaml's "LA basin haze at dusk" register.
  Seven works ship with no cover, each commented in place (produced.gaps).
  validate.py --slug michael-connelly clean except the pre-existing, expected
  missing theme.art (visual-language's).
produced:
  worksImages: "40/47"
  authorPortrait:
    source: "https://commons.wikimedia.org/wiki/File:MConnelly.jpg"
    credit: "Mark Coggins, CC BY 2.0"
    note: >
      The file Wikipedia's own infobox uses for this article; cross-checked
      against two other independently-credited Commons photos of Connelly. A
      fourth candidate a Commons author-search surfaced ("...College of
      DuPage 2014.jpg") shows a different person and was not used.
  franchiseHeader:
    source: "https://commons.wikimedia.org/wiki/File:Downtown_LA_at_Sunset..jpg"
    credit: "Kevin Stanchfield, CC BY 2.0"
  licenceBreakdown: "40 covers: Open Library. Portrait + header: Wikimedia Commons, both CC BY 2.0."
  rejectedOnQuality: >
    Each swapped for an audio-CD sleeve or a pre-release placeholder found on
    the work's own OL record (full ids and reasoning are each work's own
    images comment in works.yaml): the-poet (too-small scan), the-overlook,
    the-fifth-witness, the-black-box, the-burning-room, the-crossing,
    the-wrong-side-of-goodbye, the-late-show, dark-sacred-night,
    the-night-fire, the-dark-hours, resurrection-walk.
  gaps: >
    angle-of-investigation, suicide-run, mulholland-dive (ebook-only bundles,
    no coverable OL record); the-waiting, nightshade (OL's only cataloged
    cover is a pre-release placeholder; nightshade's record additionally
    mixes in two ids for an unrelated children's book, "Because I Had a
    Teacher" - an OL-side data error, not fixed here); ironwood (no OL record
    at all); the-hollow (unpublished, forthcoming 2026-10-27). Each commented
    in place on its work.
forStages:
  editions: >
    No editions.yaml exists yet. This stage's coverSource on each work already
    names a verified, non-omnibus OL work id for 40/47 works if that stage
    wants a running start.
  translation: >
    No new translatable prose - images fields are URLs and licence-credit
    strings, not display prose. No pt-PT regression.
  wing-audit: "theme.art is still absent (visual-language's); the one remaining validate.py error is expected."
openQuestions:
  - "Nightshade, The Waiting and Ironwood are 2024-2025 titles still thin on
     Open Library; a later re-check once a paperback/Large Print edition is
     catalogued would likely surface a real cover for at least the first two."
  - "The Hollow cannot get a cover before it publishes (2026-10-27)."
  - "A few chosen covers (the-poet, angels-flight, nine-dragons,
     the-proving-ground) are on the small side (roughly 130-260px wide) but
     are the largest clean, non-audio, non-placeholder jacket each work's OL
     record holds."
