stage: reading-orders
summary: >
  Wrote orders.yaml (4 orders) and franchise.yaml's startHere (5 paths).
  Orders: the four subseries with enough books to walk apart from the rest
  of the shelf, each filtered to the publisher's own numbered "Series Order"
  list at michaelconnelly.com/series/ - Harry Bosch (26 novels, novels-only,
  excludes the 3 apocrypha ebooks), The Lincoln Lawyer (8), Renée Ballard (6,
  crossing the subseries-tag boundary the same way Karin Slaughter's
  will-trent-in-order does for a co-lead thread), and Jack McEvoy (3). No
  order for Terry McCaleb (one lead novel, one co-lead appearance) or
  Catalina (two books so far, still opening) - both stay covered only by the
  derived default, named as such in orders.yaml's header rather than padded
  into thin orders. No combined Bosch+Ballard order either: the derived
  default already keeps Bosch's solo run intact before Ballard's thread
  joins his for good, argued in the same file's header. startHere: a
  completionist path (default), a start-at-the-beginning path (the full
  Bosch order, sourced to novelsuspects.com and tlbranson.com), two safe-taste
  paths (Try the Lincoln Lawyer and Try Ballard, each a single-book workIds
  list, each sourced and each carrying the required fold-into-Bosch spoiler
  warning without naming the reveal), and a continue-from-elsewhere path
  (Continue into Bosch, structural, for a reader coming off either taste).
  validate.py --slug michael-connelly clean except the pre-existing, expected
  missing theme.art (visual-language's, unchanged by this stage).
produced:
  orderIds:
    - michael-connelly/harry-bosch-in-order
    - michael-connelly/lincoln-lawyer-in-order
    - michael-connelly/renee-ballard-in-order
    - michael-connelly/jack-mcevoy-in-order
  pathIds:
    - everything-in-order
    - start-with-bosch
    - try-lincoln-lawyer
    - try-ballard
    - continue-into-bosch
  rejectedOrders: >
    Terry McCaleb (Blood Work solo + A Darkness More Than Night co-lead: two
    books, one of them already inside the Bosch order under the dual-billing
    ruling) and Catalina (Nightshade + Ironwood: two books, series still
    opening) - both below this catalogue's own precedent floor for a
    standalone order (the thinnest existing orders here run 3 books:
    chuck-palahniuk's fight-club-sequence and horror-trilogy, joao-tordo's
    lugares-sem-nome, terry-pratchett's industrial-revolution). Recorded in
    orders.yaml's header rather than silently omitted.
  globalEventsUnchanged: true
forStages:
  spoiler-audit: >
    Both taste-path notes (try-lincoln-lawyer, try-ballard) name that a
    fold-in/reveal happens without stating what it is, per SKILL.md section
    7 - worth your own read, especially try-lincoln-lawyer's "reveals how
    the two men are tied to each other," which is the vaguest phrasing this
    stage could write for the Bosch/Haller half-brother fact
    franchise-research flagged as open. The four order rationales in
    orders.yaml and all five path descriptions/notes in franchise.yaml are
    in your scope per SKILL.md ("systematically under-checked").
  translation: >
    New prose needing pt-PT overlays: 4 order names/rationales/debated
    entries (content/i18n/pt-PT/franchises/michael-connelly/orders.yaml,
    keyed by order id, name/rationale/debated only) and 5 path
    titles/descriptions/notes (franchise.yaml's pt-PT overlay, title/
    description/note only - never workIds/orderId/fit). Wing had no pt-PT
    orders/startHere overlay before this run either, not a regression.
  visual-metadata: "Unaffected. Still all 47 works and the author portrait absent."
  editions: "Unaffected. Still no editions.yaml."
  eras: "Unaffected. eras: [] stands, unrelated to this stage's orders/paths."
  event-resonance: "Unaffected. globalEvents block is byte-identical to before this stage."
openQuestions:
  - "Terry McCaleb and Catalina orders are a judgement call, not a settled
     fact: if the curator wants every named subseries to have its own order
     regardless of size, both are ready to write (McCaleb: blood-work,
     a-darkness-more-than-night; Catalina: nightshade, ironwood), just below
     this run's chosen floor."
  - "try-lincoln-lawyer and try-ballard both point at a single-book workIds
     list rather than a short order; per SKILL.md section 1, a path's
     handful of books belongs in workIds, not in orders.yaml, so this is the
     correct shape, not a shortcut - flagging only because both are thinner
     than Karin Slaughter's two-book will-trent-taste."
  - "continue-into-bosch and start-with-bosch intentionally share one
     orderId (michael-connelly/harry-bosch-in-order): the wing has one hub,
     not two closed side-arcs the way Karin Slaughter's Grant County/Will
     Trent split does, so 'start here' and 'continue here' are honestly the
     same traversal for two different readers rather than two different
     traversals. Noting it since it's a different shape from the Karin
     precedent this wing otherwise mirrors closely."
