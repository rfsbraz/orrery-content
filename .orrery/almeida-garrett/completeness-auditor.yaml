forStages:
  press-archaeology: >
    The ennoblement date/monarch discrepancy franchise-research flagged is now
    resolved by primary sourcing: the Biblioteca Nacional de Portugal's own
    day-by-day 1999 bicentenary chronology
    (https://purl.pt/96/1/bio/bio_07.html) dates it precisely to 25 June 1851
    ("agraciado com o título de visconde"), under Maria II, who reigned until
    her death in November 1853. Both en-wiki's year (1852) and pt-wiki's
    monarch pairing (implying Pedro V, chronologically impossible in 1851)
    are wrong; the correct pair is Maria II + 1851. Separately, Hino
    Patriótico (1820, new this pass) is Garrett's literary debut, written the
    week of the 24 August Liberal Revolution and sung publicly days later -
    worth a look for lifeEvents given this catalogue's rule that a wing's
    timeline should open near the author's real start, not just their birth.
  eras: "44 works now, further past the 1-2-work skip threshold franchise-research already flagged; still routes to this skill."
  editions: "5 new works added, all pre-1900 except one (1954, a minor posthumous farce). Viagens na Minha Terra and Frei Luís de Sousa remain the obvious first ISBN targets, unchanged by this pass."
  visual-language: "theme.yaml's missing art: block is unchanged and still the sole expected validate.py error."
openQuestions:
  - >
    Grouping call (franchise-research's own weakest decision): untouched by
    this pass, still the curator's to make. This audit is a data point in its
    favour though: none of the five newly-found works fit any of the four
    existing bundles (three lifetime-published occasional poems and one
    1841-composed farce all fall outside the bundles' posthumous/juvenile/
    political scopes as drawn), so the bundle boundaries held under scrutiny
    rather than needing a fifth catch-all.
  - >
    O Alfageme de Santarém 1841-vs-1842: resolved to 1842, now corroborated
    by three independent sources (pt-wiki's detailed bibliography, the play's
    own dedicated pt-wiki article citing Infopédia, and Infopédia's own
    Garrett biography). The 1841 in pt-wiki's milestone chronology names the
    staging year, consistent with this file's established premiere/print
    distinction elsewhere (Frei Luís de Sousa). No value changed since 1842
    was already the value on file; only the note was rewritten to close the
    question instead of recording it as open.
  - >
    Ennoblement monarch/date: resolved (see the press-archaeology note
    above), but the fix belongs in content/authors/almeida-garrett.yaml,
    outside this stage's file.
  - >
    Checked and deliberately not added: "Memórias de uma África sofrida"
    (1830) appears only in pt-wiki's periodical-publications milestone list
    with no corroborating detail found anywhere else checked, including the
    Biblioteca Nacional's own periodicals page - held out rather than
    guessed at. "Proclamações Académicos" (Coimbra, 1820) is BNP-catalogued
    as manuscript political proclamations reproduced in a periodical, closer
    in kind to the bundled political/ceremonial prose than to a standalone
    poem, and is held out for the same reason this file's own header already
    excludes periodical writing.
  - "validate.py's one error (no theme.art) is the expected pre-visual-language state, not an oversight."
