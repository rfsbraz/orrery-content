stage: wing-audit
# Over the 700-word handoff cap, deliberately and knowingly: this is the
# terminal content stage, so no later stage pays to read it, and the report
# below is the deliverable itself rather than a summary for a successor. The
# resulting validate.py warning is the only new warning on this wing.
summary: >
  No blocking finding: nothing false or unprotected reaches a reader. Eight
  stale or policy-breaking comments fixed in place, eleven findings routed.
  The two that matter most are a cover the wing cannot render well (Frei Luis
  de Sousa, its own flagship, is a 128x210 thumbnail) and an English string
  that ships to a pt-PT reader while every coverage number reports 100%
  (pseudonyms[].note is rendered by the app and walked by no script).
baseline:
  validate: "0 errors, 18 warnings (14 posthumous works outside every era, 4 handoff word-count caps). Identical before and after this stage."
  i18n: "pt-PT 363/379 files fully covered; almeida-garrett in neither MISSING nor PARTIAL."
  auraDensity: "44 works, 18 aura, 0.41 per work, span 1820-1987, longest dark run 45 yrs (1905-1949). Catalogue median is ~0.40; eca-de-queiros 0.42, jose-saramago 0.44, valter-hugo-mae 0.35."
  eventDensity: "22 global events; every decade 1580s-1860s empty; high budget 2 of ~17."
  artRotation: "organisation rotation holds across all 18 events (no cap breach, no neighbour repeat); pacing holds (contour #===#=#==#=.===#==, no touching loud cells, no plateau). The 1 reported problem is the composition axis (0 of 20 assets readable), which is the pre-art state, not this gate."

fixedDirectly:
  - file: content/franchises/almeida-garrett/franchise.yaml
    what: >
      The capabilities comment carried four false claims: "an 8-lifeEvent
      author entity" (16), "No franchise events.yaml or editions.yaml exist
      yet" (both exist), "no franchise-specific events or verified ISBNs have
      been sourced" (2 events, 9 ISBNs), and "editions stays off by the app's
      own auto-detection" (editions.yaml has 12 entries, so it auto-detects
      on). Rewritten to the state I re-derived against
      lib/content/capabilities.ts. spoiler-audit's handoff flagged the
      lifeEvent count as its last openQuestion and nobody acted on it.
    class: stale statement of fact
  - file: content/franchises/almeida-garrett/franchise.yaml
    what: >
      Documented the absent globalEvents block. This is the only wing in the
      catalogue with no such block, and the absence was invisible: a shared
      event renders only when named in `include`, and nothing in
      content/events/global.yaml falls inside 1799-1854 (earliest is 1870).
      Now stated in the file, matching the edgar-allan-poe precedent.
    class: invisible absence made visible
  - file: content/franchises/almeida-garrett/works.yaml
    what: >
      Header called editions and covers "a separate, not-yet-written layer".
      Both layers now exist (editions.yaml, 14 curated covers).
    class: stale statement of fact
  - file: content/franchises/almeida-garrett/works.yaml
    what: >
      romanceiro-e-cancioneiro-geral's cover comment claimed an 1863 edition
      "collecting all three tomes". Fetched and looked at the image: the page
      scanned is tome III's own title page, "ROMANCEIRO PELO VISCONDE DE
      ALMEIDA-GARRETT / III / ROMANCES CAVALHERESCOS ANTIGOS / SEGUNDA
      EDIÇÃO / LISBOA / EM CASA DA VIUVA BERTRAND E FILHOS / 1863". Corrected
      to what the artefact shows. The cover itself is fine for the work.
    class: factual slip, caught from the artefact
  - file: content/franchises/almeida-garrett/eras.yaml
    what: >
      Header said "Two of those items are plays of his mature years held back
      from print" (Um Noivado no Dafundo 1857, As Profecias do Bandarra 1877).
      There are three: Entremez dos Velhos Namorados, which works.yaml's own
      note dates written 1841 and printed 1954. Corrected to three, each with
      its written and printed year.
    class: factual slip, contradicted by the wing's own data
  - file: content/franchises/almeida-garrett/works.yaml
    what: >
      teatro-de-juventude-inedito's note ended "for a future pass to split out
      if any is judged load-bearing on its own" - CURATION.md §2 coordination,
      and literally on validate.py's own banned-phrase list. Collapsed to the
      data property ("so any one of them can be split out into its own entry").
    class: comment policy
  - file: content/franchises/almeida-garrett/works.yaml
    what: >
      discursos-memorias-e-opusculos-politicos' note ended "for a future pass
      to work from" - same violation. Replaced with the fact it was gesturing
      at: pt-wiki's "Artigos, ensaios, biografias e folhetos" section carries
      further pamphlets the enumeration does not list, among them
      "Proclamações Académicos" (Coimbra, 1820) and "Aos Mortos no Campo da
      Honra de Madrid" (Lisbon, 1822), so the list is representative rather
      than exhaustive. Both titles and years read off pt-wiki's raw wikitext.
    class: comment policy
  - file: content/franchises/almeida-garrett/editions.yaml
    what: >
      "Unconfirmed rather than excluded with confidence - a human with a
      browser could settle this one" addresses a person, the exact shape
      CURATION.md §2 names ("left to the curator"). Collapsed to the fact:
      the attribution rests on one retailer listing and must not be recorded
      from it alone.
    class: comment policy

routed:
  - id: frei-luis-cover-is-a-thumbnail
    owner: visual-metadata
    priority: missing
    finding: >
      The wing's flagship work - featured: true, compulsory reading in the
      Portuguese 11th-year syllabus, one of the two startHere works - carries
      a 128x210 px, 4 KB cover. Every other cover on the wing is ~300x500. It
      will render soft at card size.
    verified: >
      covers.openlibrary.org/b/id/3904404.json reports width 128, height 210,
      and filename_m and filename_l are the same 4057-byte blob, so no larger
      version exists; the source is a Google Books frontcover thumbnail for
      ISBN 9725651421. There is no better fallback for coverFor to reach:
      both editions ISBNs (9789720049599, 9789897024306) return 404 on
      /b/isbn/...-L.jpg?default=false. The lever is editions[].coverUrl,
      which outranks work.images.cover and is unset on every entry.
  - id: frei-luis-cover-credit-describes-the-record-not-the-image
    owner: visual-metadata
    priority: stale
    finding: >
      works.yaml credits the cover as "A 1993 Instituto da Biblioteca Nacional
      e do Livro edition", but the image OpenLibrary serves is a 19th-century
      title page ("FREI LUIZ DE SOUSA ... LISBOA"). The credit describes the
      OL edition record; a reader sees something else. Not corrected here
      because naming what the scan actually is needs the edition sourced.
  - id: pseudonym-notes-render-in-english-on-the-pt-pt-page
    owner: the translation skill (and the curator, for the tooling half)
    priority: missing
    finding: >
      content/i18n/pt-PT/authors/almeida-garrett.yaml carries no `pseudonyms`
      block, so all three notes (F. E., Múcio Cévola, Josino Duriense) render
      in English under "Também escreveu como" on the Portuguese page.
    verified: >
      components/about-the-author.tsx:83 renders p.note through <Prose>, and
      lib/content/index.ts mergePseudonyms merges an overlay's notes by name,
      so the lever exists and is unused. i18n_coverage.py walks lifeEvents,
      heteronyms and startHere but not pseudonyms, which is why the wing
      reports 100%. Catalogue-wide: 35 of the 36 author files with pseudonyms
      have the same gap (only gabriel-garcia-marquez translates them), and
      eca-de-queiros' own pt-PT header documents the state - Garrett's does
      not. A known catalogue state rather than a Garrett-specific failure,
      but it is English prose on a Portuguese page either way.
  - id: i18n-coverage-does-not-walk-pseudonyms
    owner: the curator (scripts/i18n_coverage.py)
    priority: missing
    finding: >
      Add `pseudonyms[].note` to the PROSE walk. Until then "full pt-PT
      coverage" is a claim about the fields the script knows, and this one
      renders.
  - id: comment-policy-scan-is-blind-to-wrapped-phrases
    owner: the curator (scripts/validate.py)
    priority: missing
    finding: >
      The comment-policy scan matches line by line, so a banned phrase split
      across two YAML lines is invisible. Both violations I fixed were the
      phrase "for a future pass", which is on the scanner's own banned list;
      it survived only because "for a" ended one line and "future pass" began
      the next. Join continuation lines before matching. Falsified the
      scanner first (injected "The visual-metadata stage could not run this
      session; left to the curator for a future pass." into events.yaml: it
      fired; removed it: it went quiet, clean git diff), so the gap is in the
      line handling, not the regex.
  - id: proclamacoes-academicos-held-out-on-contradictory-grounds
    owner: completeness-auditor
    priority: missing
    finding: >
      The handoff excluded "Proclamações Académicos" (Coimbra, 1820) as
      "closer in kind to the bundled political/ceremonial prose" and then
      held it out under the file's periodicals rule. Those two reasons pull
      opposite ways. pt-wiki files it as the first entry under "Artigos,
      ensaios, biografias e folhetos" - the same section every constituent of
      discursos-memorias-e-opusculos-politicos comes from - not under
      "Publicações periódicas". If it is the same kind as the bundle it
      belongs in the bundle's enumeration, which would move that entry's
      `published` from 1821 to 1820. I recorded the fact in the note; the
      ruling is not mine to make.
    checkedAndHolds: >
      "Memórias de uma África sofrida" (1830) holds. pt-wiki lists it under
      "Publicações periódicas" beside "O cronista" (1827), so works.yaml's own
      standing exclusion of Garrett's periodical work covers it squarely - a
      stronger reason than the handoff's stated one ("no corroborating
      detail").
  - id: frei-luis-interval-still-unsettled
    owner: completeness-auditor
    priority: stale
    finding: >
      spoiler-audit's own openQuestion, still open. The synopsis says "Years
      after her first husband was given up for dead" because the sources
      disagree: Porto Editora's Edição Didática says seven years, the
      pre-rewrite prose said twelve. Settle it against the text.
  - id: dark-run-1905-1949
    owner: press-archaeology
    priority: missing (lead, not defect)
    finding: >
      45 consecutive publishing years with no aura. press-archaeology
      searched this window specifically, documented the negative, and named
      Hemeroteca Digital de Lisboa as the archive that would settle it. In
      catalogue context it is normal for a pre-20th-century wing
      (eca-de-queiros 54 yrs, miguel-de-cervantes 168 yrs) and the wing's
      0.41 aura-per-work is the catalogue median, so this is a lead.
  - id: global-event-window-for-a-long-afterlife
    owner: event-resonance (scope question for the curator)
    priority: stale
    finding: >
      The zero-diff is correct on its own terms and I verified it: the
      earliest global event is 1870, sixteen years after Garrett died, so
      nothing falls inside the lifetime the skill tells the stage to consider.
      But this wing's timeline runs to 1999, and its own 1950 franchise event
      turns on the Estado Novo's culture body awarding the film its prize -
      which is what portuguese-censorship-1926 is about. Whether an author
      wing's global-event window should be the author's lifetime or the
      wing's aura span is a standing question, not a Garrett defect.
  - id: schema-stale-against-the-app-on-theme
    owner: the curator (docs/SCHEMA.md)
    priority: stale
    finding: >
      Three ways, all touched by this wing. (1) SCHEMA documents `themePreset`
      (franchise.yaml) and `preset` (theme.yaml) as live fields; both have
      zero readers in the app - `preset` was removed from the Theme type in
      app PR #183 ("remove dead theme.preset") and `themePreset` is typed in
      lib/content/types.ts and read nowhere. Garrett writes both. (2) SCHEMA
      lists displayFace as fraunces|spectral|sourceSerif; lib/theme.ts
      implements a fourth, instrument-serif, which Garrett uses. (3) SCHEMA
      lists signature as beam|thread|rule|none; lib/theme.ts implements a
      fifth, filament. The wing's own theme.yaml comment is more accurate
      than SCHEMA, which is the right way round but means SCHEMA is now the
      trap.
  - id: edition-notes-are-inert
    owner: the curator (schema)
    priority: cleanup
    finding: >
      Nothing in the app renders Edition.note, so reader-useful facts sitting
      in editions.yaml ("in stock, 9,99€", "184p, 15x23cm", which translator,
      which critical edition) never reach anyone. Same shape as Work.note,
      but unlike Work.note these read like reader copy rather than curator
      notes. Either a field to render or a convention to state.

notApplicableNotAbsent:
  - "achievements.yaml: none, and nothing in content/achievements.yaml references this wing. Opt-in layer. No era with a countable, stable membership worth a badge, and orders.yaml ships zero curated orders, so there is nothing specific to mark. Generic badges would be worse than none."
  - "orders.yaml empty: researched and argued in the file's own header (genre-thread trio fails the divergence test; five same-year clusters have no shared thread and no source sequences them finer than year)."
  - "globalEvents block absent: nothing in global.yaml falls inside 1799-1854. Now documented in franchise.yaml."
  - "30 of 44 works with no cover, 37 of 44 with no edition: the 19th-century Portuguese market ceiling, not a research gap. Garrett died in 1854, sixteen years before ISBNs, and only INCM's critical series and Porto Editora's Clássicos line reissue him."
  - "editions[].coverUrl unset on every entry: that file's stated policy - visual-metadata owns covers, and no candidate was inspected for a retailer watermark."
  - "No dated lifeEvent for any of the three pseudonyms: all three are attribution facts - unexpanded initials on one 1826 title page, a Roman senatorial name on one 1830 exile pamphlet, a schoolboy byline on a manuscript printed in 1985. No stated motive, no reveal. Correctly notes, not events."
  - "Empty global decades 1580s-1860s, which now include Garrett's whole working life: world-events tested four candidates mechanically against every author's lifespan in the catalogue and documented why none clears the three-franchises bar. Verified correct, not a gap to close."

checkedAndClean:
  ennoblement: >
    Maria II, 25 June 1851, consistent in all four places it appears: the
    author file's header note, `bio`, the almeida-garrett-viscount-1851
    lifeEvent (date 1851-06-25, dateRange "1851-1852" to still carry the 1852
    ministry) and the pt-PT overlay ("pela rainha D. Maria II a 25 de junho de
    1851"). Grepped the wing for a surviving "1852" ennoblement or any "Pedro
    V": none. purl.pt/96/1/bio/bio_07.html is live.
  spoilerGate: >
    One boundary, almeida-garrett-frei-luis-de-sousa-own-household-1843,
    spoilerAfter: almeida-garrett/frei-luis-de-sousa - 1 of 18 entries, so
    neither absent nor blanketing. Its description is the only rendered prose
    in the wing carrying the Act III mechanism. Verified the gate on every
    path this event can render through, not just one: components/timeline.tsx,
    river.tsx's unillustrated branch, and the dispatcher's per-organisation
    component. I checked all 20 files in components/river/ - every one that
    renders an event body wraps in SpoilerGate, including artifact-spread.tsx,
    which is this event's own organisation; the five that do not
    (chapter-gate, dispatcher, gutter, shared, work-card) render eras,
    furniture or works, none of which carry spoilerAfter. SpoilerGate wraps
    title and description together, so the shielded state discloses only
    "Hidden until you finish Frei Luís de Sousa".
  spoilerGateInPtPT: >
    The pt-PT overlay respects the same boundary exactly. It supplies only
    title and description for that id; spoilerAfter stays on the base and is
    not overridable from an overlay, so the gate cannot be lost in
    translation. Read the pt gated description (it carries the mechanism), the
    pt 1841 sibling, the pt bio and the pt frei-luis synopsis: all three
    ungated pt strings stop where the base stops - the second marriage, the
    daughter, the forebodings, Telmo still waiting - and name neither the
    pilgrim's identity nor the annulment nor the deaths.
  workNoteIsNotReaderFacing: >
    The Work type in the app has no `note` field and nothing reads one, so
    frei-luis-de-sousa's note quoting wook.pt's ending in full is curator
    documentation, not a leak. Verified rather than assumed, because the note
    is the one place in the wing where the ending is written down.
  erasFraming: >
    Documented in eras.yaml's header, not merely asserted in a handoff -
    "WHAT SITS OUTSIDE, DELIBERATELY". The count is exact: 14 works published
    1857-1987 fall outside every era, matching validate.py's 14 warnings one
    for one. Both `period` strings parse, run contiguous (1835 to 1836) and do
    not overlap. The boundary reasoning rests on 1831-1837 being empty in the
    bibliography; I re-derived the published-year histogram and there is
    indeed no work between 1830 and 1838.
  artRotation: >
    Re-ran art_rotation.py --check almeida-garrett myself. Organisation
    rotation holds across all 18 events - beside 4, full-bleed-vista 3,
    artifact-spread 3, immersion 2, medallion 2, then one each of diptych,
    marginalia, floating-object, layered-stack - no organisation over cap, no
    neighbour repeats. Pacing holds, contour #===#=#==#=.===#==, no two loud
    cells touching or sharing a screenful, no plateau. The single reported
    "rotation problem" is the composition axis (0 of 20 assets readable),
    which is the pre-art state and not this gate.
  isbnCheckDigits: >
    Computed the check digit on all nine shipped ISBN-13s, not a sample: all
    nine valid, no duplicates. Prefixes correct - eight pt-PT entries on
    978-972 or 978-989 (Portugal), the one English translation on 978-0-7206
    (Peter Owen, UK), and no 978-85 or 978-65 (Brazil) anywhere, which is the
    Lusophone cross-contamination trap. The eleven further ISBNs named in the
    header's exclusion lists also pass, so none is a transcription slip
    dressed as a rejection. Coverage is 9 ISBNs across 7 works, exactly as
    the file's own header states.
  covers: >
    Fetched and looked at all 14 covers plus the portrait. All resolve, all
    are this author's work, none carries a retailer watermark. Eight are
    period title pages that corroborate the file's own claims from the
    artefact: Camões (Paris, Livraria Nacional e Estrangeira, 1825); D.
    Branca (Paris, J. P. Aillaud, MDCCCXXVI, its title page reading "Obra
    posthuma de F. E.", which independently corroborates the publishedAs
    pseudonym); Catão (Londres, S. W. Sustenance, MDCCCXXX); O Alfageme de
    Santarém (Lisboa, Imprensa Nacional, MDCCCXLII, which independently
    corroborates the completeness-auditor's 1842-not-1841 ruling); A Sobrinha
    do Marquez (MDCCCXLVIII); Portugal na Balança da Europa (Londres, S. W.
    Sustenance, 1830); Viagens na Minha Terra (Lisboa, Typographia da Gazeta
    dos Tribunaes, 1846); Folhas Cahidas (Bertrand, 1853). No omnibus slipped
    through - Flores sem Fruto correctly uses the standalone 1874 Imprensa
    Nacional printing rather than the Folhas Caídas bind-up, and Adozinda's
    1904 scan is volume VI of the Obras Completas, a one-work volume rather
    than a bind-up. Every cover URL is /b/id/, so CURATION's ?default=false
    trap does not apply on this wing. The portrait is a 19th-century seated
    lithograph, 538x626, PD-old-100, unwatermarked.
  sanctuaryRule: >
    validate.py's comment-policy scan reports zero hits on this wing, and I
    falsified it before trusting it (see the routed tooling finding). Beyond
    the regex I re-read every comment and every note: in the five content
    files, both overlay directories and the author entity, joining wrapped
    lines to catch what a line scanner cannot - which is how the two "for a
    future pass" phrases and the editions.yaml "a human with a browser" were
    found. Everything else passes: the exclusion notes state what was checked
    and why a slot is empty, which §2 permits, and none names a stage, an
    agent or a reader.
  sources: >
    Link-checked all 82 URLs in the wing's content files. 74 live. Six of the
    eight failures were artefacts of my own extraction stripping a trailing
    ")" or ":" and pass on retest, including the DGE curriculum PDF the whole
    classroom-canon startHere path rests on (live, 821 KB). The remaining
    failures are three infopedia.pt paths, nli.org.il and
    catalog.hathitrust.org, all 403 bot-blocks rather than dead pages - a
    fourth infopedia URL returns 200, so the site is up. No dead citation.
  i18nRegister: >
    Genuine European Portuguese editorial prose, not machine-translated
    English. The tells are lexical and consistent: argumento, realizador,
    banda sonora, bilheteira, prémio, facto, personagens, rapariga - each the
    pt-PT term against its pt-BR counterpart - plus domain vocabulary a
    translator chose rather than a machine ("aio" for Telmo, the word
    Garrett's own text and every school edition use; "domínio filipino" for
    Spanish rule; "publicado em folhetim" for serialisation; "leitura integral
    obrigatória", the DGE's own phrase). Sentences are restructured, not
    word-ordered. Across roughly 25 KB of overlay: one English string, the
    deliberately quoted field label "notable works", and zero Brazilianisms.
  i18nCompleteness: >
    Overlay covers 44 of 44 work synopses with no missing and no extra ids,
    both eras (title, description, themes), both franchise events, the bio and
    all 16 lifeEvents. All five works the completeness audit added late carry
    a pt-PT synopsis, sit correctly inside or outside the eras, and one
    (hino-patriotico) earned its own lifeEvent - so the canonical
    "added late, never annotated" failure did not happen here.
  theme: >
    displayFace instrument-serif and signature beam are both in the app's live
    registries in lib/theme.ts - read the registry, not SCHEMA. All five
    palette keys present. Re-derived the contrast myself: ink/bg 14.92:1,
    ink/surface 13.81:1, muted/bg 5.33:1, muted/surface 4.93:1, accent/surface
    5.06:1. The file claims 4.86 and 5.35 for muted, within rounding, and
    every pair clears AA.
  capabilities: >
    features: {} with everything on auto. Re-derived against
    lib/content/capabilities.ts: river and companion need timeline.length > 0
    (18), wizard needs a startHere path (2), editions needs an edition (12).
    All four activate on real data - no half-empty feature lit by a flag.
  crossLayerSeams: >
    No order predates the works it covers (orders.yaml ships zero; the
    `everything` path uses the derived `default`). No reference survived a
    rename - validate resolves all. Stage order is clean: completeness ran
    second, translation last. One seam held that could have failed:
    world-events' handoff proposed folding its three rejected
    Portugal-specific candidates into the wing's own events.yaml once that
    file existed, and press-archaeology correctly did not, because all three
    are already author lifeEvents and events.yaml is for what happened to the
    books.

curatorsCall:
  - "Whether Proclamações Académicos joins discursos-memorias-e-opusculos-politicos' enumeration (moving that entry's published from 1821 to 1820) or stays out of the wing."
  - "Whether an author wing's globalEvents consideration window should be the author's lifetime or the wing's whole aura span, for wings whose reception history runs long past the death."
  - "Whether editions[].coverUrl should be used to give Frei Luís de Sousa a cover that renders, given the field outranks work.images.cover and the only OpenLibrary asset is a 128 px thumbnail."
