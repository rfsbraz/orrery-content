stage: pipeline-audit
summary: >
  Read-only audit of the run, not the wing. Total across all 15 agent calls:
  2,630,026 tokens, 916 tool calls, ~11.5M ms of agent wall-clock (partly
  parallelized: press-archaeology/world-events/eras ran concurrently, as did
  visual-metadata/editions). Top three stages by tokens (franchise-research
  291,542; wing-audit 269,669; press-archaeology 249,740) account for 810,951
  tokens, 30.8% of the run. No footprint violations found. No duplicated
  settled-fact re-research found. No silent stage skips found - every
  zero-output stage (event-resonance zero candidates, world-events
  defended zero-diff, reading-orders zero orders) left a commit naming the
  zero outcome, which is exactly the recorded-skip shape the skill asks for.
