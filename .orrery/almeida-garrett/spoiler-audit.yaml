stage: spoiler-audit
summary: >
  One load-bearing reveal in this wing: the Act III turn of Frei Luís de Sousa
  (the second marriage retroactively annulled, the daughter left illegitimate,
  and the two deaths that follow). It was stated in the clear in four places -
  the work synopsis, the author bio, an ungated lifeEvent and a franchise
  event - none of which is a field the engine can gate. All four were rewritten
  spoiler-free. The context itself was not deleted: it moved into ONE new
  author lifeEvent gated behind almeida-garrett/frei-luis-de-sousa, which is the
  wing's only spoilerAfter boundary. Viagens na Minha Terra was checked in full
  and needed nothing - its synopsis stops at the frame and the two lovers, well
  short of Frei Dinis's identity, Carlos's ruin and Joaninha's death. No
  existing boundary was loosened (there were none). No prose was deleted
  outright except one editorial flourish on the 1950 film event that could not
  survive without the Act III turn.
boundariesSet:
  - entity: "content/authors/almeida-garrett.yaml"
    id: almeida-garrett-frei-luis-de-sousa-own-household-1843
    spoilerAfter: almeida-garrett/frei-luis-de-sousa
    status: new
    severity: load-bearing
    protects: >
      That the play voids the second marriage retroactively once the first
      husband proves to be alive, and that this leaves the daughter
      illegitimate - which is the third act, and which also resolves the
      second act's open question of whether the pilgrim is genuine.
    anchorReasoning: >
      Anchored on the play itself, because the play is the work whose first
      read the fact ruins. There is no earlier work to anchor on and no series
      to spread it across; a reader who has finished Frei Luís de Sousa has
      earned the reading, and everyone else is shielded.
    whyGatedRatherThanCut: >
      Garrett's own daughter's illegitimacy read against the play's central
      mechanism is the single most-cited fact about this play's genesis, and
      it is exactly the payoff the gate exists to deliver: worth keeping, not
      worth stating in the clear. The biographical half of it (Adelaide's
      death, the baptism as a child of unknown parents, the 1842 legitimation)
      is NOT gated - it stays on the ungated 1841 lifeEvent, since it is
      biography and spoils nothing.
    siblingSweep: >
      Every other string on the author entity was re-read after the boundary
      was set. The ungated 1841 lifeEvent and the bio now say only that the
      loss "and the legal position it left the child in" fed into the play -
      the genesis link survives, the mechanism does not. Confirmed in the app
      that title and description both render INSIDE SpoilerGate on every
      renderer (components/timeline.tsx, components/river.tsx, and the river
      layouts), so a shielded event leaks neither; the shield discloses only
      "Hidden until you finish Frei Luís de Sousa", which is no more than the
      ungated sibling already says.
rewritten:
  - file: content/franchises/almeida-garrett/works.yaml
    entity: almeida-garrett/frei-luis-de-sousa
    field: synopsis
    leaked: >
      Two things. (1) "Directly inspired by the illegitimacy of Garrett's own
      daughter, Maria Adelaide" sat one clause away from the premise, and the
      two together tell a first-time reader that the daughter of this marriage
      ends up illegitimate - the Act III turn, and the answer to the Act II
      question. (2) "until a pilgrim arrives at their door claiming to be him"
      states the Act II arrival.
    nowReads: >
      The premise stops where Porto Editora's own school-edition sinopse stops:
      the second marriage, the daughter, the girl's forebodings and Telmo the
      old retainer still waiting for the first husband. "who did take religious
      vows as Frei Luís de Sousa" was also neutralised to the publisher's own
      flatter phrasing ("took the religious name"), which drops an emphatic
      that nudged the reader toward the ending; the historical man's monastic
      name is the play's title and is jacket copy everywhere, so it stays.
    note: >
      A curator-only `note` was added to this work disarming the retailer-blurb
      landmine for the next enrichment pass (see openQuestions). Verified that
      works[].note renders nowhere in the app before relying on it.
  - file: content/authors/almeida-garrett.yaml
    entity: "bio"
    leaked: >
      "their daughter Maria Adelaide, whose illegitimacy under Portuguese law
      directly inspired Frei Luís de Sousa (1844)" - named illegitimacy as the
      play's subject in ungated prose that renders on the same page as the new
      boundary, which would have defeated it.
    nowReads: >
      "...their daughter Maria Adelaide, who was legitimated the following
      year; the loss, and the legal position it left the child in, fed directly
      into Frei Luís de Sousa (1844)." Keeps the genesis link, states no plot.
  - file: content/authors/almeida-garrett.yaml
    entity: almeida-garrett-adelaide-death-inspires-frei-luis-de-sousa-1841
    field: description
    leaked: >
      A trailing clause describing how the biography is used inside the
      fiction: "a drama built around a marriage that Church law retroactively
      voids and a daughter it renders illegitimate."
    nowReads: >
      Same clause dropped; the event ends at "first read publicly in 1843 and
      published in 1844." The event stays ungated (spoilerAfter: null) - this
      is the skill's own preferred shape, drop the clause and ungate, so the
      biography still reaches every reader.
  - file: content/franchises/almeida-garrett/events.yaml
    entity: almeida-garrett-frei-luis-de-sousa-film-1950
    field: description
    leaked: >
      The same Act III statement, restated verbatim in a franchise event: "the
      Estado Novo's own cultural apparatus embracing a text built around a
      marriage a church retroactively annuls and a daughter it renders
      illegitimate." A publication/adaptation event must not carry a
      spoilerAfter, so the only remedy was the words.
    nowReads: >
      "...the Estado Novo's own propaganda and culture body putting its annual
      award behind the first film made of the play." The irony of the state
      prize survives; the plot does not. This is the one place where an
      editorial flourish was genuinely lost rather than reworded.
checkedNotSpoilers:
  - entity: almeida-garrett/viagens-na-minha-terra
    ruling: >
      Left alone. The synopsis gives the frame (a Lisbon-to-Santarém journey
      opening onto the Carlos/Joaninha story) and stops there. The novel's real
      reveals - Frei Dinis turning out to be Carlos's father, Carlos's
      abandonment and moral collapse, Joaninha's death - are stated nowhere in
      the wing, and the frame itself is the first line of the book's own
      Portuguese Wikipedia article and every blurb. The wing's era prose
      ("taken as the first modern Portuguese prose narrative") is a critical
      judgement, not plot.
  - entity: "almeida-garrett/frei-luis-de-sousa - the title and the historical Manuel de Sousa Coutinho"
    ruling: >
      Kept. That the historical Manuel de Sousa Coutinho took the name Frei
      Luís de Sousa is the play's own title and is the entirety of Porto
      Editora's sinopse. Hiding it would shield what is printed on the cover.
  - entity: "startHere path classroom-canon (base + pt-PT overlay)"
    ruling: >
      Kept unchanged, both languages. "A short domestic tragedy and a light,
      digressive travel-novel" is genre, and the play is sold as a "drama
      trágico" with a "desenlace catastrófico" by its own publisher. No path
      prose names an outcome. Neither path carries a `note` (which, unlike a
      work's `note`, DOES render - see openQuestions).
  - entity: "orders.yaml"
    ruling: >
      Nothing to audit. The file ships zero orders and no rationale/debated
      prose; its header argues only about series structure, never about plot.
  - entity: "eras.yaml (os-anos-de-formacao, a-fase-da-maturidade)"
    ruling: >
      Left alone. Both descriptions list works and critical periodisation and
      resolve nothing. No era names an ending.
  - entity: "content/events/global.yaml"
    ruling: >
      Swept, nothing applicable. Its earliest entry is 1870, sixteen years
      after Garrett's death, so no global event can land inside the timeframe
      of a Garrett work and spoil its frame.
  - entity: "almeida-garrett-quem-es-tu-film-2001"
    ruling: >
      Left alone. Describes the 2001 adaptation's look and its classroom
      purpose; states no plot. The film's title is its title.
  - entity: "pseudonyms[].note x3 (F. E., Múcio Cévola, Josino Duriense)"
    ruling: >
      Checked because these DO render (components/about-the-author.tsx). All
      three are attribution and publication history, no plot.
  - entity: "sources: across the wing"
    ruling: >
      Swept. Every source is a bare URL - Wikipedia, purl.pt, Infopédia,
      Porto Editora, RTP, the Panteão Nacional - with no inline description,
      so no source line describes what it links to. The Portuguese Wikipedia
      article for the play does carry a full plot summary, but a bare link to
      a work's own encyclopaedia article is the same exposure as searching for
      the title, and is standard across the catalogue.
  - entity: "biographical direction (a synopsis spoiling the bio)"
    ruling: >
      Checked in both directions per the brief and found nothing to fix. Folhas
      Caídas and Cartas de Amor à Viscondessa da Luz both name Rosa de Montúfar
      as the late-life companion, matching the bio and the 1851 lifeEvent - and
      that is dedication-page material printed in the books themselves. Note
      that the engine has no lever in this direction anyway: only events and
      lifeEvents carry spoilerAfter, so a biography can be gated behind a work
      but never the reverse.
guardsVerified:
  - "Broke both spoiler guards on purpose before trusting them. (1) spoilerAfter on a work synopsis (almeida-garrett/viagens-na-minha-terra) -> validate.py hard-errors 'not honoured by the app here (only events and author lifeEvents support it)'. (2) spoilerAfter pointing at a non-existent work id -> hard-errors 'is not a known work'. Both restored; the boundary set by this stage resolves."
  - "Read lib/spoilers/index.ts and components/spoilers/spoiler-gate.tsx in the app rather than trusting the skill's field table: confirmed only events and lifeEvents gate, and confirmed the gate wraps title AND description on every renderer."
publisherTest:
  - source: "Porto Editora, Frei Luís de Sousa, ficha 4299483 (the standard school edition)"
    copy: >
      Its entire SINOPSE is the 1843/1844 dates, "o enredo, inspirado na vida do
      escritor seiscentista Frei Luís de Sousa, de seu nome secular D. Manuel de
      Sousa Coutinho, tem como pano de fundo a resistência à dominação
      filipina", and Garrett's own "Ao Conservatório Real". No plot at all.
  - source: "Porto Editora / WOOK, Edição Didática 10916349"
    copy: >
      Goes as far as: D. João given up for dead at Alcácer Quibir, seven years
      pass, Madalena marries Manuel, daughter Maria, a virtuous and happy home
      "só perturbada pelos tristes pressentimentos da frágil e sensível Maria e
      de Telmo, o velho aio, que continua à espera do regresso de D. João." It
      stops there. This is the line the rewritten synopsis now matches.
  - source: "Levoir 2025 illustrated edition, ISBN 9789896829353, sinopse on wook.pt"
    copy: >
      Goes all the way: "Este aparece, disfarçado de romeiro, e dá a conhecer a
      sua verdadeira identidade. o desfecho é trágico: Maria morre na igreja, no
      preciso momento em que os seus pais professam." Overturned nothing here
      (the reveal is still absent from the school edition most first-time
      readers buy), but it is the reason a `note` now guards this synopsis.
i18n: >
  Nothing to mirror. This wing's only pt-PT overlay is
  content/i18n/pt-PT/franchises/almeida-garrett/franchise.yaml (startHere paths
  only), and no string in it was touched - all four rewrites are in works.yaml,
  events.yaml and the author entity, none of which has an overlay yet. This is
  the whole point of running spoiler-audit before translation: the leak was
  removed before any locale copied it. i18n_coverage.py delta for the wing:
  authors/almeida-garrett.yaml 31 -> 33 untranslated strings (the new gated
  lifeEvent's title and description); works.yaml 44, eras.yaml 6, events.yaml 4
  and franchise.yaml 4/5 all unchanged.
validate: "1 error - almeida-garrett/theme.yaml has no `art:` block, the expected pre-visual-language state. 15 warnings, all pre-existing (14 posthumous works outside every era, deliberate per eras.yaml's own header; 1 handoff word-count warning on world-events.yaml)."
forStages:
  translation: >
    Translate the new gated lifeEvent
    (almeida-garrett-frei-luis-de-sousa-own-household-1843) like any other
    prose - spoilerAfter is structure, not prose, and needs no overlay. Do NOT
    re-import a synopsis for Frei Luís de Sousa from a Portuguese retailer
    page while translating: the pt-PT blurbs are the ones that give the ending
    away (see publisherTest).
  visual-language: >
    Unaffected. theme.yaml's missing art: block remains the sole expected
    validate.py error. If an era plate or event sketch is ever briefed for
    Frei Luís de Sousa, brief the house and the waiting, never the pilgrim's
    identity or the third act.
  editions: >
    Unaffected, but the same warning applies: the Levoir 2025 edition
    (9789896829353) is a legitimate edition candidate whose retailer copy
    is a spoiler; take the ISBN, not the sinopse.
openQuestions:
  - >
    Loosenable, and flagged as such deliberately: the synopsis of Frei Luís de
    Sousa no longer states that the pilgrim arrives. That is the Act II
    curtain, it is absent from Porto Editora's own copy, and the rewritten
    premise (Telmo still waiting) carries the same tension without resolving
    it - but a current Portuguese publisher does print it, so a curator who
    judges the arrival to be premise rather than turn can put it back without
    re-opening anything else in this audit. The annulment, the illegitimacy
    and the deaths should not go back into ungated prose.
  - >
    The skill states that `note` is curator-only and never rendered. That is
    true of a work's `note` (verified: nothing in the app reads it) but NOT of
    `pseudonyms[].note`, which renders in components/about-the-author.tsx, or
    of a startHere path's `note`, which renders in
    components/wizard/start-wizard.tsx. Neither carries plot on this wing, but
    the skill's blanket claim is too broad and should be narrowed.
  - >
    Outside this stage's footprint, noticed while reading: the synopsis
    previously opened "Twelve years after her first husband is believed to
    have died" while Porto Editora's own copy says seven years between the
    presumed death and the remarriage. The rewrite says "years after" rather
    than pick a number that no checked source supports; a bibliography pass
    should settle the interval against the text.
  - >
    Also outside footprint: franchise.yaml's capabilities comment describes
    "an 8-lifeEvent author entity"; the author file carries 16 after this pass
    (15 before). Stale comment, not a spoiler.
