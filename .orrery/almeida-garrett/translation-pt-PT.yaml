stage: translation-pt-PT
summary: >
  Full pt-PT coverage for the almeida-garrett wing: 44 work synopses, both
  eras (title/description/themes), both franchise events (title/description),
  the author bio, all 16 lifeEvents (title/description, including the one
  gated lifeEvent) and franchise.yaml's description. franchise.yaml's
  startHere paths already had a pt-PT overlay from the reading-orders stage
  and were left untouched; only description was added to that file. Almost
  the entire base catalogue for this author is itself already in Portuguese
  (titles, era names, quoted primary sources), so the actual work was
  translating the editorial English prose around it, not titles - and
  leaving every already-Portuguese title, era name and quoted primary source
  to carry through unchanged rather than double-translating it.
