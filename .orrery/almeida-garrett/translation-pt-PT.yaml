titlesLeftInBase: >
  Every work title, both era titles, and every quoted primary source
  (Garrett's own "Nasci no Porto, mas criei-me em Gaia", Buescu's "os anos de
  formação", Santana's "a fase da maturidade", the Biblioteca Nacional's "A
  literatura ganhou com este ócio involuntário", Eça de Queirós's
  "reaportuguesar Portugal") were already Portuguese in the base file and
  are reproduced unchanged - none is a translated title in the sense
  SCHEMA.md's translation rules forbid (no edition exists to publish a
  translated title against; these are the author's own original-language
  text, not a translation candidate at all).
registerCalls:
  - >
    almeida-garrett-born-1799 (author lifeEvent): base description glosses
    Garrett's own Portuguese quote with a parenthetical English translation.
    Dropped rather than translated back, since a pt-PT reader needs no gloss
    of an already-Portuguese quote sitting right next to it - the one place
    this overlay is intentionally shorter than a literal field rendering.
  - >
    frei-luis-de-sousa (synopsis + both lifeEvents) keeps "rapariga" for
    "the girl" - neutral and ordinary in Portugal per the translation
    skill's own discriminator table, not the Brazilian sense; deliberate.
  - >
    romanceiro-e-cancioneiro-geral (synopsis): base prose explains its own
    `format: reference` schema tag to the reader. Translated literally,
    field name and file reference kept as code tokens, matching the base.
  - >
    "estante" (bookshelf) reused for two unrelated shelf-metaphor spots -
    franchise.yaml's existing pt-PT startHere prose and the new Teófilo
    Braga 1904 lifeEvent title - so the wing stays consistent on that image.
spoilerHandling: >
  The gated lifeEvent (almeida-garrett-frei-luis-de-sousa-own-household-1843,
  spoilerAfter: almeida-garrett/frei-luis-de-sousa) was translated like any
  other prose - spoilerAfter is structure and needs no overlay entry of its
  own, only the title/description fields do. Did not re-import a Portuguese
  retailer synopsis for Frei Luís de Sousa while translating: the work
  synopsis and both lifeEvents stop at the same point the base (post
  spoiler-audit) does - the second marriage, the daughter, the forebodings,
  Telmo still waiting - never the pilgrim's identity, the annulment or the
  deaths, matching spoiler-audit.yaml's own publisherTest warning that
  current Portuguese retailer copy for this play does give the ending away.
validate: >
  0 errors both before and after this run's own comment fix. First pass
  added a warning on this stage's own works.yaml overlay comment
  ("reads as pipeline narration ('spoiler-audit')" - the comment named the
  spoiler-audit stage instead of just stating the resulting fact); reworded
  to state the revelation boundary directly (stops at the school-edition
  synopsis, names neither the pilgrim's identity nor the third act) with no
  process reference, and the warning cleared. Final state: 17 warnings, all
  pre-existing and unrelated to this stage (14 posthumous-works-outside-era,
