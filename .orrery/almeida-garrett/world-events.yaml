stage: world-events
summary: >
  Defended zero-diff. content/events/global.yaml is unchanged - no entry
  added for Garrett's 1799-1854 span, despite every decade of his life
  being empty in the shared timeline (1580s-1860s are all empty except one
  entry each in the 1870s and 1880s; catalogue span 1585-2027, 22 global
  events, budget headroom everywhere in this range). The trigger
  (franchise-research's own note that Garrett fought in the Liberal Wars,
  "a strong candidate if global.yaml lacks it") does not survive the
  skill's actual admission test once checked mechanically rather than by
  intuition.
produced:
  addedEvents: []
  regradedEvents: []
  candidatesConsidered:
    - candidate: "Napoleonic invasions of Portugal (1807-1811), which Garrett's family fled to the Azores over in 1809"
      verdict: rejected
      reasoning: >
        Mechanical eligibility check (parse born/died across every
        content/authors/*.yaml, count who spans the event year): dated to
        1809 (the second French invasion, the one the author file's own
        bio ties to the family's flight), the only author whose lifetime
        spans it at all is Garrett himself (born 1799) plus, marginally,
        Edgar Allan Poe (born 1809-01-19, i.e. only if the event postdates
        19 January). No other author in the catalogue was alive in this
        window. Even granting Poe the technical overlap, he has no
        biographical or literary connection to a Portuguese war he was
        born into on a different continent - the "three franchises whose
        reading it changes" test fails outright; this is a one-wing event
        wearing global scope. It belongs in almeida-garrett's own
        (not-yet-created) franchise events.yaml, not here.
    - candidate: "The 1820 Liberal Revolution / rise of Portuguese constitutionalism"
      verdict: rejected
      reasoning: >
        Same failure mode as the invasions: purely Portugal-specific, no
        other catalogue author's lifetime meaningfully engages with it
        (the nearest is Ramalho Ortigão, born 1836, sixteen years later).
        Franchise-scoped, not global.
    - candidate: "Portuguese Civil War / Liberal Wars (1828-1834), which Garrett fought in as a volunteer alongside Alexandre Herculano"
      verdict: rejected
      reasoning: >
        Already the strongest lifeEvent on Garrett's own author file
        (almeida-garrett-liberal-wars-soldier-1832, impact: high). Checked
        the same way: no other author in the catalogue has any
        biographical or literary tie to this specific Portuguese civil
        conflict. This is exactly the kind of "rupture one author wrote
        directly about" the skill says belongs in that franchise's own
        events.yaml, sharper and safely higher-impact there than diluted
        into global scope where it would render (meaninglessly) on every
        other wing's timeline too.
    - candidate: "The rise of European literary Romanticism as a movement"
      verdict: rejected
      reasoning: >
        Widened the eligibility check past Garrett alone: authors whose
        lifetimes overlap any part of 1799-1854 are Garrett (1799-1854),
        Edgar Allan Poe (1809-1849), Anna Sewell (1820-1878), Ramalho
        Ortigão (1836-1915) and Eça de Queirós (1845-1900, an infant for
        the relevant years) - five names, the widest this span gets. Of
        those, only Poe has real thematic resonance with Romanticism
        (American Gothic/Romanticism is a recognised sibling movement);
        Sewell's Black Beauty (1877) is Victorian moral realism with no
        Romantic descent, and Ortigão/Eça de Queirós are Geração de 70
        realists explicitly reacting AGAINST Romantic excess - their own
        wings are more likely to eventually carry "the end of
        Romanticism," not this. That leaves two franchises with genuine
        resonance (Garrett, Poe), short of the skill's "name three
        franchises" bar, and the candidate has no single defensible date -
        it is a decades-long movement, not a discrete happening, which the
        two-tests framing (narrative test wants a moment a reader crosses)
        does not fit well either.
  eligibilityMethod: >
    Parsed born/died from every content/authors/*.yaml (grep, ~180 files)
    rather than trusting intuition about "who else was alive then," per
    the skill's explicit instruction. Confirmed only five authors in the
    whole catalogue have any lifetime overlap with 1799-1854 at all:
    Almeida Garrett, Edgar Allan Poe, Anna Sewell, Ramalho Ortigão, Eça de
    Queirós. Every other author in the catalogue (contemporary
    thriller/fantasy/crime writers, mostly born after 1900) is categorically
    ineligible for any event dated in this span - the engine's lifetime
    filter means such an event would render on at most two or three pages
    no matter how it is worded, which caps how "global" anything here can
    honestly be.
  densityBaseline: >
    python scripts/event_density.py (catalogue-wide, unchanged by this
    stage): 22 global events, span 1585-2027, impact mix 2 high / 14 med /
    6 low (2 of ~17 high-budget slots used). Every decade from the 1580s
    through the 1860s is empty except one entry each in the 1870s
    (elementary-education-act-1870) and 1880s (berne-convention-1886) -
    Garrett's entire lifespan (1790s-1850s) has zero global texture, and
    stays that way after this stage: the gap is real, but nothing found
    clears the bar to fill it honestly.
forStages:
  eras: "Unaffected - this stage made no changes to any shared file."
  franchise-events (future, not yet a stage that has run): >
    The three Portugal-specific rejected candidates above (Napoleonic
    invasions 1809, Liberal Revolution 1820, Liberal Wars 1828-1834) are
    strong, already-sourced candidates for almeida-garrett's own
    events.yaml once that file exists - each has primary-quality sourcing
    already sitting in content/authors/almeida-garrett.yaml's lifeEvents
    and needs no new research, only a franchise-scope rewrite.
