stage: visual-metadata
summary: >
  Both gates now shut: portrait 1/1, covers 10/10. Verified every image
  already staged in the working tree rather than trusting it - fetched all
  12 URLs (portrait, header, 10 covers) with ?default=false where
  applicable, confirmed each resolves to a real, non-placeholder image, read
  every Commons licence from its own extmetadata rather than the credit
  text's say-so, and resolved every work id against Open Library's
  editions.json to confirm it names the right record (no omnibus, no
  translation, no wrong-author collision). Built a contact sheet of all 10
  covers and viewed each at full size: no retailer watermarks, no library
  stickers, no barcodes. Portrait (Dan Brown at the National Library of the
  Czech Republic, Sept 2025) and header (Harvard's Widener Library) both
  check out: portrait's CC BY-SA 4.0 / Zuzana Homolka Fedorová credit and
  header's CC BY-SA 2.0 / Tony Webster credit both match the Commons API's
  extmetadata exactly, and both thumbnail URLs match the API's own
  `thumburl` for iiurlwidth=1920 verbatim (not hand-built). All 10 covers
  resolve to their stated Open Library work, confirmed by title match and,
  for the two ISBN-keyed picks (inferno, the-secret-of-secrets), by the
  ISBN edition record itself: cover 9322678 traces to ISBN 9781400079155
  (Anchor Books 2014 Inferno reprint, avoiding the work's own representative
  cover's Sausalito library sticker); cover 15164648 traces to ISBN
  9780385546928 (Doubleday, The Secret of Secrets, avoiding the work's
  Spanish-language representative cover); cover 7002975 traces to the 1995
  first edition of 187 Men to Avoid under the "Danielle Brown" byline
  (confirmed against the edition's own by_statement field), not the 2006
  reissue. No rejected candidates from this pass - the prior pass's
  selections were already correct on inspection, nothing needed replacing.
  validate.py --slug dan-brown: 0 errors, 4 pre-existing handoff-length
  warnings from earlier stages (none from this one). asset_audit.py
  dan-brown confirms art:yes, portrait 1/1, covers 10/10.
produced:
