  - https://www.goodreads.com/questions/1214437-do-i-need-to-read-angel-and-demons-first

sourcesRefused:
  - "quora.com: 403 on every fetch attempt; used only via WebSearch's own
     snippets, which corroborate the Goodreads threads rather than add new
     information - nothing here rests on Quora alone."
  - "upjourney.com/best-dan-brown-books: fetched twice; the article body
     never rendered (only sitewide nav came through), so a claim an earlier
     web-search summary attributed to it could not be verified and was
     dropped."
  - "goodnovel.com/qa/best-book-dan-brown-read-first: read, but its 'user
     answers' read as templated content-farm copy, not a genuine community
     record. Not cited."

forStages:
  spoiler-audit: >
    One order (robert-langdon-in-order, matches publication order exactly,
    no reshuffle to check) and three startHere paths, one of which
    (start-with-the-da-vinci-code) is the real edge case: it sends a
    newcomer into book 2 before book 1. Checked, low-risk not zero: The Da
    Vinci Code's "had last seen Vittoria a year previously" confirms Angels
    & Demons' co-lead survives and stays connected to Langdon - named
    obliquely (not explicitly) in that path's `note`. Re-read both new
    startHere paths as an anonymous newcomer per SS7 before signing off;
    they were written for that, but a second read is this stage's job.
  translation: >
    No pt-PT overlay exists anywhere in this wing yet (confirmed by checking
    content/i18n/pt-PT/franchises/ - dan-brown is absent entirely). Per
    SS11, an overlay is added in the same commit only when one already
    exists to sync; since none does, and `/author`'s stage order runs
    translation after reading-orders, nothing was created here. Owes prose
    overlays for orders.yaml (name/rationale) and franchise.yaml's
    startHere (title/description/note x3) plus the franchise description
    change, alongside the rest of this untranslated wing.
  wing-audit: >
    Both artefacts are new; SS12's decay checks apply from the next
    work-list or order change forward. One order, three paths is sparse but
    not underbuilt for a 10-work, single-series shelf (compare
    jose-rodrigues-dos-santos: 34 works, 5 orders; joao-tordo: 26 works, 1
    order) - the honest count is small because the shelf is small.

openQuestions:
  - "Wild Symphony has no citable 'start here' advice - worth reopening only
     if a source ever pairs it with an entry-point recommendation rather
     than just an age range."
  - "The Da Vinci Code vs Angels & Demons debate is genuinely unsettled in
     the sources read - recorded as a feature of the two paths, not a gap.
     A future authoritative single source (an author interview, a
     definitive reading-order piece from a major outlet) could tip one path
     to primary; nothing found here does."
  - "upjourney.com's ranked list could not be verified against its own page
     text (fetch tooling returned only site navigation) - flagged rather
     than silently dropped in case different tooling renders it and finds
     real content worth citing."
