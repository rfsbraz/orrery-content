stage: reading-orders
summary: >
  One order shipped (dan-brown/robert-langdon-in-order, the six-novel
  flagship series pulled out as its own thread) and three startHere paths
  (everything-in-order, start-with-the-da-vinci-code,
  start-with-langdon-from-the-start). Three candidates rejected as coined: a
  hand-written completionist publication order (that IS the derived
  default), a "for completionists" grouping of Digital
  Fortress/Deception Point/187 Men to Avoid (no source connects them - only
  retail box sets, not reading-order evidence), and a startHere path for
  Wild Symphony (no citable "start Dan Brown here" advice, only age-range
  guidance). validate.py --slug dan-brown: 0 errors from this stage's files;
  the one pre-existing error is theme.yaml's missing art block
  (visual-language hasn't run), the one pre-existing warning is eras.yaml's
  own length.

produced:
  filesWritten:
    - content/franchises/dan-brown/orders.yaml (new)
    - content/franchises/dan-brown/franchise.yaml (startHere block added)
  filesNotTouched:
    - content/franchises/dan-brown/works.yaml
    - content/franchises/dan-brown/eras.yaml
    - content/franchises/dan-brown/theme.yaml
    - content/authors/dan-brown.yaml
  ordersAdded:
    - id: dan-brown/robert-langdon-in-order
      type: curated
      works: "6 (angels-demons -> the-secret-of-secrets)"
  pathsAdded:
    - "everything-in-order (orderId default)"
    - "start-with-the-da-vinci-code (workIds: [the-da-vinci-code])"
    - "start-with-langdon-from-the-start (orderId: dan-brown/robert-langdon-in-order)"

verdicts:
  - candidate: "The Robert Langdon series alone, publication order"
    verdict: SHIPPED as an order (curated)
    evidence: >
      Verified independently, not trusted from the prior stage's self-report:
      danbrown.com/books/ groups all six under "Robert Langdon Series" in
      publication order; Wikipedia infoboxes for Inferno ("Robert Langdon
      #4") and The Secret of Secrets ("Robert Langdon #6") fetched directly
      confirm the numbering tracks publication throughout; the Robert
      Langdon Wikipedia article states "in the books, the events of The Da
      Vinci Code follow those of Angels & Demons" (only the films reverse
      it). No chronology-vs-publication mismatch anywhere.
    costNamed: "Skips Digital Fortress, Deception Point and Wild Symphony."

  - candidate: "A recommended entry point: The Da Vinci Code vs Angels & Demons"
    verdict: SHIPPED as two competing startHere paths, deliberately not resolved to one winner
    sourcing: >
      Genuinely split, real debate, not picked by feel. For The Da Vinci
      Code: a 304-comment Goodreads thread (topic/show/712143) splits
      readers roughly down the middle, several favoring its writing/story;
      the pinned Goodreads Q&A (questions/178301, dozens of real answers)
      settles on "not necessary, no" to read Angels & Demons first. For
      Angels & Demons: gobookseries.com's own "Best Starting Point... Start
      with: Angels & Demons" call, and danbrown.com's own listing opening on
      it. Neither side is one blog post.
    spoilerCheck: >
      Checked both directions per SS5 even though neither book is a prequel.
      Da-Vinci-Code-first: the Robert Langdon Wikipedia article confirms it
      "only makes a few minor references" to Angels & Demons - it notes
      Langdon "had last seen Vittoria a year previously," a real but minor
      spoiler (confirms she survives and stays connected to Langdon). Named
      obliquely in the path's `note` per SS7 ("read differently... afterward"
      - no reveal stated). No larger plot element (Illuminati, antimatter,
      resolution) referenced. Publication-order-first: checked works.yaml's
      notes for all four later Langdon novels - none reference Angels &
      Demons' plot or characters. No risk found in that direction.

  - candidate: "Digital Fortress / Deception Point / 187 Men to Avoid as a completionist grouping"
    verdict: REJECTED as coined
    reason: >
      works.yaml's own header confirms none of the three share a character,
      thread or throughline with each other or the Langdon series. No
      documented "read these together" practice found - only retail box
      sets (commerce bundling, not reading-order evidence, per this skill's
      own translation-sequence precedent). No actionable reason a reader
      could act on. Default order already carries all three correctly.

  - candidate: "Full publication order for completionists"
    verdict: NOT NEEDED (confirmed, not built - it is the derived default)

  - candidate: "Wild Symphony - its own startHere path"
    verdict: REJECTED as coined, logged in openQuestions
    reason: >
      Searched specifically for entry-path advice naming Wild Symphony as a
      door into Dan Brown's work. Found only age-range shelving data (3-7,
      preschool-grade 2) and general reviews, not "start here" advice.
      gobookseries.com lists it as the sole entry in its own trivial
      one-book "Picture Books" category, not curated guidance. Sits in the
      default order uneventfully.

