sourcesRefused:
  - "britannica.com: HTTP 403 to non-browser clients and to WebFetch. Read
     through its web.archive.org copy, which is what the file cites."
  - "washingtonpost.com: the 2006 'The Da Vinci Clones' piece times out on
     every attempt. Dropped rather than cited from a search snippet - see
     openQuestions."

forStages:
  event-resonance: >
    eras.yaml is empty by decision, so nothing in it constrains an event's
    placement and no eraStart is ever set for this wing. Two consequences
    worth taking on board. First, the 2003 breakout is now doing the whole
    job of marking the career's one real hinge: it is the only place a reader
    meets that turn, so it deserves the weight it would otherwise share with
    an era plate. The strongest framing for it is not "he got famous" but the
    retroactive one - Britannica's "in 2004 all four of his novels appeared
    simultaneously on The New York Times best-seller lists" - because that is
    the fact that makes the split a moment rather than a period. Second, the
    American Affairs essay (Shullenberger, 2022) is a rich, citable career
    reading that could not become eras but reads well as events or as
    per-work context: the post-Cold-War techno-thriller framing of Digital
    Fortress and Deception Point, the 2003 novel's timing against the Boston
    Globe's Catholic abuse reporting and the New Atheism wave that followed
    it, and the Silicon-Valley transhumanism running through Inferno (2013)
    and Origin (2017). Do not let any of those become an implied
    periodisation in the aura either; they are readings of individual books.
  reading-orders: >
    No era boundaries exist to align an order against, and nothing in this
    stage disturbs the single-series structure both earlier stages found.
    One finding is directly yours: the Robert Langdon series was rejected as
    an era specifically because it is not contiguous in time - Deception
    Point (2001) sits between Angels & Demons (2000) and The Da Vinci Code
    (2003), and Wild Symphony (2020) sits inside the later run. That is an
    argument for the series being a reading structure rather than a
    chronology, which is orders.yaml's business, and it means a
    publication-order sweep of the whole shelf and a Langdon-only order are
    genuinely different orders here, not two spellings of one.
  visual-language: >
    No era plates to design for: the wing needs no chapter-gate art. Every
    generated asset budgeted for eras is free for elsewhere.
  wing-audit: >
    "Era coverage gaps" is not a finding on this wing. All ten works sit
    outside every era by decision, and validate.py raises no orphan warnings
    because the coverage check skips a wing with no spans. Closing that
    "gap" would mean inventing a periodisation the record does not contain.

openQuestions:
  - "The Washington Post's 2006 'The Da Vinci Clones' piece names the wave of
     religious-conspiracy thrillers that followed. It is a received term and
     it periodises other writers' publishing, not Brown's own work, so it was
     not a candidate era in any case - but the page times out on every fetch,
     so the term is recorded here as unread rather than cited anywhere."
  - "Lisa Rogak's 'Dan Brown: The Unauthorized Biography' (St. Martin's,
     2013) is the one full-length biography and its internal chapter
     structure could not be inspected without the book. A biography's own
     chapter divisions are the sort of thing that could carry a periodisation
     if one exists; nothing in the reachable reviews or publisher copy
     suggests it names phases, but this is an unopened door rather than a
     checked-and-empty one."
  - "Brown is 62 and still publishing, with a seventh Langdon novel plausible.
     A career-closing retrospective is the document most likely to periodise
     him, and it does not exist yet. If one is ever written, this file's
     conclusion is the thing it would overturn."
  - "No academic monograph on Brown's career as a whole was found - the
     scholarship reached is all single-novel work on The Da Vinci Code
     (religion, conspiracy, feminist readings). Databases behind
     institutional logins were not searched, so 'no career-level scholarship'
     is a statement about the open web."
