stage: eras
summary: >
  Ruled explicitly on the open question franchise-research and
  completeness-auditor both left standing: the Dan Brown wing ships
  `eras: []`. No author framing, no critical or reference periodisation, no
  settled fandom scheme, and the one publishing-record fact that exists
  (the 2003 move to Doubleday) fails the fit test. The obvious-looking
  pre/post-breakout split is a real, numerable commercial fact and is not a
  periodisation of the work, because the "pre-breakout" books became
  bestsellers themselves in 2004. That fact belongs to the aura as the
  already-scaffolded 2003 life event, not to a full-bleed era plate. Searched
  in English only, correctly: Brown is an American writing in English and the
  entire reference, review and career-essay corpus about him is anglophone.
  validate.py --slug dan-brown is unchanged from the baseline - the same
  single pre-existing error (theme.yaml has no `art:` block, visual-language's
  scope) and zero warnings. An empty eras.yaml raises no orphan warnings: the
  coverage check skips a wing with no spans.
produced:
  eras: []
  filesWritten:
    - content/franchises/dan-brown/eras.yaml
  filesNotTouched:
    - content/franchises/dan-brown/works.yaml
    - content/franchises/dan-brown/franchise.yaml
    - content/franchises/dan-brown/theme.yaml
    - content/authors/dan-brown.yaml

verdicts:
  - candidate: "Pre-breakout (1995-2001) vs. post-breakout (2003-2025)"
    verdict: INVENTED
    rung: "would be rung 5 (ours) dressed as rung 2"
    labelVerdict: >
      No source names either half. "Pre-breakout" and "post-breakout" are
      descriptions of a sales tier, not received period names.
    boundaryVerdict: >
      The 2003 boundary is real as an event and false as a period edge. The
      three earlier novels crossed it retroactively: Britannica records that
      The Da Vinci Code "sparked sales of Brown's earlier works; in 2004 all
      four of his novels appeared simultaneously on The New York Times
      best-seller lists", and Boston magazine (2009) calls them "the nearly
      forgotten Dan Brown tomes that had sold at a dizzying clip after The Da
      Vinci Code was released". A plate over 1998-2001 would announce
      "modest sellers" over three bestsellers.
    numbers: >
      Verified rather than gestured at: "fewer than 10,000 copies in each of
      their first printings" for the first three novels; The Da Vinci Code
      top of the New York Times list in its first week (2003) and 81 million
      copies sold by 2009; Doubleday's own first-anniversary claim of "the
      bestselling adult novel of all time within a one-year period" with
      nearly seven million copies in print by then.
    recommendation: >
      Not an era. Already correctly carried as the life event
      db-da-vinci-code-breaks-out-2003 on content/authors/dan-brown.yaml.

  - candidate: "A thematic scheme (codes -> religion/institutions -> science ethics)"
    verdict: INVENTED as a span
    rung: "rung 2 material that will not convert to years"
    labelVerdict: >
      One named critic groups the novels, in descriptive rather than received
      terms: Geoff Shullenberger, "Mythology of the Deep State: The Novels of
      Dan Brown" (American Affairs, Winter 2022) writes of "his early
      techno-thrillers", "his mid-period novels, particularly The Da Vinci
      Code and The Lost Symbol", and "Brown's novels of the 2010s". No second
      independent source uses any of those as a term, so this is one essay's
      scaffolding, not a received periodisation.
    boundaryVerdict: >
      Fatal independently of the label. The essay's early group is
      non-contiguous: it calls Deception Point (2001) the "successor" to
      "his debut, Digital Fortress" (1998), passing over Angels & Demons
      (2000), which sits between them in time and belongs to the later,
      religious group. Era membership is computed from the publication year
      (validate.py era_span, mirroring the app), so a thematic set with a
      hole in the middle cannot be expressed at all.
    recommendation: >
      Not an era. The essay is excellent material for event-resonance and for
      per-work notes, not for a plate.

  - candidate: "The Doubleday novels (2003-2025)"
    verdict: REAL FACT, BAD FIT
    rung: 4 (publishing-historical)
    labelVerdict: >
      The bibliographic fact is solid and sourced: Digital Fortress was St.
      Martin's Press (1998), Angels & Demons and Deception Point were Pocket
      Books (2000, 2001), and every adult novel from The Da Vinci Code (2003)
      to The Secret of Secrets (2025) is Doubleday. No source calls this a
      period of his career, but rung 4 does not require that.
    boundaryVerdict: >
      Fails the rung-4 fit trap twice. The years before 2003 are two
      publishers, not one, so there is no counterpart period to name. And a
      2003-2025 span would by year also cover Wild Symphony (2020), a Rodale
      Kids / Random House Children's Books picture book Doubleday did not
      publish - the plate would name a publisher over a book that publisher
      did not publish. The boundary also lands exactly on the breakout, so it
      would assert in bibliographic dress the sales verdict rejected above.
    recommendation: >
      Not an era. Genuine editions.yaml material.

  - candidate: "The Robert Langdon novels (2000-2025)"
    verdict: REAL SHAPE, WRONG LAYER
    rung: 4 (publishing-historical)
    labelVerdict: >
      The series is real, named by the author's own site ("Robert Langdon
      Series") and numbered #1-#6 by ISFDB. The tana-french wing sets the
      precedent for a series-as-era on exactly this footing.
    boundaryVerdict: >
      The precedent does not transfer, because this series is not contiguous.
      A 2000-2025 span swallows Deception Point (2001), a standalone with no
      Langdon in it, and Wild Symphony (2020). Tana French's Dublin Murder
      Squad span had no intruders inside it; this one has two.
    recommendation: >
      Not an era. It is a reading structure and belongs to orders.yaml.

  - candidate: "A fandom-named period (a 'decline', a 'slog' equivalent)"
    verdict: DOES NOT EXIST
    rung: 3 (fandom) - checked and empty
    labelVerdict: >
      Reader argument about whether the later novels fell off is real and
      diffuse. It carries no name, no agreed boundary work and no year, and
      every use is someone proposing it. It is also a live critical dispute
      about quality, which this catalogue reports rather than joins.
    boundaryVerdict: "No boundary is even proposed consistently."
    recommendation: "Nothing to ship."

