stage: spoiler-audit
franchise: dan-brown
status: complete
commit: f085101

summary: >
  Two real spoilers, both ungated prose, both the same fact: The Da Vinci
  Code's central historical revelation, stated in the Baigent/Leigh lawsuit
  event and again in the 1997 marriage lifeEvent. Both rewritten to stop
  where the publisher's copy stops (danbrown.com names what the Priory
  guards only as "a vastly important religious relic" and "a stunning
  historical truth"); neither needed a gate, so the wing ships with zero
  spoilerAfter boundaries. Two smaller fixes: the birth lifeEvent called
  Sophie Neveu Sauniere's granddaughter, and The Secret of Secrets' synopsis
  carried an unsourced bomb scare and an inverted account of the hunt. All
  eight novels' synopses checked against Brown's own jacket copy; six needed
  no change. validate.py --slug dan-brown: no new errors from this stage.

boundariesSet: []
boundariesLoosened: []

fixed:
  - where: events.yaml / dan-brown-baigent-leigh-lawsuit-2006 (description)
    severity: load-bearing
    before: 'lifted the "central theme" and "architecture" of their own research - chiefly the idea that Jesus and Mary Magdalene married and that a bloodline survived to the present.'
    after: 'lifted the "central theme" and "architecture" of their own research into the origins of Christianity.'
    basis: >
      The thesis is public nonfiction, but attaching it to "what The Da Vinci
      Code lifted" turns it into the novel's reveal, which its own jacket
      withholds. Rewrite beat a gate: the ruling, its principle and the $6M
      costs now reach every reader, and a shield over a copyright trial is
      the over-redaction that teaches readers to click through shields.

  - where: authors/dan-brown.yaml / db-marries-blythe-newlon-1997 (description)
    severity: load-bearing
    before: "the theories that would define The Da Vinci Code: the Church's historical treatment of Mary Magdalene and the idea that Jesus's bloodline survived the Crucifixion"
    after: "the strand of early-Church history that would define The Da Vinci Code"
    basis: >
      Sibling prose stating the same reveal as the event above, so gating
      either alone would have been worth nothing. Newlon's credit survives.

  - where: authors/dan-brown.yaml / db-born-1964 (description)
    severity: borderline
    before: "directly shaped Jacques Sauniere and his granddaughter in The Da Vinci Code"
    after: "directly shaped the one between Jacques Sauniere and Sophie Neveu in The Da Vinci Code"
    basis: >
      The kinship is the novel's act-one disclosure, not its jacket's, and on
      plot alone I would have left it. Decided by the source: the entry's own
      citation says only "inspired that of Sophie Neveu and Jacques
      Saunière". Closer to the source and costs the biography nothing.

  - where: works.yaml / dan-brown/the-secret-of-secrets (synopsis)
    severity: not a spoiler, but wrong
    before: "...for the launch of her new book ... pulled into a bomb scare, a scientist's murder, and a hunt for what Katherine's research into consciousness has made him a target for protecting."
    after: "...for a lecture by her ... caught in a brutal murder and Katherine's sudden disappearance along with her manuscript - then hunted across Prague, London and New York... (full text at HEAD)"
    basis: >
      The bomb scare is in no publisher source, the book is unpublished
      inside the novel, and the last clause inverted the jacket (Katherine
      vanishes with her manuscript; Langdon searches for her). Rewritten from
      danbrown.com sentence for sentence.

  - where: works.yaml / the-da-vinci-code, inferno, the-secret-of-secrets (note)
    severity: preventive
    basis: >
      Three curator-only landmine notes naming the phrasing that must not
      come back and where the publisher's line stops. Verified in the app
      that works[].note renders nowhere (only pseudonyms[].note and startHere
      path.note reach a reader), so it is the right home for it.

checkedAndLeftAlone:
  - "angels-demons: Illuminati resurgence, antimatter, conclave deadline are danbrown.com's copy nearly verbatim; the late reveal appears in no field."
  - "the-da-vinci-code synopsis: all jacket - murdered curator, Sophie Neveu, codes in the paintings, Langdon as suspect."
  - "inferno: checked hardest. Every element (hospital, head wound, lost days, biohazard cylinder, 'seek and find', assassin) is in Brown's own free excerpt, which runs the whole hospital sequence. The synopsis reports the opening rather than explaining it; nothing says it is later recast."
  - "origin: 'silenced before he can finish' is more reserved than the jacket, which names an enemy who will 'stop at nothing to silence Edmond Kirsch'."
  - "the-lost-symbol: forged invitation, twelve-hour deadline, kidnapped mentor - jacket or act one. The antagonist's identity appears nowhere."
  - "digital-fortress: Tankado's death is the prologue and is on Brown's site; the jacket itself advertises 'betrayed on all sides'."
  - "deception-point: runs the other way - our synopsis is more conservative than the jacket, which says outright she finds 'evidence of scientific trickery'."
  - "Katherine Solomon in both 2009 and 2025: the newer synopsis leaks that she survives The Lost Symbol. Incidental - that novel's suspense rests on the antagonist's identity, she is a co-lead in the newer jacket, and the book cannot be described without her."
  - "orders.yaml rationale never telegraphs a late payoff; franchise.yaml description is bibliography; eras.yaml is []."
  - "events/global.yaml: not a vector - globalEvents.include is [] and the app resolves global events by explicit inclusion only (lib/content/index.ts)."
  - "Verified rather than trusted: made the validator's misplaced-spoilerAfter guard fail on purpose on dan-brown/inferno, watched it refuse, reverted."

readingOrdersFlagVerdict:
  verdict: HOLDS - no change made
  detail: >
    The start-with-the-da-vinci-code note names no character, no event and no
    outcome, and Vittoria appears nowhere in the wing in any field. Checked
    the underlying fact directly: the Robert Langdon article says the
    relationship "is only referred to in The Da Vinci Code, mentioning the
    fact that Langdon had last seen Vittoria a year previously" - so a
    back-reference leaks both her survival and that they became involved. The
    note leaks neither. Vittoria is in any case named as Langdon's partner in
    Angels & Demons' own jacket copy, so her centrality was never
    protectable.
  residual: >
    "Read differently if you go back to that one afterward" is a meta-hint:
    it says something in the earlier book is affected, without saying what.
    Logged in openQuestions, not fixed.

forStages:
  translation: >
    No pt-PT overlay exists for this wing (checked content/i18n/pt-PT/),
    so nothing needed mirroring and no stale string is live - but you are the
    first to carry these strings into another language and four changed for
    spoiler reasons in the last commit. Translate from HEAD, never from an
    earlier draft or from a summary of the book. What must not come back:
    (a) the lawsuit event's subject stays "their own research into the
    origins of Christianity" - Portuguese press and the Bertrand/Porto
    Editora copy for O Codigo Da Vinci state the claim far more freely than
    the English jacket, and borrowing that register reintroduces exactly what
    was removed; (b) db-marries-blythe-newlon-1997 stays at "the strand of
    early-Church history"; (c) db-born-1964 must not regain a kinship word
    (neta, avo); (d) for the-secret-of-secrets prefer a Portuguese edition's
    own publisher copy if one exists, else translate the English rather than
    summarising the novel. Every synopsis here sits deliberately at jacket
    altitude - if a pt-PT rendering feels thin, that is the point. Inferno
    needs the most care: its synopsis reports the novel's opening exactly as
    a first-time reader meets it, and any phrasing that explains or frames
    that opening rather than reporting it gives the book's architecture away.
    The three works notes added here say what must not be said; notes are
    curator-only and are not translated.

  wing-audit: >
    Zero boundaries is a finding, not an oversight: every load-bearing reveal
    here lives in ungated prose and each was removable by rewriting. Nothing
    is shielded, so a decay check has nothing to loosen; re-check instead
    whether newly added prose reaches back for the phrasings named in the
    three landmine notes.

openQuestions:
  - "The Da Vinci Code's revelation is arguably the most culturally notorious
     plot point in this catalogue, and a curator could reasonably call
     protecting it in 2026 theatre. I ruled on the publisher test rather than
     on notoriety: the jacket of the book it would spoil still withholds it,
     and first-time readers still exist. Loosenable deliberately; I would not
     loosen it by default."
  - "start-with-the-da-vinci-code's note tells a reader something in Angels &
     Demons is affected without saying what. Left as shipped - the path's
     premise is 'skip book 1' and naming the cost is honest, and every
     alternative I drafted either dropped the cost or sharpened the hint."
  - "Katherine Solomon's survival of The Lost Symbol is leaked by the 2025
     synopsis and is unavoidable while both books are shelved. Ruled
     incidental; worth a second opinion from anyone who has read it recently."
  - "The Secret of Secrets is under a year old and its jacket copy is the only
     description of it I would trust. Re-read the synopsis once Portuguese
     publisher copy exists - not to enrich it, but to see whether the
     publisher has since revealed more than it did at launch."
  - "The lawsuit and marriage events could have taken a boundary instead of a
     rewrite. I am confident rewriting was right - both are biography and
     publication history every reader should get - but it is a judgement, and
     the one call here a curator might reverse."
