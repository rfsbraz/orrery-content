stage: editions
summary: >
  Built content/franchises/dan-brown/editions.yaml from scratch: 25 editions
  across all 10 works (11 English, 14 pt-PT). English coverage is each
  work's verified first edition (Wikipedia infobox ISBNs, reconverted from
  ISBN-10 rather than trusted pre-converted; publisher-page lookups for the
  two titles with no infobox: Wild Symphony, the Young Adult Edition).
  Portuguese coverage is the current in-print edition, sourced by fetching
  bertrand.pt/wook.pt product pages directly for their JSON-LD data. Every
  ISBN passed validate.py's check-digit test and lookup.py --verify-isbns
  (25 editions, 0 suspect, region-prefix cross-checked); no duplicate ISBN.
  Two apparent discrepancies were real distinct ISBNs, both written into the
  file rather than silently picked: The Secret of Secrets' hardcover
  (9780385546898, used) vs Kindle (9780385546928), and three valid ISBN-13s
  for the Young Adult Edition across bindings (9781524715847, from Penguin
  Random House's own product page, used). One live finding is now in the
  file header: Planeta has been migrating Brown's Portuguese backlist off
  Bertrand since July 2025 (Anjos e Demónios, O Código da Vinci, O Segredo
  dos Segredos, O Símbolo Perdido, A Conspiração now sold under Planeta);
  Inferno, Origem and Fortaleza Digital have not yet been reissued and keep
  their Bertrand editions. Added the confirmed Da Vinci Code Young Adult
  Edition as edition-level data (English + its own Portuguese "edição
  juvenil", not migrated to Planeta), and both 187 Men to Avoid editions
  (1995 as "Danielle Brown", verified against the Internet Archive scan of
  the physical book; the 2006 reissue recast as "Dan Brown Formerly Writing
  As Danielle Brown" - a different printed byline, kept as a second, real
  edition). Inferno and Origin also carry a second pt-PT entry for
  Bertrand's currently-stocked "11 X 17" pocket printing alongside the trade
  edition, confirmed as a physically distinct object (ISBN, dimensions, page
  count all differ). No Brazilian ISBN is recorded despite several turning
  up in the same searches (Arqueiro, Sextante) - out of scope for a pt-PT
  catalogue. validate.py --slug dan-brown is clean: 0 errors, the same 4
  pre-existing handoff-length warnings from earlier stages.
