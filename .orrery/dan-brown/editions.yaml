forStages:
  visual-metadata: >
    The Young Adult Edition needs its own cover if per-edition covers get
    assigned: a different jacket from the adult The Da Vinci Code (Delacorte
    Press, 2016; separate Portuguese "edição juvenil" jacket from Bertrand,
    ISBN 9789722533041), not inherited artwork. Also: the Planeta migration
    (file header) puts five works - Angels & Demons, Deception Point, The Da
    Vinci Code, The Lost Symbol, The Secret of Secrets - under a new
    Portuguese cover source (Planeta, not Bertrand); Inferno, Origin and
    Digital Fortress are unaffected.
  wing-audit: >
    editions.yaml exists now (capability `editions`: auto -> populated); the
    app gains exact-edition store links for all 10 works. The pocket/trade
    pairs (Inferno, Origin) and the trade-only case (Digital Fortress) are
    deliberate, sourced choices, not an inconsistency.
openQuestions:
  - >
    No Bertrand-era Portuguese ISBN for Angels & Demons was found (Bertrand/
    Wook's live catalogue only shows the 2025 Planeta edition); worth a
    BNP/Porbase search a future pass did not attempt, since a translation
    almost certainly existed alongside The Da Vinci Code's.
  - >
    The Secret of Secrets and the Young Adult Edition both carry ISBNs
    disambiguated from a second, equally valid candidate (Kindle edition;
    other bindings), not a sourcing conflict - flagged so a future audit
    does not mistake either for an unresolved check-digit problem.
  - >
    Coverage is honest, not padded: no UK first edition, no US paperback
    reissue, no Brazilian pt-BR edition anywhere in this file, on purpose
    (file header). Adding US/UK dual coverage or a pt-BR sweep would be new
    scope, not a fixed omission.
