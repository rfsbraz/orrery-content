stage: visual-language
summary: >
  Wrote theme.yaml's `art` block, the only validator error left on the wing.
  Kept the scaffold's cyanotype-blue register and palette but moved the
  realisation off literal blueprint/cipher imagery, which collided with two
  neighbours, onto Robert Langdon's actual discipline: reading an image for
  a second meaning already inside it. Emblem is a reproduction propped
  against a tilted mirror - the ambigram's real mechanic (one surface, two
  true readings) translated out of lettering, since ambigram text itself
  can't be drawn.
produced:
  theme: >
    content/franchises/dan-brown/theme.yaml - added `art` only (emblem,
    motifs, atmosphere, lineCharacter, backgroundTexture, accentUse, avoid)
    plus one explanatory comment above it. palette/preset/displayFace/
    signature/notes verified byte-identical to the scaffold commit.
  anchorDecision: >
    Confirmed the palette/register, revised the realisation. theme_digest.py
    surfaced two collisions the scaffold only checked by hue: Sanderson
    already owns a ruled draughtsman's-instrument line on blueprint vellum
    with a printed grid; JRDS already owns cipher/code-breaking territory
    (letter-grid emblem, technical pen line, wire-service paper). Literal
    blueprint-and-cipher imagery would sit on top of both. So this wing
    draws neither ciphers-as-grids nor engineering-as-diagram; it draws
    symbology - reading an image/plan/sample for a meaning already in it,
    per every book's own synopsis in works.yaml.
  emblem: >
    A reproduction of a historical image (fresco fragment, anatomical
    study, elevation - never a specific named work) propped against a
    tilted hand mirror, print and reflection both in view. Sourced to
    dan-brown.yaml's db-angels-demons-cd-ambigram-1999: the real John
    Langdon ambigram that gave Robert Langdon his name. Verified beyond
    that event's own sourcing (web search): ambigrams ran through the
    Angels & Demons cover and interior specifically, not the whole series'
    covers - so the wing anchors the PRINCIPLE (a surface reading true both
    ways), not a claim every cover used one. Ambigram lettering itself is
    banned catalogue-wide (no baked text), so mirror reflection carries the
    principle, no invented letterforms.
  motifs: >
    Six, spanning the whole bibliography, not just the Langdon novels: the
    mirror-and-reproduction device recurring smaller; a loupe over a
    photostat under raking lamp light; a floor plan with pencilled
    construction lines; a physical sample under hand-lens examination (ice
    core, rock section, perforated tape) standing in for Digital Fortress
    and Deception Point, where the hidden reading is scientific not
    art-historical; a locked dispatch case mid-transit; a research desk
    composed per §4c (4-5 objects, one leading).
  distinctness: >
    theme_digest.py --exclude dan-brown, then read Sanderson's and JRDS's
    theme.yaml in full - the two real collisions - named in the art block's
    own header comment and `avoid`. Also checked Jo Nesbø (technical pen,
    ledger register, untouched here); no other wing claims this cyan-blue
    hue.
validatorResult: >
  validate.py --slug dan-brown - 0 errors (missing-`art:` error gone). 3
  pre-existing warnings, all other stages' handoff length, none this
  stage's. asset_audit.py dan-brown reports `art:yes`, 9 jobs (0 era plates
  - wing has none - 7 life events, 2 franchise events, 0 world events).
forStages:
  art-rotation: >
    No organisation/illustration_type changes made. This wing's reading
    devices (mirror, loupe, plan) are rectilinear or hand-held by design so
    none reads as the shared orrery rings - keep that live when placing the
    motif per VISUAL.md §1a.
  visual-metadata: >
    Quote `art` verbatim in STYLE. Never depict a specific identifiable
    painting/sculpture/building closely enough to be a copy (draw the
    fragment or an invented equivalent); never render ambigram lettering or
    any word-as-image - catalogue-wide rules, doubly load-bearing here since
    the emblem exists to honour the ambigram without literalising it.
  asset-prompt: >
    The mirror-and-reproduction emblem suits symbolic-still-life or
    emblem-seal. db-angels-demons-cd-ambigram-1999 (diptych, 2 images) is
    the natural first use, since it's the source event: panels reading as
    the CD sleeve moment and the novel-cover reuse a year later, per §3 (no
    likeness of Brown or Langdon), never a real-cover recreation.
  wing-audit: >
    Nothing outstanding. No eras.yaml entries by design, so no chapter-gate
    jobs exist.
openQuestions:
  - >
    The emblem's reproduction is deliberately generic (fresco/anatomy/
    elevation) rather than tied to one book. When a specific event is
    prompted, pick a period/style consistent with that event's book if one
    is implied (Renaissance-adjacent for a Da Vinci Code-era event, Baroque
    for Angels & Demons) - left open on purpose, a per-asset call.
  - >
    Portrait and covers are still 0/1, 0/10 - outside this stage's remit,
    flagged only so the next stage sees both gates still shut.
