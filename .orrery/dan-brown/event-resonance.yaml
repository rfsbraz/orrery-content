    reason: "Portuguese political event. Brown is American with no documented connection to his work."

  - id: chain-bookshop-1982
    reason: "Shaped bookselling while he was in college. No specific documented influence on his thrillers or later career."

  - id: sept-11-2001
    reason: "Lived through it, did not reach the page. Digital Fortress (1998, NSA/cryptography) predates 9/11; The Da Vinci Code (2003, religious conspiracy) is unrelated to terrorism or post-9/11 security themes."

  - id: financial-crisis-2008
    reason: "Inferno's overpopulation and bioethics theme is independent of financial-crisis ethics. No documented resonance."

  - id: ebook-and-self-publishing-2007
    reason: "Brown remained traditionally published with Doubleday throughout his career. Self-publishing and ebook platforms did not shape his publishing model or literary direction."

  - id: prestige-fantasy-adaptation-2011
    reason: "Game of Thrones example. Brown writes thrillers, not fantasy. His own film adaptations (2006, 2009, 2016) preceded this shift and operated in a different genre."

  - id: portugal-bailout-2011
    reason: "Portuguese financial crisis. Brown is American with no documented connection to his life or work."

  - id: booktok-2020
    reason: "Established bestselling author at peak influence. BookTok reaches lesser-known and emerging writers, not career-defining figures in their prime."

  - id: covid-19-pandemic-2020
    reason: "Lived through it; no documented influence on his work. No thematic or biographical resonance."

notes: |
  This franchise's global-event span is tight and focused: one online-commerce infrastructure event that enabled his backlist discovery at the moment of his breakthrough, everything else excluded for lack of documented resonance. No aura-density concerns; the franchises's own in-built life events (5 major milestones: birth/household/marriage/Angels-Demons CD/Da Vinci breakout) and franchise events (2: Baigent-Leigh lawsuit, 2006 phenomenon) furnish sufficient context.
