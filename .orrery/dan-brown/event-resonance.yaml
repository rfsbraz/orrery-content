include:
  - id: online-bookselling-1995
    note: "His first book published the month Amazon launched (July 1995). Online backlist discovery was essential infrastructure when The Da Vinci Code became a phenomenon in 2003, pulling his earlier modestly-selling novels onto bestseller lists and reaching millions of readers who would not have found them in physical bookstores."

