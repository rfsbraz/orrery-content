duplicatedWorkFound:
  - id: press-archaeology-prewrote-art-rotation-fields
    shape: >
      Third confirmed occurrence of the hp-lovecraft "silent pre-write"
      pattern. press-archaeology (ee2a057) set organisation/
      illustration_type/images_required on all 9 events and lifeEvents (7
      lifeEvents + 2 franchise events) while building the biographical
      spine, to keep its own art_rotation.py --check clean while inserting
      new events into an already-graded wing - exactly art-rotation's
      declared footprint. Its own handoff undersold this: it names only
      "layout fields on the two pre-existing lifeEvents" (the birth and the
      2003 breakout), not the 7 new ones that also got the same fields.
    difference_from_hp_lovecraft: >
      Not silent this time. art-rotation (6aa5883) read its input rather
      than assuming a blank slate, found all 9 already graded, reviewed
      every placement against LAYOUT.md's fit/pace test, concurred with all
      9, and documented the pre-write explicitly in its own commit message
      ("press-archaeology already set organisation/... on all 9 events...").
      No rework resulted; the only new work was one modifier field
      (anchor-with-satellites) art-rotation added on review.
    recommendation: >
      Not this stage's call to fix (pipeline-audit proposes, does not edit
      shared skills) - but press-archaeology's skill should be told to
      name in its own handoff exactly which events got layout fields, new
      and pre-existing alike, so a downstream stage never has to discover
      the true scope by diffing.
  - id: aura-hole-recompute-dependency
    shape: >
      Not a footprint violation - both stages wrote only their own declared
      fields correctly - but a real cross-stage dependency nothing
      currently re-checks. press-archaeology's handoff reported the wing's
      longest dark run as 4 years (2012-2015) when it ran. event-resonance
      then excluded ten global events, among them entries that had been
      covering 2007-2011, which silently turned the 4-year hole into 9 years
      (2007-2015) - each individual exclusion was correct on its own merits,
      but nobody re-ran aura_density.py after event-resonance to see the
      combined effect until wing-audit did.
    outcome: >
      Closed same-session by a direct audit-fixes pass (6342aff): two new
      sourced entries plus one global re-judged on its merits brought the
      longest dark run down to 4 years (2017-2020). No stage re-dispatch was
      needed.

