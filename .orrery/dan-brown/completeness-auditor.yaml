stage: completeness-auditor
summary: >
  Verified all 10 works in the Dan Brown bibliography (8 core, 2 extended)
  against primary and publisher sources rather than Wikipedia alone: ISFDB's
  summary bibliography, danbrown.com's own site (including a sitemap crawl
  of its full book catalogue), the Internet Archive scan of the 1995 first
  edition of 187 Men to Avoid, Open Library, and a PenguinRandomHouse.com
  product page. No works added or removed and no date changed - ISFDB
  independently corroborates every fiction title's year already on file.
  Resolved all three open calls from franchise-research: The Bald Book stays
  out (traced its sole claim to an uncited Wikipedia sentence with no
  independent source behind it), the Young Adult Edition of The Da Vinci
  Code stays edition-level (confirmed against catalogue precedent and
  ISFDB's own "Variant" treatment of the same title), and 187 Men to
  Avoid's involvement level is now precise: co-written with Blythe Newlon,
  sourced to a named journalist and Brown's own on-the-record quote.
  validate.py --slug dan-brown is clean except the expected missing
  theme.yaml `art:` block, explicitly out of this stage's scope.
produced:
  correctedWorkIds: []
  addedWorkIds: []
  removedWorkIds: []
  sourceUpgrades:
    - dan-brown/187-men-to-avoid
  headerRewrites:
    - "The Bald Book exclusion: strengthened from 'rests on a single unnamed
      source' to a traced finding - the claim carries no citation of its
      own even on Wikipedia (the adjacent footnote belongs to the following,
      unrelated sentence), and every other source repeating it online is a
      verbatim copy of the same uncited line. The gap is now documented as
      checked-and-empty, not just under-sourced."
    - "The Da Vinci Code: Young Adult Edition: added two independent
      confirmations of the edition-level call - no other wing in this
      catalogue gives an abridged/young-readers edition its own work entry
      (anna-sewell rejected a comparable graded-reader abridgement outright),
      and ISFDB itself files this title as a 'Variant' of The Da Vinci Code
      rather than a separate title."
    - "Added the stage play (Rachel Wagstaff and Duncan Abel adaptation),
      the MasterClass course, and the Museum of Science planetarium show to
      the considered-and-rejected list, found via a full crawl of
      danbrown.com's sitemap - none is a published book or Brown's sole
      authorship."
  filesWritten:
    - content/franchises/dan-brown/works.yaml
  filesNotTouched:
    - content/franchises/dan-brown/franchise.yaml
    - content/franchises/dan-brown/theme.yaml
    - content/authors/dan-brown.yaml
forStages:
  press-archaeology: >
    No change to the aura plan. One corroborating lead for the 2003 breakout
    event already scaffolded: Brown's own 2000 interview quote (via the New
    York Times, 2021) acknowledging a pre-Digital Fortress humor book is a
    dateable, on-the-record moment from the thin early period, sourced at
    https://www.nytimes.com/2021/07/29/style/dan-brown-advice-book.html.
  reading-orders: >
    No change to the single-series structure. The Langdon publication-order-
    equals-story-order finding from franchise-research is now additionally
    corroborated by ISFDB, which numbers all six novels "Robert Langdon #1"
    through "#6" in publication sequence.
  eras: >
    No change; still no eras.yaml, franchise-research's open question about
    whether one is warranted at this shelf size stands unresolved by this
    stage (out of scope here).
  visual-language: >
    No change to theme.yaml or its art block.
openQuestions:
  - "The Bald Book (1998) is confirmed excluded, not left open a second
    time: the 'primarily written by Brown' claim has no independent source
    anywhere in the reachable record, only a single uncited Wikipedia
    sentence that every other site mirrors verbatim. This is now a closed
    finding (absence confirmed), not an unresolved lead."
  - "The Da Vinci Code: Young Adult Edition (2016) is confirmed as
    edition-level data, not a works.yaml entry, backed by catalogue
    precedent and ISFDB's own bibliographic model. Adding it to
    editions.yaml (ISBN, publisher, format) is real remaining work, just
    outside this stage's file scope."
  - "187 Men to Avoid's co-authorship with Blythe Newlon is now sourced to
    a named journalist (Caity Weaver, New York Times, 2021-07-29), a cited
    biography (Lisa Rogak, 'Dan Brown: The Unauthorized Biography', 2013),
    and a rare on-the-record Brown quote from a 2000 interview - as precise
    as the reachable sources get. No further public source names Blythe
    Newlon's specific contribution (which chapters, how much text) beyond
    'co-wrote... with his wife.'"
  - "No missing works found on a full sweep of danbrown.com's own site
    (bibliography page plus sitemap): no forewords, introductions to other
    authors' books, or academic articles carrying Brown's name turned up in
    either the official site or general web search."
