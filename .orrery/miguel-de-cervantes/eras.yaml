stage: eras
summary: "4 eras built, span 1580-1617; 6 of 8 works covered, the 2 uncovered ones deliberate"
produced:
  eraIds: [retorno-a-las-letras, el-periodo-andaluz, el-ingenioso-hidalgo, el-taller-cervantino]
  basis: >
    All four are section titles of the biography Jean Canavaggio wrote for the
    Biblioteca Virtual Miguel de Cervantes portal (autor_biografia 1-3),
    boundary-dated against the same portal's chronology by Florencio Sevilla
    Arroyo and Begona Rodriguez Rodriguez. Provenance critical on all four.
    Britannica still 403s, so it was not used; the search was run in Spanish,
    on Spanish scholarship, which is where this consensus lives.
  workCounts: >
    retorno-a-las-letras 1580-1586 holds La Galatea (1 work).
    el-periodo-andaluz 1587-1599 holds none, by fact rather than omission -
    the twenty-year gap between La Galatea and the Quixote is the shape of
    this shelf, and the era says what he was doing in it (a zero-work era has
    precedent in brandon-sanderson/the-long-apprenticeship and
    robert-jordan/the-succession). el-ingenioso-hidalgo 1600-1605 holds Don
    Quixote (1). el-taller-cervantino 1606-1617 holds Novelas ejemplares,
    Viaje del Parnaso, Ocho comedias and Persiles y Sigismunda (4).
forStages:
  reading-orders: >
    Entry paths land almost entirely in the last era, which carries 4 of the 6
    era-covered works. Two things to know. Don Quixote is filed as one work
    dated 1605, so it sits in el-ingenioso-hidalgo while its Part Two belongs
    to the years of el-taller-cervantino. And El trato de Argel and El cerco de
    Numancia carry 1784, so a naive publication order puts them last, decades
    after the author's death, while their era is the first one - a curated
    order that opens with the captivity plays should say why it departs from
    the year on the entry.
  art-rotation: >
    4 era plates, all organisation chapter-gate, illustration_type
    symbolic-still-life, images_required 1, matching VISUAL.md 4b's fixed
    composition for the slot. art_rotation.py reports no issue and excludes
    plates from the event budget. No sketches filed yet.
  visual-language: >
    Four distinct tones for the wing's art law to serve. Retorno a las letras -
    a returned captive writing for the corrales - ransom papers, a stage
    trestle, the first printed book. El periodo andaluz - roads, wheat and oil,
    ledgers of arrears, a prison door; the era with no books on the shelf and
    the only one whose plate has no title page to show. El ingenioso hidalgo -
    Valladolid, a press, a book that escapes its author within months. El
    taller cervantino - a crowded Madrid work table under time pressure, five
    books in ten years, the last one dedicated four days before death. Real
    names are allowed on objects here per VISUAL.md 4b, and the record supplies
    several - Juan de la Cuesta, Blas de Robles, Juan de Villarroel.
openQuestions:
  - >
    El trato de Argel and El cerco de Numancia fall outside every span, which
    validate.py warns about twice. That is deliberate and the file says so -
    they were written and staged around 1581-1582, inside the first era, and
    were not printed until Sancha's 1784 Madrid edition, which is the year the
    entries carry. Stretching a span to 1784 would draw a Golden Age period
    around a Bourbon-era book. Persiles y Sigismunda, also posthumous, is kept
    inside the last era instead, because eight months of estate business is not
    the same thing as a two-century rediscovery.
  - >
    El periodo andaluz merges Canavaggio's Comisiones andaluzas and
    Encarcelamiento sections under the phrase he uses for the stretch as a
    whole when dating composition to it. His three overlapping sections for
    1606-1616 (En la Villa y Corte, El taller cervantino, Avellaneda) were
    collapsed the other way, to the one that names the writing, since eras
    cannot overlap.
  - >
    Canavaggio's sections periodise a life, not a body of work, the same scope
    shift the Poe wing took on when it used Quinn's chapter titles. Each era's
    note carries it. Nothing found so far periodises Cervantes's writing
    independently of his biography - the BVMC's own guided catalogue orders the
    works by genre and date, not by period.
