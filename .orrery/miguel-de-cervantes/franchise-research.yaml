stage: franchise-research
summary: "Scaffolded the Cervantes wing: 8 works (not the 2 the issue guessed), Don Quixote as one work, small-shelf eras exception does not apply"
produced:
  franchise: "content/franchises/miguel-de-cervantes/franchise.yaml (kind: author, themePreset: siglo-de-oro-parchment, features all auto, no globalEvents claimed yet)"
  author: "content/authors/miguel-de-cervantes.yaml (bio + basics; lifeEvents left empty for press-archaeology)"
  works: "content/franchises/miguel-de-cervantes/works.yaml - 8 entries: La Galatea (1585), Don Quixote (1605, one entry spanning both parts), Novelas ejemplares (1613), Viaje del Parnaso (1614), Ocho comedias y ocho entremeses nuevos (1615), El trato de Argel (c.1582), El cerco de Numancia (c.1582), Los trabajos de Persiles y Sigismunda (1617, posthumous)"
  theme: "content/franchises/miguel-de-cervantes/theme.yaml - preset/palette/displayFace(fraunces)/signature(thread) set; `art` block deliberately absent, left for visual-language"
  tieringBasis: "core = the 4 prose works (matches Wikipedia's own Prose/Drama/Verse split); extended = the 4 dramatic/poetic works. featured on Don Quixote and Persiles y Sigismunda (2 of the 3-cap)"
forStages:
  completeness-auditor: >
    Sourced from English/Spanish Wikipedia only - britannica.com 403'd every
    fetch this session, and Biblioteca Virtual Miguel de Cervantes was not
    cross-checked; worth another pass. "La tia fingida" (Porras de la Camara
    manuscript) deliberately excluded - the attribution to Cervantes is
    disputed, not just under-sourced. Minor named poems in the author bio
    (Al Tumulo del Rey Felipe en Sevilla, Canto de Caliope, Epistola a Mateo
    Vazquez) have no work entries; worth deciding if any warrant one.
  eras: >
    Small-shelf exception does NOT apply. Real count is 8 works over
    1582-1617 (35 years) with a genuine periodisable shape: early
    captivity-and-theatre plays (c.1582), a 20-year silence after La
    Galatea (1585) until Don Quixote (1605), an explosive final decade
    (1605-1615, 5 of 8 works), and a posthumous coda (1617). Run normally.
  press-archaeology: >
    Anchor candidates: birth (1547, dated "assumed"), the Lepanto wound
    (1571), the Algiers captivity and 4 escape attempts (1575-1580), the
    1605 breakout, the 1614 Avellaneda affair (already ruled a franchise
    event, not built this stage), the 1616 death 3 days after finishing the
    Persiles dedication. Worth checking: the 1605 masquerade for Philip
    IV's birth reportedly already featured Don Quixote/Sancho costumes,
    months after publication.
  translation: >
    Don Quixote carries a sourced translationNote per the resolved issue
    (Grossman 2003 / Rutherford 2000 / Ormsby 1885 / Putnam 1949). No other
    work here has a comparable documented translation-divergence story.
openQuestions:
  - >
    Don Quixote: filed as ONE work. Basis: SCHEMA.md's own translationNote
    example already uses the single id "miguel-de-cervantes/don-quixote";
    this catalogue treats a single narrative spanning more than one
    printing event as one work (Stephen King's Stand: Complete and Uncut is
    explicitly excluded as its own entry); and virtually every modern
    edition binds both parts under one title. Counter-case for the curator:
    unlike King's uncut edition, Part One and Part Two are different texts,
    plotted a decade apart, and Part One sold standalone for 10 years
    before Part Two existed - closer in shape to McCarthy's Passenger /
    Stella Maris, which this catalogue DOES file as two linked works. The
    distinction drawn here: Passenger/Stella Maris are separately titled
    books about different protagonists; Don Quixote's two parts share one
    title and one narrator pair and are almost never discussed as two
    books. If overruled, splitting is mechanical (two ids, 1605/1615, note
    content mostly unchanged, translationNote and featured stay on Part 1).
  - >
    Ocho comedias y ocho entremeses filed as ONE work (16 pieces, one
    authored volume, same logic as Novelas ejemplares). Flagging in case a
    future pass wants the 8 comedias split out - they're individually
    titled and occasionally discussed alone (e.g. Pedro de Urdemalas),
    unlike the entremeses, always treated as a set.
  - >
    El trato de Argel and El cerco de Numancia dated 1582 (sourced
    composition/performance period) rather than 1784 (their only print
    publication). Each entry's note explains and sources this; flagging as
    a real deviation from a literal "published = first print year" reading,
    worth a second look.
  - >
    Britannica 403'd every fetch attempt; every fact here is corroborated
    by English Wikipedia and, for the Numancia/Argel dating and the
    Avellaneda affair, Spanish Wikipedia too - but a Britannica and
    Biblioteca Virtual Miguel de Cervantes cross-check would strengthen it.
