stage: art-rotation
summary: >
  Verified press-archaeology's draft cadence and the eras/franchise-event
  assignments already in the files; fixed one screenful clash between the
  birth and the Algiers immersion by swapping two organisations rather than
  touching illustration_type. Gate is 0 organisation-rotation problems and 0
  pacing problems.
produced:
  organisationsAssigned: 9
forStages:
  visual-metadata: >
    All 8 illustration_type values from press-archaeology/visual-language are
    unchanged - place-portrait, portrait-of-absence, atmospheric-motif-field,
    document-facsimile, press-media-collage, archive-stack, book-object,
    symbolic-still-life - no type repeats across the wing, and the era plates
    stay on symbolic-still-life (keyed, not opaque; establishing-landscape was
    the trap to avoid there and was never used). One pairing worth flagging
    if it looks odd later: cervantes-lepanto-1571 is now organisation
    medallion holding portrait-of-absence, an OPAQUE_TYPES member per
    art_types.py, inside an organisation whose default spec expects a
    transparent circular crop. This exact pairing is explicitly listed in
    LAYOUT.md's medallion Holds line, so it is a sanctioned combination (a
    medallion is itself usually an opaque portrait in a frame), not a slip -
    validate.py's edge-regime check will route its eventual asset down the
    --opaque path rather than expecting alpha.
  wing-audit: >
    Two organisation changes from the press-archaeology draft, both on
    content/authors/miguel-de-cervantes.yaml, nothing touched in events.yaml
    or eras.yaml. cervantes-born-1547 moved from full-bleed-vista to beside -
    it is the wing's only impact: low life event, and full-bleed-vista
    (share 0.51, loud) sitting one beside away from cervantes-algiers-
    captivity-1575's immersion (share 0.40, loud) put both inside one mobile
    screenful (1.33 viewports across the three cells), the only pacing
    failure art_rotation.py reported. cervantes-lepanto-1571 moved from
    beside to medallion to fill the gap beside leaves and to give the wound a
    better fit than the generic default - a medallion (a rimmed, worn keep-
    sake) suits a wound Cervantes "wore with pride to the end" better than
    beside did, and its higher viewport share (0.45 vs 0.42) is part of what
    breaks the screenful clash. algiers-captivity keeps immersion (matches
    press-archaeology's explicit 1-2 immersion cap: Algiers + death, not
    adjacent - still true, they are five events apart) and avellaneda-
    affair-1614 keeps artifact-spread/book-object from press-archaeology
    unchanged - it sits between two mid cells (layered-stack, epigraph) and
    a fake book is a clean fit for the type anyway. Considered and rejected
    for Lepanto: split-counterpoint (PRIVATE wound / PUBLIC Holy League
    victory is a genuine contradiction-fit per LAYOUT's own Use line, and its
    share of 1.24 would have solved the clash on its own without touching
    cervantes-born-1547 at all), but the schema carries one illustration_type
    per entry, not one per lane, and portrait-of-absence describing a naval
    battle's public half reads wrong - see openQuestions.
openQuestions:
  - >
    The split-counterpoint alternative for cervantes-lepanto-1571 is worth a
    second look. chuck-palahniuk/events.yaml's guts-fainting-readings-2003 is
    the one existing split-counterpoint in the catalogue and also carries a
    single shared illustration_type across both lanes (public-event-tableau),
    so a shared type across two conceptually different lanes may be the
    established pattern rather than a blocker - if so, Lepanto could carry a
    less absence-specific type (e.g. a still-life type both lanes can share)
    and use split-counterpoint's private/public contrast, which is a
    stronger dramatic fit than medallion. Not changed here because
    portrait-of-absence is the deliberate throughline visual-language named
    for this specific event, and swapping it away is a bigger call than this
    stage's pacing fix needed to make.
  - >
    art_rotation.py's composition axis (0 of 13 assets have an issue yet)
    stays flagged and the script's own exit code is 1 for that reason alone -
    expected on a wing with no /asset-prompt pass yet, per art-rotation's own
    SKILL.md, and not read as a gate failure here.
