stage: translation
summary: >
  pt-PT overlay written for all five in-scope files (works, eras, events,
  franchise+startHere, author+lifeEvents); franchise-side files reach full
  i18n_coverage.py coverage, author file is one field short by a deliberate,
  precedented call (an unverifiable quote translation); validate.py clean.
produced:
  filesWritten:
    - content/i18n/pt-PT/franchises/miguel-de-cervantes/works.yaml
    - content/i18n/pt-PT/franchises/miguel-de-cervantes/eras.yaml
    - content/i18n/pt-PT/franchises/miguel-de-cervantes/events.yaml
    - content/i18n/pt-PT/franchises/miguel-de-cervantes/franchise.yaml
    - content/i18n/pt-PT/authors/miguel-de-cervantes.yaml
forStages:
  wing-audit: >
    Two calls worth a native-reader second look, both documented with
    reasoning in the overlay files themselves. First, eras.yaml's four
    titles: the base keeps them in Spanish on purpose (they quote
    Canavaggio's own biography section headings), but SCHEMA.md's hard rule
    treats era titles as translated prose like any other, and the
    already-built Poe wing translates all of its era titles without
    exception, so this overlay translates all four ("El ingenioso hidalgo"
    to "O Engenhoso Fidalgo" is the tightest one, since it echoes the
    untranslatable work title's own opening words). Second, the author
    file's one coverage gap: cervantes-persiles-dedication-1616 is an
    epigraph lifeEvent whose base `quote` is a verbatim line from a real
    16th-century Castilian ballad that Cervantes himself quoted; no
    published Portuguese rendering was found, and anna-sewell.yaml already
    establishes the rule this catalogue uses for exactly this case (never
    invent a translation attributed to a real person's actual words) -
    harlan-coben/events.yaml and lee-child/events.yaml carry the same
    accepted gap for the same reason. i18n_coverage.py therefore reports
    this one file as 17/18, not 18/18; every other file this stage touched
    is fully covered.
openQuestions:
  - >
    The era-title translation call above is the one place this stage
    genuinely overruled a base-file design comment ("the titles are Spanish
    because the periodisation is") in favour of the schema's general rule.
    Worth a second opinion: an alternative reading would keep all four era
    titles in Spanish as citations to Canavaggio's own headings, since
    Portuguese readers understand them natively anyway and the (translated)
    description already glosses each one in full.
  - >
    Naming convention used throughout: "Dom Quixote" (never "Don Quijote"
    or an untranslated "Don Quixote") and "Sancho Pança" (never "Sancho
    Panza") whenever the character or book is named inside translated
    prose, sourced to editions.yaml's own pt-PT edition title ("Dom
    Quixote de La Mancha", Publicacoes Dom Quixote, 2017). The work's own
    `title` field is never touched and stays the original Spanish
    everywhere, per the hard rule.
  - >
    No content/events/global.yaml or other shared file was touched by any
    prior stage on this wing (event-resonance excluded all 18 global
    events), so this stage's scope is the wing's own five files only - no
    shared-file translation debt was left behind.
  - >
    orders.yaml was not overlaid: the base file ships an empty list, so
    i18n_coverage.py never counts it as a target (confirmed by rerunning
    the script). No file needed there.
  - >
    Verification this pass: i18n_coverage.py (franchise-side files full,
    author file 17/18 as explained above) and validate.py --slug
    miguel-de-cervantes (0 errors, the same 2 pre-existing era-boundary
    warnings on el-trato-de-argel/el-cerco-de-numancia that predate this
    stage, no new warnings). This is a content-only repo with no local app
    to render pt-PT pages from, so verification here is the source scan
    (grep for Brazilianisms and leftover Spanish city spellings, both
    clean) plus both scripts; an authenticated live-page read against the
    deployed app is still owed once this reaches it.
