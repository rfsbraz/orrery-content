stage: editions
summary: "11 editions across 6 of 8 works: Don Quixote gets six (Grossman, Rutherford, Putnam, Ormsby-revised, Motteux, one pt-PT), the rest one each, incl. two Spanish Catedra critical editions for works with no translation market"
produced:
  editionsAdded: 11
forStages:
  wing-audit: >
    2 of 8 works (Viaje del Parnaso, El trato de Argel) have no edition -
    a repeated search across archive.org, Open Library and Catedra/Castalia's
    own critical-edition lines found nothing past pre-ISBN 19th-century
    reprints and one non-978 identifier of unclear provenance. Real market
    fact, not a gap left by insufficient effort. The Edicoes Humus
    "Entremezes" pt-PT edition (ocho-comedias-y-ocho-entremeses workId)
    covers only the eight entremeses, not the eight comedias also in that
    1615 volume - flagged with a note on the entry itself so a buyer isn't
    misled; worth a second look if the schema ever grows a way to mark
    partial coverage more structurally.
openQuestions:
  - >
    The Norton Critical Edition (Ormsby, revised, 1981, 9780393090185) is
    heavily held in library catalogues and cited by Wikipedia, but
    wwnorton.com's own current catalogue no longer resolves that ISBN -
    recorded with a note flagging likely-superseded status rather than
    dropped, since no newer Norton edition using the same Ormsby base text
    was found to supersede it with.
  - >
    Did not chase a Relogio d'Agua pt-PT Don Quixote edition that a Wook
    reader review mentioned in passing ("O Dom Quixote De La Mancha da
    Relogio d'Agua e um melhor edicao que esta") - a second real pt-PT
    Don Quixote edition likely exists from that publisher; not verified
    this pass since the Dom Quixote/LeYa edition already covers the slot.
  - >
    translationNote on works.yaml was read closely and not touched - every
    translator it names (Grossman, Rutherford, Ormsby, Putnam) turned up a
    real, verifiable edition, so nothing in it needed correcting or
    strengthening enough to justify editing a file outside this stage's
    remit.
