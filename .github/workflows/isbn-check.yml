name: ISBN check

# `validate.py` proves every reference resolves, but it never asks whether an
# ISBN is real or belongs to the book it sits under - it is offline and
# structural by design. A wrong-but-well-formed ISBN (an omnibus, a different
# edition, a neighbouring title) passes validation and points a reader's store
# link at the wrong book. `lookup.py --verify-isbns` checks each edition's ISBN
# against the providers; this runs it on any PR that touches an `editions.yaml`.
#
# Advisory, never blocking: it depends on other people's servers (OpenLibrary,
# Google Books, Wikidata), and a flaky third-party host must not be able to stop
# a content merge - the same rule the weekly link check follows. A suspect ISBN
# is a comment to look at, not a red X.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "content/franchises/**/editions.yaml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: isbn-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # Skip while the PR is still a draft (a wing build pushes to it dozens of
    # times before it's ready for anyone to read) - ready_for_review above is
    # what wakes this up for real once it is, no extra push required.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - name: Which wings changed an editions.yaml?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          wings=$(git diff --name-only "$BASE" "$HEAD" \
            | sed -n -E 's#^content/franchises/([^/]+)/editions\.yaml$#\1#p' \
            | sort -u | tr '\n' ' ')
          echo "wings=${wings}" >> "$GITHUB_OUTPUT"
          echo "Editions touched on: ${wings:-(none)}"

      - name: Verify ISBNs against the providers
        id: verify
        if: steps.scope.outputs.wings != ''
        env:
          WINGS: ${{ steps.scope.outputs.wings }}
        run: |
          set -euo pipefail
          suspect_total=0
          {
            echo "<!-- isbn-check -->"
            echo "## ISBN check"
            echo "_Each edition's ISBN checked against the providers. Advisory - third-party lookups are flaky, so this never blocks a merge._"
          } > /tmp/isbn.md
          for w in $WINGS; do
            [ -f "content/franchises/$w/editions.yaml" ] || continue
            out=$(python scripts/metadata/lookup.py --verify-isbns "$w" 2>&1 || true)
            n=$(printf '%s' "$out" | grep -oiE '[0-9]+ suspect' | grep -oE '[0-9]+' | head -1 || echo 0)
            suspect_total=$(( suspect_total + ${n:-0} ))
            {
              echo ""
              echo "### \`$w\` - ${n:-0} suspect"
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            } >> /tmp/isbn.md
          done
          echo "suspect_total=${suspect_total}" >> "$GITHUB_OUTPUT"
          cat /tmp/isbn.md
          { echo "### ISBN check"; echo "${suspect_total} suspect ISBN(s) across the touched wings."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment only when something is suspect
        if: steps.scope.outputs.wings != '' && steps.verify.outputs.suspect_total != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- isbn-check -->"))) | .[0].id // empty')
          payload=$(jq -n --arg b "$(cat /tmp/isbn.md)" '{body: $b}')
          if [ -n "$existing" ]; then
            printf '%s' "$payload" | gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input -
          else
            printf '%s' "$payload" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input -
          fi
