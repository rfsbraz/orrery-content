# Português europeu (pt-PT). Coautor sem franquia própria - referenciado a
# partir da ala Margaret Atwood (a trilogia Angel Catbird).
- id: johnnie-christmas
  bio: >
    Argumentista e desenhador de banda desenhada nascido em Porto Rico,
    criado em Miami, radicado em Vancouver desde 2009; formado pelo Pratt
    Institute. Ilustrou os três volumes de
    [[work:margaret-atwood/angel-catbird-vol-1|Angel Catbird]] (2016-2017)
    com Atwood, e mais tarde escreveu e desenhou as suas próprias graphic
    novels (Firebug, Swim Team).
