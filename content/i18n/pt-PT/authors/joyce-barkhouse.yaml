# Português europeu (pt-PT). Coautora sem franquia própria - referenciada a
# partir da ala Margaret Atwood (Anna's Pet, 1980), de quem é tia.
- id: joyce-barkhouse
  bio: >
    Autora canadiana de literatura infantil, natural de Woodville, na Nova
    Escócia, e tia de Margaret Atwood; antiga professora, conhecida
    sobretudo pelo seu próprio romance Pit Pony (1989). Escreveu
    [[work:margaret-atwood/annas-pet|Anna's Pet]] (1980) com a sobrinha.
    Nomeada Membro da Order of Canada em 2008 pelo seu contributo para a
    literatura infantil.
