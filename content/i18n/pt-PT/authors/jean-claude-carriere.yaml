# Overlay pt-PT (português europeu): entidade mínima de colaborador,
# introduzida por esta ala para suportar withAuthorIds em
# umberto-eco/non-sperate-di-liberarvi-dei-libri. Apenas `bio` (lifeEvents:
# []). Sem edição portuguesa registada em editions.yaml para essa obra, pelo
# que a referência interna fica com o título original italiano, tal como no
# texto de base. Os dois filmes de Buñuel citados não pertencem a este
# catálogo (não têm entrada em works.yaml/editions.yaml): "Belle de Jour"
# mantém-se no título francês, de uso corrente também em Portugal; "The
# Discreet Charm of the Bourgeoisie" usa o título de distribuição em
# Portugal, "O Discreto Charme da Burguesia".
- id: jean-claude-carriere
  bio: >
    Argumentista, romancista e dramaturgo francês, mais conhecido pelas suas
    longas colaborações como argumentista com Luis Buñuel (Belle de Jour, O
    Discreto Charme da Burguesia) e por adaptar o Mahabharata para as
    produções teatrais e cinematográficas de Peter Brook. Manteve uma longa
    conversa em livro com Umberto Eco sobre livros e bibliotecas, editada por
    Jean-Philippe de Tonnac e publicada como
    [[work:umberto-eco/non-sperate-di-liberarvi-dei-libri|Non sperate di
    liberarvi dei libri]] (2009).
