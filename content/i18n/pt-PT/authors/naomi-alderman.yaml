# Português europeu (pt-PT). Coautora sem franquia própria - referenciada a
# partir da ala Margaret Atwood (The Happy Zombie Sunrise Home, 2013).
- id: naomi-alderman
  bio: >
    Romancista inglesa, nascida em Londres, conhecida sobretudo pelo papel
    de coautora em
    [[work:margaret-atwood/the-happy-zombie-sunrise-home|The Happy Zombie
    Sunrise Home]] e, a solo, por The Power, vencedor do Women's Prize de
    2017. Escolhida por Atwood em 2012 como protegida no âmbito da Rolex
    Mentor and Protege Arts Initiative, o que levou ao folhetim que
    escreveram juntas no Wattpad em 2013.
