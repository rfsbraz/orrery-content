# Overlay pt-PT do autor: só `bio` (lifeEvents: [] na base, nada a fundir).
# CITAÇÃO VERBATIM: a recensão de Douglas C. Kane citada na bio fica em
# inglês, tal como em jrr-tolkien.yaml e christopher-tolkien.yaml.
- id: carl-f-hostetter
  bio: >
    Académico tolkienista norte-americano e cientista informático da NASA
    (Goddard Space Flight Center, desde 1985); figura central da Elvish
    Linguistic Fellowship e editor de longa data das revistas de
    linguística tolkienista Vinyar Tengwar e Tengwestië. Editou
    [[work:jrr-tolkien/the-nature-of-middle-earth|The Nature of
    Middle-earth]] (2021), uma coletânea dos escritos tardios de
    J. R. R. Tolkien sobre filosofia e linguística da Terra-Média, ao
    abrigo de um acordo com [[author:christopher-tolkien|Christopher
    Tolkien]] antes da morte deste, em janeiro de 2020. A recensão do
    académico tolkienista Douglas C. Kane ao livro considera que Hostetter
    "appears to overstep his role as editor" em certos passos, ao ler o
    seu próprio enquadramento interpretativo no material.
