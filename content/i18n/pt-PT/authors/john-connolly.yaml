# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Filthy Rich não tem edição portuguesa verificada nesta ala,
# por isso o título mantém-se em inglês.

- id: john-connolly
  bio: >
    John Connolly é um romancista irlandês conhecido sobretudo pela série
    Charlie Parker, ficção policial protagonizada por um detetive privado
    que resvala para o horror e o sobrenatural, iniciada com Every Dead
    Thing (1999). Trabalhou cinco anos como jornalista no The Irish Times
    antes de se dedicar por completo à ficção, e os seus romances já
    venceram os prémios Shamus, Barry, Agatha, Anthony e Edgar. Coescreveu o
    livro de não-ficção
    [[work:james-patterson/filthy-rich|Filthy Rich]] (2016) com James
    Patterson.
