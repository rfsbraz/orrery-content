# Português europeu (pt-PT). Coautor sem franquia própria - referenciado a
# partir da ala Margaret Atwood (War Bears, 2018).
- id: ken-steacy
  bio: >
    Desenhador e argumentista canadiano de banda desenhada, nascido na base
    aérea de Zweibrücken, na Alemanha, e radicado em Victoria, na Colúmbia
    Britânica, desde 1987; formado pelo Ontario College of Art. Ilustrou
    [[work:margaret-atwood/war-bears|War Bears]] (2018) com Atwood, trazendo
    décadas de trabalho próprio na banda desenhada canadiana.
