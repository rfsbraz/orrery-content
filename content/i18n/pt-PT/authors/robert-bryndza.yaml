# Overlay pt-PT do autor: bio + prosa dos lifeEvents.
# Os lifeEvents ficam aninhados sob o autor e são fundidos por id (ver
# SCHEMA.md, "Nested lists merge by id"). Levam `title` + `description`, que
# são prosa; datas, impact e sources nunca se traduzem, nem o nome do autor
# nem o do marido, Ján (nome próprio eslovaco, transcrito tal e qual).
# The Girl in the Ice tem edição portuguesa registada em editions.yaml
# ("A Rapariga no Gelo", Alma dos Livros) e é citada assim sempre que
# referida. Bitch Hollywood e The Quiet Kill não têm edição portuguesa
# registada, pelo que os seus títulos ficam em inglês onde são citados.
- id: robert-bryndza
  bio: >
    Romancista britânico (Lowestoft, Suffolk), que estudou na Universidade de
    Aberystwyth e se formou na Guildford School of Acting, trabalhando vários
    anos como ator antes de uma peça da sua autoria no Festival de Edimburgo
    o reencaminhar para a ficção. Escreveu o primeiro romance de
    [[work:robert-bryndza/the-not-so-secret-emails-of-coco-pinchard|Coco
    Pinchard]] em 2010 e, depois de um contrato de edição no Reino Unido cair
    por terra, autopublicou o caminho até à carreira: um romance cómico
    escrito com o marido, Ján, sobre o ano que passaram em Los Angeles, foi
    publicado primeiro em tradução eslovaca (Mrcha Hollywood, março de 2012,
    depois de o casal se ter mudado para lá), seguido nesse mesmo ano pela
    autopublicação em inglês desse livro e de Coco Pinchard, e mais quatro
    romances de Coco Pinchard até 2015. A sua estreia policial,
    [[work:robert-bryndza/the-girl-in-the-ice|A Rapariga no Gelo]] (2016),
    apresentou a inspetora-chefe Erika Foster e vendeu mais de um milhão de
    exemplares num ano; a série de Erika Foster continua a par de uma segunda
    série protagonizada pela investigadora privada Kate Marshall e, a partir
    de 2026, de uma terceira protagonizada pelo detetive Jamie Day. Vive na
    Eslováquia com o marido, Ján.
  lifeEvents:
    - id: bryndza-born-1979
      title: Nascido em Lowestoft, Suffolk
      description: >
        Robert Bryndza nasce na vila costeira da Anglia Oriental de
        Lowestoft, o dia exato por corroborar em qualquer registo primário,
        embora todas as fontes bibliográficas concordem quanto ao ano. Parte
        para a Universidade de Aberystwyth e para a Guildford School of
        Acting, e só volta a escrever sobre Lowestoft décadas depois: o
        detetive [[work:robert-bryndza/the-quiet-kill|Jamie Day]], o primeiro
        protagonista masculino da sua carreira, recebe a mesma pequena terra
        costeira como origem e a mesma mudança para uma Londres avassaladora
        aos vinte e dois anos que o próprio Bryndza viveu.

    - id: bryndza-slovakia-manuscript-deal-2012
      title: Uma tosta de queijo, um telefonema e um contrato editorial
      description: >
        No final de 2011, depois de um contrato de edição no Reino Unido
        para [[work:robert-bryndza/the-not-so-secret-emails-of-coco-pinchard|Coco
        Pinchard]] ter caído por terra e o interesse do seu agente se ter
        esgotado, Bryndza muda-se de Los Angeles para ir viver com a mãe do
        marido, Ján, no pequeno apartamento dela na Eslováquia, naquilo a que
        chamou "um momento muito baixo" - prestes a desistir de escrever e a
        começar a procurar trabalho como professor de inglês. Ján convence-o
        a escrever, em vez disso, sobre o ano que passaram em Hollywood;
        Bryndza escreve-o em inglês entre outubro e dezembro de 2011,
        trabalhando todos os dias, enquanto Ján o traduz para eslovaco em
        paralelo, de forma que, pelo Natal, o casal tem, na prática, dois
        manuscritos do mesmo livro. Na terça-feira, 17 de janeiro de 2012, a
        fazer uma tosta de queijo e a ensaiar para uma entrevista pelo Skype
        para um emprego numa escola de línguas no dia seguinte, Bryndza é
        avisado de que uma editora eslovaca quer o livro: torna-se
        [[work:robert-bryndza/bitch-hollywood|Bitch Hollywood]], publicado em
        tradução eslovaca como Mrcha Hollywood nesse março, o pequeno
        adiantamento a dar-lhe tempo para recusar o emprego de professor e
        autopublicar o caminho até à carreira.

    - id: bryndza-erika-foster-idea-2015
      title: Um álbum de Kate Bush e um rosto sob o gelo
      description: >
        Bryndza sempre quis escrever um romance policial e lê pouco mais do
        que isso, mas passa os anos de comédia romântica autopublicada a
        dizer a entrevistadores que há de lá chegar. A imagem que dá origem a
        [[work:robert-bryndza/the-girl-in-the-ice|A Rapariga no Gelo]]
        remonta a alguns anos antes, a ouvir o álbum de Kate Bush 50 Words
        for Snow: "surgiu-me na cabeça a imagem de estar de pé num lago
        gelado, a raspar a neve, e a ver o rosto de uma rapariga a olhar para
        mim de baixo do gelo." A personagem da inspetora Erika Foster passa
        "os últimos anos" a ganhar forma em apontamentos que ele não pára de
        rabiscar, e em 2015 decide finalmente escrever o livro: "sempre quis
        escrever um thriller policial, e percebi que, se não o fizesse em
        breve, nunca o faria." É a sua primeira incursão no género e o seu
        primeiro livro com uma editora tradicional, a Bookouture, depois de
        quatro anos a autopublicar Coco Pinchard.
