# Português europeu (pt-PT) - bio. Stub de colaborador, sem lifeEvents.

- id: ramalho-ortigao
  bio: >
    Escritor e crítico português, professor de Eça de Queirós no Colégio da
    Lapa, no Porto, antes de se tornar seu amigo para toda a vida e, em
    1870, co-autor de
    [[work:eca-de-queiros/o-misterio-da-estrada-de-sintra|O Mistério da
    Estrada de Sintra]], considerado o primeiro romance policial português.
    A partir de 1871, os dois escreveram também juntos o mensário satírico
    As Farpas; a contribuição de Eça terminou em 1872, e Ortigão continuou-o
    sozinho até 1882. Esteve presente na morte de Eça, em 1900.
