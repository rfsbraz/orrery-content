# Português europeu (pt-PT). "id" e "name" nunca se traduzem (nome
# próprio). Referências a The Woman in the Window - incluídas as menções em
# prosa corrida, fora das referências inline work:id - usam o título da edição
# portuguesa real, "A Mulher à Janela" (editions.yaml, Editorial Presença,
# trad. Maria João Lourenço); End of Story não tem edição portuguesa e
# mantém-se em inglês em todas as ocorrências. "Rear Window" e "Gaslight"
# mantêm-se também em inglês: nenhuma fonte consultada nesta ala regista um
# título de distribuição português para nenhum dos dois filmes.
#
# PESSOA VIVA. Os dois lifeEvents de 2013 e 2019 tratam de um historial de
# saúde fabricado, documentado e publicamente noticiado, de uma pessoa
# viva. A tradução segue o mesmo registo factual e sem juízo de valor do
# original inglês: todo o discurso direto atribuído a uma pessoa nomeada
# (Mallory, Craig Raine, o seu psiquiatra, o Guardian) mantém-se em inglês,
# tal como foi dito, e a prosa envolvente traduz apenas o que a fonte
# relata, sem adjetivar além do que o inglês já adjetiva.
- id: aj-finn
  bio: >
    Pseudónimo de Daniel Mallory, autor norte-americano de thrillers
    psicológicos. Nasceu em 1979 e cresceu em
    Charlotte, na Carolina do Norte, onde frequentou a Charlotte Latin
    School; licenciou-se em Inglês na Universidade Duke e completou depois
    um mestrado na Universidade de Oxford. Trabalhou vários anos na edição
    em Nova Iorque e em Londres, nomeadamente na Little, Brown and Company
    e na William Morrow, a chancela da HarperCollins que viria a publicar
    os seus próprios romances. A sua estreia,
    [[work:aj-finn/the-woman-in-the-window|A Mulher à Janela]] (2018),
    inspira-se explicitamente em Rear Window, de Hitchcock, e no filme
    Gaslight, entrou no número um da lista de mais vendidos do New York
    Times, e foi adaptada a um filme de 2021 com Amy Adams, Julianne Moore
    e Gary Oldman. Em fevereiro de 2019, uma investigação da New Yorker
    noticiou anos de alegações fabricadas sobre a sua própria saúde,
    formação académica e família na sua biografia, que atribuiu a
    perturbação bipolar tipo II; o enredo do romance foi também alvo de
    escrutínio da imprensa nesse mesmo mês por semelhanças com outro
    thriller, refutadas em poucos dias com base no seu próprio esboço, já
    existente antes disso. O seu segundo romance,
    [[work:aj-finn/end-of-story|End of Story]] (2024), passa-se em São
    Francisco. Assumidamente gay, dedicou o seu primeiro romance ao
    namorado que tinha na altura.
  lifeEvents:
    - id: ajf-born-1979
      title: Nasce em 1979, cresce em Charlotte, na Carolina do Norte
      description: >
        Nasceu em 1979, filho de Pamela e John
        Mallory; o avô materno, John Barton Poor, tinha presidido à R.K.O.
        General, dona de uma cadeia de estações de televisão e rádio. A
        família viveu em Garden City, em Long Island, antes de se mudar
        para a Virgínia e depois, quando ele tinha cerca de nove anos, para Charlotte, na
        Carolina do Norte, onde cresceu ao lado do irmão John ("Jake") e de
        duas irmãs, Hope e Elizabeth, e frequentou a escola privada
        Charlotte Latin School. A família passava os verões em Amagansett,
        em Long Island, onde a mãe manteve sempre uma casa.

    - id: ajf-jake-surgery-emails-2013
      title: E-mails assinados pelo irmão descrevem uma cirurgia a que só ele assistiu
      description: >
        A 14 de fevereiro de 2013, um e-mail enviado a contactos da edição
        nova-iorquina, assinado "Jake" - o nome pelo qual é conhecido o
        irmão real, vivo, de Mallory, John Mallory - descrevia Dan a ser
        submetido a uma cirurgia não planeada, durante a noite, com sete
        horas de duração, para remoção de um tumor, com grande perda de
        sangue e duas transfusões. Mais e-mails de "Jake" nas semanas
        seguintes relataram uma drenagem lombar, uma reação alérgica a um
        analgésico e uma paragem cardíaca, antes de Dan retomar a escrita
        em nome próprio, referindo-se a Vicodin e a uma ferida em
        cicatrização. Os e-mails colocavam Jake junto à cama de Dan, em
        Nova Iorque, ao longo de todo o período; nessa mesma semana, a
        noiva de Jake publicou no Facebook uma fotografia profissional
        "pré-casamento" do casal (viriam a casar-se ainda nesse ano), e um
        dos destinatários viria a supor, mais tarde, que "something crazy
        was going on." A investigação da New Yorker de 2019 noticiou que
        vários destinatários passaram a suspeitar que "Jake" era o próprio
        Dan a escrever como se fosse ele; através de um porta-voz, Mallory
        disse não ser o autor dos e-mails de "Jake." O padrão não se
        limitou a este único episódio: um antigo colega contou, em
        separado, ao Guardian que, enquanto Mallory trabalhou na Little,
        Brown em Londres (2009-2012), tinha dito no escritório que tinha
        cancro no cérebro, e que também ele tinha recebido e-mails de um
        "irmão Jake" a descrever a sua doença, antes de começar a
        suspeitar que não era verdade.

    - id: ajf-auction-identity-revealed-2016
      title: A sua identidade é revelada a meio do leilão; a maioria dos licitantes desiste, o seu próprio empregador não
      description: >
        A meio do leilão de dois livros por "A Mulher à Janela" em 2016, a
        identidade do autor que escrevia como A. J. Finn - Dan Mallory, à
        data um editor em atividade e não alguém de fora do meio - foi
        revelada às editoras licitantes, e a maioria retirou-se. A
        investigação de Ian Parker na New Yorker, em 2019, noticiou que
        isto refletia "an industry-wide unease with Mallory," acumulado ao
        longo de uma década na edição em Londres e Nova Iorque, um
        mal-estar que nunca se tinha tornado público. Isso não impediu a
        William Morrow, à data empregadora do próprio Mallory, de
        continuar a licitar e de comprar o livro, num negócio noticiado em
        dois milhões de dólares por dois livros.

    - id: ajf-new-yorker-trail-of-deceptions-2019
      title: "Uma investigação da New Yorker, e uma admissão: não havia cancro"
      description: >
        A 4 de fevereiro de 2019, a New Yorker publicou "A Suspense
        Novelist's Trail of Deceptions," de Ian Parker, noticiando anos de
        episódios em que Mallory tinha afirmado, ou deixado colegas,
        professores e leitores acreditarem, que tinha cancro, um tumor
        cerebral, um doutoramento em Oxford (completou aí um mestrado em
        2004, mas nunca submeteu uma tese de doutoramento), e uma mãe e um
        irmão que tinham morrido - quando, na realidade, os pais e os três
        irmãos estavam, como a revista confirmou, todos vivos nessa altura.
        O padrão tinha raízes reais: um ensaio de 1999 no Duke Chronicle,
        em que o próprio Mallory descrevia ter escrito às faculdades sobre
        o cancro real, então atual, da mãe, para obter simpatia quanto às
        suas notas - uma doença verdadeira, confirmada pela própria
        reportagem de Parker, que ele explorou em vez de inventar - e que
        se transformou em fabricação pura numa declaração pessoal
        apresentada com a candidatura ao doutoramento em Oxford, que
        descrevia a morte da mãe por cancro e a morte do irmão por fibrose
        quística, nenhuma das quais tinha acontecido; o seu tutor, Craig
        Raine, que tinha tomado o ensaio por verdadeiro, soube por Parker
        que a mãe de Mallory estava viva e respondeu, "If she's alive, he
        lied." Através
        de um assessor de imprensa, Mallory emitiu uma declaração
        reconhecendo que tinha "stated, implied, or allowed others to
        believe" que tinha cancro em vez de uma doença psicológica,
        atribuindo o padrão a uma perturbação bipolar tipo II grave,
        diagnosticada em 2015, e às "crushing depressions, delusional
        thoughts, morbid obsessions, and memory problems" que esta lhe
        causava. O seu próprio psiquiatra confirmou o diagnóstico à
        revista, mas descreveu apenas "somatic complaints, fears, and
        preoccupations" em torno do cancro, não mortes fabricadas;
        psiquiatras entrevistados para o artigo, incluindo Nigel Blackwood,
        do King's College London, disseram que a condição não explica, por
        si só, um padrão sustentado de engano em proveito próprio como
        este. O Guardian corroborou de forma independente elementos
        centrais nessa mesma semana, a partir de fontes próprias na Little,
        Brown, onde Mallory tinha trabalhado entre 2009 e 2012, incluindo o
        facto de ter dito a colegas ali que tinha cancro no cérebro.
