# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Nenhum dos dois títulos citados tem edição portuguesa
# verificada nesta ala, por isso mantêm-se em inglês.

- id: mike-lupica
  bio: >
    Mike Lupica é um jornalista desportivo e romancista norte-americano,
    durante muito tempo colunista do New York Daily News e comentador
    regular do programa The Sports Reporters, da ESPN, desde 1988. Para
    além do jornalismo, escreveu romances desportivos para adultos e jovens
    leitores, incluindo Travel Team e Heat, e coescreveu autobiografias com
    figuras como Reggie Jackson e Bill Parcells. Coescreveu seis livros com
    James Patterson, de
    [[work:james-patterson/the-horsewoman|The Horsewoman]] (2022) a
    [[work:james-patterson/the-country-road-murders|The Country Road
    Murders]] (2026).
