# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Run, Rose, Run não tem edição portuguesa verificada nesta ala,
# por isso o título mantém-se em inglês.

- id: dolly-parton
  bio: >
    Dolly Parton é uma cantora e compositora norte-americana, uma das
    artistas mais bem-sucedidas da história da música country, com êxitos
    como "Jolene", "9 to 5" e "I Will Always Love You" (mais tarde uma
    versão número um de Whitney Houston). Venceu onze Grammy Awards e é
    proprietária do parque temático e resort Dollywood, no Tennessee, além
    de dirigir uma fundação de longa data dedicada à literacia. Em 2022
    coescreveu o thriller
    [[work:james-patterson/run-rose-run|Run, Rose, Run]] com James
    Patterson e lançou um álbum de estúdio homónimo como acompanhamento.
