# Português europeu (pt-PT) - bio + prosa dos lifeEvents (title + description).
# Os lifeEvents ficam aninhados sob o autor e fundem-se por id; datas, impact,
# organisation, illustration_type, images_required e sources nunca se
# traduzem, nem o nome do autor.
#
# CITAÇÕES ORIGINAIS. Este autor é um caso pouco comum: a base inglesa já cita
# extensamente em português - títulos de poemas, e falas diretas de Ramalho
# Ortigão, Teófilo Braga, Sousa Martins e do próprio Verde (cartas, versos) -
# com glosa inglesa ao lado para o leitor de língua inglesa. Essas citações
# portuguesas mantêm-se aqui exatamente como na base, sem retradução; a glosa
# inglesa que as acompanha (uma explicação entre parêntesis do que a citação
# já diz) foi omitida em vez de traduzida, por ser redundante para um leitor
# que já lê a citação em português - decisão editorial, não uma prosa em
# falta. É o caso mais visível em cesario-verde-ortigao-review-1874: a
# citação real "seja menos verde e mais cesário" e a paráfrase hoje corrente
# "mais Cesário, menos Verde" mantêm-se ambas tal como na base, intactas.

- id: cesario-verde
  bio: >
    Nascido José Joaquim Cesário Verde na freguesia lisboeta da Madalena, o
    filho varão mais velho de um próspero comerciante de ferragens, José
    Anastácio Verde, e de Maria da Piedade David dos Santos;
    a família fazia remontar o seu nome a antepassados comerciantes
    genoveses de apelido Verdi. Cresceu entre a loja de ferragens da
    família, na Rua dos Fanqueiros, e uma pequena quinta em Linda-a-Pastora,
    Oeiras, uma divisão entre cidade e campo que se tornou o eixo definidor
    da sua poesia. Em 1873, aos dezoito anos, matriculou-se no Curso
    Superior de Letras da Universidade de Lisboa, que abandonou ao fim de
    poucos meses sem o concluir, e nesse mesmo ano publicou os seus
    primeiros poemas no Diário de Notícias - o início de cerca de uma
    década em que uns quarenta poemas seus apareceram dispersos por jornais
    e revistas de Lisboa (também no Diário da Tarde, na Tribuna, n'A
    Ilustração), quase sempre recebidos com indiferença crítica ou pior: a
    farpa de Ramalho Ortigão, em 1874, na revista As Farpas - segundo a
    qual o jovem poeta devia "seja menos verde e mais cesário", habitualmente
    parafraseada hoje como "mais Cesário, menos Verde" (um jogo com "verde"
    também no sentido de imaturo, inexperiente) - custou-lhe anos de mágoa,
    embora os dois se tenham tornado amigos mais tarde. Trabalhou sempre no
    negócio da família e, a partir de 1879, cansado da indiferença do mundo
    literário, foi-lhe dedicando cada vez mais tempo. A tuberculose já tinha
    levado a sua irmã mais velha, Maria Júlia, em 1872; a doença também o
    atingiu a ele, com os primeiros sintomas em 1877, e levou o seu irmão
    Joaquim Tomás em 1882 - as perdas que moldam o seu poema mais
    conhecido, "Nós". Morreu da mesma doença na freguesia lisboeta do
    Lumiar a 19 de julho de 1886, aos 31 anos, e está sepultado no jazigo
    da família no Cemitério dos Prazeres. Publicou quase nada em livro em
    vida: um anúncio de 1874 de um volume a publicar não deu em nada, e os
    poemas que lhe granjearam nome só chegaram aos leitores no ano
    seguinte, reunidos pelo seu amigo Silva Pinto em
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
    Verde]] - veja a entrada dessa própria obra para a história mais
    completa, e incerta, de quanto da sua forma é de Verde e quanto é de
    Silva Pinto. Viria a ser reivindicado como precursor direto pelos
    modernistas portugueses, sobretudo por Fernando Pessoa, cujos
    heterónimos Alberto Caeiro e Bernardo Soares o citam diretamente e cujo
    Álvaro de Campos é amplamente lido como continuador da sua linha.
  lifeEvents:
    - id: cesario-verde-born-1855
      title: Nasce na freguesia da Madalena, em Lisboa
      description: >
        Nasce José Joaquim Cesário Verde na freguesia da Madalena, no
        centro de Lisboa, o filho varão mais velho do comerciante de
        ferragens José Anastácio Verde e de Maria da Piedade David dos
        Santos. A família geria uma loja de ferragens na Rua dos
        Fanqueiros; a outra morada da família, uma pequena quinta em
        Linda-a-Pastora, Oeiras, entra-lhes na vida em 1857, quando um
        surto de cólera-morbo e febre amarela em Lisboa os leva a
        refugiar-se ali - o início da divisão entre cidade e campo que
        percorre toda a sua obra.

    - id: cesario-verde-sister-julia-death-1872
      title: A sua irmã Maria Júlia morre de tuberculose
      description: >
        A sua irmã Maria Júlia Verde (1853-1872) morre de tuberculose
        pulmonar, a doença que levará também o seu irmão Joaquim Tomás em
        1882 e o próprio Verde em 1886. A sua morte é a perda que o poema
        autobiográfico "Nós" (1884) nomeia diretamente.

    - id: cesario-verde-curso-superior-letras-1873
      title: Matricula-se no Curso Superior de Letras e conhece Silva Pinto
      description: >
        Matricula-se, aos dezoito anos, no Curso Superior de Letras da
        Universidade de Lisboa, que frequenta apenas alguns meses sem o
        concluir, e aí conhece o crítico Silva Pinto, que se torna seu
        amigo para toda a vida e, um ano após a sua morte, o editor de
        [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
        Verde]]. Nesse mesmo ano publica os seus primeiros poemas no Diário
        de Notícias, o início de cerca de uma década de poemas dispersos
        pela imprensa lisboeta.

    - id: cesario-verde-ortigao-review-1874
      title: A farpa de Ramalho Ortigão, "mais Cesário, menos Verde"
      description: >
        O seu poema de 1874, "Esplêndida" - publicado a 22 de março no
        Diário de Notícias sob o título geral "Fantasias do Impossível",
        ao lado de "Caprichos" e "Arrojos" - desencadeia um verdadeiro
        escândalo literário pelo seu "baudelairianismo". O crítico e
        cronista social Ramalho Ortigão ataca-o na revista satírica As
        Farpas, dizendo ao jovem poeta, nas suas próprias palavras, que
        "seja menos verde e mais cesário" (um duplo trocadilho com o seu
        apelido e o seu próprio nome próprio), uma farpa habitualmente
        parafraseada hoje como "mais Cesário, menos Verde". Fialho de
        Almeida, que mais tarde se tornaria um dos seus admiradores,
        também o alfineta nessa altura, e Teófilo Braga acrescenta que um
        poeta moderno "devia ser trabalhador, forte e digno e não devia
        rebaixar-se assim". Diz-se que Verde levou a farpa a peito e se
        queixou durante anos da indiferença do mundo literário à sua obra;
        ele e Ortigão viriam, mais tarde, a tornar-se amigos pessoalmente.
        Nesse mês de dezembro, é anunciada no jornal A República (27 de
        dezembro) uma edição dos seus poemas em livro, que nunca chega a
        concretizar-se, nem então nem depois - o mais perto que chega, em
        vida, de um livro, antes de
        [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
        Verde]].

    - id: cesario-verde-tuberculosis-onset-1877
      title: Primeiros sintomas da tuberculose que o vai matar
      description: >
        Mostra os primeiros sintomas de tuberculose pulmonar, a doença que
        já tinha matado a sua irmã Maria Júlia em 1872 e que mataria o seu
        irmão Joaquim Tomás em 1882, antes de o matar a ele em 1886. Os
        seus biógrafos associam os anos a seguir a 1877 a uma quebra
        acentuada na sua produção, a par de um desencanto crescente com a
        receção da sua poesia: numa carta a Macedo Papança em 1880, depois
        de [[work:cesario-verde/o-sentimento-dum-ocidental|"O Sentimento
        dum Ocidental"]] ter passado quase em silêncio absoluto, queixa-se
        de que o poema "não obteve um olhar, um sorriso, um desdém, uma
        observação",
        e de que a própria Lisboa, ao lado do seu passado glorioso,
        "parece um cadáver de cidade".

    - id: cesario-verde-brother-joaquim-death-1882
      title: O seu irmão Joaquim Tomás morre de tuberculose
      description: >
        O seu irmão Joaquim Tomás Verde (1858-1882) morre da mesma
        tuberculose pulmonar que já tinha matado a irmã de ambos, Maria
        Júlia, uma década antes, e que o próprio Verde já trazia consigo,
        a 20 de março, aos 24 anos. Junto com a morte de Maria Júlia, esta
        é a dupla perda de que nasce "Nós" (1884).

    - id: cesario-verde-death-1886
      title: Morre de tuberculose no Lumiar, aos 31 anos
      description: >
        Em maio, o médico Sousa Martins diz a Silva Pinto que o poeta está
        "irremediavelmente perdido". Numa carta a Macedo Papança, a 16 de
        junho, semanas antes do fim, Verde admite abertamente o seu medo:
        "Mas subitamente chegam-me dúvidas, descrenças, terrores do
        futuro. Curo-me? Sim, talvez." Morre da mesma tuberculose pulmonar
        às 5 da manhã de 19 de julho, aos 31 anos, no Largo de São
        Sebastião n.º 64, na freguesia lisboeta do Lumiar, depois de ter
        passado as últimas semanas em Caneças na esperança de uma cura; as
        suas últimas palavras, registadas pelo irmão Jorge Verde - por
        essa altura o único filho de Anastácio Verde ainda vivo -, foram
        "Não quero nada, deixa-me dormir". A sua morte passa quase
        despercebida: o próprio necrológio do Jornal do Comércio afirma
        sem rodeios que "Cesário Verde morre quase ignorado", e só o
        Correio da Manhã e A Imprensa publicam um necrológio com alguma
        extensão. É sepultado no jazigo da família Verde, no Cemitério dos
        Prazeres, tendo publicado quase nada em livro. Menos de um ano
        depois, o seu amigo Silva Pinto reúne os seus poemas dispersos em
        [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
        Verde]], o livro que fará a sua reputação.
