# Português europeu (pt-PT). Coautora sem franquia própria - referenciada a
# partir da ala Margaret Atwood (For the Birds, 1990).
- id: shelly-tanaka
  bio: >
    Autora e editora canadiana de literatura infantil, natural de Toronto,
    nipo-canadiana de terceira geração; editora de ficção na Groundwood
    Books desde 1983 e autora de mais de vinte livros infantis e juvenis.
    Escreveu [[work:margaret-atwood/for-the-birds|Entre Gatos e Pássaros]]
    (1990) com Atwood; a capa dessa edição credita-a como "Shelly Tanaka."
