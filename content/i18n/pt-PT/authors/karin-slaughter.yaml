# Overlay pt-PT do autor: bio + prosa dos lifeEvents.
# Os lifeEvents ficam aninhados sob o autor e são fundidos por id (ver
# SCHEMA.md, "Nested lists merge by id"). Levam `title` + `description`, que
# são prosa; datas, impact e sources nunca se traduzem, nem o nome do autor.
# Karin Slaughter não tem edições portuguesas registadas, por isso os títulos
# de obras citados na prosa ficam em inglês.
- id: karin-slaughter
  bio: >
    Escritora norte-americana de ficção policial, nascida em Covington, na
    Geórgia, e criada em Lake Spivey. Andou na Morrow High School, estudou
    literatura na Georgia State University sem terminar o curso e escreveu a
    estreia, [[work:karin-slaughter/blindsighted|Blindsighted]], em três meses.
    Publicada em cerca de 120 países, com mais de 40 milhões de exemplares
    vendidos, escreve três séries em curso - Grant County,
    [[character:karin-slaughter/will-trent|Will Trent]] e North Falls - a par
    de meia dúzia de thrillers independentes, e vive em Atlanta. Fundou a Save
    the Libraries, uma organização sem fins lucrativos de apoio às bibliotecas
    públicas norte-americanas.
  lifeEvents:
    - id: karin-slaughter-childhood-macabre
      title: Uma infância a ler numa biblioteca da Geórgia
      description: >
        Nascida em Covington, na Geórgia, e criada na zona de Lake Spivey, a
        sul de Atlanta, filha de um vendedor de carros usados e (pela madrasta)
        de uma gerente bancária, com uma tia-madrasta que foi chefe de detetives
        de Forest Park. Já contou ter colado as fotografias da autópsia da morte
        de Marilyn Monroe dentro da lancheira, no quinto ano, e escrever
        histórias em que alguém morria sempre, ao ponto de uma professora de
        inglês do nono ano lhe sugerir que não matasse todas as personagens;
        atribui ao gosto do pai pelos filmes de terror o cultivar desse
        interesse, e à biblioteca pública de Jonesboro, onde a mãe deixava os
        filhos quase todos os sábados, o alimentá-lo.

    - id: karin-slaughter-agent-and-first-deal-2000
      title: Um romance inédito torna-se carreira, por conselho de outra pessoa
      description: >
        Slaughter tinha por meta um contrato editorial até aos trinta e passou
        anos a escrever um romance histórico, "Spit in One Hand", passado no Sul
        esclavagista anterior à Guerra Civil. Nunca foi publicado, mas chegou à
        secretária da agente literária de Manhattan Victoria Sanders (que
        representa também o espólio de Zora Neale Hurston), que lhe reconheceu
        verdadeiro talento mas não conseguia vender ficção histórica naquele
        mercado e lhe sugeriu que tentasse antes um thriller. Slaughter escreveu
        o primeiro rascunho de [[work:karin-slaughter/blindsighted|Blindsighted]]
        em três meses; o manuscrito, apresentado como "um cruzamento entre a
        série do Hannibal Lecter de Thomas Harris e os mistérios da Kay Scarpetta
        de Patricia Cornwell", foi vendido num contrato de três livros à William
        Morrow por um valor na casa das centenas de milhares de dólares,
        noticiado pela Variety sob o título "Morrow, Slaughter Ink Killer Book
        Deal". Tinha vinte e nove anos. Tudo o que publicou desde então com o seu
        nome - três séries e a contar - decorre dessa mudança de rumo.

    - id: karin-slaughter-save-the-libraries-2010
      title: Funda a Save the Libraries
      description: >
        Numa reunião da American Library Association, Slaughter, já defensora das
        bibliotecas, ouviu bibliotecários de todo o país falar das enormes
        dificuldades das bibliotecas públicas e ficou impressionada com a
        estatística de que 80 por cento das crianças das zonas rurais dependiam
        da biblioteca local como único acesso a livros e à internet. A 10 de
        setembro de 2010, o Atlanta Journal-Constitution publicou o seu artigo de
        opinião "Fight for Libraries as You Do Freedom", em que recordava como o
        próprio pai, ele mesmo pouco leitor, a levava em criança à biblioteca de
        Jonesboro e a deixava ler tudo o que lá houvesse, desde que falasse com
        ele sobre o que lia. Fundou a Save the Libraries nesse mesmo ano, com um
        piloto no sistema de bibliotecas públicas do condado de DeKalb (Geórgia);
        o fundo já angariou mais de 300 000 dólares para esse sistema.
