# Overlay pt-PT do autor: apenas `bio` (prosa). Entidade de coautor magra
# por desenho (ver o cabeçalho do ficheiro base): sem lifeEvents, pelo que
# não há nada mais a fundir aqui. Este ficheiro pertence a nenhuma franquia
# por si só - existe apenas para que a referência withAuthorIds de
# john-grisham/framed resolva - mas fica fora da estante de John Grisham, daí
# a sua própria entrada de cobertura.
# Título de obra citado usa o original inglês: nenhuma edição pt-PT está
# registada para Framed (ver o cabeçalho de
# content/franchises/john-grisham/editions.yaml) - nunca um título
