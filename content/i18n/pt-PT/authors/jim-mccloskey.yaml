- id: jim-mccloskey
  bio: >
    Investigador e ministro religioso norte-americano, nascido em Havertown,
    Pensilvânia. Deixou uma carreira em consultoria de gestão em 1979 para
    frequentar o Princeton Theological Seminary; enquanto servia como
    capelão estagiário na prisão estadual de Trenton, convenceu-se da
    inocência de um recluso a cumprir prisão perpétua e ajudou a
    libertá-lo. Ao formar-se, em 1983, fundou a Centurion Ministries, a
    primeira organização dedicada a libertar condenados injustamente, e
    lidera o seu trabalho desde então. Coescreveu
    [[work:john-grisham/framed|Framed]] (2024) com John Grisham, reunindo
    histórias reais de condenação injusta a partir do próprio trabalho de
    casos da Centurion.
