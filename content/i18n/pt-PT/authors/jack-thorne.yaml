- id: jack-thorne
  bio: >
    Dramaturgo e argumentista britânico. Escreveu o texto publicado de
    [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter e a
    Criança Amaldiçoada]] (2016) a partir de uma história que originou em
    conjunto com [[author:jk-rowling|J. K. Rowling]] e o encenador
    [[author:john-tiffany|John Tiffany]]; a própria ficha de créditos da
    Wikipédia é explícita ao dizer que a peça é "escrita por Jack Thorne a
    partir de uma história original de Thorne, J. K. Rowling e John
    Tiffany" - a prosa do texto é só dele.
