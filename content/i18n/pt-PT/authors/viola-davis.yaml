# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Judge Stone não tem edição portuguesa verificada nesta ala,
# por isso o título mantém-se em inglês.

- id: viola-davis
  bio: >
    Viola Davis é uma atriz norte-americana e uma das poucas artistas a
    atingir o estatuto EGOT (Emmy, Grammy, Óscar e Tony), a primeira atriz
    negra a fazê-lo. Venceu o Óscar de Melhor Atriz Secundária por Fences
    (2016), um Emmy por How to Get Away with Murder e dois Tony Awards por
    produções teatrais de August Wilson. Coescreveu o thriller
    [[work:james-patterson/judge-stone|Judge Stone]] (2026) com James
    Patterson.
