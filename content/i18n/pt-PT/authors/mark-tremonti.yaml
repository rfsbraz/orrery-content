# Portuguese (pt-PT) overlay for the co-author bio. `name`, `aka` and `sources`
# are never translated. The novel keeps its English title: it has no published
# Portuguese edition, and none of this author's work does.

- id: mark-tremonti
  bio: >
    Guitarrista e cantor norte-americano, conhecido pelas bandas de rock Creed
    e Alter Bridge e pela sua própria banda, Tremonti. Escreveu o romance
    [[work:john-shirley/a-dying-machine|A Dying Machine]] em coautoria com
    John Shirley, adaptando a história do álbum conceptual do mesmo nome.
