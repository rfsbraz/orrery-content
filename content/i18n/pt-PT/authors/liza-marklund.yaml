# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). The Postcard Killers não tem edição portuguesa verificada
# nesta ala, por isso o título mantém-se em inglês.

- id: liza-marklund
  bio: >
    Liza Marklund é uma jornalista e romancista sueca, conhecida sobretudo
    pela série Annika Bengtzon, sobre uma jornalista de um tabloide de
    Estocolmo, publicada em cerca de quarenta línguas. O seu romance de
    estreia, The Bomber (1998), venceu o Prémio Poloni para o melhor
    romance policial sueco escrito por uma mulher, e foi a segunda autora
    sueca, depois de Stieg Larsson, a alcançar o primeiro lugar na lista de
    bestsellers do New York Times. Coescreveu
    [[work:james-patterson/the-postcard-killers|The Postcard Killers]]
    (2010) com James Patterson.
