# Overlay pt-PT do autor: bio + prosa dos lifeEvents.
# Os lifeEvents ficam aninhados sob o autor e são fundidos por id (ver
# SCHEMA.md, "Nested lists merge by id"). Levam `title` + `description`, que
# são prosa; datas, impact e sources nunca se traduzem, nem o nome do autor.
# Killing Floor -> "Do Fundo do Abismo" (edição portuguesa, editions.yaml);
# The Sentinel não tem edição em português e fica no título original.
- id: lee-child
  bio: >
    Pseudónimo de James Dover Grant CBE, autor britânico da série de
    thrillers [[franchise:lee-child|Jack Reacher]]. Nasceu em Coventry,
    Inglaterra, e cresceu em Birmingham; estudou Direito na Universidade de
    Sheffield sem intenção de exercer. Passou entre 1977 e 1995 na
    televisão comercial britânica, na Granada, a trabalhar em produções
    como Prime Suspect e Cracker, até ser despedido numa reestruturação da
    empresa. Começou a escrever o que viria a ser
    [[work:lee-child/killing-floor|Do Fundo do Abismo]] no mês em que soube
    que o seu emprego ia acabar; a publicação do romance em 1997 e a série
    Reacher que se seguiu tornaram-no um dos autores de thrillers mais
    vendidos em língua inglesa. Mudou-se para os Estados Unidos em 1998 e
    regressou ao Reino Unido em 2025. Anunciou em janeiro de 2020 que se ia
    retirar da escrita da série, entregando-a ao irmão mais novo e também
    romancista Andrew Grant, sob o novo pseudónimo
    [[author:andrew-child|Andrew Child]]; os dois escrevem juntos todos os
    romances de Reacher desde então.
  lifeEvents:
    - id: lee-child-names-origin
      title: O pseudónimo e o nome da personagem, ambos piadas de família
      description: >
        O pseudónimo de Grant vem de uma pronúncia errada do "Le Car" da
        Renault como "Lee Car", que se tornou uma piada recorrente na
        família; a sua filha Ruth passou, por conseguinte, a ser "Lee
        Child." O nome de Jack Reacher tem uma origem semelhante: numa ida
        às compras com a mulher, Jane, esta brincou que a sua altura
        significava que ele podia sempre arranjar emprego como "reacher"
        ("aquele que alcança") num supermercado, a apanhar coisas nas
        prateleiras mais altas, caso a escrita não resultasse.

    - id: lee-child-killing-floor-written-1994
      title: Começa Do Fundo do Abismo no mês em que o seu emprego é extinto
      description: >
        Ao saber, em agosto de 1994, que o seu emprego na televisão ia ser
        extinto numa reestruturação, Grant começa um romance nesse mesmo
        setembro, antes de o despedimento produzir efeitos em junho
        seguinte. O manuscrito, reformulado por sugestão do agente e da
        editora de uma história sobre dinheiro da droga para uma sobre
        contrafação, torna-se
        [[work:lee-child/killing-floor|Do Fundo do Abismo]] - publicado em
        março de 1997 e o início de todo o projeto Reacher. Desde então,
        começa sempre cada novo livro da série no aniversário desse
        primeiro.

    - id: lee-child-cwa-diamond-dagger-2013
      title: Vence o Diamond Dagger da CWA por uma carreira na escrita policial
      description: >
        Dezassete romances volvidos na série, a Crime Writers' Association
        atribui a Grant o seu Diamond Dagger, patrocinado pela Cartier, a
        mais alta distinção da escrita policial britânica para uma
        carreira, e não para um único livro. Recebe-o no Gala Awards Dinner
        da CWA, em Londres, a 15 de julho de 2013, ano do jubileu de
        diamante da associação, entregue por Frederick Forsyth, vencedor do
        ano anterior.

    - id: lee-child-hands-reacher-to-andrew-2020
      title: Anuncia que se retira e entrega Reacher ao irmão
      description: >
        Grant anuncia que se vai retirar da escrita da série Jack Reacher e
        entregá-la ao irmão mais novo, o romancista Andrew Grant, que a vai
        escrever sob o novo apelido "Child." Os dois escrevem juntos os
        romances de transição antes de uma passagem de testemunho completa
        já planeada. É esta a razão pela qual todos os romances de Reacher
        a partir de [[work:lee-child/the-sentinel|The Sentinel]] (2020)
        trazem dois nomes na capa em vez de um.
