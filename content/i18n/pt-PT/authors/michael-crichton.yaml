# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Eruption não tem edição portuguesa verificada nesta ala, por
# isso o título mantém-se em inglês.

- id: michael-crichton
  bio: >
    Michael Crichton foi um autor e cineasta norte-americano conhecido por
    thrillers científicos de grande rigor documental, muitos dos quais
    adaptou ele próprio para o cinema. Formou-se em Medicina em Harvard, em
    1969, antes de se dedicar à escrita a tempo inteiro. Entre os seus
    romances contam-se The Andromeda Strain (1969) e Jurassic Park (1990), e
    criou a série de televisão ER; vários dos seus livros tornaram-se
    grandes filmes que também escreveu ou realizou. Morreu em Los Angeles,
    em 2008. James Patterson terminou
    [[work:james-patterson/eruption|Eruption]] (2024) a partir de um
    manuscrito incompleto encontrado no espólio de Crichton após a sua
    morte, publicando-o como uma colaboração póstuma.
