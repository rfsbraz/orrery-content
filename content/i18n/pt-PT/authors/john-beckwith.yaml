# Português europeu (pt-PT). Coautor sem franquia própria - só é referenciado
# a partir da ala Margaret Atwood (The Trumpets of Summer, 1964); coberto
# aqui pela mesma razão que o SKILL.md desta fase assinala: um coautor sem
# franquia própria não tem dono e fica facilmente esquecido.
- id: john-beckwith
  bio: >
    Compositor e académico canadiano, nascido em Victoria, na Colúmbia
    Britânica; na Faculdade de Música da Universidade de Toronto desde 1952
    (diretor entre 1970 e 1977) e uma das maiores autoridades em música
    canadiana. Compôs a música de
    [[work:margaret-atwood/the-trumpets-of-summer|The Trumpets of Summer]]
    (1964) sobre texto de Atwood, encomendado pela CBC para o quarto
    centenário de Shakespeare.
