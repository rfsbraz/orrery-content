# Tradução pt-PT. bio + lifeEvents (título e descrição); as datas, o impacto
# e as fontes nunca se traduzem. As listas encaixadas fundem-se pelo id (ver
# SCHEMA.md), pelo que cada lifeEvent traz apenas id/title/description. O
# lifeEvent almeida-garrett-frei-luis-de-sousa-own-household-1843 é o único
# gated por `spoilerAfter: almeida-garrett/frei-luis-de-sousa` na base;
# spoilerAfter é estrutura, não prosa, e não precisa de sobreposição aqui.
# A descrição gated nomeia o mecanismo do terceiro ato (a anulação
# retroativa do segundo casamento, a ilegitimidade da filha); a descrição
# do lifeEvent ungated de 1841, ao lado, dá só a biografia (a morte de
# Adelaide, a filha legitimada), nunca o mecanismo da peça.

- id: almeida-garrett
  bio: >
    Nasceu João Leitão da Silva no Porto, a 4 de fevereiro de 1799, segundo
    filho de um funcionário aduaneiro; criou-se sobretudo na Quinta do
    Sardão do avô materno, do outro lado do rio, em Vila Nova de Gaia
    ("Nasci no Porto, mas criei-me em Gaia," escreveria mais tarde), e
    depois, a partir de 1809, nos Açores, para onde a família fugiu da
    segunda invasão francesa e onde o tio, futuro bispo de Angra, foi seu
    preceptor. Estudou Direito na Universidade de Coimbra a partir de
    1816, entrou numa loja maçónica de estudantes e, em 1818, fixou
    definitivamente o apelido Almeida Garrett (Almeida da avó materna,
    Garrett da avó paterna, nascida em Madrid). Processado, e absolvido,
    em 1822, por causa do poema libertino
    [[work:almeida-garrett/o-retrato-de-venus|O Retrato de Vénus]] (1821).
    Casou com Luísa Midosi, de catorze anos, em novembro de 1822; o
    casamento terminou em separação em 1836. Exilado em Inglaterra depois
    do golpe da Vilafrancada de 1823, aí conheceu Shakespeare, Walter
    Scott e as ruínas góticas, antes de seguir para França, onde escreveu
    [[work:almeida-garrett/camoes|Camões]] (1825) e
    [[work:almeida-garrett/dona-branca|Dona Branca]] (1826), geralmente
    tidas como as primeiras obras do Romantismo literário português.
    Exilado uma segunda vez em 1828, sob o rei absolutista D. Miguel,
    juntou-se à causa liberal em armas: ao lado de Alexandre Herculano,
    participou no Desembarque do Mindelo e no Cerco do Porto de 1832 como
    voluntário no Batalhão Académico. Com a vitória liberal, entrou na
    vida pública, fazendo campanha por, e conseguindo, a criação de um
    teatro nacional e de um conservatório de arte dramática (a instituição
    hoje o Teatro Nacional D. Maria II), e servindo repetidamente como
    deputado, tornando-se um dos oradores parlamentares mais destacados da
    época. A sua companheira a partir de 1836, Adelaide Deville Pastor,
    morreu em 1841 após o nascimento da filha de ambos, Maria Adelaide,
    legitimada no ano seguinte; a perda, e a situação legal em que deixou
    a criança, alimentou diretamente
    [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]] (1844).
    Feito 1.º Visconde de Almeida Garrett pela rainha D. Maria II a 25 de
    junho de 1851 (ver a nota de cabeçalho deste ficheiro, que resolve o
    par data/monarca face à própria cronologia da Biblioteca Nacional),
    serviu alguns meses no ano seguinte, 1852, como ministro dos Negócios
    Estrangeiros. O seu último livro de poesia concluído,
    [[work:almeida-garrett/folhas-caidas|Folhas Caídas]] (1853), foi
    escrito para Rosa de Montúfar, nobre espanhola que se tornou sua
    companheira nos últimos anos de vida. Morreu de cancro generalizado de
    origem hepática em Lisboa, a 9 de dezembro de 1854; sepultado no
    Cemitério dos Prazeres, os seus restos mortais foram transladados em
    1903 para o Mosteiro dos Jerónimos, e de novo, em dezembro de 1966,
    para o recém-concluído Panteão Nacional, na Igreja de Santa Engrácia,
    onde hoje repousam (ver a nota de cabeçalho deste ficheiro sobre a
    correção).
  lifeEvents:
    - id: almeida-garrett-born-1799
      title: Nasceu no Porto, criou-se do outro lado do rio, em Gaia
      description: >
        Nasceu João Leitão da Silva a 4 de fevereiro de 1799, na freguesia
        da Vitória, no Porto, segundo filho de um funcionário aduaneiro.
        Passou a infância não na cidade, mas na Quinta do Sardão do avô
        materno, do outro lado do Douro, em Vila Nova de Gaia, distinção
        que mais tarde registaria ele próprio: "Nasci no Porto, mas
        criei-me em Gaia".

    - id: almeida-garrett-hino-patriotico-1820
      title: Escreve a primeira obra publicada na semana de uma revolução real
      description: >
        Estudante de Direito em Coimbra, com vinte e um anos, Garrett
        soube da Revolução Liberal do Porto de 24 de agosto de 1820 e, em
        poucos dias, tinha escrito a letra de um
        [[work:almeida-garrett/hino-patriotico|Hino Patriótico]]:
        impresso como folheto no Porto quase de imediato e cantado
        publicamente no Teatro de São João a 27, com música de J. A.
        Ribas. Não foi uma estreia literária privada, mas uma resposta
        imediata e representada a um acontecimento político em curso - um
        padrão que se repetiria ao longo da sua carreira, do processo de
        1821 abaixo aos anos em que lutou, e não só escreveu, pela causa
        liberal.

    - id: almeida-garrett-retrato-de-venus-trial-1821
      title: Processado por um poema censurado aos vinte e dois anos
      description: >
        Tendo fugido para os Açores em criança durante a invasão francesa
        de 1809 e regressado para estudar Direito em Coimbra em 1816 -
        onde entrou numa loja maçónica de estudantes e, em 1818, adotou
        definitivamente o nome Almeida Garrett - publicou o poema
        libertino [[work:almeida-garrett/o-retrato-de-venus|O Retrato de
        Vénus]] em 1821 e foi processado por ele como "materialista, ateu
        e imoral". Foi absolvido em 1822, mas o padrão - a obra de um
        jovem escritor a chamar a atenção do Estado - repetir-se-ia ao
        longo de toda a carreira.

    - id: almeida-garrett-first-exile-writes-camoes-1823
      title: Exilado em Inglaterra e França, escreve os primeiros poemas românticos em português
      description: >
        Já casado, com quase vinte e quatro anos, com Luísa Midosi, de
        catorze anos (casamento de novembro de 1822, que terminou em
        separação em 1836), Garrett fugiu para Inglaterra depois de o
        golpe da Vilafrancada, em 1823, restaurar o regime absolutista. Em
        Inglaterra, em Edgbaston, leu Shakespeare e Walter Scott e visitou
        pela primeira vez ruínas góticas; seguiu depois para França, em
        1824-25, onde escreveu [[work:almeida-garrett/camoes|Camões]]
        (1825) e [[work:almeida-garrett/dona-branca|Dona Branca]] (1826),
        poemas geralmente tidos como as primeiras obras do Romantismo
        literário português.

    - id: almeida-garrett-liberal-wars-soldier-1832
      title: Combate nas Guerras Liberais ao lado de Alexandre Herculano
      description: >
        Exilado uma segunda vez em 1828, sob o rei absolutista D. Miguel,
        Garrett passou os anos até 1832 sobretudo em Inglaterra e França,
        antes de se juntar à força expedicionária liberal reunida nos
        Açores. Em julho de 1832 participou no Desembarque do Mindelo e no
        Cerco do Porto como voluntário no Batalhão Académico, ao lado do
        também escritor e combatente Alexandre Herculano e do futuro
        ministro Joaquim António de Aguiar - não uma luta metafórica pela
        causa liberal sobre a qual escrevia, mas uma luta real, sob fogo,
        antes de alguma vez ocupar um cargo eletivo.

    - id: almeida-garrett-founds-national-theatre-1836
      title: Propõe as instituições de um teatro nacional português
      description: >
        Garantida a vitória liberal, Garrett regressou a Portugal,
        passando por uma breve missão como cônsul-geral em Bruxelas, e
        entrou na vida parlamentar, tornando-se um dos oradores mais
        destacados da época. A 28 de setembro de 1836 foi encarregado de
        propor um plano para o teatro nacional, e os anos seguintes viram
        nascer, por iniciativa sua, a Inspecção-Geral dos Teatros, o
        Conservatório de Arte Dramática e o Teatro Normal - a instituição
        hoje o Teatro Nacional D. Maria II - o projeto cívico a par do
        qual escreveu as suas próprias peças históricas para o palco
        português que acabara de construir.

    - id: almeida-garrett-adelaide-death-inspires-frei-luis-de-sousa-1841
      title: Morre Adelaide Deville Pastor, e segue-se Frei Luís de Sousa
      description: >
        Adelaide Deville Pastor, companheira de Garrett desde 1836, morreu
        a 26 de julho de 1841 de complicações do parto, deixando a filha
        de ambos, Maria Adelaide - batizada, como o filho anterior do pai,
        como criança de pais incógnitos, e só legitimada no ano seguinte.
        A perda, e a situação legal em que deixou a criança, alimentou
        diretamente
        [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]],
        lido pela primeira vez em público em 1843 e publicado em 1844.

    - id: almeida-garrett-frei-luis-de-sousa-own-household-1843
      title: A lei que desfez a sua própria casa é a lei em que assenta a peça
      description: >
        O que Garrett trouxe da sua própria casa para
        [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]] não
        foi só a dor, mas a sua forma legal. Maria Adelaide foi batizada
        como criança de pais incógnitos e só legitimada em 1842; a peça
        trabalha a mesma lei civil e canónica pelo lado oposto, anulando
        retroativamente um segundo casamento quando o primeiro marido se
        revela vivo e deixando ilegítima a filha desse casamento - a
        acusação que Maria de Noronha lança à Igreja no terceiro ato,
        escrita dois anos depois do batismo e da legitimação que tinham
        resolvido a mesma questão na própria família de Garrett.

    - id: almeida-garrett-viscount-1851
      title: Feito Visconde, e brevemente ministro dos Negócios Estrangeiros
      description: >
        Feito 1.º Visconde de Almeida Garrett pela rainha D. Maria II a 25
        de junho de 1851 (ver a nota de cabeçalho deste ficheiro, que
        resolve a data e o monarca face à própria cronologia da Biblioteca
        Nacional, corrigindo os dois artigos da Wikipédia), serviu alguns
        meses no ano seguinte, de 4 de março a 17 de agosto de 1852, como
        ministro e secretário de Estado dos Negócios Estrangeiros no
        governo do Duque de Saldanha. O seu último livro concluído,
        [[work:almeida-garrett/folhas-caidas|Folhas Caídas]] (1853), foi
        escrito nestes últimos anos para Rosa de Montúfar, nobre espanhola
        que se tornou sua companheira no fim da vida.

    - id: almeida-garrett-death-1854
      title: Morre em Lisboa, sepultado nos Prazeres
      description: >
        Morreu de cancro generalizado de origem hepática em sua casa, no
        Campo de Ourique, em Lisboa, a 9 de dezembro de 1854, com
        cinquenta e cinco anos, e foi sepultado no Cemitério dos Prazeres.
        Os seus restos mortais não ficaram ali: ver os eventos de 1903 e
        1966 abaixo para saber onde repousam hoje, e a nota de cabeçalho
        deste ficheiro para uma correção à versão habitualmente contada.

    - id: almeida-garrett-jeronimos-transfer-1903
      title: Restos mortais transladados para o Mosteiro dos Jerónimos
      description: >
        Meio século depois da sua morte, os restos mortais de Garrett
        foram transladados do Cemitério dos Prazeres para o Mosteiro dos
        Jerónimos a 3 de maio de 1903 - não a última paragem (ver 1966
        abaixo), mas a primeira mudança para um edifício que já tinha o
        peso informal de um panteão nacional, ao lado dos túmulos de
        Vasco da Gama e de Luís de Camões, o poeta cujo nome Garrett tinha
        dado ao seu próprio primeiro poema romântico, oitenta anos antes.

    - id: almeida-garrett-panteao-nacional-1966
      title: Transladado de novo, para o Panteão Nacional que ajudara a propor
      description: >
        Em 1836, nas mesmas semanas em que fazia campanha pelo teatro
        nacional (ver acima), Garrett tinha sido também, com Passos
        Manuel, um dos promotores da própria ideia de um panteão nacional
        português - o decreto que o cria é de 26 de setembro de 1836,
        dois dias antes da sua proposta para o teatro. Só em 1966 é que a
        Igreja de Santa Engrácia, em obras intermitentes desde 1682, abriu
        de facto como esse panteão: entre 1 e 5 de dezembro de 1966, os
        seus restos mortais foram ali transladados do Mosteiro dos
        Jerónimos, numa cerimónia solene, ao lado dos de Guerra Junqueiro,
        João de Deus, Óscar Carmona, Sidónio Pais e Teófilo Braga (que
        tinha, por coincidência, editado as obras completas póstumas do
        próprio Garrett seis décadas antes - ver 1904 abaixo). Repousa ali
        hoje, não nos Jerónimos: a afirmação da Wikipédia inglesa de que
        jaz "near to Alexandre Herculano and Luís Vaz de Camões" descreve
        apenas o período entre 1903 e 1966, e o próprio Herculano só foi
        transladado para os Jerónimos em 1978, pelo que os dois camaradas
        do Cerco do Porto nunca chegaram, de facto, a estar sepultados
        juntos em nenhum dos dois locais.

    - id: almeida-garrett-teofilo-braga-obras-completas-1904
      title: Teófilo Braga edita a edição popular que definiu a sua estante
      description: >
        Cinquenta anos depois da morte de Garrett, o historiador e crítico
        Teófilo Braga - a sete anos de se tornar o primeiro Presidente da
        República Portuguesa - prefaciou, reviu e dirigiu uma "Grande
        Edição Popular, Illustrada" em dois volumes das obras completas de
        Garrett, publicada em Lisboa por H. Antunes. Pensada para um
        público alargado, não erudito, foi a edição através da qual a
        maioria dos leitores portugueses do século XX conheceu de facto o
        grosso da sua obra, prosa e verso juntos.

    - id: almeida-garrett-neogarrettismo-1894
      title: Torna-se o mito fundador de uma revivificação literária que nunca viu
      description: >
        Quarenta anos depois da sua morte, e quatro anos depois de o
        humilhante Ultimato Britânico de 1890 abalar a confiança nacional
        portuguesa, o crítico Alberto de Oliveira publicou a coletânea de
        ensaios Palavras Loucas, nomeando e lançando programaticamente o
        "Neogarrettismo": um apelo revivalista que invocava explicitamente
        Garrett (um dos textos chama-se "O Tio Garrett") como guardião
        totémico da cultura portuguesa autêntica, exortando os poetas a
        redescobrir o rural, o popular e o histórico - exatamente a
        matéria do
        [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro
        e Cancioneiro Geral]] e das
        [[work:almeida-garrett/viagens-na-minha-terra|Viagens na Minha
        Terra]] do próprio Garrett. O movimento juntou poetas da "geração
        de 90" - António Nobre, Guerra Junqueiro, Afonso Lopes Vieira,
        Manuel da Silva Gaio - e, na expressão do próprio Eça de Queirós
        para o seu objetivo, numa carta a Oliveira Martins, procurava
        "reaportuguesar Portugal."

    - id: almeida-garrett-death-centenary-1954
      title: O centenário da morte dá origem a uma estátua de bronze e a um prémio de poesia
      description: >
        Um século depois da sua morte, o Porto assinalou o centenário com
        um monumento em bronze do escultor Salvador Barata Feyo,
        inaugurado a 11 de novembro de 1954 em frente à câmara municipal,
        no que é hoje a Praça General Humberto Delgado. O Ateneu Comercial
        do Porto, instituição cultural da cidade natal do escritor, levou
        a ocasião mais longe: criou para o centenário o prémio de poesia
        Prémio Almeida Garrett, com concorrentes como Sofia de Mello
        Breyner e José Carlos Ary dos Santos e vencido por Miguel Torga,
        todo o concurso reunido mais tarde em antologia pelo crítico João
        Gaspar Simões.

    - id: almeida-garrett-bicentenary-1999
      title: O bicentenário transforma a biblioteca nacional no seu arquivo
      description: >
        Para o bicentenário do seu nascimento, a Biblioteca Nacional de
        Portugal coordenou um programa nacional - um congresso
        internacional, uma exposição bibliográfica e iconográfica que
        passou por Coimbra, Porto e Lisboa, atividades escolares, um
        número dedicado da Revista da Biblioteca Nacional, e mais
        exposições no Ateneu Comercial do Porto e no Museu Romântico. Na
        televisão pública portuguesa, o historiador José Hermano Saraiva
        assinalou o mesmo aniversário com o documentário "O Romantismo de
        Garrett" (RTP2, 14 de novembro de 1999), construído em torno de
        uma visita às exposições da própria Biblioteca Nacional.
