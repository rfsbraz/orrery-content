# Tradução pt-PT. bio + lifeEvents (título e descrição); data, impact,
# spoilerAfter e sources nunca se traduzem. As listas encaixadas fundem-se
# pelo id (ver SCHEMA.md), pelo que cada lifeEvent traz apenas
# id/title/description. `name` e `aka` não se traduzem.
#
# A citação do poema encontrado entre os papéis de Pessoa ("alma sonhadora,
# irmã gémea da minha") já está em português na base; mantém-se tal como
# está, sem repetir aqui a glosa inglesa entre parênteses que a acompanha na
# base - seria redundante num texto já em português.

- id: florbela-espanca
  bio: >
    Nasceu Flor Bela Lobo na freguesia da Conceição, Vila Viçosa, no
    Alentejo (batizada ali a 20 de junho de 1895), filha da criada de casa
    do pai; o pai, o antiquário, fotógrafo e pioneiro da exibição de cinema
    João Maria Espanca, criou-a a ela e ao irmão Apeles em sua própria casa,
    onde a mulher dele, Mariana do Carmo Toscano - que não podia ter filhos
    - se tornou madrinha de Florbela e, na prática, a criou a par da mãe
    biológica, embora João Maria só tenha reconhecido Florbela como filha
    num edital municipal de 1948, dezoito anos depois da sua morte. Cresceu
    em Vila Viçosa até 1907, ano em que a família se mudou para Évora para
    que ela pudesse frequentar o liceu; nesse mesmo ano queixou-se pela
    primeira vez ao pai do cansaço e das dores de cabeça que se repetiriam,
    de forma intermitente, pelo resto da vida. Casou três vezes em doze
    anos: Alberto Moutinho (1913-1921), um colega de escola com quem casou
    no seu próprio décimo nono aniversário e com quem geriu uma pequena
    escola de línguas no Redondo, antes de o casamento se desfazer com o
    regresso dela a Lisboa para a faculdade de Direito; António Guimarães
    (1921-1925), um oficial de artilharia da Guarda Nacional Republicana com
    quem casou no Porto e que acompanhou até Lisboa, num casamento que
    terminou em acusações mútuas de maus-tratos; e o médico Mário Lage (1925
    até à sua morte). Foi uma das primeiras mulheres admitidas ao curso de
    Direito da Universidade de Lisboa, matriculando-se em outubro de 1917;
    perdeu a primeira de várias gravidezes num ano, e um novo aborto
    espontâneo em 1919 - o ano em que surgiu Livro de Mágoas - marcou um
    agravamento sério da sua doença. Conhecida sobretudo por sonetos
    eroticamente diretos e formalmente tradicionais, que rompiam claramente
    com a reserva esperada de uma mulher poeta na década de 1920 em
    Portugal, percorrendo um caminho que vai da voz enlutada e enclausurada
    de [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] e
    [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]]
    até à afirmação sensual e aberta de
    [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]], terminado
    em manuscrito anos antes da sua morte mas ainda por publicar quando
    morreu. O irmão, Apeles, oficial da Marinha e pintor, o mais chegado dos
    seus irmãos, morreu a 6 de junho de 1927, quando o hidroavião que
    pilotava para concluir os testes da licença de piloto caiu no Tejo entre
    o Porto Brandão e a Trafaria; o corpo nunca foi encontrado, e a perda
    ensombra os seus últimos dois anos e os contos reunidos em
    [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]],
    que lhe são dedicados. Espanca morreu em Matosinhos a 8 de dezembro de
    1930, no seu próprio trigésimo sexto aniversário, por overdose de
    barbitúricos, depois de duas tentativas anteriores, em outubro e
    novembro; o certificado de óbito registou como causa o edema pulmonar.
    Um poema datilografado e não assinado, dirigido "à memória de Florbela
    Espanca" e que lhe chama "alma sonhadora, irmã gémea da minha", apareceu
    entre os papéis do próprio Fernando Pessoa em 1985 e foi publicado como
    sendo dele por Maria Lúcia Dal Farra, a investigadora que o encontrou;
    Dal Farra tem desde então atribuído a identificação do poema como sendo
    de Eliezer Kamenezki, da coletânea de 1932 Alma Errante - para a qual
    Pessoa escreveu apenas o prefácio -, ao editor de textos de Pessoa
    Jerónimo Pizarro.
  lifeEvents:
    - id: florbela-espanca-born-1894
      title: Nasce em Vila Viçosa, cresce ali e em Évora
      description: >
        Nasce Flor Bela Lobo na freguesia da Conceição, Vila Viçosa,
        Alentejo, batizada ali a 20 de junho de 1895, filha de Antónia da
        Conceição Lobo, criada de casa do pai; cresce na casa do pai, João
        Maria Espanca, criada pela mulher dele, Mariana do Carmo Toscano, a
        par da mãe biológica. Cresce em Vila Viçosa - a charneca que dá o
        título a Charneca em Flor - até à mudança para Évora, em 1907, para
        frequentar o liceu.

    - id: florbela-espanca-first-divorce-1921
      title: Divorcia-se do primeiro marido, Alberto Moutinho
      description: >
        Divorcia-se de Alberto Moutinho, com quem tinha casado no seu
        décimo nono aniversário, em 1913, por sentença do tribunal da
        Comarca de Vila Viçosa a 30 de abril de 1921; o casamento estava,
        na prática, terminado desde o regresso dela a Lisboa em 1917, para
        a faculdade de Direito, enquanto Moutinho ficava para trás. Casa de
        novo dois meses depois, com António Guimarães.

    - id: florbela-espanca-brother-apeles-death-1927
      title: O irmão Apeles morre num acidente de avião no Tejo
      description: >
        O irmão Apeles, oficial da Marinha e pintor, o mais chegado dos
        seus irmãos, morre a 6 de junho de 1927, quando o hidroavião que
        pilotava para concluir os testes da licença de piloto cai no Tejo
        entre o Porto Brandão e a Trafaria; o corpo nunca é encontrado. A
        perda ensombra os seus últimos dois anos e As Máscaras do Destino,
        que lhe é dedicado.

    - id: florbela-espanca-death-1930
      title: Morre em Matosinhos, no seu próprio trigésimo sexto aniversário
      description: >
        Morre em Matosinhos a 8 de dezembro de 1930, no seu próprio
        trigésimo sexto aniversário, por overdose de barbitúricos, depois
        de duas tentativas de suicídio anteriores, em outubro e novembro,
        enquanto revia as provas de Charneca em Flor; o certificado de
        óbito regista como causa o edema pulmonar. Charneca em Flor chega
        às livrarias um mês depois, em janeiro de 1931.
