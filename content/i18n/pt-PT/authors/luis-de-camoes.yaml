# Português europeu (pt-PT) - biografia e lifeEvents. A biografia inglesa
# preserva deliberadamente a incerteza factual do registo (nascimento
# desconhecido, causa e ano de morte residualmente disputados, o naufrágio e
# o episódio de "Dinamene" tratados como lenda, não como facto verificado);
# esta tradução mantém as mesmas reservas ("segundo a melhor estimativa
# disponível", "por tradição", "diz-se que", "o registo não resolve qual")
# em vez de as transformar em afirmações fechadas. "Provedor-mor dos
# Defuntos e Ausentes" já é português no original e mantém-se tal como está.

- id: luis-de-camoes
  bio: >
    Nasceu, segundo a melhor estimativa disponível, por volta de 1524 ou
    1525, provavelmente em Lisboa, numa família de pequena fidalguia: a
    linhagem paterna remontava a um trovador-soldado galego que se
    estabelecera em Portugal no século XIV, e a mãe, Ana de Sá e Macedo,
    era de uma família nobre de Santarém. Sobre a sua infância e juventude
    quase nada está documentado - presume-se muitas vezes uma educação na
    Universidade de Coimbra, mas não consta de nenhum registo sobrevivente
    - e o registo fiável só se firma a partir dos vinte e poucos anos. Um
    amor frustrado na corte é tradicionalmente apontado como causa de um
    exílio voluntário que o levou ao serviço militar em Ceuta, na costa
    norte-africana, onde perdeu a visão do olho direito numa escaramuça
    naval no estreito de Gibraltar, por volta de 1549-1551; as fontes
    divergem quanto a saber se o ferimento veio de arma inimiga ou de um
    acidente com a artilharia do seu próprio lado. De volta a Lisboa, feriu
    um oficial da corte, Gonçalo Borges, num duelo de espada, foi preso, e
    foi libertado por perdão real, com a condição de servir a coroa na
    Índia. Partiu de Lisboa no Domingo de Ramos, 24 de março de 1553, a
    bordo da nau São Bento, sobrevivendo a uma tempestade ao largo do Cabo
    da Boa Esperança que afundou três dos outros quatro navios da frota, e
    chegando a Goa em 1554.

    A década seguinte na Ásia portuguesa forneceu, em partes
    aproximadamente iguais, a maior parte do material que viria a ser Os
    Lusíadas e a maior parte dos infortúnios do poeta. Combateu em
    expedições contra o "rei de Chembé" e, em 1555, rumo ao Mar Vermelho,
    invernando em Ormuz, no golfo Pérsico; terá começado a rascunhar o
    poema épico por esta altura; regressou a Goa em 1556 e escreveu
    Filodemo para o governador, Francisco Barreto; foi possivelmente preso
    durante vários anos, por uma sátira que lhe é atribuída ou por dívidas
    por pagar - o registo não resolve qual; e em 1562 foi nomeado
    Provedor-mor dos Defuntos e Ausentes no ainda jovem e mal fixado
    entreposto português de Macau, onde serviu de cerca de 1563 a 1564 ou
    1565. A tradição diz que escreveu parte do poema épico numa gruta de
    Macau mais tarde batizada com o seu nome - uma lenda, não um facto
    documentado. Na viagem de regresso a Goa naufragou, por tradição perto
    da foz do rio Mekong; a mesma tradição diz que nada salvou além de si
    próprio e do manuscrito do poema, um episódio que gerações posteriores
    leram tanto no próprio poema épico como na redondilha "Sôbolos rios que
    vão". As fontes não concordam quanto ao ano (as versões situam-no
    algures entre 1559 e 1566), nem sequer quanto a saber se chegou a nado
    à costa ou numa jangada, e a morte de uma companheira no naufrágio,
    mais tarde chamada "Dinamene" pelos primeiros biógrafos, é tratada pela
    investigação moderna como mais provavelmente uma invenção poética do
    que uma pessoa documentada - todo o episódio figura no registo como
    lenda, baseada no que os biógrafos posteriores e os versos alusivos do
    próprio poeta afirmam, e não como biografia verificada. Seguiu-se uma
    nova prisão em Malaca, desta vez pelos bens dos falecidos cuja
    administração lhe fora confiada, antes de conseguir finalmente
    regressar a Goa.

    Ao embarcar para regressar a casa, ficou retido durante mais de dois
    anos na Ilha de Moçambique pelo seu governador recém-nomeado, Pedro
    Barreto, que, segundo os primeiros biógrafos, o foi entretendo com
    falsas promessas de passagem; o seu amigo, o historiador Diogo do
    Couto, encontrou-o ali em 1568-69 em extrema pobreza, ainda a
    aperfeiçoar o manuscrito do poema épico, e registou que uma coletânea à
    parte, a que Camões chamava "Parnaso de Luís de Camões", lhe foi ali
    roubada e nunca recuperada. Regressou a Lisboa a 7 de abril de 1570, a
    bordo da nau Santa Clara. Dois anos depois, tendo recitado o poema
    épico já concluído ao jovem rei D. Sebastião, viu Os Lusíadas chegar à
    imprensa, e foi-lhe concedida uma modesta pensão real pelo seu serviço
    na Índia - paga, segundo a maioria dos relatos, de forma irregular.
    Passou os seus últimos anos em Lisboa em circunstâncias difíceis,
    tradicionalmente descritas como pobreza total, embora pelo menos um
    biógrafo moderno (Le Gentil) tenha classificado de exagerada a versão
    mais dura dessa tradição, notando que Camões ainda tinha meios para
    manter um criado, Jau, trazido consigo do Oriente. Diz-se que a
    catástrofe militar portuguesa de 1578 em Alcácer-Quibir, que custou a
    vida ao rei D. Sebastião e preparou a perda da independência do país
    para Espanha dois anos depois, amargurou ainda mais os seus últimos
    anos. Morreu em Lisboa a 10 de junho de 1580 - data desde então fixada
    como o Dia de Portugal - deixando a sua poesia lírica por reunir; esta
    foi reunida e publicada postumamente, sob o título Rimas, em 1595.
  lifeEvents:
    - id: camoes-ceuta-eye-1549
      title: "Perde a visão do olho direito em Ceuta"
      description: >
        Ao servir cerca de dois anos na guarnição norte-africana de Ceuta -
        por tradição um exílio voluntário na sequência de um amor
        frustrado na corte, embora o registo apenas estabeleça com
        segurança a própria colocação -, Camões perde a visão do olho
        direito numa escaramuça perto do estreito de Gibraltar. O biógrafo
        quase contemporâneo Manuel Severim de Faria (nascido quatro anos
        depois da morte de Camões) regista um tiro no olho recebido num
        confronto com forças mouras; outros relatos descrevem, em vez
        disso, um acidente com a artilharia do seu próprio lado, e as duas
        versões nunca foram conciliadas. O ferimento torna-se a sua marca
        física mais visível pelo resto da vida e molda a sua iconografia
        sobrevivente (o "Retrato a Vermelho") e a persistente imagem
        popular do "poeta caolho".

    - id: camoes-departs-for-india-1553
      title: "Parte para a Índia como condição de um perdão"
      description: >
        Recém-saído de uma prisão em Lisboa por um duelo de espada com um
        oficial da corte, Camões parte para Goa no Domingo de Ramos, 24 de
        março de 1553, a bordo da nau São Bento - o preço do seu perdão
        real foi um período de serviço na Índia. Numa carta que escreveria
        mais tarde, atribui a si próprio, como palavras de despedida, a
        frase de Cipião Africano "Ingrata patria, non possidebis ossa mea"
        ("Pátria ingrata, não possuirás os meus ossos"). A frota perde três
        dos outros quatro navios numa tempestade ao largo do Cabo da Boa
        Esperança antes de chegar a Goa em 1554.

    - id: camoes-macau-appointment-1562
      title: "Nomeado Provedor-mor dos Defuntos e Ausentes em Macau"
      description: >
        Libertado, empregado e protegido pelo novo governador de Goa, D.
        Francisco Coutinho, após um período de prisão anterior, Camões é
        nomeado, em 1562, Provedor-mor dos Defuntos e Ausentes para Macau -
        um cargo judicial-administrativo responsável por recolher e
        salvaguardar os bens dos mercadores falecidos no mar e garantir os
        direitos dos seus herdeiros. Serve efetivamente ali de cerca de
        1563 até 1564 ou 1565, num entreposto português ainda mal fixado
        nessa época. A tradição diz que escreveu parte de Os Lusíadas numa
        gruta de Macau mais tarde batizada com o seu nome - uma lenda, não
        um facto documentado, ao contrário da própria nomeação.

    - id: camoes-returns-to-lisbon-1570
      title: "Retido em Moçambique, regressa a Lisboa dezassete anos depois"
      description: >
        Ao embarcar para regressar a casa, Camões fica retido na Ilha de
        Moçambique durante mais de dois anos a partir de dezembro de 1567,
        por Pedro Barreto, o seu governador recém-nomeado, que, segundo os
        primeiros biógrafos, o foi entretendo com falsas promessas de
        passagem. O seu amigo, o historiador Diogo do Couto, encontra-o ali
        em 1568-69 em extrema pobreza - "tão pobre que comia da caridade
        dos amigos" -, ainda a aperfeiçoar para impressão o manuscrito de
        Os Lusíadas, e regista que um manuscrito à parte, uma miscelânea a
        que Camões chamava "Parnaso de Luís de Camões", lhe é ali roubado e
        nunca recuperado, apesar das investigações posteriores do próprio
        Couto. Couto e outros amigos reúnem o dinheiro para saldar uma
        dívida que Barreto lhe exige e conseguem pô-lo a bordo; Camões
        chega a Lisboa a 7 de abril de 1570, na nau Santa Clara, dezassete
        anos depois de ter partido pela primeira vez para a Índia sob
        perdão. Entre um momento e outro ficaram a colocação em Macau e o
        naufrágio que, segundo a tradição, lhe custou quase tudo menos o
        manuscrito do próprio poema épico, e uma nova prisão em Malaca.
        Traz consigo o poema já terminado.

    - id: camoes-lusiadas-published-1572
      title: "Os Lusíadas é publicado, e a coroa concede uma pequena pensão"
      description: >
        Camões recita Os Lusíadas, já concluído, ao jovem rei D. Sebastião,
        que manda imprimi-lo em 1572 e concede ao seu autor uma modesta
        pensão - quinze mil réis por ano, sensivelmente o que recebia uma
        dama de companhia da corte, honrosa para um veterano militar mas
        não generosa - em pagamento pelo seu serviço na Índia. A pensão era
        renovável, mas parece ter sido paga de forma irregular, e caducou
        ao fim de três anos; o poema épico que tornou Camões célebre não
        bastou, por si só, para lhe dar segurança.

    - id: camoes-death-1580
      title: "Morre em Lisboa, amargurado por Alcácer-Quibir"
      description: >
        Camões morre em Lisboa a 10 de junho de 1580, em últimos anos
        difíceis que a tradição recorda como pobreza total - embora ainda
        mantivesse um criado trazido do Oriente, facto que pelo menos um
        biógrafo moderno considera razão para duvidar da versão mais dura
        dessa tradição. Diz-se que ficou amargurado pela catastrófica
        derrota portuguesa de 1578 em Alcácer-Quibir, que custou a vida ao
        rei D. Sebastião e preparou a perda da independência do país para
        Espanha, menos de dois anos após a sua própria morte. A sua poesia
        lírica permaneceu por reunir até à sua morte; só chegou à imprensa
        em 1595, sob o título Rimas. A data da sua morte está hoje fixada
        como o Dia de Portugal.
