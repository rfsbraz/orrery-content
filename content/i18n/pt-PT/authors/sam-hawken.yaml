# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Bio mecânica gerada a partir do modelo "Credited with James
# Patterson on N books, from A to B", traduzido aqui sempre como "Partilha
# crédito de autoria com James Patterson em N livros, de A a B" - construção
# sem concordância de género de propósito, para não exigir confirmar o
# género de mais de cem colaboradores um a um. Os títulos das obras citadas
# mantêm-se tal como no inglês, por não existirem edições portuguesas
# verificadas nesta ala.

- id: sam-hawken
  bio: >
    Partilha crédito de autoria com James Patterson em
    [[work:james-patterson/the-housewife|The Housewife]] (2017) e
    [[work:james-patterson/the-moores-are-missing|The Moores are Missing]] (2017).
