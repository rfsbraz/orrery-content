# Overlay pt-PT do autor: só `bio` (lifeEvents: [] na base, nada a fundir).
# The Sentinel não tem edição em português (editions.yaml) e fica no título
# original.
- id: andrew-child
  bio: >
    Pseudónimo de Andrew Grant, romancista inglês nascido em Birmingham em
    1968, irmão mais novo de [[author:lee-child|Lee Child]] (nascido James
    Grant). Grant escreveu várias séries próprias como Andrew Grant antes
    de assumir a coautoria da série [[franchise:lee-child|Jack Reacher]] a
    partir de [[work:lee-child/the-sentinel|The Sentinel]] (2020), sob o
    novo apelido "Child", a condizer com o pseudónimo do irmão.
