# Overlay pt-PT do autor: bio + prosa dos lifeEvents (title + description).
# Os lifeEvents ficam aninhados sob o autor e são fundidos por id (ver
# SCHEMA.md, "Nested lists merge by id"); datas, impact, organisation e
# sources nunca se traduzem, nem o nome do autor. Referências a obras
# repetem o título original, já em português.
#
# O autor escreve e fala publicamente em português europeu; onde a base
# inglesa cita as suas próprias palavras ou as de outra figura pública
# portuguesa entre aspas (jrs-rtp-director-conflict-2004,
# jrs-gradiva-to-planeta-2022, jrs-sorbonne-thesis-2022), estas citações
# foram recuperadas dos artigos de imprensa originais citados em `sources`,
# não retraduzidas a partir da paráfrase inglesa.

- id: jose-rodrigues-dos-santos
  bio: >
    Nasceu na Beira, então na província ultramarina portuguesa de
    Moçambique, filho de um médico. Mudou-se para Tete aos quinze meses e
    viveu ali em plena Guerra Colonial até aos oito anos; depois da
    separação dos pais, viveu entre Lisboa e Penafiel, terra natal do pai,
    até a família se mudar para Macau, onde começou a trabalhar em
    jornalismo na Rádio Macau em 1981, aos dezassete anos. Regressou a
    Portugal em 1983 para estudar Comunicação Social na Universidade Nova
    de Lisboa; após a morte do pai, usou a herança para financiar um
    estágio não remunerado de três meses na BBC, em Inglaterra. Dois
    prémios de imprensa portugueses (1986, 1987) valeram-lhe um lugar na
    BBC World Service, em Londres (1990-1993). Entrou na RTP em 1991,
    apresentando o noticiário da noite 24 Horas antes de passar, no dia em
    que começou a Guerra do Golfo, para o Telejornal, que ainda hoje
    apresenta. Foi colaborador permanente da CNN entre 1993 e 2002, tendo
    vencido três prémios de jornalismo da CNN, e é doutorado em Ciências da
    Comunicação (Universidade Nova de Lisboa) com uma tese sobre reportagem
    de guerra, mais tarde expandida num estudo em três partes: [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
    de Guerra I]], [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade|Crónicas
    de Guerra II]] e [[work:jose-rodrigues-dos-santos/a-verdade-da-guerra|A
    Verdade da Guerra]]. Foi por duas vezes Diretor de Informação da RTP e
    é docente na Universidade Nova de Lisboa. Casou com Florbela Cardoso em
    1988; têm duas filhas, Catarina (n. 1991) e Inês (n. 1998).

    Publicou o seu primeiro romance, [[work:jose-rodrigues-dos-santos/a-ilha-das-trevas|A
    Ilha das Trevas]], em 2002, mas o livro que definiu a sua carreira foi
    [[work:jose-rodrigues-dos-santos/o-codex-632|O Codex 632]] (2005), que
    apresentou o historiador e criptanalista Tomás Noronha e foi adquirido
    pela HarperCollins para o mercado norte-americano. A sua sequela, [[work:jose-rodrigues-dos-santos/a-formula-de-deus|A
    Fórmula de Deus]] (2006, publicada em inglês como The Einstein Enigma),
    tornou-se o seu romance mais conhecido e o título de referência da
    série. A série Noronha, numerada pela editora e com catorze livros até
    2025, ancora uma estante mais vasta de ficção histórica: um romance
    biográfico de Calouste Gulbenkian em dois volumes, uma saga em quatro
    livros passada em Macau e na China em guerra, e vários outros pares
    ligados e romances autónomos, mais de um deles inspirado na própria
    história da sua família no Moçambique colonial. Depois de vinte e um
    anos com a editora Gradiva, mudou-se para o Grupo Planeta em 2022. É
    também um ensaísta e entrevistador prolífico, publicando sobre teoria
    dos media, sobre a história da reportagem de guerra, e reunindo as suas
    próprias conversas televisivas com grandes romancistas internacionais.
  lifeEvents:
    - id: jrs-born-1964
      title: Nasce na Beira, moldado por Tete, Lisboa e Penafiel antes de Macau
      description: >
        José António Afonso Rodrigues dos Santos nasce na Beira, então na
        província ultramarina portuguesa de Moçambique, filho de pai médico
        e mãe lisboeta. Aos quinze meses a família muda-se para Tete, onde
        vive em plena Guerra Colonial até aos oito anos. Depois da
        separação dos pais, vai para Lisboa com a mãe; as dificuldades
        económicas levam-no depois para casa do pai, em Penafiel, no norte
        de Portugal. É a própria dificuldade do pai em se adaptar de novo à
        vida portuguesa que acaba por levar a família até Macau, onde a
        infância itinerante termina e começa o jornalismo.

    - id: jrs-father-death-1986
      title: A morte do pai financia um estágio na BBC, e mais tarde um romance
      description: >
        O seu pai, José da Paz Brandão Rodrigues dos Santos, médico
        nascido em Penafiel em 1930, morre em janeiro de 1986. Segundo o
        próprio relata, Rodrigues dos Santos tinha acabado de concluir a
        licenciatura em Comunicação Social e tinha sido aceite para um
        estágio não remunerado de três meses na BBC, em Inglaterra, sem
        qualquer financiamento associado; paga-o com a herança do pai. A
        viagem vale-lhe dois prémios de imprensa portugueses nos dois anos
        seguintes (o prémio de ensaio do Clube Português de Imprensa em
        1986, o prémio de mérito académico do American Club of Lisbon em
        1987), credenciais que por sua vez lhe valem um lugar na BBC World
        Service, em Londres. Quase um quarto de século depois, inspira-se
        diretamente na vida do próprio pai como médico em Moçambique
        colonial para [[work:jose-rodrigues-dos-santos/o-anjo-branco|O
        Anjo Branco]] (2010), um romance sobre um serviço de assistência
        médica aérea que já chamou o seu livro mais íntimo e emocional.

    - id: jrs-gulf-war-debut-1991
      title: Uma maratona de dez horas sobre a Guerra do Golfo faz dele o rosto do Telejornal
      description: >
        A apresentar o noticiário noturno 24 Horas da RTP, Rodrigues dos
        Santos está no ar a 16 de janeiro de 1991 quando a coligação
        liderada pelos Estados Unidos começa a bombardear Bagdade.
        Apresenta uma maratona de cerca de dez horas sobre o ataque,
        incluindo uma ligação telefónica em direto a Bagdade, uma primeira
        para a televisão portuguesa. A emissão torna-o um dos rostos mais
        reconhecidos da estação; ainda nesse ano a RTP transfere-o para o
        noticiário principal, o Telejornal, que continua a apresentar.

    - id: jrs-cnn-huambo-1994
      title: Ganha o seu primeiro prémio da CNN, ao relatar a guerra civil angolana
      description: >
        Um ano depois de se tornar colaborador permanente do CNN World
        Report (1993-2002, em simultâneo com a apresentação do Telejornal),
        Rodrigues dos Santos ganha o prémio da CNN de Melhor Notícia de
        Última Hora do Ano por "Huambo Battle", a sua reportagem sobre os
        combates na guerra civil angolana.

    - id: jrs-cnn-albania-1998
      title: Um segundo prémio da CNN, por uma reportagem sobre os bunkers da Guerra Fria na Albânia
      description: >
        A CNN distingue a sua reportagem "Albania Bunkers", sobre as
        centenas de milhares de bunkers de betão construídos sob o regime
        paranoico de Enver Hoxha durante a Guerra Fria, como Melhor Notícia
        de Domingo do Ano. É o segundo de três prémios da CNN ao longo da
        sua década como correspondente português da cadeia, culminando em
        2000 com o Contributor Achievement Award pelo conjunto da sua obra.

    - id: jrs-rtp-director-conflict-2004
      title: Demite-se de Diretor de Informação da RTP por "interferência ilegítima"
      description: >
        No exercício (a primeira das duas vezes) do cargo de Diretor de
        Informação da RTP, sob o governo PSD/CDS de Durão Barroso,
        Rodrigues dos Santos é publicamente alfinetado em outubro de 2004
        por Nuno Morais Sarmento, o ministro com a tutela da RTP, que diz
        no parlamento haver "limites" à independência do serviço público e
        que "não são jornalistas com doutoramento" que respondem pela
        despesa do dinheiro público, uma farpa clara ao doutoramento do
        próprio Rodrigues dos Santos. Duas semanas depois, o conselho de
        administração da RTP sobrepõe-se à sua escolha para um lugar de
        correspondente em Madrid; ele demite-se, alegando "interferência"
        editorial. O regulador dos media português (a AACS, antecessora da
        atual ERC) investiga mais tarde e conclui ter havido, de facto,
        "interferência ilegítima" por parte da administração, dando-lhe
        razão.

    - id: jrs-rtp-disciplinary-cleared-2007
      title: Sobrevive a um processo disciplinar depois de repetir a acusação de 2004
      description: >
        Depois de repetir as suas acusações de 2004 sobre interferência
        editorial, a RTP abre um processo disciplinar visando o seu
        despedimento. Os próprios investigadores internos da estação
        concluem, no final do processo, que não há fundamento para tal.

    - id: jrs-gradiva-to-planeta-2022
      title: Termina 21 anos com a Gradiva, mudando-se para a gigante espanhola Planeta
      description: >
        Depois de 21 anos e 23 romances com a Gradiva, Rodrigues dos Santos
        assina com a multinacional espanhola Planeta, que anuncia a 17 de
        maio de 2022 que publicará o seu próximo romance nesse outubro;
        segundo o nit.pt, tinha passado cerca de um ano a pesar a proposta.
        O fundador da Gradiva, Guilherme Valente, diz ao Expresso não haver
        ressentimentos ("vivi sempre com o fantasma de alguém o levar") mas
        que a saída é um verdadeiro buraco no orçamento que a casa terá de
        colmatar redistribuindo recursos. A mudança atrai também críticas
        públicas à Planeta por parte de um rival: Manuel de Freitas,
        diretor-geral da Penguin Random House Portugal, diz ao mesmo jornal
        que "o autor não andava à procura de uma nova editora" e que roubar
        um autor a uma casa rival quebra uma regra não escrita do ofício. O
        seu primeiro romance para a Planeta, [[work:jose-rodrigues-dos-santos/a-mulher-do-dragao-vermelho|A
        Mulher do Dragão Vermelho]], torna-se o livro mais vendido do país
        nesse ano.

    - id: jrs-sorbonne-thesis-2022
      title: Defende uma segunda tese de doutoramento, na Sorbonne, sobre as raízes do fascismo
      description: >
        Já doutorado em Ciências da Comunicação pela Universidade Nova de
        Lisboa, Rodrigues dos Santos anuncia nas redes sociais que defendeu
        uma segunda tese de doutoramento, na Sorbonne, em Paris, perante um
        júri internacional, aprovado "com distinção e louvor", com 19
        valores. O departamento de cultura da RTP noticia o tema da tese:
        que o fascismo tem uma origem ideológica no marxismo, uma tese que
        o próprio autor sublinha não ser o mesmo que dizer que fascismo e
        marxismo são a mesma coisa. É a mesma tese, defendida anos antes no
        seu romance [[work:jose-rodrigues-dos-santos/as-flores-de-lotus|As
        Flores de Lótus]] e na sua sequela O Pavilhão Púrpura, que lhe
        atrai críticas públicas de um historiador no ano seguinte.
