# Português europeu (pt-PT) - sobreposição de prosa curada (bio +
# lifeEvents). Traduz-se apenas prosa. Nunca ids, slugs, nomes de autor,
# datas nem URLs de fontes. As listas encaixadas fundem-se item a item pelo
# id (SCHEMA.md, "Nested lists merge by id"): cada lifeEvent traz apenas o
# id e a prosa (title, description, e quote quando existente), nunca a
# estrutura (organisation, date, impact, images_required). As citações
# diretas já em português no original (a entrevista ao Jornal de Letras, a
# "Cantata da Paz", o ato oficial do Panteão) mantêm-se tal como estão, sem
# o glosário inglês que as acompanhava no ficheiro-base.

- id: sophia-de-mello-breyner-andresen
  bio: >
    Nasceu no Porto às 11h15 do dia 6 de novembro de 1919, filha de Maria
    Amélia de Mello Breyner e João Henrique Andresen; o apelido Andresen
    desce do seu bisavô paterno Jan Andresen, um comerciante dinamarquês
    que se fixou no Porto e nunca mais saiu da região, e cujo filho
    comprou a Quinta do Campo Alegre em 1895, a propriedade da família
    hoje o Jardim Botânico do Porto. Do lado materno vinha-lhe uma antiga
    linhagem aristocrática e financeira portuguesa: Maria Amélia era filha
    de Tomás de Mello Breyner, Conde de Mafra, médico e amigo do rei D.
    Carlos I, e neta do capitalista de origem belga e futuro Conde de
    Burnay, Henrique Burnay. Criada num ambiente que mais tarde descreveu
    como "um território fabuloso, com uma família grande e rica servida
    por um vasto pessoal doméstico", começou a estudar no recém-aberto
    Colégio Sagrado Coração de Jesus, no Porto, e frequentou Filologia
    Clássica na Universidade de Lisboa entre 1936 e 1939, sem concluir o
    curso; nesses anos liderou movimentos universitários católicos e
    colaborou com a revista Cadernos de Poesia, onde forjou amizades
    duradouras com Ruy Cinatti e Jorge de Sena. O seu primeiro livro,
    [[work:sophia-de-mello-breyner-andresen/poesia|Poesia]], surgiu sob a
    chancela dessa revista em 1944 e abriu uma obra - o mar, a Grécia
    Antiga, a exigência de justiça e clareza moral, a casa e o jardim da
    memória - que se estenderia por sessenta anos. Em 1946 casou com o
    jornalista, advogado e político Francisco Sousa Tavares, mudou-se para
    Lisboa e teve cinco filhos: Isabel; Maria, mais tarde professora de
    literatura e organizadora de várias antologias póstumas da obra da
    mãe; Miguel, jornalista e escritor; Sofia; e Xavier, pintor e
    ceramista que ilustrou vários dos seus livros posteriores. Foi a
    maternidade que a levou à escrita infantil, a partir de meados da
    década de 1950. Opositora empenhada da ditadura do Estado Novo, vê
    Francisco preso em 1959, por participar na falhada Revolta da Sé, e de
    novo em 1968; o casal escreve-se na prisão num código privado que a
    polícia política nunca decifra. Cofunda a Comissão Nacional de Socorro
    aos Presos Políticos em 1969 e candidata-se pela lista de oposição
    CEUD no mesmo ano; a sua "Cantata da Paz" torna-se um hino da oposição
    católica progressista. Após a Revolução dos Cravos de 25 de abril de
    1974, é eleita em 1975 para a Assembleia Constituinte que redige a
    atual constituição portuguesa, representando o Partido Socialista pelo
    círculo do Porto, preside à comissão que redige o preâmbulo da
    constituição e cunha a frase "A Poesia está na rua" - enquanto o
    marido, apesar do seu próprio historial contra a ditadura, é preterido
    por todos os partidos e se sente politicamente arredado. O atrito
    sobrevive à Assembleia: o casamento desgasta-se ao longo da segunda
    metade da década de 1970 e separam-se em 1986, ao fim de quarenta
    anos, com o divórcio a ser finalizado em 1988. A par da poesia,
    publicou duas coletâneas de contos, oito livros infantis escritos
    sobretudo para os próprios filhos, cinco peças de teatro, ensaios
    ocasionais, e traduções de Dante, Shakespeare e Eurípides para
    português; ver
    [[franchise:sophia-de-mello-breyner-andresen|a página da obra]] para a
    bibliografia completa e hierarquizada. Em 1999 tornou-se a primeira
    mulher a receber o Prémio Camões, a mais alta distinção da literatura
    de língua portuguesa; seguiu-se novo reconhecimento, incluindo o
    prémio Max Jacob (2001) e o prémio espanhol Reina Sofía de poesia
    ibero-americana (2003). Morreu no Hospital da Cruz Vermelha, em
    Lisboa, a 2 de julho de 2004, aos 84 anos, dez dias antes de uma
    cerimónia em que receberia a Medalha de Honra do Presidente do Chile
    pelo centenário de Pablo Neruda, e foi sepultada inicialmente no
    Cemitério de Carnide; a 2 de julho de 2014, no décimo aniversário da
    sua morte, a Assembleia da República mandou trasladar os seus restos
    mortais para o Panteão Nacional, tornando-a a segunda mulher - depois
    da fadista Amália Rodrigues, em 2001 - a receber essa honra.
  lifeEvents:
    - id: sophia-de-mello-breyner-andresen-born-1919
      title: Nasce no Porto, numa família de comerciantes de origem dinamarquesa
      description: >
        Nasce às 11h15 do dia 6 de novembro de 1919, no Porto, filha de
        Maria Amélia de Mello Breyner e João Henrique Andresen. O seu
        bisavô paterno, Jan Andresen, foi um comerciante dinamarquês que
        se fixou no Porto; a família do pai comprou a Quinta do Campo
        Alegre em 1895, hoje o Jardim Botânico do Porto, onde cresceu
        rodeada de "uma família grande e rica servida por um vasto
        pessoal doméstico". Do lado materno vinha-lhe uma antiga linhagem
        aristocrática portuguesa: era filha de Tomás de Mello Breyner,
        Conde de Mafra.

    - id: sophia-de-mello-breyner-andresen-poesia-debut-1944
      title: Publica Poesia, o seu primeiro livro, aos 24 anos
      description: >
        Publica [[work:sophia-de-mello-breyner-andresen/poesia|Poesia]]
        pela chancela Cadernos de Poesia, em Coimbra, ainda com pouco mais
        de vinte anos, tendo deixado por concluir o curso de Filologia
        Clássica da Universidade de Lisboa cinco anos antes. O livro já
        traz os temas - o jardim e a casa da infância, o mar, uma
        exigência de clareza moral - a que o resto da sua obra de sessenta
        anos regressa.

    - id: sophia-de-mello-breyner-andresen-marriage-1946
      title: Casa com Francisco Sousa Tavares; a maternidade leva-a aos livros infantis
      description: >
        Casa com o jornalista, advogado e político Francisco Sousa
        Tavares e muda-se do Porto para Lisboa. Têm cinco filhos - Isabel,
        Maria, Miguel, Sofia e Xavier - e é para eles, a partir de meados
        da década de 1950, que começa a escrever os contos infantis
        ([[work:sophia-de-mello-breyner-andresen/a-menina-do-mar|A Menina
        do Mar]] e os sete títulos que se seguem) que a tornaram tão lida
        pelos alunos portugueses quanto pelos leitores da sua poesia.

    - id: sophia-de-mello-breyner-andresen-husband-arrested-1959
      title: Marido é preso na falhada Revolta da Sé; o casal inventa um código que a PIDE nunca decifrou
      description: >
        Francisco Sousa Tavares, expulso da função pública em 1958 por
        fazer campanha pela candidatura presidencial de oposição do
        general Humberto Delgado, participa na Revolta da Sé, um
        levantamento militar contra Salazar que se desmorona em poucas
        horas, a 11 de março de 1959; é preso juntamente com muitos dos
        seus apoiantes, entre eles o amigo próximo de Sophia, o poeta
        Jorge de Sena. Durante esta e uma segunda prisão em 1968 (pelo seu
        papel na denúncia do escândalo Ballet Rose), Sophia e Francisco
        correspondem-se num código privado que a polícia política nunca
        consegue decifrar; o filho de ambos, Miguel, depositário da
        chave, ainda hoje, décadas depois, se recusa a revelar o que era.

    - id: sophia-de-mello-breyner-andresen-grande-premio-1964
      title: Vence o Grande Prémio de Poesia da Sociedade Portuguesa de Escritores
      description: >
        Recebe o Grande Prémio de Poesia da Sociedade Portuguesa de
        Escritores por
        [[work:sophia-de-mello-breyner-andresen/livro-sexto|Livro
        Sexto]] (1962), a sua sexta coletânea de poesia - o primeiro
        grande reconhecimento literário de uma carreira já com vinte
        anos, e o livro mais vezes associado ao seu Prémio Camões, trinta
        e cinco anos depois.

    - id: sophia-de-mello-breyner-andresen-cnspp-1969
      title: Cofunda a Comissão Nacional de Socorro aos Presos Políticos
      description: >
        Cofunda a Comissão Nacional de Socorro aos Presos Políticos
        (CNSPP), uma organização de oposição que prestava apoio
        financeiro e jurídico às famílias dos presos políticos da
        ditadura do Estado Novo até à queda do regime, em 1974; no mesmo
        ano, candidata-se pela lista de oposição CEUD (Comissão Eleitoral
        de Unidade Democrática). A sua "Cantata da Paz" - "Vemos, ouvimos
        e lemos. Não podemos ignorar!" - torna-se um hino da oposição
        católica progressista ao regime. A justiça a que a sua poesia não
        deixa de regressar não é apenas uma abstração.

    - id: sophia-de-mello-breyner-andresen-constituent-assembly-1975
      title: Eleita para a Assembleia Constituinte; cunha a frase "A Poesia está na rua"
      description: >
        Após a Revolução dos Cravos de 25 de abril de 1974, que põe fim
        ao Estado Novo, é escolhida por Mário Soares como cabeça de lista
        do Partido Socialista pelo círculo do Porto e eleita, em 1975,
        para a Assembleia Constituinte que redige a atual constituição
        portuguesa - uma das 19 deputadas, e a única a presidir a uma
        comissão, a que redige o preâmbulo da constituição, cujo texto se
        mantém inalterado desde 1976. É Sophia quem dá à Revolução a sua
        frase mais citada, "A Poesia está na rua". No plenário, protesta
        contra a integração da Secretaria de Estado da Cultura no
        Ministério da Comunicação Social (2 de agosto), argumenta contra
        o "dirigismo" político sobre a cultura (3 de setembro), e exige
        apoio urgente do Estado às pessoas com deficiência, muitas delas
        feridas de guerra da recém-terminada guerra colonial (3-4 de
        outubro). A 12-13 de novembro está entre os deputados cercados
        durante 36 horas dentro do Palácio de São Bento por cerca de 100
        mil operários da construção civil em protesto, durante o "Verão
        Quente"; questionada, ao sair finalmente, se é fascista, a única
        resposta registada é "Fascista? Eu?..." O seu marido, Francisco
        Sousa Tavares, apesar do seu próprio historial de oposição à
        ditadura, é preterido por todos os partidos na mesma eleição e
        sente-se arredado - um ressentimento que sobrevive à Assembleia,
        dissolvida em 1976; nunca mais é eleita para qualquer cargo.

    - id: sophia-de-mello-breyner-andresen-writing-as-politics-1982
      title: "Entrevista ao Jornal de Letras, 16 de fevereiro de 1982 (entrevistadora Maria Armanda Passos)"
      quote: >
        Fiquei a conversar com as crianças - e pensei, de repente, que
        escrever era a minha verdadeira participação política.
      description: >
        Nunca mais reeleita depois de a Assembleia Constituinte se
        dissolver, conta ao Jornal de Letras (16 de fevereiro de 1982,
        entrevistadora Maria Armanda Passos) o momento que a fez
        decidir-se: ao sair da Assembleia ao princípio de uma noite,
        atravessa o Bairro Alto a pé e é interpelada por crianças a
        brincar num degrau de porta que a reconhecem de uma história que
        a professora lhes tinha lido na aula. "Fiquei a conversar com as
        crianças - e pensei, de repente, que escrever era a minha
        verdadeira participação política." Conta a mesma história de
        novo, quase palavra por palavra, em pelo menos mais uma entrevista
        uma década depois, e é mais direta noutro lugar sobre o custo da
        alternativa: ser deputada, diz em 1989, "custou-me horrorosamente,
        fez-me imenso mal à saúde".

    - id: sophia-de-mello-breyner-andresen-separation-divorce-1986
      title: Separa-se de Francisco Sousa Tavares depois de a política alargar a fenda
      description: >
        O casamento, entre dois temperamentos opostos que discutiam com
        frequência mas esqueciam tudo no dia seguinte, desgasta-se de vez
        depois de 25 de abril de 1974: Sophia vai para a Assembleia
        Constituinte enquanto Francisco, apesar do seu próprio historial
        de resistência à ditadura, não é chamado por nenhum partido para
        se candidatar e sente-se arredado, chegando a ser acusado de
        "social-democrata burguês" por não se posicionar mais à esquerda.
        O casal separa-se em 1986, ao fim de quarenta anos de casamento, e
        divorcia-se em 1988 após um processo litigioso; Francisco casa de
        novo no ano seguinte.

    - id: sophia-de-mello-breyner-andresen-gulbenkian-children-1992
      title: Vence o prémio Gulbenkian de literatura infantil
      description: >
        Recebe o Grande Prémio Calouste Gulbenkian de Literatura para
        Crianças, atribuído desta vez à totalidade do seu catálogo
        infantil e não a um único título - reconhecimento, cerca de
        quatro décadas depois de a maternidade a ter levado a este
        género, de que os oito contos escritos para os próprios filhos se
        tinham tornado uma obra por direito próprio.

    - id: sophia-de-mello-breyner-andresen-vida-literaria-1994
      title: Recebe o prémio de carreira da Associação Portuguesa de Escritores
      description: >
        Quinze anos antes do Camões, aos 74 anos, recebe o Prémio de Vida
        Literária da Associação Portuguesa de Escritores - um
        reconhecimento de carreira que, a par do Prémio D. Dinis e do
        prémio do Pen Clube que
        [[work:sophia-de-mello-breyner-andresen/ilhas|Ilhas]] ganhara em
        1989, assinala o reconhecimento crítico a fechar-se em torno dela
        na década anterior à mais alta honra literária do país.

    - id: sophia-de-mello-breyner-andresen-camoes-prize-1999
      title: Primeira mulher a receber o Prémio Camões
      description: >
        Torna-se a primeira mulher a receber o Prémio Camões, a mais alta
        honra literária da língua portuguesa, trinta e cinco anos depois
        do seu primeiro grande prémio e cinquenta e cinco anos depois da
        sua estreia. Seguem-se o prémio de poesia Max Jacob (2001) e o
        prémio espanhol Reina Sofía de poesia ibero-americana (2003).

    - id: sophia-de-mello-breyner-andresen-death-2004
      title: Morre em Lisboa, aos 84 anos, dez dias antes de uma honra chilena
      description: >
        Morre no Hospital da Cruz Vermelha, em Lisboa, a 2 de julho de
        2004, aos 84 anos, depois de cerca de quinze dias internada. A
        embaixada do Chile tinha anunciado no dia anterior que ela
        receberia a Medalha de Honra do Presidente do Chile, atribuída a
        propósito do centenário de Pablo Neruda (12 de julho) e
        partilhada com o também homenageado José Saramago, que a recebe
        como previsto; é sepultada inicialmente no Cemitério de Carnide.

    - id: sophia-de-mello-breyner-andresen-panteao-2014
      title: Trasladada para o Panteão Nacional, dez anos depois, ao dia, da sua morte
      description: >
        A 20 de fevereiro de 2014, a Assembleia da República vota por
        unanimidade conceder-lhe honras de Panteão; a trasladação ocorre a
        2 de julho, no décimo aniversário da sua morte. Um cortejo parte
        do Cemitério de Carnide, passa pela Assembleia da República e
        chega ao Panteão Nacional, onde o escritor José Manuel dos
        Santos, amigo próximo, profere o elogio fúnebre antes de o
        Presidente Aníbal Cavaco Silva discursar. Torna-se a segunda
        mulher a receber honras de Panteão, depois da fadista Amália
        Rodrigues em 2001; o ato oficial chama-lhe "a escritora
        universal, a mulher digna, a cidadã corajosa, a portuguesa
        insigne".
