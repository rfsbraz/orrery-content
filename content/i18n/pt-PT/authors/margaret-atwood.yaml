# Português europeu (pt-PT) - bio + prosa dos lifeEvents (title + description).
# Os lifeEvents ficam aninhados sob o autor e fundem-se por id (ver
# SCHEMA.md, "Nested lists merge by id"); datas, impact, organisation e
# sources nunca se traduzem, nem o nome do autor. `note` fica na língua de
# base (a mesma regra já aplicada a works.yaml e events.yaml desta
# sobreposição) - margaret-atwood-gibson-family-1973 e
# margaret-atwood-writers-organizations-1981 têm ambas uma nota deste tipo,
# e ficam por traduzir.
#
# A citação de Atwood e da família em margaret-atwood-gibson-death-2019 não
# tem tradução portuguesa publicada localizável e é traduzida aqui como
# qualquer outra prosa. A dedicatória "for Graeme in absentia" mantém-se em
# inglês, tal como no texto de base: é o texto exato da dedicatória impressa
# no livro, não uma frase descritiva a traduzir.

- id: margaret-atwood
  bio: >
    Margaret Eleanor Atwood nasceu em Otava, Ontário, e cresceu em parte nos
    bosques do norte do Quebeque, onde o pai, Carl Edmund Atwood, fazia
    trabalho de campo em entomologia florestal metade de cada ano, e em
    parte em Toronto; só frequentou a escola a tempo inteiro a partir dos
    doze anos. Publicou o seu primeiro opúsculo de poesia, Double
    Persephone, em 1961, e o primeiro romance,
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]], em 1969. A
    sua ficção vai de romances realistas sobre a vida canadiana
    contemporânea às distopias especulativas
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
    (1985) e à sua sequela de 2019,
    [[work:margaret-atwood/the-testaments|Os Testamentos]], e à trilogia
    [[work:margaret-atwood/oryx-and-crake|MaddAddam]], a par de um corpo de
    poesia, contos, ensaios e livros infantis que acompanha os romances ao
    longo de toda a carreira, e não fica de fora deles. Vive em Toronto.
  lifeEvents:
    - id: margaret-atwood-born-1939
      title: Nasce em Otava, cresce nos bosques do Quebeque
      description: >
        Nasceu em Otava, Ontário, a segunda de três filhos do entomólogo
        florestal Carl Edmund Atwood e de Margaret Dorothy Killam Atwood.
        Desde a infância, a família passava metade de cada ano no mato do
        norte do Quebeque e do norte de Ontário, onde o pai fazia trabalho
        de campo sobre insetos florestais, e a outra metade em Toronto,
        onde ele lecionava; só cumpriu um ano letivo inteiro a partir dos
        doze anos. As duas paisagens ficaram na ficção: o regresso e o
        ajuste de contas com a natureza selvagem de
        [[work:margaret-atwood/surfacing|Ressurgir]] (1972) e o olhar
        naturalista que atravessa a sua obra especulativa mais tardia
        nascem ambos aqui.

    - id: margaret-atwood-gibson-family-1973
      title: Uma quinta perto de Alliston, uma nova parceria, uma filha
      description: >
        O casamento de cinco anos de Atwood com o escritor americano Jim
        Polk, que conhecera em Harvard, terminou em divórcio em 1973, o
        mesmo ano em que começou uma relação com o romancista canadiano
        Graeme Gibson. O casal mudou-se para uma quinta perto de Alliston,
        Ontário; a filha de ambos, Eleanor Jess Atwood Gibson, nasceu em
        1976; e a família regressou a Toronto em 1980. Atwood e Gibson
        nunca casaram, e ficaram juntos até à morte dele, 46 anos depois.

    - id: margaret-atwood-writers-organizations-1981
      title: Preside às duas maiores associações de escritores do Canadá
      description: >
        Eleita presidente da Writers' Union of Canada para um mandato entre
        maio de 1981 e maio de 1982. Quando o centro PEN do país se dividiu
        em organismos autónomos de língua inglesa e de língua francesa em
        1983, cofundou no ano seguinte o novo centro PEN canadiano de
        língua inglesa com o também romancista Eugene Benson; os dois foram
        eleitos copresidentes na reunião fundadora de novembro de 1984, e
        ela manteve-se no cargo até 1986. Os dois mandatos decorreram no
        mesmo período da carreira que produziu
        [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
        (1985): o mandato fundador da PEN é defender escritores perseguidos
        e presos, num país que ela imaginava, na página, como o próprio a
        silenciá-los.

    - id: margaret-atwood-father-death-1993
      title: O pai morre, e o luto encontra caminho no verso
      description: >
        Carl Edmund Atwood, o entomólogo florestal cujo trabalho de campo
        moldou os verões da sua infância e, segundo o seu próprio relato, a
        sua noção dos humanos como mais uma comunidade biológica entre
        outras, morreu em Toronto a 5 de janeiro de 1993, aos 86 anos.
        Morning in the Burned House (1995), a sua primeira coletânea de
        poesia nova em onze anos, traz elegias a ele a par de uma viragem
        mais ampla para a mortalidade e a memória familiar.

    - id: margaret-atwood-twitter-2009
      title: Abre uma conta no Twitter para promover um livro, e nunca mais sai de lá
      description: >
        Ao construir o sítio promocional de
        [[work:margaret-atwood/the-year-of-the-flood|The Year of the
        Flood]] em junho de 2009, disseram a Atwood que precisava de um
        feed do Twitter; por relato próprio, mal tinha ouvido falar do
        serviço. Em poucas semanas foi preciso afastar duas contas
        impostoras que usavam o seu nome e fotografia, e os seguidores
        passaram os 30 mil em poucos meses, uma plateia que usou nesse
        inverno para picar o lema olímpico de Vancouver "Own the Podium"
        até "A podium might be nice". Escreveu sobre esta chegada
        desorientadora para a New York Review of Books na primavera
        seguinte, e manteve-se uma voz notoriamente ativa e observada na
        plataforma pela década seguinte e mais além.

    - id: margaret-atwood-dan-david-prize-2010
      title: Aceita um prémio israelita apesar dos apelos a um boicote cultural
      description: >
        Atwood viajou até à Universidade de Telavive para receber o prémio
        Dan David na categoria Presente, "Literature: Rendition of the 20th
        Century", partilhado com o romancista indiano Amitav Ghosh e no
        valor de 500 mil dólares para cada um. Grupos de estudantes
        palestinianos tinham pedido publicamente que recusasse o prémio em
        protesto contra a política israelita em relação a Gaza; aceitou-o
        mesmo assim, dizendo à Bloomberg News "não fazemos boicotes
        culturais" e acrescentando que os artistas "têm nomes mas não têm
        exércitos", e que recusar equivaleria a "atirar borda fora os
        milhares de escritores por todo o mundo que estão presos,
        censurados, exilados e assassinados pelo que publicaram".

    - id: margaret-atwood-future-library-2015
      title: Entrega um manuscrito que ninguém vai ler durante um século
      description: >
        Nomeada em 2014 como a primeira contribuinte da Future Library, um
        projeto norueguês que vai publicar um manuscrito selado e por ler
        todos os anos durante cem anos, impresso em 2114 em papel de uma
        floresta de mil árvores plantadas para o efeito nos arredores de
        Oslo, Atwood entregou o seu próprio manuscrito selado, intitulado
        Scribbler Moon, numa cerimónia nessa floresta a 26 de maio de 2015,
        lendo em vez disso um excerto de
        [[work:margaret-atwood/maddaddam|MaddAddam]] para a plateia
        reunida. Ninguém, nem sequer Atwood, o leu desde então.

    - id: margaret-atwood-gibson-death-2019
      title: Graeme Gibson morre durante a digressão de Os Testamentos
      description: >
        A demência de Graeme Gibson, tornada pública num perfil de Atwood
        na New Yorker de abril de 2017, terminou num AVC e na morte num
        hospital de Londres a 18 de setembro de 2019, cinco dias depois do
        AVC, enquanto a acompanhava na digressão de promoção de
        [[work:margaret-atwood/the-testaments|Os Testamentos]]; os dois
        estavam juntos havia 46 anos. Em comunicado, Atwood e a família
        disseram estar "devastados com a perda de Graeme, nosso amado pai,
        avô e cônjuge, mas felizes por ele ter alcançado o tipo de partida
        rápida que queria e evitado o declínio para uma demência mais
        funda que temia."
        [[work:margaret-atwood/dearly|Afectuosamente]] (2020), a sua
        primeira coletânea de poesia nova em mais de uma década, é dedicada
        "for Graeme in absentia" e reúne poemas sobre o envelhecimento, a
        perda e o luto, escritos sobretudo depois da sua morte.
