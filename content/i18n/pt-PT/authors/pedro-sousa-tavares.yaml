# Português europeu (pt-PT) - sobreposição de prosa curada (bio). Traduz-se
# apenas prosa. Nunca ids, slugs, nomes de autor nem URLs de fontes. As
# referências internas do tipo author:<id>|texto e work:<id>|texto mantêm o
# id; traduz-se apenas o texto apresentado depois do pipe.

- id: pedro-sousa-tavares
  bio: >
    Jornalista português. Em 2009, foi encontrado um fragmento inacabado
    de um conto entre os papéis da sua avó
    [[author:sophia-de-mello-breyner-andresen|Sophia de Mello Breyner
    Andresen]], cinco anos após a morte desta; a convite da sua tia, a
    poeta Maria Andresen de Sousa Tavares, escreveu um final para o conto,
    publicado como
    [[work:sophia-de-mello-breyner-andresen/os-ciganos|Os Ciganos]]
    (2012) - a sua estreia literária.
