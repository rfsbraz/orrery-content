# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Becoming Muhammad Ali não tem edição portuguesa verificada
# nesta ala, por isso o título mantém-se em inglês.

- id: kwame-alexander
  bio: >
    Kwame Alexander é um autor e poeta norte-americano cujo romance em
    verso The Crossover (2014) venceu a Medalha Newbery e uma menção
    honrosa Coretta Scott King; o seu poema ilustrado The Undefeated viria
    a vencer uma menção honrosa Newbery e o Prémio Coretta Scott King de
    Ilustração. Construiu uma vasta obra de sucesso para jovens leitores,
    incluindo Booked, Solo e Rebound. Coescreveu
    [[work:james-patterson/becoming-muhammad-ali|Becoming Muhammad Ali]]
    (2020) com James Patterson.
