# Overlay pt-PT: bio + a prosa dos sete lifeEvents (title/description),
# fundida por id (docs/SCHEMA.md, "Nested lists merge by id") - nunca date,
# impact, sources ou os campos de ilustração. `name` e `aka` não se traduzem.
#
# A única menção a um livro específico com edição portuguesa verificada
# (Along Came a Spider -> "A Conspiração da Aranha", Presença, 2001,
# editions.yaml) usa aqui esse título real, tanto na bio como no lifeEvent
# de 1996 que a cita de novo. The Thomas Berryman Number não tem edição
# portuguesa e mantém-se em inglês.

- id: james-patterson
  bio: >
    Escritor norte-americano de thrillers, nascido em Newburgh, no estado de
    Nova Iorque, e o romancista mais vendido das últimas três décadas em
    número de exemplares. Passou a vida profissional na publicidade, na J.
    Walter Thompson, onde chegou a diretor executivo, escrevendo ficção à
    margem disso até deixar a agência em 1996; o primeiro romance,
    [[work:james-patterson/the-thomas-berryman-number|The Thomas Berryman
    Number]] (1976), ganhou o Prémio Edgar de Melhor Primeiro Romance.
    [[work:james-patterson/along-came-a-spider|A Conspiração da Aranha]]
    (1993) apresentou o psicólogo forense Alex Cross e tornou-se a série
    policial mais vendida nos Estados Unidos da década de 2010. A partir de
    meados da década de 2000 publica quinze a vinte títulos por ano ao longo
    de uma dúzia de séries em curso e três públicos diferentes, a grande
    maioria escritos com um colaborador creditado a partir do seu argumento,
    e disse abertamente que é melhor a inventar enredos do que a escrever
    frase após frase. Fundou a chancela infantil JIMMY Patterson, detém o
    recorde de mais números um na lista de best-sellers do New York Times
    por um único autor, e recebeu o Prémio Literarian da National Book
    Foundation em 2015 e a Medalha Nacional das Humanidades em 2019.
  lifeEvents:
    - id: patterson-born-1947
      title: Nasce em Newburgh, no estado de Nova Iorque
      description: >
        Nasce em Newburgh, no Hudson a norte da cidade de Nova Iorque, o mais
        velho de quatro irmãos e o único rapaz, numa família operária de
        ascendência irlandesa. A mãe era professora; o pai vendia seguros,
        tendo crescido no asilo de pobres local, criado por uma mãe solteira,
        e queria ter sido escritor. No último ano de liceu de Patterson, a
        família muda-se para uma vila perto de Boston. Já disse que em
        criança quase não lia, a não ser o estritamente necessário para ser
        o primeiro da turma.

    - id: patterson-mclean-hospital-1965
      title: Turnos noturnos no McLean
      description: >
        Precisando de dinheiro depois de a família se mudar para o
        Massachusetts, arranja trabalho como auxiliar, em turnos noturnos e
        de fim de semana, no McLean, o hospital psiquiátrico de Belmont, e lê
        nas horas mais tranquilas: é aqui que um rapaz que nunca tinha sido
        leitor se torna um. Robert Lowell era doente internado nessa altura
        e lia e explicava poesia em voz alta no seu quarto uma ou duas vezes
        por dia, e Patterson assistia quando podia. Lia então peças de
        teatro, Genet e Ionesco, e já descreveu a combinação do absurdo na
        página com o sofrimento na ala como a abertura de um mundo que não
        sabia que existia. Tirou também a conclusão oposta à que o cenário
        sugere, e diz nunca ter acreditado que um escritor precise de sofrer
        para ser bom.

    - id: patterson-jwt-chief-executive-1988
      title: Dirige a agência de publicidade
      description: >
        Tinha entrado na J. Walter Thompson em Nova Iorque como redator
        publicitário júnior depois de abandonar um doutoramento em
        Vanderbilt, e subiu até se tornar o diretor criativo mais jovem da
        história da empresa, escrevendo, entre outras coisas, a frase "I'm a
        Toys 'R' Us kid". Em 1988 torna-se diretor executivo da empresa
        norte-americana da agência, e seu presidente em 1990. Foi sempre
        franco quanto a não gostar particularmente do trabalho. O método é,
        ainda assim, o mesmo com que os livros são feitos: um briefing, uma
        equipa, rascunhos revistos e devolvidos, e um romancista que trata da
        sua própria publicidade e lê os seus próprios números de vendas.

    - id: patterson-leaves-advertising-1996
      title: Deixa a publicidade aos quarenta e nove anos
      description: >
        Vinte anos depois do primeiro romance e três depois de A Conspiração
        da Aranha, demite-se da agência para escrever a tempo inteiro. É o
        mesmo ano em que publica três livros em vez de um, e o primeiro com
        o nome de um colaborador ao lado do seu. Questionado sobre isso em
        2009, descreveu-o como uma recuperação: como se costuma dizer da
        publicidade, estava limpo havia treze anos.

    - id: patterson-who-will-save-our-books-2013
      title: Compra anúncios a perguntar quem vai salvar as livrarias
      description: >
        Paga anúncios de página inteira na capa da Publishers Weekly e no
        interior da New York Times Book Review e da Kirkus, com o título
        "Who will save our books? Our bookstores? Our libraries?", listando
        romances que considera que não seriam publicados hoje. O texto
        pergunta por que razão os governos salvaram bancos e fabricantes de
        automóveis e nada disseram sobre livros. O homem que ensinou o mundo
        editorial a anunciar-se na televisão gasta agora dinheiro do próprio
        bolso a anunciar-se contra o declínio do setor; questionado sobre o
        que esperava alcançar, disse que tudo o que podia fazer era mexer um
        pouco na panela.

    - id: patterson-grants-to-bookshops-and-libraries-2014
      title: Começa a devolver o dinheiro
      description: >
        Anuncia um milhão de dólares do próprio bolso para livrarias
        independentes, com as primeiras cinquenta e cinco lojas a partilhar
        mais de 267 000 dólares em apoios de 2000 a 15 000 dólares, para
        gastar como quiserem. Seguem-se as bibliotecas escolares, com mais de
        1,5 milhões prometidos em 2015 e um valor anual elevado a 2 milhões
        em 2018, distribuído em quatro mil apoios de 500 dólares a
        professores individuais, a par de bolsas para futuros professores em
        quatro universidades.

    - id: patterson-literarian-award-2015
      title: Homenageado pela leitura, não pela escrita
      description: >
        A National Book Foundation atribui-lhe o Prémio Literarian de
        Serviço Distinto à Comunidade Literária Americana, e os Los Angeles
        Times Book Prizes um Prémio de Inovação, no mesmo ano; segue-se, em
        2019, a Medalha Nacional das Humanidades, cuja justificação nomeia a
        sua defesa da literacia a par dos próprios livros. É uma distinção
        que as próprias justificações lhe traçam: o romancista mais
        criticado da América é homenageado pelo establishment literário pelo
        que fez pela leitura, e não pelo que escreveu.
