# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Give Please a Chance não tem edição portuguesa verificada
# nesta ala, por isso o título mantém-se em inglês.

- id: bill-oreilly
  bio: >
    Bill O'Reilly é um apresentador de televisão e autor norte-americano
    que apresentou o programa The O'Reilly Factor, na Fox News, entre 1996
    e 2017, ano em que a estação decidiu não renovar o seu contrato depois
    de o New York Times noticiar que ele e a Fox tinham chegado a acordo em
    várias queixas de assédio sexual contra si. Com Martin Dugard
    coescreveu a série de história best-seller Killing (Killing Lincoln,
    Killing Kennedy, entre outros), vários dos quais adaptados a filmes da
    National Geographic. Coescreveu o livro infantil
    [[work:james-patterson/give-please-a-chance|Give Please a Chance]]
    (2016) com James Patterson.
