# Overlay pt-PT (português europeu): entidade mínima de colaborador,
# introduzida por esta ala para suportar withAuthorIds em
# umberto-eco/belief-or-nonbelief. Apenas `bio` (lifeEvents: []). Sem edição
# portuguesa registada em editions.yaml para essa obra, pelo que a referência
# interna fica com o título original italiano, tal como no texto de base.
- id: carlo-maria-martini
  bio: >
    Jesuíta italiano, biblista e Cardeal Arcebispo de Milão (1980-2002),
    considerado uma das vozes mais destacadas da ala progressista da Igreja.
    Correspondeu-se publicamente com Umberto Eco numa série de cartas
    publicadas como [[work:umberto-eco/belief-or-nonbelief|In cosa crede chi
    non crede?]] (1996), cada um escrevendo apenas o seu próprio lado da
    troca.
