- id: john-tiffany
  bio: >
    Encenador de teatro inglês. Coautor original da história de
    [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter e a
    Criança Amaldiçoada]] com [[author:jk-rowling|J. K. Rowling]] e o
    dramaturgo [[author:jack-thorne|Jack Thorne]], e encenador das suas
    produções em palco; a própria ficha de créditos do texto publicado
    nomeia-o como autor da história ao lado de Rowling e Thorne, distinto
    do crédito exclusivo de Thorne pela escrita do texto.
