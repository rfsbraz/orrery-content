# Overlay pt-PT: apenas `bio` é prosa (id, name, aka e sources nunca se
# traduzem). Nenhum dos três títulos citados tem edição portuguesa
# verificada nesta ala, por isso mantêm-se em inglês.

- id: bill-clinton
  bio: >
    Bill Clinton foi o 42.º Presidente dos Estados Unidos, em dois mandatos
    (1993-2001), depois de dois mandatos como governador do Arkansas. A sua
    presidência atravessou uma longa expansão económica e a aprovação do
    NAFTA e da reforma da assistência social, e incluiu o processo de
    impeachment na Câmara dos Representantes em 1998 e a absolvição pelo
    Senado em 1999. Desde que deixou o cargo dirige os programas de saúde
    pública e desenvolvimento da Clinton Foundation. Já na casa dos setenta
    anos, dedicou-se à ficção, coescrevendo três thrillers políticos com
    James Patterson:
    [[work:james-patterson/the-president-is-missing|The President Is Missing]]
    (2018), [[work:james-patterson/the-presidents-daughter|The President’s
    Daughter]] (2021) e
    [[work:james-patterson/the-first-gentleman|The First Gentleman]] (2025).
