# Tradução pt-PT. Os títulos das duas eras ("Os Anos de Formação", "A Fase da
# Maturidade") já são portugueses na base - são os próprios termos da crítica
# citada nas fontes - e são repetidos aqui sem alteração.

- id: os-anos-de-formacao
  title: "Os Anos de Formação"
  themes: [aprendizagem neoclássica, exílio em Inglaterra e França, a fundação do Romantismo português, o romanceiro popular, panfletarismo liberal]
  description: >
    Os anos de formação, "os anos de formação" na expressão de Helena
    Carvalhão Buescu para a Imprensa Nacional e o período a que Ofélia
    Paiva Monteiro deu nome no título da sua tese sobre Garrett. Maria
    Helena Santana descreve o mesmo período como uma primeira fase
    dominada pela poesia lírica e narrativa, ainda oscilante entre o
    neoclassicismo convencional e a nova corrente romântica. Vai dos
    versos de estudante do
    [[work:almeida-garrett/hino-patriotico|Hino Patriótico]] e do
    escândalo de
    [[work:almeida-garrett/o-retrato-de-venus|O Retrato de Vénus]] até aos
    dois exílios políticos, que é onde a escrita muda:
    [[work:almeida-garrett/camoes|Camões]] (1825) e
    [[work:almeida-garrett/dona-branca|Dona Branca]] (1826), ambos
    escritos e impressos no estrangeiro, são os textos fundadores do
    Romantismo português, e [[work:almeida-garrett/adozinda|Adozinda]]
    inicia a recolha de tradição oral que dará o Romanceiro. O exílio
    produz também os ensaios
    [[work:almeida-garrett/da-educacao|Da Educação]] e
    [[work:almeida-garrett/portugal-na-balanca-da-europa|Portugal na
    Balança da Europa]].

- id: a-fase-da-maturidade
  title: "A Fase da Maturidade"
  themes: [o teatro nacional, o drama histórico, a prosa portuguesa moderna, a lírica íntima, o desencanto político]
  description: >
    Os vinte anos que Buescu conta "entre o seu regresso a Portugal depois
    do exílio e a sua morte em 1854", e a que Maria Helena Santana chama
    "a fase da maturidade": o período que produz, nas suas palavras, as
    obras maiores do autor, tanto na lírica como na narrativa e no drama.
    De volta a Lisboa, Garrett é encarregado de reconstruir o palco
    português e escreve para ele um repertório nacional, de
    [[work:almeida-garrett/um-auto-de-gil-vicente|Um Auto de Gil
    Vicente]] (1838) a
    [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]].
    Afastado dos cargos públicos em julho de 1841, volta-se para a obra
    que a cronologia da Biblioteca Nacional intitula "A literatura ganhou
    com este ócio involuntário":
    [[work:almeida-garrett/o-arco-de-santana|O Arco de Sant'Ana]],
    [[work:almeida-garrett/viagens-na-minha-terra|Viagens na Minha
    Terra]], tida como a primeira narrativa em prosa moderna portuguesa, e
    a lírica tardia de
    [[work:almeida-garrett/flores-sem-fruto|Flores sem Fruto]] e
    [[work:almeida-garrett/folhas-caidas|Folhas Caídas]].
