# Português europeu (pt-PT) - sinopses. Os títulos NÃO são traduzidos: já são
# os originais portugueses (proibido pelo próprio validador em works.yaml).
# As notas de curadoria (`note:`) ficam na língua de base - são anotações
# editoriais, não prosa para o leitor. A sinopse de frei-luis-de-sousa
# mantém-se deliberadamente no mesmo ponto da sinopse da edição escolar da
# Porto Editora, sem nomear a identidade do romeiro nem o desfecho do
# terceiro ato.

- id: almeida-garrett/hino-patriotico
  synopsis: >
    Um hino patriótico escrito à notícia da Revolução Liberal do Porto de 24
    de agosto de 1820, impresso como folheto na cidade dias depois e cantado
    no Teatro de São João a 27, com música de J. A. Ribas - a primeira obra
    publicada de Garrett, um ano antes de
    [[work:almeida-garrett/o-retrato-de-venus|O Retrato de Vénus]] e de
    Catão lhe trazerem a primeira atenção verdadeira.

- id: almeida-garrett/ao-corpo-academico
  synopsis: >
    Um poema impresso numa coletânea de vários autores com versos recitados
    na Sala dos Actos Grandes da Universidade de Coimbra em 1821 - uma das
    várias peças de circunstância breves dos anos de Coimbra de Garrett,
    recuperada e reeditada por Martins de Carvalho no jornal O Conimbricense
    em 1874.

- id: almeida-garrett/o-retrato-de-venus
  synopsis: >
    Um poema narrativo libertino, escrito enquanto Garrett era estudante de
    Direito em Coimbra, que lhe valeu um processo por "materialismo,
    ateísmo e imoralidade" - foi absolvido em 1822. O primeiro confronto
    com o Estado por causa da sua própria escrita, um padrão que se
    repetiria ao longo da carreira.

- id: almeida-garrett/camoes
  synopsis: >
    Um poema narrativo sobre os últimos dias de Luís de Camões, o poeta
    nacional português, escrito no exílio em França depois da Vilafrancada
    de 1823. Uma das três obras que a Wikipédia inglesa nomeia como
    "notable works" de Garrett, geralmente tida, a par de
    [[work:almeida-garrett/dona-branca|Dona Branca]] no ano seguinte, como
    o primeiro poema romântico da literatura portuguesa.

- id: almeida-garrett/dona-branca
  synopsis: >
    Um poema épico-romântico ambientado na conquista cristã medieval do
    Algarve, publicado em Paris sob as iniciais "F. E." no ano seguinte a
    [[work:almeida-garrett/camoes|Camões]] - o segundo dos dois poemas
    normalmente tidos como fundadores do Romantismo literário português.

- id: almeida-garrett/adozinda
  synopsis: >
    Um poema narrativo publicado em Londres durante o segundo exílio de
    Garrett, ancorado no romanceiro oral português - uma primeira
    manifestação do interesse pela tradição popular que mais tarde daria
    origem ao
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]].

- id: almeida-garrett/lirica-de-joao-minimo
  synopsis: >
    Uma coletânea de poemas líricos publicada em Londres em 1829, sob a
    persona poética inventada "João Mínimo" - uma obra menor entre os
    poemas épicos do exílio e a lírica mais pessoal que viria depois.

- id: almeida-garrett/lealdade-ou-a-vitoria-da-terceira
  synopsis: >
    Uma canção publicada em folheto em Londres em 1829, no mesmo ano de
    [[work:almeida-garrett/lirica-de-joao-minimo|Lírica de João Mínimo]],
    homenageando a resistência liberal na Terceira - a ilha açoriana onde a
    própria família de Garrett se tinha refugiado da segunda invasão
    francesa em 1809 e que ancorou a causa liberal ao longo dos anos de
    exílio.

- id: almeida-garrett/miragaia
  synopsis: >
    Um poema mais breve publicado em Lisboa em 1844, um ano antes de
    [[work:almeida-garrett/flores-sem-fruto|Flores sem Fruto]] e quase uma
    década antes de [[work:almeida-garrett/folhas-caidas|Folhas Caídas]].

- id: almeida-garrett/os-exilados-a-senhora-rossi-caccia
  synopsis: >
    Um poema escrito para um baile de caridade em favor dos exilados
    políticos, publicado pela primeira vez, de forma anónima, a 31 de março
    de 1845 no jornal Revolução de Setembro (como "A Madame Rossi Caccia")
    e no mesmo dia em folheto próprio, em homenagem à cantora Rossi-Caccia,
    que atuou no evento.

- id: almeida-garrett/flores-sem-fruto
  synopsis: >
    Uma coletânea de poesia a que a própria biografia da Wikipédia inglesa
    atribui, a par de [[work:almeida-garrett/folhas-caidas|Folhas Caídas]]
    oito anos depois, uma "maneira inovadora" que assinala a mudança para
    o registo mais complexo e subjetivo que a sua prosa ia assumindo ao
    mesmo tempo em
    [[work:almeida-garrett/o-arco-de-santana|O Arco de Sant'Ana]].

- id: almeida-garrett/folhas-caidas
  synopsis: >
    O último livro que Garrett completou e, no juízo da própria biografia
    da Wikipédia inglesa, "provavelmente o melhor" dos seus livros de
    poesia - escrito para Rosa de Montúfar, a nobre espanhola que se
    tornou sua companheira nos últimos anos, e publicado pela primeira vez
    no Rio de Janeiro antes de chegar a Lisboa no mesmo ano.

- id: almeida-garrett/catao
  synopsis: >
    Uma tragédia neoclássica sobre a morte de Catão, o Jovem, escrita ainda
    como estudante em Coimbra e estreada no Teatro do Bairro Alto, em
    Lisboa, a 29 de setembro de 1821, antes da publicação de 1822 - a
    primeira obra de Garrett levada à cena, mais tarde reposta em Londres
    (1830), no Rio de Janeiro (1833) e de novo em Lisboa (1845).

- id: almeida-garrett/merope
  synopsis: >
    Uma tragédia neoclássica escrita em 1820, referida na cronologia de
    marcos da própria Wikipédia portuguesa sobre a obra inicial de Garrett
    a par de [[work:almeida-garrett/lucrecia|Lucrécia]],
    [[work:almeida-garrett/o-retrato-de-venus|O Retrato de Vénus]] e
    [[work:almeida-garrett/catao|Catão]] - mas, ao contrário destas três,
    nunca foi levada à cena em vida do autor, só chegando à estampa em
    1841.

- id: almeida-garrett/um-auto-de-gil-vicente
  synopsis: >
    Uma peça histórica construída em torno de Gil Vicente, a própria
    figura fundadora do teatro português, levada à cena no Teatro Nacional
    da Rua dos Condes, em Lisboa - escrita nos anos em que Garrett fazia
    campanha pelo teatro nacional e pelo conservatório de arte dramática
    que viriam, mais tarde, a representá-la.

- id: almeida-garrett/o-alfageme-de-santarem
  synopsis: >
    Uma peça histórica levada à cena no Teatro Nacional da Rua dos Condes,
    escrita nos mesmos anos de construção do teatro nacional que
    [[work:almeida-garrett/um-auto-de-gil-vicente|Um Auto de Gil Vicente]].

- id: almeida-garrett/frei-luis-de-sousa
  synopsis: >
    Anos depois de o primeiro marido ter sido dado como morto na batalha de
    Alcácer-Quibir, Madalena de Vilhena casou de novo com Manuel de Sousa
    Coutinho e construiu com ele uma casa feliz, com a filha de ambos,
    Maria - uma casa perturbada apenas pelos pressentimentos da rapariga e
    por Telmo, o velho aio que nunca deixou de esperar o regresso do
    primeiro marido. Um drama em três atos sobre o pano de fundo da
    resistência ao domínio filipino, livremente baseado no escritor
    seiscentista Manuel de Sousa Coutinho, que tomou o nome religioso de
    Frei Luís de Sousa; lido pela primeira vez em público num teatro
    privado em 1843 e publicado no ano seguinte. Uma das três obras que a
    Wikipédia inglesa nomeia como "notable works" de Garrett.

- id: almeida-garrett/d-filipa-de-vilhena
  synopsis: >
    Uma peça histórica sobre Filipa de Vilhena, lembrada por ter armado os
    filhos para a Restauração de 1640, que pôs fim a sessenta anos de
    domínio filipino - levada à cena no teatro da Rua do Salitre do
    próprio Conservatório, pela sua companhia de alunos, a terceira do
    trio de teatro histórico que a Wikipédia inglesa nomeia a par de
    [[work:almeida-garrett/um-auto-de-gil-vicente|Um Auto de Gil Vicente]]
    e [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]].

- id: almeida-garrett/falar-verdade-a-mentir
  synopsis: >
    Uma comédia estreada em 1846 no mesmo programa de
    [[work:almeida-garrett/d-filipa-de-vilhena|D. Filipa de Vilhena]], e
    reeditada no Rio de Janeiro em 1858.

- id: almeida-garrett/a-sobrinha-do-marques
  synopsis: >
    Uma comédia publicada em Lisboa em 1848.

- id: almeida-garrett/camoes-do-rossio
  synopsis: >
    Uma comédia publicada em 1852, escrita em conjunto com Inácio Feijó.

- id: almeida-garrett/lucrecia
  synopsis: >
    Uma tragédia sobre a lenda de Lucrécia, esboçada em Coimbra em 1819,
    quando Garrett tinha vinte anos, e referida na cronologia de marcos da
    própria Wikipédia portuguesa como a sua obra mais antiga registada -
    embora, como a maior parte da sua juvenília de Coimbra, só tenha
    chegado à estampa em 1914, sessenta anos depois da sua morte.

- id: almeida-garrett/um-noivado-no-dafundo
  synopsis: >
    Uma peça cómica de um ato, escrita em 1847 e publicada pela primeira
    vez apenas em 1857, três anos depois da morte de Garrett.

- id: almeida-garrett/as-profecias-do-bandarra
  synopsis: >
    Uma comédia escrita em 1845 e, segundo a cronologia de marcos da
    própria Wikipédia portuguesa, levada à cena ou de algum modo conhecida
    por volta de 1848 - mas só publicada em livro em 1877, vinte e três
    anos depois da morte de Garrett.

- id: almeida-garrett/teatro-de-juventude-inedito
  synopsis: >
    Dez peças breves ou inacabadas que Garrett esboçou em adolescente, em
    Coimbra, nos Açores e em Sintra, entre cerca de 1816 e 1822 -
    tragédias, comédias e um libreto de ópera em italiano - nenhuma
    publicada em vida e várias explicitamente deixadas incompletas.

- id: almeida-garrett/entremez-dos-velhos-namorados
  synopsis: >
    Um entremez cómico de um ato, escrito em 1841, o mesmo ano de
    [[work:almeida-garrett/o-alfageme-de-santarem|O Alfageme de
    Santarém]], e só publicado em 1954, um século depois da morte de
    Garrett - recuperado por Damien Saunal para a sua edição crítica de
    textos inéditos de Garrett.

- id: almeida-garrett/o-arco-de-santana
  synopsis: >
    Um romance histórico ambientado em Lisboa, começado em 1845 e
    concluído em 1850 - a própria biografia da Wikipédia inglesa aponta
    Notre-Dame de Paris, de Victor Hugo, como inspiração, e atribui-lhe a
    marca da mudança na prosa de Garrett para o estilo mais complexo e
    subjetivo que depois levaria para
    [[work:almeida-garrett/viagens-na-minha-terra|Viagens na Minha Terra]].

- id: almeida-garrett/viagens-na-minha-terra
  synopsis: >
    Uma viagem de Lisboa a Santarém, contada na voz digressiva e pessoal de
    Garrett viajante, abre-se para uma segunda história, de romance, entre
    dois jovens namorados, Carlos e Joaninha, que o narrador afirma ter
    recolhido pelo caminho - o real e o inventado entrelaçam-se ao longo de
    todo o livro. Publicado em folhetim a partir de 1843 e em dois volumes
    em 1846, é apontado pelo seu próprio artigo dedicado na Wikipédia
    portuguesa como o ponto de partida da prosa literária portuguesa
    moderna, antecipando Eça de Queirós; a terceira das obras que a
    Wikipédia inglesa nomeia como "notable works" de Garrett, e de um modo
    geral o seu livro mais lido.

- id: almeida-garrett/helena
  synopsis: >
    Um fragmento de um romance inacabado, publicado em 1871, dezassete
    anos depois da morte de Garrett.

- id: almeida-garrett/memorias-de-joao-coradinho
  synopsis: >
    Uma narrativa de aventuras picaresca escrita em 1825, durante o
    primeiro exílio de Garrett, e publicada pela primeira vez em 1881,
    vinte e sete anos depois da sua morte.

- id: almeida-garrett/joaninha-dos-olhos-verdes
  synopsis: >
    Uma narrativa publicada postumamente, impressa pela primeira vez em
    1941, oitenta e sete anos depois da morte de Garrett.

- id: almeida-garrett/komurahi-historia-brasileira
  synopsis: >
    Um conto ambientado no Brasil, escrito em 1825 durante o primeiro
    exílio de Garrett e publicado pela primeira vez em 1956, mais de um
    século depois.

- id: almeida-garrett/bosquejo-da-historia-da-poesia-e-da-lingua-portuguesa
  synopsis: >
    Um ensaio histórico-literário sobre a história da poesia e da língua
    portuguesas, publicado em Paris em 1826 - o alicerce crítico do
    projeto de recolha folclórica que Garrett levaria mais tarde ao
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]].

- id: almeida-garrett/parnaso-lusitano
  synopsis: >
    Uma antologia em cinco volumes de poesia portuguesa clássica e
    contemporânea, selecionada e organizada por Garrett e publicada em
    Paris entre 1826 e 1827 - um projeto de formação de cânone, em poesia,
    do mesmo género que o
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]] viria a ser mais tarde para o romanceiro popular.

- id: almeida-garrett/romanceiro-e-cancioneiro-geral
  synopsis: >
    Uma coleção marcante de romances, cantigas e poesia oral tradicionais
    portugueses, reunida e organizada por Garrett - o primeiro volume
    publicado em 1843, e mais dois volumes que completam o projeto em
    1851 - um projeto erudito que se folheia por partes, não se lê do
    princípio ao fim, por isso classificado como `reference` (taxonomia de
    `format` do SCHEMA.md).

- id: almeida-garrett/cancioneiro-de-romances-xacaras-e-solaus
  synopsis: >
    Uma coletânea manuscrita anterior e independente do romanceiro
    tradicional português, esboçada em 1824 - uma geração inteira antes do
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]] - e só publicada em 1987, mais de um século depois
    da morte de Garrett.

- id: almeida-garrett/da-poesia-popular-em-portugal
  synopsis: >
    Um ensaio literário sobre a poesia popular portuguesa, publicado em
    Lisboa em 1846, três anos depois de iniciado o projeto do
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]].

- id: almeida-garrett/da-educacao
  synopsis: >
    Um tratado sobre educação, publicado em Londres em 1829, durante o
    segundo exílio de Garrett.

- id: almeida-garrett/portugal-na-balanca-da-europa
  synopsis: >
    Um ensaio político sobre o lugar de Portugal na nova ordem europeia
    depois das Guerras Napoleónicas, publicado em Londres em 1830.

- id: almeida-garrett/discursos-parlamentares-e-memorias-biograficas
  synopsis: >
    Uma antologia póstuma dos discursos parlamentares e memórias
    biográficas de Garrett, publicada pela Imprensa Nacional em 1871 -
    referida na cronologia de marcos da própria Wikipédia portuguesa sobre
    as suas principais edições, distinta das muitas peças políticas de
    circunstância, individualmente mais curtas, reunidas em
    [[work:almeida-garrett/discursos-memorias-e-opusculos-politicos|Discursos,
    Memórias e Opúsculos Políticos]].

- id: almeida-garrett/discursos-memorias-e-opusculos-politicos
  synopsis: >
    A prosa política e de circunstância de Garrett ao longo da carreira:
    panfletos do exílio, discursos parlamentares, pareceres jurídicos e
    orações fúnebres por figuras políticas e culturais do seu tempo, cada
    uma publicada na época como um pequeno folheto independente.

- id: almeida-garrett/cartas-de-amor-a-viscondessa-da-luz
  synopsis: >
    As cartas de amor privadas de Garrett a Rosa de Montúfar, Viscondessa
    de Nossa Senhora da Luz - a companheira dos seus últimos anos a quem
    dedicou [[work:almeida-garrett/folhas-caidas|Folhas Caídas]] -
    publicadas pela primeira vez em 1955, um século depois da sua morte.

- id: almeida-garrett/diarios-e-correspondencia
  synopsis: >
    O diário pessoal de Garrett e a sua correspondência privada e oficial,
    reunidos em livro ao longo das décadas seguintes à sua morte.

- id: almeida-garrett/poesia-dispersa-e-postuma
  synopsis: >
    Poemas menores e de juventude, a maioria escritos por Garrett na
    adolescência ou nos vinte anos e deixados por publicar ou dispersos
    por periódicos, reunidos e impressos aos poucos entre 1877 e 1985.
