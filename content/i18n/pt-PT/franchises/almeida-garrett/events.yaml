# Tradução pt-PT dos eventos da franquia.

- id: almeida-garrett-frei-luis-de-sousa-film-1950
  title: Primeira adaptação ao cinema, mais de um século depois da peça
  description: >
    O [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]] a
    preto e branco, de António Lopes Ribeiro, estreou no Cinema São Jorge,
    em Lisboa, a 21 de setembro de 1950, cento e seis anos depois da peça,
    com um argumento e um elenco (Maria Sampaio, Raul de Carvalho, João
    Villaret) tirados diretamente da peça e banda sonora do compositor
    Luís de Freitas Branco. A sua fotografia, de Aquilino Mendes, venceu
    nesse ano o prémio de melhor fotografia do Secretariado Nacional de
    Informação - o próprio organismo de propaganda e cultura do Estado
    Novo a dar o seu prémio anual à primeira adaptação da peça ao cinema.

- id: almeida-garrett-quem-es-tu-film-2001
  title: Um segundo filme, feito expressamente para os alunos obrigados a ler a peça
  description: >
    "Quem És Tu?", de João Botelho (23 de novembro de 2001), volta a
    adaptar [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de
    Sousa]], filmado em interiores fechados e pouco iluminados que isolam
    as personagens em vez de abrir a peça - e foi feito, segundo o
    propósito declarado do próprio realizador, para os alunos do
    secundário que têm Frei Luís de Sousa como leitura obrigatória. Uma
    segunda adaptação, mais de noventa anos depois da primeira, feita
    expressamente para a sala de aula e não para a bilheteira, é já por si
    um facto sobre a sobrevivência da peça: continua a ler-se aqui, ainda
    hoje, por imposição curricular, não só por história literária.
