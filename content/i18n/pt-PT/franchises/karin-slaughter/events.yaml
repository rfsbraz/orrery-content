# Overlay pt-PT dos eventos da franquia: `title` + `description` (os títulos dos
# eventos são prosa, não títulos publicados).
# Datas, impact, scope, reach, spoilerAfter e sources nunca se traduzem. Os
# títulos de obras citados ficam em inglês (não há edições portuguesas).
- id: karin-slaughter-blindsighted-post-911-tour-2001
  title: Uma digressão de estreia feita quase sempre sozinha
  description: >
    [[work:karin-slaughter/blindsighted|Blindsighted]] foi publicado a 17 de
    setembro de 2001, seis dias depois de os atentados de 11 de setembro terem
    paralisado grande parte do tráfego aéreo americano. A editora ofereceu-lhe
    adiar a digressão de lançamento, por achar que os leitores não estavam com
    disposição para ouvir falar de mais mortes, mas ela trabalhara anos para
    aquilo e foi na mesma: nos primeiros voos, contou, era "só eu e a
    hospedeira a olharmos uma para a outra". A afluência às leituras, descobriu,
    foi melhor do que esperava.

- id: karin-slaughter-grant-county-hometown-texture-2003
  title: Grant County, feito de tardes de sábado a sério
  description: >
    Perguntada em 2003 como conciliava uma pequena cidade fictícia da Geórgia
    com a cidade real onde cresceu, Slaughter disse que o elenco de fundo de uma
    pequena terra do Sul - "a mulher da má fama, a bisbilhoteira, as famílias más
    e as boas" - era material que reparara em criança: o pai levava-a à loja de
    ferragens aos fins de semana, onde ela se sentava a ouvir os velhos
    conversar. Descreveu querer que os romances de Grant County honrassem o Sul
    americano em vez de negociar com os seus lugares-comuns, nomeando Margaret
    Mitchell e Flannery O'Connor como a tradição em que mais se orgulhava de
    escrever.

- id: karin-slaughter-will-trent-dyslexia-origin
  title: Dar a Will Trent algo para esconder
  description: >
    Will Trent é disléxico desde a
    primeira aparição em [[work:karin-slaughter/triptych|Triptych]] (2006), um
    traço que Slaughter explicou numa entrevista de 2012, a propósito do
    lançamento de Criminal no Reino Unido: "Ler com fluência é uma coisa tão
    natural, sobretudo para quem lê livros, que eu queria dar-lhe algo que o
    fizesse sentir-se um estranho. Além disso, a dislexia é uma coisa que se
    esconde dos outros, o que lhe dá acesso à mente dos criminosos com quem fala
    e que, afinal, também escondem alguma coisa." Continua capaz de ler, notou
    ela, apenas não depressa, e disfarça-o deixando que Faith Mitchell trate da
    papelada. Cada cena em que Will esconde a dislexia de um colega ou de um
    suspeito carrega esse paralelo deliberado: um detetive que lê as pessoas para
    viver porque a página impressa nunca lhe saiu com facilidade.

- id: karin-slaughter-criminal-help-for-policewomen-2012
  title: O que The Help fez pela raça, Criminal faz pelo distintivo
  description: >
    [[work:karin-slaughter/criminal|Criminal]] divide a narrativa entre o
    presente e 1975, quando as primeiras mulheres na polícia de Atlanta eram
    tratadas por insultos na cara, viam-se recusar um empréstimo automóvel ou um
    cartão de crédito sem a assinatura de um homem, e precisavam de um vestígio
    de sémen para sustentar uma acusação de violação. Slaughter disse ter-se
    proposto fazer pelo sexismo no policiamento o que a amiga Kathryn Stockett
    fizera pela raça em The Help, pesquisando a época no Atlanta History Center e
    entrevistando diretamente polícias veteranas; deu a uma das mulheres
    desaparecidas do romance o nome "Kitty", em homenagem a Stockett. O fio dos
    anos 70 não é ornamento de época - é o argumento que o livro está a defender.

- id: karin-slaughter-cop-town-steel-dagger-2015
  title: Um desvio independente ganha-lhe o maior prémio britânico
  description: >
    [[work:karin-slaughter/cop-town|Cop Town]] (2014) foi o primeiro romance
    independente de Slaughter após treze anos dentro das séries Grant County e
    Will Trent, e em setembro de 2015 venceu o Ian Fleming Steel Dagger da Crime
    Writers' Association, atribuído anualmente ao melhor thriller do ano. O júri
    chamou-lhe "uma história fascinante, a transbordar de pormenor de época rico
    e evocativo da Atlanta de 1974", com personagens que se liam como
    "imediatamente reais, cativantes, bem construídas e convincentes". Foi também
    a sua primeira nomeação para o Edgar de Melhor Romance: prova, a par do
    sucesso comercial de Cop Town, de que a experiência independente compensou
    também junto da crítica, e não só nas listas de mais vendidos que já
    sustentavam o seu trabalho em série.

- id: karin-slaughter-false-witness-pandemic-2021
  title: Escrever a pandemia para dentro de um thriller, de propósito
  description: >
    [[work:karin-slaughter/false-witness|False Witness]] (2021) passa-se durante
    a COVID-19 de forma deliberada - no início da pandemia, Slaughter sondou
    outros romancistas sobre se a deviam escrever para dentro da sua ficção
    contemporânea e descobriu que a maioria tencionava evitá-la, até que Michael
    Connelly lhe disse que tencionava incluí-la: "Pensei que, se o Mike o vai
    fazer e não leva porrada por isso, também o faço." Fez questão de enquadrar o
    resultado como um thriller que por acaso decorre durante a pandemia, e não um
    romance sobre ela, querendo espaço para a textura que a não-ficção não
    consegue captar - desinfetante de mãos com cheiro a tequila, "maskholes" que
    usam a máscara abaixo do nariz - a par do acerto de contas de duas irmãs
    afastadas com um trauma partilhado do passado.

- id: karin-slaughter-pieces-of-her-netflix-2022
  title: Pieces of Her estreia em primeiro lugar mundial na Netflix
  description: >
    A adaptação em oito episódios de
    [[work:karin-slaughter/pieces-of-her|Pieces of Her]], com Toni Collette e
    Bella Heathcote, estreou na Netflix a 4 de março de 2022 e entrou em primeiro
    lugar mundial; entre 27 de fevereiro e 3 de abril de 2022 foi vista 227,5
    milhões de horas em todo o mundo. Foi o primeiro romance de Slaughter
    adaptado para o ecrã, e abriu a porta à série de Will Trent no ano seguinte.

- id: karin-slaughter-will-trent-abc-premiere-2023
  title: Will Trent chega à televisão
  description: >
    "Will Trent" da ABC, com Ramón Rodríguez no papel do agente do GBI e Erika
    Christensen como Angie Polaski, estreou a 3 de janeiro de 2023 na ABC e na
    Hulu. Deu a uma série impressa que decorria desde 2006 um público televisivo
    de grande escala pela primeira vez, e foi renovada para uma quarta
    temporada, que estreou a 6 de janeiro de 2026.
