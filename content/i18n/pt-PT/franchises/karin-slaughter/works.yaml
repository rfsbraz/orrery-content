# Overlay pt-PT das obras: apenas `synopsis` (prosa, sem spoilers).
# id, title, published, canonTier e sources nunca se traduzem. Karin Slaughter
# não tem edições portuguesas registadas, por isso os títulos de obras e os
# nomes das personagens citados na prosa ficam em inglês.

# --- Grant County ---
- id: karin-slaughter/blindsighted
  synopsis: >
    Uma jovem professora universitária é encontrada brutalmente mutilada num
    pequeno restaurante da Geórgia, e a autópsia de Sara Linton, pediatra tornada
    médica-legista, revela a assinatura retorcida de um assassino. O ex-marido, o
    chefe da polícia Jeffrey Tolliver, conduz a caça enquanto o caso se volta
    para o passado da própria Sara e para a sede de justiça da detetive Lena
    Adams.

- id: karin-slaughter/kisscut
  synopsis: >
    Uma disputa entre adolescentes no ringue de patinagem de Heartsdale explode
    num tiroteio, e o rapto que se segue enreda a médica-legista Sara Linton e o
    chefe da polícia Jeffrey Tolliver num caso mais sombrio do que qualquer um
    espera, enquanto a detetive Lena Adams, a recuperar de uma perda pessoal
    devastadora, é atraída por um jovem que talvez tenha as respostas.

- id: karin-slaughter/a-faint-cold-fear
  synopsis: >
    Um aparente suicídio de estudante no campus universitário de Heartsdale
    arrasta Sara Linton e Jeffrey Tolliver para uma série de mortes que parecem
    encenadas, enquanto uma antiga detetive tornada segurança do campus, expulsa
    da corporação por memórias de que não consegue fugir, talvez seja a chave
    para travar o que se passa realmente com os jovens da cidade.

- id: karin-slaughter/indelible
  synopsis: >
    Dois homens armados invadem a esquadra de Heartsdale, deixando um agente
    morto e Jeffrey Tolliver gravemente ferido; feita refém ao lado de uma turma
    de crianças, Sara Linton procura na memória de um crime anterior e
    dilacerante, do início da relação dos dois, uma saída.

- id: karin-slaughter/faithless
  synopsis: >
    Uma jovem é encontrada enterrada viva, e depois morta, nos bosques da
    Geórgia, lançando Sara Linton e Jeffrey Tolliver por um rasto de fé, dúvida e
    paixão escondida até um dos assassinos mais perigosos que qualquer um deles
    enfrentou.

- id: karin-slaughter/beyond-reach
  synopsis: >
    A detetive Lena Adams é presa pelo homicídio de uma mulher e, enquanto o
    chefe da polícia Jeffrey Tolliver investiga a própria subordinada, Sara
    Linton é arrastada para um caso que recua até ao passado dos três. O sexto e
    último romance de Grant County.

# --- Will Trent ---
- id: karin-slaughter/triptych
  synopsis: >
    Um assassino que atravessa as fronteiras de riqueza e de raça de Atlanta
    junta um detetive de homicídios instável e o polícia da brigada de costumes
    que foi outrora seu amante, enquanto um ex-recluso que tropeçou no rasto do
    assassino talvez seja a chave para deslindar o caso.

- id: karin-slaughter/fractured
  synopsis: >
    Num dos bairros mais cobiçados de Atlanta, uma adolescente é selvaticamente
    assassinada no próprio quarto, e o investigador do GBI Will Trent é chamado a
    um departamento com pouco interesse na sua ajuda.

- id: karin-slaughter/undone
  synopsis: >
    A médica de trauma Sara Linton, agora a viver em Atlanta, é apanhada numa
    investigação policial frenética ao lado do detetive do GBI Will Trent e da
    parceira dele - o livro que junta pela primeira vez os elencos das duas
    séries principais de Karin Slaughter.

- id: karin-slaughter/broken
  synopsis: >
    O agente especial do GBI Will Trent chega a Grant County para investigar uma
    morte sob custódia policial e encontra a detetive Lena Adams a guardar
    segredos, enquanto a médica-legista Sara Linton precisa mais do que nunca da
    sua ajuda para levar o caso até ao fim.

- id: karin-slaughter/fallen
  synopsis: >
    Quando Faith Mitchell encontra um homem morto em casa da mãe e a mãe
    desaparecida, é tratada como testemunha e suspeita, e recorre ao parceiro
    Will Trent e à médica-legista Sara Linton para a encontrar antes que seja
    tarde de mais.

- id: karin-slaughter/criminal
  synopsis: >
    Uma estudante universitária desaparecida e um caso arquivado há décadas
    colidem quando Will Trent é inexplicavelmente afastado da investigação pela
    mentora, a diretora-adjunta Amanda Wagner, e ambos são levados de volta ao
    orfanato abandonado onde o pai de Will esteve outrora preso.

- id: karin-slaughter/unseen
  synopsis: >
    Infiltrado em Macon como um ex-recluso violento, Will Trent arrisca tudo para
    desmantelar uma rede de droga, isolado de Sara Linton, uma médica-legista com
    as suas próprias razões para estar na mesma cidade.

- id: karin-slaughter/the-kept-woman
  synopsis: >
    Um homicídio num estaleiro de construção abandonado torna-se perigoso quando
    o morto é identificado como um ex-polícia, e Will Trent e Sara Linton
    descobrem uma segunda vítima, e um homem poderoso e com ligações políticas já
    protegido uma vez pela própria fama.

- id: karin-slaughter/the-last-widow
  synopsis: >
    O rapto de uma cientista dos CDC e um atentado à bomba perto dos maiores
    hospitais e serviços federais de Atlanta arrastam Will Trent e Sara Linton
    para uma conspiração dirigida ao coração da cidade.

- id: karin-slaughter/the-silent-wife
  synopsis: >
    Um caso arquivado e um novo ataque revelam-se com o mesmo método, obrigando
    Will Trent a reabrir uma condenação de oito anos, com a ajuda de Sara Linton,
    para apanhar um assassino que nunca parou.

- id: karin-slaughter/after-that-night
  synopsis: >
    Anos depois de um ataque violento ter virado a sua própria vida do avesso,
    Sara Linton trata uma jovem cuja agressão parece estranhamente ligada à dela,
    e a investigação de Will Trent reabre feridas que Sara julgava fechadas.

- id: karin-slaughter/this-is-why-we-lied
  synopsis: >
    A lua de mel de Will Trent e Sara Linton num refúgio de montanha isolado
    transforma-se numa investigação de homicídio quando o gerente é morto e uma
    estrada arrastada por cheias os deixa presos com as únicas pessoas que o
    poderiam ter feito.

# --- North Falls ---
- id: karin-slaughter/we-are-all-guilty-here
  synopsis: >
    Quando duas adolescentes desaparecem na noite do fogo de artifício de uma
    pequena cidade, a agente Emmy Clifton percebe que nunca conheceu realmente a
    filha da amiga que outrora afastou, na cidade fictícia de North Falls, na
    Geórgia.

- id: karin-slaughter/the-secrets-we-hide
  synopsis: >
    Um homicídio na casa tranquila da família Vickery, em North Falls, e uma
    filha deixada por morta arrastam a xerife Emmy Clifton e a irmã, a
    ex-agente federal Jude Archer, para tudo o que a cidade tem andado a esconder.

# --- Standalones ---
- id: karin-slaughter/cop-town
  synopsis: >
    Atlanta, 1974: um assassino anda a caçar a polícia da cidade, e a agente
    novata Kate Murphy luta por um lugar num departamento com pouca clemência
    para uma mulher no seu primeiro dia.

- id: karin-slaughter/pretty-girls
  synopsis: >
    Afastadas há mais de vinte anos, desde que a irmã adolescente desapareceu sem
    deixar rasto, as irmãs Claire e Lydia são obrigadas a reencontrar-se quando o
    marido de Claire é assassinado, e as duas perdas revelam-se ligadas ao longo
    de um quarto de século.

- id: karin-slaughter/the-good-daughter
  synopsis: >
    Vinte e oito anos depois de um ataque violento à casa da família ter deixado
    a mãe morta, as irmãs Charlotte e Samantha Quinn são puxadas de volta aos
    segredos mais sombrios da sua pequena cidade quando nova violência atinge
    Pikeville.

- id: karin-slaughter/pieces-of-her
  synopsis: >
    Um ataque num centro comercial expõe um lado desconhecido e violento de
    Laura, a mãe de Andrea Cooper, e Andrea é obrigada a descobrir quem Laura
    realmente foi antes de se tornar Laura, enquanto quem a expôs continua à sua
    procura.

- id: karin-slaughter/false-witness
  synopsis: >
    A advogada de defesa Leigh Collier construiu uma vida comum sobre uma
    infância oculta e violenta, até um novo caso a obrigar a defender um homem do
    seu próprio passado que sabe exatamente quem ela é.

- id: karin-slaughter/girl-forgotten
  synopsis: >
    A marshal dos Estados Unidos recém-formada Andrea Oliver investiga um
    homicídio arquivado há décadas com ligações ao passado do próprio pai,
    reabrindo o assassínio por resolver, de 1982, de uma rainha do baile de
    finalistas de uma pequena cidade.

# --- Anthology / apocrypha ---
- id: karin-slaughter/like-a-charm
  synopsis: >
    Uma pulseira de berloques amaldiçoada liga dezasseis capítulos de um leque de
    autores de thriller, da Geórgia do século XIX até aos dias de hoje; Slaughter
    escreveu o capítulo de abertura e o de encerramento da coletânea.

- id: karin-slaughter/the-blessing-of-brokenness
  synopsis: >
    A supervisionar o restauro de uma cruz de altar partida na sua pequena igreja
    da Geórgia, nos dias que antecedem o Natal, Mary Lou Dixon confronta um ano
    de derrota silenciosa, até que um gesto inesperado de bondade do encarregado
    da equipa de obras muda aquilo que ela está disposta a aceitar.

- id: karin-slaughter/martin-misunderstood
  synopsis: >
    Uma novela independente de humor negro sobre Martin Reed, o alvo de todas as
    piadas do escritório, cuja vida vira do avesso quando um colega é assassinado
    e as provas, por mais injustamente, apontam para ele.

- id: karin-slaughter/thorn-in-my-side
  synopsis: >
    Um conto digital independente: uma noite fora num bar de Atlanta entre dois
    irmãos acaba em violência no parque de estacionamento.

- id: karin-slaughter/the-unremarkable-heart-and-other-stories
  synopsis: >
    Uma coletânea da ficção curta independente de Slaughter: explorações
    sombrias e provocadoras do amor, da morte e dos segredos que as pessoas
    guardam.

- id: karin-slaughter/cold-cold-heart
  synopsis: >
    Uma ex-mulher desprezada, perante a doença terminal do ex-marido, vê uma
    última oportunidade de acertar contas.

- id: karin-slaughter/snatched
  synopsis: >
    Um conto digital: o agente especial do GBI Will Trent toma uma decisão numa
    fração de segundo durante uma missão no aeroporto mais movimentado de
    Atlanta.

- id: karin-slaughter/busted
  synopsis: >
    Um conto digital: a caminho de uma missão infiltrada em Macon, Will Trent é
    apanhado num assalto violento a uma bomba de gasolina.

- id: karin-slaughter/necessary-women
  synopsis: >
    Numa cidade da fronteira entre a Geórgia e o Alabama, uma rapariga de catorze
    anos que acabou de ver a mãe morrer é avisada pelo pai de que tem agora de
    fazer todas as coisas necessárias que uma mulher faz, e cresce até à sua
    própria ideia do que isso significa.

- id: karin-slaughter/the-mean-time
  synopsis: >
    Num dia sufocante de verão, a Peanut, de doze anos, e os primos entram numa
    pequena cidade da Geórgia na traseira do atrelado do tio Toby, precisamente na
    idade em que está fadada a fazer algo de que se irá arrepender.

- id: karin-slaughter/the-truth-about-pretty-girls
  synopsis: >
    Jude Hanson, de quarenta e três anos, regressa a Poulet, a cidade de montanha
    da Geórgia onde cresceu, e à mãe que esperara nunca mais voltar a ver.

- id: karin-slaughter/blonde-hair-blue-eyes
  synopsis: >
    Um conto digital independente e prequela de Pretty Girls: a caloira
    universitária Julia Carroll investiga uma série de desaparecimentos de
    mulheres por quem o mundo deixou de procurar.

- id: karin-slaughter/go-deep
  synopsis: >
    Charlie Lam abriu caminho da pobreza até gerir um stand de automóveis em
    Atlanta, e um arranjo simples e discretamente criminoso com um cliente bem
    relacionado transforma-se em muito mais sarilho do que o envelope de dinheiro
    valia.

- id: karin-slaughter/remmy-rothstein-toes-the-line
  synopsis: >
    A verificadora de recordes mundiais Mindy Patel viaja até ao pântano da
    Geórgia para confirmar a pretensão de Remmy Rothstein à língua mais comprida
    do mundo, e encontra a família dele mais estranha, e as apostas mais altas,
    do que qualquer recorde que já certificara.

- id: karin-slaughter/last-breath
  synopsis: >
    Um conto digital independente e prequela de The Good Daughter: a advogada
    Charlie Quinn, ela própria marcada por um ataque na infância, aceita um
    cliente em muito mais apuros do que imagina.

- id: karin-slaughter/short-story
  synopsis: >
    Geórgia, 1993: um fim de semana prolongado corre muito mal ao jovem polícia
    de Birmingham Jeffrey Tolliver, que vai parar à prisão sob suspeita de
    homicídio, precisamente quando os investigadores veteranos Joe Pritchard e
    Lincoln Perry chegam à cidade atrás de um caso que se revela ser o mesmo.

- id: karin-slaughter/cleaning-the-gold
  synopsis: >
    Um conto de crossover coescrito com Lee Child: infiltrado em Fort Knox num
    homicídio de há vinte e dois anos, a investigação do agente do GBI Will Trent
    colide com a própria caça de Jack Reacher à mesma rede criminosa.
