# Overlay pt-PT das ordens de leitura: `name` + `rationale` (prosa).
# id, type, source e orderedWorkIds nunca se traduzem. Os títulos de obras
# citados ficam em inglês (não há edições portuguesas registadas).
- id: karin-slaughter/grant-county-in-order
  name: Os romances de Grant County, por ordem
  rationale: >
    Os seis romances de Grant County por ordem de publicação, numerados de #1 a
    #6 no próprio site da editora. A série está completa e fecha com
    [[work:karin-slaughter/beyond-reach|Beyond Reach]]; a história de Sara Linton
    continua depois na série de Will Trent, a partir de
    [[work:karin-slaughter/undone|Undone]].

- id: karin-slaughter/will-trent-in-order
  name: Os romances de Will Trent, por ordem
  rationale: >
    Os doze romances de Will Trent por ordem de publicação, numerados de #1 a #12
    no próprio site da editora. [[character:karin-slaughter/will-trent|Will
    Trent]] é uma figura secundária no primeiro título,
    [[work:karin-slaughter/triptych|Triptych]], antes de liderar a série a partir
    de [[work:karin-slaughter/fractured|Fractured]]. A partir de
    [[work:karin-slaughter/undone|Undone]] (#3), a [[character:karin-slaughter/sara-linton|Sara
    Linton]] de Grant County junta-se ao elenco - se tenciona ler também os
    romances de Grant County, leia-os primeiro, para que o seu final não lhe seja
    revelado fora de ordem.
