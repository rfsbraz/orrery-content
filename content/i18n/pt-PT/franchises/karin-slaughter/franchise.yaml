# Overlay pt-PT. Apenas prosa; id, slugs, títulos de obras e sources não são
# traduzidos.
# Os startHere.paths ficam aninhados e são fundidos por id (ver SCHEMA.md,
# "Nested lists merge by id"): só `title`, `description` e `note`, nunca
# `workIds`, `orderId` ou `fit`.
# Karin Slaughter não tem edições portuguesas registadas, por isso os títulos
# de obras citados na prosa ficam em inglês.
- id: karin-slaughter
  description: >
    Ficção policial da Geórgia ao longo de três séries e meia dúzia de
    romances independentes: a série completa de procedurais de Grant County, os
    thrillers de longa data com [[character:karin-slaughter/will-trent|Will
    Trent]] e os novos mistérios de North Falls.
    [[character:karin-slaughter/sara-linton|Sara Linton]], a médica-legista de
    Grant County, leva mais tarde a sua história para a série de Will Trent - o
    fio que liga os dois elencos principais de Slaughter.
  startHere:
    paths:
      - id: everything-in-order
        title: Tudo, por ordem
        description: >
          Todos os romances e contos, de Grant County, Will Trent, North Falls
          e dos independentes, por ordem de publicação. As duas séries
          principais estão ordenadas de modo que o fim de Grant County chegue
          antes de a história de Sara Linton continuar em Will Trent, para que
          nada aqui se adiante a si mesmo.
        note: >
          Inclui ficção curta que começou como capítulos-bónus exclusivos das
          edições de bolso ou como contribuições para antologias, e não como
          livros por direito próprio.

      - id: grant-county-first
        title: Começar por Grant County
        description: >
          A série completa de Grant County, desde o início, para que a história
          de Sara Linton seja contada pela ordem em que Slaughter a escreveu,
          antes de o seu arco continuar noutro lado.
        note: >
          Blindsighted abre sombrio e não suaviza o que acontece, e passam seis
          livros até conhecer Will Trent, o agente do GBI por trás da adaptação
          televisiva mais recente.

      - id: will-trent-taste
        title: Experimentar Will Trent
        description: >
          Os dois primeiros casos de Will Trent, ambos antes de a Sara Linton de
          Grant County entrar na série. Uma amostra segura do agente do GBI que
          muitos leitores conhecem primeiro pela série de televisão, sem exigir
          nada de Grant County.
        note: >
          Will Trent continua para lá deste ponto e entra na história de Sara
          Linton, vinda de Grant County. Se tenciona ler também Grant County,
          leia-o antes de avançar, para que o seu final não lhe seja revelado
          fora de ordem.

      - id: continue-into-will-trent
        title: Continuar para Will Trent
        description: >
          Para quem já terminou Grant County: a série completa de Will Trent,
          onde a história de Sara Linton continua a partir de Undone.
        note: >
          Ao contrário da série fechada de seis livros de Grant County, Will
          Trent ainda decorre, com doze livros e a contar, pelo que este é um
          compromisso aberto e não uma estante terminada.
