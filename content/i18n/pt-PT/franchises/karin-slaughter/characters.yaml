# Overlay pt-PT das personagens: apenas `description` (prosa).
# id, name, aka e sources não se traduzem. Os títulos de obras citados ficam
# em inglês (Karin Slaughter não tem edições portuguesas registadas).
- id: karin-slaughter/sara-linton
  description: >
    Pediatra de Heartsdale e médica-legista a tempo parcial de Grant County,
    cujo olhar forense ancora os primeiros seis romances da franquia, ao lado do
    ex-marido, o chefe da polícia Jeffrey Tolliver, e da detetive Lena Adams.
    Mais tarde reconstrói a carreira num centro de trauma de Atlanta e leva a sua
    história para a série de Will Trent.

- id: karin-slaughter/will-trent
  description: >
    Agente especial do Georgia Bureau of Investigation cuja parceria com Faith
    Mitchell ancora a série que tem o seu nome; um investigador meticuloso e
    metódico cujo próprio caso, em Criminal, remonta à sua infância.

- id: karin-slaughter/jeffrey-tolliver
  description: >
    Chefe da polícia de Heartsdale, em Grant County, e ex-marido de Sara Linton;
    as suas investigações ao lado de Sara e da detetive Lena Adams abrem a
    franquia.

- id: karin-slaughter/lena-adams
  description: >
    Detetive de Heartsdale, em Grant County, cujas escolhas imprudentes e
    traumas enterrados atravessam os seis romances de Grant County e voltam à
    superfície mais uma vez quando uma investigação do GBI recua até Grant
    County.

- id: karin-slaughter/faith-mitchell
  description: >
    Parceira de Will Trent no Georgia Bureau of Investigation e antiga agente de
    giro de Atlanta, cuja própria família está no centro de uma das
    investigações da série.

- id: karin-slaughter/andrea-oliver
  description: >
    A filha no centro de Pieces of Her, obrigada a confrontar o passado oculto da
    mãe, Laura; reaparece com outro apelido, como marshal dos Estados Unidos
    recém-formada, em Girl, Forgotten, a perseguir um caso arquivado ligado ao
    seu próprio pai.
