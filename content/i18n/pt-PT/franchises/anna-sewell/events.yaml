# Overlay pt-PT dos eventos da franquia: title + description (os títulos dos
# eventos são prosa curatorial, não títulos publicados). Datas, impact, scope,
# reach, spoilerAfter e sources nunca se traduzem.
#
# As duas descrições citam pessoas reais (Alfred Saunders, George T. Angell,
# e a própria Anna Sewell por citação indireta): essas citações verbatim
# ficam em inglês dentro da prosa traduzida, pela mesma razão que o campo
# `quote` do evento epígrafe em authors/anna-sewell.yaml fica por traduzir -
# não existe tradução portuguesa publicada das suas palavras exatas. "Our
# Horses", o livro de Saunders citado no primeiro evento, fica também em
# inglês: não é obra desta bibliografia e não há edição portuguesa
# registada.
- id: black-beauty-bearing-rein-effect-1886
  title: A rédea forçada começa a desaparecer
  description: >
    Numa década após a publicação, os ativistas já atribuem ao livro
    mudanças reais nas práticas. Alfred Saunders, em Our Horses (1886):
    "Bearing-reins are less used every year. Miss Sewell's Black Beauty and
    the energetic appeals and well told facts of Mr. and Mrs. Flower on this
    subject have done wonders." O objetivo declarado do livro - "to induce
    kindness, sympathy, and an understanding treatment of horses" - está,
    ainda dentro da própria década de Sewell, mensuravelmente a resultar.

- id: black-beauty-angell-us-campaign-1890
  title: Pirateado para uma campanha americana
  description: >
    George T. Angell, fundador da American Humane Education Society,
    descobre o livro, pirateia-o - a família de Sewell nunca vê um cêntimo
    vindo da América - e transforma-o numa campanha de distribuição
    gratuita para cocheiros, moços de estrebaria e crianças em idade
    escolar: "the sending of this book, Black Beauty, into every American
    home may be... an important step in the progress not only of the
    American, but the World's humanity and civilization." Entre 1890 e
    1910, a sociedade de Angell e os seus aliados distribuem gratuitamente
    uma estimativa de dois a três milhões de exemplares só nos Estados
    Unidos, em traduções que Angell encomenda para alemão, italiano,
    espanhol, sueco e japonês.
