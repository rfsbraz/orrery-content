# Overlay pt-PT. Apenas prosa; id, slugs e os campos estruturais dos
# startHere.paths (workIds, orderId, fit) não se traduzem.
# A referência interna a Dungeon Crawler Carl (o livro) usa o título da
# edição portuguesa publicada pela Kathartika, "Carl, o Herói das Masmorras"
# (ver editions.yaml); onde o texto nomeia a saga em curso como um todo, para
# a qual não existe um nome de série publicado em português, o nome mantém-se
# em inglês.
- id: matt-dinniman
  description: >
    Escritor norte-americano de LitRPG e fantasia científica que se foi
    serializando das folgas de um retratista de exposições de gatos até uma
    prateleira de best-sellers do New York Times: a saga em curso
    [[work:matt-dinniman/dungeon-crawler-carl|Dungeon Crawler Carl]]
    (autopublicada no Royal Road e na Amazon entre 2019 e 2020, mais tarde
    adquirida para edição impressa pela Ace Books), a sátira de ficção
    científica autónoma de 2026
    [[work:matt-dinniman/operation-bounce-house|Operation Bounce House]], uma
    série de fantasia de progressão inacabada iniciada em 2017, uma
    coletânea de contos de 2005, dois romances de terror/suspense anteriores,
    e a trilogia de fantasia-horror que começou a escrever no último ano do
    ensino secundário, no início dos anos 2000.
  startHere:
    paths:
      - id: start-with-dungeon-crawler-carl
        title: Começa por Dungeon Crawler Carl
        description: >
          A série principal desde o primeiro livro: um veterano da Guarda
          Costeira e a gata de exposição da ex-namorada, atirados para uma
          masmorra construída por alienígenas e transmitida pela galáxia como
          reality show, pela ordem numerada pela editora (#1 a #8 até agora,
          em curso).

      - id: everything-in-order
        title: Tudo, por ordem
        description: >
          Todas as obras publicadas por ordem de publicação: a saga em curso
          Dungeon Crawler Carl, a trilogia mais curta Shivered Sky e a
          duologia Dominion of Blades, os romances autónomos e a coletânea
          de contos, e a ficção curta que a ISFDB regista fora de tudo isto.
        note: >
          A trilogia Shivered Sky, de 2003, e a duologia Dominion of Blades,
          de 2017-2018, surgem intercaladas com Dungeon Crawler Carl por ano,
          em vez de agrupadas nas suas próprias sequências, pelo que o salto
          de tom entre elas - um LitRPG em formato de reality show ao lado de
          uma epopeia de guerra no além-vida do início dos anos 2000 -
          acontece a meio da leitura, em vez de numa quebra escolhida.
