# Overlay pt-PT das ordens de leitura: `name`, `rationale` e `debated`.
# orderedWorkIds e sources não se traduzem. O nome da saga Dungeon Crawler
# Carl mantém-se em inglês (ver franchise.yaml).
- id: matt-dinniman/dungeon-crawler-carl-in-order
  name: Dungeon Crawler Carl, por ordem
  rationale: >
    A série principal de oito romances, isolada da trilogia, duologia e das
    obras autónomas bem mais curtas e menos conhecidas com que se intercala
    quando a prateleira é lida estritamente por ano de publicação. Para um
    leitor que ouviu falar exatamente deste livro e o quer, só a ele, pela
    sequência que a própria editora numera no seu site (#1 a #8). A
    sequência coincide no resto com a ordem de publicação; o seu único
    contributo real é resolver o empate de 2021 que o padrão derivado, de
    precisão anual, não consegue desfazer - três volumes publicados nesse
    ano, ordenados abaixo como a editora os ordena. O custo é o alcance:
    esta ordem exclui todo o resto do catálogo do autor, incluindo a novela
    multipartes de material adicional "Backstage at the Pineapple Cabaret",
    que não é um livro por si só - sai como fragmentos de bónus incluídos
    nas reedições impressas da Ace destes mesmos oito romances, pelo que um
    leitor que siga esta ordem nas edições da Ace encontra-a
    automaticamente, e um leitor que a siga nas edições originais
    autopublicadas ou digitais não a encontra de todo.
  debated:
    - >
      Se "Backstage at the Pineapple Cabaret" sequer pertence a esta ordem:
      a ISFDB cataloga os seus oito fragmentos publicados (2024-2026) como
      títulos separados sob o nome da série Dungeon Crawler Carl, o que
      argumentaria a favor de os intercalar aqui, mas cada fragmento é
      material adicional incluído numa edição impressa específica da Ace, e
      não um livro que o leitor pegue a seguir, pelo que fica de fora aqui
      em vez de lhe ser atribuída uma posição adivinhada.
