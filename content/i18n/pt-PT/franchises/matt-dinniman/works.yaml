# Overlay pt-PT das sinopses e notas. NUNCA inclui `title`: o título
# traduzido é dado pela edição (ver editions.yaml), não tradução de prosa.
# "Nível" (não "piso" nem "andar") é o termo usado aqui para cada floor da
# masmorra - segue a edição portuguesa real de Kathartika para o livro 1
# ("dezoito níveis de armadilhas, monstros e regras letais"), não uma escolha
# nossa. "Crawler" mantém-se por não ter equivalente português estabelecido
# nessa mesma edição nem em qualquer fonte encontrada. Nomes próprios
# inventados no universo da obra sem tradução publicada (Over City, Faction
# Wars, the Spiral, the Grinder) mantêm-se em inglês pela mesma razão que um
# título sem edição portuguesa fica em inglês: inventar um nome arriscaria
# uma tradução só nossa. "The System"/"System AI" é terminologia de género
# corrente em LitRPG e traduz-se como "o Sistema"/"IA do Sistema".
# apocalypse e the-last-yong-shi não têm sinopse nem nota na base, logo não
# têm entrada aqui.
- id: matt-dinniman/dungeon-crawler-carl
  synopsis: >
    Carl, veterano da Guarda Costeira, e Princess Donut, a gata persa
    premiada da ex-namorada, estão entre os poucos sobreviventes quando uma
    corporação alienígena destrói todas as estruturas humanas na Terra e
    reconstrói os destroços como uma masmorra de dezoito níveis, transmitida
    pela galáxia como reality show. Sobreviver a cada nível mantém-nos
    vivos; entreter a audiência mantém-nos financiados.
  note: >
    Autopublicado a 21 de setembro de 2020, depois de serializado no Royal
    Road desde 2019; reeditado em papel pela Ace Books a 27 de agosto de
    2024.

- id: matt-dinniman/carls-doomsday-scenario
  synopsis: >
    Mais fundo na masmorra, Carl e Donut chegam a Over City, uma metrópole
    devastada rondada por um circo morto-vivo e um feitiço ancestral quase
    concluído, e correm para resolver o mistério antes que o relógio do
    nível se esgote.
  note: >
    Autopublicado a 2 de janeiro de 2021; reeditado em papel pela Ace Books a
    24 de setembro de 2024.

- id: matt-dinniman/the-dungeon-anarchists-cookbook
  synopsis: >
    Um lugar no top 10 da masmorra põe um preço sobre a cabeça de Carl e
    Donut no quarto nível, obrigando-os a confiar noutros crawlers para
    decifrar um puzzle cuja resposta pode estar escondida dentro de um livro
    despretensioso.
  note: >
    Autopublicado a 2 de abril de 2021; reeditado em papel pela Ace Books a
    22 de agosto de 2024.

- id: matt-dinniman/the-gate-of-the-feral-gods
  synopsis: >
    No quinto nível, a equipa de Carl tem quinze dias para capturar quatro
    fortalezas, entre elas uma cidadela flutuante defendida por gnomos
    guerreiros, e tem de contar com um bando desalinhado de crawlers de
    nível baixo presos na mesma bolha para o conseguir.
  note: >
    Autopublicado a 1 de julho de 2021; reeditado em papel pela Ace Books a
    11 de março de 2025.

- id: matt-dinniman/the-butchers-masquerade
  synopsis: >
    O sexto nível abre a masmorra a turistas extraterrestres pagantes,
    livres para caçar por desporto os crawlers sobreviventes, entre eles uma
    célebre caçadora de troféus sem imaginar que a presa também tenciona
    caçar.
  note: >
    Autopublicado a 28 de fevereiro de 2022; reeditado em papel pela Ace
    Books a 8 de abril de 2025.

- id: matt-dinniman/the-eye-of-the-bedlam-bride
  synopsis: >
    Carl e Donut partem para capturar Shi Maria, o monstro mais letal e
    desequilibrado da masmorra e viúva de um deus desaparecido, e descobrem
    que capturá-la é um problema bem diferente de a controlar.
  note: >
    Autopublicado a 2 de julho de 2023; reeditado em papel pela Ace Books a
    13 de maio de 2025.

- id: matt-dinniman/this-inevitable-ruin
  synopsis: >
    O nono nível é o Faction Wars: nove exércitos liderados por alienígenas
    ricos e poderosos lutam para controlar o castelo no centro do campo de
    batalha e, pela primeira vez, os crawlers alinham um exército próprio,
    depois de os NPCs da masmorra se terem tornado plenamente
    autoconscientes. Quem morre neste campo de batalha morre mesmo, e Donut
    e uma das suas colegas de equipa são avisadas de que só uma delas
    poderá sair do nível.
  note: >
    Publicado diretamente pela Ace Books a 3 de novembro de 2024, depois de
    fechada a aquisição - sem edição autopublicada separada nem reedição
    posterior.

    O texto da contracapa nomeia a colega de equipa que partilha com Donut
    essa regra de saída única. O nome é deliberadamente omitido da sinopse
    acima: numa página que lista os oito volumes de uma vez, nomeá-la revela
    que ela está viva no livro sete, algo que nenhuma contracapa de um
    volume anterior revela e que vários deles põem em dúvida genuína. Tudo o
    resto aqui é a formulação da própria contracapa.

- id: matt-dinniman/a-parade-of-horribles
  synopsis: >
    Privado de qualquer agência real pelas regras do nível atual, Carl trama
    um plano demasiado perigoso para partilhar até com a sua própria equipa,
    enquanto a IA do Sistema da masmorra vai deixando pistas sobre aquilo a
    que já começou a chamar A Parade of Horribles.
  note: Publicado diretamente pela Ace Books a 12 de maio de 2026.

- id: matt-dinniman/backstage-at-the-pineapple-cabaret
  synopsis: >
    Uma novela em várias partes passada dentro da masmorra, publicada um
    capítulo de cada vez como material adicional nas edições de capa dura
    da Ace da série principal.
  note: >
    Uma única novela, dividida pelo autor em fragmentos do tamanho de contos
    e incluída como material adicional em cada edição impressa da Ace, em
    vez de publicada como livro autónomo; a ISFDB cataloga os oito
    fragmentos publicados entre 2024 e 2026 como títulos separados sob este
    nome de série, classificados como SF.

- id: matt-dinniman/every-grain-of-sand
  synopsis: >
    Primeira parte de uma guerra travada depois da queda do Céu: Indigo
    acorda para um além-vida em ruínas com apenas fragmentos de memória,
    encontra os anjos caçados quase até à extinção e a humanidade reduzida a
    gado, e junta-se ao que resta da resistência.
  note: >
    Publicado originalmente a 1 de junho de 2003; esta edição revista foi
    republicada a 21 de janeiro de 2020.

- id: matt-dinniman/in-the-city-of-demons
  synopsis: >
    Segunda parte: os anjos sobreviventes sofrem outro golpe terrível, e
    Indigo e os seus companheiros humanos dispersos procuram uma forma de
    continuar a lutar.
  note: >
    Publicado originalmente a 1 de junho de 2003; esta edição revista foi
    republicada a 28 de fevereiro de 2020.

- id: matt-dinniman/the-great-devouring-darkness
  synopsis: >
    A conclusão da trilogia: uma última guerra, em que desta vez o vencedor
    fica com tudo.
  note: >
    Publicado originalmente a 1 de junho de 2003; esta edição revista foi
    republicada a 27 de março de 2020.

- id: matt-dinniman/dominion-of-blades
  synopsis: >
    Jonah acorda preso dentro de Dominion of Blades, outrora o RPG de
    imersão total mais popular do mundo, agora encerrado depois de uma série
    de mortes reais ter deixado jogadores incapazes de sair. Com dois
    companheiros e sem memória de como lá chegou, tem de lutar pelo caminho
    através de um mundo de jogo feito para milhões e agora quase vazio, só
    para sobreviver.
  note: Publicado a 21 de março de 2017. Narração do audiolivro por Andrea Parsneau.

- id: matt-dinniman/the-hobgoblin-riot
  synopsis: >
    Uma missão de reconhecimento supostamente simples a Spiral, o desafio de
    tower defense que guarda a capital hobgoblin, corre exatamente tão mal
    como promete logo a abertura do livro.
  note: >
    Publicado a 13 de abril de 2018. Um terceiro volume, "The Thieves of
    Grandeur", está anunciado em vários sites de bibliografia sem data de
    publicação; a sua própria página no site do autor ainda não existe.

- id: matt-dinniman/trailer-park-fairy-tales
  synopsis: >
    Doze histórias que misturam o quotidiano com o insólito numa América
    caricatural e sem glamour, entre elas uma escultora ex-gémea siamesa que
    trabalha com Spam, uma funcionária de cantina génio da matemática, e um
    exorcista adolescente.
  note: >
    Doze histórias segundo a própria contracapa da coletânea; o índice de
    títulos da ISFDB lista seis pelo nome (A Trailer Park Fairy Tale, Bad
    Karma at the Interstellar Swap Meet, Correspondence, The Escape Velocity
    of Millicent McDearly, The Liberation of Father Richards, Verona:
    Hospital for the Insane), uma contabilização incompleta e não uma
    contradição.

- id: matt-dinniman/the-grinding
  synopsis: >
    Seis meses depois de o exército dos EUA ter alegadamente destruído
    Tucson para o travar, um sobrevivente dá um relato de testemunha ocular
    do Grinder, um monstro em crescimento constante, montado a partir dos
    corpos de tudo e todos os que tocou.
  note: >
    Publicado a 16 de setembro de 2013. Uma tradução alemã, "Der
    gefraessige Grinder", seguiu-se em 2014 (ISFDB) - detalhe ao nível da
    edição, não registado aqui.

- id: matt-dinniman/kaiju-battlefield-surgeon
  synopsis: >
    Num servidor de RV privado e ilegal, criado para jogadores que querem
    que a dor do jogo seja real, um médico de combate encarregado de manter
    kaiju gigantes vivos tem de se tornar tão implacável como os sádicos que
    gerem o servidor, só para sobreviver.
  note: >
    Publicado a 6 de novembro de 2019, promovido pelo autor como "LitRPG
    Horror".

- id: matt-dinniman/operation-bounce-house
  synopsis: >
    Numa colónia de fronteira que o governo da Terra decidiu despejar, uma
    corporação transforma o despejo num jogo, deixando terráqueos entediados
    pagar para pilotar à distância máquinas de guerra contra os colonos, por
    desporto; o criador de gado Oliver Lewis tem de defender o único lar que
    alguma vez conheceu com um livro antigo do avô e um balde de peças
    sobressalentes.
  note: >
    Publicado pela Ace Books a 10 de fevereiro de 2026, em formato digital e
    impresso; audiolivro via Penguin Audio, narrado por Travis Baldree e
    Jeff Hays. Uma obra autónoma, não faz parte de Dungeon Crawler Carl.
