# Português europeu (pt-PT) - sinopses. Os títulos de obras NÃO são
# traduzidos aqui (docs/SCHEMA.md, "Never translate a published title"): um
# título traduzido só existe como edição real, em editions.yaml. `note:`
# também não se traduz aqui - nenhum overlay pt-PT deste catálogo o traduz,
# e não é lido pela aplicação no ecrã da obra.
#
# DISCIPLINA DE SPOILER. As duas sinopses abaixo foram deliberadamente
# redigidas para não ultrapassar o que a contracapa da própria editora
# revela (ver o campo `note` de cada obra em works.yaml, não traduzido mas
# ainda a fonte da regra). A tradução segue a mesma disciplina, cláusula a
# cláusula:
# - the-woman-in-the-window: "until she witnesses something ... that no
#   one else believes happened" não afirma nem nega que o crime aconteceu.
#   "até testemunhar algo ... que mais ninguém acredita ter acontecido"
#   preserva exatamente a mesma dúvida, sem inclinar a frase para nenhum
#   dos lados.
# - end-of-story: "did the perfect crime writer commit the perfect crime?"
#   fica como pergunta em aberto. "terá o escritor do crime perfeito
#   cometido o crime perfeito?" usa o futuro do pretérito composto
#   (conjetural) do português europeu - o tempo verbal idiomático para uma
#   dúvida não resolvida, não "cometeu", que a fecharia.
- id: aj-finn/the-woman-in-the-window
  synopsis: >
    A Dra. Anna Fox, uma psicóloga infantil confinada à sua casa em Harlem
    pela agorafobia, passa os dias a espiar a vizinhança através de uma
    lente fotográfica e a perder-se em velhos filmes noir - até testemunhar
    algo na casa do outro lado do parque que mais ninguém acredita ter
    acontecido.

- id: aj-finn/end-of-story
  synopsis: >
    Sebastian Trapp, um romancista recluso, enriquecido por uma longeva
    série policial e tornado famoso pelo desaparecimento nunca resolvido da
    primeira mulher e do filho adolescente numa véspera de Ano Novo vinte
    anos antes, está a morrer e quer que a sua história seja contada.
    Convida Nicky Hunter, uma crítica de ficção policial de Manhattan e sua
    correspondente de longa data, para a sua mansão vitoriana em São
    Francisco, para a escrever, e ela instala-se entre a segunda mulher
    dele, o sobrinho rebelde e a filha protetora, com um autêntico caso de
    febre detetivesca e uma pergunta com duas décadas: terá o escritor do
    crime perfeito cometido o crime perfeito?
