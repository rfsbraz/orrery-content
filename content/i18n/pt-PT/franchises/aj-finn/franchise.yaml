# Português europeu (pt-PT). Referência inline usa o título da edição
# portuguesa real (editions.yaml regista "A Mulher à Janela", Editorial
# Presença, trad. Maria João Lourenço) para The Woman in the Window - mesma
# convenção já fixada em gabriel-garcia-marquez/franchise.yaml e
# miguel-de-cervantes/franchise.yaml para uma obra com edição no mercado.
# End of Story não tem edição portuguesa (ver editions.yaml) e mantém-se em
# inglês. "Rear Window" mantém-se também em inglês: nenhuma fonte consultada
# nesta ala regista um título de distribuição português para o filme de
# Hitchcock, e o catálogo não inventa títulos sem fonte.
#
# A ambiguidade deliberada do original ("a murder she may or may not have
# witnessed") mantém-se sem resolução: "um crime que pode ou não ter
# testemunhado" não decide a favor de nenhuma leitura, tal como a sinopse
# em works.yaml e a contracapa da HarperCollins também não decidem.
- id: aj-finn
  description: >
    Dois thrillers psicológicos imersos no film noir clássico: a estreia de
    2018, [[work:aj-finn/the-woman-in-the-window|A Mulher à Janela]], o
    relato de uma nova-iorquina agorafóbica, na esteira de Rear Window,
    sobre um crime que pode ou não ter testemunhado, e o romance seguinte,
    de 2024, [[work:aj-finn/end-of-story|End of Story]], em que uma jovem
    crítica de ficção policial é arrastada para o desaparecimento nunca
    resolvido no centro da vida de um romancista moribundo de São
    Francisco.
