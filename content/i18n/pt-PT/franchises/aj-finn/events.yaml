# Overlay pt-PT dos eventos da franquia: `title` + `description`. Nenhum dos
# quatro eventos carrega o campo `quote`. Os acontecimentos de vida do autor
# estão em content/i18n/pt-PT/authors/aj-finn.yaml. Datas, scope, reach,
# impact, spoilerAfter e sources nunca se traduzem.
#
# Referências a The Woman in the Window usam o título da edição portuguesa
# real, "A Mulher à Janela" (editions.yaml, Editorial Presença, trad. Maria
# João Lourenço); End of Story não tem edição portuguesa e mantém-se em
# inglês. Nenhum dos quatro eventos é sobre um objeto ou edição
# especificamente do mercado inglês (ao contrário, por exemplo, de um
# evento sobre uma edição inglesa concreta), pelo que a regra genérica se
# aplica sem exceção aqui.
#
# CITAÇÕES DIRETAS. Todo o discurso direto atribuído a uma pessoa real
# (declarações de Stephen King, do Publishers Weekly, de Jon Amiel, de
# Nora Krug, de Joe Wright, da porta-voz da William Morrow) mantém-se em
# inglês, tal como foi dito - mesma convenção já usada noutras alas deste
# catálogo (gillian-flynn, harlan-coben, hp-lovecraft) para não reformular
# palavras que pertencem à fonte, não ao tradutor.
#
# aj-finn-plot-similarity-allegations-2019 é o evento mais sensível a
# spoiler desta ala (ver o cabeçalho do ficheiro-base): a tradução segue a
# mesma disciplina do inglês, frase a frase, sem acrescentar nenhum dos
# pormenores que o ficheiro-base deliberadamente omite (os itens exatos da
# correção do Times, os nomes de utilizador dos fóruns, o perseguidor de
# "Copycat"). Nada foi acrescentado nem retirado ao alcance da informação
# do original.
- id: aj-finn-woman-in-the-window-number-one-2018
  title: A estreia entra na lista do New York Times no número um
  description: >
    Publicado pela William Morrow em janeiro de 2018 sob um pseudónimo
    pouco disfarçado, [[work:aj-finn/the-woman-in-the-window|A Mulher à
    Janela]] entrou na lista de mais vendidos do New York Times no número
    um - o primeiro romance de estreia a fazê-lo em doze anos - à boleia de
    um contrato de dois livros por dois milhões de dólares, de uma
    recomendação de Stephen King a chamar-lhe "one of those rare books that
    really is unputdownable," e de uma crítica na própria The New Yorker. A
    cobertura da altura deu grande destaque ao ângulo de bastidores da
    edição: Mallory tinha passado uma década como editor em Londres e Nova
    Iorque, mais recentemente na William Morrow, a chancela que comprou e
    publicou o seu próprio livro.

- id: aj-finn-plot-similarity-allegations-2019
  title: Alegações de semelhança de enredo surgem e são, na sua maior parte, refutadas
  description: >
    A 14 de fevereiro de 2019, o New York Times noticiou semelhanças de
    enredo "numerous, and detailed," e "nearly identical plot twists in the
    final act," entre [[work:aj-finn/the-woman-in-the-window|A Mulher à
    Janela]] e o romance de 2016 de Sarah A. Denzil, "Saving April,"
    publicado dois anos antes. Uma porta-voz da William Morrow contrapôs
    que o esboço de Finn, incluindo personagens e principais pontos de
    enredo, já estava "fully formed by Sept. 20, 2015," antes de "Saving
    April" ser publicado. Cinco dias depois, o Times atualizou a notícia
    com mais pormenores fornecidos, após a publicação, pelo advogado e pela
    agente de Mallory: o esboço real que este tinha enviado à sua agente,
    Jennifer Joel, no outono de 2015. A própria Denzil confirmou à
    Publishers Lunch que março de 2016 foi a data mais cedo em que alguém,
    além da sua própria editora, poderia ter lido o manuscrito completo -
    já depois de o esboço de Mallory existir. O caso ficou por aí: não se
    seguiu nenhum processo judicial, e a correção mantém-se como a última
    palavra do registo sobre o assunto. Em separado, no mesmo perfil da New
    Yorker dessa semana, Jon Amiel, realizador do filme de 1995 "Copycat,"
    foi questionado sobre paralelismos entre a psicóloga agorafóbica,
    bebedora inveterada e jogadora de xadrez online do seu filme e a Anna
    Fox de Finn; classificou-os como "not actionable, but certainly worth
    noting," acrescentando, "one would have hoped that the author might
    have noted it himself."

- id: aj-finn-film-adaptation-delayed-2021
  title: A adaptação ao cinema chega à Netflix depois de três datas de estreia e uma pandemia
  description: >
    A Fox 2000 comprou os direitos de adaptação de
    [[work:aj-finn/the-woman-in-the-window|A Mulher à Janela]] em setembro
    de 2016, antes mesmo de o romance ser publicado; Joe Wright assumiu a
    realização em março de 2018, a partir de um argumento de Tracy Letts,
    com Amy Adams, Gary Oldman e Julianne Moore a filmar em Nova Iorque
    nesse agosto e outubro. O caminho até à estreia demorou depois quase
    tanto tempo como a espera pelo segundo romance de Finn: retirada de uma
    data de estreia nos cinemas em outubro de 2019, remontada pela Disney,
    a nova dona do estúdio, após más exibições-teste, adiada para maio de
    2020, e depois retirada por completo do calendário de estreias por
    causa da pandemia de COVID-19, antes de a Netflix comprar os direitos
    de distribuição em agosto de 2020. Estreou em streaming a 14 de maio de
    2021, com críticas divididas; Wright disse mais tarde que a montagem
    lançada tinha sido "watered down" em relação ao que filmara. No ano
    seguinte, a premissa do romance e do filme - uma narradora agorafóbica,
    um possível crime visto através de uma janela - foi ela própria
    parodiada em "The Woman in the House Across the Street From the Girl in
    the Window," da Netflix, protagonizado por Kristen Bell.

- id: aj-finn-end-of-story-return-2024
  title: "End of Story chega com quatro anos de atraso, avaliado tanto pelo escândalo como pelo enredo"
  description: >
    [[work:aj-finn/end-of-story|End of Story]] - a segunda metade do
    contrato de dois livros assinado em 2016, inicialmente previsto para
    2020 - foi publicado a 20 de fevereiro de 2024. No intervalo, Mallory
    manteve uma presença pública sobretudo como autor de recomendações de
    contracapa para outros autores de thriller. Ao rever o romance para o
    Washington Post, sob o título "A.J. Finn had a spectacular rise and
    fall. Now he has a new novel," Nora Krug abriu a crítica perguntando,
    "Will it be enough to save Finn's reputation?" e recapitulou as
    revelações da New Yorker de 2019 antes de avaliar a ficção pelos seus
    próprios méritos; outros órgãos de imprensa, incluindo uma crítica com
    estrela da Publishers Weekly que lhe chamou "tour de force," avaliaram-
    no apenas pela qualidade literária. Nenhum órgão de imprensa noticiou
    mais repercussões do episódio de 2019; o livro estreou no número doze
    da lista de ficção em capa dura da Publishers Weekly.
