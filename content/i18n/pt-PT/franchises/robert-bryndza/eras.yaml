# Overlay pt-PT das eras: `title` + `description` + `themes` (prosa curta).
# id, organisation, illustration_type, images_required, period, provenance e
# sources nunca se traduzem. `note` não é traduzido: o campo não existe na
# interface Era da aplicação (lib/content/types.ts) e não é lido em lado
# nenhum - verificado no repositório da aplicação, não assumido.
# The Not So Secret Emails of Coco Pinchard e The Girl in the Ice têm edição
# portuguesa registada em editions.yaml e são citados pelos títulos
# publicados. Bitch Hollywood, Miss Wrong and Mr Right e The Quiet Kill não
# têm edição portuguesa e ficam com o título original.
- id: the-self-published-comedies
  title: As Comédias Autopublicadas
  themes: [autopublicação, voz cómica, Coco Pinchard, escrita a partir da vida]
  description: >
    Quatro anos de comédia publicados pelo próprio autor, depois de um
    agente literário ter aceitado representar
    [[work:robert-bryndza/the-not-so-secret-emails-of-coco-pinchard|A Vida
    Nada Secreta de Coco Pinchard]] em 2010, não a ter conseguido vender e o
    ter largado. O primeiro livro a chegar às livrarias foi
    [[work:robert-bryndza/bitch-hollywood|Bitch Hollywood]], escrito com o
    marido, Ján, em três meses no final de 2011 e publicado em tradução
    eslovaca em março de 2012; o seu sucesso pagou as edições em inglês de
    ambos os livros, carregados juntos para a Kindle Direct Publishing. Mais
    quatro títulos de Coco Pinchard e o romance independente
    [[work:robert-bryndza/miss-wrong-and-mr-right|Miss Wrong and Mr Right]]
    seguem-se a bom ritmo. No seu próprio resumo do período: "Os dois anos
    seguintes foram tão divertidos - escrevi e autopublicámos um segundo,
    terceiro, quarto e quinto livro, e com cada publicação o meu público
    crescia."

- id: the-traditional-publishing-years
  title: Os Anos da Edição Tradicional
  themes: [a mudança para o policial, Erika Foster, Kate Marshall, escala]
  description: >
    "Comecei por escrever comédias românticas, mas acabei de mudar para
    escrever thrillers policiais."
    [[work:robert-bryndza/the-girl-in-the-ice|A Rapariga no Gelo]] surge pela
    Bookouture em fevereiro de 2016, vende mais de um milhão de exemplares em
    menos de um ano e é entretanto traduzida para 31 línguas. Seis romances
    de Erika Foster chegam em três anos, a um ritmo de que mais tarde recua
    por razões de saúde; segue-se uma segunda série com novas editoras, a
    Sphere no Reino Unido e a Thomas & Mercer nos EUA, que sai da Londres de
    Erika Foster para as barragens e charnecas onde Kate Marshall trabalha,
    em South Devon.

- id: the-raven-street-years
  title: Os Anos da Raven Street
  themes: [independência, três séries em simultâneo, controlo criativo]
  description: >
    "Agora, dei a volta completa." Bryndza volta a publicar os seus livros em
    inglês por conta própria, através do seu selo Raven Street Publishing,
    batizado com o nome do teatro fictício de
    [[work:robert-bryndza/miss-wrong-and-mr-right|Miss Wrong and Mr Right]].
    Abre com [[work:robert-bryndza/fatal-witness|Testemunha Fatal]] em julho
    de 2022, que traz Erika Foster de volta depois de uma ausência de quatro
    anos, e mantém três séries em simultâneo: Kate Marshall continua, o
    romance independente
    [[work:robert-bryndza/fear-the-silence|Antes de Dizer Adeus]] vence o
    Bestseller Checo do Ano, e
    [[work:robert-bryndza/the-quiet-kill|The Quiet Kill]] arranca uma
    terceira, passada na Londres de 1987 e centrada no seu primeiro
    protagonista masculino.
