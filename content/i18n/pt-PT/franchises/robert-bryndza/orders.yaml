# Overlay pt-PT das ordens de leitura: `name` + `rationale` (prosa).
# id, type, source e orderedWorkIds nunca se traduzem. Todos os nove títulos
# de Erika Foster citados aqui têm edição portuguesa registada em
# editions.yaml (Alma dos Livros) e são citados pelos títulos publicados.
- id: robert-bryndza/erika-foster-in-order
  name: Os romances de Erika Foster, por ordem
  rationale: >
    Todos os nove romances da
    [[work:robert-bryndza/the-girl-in-the-ice|inspetora-chefe Erika
    Foster]], numerados de #1 a #9 nas próprias páginas de produto e na FAQ
    da editora. A ordem de publicação derivada não consegue resolver isto
    sozinha: A Rapariga no Gelo, A Sombra da Noite e Águas Profundas foram
    todos publicados em 2016, e O Último Fôlego e Sangue Frio em 2017, pelo
    que cinco dos nove livros partilham um ano empatado, e a numeração da
    editora é a única fonte para saber qual vem primeiro. Esta ordem não
    muda mais nada - existe para desfazer corretamente esses empates, não
    para reorganizar a série.
