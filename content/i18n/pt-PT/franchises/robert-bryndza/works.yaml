# Overlay pt-PT das obras: apenas `synopsis` (prosa, sem spoilers).
# id, title, published, canonTier e sources nunca se traduzem.
# `note:` não é traduzido: o campo não existe na interface Work da aplicação
# (lib/content/types.ts) e não é lido em lado nenhum - verificado no
# repositório da aplicação, não assumido. Afeta cinco entradas desta ala
# (devils-way, coco-pinchard-the-consequences-of-love-and-sex,
# a-very-coco-christmas, coco-pinchards-must-have-toy-story,
# bitch-hollywood).
#
# EDIÇÕES PORTUGUESAS. Catorze das vinte e cinco obras têm edição pt-PT real
# e verificada em editions.yaml (Alma dos Livros): as nove de Erika Foster,
# as cinco de Kate Marshall e Fear the Silence, mais a primeira metade da
# trilogia de Coco Pinchard. Nenhum título abaixo é usado nesta ala como
# referência cruzada a outra obra (só como synopsis do próprio work), pelo
# que as duas armadilhas de título que editions.yaml assinala - "A Noite
# Está a Chegar" é Shadow Sands, não The Night Stalker; "Silêncio Mortal" é
# Devil's Way, não Fear the Silence - não se colocam nesta prosa, mas ficam
# aqui registadas caso uma referência cruzada venha a ser escrita no futuro.
# As restantes onze obras (Jamie Day, as duas novelas-prelúdio de Coco
# Pinchard, Miss Wrong and Mr Right, Bitch Hollywood, Breaking Point) não têm
# edição portuguesa e os seus títulos ficam em inglês em qualquer referência.
#
# CUIDADO COM SPOILERS: cinco sinopses desta ala evitam deliberadamente o
# que a respetiva capa retém - Devil's Way (sem o quase afogamento
# anterior), Coco Pinchard, the Consequences of Love and Sex (marido não
# nomeado), Chasing Shadows (identidade mantida como enquadramento da
# própria capa, não como facto assente), Nine Elms ("quinta", não "última",
# vítima) e Breaking Point (para em "decide que já chega", sem plano nem
# desfecho). A tradução segue exatamente o texto de base, sem repor nenhum
# dos detalhes omitidos.

# --- Erika Foster (9) ---

- id: robert-bryndza/the-girl-in-the-ice
  synopsis: >
    O corpo gelado de uma jovem é encontrado num parque do sul de Londres,
    arrastando a inspetora-chefe Erika Foster para um caso com ligações a
    uma família poderosa e ao seu próprio passado atribulado. A estreia
    policial de Bryndza, que vendeu mais de um milhão de exemplares no
    primeiro ano.

- id: robert-bryndza/the-night-stalker
  synopsis: >
    Durante uma vaga de calor em Londres, Erika Foster investiga um
    assassino em série que sufoca homens solteiros nas próprias camas, cada
    vítima a esconder um passado secreto - e o caso torna-se pessoal à
    medida que se aproxima dele.

- id: robert-bryndza/dark-water
  synopsis: >
    Uma busca por provas de narcóticos numa pedreira inundada acaba por
    revelar o esqueleto de uma menina de sete anos desaparecida há vinte e
    seis anos, arrastando Erika Foster para um caso arquivado com uma
    família a guardar segredos antigos.

- id: robert-bryndza/last-breath
  synopsis: >
    Uma jovem é assassinada com ferimentos idênticos aos de um caso por
    resolver de meses antes, e Erika Foster segue o rasto até um perseguidor
    que cria identidades falsas para visar mulheres na internet.

- id: robert-bryndza/cold-blood
  synopsis: >
    Dois corpos desmembrados surgem em malas idênticas junto ao Tamisa, e a
    própria Erika Foster torna-se alvo quando o caso revela mais do que um
    assassino em ação.

- id: robert-bryndza/deadly-secrets
  synopsis: >
    Uma jovem é encontrada assassinada numa rua do sul de Londres, um dos
    vários ataques de uma figura com máscara de gás, e a investigação de
    Erika Foster põe em perigo alguém próximo dela.

- id: robert-bryndza/fatal-witness
  synopsis: >
    Um homicídio perto da própria casa de Erika Foster, em Blackheath,
    revela-se ligado a uma vítima que investigava um predador que visava
    estudantes - e a um assassino que não deixa qualquer vestígio forense.

- id: robert-bryndza/lethal-vengeance
  synopsis: >
    A morte de um político em destaque arrasta Erika Foster para um caso com
    vários suspeitos quase indistinguíveis, um escândalo oculto e gente
    poderosa decidida a mantê-lo enterrado.

- id: robert-bryndza/chasing-shadows
  synopsis: >
    Uma chamada de rotina põe Erika Foster frente a frente com um homem de
    quem tem a certeza ser Jerome Goodman, o traficante que matou o seu
    marido há uma década - ainda que o passaporte dele traga outro nome e a
    ficha criminal esteja limpa. Obrigada a tirar licença, ela trabalha o
    caso no seu próprio tempo, enquanto superiores e colegas põem em causa o
    seu discernimento.

# --- Kate Marshall (5) ---

- id: robert-bryndza/nine-elms
  synopsis: >
    Quinze anos depois de apanhar um assassino em série ainda jovem
    detetive, uma Kate Marshall caída em desgraça é puxada de volta à
    investigação quando um imitador assume o lugar dele. Ela era a quinta
    vítima pretendida pelo assassino original, e o sucessor está decidido a
    terminar o trabalho.

- id: robert-bryndza/shadow-sands
  synopsis: >
    Agora docente de criminologia, Kate Marshall encontra o corpo de um
    adolescente enquanto mergulha numa barragem de Dartmoor, e descobre um
    padrão de mortes ligado a uma lenda local e a um assassino ainda ativo na
    charneca.

- id: robert-bryndza/darkness-falls
  synopsis: >
    Contratada para reabrir um caso de pessoa desaparecida há doze anos,
    Kate Marshall descobre que está ligado a mais dois desaparecimentos e a
    um assassino em série escondido à vista de todos.

- id: robert-bryndza/devils-way
  synopsis: >
    Kate Marshall aceita um desaparecimento de há uma década, ocorrido numa
    viagem de campismo em Dartmoor - uma criança de três anos desaparecida
    junto a um rio caudaloso - e descobre que uma assistente social que
    levantara preocupações sobre a família foi assassinada pouco depois.

- id: robert-bryndza/the-lost-victim
  synopsis: >
    Um podcast de crimes reais contrata Kate Marshall para reexaminar o
    desaparecimento de uma aluna em 1988 e se o "Canibal de Nine Elms" foi o
    responsável, um caso que esbate a linha entre clientes e suspeitos.

# --- Jamie Day (2) ---

- id: robert-bryndza/the-quiet-kill
  synopsis: >
    Inverno de 1987: recém-promovido à Polícia Metropolitana depois de anos
    numa pequena terra costeira sossegada, o detetive Jamie Day encontra um
    corpo desmembrado no seu primeiro dia à paisana - o início de uma caça a
    um assassino em série que visa jovens por toda Londres. O primeiro
    romance de Bryndza com um protagonista masculino, e o início de uma nova
    série.

- id: robert-bryndza/the-burning-lie
  synopsis: >
    A instalar-se na nova vida na Polícia Metropolitana, Jamie Day investiga
    o homicídio de um colega e descobre que todas as pistas apontam de volta
    para os seus próprios colegas.

# --- Standalone crime (1) ---

- id: robert-bryndza/fear-the-silence
  synopsis: >
    Quando o marido, Will, é encontrado morto numa ilha remota da Croácia e
    a polícia classifica o caso como suicídio, Maggie recusa-se a aceitar o
    veredicto e investiga uma carta escondida que aponta para um passado que
    ele nunca lhe contou. Venceu o prémio Bestseller Checo do Ano.

# --- Coco Pinchard (5) ---

- id: robert-bryndza/the-not-so-secret-emails-of-coco-pinchard
  synopsis: >
    Recém-chegada aos quarenta e recém-separada depois de uma traição do
    marido e do fracasso do seu próprio romance, Coco Pinchard reconstrói a
    vida numa série de emails às amigas mais próximas, encontrando pelo
    caminho um romance inesperado. O primeiro livro de Bryndza, escrito em
    2010 e autopublicado depois de um contrato no Reino Unido ter caído por
    terra.

- id: robert-bryndza/coco-pinchards-big-fat-tipsy-wedding
  synopsis: >
    Horas antes de se mudar para viver com o novo companheiro, Adam, ele
    acaba tudo e desaparece sem explicação - e a busca de Coco por uma razão
    revela um segredo que muda a vida de ambos.

- id: robert-bryndza/coco-pinchard-the-consequences-of-love-and-sex
  synopsis: >
    Recasada e a surfar o sucesso do seu próprio bestseller, Coco espera que
    desta segunda vez tudo corra bem - até os problemas de emprego do
    marido, a vida descarrilada do filho já crescido, uma ex-sogra
    omnipresente e uma gravidez inesperada aos quarenta e quatro anos caírem
    todos ao mesmo tempo.

- id: robert-bryndza/a-very-coco-christmas
  synopsis: >
    Um conto-prelúdio: estamos em 1985, e Coco, com dezoito anos, está em
    casa depois do primeiro período na universidade, a apaixonar-se por um
    músico que a mãe desaprova, enquanto é empurrada para o filho de um
    amigo da família.

- id: robert-bryndza/coco-pinchards-must-have-toy-story
  synopsis: >
    Uma novela-prelúdio: estamos em dezembro de 1992, e Coco percorre
    Londres à procura do brinquedo de Natal mais desejado do ano para o
    filho de quatro anos, Rosencrantz, numa comédia de negociatas de mercado
    negro de brinquedos e caos familiar.

# --- Standalone romantic comedy (1) ---

- id: robert-bryndza/miss-wrong-and-mr-right
  synopsis: >
    Natalie Love gere um teatro em Londres e deixou para trás, há muito, a
    família rural caótica e o noivo que abandonou no altar há quinze anos -
    até o seu primeiro amor e a família chegarem para abalar a vida que
    construiu. O nome do teatro, Raven Street, viria mais tarde a dar nome ao
    próprio selo editorial de Bryndza.

# --- Comic novel, co-authored (1) ---

- id: robert-bryndza/bitch-hollywood
  synopsis: >
    Um jovem londrino ganha o sorteio do Green Card norte-americano e
    muda-se para Los Angeles, em busca de uma carreira como estilista de
    celebridades, e é arrastado para a órbita da vida em desmoronamento de
    uma estrela de cinema em declínio. Uma sátira de humor negro sobre
    Hollywood, inspirada no ano que Bryndza e o marido, Ján, passaram a
    viver lá.

# --- Apocrypha (1) ---

- id: robert-bryndza/breaking-point
  synopsis: >
    Um conto de dezoito páginas: depois de quarenta anos de casamento
    infeliz e da mais recente infidelidade do marido, Margaret Valance
    decide que já chega.
