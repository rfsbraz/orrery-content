# Overlay pt-PT dos eventos da franquia: `title` + `description` (nenhum tem
# `quote`, o único outro campo de prosa que a aplicação lê nesta estrutura).
# Datas, organisation, illustration_type, modifier, images_required, scope,
# reach, impact, spoilerAfter e sources nunca se traduzem.
# The Girl in the Ice, Nine Elms, Fatal Witness e Fear the Silence têm edição
# portuguesa registada em editions.yaml e são citados pelos títulos
# publicados. Miss Wrong and Mr Right e The Quiet Kill não têm edição
# portuguesa e ficam com o título original. Tíživé ticho é o título checo,
# nome próprio, não traduzido.
- id: robert-bryndza/girl-in-the-ice-million-sales-2017
  title: Um romance policial de estreia vende um milhão de exemplares em menos de um ano
  description: >
    Lançado em fevereiro de 2016,
    [[work:robert-bryndza/the-girl-in-the-ice|A Rapariga no Gelo]] chega ao
    primeiro lugar da Amazon nos EUA, no Canadá, na Austrália e nos Países
    Baixos e, em menos de um ano, vende mais de um milhão de exemplares - o
    primeiro livro da série de Erika Foster a fazê-lo para a sua editora, a
    Bookouture, com a série no seu conjunto (já com três livros) a
    ultrapassar 1,4 milhões. É o segundo título Kindle mais vendido de 2016
    na Amazon.com, com direitos vendidos para vinte e quatro países,
    incluindo um contrato de seis dígitos na Alemanha. O próprio relato de
    Bryndza, um ano depois de um lançamento que o deixara nervoso,
    preocupado com a forma como os leitores receberiam "a minha mudança de
    direção da comédia romântica para os thrillers policiais": "nunca sonhei
    que venderia tantos livros em tão pouco tempo." A primeira tentativa no
    policial de um autor até aí conhecido pela comédia romântica
    autopublicada torna-se, num ano, o alicerce comercial sobre o qual o
    resto do catálogo é construído.

- id: robert-bryndza/kate-marshall-launch-2019
  title: Uma segunda detetive, e uma Inglaterra diferente
  description: >
    Três anos depois de o procedimental policial de Erika Foster na Polícia
    Metropolitana ter começado, Bryndza lança uma segunda série com
    [[work:robert-bryndza/nine-elms|Mistério em Nine Elms]], levando pela
    primeira vez a sua ficção policial para fora de Londres: a investigadora
    privada Kate Marshall trabalha as barragens, charnecas e estuários
    enevoados da Riviera inglesa, em South Devon, em vez da capital.
    Mistério em Nine Elms chega ao primeiro lugar na Amazon dos EUA e ao top
    cinco no Reino Unido, provando que a força comercial de A Rapariga no
    Gelo não era um fenómeno de um livro só, nem de um único cenário, e
    dando ao catálogo uma segunda série policial, geograficamente distinta,
    a correr em paralelo com a primeira.

- id: robert-bryndza/raven-street-publishing-2022
  title: De volta à autopublicação, com o seu próprio selo
  description: >
    [[work:robert-bryndza/fatal-witness|Testemunha Fatal]], o sétimo romance
    de Erika Foster, é publicado em julho de 2022 pela Raven Street
    Publishing, o novo selo do próprio Bryndza - o primeiro dos seus
    romances policiais até aí publicados por editoras tradicionais a surgir
    desta forma, com o resto do catálogo policial e as comédias românticas
    de Coco Pinchard a segui-lo com o tempo. Batiza o selo com o nome do
    teatro fictício de
    [[work:robert-bryndza/miss-wrong-and-mr-right|Miss Wrong and Mr Right]]
    e descreve a mudança, nas suas próprias palavras, como um regresso "ao
    ponto de partida": da estreia autopublicada, passando pela edição
    tradicional construída sobre o sucesso de Erika Foster e Kate Marshall,
    até voltar a lançar os seus próprios livros em inglês de forma
    independente, mantendo o controlo criativo total.

- id: robert-bryndza/fear-the-silence-czech-award-2024
  title: Um thriller independente vence um prémio checo de bestsellers
  description: >
    Tíživé ticho, a edição checa do romance independente
    [[work:robert-bryndza/fear-the-silence|Antes de Dizer Adeus]], vence a
    categoria de Ficção Traduzida dos prémios Český bestseller (Bestseller
    Checo) de 2023, entregues pela cadeia de livrarias Knihcentrum na Dům
    knihy, em Ostrava, a 1 de março de 2024. Bryndza chama à vitória
    "incrível" e "irreal", agradecendo nomeadamente aos leitores checos, à
    Knihcentrum e à sua editora checa, a Grada - um sinal de receção para um
    livro que escreveu como um desvio independente das suas duas séries
    policiais em curso, e o único prémio do seu catálogo policial ganho fora
    do mercado de língua inglesa.

- id: robert-bryndza/jamie-day-launch-2026
  title: Um rascunho falhado sobre uma ocupante ilegal torna-se uma terceira série policial
  description: >
    [[work:robert-bryndza/the-quiet-kill|The Quiet Kill]] não começa como um
    romance de Jamie Day. O próprio relato de Bryndza sobre a escrita:
    começou como a história de Joanna, uma jovem sem-abrigo a ocupar
    ilegalmente uma casa em Londres, cuja vida vira do avesso quando ali
    surge um corpo. Os primeiros capítulos funcionam; lá para o capítulo
    vinte a história empanca, porque a tensão só se sustenta enquanto Joanna
    se mantém escondida. Depois escreve uma cena em que um polícia novato,
    Jamie, chega à cena do crime com um colega mais velho - "de repente, a
    história ganhou vida e todas as peças começaram a encaixar-se" - e o
    livro passou a ser dele. "Sem qualquer planeamento", Bryndza vê-se a
    começar uma terceira série policial e, pela primeira vez em vinte e três
    livros, a escrever um protagonista masculino. Já chamou a Jamie
    "provavelmente a personagem que escrevi mais parecida comigo": ambos são
    de Lowestoft, e o desnorte de Jamie ao chegar à Londres dos anos 80 no
    início do livro ecoa a própria mudança de Bryndza para uma Londres
    avassaladora aos vinte e dois anos.
