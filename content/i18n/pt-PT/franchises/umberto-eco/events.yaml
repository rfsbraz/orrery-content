# Overlay pt-PT (português europeu) dos eventos da franquia: `title` +
# `description` (prosa). id, date, scope, reach, impact, spoilerAfter e
# sources nunca se traduzem.
#
# O texto de exibição das referências internas a obras usa o título
# publicado em Portugal onde existe edição em editions.yaml: "O Nome da
# Rosa" (the-name-of-the-rose) e "A Misteriosa Chama da Rainha Loana"
# (the-mysterious-flame-of-queen-loana).
# "Opera aperta" fica com o texto de exibição "Obra Aberta" (Relógio d'Água,
# 2016). Sem edição portuguesa: interpretation-and-overinterpretation,
# belief-or-nonbelief (fica com o título original italiano In cosa crede chi
# non crede?, como no texto de base) e cinque-scritti-morali. A menção em
# prosa simples "The Name of the Rose (1983)" no evento sobre a tradutora da
# Regina Loana refere-se especificamente à data da edição inglesa de Weaver,
# não é uma referência genérica à obra, e fica por isso no inglês do original.

- id: umberto-eco-opera-aperta-reception-1962
  title: Obra Aberta desencadeia uma polémica crítica de sessenta artigos e dá ao Gruppo 63 o seu vocabulário
  description: >
    [[work:umberto-eco/opera-aperta|Obra Aberta]] provocou, segundo o próprio
    relato posterior de Eco, uma polémica imediata e invulgarmente ampla:
    mais de sessenta artigos sobre o livro apareceram na imprensa italiana só
    entre a sua publicação, em junho de 1962, e fevereiro de 1963, indo do
    apoio entusiástico à rejeição total. Críticos alinhados com a
    Neoavanguardia emergente, entre eles Renato Barilli e Elio Pagliarani,
    adotaram o seu vocabulário da "obra aberta" como base teórica para a
    escrita experimental que se consolidou, no ano seguinte, no Gruppo 63;
    críticos de posição marxista contra-argumentavam que Eco estava a
    importar modelos emprestados da música e a aplicá-los onde não
    pertenciam, à literatura.

- id: umberto-eco-opera-aperta-levi-strauss-1967
  title: Claude Lévi-Strauss ataca a "obra aberta" como um erro de categoria
  description: >
    Em 1967 o antropólogo Claude Lévi-Strauss publicou um desafio direto à
    ideia central de [[work:umberto-eco/opera-aperta|Obra Aberta]]: uma obra,
    argumentava, tem propriedades estruturais precisas, tão fixas como a
    rigidez de um cristal, que um analista deve descrever sem as confundir
    com as interpretações que leitores posteriores nela projetam. Eco
    respondeu que a própria análise estrutural é sempre realizada por
    intérpretes situados no seu momento histórico, não podendo por isso
    escapar por completo à história das leituras de uma obra - uma réplica
    que continuou a aperfeiçoar pelo resto da carreira, através de Lector in
    fabula (1979) e da sua escrita posterior sobre os limites da
    interpretação.

- id: umberto-eco-name-of-the-rose-prizes-1981
  title: Il nome della rosa vence o Prémio Strega e depois o Médicis Étranger francês
  description: >
    [[work:umberto-eco/the-name-of-the-rose|O Nome da Rosa]] venceu o Prémio
    Strega de Itália em 1981, o galardão literário mais prestigiado do país,
    e depois o Prix Médicis Étranger em 1982, para o melhor romance
    estrangeiro publicado em França nesse ano - uma validação consecutiva do
    meio literário, distinta e bem anterior ao público de massas que o filme
    de Annaud, em 1986, viria mais tarde trazer ao livro.

- id: umberto-eco-rorty-overinterpretation-1992
  title: Richard Rorty refuta publicamente os limites que Eco impõe à interpretação
  description: >
    [[work:umberto-eco/interpretation-and-overinterpretation|Interpretation
    and Overinterpretation]] reuniu as Tanner Lectures de Eco de 1990 ao lado
    de respostas formais do filósofo Richard Rorty e dos críticos Jonathan
    Culler e Christine Brooke-Rose, editadas por Stefan Collini. Rorty
    contestou com força a afirmação de Eco de que um texto impõe limites
    reais ao modo como pode ser lido - o que Eco chamava a sua intentio
    operis - em vez de estar aberto a qualquer uso que um leitor lhe dê; a
    publicação do próprio debate, respostas incluídas, deu à réplica de Eco,
    e à intentio lectoris que cunhou para a nomear, a sua forma canónica e
    mais citada.

- id: umberto-eco-martini-dialogue-1996
  title: Um diálogo publicado com o Cardeal Martini sobre a crença sem Deus
  description: >
    [[work:umberto-eco/belief-or-nonbelief|In cosa crede chi non crede?]]
    juntou Eco, por sua própria conta um agnóstico, a Carlo Maria Martini,
    Arcebispo de Milão e um dos intelectuais mais destacados da Igreja
    Católica, num livro construído inteiramente a partir de uma troca de
    cartas: cada um escreveu apenas o seu próprio lado do argumento, sobre
    ética, aborto e a crença sem Deus, sem que a resposta do outro fosse
    incorporada no texto. A edição inglesa, Belief or Nonbelief? A Dialogue
    (2000), foi distinguida como um dos melhores livros de não-ficção do ano
    pelo Los Angeles Times.

- id: umberto-eco-queen-loana-translator-2005
  title: A sua edição inglesa interrompe uma série de traduções de William Weaver
  description: >
    Quando [[work:umberto-eco/the-mysterious-flame-of-queen-loana|A
    Misteriosa Chama da Rainha Loana]] surgiu em inglês, na primavera de
    2005, foi traduzida por Geoffrey Brock e não por William Weaver, que
    traduzira todos os três romances anteriores de Eco desde The Name of the
    Rose (1983). Weaver só morreria em 2013, oito anos depois, e nenhuma
    fonte explica diretamente a mudança; tornou Brock o primeiro de mais dois
    tradutores (Richard Dixon seguiu-se para os últimos dois romances) a
    assumir um romance de Eco enquanto Weaver ainda estava vivo e continuava
    a traduzir a não-ficção do próprio Eco.

- id: umberto-eco-ur-fascism-reissue-2018
  title: Ur-Fascism ressurge como livro autónomo num novo clima político
  description: >
    "Ur-Fascism" (também traduzido como "Eternal Fascism: Fourteen Ways of
    Looking at a Blackshirt"), a conferência e ensaio de 1995 recolhidos em
    [[work:umberto-eco/cinque-scritti-morali|Cinque scritti morali]] que
    enumera catorze traços recorrentes da ideologia fascista, ganhou
    renovada atenção no século XXI e foi reeditado em Itália como volume
    autónomo, Il fascismo eterno, em 2018, mais de vinte anos depois da sua
    primeira publicação.
