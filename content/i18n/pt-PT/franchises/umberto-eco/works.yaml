# Overlay pt-PT (português europeu) das obras: apenas `synopsis` (prosa).
# `title` nunca se traduz aqui - um título traduzido só existe como edição
# publicada, em editions.yaml (docs/SCHEMA.md, "Never translate a published
# title"). `note` e `translationNote` também não se traduzem: são anotação de
# curadoria (a segunda nunca chega a renderizar na aplicação - ver
# docs/SCHEMA.md, "translationNote: when the translator is part of the
# decision" - e a primeira está ausente da interface Work, confirmado pela
# auditoria de spoilers desta ala).
#
# NENHUMA sinopse tem referências internas a outras obras no original, pelo
# que não há título de obra a rever aqui dentro de synopsis. Os títulos ingleses
# ou italianos citados dentro do texto (ex.: "Translated as The Open Work") são
# factos sobre uma edição noutra língua, não uma referência interna desta
# catalogação - mantidos como no original, nunca inventada uma correspondência
# portuguesa que editions.yaml não regista.
#
# SINOPSE DE O NOME DA ROSA: traduzida exatamente ao nível a que a auditoria de
# spoilers a fixou (contracapa da HarperCollins) - sem nome, idade ou natureza
# do segredo da biblioteca, sem quem está por trás das mortes, sem motivo, sem
# mecanismo. Não se repõe aqui nenhuma revelação a partir de conhecimento
# exterior sobre o romance.
#
# TERMINOLOGIA. "banda desenhada" (nunca "quadrinhos", brasileirismo) para
# comics/fumetti; "semiótica"/"semiologia" e "obra aberta" seguem o vocabulário
# académico português já fixado pela receção de Eco em Portugal (Gradiva,
# Relógio d'Água).

# --- Romances (7) ---

- id: umberto-eco/the-name-of-the-rose
  synopsis: >
    Um frade franciscano e o seu noviço investigam uma série de mortes numa
    abadia beneditina do século XIV, decifrando manuscritos codificados e
    símbolos enigmáticos numa pista que os leva até à biblioteca labiríntica
    da abadia. A estreia de Eco na ficção, que combina um romance policial com
    teologia medieval e semiótica; vendeu mais de 50 milhões de exemplares em
    todo o mundo.

- id: umberto-eco/foucaults-pendulum
  synopsis: >
    Três editores de livros milaneses, entediados, alimentam um programa de
    computador com manuscritos ocultistas para inventar uma conspiração
    fictícia que liga os Templários a um plano de dominação mundial, e veem a
    invenção ganhar uma vida perigosa e própria. Tradução de William Weaver.

- id: umberto-eco/the-island-of-the-day-before
  synopsis: >
    Naufragado em 1643 e encalhado a uma distância de nado de uma ilha a que
    não consegue chegar, um nobre italiano ocupa-se com a memória, a filosofia
    e uma obsessão pela linha internacional de mudança de data que passa ao
    largo. Tradução de William Weaver.

- id: umberto-eco/baudolino
  synopsis: >
    Um mentiroso talentoso do Piemonte conta a sua própria vida, de uma
    infância camponesa através da corte de Frederico Barba-Ruiva até uma busca
    lendária pelo reino do Preste João, ao historiador bizantino Nicetas
    Coniata durante o saque de Constantinopla. Tradução de William Weaver.

- id: umberto-eco/the-mysterious-flame-of-queen-loana
  synopsis: >
    Um livreiro antiquário acorda de um AVC com a memória pessoal apagada mas
    a memória de tudo o que alguma vez leu intacta, e reconstrói a própria
    infância sob o fascismo através da banda desenhada, dos discos e das
    revistas da época. Tradução de Geoffrey Brock, o primeiro dos romances de
    Eco não traduzido por Weaver.

- id: umberto-eco/the-prague-cemetery
  synopsis: >
    Um falsificador na Europa do século XIX fabrica os documentos por trás de
    conspirações antissemitas historicamente reais, incluindo material que
    alimentou os Protocolos dos Sábios de Sião. Tradução de Richard Dixon.

- id: umberto-eco/numero-zero
  synopsis: >
    Um jornalista acabado é contratado para trabalhar num jornal milanês que o
    dono nunca teve intenção de publicar, e vê-se envolvido na teoria da
    conspiração de um colega sobre a morte fingida de Mussolini. O último
    romance de Eco publicado em vida, tradução de Richard Dixon.

# --- Obras académicas, semióticas e de ensaio (50) ---

- id: umberto-eco/il-problema-estetico-in-san-tommaso
  synopsis: >
    O primeiro livro de Eco, um estudo académico sobre a estética de Tomás de
    Aquino, desenvolvido a partir da sua tese universitária de 1954. Revisto e
    traduzido como The Aesthetics of Thomas Aquinas (1988).

- id: umberto-eco/opera-aperta
  synopsis: >
    Defende que uma obra literária ou musical pode ser estruturalmente
    "aberta" - convidando o público a completar o seu sentido em vez de ditar
    uma única leitura. Uma das ideias mais citadas de Eco. Traduzida como The
    Open Work (1989); revista pelo próprio Eco em 1976.

- id: umberto-eco/diario-minimo
  synopsis: >
    Ensaios satíricos sobre a cultura de massas, incluindo "Fenomenologia di
    Mike Bongiorno", a sua peça inicial mais conhecida sobre um apresentador
    de concursos televisivos popular. Traduzida como Misreadings (1993).

- id: umberto-eco/apocalittici-e-integrati
  synopsis: >
    Um estudo sociológico da comunicação de massas e da cultura popular,
    estruturado em torno dos críticos "apocalípticos" que a desprezam e dos
    "integrados" que a abraçam sem espírito crítico. Parcialmente traduzida
    como Apocalypse Postponed (1994).

- id: umberto-eco/le-poetiche-di-joyce
  synopsis: >
    Um estudo da estética de James Joyce, de A Portrait of the Artist até
    Finnegans Wake. Traduzida em duas edições inglesas distintas, The Middle
    Ages of James Joyce e The Aesthetics of Chaosmos (ambas de 1989).

- id: umberto-eco/la-struttura-assente
  synopsis: >
    Uma introdução completa à investigação semiológica, abrangendo a
    comunicação visual, a arquitetura, o cinema e os códigos publicitários.
    Não foi encontrada tradução inglesa; o seu conteúdo é frequentemente
    descrito como retomado na escrita semiótica posterior de Eco, o que não
    foi aqui verificado através de uma comparação direta.

- id: umberto-eco/le-forme-del-contenuto
  synopsis: >
    Ensaios sobre a semiótica do conteúdo e a estrutura do significado. Não
    foi encontrada tradução inglesa.

- id: umberto-eco/il-costume-di-casa
  synopsis: >
    Ensaios que leem a cultura popular e a ideologia italiana e americana, da
    Disneylândia ao Super-Homem. Traduzida como Faith in Fakes: Travels in
    Hyperreality (1986).

- id: umberto-eco/il-segno
  synopsis: >
    Uma introdução geral ao signo como conceito semiótico. Não foi encontrada
    tradução inglesa.

- id: umberto-eco/trattato-di-semiotica-generale
  synopsis: >
    A principal obra de teoria semiótica de Eco, que aborda os códigos, a
    produção de signos e os limites de uma teoria geral dos signos; o livro
    que lhe valeu a cátedra em Bolonha. Traduzida como A Theory of Semiotics
    (1976).

- id: umberto-eco/il-superuomo-di-massa
  synopsis: >
    Estudos sobre o romance popular e os seus heróis "super-homem", de Eugène
    Sue ao Super-Homem das bandas desenhadas. Não existe tradução inglesa.

- id: umberto-eco/stelle-e-stellette
  synopsis: >
    Uma fábula ilustrada sobre a Via Láctea, com desenhos do autor de banda
    desenhada francês Philippe Druillet. Publicada em tradução inglesa como
    "Stars and Stripes".

- id: umberto-eco/dalla-periferia-dellimpero
  synopsis: >
    Uma coletânea dos ensaios políticos e sobre os media de Eco, de meados da
    década de 1970, publicada pela Bompiani. Não foi encontrada tradução
    inglesa.

- id: umberto-eco/come-si-fa-una-tesi-di-laurea
  synopsis: >
    Um guia prático para investigar e escrever uma tese académica,
    enormemente popular entre os estudantes italianos ao longo de décadas.
    Traduzido como How to Write a Thesis (2015).

- id: umberto-eco/lector-in-fabula
  synopsis: >
    Um estudo sobre a cooperação interpretativa que um texto narrativo exige
    do seu leitor. O seu conteúdo integra o volume composto de língua inglesa
    The Role of the Reader, publicado no mesmo ano (ver a nota da própria
    entrada sobre a relação entre os dois).

- id: umberto-eco/the-role-of-the-reader
  synopsis: >
    Um volume de língua inglesa que reúne material de cinco livros italianos
    de Eco (Opera aperta, Apocalittici e integrati, Le forme del contenuto, Il
    superuomo di massa e Lector in fabula) na referência padrão da academia
    anglófona para a sua semiótica da resposta do leitor.

- id: umberto-eco/de-bibliotheca
  synopsis: >
    Um breve ensaio pessoal sobre a própria biblioteca de Eco, publicado em
    italiano e em francês. Não foi encontrada tradução inglesa.

- id: umberto-eco/postille-a-il-nome-della-rosa
  synopsis: >
    O próprio ensaio reflexivo de Eco sobre a escrita de Il nome della rosa,
    anexado a edições posteriores do romance. Publicado em inglês como
    Postscript to The Name of the Rose (EUA, 1984) e Reflections on The Name
    of the Rose (Reino Unido, 1985) - o mesmo texto sob dois títulos
    diferentes.

- id: umberto-eco/sette-anni-di-desiderio
  synopsis: >
    Uma recolha das colunas de Eco na L'Espresso e na La Repubblica, dos anos
    dos "anos de chumbo" italianos, incluindo a sua cobertura do rapto de
    Aldo Moro. Publicada pela Bompiani; não foi encontrada tradução inglesa.

- id: umberto-eco/semiotica-e-filosofia-del-linguaggio
  synopsis: >
    Ensaios que ligam a teoria semiótica à filosofia da linguagem. Traduzida
    no mesmo ano como Semiotics and the Philosophy of Language (1984).

- id: umberto-eco/sugli-specchi-e-altri-saggi
  synopsis: >
    Uma coletânea de 24 ensaios que percorre espelhos, signos teatrais,
    sonhos medievais sobre a Idade Média, ficção científica e as ciências
    humanas. Não foi encontrada tradução inglesa.

- id: umberto-eco/arte-e-bellezza-nellestetica-medievale
  synopsis: >
    Um levantamento do pensamento estético medieval para além do estudo
    centrado em Tomás de Aquino do primeiro livro de Eco, da teoria de arte
    carolíngia até à ideia medieval de beleza como proporção e luz. Traduzida
    como Art and Beauty in the Middle Ages; com um lugar de destaque
    suficiente na carreira de Eco para que a imagem principal da biografia na
    Wikipédia italiana seja o seu autógrafo na edição alemã do livro.

- id: umberto-eco/i-limiti-dellinterpretazione
  synopsis: >
    Argumenta contra a "semiose ilimitada" - a ideia de que um texto pode ser
    feito significar qualquer coisa - traçando a história e os limites do
    excesso interpretativo. Traduzida como The Limits of Interpretation
    (1990).

- id: umberto-eco/il-secondo-diario-minimo
  synopsis: >
    Uma segunda coletânea de textos satíricos breves de Eco, incluindo o
    ensaio-título sobre a etiqueta de viajar com um peixe. Parcialmente
    traduzida como How to Travel with a Salmon & Other Essays (1998), que não
    reproduz a totalidade do conteúdo italiano.

- id: umberto-eco/la-ricerca-della-lingua-perfetta
  synopsis: >
    Uma história da busca secular da Europa por uma língua única, perfeita ou
    universal, de Babel ao Esperanto. Traduzida como The Search for the
    Perfect Language (1995).

- id: umberto-eco/six-walks-in-the-fictional-woods
  synopsis: >
    As Norton Lectures que Eco proferiu em Harvard, sobre o modo como um
    leitor se move dentro de um texto narrativo. Escritas e publicadas em
    inglês; não foi encontrada uma edição em italiano original deste texto
    exato.

- id: umberto-eco/interpretation-and-overinterpretation
  synopsis: >
    As Tanner Lectures de Eco em Cambridge, em 1990, sobre os limites da
    interpretação textual, publicadas com respostas de Richard Rorty, Jonathan
    Culler e Christine Brooke-Rose, editadas por Stefan Collini. Escritas e
    publicadas em inglês; traduzidas para italiano em 1995 como
    Interpretazione e sovrainterpretazione.

- id: umberto-eco/tra-menzogna-e-ironia
  synopsis: >
    Uma breve coletânea de quatro ensaios sobre Cagliostro, o uso da
    linguagem enganadora por Manzoni, e outros estudos sobre a ironia e a
    mentira. Não foi encontrada tradução inglesa.

- id: umberto-eco/cinque-scritti-morali
  synopsis: >
    Cinco ensaios sobre a guerra, a imprensa, a tolerância e a crença,
    incluindo "Ur-Fascism", o seu ensaio de 1995, amplamente lido, que
    enumera catorze traços que identifica com a ideologia fascista. Traduzida
    como Five Moral Pieces (2001).

- id: umberto-eco/kant-e-lornitorinco
  synopsis: >
    Sobre a cognição, a categorização e o problema que um animal como o
    ornitorrinco coloca a qualquer sistema de classificação arrumado.
    Traduzida como Kant and the Platypus: Essays on Language and Cognition
    (1999).

- id: umberto-eco/serendipities
  synopsis: >
    Cinco ensaios sobre erros intelectuais produtivos ao longo da história, de
    uma mítica "língua da terra austral" às interpretações erradas de Marco
    Polo. Publicada em tradução inglesa (William Weaver); não foi encontrado
    um volume italiano à parte com a mesma estrutura.

- id: umberto-eco/la-bustina-di-minerva
  synopsis: >
    Uma coletânea da coluna "La Bustina di Minerva" de Eco para a L'Espresso,
    a coluna quinzenal que escreveu de 1985 até à sua morte. Não foi
    encontrada tradução inglesa.

- id: umberto-eco/experiences-in-translation
  synopsis: >
    As Goggio Public Lectures que Eco proferiu na Universidade de Toronto
    sobre a prática da tradução, publicadas em inglês pela University of
    Toronto Press.

- id: umberto-eco/sulla-letteratura
  synopsis: >
    Ensaios sobre Dante, Borges, Wilde, Manzoni e o próprio estilo. Traduzida
    por Martin McLaughlin como On Literature (2004).

- id: umberto-eco/dire-quasi-la-stessa-cosa
  synopsis: >
    Um estudo de fôlego sobre a tradução como negociação entre línguas,
    extraído da própria experiência de Eco como autor traduzido e como
    tradutor. Publicado em inglês no mesmo ano como Mouse or Rat?:
    Translation as Negotiation.

- id: umberto-eco/storia-della-bellezza
  synopsis: >
    Uma história ilustrada da ideia de beleza na arte e no pensamento
    ocidentais, contada através do texto de ligação do próprio Eco e de uma
    vasta seleção de imagens e excertos históricos. Traduzida como History of
    Beauty (EUA) / On Beauty (Reino Unido), ambas de 2004.

- id: umberto-eco/a-passo-di-gambero
  synopsis: >
    Ensaios sobre o populismo mediático e o retrocesso político na década de
    2000. Traduzida por Alastair McEwen como Turning Back the Clock: Hot Wars
    and Media Populism (2007).

- id: umberto-eco/la-memoria-vegetale-e-altri-scritti-di-bibliofilia
  synopsis: >
    Dezanove ensaios sobre o colecionismo de livros, manuscritos históricos e
    bibliofilia, com base na vasta biblioteca privada do próprio Eco. Não foi
    encontrada tradução inglesa.

- id: umberto-eco/storia-della-bruttezza
  synopsis: >
    Um volume companheiro de Storia della bellezza, que traça a ideia de
    fealdade através da arte e do pensamento ocidentais. Traduzida como On
    Ugliness (2007).

- id: umberto-eco/dallalbero-al-labirinto
  synopsis: >
    Estudos históricos sobre o signo e a interpretação, que traçam modelos
    rivais de organização do conhecimento, do diagrama em árvore ao
    labirinto. Traduzida por Anthony Oldcorn como From the Tree to the
    Labyrinth (2014).

- id: umberto-eco/la-vertigine-della-lista
  synopsis: >
    Um ensaio ilustrado sobre a lista como recurso literário e artístico ao
    longo da cultura ocidental, escrito para acompanhar uma exposição que Eco
    curou no Louvre. Traduzida como The Infinity of Lists (2009).

- id: umberto-eco/confessions-of-a-young-novelist
  synopsis: >
    Conferências sobre a própria experiência de Eco como romancista,
    proferidas na Universidade Emory e publicadas em inglês.

- id: umberto-eco/costruire-il-nemico
  synopsis: >
    Quinze ensaios avulsos, incluindo o texto-título sobre o modo como as
    sociedades constroem um inimigo para se definirem contra ele. Traduzida
    por Richard Dixon como Inventing the Enemy (2012).

- id: umberto-eco/scritti-sul-pensiero-medievale
  synopsis: >
    Um volume que reúne os escritos de Eco sobre o pensamento medieval,
    abrangendo toda a sua carreira até à sua tese de 1954 sobre Tomás de
    Aquino. Não foi encontrada tradução inglesa.

- id: umberto-eco/storia-delle-terre-e-dei-luoghi-leggendari
  synopsis: >
    Um atlas ilustrado de lugares lendários e imaginários, de Atlântida a El
    Dorado, contado através dos textos e mapas que os descreveram. Traduzida
    por Alastair McEwen como The Book of Legendary Lands (2013).

- id: umberto-eco/riflessioni-sul-dolore
  synopsis: >
    Um breve ensaio de reflexão sobre a natureza e a representação da dor.
    Não foi encontrada tradução inglesa.

- id: umberto-eco/pape-satan-aleppe
  synopsis: >
    Uma recolha póstuma das colunas jornalísticas do próprio Eco sobre
    política, media e tecnologia, publicada poucas semanas depois da sua
    morte, em fevereiro de 2016. Traduzida por Richard Dixon como Chronicles
    of a Liquid Society (2017).

- id: umberto-eco/sulle-spalle-dei-giganti
  synopsis: >
    Uma coletânea póstuma das conferências de Eco para o festival "La
    Milanesiana" (2001-2015), sobre a beleza, a fealdade, a imperfeição, a
    conspiração e as listas. Traduzida por Alastair McEwen como On the
    Shoulders of Giants (2019).

- id: umberto-eco/sulla-televisione
  synopsis: >
    Uma recolha póstuma da escrita de Eco sobre televisão ao longo de seis
    décadas, desde a sua primeira crítica aos media, nos anos 1950. Não foi
    encontrada tradução inglesa.

- id: umberto-eco/sullarte
  synopsis: >
    Uma recolha póstuma da escrita de Eco sobre arte visual ao longo de toda
    a sua carreira. Não foi encontrada tradução inglesa.

# --- Livros infantis (5) ---

- id: umberto-eco/la-bomba-e-il-generale
  synopsis: >
    Um livro ilustrado em que os átomos dentro de uma bomba se rebelam contra
    o general que a quer usar. Revisto em 1988; traduzido como The Bomb and
    the General (1989).

- id: umberto-eco/i-tre-cosmonauti
  synopsis: >
    Um astronauta americano, um russo e um chinês aterram em Marte ao mesmo
    tempo e aprendem, sozinhos e juntos, longe de casa, que as suas
    diferenças nacionais não importam. Traduzido como The Three Astronauts
    (1989).

- id: umberto-eco/gli-gnomi-di-gnu
  synopsis: >
    Um livro ilustrado sobre uma comunidade de gnomos e a poluição industrial
    que ameaça o seu mundo. Traduzido como The Gnomes of Gnu (1992).

- id: umberto-eco/ammazza-luccellino
  synopsis: >
    Um livro infantil ilustrado por Monica Sangberg, publicado sob o
    pseudónimo "Dedalus" - a grafia italiana do pseudónimo inspirado em James
    Joyce que Eco já tinha usado em 1959 (ver a sua entidade de autor). Não
    foi encontrada tradução inglesa.

- id: umberto-eco/la-storia-de-i-promessi-sposi
  synopsis: >
    O próprio reconto de Eco do clássico oitocentista de Alessandro Manzoni
    para leitores jovens, publicado numa coleção que emparelha escritores
    conhecidos com o cânone literário italiano (Scuola Holden / La Biblioteca
    di Repubblica-L'Espresso). Não é uma história original de Eco - o enredo
    de Manzoni, recontado pelas suas próprias palavras para a coleção.

# --- Apócrifa (5) ---

- id: umberto-eco/filosofi-in-liberta
  synopsis: >
    Um panfleto de caricaturas e versos, impresso numa tiragem limitada de
    550 exemplares sob o pseudónimo "Daedalus" - o trabalho que trouxe Eco
    pela primeira vez à atenção do editor Valentino Bompiani.

- id: umberto-eco/belief-or-nonbelief
  synopsis: >
    Uma troca de cartas publicada entre Eco, agnóstico, e o Cardeal Carlo
    Maria Martini, Arcebispo de Milão, sobre ética e a crença sem Deus. Cada
    autor contribuiu apenas com o seu próprio lado do diálogo. Traduzida como
    Belief or Nonbelief? A Dialogue (2000).

- id: umberto-eco/the-sign-of-three
  synopsis: >
    Uma antologia académica de vários autores sobre o raciocínio abdutivo na
    ficção policial e na semiótica, coeditada com Thomas A. Sebeok. Eco
    contribuiu para este volume, mas não o escreveu sozinho.

- id: umberto-eco/on-the-medieval-theory-of-signs
  synopsis: >
    Uma antologia académica de vários autores com textos medievais e
    comentários sobre a teoria dos signos, coeditada com Constantino Marmo.
    Eco contribuiu com dois ensaios, em vez de escrever o volume sozinho.

- id: umberto-eco/non-sperate-di-liberarvi-dei-libri
  synopsis: >
    Uma conversa em livro entre Eco e o argumentista francês Jean-Claude
    Carrière sobre livros, bibliotecas e a durabilidade do papel impresso,
    conduzida e editada pelo jornalista Jean-Philippe de Tonnac. Traduzida
    como This Is Not the End of the Book (2011).
