# Overlay pt-PT (português europeu) das ordens de leitura: `name`,
# `rationale` e `debated`. id, type, source, orderedWorkIds e sources nunca
# se traduzem. Nenhuma das 20 obras listadas em orderedWorkIds nem os 35
# títulos citados em `debated` tem edição portuguesa registada em
# editions.yaml, pelo que todos os títulos citados aqui ficam no original
# italiano ou inglês, tal como no texto de base.

- id: umberto-eco/beyond-the-novels
  name: Para lá dos romances
  rationale: >
    Para um leitor que já leu alguns ou todos os sete romances e quer mais do
    pensamento do próprio Eco, sem se inscrever no seminário de semiótica em
    que a outra metade do patamar alargado se transforma. Cada obra aqui é
    uma coletânea de jornalismo ou ensaios avulsos escrita para um público de
    jornal, uma história cultural ilustrada feita para folhear e não para
    discutir, ou um ciclo de conferências públicas (as Norton Lectures de
    Harvard, as Tanner Lectures de Cambridge, as Goggio Public Lectures de
    Toronto, as Ellmann Lectures de Emory) dirigidas a um público geral e não
    a um seminário de pós-graduação - e, com uma exceção parcial assinalada
    abaixo, todas as vinte foram julgadas dignas de uma tradução inglesa, um
    sinal de mercado real de que um editor anglófono esperava leitores
    gerais, não apenas especialistas em Eco, interessados nelas. O custo é
    real: isto não é a totalidade do patamar alargado, e o que fica de fora
    não é um Eco menor - Trattato di semiotica generale e Kant e l'ornitorinco
    são exatamente tão centrais para quem ele era como qualquer romance, só
    que não foram construídos para um leitor a explorar (ver `debated`).
    Também deixa de fora as suas seis fábulas infantis e ilustradas, um
    registo completamente diferente, e mais dez volumes italianos de
    jornalismo e ensaio que partilham o género desta ordem mas nunca
    encontraram um editor anglófono que os traduzisse.
  debated:
    - "Esta é uma ordem parcial: trinta e cinco das cinquenta e cinco obras
       do patamar alargado não estão aqui. Dezoito são a teoria semiótica e
       estética especializada que esta ordem existe precisamente para deixar
       de lado: Il problema estetico in San Tommaso, Opera aperta, Le
       poetiche di Joyce, La struttura assente, Le forme del contenuto, Il
       segno, Trattato di semiotica generale, Il superuomo di massa, Lector
       in fabula, The Role of the Reader, Semiotica e filosofia del
       linguaggio, Arte e bellezza nell'estetica medievale, I limiti
       dell'interpretazione, La ricerca della lingua perfetta, Kant e
       l'ornitorinco, Dire quasi la stessa cosa, Dall'albero al labirinto e
       Scritti sul pensiero medievale - cada uma delas um único argumento
       teórico continuado, escrito para leitores já dentro da área, para ser
       trabalhado e não folheado. A história de tradução não é aqui o
       critério: várias chegaram ao inglês por editoras comerciais generalistas
       (Kant and the Platypus pela Harcourt/Mariner, The Search for the
       Perfect Language pela Blackwell) e continuam de fora, porque o que as
       torna exigentes é a densidade do argumento, não a falta de edição.
       Seis são fábulas infantis e ilustradas (La bomba e il
       generale, I tre cosmonauti, Gli gnomi di Gnu, Ammazza l'uccellino,
       Stelle & stellette, La storia de \"I promessi sposi\") - genuinamente
       acessíveis, mas num registo diferente (literatura infantil) do que
       esta ordem cura. Uma, Come si fa una tesi di laurea (How to Write a
       Thesis), não se enquadra em nenhum dos dois registos: um guia prático
       de estudo, não uma coletânea de ensaios nem uma monografia teórica,
       traduzida mas lida pela sua utilidade e não pelas ideias de Eco."
    - "Mais nove (Dalla periferia dell'impero, Sugli specchi e altri saggi,
       Tra menzogna e ironia, La bustina di Minerva, La memoria vegetale e
       altri scritti di bibliofilia, De bibliotheca, Riflessioni sul dolore,
       Sulla televisione, Sull'arte) ficam de fora
       apenas pela história de tradução, não pelo género: cada uma é
       jornalismo, ensaio avulso ou reflexão pessoal no mesmo registo do
       conteúdo desta ordem, mas não foi encontrada nenhuma edição em língua
       inglesa de qualquer uma delas, depois de décadas impressas, pelo que
       não há indício de que algum editor anglófono as tenha julgado
       suficientemente gerais para traduzir. Um leitor de italiano tem
       disponível uma versão substancialmente maior desta ordem; esta fica
       limitada ao que um leitor de inglês pode efetivamente comprar."
    - "Sette anni di desiderio (1983) é a trigésima quinta, e fica de fora
       por um motivo mais restrito do que as nove acima: não tem edição
       inglesa própria, mas não está por traduzir. Faith in Fakes / Travels
       in Hyperreality, a seleção inglesa que esta ordem já leva em Il
       costume di casa, tira o seu conteúdo de dois volumes italianos - Il
       costume di casa (1973) e Sette anni di desiderio (1983) - pelo que a
       parte dela a que um leitor de inglês chega já está nesta lista,
       dentro de outra entrada."
    - "Apocalittici e integrati está apenas parcialmente traduzida
       (Apocalypse Postponed, 1994, uma seleção abreviada) e não
       integralmente como o resto desta lista; é incluída mesmo assim
       porque a parte traduzida é exatamente o seu material de cultura de
       massas para um público geral, não as partes deixadas de fora."
    - "Interpretation and Overinterpretation é o livro mais exigente desta
       lista - um debate genuíno sobre os limites da interpretação textual,
       não uma leitura ligeira - e é incluído pelo local de origem, não pela
       dificuldade: as Tanner Lectures on Human Values são um ciclo público
       de conferências de humanidades, não um seminário especializado, e a
       Cambridge University Press publicou-o com três respondentes
       identificados (Richard Rorty, Jonathan Culler, Christine Brooke-Rose)
       a responder a Eco, um por um, no formato de um debate público e não
       de uma monografia."
