# Português europeu (pt-PT) - sinopses. Nenhuma sinopse desta ala contém uma
# referência inline a outra obra, pelo que a questão do título em tradução
# (ver franchise.yaml deste diretório) não se coloca aqui.
# `note:` não é traduzido: o campo não existe no tipo Work da aplicação
# (lib/content/types.ts) e não chega ao leitor - só `synopsis` é lido.
#
# CUIDADO COM SPOILERS: a sinopse de Hypnotisören segue de perto o texto da
# própria contracapa sueca da Bonniers (albertbonniersforlag.se/bocker/153581/
# hypnotisoren/), verificado diretamente nesta passagem: um homem é
# assassinado, a mulher e a filha são depois encontradas mortas em casa, o
# filho sobrevive mas fica entre a consciência e a inconsciência, e Joona
# Linna percebe que uma irmã continua viva e recorre ao hipnotista Erik
# Maria Bark para a encontrar. A tradução
# reproduz esses factos com a mesma precisão do texto de base já corrigido,
# sem repor nem omitir nenhum deles.

- id: lars-kepler/hypnotisoren
  synopsis: >
    Um homem é encontrado brutalmente assassinado num balneário nos
    arredores de Estocolmo; a mulher e a filha são depois encontradas
    mortas com a mesma fúria em casa da família, como se alguém quisesse
    eliminar a família inteira. O filho sobrevive, gravemente ferido e
    entre a consciência e a inconsciência - mas o detetive Joona Linna
    percebe que ainda há mais um elemento da família com vida, uma irmã, e
    corre para a encontrar antes que o assassino o consiga, recorrendo ao
    hipnotista Erik Maria Bark para chegar à única testemunha que pode
    saber onde ela está.

- id: lars-kepler/paganinikontraktet
  synopsis: >
    O corpo de uma mulher é encontrado à deriva num barco de recreio no
    arquipélago de Estocolmo, numa noite de verão, com os pulmões cheios de
    água salobra, apesar de nada nas roupas ou no resto do corpo sugerir que
    se afogou onde foi encontrada.

- id: lars-kepler/eldvittnet
  synopsis: >
    Flora Hansen apresenta-se como médium espiritista, o tipo de testemunha
    que as polícias de todo o mundo consultam discretamente em casos
    difíceis, apesar de não existir um único caso documentado em que o
    testemunho de um médium tenha resolvido algum - e uma investigação de
    homicídio num lar de raparigas põe essa contradição à prova.

- id: lars-kepler/sandmannen
  synopsis: >
    Um jovem é encontrado a vaguear por uma ponte ferroviária alta em
    Estocolmo, numa noite gélida de inverno, com doença dos legionários e
    hipotermia grave - e descobre-se que tinha sido legalmente declarado
    morto sete anos antes, uma das presumíveis vítimas do assassino em
    série Jurek Walter.

- id: lars-kepler/stalker
  synopsis: >
    Um vídeo enviado anonimamente à polícia nacional mostra alguém a filmar
    uma mulher através da própria janela; no dia seguinte, ela é encontrada
    morta, e chega um segundo vídeo sem que seja possível rastrear a origem
    de nenhum dos dois.

- id: lars-kepler/kaninjagaren
  synopsis: >
    Uma figura mascarada observa um homem através da própria janela e
    mata-o lentamente; seguem-se mais três vítimas. O único fio que as liga
    é que todas ouvem uma criança recitar uma lengalenga sobre coelhos
    antes de o assassino chegar, e Joona Linna e Saga Bauer ficam
    encarregados de desvendar um dos casos mais complexos das suas
    carreiras - com o chef de televisão Rex Müller e o filho, Sammy,
    apanhados no meio de tudo.

- id: lars-kepler/lazarus
  synopsis: >
    Um homem morto é encontrado num apartamento em Oslo, e o que a polícia
    encontra no seu congelador revela-o como um saqueador de campas e
    colecionador de troféus até então desconhecido. Dias depois, um
    superintendente da polícia alemã contacta Joona Linna a pedir ajuda,
    puxando-o de volta para um assunto por resolver.

- id: lars-kepler/spegelmannen
  synopsis: >
    Uma jovem desaparece a caminho de casa, vinda da escola, e é encontrada
    assassinada cinco anos depois num parque infantil de Estocolmo. As
    imagens de uma câmara de segurança levam Joona Linna até uma testemunha
    - um homem com doença mental cujo relato pode conter mais do que
    ninguém imagina.

- id: lars-kepler/spindeln
  synopsis: >
    Três anos depois de Saga Bauer receber um postal a ameaçá-la com uma
    arma carregada com nove balas brancas, uma delas destinada a Joona
    Linna, a contagem decrescente que essas balas representam começa a
    apanhá-los.

- id: lars-kepler/somngangaren
  synopsis: >
    Um alarme à meia-noite denuncia um assalto num parque de campismo
    fechado para o inverno, nos arredores de Estocolmo. O carro-patrulha
    mais próximo responde à chamada e encontra uma única caravana
    iluminada num recinto, de resto, escuro e deserto.

- id: lars-kepler/medusa
  synopsis: >
    Um médico morre queimado durante a noite dentro da Helix, uma unidade
    psiquiátrico-forense fechada; uma segunda morte na mesma ala leva Saga
    Bauer a aceitar uma missão secreta, infiltrada como doente entre
    alguns dos criminosos mais perigosos da Suécia, com Joona Linna como
    único contacto no exterior.

- id: lars-kepler/playground
  synopsis: >
    A tenente Jasmin Pascal-Anderson é baleada durante uma missão no Kosovo
    e fica clinicamente morta durante quarenta segundos. De volta ao mundo
    dos vivos, não consegue parar de descrever uma violenta cidade
    portuária que viu na morte - uma cidade de cuja existência real se
    convence, e onde o filho está agora em perigo.

- id: lars-kepler/sjomannen
  synopsis: >
    Seis contos de suspense, guardados numa gaveta durante anos, segundo os
    próprios autores, reunidos aqui pela primeira vez - entre eles um pai
    forçado a cometer um homicídio por encomenda para salvar o filho, e uma
    jovem jornalista que se apaixona por um suspeito de ser assassino em
    série.
