# Português europeu (pt-PT) - acontecimentos específicos da ala (title,
# description). Nenhum destes seis acontecimentos usa organisation: epigraph,
# pelo que nenhum tem campo `quote` a traduzir.
# Glosas entre parênteses a títulos de obras (ex.: "Hypnotisören (...)",
# "Kaninjägaren (...)") usam a edição portuguesa publicada quando existe -
# ver editions.yaml e a nota de franchise.yaml sobre este critério.
# "the Book of the Fair" e o título de trabalho "Parallax" ficam tal como no
# texto de base: são rótulos em inglês, não prosa a traduzir.

- id: lars-kepler/pseudonym-invented-2008
  title: Um terceiro autor é inventado para salvar a colaboração
  description: >
    Alexandra e Alexander terminam manuscritos separados na mesma semana e,
    perante o vazio que se segue, decidem escrever algo em conjunto pela
    primeira vez - primeiro um livro infantil, depois uma peça de teatro,
    ambos abandonados quando duas vozes literárias já definidas se recusam a
    fundir-se e cada pormenor se transforma numa discussão. Em vez de
    tentar uma terceira vez sob qualquer um dos seus próprios nomes,
    inventam uma pessoa que não é nenhum dos dois: Lars, uma homenagem ao
    autor de romance policial Stieg Larsson, cujo sucesso os atraiu para o
    género, Kepler, uma referência ao astrónomo Johannes Kepler. Dão à sua
    invenção uma vida de cobertura própria - um antigo professor do ensino
    secundário que passou a trabalhador noturno num albergue para
    sem-abrigo e escreve romances policiais de dia -, terminam em total
    segredo o manuscrito que se tornaria Hypnotisören, e submetem-no à sua
    própria editora de longa data a partir de um endereço dedicado,
    Lars.Kepler@hotmail.com, sem revelar quem são.

- id: lars-kepler/aftonbladet-unmasking-2009
  title: O Aftonbladet desmascara os autores por detrás de Lars Kepler
  description: >
    Hypnotisören é vendido a mais de vinte países por um adiantamento
    recorde antes mesmo de ser publicado na Suécia, e torna-se "the Book of
    the Fair" na Feira do Livro de Londres desse ano - o que transforma a
    identidade do pseudónimo "Lars Kepler" num jogo de adivinhas à escala
    nacional. A imprensa britânica aponta o nome de Henning Mankell, que o
    nega, tal como a editora; um criminólogo de televisão constrói, em
    direto, um perfil do autor desconhecido; o maior tabloide da Suécia
    abre uma linha telefónica de denúncias 24 horas por dia. A 11 de agosto
    de 2009, o Aftonbladet publica dez indícios que apontam para Alexander
    e Alexandra Ahndoril, e o casal confirma serem eles em comunicado à
    imprensa nesse mesmo dia - horas depois de dois jornalistas do próprio
    jornal encontrarem a sua casa de férias na costa oeste sueca, já de
    noite, e baterem à porta, lanterna e câmara em punho, enquanto as três
    filhas do casal dormiam lá dentro. Dezassete dias depois, o Svenska
    Dagbladet publica o seu próprio perfil conjunto "do casal Ahndoril",
    tratando a identidade como facto assente.

- id: lars-kepler/hypnotisoren-film-oscar-entry-2012
  title: Hypnotisören chega ao ecrã, e a candidatura da Suécia ao Óscar
  description: >
    Lasse Hallström realiza a primeira adaptação ao cinema de um romance de
    Lars Kepler, Hypnotisören (O Hipnotista), com Tobias Zilliacus no papel
    de Joona Linna e Mikael Persbrandt no papel do hipnotista Erik Maria
    Bark, estreado na Suécia a 28 de setembro de 2012. É escolhido como
    candidato oficial da Suécia ao Óscar de Melhor Filme em Língua
    Estrangeira, na 85.ª cerimónia dos Óscares da Academia, embora não
    chegue à lista final de nomeados - o romance de estreia do pseudónimo
    torna-se o primeiro título de Kepler traduzido para outro meio, além de
    mais de quarenta línguas.

- id: lars-kepler/kaninjagaren-dutch-no1-2017
  title: A tradução neerlandesa de Kaninjägaren torna-se o primeiro êxito de vendas de Kepler no estrangeiro
  description: >
    Jager, a tradução neerlandesa de Kaninjägaren (O Caçador), entra na
    lista semanal oficial de mais vendidos dos Países Baixos, a De
    Bestseller 60, a 15 de fevereiro de 2017, e sobe ao 1.º lugar, mantendo
    o topo durante duas semanas e permanecendo na lista vinte e duas
    semanas no total. Nenhum título anterior de Kepler tinha ultrapassado o
    2.º lugar nessa mesma lista neerlandesa - entre eles Hypnose, Contract,
    Getuige, Slaap e Stalker -, o que faz de Jager o primeiro livro de
    Kepler, em qualquer mercado, a liderar uma lista nacional de mais
    vendidos fora da Suécia.

- id: lars-kepler/lazarus-audiobook-prize-2019
  title: Lazarus, em áudio, vence o Grande Prémio Sueco do Audiolivro
  description: >
    Lazarus, narrado por Jonas Malmsjö, vence a categoria de Suspense do
    Stora Ljudbokspriset (o Grande Prémio do Audiolivro, organizado pelo
    serviço de streaming Storytel) em 2019 - o único prémio que o próprio
    registo da bibliografia de Kepler na Wikipédia consegue corroborar de
    forma independente junto da lista oficial de vencedores do prémio,
    numa década, de resto, pobre em reconhecimento datado e documentado
    para a série entre a estreia e a adaptação televisiva.

- id: lars-kepler/nocturne-apple-tv-2023
  title: A Apple TV+ garante os direitos dos romances de Joona Linna
  description: >
    A Apple TV+, a A+E Studios e a Range anunciam o desenvolvimento de uma
    série em língua inglesa baseada em Lazarus e Sandmannen (O homem da
    areia), inicialmente sem título e com Tom Hardy e Zazie Beetz
    confirmados. A produção recebe luz verde em maio de 2025, com Liev
    Schreiber e Stephen Graham a substituírem Hardy, completa o elenco ao
    longo do verão com Bill Camp, Rory Culkin, Chrissy Metz e Gary Carr, é
    filmada em Pittsburgh e arredores sob o título de trabalho "Parallax",
    e é rebatizada Nocturne para a sua estreia a 30 de outubro de 2026 -
    criada por Rowan Joffé e com John Hlavin como showrunner do princípio
    ao fim, a primeira adaptação ao ecrã em língua inglesa da série e, à
    escala da Apple TV+, a maior até agora.
