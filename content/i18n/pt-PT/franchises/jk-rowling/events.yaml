# Overlay pt-PT dos eventos da franquia: title + description. Nenhum destes
# quatro eventos leva quote.
- id: philosophers-stone-quiet-launch-1997
  title: Uma primeira tiragem de 5650 exemplares
  description: >
    A Bloomsbury publica
    [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter e
    a Pedra Filosofal]] com uma primeira tiragem de 5650 exemplares - apenas
    500 em capa dura, dos quais 300 foram diretamente para bibliotecas -,
    uma tiragem limitada que a Sotheby's classifica como "normal para um
    primeiro romance," com o editor Barry Cunningham a esperar que os
    livreiros o lessem e o recomendassem. A escala do fenómeno que o livro
    viria a ancorar não era visível no lançamento; um exemplar sobrevivente
    da primeira edição em capa dura vende-se hoje em leilão por dezenas de
    milhares de dólares.

- id: stouffer-lawsuit-thrown-out-2002
  title: Uma alegação rival de autoria desmorona-se sob provas forjadas
  description: >
    A autora infantil Nancy Stouffer tinha contra-alegado que Harry Potter
    infringia o seu próprio material dos anos 80, "Larry Potter" e
    "Muggles." Ao decidir sobre o pedido de sanções apresentado por Rowling,
    pela Scholastic e pela Warner Bros., o juiz Allen G. Schwartz, do
    Tribunal Distrital Sul de Nova Iorque, considera provado "por evidência
    clara e convincente" que Stouffer submeteu pelo menos sete peças de
    prova falsificadas, incluindo uma "prova de tipógrafo" cuja referência a
    "Larry Potter" estava composta numa fonte que não existia antes de 1993 -
    anos depois da data que Stouffer alegava para o documento. O tribunal
    rejeita as suas alegações, multa-a em 50 000 dólares e ordena-lhe que
    cubra as custas judiciais de Rowling.

- id: deathly-hallows-finale-2007
  title: A série termina com 8,3 milhões de exemplares num dia
  description: >
    [[work:jk-rowling/harry-potter-and-the-deathly-hallows|Harry Potter e os
    Talismãs da Morte]] entra à venda à 00h01 em hora local em todo o mundo,
    fechando a série de sete livros dez anos depois de ter começado. A
    Scholastic regista 8,3 milhões de exemplares vendidos nos Estados Unidos
    nas primeiras 24 horas - um recorde que o seu presidente compara à
    "primeira visita dos Beatles aos EUA" -, contra uma primeira tiragem de
    12 milhões; o Reino Unido vende mais 2,65 milhões de exemplares na mesma
    janela. Nenhum romance de Harry Potter se lhe segue.

- id: cursed-child-premiere-2016
  title: A oitava história estreia no West End
  description: >
    [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter e a
    Criança Amaldiçoada]] estreia no Palace Theatre, em Londres, promovida
    como "a oitava história," continuação direta de
    [[work:jk-rowling/harry-potter-and-the-deathly-hallows|Harry Potter e os
    Talismãs da Morte]]. Na estreia, Rowling confirma que não escreverá
    outro romance de Harry Potter - a primeira vez que o exclui pelas suas
    próprias palavras, e não apenas pela série ter simplesmente terminado. O
    texto publicado vende mais de dois milhões de exemplares impressos na
    América do Norte nos primeiros dois dias - bem abaixo dos 8,3 milhões de
    Os Talismãs da Morte num único dia, mas, segundo a Scholastic, ainda
    assim entre as obras mais rapidamente vendidas da história da edição.
