# Overlay pt-PT: title, description e themes (prosa lida pelo leitor na placa
# da era). `note:` não é traduzido - o campo não é lido pela aplicação em Era.
- id: the-harry-potter-years
  title: Os Anos de Harry Potter
  themes:
    - fantasia de internato
    - orfandade e herança
    - morte e o que lhe sobrevive
    - escrever sob fama súbita
  description: >
    Todos os livros da sua autoria publicados nestes anos são livros de Harry
    Potter, todos pela Bloomsbury no Reino Unido; os únicos outros créditos
    que assina no período são um prefácio ou um texto curto dentro do livro de
    outra pessoa. A Bloomsbury lança
    [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter e
    a Pedra Filosofal]] a 26 de junho de 1997; a saga de sete romances fecha
    com [[work:jk-rowling/harry-potter-and-the-deathly-hallows|Harry Potter e
    os Talismãs da Morte]] a 21 de julho de 2007, e o último título de Harry
    Potter de todos,
    [[work:jk-rowling/the-tales-of-beedle-the-bard|Os Contos de Beedle, o
    Bardo]], segue-se a 4 de dezembro de 2008. Ao anunciar o livro seguinte
    em 2012, Rowling descreveu estes como os anos "da série Harry Potter,
    publicada tão brilhantemente pela Bloomsbury." Depois de Beedle, o
    Bardo, não publicou nada durante mais de três anos.

- id: the-post-potter-years
  title: Os Anos Pós-Potter
  themes:
    - ficção para adultos
    - crime sob pseudónimo
    - o mundo mágico em palco e no ecrã
    - contos de fadas para leitores mais novos
  description: >
    A rutura é da própria Rowling. Ao anunciar em fevereiro de 2012 que seria
    a Little, Brown, e não a Bloomsbury, a publicar o seu próximo livro,
    chamou-lhe "uma equipa editorial que vai ser uma grande parceira nesta
    nova fase da minha vida enquanto escritora."
    [[work:jk-rowling/the-casual-vacancy|Uma Morte Súbita]] chega nesse
    setembro, o seu primeiro romance para adultos;
    [[work:jk-rowling/the-cuckoos-calling|Quando o Cuco Chama]] segue-se em
    2013 como suposta estreia de um autor policial desconhecido, Robert
    Galbraith, e os romances de Cormoran Strike correm sob esse nome desde
    então. Em paralelo, o mundo mágico regressa noutras formas além do
    romance, em palco em
    [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter e a
    Criança Amaldiçoada]] e no ecrã nos argumentos de
    [[work:jk-rowling/fantastic-beasts-and-where-to-find-them-original-screenplay|
    Monstros Fantásticos]], e dois livros autónomos para crianças,
    [[work:jk-rowling/the-ickabog|O Ickabog]] e
    [[work:jk-rowling/the-christmas-pig|O Porquinho de Natal]], chegam em
    2020 e 2021. A imprensa chama a este período inteiro pós-Potter.
