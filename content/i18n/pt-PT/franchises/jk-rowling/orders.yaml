# Overlay pt-PT das ordens de leitura: name, rationale e debated.
# orderedWorkIds e sources não se traduzem.
- id: jk-rowling/harry-potter
  name: Harry Potter, os romances e a continuação em palco
  rationale: >
    Os sete romances pela ordem em que Rowling os escreveu, mais
    [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter e a
    Criança Amaldiçoada]], a que o seu próprio site chama "a oitava história
    da série Harry Potter" e não uma obra à parte. Para quem quer percorrer
    a história de Harry Potter isolada: fica de fora dos três volumes
    complementares dentro do universo (O Quidditch Através dos Tempos,
    Monstros Fantásticos e Onde Encontrá-los, Os Contos de Beedle, o Bardo -
    textos de referência sobre o mundo, não capítulos narrativos, que se
    podem ler ao lado dos romances a qualquer momento assim que se conhece a
    história) e de tudo o resto na prateleira de Rowling que a ordem por
    omissão derivada intercalaria com ela por ano. A Criança Amaldiçoada
    está catalogada como "livro oito," mas é uma sequela direta passada
    dezanove anos depois de terminar o sétimo romance; leia os sete romances
    primeiro seja qual for o ritmo, já que pressupõe que já sabe como aquela
    história se resolve.
  debated:
    - "Os três volumes complementares dentro do universo (O Quidditch Através dos Tempos, Monstros Fantásticos e Onde Encontrá-los, Os Contos de Beedle, o Bardo) ficam deliberadamente fora desta ordem - o works.yaml trata-os como textos de referência sobre o Mundo Mágico e não como capítulos da história, e nenhum guia encontrado discorda. Um leitor completista encontra-os antes através da ordem com a prateleira inteira."

- id: jk-rowling/cormoran-strike
  name: Cormoran Strike, por ordem de publicação
  rationale: >
    Os oito romances de Robert Galbraith pela ordem em que foram publicados
    - o agrupamento que o próprio site de Robert Galbraith apresenta como
    uma única série contínua. Para quem quer Cormoran Strike isolado:
    ficção policial contemporânea e dura, sem qualquer conteúdo do Mundo
    Mágico, sem exigir conhecimento de Harry Potter. Não é uma afirmação
    teórica - [[work:jk-rowling/the-cuckoos-calling|Quando o Cuco Chama]]
    foi analisado e elogiado pelo nome em publicações de referência (o
    Times, o Mail, a Publishers Weekly, a Library Journal) como uma sólida
    estreia autónoma durante os quatro meses antes de se saber quem era
    realmente Robert Galbraith, e Rowling já disse que escreveu como
    Galbraith porque queria "trabalhar sem o exagero nem a expectativa e
    receber uma reação totalmente genuína." O custo deste caminho é
    prescindir de todo o Mundo Mágico e de tudo o resto na prateleira de
    Rowling que a ordem por omissão derivada intercala com estes oito livros
    por ano - Uma Vida Muito Boa, os dois romances autónomos para crianças,
    os textos curtos da Pottermore Presents, From the Wizarding Archive.
  debated:
    - "A autoria de Rowling tornou-se pública quatro meses depois de Quando o Cuco Chama ter sido publicado (julho de 2013) e é hoje amplamente conhecida, o que não muda nada quanto à ordem nem aos livros - a série continua sem qualquer ligação textual ao Mundo Mágico, e quem a lê como uma série policial autónoma está a lê-la exatamente da forma como foi escrita para ser lida."
