# Overlay pt-PT das sinopses. NUNCA inclui `title`: o título traduzido é dado
# pela edição (ver editions.yaml), não tradução de prosa. `note:` não é
# traduzido - o campo não é lido pela aplicação em Work.
# Títulos citados dentro das sinopses usam a edição portuguesa publicada
# (Editorial Presença) quando existe; The Hallmarked Man e as sete
# contribuições apócrifas não têm edição portuguesa e ficam em inglês, tal
# como os títulos dos livros-anfitrião das contribuições (são os títulos
# publicados reais desses livros, não prosa a traduzir).
# Nomes de personagens (Harry, Ron, Hermione, Albus Dumbledore, Robin,
# Cormoran Strike) ficam como no original - a tradução exata usada pela
# Editorial Presença para os nomes próprios das personagens não está
# confirmada com fontes suficientes.
# As sinopses que retêm deliberadamente um desfecho (Azkaban, Talismãs da
# Morte, Beedle o Bardo, Criança Amaldiçoada, os dois argumentos de
# Grindelwald) mantêm em português exatamente a mesma reserva do inglês;
# nenhuma tradução acrescenta especificidade que o texto de origem já não
# tivesse.

- id: jk-rowling/harry-potter-and-the-philosophers-stone
  synopsis: >
    Um rapaz de onze anos, criado na ignorância da sua própria história,
    descobre no dia do seu aniversário que é bruxo e que o espera um lugar
    em Hogwarts, a Escola de Magia e Bruxaria, junto com um passado que todo
    o mundo mágico já conhece e ele não.

- id: jk-rowling/harry-potter-and-the-chamber-of-secrets
  synopsis: >
    De volta a Hogwarts para o segundo ano, Harry encontra a escola tomada
    por uma série de ataques misteriosos e por uma lenda sussurrada sobre
    uma câmara escondida, enquanto um diário de origem desconhecida começa a
    responder-lhe por escrito.

- id: jk-rowling/harry-potter-and-the-prisoner-of-azkaban
  synopsis: >
    Um assassino em massa escapou da prisão bruxa de Azkaban e diz-se que
    anda atrás de Harry, e os dementadores que guardam essa prisão patrulham
    agora os terrenos de Hogwarts à sua procura.

- id: jk-rowling/harry-potter-and-the-goblet-of-fire
  synopsis: >
    Hogwarts acolhe o Torneio Tribruxo, uma competição internacional para
    alunos maiores de idade, e um quarto campeão não convidado vê-se a
    competir em provas cada vez mais perigosas do que devia ser uma
    competição escolar.

- id: jk-rowling/harry-potter-and-the-order-of-the-phoenix
  synopsis: >
    Harry regressa a uma Hogwarts onde boa parte do mundo mágico se voltou
    contra ele, alguém enviado pelo Ministério aperta o controlo sobre a
    escola, e as aulas de Defesa passam a ser dadas apenas pelo manual, pelo
    que um punhado de alunos começa a reunir-se em segredo para a praticar a
    sério.

- id: jk-rowling/harry-potter-and-the-half-blood-prince
  synopsis: >
    Com a guerra já declarada, Dumbledore começa a mostrar a Harry
    fragmentos do passado do inimigo em busca da única fraqueza capaz de a
    terminar, enquanto um manual de Poções em segunda mão, cheio de
    anotações de outro aluno, se revela mais útil - e mais estranho - do que
    devia.

- id: jk-rowling/harry-potter-and-the-deathly-hallows
  synopsis: >
    Com Hogwarts já sem segurança e o Ministério caído, Harry, Ron e
    Hermione deixam a escola para cumprir a tarefa que Dumbledore lhes
    confiou, perseguidos por uma Grã-Bretanha bruxa agora abertamente em
    guerra.

- id: jk-rowling/quidditch-through-the-ages
  synopsis: >
    Uma história do desporto bruxo do Quidditch, apresentada como o próprio
    exemplar da biblioteca de Hogwarts do manual que Harry e os colegas
    estudam.

- id: jk-rowling/fantastic-beasts-and-where-to-find-them
  synopsis: >
    Um guia das criaturas mágicas do Mundo Mágico, apresentado como o
    próprio manual do primeiro ano de Harry, completo com anotações nas
    margens da sua letra e da dos amigos.

- id: jk-rowling/the-tales-of-beedle-the-bard
  synopsis: >
    Cinco contos de fadas da tradição bruxa, apresentados em tradução a
    partir das runas originais, com comentário de Albus Dumbledore, um deles
    já familiar a quem leu o último romance de Harry Potter.

- id: jk-rowling/harry-potter-and-the-cursed-child
  synopsis: >
    Dezanove anos depois do fim da série principal, Albus, o filho mais
    novo de Harry, luta sob o peso do legado do pai e forma uma amizade
    improvável que arrasta os dois rapazes para uma tentativa perigosa de
    reescrever o passado.

- id: jk-rowling/fantastic-beasts-and-where-to-find-them-original-screenplay
  synopsis: >
    Setenta anos antes de a história de Harry começar, a mala de um
    magizoólogo com criaturas escapadas atira a comunidade bruxa de Nova
    Iorque para uma crise no pior momento político possível.

- id: jk-rowling/fantastic-beasts-the-crimes-of-grindelwald
  synopsis: >
    O bruxo das trevas Gellert Grindelwald reúne seguidores por toda a
    Europa com uma mensagem que encontra apoio real, enquanto antigas
    lealdades entre quem o persegue começam a fraturar-se.

- id: jk-rowling/fantastic-beasts-the-secrets-of-dumbledore
  synopsis: >
    O movimento político de Grindelwald ganha terreno por toda a Europa, e
    Dumbledore, incapaz de o deter sozinho, confia ao magizoólogo Newt
    Scamander a liderança de uma pequena equipa numa missão para o travar.

- id: jk-rowling/the-casual-vacancy
  synopsis: >
    A morte súbita de um vereador paroquial numa pequena cidade inglesa
    deixa vaga uma cadeira na câmara, e a disputa que se segue por ela rasga
    todas as falhas que a superfície respeitável da cidade vinha
    disfarçando.

- id: jk-rowling/the-cuckoos-calling
  synopsis: >
    Um detetive privado e veterano de guerra, recém-caído em desgraça, é
    contratado para reexaminar a morte de uma top model que a polícia já
    encerrou como suicídio.

- id: jk-rowling/the-silkworm
  synopsis: >
    Um romancista desaparecido é encontrado morto de uma forma encenada
    para corresponder ao crime do seu próprio manuscrito inédito, e Strike
    tem de atravessar um mundo editorial cheio de rancores para descobrir
    quem levou o final do livro à letra.

- id: jk-rowling/career-of-evil
  synopsis: >
    Uma perna decepada chega à porta de Robin, e Strike reduz uma lista de
    homens do seu próprio passado capazes de enviar aquela mensagem,
    enquanto a investigação se aproxima de forma incómoda da vida da
    própria Robin.

- id: jk-rowling/lethal-white
  synopsis: >
    O relato de um homem perturbado sobre o assassínio de uma criança que
    diz ter testemunhado anos antes arrasta Strike e Robin para um caso que
    vai do gabinete de um ministro do governo até às margens do
    extremismo político.

- id: jk-rowling/troubled-blood
  synopsis: >
    Uma médica desaparecida sem deixar rasto décadas antes torna-se no caso
    mais frio de sempre para Strike e Robin, um que os investigadores
    originais nunca resolveram e talvez nem quisessem resolver.

- id: jk-rowling/the-ink-black-heart
  synopsis: >
    A criadora de uma série animada viral é esfaqueada até à morte num
    cemitério de Londres depois de meses de assédio online, e Strike e
    Robin têm de decifrar a mitologia privada de um fandom para descobrir
    quem passou finalmente à ação.

- id: jk-rowling/the-running-grave
  synopsis: >
    A pedido de um cliente, Strike infiltra um agente numa seita religiosa
    rural, e é a própria Robin que acaba por entrar quando o caso se revela
    precisar de uma mulher lá dentro.

- id: jk-rowling/the-hallmarked-man
  synopsis: >
    Um corpo ligado a uma rede de tráfico humano arrasta Strike e Robin
    para uma investigação que atravessa o círculo social privado de uma
    família rica e bem relacionada.

- id: jk-rowling/the-ickabog
  synopsis: >
    Num pequeno reino famoso pelo seu queijo e pela sua doçaria, um monstro
    que se diz viver nos pântanos do norte revela-se real, e um punhado de
    crianças acaba por ser o único disposto a descobrir a verdade sobre ele.

- id: jk-rowling/the-christmas-pig
  synopsis: >
    Um rapaz que perde o seu bicho de peluche mais precioso na véspera de
    Natal é conduzido pelo seu substituto até à fantástica Terra do
    Perdido, onde acaba por parar tudo o que é esquecido e descartado.

- id: jk-rowling/very-good-lives
  synopsis: >
    Um pequeno livro ilustrado que desenvolve o seu discurso de formatura
    de 2008 em Harvard sobre o que aprendeu com um início de carreira
    definido, no seu próprio relato, pelo fracasso.

- id: jk-rowling/hogwarts-an-incomplete-and-unreliable-guide
  synopsis: >
    Uma coletânea de textos sobre a própria Hogwarts, a sua história,
    disciplinas e segredos, reunidos a partir de material originalmente
    escrito para o site Pottermore e desenvolvidos a partir dele.

- id: jk-rowling/short-stories-from-hogwarts-of-power-politics-and-pesky-poltergeists
  synopsis: >
    Textos curtos sobre o funcionamento do governo bruxo e os seus
    residentes mais problemáticos, incluindo material sobre Dolores
    Umbridge e o Ministro da Magia Cornelius Fudge.

- id: jk-rowling/short-stories-from-hogwarts-of-heroism-hardship-and-dangerous-hobbies
  synopsis: >
    Textos curtos sobre o desporto bruxo e a sua história, incluindo mais
    material sobre o Quidditch e os professores que já lecionaram em
    Hogwarts.

- id: jk-rowling/from-the-wizarding-archive
  synopsis: >
    Oitenta artigos e anedotas de contexto sobre o mundo mágico - histórias
    de fundo das personagens e pormenores da construção do mundo que os
    leitores originais dos romances nunca tiveram - enquadrados com
    comentário editorial inédito.

- id: jk-rowling/families-just-like-us
  synopsis: >
    Um guia de livros infantis recomendados para famílias monoparentais,
    publicado pelo National Council for One Parent Families em conjunto com
    a Book Trust.

- id: jk-rowling/magic-mcneil-brown
  synopsis: >
    Uma coletânea de contos de escritoras britânicas, editada por Gil
    McNeil e Sarah Brown e publicada pela Bloomsbury a favor do National
    Council for One Parent Families.

- id: jk-rowling/moving-britain-forward
  synopsis: >
    Uma coletânea de discursos de Gordon Brown enquanto Chanceler,
    publicada pela Bloomsbury.

- id: jk-rowling/harry-potter-prequel
  synopsis: >
    Um conto sem título de 800 palavras sobre dois jovens bruxos e o seu
    encontro noturno com a polícia trouxa, passado antes dos eventos da
    série Harry Potter.

- id: jk-rowling/harry-a-history
  synopsis: >
    A história do fandom de Harry Potter escrita por Melissa Anelli,
    publicada pela Pocket Books.

- id: jk-rowling/a-love-letter-to-europe
  synopsis: >
    Uma antologia com mais de 40 textos curtos de escritores, artistas e
    intérpretes britânicos sobre a sua relação com a Europa continental,
    publicada pela Coronet no dia originalmente previsto para o Brexit.

- id: jk-rowling/the-women-who-wouldnt-wheesht
  synopsis: >
    Uma coletânea de ensaios e fotografias de participantes numa campanha
    escocesa de cinco anos pelos direitos das mulheres baseados no sexo,
    editada por Susan Dalgety e Lucy Hunter Blackburn e publicada pela
    Constable.
