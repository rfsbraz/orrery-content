# Tradução pt-PT das ordens de leitura curadas: nome, justificação e os
# pontos em debate. Os `orderedWorkIds` são identificadores e não se traduzem.

- id: edgar-allan-poe/dupin-in-order
  name: Os contos de C. Auguste Dupin, por ordem
  rationale: >
    Os três contos de Dupin são a única série genuína desta ala - não apenas
    uma personagem recorrente, mas um fio que o próprio autor continuou na
    página. [[work:edgar-allan-poe/the-mystery-of-marie-roget|O Mistério de
    Marie Rogêt]] foi publicado com o subtítulo "A Sequel to 'The Murders in
    the Rue Morgue'" ("Uma Sequela de 'Os Crimes da Rua Morgue'"), e
    [[work:edgar-allan-poe/the-purloined-letter|A Carta Roubada]] fecha o
    mesmo enquadramento de narrador e detetive no terceiro caso. Lê-los por
    esta ordem - a ordem em que foram escritos e publicados - permite que o
    método de Dupin, a sua relação com o narrador sem nome e o seu atrito
    constante com a polícia parisiense se desenvolvam como foi pensado, e
    cada caso percorre um tipo de espaço diferente: ruas da cidade, margem
    de rio ao ar livre, um gabinete privado fechado. O custo é pequeno e
    vale a pena dizê-lo com honestidade: Poe reapresenta Dupin o suficiente
    em cada conto para que nenhum dos três seja incompreensível lido
    isoladamente ou fora de ordem, pelo que o que se perde ao saltar a
    ordem é a ressonância da sequela, não a compreensão.
  debated:
    - "Esta ordem coincide exatamente com a ordem cronológica de publicação derivada para estas três obras (1841, 1842, 1844 - sem empate no mesmo ano para desfazer). Ganha o seu lugar como um fio nomeado com uma relação de sequela declarada pelo próprio autor, retirado de uma estante de 145 obras - a mesma justificação que as ordens temáticas de Discworld usam para uma subsérie filtrada e ordenada por ano, não como uma reorganização ou um desempate."
