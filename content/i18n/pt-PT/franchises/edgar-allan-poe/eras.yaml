# Português europeu (pt-PT) - eras. Cada entrada leva `title`, `description`
# e `themes` (docs/SCHEMA.md; `themes` é a lista de frases curtas mostrada
# sob o título da era na placa - ver a nota em scripts/i18n_coverage.py).
# `note:` não é traduzido: nenhum overlay pt-PT deste catálogo o traduz, o
# campo é uma justificação de fronteira dirigida a quem cura a ala, não
# prosa que o leitor vê.

- id: poems-written-in-youth
  title: Poemas Escritos na Juventude
  themes:
    - aprendizado romântico
    - sonho e devaneio
    - o exército e West Point
    - livros que ninguém comprou
  description: >
    O próprio título que Poe deu a estes poemas, usado quando os reeditou no
    final de The Raven and Other Poems (1845) como "as composições rudes da
    minha primeira infância". Cinco anos, três volumes finos de versos, e
    nenhuma prosa: [[work:edgar-allan-poe/tamerlane|Tamerlane]] and Other
    Poems (Boston, 1827), publicado anonimamente "By a Bostonian" enquanto
    se alistava no exército sob nome falso; Al Aaraaf, Tamerlane, and Minor
    Poems (Baltimore, 1829), com [[work:edgar-allan-poe/al-aaraaf|Al
    Aaraaf]] e [[work:edgar-allan-poe/sonnet-to-science|Sonnet - To
    Science]]; e Poems (Nova Iorque, 1831), vendido por subscrição aos
    cadetes de West Point que o tinham acabado de ver ser expulso por
    conselho de guerra, e que traz o primeiro
    [[work:edgar-allan-poe/to-helen-1831|To Helen]],
    [[work:edgar-allan-poe/israfel|Israfel]] e
    [[work:edgar-allan-poe/the-city-in-the-sea|The City in the Sea]].
    Nenhum dos três vendeu. [[work:edgar-allan-poe/alone|Alone]] foi
    escrito nestes anos e ficou guardado num álbum privado até décadas
    depois da sua morte.

- id: baltimore-and-the-early-fiction
  title: Baltimore e a Ficção Inicial
  themes:
    - a viragem do verso para a prosa
    - concursos de prémios em revistas
    - o Folio Club
    - burlesco e o grotesco
  description: >
    O título que Quinn dá aos anos na casa de Maria Clemm, em Baltimore,
    onde Poe deixou de ser um poeta que publicava livros para se tornar um
    escritor que vendia prosa a revistas. Cinco contos saíram no
    Philadelphia Saturday Courier ao longo de 1832, a começar por
    [[work:edgar-allan-poe/metzengerstein|Metzengerstein]], todos não
    assinados; em 1833 já tinha onze redigidos como Tales of the Folio
    Club, uma coletânea que nenhum editor aceitou. Em outubro de 1833, o
    Baltimore Saturday Visiter deu a
    [[work:edgar-allan-poe/ms-found-in-a-bottle|MS. Found in a Bottle]] o
    seu prémio de cinquenta dólares e colocou
    [[work:edgar-allan-poe/the-coliseum|The Coliseum]] em segundo lugar no
    seu concurso de poesia, e através de John Pendleton Kennedy foi posto
    em contacto com Thomas W. White, que tinha acabado de começar a
    publicar o Southern Literary Messenger em Richmond.

- id: the-messenger-years
  title: Os Anos do Messenger
  themes:
    - a secretária do editor
    - crítica com machadinha
    - Richmond
    - o casamento com Virginia
  description: >
    O capítulo X de Quinn chama-se "The Editor of the 'Messenger'", e são
    estes os anos que cobre. [[work:edgar-allan-poe/berenice|Berenice]]
    saiu no Southern Literary Messenger em março de 1835 e gerou queixas
    dos leitores; seguiram-se
    [[work:edgar-allan-poe/morella|Morella]] e
    [[work:edgar-allan-poe/the-unparalleled-adventure-of-one-hans-pfaall|Hans
    Pfaall]], e nesse outono Poe já trabalhava em Richmond para o editor da
    revista, Thomas W. White. Ele e a sua prima de treze anos, Virginia
    Clemm, casaram publicamente ali a 16 de maio de 1836. As críticas
    literárias que escreveu para o Messenger rivalizavam em severidade com
    os trimestrais britânicos e firmaram o seu nome como crítico antes de a
    sua ficção o fazer. O contrato terminou em janeiro de 1837.

- id: the-philadelphia-years
  title: Os Anos da Filadélfia
  themes:
    - a economia das revistas
    - interiores góticos
    - raciocínio
    - a revista que nunca fundou
  description: >
    Os seis anos que o National Park Service, guardião da casa de Poe que
    sobrevive na Filadélfia, chama os mais felizes e produtivos da sua
    vida. Foi coeditor da Burton's Gentleman's Magazine a partir de maio de
    1839 e editor da Graham's Magazine a partir de 1841, e escreveu para
    elas a obra que a maioria dos leitores associa a Poe:
    [[work:edgar-allan-poe/the-fall-of-the-house-of-usher|The Fall of the
    House of Usher]], [[work:edgar-allan-poe/william-wilson|William
    Wilson]], [[work:edgar-allan-poe/the-masque-of-the-red-death|The
    Masque of the Red Death]],
    [[work:edgar-allan-poe/the-pit-and-the-pendulum|The Pit and the
    Pendulum]], [[work:edgar-allan-poe/the-tell-tale-heart|The Tell-Tale
    Heart]], [[work:edgar-allan-poe/the-black-cat|The Black Cat]], e, na
    Graham's de abril de 1841,
    [[work:edgar-allan-poe/the-murders-in-the-rue-morgue|The Murders in
    the Rue Morgue]], o primeiro conto policial. Lea and Blanchard reuniu
    vinte e cinco dos contos como Tales of the Grotesque and Arabesque no
    final de 1839, e [[work:edgar-allan-poe/the-gold-bug|The Gold-Bug]]
    ganhou o prémio de cem dólares do Dollar Newspaper em 1843, o seu
    primeiro sucesso nacional. Ao longo de tudo isto tentava, sem
    conseguir, angariar capital para uma revista própria, primeiro a Penn e
    depois a Stylus, para a qual ainda recebia subscrições quando morreu.

- id: the-new-york-years
  title: Os Anos de Nova Iorque
  themes:
    - fama instantânea
    - a farsa como jornalismo
    - dirigir a própria revista
    - guerra literária
  description: >
    Poe e Virginia mudaram-se para Nova Iorque a 6 de abril de 1844, e uma
    semana depois o Extra Sun publicava
    [[work:edgar-allan-poe/the-balloon-hoax|The Balloon-Hoax]] como
    notícia. A 29 de janeiro de 1845, o Evening Mirror publicou
    [[work:edgar-allan-poe/the-raven|The Raven]] com o seu nome; foi
    copiado e parodiado por toda a parte em poucas semanas, e tornou-o
    famoso sem o tornar solvente. Mabbott chama a 1845 o seu annus
    mirabilis: o ano em que a Wiley and Putnam publicou tanto Tales como
    The Raven and Other Poems, e o ano em que passou de colaborador a único
    proprietário do Broadway Journal, a única revista que alguma vez
    controlou. [[work:edgar-allan-poe/the-purloined-letter|The Purloined
    Letter]] e
    [[work:edgar-allan-poe/the-facts-in-the-case-of-m-valdemar|The Facts
    in the Case of M. Valdemar]] pertencem a estes dois anos.

- id: the-fordham-years
  title: Os Anos de Fordham
  themes:
    - viuvez
    - cosmologia
    - os últimos poemas líricos
    - o circuito de conferências
  description: >
    Poe arrendou uma casa de campo na aldeia de Fordham, então um subúrbio
    agrícola no condado de Westchester e não parte da cidade, por cem
    dólares por ano, e foi o seu último lar permanente; a Bronx County
    Historical Society, que guarda a casa, data a sua estadia ali de 1846 a
    1849. Virginia morreu ali de tuberculose a 30 de janeiro de 1847.
    Segue-se a obra tardia:
    [[work:edgar-allan-poe/the-cask-of-amontillado|The Cask of
    Amontillado]], [[work:edgar-allan-poe/ulalume|Ulalume]], a conferência
    cosmológica que proferiu em fevereiro de 1848 e expandiu em
    [[work:edgar-allan-poe/eureka|Eureka]], e os últimos poemas líricos,
    [[work:edgar-allan-poe/the-bells|The Bells]],
    [[work:edgar-allan-poe/annabel-lee|Annabel Lee]],
    [[work:edgar-allan-poe/eldorado|Eldorado]] e
    [[work:edgar-allan-poe/for-annie|For Annie]]. Viajava e dava
    conferências quando foi encontrado delirante em Baltimore, a 3 de
    outubro de 1849; morreu quatro dias depois.
