# Português europeu (pt-PT) - sinopses.
# Os títulos de obras NÃO são traduzidos aqui (ver docs/SCHEMA.md, "Never
# translate a published title"): um título traduzido só existe como edição,
# em editions.yaml. `note:` também não é traduzido: o campo não é lido pela
# aplicação em Work (só `synopsis` chega ao leitor), confirmado pela mesma
# convenção já registada em jo-nesbo/works.yaml.
# CUIDADO COM SPOILERS: trinta e quatro destas sinopses evitam
# deliberadamente revelar o desfecho de cada conto. A tradução segue
# exatamente esse limite, sem repor nenhum detalhe que o texto original
# retém de propósito.

- id: edgar-allan-poe/the-narrative-of-arthur-gordon-pym-of-nantucket
  synopsis: >
    O único romance completo de Poe: um jovem clandestino sobrevive a um
    naufrágio, a um motim e a canibalismo a bordo do baleeiro Grampus, antes
    de um resgate o levar, a ele e a um companheiro sobrevivente, cada vez
    mais para sul, rumo a uma ilha estranha e hostil e a um final que se
    interrompe a meio de uma frase à beira do desconhecido.

- id: edgar-allan-poe/metzengerstein
  synopsis: >
    O primeiro conto publicado de Poe: um jovem nobre húngaro, único herdeiro
    de uma casa presa a uma rixa secular com os vizinhos, fica obcecado por
    um estranho cavalo cor de fogo que sai do incêndio nas cavalariças do seu
    rival.

- id: edgar-allan-poe/the-duc-de-lomelette
  synopsis: >
    Um dândi mimado, morto de repugnância à vista de uma ave mal preparada no
    seu prato de jantar, acorda nos aposentos do Diabo e encontra o anfitrião
    disposto a jogar-lhe às cartas a sua alma.

- id: edgar-allan-poe/a-tale-of-jerusalem
  synopsis: >
    Um breve burlesco em que fariseus cercados em Jerusalém baixam um cesto
    de prata por cima da muralha para comprar aos cercantes romanos um
    cordeiro destinado ao sacrifício do templo.

- id: edgar-allan-poe/loss-of-breath
  synopsis: >
    Um conto cómico e grotesco sobre um marido que perde literalmente o poder
    físico da respiração na manhã do seu casamento, e os enterros por engano
    que se seguem.

- id: edgar-allan-poe/bon-bon
  synopsis: >
    Um restaurador filosofante e metafísico amador tenta vencer o próprio
    Diabo pela argumentação, ao longo de uma garrafa de vinho.

- id: edgar-allan-poe/ms-found-in-a-bottle
  synopsis: >
    Um narrador náufrago é arrastado para bordo de um navio espectral,
    tripulado por marinheiros antiquíssimos e cegos, empurrado
    inexoravelmente para um vórtice no Polo Sul.

- id: edgar-allan-poe/the-assignation
  synopsis: >
    Em Veneza, de noite, um jovem nobre misterioso salva do canal o filho de
    uma marquesa; o narrador visita-o na manhã seguinte, entre as suas
    coleções extravagantes, e encontra-o estranhamente eufórico.

- id: edgar-allan-poe/berenice
  synopsis: >
    Um estudioso cuja doença é uma monomania da atenção, a incapacidade de
    desviar o olhar de coisas triviais, vê a prima e noiva definhar sob uma
    doença própria.

- id: edgar-allan-poe/morella
  synopsis: >
    Um marido passa a temer a erudita mulher e os estudos sobre identidade
    pessoal que ela lhe impõe, e teme ainda mais a filha que nasce no
    momento em que ela morre. Um dos primeiros tratamentos de Poe sobre a
    identidade que sobrevive ao corpo.

- id: edgar-allan-poe/lionizing
  synopsis: >
    Uma sátira à celebridade literária, que acompanha um jovem endeusado
    pela sociedade unicamente pelo tamanho notável do seu nariz.

- id: edgar-allan-poe/the-unparalleled-adventure-of-one-hans-pfaall
  synopsis: >
    O relato elaborado e pseudocientífico de um consertador de foles de
    Roterdão sobre uma viagem de balão até à Lua.

- id: edgar-allan-poe/king-pest
  synopsis: >
    Dois marinheiros embriagados entram, sem querer, numa taberna londrina
    fechada pela peste, presidida por um grotesco parlamento da Morte e da
    doença.

- id: edgar-allan-poe/shadow-a-parable
  synopsis: >
    Enlutados que velam um amigo morto pela peste ouvem, vinda da sala às
    escuras, a própria voz da Sombra.

- id: edgar-allan-poe/four-beasts-in-one
  synopsis: >
    Um burlesco sobre o tirano Antíoco Epifânio, que desfila por Antioquia
    disfarçado de uma fantástica besta composta.

- id: edgar-allan-poe/mystification
  synopsis: >
    Um estudante universitário com génio para embustes responde ao desafio
    de um duelista fanfarrão remetendo-o para um obscuro tratado sobre o
    código da honra.

- id: edgar-allan-poe/silence-a-fable
  synopsis: >
    Um demónio conta como amaldiçoou um homem, numa paisagem desolada, com a
    única coisa mais terrível do que qualquer som: o silêncio.

- id: edgar-allan-poe/ligeia
  synopsis: >
    Um viúvo recorda a primeira mulher, Ligeia, a sua imensa erudição e a
    sua recusa em submeter-se à morte, e o segundo casamento que fez numa
    abadia meio arruinada depois de ela partir. O próprio Poe considerava-o
    o seu melhor conto; ficou de fora da coletânea Tales de 1845 contra a
    sua vontade.

- id: edgar-allan-poe/how-to-write-a-blackwood-article
  synopsis: >
    Um guia satírico que ridiculariza os contos sensacionalistas, em
    primeira pessoa, então em voga na Blackwood's Magazine.

- id: edgar-allan-poe/a-predicament
  synopsis: >
    A peça complementar de "How to Write a Blackwood Article", em que a
    narradora leva o conselho à letra, sobe ao campanário de uma catedral
    para ver a cidade e enfia a cabeça pela abertura no mostrador do
    relógio.

- id: edgar-allan-poe/the-devil-in-the-belfry
  synopsis: >
    Um forasteiro perturba a rotina obcecada e mecânica de uma vila
    holandesa convencida de si mesma, fazendo o sino da igreja bater treze
    horas.

- id: edgar-allan-poe/the-man-that-was-used-up
  synopsis: >
    Um narrador não consegue livrar-se da sensação de que há algo de errado
    no deslumbrante General John A. B. C. Smith, herói das campanhas
    indígenas, e todas as tentativas de descobrir o quê são interrompidas
    antes que alguém termine a frase.

- id: edgar-allan-poe/the-fall-of-the-house-of-usher
  synopsis: >
    Um visitante responde ao chamamento de Roderick Usher, amigo de
    infância, e encontra-o fechado numa mansão em ruínas com a irmã gémea,
    doente, os últimos dois da sua linhagem, numa casa que parece possuir
    uma consciência própria. O estudo mais lido de Poe sobre uma mente e
    uma casa a adoecerem juntas.

- id: edgar-allan-poe/william-wilson
  synopsis: >
    Um homem é perseguido ao longo da vida por um duplo que partilha o seu
    nome, o seu rosto e a sua voz, e que o trava sempre que se encaminha
    para o vício.

- id: edgar-allan-poe/the-conversation-of-eiros-and-charmion
  synopsis: >
    Duas almas na vida após a morte recordam os últimos dias de uma Terra
    destruída por um cometa.

- id: edgar-allan-poe/why-the-little-frenchman-wears-his-hand-in-a-sling
  synopsis: >
    Um conto cómico em dialeto irlandês sobre um duelo que corre mal por
    causa da honra de uma mulher.

- id: edgar-allan-poe/the-business-man
  synopsis: >
    Uma sátira ao "método" comercial, narrada por um autoproclamado homem de
    negócios cuja carreira inteira é uma sucessão de burlas absurdas.

- id: edgar-allan-poe/the-man-of-the-crowd
  synopsis: >
    Um narrador convalescente, a ler os rostos que passam à janela de uma
    casa de café londrina, encontra um velho que não consegue decifrar, e
    segue-o por uma noite e um dia inteiros para descobrir quem é.

- id: edgar-allan-poe/the-murders-in-the-rue-morgue
  synopsis: >
    O analista amador C. Auguste Dupin resolve um brutal duplo homicídio,
    aparentemente impossível, atrás de uma porta trancada em Paris -
    amplamente considerado o primeiro conto policial moderno, e a obra a
    que o próprio Poe chamou um "conto de raciocínio".

- id: edgar-allan-poe/a-descent-into-the-maelstrom
  synopsis: >
    Um velho pescador norueguês relata como sobreviveu a uma noite preso na
    sucção de um redemoinho colossal, ao raciocinar sobre a sua física.

- id: edgar-allan-poe/the-island-of-the-fay
  synopsis: >
    Um esboço meditativo sobre uma fada solitária que vela por uma ilha
    enquanto ambas se apagam rumo à morte.

- id: edgar-allan-poe/the-colloquy-of-monos-and-una
  synopsis: >
    Uma peça complementar a "The Conversation of Eiros and Charmion", em que
    duas almas para além da morte discutem o declínio da humanidade e a
    natureza do morrer.

- id: edgar-allan-poe/never-bet-the-devil-your-head
  synopsis: >
    Uma sátira à ficção moralizante, subtitulada "A Tale with a Moral", em
    que um jovem com o hábito descuidado de apostar a cabeça ao Diabo acaba
    por encontrar alguém disposto a aceitar a aposta.

- id: edgar-allan-poe/eleonora
  synopsis: >
    Dois primos, criados sozinhos num vale fechado de erva multicolor,
    apaixonam-se; quando ela adoece, ele jura nunca se ligar a outra mulher
    na terra depois dela, e ela promete velar por ele.

- id: edgar-allan-poe/three-sundays-in-a-week
  synopsis: >
    O tio-avô pão-duro de um jovem promete consentir o seu casamento assim
    que três domingos coincidirem numa mesma semana, e dois capitães de
    navio calham a estar presentes ao jantar.

- id: edgar-allan-poe/the-oval-portrait
  synopsis: >
    Um viajante ferido, refugiado num castelo abandonado, é capturado por um
    retrato de uma jovem de um realismo inquietante, e recorre ao volume
    sobre a almofada que explica como o quadro foi pintado.

- id: edgar-allan-poe/the-masque-of-the-red-death
  synopsis: >
    Um príncipe e os seus cortesãos emparedam-se numa abadia para escapar a
    uma peste, apenas para verem uma figura mascarada entrar sem convite na
    sua festa.

- id: edgar-allan-poe/the-landscape-garden
  synopsis: >
    Um esboço sobre a jardinagem paisagística como a mais alta das artes,
    mais tarde expandido em "The Domain of Arnheim".

- id: edgar-allan-poe/the-mystery-of-marie-roget
  synopsis: >
    Dupin resolve, a partir apenas de relatos de jornal, o homicídio de uma
    balconista parisiense encontrada no Sena - um tratamento ficcionado e
    pouco disfarçado do verdadeiro e não resolvido homicídio nova-iorquino
    de Mary Rogers.

- id: edgar-allan-poe/the-pit-and-the-pendulum
  synopsis: >
    Condenado pela Inquisição espanhola, um prisioneiro acorda numa cela sem
    luz e mapeia-a pelo tato, descobrindo uma a uma as formas como foi
    concebida para o matar.

- id: edgar-allan-poe/the-tell-tale-heart
  synopsis: >
    Um narrador propõe-se provar como é são, relatando, com toda a calma e
    por ordem, as sete noites que passou a observar um velho a dormir, e o
    que a película pálida sobre o olho do velho lhe fazia aos nervos.

- id: edgar-allan-poe/the-gold-bug
  synopsis: >
    Um excêntrico recluso e os seus companheiros decifram um código pirata
    para desenterrar o tesouro do Capitão Kidd numa ilha da Carolina do Sul.
    O conto mais lido de Poe em vida, vencedor de um prémio de 100 dólares,
    o valor mais alto que alguma vez recebeu por uma única obra.

- id: edgar-allan-poe/the-black-cat
  synopsis: >
    Escrevendo na véspera da sua execução, um homem traça como a bebida o
    virou contra os animais domésticos que amara a vida inteira, começando
    pelo gato preto que era o seu favorito.

- id: edgar-allan-poe/diddling
  synopsis: >
    Um ensaio-conto irónico que cataloga a burla como uma ciência exata e
    refinada, ilustrado com exemplos cómicos.

- id: edgar-allan-poe/the-spectacles
  synopsis: >
    Um jovem vaidoso, míope demais para ver bem e orgulhoso demais para usar
    óculos, apaixona-se violentamente na ópera por uma mulher que só alguma
    vez viu à distância.

- id: edgar-allan-poe/a-tale-of-the-ragged-mountains
  synopsis: >
    Um jovem neurálgico, sob a influência mesmérica do seu médico, sai para
    as Ragged Mountains da Virgínia e encontra-se, em pleno detalhe
    desperto, num lugar completamente diferente.

- id: edgar-allan-poe/the-premature-burial
  synopsis: >
    Um narrador obcecado com casos de enterro em vida cataloga horrores
    reais e imaginados do sepultamento prematuro, antes de enfrentar o seu
    próprio terror mórbido perante a ideia.

- id: edgar-allan-poe/mesmeric-revelation
  synopsis: >
    Um homem moribundo, em transe mesmérico, profere um relato filosófico
    sobre a matéria, o espírito e a vida após a morte.

- id: edgar-allan-poe/the-oblong-box
  synopsis: >
    Um passageiro de um navio não consegue deixar de especular sobre a
    longa caixa de pinho que o seu amigo pintor trouxe a bordo e guarda no
    próprio camarote.

- id: edgar-allan-poe/the-angel-of-the-odd
  synopsis: >
    Um cético em relação às coincidências é atormentado e, por fim,
    arruinado por uma personificação grotesca da própria Improbabilidade.

- id: edgar-allan-poe/thou-art-the-man
  synopsis: >
    Uma pequena cidade tem a certeza de saber quem assassinou o estimado
    Sr. Shuttleworthy, e o narrador, que não tem certeza nenhuma, decide
    resolver a questão à sua maneira. Um "whodunit" precoce que satiriza
    também a ficção criminal sentimental da época.

- id: edgar-allan-poe/the-literary-life-of-thingum-bob-esq
  synopsis: >
    Uma sátira ao ofício das revistas literárias, que acompanha um
    escrevinhador que plagia o caminho até à fama editorial.

- id: edgar-allan-poe/the-purloined-letter
  synopsis: >
    A polícia parisiense sabe quem levou uma carta politicamente
    comprometedora, sabe onde vive, vasculhou-lhe os aposentos palmo a
    palmo durante meses, e não encontrou nada. O Prefeito leva o problema a
    Dupin.

- id: edgar-allan-poe/the-thousand-and-second-tale-of-scheherazade
  synopsis: >
    Uma sequela cómica das Mil e Uma Noites, em que Xerazade arrisca mais
    uma noite com mais uma viagem de Sindbad, desta vez repleta das
    verdadeiras maravilhas da ciência do século XIX.

- id: edgar-allan-poe/some-words-with-a-mummy
  synopsis: >
    Uma múmia egípcia antiga, reanimada numa experiência durante um jantar,
    fura a fé dos convidados no progresso moderno.

- id: edgar-allan-poe/the-power-of-words
  synopsis: >
    Dois espíritos angélicos discutem como cada palavra alguma vez
    pronunciada põe a matéria em movimento para sempre, uma peça
    cosmológica complementar aos diálogos de Poe sobre a vida após a morte.

- id: edgar-allan-poe/the-imp-of-the-perverse
  synopsis: >
    Um argumento em defesa de uma faculdade que todos os moralistas
    ignoraram, o impulso de fazer algo sem outra razão além de saber que
    não se deve.

- id: edgar-allan-poe/the-system-of-doctor-tarr-and-professor-fether
  synopsis: >
    Um viajante é levado a visitar um manicómio privado no sul de França,
    célebre pelo "sistema apaziguador" que acabou com as contenções, e fica
    para jantar com o pessoal.

- id: edgar-allan-poe/the-facts-in-the-case-of-m-valdemar
  synopsis: >
    Um mesmerista põe um amigo tuberculoso em transe no momento exato da
    morte, e relata, com um detalhe clínico e distante, os sete meses que
    se seguem.

- id: edgar-allan-poe/the-sphinx
  synopsis: >
    Hospedado numa casa às margens do Hudson durante uma epidemia de
    cólera, um convidado nervoso vê um monstro vasto e hediondo a descer
    uma encosta distante, e o seu anfitrião recusa-se a alarmar-se.

- id: edgar-allan-poe/the-cask-of-amontillado
  synopsis: >
    Montresor, a alimentar um insulto que nunca nomeia, conduz o fanfarrão
    conhecedor Fortunato pelas catacumbas da família numa noite de
    carnaval, com a promessa de um barril de raro amontillado.

- id: edgar-allan-poe/the-domain-of-arnheim
  synopsis: >
    Um homem fabulosamente rico passa décadas a criar a paisagem perfeita
    como obra de arte - uma expansão do esboço anterior "The Landscape
    Garden".

- id: edgar-allan-poe/mellonta-tauta
  synopsis: >
    Uma carta escrita a bordo de um balão de ar quente no ano de 2848
    satiriza, a partir de um ponto de vista futuro, a democracia, a ciência
    e a fé no progresso do século XIX.

- id: edgar-allan-poe/hop-frog
  synopsis: >
    Um bobo aleijado e a bailarina que é a sua única amiga são humilhados
    uma vez a mais por um rei com apetite para partidas cruéis, e o bobo
    oferece-se para conceber os trajes do baile de máscaras que se
    aproxima.

- id: edgar-allan-poe/von-kempelen-and-his-discovery
  synopsis: >
    Um relato falso que afirma que um químico obscuro resolveu o antigo
    sonho de transmutar chumbo em ouro.

- id: edgar-allan-poe/x-ing-a-paragrab
  synopsis: >
    Uma rixa entre jornais degenera em caos tipográfico quando um impressor
    rival, sem a letra "o", compõe um artigo inteiro usando "x" no seu
    lugar.

- id: edgar-allan-poe/landors-cottage
  synopsis: >
    Um esboço complementar a "The Domain of Arnheim", que descreve a
    descoberta, por um andarilho, de uma casa rural de jardim
    requintadamente desenhado.

- id: edgar-allan-poe/the-balloon-hoax
  synopsis: >
    Um relato jornalístico fabricado, publicado e largamente acreditado
    como notícia real, sobre a primeira travessia transatlântica tripulada
    de balão - uma das mais bem-sucedidas farsas de Poe.

- id: edgar-allan-poe/tamerlane
  synopsis: >
    Um conquistador moribundo da Ásia Central confessa a um frade que
    trocou o amor pelo império e se arrepende do negócio. O poema-título do
    primeiro livro de Poe, publicado anonimamente quando tinha dezoito anos
    e praticamente ignorado na altura.

- id: edgar-allan-poe/song-1827
  synopsis: >
    Um breve poema lírico sobre ver um antigo amor casado com outro homem.

- id: edgar-allan-poe/imitation
  synopsis: >
    Uma breve meditação sobre se a própria vida não será apenas um sonho
    dentro de um sonho, um tema a que Poe regressa longamente em 1849.

- id: edgar-allan-poe/a-dream-1827
  synopsis: >
    Um breve poema lírico sobre um sonho reconfortante de uma felicidade
    perdida que o despertar não consegue restituir.

- id: edgar-allan-poe/the-lake
  synopsis: >
    Um jovem solitário encontra numa lagoa isolada uma alegria sombria e
    terrível, descobrindo que o próprio medo pode conter uma espécie de
    prazer.

- id: edgar-allan-poe/spirits-of-the-dead
  synopsis: >
    Uma meditação dirigida a uma alma solitária, avisando que os espíritos
    dos mortos a rodearão na quietude da noite.

- id: edgar-allan-poe/evening-star
  synopsis: >
    Um jovem sujeito poético prefere a luz fria e distante de uma única
    estrela ao esplendor avassalador da lua.

- id: edgar-allan-poe/dreams
  synopsis: >
    Um breve poema lírico que prefere uma vida onírica apaixonada às
    verdades mais vazias da realidade desperta.

- id: edgar-allan-poe/stanzas
  synopsis: >
    Uma meditação, precedida por uma epígrafe de Byron, sobre harmonias
    ocultas que as mentes comuns não conseguem perceber.

- id: edgar-allan-poe/the-happiest-day
  synopsis: >
    Um sujeito poético olha para trás, para a ambição e o orgulho juvenis,
    como uma febre já esgotada, preferindo a paz à dor que a glória trouxe.

- id: edgar-allan-poe/to-margaret
  synopsis: >
    Um breve poema de amor da juventude, não publicado em vida de Poe.

- id: edgar-allan-poe/alone
  synopsis: >
    Um sujeito poético descreve uma diferença que o acompanha a vida
    inteira em relação a todos à sua volta, atribuindo o seu temperamento
    sombrio e apaixonado a uma infância moldada pela tempestade e pelo
    demónio, e não pela alegria comum. Não publicado em vida de Poe,
    descoberto num álbum de autógrafos décadas depois da sua morte, e hoje
    um dos seus poemas mais lidos.

- id: edgar-allan-poe/to-the-river
  synopsis: >
    Um poema lírico dirigido a um rio, que compara a sua água clara e o
    leito escuro e oculto à beleza de uma mulher e ao seu coração
    escondido.

- id: edgar-allan-poe/to-1829-bowers-whereat
  synopsis: >
    Um breve poema de amor que começa "The bowers whereat, in dreams, I
    see..."

- id: edgar-allan-poe/to-1829-should-my-early-life
  synopsis: >
    Um breve poema de amor que começa "Should my early life seem..."

- id: edgar-allan-poe/romance
  synopsis: >
    Um poema introdutório sobre o Romance como uma ave pintada que ensinou
    ao jovem poeta o seu alfabeto do sentimento.

- id: edgar-allan-poe/fairy-land
  synopsis: >
    Uma descrição onírica de uma terra de luas enormes e pendentes e
    sombras sem forma.

- id: edgar-allan-poe/sonnet-to-science
  synopsis: >
    Um soneto que acusa a Ciência de afugentar o mito e a poesia ao despir
    o mundo dos seus mistérios.

- id: edgar-allan-poe/al-aaraaf
  synopsis: >
    Um poema longo e ambicioso que imagina Al Aaraaf, uma estrela errante
    entre o Céu e o Inferno onde a beleza e a arte são perfeitas mas onde o
    amor, por ser uma imperfeição terrena, é proibido. O poema-título do
    segundo livro de Poe, e a sua obra mais ambiciosa da juventude.

- id: edgar-allan-poe/an-acrostic
  synopsis: >
    Um breve poema de amor em forma de acróstico, não publicado em vida de
    Poe.

- id: edgar-allan-poe/elizabeth
  synopsis: >
    Um breve poema em acróstico que soletra o nome Elizabeth Rebecca
    Herring, não publicado em vida de Poe.

- id: edgar-allan-poe/to-helen-1831
  synopsis: >
    Um poema breve e célebre que compara a beleza de uma mulher ao mundo
    clássico ("a glória que foi a Grécia, e a grandeza que foi Roma"),
    inspirado por Jane Stanard, mãe de um amigo de infância.

- id: edgar-allan-poe/a-paean
  synopsis: >
    Uma elegia da juventude por uma amada morta, mais tarde
    substancialmente revista e transformada em "Lenore" (1843).

- id: edgar-allan-poe/the-sleeper
  synopsis: >
    Um sujeito poético vela por uma mulher adormecida à meia-noite, sem
    certeza se a sua imobilidade é sono ou morte.

- id: edgar-allan-poe/the-city-in-the-sea
  synopsis: >
    A Morte está entronizada numa estranha cidade do ocidente, com os seus
    santuários e palácios imóveis sob um mar parado, iluminado por uma luz
    infernal.

- id: edgar-allan-poe/the-valley-of-unrest
  synopsis: >
    Um vale outrora pacífico, agora abandonado pelo seu povo, fica
    inquieto sob céus e flores que parecem chorar.

- id: edgar-allan-poe/israfel
  synopsis: >
    Uma meditação sobre o anjo corânico Israfel, cujo canto é tão perfeito
    que um poeta terreno nunca conseguiria igualá-lo.

- id: edgar-allan-poe/enigma-1833
  synopsis: >
    Um breve poema-enigma enviado a um jornal.

- id: edgar-allan-poe/fanny
  synopsis: >
    Um leve verso de circunstância sobre a reputação namoradeira de uma
    jovem.

- id: edgar-allan-poe/the-coliseum
  synopsis: >
    Uma meditação proferida entre as ruínas do Coliseu de Roma sobre a
    memória, a decadência e o poder eterno dessa grandeza decadente;
    recitada dentro da própria peça inacabada de Poe, "Politian".

- id: edgar-allan-poe/serenade
  synopsis: >
    Uma breve canção-poema noturna.

- id: edgar-allan-poe/to-one-in-paradise
  synopsis: >
    Um sujeito poético chora um amor perdido que foi outrora todo o seu
    mundo, agora desaparecido "numa noite, ou num dia, numa visão, ou em
    nenhuma".

- id: edgar-allan-poe/hymn
  synopsis: >
    Um breve poema devocional que invoca a Virgem Maria através da
    tempestade e da dor.

- id: edgar-allan-poe/to-mary
  synopsis: >
    Um breve poema de amor dirigido a uma mulher chamada Mary, instando-a a
    confiar numa devoção que há de sobreviver a qualquer outra pretensão ao
    seu coração.

- id: edgar-allan-poe/to-elizabeth
  synopsis: >
    Um breve verso de homenagem a Elizabeth Rebecca Herring.

- id: edgar-allan-poe/may-queen-ode
  synopsis: >
    Uma breve ode de circunstância, não publicada em vida de Poe.

- id: edgar-allan-poe/spiritual-song
  synopsis: >
    Um breve verso devocional, não publicado em vida de Poe.

- id: edgar-allan-poe/latin-hymn
  synopsis: >
    Um breve fragmento de hino escrito em latim.

- id: edgar-allan-poe/song-of-triumph
  synopsis: >
    Uma breve ode de vitória cantada dentro do conto "Epimanes" (mais tarde
    "Four Beasts in One"), celebrando a entrada de falso triunfo do tirano
    Antíoco em Antioquia.

- id: edgar-allan-poe/bridal-ballad
  synopsis: >
    Uma noiva recém-casada tenta convencer-se de que é feliz no casamento,
    enquanto a memória de um antigo amor morto não a larga.

- id: edgar-allan-poe/to-zante
  synopsis: >
    Um soneto dirigido à ilha grega de Zacinto, cujo belo nome agora só
    lembra ao sujeito poético um amor perdido.

- id: edgar-allan-poe/the-haunted-palace
  synopsis: >
    Uma alegoria de um palácio outrora glorioso, tomado por "coisas más, em
    mantos de dor", figurando o colapso de uma mente na loucura. Mais tarde
    incorporado no texto de "The Fall of the House of Usher", aí recitado
    pelo próprio Roderick Usher.

- id: edgar-allan-poe/silence-a-sonnet
  synopsis: >
    Um soneto que distingue o silêncio dos lugares desolados e vazios de um
    silêncio mais terrível, que não pertence a corpo vivo nenhum.

- id: edgar-allan-poe/lines-on-joe-locke
  synopsis: >
    Um panfleto satírico que ridiculariza um oficial disciplinar de West
    Point, inspirado nos próprios anos de cadete de Poe.

- id: edgar-allan-poe/the-conqueror-worm
  synopsis: >
    Anjos assistem a um drama mimado da vida humana terminar não em
    triunfo mas na entrada de um Verme conquistador, vermelho-sangue, com a
    Loucura e o Pecado como únicas estrelas verdadeiras. Mais tarde
    incorporado em "Ligeia" como palavras que a própria Ligeia moribunda
    teria escrito.

- id: edgar-allan-poe/lenore
  synopsis: >
    Enlutados discutem sobre como chorar uma jovem morta, uns num ritual
    vazio e um noutra, numa dor furiosa e sincera.

- id: edgar-allan-poe/dream-land
  synopsis: >
    Um viajante atravessa uma "derradeira e sombria Thule", uma paisagem de
    lagos sem fundo e florestas titânicas, para lá do tempo e do espaço
    comuns.

- id: edgar-allan-poe/impromptu-to-kate-carol
  synopsis: >
    Um breve verso de circunstância dirigido à poeta Frances Sargent
    Osgood, que escrevia sob o pseudónimo "Kate Carol".

- id: edgar-allan-poe/to-f
  synopsis: >
    Um breve poema de amor.

- id: edgar-allan-poe/eulalie
  synopsis: >
    Um sujeito poético descreve como o casamento com a radiante Eulalie o
    resgatou de uma vida inteira de solidão e dor.

- id: edgar-allan-poe/the-raven
  synopsis: >
    O escritório noturno de um homem enlutado recebe a visita de um corvo
    falante que responde a todas as perguntas sobre a sua perdida Lenore
    com uma única palavra: "Nevermore". Tornou Poe um nome conhecido da
    noite para o dia; não foi, pelo seu próprio relato, um sucesso
    financeiro.

- id: edgar-allan-poe/the-divine-right-of-kings
  synopsis: >
    Um breve verso satírico sobre a monarquia.

- id: edgar-allan-poe/stanzas-to-f-s-o
  synopsis: >
    Um breve verso de circunstância dirigido a Frances Sargent Osgood,
    distinto dos outros poemas que Poe lhe dedicou em 1845.

- id: edgar-allan-poe/a-valentine
  synopsis: >
    Um poema-enigma dirigido a Frances Sargent Osgood, cujo nome está
    oculto, letra a letra, dentro dos próprios versos.

- id: edgar-allan-poe/to-m-l-s
  synopsis: >
    Um breve verso de gratidão dirigido a Marie Louise Shew, que cuidou da
    mulher de Poe, Virginia, durante a sua doença final.

- id: edgar-allan-poe/ulalume
  synopsis: >
    No solitário outubro de um ano imemorial, um sujeito poético enlutado
    caminha por uma paisagem cinzenta e assombrada, com a própria alma
    personificada ao seu lado como Psique, que lhe implora que volte para
    trás.

- id: edgar-allan-poe/to-marie-louise
  synopsis: >
    Um verso de gratidão e afeto dirigido a Marie Louise Shew.

- id: edgar-allan-poe/an-enigma
  synopsis: >
    Um soneto-enigma ao estilo dos versos-charada das revistas da época,
    com a solução soletrada por letras ocultas.

- id: edgar-allan-poe/to-helen-1848
  synopsis: >
    Um sujeito poético recorda um único vislumbre fulminante de uma mulher
    entre rosas ao luar, uma imagem que moldou desde então todas as suas
    ideias de beleza. Dirigido a Sarah Helen Whitman, com quem Poe esteve
    brevemente noivo; o mais tardio dos seus dois poemas intitulados "To
    Helen".

- id: edgar-allan-poe/a-dream-within-a-dream
  synopsis: >
    Um sujeito poético, a ver os grãos de areia escorregar-lhe entre os
    dedos, questiona se algo na vida é real, ou se tudo não é senão um
    sonho dentro de um sonho.

- id: edgar-allan-poe/eldorado
  synopsis: >
    Um cavaleiro galante cavalga ao sol e à sombra, cantando, numa busca de
    toda a vida pela terra dourada de Eldorado, até as forças lhe falharem
    e perguntar a uma sombra que passa onde a pode encontrar.

- id: edgar-allan-poe/for-annie
  synopsis: >
    Um sujeito poético descreve como sobreviveu a uma doença febril da
    alma até uma calma estranha e pacífica, velado pela devoção de uma
    mulher chamada Annie.

- id: edgar-allan-poe/to-my-mother
  synopsis: >
    Um soneto de gratidão e amor dirigido à sogra e tia de Poe, Maria
    Clemm, que criou a sua mulher Virginia e cuidou dele depois da morte
    desta.

- id: edgar-allan-poe/annabel-lee
  synopsis: >
    Um sujeito poético chora uma jovem noiva que anjos invejosos lhe
    tiraram num reino junto ao mar, insistindo que o seu amor sobrevive até
    à própria sepultura. Vendido pouco antes da morte de Poe e publicado
    apenas depois dela.

- id: edgar-allan-poe/the-bells
  synopsis: >
    Quatro tipos de sinos, do tilintar prateado de um trenó ao dobre de
    ferro de um funeral, traçam uma vida da alegria da infância até à
    morte, inteiramente através do som.

- id: edgar-allan-poe/poetry-1824
  synopsis: >
    Um fragmento da juventude, o poema mais antigo atribuído a Poe, não
    publicado em vida.

- id: edgar-allan-poe/the-philosophy-of-composition
  synopsis: >
    Um ensaio que afirma reconstruir, passo a passo e de forma calculada,
    exatamente como Poe compôs "The Raven" - a sua peça de teoria literária
    mais influente, ainda hoje debatida como método sincero ou elaborada
    performance.

- id: edgar-allan-poe/the-rationale-of-verse
  synopsis: >
    Um longo ensaio técnico que expõe a teoria de Poe sobre a métrica
    poética e a versificação.

- id: edgar-allan-poe/eureka
  synopsis: >
    A obra mais longa e a última grande obra de Poe, um ensaio de quase
    40 000 palavras que propõe uma teoria intuitiva sobre a origem e o
    destino do universo, dedicado a Alexander von Humboldt. Recebido mal,
    mesmo por amigos, em vida de Poe; parte da sua cosmologia especulativa
    tem sido desde então assinalada por antecipar ideias científicas
    posteriores. Poe chamou-lhe, apenas meio a brincar, mais importante do
    que a descoberta da gravidade.

- id: edgar-allan-poe/the-poetic-principle
  synopsis: >
    O manifesto estético de Poe, que defende que um poema deve perseguir
    apenas a Beleza, e não a verdade ou a instrução moral, e que um "poema
    longo" é uma contradição nos termos.

- id: edgar-allan-poe/maelzels-chess-player
  synopsis: >
    Um ensaio que dissecta o célebre autómato jogador de xadrez em
    digressão pela América sob Johann Maelzel, defendendo, por observação
    atenta, que nenhuma máquina verdadeira poderia ser responsável e que
    teria de haver um operador oculto no seu interior - uma primeira
    demonstração pública do método analítico que Poe viria mais tarde a
    dramatizar nos contos de Dupin.

- id: edgar-allan-poe/the-philosophy-of-furniture
  synopsis: >
    Um ensaio satírico sobre o gosto americano em decoração de interiores,
    que contrasta a sala de estar berrante e sobrecarregada da época com o
    ideal do próprio Poe de um design doméstico contido e harmonioso.

- id: edgar-allan-poe/a-few-words-on-secret-writing
  synopsis: >
    Um ensaio sobre criptografia que afirma que o engenho humano não
    consegue construir uma cifra que o engenho humano não consiga resolver,
    lançado como desafio público a convidar os leitores a submeter cifras
    para Poe decifrar - o mesmo fascínio que ressurge em "The Gold-Bug".

- id: edgar-allan-poe/the-journal-of-julius-rodman
  synopsis: >
    Um romance de aventuras inacabado, publicado em folhetim, apresentado
    como o diário recuperado de uma expedição fictícia de 1792 que
    atravessa as Montanhas Rochosas décadas antes de Lewis e Clark. Poe
    abandonou-o ao fim de seis capítulos, quando deixou a Burton's
    Gentleman's Magazine.

- id: edgar-allan-poe/the-conchologists-first-book
  synopsis: >
    Um manual introdutório ilustrado sobre conchas, publicado em nome de
    Poe a pedido de um editor de Filadélfia; o texto de base e as
    ilustrações vinham do mais caro Manual of Conchology de Thomas Wyatt,
    mas Poe escreveu o prefácio e a introdução, traduziu o texto de
    classificação francês de Georges Cuvier, e reorganizou o material numa
    edição mais barata, destinada a estudantes.

- id: edgar-allan-poe/politian
  synopsis: >
    A única tentativa conhecida de Poe como dramaturgo: uma tragédia em
    verso branco que transplanta um verdadeiro caso de homicídio de 1825 no
    Kentucky para a Roma do século XVI. Apenas duas cenas chegaram a ser
    publicadas, em números sucessivos de 1835-1836 da Southern Literary
    Messenger, antes de Poe a abandonar e regressar à ficção breve.
