# Português europeu (pt-PT) - eventos da ala (publicação e receção, não
# vida pessoal). `title` e `description` são prosa; nenhum destes três leva
# `quote` (nenhum usa a organização epigraph). Datas, scope, reach, impact,
# spoilerAfter e sources nunca se traduzem.

- id: rue-morgue-invents-detective-fiction-1841
  title: "\"The Murders in the Rue Morgue\" inventa o conto policial"
  description: >
    [[work:edgar-allan-poe/the-murders-in-the-rue-morgue|The Murders in the
    Rue Morgue]] sai na Graham's Magazine em abril de 1841, o mesmo ano em
    que a tiragem sob a direção de Poe se aproxima dos 37 000 exemplares.
    Poe chamou-lhe um "conto de raciocínio"; é hoje amplamente reconhecido
    como o primeiro conto policial moderno, introduzindo em C. Auguste
    Dupin o analista amador, a polícia oficial desnorteada, e o
    narrador-companheiro que conta o caso a posteriori, um padrão que o
    género repete ao longo do século seguinte, e mais. Arthur Conan Doyle,
    cujas histórias de Sherlock Holmes ecoam abertamente esse arranjo,
    escreveu sobre os contos policiais de Poe: "Cada um é uma raiz da qual
    nasceu toda uma literatura... Onde estaria o conto policial até Poe lhe
    ter soprado o alento da vida?"

- id: the-raven-overnight-fame-1845
  title: "\"The Raven\" torna-o famoso da noite para o dia, e paga-lhe uns
    nove dólares"
  description: >
    [[work:edgar-allan-poe/the-raven|The Raven]] sai no New York Evening
    Mirror a 29 de janeiro de 1845, e é uma sensação imediata, reproduzido
    por todo o país em poucas semanas. Torna Poe, até então um escritor de
    revistas respeitado mas não famoso, um nome conhecido pela primeira vez
    na vida; é pago apenas uns nove a quinze dólares por ele (os relatos
    divergem quanto ao valor exato) e nunca vê nada parecido com a
    recompensa financeira que a fama do poema sugeriria. A sua própria
    explicação de como o escreveu,
    [[work:edgar-allan-poe/the-philosophy-of-composition|The Philosophy of
    Composition]] (1846), é, por admissão do próprio mais tarde, em grande
    parte uma performance e não um relato verídico: o registo mais provável
    é o de que escreveu o poema no final de 1844, na quinta dos Brennan, no
    norte de Manhattan, sem nada do método calculado e passo a passo que o
    ensaio descreve.

- id: griswold-character-assassination-1850
  title: O obituário e a memória póstumos de Griswold moldam a sua reputação
    durante um século
  description: >
    Rufus Griswold, antologista e crítico cuja obra Poe já tinha criticado
    duramente, substitui Poe como editor da Graham's Magazine em maio de
    1842; apesar da rivalidade, Poe nomeia mais tarde Griswold seu
    testamenteiro literário. Dois dias depois da morte de Poe, Griswold
    publica um obituário anónimo e hostil no New York Tribune sob o
    pseudónimo "Ludwig", amplamente reproduzido; a sua edição de 1850 das
    Works de Poe acrescenta então um "Memoir of the Author" que reconstrói
    Poe como um homem depravado, instável e sem verdadeiro carácter,
    ilustrado com cartas hoje sabidas alteradas ou inteiramente inventadas
    pelo próprio Griswold. O retrato mantém-se durante décadas, moldando a
    forma como Poe é lido e ensinado durante um século antes de a erudição
    posterior o desmontar; Edgar Poe and His Critics (1860), de Sarah Helen
    Whitman, está entre as primeiras refutações sustentadas.
