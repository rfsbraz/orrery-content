# Tradução pt-PT (português europeu) da prosa curada da ala Edgar Allan Poe.
# `startHere.paths` é uma lista aninhada com id: funde-se item a item pela
# chave `id` (docs/SCHEMA.md, "Nested lists merge by id"), pelo que aqui só
# vai prosa - nunca `workIds`, `orderId` ou `fit`.

- id: edgar-allan-poe
  startHere:
    paths:
      - id: essentials
        title: O punhado famoso
        description: >
          Quatro contos e um poema: os que decidem a imagem que a maioria
          das pessoas tem de Poe antes de lhe ler uma única palavra. Uma
          casa e uma família a ruir ao mesmo tempo, um narrador a insistir
          longamente na própria sanidade, um rancor e uma adega, o primeiro
          detetive da ficção, e o poema que tornou Poe famoso da noite para
          o dia.
        note: >
          Os cinco funcionam isoladamente e podem ler-se por qualquer ordem.
          São cinco em cento e quarenta e cinco obras - ficam de fora a
          poesia para além de O Corvo, o resto dos contos góticos e toda a
          obra não-ficcional.

      - id: meet-dupin
        title: Conhecer Dupin
        description: >
          O analista amador parisiense que deu início ao conto policial
          como género, em três casos: um crime em quarto fechado que mais
          ninguém consegue decifrar, um caso real por resolver trabalhado
          apenas a partir de recortes de jornal, e uma carta roubada que a
          polícia não encontra numa casa que já desmontou de alto a baixo.
          Tanto Sherlock Holmes como Hercule Poirot descendem dele.
        note: >
          Apenas três contos - um arco curto e completo, não um compromisso
          com o resto da estante.

      - id: the-whole-shelf
        title: A estante inteira
        description: >
          As cento e quarenta e cinco obras pela ordem em que Poe as
          escreveu: os versos de adolescente que ninguém notou, os anos em
          Baltimore a escrever por dinheiro de prémios, a década a editar
          revistas que deu Usher, a Rua Morgue e O Corvo, e os últimos anos
          de luto que lhe deram Annabel Lee. Isto não é uma série para ler
          do princípio ao fim - é toda a obra de um escritor a trabalhar,
          conto a conto e poema a poema.
        note: >
          O primeiro trecho são três panfletos de poesia de 1827-1831, mal
          vendidos e pouco lidos - Poe genuíno, mas o material mais fraco da
          ala. Quem quiser a obra famosa primeiro deve começar por "O
          punhado famoso".
