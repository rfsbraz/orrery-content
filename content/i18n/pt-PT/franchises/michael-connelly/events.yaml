# Overlay pt-PT dos eventos da franquia: `title` + `description` (os títulos
# dos eventos são prosa, não títulos publicados).
# Datas, scope, reach, impact, spoilerAfter e sources nunca se traduzem.
# Duas obras citadas aqui têm edição portuguesa publicada e usam esse título
# como texto das ligações a essa obra: The Brass Verdict -> "O Veredicto" e
# The Fifth Witness -> "A Quinta Testemunha" (ver editions.yaml). As
# restantes obras citadas (The Poet, The Black Echo, The Late Show, The
# Black Box) não têm edição portuguesa registada, por isso os seus títulos
# ficam em inglês.
- id: michael-connelly/the-poet-breaks-the-bosch-mold-1996
  title: "The Poet arrisca a marca: um thriller sem Bosch"
  description: >
    Quatro romances de Bosch dentro de uma carreira ainda recente, Connelly
    publica um thriller sem qualquer detetive da LAPD.
    [[work:michael-connelly/the-poet|The Poet]] segue o repórter de crime Jack
    McEvoy a investigar a morte do próprio irmão gémeo, apresenta a agente
    recorrente do FBI Rachel Walling, e vence tanto o Anthony Award de 1997 da
    Mystery Writers of America como o Dilys Award de 1997 da Independent
    Mystery Booksellers Association, igualando o reconhecimento que a estreia
    de Bosch já tinha dado a Connelly quatro anos antes. A Little, Brown
    reedita-o em brochura em abril de 2004, com uma introdução de Stephen
    King. A aposta prova que os leitores de Connelly o seguem para lá de um
    único detetive, abrindo a porta a todos os outros fios desta obra que não
    são de Bosch.

- id: michael-connelly/blood-work-film-2002
  title: Clint Eastwood leva Terry McCaleb ao ecrã, e o filme falha nas bilheteiras
  description: >
    A Warner Bros. lança Blood Work, adaptado por Brian Helgeland (L.A.
    Confidential) a partir do romance de Connelly de 1997. Clint Eastwood
    produz, realiza e protagoniza como
    [[character:michael-connelly/terry-mccaleb|Terry McCaleb]], o perfilador
    reformado do FBI em recuperação de um transplante de coração. É a
    primeira personagem de Connelly a chegar ao grande ecrã, uma década
    depois de [[work:michael-connelly/the-black-echo|The Black Echo]]
    apresentar Bosch, e o filme fica aquém das expectativas: 31,8 milhões de
    dólares contra um orçamento de 50 milhões. Passam nove anos até que outro
    dos seus livros regresse ao ecrã.

- id: michael-connelly/lincoln-lawyer-film-2011
  title: Matthew McConaughey acerta em cheio em Mickey Haller, no veredicto do próprio autor
  description: >
    A Lionsgate lança The Lincoln Lawyer, adaptado por John Romano a partir do
    romance de 2005 que apresentou o advogado de defesa
    [[character:michael-connelly/mickey-haller|Mickey Haller]]. Dois dias
    depois de ver uma montagem ainda incompleta, em novembro de 2010,
    Connelly escreveu sobre a interpretação de Matthew McConaughey: "Achei
    muito fiel à história e à personagem de Mickey Haller. O Matthew
    McConaughey acerta em cheio nele." Onde Blood Work tinha ficado aquém,
    este filme é um sucesso (87,1 milhões de dólares contra um orçamento de 40
    milhões), devolvendo a Hollywood a confiança em adaptar o catálogo de
    Connelly e, anos mais tarde, dando a Connelly uma imagem mental fixa de
    Haller para a qual diz continuar a escrever.

- id: michael-connelly/double-prize-year-2012
  title: Dois prémios, dois livros diferentes, um só ano
  description: >
    No mesmo ano, duas instituições distintas distinguem dois romances
    diferentes de Connelly. [[work:michael-connelly/the-black-box|The Black
    Box]] vence o RBA Prize for Crime Writing, um prémio espanhol anunciado
    como o mais lucrativo do género a nível mundial, com 125 000 euros. Em
    separado, a Faculdade de Direito da Universidade do Alabama e a ABA
    Journal atribuem o Harper Lee Prize for Legal Fiction de 2012, para o
    livro que "melhor exemplifica o papel dos advogados na sociedade," a
    [[work:michael-connelly/the-fifth-witness|A Quinta Testemunha]] (2011), em
    que [[character:michael-connelly/mickey-haller|Mickey Haller]] defende
    uma cliente acusada de matar o banqueiro que lhe executava a casa.
    Connelly é escolhido entre três finalistas por uma comissão que inclui a
    antiga Secretária de Estado Condoleezza Rice e Nina Totenberg, da NPR, e
    recebe o prémio no National Press Club de Washington nesse setembro. Um
    ano sem nenhuma nova adaptação no ecrã e sem nenhuma nova personagem
    principal é, por estas duas medidas institucionais, um dos mais
    reconhecidos da sua carreira.

- id: michael-connelly/bosch-amazon-series-2013-2015
  title: Bosch chega ao ecrã, e Connelly entra na sala dos argumentistas
  description: >
    Anos depois de conhecer o argumentista e produtor de televisão Eric
    Overmyer (Homicide, The Wire, Treme) para lhe propor adaptar os romances
    de Bosch, Connelly e o sócio produtor Henrik Bastin conseguem que Overmyer
    se comprometa com uma plataforma ainda por provar: "O programa ia estar
    nesta nova forma de ver televisão chamada streaming. A Amazon estava a
    dar os primeiros passos nisso, e o Bosch seria o seu primeiro drama." As
    filmagens do piloto começam a 4 de novembro de 2013; a Amazon
    transmite-o aos subscritores em fevereiro de 2014 para que votem numa
    encomenda completa, dá luz verde à série nesse março, e lança os dez
    episódios da primeira temporada a 13 de fevereiro de 2015. Connelly leva
    pessoalmente o nome de Titus Welliver à produção depois de o ver num papel
    secundário de televisão, torna-se co-criador e um dos seis argumentistas
    da sala de escrita, e descreve a sua própria função ali como "o guardião
    da integridade de Harry Bosch" e não como a voz principal - a primeira
    experiência sustentada de um romancista solitário como parte de uma
    equipa de escrita. A série decorre ao longo de sete temporadas até 2021,
    torna-se a série de maior duração da Amazon Prime Video até à data, e dá
    origem a mais dois spin-offs.

- id: michael-connelly/streaming-universe-expands-2022
  title: O universo de Bosch divide-se em dois, com uma semana de intervalo
  description: >
    Com uma semana de diferença uma da outra, duas continuações do universo
    televisivo de Connelly estreiam em dois serviços diferentes. Bosch:
    Legacy, que o protagonista Titus Welliver chama de "essencialmente a
    oitava temporada de Bosch," estreia na Amazon Freevee a 6 de maio de 2022,
    menos de um ano depois de terminar a série original; Connelly e Overmyer
    são co-criadores e produtores executivos. A 13 de maio, estreia na
    Netflix The Lincoln Lawyer, criada por David E. Kelley e adaptada de
    [[work:michael-connelly/the-brass-verdict|O Veredicto]] (2008), com
    Manuel Garcia-Rulfo a assumir o papel de
    [[character:michael-connelly/mickey-haller|Mickey Haller]] depois da
    interpretação de McConaughey no filme de 2011. Duas personagens
    diferentes, duas plataformas diferentes, o mesmo mês: a vida no ecrã do
    catálogo de Connelly sobrevive a qualquer série construída a partir dele.

- id: michael-connelly/ballard-tv-series-2025
  title: Renée Ballard protagoniza a sua própria série, oito anos depois da estreia
  description: >
    A detetive [[character:michael-connelly/renee-ballard|Renée Ballard]],
    apresentada como protagonista solo em 2017 em
    [[work:michael-connelly/the-late-show|The Late Show]] antes de cinco
    romances como coprotagonista de Bosch, ganha a sua própria série na Prime
    Video. Anunciada em 2023 e desenvolvida por Michael Alaimo e Kendall
    Sherwood, com Connelly como co-criador e produtor executivo, Ballard
    baseia-se em The Late Show, The Dark Hours (2021) e Desert Star (2022),
    tem Maggie Q no papel principal, e lança os dez episódios a 9 de julho de
    2025, com Titus Welliver a interpretar Bosch. É renovada para uma segunda
    temporada nesse outubro, a terceira personagem desta obra (depois de
    Bosch e Haller) a protagonizar a sua própria adaptação para o ecrã.
