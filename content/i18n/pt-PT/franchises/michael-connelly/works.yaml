# Overlay pt-PT das obras: apenas `synopsis` (prosa, sem spoilers). id, title,
# published, subseries, canonTier e sources nunca se traduzem.
# Três obras têm edição portuguesa publicada: The Brass Verdict ("O
# Veredicto"), The Fifth Witness ("A Quinta Testemunha") e The Waiting ("A
# Espera") - ver editions.yaml. Nenhuma das 47 sinopses cita estas três
# através de uma ligação a outra obra, por isso o título português delas não
# aparece aqui; as restantes 44 obras não têm edição portuguesa registada, e
# a única ligação entre sinopses (the-narrows -> The Poet) mantém o título
# inglês.
# O laço de meio-irmãos entre Bosch e Haller (revelado em The Brass Verdict)
# e o diagnóstico de saúde de Bosch da era de Desert Star ficam fora de todas
# as sinopses abaixo, tal como no texto de base; nenhuma sinopse aqui os
# reintroduz. A sinopse de The Narrows mantém o marido da viúva por nomear,
# tal como a base: a sua identidade é um spoiler protegido em characters.yaml.
# "Resurrection walk" (the-proving-ground) e "the hollow" (the-hollow) ficam
# entre aspas em inglês por ecoarem literalmente os títulos, sem edição
# portuguesa, dos romances de onde vêm (Resurrection Walk, The Hollow).

# --- Harry Bosch ---
- id: michael-connelly/the-black-echo
  synopsis: >
    O detetive de homicídios da LAPD Harry Bosch, antigo "rato de túnel" da
    Guerra do Vietname, herda o caso de um colega de armas encontrado morto
    num cano de escoamento sobre Hollywood - um caso que o arrasta de volta a
    uma velha ligação do exército e a um assalto a banco escavado a partir da
    própria guerra que julgava ter deixado para trás.

- id: michael-connelly/the-black-ice
  synopsis: >
    O aparente suicídio de um colega detetive dos narcóticos leva Bosch a uma
    droga de mercado negro chamada "black ice" e a um caso que corre de
    Hollywood até à fronteira mexicana.

- id: michael-connelly/the-concrete-blonde
  synopsis: >
    Processado por homicídio culposo pela viúva de um homem que matou a tiro
    anos antes, por suspeita de ser um assassino em série, Bosch tem de
    defender esse veredicto antigo em tribunal cível precisamente quando
    surge um novo corpo que sugere ter apanhado o homem errado.

- id: michael-connelly/the-last-coyote
  synopsis: >
    Suspenso da LAPD depois de um confronto com o seu comandante, Bosch
    aproveita o tempo livre forçado para reabrir o homicídio, nunca
    resolvido, da própria mãe, ocorrido décadas antes.

- id: michael-connelly/the-poet
  synopsis: >
    O repórter de crime de Denver Jack McEvoy, a investigar o aparente
    suicídio do irmão gémeo, detetive da polícia, descobre um padrão que o
    liga a outros suicídios de polícias por todo o país - obra de um
    assassino em série que cita Edgar Allan Poe em cada cena.

- id: michael-connelly/trunk-music
  synopsis: >
    De volta ao trabalho depois da suspensão, Bosch fica com um homicídio ao
    estilo da máfia - um corpo na mala de um carro junto à barragem de
    Mulholland - que o leva até Las Vegas e a uma antiga paixão dos tempos
    dos Assuntos Internos, Eleanor Wish.

- id: michael-connelly/blood-work
  synopsis: >
    O perfilador reformado do FBI Terry McCaleb, em recuperação de um
    transplante de coração, é convidado pela irmã da sua dadora a investigar
    o homicídio dela, por resolver - e descobre que o crime nunca foi um
    simples assalto, mas algo dirigido diretamente a conseguir-lhe um novo
    coração.

- id: michael-connelly/angels-flight
  synopsis: >
    Um proeminente advogado de direitos civis é assassinado no funicular
    Angels Flight, e Bosch recebe um caso em que a própria LAPD, e a sua
    história de tensão racial, é diretamente suspeita.

- id: michael-connelly/void-moon
  synopsis: >
    A ladra de Las Vegas Cassie Black, a tentar reabilitar-se depois de uma
    passagem pela prisão, aceita um último trabalho no casino Cleopatra's
    Barge que se transforma numa luta pela vida contra o homem que a mandou
    prender.

- id: michael-connelly/a-darkness-more-than-night
  synopsis: >
    O perfilador reformado do FBI Terry McCaleb, chamado como consultor para
    um homicídio ritual, segue as provas até um suspeito que nunca esperaria:
    o próprio Harry Bosch. Contado a partir do ponto de vista de ambos, o
    caso torna-se tanto um exame aos métodos de Bosch como ao próprio crime.

- id: michael-connelly/city-of-bones
  synopsis: >
    Um cão desenterra o osso de uma criança nas colinas de Hollywood, e a
    investigação de Bosch a uma morte de décadas antes muda o rumo da sua
    própria vida e carreira.

- id: michael-connelly/chasing-the-dime
  synopsis: >
    O químico e empresário Henry Pierce, recém-mudado para um apartamento e
    com um número de telefone reciclado, começa a receber chamadas
    destinadas à antiga inquilina - uma acompanhante que desapareceu - e não
    consegue deixar de investigar.

- id: michael-connelly/lost-light
  synopsis: >
    Reformado da LAPD, Bosch reabre por conta própria, e sem distintivo, um
    homicídio de quatro anos antes por resolver - um caso que o próprio
    departamento outrora enterrou.

- id: michael-connelly/the-narrows
  synopsis: >
    Contratado por uma viúva para investigar a morte do marido, agente do
    FBI, Bosch descobre um rasto que o leva de volta ao assassino em série de
    [[work:michael-connelly/the-poet|The Poet]] - um caso que tanto Jack
    McEvoy como Rachel Walling julgavam já encerrado.

- id: michael-connelly/the-closers
  synopsis: >
    De volta à corporação e colocado na nova Unidade de Casos Arquivados da
    LAPD, Bosch reabre o homicídio de uma adolescente birracial, ocorrido uma
    década antes - um caso que reabre também velhas feridas raciais e
    políticas.

- id: michael-connelly/the-lincoln-lawyer
  synopsis: >
    O advogado de defesa criminal Mickey Haller, que gere o seu escritório no
    banco de trás de um Lincoln com motorista, aceita o que parece ser o caso
    mais fácil e mais bem pago da sua carreira - um cliente de Beverly Hills
    acusado de agressão - e começa a suspeitar que o próprio cliente o está a
    usar para algo muito pior.

- id: michael-connelly/echo-park
  synopsis: >
    A confissão de um assassino em série reabre um caso arquivado, de treze
    anos antes, que Bosch nunca conseguiu fechar, obrigando-o a confrontar
    quão perto esteve, na altura, de apanhar o próprio homem.

- id: michael-connelly/the-overlook
  synopsis: >
    Um homicídio num miradouro de Mulholland Drive atrai o FBI em poucas
    horas, e Bosch, recém-colocado na Homicídios Especial, tem de perceber o
    que no caso justifica uma resposta federal antes que a Segurança Interna
    lho tire das mãos por completo.

- id: michael-connelly/the-brass-verdict
  synopsis: >
    Ao regressar ao trabalho depois de um ano de ausência, Mickey Haller
    herda toda a carteira de casos de um colega assassinado, incluindo o
    julgamento por homicídio de um executivo de estúdio muito mediático - e
    descobre Harry Bosch, a investigar a morte do mesmo colega, a vigiar-lhe
    cada passo.

- id: michael-connelly/the-scarecrow
  synopsis: >
    Despedido do Los Angeles Times no colapso da indústria dos jornais, Jack
    McEvoy persegue uma última reportagem - um suspeito que acredita ter sido
    incriminado por homicídio - e acaba por descobrir um assassino que atua
    há anos sem ser detetado, invadindo os dados informáticos das suas
    vítimas.

- id: michael-connelly/nine-dragons
  synopsis: >
    O homicídio do dono de uma loja de bebidas no sul de Los Angeles
    revela-se ligado ao crime organizado de Hong Kong, e quando a filha de
    Bosch, de quem está afastado, é ameaçada do outro lado do Pacífico, o
    caso torna-se pessoal como nenhum outro antes.

- id: michael-connelly/the-reversal
  synopsis: >
    Recrutado como procurador especial para julgar de novo um condenado por
    homicídio de uma criança cuja condenação acaba de ser anulada, Mickey
    Haller trabalha o caso do outro lado da barreira, por uma vez - com Harry
    Bosch como investigador principal.

- id: michael-connelly/the-fifth-witness
  synopsis: >
    A trabalhar a defesa de casos de execução hipotecária durante o colapso
    imobiliário, Mickey Haller aceita defender uma cliente acusada de matar o
    banqueiro que lhe executava a casa - um caso construído inteiramente
    sobre os destroços da própria crise.

- id: michael-connelly/the-drop
  synopsis: >
    Bosch trabalha dois casos ao mesmo tempo, contra o relógio da sua própria
    reforma iminente: um caso arquivado de violação e homicídio cujo
    resultado de ADN não faz sentido, e a queda do filho de um vereador de
    uma janela de hotel, que a Câmara Municipal quer ver classificada como
    suicídio.

- id: michael-connelly/angle-of-investigation
  synopsis: >
    Três contos de Harry Bosch reunidos num único ebook: "Christmas Even",
    "Father's Day" e "Angle of Investigation", espalhados por vários pontos
    da sua carreira.

- id: michael-connelly/suicide-run
  synopsis: >
    Uma segunda coletânea só em ebook com três contos de Harry Bosch:
    "Suicide Run", "Cielo Azul" e "One Dollar Jackpot".

- id: michael-connelly/the-black-box
  synopsis: >
    Bosch reabre o homicídio por resolver de uma fotojornalista dinamarquesa
    morta durante os motins de Los Angeles de 1992, um caso que ficou
    parado, por trabalhar, durante vinte anos.

- id: michael-connelly/mulholland-dive
  synopsis: >
    Uma terceira coletânea só em ebook com três contos de Harry Bosch:
    "Cahoots", "Mulholland Dive" e "Two-Bagger".

- id: michael-connelly/the-gods-of-guilt
  synopsis: >
    Mickey Haller defende um cliente acusado de matar uma prostituta - que
    ele próprio já tinha representado, anos antes, num caso cujo desfecho
    ainda o assombra.

- id: michael-connelly/the-burning-room
  synopsis: >
    Bosch e a sua nova parceira, Lucia Soto, investigam a morte, adiada uma
    década, de um cantor de mariachi baleado numa festa municipal, um caso
    que só se torna homicídio quando o homem morre da ferida antiga, anos
    depois.

- id: michael-connelly/the-crossing
  synopsis: >
    Afastado à força da LAPD, Bosch passa pela primeira vez para o outro
    lado, a trabalhar como investigador de defesa para Mickey Haller num
    caso de homicídio que Bosch está convencido ter sido montado pelo
    próprio departamento a que outrora serviu.

- id: michael-connelly/the-wrong-side-of-goodbye
  synopsis: >
    A trabalhar agora casos arquivados a tempo parcial para a pequena
    polícia de San Fernando e, em privado, para um bilionário moribundo à
    procura de um herdeiro de cuja existência nunca soube, Bosch equilibra
    um mistério de paternidade com décadas de idade com a caça a um violador
    em série que atua na cidade no presente.

- id: michael-connelly/the-late-show
  synopsis: >
    A detetive da LAPD Renée Ballard, exilada para o turno noturno de
    Hollywood depois de uma queixa de assédio não ter dado em nada,
    recusa-se a entregar dois casos no fim do turno, como devia, e trabalha
    ambos por conta própria.

- id: michael-connelly/two-kinds-of-truth
  synopsis: >
    A trabalhar casos arquivados para San Fernando, Bosch é incriminado por
    um caso antigo que volta para se vingar, precisamente quando se
    infiltra numa operação de tráfico de opioides que explora viciados.

- id: michael-connelly/dark-sacred-night
  synopsis: >
    Renée Ballard encontra Harry Bosch, fora dos livros, a vasculhar de
    noite ficheiros de casos antigos na sua esquadra - à procura de quem
    matou uma adolescente fugida de casa anos antes - e os dois detetives,
    um ativo e outro reformado, juntam-se para terminar o que ele começou.

- id: michael-connelly/the-night-fire
  synopsis: >
    Bosch e Ballard investigam a morte de um sem-abrigo cujo processo
    desapareceu misteriosamente dos ficheiros privados de um detetive
    reformado - um caso que esse detetive, antigo mentor do próprio Bosch,
    passou os últimos anos de vida a recusar-se a encerrar.

- id: michael-connelly/fair-warning
  synopsis: >
    Já repórter de defesa do consumidor depois do declínio do seu jornal,
    Jack McEvoy torna-se suspeito no homicídio de uma mulher com quem teve
    um encontro de uma só noite, e começa a investigar a história de crime
    real que o caso esconde: um assassino que usa sites de testes de ADN
    para escolher as vítimas.

- id: michael-connelly/the-law-of-innocence
  synopsis: >
    Mandado parar por um farolim traseiro partido, Mickey Haller encontra o
    corpo de um cliente na sua própria mala do carro e, preso por homicídio,
    tem de se defender a partir de uma cela enquanto a sua própria equipa
    monta o caso lá fora.

- id: michael-connelly/the-dark-hours
  synopsis: >
    A trabalhar um tiroteio de Passagem de Ano em plena pandemia, que à
    primeira vista parece apenas tiros perdidos de festejo, Ballard liga-o a
    um dos velhos casos por resolver de Bosch e vê-se a caçar dois
    violadores em série ao mesmo tempo.

- id: michael-connelly/desert-star
  synopsis: >
    Ballard, agora à frente de uma unidade de voluntários para casos
    arquivados, recruta Bosch de volta ao trabalho para ajudar a resolver o
    homicídio de uma família inteira - um caso que o assombra desde que
    ficou por resolver, ainda no seu próprio turno, anos antes.

- id: michael-connelly/resurrection-walk
  synopsis: >
    Mickey Haller aceita um caso de condenação injusta - uma mulher a
    cumprir pena por matar o marido, ajudante do xerife - com Harry Bosch,
    mais lento com a idade mas ainda em atividade, como seu investigador.

- id: michael-connelly/the-waiting
  synopsis: >
    Os voluntários de casos arquivados de Ballard aproximam-se do "Violador
    da Fronha", um caso ligado à própria mãe de Ballard, enquanto Maddie,
    filha de Bosch e já ela própria agente da LAPD, é arrastada para a
    investigação ao lado deles.

- id: michael-connelly/nightshade
  synopsis: >
    Exilado para um posto discreto a policiar a ilha de Catalina depois de a
    política interna do departamento o ter afastado de uma secretária de
    homicídios no continente, o detetive do gabinete do xerife do condado de
    Los Angeles Stilwell encontra um corpo lastrado no fundo do porto e
    descobre um lado bem mais sombrio por trás da calma de cartão-postal da
    ilha.

- id: michael-connelly/the-proving-ground
  synopsis: >
    Ao virar-se para o direito de interesse público depois da sua
    "resurrection walk," Mickey Haller move uma ação cível contra uma
    empresa de inteligência artificial cujo chatbot é acusado de incentivar
    um adolescente a matar a ex-namorada, enquanto o repórter Jack McEvoy
    descobre o denunciante que pode ganhar o caso.

- id: michael-connelly/ironwood
  synopsis: >
    Uma operação armadilhada contra um carregamento de droga corre mal e
    deixa Stilwell de fora e um dos seus ajudantes morto, até que uma
    mochila que encontra o liga a uma mulher desaparecida e a um caso
    arquivado da LAPD - trazendo Renée Ballard para o lado da investigação a
    partir do continente.

- id: michael-connelly/the-hollow
  synopsis: >
    Um acordo de ação coletiva relativo à tristemente célebre instituição
    para crianças onde outrora foi tutelado pelo Estado entrega a Bosch um
    cheque que ele não quer - e reabre a sua caça a quem matou um rapaz ali,
    décadas antes, no espaço escondido a que as crianças chamavam "the
    hollow."

# --- Nonfiction ---
- id: michael-connelly/crime-beat
  synopsis: >
    Uma coletânea do próprio jornalismo policial de Connelly no Sun-Sentinel
    e no Los Angeles Times, com uma introdução do autor.
