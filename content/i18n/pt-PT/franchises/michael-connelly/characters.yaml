# Overlay pt-PT das personagens: apenas `description` (prosa). id, name, aka
# e sources não se traduzem, e as notas de appearsIn ficam na língua de base
# (mesma convenção de karin-slaughter/characters.yaml e
# tana-french/characters.yaml) - Terry McCaleb, cuja aparição em The Narrows
# está protegida por spoilerAfter no ficheiro de base, não tem nada nesta
# descrição que revele o seu destino, e este overlay não acrescenta nada
# nesse sentido.
# Nenhuma obra referida nestas descrições tem edição portuguesa registada.
- id: michael-connelly/harry-bosch
  description: >
    Detetive de homicídios da Polícia de Los Angeles e veterano da Guerra do
    Vietname, batizado pelo autor com o nome do pintor holandês do século XV.
    Protagonista da sua própria série de 26 romances e o eixo por onde acabam
    por passar todos os outros fios desta obra.

- id: michael-connelly/mickey-haller
  description: >
    Advogado de defesa criminal de Los Angeles que gere o seu escritório no
    banco de trás de um Lincoln com motorista, filho do proeminente advogado
    de defesa J. Michael Haller Sr. Protagonista da sua própria série de 8
    romances, o Lincoln Lawyer.

- id: michael-connelly/renee-ballard
  description: >
    Detetive da Polícia de Los Angeles transferida para o turno noturno
    depois de uma queixa de assédio não ter dado em nada. Protagonista solo
    da sua própria estreia antes de se tornar coprotagonista de Harry Bosch
    ao longo de mais cinco romances e, a partir de 2026, parceira à distância
    do sargento-detetive Stilwell, de Catalina.

- id: michael-connelly/jack-mcevoy
  description: >
    Repórter de crime cuja carreira passa pelo Rocky Mountain News de Denver,
    pelo Los Angeles Times e depois pelo jornalismo freelance de defesa do
    consumidor, à medida que a indústria dos jornais encolhe à sua volta.
    Protagonista da sua própria subsérie de 3 romances.

- id: michael-connelly/terry-mccaleb
  description: >
    Antigo perfilador criminal do FBI, em recuperação de um transplante de
    coração quando é apresentado. Protagonista da sua própria estreia antes
    de se juntar a Bosch como coinvestigador na sua segunda aparição.

- id: michael-connelly/rachel-walling
  description: >
    Agente do FBI que forma parceria pela primeira vez com Jack McEvoy e
    reaparece tanto no fio de McEvoy como no de Bosch ao longo de mais de
    duas décadas.
