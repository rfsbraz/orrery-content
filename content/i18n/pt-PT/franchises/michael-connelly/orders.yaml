# Overlay pt-PT das ordens de leitura: `name` + `rationale`, e `debated` onde
# existe (também prosa, ver SCHEMA.md). id, type, source, orderedWorkIds e
# sources nunca se traduzem.
# Duas obras citadas aqui têm edição portuguesa publicada e usam esse título
# como texto das ligações a essa obra: The Brass Verdict -> "O Veredicto" e
# The Waiting -> "A Espera" (ver editions.yaml). As restantes obras citadas
# (The Black Echo, The Hollow, The Proving Ground, The Poet, The Scarecrow,
# Fair Warning) não têm edição portuguesa registada, por isso os seus títulos
# ficam em inglês.
- id: michael-connelly/harry-bosch-in-order
  name: Os romances de Harry Bosch, por ordem
  rationale: >
    Todos os 26 romances de Harry Bosch, pela ordem de publicação numerada no
    próprio site do autor, desde [[work:michael-connelly/the-black-echo|The
    Black Echo]] até ao já anunciado
    [[work:michael-connelly/the-hollow|The Hollow]]. Só romances: as três
    coletâneas de contos só em ebook associadas a esta subsérie (Angle of
    Investigation, Suicide Run, Mulholland Dive) ficam de fora porque a
    própria lista numerada de Bosch no site do autor também as exclui, o
    mesmo critério que as ordens de Poirot/Marple de Agatha Christie usam
    para as suas coletâneas de contos.
  debated:
    - >
      Angle of Investigation, Suicide Run e Mulholland Dive (as três
      coletâneas de contos de Bosch em ebook) ficam fora desta ordem só de
      romances; um leitor completista que as queira ler a par pode
      situá-las pelos respetivos anos de publicação (2011, 2011 e 2012).

- id: michael-connelly/lincoln-lawyer-in-order
  name: Os romances do Lincoln Lawyer, por ordem
  rationale: >
    Todos os oito romances de
    [[character:michael-connelly/mickey-haller|Mickey Haller]], numerados de
    #1 a #8 no próprio site do autor, desde a sua estreia em 2005 até
    [[work:michael-connelly/the-proving-ground|The Proving Ground]], de 2025.
    Harry Bosch junta-se como investigador de Haller a partir de
    [[work:michael-connelly/the-brass-verdict|O Veredicto]] (#2), e esta
    ordem mantém todas essas aparições no lugar, em vez de as isolar numa
    lista à parte, só de Bosch.

- id: michael-connelly/renee-ballard-in-order
  name: Os romances de Renée Ballard, por ordem
  rationale: >
    Os seis romances que o próprio site do autor lista como "The Renée
    Ballard Series": a sua estreia solo de 2017,
    [[work:michael-connelly/the-late-show|The Late Show]], seguida dos cinco
    romances seguintes em que ela e
    [[character:michael-connelly/harry-bosch|Harry Bosch]] são creditados
    como coprotagonistas, até [[work:michael-connelly/the-waiting|A
    Espera]], de 2024. Esta ordem atravessa as etiquetas de subsérie em vez
    de seguir uma só: esses cinco livros mais recentes têm a numeração
    ininterrupta do próprio Bosch em works.yaml (ver o cabeçalho desse
    ficheiro), mas o próprio site da editora agrupa os seis como a série de
    Ballard por direito próprio, e esta ordem segue esse agrupamento - a
    mesma forma que o will-trent-in-order de Karin Slaughter assume para um
    fio coprotagonizado que começa dentro da numeração de outra personagem.
  debated:
    - >
      O próprio site do autor separa esta lista de seis livros de mais três
      aparições de Ballard que assinala à parte: uma participação breve em
      Resurrection Walk (2023), e Ironwood (2026) e The Hollow (2026), onde
      ela trabalha o caso fora da parceria habitual com Bosch. Ficam de fora
      desta ordem pela mesma distinção que a editora estabelece; a ordem por
      omissão continua a incluir as três no seu devido lugar.

- id: michael-connelly/jack-mcevoy-in-order
  name: Os romances de Jack McEvoy, por ordem
  rationale: >
    Os três romances de
    [[character:michael-connelly/jack-mcevoy|Jack McEvoy]], numerados por
    ordem no próprio site do autor: a sua estreia de 1996,
    [[work:michael-connelly/the-poet|The Poet]],
    [[work:michael-connelly/the-scarecrow|The Scarecrow]], de 2009, e
    [[work:michael-connelly/fair-warning|Fair Warning]], de 2020.
    Separam-nos um intervalo de treze e depois onze anos, cada um com uma
    dúzia ou mais de romances de Bosch, do Lincoln Lawyer ou de Ballard
    publicados entretanto - esta ordem permite a um leitor seguir o próprio
    arco de repórter de McEvoy sem esperar que esses intervalos se fechem.
  debated:
    - >
      O próprio site do autor também credita McEvoy com uma participação
      secundária em The Proving Ground, de 2025, e pequenos papéis em A
      Darkness More Than Night (2000) e
      [[work:michael-connelly/the-brass-verdict|O Veredicto]] (2008); ficam
      de fora desta ordem, que é só do protagonista, do mesmo modo que a
      própria lista da editora os separa da sua série de três livros.
