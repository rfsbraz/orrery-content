- id: john-shirley/everything-is-broken
  synopsis: >
    Um romance de apocalipse com tonalidade noir.

- id: john-shirley/doyle-after-death
  synopsis: >
    Um romance que imagina Arthur Conan Doyle a navegar a vida após a morte.

- id: john-shirley/wyatt-in-wichita
  synopsis: >
    O seu primeiro romance histórico, sobre o jovem Wyatt Earp.

- id: john-shirley/a-dying-machine
  synopsis: >
    Um romance de ficção científica coescrito com o músico Mark Tremonti,
