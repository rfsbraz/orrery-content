# Overlay pt-PT das sinopses. Não existe qualquer edição portuguesa de nenhum
# título de John Shirley (ver editions.yaml, 86 edições, todas em inglês),
# pelo que nenhum `title` é traduzido aqui - a app mostra sempre o título
# original.

- id: john-shirley/eclipse
  synopsis: >
    Abre a trilogia cyberpunk (também comercializada como The Eclipse
    Trilogy), situada numa Europa de um futuro próximo fraturada pela guerra
    corporativa e por um ressurgimento fascista.

- id: john-shirley/eclipse-penumbra
  synopsis: >
    O segundo volume da trilogia, dando continuidade à guerra contra a New
    Resistance.

- id: john-shirley/eclipse-corona
  synopsis: >
    Fecha a trilogia.

- id: john-shirley/transmaniacon
  synopsis: >
    O seu romance de estreia, inspirado na canção "Transmaniacon MC", dos
    Blue Oyster Cult.

- id: john-shirley/dracula-in-love
  synopsis: >
    Um romance de terror publicado nos primeiros anos da Zebra Books,
    construído em torno do mito de Drácula.

- id: john-shirley/city-come-a-walkin
  synopsis: >
    Um romance proto-cyberpunk em que o avatar vivo de uma cidade recruta o
    dono de uma discoteca para a sua própria defesa; William Gibson
    reconhece-lhe influência na introdução que escreve para uma edição
    posterior.

- id: john-shirley/three-ring-psychus
  synopsis: >
    Um romance sobre uma levitação em massa súbita e o arrebatamento
    anárquico que a acompanha.

- id: john-shirley/the-brigade
  synopsis: >
    Um romance policial/de terror sobre violência de vigilantes numa cidade
    em decadência.

- id: john-shirley/cellars
  synopsis: >
    Um romance de terror sobre algo antigo, solto por baixo das ruas de Nova
    Iorque.

- id: john-shirley/kamus-of-kadizar
  synopsis: >
    Um romance de fantasia heroica autónomo.

- id: john-shirley/in-darkness-waiting
  synopsis: >
    Um romance de terror sobre uma pequena cidade infestada por algo que se
    reproduz na escuridão.

- id: john-shirley/a-splendid-chaos
  synopsis: >
    Uma fantasia científica surreal, subtitulada An Interplanetary Fantasy,
    em que um pequeno grupo de humanos é largado num mundo alienígena
    perigoso e deixado a competir pela sobrevivência.

- id: john-shirley/wetbones
  synopsis: >
    Um romance de terror sobre o apetite de Hollywood: um argumentista em
    dificuldades identifica o corpo emaciado e mutilado da ex-mulher numa
    maca do necrotério, e por trás dele encontra um mal antigo e sem nome
    que devasta as vítimas corpo e alma, deixando apenas ossos húmidos.

- id: john-shirley/silicon-embrace
  synopsis: >
    Um romance de ficção científica sobre uma guerra de informação e media
    num futuro próximo.

- id: john-shirley/demons-novella
  synopsis: >
    A sua novela original: demónios organizados em sete clãs distintos
    invadem a terra, matando por prazer, enquanto um jovem artista de São
    Francisco se junta a um círculo de cientistas e filósofos decididos a
    acabar com o cerco.

- id: john-shirley/demons
  synopsis: >
    Um romance de terror sobre um apocalipse que ultrapassa todas as
    expectativas: demónios organizados em sete clãs vagueiam por uma terra
    de futuro próximo, torturando humanos por desporto, e um jovem artista
    de São Francisco junta-se a um estranho grupo de cientistas e filósofos
    que tenta acabar com o cerco.

- id: john-shirley/the-view-from-hell
  synopsis: >
    Um romance curto de terror, publicado pela Subterranean Press.

- id: john-shirley/her-hunger
  synopsis: >
    Um romance curto de terror, publicado pela primeira vez na antologia
    Night Visions 10.

- id: john-shirley/and-the-angel-with-television-eyes
  synopsis: >
    Um romance de terror surreal, publicado pela Night Shade Books.

- id: john-shirley/spider-moon
  synopsis: >
    Um romance de suspense publicado pela Cemetery Dance.

- id: john-shirley/crawlers
  synopsis: >
    Um romance de terror e ficção científica: um risco de luz cai do céu
    sobre uma sonolenta cidade da Califórnia, e algo insidioso começa a
    espalhar-se, a multiplicar-se e a transformar tudo o que encontra pela
    frente.

- id: john-shirley/the-other-end
  synopsis: >
    Um romance apocalíptico e politicamente carregado que entrega o Dia do
    Juízo à esquerda política, em vez de à direita cristã.

- id: john-shirley/black-glass
  synopsis: >
    Um thriller de futuro próximo.

- id: john-shirley/bleak-history
  synopsis: >
    Um romance sombrio de fantasia urbana, situado numa Nova Iorque
