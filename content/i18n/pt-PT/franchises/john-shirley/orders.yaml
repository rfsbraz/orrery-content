# Overlay pt-PT das ordens de leitura: `name`, `rationale` e `debated`.
# orderedWorkIds e sources não se traduzem.
- id: john-shirley/the-specialist
  name: The Specialist - a ordem oficial da série
  rationale: >
    Shirley escreveu os onze romances de The Specialist sob o seu próprio
    pseudónimo, John Cutter, seguindo o mercenário Jack Sullivan numa série
    crescente de contratos publicados a um ritmo de cerca de dois em dois
    meses ao longo de 1984 e 1985. Seis dos onze partilham o mesmo ano de
    publicação entre si, e os outros cinco partilham o outro ano, pelo que o
    ano de primeira publicação por si só não os consegue posicionar - e uma
    leitura alfabética dos títulos fica longe da numeração original das
    próprias capas. Esta ordem repõe essa numeração. Não custa nada ao
    leitor em termos temáticos, já que cada livro é um trabalho autónomo,
    mas é o único ponto desta prateleira onde a ordenação por ano e título
    da ordem derivada induz mesmo em erro, baralhando a maior parte da
    segunda metade da série.
