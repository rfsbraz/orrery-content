# Overlay pt-PT. Apenas prosa; id, slugs, títulos de obras e sources não são
# traduzidos. Os startHere.paths ficam aninhados e são fundidos por id (ver
# SCHEMA.md, "Nested lists merge by id"): só `title`, `description` e `note`,
# nunca `workIds`, `orderId` ou `fit`.
- id: john-shirley
  description: >
    A obra publicada completa de John Shirley (nascido em 1953): o
    cyberpunk pioneiro de
    [[work:john-shirley/city-come-a-walkin|City Come A-Walkin']] e da
    trilogia A Song Called Youth (1985-1990), o terror visceral que ajudou
    a definir o splatterpunk ([[work:john-shirley/wetbones|Wetbones]], a
    coletânea vencedora do Bram Stoker Award
    [[work:john-shirley/black-butterflies|Black Butterflies]]), três
    décadas de romances licenciados de adaptação (BioShock, Halo,
    Borderlands, Predator, Batman, Hellblazer), dois pseudónimos pulp dos
    anos 1980 (Traveler como D. B. Drumm, The Specialist como John Cutter)
    e, a partir de 2022, os Westerns Cleve Trewe, vencedores do Spur Award.
  startHere:
    paths:
      - id: cyberpunk-origin
        title: Onde o cyberpunk começou
        description: >
          City Come A-Walkin' (1980) antecipa Neuromancer em três anos. A
          própria introdução de William Gibson a uma edição posterior chama-
          lhe uma influência direta na sua escrita, o que faz deste romance
          a porta mais curta e menos exigente para a vertente pela qual
          Shirley é mais lembrado.
        note: >
          É um livro inicial, com uma escrita mais rude do que a sua prosa
          posterior, e a sua premissa surreal de uma cidade-personagem é uma
          fatia mais estreita desta prateleira do que a sua reputação
          sugere - a maioria dos outros oitenta e tal livros é terror,
          adaptações licenciadas ou Westerns, não isto.

      - id: short-fiction-sampler
        title: Uma amostra do seu alcance
        description: >
          Living Shadows (2007) reúne contos que uma crítica do New York
          Times chamou de "rigorosamente aterradores", vindos de três
          décadas dos seus contos - terror, sátira e cyberpunk em poucas
          páginas de cada vez.
        note: >
          Ignora por completo os seus romances, os marcos do seu cyberpunk e
          o seu trabalho de adaptação licenciada, e continua inclinado para
          o terror - uma amostra do seu alcance em conto, não um mapa de
          toda a prateleira.

      - id: song-called-youth-arc
        title: O arco cyberpunk que o define
        description: >
          A Song Called Youth - Eclipse (1985), Eclipse Penumbra (1988) e
          Eclipse Corona (1990) - acompanha um movimento de resistência que
          combate um regime neofascista numa Europa de um futuro próximo,
          depois de uma terceira guerra mundial. A Science Fiction
          Encyclopedia chama-lhe a sua melhor obra de ficção científica.
        note: >
          São três livros até o arco compensar, e a sua política com sabor a
          Guerra Fria mostra mais a idade do que o seu trabalho posterior -
          a sua sequência mais aclamada, mas não a sua leitura inicial mais
          fácil.

      - id: everything
        title: Cada palavra publicada
        description: >
          Os mais de oitenta livros desta prateleira, da sua estreia em
          1979 ao seu Western mais recente, pela ordem em que apareceram -
          cyberpunk, terror splatterpunk, três décadas de adaptações
          licenciadas, dois pseudónimos pulp e tudo o resto.
        note: >
          Sem curadoria aqui: géneros e pseudónimos que nunca partilhariam
          uma página lado a lado, exatamente como foram publicados.
