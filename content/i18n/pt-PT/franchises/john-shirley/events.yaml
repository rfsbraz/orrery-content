# Overlay pt-PT dos eventos da franquia: `title` + `description`. Não existe
# edição portuguesa de nenhuma obra de Shirley (ver editions.yaml), pelo que
# as referências a obras mantêm sempre o título original inglês.

- id: john-shirley/eclipse-antifascist-origin-1985
  title: A Song Called Youth começa como um aviso vindo de França
  description: >
    Alguns anos antes de a escrever, Shirley viveu em França e assistiu ao
    regresso de uma vaga de neofascismo, com a classe trabalhadora a reagir
    contra uma nova geração de imigrantes - o clima a que mais tarde
    associa a Frente Nacional de Jean-Marie Le Pen.
    [[work:john-shirley/eclipse|Eclipse]], que abre a trilogia, é a sua
    resposta: um aviso de ficção científica deliberadamente antifascista,
    projetando esse mesmo medo e essa mesma desinformação para um futuro
    próximo de estado policial europeu. Em entrevistas posteriores traça o
    mesmo mecanismo - mentiras que "ganham uma espécie de vida viral
    própria" - projetado de novo para a frente, até ao QAnon e aos
    deepfakes.

- id: john-shirley/heatseeker-1989
  title: Heatseeker reúne a ficção curta, com introdução de Gibson e uma
    coescrita com Sterling
  description: >
    A Scream Press publica [[work:john-shirley/heatseeker|Heatseeker]],
    reunindo histórias escritas entre 1975 e 1988. William Gibson assina a
    introdução - sete anos antes da mais famosa que escreveria para a
    reedição de 1996 de
    [[work:john-shirley/city-come-a-walkin|City Come A-Walkin']] - e a
    coletânea inclui "The Unfolding", coescrito com Bruce Sterling. O Locus
    Readers' Poll nomeia-a uma das melhores coletâneas de contos do ano,
    um raro reconhecimento do género mainstream numa carreira construída
    sobretudo em originais de bolso e pequenas editoras.

- id: john-shirley/blue-oyster-cult-lyrics-1992
  title: Começa a escrever letras para os Blue Öyster Cult
  description: >
    Um amigo em comum leva as letras de Shirley até aos Blue Öyster Cult,
    que andavam à procura de um letrista; "Demon's Kiss" e "The Horsemen
    Arrive", as suas duas primeiras letras gravadas para a banda, saem na
    banda sonora do filme de ficção científica de baixo orçamento Bad
    Channels. Envia por fax as folhas de letras ao guitarrista Buck Dharma
    durante anos, mais tarde por email; a colaboração cresce ao longo de
    Heaven Forbid (1998), Curse of the Hidden Mirror (2001) e The Symbol
    Remains (2020), somando 23 canções gravadas ao todo - uma segunda
    carreira de escrita, paralela, que começou, de certo modo, antes do seu
    primeiro romance:
    [[work:john-shirley/transmaniacon|Transmaniacon]] já tem o nome de uma
    canção da própria banda.

- id: john-shirley/the-crow-1994
  title: "The Crow: o seu argumento, depois o de outro, depois uma morte no
    set"
  description: >
    Por volta da altura em que a banda desenhada ainda inacabada de James
    O'Barr chega ao terceiro número, Shirley e o produtor Jeff Most compram
    os direitos e ele escreve o argumento original - quatro versões ao
    longo de cerca de dois anos, fiéis o suficiente à banda desenhada para
    manterem o corvo falante. Em 1991 a produção contrata David J. Schow
    para o reescrever, tornando-o no filme mais duro e mais silencioso que
    chega às salas; a versão final de 1994 credita o argumento de Schow como
    "baseado num argumento de John Shirley". O protagonista Brandon Lee
    morre a 31 de março de 1993, vítima de uma arma de fogo de adereço mal
    preparada no set, dias antes de as filmagens deverem terminar; o filme é
    concluído e lançado sem ele, a 11 de maio de 1994. Shirley diria mais
    tarde que "não conseguiu ficar contente" com o modo como a produção
    terminou, independentemente do êxito do filme já pronto.

- id: john-shirley/gibson-patient-zero-1996
  title: A introdução de William Gibson coroa-o "Paciente Zero do Cyberpunk"
  description: >
    A Eyeball Books reedita
    [[work:john-shirley/city-come-a-walkin|City Come A-Walkin']] dezasseis
    anos depois do seu lançamento original em 1980, então ignorado, com uma
    nova introdução de William Gibson a chamar a Shirley "o Paciente Zero do
    cyberpunk, o primeiro foco do vírus, indiscutivelmente virulento",
    admitindo sentir-se "algo constrangido, ao relê-lo recentemente, ao ver
    o quanto do meu próprio trabalho inicial parte deste único romance". A
    introdução reposiciona um livro que na altura vendeu abaixo do radar do
    género como a raiz reconhecida do movimento que o próprio Gibson é
    creditado por fundar.

- id: john-shirley/tremonti-collaboration-2018
  title: Uma agência de contratação junta-o a um guitarrista de rock para
    novelizar um álbum conceptual
  description: >
    O vocalista dos Tremonti, Mark Tremonti, quer escrever a versão em
    romance do álbum conceptual da sua banda, A Dying Machine, mas não
    consegue fazê-lo ao mesmo tempo que grava o disco; a divisão literária
    da sua agência de contratação junta-o a Shirley, cuja ficção científica
    Tremonti considera "perfeita para isto" e cheia de "um lado muito
    humano". Os dois constroem um esboço de 29 páginas ao longo de sucessivas
    chamadas telefónicas, com Tremonti a narrar e Shirley a devolver o texto
    reescrito, e Shirley esboça os capítulos iniciais à medida que o álbum é
    lançado. [[work:john-shirley/a-dying-machine|A Dying Machine]] fica
    concluído em junho de 2018 - uma terceira parceria de escrita em suporte
    paralelo, a par das letras para os Blue Öyster Cult e de The Crow, e a
    primeira vez em que é um músico a contratá-lo, em vez do contrário.

- id: john-shirley/nyt-living-shadows-2008
  title: O New York Times avalia-o, três décadas depois
  description: >
    Terrence Rafferty avalia
    [[work:john-shirley/living-shadows|Living Shadows]] no New York Times,
    chamando-lhe "um álbum de grandes êxitos que atravessa algumas décadas
    de um trabalho espantosamente consistente e rigorosamente aterrador" e
    apontando "a facilidade terrível com que nós, americanos modernos,
    aprendemos a desviar o olhar da dor e do sofrimento" como o grande tema
    de Shirley - a primeira notícia substancial do jornal de referência
    sobre um escritor já a quase trinta anos de carreira, avaliado, quando
    era avaliado, sobretudo pela imprensa do género.

- id: john-shirley/spur-award-2024
  title: Vence o Spur Award com um Western, seis décadas depois
  description: >
    A Western Writers of America atribui a
    [[work:john-shirley/gunmetal-mountain|Gunmetal Mountain]], o segundo
    romance de Cleve Trewe, o seu Spur Award para Romance de Bolso - um
    prémio da indústria num género em que Shirley só entra a partir de
    2022, já perto dos setenta anos, décadas depois das prateleiras de
    cyberpunk e terror que lhe fizeram o nome.
