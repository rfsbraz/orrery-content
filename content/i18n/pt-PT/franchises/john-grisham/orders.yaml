# Overlay pt-PT das ordens de leitura: `name`, `rationale` e `debated`.
# id, type, source, orderedWorkIds e sources nunca se traduzem. A ordem
# "publication default" (todas as 58 obras) é derivada automaticamente e não
# tem entrada própria em orders.yaml, pelo que não há nada a fundir aqui
# para ela.
# Títulos de obras citados na prosa usam o original inglês em toda a ala:
# nenhuma edição pt-PT está registada para nenhuma das 58 obras (ver o
# cabeçalho de editions.yaml) - nunca um título inventado.
- id: john-grisham/jake-brigance-in-order
  name: "Jake Brigance, por ordem"
  rationale: >
    A personagem mais duradoura de Grisham, retirada de entre as outras
    cinquenta e cinco obras em que está espalhada na estante completa.
    [[work:john-grisham/a-time-to-kill|A Time to Kill]] é a sua estreia de
    1989; [[work:john-grisham/sycamore-row|Sycamore Row]] retoma Jake na
    mesma Clanton fictícia, no Mississípi, vinte e quatro anos depois em
    tempo real (três, para Jake); [[work:john-grisham/a-time-for-mercy|A
    Time for Mercy]] segue-se sete anos mais tarde. A ordem de publicação
    não resolve nada aqui - as três obras chegaram exatamente por esta
    sequência e nenhum guia defende lê-las de outra forma - mas lê-las
    seguidas mantém legível, ao longo dos hiatos, o elenco recorrente de
    Clanton (Harry Rex Vonner, Lucien Wilbanks) e a reputação lentamente
    conquistada do próprio Jake, em vez de o reencontrar depois de uma
    dezena de romances de Grisham sem qualquer ligação. Sycamore Row está
    escrito para se sustentar por si só - um leitor que chegue a ele sem ter
    lido primeiro A Time to Kill encontra, ainda assim, um julgamento
    completo e autónomo - pelo que esta ordem é um apoio à continuidade, não
    uma obrigação; o custo de o destacar desta forma é o benefício inverso,
    a surpresa agradável de ver Jake ressurgir a meio da estante depois de
    anos de ausência, que esta ordem troca por manter o fio contínuo.
  debated:
    - "\"Homecoming\", dentro da coletânea de 2022 Sparring Partners,
       revisita Jake e esta mesma continuidade de Clanton, mas não está
       catalogada como obra própria (segundo a regra deste catálogo de que
       uma coletânea não é parte da série a que pertence um conto lá
       dentro) - ver Sparring Partners na ordem derivada por defeito para
       saber onde se enquadra."
    - "Ford County (2009) e The Last Juror (2004) passam-se ambos em Clanton
       e partilham personagens secundárias com estes três romances, mas
       centram-se em protagonistas diferentes, pelo que ficam fora do fio
       próprio de Jake; a ordem derivada por defeito continua a incluir os
       dois no seu lugar."

- id: john-grisham/lacy-stoltz-in-order
  name: "Lacy Stoltz, por ordem"
  rationale: >
    O fio próprio da investigadora de conduta judicial Lacy Stoltz, aberto
    por um conto que a editora lançou como porta de entrada:
    [[work:john-grisham/witness-to-a-trial|Witness to a Trial]] chegou aos
    leitores semanas antes de [[work:john-grisham/the-whistler|The
    Whistler]], em 2016, um aperitivo para o romance, e não algo escrito
    para recompensar um leitor que já o tenha terminado. Lacy não está no
    conto - chega com o romance.
    [[work:john-grisham/the-judges-list|The Judge's List]] segue-se cinco
    anos depois, com mais uma dúzia de romances de Grisham (os dois livros
    de Camino Island publicados até então, mais dois Theodore Boone, The
    Reckoning, The Guardians e A Time for Mercy, entre outros) publicados
    pelo meio. Destacar o fio aqui significa ler os casos de Lacy seguidos
    em vez de anos à parte. O custo: esta ordem deixa de fora tudo o resto
    que Grisham publicou ao longo desses cinco anos, e um leitor que só
    queira romances não perde nada ao saltar o conto - The Whistler
    apresenta Lacy pelos seus próprios termos de qualquer forma.

- id: john-grisham/camino-island-in-order
  name: "A trilogia de Camino Island, por ordem"
  rationale: >
    O único fio recorrente de Grisham fora do thriller judicial: a história
    do livreiro Bruce Cable e da romancista Mercer Mann estende-se por três
    livros, de 2017 a 2024 - um assalto a manuscritos, um homicídio
    encoberto por um furacão, uma disputa de terras - com dezenas de
    thrillers judiciais sem ligação publicados pelo meio, na estante
    completa. Ler os três seguidos mantém Cable, Mann e a própria ilha
    contínuos, em vez de um regresso surpresa a cada poucos anos. O custo:
    lidos desta forma, deixa-se quase por completo de lado aquilo por que
    Grisham é realmente mais conhecido - sem tribunal, sem escritório de
    advocacia - e cada livro está construído para funcionar como um
    mistério autónomo e satisfatório por si só, pelo que lê-los seguidos
    troca parte desse prazer do regresso surpresa pela continuidade.

- id: john-grisham/theodore-boone-in-order
  name: "Theodore Boone, por ordem"
  rationale: >
    A série juvenil completa de sete livros, publicada pela Grosset &
    Dunlap/Puffin em vez da chancela habitual de Grisham para adultos,
    dirigida a um público claramente mais novo do que as outras cinquenta e
    uma obras desta estante. Segue Theo Boone, treze anos, ano letivo após
    ano letivo em Strattenburg, pela ordem em que os livros foram escritos,
    sem qualquer guia a defender outra sequência. Destacado aqui, um leitor
    - ou um pai ou mãe a escolher o que dar a seguir a um filho a meio da
    série - pode percorrer os sete casos de Theo em sequência, sem ter
    também de se orientar entre os thrillers de Grisham para adultos
    espalhados pelos mesmos anos. O custo do destaque é exatamente esse:
    nenhuma da ficção judicial ou policial de Grisham para leitores adultos
    aparece nesta ordem, de propósito.
