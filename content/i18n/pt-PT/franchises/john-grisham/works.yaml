# Overlay pt-PT das obras: apenas `synopsis` (prosa). `title` nunca se
# traduz aqui: um título traduzido só existe como edição publicada, em
# editions.yaml (ver docs/SCHEMA.md, "Never translate a published title").
# `note:` também não é traduzido: é anotação de curadoria, não lida pela
# aplicação no ecrã da obra.
# editions.yaml desta ala tem 57 edições, todas em inglês, e nenhuma em
# português (ver o cabeçalho desse ficheiro: "that is a gap, not a finding
# of absence"). Por isso todos os títulos ficam no original inglês em toda
# esta ala, incluindo os títulos de contos citados dentro de sinopses
# (Ford County: "Blood Drive", "Fetching Raymond" etc.), o filme "Christmas
# with the Kranks" e o subtítulo "A Non-Legal Thriller" de The Tumor -
# tratados aqui como citações de um título real, nunca inventados.
#
# Sete sinopses (the-brethren, the-reckoning, calico-joe, the-guardians,
# the-exchange, witness-to-a-trial, theodore-boone-the-accomplice) param
# deliberadamente no nível da contracapa, sem revelar o desfecho;
# traduzidas exatamente como estão, sem repor nenhuma revelação.
#
# TERMINOLOGIA JURÍDICA. O sistema judicial norte-americano (grande júri,
# acordos de confissão, ações coletivas, litígio de indemnizações em massa,
# defensor público, xerife de condado) não tem equivalente direto em
# Portugal; os termos abaixo traduzem para a compreensão de um leitor
# português do que está a acontecer, não para um decalque jurídico literal.
# Continuam o vocabulário já fixado noutras alas policiais/jurídicas deste
# catálogo (michael-connelly, lee-child, harlan-coben): "homicídio",
# "advogado de defesa", "procurador" (district attorney/prosecutor),
# "veredicto", "condenação injusta", "ação coletiva", "xerife"/"ajudante do
# xerife", "condado", "réu". Novos nesta ala: "defensor público" (public
# defender) e "litígio de indemnizações em massa" (mass-tort litigation),
# sem precedente nas outras alas mas seguindo o mesmo princípio.

# --- Legal thrillers & other novels, in publication order ---

- id: john-grisham/a-time-to-kill
  synopsis: >
    Um advogado de uma pequena cidade do Mississípi defende um pai negro que
    matou os dois homens brancos que violaram a filha de dez anos, num
    julgamento que divide a cidade segundo linhas raciais. A estreia de
    Grisham, inspirada num julgamento real que testemunhou em 1984.

- id: john-grisham/the-firm
  synopsis: >
    Um jovem advogado atraído por um escritório de Memphis bom demais para
    ser verdade descobre que este lava dinheiro para a máfia, e que o FBI já
    o tem sob vigilância. O segundo romance de Grisham e o seu primeiro
    best-seller.

- id: john-grisham/the-pelican-brief
  synopsis: >
    O memorando especulativo de uma estudante de Direito, que aponta um
    suspeito do assassinato de dois juízes do Supremo Tribunal, revela-se
    exatamente certo, tornando-a o alvo seguinte.

- id: john-grisham/the-client
  synopsis: >
    Um rapaz de 11 anos que testemunha o suicídio de um advogado da máfia e
    fica a saber um segredo perigoso contrata uma advogada com dificuldades
    para o proteger tanto da máfia como do governo federal.

- id: john-grisham/the-chamber
  synopsis: >
    Um jovem advogado assume o caso do avô de quem está afastado, um membro
    envelhecido da Ku Klux Klan no corredor da morte por um atentado à bomba
    de décadas antes, numa corrida contra o tempo até à data da execução.

- id: john-grisham/the-rainmaker
  synopsis: >
    Um advogado falido, recém-licenciado, enfrenta uma seguradora corrupta
    que recusou a indemnização de um doente com leucemia, no seu primeiro
    caso a sério.

- id: john-grisham/the-runaway-jury
  synopsis: >
    Um jurado e a sua misteriosa parceira, mantida fora do tribunal,
    manipulam secretamente por dentro um julgamento sobre a responsabilidade
    das tabaqueiras, enquanto os consultores de júri tanto dos autores da
    ação como da própria indústria tentam descobrir quem está por trás de
    tudo.

- id: john-grisham/the-partner
  synopsis: >
    Um advogado que fingiu a própria morte e roubou noventa milhões de
    dólares ao seu escritório é localizado no Brasil, e tem de lutar contra
    a extradição e contra os homens que perseguem o dinheiro.

- id: john-grisham/the-street-lawyer
  synopsis: >
    Um advogado empresarial feito refém por um sem-abrigo abandona o seu
    escritório para trabalhar numa clínica de apoio jurídico, e descobre o
    papel do antigo escritório num despejo que se tornou mortal.

- id: john-grisham/mickey
  synopsis: >
    Um argumento original, não adaptado de nenhum dos seus romances: um
    advogado viúvo da Virgínia, sob investigação do IRS (o fisco
    norte-americano), foge com o filho, jogador da Little League, para Las
    Vegas sob novas identidades.

- id: john-grisham/the-testament
  synopsis: >
    O suicídio de um bilionário recluso deixa a fortuna a uma filha
    ilegítima que trabalha como missionária nas profundezas do Pantanal
    brasileiro, e um advogado caído em desgraça é enviado para a encontrar.

- id: john-grisham/the-brethren
  synopsis: >
    Três antigos juízes caídos em desgraça, a cumprir pena numa prisão
    federal da Flórida, gerem um esquema de extorsão por correspondência a
    partir da biblioteca jurídica da prisão, enquanto, lá fora, uma estranha
    eleição presidencial e os fios escondidos puxados por uma poderosa
    figura do governo convergem sobre eles.

- id: john-grisham/a-painted-house
  synopsis: >
    Uma fuga ao thriller judicial: o amadurecimento de um rapaz de sete anos
    na quinta de algodão da família no Arkansas, em 1952, inspirado na
    própria infância de Grisham entre meeiros e trabalhadores agrícolas
    migrantes.

- id: john-grisham/skipping-christmas
  synopsis: >
    O plano de um casal para saltar o Natal por completo e fazer um cruzeiro
    em vez disso escandaliza a sua rua sem saída; mais tarde adaptado ao
    cinema como Christmas with the Kranks (2004).

- id: john-grisham/the-summons
  synopsis: >
    Um professor de Direito, chamado a casa do pai moribundo no Mississípi,
    encontra três milhões de dólares em dinheiro escondidos lá dentro, sem
    qualquer explicação para a sua origem.

- id: john-grisham/the-king-of-torts
  synopsis: >
    Um jovem defensor público é atraído para o mundo do litígio de
    indemnizações em massa, à caça de enormes acordos de ações coletivas,
    até a pressão desse estilo de vida o alcançar.

- id: john-grisham/bleachers
  synopsis: >
    Antigos jogadores reúnem-se no campo de futebol americano da sua
    pequena cidade sulista para uma vigília, enquanto o seu lendário e
    temido treinador do liceu está a morrer.

- id: john-grisham/the-last-juror
  synopsis: >
    Um jovem editor de jornal na Clanton, Mississípi, dos anos 1970, cobre o
    julgamento e, mais tarde, a liberdade condicional de um assassino que
    matou uma jovem viúva à frente dos filhos.

- id: john-grisham/the-broker
  synopsis: >
    Um influente operador político de Washington, caído em desgraça,
    perdoado no último dia do seu mandato e escondido em Itália, não faz
    ideia de qual das várias agências de informação anda a persegui-lo, nem
    porquê.

- id: john-grisham/the-innocent-man
  synopsis: >
    O único livro de crime real de Grisham: a condenação injusta de Ron
    Williamson, antiga promessa do basebol das ligas menores, condenado à
    morte por um homicídio que não cometeu em Ada, Oklahoma.

- id: john-grisham/playing-for-pizza
  synopsis: >
    Um quarterback acabado, terceira opção da NFL, expulso da liga depois de
    uma derrota desastrosa nos playoffs, assina por uma equipa amadora de
    futebol americano em Parma, Itália.

- id: john-grisham/the-appeal
  synopsis: >
    Uma empresa química, confrontada com um veredicto de júri avultado,
    financia secretamente uma campanha para eleger um juiz favorável para o
    Supremo Tribunal do estado que vai julgar o seu recurso.

- id: john-grisham/the-associate
  synopsis: >
    Um recém-licenciado em Direito é chantageado com um incidente encoberto
    do seu passado, e forçado a espiar por dentro o seu próprio e
    prestigiado escritório de Nova Iorque.

- id: john-grisham/ford-county
  synopsis: >
    A primeira coletânea de contos de Grisham: sete contos passados dentro e
    à volta do seu recorrente condado fictício de Ford County, Mississípi -
    "Blood Drive", "Fetching Raymond", "Fish Files", "Casino", "Michael's
    Room", "Quiet Haven" e "Funny Boy".

- id: john-grisham/the-confession
  synopsis: >
    Dias antes de uma execução no Texas, o verdadeiro assassino confessa a
    um pastor, que tem de decidir se se apresenta e tenta impedi-la a tempo.

- id: john-grisham/dont-quit-your-day-job
  synopsis: >
    Uma antologia de vários autores com ensaios autobiográficos sobre os
    empregos do dia a dia que cada escritor deixou para trás para escrever a
    tempo inteiro; Grisham é um dos mais de vinte colaboradores, com edição
    de Sonny Brewer.

- id: john-grisham/theodore-boone-kid-lawyer
  synopsis: >
    Theo Boone, treze anos, filho de dois advogados de Strattenburg e, por
    direito próprio, um perito jurídico amador, é arrastado para um caso de
    homicídio quando um colega de escola lhe confia um segredo sobre a
    testemunha-chave do julgamento.

- id: john-grisham/theodore-boone-the-abduction
  synopsis: >
    Uma colega e amiga de Theo desaparece de um dia para o outro, e Theo
    trabalha para a encontrar.

- id: john-grisham/the-litigators
  synopsis: >
    Um associado exausto de um grande escritório de advocacia foge para um
    escritório caça-ambulâncias de dois sócios, e acaba por liderar um
    processo de indemnização em massa contra um gigante farmacêutico.

- id: john-grisham/theodore-boone-the-accused
  synopsis: >
    O próprio Theo torna-se suspeito depois de ser incriminado por um
    assalto a uma loja local.

- id: john-grisham/calico-joe
  synopsis: >
    O primeiro romance de basebol de Grisham: no verão de 1973, um estreante
    de Calico Rock, Arkansas, é a melhor coisa que Chicago alguma vez viu,
    até ao dia em que um lançador dos Mets, de bola forte, o enfrenta
    finalmente com o próprio filho nas bancadas, e atira uma bola rápida que
    muda as três vidas.

- id: john-grisham/the-racketeer
  synopsis: >
    Um advogado preso oferece ao FBI a identidade do assassino de um juiz
    federal, em troca da própria liberdade e do dinheiro da recompensa, e
    tem um plano próprio para ambos.

- id: john-grisham/theodore-boone-the-activist
  synopsis: >
    Theo organiza os colegas de turma para protestar contra uma variante
    rodoviária que destruiria uma comunidade rural.

- id: john-grisham/sycamore-row
  synopsis: >
    Jake Brigance regressa três anos depois de A Time to Kill para defender
    o testamento manuscrito de um proprietário branco moribundo, que
    deserda a própria família a favor da sua empregada doméstica negra.

- id: john-grisham/gray-mountain
  synopsis: >
    Despedida do seu escritório de Nova Iorque na crise de 2008, uma jovem
    advogada aceita um estágio numa clínica de apoio jurídico dos Apalaches,
    e é arrastada para uma luta contra as práticas mineiras mortais de uma
    carvoeira.

- id: john-grisham/the-tumor
  synopsis: >
    Subintitulado "A Non-Legal Thriller": o diagnóstico de tumor cerebral do
    mesmo doente fictício é contado duas vezes, uma com o tratamento de
    hoje e outra com a terapia por ultrassom focado, para defender a causa
    da tecnologia.

- id: john-grisham/theodore-boone-the-fugitive
  synopsis: >
    Theo avista um assassino fugitivo de volta a Strattenburg, e tem de
    convencer adultos céticos de que tem razão.

- id: john-grisham/rogue-lawyer
  synopsis: >
    O advogado de rua Sebastian Rudd, que trabalha a partir de uma carrinha
    blindada e aceita os clientes que mais ninguém quer tocar, vai de caso
    em caso defendendo os réus mais odiados pela sociedade.

- id: john-grisham/partners
  synopsis: >
    Uma prequela de Rogue Lawyer: como Sebastian Rudd encontrou a única
    pessoa em quem confia - o seu motorista, guarda-costas, assistente
    jurídico e único amigo.

- id: john-grisham/witness-to-a-trial
  synopsis: >
    Um conto digital, prequela de The Whistler, contado em treze capítulos
    curtos de testemunhos de um julgamento por homicídio capital numa
    pequena cidade da Flórida: o primeiro julgamento por homicídio de um
    juiz, um advogado de defesa fora do seu alcance, um procurador em busca
    de sangue e glória, um homem acusado que pode ser inocente, e um
    assassino que pode ter cometido o crime perfeito.

- id: john-grisham/the-whistler
  synopsis: >
    Uma investigadora de conduta judicial da Flórida descobre que um juiz
    em funções gere secretamente, com o crime organizado, um esquema de
    desvio de receitas de um casino em terras tribais.

- id: john-grisham/theodore-boone-the-scandal
  synopsis: >
    Theo investiga um escândalo de fraude em testes estandardizados na sua
    própria escola.

- id: john-grisham/camino-island
  synopsis: >
    Uma fuga aos thrillers judiciais: o roubo de cinco manuscritos
    inestimáveis de F. Scott Fitzgerald em Princeton atrai uma romancista
    com dificuldades para a órbita de um livreiro de uma ilha da Flórida que
    pode andar a negociar livros roubados.

- id: john-grisham/the-rooster-bar
  synopsis: >
    Três estudantes de Direito falidos e desiludidos, numa faculdade de
    Direito com fins lucrativos e predatória, abandonam os estudos para
    exercer sem licença, inspirados em reportagens reais sobre o esquema da
    dívida das faculdades de Direito.

- id: john-grisham/the-reckoning
  synopsis: >
    Outubro de 1946: um veterano condecorado da Segunda Guerra Mundial,
    pilar da comunidade de Clanton, no Mississípi, entra de carro na cidade
    e mata a tiro o pastor metodista, respondendo depois ao xerife, aos seus
    advogados, ao juiz, ao júri e à própria família sempre com as mesmas
    cinco palavras - "Não tenho nada a dizer". As razões remontam às
    Filipinas e avançam através das gerações que se seguem.

- id: john-grisham/theodore-boone-the-accomplice
  synopsis: >
    O amigo de Theo, Woody Lambert, já com dificuldades na escola e a fazer
    más escolhas, é preso como cúmplice involuntário de um assalto à mão
    armada, e Theo corre contra o tempo para o tirar de um sistema que não é
    igual para todos os que nele estão.

- id: john-grisham/the-guardians
  synopsis: >
    Um advogado que é também pastor episcopaliano, à frente de uma pequena
    organização sem fins lucrativos dedicada a condenações injustas, aceita
    o caso de um homem que já cumpre vinte e dois anos de prisão perpétua
    pelo homicídio de um advogado de uma pequena cidade da Flórida, e que
    sempre afirmou não ter sido ele.

- id: john-grisham/camino-winds
  synopsis: >
    Um furacão a abater-se sobre Camino Island encobre o homicídio de um
    romancista que tinha tropeçado numa fraude demasiado grande para ser
    seguro, e o livreiro Bruce Cable começa a fazer as perguntas que a
    tempestade devia ter respondido.

- id: john-grisham/a-time-for-mercy
  synopsis: >
    Jake Brigance é nomeado para defender um rapaz de dezasseis anos
    acusado de matar o ajudante do xerife abusivo que aterrorizava a mãe
    dele, um caso que ninguém em Clanton quer que ele ganhe.

- id: john-grisham/the-judges-list
  synopsis: >
    A investigadora Lacy Stoltz descobre que um juiz em funções é um
    assassino em série a trabalhar a partir de uma lista de rancores com
    décadas, e tem de ajudar a construir um caso sem se tornar o alvo
    seguinte dele.

- id: john-grisham/sooley
  synopsis: >
    O desempenho revelação de um adolescente sul-sudanês num evento de
    basquetebol de verão vale-lhe uma bolsa para uma faculdade
    norte-americana, enquanto a guerra civil devasta a família que deixa
    para trás.

- id: john-grisham/the-boys-from-biloxi
  synopsis: >
    Dois melhores amigos de infância na costa do Golfo do Mississípi
    crescem, um até se tornar um procurador cruzado, o outro o chefe da
    família criminosa local, numa rota de colisão que termina num tribunal.

- id: john-grisham/sparring-partners
  synopsis: >
    A primeira coletânea de novelas de Grisham: "Homecoming" (Jake Brigance
    ajuda no desastroso regresso de um velho amigo a Clanton), "Strawberry
    Moon" (as últimas horas de um jovem recluso no corredor da morte) e
    "Sparring Partners" (os irmãos advogados rivais Kirk e Rusty Malloy
    despedaçam o escritório do pai).

- id: john-grisham/the-exchange
  synopsis: >
    Quinze anos depois de The Firm, Mitch McDeere é sócio do maior
    escritório de advocacia do mundo quando um mentor moribundo, em Roma,
    lhe entrega um caso que o leva até Istambul e Trípoli, e volta a
    colocar colegas, amigos e família na linha de fogo.

- id: john-grisham/camino-ghosts
  synopsis: >
    A romancista Mercer Mann e o livreiro Bruce Cable enfrentam um promotor
    imobiliário empresarial que tenta apoderar-se de uma ilha deserta, há
    muito reclamada pelo último descendente do povo que ali encontrou
    refúgio.

- id: john-grisham/framed
  synopsis: >
    Dez histórias reais de condenações injustas, escritas a meias com Jim
    McCloskey, fundador da Centurion Ministries, com base no próprio
    trabalho de casos da Centurion a libertar inocentes.

- id: john-grisham/the-widow
  synopsis: >
    O primeiro romance policial de enigma de Grisham: um advogado de uma
    pequena cidade da Virgínia, que escreveu o testamento de uma viúva rica,
    vê-se acusado do homicídio dela e tem de encontrar o verdadeiro
    assassino para limpar o próprio nome.

- id: john-grisham/the-french-illusion
  synopsis: >
    Uma fuga de género para o thriller de espionagem: a lua de mel de um
    casal na zona rural francesa transforma-se num rapto transfronteiriço,
    com o FBI, a CIA e os serviços de informação franceses numa corrida
    para os encontrar.
