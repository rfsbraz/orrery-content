- id: john-grisham-legal-thriller-boom-1991
  title: The Firm acende o boom do thriller judicial dos anos 1990
  description: >
    Presumed Innocent (1987), de Scott Turow, já tinha devolvido o thriller
    judicial às listas de mais vendidos, mas o sucesso repentino de The Firm
    em 1991 - seguido, em rápida sucessão, por The Pelican Brief, The
    Client, The Chamber e The Runaway Jury - transforma o género na forma
    comercial dominante da década. Grisham e Turow são nomeados juntos,
    então e desde então, como os dois autores que definiram o thriller
    judicial dos anos 1990.
