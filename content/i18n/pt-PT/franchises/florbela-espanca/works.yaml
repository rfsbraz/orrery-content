# Overlay pt-PT: synopsis + note para as 9 obras. NUNCA inclui `title` - os
# títulos já são o português original da autora, não há título traduzido a
# dar (ver editions.yaml, que por isso não tem sobreposição própria: uma
# edição não se traduz).
#
# A sinopse de charneca-em-flor cita o verso real do poema-título da
# coletânea ("Dispo a minha mortalha, o meu burel, / e já não sou, Amor,
# Sóror Saudade... / Sou a charneca rude a abrir em flor!"), em vez de
# traduzir de novo a glosa inglesa que a base usa junto da citação - o
# original está publicado (Citador, escritas.org) e é o texto que a base
# está a glosar, não uma frase a inventar. As restantes citações em
# português já embutidas na prosa base (dedicatórias, a nota da própria
# Espanca em o-domino-preto) mantêm-se tal como estão, sem repetir aqui a
# glosa inglesa entre parênteses que a acompanha na base - seria redundante
# num texto já em português.

- id: florbela-espanca/livro-de-magoas
  synopsis: >
    O seu primeiro livro publicado: sonetos escritos enquanto era estudante
    de Direito em Lisboa, ainda com vinte e poucos anos, já com a voz
    confessional e muitas vezes angustiada - a mágoa, a saudade, o desejo do
    corpo nomeado sem rodeios - que haveria de definir a sua obra, antes do
    registo mais firme e sensual dos livros seguintes.
  note: >
    Publicado em Lisboa pela Tipografia Maurício enquanto Espanca cursava o
    terceiro ano de Direito, no mesmo ano em que sofreu um aborto espontâneo
    e começou a mostrar os primeiros sinais da doença física e mental que a
    acompanharia pelo resto da vida. O crítico Raúl Proença, com quem
    correspondia a partir do seu caderno manuscrito "Trocando Olhares",
    compilou e editou esta edição, registando-se que introduziu variantes
    próprias nos sonetos manuscritos dela.

- id: florbela-espanca/livro-de-soror-saudade
  synopsis: >
    Sonetos escritos nos anos do seu segundo casamento e de um novo aborto
    espontâneo, que tomam o título da figura inventada de "Sóror Saudade",
    através da qual Espanca enquadra uma renúncia ao mundo própria de cela
    de convento, em tensão com o desejo sensual a que os poemas não param de
    regressar.
  note: >
    Publicado em Lisboa pela Tipografia A Americana. Redigido sob o título
    provisório "Claustro das Quimeras", que Espanca teve de abandonar depois
    de outro autor publicar um livro com o mesmo nome; algumas fontes
    apontam um título de trabalho ainda anterior, "Livro do Nosso Amor". No
    mesmo ano da publicação, separou-se do segundo marido, António
    Guimarães, depois de um novo aborto espontâneo.

- id: florbela-espanca/charneca-em-flor
  synopsis: >
    A sua coletânea mais célebre: sonetos de renovação e desejo sensual
    assumido, enquadrados como um renascimento a partir da persona de freira
    em luto dos livros anteriores - "Dispo a minha mortalha, o meu burel, /
    e já não sou, Amor, Sóror Saudade... / Sou a charneca rude a abrir em
    flor!" - que a crítica e os leitores têm lido, por igual, como o seu
    livro mais diretamente autobiográfico e menos contido.
  note: >
    Publicado pela Livraria Gonçalves, em Coimbra, nos primeiros dias de
    janeiro de 1931, cerca de um mês depois da morte de Espanca. Uma carta
    sua datada de 15 de maio de 1927, dirigida a José Emídio Amaro, diretor
    do jornal de Vila Viçosa D. Nuno, já descrevia a coletânea como
    terminada; só encontrou editor quando Guido Battelli, professor
    visitante italiano em Coimbra com quem correspondia nos seus últimos
    meses, se ofereceu para ajudar em julho de 1930, e ela viveu apenas para
    rever as provas tipográficas antes do suicídio nesse dezembro. A
    primeira edição reúne cinquenta e seis sonetos; uma segunda edição,
    publicada no mesmo ano, acrescenta mais vinte e oito sonetos reunidos
    por Battelli depois da sua morte e publicados à parte, num apêndice
    intitulado "Reliquiae" - trabalho editorial póstumo real e distinto do
    manuscrito que ela própria já dava por terminado quatro anos antes.

- id: florbela-espanca/as-mascaras-do-destino
  synopsis: >
    Oito contos nascidos da morte do irmão Apeles, num acidente de avião em
    1927, e dedicados à sua memória, com o livro a abrir com a dedicatória
    "A meu Irmão, ao meu querido Morto". A morte e o luto atravessam toda a
    obra, incluindo os próprios títulos - "O Aviador", "A Morta", "Os Mortos
    não Voltam", "O Sobrenatural".
  note: >
    Publicado no Porto pela Editora Marânus, dedicado "A meu Irmão, ao meu
    querido Morto". A dedicatória e a forma acabada da coletânea apontam
    para um manuscrito substancialmente preparado por ela própria, ao
    contrário dos rascunhos não assinados e sem data de
    [[work:florbela-espanca/o-domino-preto|O Dominó Preto]]; nenhuma das
    fontes aqui verificadas identifica quem, na Marânus, organizou o livro
    final, se é que alguém além da própria Espanca o fez. Uma quarta edição
    (Bertrand, 1982) traz um prefácio da romancista Agustina Bessa-Luís.

    A sinopse acima fica-se pelo nível da dedicatória e do índice, tal como
    o texto de divulgação da coletânea (Calçada das Letras, 2010, via
    wook.pt: a obra está "totalmente dedicada ao seu irmão Apeles...
    inspirada pela tristeza e dor que a perda do irmão causa em Florbela",
    sem nomear o conteúdo de nenhum conto). Os resumos conto a conto que
    circulam mais amplamente revelam desfechos, e dois deles são
    armadilhas: "O Aviador" é uma reescrita mítica da própria morte de
    Apeles, e "Os Mortos não Voltam" fecha na posição que o título afirma, e
    não contra ela ("Os mortos não voltam, e é melhor que assim seja... Que
    vergonha se voltassem!"). Nenhum dos dois pertence a uma sinopse voltada
    para o leitor. Essa mesma página da wook também data mal a escrita, para
    "final de 1917", e a morte de Apeles para esse mesmo ano; ambas são de
    1927.

- id: florbela-espanca/juvenilia
  synopsis: >
    Os seus poemas de juventude dispersos, a maioria anteriores à estreia de
    1919, reunidos num único volume só depois da sua morte.
  note: >
    Publicado pela Livraria Gonçalves, de Coimbra, com prefácio de Guido
    Battelli, que no mesmo ano também lançou
    [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]] e
    [[work:florbela-espanca/cartas|Cartas]]. Uma compilação organizada e
    intitulada por Battelli a partir de poemas manuscritos dispersos, e não
    um livro planeado ou ordenado pela própria Espanca, razão pela qual fica
    à parte das três coletâneas que ela própria preparou.

- id: florbela-espanca/cartas
  synopsis: >
    A correspondência sobrevivente de Espanca, sobretudo as cartas a Dona
    Júlia Alves e a Guido Battelli dos seus últimos meses, lidas desde então
    como o registo em primeira pessoa mais próximo do seu estado de espírito
    antes do suicídio.
  note: >
    Chegou pela primeira vez às livrarias no mesmo ano da sua morte, como
    "Cartas de Florbela Espanca (a Dona Júlia Alves e a Guido Battelli)"
    (Livraria Gonçalves, 1931). Um volume mais alargado seguiu-se em 1949
    (prefácios de Azinhal Abelho e José Emídio Amaro), e o corpus cresceu
    ainda mais ao longo de edições académicas posteriores - dois volumes de
    cartas dedicados nas "Obras Completas" de 1986 (Dom Quixote), e novas
    seleções organizadas em 2008 ("Perdidamente") e 2012 ("Sempre Tua"),
    ambas da autoria de Maria Lúcia Dal Farra. Uma correspondência reunida
    de forma póstuma e repetida, e não um único livro planeado, o mesmo
    estatuto que este catálogo atribui às cartas reunidas do próprio Luís de
    Camões.

- id: florbela-espanca/diario-do-ultimo-ano
  synopsis: >
    O diário privado que Espanca escreveu nos últimos meses de vida, depois
    de um diagnóstico de edema pulmonar, e a par de duas tentativas de
    suicídio documentadas antes da sua morte, nesse dezembro.
  note: >
    Publicado como "Diário do Último Ano Seguido de um Poema Sem Título",
    cinquenta e um anos depois da sua morte, pela Bertrand, com prefácio da
    poeta Natália Correia. Um registo privado que Espanca nunca preparou
    para publicação, ao contrário das três coletâneas de poesia acima,
    publicadas em vida ou quase terminadas.

- id: florbela-espanca/o-domino-preto
  synopsis: >
    Seis contos, de tom mais leve do que
    [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]],
    escritos numa altura em que Espanca também traduzia romances franceses
    por dinheiro e se tinha afastado da poesia por um tempo.
  note: >
    Espanca começou a reunir esta coletânea por volta de 1927, com intenção
    de a publicar em outubro de 1928, mas pôs o projeto de lado; o
    manuscrito sobrevivente de um dos contos, "Mulher de Perdição", não tem
    data nem assinatura (ao contrário de todos os outros contos, que ela
    assinou) e traz uma nota sua, desvalorizando as peças como "Primeiros
    ensaios (coisas para aproveitar) ou antes, para não aproveitar...
    Tolices!". A publicação atrasou-se mais cinquenta anos por uma disputa
    de direitos, só chegando às livrarias em 1982 (Livraria Bertrand,
    Lisboa), com prefácio de Y. K. Centeno.

- id: florbela-espanca/trocando-olhares
  synopsis: >
    Os seus poemas mais antigos que sobreviveram, e três contos, escritos no
    Redondo entre 1915 e 1917 e guardados num único caderno manuscrito que
    ela nunca publicou nesta forma, a fonte de onde tirou duas tentativas de
    publicação falhadas e os seus dois primeiros livros, impresso na íntegra
    só nesta edição académica de 1994.
  note: >
    O manuscrito (32,2 x 11 cm, capa dura, quarenta e nove folhas, hoje
    guardado no seu espólio na Biblioteca Nacional de Lisboa) é o caderno
    que Espanca começou a preencher em meados de 1916, vivendo no Redondo, a
    partir de textos escritos desde 1915 e completado com trabalho
    posterior. Voltou a recorrer-lhe para as seleções não publicadas
    "Primeiros Passos" (1916) e "Primeiros Versos" (1917), e ainda mais
    além, para os próprios
    [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] e
    [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]].
    Ao contrário destes dois livros publicados, os poemas e contos do
    caderno só chegaram às livrarias décadas depois, como "Trocando
    Olhares" (Imprensa Nacional-Casa da Moeda, 1994, 346 p., ISBN
    972-27-0751-5), com estudo introdutório, estabelecimento de texto e
    notas de Maria Lúcia Dal Farra; seguiu-se uma reedição comercial em 2009
    (Martin Claret, São Paulo). Catalogado aqui no mesmo plano de
    [[work:florbela-espanca/cartas|Cartas]] e
    [[work:florbela-espanca/diario-do-ultimo-ano|Diário do Último Ano]]:
    real, dela, e publicado como livro só depois de um editor póstumo lhe
    dar essa forma.
