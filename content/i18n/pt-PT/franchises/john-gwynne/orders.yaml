# Overlay pt-PT das ordens de leitura: `name` + `rationale` + `debated`
# (prosa). id, type, source, sources e orderedWorkIds nunca se traduzem.
#
# Esta ordem (banished-lands-in-order) carrega o aviso de ordem de admissão
# que impede um leitor de começar Of Blood and Bone sem ler antes Faithful
# and the Fallen. A rationale e as duas entradas de debated ficam ao nível
# da premissa - nunca dizem como a guerra profetizada termina, nunca nomeiam
# quem sobrevive. Esta tradução segue exatamente esse grau de vaguidão -
# nenhum resultado, morte ou sobrevivente é nomeado aqui que não esteja já
# no texto-fonte inglês.
#
# Nomes de série/cenário sem edição portuguesa confirmada (Banished Lands,
# Faithful and the Fallen, Of Blood and Bone) ficam no original inglês,
# incorporados na prosa, pela mesma razão registada em works.yaml e
# franchise.yaml: a única edição real desta obra não pode servir de fonte de
# terminologia. Os títulos dos dois contos citados em `debated` ("Better to
# Live Than to Die", "The Heir Apparent") também ficam no original: nenhum
# tem edição portuguesa.
- id: john-gwynne/banished-lands-in-order
  name: "As Banished Lands, do início ao fim"
  rationale: >
    As duas séries que partilham um único mundo, lidas como a saga contínua
    única que o próprio Gwynne descreve: a tetralogia Faithful and the
    Fallen ([[work:john-gwynne/malice|Malice]] até
    [[work:john-gwynne/wrath|Wrath]]), depois Of Blood and Bone
    ([[work:john-gwynne/a-time-of-dread|A Time of Dread]] até
    [[work:john-gwynne/a-time-of-courage|A Time of Courage]]), passada 130
    anos mais tarde nas mesmas Banished Lands. A ordem de publicação já dá
    esta sequência de graça, com uma exceção: as seis contribuições de
    ficção curta em antologias, intercaladas com estes anos no catálogo
    bruto, que esta ordem deixa de fora para manter o fio condutor sem
    interrupções - ver `debated` para o que isso deixa de fora e porquê. A
    verdadeira razão de existir desta ordem não é, porém, a interrupção das
    antologias: é que Of Blood and Bone é uma sequela direta, não uma
    segunda porta de entrada, e os relatos dos leitores convergem em
    tratá-la como tal. O seu próprio material de marketing é escrito para
    quem já leu a primeira série, e os leitores que a abordam sem preparação
    relatam exatamente a confusão que isso implica. O custo de a ler desta
    forma é comprometer-se com sete livros - e o consenso entre os leitores
    sobre os dois volumes intermédios de Faithful and the Fallen (Valour,
    Ruin) é que se arrastam antes do desfecho da tetralogia - antes de
    qualquer um dos outros dois cenários de Gwynne.
  debated:
    - >
      Parcial por opção: só romances. Dois dos seis contos publicados em
      antologias trazem uma etiqueta de série da ISFDB para este mesmo
      universo - [[work:john-gwynne/blackguards-tales-of-assassins-mercenaries-and-rogues|"Better
      to Live Than to Die"]] está etiquetado como "universo de The Faithful
      and the Fallen" e [[work:john-gwynne/unfettered-iii-new-tales-by-masters-of-fantasy|"The
      Heir Apparent"]] está etiquetado diretamente como "The Faithful and
      the Fallen" - mas nenhum dos dois tem uma colocação confirmada nesta
      cronologia (works.yaml regista o primeiro como não confirmado pelo
      nome), pelo que nenhum entra na sequência acima. Um leitor completista
      que queira todas as palavras das Banished Lands escritas por Gwynne
      deve ler ambos; um leitor que queira só o fio condutor dos romances
      não precisa de os esperar. As outras quatro contribuições em
      antologia ("An Oath Given," "The Sundering," "The Greatest Battle,"
      "The Message") não têm qualquer ligação de série a este ou a qualquer
      outro cenário de Gwynne, e ficam de fora desta ordem e de qualquer
      leitura completista das Banished Lands com igual confiança.
    - >
      Se ler Of Blood and Bone sem preparação chega de facto a estragar o
      final de Faithful and the Fallen, ou se apenas confunde um leitor que
      ainda não conhece o mundo, não é igual em todos os relatos: alguns
      comentadores na discussão citada relatam confusão em vez de um
      spoiler declarado, e nenhuma crítica afirma diretamente "isto revela
      como termina o quarto livro". O que é consistente em todas as fontes
      independentes verificadas - as críticas já citadas em works.yaml e
      vários relatos de leitores, sem ligação entre si, na discussão acima -
      é que ninguém recomenda lê-la primeiro, por uma razão ou por outra.
