# Overlay pt-PT das obras: apenas `synopsis` (prosa). `title` nunca se
# traduz aqui: um título traduzido só existe como edição publicada, e a
# única edição portuguesa desta ala é The Shadow of the Gods (Edições Asa,
# "A Sombra dos Deuses", 2022 - ver editions.yaml); todas as outras dezasseis
# obras ficam com o título original inglês. `note:` também não é traduzido:
# é anotação de curadoria, nunca lida pela aplicação.
#
# Nove destas sinopses descrevem apenas o livro a que pertencem, nunca o
# final do livro anterior da mesma série - a badana publicada de cada
# sequela costuma citar o desfecho do volume que a precede, e o texto-base
# em inglês evita isso deliberadamente, ficando mais vago do que essa
# badana. Esta tradução segue exatamente esse grau de vaguidão: nenhum
# resultado de guerra, morte ou sobrevivente é nomeado aqui que não esteja
# já no texto-fonte inglês.
#
# Nomes de série/cenário sem edição portuguesa confirmada (Banished Lands,
# Vigrid, God-War, the Bloodsworn, Ben-Elim, Kadoshim, Jotun, Of Blood and
# Bone) ficam no original inglês, incorporados na prosa - a única edição
# real (A Sombra dos Deuses) não pode servir de fonte de terminologia aqui,
# pelo que nada é inventado; "the God-War" é parafraseado como "a guerra
# profetizada" onde a frase o permite, em vez de se cunhar um termo.

# --- The Faithful and the Fallen (Banished Lands) ---
- id: john-gwynne/malice
  synopsis: >
    O mundo está partido e nunca mais poderá voltar a ser inteiro. Nas
    Banished Lands, uma coligação frouxa de reinos com um passado violento
    de homens e gigantes em guerra, Corban não quer nada mais do que ser um
    guerreiro ao serviço do Rei Brenin; Veradis, o mais recente homem da
    hoste do Alto Príncipe Nathair e um dos melhores espadachins da sua
    terra, vive à sombra do irmão mais velho enquanto Nathair trama planos
    que o pai, o Alto Rei, desconhece; e Evnis já sacrificou demasiado pelo
    poder que pretende alcançar. Agora as pedras choram sangue, vermes
    gigantes agitam-se, e quem ainda sabe ler os sinais vê um perigo muito
    pior do que tudo o que veio antes.

- id: john-gwynne/valour
  synopsis: >
    A guerra estala nas Banished Lands à medida que a corrida ao poder se
    intensifica. Corban foge da sua terra em busca de paz e não encontra
    refúgio a ocidente, perseguido a cada passo pelos agentes da Rainha Rhin
    e por bandos errantes de gigantes; Veradis abandona o campo de batalha e
    corre para junto do seu rei, o dever a pesar-lhe sobre os ombros; Maquin
    só quer vingança, com traficantes piratas e o mundo brutal das lutas de
    fosso no seu caminho; e Nathair é arrastado para as guerras do ocidente
    quando Rhin marcha contra o Rei Owain.

- id: john-gwynne/ruin
  synopsis: >
    A guerra profetizada deixa de ser uma ameaça iminente e torna-se real:
    as facções das Banished Lands, reunidas em torno de Corban, Maquin e um
    elenco cada vez mais alargado dos dois lados do conflito, veem-se
    arrastadas para cercos abertos e batalhas campais, à medida que se
    formam as alianças que travarão a guerra final.

- id: john-gwynne/wrath
  synopsis: >
    O clímax da tetralogia, carregado de combate corpo a corpo. Os
    acontecimentos chegam ao ponto de rutura à medida que a guerra atinge
    novos patamares: o Rei Nathair detém a fortaleza de Drassil e três dos
    sete tesouros, e com Calidus e a sua aliada, a Rainha Rhin, atrás de si,
    fará o que for preciso para conseguir os restantes - os sete reunidos
    sob um único comando abririam um portal por onde Asroth e a sua horda de
    demónios poderiam invadir as Banished Lands e ganhar forma de carne.
    Corban, com a sua hoste dispersa, foi feito prisioneiro pelos Jotun,
    gigantes guerreiros que montam ursos enormes em combate, e, para ter
    alguma hipótese de enfrentar Nathair, precisa de fazer aliados entre
    facções rivais de gigantes que não têm qualquer razão para lhas dar. A
    sua vida está em jogo, e com ela o destino das Banished Lands.

# --- Of Blood and Bone (Banished Lands, 130 anos depois) ---
- id: john-gwynne/a-time-of-dread
  synopsis: >
    Um século e um terço depois da guerra profetizada, as Banished Lands
    vivem sob uma paz brutalmente imposta. No sul, a impetuosa Riv não quer
    nada mais do que ser admitida na força de manutenção da paz dos
    Ben-Elim, os alados, e acaba antes por desenterrar um segredo mortal; a
    ocidente, a giganta Sig investiga avistamentos de demónios e encontra
    sinais de uma revolta e de magia negra; no gelado norte, Drem, filho de
    um armadilheiro, encontra cadáveres mutilados nas florestas, obra de um
    predador ou de algo bem mais sombrio; e o príncipe refém Bleda é mantido
    na corte dos Ben-Elim. É um tempo de lealdades cambiantes, e algo se
    prepara nas sombras.

- id: john-gwynne/a-time-of-blood
  synopsis: >
    O romance intermédio de Of Blood and Bone: o conflito entre os Ben-Elim,
    os Kadoshim e as facções humanas das Banished Lands alastra. Fritha, a
    letal suma sacerdotisa dos demónios, persegue Drem e os seus amigos pelo
    norte; as forças demoníacas multiplicam-se e lançam uma hoste contra a
    fortaleza dos anjos; e Drem torna-se o centro emocional do conflito.

- id: john-gwynne/a-time-of-courage
  synopsis: >
    O final da trilogia, e o último livro passado nas Banished Lands: heróis
    erguem-se e caem, a terra fica manchada de vermelho, e o destino das
    Banished Lands é decidido de uma vez por todas quando Riv, Drem e a
    Ordem da Estrela Brilhante convergem para o ajuste de contas final.

# --- The Bloodsworn Saga (um cenário distinto, de inspiração nórdica) ---
- id: john-gwynne/the-shadow-of-the-gods
  synopsis: >
    Passou um século desde que os deuses deste mundo entraram em guerra e se
    extinguiram uns aos outros. Só restam os seus ossos, prometendo grande
    poder a quem for suficientemente corajoso para os desenterrar, e os
    monstros que deixaram para trás continuam a vaguear por uma terra de
    fiordes e tundra, de sabor nórdico. Enquanto rumores de guerra ecoam por
    Vigrid, o destino segue três guerreiros: Orka, uma caçadora numa missão
    perigosa; Elvar, uma nobre em busca de fama em combate; e Varg, um
    escravo em busca de vingança nas fileiras da companhia mercenária
    conhecida como the Bloodsworn.

- id: john-gwynne/the-hunger-of-the-gods
  synopsis: >
    Os deuses mortos estão a erguer-se, e uma nova era de sangue e conquista
    abre-se sobre os reinos divididos de Vigrid. Orka continua a busca pelo
    filho desaparecido; the Bloodsworn avançam para sul numa corrida
    desesperada para salvar um dos seus enquanto Varg dá os primeiros passos
    no caminho da vingança; e Elvar, ligada por um juramento de sangue, tem
    primeiro de convencer os Battle-Grim a segui-la. Contra a deusa-dragão
    Lik-Rifa e os seus seguidores nascidos de dragão, nenhuma das companhias
    consegue resistir sozinha, e a única esperança pode estar nos escritos
    loucos de um deus acorrentado - um livro de magia proibida com o poder
    de erguer dos mortos o deus-lobo Ulfrir.

- id: john-gwynne/the-fury-of-the-gods
  synopsis: >
    O volume que encerra a trilogia the Bloodsworn: aproxima-se a batalha
    final pelo destino de Vigrid. Varg e the Bloodsworn enfrentam o seu
    maior desafio até agora, dar caça a um dragão; Elvar enfrenta ameaças de
    fora e de dentro enquanto se prepara para o confronto que se aproxima;
    Biorr e a sua hoste seguem para norte ávidos de sangue, enquanto Gudvarr
    persegue uma missão própria, na esperança de ganhar o favor da
    deusa-dragão Lik-Rifa e fazer avançar as suas ambições. Todos os
    caminhos convergem para Snakavik e um confronto titânico que abalará os
    alicerces do mundo.

# --- The Wolfheart Chronicles (um quarto cenário, de inspiração eslava) ---
- id: john-gwynne/the-wolves-of-war
  synopsis: >
    Os Clãs viveram outrora livres, honrando os seus próprios deuses e
    tradições, até que invasores do norte os quebraram a sangue e fogo. A
    única preocupação de um pai é proteger a filha, Halia, presa no seu
    próprio corpo desde o nascimento, mas que sonha à noite correr com lobos
    e falar com as criaturas feéricas da floresta - poderes que muitos
    chamam uma maldição, mas que podem ser a única forma de a sua família
    sobreviver ao que aí vem, enquanto dois príncipes tornados inimigos
    mortais e uma bruxa de dentes de ferro arrastam nações inteiras para a
    guerra.

# --- Ficção curta: contribuições para antologias de vários autores ---
- id: john-gwynne/blackguards-tales-of-assassins-mercenaries-and-rogues
  synopsis: >
    Uma antologia de vários autores de ficção fantástica moralmente
    ambígua, editada por J. M. Martin; a contribuição de Gwynne está
    classificada pela ISFDB como pertencente ao "universo de The Faithful
    and the Fallen", tornando-a um conto passado nas Banished Lands e não
    num cenário à parte, ainda que a sua colocação exata na cronologia não
    esteja confirmada.

- id: john-gwynne/legends-ii-stories-in-honour-of-david-gemmell
  synopsis: >
    Uma antologia de homenagem editada por Ian Whates para a NewCon Press,
    celebrando o autor de fantasia David Gemmell; a estreia de Gwynne,
    Malice, venceu o Prémio David Gemmell Morningstar em 2013, e o próprio
    já apontou Gemmell como influência direta e herói pessoal.

- id: john-gwynne/journeys
  synopsis: >
    Uma antologia de fantasia de vários autores, editada por Teresa Edgerton
    para a Woodbridge Press; a contribuição de Gwynne é "The Sundering."

- id: john-gwynne/art-of-war
  synopsis: >
    Uma antologia de fantasia militar de vários autores, editada por Petros
    Triantafyllou para a BookNest.eu; a contribuição de Gwynne é "The
    Greatest Battle."

- id: john-gwynne/unfettered-iii-new-tales-by-masters-of-fantasy
  synopsis: >
    Uma antologia de caridade editada por Shawn Speakman para a Grim Oak
    Press, cujas receitas apoiam autores a braços com despesas médicas; a
    contribuição de Gwynne, "The Heir Apparent," está classificada pela
    ISFDB como pertencente a The Faithful and the Fallen.

- id: john-gwynne/the-scent-of-tears
  synopsis: >
    Uma antologia "Tales of the Apt" editada por Adrian Tchaikovsky para a
    NewCon Press, passada no próprio mundo de Tchaikovsky, Shadows of the
    Apt - e não nas Banished Lands nem em The Bloodsworn Saga; a
    contribuição de Gwynne é "The Message."
