# Português europeu (pt-PT) - sobreposição de prosa curada.
# Traduz-se apenas prosa. Nunca ids, slugs, nomes de autor, títulos de obra
# (já são portugueses) nem URLs de fontes. globalEvents (a decisão de incluir
# berne-convention-1886 e excluir elementary-education-act-1870) é uma lista
# de decisões, não prosa para o leitor, e fica de fora desta sobreposição.

- id: eca-de-queiros
  description: >
    O maior romancista realista português do século XIX: nove livros numa
    vida de escrita de vinte e oito anos, do folhetim policial simulado de
    1870 [[work:eca-de-queiros/o-misterio-da-estrada-de-sintra|O Mistério da
    Estrada de Sintra]] até
    [[work:eca-de-queiros/os-maias|Os Maias]] (1888), escrito em grande parte
    a partir da secretária de um cônsul português em Newcastle, Bristol e,
    por fim, Paris - seguido de uma segunda bibliografia, muito mais extensa,
    reunida a partir dos seus papéis pelo filho e por editores académicos,
    que vai de [[work:eca-de-queiros/a-cidade-e-as-serras|A Cidade e as
    Serras]] (1901) a um volume de obra dispersa ainda inédita publicado em
    2023.
