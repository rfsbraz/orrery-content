# Português europeu (pt-PT) - sinopses. Os títulos NÃO são traduzidos: já são
# os originais portugueses (proibido pelo próprio validador em works.yaml).
# As notas de curadoria (`note:`) ficam na língua de base - são anotações
# editoriais, não prosa para o leitor. A sinopse de os-maias e de
# a-tragedia-da-rua-das-flores param deliberadamente no limite de revelação
# já estabelecido na versão inglesa (ver a nota de cada entrada na base); a
# tradução mantém esse mesmo limite, sem reintroduzir o que ali ficou por
# dizer. A frase entre aspas na sinopse de alves-e-companhia ("country of
# mild habits" na base) é "país de brandos costumes", a expressão
# portuguesa consagrada e popularmente associada a Eça, não uma tradução
# literal à letra.

- id: eca-de-queiros/o-misterio-da-estrada-de-sintra
  synopsis: >
    Dois amigos são raptados na estrada de regresso de Sintra e acordam numa
    casa com um cadáver. Serializado no Diário de Notícias como 66
    verdadeiras "cartas ao director", com o próprio director do jornal a par
    da farsa, convenceu grande parte de Lisboa de que estava a ler um crime
    real à medida que acontecia; considerado o primeiro romance policial
    português. Carlos Fradique Mendes, a persona satírica que Eça tinha
    co-inventado dois anos antes, aparece como personagem.

- id: eca-de-queiros/o-crime-do-padre-amaro
  synopsis: >
    Um jovem padre colocado na provinciana Leiria envolve-se numa relação
    com uma paroquiana devota, e a pequena sociedade eclesiástica local
    fecha-se sobre as consequências. Primeiro romance de Eça e texto
    fundador do realismo literário português, escrito enquanto era
    administrador do concelho na mesma cidade onde o livro se passa.

- id: eca-de-queiros/o-primo-basilio
  synopsis: >
    Uma entediada esposa lisboeta envolve-se com o primo que a visita
    enquanto o marido está fora em negócios, e o caso é exposto por uma
    criada intrigante. Deu à língua portuguesa a palavra "acaciano", a
    partir do Conselheiro Acácio do romance, para um discurso pomposo,
    empolado e vazio de conteúdo.

- id: eca-de-queiros/o-mandarim
  synopsis: >
    A um pobre funcionário público dizem que tocar uma campainha matará um
    mandarim invisível na China e lhe entregará a fortuna do morto - e ele
    toca-a. Uma fábula fantástica, escrita em Bristol, sobre a leveza
    corruptora do dinheiro que não custa nada a quem o obtém.

- id: eca-de-queiros/a-reliquia
  synopsis: >
    Um jovem hipócrita viaja até à Terra Santa à espera de herdar da tia
    devota, e sonha-se para dentro de uma versão cómica e blasfema da
    Paixão que pode fazer passar por piedade. Rascunhado depois da viagem
    do próprio Eça ao Egipto e à Palestina em 1869-70, mas guardado dezassete
    anos antes de publicado.

- id: eca-de-queiros/os-maias
  synopsis: >
    Três gerações de uma família lisboeta desfazem-se entre dinheiro antigo,
    Romantismo fora de moda e uma paixão avassaladora em que o neto Carlos
    se envolve com uma mulher recém-chegada e misteriosa - um retrato,
    através de uma só família, da hipocrisia e da complacência da própria
    alta sociedade lisboeta. Concebido já em 1878, escrito em grande parte
    durante o consulado de Eça em Bristol e publicado no ano em que partiu
    para Paris; amplamente considerado o maior romance realista português.

- id: eca-de-queiros/uma-campanha-alegre
  synopsis: >
    Dois volumes das colunas satíricas que o próprio Eça escreveu para As
    Farpas em 1871-72, sobre religião, jornalismo, política e literatura -
    a sua parte do mensário co-escrito, reunida sob o seu único nome dezoito
    anos depois de ter deixado de o escrever.

- id: eca-de-queiros/a-correspondencia-de-fradique-mendes
  synopsis: >
    Uma biografia admirativa e dezassete cartas, apresentadas como editadas
    por um amigo, dando uma vida completa a Carlos Fradique Mendes: rico
    poeta açoriano, viajante incansável, e a persona satírica que Eça,
    Antero de Quental e Jaime Batalha Reis tinham inventado como brincadeira
    trinta anos antes. Eça trabalhou a personagem a partir de 1885 como "um
    romance de género especial, didáctico, não dramático".

- id: eca-de-queiros/a-ilustre-casa-de-ramires
  synopsis: >
    Um fidalgo do campo, financeiramente apertado, escreve um romance
    histórico a glorificar os seus próprios antepassados medievais enquanto
    negoceia o casamento da irmã por vantagem política em casa - um
    retrato, através de uma só família, dos compromissos que Eça via por
    baixo da própria decadência de Portugal.

- id: eca-de-queiros/a-cidade-e-as-serras
  synopsis: >
    Um abastado expatriado português, saciado de todas as comodidades
    mecânicas que o Paris de 1890 pode oferecer, recolhe-se à propriedade
    rústica de montanha da família em Tormes e encontra uma vida que não
    sabia que lhe fazia falta. O último livro que Eça terminou, escrito
    entre 1892 e a sua morte em 1900.

- id: eca-de-queiros/contos
  synopsis: >
    A ficção curta de Eça, escrita para jornais e revistas entre 1874 e
    1898 e reunida num só volume depois da sua morte: entre elas
    Singularidades de uma Rapariga Loura, um namoro desiludido; José
    Matias, um estudo tragicómico do amor platónico contado inteiramente
    através daquilo que uma audiência de jantar não deixa de interromper; O
    Defunto e A Perfeição; e O Suave Milagre, uma lenda em que Cristo desce
    da cruz para salvar a mentira honesta de um estranho.

- id: eca-de-queiros/prosas-barbaras
  synopsis: >
    Os escritos mais antigos de Eça: prosas poéticas impressionistas e
    líricas publicadas na Gazeta de Portugal durante os seus anos de
    Coimbra e reunidas em livro, muito depois da sua morte, pelo seu amigo
    do Cenáculo Jaime Batalha Reis.

- id: eca-de-queiros/cartas-de-inglaterra
  synopsis: >
    A coluna "Cartas de Londres" que Eça escreveu para o Diário de
    Notícias, enviada durante os seus anos consulares em Inglaterra,
    reunida em livro depois da sua morte.

- id: eca-de-queiros/ecos-de-paris
  synopsis: >
    Jornalismo escrito a partir de Paris durante o último posto consular de
    Eça, reunido em livro depois da sua morte.

- id: eca-de-queiros/cartas-familiares-e-bilhetes-de-paris
  synopsis: >
    Mais cartas e pequenos avisos de Paris, reunidos em livro depois da sua
    morte.

- id: eca-de-queiros/notas-contemporaneas
  synopsis: >
    Ensaios e textos críticos sobre política, cultura e vida pública
    portuguesas, reunidos em livro depois da sua morte.

- id: eca-de-queiros/ultimas-paginas
  synopsis: >
    Fragmentos e textos inacabados reunidos depois da sua morte, entre eles
    "São Cristóvão", uma lenda inacabada do gigante que transporta viajantes
    através de um rio e um dia transporta o próprio Cristo, traduzida para
    inglês apenas em 2015 como "Saint Christopher".

- id: eca-de-queiros/a-capital
  synopsis: >
    Um jovem provinciano chega a Lisboa para fazer fortuna e encontra a
    capital tão moralmente comprometedora como qualquer lugar que deixou.
    Escrito em 1877-78 e deixado inacabado; preparado para publicação pelo
    filho de Eça décadas depois da sua morte.

- id: eca-de-queiros/o-conde-de-abranhos
  synopsis: >
    Uma biografia ficcional bajuladora, "escrita" pelo próprio secretário
    dedicado do político falecido, Z. Zagalo, de Alípio Abranhos - uma
    caricatura que reúne os vícios de todos os políticos portugueses do
    século XIX numa só carreira inventada. Escrito em 1879.

- id: eca-de-queiros/alves-e-companhia
  synopsis: >
    Um comerciante lisboeta descobre o adultério da mulher, enfurece-se, e
    depois - uma vez que arruinar o caso se revela mais inconveniente do
    que ignorá-lo - convence-se a perdoar em vez disso. Uma sátira pequena
    e precisa de um "país de brandos costumes" que encontra vantagem no
    ridículo assim que o escândalo tem preço. Escrito em 1884.

- id: eca-de-queiros/o-egipto
  synopsis: >
    Notas de viagem e jornalismo da viagem de Eça ao Egipto em 1869, para a
    abertura do Canal do Suez, reunidos em livro depois da sua morte.

- id: eca-de-queiros/correspondencia
  synopsis: >
    84 cartas pessoais de Eça - a maioria a Ramalho Ortigão e a Oliveira
    Martins, com outras aos condes de Arnoso, Ficalho e Sabugosa, a Luís de
    Magalhães, Mariano Pina, Alberto de Oliveira e Camilo Castelo Branco -
    selecionadas "pela elegância da forma ou pelos assuntos que tratam" e
    prefaciadas pelo filho José Maria.

- id: eca-de-queiros/cartas-ineditas-de-fradique-mendes
  synopsis: >
    Mais cartas inéditas e páginas na voz de Carlos Fradique Mendes,
    reunidas em livro depois da morte de Eça.

- id: eca-de-queiros/eca-de-queiros-entre-os-seus-cartas-intimas
  synopsis: >
    A correspondência pessoal e privada do próprio Eça com família e
    amigos, editada em livro por outros pouco menos de meio século depois
    da sua morte.

- id: eca-de-queiros/dicionario-de-milagres
  synopsis: >
    Um dicionário alfabético de lendas de milagres cristãos que Eça
    planeou e deixou inacabado à sua morte - só existem as entradas para as
    letras A e B. Negociou o manuscrito diretamente com o editor A. M.
    Pereira antes de morrer; a "Parceria" publicou o material existente
    postumamente.

- id: eca-de-queiros/textos-de-imprensa
  synopsis: >
    O jornalismo de Eça, reunido volume a volume - um por cada publicação
    periódica para que escreveu - décadas depois de ter saído na imprensa:
    para a Revista de Portugal (1995, e de novo em 2024), a Gazeta de
    Notícias (2002), a Gazeta de Portugal (2004), a Revista Moderna (2005)
    e a imprensa do Distrito de Évora (2019).

- id: eca-de-queiros/contos-vol-ii
  synopsis: >
    Quatro histórias mais deixadas na oficina em diferentes estados de
    conclusão - "A Catástrofe", "Um Dia de Chuva", "Enghelberto" e "Sir
    Galahad" - reunidas como segundo volume ao lado do primeiro
    [[work:eca-de-queiros/contos|Contos]] (1902). Três já tinham aparecido
    de forma avulsa em edições preparadas pelos seus filhos (1925, 1929,
    1966); este volume reedita as quatro a partir dos manuscritos.

- id: eca-de-queiros/cartas-publicas
  synopsis: >
    Textos a que Eça deliberadamente deu forma epistolar para publicação
    na imprensa, em Portugal e no estrangeiro, ao longo de toda a vida de
    escrita - as suas "cartas abertas" públicas, reunidas pela primeira vez
    e distintas da sua correspondência privada.

- id: eca-de-queiros/almanaques-e-outros-dispersos
  synopsis: >
    Textos escondidos, perdidos ou esquecidos em almanaques e publicações
    periódicas para que Eça escreveu ao longo da carreira, reunidos num só
    volume pela investigadora Irene Fialho como parte da edição crítica
    "Edição Crítica das Obras de Eça de Queirós".

- id: eca-de-queiros/lendas-de-santos
  synopsis: >
    Três narrativas sobre santos que Eça deixou por publicar e, segundo os
    próprios editores, inacabadas na intenção - reconstruídas tão fielmente
    quanto os rascunhos sobreviventes permitem, 123 anos depois da sua
    morte, como 21.º volume da "Edição Crítica das Obras de Eça de
    Queirós".

- id: eca-de-queiros/a-tragedia-da-rua-das-flores
  synopsis: >
    Uma mulher casada lisboeta abandona o filho recém-nascido para fugir
    com um amante, e desaparece da vida da família. Décadas depois, de
    volta à cidade sob outro nome, torna-se a obsessão avassaladora de um
    jovem com metade da sua idade. Escrito em 1877-78, antes de O Crime do
    Padre Amaro chegar à letra impressa, e deixado em manuscrito durante
    mais de um século.
