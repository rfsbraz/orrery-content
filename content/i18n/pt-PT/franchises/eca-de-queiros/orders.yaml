# Português europeu (pt-PT) - ordem de leitura adicional: `name` + `rationale`
# (prosa). id, type, source, orderedWorkIds e sources nunca se traduzem.

- id: eca-de-queiros/trilogia-do-ultimo-eca
  name: A trilogia do último Eça
  rationale: >
    Os três livros que a crítica nomeia como uma unidade:
    [[work:eca-de-queiros/a-correspondencia-de-fradique-mendes|A
    Correspondência de Fradique Mendes]],
    [[work:eca-de-queiros/a-ilustre-casa-de-ramires|A Ilustre Casa de
    Ramires]] (ambas de 1900) e
    [[work:eca-de-queiros/a-cidade-e-as-serras|A Cidade e as Serras]]
    (1901). Cada um é autónomo, sem enredo ou personagens partilhadas, pelo
    que nada aqui é uma história a seguir estritamente em sequência - o
    agrupamento é estilístico e temático, não narrativo. Leia-a em vez da
    estante completa de nove livros de vida se quiser o período tardio,
    compacto e de despedida, a que Carlos Reis chama a "deriva
    pós-naturalista", sem se comprometer com os romances de sátira social
    anteriores à sua volta. Esta ordem coincide exatamente com a ordem
    derivada por defeito para estas três obras; o seu único contributo é
    nomear e isolar o agrupamento tardio já fundamentado em fontes como um
    fio percorrível à parte dos outros seis livros de vida à sua volta.
