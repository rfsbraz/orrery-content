# Português europeu (pt-PT) - acontecimentos específicos da coleção (o que
# aconteceu aos LIVROS; a vida do autor está em content/i18n/pt-PT/authors/).
# Nenhuma destas cinco entradas tem organisation: epigraph, pelo que nenhuma
# carrega um campo `quote` a traduzir. A citação de José Saramago sobre Os
# Maias ("the greatest book by Portugal's greatest novelist") não tem
# original português localizado apesar de pesquisa dirigida - traduzida de
# novo como qualquer outra prosa, tal como já feito nesta coleção para
# citações sem original recuperável (ver a nota da sobreposição de
# jose-saramago/events.yaml).

- id: eca-de-queiros-crime-do-padre-amaro-contested-birth-1875
  title: O texto de O Crime do Padre Amaro demora cinco anos a assentar
  description: >
    [[work:eca-de-queiros/o-crime-do-padre-amaro|O Crime do Padre Amaro]]
    chegou à letra impressa por acidente: Eça enviou um rascunho a amigos que
    dirigiam uma revista literária à espera de receber as provas para
    corrigir, e estes serializaram-no sem revisão em 1875. Alguns críticos
    chamaram-lhe "romance de vanguarda", mas também atraiu acusações,
    repetidas mais tarde por Machado de Assis a partir do Brasil, de que
    imitava demasiado de perto La Faute de l'Abbé Mouret, de Émile Zola, e
    jornais católicos em Portugal e no Brasil atacaram-no como um escândalo.
    A revisão do próprio Eça em 1876 passou em grande parte despercebida. Só
    depois de [[work:eca-de-queiros/o-primo-basilio|O Primo Basílio]] o
    tornar famoso em 1878 é que voltou ao livro e produziu o texto
    definitivo de 1880 que hoje se lê e traduz - a versão que a maioria dos
    leitores conhece era, na verdade, a terceira.

- id: eca-de-queiros-primo-basilio-machado-critique-1878
  title: Machado de Assis discorda a partir do Brasil, e o Brasil vira-se contra Machado
  description: >
    Os críticos portugueses saudaram
    [[work:eca-de-queiros/o-primo-basilio|O Primo Basílio]] como um marco:
    Teófilo Braga colocou o seu ofício ao nível de Balzac, Flaubert e Zola, e
    Guerra Junqueiro pôs Eça diretamente ao lado de Balzac. Do Rio de
    Janeiro, Machado de Assis discordou publicamente. Num ensaio de 1878,
    argumentou que o dispositivo central do enredo (uma criada chantagista
    que intercepta por acaso as cartas incriminatórias) era demasiado
    forçado para justificar a morte da heroína, avisou que o realismo
    "intenso e completo" de Eça resvalava para o sensacionalismo e, de
    passagem, repetiu a acusação de que O Crime do Padre Amaro imitava Zola.
    O ensaio custou a Machado o respeito de críticos brasileiros que já
    tinham abraçado Eça, e continua citado como o momento em que o maior
    romancista brasileiro mediu o seu próprio realismo emergente contra o
    português e encontrou uma discordância real, não uma cortesia.

- id: eca-de-queiros-1925-posthumous-wave
  title: Um quarto de século numa gaveta, três livros no mesmo ano
  description: >
    Vinte e cinco anos após a morte de Eça, três manuscritos muito
    diferentes chegaram à letra impressa no mesmo ano:
    [[work:eca-de-queiros/alves-e-companhia|Alves & Companhia]] (escrito em
    1884), [[work:eca-de-queiros/o-conde-de-abranhos|O Conde de Abranhos]]
    (escrito em 1879) e
    [[work:eca-de-queiros/a-capital|A Capital]], o romance inacabado que o
    filho José Maria completou para publicação. O mesmo ano viu ainda
    [[work:eca-de-queiros/correspondencia|Correspondência]], 84 das suas
    cartas selecionadas e prefaciadas por esse mesmo filho. É o maior
    agrupamento isolado da bibliografia póstuma, o momento em que a própria
    família de Eça terminou de esvaziar a gaveta, e não uma coincidência de
    editores sem relação entre si.

- id: eca-de-queiros-tragedia-rua-das-flores-1980
  title: O romance que o próprio Eça nunca ousou publicar chega à letra impressa, depois ao palco e ao ecrã
  description: >
    Eça escreveu [[work:eca-de-queiros/a-tragedia-da-rua-das-flores|A
    Tragédia da Rua das Flores]] em 1877-78, antes mesmo de O Crime do Padre
    Amaro chegar à letra impressa, e deixou-o em manuscrito pelo resto da
    vida; o seu enredo, o caso amoroso de um jovem com uma mulher que se
    revela ser a mãe que o abandonou em bebé, é a razão mais provável para
    nunca o ter enviado ele próprio a um editor. Só apareceu em livro em
    1980, oitenta anos após a sua morte, e teve êxito suficiente para ser
    adaptado à televisão portuguesa no ano seguinte (1981, com Lourdes
    Norberto e Antonino Solmer) e ao palco no ano a seguir a esse (1982, com
    Simone de Oliveira). Um romance perigoso demais para a vida do seu
    próprio autor encontrou um público entusiasta dentro de dois anos de lhe
    ser finalmente permitido existir.

- id: eca-de-queiros-jull-costa-maias-2007
  title: Uns novos Maias em inglês, e Saramago chama-lhe a maior obra de Portugal
  description: >
    A tradução inglesa de Margaret Jull Costa de
    [[work:eca-de-queiros/os-maias|Os Maias]] foi publicada pela Dedalus em
    2007, uma das que se tornariam sete retraduções de Eça no programa de
    clássicos portugueses da Dedalus (Cousin Bazilio em 2003 até The City
    and the Mountains em 2008) - a razão pela qual a maior parte dos
    romances de vida de Eça continua hoje disponível em inglês. José
    Saramago descreveu o romance original como "o maior livro do maior
    romancista de Portugal": um Nobel português, a trabalhar na mesma
    tradição realista, a pôr o seu nome atrás do escritor que o precedeu.
