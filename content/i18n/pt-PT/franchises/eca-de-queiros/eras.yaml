# Português europeu (pt-PT) - período criativo.
# Traduzem-se o título (aqui mantido, já é a forma recebida em português - ver
# a nota da própria era.yaml de base), os temas e a descrição. `note` fica na
# língua de base: é anotação de curadoria, não prosa para o leitor.

- id: o-ultimo-eca
  title: "O Último Eça"
  themes: [fradiquismo, deriva pós-naturalista, idealismo filosófico, um estilo tardio de despedida]
  description: >
    Os últimos doze anos da vida de Eça, a que uma linhagem dedicada da
    crítica de língua portuguesa chama "o último Eça" e que Carlos Reis,
    citado na Iniciação à Eça de Tolomei, descreve como uma "deriva
    post-naturalista" - um afastamento da sátira social da sua ficção
    anterior. Abre depois de
    [[work:eca-de-queiros/os-maias|Os Maias]] (1888), o seu último romance
    realista concluído, e percorre a "trilogia do último Eça" que fecha a
    sua carreira: [[work:eca-de-queiros/a-correspondencia-de-fradique-mendes|A
    Correspondência de Fradique Mendes]] e
    [[work:eca-de-queiros/a-ilustre-casa-de-ramires|A Ilustre Casa de
    Ramires]] (ambas de 1900), e
    [[work:eca-de-queiros/a-cidade-e-as-serras|A Cidade e as Serras]],
    terminado à sua morte e publicado em 1901. Ao longo da década
    intermédia, o próprio Fradique Mendes foi reinventado como personagem de
    ficção a partir de cerca de 1885, e o satirista de
    [[work:eca-de-queiros/o-primo-basilio|O Primo Basílio]] dá lugar a algo
    mais próximo do idealismo.
