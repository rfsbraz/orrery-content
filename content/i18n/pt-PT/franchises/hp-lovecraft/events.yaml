# Português europeu (pt-PT) - eventos da franquia. title e description
# traduzidos para todas as 11 entradas.
#
# CITAÇÕES VERBATIM: onde a description de base cita as palavras exatas de
# uma pessoa real, entre aspas (Edmund Wilson, Sonia Greene, S. T. Joshi,
# Nnedi Okorafor, Daniel José Older, o board do World Fantasy Award, o
# título do ensaio de Wilson), essa citação fica em inglês, verbatim,
# seguindo a mesma regra já registada em authors/hp-lovecraft.yaml.
#
# TÍTULOS DE OBRAS: Supernatural Horror in Literature usa o título da edição
# portuguesa (O Terror Sobrenatural na Literatura, Vega, 2006 - ver
# editions.yaml); as restantes obras referidas não têm edição portuguesa e
# mantêm o título inglês.

- id: arkham-house-founded-1939
  title: Dois amigos inventam uma editora para o manter em circulação
  description: >
    Poucos meses depois da morte de Lovecraft, August Derleth e Donald
    Wandrei decidem reunir a melhor ficção dele publicada em revistas num
    volume memorial, e não conseguem interessar uma única editora de capa
    dura. Constroem então a sua própria: a Arkham House, de Sauk City,
    Wisconsin, batizada com o nome da cidade do Massachusetts que ele tinha
    inventado, fundada em 1939 com o único propósito de publicar toda a
    obra de Lovecraft em capa dura. The Outsider and Others chega a mais de
    550 páginas de letra miúda sob uma capa de Virgil Finlay, vendida a
    5,00 dólares, com encomendas antecipadas a 3,50. Reúne 150 encomendas
    antecipadas. É impresso em 1268 exemplares, vendidos devagar e de forma
    constante enquanto Derleth subsidiava a editora com os próprios
    rendimentos como escritor profissional, esgota-se no início de 1944 e
    nunca mais voltou a ser reeditado nessa forma. Toda a fase posterior da
    reputação de Lovecraft, incluindo a investigação académica, passa por
    este livro.

- id: beyond-the-wall-of-sleep-omnibus-1943
  title: O segundo volume-ómnibus, e a razão de tanta desta estante estar datada de 1943
  description: >
    O segundo volume-ómnibus de Lovecraft da Arkham House sai em 1943, já
    com a editora mais firme, e é a razão pela qual um conjunto de obras
    desta bibliografia leva essa data: foi a primeira vez que chegou a
    público muita coisa que nunca tinha sido publicada, incluindo
    [[work:hp-lovecraft/the-dream-quest-of-unknown-kadath|The Dream-Quest
    of Unknown Kadath]], terminada em 1927 e guardada numa gaveta. No mesmo
    ano, Winfield Townley Scott, editor literário do Providence Journal,
    defendeu no seu próprio jornal que Lovecraft era um dos escritores
    mais significativos de Rhode Island e que o desinteresse da crítica
    dominante por ele era lamentável: a primeira defesa sustentada vinda de
    um jornal de referência, dois anos antes do ataque mais célebre.

- id: edmund-wilson-demolition-1945
  title: O crítico da New Yorker chama-lhe mau gosto e má arte
  description: >
    A 24 de novembro de 1945, Edmund Wilson, então o crítico literário mais
    poderoso da América, faz a crítica dos volumes da Arkham House na The New
    Yorker, sob o título "Tales of the Marvellous and the Ridiculous", e
    escreve que "the only real horror in most of these fictions is the
    horror of bad taste and bad art". Admite, no mesmo artigo, que
    Lovecraft escrevia sobre o seu campo "with much intelligence",
    destacando
    [[work:hp-lovecraft/supernatural-horror-in-literature|O Terror
    Sobrenatural na Literatura]]. O ensaio foi reunido em Classics and
    Commercials (1950) e reeditado em H. P. Lovecraft: Four Decades of
    Criticism (1980), e definiu os termos da discussão sobre o estatuto de
    Lovecraft para o meio século seguinte: a maior parte dos argumentos
    posteriores a favor de o levar a sério são, em alguma medida, respostas
    a ele. L. Sprague de Camp registou que Wilson suavizou depois a
    posição, e que foi encontrado a ler as cartas reunidas de Lovecraft.

- id: derleth-mythos-1945
  title: Derleth batiza os Mitos de Cthulhu, e reconstrói-os como o bem contra o mal
  description: >
    O termo "Cthulhu Mythos" é de August Derleth, não de Lovecraft. Além de
    publicar a obra, Derleth sistematizou-a: organizou as entidades em
    categorias elementares, inventou uma classe de "Elder Gods" benignos,
    colocados contra elas, e transformou um corpo de ficção cujo sentido
    inteiro era a insignificância humana numa luta entre o bem e o mal.
    Trabalhou também fragmentos do caderno de apontamentos de Lovecraft até
    os transformar em novas histórias, publicando-as sob os dois nomes como
    "colaborações póstumas", a começar pelo romance The Lurker at the
    Threshold, em 1945. A investigação posterior separa as duas camadas:
    Richard L. Tierney cunhou o termo "Derleth Mythos" para a segunda, e o
    relato de Robert M. Price sobre os Mitos trata a versão do próprio
    Lovecraft e a de Derleth como fases distintas, com regras distintas.
    Esta ala inclui as 25 histórias dos Mitos que são de Lovecraft, e
    nenhuma das continuações de Derleth.

- id: sonia-greene-memoir-providence-journal-1948
  title: A mulher publica o seu relato do casamento, no jornal da própria cidade dele
  description: >
    Sob a assinatura Sonia H. Davis, "the former Mrs. H. P. Lovecraft", o
    Providence Sunday Journal de 22 de agosto de 1948 dedicou ao seu
    memorial do casamento duas páginas inteiras da secção de livros.
    Continua a ser o único relato em primeira mão sustentado de Lovecraft
    por um adulto que viveu com ele, e boa parte do que é hoje dado como
    assente sobre ele chegou a público ali pela primeira vez: as tias a
    enviarem 5 dólares por semana dos 15 que lhe eram devidos da herança da
    própria família, a recusa dele em ver um médico por pior que estivesse,
    a sua frase "It is more important to know what to hate than it is to
    know what to love", e a afirmação direta dela de que foi a atitude dele
    em relação às minorias e o desejo de se afastar delas que o levou de
    volta a Providence. O próprio editor de livros do jornal apresentou o
    texto como "an article of the very first importance" na área. Foi
    reeditado, ampliado, como The Private Life of H. P. Lovecraft, em 1985.

- id: lovecraft-estate-and-the-john-hay-papers-1951
  title: Quem acabou por ficar dono dos papéis
  description: >
    Lovecraft nomeou R. H. Barlow, então mal saído da adolescência, seu
    executor literário; a instrução nunca chegou a entrar no testamento,
    mas a tia sobrevivente cumpriu na mesma a sua vontade. Barlow depositou
    o grosso dos papéis, incluindo a vasta correspondência, na John Hay
    Library da Universidade Brown, razão pela qual o arquivo existe, e
    tratou de organizar o resto. Derleth e Wandrei, mais velhos e muito
    mais estabelecidos, alegaram que era Derleth o verdadeiro executor. Não
    era. Barlow cedeu, e depois da sua morte, em 1951, os dois ficaram com
    controlo total do corpus. A posição de direitos de autor construída
    sobre isso não se sustenta: buscas na Library of Congress não
    encontraram qualquer prova de que os direitos tenham sido renovados
    após o prazo inicial de 28 anos, e a biografia de Joshi chama às
    alegações de Derleth "almost certainly fictitious". Um espólio
    reconstituído reivindica a propriedade desde 1998, e os investigadores
    contestam-no; na prática, a obra é tratada como domínio público, razão
    pela qual os Mitos se tornaram um espaço comum onde qualquer um podia
    escrever.

- id: lovecraft-arrives-in-france-1954
  title: É a França quem primeiro o leva a sério
  description: >
    No outono de 1954, a nova coleção de ficção científica da Denoël,
    Présence du futur, publica, como quarto título, La Couleur tombée du
    ciel: quatro contos traduzidos por Jacques Papy, com introdução de
    Jacques Bergier, um físico nuclear que tinha correspondido com
    Lovecraft e passara vinte anos a tentar interessar um editor francês
    nele. Foi a primeira coletânea de Lovecraft publicada em França, e a
    imprensa francesa tratou-a como um acontecimento literário, não como
    pulp importado. A Paris-Match noticiou-a em outubro de 1954, dezassete
    anos depois da sua morte, e o enquadramento que ficou foi o de que
    Lovecraft, tal como Poe um século antes dele, tinha ido a França buscar
    o reconhecimento que a América não lhe dava. Nenhuma editora literária
    americana o publicaria durante mais meio século.

- id: the-shuttered-room-closes-the-archive-1959
  title: As histórias que escreveu em criança chegam finalmente a público
  description: >
    O quinto volume de Lovecraft da Arkham House, The Shuttered Room and
    Other Pieces (1959, 2527 exemplares), recolheu o que restava dele.
    Entre os memoriais e o caderno de apontamentos anotado, publicou pela
    primeira vez as histórias que ele tinha escrito em criança:
    [[work:hp-lovecraft/the-little-glass-bottle|The Little Glass Bottle]],
    [[work:hp-lovecraft/the-secret-cave-or-john-lees-adventure|The Secret
    Cave]], [[work:hp-lovecraft/the-mystery-of-the-grave-yard|The Mystery
    of the Grave-Yard]] e
    [[work:hp-lovecraft/the-mysterious-ship|The Mysterious Ship]], escritas
    entre cerca dos sete e dos catorze anos. É por isso que cinco entradas
    desta bibliografia têm uma data de primeira publicação mais de meio
    século depois de terem sido escritas, e é este volume que fecha os
    vinte e dois anos de primeiras publicações póstumas iniciados com The
    Outsider and Others. O volume trazia ainda duas histórias novas que
    Derleth construiu a partir dos apontamentos de Lovecraft e apresentou
    como colaborações póstumas; Damon Knight resenhou o conjunto
    desfavoravelmente na F&SF.

- id: world-fantasy-award-howard-1975
  title: O género batiza com o seu nome a sua mais alta distinção
  description: >
    A primeira World Fantasy Convention realizou-se em Providence, em
    1975, sob o tema "The Lovecraft Circle", e o prémio então fundado
    entregava aos vencedores um troféu com a forma de um busto-caricatura
    alongado de Lovecraft, da autoria do cartoonista Gahan Wilson,
    apelidado "the Howard". Trinta e oito anos depois de morrer
    desconhecido fora das revistas pulp, a sua cabeça passou a ser um dos
    três prémios mais prestigiados da fantasia e da ficção científica, ao
    lado do Hugo e do Nebula. A primeira objeção veio de um amigo: em
    1984, Donald Wandrei, cofundador da Arkham House e que tinha conhecido
    Lovecraft pessoalmente, recusou o seu prémio de Carreira por
    considerar o busto uma caricatura degradante.

- id: library-of-america-canonises-lovecraft-2005
  title: Primeiro a Penguin Classics, depois a Library of America
  description: >
    S. T. Joshi editou três volumes de Lovecraft para a Penguin Classics
    entre 1999 e 2004, trabalhando a partir dos manuscritos e não dos
    textos corrompidos da Arkham House. Em fevereiro de 2005, a Library of
    America publicou Tales, vinte e dois contos escolhidos pelo romancista
    Peter Straub, colocando Lovecraft na mesma prateleira que Melville,
    James e Wharton. Vendeu 25 000 exemplares no primeiro mês e foi
    objeto de crítica no New York Times Book Review e no Wall Street Journal. A
    resposta foi mista, não triunfal - Malcolm Jones, da Newsweek,
    apresentou-a como prova de que a Library of America estava a ficar sem
    escritores, enquanto o Buffalo News lhe chamou "one of the Library of
    America's happiest and most perverse moments" - mas o próprio volume
    inverteu o juízo estabelecido de que Lovecraft ficava fora do cânone
    americano, e investigadores como Joshi e Alison Sperling tratam-no como
    o momento em que a questão ficou resolvida.

- id: world-fantasy-award-retires-the-bust-2015
  title: O prémio retira-lhe o rosto do troféu
  description: >
    Em dezembro de 2011, Nnedi Okorafor, que tinha vencido o World Fantasy
    Award de melhor romance nesse ano, escreveu sobre a descoberta dos
    versos racistas que Lovecraft tinha escrito em 1912, e sobre o seu
    sentimento contraditório de que "a statuette of this racist man's head
    is one of my greatest honours as a writer"; China Miéville, ao
    comentar o texto dela, disse praticamente o mesmo. Em 2014, Daniel José
    Older abriu uma petição para mudar o troféu e reuniu cerca de 2500
    assinaturas, a vencedora de melhor romance desse ano, Sofia Samatar,
    defendeu a mesma posição no discurso de aceitação do prémio, e a
    direção respondeu que o assunto estava "in discussion". Na cerimónia de
    2015, em Saratoga Springs, a 8 de novembro, os organizadores anunciaram
    que o busto de Lovecraft deixaria de ser usado. Não deram nenhuma
    razão. Um substituto de Vincent Villafranca, uma árvore contra a lua
    cheia, foi anunciado em 2017.
    A reação dividiu-se pela linha em que se tem dividido desde então.
    Older disse ao Guardian que o género não podia continuar a enaltecer "a
    man who used literature as a weapon against entire races". S. T. Joshi
    - biógrafo de Lovecraft, e editor da maior parte dos textos corrigidos
    que um leitor de hoje efetivamente lê - devolveu os seus dois World
    Fantasy Awards, chamou à decisão "a craven yielding to the worst sort
    of political correctness", e apelou a um boicote à convenção. Lenika
    Cruz, da The Atlantic, argumentou que retirar o busto não era uma
    condenação da obra, e que o alcance de Lovecraft, através de Stephen
    King, Guillermo del Toro e Neil Gaiman, não corria por isso qualquer
    risco.
