# Português europeu (pt-PT) - sinopses.
# Os títulos de obras NÃO são traduzidos aqui (ver docs/SCHEMA.md, "Never
# translate a published title"): um título traduzido só existe como edição,
# em editions.yaml. `note:` também não é traduzido: o campo não é lido pela
# aplicação em Work (só `synopsis` chega ao leitor), a mesma convenção já
# registada em edgar-allan-poe/works.yaml e jo-nesbo/works.yaml. Isto cobre,
# em particular, as notas que documentam conteúdo racista em obras
# específicas (the-rats-in-the-walls, facts-concerning-the-late-arthur-
# jermyn-and-his-family, the-horror-at-red-hook, medusas-coil): ficam de
# fora deste ficheiro por não serem lidas pela aplicação, não por omissão
# editorial - continuam presentes, em inglês, no ficheiro de base.
#
# CUIDADO COM SPOILERS: cinco destas sinopses (the-dunwich-horror,
# the-dream-quest-of-unknown-kadath, the-lurking-fear, celephais,
# winged-death) foram reescritas pela auditoria de spoilers desta ala para
# reter deliberadamente uma revelação de enredo. A tradução segue o inglês
# ATUAL de cada uma, não uma versão anterior nem um conhecimento mais
# completo da história que o tradutor possa ter; nenhum detalhe retido é
# reposto aqui.
#
# Nenhuma sinopse desta ala usa referências inline a outras obras.

- id: hp-lovecraft/the-alchemist
  synopsis: >
    O último herdeiro de uma linhagem nobre amaldiçoada confronta, na torre
    em ruínas do castelo ancestral, a origem da maldição familiar que matou
    todos os condes à mesma idade ao longo de seis séculos. Escrito em
    1908, quando Lovecraft tinha dezassete anos - a sua mais antiga
    história madura sobrevivente.

- id: hp-lovecraft/the-tomb
  synopsis: >
    Um jovem torna-se obcecado por um túmulo de família selado e trancado
    perto de casa, e passa a acreditar que está possuído pelo espírito de
    um antepassado.

- id: hp-lovecraft/dagon
  synopsis: >
    Um marinheiro naufragado, à deriva sobre uma faixa de fundo marinho
    erguida por um terramoto, avista uma criatura imensa e não-humana em
    adoração diante de um monólito esculpido com imagens de um deus do
    mar. Amplamente lido como a semente temática das civilizações
    submarinas e dos cultos de adoração recorrentes nos Mitos posteriores,
    embora não nomeie nenhuma entidade do panteão; ver a nota sobre a
    subsérie Mitos de Cthulhu acima para a razão de ficar sem etiqueta em
    vez de ser assumido para dentro da subsérie.

- id: hp-lovecraft/a-reminiscence-of-dr-samuel-johnson
  synopsis: >
    Um pastiche narrado por um conhecido fictício do lexicógrafo do século
    XVIII, escrito em estilo de época como exercício de prosa georgiana -
    uma de várias peças iniciais que satisfazem o gosto antiquário de
    Lovecraft pelo século XVIII.

- id: hp-lovecraft/polaris
  synopsis: >
    Um sonhador que observa a Estrela Polar de uma torre de vigia antiga
    passa a acreditar que a sua vida em vigília é o sonho, e que uma guerra
    esquecida numa cidade nórdica perdida é a realidade.

- id: hp-lovecraft/beyond-the-wall-of-sleep
  synopsis: >
    Um médico de um asilo usa um aparelho sem fios para entrar nos sonhos
    de um doente assassino, e encontra uma vasta inteligência cósmica
    presa dentro da mente de um homem comum, sem instrução.

- id: hp-lovecraft/memory
  synopsis: >
    Um diálogo muito curto em prosa poética entre um Génio e um Daemon num
    vale em ruínas que outrora foi uma cidade humana, sobre o quão
    completamente uma civilização pode desaparecer da memória do mundo.

- id: hp-lovecraft/old-bugs
  synopsis: >
    Uma parábola cómica da era da Lei Seca, passada num bar clandestino de
    Chicago, em que um antigo poeta decadente avisa um jovem contra a
    bebida que o arruinou. Não publicada em vida de Lovecraft.

- id: hp-lovecraft/the-transition-of-juan-romero
  synopsis: >
    Mineiros de uma mina no sudoeste dos Estados Unidos abrem, com
    explosivos, um poço de profundidade desconhecida, e um trabalhador
    mexicano sofre uma transformação inexplicável na noite em que algo
    responde lá do fundo. Não publicado em vida de Lovecraft.

- id: hp-lovecraft/the-white-ship
  synopsis: >
    Um faroleiro embarca num navio fantasma e viaja por uma série de
    terras oníricas em busca da beleza última, no registo dunsaniano da
    ficção fantástica inicial de Lovecraft.

- id: hp-lovecraft/the-doom-that-came-to-sarnath
  synopsis: >
    A próspera cidade de Sarnath, erguida sobre as ruínas de uma cidade
    mais antiga cujo povo exterminou mil anos antes, é por sua vez
    destruída no aniversário desse massacre.

- id: hp-lovecraft/the-statement-of-randolph-carter
  synopsis: >
    Randolph Carter dá à polícia o seu relato do desaparecimento do amigo
    Harley Warren num cemitério antigo, terminando com uma voz vinda de
    baixo que nunca consegue descrever de forma adequada. Apresenta a
    personagem; baseado, pelo próprio relato de Lovecraft, num sonho.

- id: hp-lovecraft/the-street
  synopsis: >
    Uma história alegórica de uma rua da Nova Inglaterra, desde a fundação
    colonial até ao declínio industrial, traçando as ansiedades de
    Lovecraft sobre imigração e mudança de forma abertamente alegórica, e
    não narrativa.

- id: hp-lovecraft/the-terrible-old-man
  synopsis: >
    Três ladrões planeiam roubar um recluso estranho e muito idoso numa
    vila costeira em decadência, sem saberem o que ele guarda em garrafas
    que oscilam como pêndulos e lhe respondem com vozes minúsculas.

- id: hp-lovecraft/the-cats-of-ulthar
  synopsis: >
    Uma fábula que explica por que razão, por lei antiga, ninguém pode
    matar um gato na vila de Ulthar - depois de um casal idoso e cruel que
    o fez desaparecer, juntamente com todos os gatos do distrito, durante
    uma noite.

- id: hp-lovecraft/the-tree
  synopsis: >
    Dois escultores rivais da Grécia antiga; um morre de doença, e uma
    oliveira de forma estranha cresce da sua sepultura, junto ao estúdio
    do rival.

- id: hp-lovecraft/celephais
  synopsis: >
    Um londrino pobre regressa vezes sem conta, em sonhos, à cidade
    onírica da sua imaginação de infância - o único lugar onde não
    envelheceu, e o único onde ainda quer estar.

- id: hp-lovecraft/from-beyond
  synopsis: >
    A máquina de um cientista estimula a glândula pineal para permitir
    perceber seres que partilham o nosso espaço mas não os nossos
    sentidos - com resultados previsivelmente fatais assim que eles, por
    sua vez, conseguem perceber-nos a nós.

- id: hp-lovecraft/the-temple
  synopsis: >
    O diário de bordo de um comandante de submarino alemão regista a
    desintegração lenta da sua tripulação depois de recuperarem um
    entalhe de marfim do corpo de um afogado, terminando com uma descida
    em direção a uma cidade submersa que brilha lá muito ao fundo. Outro
    antecedente temático amplamente discutido do imaginário de cidades
    submersas dos Mitos, anterior a eles em nome; deixado sem etiqueta
    pela mesma razão que "Dagon" (ver a nota sobre a subsérie acima).

- id: hp-lovecraft/nyarlathotep
  synopsis: >
    Um poema em prosa em que uma figura que se apresenta como Nyarlathotep
    percorre o mundo a demonstrar aparelhos inquietantes, deixando atrás
    de si loucura, agitação e um pavor apocalíptico. Apresenta a entidade
    pelo nome; Lovecraft escreveu mais tarde que lhe surgiu diretamente de
    um sonho.

- id: hp-lovecraft/the-picture-in-the-house
  synopsis: >
    Um ciclista apanhado numa tempestade abriga-se numa quinta isolada da
    Nova Inglaterra, com um ocupante muito idoso e muito estranho, e um
    livro de gravuras que retrata um talho da África central.

- id: hp-lovecraft/facts-concerning-the-late-arthur-jermyn-and-his-family
  synopsis: >
    Um estudioso da história da própria família no comércio com África
    descobre a origem de uma estranheza hereditária que percorre a sua
    linhagem, e reage incendiando-se a si próprio. Publicado inicialmente
    com o título "The White Ape."

- id: hp-lovecraft/the-nameless-city
  synopsis: >
    Um explorador sozinho no deserto da Arábia entra numa vasta cidade
    não-humana, soterrada em areia há incontáveis eras, e encontra provas
    da raça réptil que a construiu. A primeira aparição do "Árabe Louco"
    Abdul Alhazred e do seu dístico ("That is not dead which can eternal
    lie...") - o ponto fixo mais antigo daquilo que viria a ser o
    Necronomicon, embora o livro em si ainda não seja aqui nomeado.

- id: hp-lovecraft/the-quest-of-iranon
  synopsis: >
    Um cantor errante procura a perdida cidade dourada onde nasceu, Aira,
    recusando ao longo do caminho todas as vidas confortáveis e vulgares
    que lhe oferecem - até a verdade sobre o que Aira realmente era o
    alcançar.

- id: hp-lovecraft/the-moon-bog
  synopsis: >
    Um proprietário rural irlandês drena um pântano antigo contra os
    avisos dos habitantes locais, e liberta o que quer que as ruínas
    gregas submersas por baixo dele estivessem destinadas a manter
    contido.

- id: hp-lovecraft/ex-oblivione
  synopsis: >
    Um poema em prosa muito curto sobre o anseio de um sonhador em
    atravessar, definitivamente, um portal num muro que avistou vezes sem
    conta, rumo ao esquecimento final.

- id: hp-lovecraft/the-other-gods
  synopsis: >
    Um sacerdote sobe a montanha sagrada de Hatheg-Kla para ver face a
    face os deuses da terra, contra todos os avisos de que eles a
    abandonaram há muito, ficando ela guardada, em seu lugar, por algo
    completamente diferente.

- id: hp-lovecraft/the-outsider
  synopsis: >
    Um ser que viveu toda a vida de que se recorda sozinho num castelo sem
    luz sobe, por fim, ao mundo exterior à procura de outras pessoas - e
    descobre, numa festa, exatamente que tipo de ser é. Uma das histórias
    de Lovecraft mais reeditadas e mais diversamente interpretadas.

- id: hp-lovecraft/the-music-of-erich-zann
  synopsis: >
    Um estudante hospedado por cima de um tocador de viola mudo apercebe-se
    de que o vizinho toca, à janela da mansarda, uma música cada vez mais
    frenética e alheia a este mundo, todas as noites, para conter algo - e
    de que a própria rua pode não voltar a existir para ser encontrada
    depois.

- id: hp-lovecraft/sweet-ermengarde
  synopsis: >
    Uma paródia cómica exagerada do melodrama piegas de romance rural,
    escrita apenas para divertimento privado e nunca submetida para
    publicação em vida de Lovecraft.

- id: hp-lovecraft/hypnos
  synopsis: >
    Um escultor e o seu companheiro empurram juntos os limites da viagem
    onírica, até que o companheiro vai parar a algum lugar, ou se torna em
    algo, que o narrador se recusa a descrever.

- id: hp-lovecraft/what-the-moon-brings
  synopsis: >
    Um poema em prosa muito curto sobre um jardim que se torna medonho ao
    luar, e um rio que devolve os seus mortos.

- id: hp-lovecraft/azathoth
  synopsis: >
    Um fragmento inacabado, pouco mais do que uma página de abertura,
    descrevendo um homem que procura os sonhos porque o mundo vulgar da
    vigília se tornou demasiado prosaico para suportar. Nomeia o
    "sultão-daemon" Azathoth, o deus cego e idiota no centro da cosmologia
    dos Mitos, mas a história em si nunca chegou a ser continuada.

- id: hp-lovecraft/herbert-west-reanimator
  synopsis: >
    Uma experiência de reanimação numa faculdade de medicina escala ao
    longo de seis episódios, cada cadáver reanimado de forma um pouco mais
    desastrosa do que o anterior. Escrita por encomenda como serial em
    seis partes para uma pequena editora, algo que o próprio Lovecraft
    mais tarde desvalorizou como trabalho alimentar, mas o antecessor
    direto da franquia cinematográfica Re-Animator.

- id: hp-lovecraft/the-hound
  synopsis: >
    Dois profanadores de sepulturas decadentes roubam de uma campa
    holandesa o amuleto de um culto devorador de cadáveres, e são depois
    perseguidos por algo que deixa marcas de patas. A primeira história a
    nomear diretamente o Necronomicon e o seu autor, Abdul Alhazred.

- id: hp-lovecraft/the-lurking-fear
  synopsis: >
    Um investigador acampa durante uma tempestade de relâmpagos no Tempest
    Mountain para descobrir o que tem estado a matar os posseiros à volta
    de uma mansão em ruínas, e vai reconstruindo a história da família
    Martense, que a construiu e depois desapareceu dela.

- id: hp-lovecraft/the-rats-in-the-walls
  synopsis: >
    Um americano restaura o priorado ancestral da família em Inglaterra,
    contra a objeção dos habitantes locais, e, seguindo o som de ratos a
    mover-se dentro das paredes, descobre o que a sua família ali fez,
    durante séculos, na escuridão sob a cripta.

- id: hp-lovecraft/the-unnamable
  synopsis: >
    Dois amigos que discutem se algo pode verdadeiramente estar para além
    de qualquer descrição sentam-se num cemitério assombrado ao anoitecer
    para pôr a questão à prova, com o resultado óbvio.

- id: hp-lovecraft/the-festival
  synopsis: >
    Um homem regressa, como o costume de família obriga uma vez por
    geração, à vila ancestral de Kingsport para um rito secreto de pleno
    inverno - e descobre que os parentes que o esperam não são o que o
    costume de família dava a entender. O Necronomicon surge aqui na
    página, numa longa passagem citada.

- id: hp-lovecraft/the-shunned-house
  synopsis: >
    Uma casa de Providence com um histórico inexplicável de mortes de
    inquilinos é finalmente investigada na cave pelo narrador e pelo tio,
    armados com ácido em vez de superstição.

- id: hp-lovecraft/the-horror-at-red-hook
  synopsis: >
    Um detetive da polícia de Nova Iorque investiga as ligações de um
    diletante endinheirado a um bairro de imigrantes em Brooklyn que
    acredita ser a fachada de um culto oculto antigo.

- id: hp-lovecraft/he
  synopsis: >
    Um recém-chegado a Nova Iorque, já desiludido, é conduzido por um guia
    estranho pelos recantos escondidos mais antigos da cidade, e
    mostra-se-lhe tanto o passado colonial dela como um vislumbre de um
    futuro muito pior. O próprio relato de Lovecraft sobre a sua desilusão
    com Nova Iorque, pouco disfarçado em ficção.

- id: hp-lovecraft/in-the-vault
  synopsis: >
    Um coveiro fechado durante a noite numa câmara mortuária, sem caixões
    utilizáveis suficientes, improvisa uma solução que se vira contra ele.

- id: hp-lovecraft/cool-air
  synopsis: >
    Um hóspede de uma pensão em Nova Iorque torna-se amigo do médico
    excêntrico do andar de cima, que mantém os seus aposentos inexplicável
    e obsessivamente frios, por razões que só se tornam claras quando a
    refrigeração falha.

- id: hp-lovecraft/the-call-of-cthulhu
  synopsis: >
    Um estudioso reúne, a partir dos papéis de um parente falecido, três
    relatos aparentemente desligados entre si - os pesadelos de um
    escultor, uma rusga policial a um culto na Louisiana, e o relato de um
    marinheiro sobre uma ilha de pesadelo erguida do Pacífico -
    transformando-os em prova de uma entidade antiga e adormecida e do
    culto que aguarda o seu regresso. Deu nome a todos os Mitos, embora o
    próprio Lovecraft nunca tenha usado esse nome para eles.

- id: hp-lovecraft/pickmans-model
  synopsis: >
    Um artista conta a um amigo por que razão abandonou abruptamente o
    meio artístico de Boston, depois de uma visita privada às telas mais
    recentes, insuportavelmente realistas, de um pintor marginalizado, no
    seu estúdio escondido no North End. Diz-se mais tarde, noutra obra,
    que esse pintor possuía um exemplar do Necronomicon.

- id: hp-lovecraft/the-strange-high-house-in-the-mist
  synopsis: >
    Um filósofo sobe até uma casa suspensa numa falésia sobre Kingsport, à
    qual mais ninguém se aproxima, para se encontrar com a entidade que se
    diz receber ali visitantes muito antigos.

- id: hp-lovecraft/the-silver-key
  synopsis: >
    Randolph Carter, agora de meia-idade e já incapaz de alcançar os
    mundos oníricos da infância, encontra uma chave de prata entre os
    pertences do avô falecido e desaparece ao usá-la. Amplamente lido
    como a própria meditação de Lovecraft sobre envelhecer para além da
    liberdade imaginativa da infância.

- id: hp-lovecraft/the-dream-quest-of-unknown-kadath
  synopsis: >
    Randolph Carter, que sonhou três vezes com uma maravilhosa cidade ao
    pôr do sol e desde então dela ficou excluído, atravessa todo o mundo
    dos sonhos em busca dos deuses desconhecidos de Kadath, para lhes
    perguntar porquê. A peça de ficção onírica mais longa e sustentada que
    Lovecraft escreveu, composta logo depois do seu regresso a Providence
    em 1926. Nunca submetida para publicação em vida; publicada pela
    primeira vez em 1943.

- id: hp-lovecraft/the-case-of-charles-dexter-ward
  synopsis: >
    Um médico de Providence investiga a história familiar do seu paciente
    depois de um jovem ao seu cuidado ser substituído, aos poucos, por um
    antepassado feiticeiro há muito morto - ressuscitado através de um
    conhecimento que esse antepassado nunca deixou de perseguir para além
    da sepultura. A única obra de Lovecraft com extensão de romance; ele
    próprio considerou-a um fracasso e nunca a submeteu para publicação,
    tendo sido publicada pela primeira vez em 1941, quatro anos depois da
    sua morte.

- id: hp-lovecraft/the-colour-out-of-space
  synopsis: >
    Um meteorito cai numa quinta da Nova Inglaterra e envenena lentamente
    a terra, a água, o gado e a família que ali vive, com algo que se
    comporta como nada na tabela periódica. A preferida do próprio
    Lovecraft entre as suas histórias, segundo a sua própria preferência
    declarada.

- id: hp-lovecraft/the-descendant
  synopsis: >
    Um fragmento inacabado sobre um nobre cuja leitura obsessiva de livros
    proibidos, incluindo o Necronomicon, o deixou aterrorizado por uma
    palavra específica que se recusa a dizer em voz alta. Nunca terminado
    nem intitulado pelo próprio Lovecraft.

- id: hp-lovecraft/the-very-old-folk
  synopsis: >
    Um relato vívido de uma guarnição romana nos Pirenéus destruída depois
    de interferir no rito de pleno inverno de uma tribo das montanhas, que
    existe apenas como excerto de uma carta em que Lovecraft descreve um
    sonho, nunca chegando a ser escrito como história por direito próprio.

- id: hp-lovecraft/history-of-the-necronomicon
  synopsis: >
    Uma breve história bibliográfica, interna ao universo ficcional, do
    Necronomicon - o seu autor, os seus títulos e tradutores em árabe,
    grego e latim, o punhado de cópias sobreviventes e a sua localização -
    que Lovecraft escreveu como referência para si próprio e para os seus
    correspondentes, e não como história.

- id: hp-lovecraft/the-dunwich-horror
  synopsis: >
    Wilbur Whateley, nascido em circunstâncias estranhas numa família
    rural degenerada do Massachusetts e transformado em adulto no espaço
    de uma década, trabalha rumo ao rito que os livros proibidos do avô
    descrevem, enquanto algo mantido entaipado na quinta da família cresce
    a par dele - até estar solto por toda a região, e dois estudiosos da
    Universidade de Miskatonic subirem o Sentinel Hill atrás dele. Contém
    a passagem mais extensa citada do Necronomicon de toda a obra de
    Lovecraft, incluindo o texto "Yog-Sothoth is the key and guardian of
    the gate", depois citado ao longo de toda a ficção dos Mitos.

- id: hp-lovecraft/ibid
  synopsis: >
    Uma paródia de biografia académica de uma figura fictícia da era
    romana, "Ibidus", a brincar com a forma como as citações em notas de
    rodapé acumulam as suas próprias lendas confusas. Não publicada em
    vida de Lovecraft.

- id: hp-lovecraft/the-whisperer-in-darkness
  synopsis: >
    As cartas de um recluso de Vermont a um professor de Miskatonic,
    descrevendo seres alienígenas fungoides a explorar as colinas perto da
    sua quinta, tornam-se progressivamente mais controladas e estranhas,
    terminando num convite que o professor não devia ter aceitado.

- id: hp-lovecraft/at-the-mountains-of-madness
  synopsis: >
    Uma expedição da Universidade de Miskatonic à Antártida descobre, em
    montanhas mais altas do que os Himalaias, os vestígios de uma
    civilização inteligente anterior a toda a vida na Terra por centenas
    de milhões de anos - e o que essa civilização deixou selado nos seus
    túneis mais profundos. Recusado pelo editor da Weird Tales por ser
    demasiado longo e sombrio; só publicado em 1936, cinco anos depois de
    ter sido escrito.

- id: hp-lovecraft/the-shadow-over-innsmouth
  synopsis: >
    A viagem antiquária de um jovem por uma vila piscatória do
    Massachusetts em decadência revela um pacto com décadas de existência
    entre os fundadores da vila e uma raça submarina, os Profundos,
    adoradores de Dagon e Cthulhu - e a contínua miscigenação da vila com
    eles. O seu horror é construído, explicitamente, a partir da
    ansiedade da época sobre a miscigenação racial e as linhagens
    "contaminadas"; uma leitura documentada e amplamente discutida do
    texto, e não um tema incidental.

- id: hp-lovecraft/the-dreams-in-the-witch-house
  synopsis: >
    Um estudante de matemática que aluga uma águas-furtadas de Arkham
    notoriamente assombrada descobre que o seu trabalho de geometria e a
    alegada travessia dimensional de uma bruxa do século XVII podem ser o
    mesmo problema, trabalhado a partir de duas direções.

- id: hp-lovecraft/the-thing-on-the-doorstep
  synopsis: >
    Um homem explica, para justificar ter dado um tiro no seu melhor
    amigo, a campanha de anos da mulher ocultista desse amigo para trocar
    de corpo com ele permanentemente.

- id: hp-lovecraft/the-book
  synopsis: >
    Um fragmento inacabado, um relato em primeira pessoa da aquisição de
    um livro proibido a um livreiro estranho, e da leitura de passagens
    que desancoram a perceção que o narrador tem da divisão à sua volta.
    Possivelmente destinado a ser o companheiro em prosa do poema de
    abertura da sequência de sonetos Fungi from Yuggoth, também intitulado
    "The Book."

- id: hp-lovecraft/the-evil-clergyman
  synopsis: >
    O relato de uma visita a um sótão trancado outrora ocupado por um
    clérigo que se dedicava ao proibido, que existe apenas como excerto de
    uma das próprias cartas de Lovecraft, e não como ficção escrita para
    publicação.

- id: hp-lovecraft/the-shadow-out-of-time
  synopsis: >
    Um professor de economia que perdeu cinco anos a uma amnésia
    misteriosa recupera gradualmente memórias de ter sido possuído,
    durante esse hiato, por um membro de uma raça antiga de mentes
    viajantes do tempo - e encontra, no deserto australiano, provas
    físicas de que as suas memórias são literalmente verdadeiras.

- id: hp-lovecraft/the-haunter-of-the-dark
  synopsis: >
    Um jovem escritor a investigar uma igreja abandonada de Providence
    descobre a relíquia de uma seita oculta, um "Trapezoedro Brilhante",
    ainda ativa lá dentro - e que é, ao mesmo tempo, uma janela e uma
    convocação. Escrita como resposta ao conto de Robert Bloch "The
    Shambler from the Stars" (que tinha morto um Lovecraft pouco
    disfarçado), mata por sua vez um Bloch pouco disfarçado, com a bênção
    deste. A última história solo que Lovecraft terminou antes da sua
    morte, em 1937.

- id: hp-lovecraft/the-little-glass-bottle
  synopsis: >
    Um curto esboço de aventura náutica, a ficção mais antiga de Lovecraft
    que sobrevive, composta por volta dos cinco ou seis anos e conservada
    entre os papéis de família. Não publicada até 1959.

- id: hp-lovecraft/the-secret-cave-or-john-lees-adventure
  synopsis: >
    Um conto de aventura de infância sobre duas crianças presas numa
    gruta, escrito por volta dos oito ou nove anos. Não publicado até
    1959.

- id: hp-lovecraft/the-mystery-of-the-grave-yard
  synopsis: >
    Uma história de detetives de infância, subtitulada "The Doom of the
    Robber Gang", escrita por volta dos oito ou nove anos, em imitação da
    ficção policial de romances baratos que Lovecraft lia em criança. Não
    publicada até 1959.

- id: hp-lovecraft/the-mysterious-ship
  synopsis: >
    Um pequeno conto de infância sobre um navio abandonado, escrito por
    volta dos doze anos. Não publicado até 1959.

- id: hp-lovecraft/the-beast-in-the-cave
  synopsis: >
    Um visitante perdido na gruta Mammoth Cave, no Kentucky, já quase sem
    fósforos, mata aquilo que toma por um animal perigoso a persegui-lo no
    escuro - e descobre, à luz do último fósforo, exatamente o que era.
    Escrito aos catorze anos; a peça mais antiga que o próprio Lovecraft
    mais tarde considerou digna de circular, embora tenha ficado inédita
    até 1918.

- id: hp-lovecraft/fungi-from-yuggoth
  synopsis: >
    Um ciclo de trinta e seis sonetos encadeados - sonhos, panoramas
    cósmicos e vislumbres de coisas que seria melhor não vislumbrar, indo
    de uma vulgar alfarrabista até visões de Yuggoth e mais além.
    Composto como uma única sequência ao longo de dez dias, entre dezembro
    de 1929 e janeiro de 1930, ao contrário do resto da poesia de
    Lovecraft: sonetos individuais foram colocados em revistas entre 1930
    e 1932, mas o ciclo completo de trinta e seis sonetos que efetivamente
    compôs só foi publicado em conjunto em 1943, seis anos depois da sua
    morte.

- id: hp-lovecraft/supernatural-horror-in-literature
  synopsis: >
    Um longo levantamento crítico de toda a tradição da ficção estranha,
    dos romances góticos, passando por Poe, Machen, Blackwood e Dunsany,
    até aos contemporâneos do próprio Lovecraft, ainda hoje citado por
    investigadores como obra fundadora da crítica do horror. Composto
    entre 1925 e 1927 para o circular amador The Recluse, e revisto até
    meados da década de 1930.

- id: hp-lovecraft/notes-on-writing-weird-fiction
  synopsis: >
    Um breve ensaio, frequentemente reeditado, que expõe o método do
    próprio Lovecraft para construir um conto estranho, incluindo o seu
    hábito de trabalhar os acontecimentos de fundo de uma história por
    ordem cronológica cuidadosa antes de escrever uma única palavra da
    narrativa em si.

- id: hp-lovecraft/the-battle-that-ended-the-century
  synopsis: >
    Um esboço de paródia exagerada de um combate de boxe entre versões
    pouco disfarçadas dos próprios amigos literários de Lovecraft, escrito
    apenas como piada interna para circulação privada dentro do círculo de
    Lovecraft.

- id: hp-lovecraft/bothon
  synopsis: >
    Uma história de futuro distante sobre os últimos sobreviventes de uma
    civilização moribunda, revista por Lovecraft a partir de um rascunho
    do seu amigo Henry S. Whitehead, clérigo episcopaliano e colaborador
    da Weird Tales como ele. Não publicada até 1946, muito depois da
    morte de ambos os autores.

- id: hp-lovecraft/the-challenge-from-beyond
  synopsis: >
    Um serial coletivo de cinco autores para o número de quinto
    aniversário da Fantasy Magazine, cada escritor a continuar o episódio
    do anterior por sua vez: C. L. Moore abriu-o, seguida de A. Merritt,
    Lovecraft, Robert E. Howard e Frank Belknap Long. O segmento do
    próprio Lovecraft descreve uma troca de mentes com um cientista
    alienígena tentacular.

- id: hp-lovecraft/collapsing-cosmoses
  synopsis: >
    Um breve fragmento de space opera escrito em conjunto com R. H.
    Barlow. Não publicado até 1938, já depois da morte de Lovecraft e
    perto do fim do próprio envolvimento de Barlow com o círculo de
    Lovecraft.

- id: hp-lovecraft/the-crawling-chaos
  synopsis: >
    Uma visão, em sonho de ópio, da destruição de uma cidade costeira por
    um maremoto, escrita em conjunto com a poetisa Winifred Virginia
    Jackson, uma das primeiras parceiras literárias de Lovecraft, vinda
    dos círculos de jornalismo amador, a partir de um sonho que ela lhe
    relatou.

- id: hp-lovecraft/the-curse-of-yig
  synopsis: >
    Um casal de colonos no Território Índio chega a um fim horrível
    depois de o marido matar um ninho de cobras sagradas ao deus-serpente
    Yig, numa história construída a partir de uma premissa fornecida por
    Zealia Bishop. A primeira de três histórias que Lovecraft escreveu
    como negro literário para Bishop; apresenta a entidade Yig, que depois
    recorre na ficção dos Mitos de outros autores.

- id: hp-lovecraft/the-diary-of-alonzo-typer
  synopsis: >
    Um diário encontrado que regista os últimos dias de um investigador do
    oculto numa casa assombrada de origem holandesa em Nova Iorque, muito
    trabalhado por Lovecraft a partir de um rascunho de William Lumley,
    um ocultista amador já idoso e um dos seus clientes de revisão.
    Referido pelo artigo principal da Wikipédia sobre Lovecraft, a par de
    The Mound e Winged Death, como exemplo do "large amount of
    ghostwriting" que fez neste período.

- id: hp-lovecraft/the-disinterment
  synopsis: >
    Uma história de horror com transplante de cérebro, revista por
    Lovecraft a partir de um rascunho de Duane W. Rimel, um jovem
    correspondente radicado no Idaho e um dos vários escritores em início
    de carreira que orientou e para quem reviu textos em meados da década
    de 1930.

- id: hp-lovecraft/the-electric-executioner
  synopsis: >
    Uma viagem de comboio pelo deserto mexicano na companhia de um
    desconhecido que transporta um dispositivo caseiro de execução
    elétrica transforma-se em algo mais próximo da possessão demoníaca do
    que da justiça. Uma reescrita de uma história que de Castro já tinha
    publicado sob o próprio nome décadas antes, e não um trabalho de
    escrita por encomenda a partir de uma simples premissa.

- id: hp-lovecraft/the-green-meadow
  synopsis: >
    Um dispositivo narrativo apresenta este texto como um fragmento
    recuperado de um meteorito, descrevendo um homem arrastado por um
    rio, para lá de um impossível prado verde, em direção a um vazio. A
    segunda de duas peças de base onírica escritas em conjunto com
    Winifred Virginia Jackson.

- id: hp-lovecraft/four-oclock
  synopsis: >
    Uma peça breve revista por Lovecraft a partir de um manuscrito da
    mulher, Sonia Greene, com quem casou em 1924. Não publicada até 1949,
    muito depois da morte de ambos.

- id: hp-lovecraft/the-hoard-of-the-wizard-beast
  synopsis: >
    Um breve esboço de fantasia sobre um tesouro guardado por uma criatura
    estranha, escrito em conjunto com R. H. Barlow.

- id: hp-lovecraft/the-horror-at-martins-beach
  synopsis: >
    Uma história de horror com um monstro marinho - publicada como "The
    Invisible Monster" - sobre uma criatura capturada que se vinga
    sombriamente da vila costeira que a apanhou, revista por Lovecraft a
    partir de um manuscrito de Sonia Greene, a mulher com quem casaria no
    ano seguinte.

- id: hp-lovecraft/the-horror-in-the-burying-ground
  synopsis: >
    O hábito de um coveiro de pequena vila de enterrar pessoas vivas acaba
    por se voltar contra ele. Uma de cinco histórias que Lovecraft
    escreveu como negro literário para Hazel Heald, uma escritora do
    Massachusetts que lhe foi apresentada por um amigo comum.

- id: hp-lovecraft/the-horror-in-the-museum
  synopsis: >
    O proprietário de um museu de cera afirma que um dos seus horrores
    mais convincentes, um deus tentacular chamado Rhan-Tegoth, não é feito
    de cera nenhuma - e mantém-no alimentado. O próprio Lovecraft, numa
    carta de 14 de junho de 1933 a Clark Ashton Smith, chamou a esta
    história "mostly my own work... entirely so in wording."

- id: hp-lovecraft/under-the-pyramids
  synopsis: >
    Um relato em primeira pessoa, atribuído ao ilusionista Harry Houdini,
    sobre ser baixado a uma câmara selada sob as pirâmides de Gizé e
    descobrir o que realmente percorre as passagens subterrâneas do
    Egito. A Weird Tales publicou-o apenas com a assinatura de Houdini e
    sem crédito a Lovecraft, já que a narrativa é contada inteiramente
    como testemunho do próprio Houdini; Lovecraft só foi creditado numa
    reedição de 1939. Publicado também, num texto restaurado por S. T.
    Joshi, como "Imprisoned with the Pharaohs."

- id: hp-lovecraft/the-last-test
  synopsis: >
    O soro experimental de um cientista, desenvolvido com conhecimento
    adquirido no estrangeiro, revela ter uma origem muito pior do que os
    colegas suspeitam. A revisão de Lovecraft para de Castro inventou o
    título árabe "Al Azif" para o Necronomicon, não usado em mais nenhum
    lugar da sua ficção.

- id: hp-lovecraft/the-man-of-stone
  synopsis: >
    Caminhantes nos Adirondacks encontram estátuas de pedra hiper-realistas
    na propriedade de um escultor excêntrico, dispostas de uma forma que
    sugere que a petrificação não teve nada de arte do escultor. Uma de
    cinco histórias que Lovecraft escreveu como negro literário para Hazel
    Heald.

- id: hp-lovecraft/medusas-coil
  synopsis: >
    Um visitante de uma plantação em ruínas no Missouri ouve a história de
    um artista destruído pelo cabelo inumano e serpentino da própria
    mulher - uma história cujo final original foi suprimido pelos
    editores e só restaurado em letra impressa na edição de S. T. Joshi de
    1989. A última de três histórias que Lovecraft escreveu como negro
    literário para Zealia Bishop; não publicada até 1939, depois da sua
    morte.

- id: hp-lovecraft/the-mound
  synopsis: >
    Um folclorista a investigar um monte funerário indígena do Oklahoma,
    tido como assombrado por um fantasma sem cabeça, encontra, em vez
    disso, o manuscrito de um explorador espanhol do século XVI que
    descreve uma entrada para uma vasta civilização subterrânea ainda
    ligada, embora ao longe, a Cthulhu e aos Grandes Anciões. Bishop
    forneceu apenas uma breve sinopse de enredo sobre um monte assombrado;
    a própria ficha da Wikipédia para a história credita Lovecraft apenas
    como "ghostwriter" e Bishop apenas com a "original idea", e a novela
    resultante, com 29 560 palavras, é, por consenso académico, quase
    inteiramente prosa e invenção do próprio Lovecraft.

- id: hp-lovecraft/the-night-ocean
  synopsis: >
    A estadia fora de época de um pintor numa casa de praia vazia
    transforma-se num mal-estar silencioso e crescente sobre o que se move
    na água ao largo. Ao contrário da maior parte desta secção, a
    investigação académica posterior (S. T. Joshi e David E. Schultz,
    entre outros) atribui a prosa desta história substancialmente a R. H.
    Barlow, com Lovecraft como colaborador e revisor de intervenção mais
    leve, e não o contrário - a direção que vale para a maior parte desta
    secção não se verifica aqui, e por isso está registada como
    coautoria, e não sob o authorRole de escrita por encomenda usado para
    o resto do trabalho de revisão paga de Lovecraft.

- id: hp-lovecraft/out-of-the-aeons
  synopsis: >
    A múmia em exibição num museu de Boston, recuperada de uma ilha
    submersa do Pacífico, revela ser um sacerdote ainda vivo que outrora
    olhou diretamente para um deus que é melhor não olhar, e pagou por
    isso. Uma de cinco histórias que Lovecraft escreveu como negro
    literário para Hazel Heald.

- id: hp-lovecraft/poetry-and-the-gods
  synopsis: >
    Uma jovem, desesperada com o declínio da poesia moderna, cai numa
    visão dos deuses helénicos e dos grandes poetas do passado. Creditada
    em conjunto a Lovecraft (sob o seu pseudónimo de jornalismo amador,
    Henry Paget-Lowe) e a Anna Helen Crofts, outra jornalista amadora;
    quanto escreveu cada um dos dois não está estabelecido em nenhuma das
    fontes aqui consultadas. Lovecraft nunca mencionou a peça nas suas
    cartas sobreviventes nem em nenhuma das suas próprias listas de
    ficção, e ela só foi identificada como sua quando o investigador de
    Lovecraft George T. Wetzel a reeditou, décadas depois.

- id: hp-lovecraft/the-slaying-of-the-monster
  synopsis: >
    Um breve esboço de espada e feitiçaria sobre um herói a enfrentar um
    monstro, escrito em conjunto com R. H. Barlow.

- id: hp-lovecraft/the-sorcery-of-aphlar
  synopsis: >
    Uma breve peça de fantasia revista a partir de um rascunho de Duane W.
    Rimel.

- id: hp-lovecraft/the-thing-in-the-moonlight
  synopsis: >
    Uma peça muito curta, essencialmente uma visão onírica de um horror
    híbrido vislumbrado ao luar, num acampamento à beira de um lago.

- id: hp-lovecraft/through-the-gates-of-the-silver-key
  synopsis: >
    Os parentes de Randolph Carter, quatro anos depois do seu
    desaparecimento em "A Chave de Prata", reúnem-se para resolver o seu
    espólio e acabam, em vez disso, por saber o que realmente lhe
    aconteceu para lá do portal - uma odisseia através do tempo, do
    espaço e de corpos alienígenas. Price, admirador de "A Chave de
    Prata", propôs a sequela e escreveu um rascunho de 6000 palavras em
    1932; a reescrita de Lovecraft, em 1933, expandiu-o para 14 000
    palavras, deixando, pela estimativa posterior do próprio Price, menos
    de cinquenta das suas palavras originais por alterar, embora a
    subtrama de Yaddith tenha sido um acrescento do próprio Lovecraft ao
    esquema de Price.

- id: hp-lovecraft/till-a-the-seas
  synopsis: >
    Uma visão de futuro distante do último ser humano vivo, numa Terra que
    lentamente seca até virar pó sob um sol moribundo, escrita em conjunto
    com R. H. Barlow a partir do rascunho e da ideia originais dele.

- id: hp-lovecraft/the-trap
  synopsis: >
    Um professor e um aluno ficam presos dentro de um espelho antigo que
    serve de porta para um outro mundo frio e silencioso, numa história
    revista por Lovecraft a partir de um rascunho de Henry S. Whitehead.

- id: hp-lovecraft/the-tree-on-the-hill
  synopsis: >
    Uma árvore no cimo de uma colina marca o local de uma porta para outra
    dimensão, numa história revista por Lovecraft a partir de um rascunho
    de Duane W. Rimel. Não publicada até 1940, depois da morte de
    Lovecraft.

- id: hp-lovecraft/two-black-bottles
  synopsis: >
    Um jovem viaja até uma povoação holandesa remota no interior do estado
    de Nova Iorque para investigar o desaparecimento do avô e o sinistro
    sacristão que lhe sucedeu, numa história revista por Lovecraft a
    partir de um rascunho do seu amigo Wilfred Blanch Talman.

- id: hp-lovecraft/in-the-walls-of-eryx
  synopsis: >
    Um prospetor em Vénus, à procura de um cristal valioso, perde-se
    dentro de um labirinto invisível construído pelos habitantes nativos
    do planeta. Sterling, então um adolescente fã de ficção científica e
    mais tarde médico, forneceu o rascunho original, de 6000 a 8000
    palavras, e a premissa; a reescrita de Lovecraft alargou-o para 12 000
    palavras e, embora o rascunho original de Sterling não sobreviva para
    comparação, é geralmente creditada com a maior parte da prosa final.
    Não publicada até 1939, depois da morte de Lovecraft.

- id: hp-lovecraft/winged-death
  synopsis: >
    Um cientista sul-africano assassina um rival usando uma mosca
    inteligente, especialmente criada para o efeito, e depois descobre que
    a mosca ainda não acabou consigo. Referido pelo artigo principal da
    Wikipédia sobre Lovecraft, a par de The Mound e The Diary of Alonzo
    Typer, como exemplo do "large amount of ghostwriting" que fez para
    outros autores. Uma de cinco histórias que Lovecraft escreveu como
    negro literário para Hazel Heald.

- id: hp-lovecraft/satans-servants
  synopsis: >
    Uma história de horror sobre um culto de bruxaria na Nova Inglaterra,
    de Robert Bloch, então um jovem correspondente adolescente de
    Lovecraft que mais tarde escreveria Psycho, revista com o contributo
    editorial de Lovecraft, e não escrita por ele como negro literário -
    a direção aqui é o oposto do conjunto Bishop/Heald/de Castro do resto
    desta secção, com Bloch como autor da própria história. Não publicada
    até 1949, muito depois da morte de Lovecraft.

- id: hp-lovecraft/the-loved-dead
  synopsis: >
    A confissão de um narrador necrófilo, revista por Lovecraft a partir
    de um rascunho do seu amigo C. M. Eddy Jr. O seu conteúdo explícito
    provocou um protesto formal das autoridades do Indiana, que
    procuraram fazer proibir o número, e tornou o editor da Weird Tales
    visivelmente mais cauteloso em aceitar, depois disso, submissões
    sombrias de Lovecraft.

- id: hp-lovecraft/the-ghost-eater
  synopsis: >
    Um viajante perdido na floresta abriga-se naquilo que se revela ser
    uma casa assombrada, numa história revista por Lovecraft a partir de
    um rascunho de C. M. Eddy Jr.

- id: hp-lovecraft/deaf-dumb-and-blind
  synopsis: >
    A casa isolada de um escritor cego, surdo e mudo é invadida por algo
    que só ele, sem nenhum dos sentidos habituais para ser enganado por
    isso, consegue perceber claramente. Revista por Lovecraft a partir de
    um rascunho de C. M. Eddy Jr.

- id: hp-lovecraft/ashes
  synopsis: >
    A experiência de desintegração da matéria de um químico é desviada
    para o assassínio, numa história revista por Lovecraft a partir de um
    rascunho de C. M. Eddy Jr.
