# Tradução pt-PT das ordens de leitura curadas: nome, justificação e os
# pontos em debate. Os `orderedWorkIds` são identificadores e não se
# traduzem.
#
# TÍTULOS DE OBRAS: as quatro obras do fio Randolph Carter têm todas edição
# portuguesa (a coletânea "Os Demónios de Randolph Carter", Editorial
# Estampa, 2003 - ver editions.yaml) e usam aqui o título publicado: The
# Statement of Randolph Carter -> O Depoimento de Randolph Carter, The
# Dream-Quest of Unknown Kadath -> Em Sonhos, à Procura da Desconhecida
# Kadath, The Silver Key -> A Chave de Prata, Through the Gates of the
# Silver Key -> Através das Portas da Chave de Prata. As restantes obras
# referidas (The Unnamable, Dagon, The Temple, The Call of Cthulhu) não têm
# edição portuguesa e mantêm o título inglês.

- id: hp-lovecraft/randolph-carter-in-order
  name: Os contos de Randolph Carter, por ordem
  rationale: >
    Os quatro contos que Lovecraft escreveu à volta de um único sonhador
    recorrente, reordenados da ordem de publicação para a ordem em que a
    própria vida de Carter os coloca.
    [[work:hp-lovecraft/the-dream-quest-of-unknown-kadath|Em Sonhos, à
    Procura da Desconhecida Kadath]] vem primeiro: um Carter de vinte anos,
    já um viajante dos sonhos extremamente experiente, com amigos por todo
    o mundo onírico, atravessa-o inteiro três vezes em busca de uma cidade
    ao pôr do sol de que guarda uma memória incompleta. Segue-se
    [[work:hp-lovecraft/the-statement-of-randolph-carter|O Depoimento de
    Randolph Carter]]: o artigo da Wikipédia sobre Randolph Carter, citando
    a leitura que S. T. Joshi faz da cronologia que a própria
    [[work:hp-lovecraft/the-silver-key|A Chave de Prata]] apresenta, data o
    desaparecimento de Warren sobre o qual Carter aqui testemunha do final
    da casa dos quarenta. [[work:hp-lovecraft/the-silver-key|A Chave de
    Prata]] fecha o centro do arco: Carter, aos trinta anos, a perceber que
    perdeu o dom que o primeiro conto o mostrava a usar com tanta
    liberdade, e aos cinquenta e quatro a encontrar a chave que talvez o
    devolva. [[work:hp-lovecraft/through-the-gates-of-the-silver-key|Através
    das Portas da Chave de Prata]] fecha-o - E. Hoffmann Price propôs a
    história especificamente como sequela, retomando o destino de Carter a
    partir do ponto onde A Chave de Prata o deixa, e Lovecraft escreveu-a
    com ele. Ler a vida de Carter por esta ordem, em vez da ordem em que as
    histórias chegaram a público, significa conhecê-lo jovem e capaz antes
    de o conhecer diminuído, em vez de abrir pela perda e só depois ver o
    que ele um dia foi capaz de fazer. O custo: a novela Dream-Quest, que
    Lovecraft nunca submeteu para publicação, é também a entrada mais longa
    e mais digressiva, um compromisso real com que abrir, ao passo que O
    Depoimento, que efetivamente apresentou Carter aos leitores em 1920, é
    um conto de horror compacto e tenso, construído para funcionar como
    primeiro encontro com a personagem.
  debated:
    - "A mesma cronologia da Wikipédia que coloca Dream-Quest, depois O Depoimento, antes de A Chave de Prata e Através das Portas, situa os próprios acontecimentos de The Unnamable entre O Depoimento e A Chave de Prata, e o seu narrador é amplamente identificado como Carter. Essa obra não tem, neste catálogo, a etiqueta de subsérie Randolph Carter (ver o cabeçalho de works.yaml sobre a razão de a etiqueta se limitar a quatro contos) e fica, por isso, fora do âmbito desta ordem - não porque a sua posição na cronologia seja desconhecida."
    - "Vários investigadores assinalaram uma tensão por resolver que esta ordem não disfarça: Dream-Quest retrata Carter como um adulto já perito em viagens oníricas, enquanto A Chave de Prata o mostra, aos trinta anos, a ter perdido gradualmente a chave para o portal dos sonhos e incapaz de voltar a alcançar as cidades da sua juventude. O próprio Lovecraft nunca reconciliou os dois textos; a cronologia de Joshi é a leitura académica padrão, não um facto estabelecido pelo autor."

- id: hp-lovecraft/cthulhu-mythos-in-order
  name: Os Mitos de Cthulhu, por ordem
  rationale: >
    Os vinte e cinco contos que carregam o conteúdo próprio de Lovecraft
    para os Mitos de Cthulhu - o Necronomicon e Abdul Alhazred, ou uma
    entidade nomeada, de Cthulhu à Grande Raça de Yith - retirados da
    estante mais alargada e colocados pela ordem em que Lovecraft os
    escreveu. Isto é ordem de publicação e nada mais: ao contrário da ordem
    de Randolph Carter acima, os contos dos Mitos não partilham cronologia
    nem protagonista contínuos, pelo que não há nenhuma sequência interna
    ao universo para reconstruir, e nenhum guia de leitura consultado para
    esta ala recomenda um percurso específico por eles para além da ordem
    em que apareceram. O que esta ordem ganha é isolar o fio conectado das
    outras oitenta e seis obras - contos solo sem conteúdo dos Mitos, todas
    as colaborações e trabalhos por encomenda, a poesia e a não-ficção -
    para um leitor que chegou a Lovecraft através de Cthulhu e da mitologia
    partilhada, e não através dele como contista em geral. O custo: estes
    contos nunca foram escritos como uma série e não partilham elenco
    contínuo, pelo que lê-los seguidos pode achatar em repetição o
    enquadramento próprio de cada um - outro investigador a reconstituir
    outro conjunto de documentos ominosos - e o percurso salta dois dos
    antecedentes temáticos mais citados dos Mitos,
    [[work:hp-lovecraft/dagon|Dagon]] e
    [[work:hp-lovecraft/the-temple|The Temple]], que prefiguram o seu
    imaginário submarino mas não nomeiam nenhuma entidade do panteão nem o
    Necronomicon, ficando por isso fora do teste de pertença aos Mitos que
    esta ala construiu a partir das suas próprias fontes.
  debated:
    - "Esta ordem não reorganiza nada: ordena as mesmas vinte e cinco obras pelo ano de publicação, o mesmo eixo que a ordem por defeito derivada usa, e não resolve nenhum empate no mesmo ano (1928, 1929, 1933, 1936 e 1938 emparelham ou agrupam entre duas a quatro obras cada, sem qualquer campo de data de composição neste esquema para os desempatar). Ganha o seu lugar como um fio retirado de uma estante de 111 obras, a mesma justificação que as ordens temáticas de Discworld e a própria ordem Poe/Dupin deste catálogo usam para uma subsérie filtrada e ordenada por ano, não como uma sequência curada por si própria."
    - "A lista de vinte e cinco obras é um teste próprio desta ala, sustentado em fontes (a regra do Necronomicon/nomeação de entidades no cabeçalho de works.yaml), cruzado com a própria página de aparições do Necronomicon em hplovecraft.com e com a distinção académica de Price/Tierney entre os Mitos de Lovecraft e a remodelação posterior de August Derleth. Não foi verificada contra uma terceira enumeração, publicada de forma independente, dos mesmos vinte e cinco títulos."
    - "Uma sequência de \"construir a mitologia\" - entradas fundacionais primeiro, depois as histórias que as pressupõem - foi considerada e rejeitada para esta ordem: a pesquisa geral de guias de leitura feita para os próprios percursos startHere desta ala não encontrou nenhuma fonte a recomendar um percurso específico pelos contos dos Mitos para além da ordem de publicação, apenas títulos essenciais individuais (The Call of Cthulhu à cabeça deles, já coberto pelo startHere desta ala)."
