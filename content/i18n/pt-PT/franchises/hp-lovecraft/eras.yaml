# Português europeu (pt-PT) - eras. Cada entrada leva `title`, `description`
# e `themes` (docs/SCHEMA.md; `themes` é a lista de frases curtas mostrada
# sob o título da era na placa - ver a nota em scripts/i18n_coverage.py).
# `note:` não é traduzido: nenhum overlay pt-PT deste catálogo o traduz, o
# campo é uma justificação de fronteira dirigida a quem cura a ala, não
# prosa que o leitor vê.
#
# CITAÇÕES VERBATIM: as citações do H. P. Lovecraft Archive e de "I Am
# Providence" de S. T. Joshi na description de return-to-providence ficam em
# inglês, verbatim, seguindo a mesma regra já registada em
# authors/hp-lovecraft.yaml deste overlay.
#
# TÍTULOS DE OBRAS: At the Mountains of Madness usa o título da edição
# portuguesa (Nas Montanhas da Loucura, Relógio d'Água, 2011 - ver
# editions.yaml); as restantes obras referidas não têm edição portuguesa e
# mantêm o título inglês.

- id: new-york-years
  title: Os Anos de Nova Iorque
  themes:
    - problemas de casamento e de dinheiro
    - o Kalem Club
    - um primeiro posto profissional na Weird Tales
    - o azedar da relação com a cidade
  description: >
    Lovecraft casou com Sonia Greene a 3 de março de 1924 e mudou-se para o
    apartamento dela em Brooklyn - o único período da vida adulta que passou
    a viver fora de Providence. A Weird Tales tinha começado a comprar-lhe
    histórias no outono anterior, dando finalmente à sua ficção um lar
    profissional e remunerado depois de uma década na imprensa amadora, e em
    Nova Iorque juntou-se ao círculo de amigos literários - George Kirk,
    Rheinhart Kleiner, Samuel Loveman, Frank Belknap Long e outros - que
    passaram a chamar-se a si próprios o Kalem Club, a partir das iniciais
    partilhadas dos seus apelidos. O casamento tensionou-se com problemas de
    dinheiro quase de imediato: o trabalho de Sonia levava-a para fora do
    estado por longos períodos, e Lovecraft, pouco disposto a aceitar um
    emprego estável que não lhe deixasse tempo para escrever, consumiu a
    maior parte das poupanças de ambos. A ficção que chegou a ser publicada
    durante estes dois anos inclui
    [[work:hp-lovecraft/the-rats-in-the-walls|The Rats in the Walls]] e
    [[work:hp-lovecraft/the-hound|The Hound]] (ambas de 1924), e
    [[work:hp-lovecraft/the-festival|The Festival]] e
    [[work:hp-lovecraft/the-unnamable|The Unnamable]] (ambas de 1925).

- id: return-to-providence
  title: O Regresso a Providence
  themes:
    - a ficção cósmica da maturidade
    - escrever por encomenda para pagar a renda
    - a Nova Inglaterra antiquária
    - pobreza e saúde em declínio
  description: >
    Lovecraft regressou a Providence a 17 de abril de 1926, em parte a
    instâncias do amigo Frank Belknap Long, pondo fim ao casamento em tudo
    menos na forma. A própria biografia do H. P. Lovecraft Archive chama à
    década seguinte, até à sua morte a 15 de março de 1937, "the time of his
    greatest flowering, both as a writer and as a human being"; "I Am
    Providence", de S. T. Joshi, descreve o mesmo regresso como o ponto que
    "spurred the greatest spurt of literary creativity he would ever
    experience." A ficção que chegou a ser publicada nestes anos inclui
    [[work:hp-lovecraft/the-call-of-cthulhu|The Call of Cthulhu]] (1928),
    [[work:hp-lovecraft/the-dunwich-horror|The Dunwich Horror]] (1929),
    [[work:hp-lovecraft/at-the-mountains-of-madness|Nas Montanhas da
    Loucura]] e [[work:hp-lovecraft/the-shadow-over-innsmouth|The Shadow
    over Innsmouth]] (ambas de 1936), e
    [[work:hp-lovecraft/the-haunter-of-the-dark|The Haunter of the Dark]]
    (1936), a última história que terminou. Vender ficção acabada raramente
    rendia o suficiente para viver - a Weird Tales recusou vários dos
    títulos acima à primeira submissão - pelo que Lovecraft se sustentava
    sobretudo escrevendo por encomenda e revendo, mediante pagamento,
    manuscritos de outros autores; quase todo o trabalho de colaboração e
    revisão catalogado nesta ala foi feito nestes anos, a par de uma
    pobreza cada vez maior ao longo da Grande Depressão e do cancro
    intestinal que o matou aos 46 anos.
