# Português europeu (pt-PT) - acontecimentos específicos desta coleção, o que
# aconteceu aos LIVROS depois de 1935. Os acontecimentos da vida de Pessoa
# estão em content/i18n/pt-PT/authors/fernando-pessoa.yaml.
#
# Só `title` e `description`. Datas, scope, reach, impact, organisation e
# sources nunca se traduzem, e as notas de curadoria (`#`) ficam na língua de
# base.
#
# Títulos de livros, de revistas e de instituições ficam na forma original:
# presença, Athena, Orpheu, Diversidade e Unidade em Fernando Pessoa, Pessoa
# Revisitado, The Western Canon. As citações de Octavio Paz estão em castelhano
# na base inglesa porque é a língua em que ele as escreveu, e assim ficam.

- id: pessoa-presenca-homage-1936
  title: A presença dá-lhe um número inteiro
  description: >
    Menos de um ano depois do funeral, a revista coimbrã presença, que tinha
    impresso "Tabacaria" e "Autopsicografia" e cujo diretor Adolfo Casais
    Monteiro recebera a carta de janeiro de 1935 a explicar os heterónimos,
    dedicou-lhe um número inteiro. O grupo da presença é a razão de ter havido
    alguma coisa para publicar depois: os seus críticos sabiam o que estava na
    arca porque ele lhes tinha dito, e dois deles, Casais Monteiro e João
    Gaspar Simões, organizaram os primeiros livros tirados dela.

- id: pessoa-atica-obras-completas-1942
  title: A arca começa a sair
  description: >
    Aconteceram duas coisas em 1942, sete anos depois da morte e no fim de um
    silêncio em que nada dele fora impresso. A Editorial Confluência lançou uma
    antologia organizada por Adolfo Casais Monteiro a partir da centena de
    poemas que Pessoa publicara em revistas em vida, e a Ática começou as Obras
    Completas, cinco volumes de poesia entre 1942 e 1946 ao cuidado de João
    Gaspar Simões e Luiz de Montalvor, os primeiros a servir-se dos papéis
    inéditos da arca. Todos os volumes póstumos desta estante descendem desse
    programa, e a razão de tantos deles se chamarem Páginas ou Poesias Inéditas
    é que a Ática voltou vezes sem conta aos mesmos papéis.

- id: pessoa-first-study-1949
  title: O primeiro livro sobre ele
  description: >
    Diversidade e Unidade em Fernando Pessoa (Verbo), de Jacinto do Prado
    Coelho, foi o primeiro estudo de fundo sobre a obra, e fixou a pergunta que
    a crítica discute desde então: se os heterónimos são uma só mente ou
    várias. Prado Coelho viria a organizar o primeiro
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]] trinta
    e três anos mais tarde.

- id: pessoa-first-biography-1950
  title: O seu próprio editor escreve-lhe a vida
  description: >
    Vida e Obra de Fernando Pessoa (Bertrand), de João Gaspar Simões, o crítico
    da presença que nessa altura organizava os volumes da Ática. A primeira
    biografia de Pessoa foi assim escrita pelo homem que decidia o que dele se
    imprimia, a partir de papéis que mais ninguém vira, e fixou a imagem
    popular de um escriturário sem vida, que a correspondência publicada meio
    século depois tem vindo a complicar.

- id: pessoa-first-spanish-caeiro-1957
  title: Caeiro atravessa a fronteira primeiro
  description: >
    Poemas de Alberto Caeiro, selecionado, traduzido e prefaciado por Ángel
    Crespo para a coleção Adonais em Madrid (Rialp), foi o primeiro livro de
    Pessoa a sair em castelhano, e saiu com o nome do pastor em vez do dele. O
    padrão manteve-se: fora de Portugal, os heterónimos chegaram muitas vezes
    antes do homem, e é por isso que os leitores conhecem Caeiro ou Bernardo
    Soares e só depois descobrem quem os escreveu.

- id: pessoa-octavio-paz-1962
  title: Octavio Paz faz dele um escritor latino-americano
  description: >
    Paz selecionou, traduziu e prefaciou uma Antología para a Universidad
    Nacional Autónoma de México, e o seu prefácio é a leitura que fixou Pessoa
    em castelhano de vez: "los poetas no tienen biografía; su obra es una
    biografía", e de Pessoa em particular, "nada en su vida es sorprendente,
    nada excepto sus poemas". Um prémio Nobel a defender que a vida é vazia e
    que a obra é a vida está na origem da ideia corrente de Pessoa como um
    homem que não fez outra coisa senão inventar pessoas, e vale a pena lê-la
    contra a apreensão de 1923 e a polémica de jornal de 1935.

- id: pessoa-lourenco-revisitado-1973
  title: Pessoa Revisitado
  description: >
    Pessoa Revisitado (Inova), de Eduardo Lourenço, rompeu com a leitura
    psicológica que Gaspar Simões instalara, tratando os heterónimos como uma
    estrutura de que a poesia precisava e não como sintomas do homem que os
    fez. É o estudo de que parte a maior parte da crítica portuguesa posterior,
    e Lourenço escreveu o prefácio de
    [[work:fernando-pessoa/fausto-tragedia-subjectiva|Fausto]] quando este foi
    finalmente reunido quinze anos depois.

- id: pessoa-cartas-de-amor-1978
  title: As cartas de amor saem com ela ainda viva
  description: >
    [[work:fernando-pessoa/cartas-de-amor|Cartas de Amor]] pôs nas livrarias as
    cartas a Ophélia Queiroz cinquenta e oito anos depois de a primeira ter
    sido escrita. Ophélia estava viva, e viveu até 1991: a única mulher da vida
    de Pessoa sobreviveu treze anos à publicação do seu próprio namoro e pôde
    ser entrevistada sobre um livro cujo autor estava morto desde 1935. É
    também nestas cartas que os leitores viram pela primeira vez Álvaro de
    Campos a escrever a uma pessoa real.

- id: pessoa-espolio-bnp-1979
  title: O Estado compra a arca
  description: >
    O Estado português comprou o espólio à meia-irmã de Pessoa, Henriqueta
    Madalena Nogueira Rosa Dias, que o guardava desde 1935, e ele foi
    transferido para a Biblioteca Nacional de Portugal. Até aí, os papéis por
    trás de cada volume póstumo estavam num andar de família, e o acesso a eles
    dependia da família; a partir de 1979 são um arquivo público que qualquer
    pessoa com cartão de leitor pode requisitar, e é por isso que a edição
    nesta estante muda de natureza depois desta data, de seleções para edições
    críticas.

- id: pessoa-desassossego-first-edition-1982
  title: O Livro do Desassossego torna-se finalmente um livro
  description: >
    Quarenta e sete anos depois da morte, a Ática publicou o primeiro
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]
    completo, em dois volumes, organizado por Jacinto do Prado Coelho a partir
    das transcrições de Maria Aliete Galhoz e de Teresa Sobral Cunha. Uma
    seleção fina saíra em 1961, ao cuidado de Pedro Veiga, e não deixara marca.
    O que veio depois de 1982 deixou: o livro que a maior parte das pessoas
    hoje quer dizer quando diz Pessoa esteve indisponível durante os primeiros
    quarenta e sete anos da sua carreira póstuma, e todas as reconstruções
    rivais dele, e todas as traduções, são posteriores a esta data.

- id: pessoa-saramago-ricardo-reis-1984
  title: Saramago dá uma morte a Ricardo Reis
  description: >
    O Ano da Morte de Ricardo Reis, de José Saramago, traz o heterónimo do
    Brasil de volta a Lisboa em 1936 e mata-o ali, assombrado pelo fantasma de
    Pessoa, ao longo de um ano de fascismo em ascensão. Pessoa nunca escreveu
    um fim para Reis, pelo que o fim que a maior parte dos leitores carrega foi
    inventado cinquenta anos depois por outro romancista, e não faz parte da
    biografia que lhe está escrita. Um futuro prémio Nobel a tratar um autor
    inventado como uma personagem à disposição de qualquer um é também a medida
    mais clara do que os heterónimos se tinham tornado nos anos 1980.

- id: pessoa-jeronimos-1985
  title: Transferido para os Jerónimos, ao lado de Camões
  description: >
    No cinquentenário da sua morte, o Estado transladou os restos mortais de
    Pessoa do cemitério dos Prazeres para o Mosteiro dos Jerónimos, em Belém,
    em cerimónia oficial. O túmulo, de Lagoa Henriques, fica na ala norte do
    claustro inferior, no edifício que já guardava Vasco da Gama e Luís de
    Camões. Cinquenta anos depois de um funeral a que assistiu um punhado de
    amigos, o autor de [[work:fernando-pessoa/mensagem|Mensagem]] foi instalado
    no panteão nacional dos descobrimentos sobre os quais o seu único livro
    português tinha escrito.

- id: pessoa-centenary-1988
  title: O centenário, e a cidade compra-lhe a biblioteca
  description: >
    O centenário do nascimento foi assinalado com colóquios, exposições e uma
    vaga de novas edições, altura em que já era lido, traduzido e estudado à
    escala mundial e não nacional. Nesse mesmo ano a Câmara Municipal de Lisboa
    comprou à família um lote de objetos pessoais, duas peças de mobiliário e
    cerca de mil e duzentos livros da sua biblioteca, os volumes ingleses e
    portugueses anotados que tinha lido. Essa compra, distinta do espólio
    manuscrito que o Estado comprara em 1979, é aquilo com que a Casa Fernando
    Pessoa abriu cinco anos mais tarde.

- id: pessoa-disquiet-four-english-1991
  title: O Desassossego chega ao inglês quatro vezes de uma só vez
  description: >
    O [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]
    passara ao castelhano em 1984, ao alemão em 1985, ao italiano em 1986 e ao
    francês em 1988; em 1991 apareceram, no mesmo ano, quatro versões inglesas
    distintas, traduzidas por Richard Zenith, Iain Watson, Alfred Mac Adam e
    Margaret Jull Costa. Como Pessoa deixou os fragmentos sem ordem e cada
    editor reconstrói o livro de outra maneira, as quatro não são tanto
    traduções concorrentes de um texto como quatro livros diferentes, e é assim
    que um leitor anglófono pode ter em casa dois exemplares do Book of
    Disquiet que quase não coincidem.

- id: pessoa-casa-opens-1993
  title: Abre a casa da Rua Coelho da Rocha
  description: >
    A Casa Fernando Pessoa abriu a 30 de novembro de 1993, no aniversário da
    sua morte, na Rua Coelho da Rocha 16-18, em Campo de Ourique: o prédio que
    arrendou em nome da mãe em março de 1920 e onde viveu até morrer. A Câmara
    Municipal de Lisboa comprara-o no final da década de 1980, em mau estado e
    em risco de demolição. O seu acervo de referência é a biblioteca do próprio
    Pessoa, cerca de mil e trezentos títulos, na maioria em inglês e
    densamente anotados, em linha desde 2010.

- id: pessoa-western-canon-1994
  title: Bloom põe-no entre os vinte e seis
  description: >
    The Western Canon, de Harold Bloom, apontou vinte e seis escritores como o
    centro da literatura ocidental, e Pessoa era um deles, ao lado de
    Shakespeare, Cervantes, Tolstói e Joyce. Cinquenta e nove anos depois de
    uma morte em que era uma figura menor de Lisboa, conhecida de um círculo de
    revista, um crítico americano a escrever para o grande público tratava-o
    como indiscutível.

- id: pessoa-zenith-desassossego-1998
  title: A reconstrução de Zenith passa a ser o texto corrente
  description: >
    O [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]] num
    só volume, estabelecido por Richard Zenith para a Assírio & Alvim, é a
    versão que a maioria dos leitores portugueses tem tido nas mãos desde
    então, e a base da edição inglesa que ele publicou na Penguin três anos
    depois. É uma reconstrução entre várias e não um texto definitivo, que é a
    condição permanente deste livro: não há ordem manuscrita para repor, pelo
    que é o editor que decide o que o leitor vai viver.

- id: pessoa-bokklubben-2002
  title: Cem escritores votam o Desassossego entre os melhores do mundo
  description: >
    A lista dos cem melhores livros de sempre do clube do livro norueguês,
    escolhida por cem escritores de cinquenta e quatro países, incluiu o
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]. Uma
    votação é uma votação, mas os votantes eram romancistas e poetas, e não
    críticos, e ela regista até que ponto um livro sem texto fixo, publicado em
    1982 a partir de um monte por ordenar, tinha entrado no cânone de trabalho
    de quem escreve.

- id: pessoa-critical-desassossego-2010
  title: A edição crítica volta aos papéis
  description: >
    A edição crítica de Jerónimo Pizarro para a Imprensa Nacional-Casa da
    Moeda, em dois volumes, restabeleceu o
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]] a
    partir dos manuscritos da Biblioteca Nacional e não dos arranjos dos
    editores anteriores, e chegou ao grande público como edição corrente da
    Tinta-da-china em 2013. Pertence à fase que a compra de 1979 tornou
    possível: a arca é um arquivo público, pelo que as escolhas de um editor
    podem ser conferidas contra as folhas em vez de aceites por confiança.

- id: pessoa-national-treasure-2019
  title: Os papéis são classificados tesouro nacional
  description: >
    O espólio documental foi classificado como bem de interesse nacional e
    designado tesouro nacional, a proteção mais forte que a lei do património
    português dá a uma coleção. Oitenta e quatro anos depois de uma arca de
    folhas soltas ter ficado num andar de Campo de Ourique, o que dela resta
    por publicar está legalmente ao nível de um monumento, e continua a ser
    editado: os volumes no fim desta estante saem de papéis que ninguém tinha
    lido quando a Casa Fernando Pessoa abriu.
