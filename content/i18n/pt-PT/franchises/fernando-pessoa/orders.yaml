# Português europeu (pt-PT) - ordens de leitura curadas.
# `name`, `rationale` e `debated` são prosa que o leitor lê; orderedWorkIds,
# type e source são dado funcional e não se repetem aqui. Os títulos das obras
# citadas já estão em português e ficam como estão.

- id: fernando-pessoa/by-signature
  name: Pelo nome na capa
  rationale: >
    Pessoa arrumou a sua própria obra pelo autor inventado que a assinava, e
    Portugal continua a lê-lo assim: o programa da escola, o museu instalado na
    sua última casa e todos os editores que reuniram a poesia arrumam-na um
    nome de cada vez. A ordem de publicação não consegue mostrar isso, porque
    estes livros saíram de uma arca pela ordem em que os editores lá foram
    chegando, com décadas de intervalo e sem relação uns com os outros. Esta
    ordem repõe um volume por nome na sequência que o programa fixa: a poesia
    que Pessoa assinou ele mesmo, depois o pastor Alberto Caeiro, o classicista
    Ricardo Reis e o engenheiro naval Álvaro de Campos, depois
    [[work:fernando-pessoa/mensagem|Mensagem]], e por fim os dois livros de
    prosa deixados pelos homens meio inventados, Bernardo Soares e o Barão de
    Teive, cujas personalidades são a do próprio Pessoa com pedaços cortados, e
    não inteiramente as de outros homens. Cada voz chega inteira, com a sua
    maneira e a sua discussão com as restantes, em vez de a uma década de
    distância. Custa muito: sete volumes em cinquenta e quatro, o que deixa de
    fora a crítica, a política, a escrita ocultista, o teatro, a ficção e as
    cartas, a maior parte desta estante. E esconde a única coisa que a ordem
    predefinida conta melhor do que tudo o resto, que este corpo de obra foi
    montado em público ao longo de setenta anos por gente a ler a letra de um
    morto.
  debated:
    - "O lugar da poesia assinada pelo próprio Fernando Pessoa não está fixado. O programa português põe-na primeiro, à frente dos autores inventados, e esta ordem segue-o por ser esse o único documento que estabelece de facto uma sequência. O relato do próprio Pessoa vai ao contrário: Caeiro apareceu primeiro e é o mestre em relação ao qual todas as outras vozes se posicionam, incluindo a dele, o que é o argumento para abrir antes com Poemas de Alberto Caeiro."
    - "[[work:fernando-pessoa/o-guardador-de-rebanhos|O Guardador de Rebanhos]] não está aqui listado à parte, e é deliberado. A bibliografia portuguesa cataloga-o como livro de 1925, a partir da sua saída na revista Athena, e ele é também o primeiro terço de [[work:fernando-pessoa/poemas-de-alberto-caeiro|Poemas de Alberto Caeiro]] (1946), que é o volume que esta ordem leva em vez dele. Quem percorra a ordem de publicação encontra esses quarenta e nove poemas duas vezes, com seis volumes e vinte e um anos de intervalo."
    - "[[work:fernando-pessoa/a-educacao-do-estoico|A Educação do Estóico]] é a única assinatura que nenhum guia arruma. O programa e a Casa Fernando Pessoa param ambos em cinco nomes, e o Barão de Teive não está entre eles. Fica aqui em último por ser o mais tardio destes volumes a ser impresso, e por se ler contra o [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]: um homem que não consegue parar de escrever sobre nada, e outro que queimou tudo o que escreveu."
    - "A poesia ortónima não parou nas Poesias de 1942. Poesias Inéditas (1930-1935), Poesias Inéditas (1919-1930) e Novas Poesias Inéditas são três suplementos posteriores ao mesmo corpo, e Poemas Ingleses reúne o verso inglês. Do lado ortónimo esta ordem leva apenas o volume de 1942 e Mensagem, pelo que os quatro ficam de fora dela; a ordem predefinida, derivada, tem-nos nos seus próprios anos."
