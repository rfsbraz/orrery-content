# Português europeu (pt-PT) - sinopses.
#
# Os títulos das obras NÃO são traduzidos aqui (ver docs/SCHEMA.md, "Never
# translate a published title"): um título traduzido só existe como edição, em
# editions.yaml. Quase toda esta estante já tem título português de origem. As
# quatro excepções são os livros que Pessoa escreveu e publicou em inglês -
# Antinous, 35 Sonnets, English Poems I-II e English Poems III - que ficam com
# o título inglês também na página portuguesa: editions.yaml só regista edições
# `en` para os quatro, e nenhuma edição portuguesa desses volumes foi
# localizada.
#
# `note:` não é traduzido: é anotação de curadoria e não chega ao leitor (só
# `synopsis` é lida). A nota de Poemas Dramáticos, que explica onde a sinopse
# pára para não estragar o fim de O Marinheiro, fica portanto na língua de base.
#
# Onde a prosa inglesa usa uma fórmula que é de Pessoa e existe em português,
# é a portuguesa que está aqui e não uma retradução: "autobiografia sem
# factos" (Livro do Desassossego), "drama em gente" (Ficções do Interlúdio),
# "supra-Camões" e "supra-poeta" (a fórmula dos artigos d'A Águia de 1912),
# "tábuas bibliográficas" (a Tábua Bibliográfica de 1928), e "arca" para o
# espólio deixado em 1935.

- id: fernando-pessoa/antinous
  synopsis: >
    Um poema longo em inglês, publicado como folheto de dezasseis páginas: o
    imperador Adriano a velar o corpo do seu amante afogado, Antínoo, e a
    argumentar consigo próprio contra o facto da morte. Uma das duas primeiras
    coisas que Pessoa imprimiu em livro, a expensas suas.

- id: fernando-pessoa/35-sonnets
  synopsis: >
    Trinta e cinco sonetos ingleses num registo deliberadamente isabelino,
    impressos em Lisboa no mesmo ano de Antinous e enviados à imprensa
    britânica. O Times Literary Supplement deu por eles, o que foi o mais
    parecido com reconhecimento literário que Pessoa teve fora de Portugal em
    vida.

- id: fernando-pessoa/english-poems-i-ii
  synopsis: >
    A parte I é um Antinous revisto; a parte II são as "Inscriptions", catorze
    epitáfios breves à maneira da Antologia Grega, ditos pelos mortos sobre
    vidas já acabadas. Publicado pela Olisipo, a pequena editora que o próprio
    Pessoa fundou nesse ano.

- id: fernando-pessoa/english-poems-iii
  synopsis: >
    "Epithalamium", um poema de noite de núpcias de apetite físico franco e
    implacável, saído na Olisipo como o terceiro dos folhetos English Poems e a
    coisa mais estranha a que Pessoa alguma vez pôs o seu próprio nome em letra
    impressa.

- id: fernando-pessoa/o-banqueiro-anarquista
  synopsis: >
    Ao jantar, um banqueiro rico demonstra ao seu companheiro de mesa, por
    lógica pura e sem levantar uma única vez a voz, que é o único anarquista
    coerente que existe e que a sua fortuna é a prova disso. Uma sátira de
    argumento sem falhas e de conclusão monstruosa.

- id: fernando-pessoa/o-guardador-de-rebanhos
  synopsis: >
    Quarenta e nove poemas do pastor Alberto Caeiro, escritos num só dia de
    março de 1914 e publicados onze anos depois no quarto e no quinto números
    da Athena, a revista de Pessoa. Uma poesia que se recusa a pensar: as
    coisas são exatamente tantas quantas são, uma flor não significa nada além
    de si própria, e o único mistério é haver quem procure um.

- id: fernando-pessoa/o-interregno
  synopsis: >
    Um folheto que defende a ditadura militar instalada em 1926 como matéria de
    ciência política e não de política: um país cuja opinião pública se
    desagregou não pode ser governado pela opinião, e o que lhe faz falta é um
    interregno, um estado suspenso mantido pela força até voltar a existir uma
    nação para consultar. Saiu pelo Núcleo de Acção Nacional, em Lisboa, e é o
    item da bibliografia mais difícil de conciliar com os escritos contra
    Salazar que saíram da mesma gaveta poucos anos depois.

- id: fernando-pessoa/mensagem
  synopsis: >
    Quarenta e quatro poemas curtos dispostos como um brasão, um mar e uma
    profecia: os fundadores de Portugal, os navegadores, e um Quinto Império
    prometido que é espiritual e não territorial. O único livro em língua
    portuguesa que Pessoa publicou em vida, e o que lhe valeu um prémio
    nacional no ano anterior à sua morte.

- id: fernando-pessoa/poesias
  synopsis: >
    O primeiro volume tirado da arca, sete anos depois da morte: a poesia
    ortónima, os poemas assinados pelo próprio Fernando Pessoa, reunidos por
    João Gaspar Simões e Luiz de Montalvor para a Ática. Tudo o que na estante
    vem abaixo desta linha existe porque este livro vendeu.

- id: fernando-pessoa/poesias-de-alvaro-de-campos
  synopsis: >
    A poesia do engenheiro naval reunida pela primeira vez: as odes futuristas,
    embriagadas de máquinas, de 1914 e 1915, a viagem ao Oriente do "Opiário",
    e os poemas lisboetas tardios em que o apetite de tudo azedou até dar um
    homem a uma janela a olhar para uma tabacaria do outro lado da rua.

- id: fernando-pessoa/cartas-a-armando-cortes-rodrigues
  synopsis: >
    Cartas a um companheiro de Orpheu, escritas nos anos em que os heterónimos
    estavam a ser construídos, publicadas com uma introdução de Joel Serrão. A
    primeira correspondência de Pessoa a chegar à letra impressa, e o lugar
    mais antigo onde se podia ler o seu próprio relato do que andava a fazer.

- id: fernando-pessoa/poemas-de-alberto-caeiro
  synopsis: >
    A poesia completa do mestre num só volume pela primeira vez:
    [[work:fernando-pessoa/o-guardador-de-rebanhos|O Guardador de Rebanhos]],
    as seis peças de O Pastor Amoroso, e os quarenta e nove Poemas Inconjuntos
    escritos, dentro da ficção, nos meses anteriores à morte de Caeiro.

- id: fernando-pessoa/odes-de-ricardo-reis
  synopsis: >
    Odes pagãs breves em metro clássico estrito, a aconselhar distância de uma
    vida que vai acabar de qualquer maneira: coroa-te de rosas, não peças nada,
    e deixa o rio levar. As primeiras Odes tinham saído na Athena em 1924; este
    é o volume que fez de Reis um poeta com livro.

- id: fernando-pessoa/paginas-de-doutrina-estetica
  synopsis: >
    O primeiro livro de prosa crítica de Pessoa, selecionado, prefaciado e
    anotado pelo poeta Jorge de Sena: o sensacionismo explicado pelo seu
    inventor, o processo à literatura do seu tempo, e as páginas sobre o que é
    um poeta e sobre o que é que Portugal devia fazer com um. Pôs a teoria nas
    mãos dos leitores vinte anos antes dos volumes Páginas da Ática.

- id: fernando-pessoa/poemas-dramaticos
  synopsis: >
    O teatro de Pessoa, tal como é: o drama estático O Marinheiro, em que
    três mulheres velam uma quarta ao longo de uma noite e contam uma à outra a
    história de um marinheiro náufrago que sonhou para si uma pátria até já não
    conseguir lembrar-se da verdadeira, a par dos primeiros fragmentos
    publicados do Fausto de toda a sua vida.

- id: fernando-pessoa/poesias-ineditas-1930-1935
  synopsis: >
    Poemas ortónimos inéditos dos últimos cinco anos da sua vida, o primeiro
    suplemento às Poesias de 1942.

- id: fernando-pessoa/poesias-ineditas-1919-1930
  synopsis: >
    O suplemento companheiro, que recua sobre a década anterior. Os dois
    volumes foram publicados fora da ordem cronológica, primeiro os anos mais
    tardios.

- id: fernando-pessoa/cartas-a-joao-gaspar-simoes
  synopsis: >
    Cartas ao crítico da presença que viria a ser o primeiro biógrafo de
    Pessoa, publicadas pelo destinatário com notas e apêndice seus.

- id: fernando-pessoa/quadras-ao-gosto-popular
  synopsis: >
    Centenas de quadras de quatro versos à maneira popular portuguesa, escritas
    para seu próprio divertimento e nunca destinadas a um livro. A coisa mais
    simples que há na arca, do escritor mais complicado que lá está.

- id: fernando-pessoa/paginas-intimas-e-de-auto-interpretacao
  synopsis: >
    Pessoa a explicar Pessoa: os rascunhos, prefácios e autoanálises em que
    expõe o que são os heterónimos, como se relacionam entre si e o que julgava
    estar a fazer. A prova de primeira mão por trás de quase tudo o que se diz
    sobre ele.

- id: fernando-pessoa/paginas-de-estetica-e-de-teoria-e-critica-literarias
  synopsis: >
    Os escritos críticos: o sensacionismo, a defesa de um supra-Camões
    português, e uma discussão continuada com a literatura do seu próprio
    tempo, boa parte dela escrita para revistas que fecharam antes de a poderem
    imprimir.

- id: fernando-pessoa/textos-filosoficos
  synopsis: >
    Dois volumes de notas e fragmentos filosóficos em português e em inglês,
    sobre a sensação, o idealismo e a realidade do eu, vários deles assinados
    por filósofos inventados e não por Pessoa.

- id: fernando-pessoa/novas-poesias-ineditas
  synopsis: >
    Uma terceira recolha de poemas até então inéditos, dezassete anos depois da
    segunda, à medida que a catalogação da arca foi entrando mais fundo.

- id: fernando-pessoa/poemas-ingleses
  synopsis: >
    A poesia inglesa reunida e apresentada com a tradução portuguesa ao lado,
    ao cuidado do poeta Jorge de Sena, com variantes e notas: os quatro
    folhetos publicados em vida mais o verso inglês inédito dos anos de Durban
    e dos que se lhes seguiram.

- id: fernando-pessoa/cartas-de-amor
  synopsis: >
    As cartas a Ophélia Queiroz, a dactilógrafa do escritório que namorou em
    1920 e outra vez em 1929 e deixou das duas vezes. Escritas numa linguagem
    infantil só dos dois, e interrompidas por Álvaro de Campos, que também lhe
    escreve, para lhe dizer que o namoro devia acabar.

- id: fernando-pessoa/da-republica
  synopsis: >
    Vinte e cinco anos de escrita política sobre a Primeira República
    portuguesa, reunidos por Joel Serrão: o desprezo monárquico dos primeiros
    tempos, o nacionalismo místico, e os textos tardios contra Salazar e o
    Estado Novo que a censura travou.

- id: fernando-pessoa/sobre-portugal
  synopsis: >
    O volume companheiro de Da República: Pessoa sobre para que serve Portugal,
    o mito sebastianista, e a defesa de um renascimento nacional que passou a
    vida a profetizar e nunca esperou ver.

- id: fernando-pessoa/ultimatum-e-paginas-de-sociologia-politica
  synopsis: >
    O "Ultimatum" de Álvaro de Campos, de 1917, um libelo que expulsa nome a
    nome toda a cultura europeia contemporânea, impresso com a prosa política e
    sociológica que o rodeia.

- id: fernando-pessoa/textos-de-critica-e-intervencao
  synopsis: >
    Polémicas e intervenções: os textos de revista, as cartas abertas e os
    manifestos com que Pessoa foi armando discussão com a vida literária e
    pública portuguesa por detrás de um nome ou de outro.

- id: fernando-pessoa/livro-do-desassossego
  synopsis: >
    Uma "autobiografia sem factos" em mais de quinhentos fragmentos, guardada
    por um ajudante de guarda-livros da Rua dos Douradores que não vai a lado
    nenhum, não faz nada, e regista o tempo que faz dentro de uma cabeça com
    uma precisão terrível. Pessoa escreveu-o ao longo de duas décadas, não
    acabou nada, não ordenou nada, e deixou-o na arca.

- id: fernando-pessoa/fausto-tragedia-subjectiva
  synopsis: >
    O drama em verso em que Pessoa trabalhou dos vinte anos até à morte e nunca
    acabou: um Fausto que não faz pacto nenhum e não ganha mundo nenhum, apenas
    o horror da consciência a examinar-se a si própria. Reunido a partir dos
    manuscritos por Teresa Sobral Cunha, com prefácio de Eduardo Lourenço.

- id: fernando-pessoa/a-grande-alma-portuguesa
  synopsis: >
    Escritos sobre o destino e o caráter de Portugal, do lado esotérico dos
    papéis, estabelecidos e apresentados por Pedro Teixeira da Mota.

- id: fernando-pessoa/moral-regras-de-vida-condicoes-de-iniciacao
  synopsis: >
    Notas para uma ética prática e para as condições de iniciação numa ordem
    ocultista, da mesma série de papéis esotéricos organizada por Pedro
    Teixeira da Mota.

- id: fernando-pessoa/rosea-cruz
  synopsis: >
    Pessoa sobre o rosacrucianismo, a sobrevivência templária e a tradição
    iniciática através da qual lia a história de Portugal, a matéria que está
    também por trás das secções do "Mar Português" e do Quinto Império de
    Mensagem.

- id: fernando-pessoa/poesia-profetica-magica-e-espiritual
  synopsis: >
    O verso ocultista: poemas iniciáticos, proféticos e mágicos recolhidos ao
    longo dos papéis e comentados por quem os organizou.

- id: fernando-pessoa/lisboa-o-que-o-turista-deve-ver
  synopsis: >
    Um guia de Lisboa que Pessoa escreveu em inglês nos anos 1920 e nunca
    conseguiu colocar, e que leva um visitante imaginado Tejo acima e pela
    cidade fora, rua a rua, monumento a monumento, em prosa comercial sem
    relevo. Publicado sessenta anos depois em tradução portuguesa.

- id: fernando-pessoa/a-hora-do-diabo
  synopsis: >
    Uma mulher grávida que volta a pé para casa de um baile de máscaras é
    acompanhada pelo Diabo, que passa a noite a explicar-lhe que não cria nada,
    apenas imagina, e que é por isso que não é mau, apenas necessário.
    Estabelecido a partir dos manuscritos por Teresa Rita Lopes.

- id: fernando-pessoa/a-lingua-portuguesa
  synopsis: >
    Pessoa sobre a sua própria língua: a reforma ortográfica, o intraduzível, e
    a frase pela qual é citado mais do que por qualquer outra, a de que a sua
    pátria é a língua portuguesa.

- id: fernando-pessoa/ficcoes-do-interludio
  synopsis: >
    Os poemas que Pessoa efetivamente publicou em revistas ao longo da vida,
    reunidos de novo sob o título que planeara dar ao conjunto da obra
    heteronímica: ficções do interlúdio, o drama em gente em vez de o drama em
    atos.

- id: fernando-pessoa/a-educacao-do-estoico
  synopsis: >
    O único manuscrito sobrevivente do Barão de Teive, um aristocrata que
    queimou tudo o resto que escreveu por não o conseguir acabar, e que expõe
    com total lucidez porque está prestes a matar-se. Ao cuidado de Richard
    Zenith.

- id: fernando-pessoa/correspondencia-1905-1922
  synopsis: >
    O primeiro volume da correspondência reunida, ao cuidado de Manuela
    Parreira da Silva: o rescaldo de Durban, a fundação do Orpheu, a morte de
    Sá-Carneiro, e os projetos de negócio que iam sempre por água abaixo.

- id: fernando-pessoa/correspondencia-1923-1935
  synopsis: >
    O segundo volume, que contém o documento mais citado de todos os estudos
    pessoanos: a carta de 13 de janeiro de 1935 a Adolfo Casais Monteiro em que
    Pessoa conta, por ordem e com datas, como nasceram os heterónimos.

- id: fernando-pessoa/herostrato-e-a-busca-da-imortalidade
  synopsis: >
    Um tratado inacabado, escrito em inglês, sobre a fama literária: porque
    sobrevivem certas reputações, porque a celebridade e a grandeza quase nunca
    coincidem, e o que pode um escritor que ninguém lê esperar razoavelmente da
    posteridade. Escrito por um homem com uma arca de obra inédita.

- id: fernando-pessoa/critica-ensaios-artigos-e-entrevistas
  synopsis: >
    A crítica publicada de Pessoa, reunida por Fernando Cabral Martins, dos
    artigos de 1912 n'A Águia que anunciavam a chegada de um supra-poeta
    português às entrevistas que deu, e por vezes escreveu ele próprio, nos
    últimos anos.

- id: fernando-pessoa/aforismos-e-afins
  synopsis: >
    Aforismos e proposições de uma linha dispersos pelos papéis, recolhidos por
    Richard Zenith: a forma comprimida de um escritor cujos projetos mais
    longos ficaram todos por acabar.

- id: fernando-pessoa/escritos-autobiograficos-automaticos-e-de-reflexao-pessoal
  synopsis: >
    Diários, autodiagnósticos e escrita automática produzida em transe,
    incluindo as sessões mediúnicas de 1916, em que entidades lhe ditavam
    textos e comentavam a sua vida privada.

- id: fernando-pessoa/quaresma-decifrador
  synopsis: >
    Os contos policiais: Abílio Quaresma, um médico sem licença que resolve
    crimes sem sair da cadeira, segundo o princípio explícito de que o
    raciocínio vale mais do que a prova. Reunidos a partir dos papéis por Ana
    Maria Freitas, setenta e três anos depois da morte de Pessoa.

- id: fernando-pessoa/sensacionismo-e-outros-ismos
  synopsis: >
    Setecentas páginas sobre os movimentos a que Pessoa aderiu, que inventou ou
    que anunciou e depois abandonou: o sensacionismo acima de tudo e, à volta
    dele, o paulismo, o interseccionismo, o futurismo e o resto dos manifestos
    que moviam a geração do Orpheu. Estabelecido a partir dos papéis por
    Jerónimo Pizarro, como décimo volume da edição crítica nacional.

- id: fernando-pessoa/associacoes-secretas-e-outros-escritos
  synopsis: >
    Pessoa sobre a maçonaria e as ordens iniciáticas, reunido por José Barreto
    em torno do artigo que publicou no Diário de Lisboa em fevereiro de 1935
    contra o projeto de lei que as ilegalizaria. A última discussão pública em
    que se meteu, nove meses antes de morrer, e a única vez que o ocultista
    privado defendeu a sua causa num jornal.

- id: fernando-pessoa/argumentos-para-filmes
  synopsis: >
    Tratamentos de filme escritos em português e em inglês para um cinema a que
    Pessoa não tinha acesso nenhum: sinopses, argumentos e propostas, alguns
    deles para concursos, impressos pela primeira vez com traduções de Patrício
    Ferrari e Claudia J. Fischer. O homem que quase nada publicou continuava a
    rascunhar para qualquer meio novo que aparecesse.

- id: fernando-pessoa/iberia
  synopsis: >
    O livro inacabado sobre a Ibéria: Portugal e Espanha defendidos como uma só
    unidade civilizacional cujo imperialismo futuro tem de ser cultural e não
    territorial, porque o territorial acabou e nunca foi aquilo para que a
    península serviu. O gémeo em prosa do Quinto Império que
    [[work:fernando-pessoa/mensagem|Mensagem]] põe em verso. Estabelecido por
    Jerónimo Pizarro e Pablo Javier Pérez López.

- id: fernando-pessoa/teoria-da-heteronimia
  synopsis: >
    Tudo o que Pessoa escreveu sobre o modo como os autores inventados
    funcionavam, num só volume: os prefácios que rascunhou e nunca usou, as
    notas sobre um drama feito de gente em vez de atos, as tábuas
    bibliográficas que separam pseudónimo de heterónimo, e as cartas em que
    explica o sistema às poucas pessoas que perguntaram. Ao cuidado de Fernando
    Cabral Martins e Richard Zenith.

- id: fernando-pessoa/o-regresso-dos-deuses
  synopsis: >
    Os escritos de António Mora, o filósofo que Pessoa inventou para dar um
    sistema ao paganismo de Caeiro: os deuses argumentados de volta à
    existência como metafísica e não como nostalgia, e o cristianismo tratado
    como uma interrupção com que a Europa está prestes a acabar. Ao cuidado de
    Manuela Parreira da Silva.

- id: fernando-pessoa/sobre-o-fascismo-a-ditadura-militar-e-salazar
  synopsis: >
    A escrita política sobre a ditadura, reunida e anotada por José Barreto: o
    golpe de 1926, a ditadura militar, o fascismo italiano, e a lenta viragem
    contra o Estado Novo de Salazar, contra o corporativismo e contra a censura
    nos últimos anos da vida de Pessoa.
