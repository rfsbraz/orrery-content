# Português europeu (pt-PT) - eras. Cada entrada leva `title`, `description`
# e `themes` (docs/SCHEMA.md; `themes` é a lista de frases curtas mostrada
# sob o título da era na placa - ver a nota em scripts/i18n_coverage.py).
# `note:` não é traduzido: nenhum overlay pt-PT deste catálogo o traduz, o
# campo é uma justificação de fronteira dirigida a quem cura a ala, não
# prosa que o leitor vê.
#
# "Middle-earth" traduz-se por "Terra-Média"; "First Age"/"Second Age" por
# "Primeira Era"/"Segunda Era", os termos estabelecidos nas edições
# portuguesas de Tolkien.
#
# CITAÇÕES VERBATIM: onde a description cita as palavras exatas de uma fonte
# real (o Tolkien Estate, entre aspas), essa citação fica em inglês, verbatim,
# dentro da prosa traduzida, tal como em hp-lovecraft.yaml e
# miguel-de-cervantes.yaml - não se inventa aqui uma tradução portuguesa
# apresentada como as palavras exatas dessa fonte. "the third age", o título
# que Carpenter dá a uma das suas partes, é também citado verbatim pelo mesmo
# motivo: é o título de um capítulo de um livro inglês, não uma frase comum.

- id: the-hobbit-years
  title: Os Anos de The Hobbit
  themes:
    - as cátedras de Oxford
    - os Inklings
    - a filologia como invenção
    - um livro infantil que escapou
    - a sequela que não queria terminar
  description: >
    Carpenter dá a estes vinte e quatro anos duas partes da sua biografia e
    nenhum nome único, chamando-lhes uma vez pela primeira frase de The
    Hobbit e outra vez "the third age". Abrem com a eleição de Tolkien para
    a Cátedra Rawlinson e Bosworth de Anglo-Saxónico em Oxford, em 1925,
    vindo de Leeds com a edição em inglês médio que ali fizera com E. V.
    Gordon, [[work:jrr-tolkien/sir-gawain-and-the-green-knight-middle-english-text|Sir
    Gawain and the Green Knight]], publicada nesse mesmo ano e texto de
    referência durante décadas depois. Conheceu C. S. Lewis em 1926, leu em
    voz alta com ele e com os outros Inklings durante os vinte anos
    seguintes, proferiu em 1936 a conferência da British Academy que mudou a
    forma de ler Beowulf, e em 1937 publicou
    [[work:jrr-tolkien/the-hobbit|The Hobbit]], a primeira das suas ficções
    alguma vez impressa. A Allen & Unwin pediu-lhe uma sequela nesse
    dezembro e rejeitou o material do Silmarillion que ele ofereceu em vez
    dela; começou a sequela nesse mesmo mês e terminou o texto
    dactilografado em 1949. As outras duas obras datadas destes anos
    pertencem ambas ao argumento por baixo da ficção:
    [[work:jrr-tolkien/on-fairy-stories|On Fairy-Stories]], a Andrew Lang
    Lecture de 1939 impressa em 1947, e
    [[work:jrr-tolkien/farmer-giles-of-ham|Farmer Giles of Ham]], em 1949.

- id: success
  title: Sucesso
  themes:
    - a longa espera por um editor
    - críticas divididas
    - a guerra dos livros de bolso
    - o Silmarillion ainda por terminar
  description: >
    O título de uma só palavra que Carpenter dá aos anos depois de o
    manuscrito estar pronto. Foram precisos cinco deles só para chegar a um
    editor - Tolkien tentou colocar The Lord of the Rings e o Silmarillion
    juntos, falhou, e acabou por deixar a Allen & Unwin ficar só com o
    romance - e [[work:jrr-tolkien/the-lord-of-the-rings|The Lord of the
    Rings]] saiu ao longo de 1954 e 1955 em três volumes, porque os custos
    de impressão não permitiam outra forma. As críticas dividiram-se com
    violência, W. H. Auden e C. S. Lewis contra Edmund Wilson e Edwin Muir;
    a BBC condensou-o em doze episódios radiofónicos ao longo de 1955 e 1956; e as vendas
    ultrapassaram de tal forma o ponto de equilíbrio que Tolkien lamentou
    não se ter reformado mais cedo. O que o tornou num fenómeno veio depois
    e por acaso, quando uma edição de bolso americana não autorizada, em
    1965, pôs o livro em todas as drogarias e a disputa de direitos de autor
    o anunciou a milhões que nunca tinham ouvido falar dele. A outra obra
    destes anos é pequena e deliberada: a peça em verso
    [[work:jrr-tolkien/the-homecoming-of-beorhtnoth-beorhthelms-son|The
    Homecoming of Beorhtnoth Beorhthelm's Son]], em 1953,
    [[work:jrr-tolkien/the-adventures-of-tom-bombadil|The Adventures of Tom
    Bombadil]], em 1962, reunida a sugestão da sua tia, e
    [[work:jrr-tolkien/tree-and-leaf|Tree and Leaf]], em 1964.

- id: the-last-years
  title: Os Últimos Anos
  themes:
    - a reforma
    - uma fama que não tinha pedido
    - elegia
    - Edith
  description: >
    O título que Carpenter dá ao período que vai da reforma de Tolkien até
    à sua morte, e os anos em que publicou os seus dois últimos livros,
    ambos em 1967: [[work:jrr-tolkien/smith-of-wootton-major|Smith of
    Wootton Major]], uma história de fadas que o Tolkien Estate descreve
    como escrita a partir de "the bereavement of 'retirement', and of
    advancing age", e [[work:jrr-tolkien/the-road-goes-ever-on|The Road
    Goes Ever On]], os seus poemas musicados por Donald Swann. Tinha
    proferido o seu discurso de despedida em Merton em junho de 1959; em
    1968, ele e Edith mudaram-se para um bungalow em Poole para viverem
    tranquilamente, e por essa altura The Lord of the Rings tinha-se
    tornado quase uma escritura sagrada para uma contracultura que ele não
    tinha procurado e de que não gostava muito. Edith morreu em novembro de
    1971. Regressou a Oxford, para os aposentos que Merton lhe deu, foi
    feito CBE em 1972, e morreu a 2 de setembro de 1973 com o Silmarillion
    ainda por terminar, depois de cinquenta e sete anos de trabalho.

- id: the-christopher-tolkien-years
  title: Os Anos de Christopher Tolkien
  themes:
    - um filho como editor
    - rascunhos transformados em livros
    - quarenta e cinco anos de manuscritos
    - as Grandes Histórias como volumes autónomos
  description: >
    Nomeado na carta de 1967 do pai como testamenteiro literário e como
    coautor do Silmarillion, Christopher Tolkien levou os manuscritos para a
    sua casa em Oxfordshire depois da morte de 1973, converteu um celeiro em
    espaço de trabalho, e em setembro de 1975 demitiu-se da sua bolsa no New
    College, Oxford, para não trabalhar em mais nada. Mudou-se para França e
    manteve-se nisso durante quarenta e cinco anos, publicando vinte e
    quatro volumes: [[work:jrr-tolkien/the-silmarillion|The Silmarillion]],
    em 1977, construído em narrativa contínua;
    [[work:jrr-tolkien/unfinished-tales|Unfinished Tales]], em 1980,
    deliberadamente deixado fragmentário, com comentário no seu lugar;
    [[work:jrr-tolkien/the-history-of-middle-earth|The History of
    Middle-earth]], entre 1983 e 1996, doze volumes que expõem, rascunho a
    rascunho, como todo o legendarium tinha sido feito; e depois as três
    Grandes Histórias como livros autónomos,
    [[work:jrr-tolkien/the-children-of-hurin|The Children of Húrin]] (2007),
    [[work:jrr-tolkien/beren-and-luthien|Beren and Lúthien]] (2017) e
    [[work:jrr-tolkien/the-fall-of-gondolin|The Fall of Gondolin]] (2018). A
    cronologia do próprio Tolkien Estate termina neste último livro, com a
    nota de que foi a última publicação de Christopher Tolkien e de que
    tinha "dedicated more than forty-five years to studying, editing and
    publishing his father's works". Morreu a 16 de janeiro de 2020.
