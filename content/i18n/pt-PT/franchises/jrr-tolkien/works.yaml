# Tradução pt-PT (português europeu) - sinopses. Os títulos de obras NÃO são
# traduzidos aqui (docs/SCHEMA.md, "Never translate a published title"): um
# título traduzido só existe como edição, em editions.yaml, e esta ala só
# tem uma edição portuguesa registada - o terceiro volume de The Lord of the
# Rings, "O Regresso do Rei" (Europa-América, 2002) - que não cobre a obra
# tal como aqui catalogada (um romance único), pelo que nenhum título de obra
# tem tradução publicada a usar. `note:` também não é traduzido: o campo não
# chega ao leitor (só `synopsis` chega em Work), a mesma convenção já
# registada em edgar-allan-poe/works.yaml e hp-lovecraft/works.yaml.
#
# "Middle-earth" traduz-se por "Terra-Média", o termo estabelecido nas
# edições portuguesas de Tolkien; não é título de obra, é o nome do cenário.
# "First Age", "Second Age" e "Third Age" seguem o mesmo uso estabelecido:
# "Primeira Era", "Segunda Era", "Terceira Era". "The Shire" traduz-se por
# "o Condado", pelo mesmo motivo.
#
# CUIDADO COM SPOILERS: duas destas sinopses (the-adventures-of-tom-bombadil,
# smith-of-wootton-major) foram reescritas pela auditoria de spoilers desta
# ala para reter deliberadamente uma revelação de enredo. A tradução segue o
# inglês ATUAL de cada uma, não uma versão anterior nem um conhecimento mais
# completo da história que o tradutor possa ter; nenhum detalhe retido é
# reposto aqui.

# ============================= CORE (3) ==============================

- id: jrr-tolkien/the-hobbit
  synopsis: >
    Um hobbit confortável e pouco dado a aventuras é convencido a sair do seu
    buraco por um mago e treze anões decididos a reconquistar a sua montanha
    natal e o tesouro que um dragão lhes tomou, e regressa a casa tendo
    encontrado bem mais do que uma parte do ouro.

- id: jrr-tolkien/the-lord-of-the-rings
  synopsis: >
    Anos depois da aventura do seu primo Bilbo, um hobbit herda um simples
    anel de ouro que se revela a arma suprema do Senhor das Trevas Sauron, e
    tem de o levar através da Terra-Média até ao único lugar onde pode ser
    destruído, enquanto exércitos se reúnem para uma guerra que só a sua
    missão pode terminar.

- id: jrr-tolkien/the-silmarillion
  synopsis: >
    A criação do mundo e as eras mais antigas da Terra-Média: o fabrico das
    Duas Árvores e das Silmarils, as jóias que dão nome ao livro, as longas
    guerras contra o primeiro Senhor das Trevas, e o afundamento do reino
    insular de Númenor - a história profunda sobre a qual assenta a própria
    história de Bilbo e Frodo.

# ============================ EXTENDED (11) ============================

- id: jrr-tolkien/farmer-giles-of-ham
  synopsis: >
    Uma fábula cómica medieval em que um agricultor nada heroico, depois de
    afugentar por puro acaso um gigante obtuso, é tomado por um herói matador
    de dragões e tem muita dificuldade em desfazer o equívoco quando aparece
    um dragão a sério.

- id: jrr-tolkien/the-adventures-of-tom-bombadil
  synopsis: >
    Dezasseis poemas ligeiros, enquadrados como mais páginas do Livro
    Vermelho da Marca do Oeste, a fonte no universo de The Lord of the Rings
    - entre eles dois sobre o próprio Tom Bombadil, a mais enigmática das
    figuras que os hobbits do romance encontram pelo caminho.

- id: jrr-tolkien/tree-and-leaf
  synopsis: >
    O relato do próprio Tolkien sobre para que serve a fantasia e porque é
    que importa, emparelhado com um conto sobre um pintor que nunca termina
    a sua obra-prima.

- id: jrr-tolkien/the-road-goes-ever-on
  synopsis: >
    Poemas de The Lord of the Rings, vários nas línguas inventadas pelo
    próprio Tolkien, musicados pelo compositor Donald Swann e publicados com
    notas do próprio Tolkien sobre os versos e as línguas por trás deles.

- id: jrr-tolkien/smith-of-wootton-major
  synopsis: >
    Um rapaz engole uma estrela mágica cozida dentro de um bolo de festa e
    ganha passagem para a bela e perigosa terra de Faery, entrando e saindo
    dela durante anos enquanto vive uma vida comum como o ferreiro da aldeia.

- id: jrr-tolkien/sir-gawain-and-the-green-knight-pearl-and-sir-orfeo
  synopsis: >
    As traduções do próprio Tolkien, em verso inglês moderno, de três poemas
    medievais anónimos: a prova de honra arturiana Sir Gawain and the Green
    Knight, a elegia Pearl, e o romance de rapto feérico Sir Orfeo.

- id: jrr-tolkien/letters-from-father-christmas
  synopsis: >
    Cartas ilustradas, "do Pai Natal", escritas e desenhadas para os
    próprios filhos todos os Natais durante mais de vinte anos, construindo
    pouco a pouco uma história privada e contínua sobre o Pólo Norte e os
    seus problemas.

- id: jrr-tolkien/mr-bliss
  synopsis: >
    Um conto cómico ligeiro e muito ilustrado sobre um homem de cartola, o
    seu automóvel amarelo novo em folha, e o caos que este causa aos
    vizinhos, entre eles três ursos fugidos.

- id: jrr-tolkien/roverandom
  synopsis: >
    Um cão transformado num brinquedo por um mago irritadiço é levado até à
    Lua e para debaixo do mar antes de conseguir recuperar a sua forma - uma
    história que Tolkien inventou em 1925 para consolar o filho Michael pela
    perda de um cão de brincar numa praia.

- id: jrr-tolkien/the-legend-of-sigurd-and-gudrun
  synopsis: >
    O reconto do próprio Tolkien, em verso aliterativo nórdico antigo, da
    lenda dos Volsungos e dos Niflungos por trás da Edda Poética e do ciclo
    do Anel de Wagner: a morte do dragão às mãos de Sigurd, e o amor
    condenado e a vingança que se seguem.

- id: jrr-tolkien/beowulf-a-translation-and-commentary
  synopsis: >
    A tradução em prosa do próprio Tolkien de Beowulf, concluída em 1926 mas
    nunca publicada em vida, com as notas de aula que usou para ensinar o
    poema durante décadas e "Sellic Spell", a sua própria reconstrução do
    conto popular que poderá estar na sua origem.

# ============================ APOCRYPHA (18) ============================

- id: jrr-tolkien/sir-gawain-and-the-green-knight-middle-english-text
  synopsis: >
    Uma edição erudita do texto original do poema em inglês médio, com
    introdução, notas e glossário para estudantes, e não uma tradução para o
    público em geral.

- id: jrr-tolkien/on-fairy-stories
  synopsis: >
    A primeira exposição completa de Tolkien sobre o que entende por
    "história de fadas" e "subcriação", e a sua defesa da fantasia como
    forma séria e não infantil.

- id: jrr-tolkien/the-homecoming-of-beorhtnoth-beorhthelms-son
  synopsis: >
    Um breve diálogo dramático, em verso aliterativo, que imagina dois
    homens a recolher corpos da Batalha de Maldon de 991 e a discutir o que
    o "orgulho desmedido" fatal do seu senhor custou de facto aos seus
    homens.

- id: jrr-tolkien/unfinished-tales
  synopsis: >
    Uma coletânea de narrativas que Tolkien deixou incompletas, percorrendo
    todas as eras da Terra-Média: entre elas a versão mais antiga e completa
    da queda de Gondolin, a história da ruína de Númenor, e o relato de como
    Gandalf chegou a escolher Bilbo Baggins para a estrada que abre The
    Hobbit.

- id: jrr-tolkien/the-letters-of-jrr-tolkien
  synopsis: >
    Uma seleção da correspondência do próprio Tolkien - aos filhos, aos
    editores, a fãs e a colegas académicos - que percorre a sua vida, a sua
    fé católica, as suas opiniões sobre os próprios livros, e as décadas de
    escrita por trás deles. Revista e ampliada em 2023.

- id: jrr-tolkien/the-old-english-exodus
  synopsis: >
    O texto, a tradução e o comentário de Tolkien à versão poética em
    inglês antigo do Livro do Êxodo, preparados a partir das suas notas de
    aulas em Oxford.

- id: jrr-tolkien/finn-and-hengest
  synopsis: >
    A reconstrução erudita de Tolkien do episódio histórico por trás de
    dois poemas fragmentários em inglês antigo, o "Fragmento de Finnsburg" e
    um episódio dentro de Beowulf.

- id: jrr-tolkien/the-monsters-and-the-critics-and-other-essays
  synopsis: >
    Cinco ensaios académicos de Tolkien reunidos pela primeira vez num só
    volume, entre eles a conferência de 1936 que mudou a forma de ler
    Beowulf ao tratar os seus monstros como centrais e não como um embaraço,
    além de "On Translating Beowulf", "A Secret Vice", "English and Welsh",
    e o texto mais completo de 1947 de "On Fairy-Stories".

- id: jrr-tolkien/the-history-of-middle-earth
  synopsis: >
    Doze volumes que traçam, rascunho a rascunho, como The Silmarillion e
    The Lord of the Rings tomaram forma ao longo da vida de trabalho de
    Tolkien - os manuscritos em bruto, os falsos arranques, as versões
    abandonadas e o comentário do próprio Christopher Tolkien a ligá-los.

- id: jrr-tolkien/the-children-of-hurin
  synopsis: >
    Amaldiçoado pelo senhor das trevas Morgoth a ver, à distância, as vidas
    dos filhos desfazerem-se, o filho de Húrin, Túrin, cresce marcado por um
    azar tanto seu como da maldição, numa das mais antigas e sombrias
    histórias da Primeira Era de Tolkien.

- id: jrr-tolkien/the-fall-of-arthur
  synopsis: >
    Um reconto inacabado, em verso aliterativo, da última campanha de
    Artur, começado no início da década de 1930, em que Artur leva a guerra
    aos saxões no estrangeiro enquanto a traição de Mordred se prepara em
    casa.

- id: jrr-tolkien/the-story-of-kullervo
  synopsis: >
    O reconto inacabado do próprio Tolkien, começado por volta de 1914
    quando ainda era estudante, do herói trágico Kullervo, do Kalevala
    finlandês - sendo o Kalevala uma das influências mais profundas e mais
    antigas sobre a sua mitologia inventada.

- id: jrr-tolkien/a-secret-vice
  synopsis: >
    A conferência do próprio Tolkien de 1931, a defender as línguas
    inventadas como uma forma de arte por direito próprio, aqui restaurada
    ao texto sobrevivente mais completo e colocada ao lado de ensaios de
    outros académicos sobre o seu passatempo de toda a vida, a invenção de
    línguas.

- id: jrr-tolkien/beren-and-luthien
  synopsis: >
    Um homem mortal e uma elfa imortal apaixonam-se contra a proibição do
    pai dela, e juntos tentam o que nenhum exército tinha conseguido: roubar
    uma joia da própria coroa do Senhor das Trevas - a história que Tolkien
    chamou a origem de todo o legendarium, e cujo nome, "Beren", mandou
    gravar na própria campa.

- id: jrr-tolkien/the-fall-of-gondolin
  synopsis: >
    A cidade élfica escondida de Gondolin, construída para se manter fora
    do alcance do olhar do Senhor das Trevas, cai por fim por traição vinda
    de dentro - a primeiríssima história que Tolkien escreveu de toda esta
    mitologia, redigida em 1916-17 durante a convalescença do Somme.

- id: jrr-tolkien/the-nature-of-middle-earth
  synopsis: >
    Ensaios tardios, a maioria nunca destinados a publicação, em que
    Tolkien trabalha a metafísica, a biologia e a cronologia por trás da
    Terra-Média: a reencarnação e o envelhecimento dos elfos, a forma e a
    história de Arda, e questões relacionadas que a sua ficção nunca
    declara abertamente.

- id: jrr-tolkien/the-collected-poems-of-jrr-tolkien
  synopsis: >
    Uma reunião erudita em três volumes da poesia de Tolkien ao longo de
    toda a sua vida, publicada e inédita por igual, desde os versos de
    adolescente, passando pelos poemas dentro de The Lord of the Rings, até
    peças tardias nunca antes reunidas.

- id: jrr-tolkien/the-bovadium-fragments
  synopsis: >
    Escavada séculos mais tarde por académicos que reconstituem os seus
    fragmentos, a história de Bovadium (Oxford, mal disfarçada) conta como
    os astutos Motores de um Daemon escravizaram o seu povo antes de o
    engarrafamento, os fumos e uma explosão final acabarem com a cidade - a
    sátira privada de Tolkien sobre a era do automóvel a tomar conta da sua
    própria Oxford.
