- id: auden-wilson-reception-split-1956
  title: "O New York Times chama-lhe uma obra-prima; a The Nation chama-lhe
    \"juvenile trash\""
  description: >
    À publicação, [[work:jrr-tolkien/the-lord-of-the-rings|The Lord of the
    Rings]] dividiu os críticos sérios em vez de os conquistar. W. H. Auden,
    ao recensear o volume final para o New York Times em janeiro de 1956,
    chamou-lhe uma obra-prima e defendeu que superava, em certos passos, o
    Paradise Lost de John Milton. O poeta escocês Edwin Muir, ao recensear
    The Return of the King em 1955, atacou as personagens como "boys
    masquerading as adult heroes" que nunca "come to puberty" - uma queixa a
    que Tolkien respondeu com indignação ao seu editor. Em abril de 1956, o
    crítico Edmund Wilson usou a revista The Nation para chamar a toda a
    obra "juvenile trash", sob o título "Oo, Those Awful Orcs!", escrevendo
    que Tolkien tinha "little skill at narrative and no instinct for
    literary form". A divisão não se resolveu em favor do livro na altura -
    vendeu bem em capa dura apesar das críticas, não por causa delas, e não
    teve sequer edição de bolso até à década seguinte - e a linha de fratura
    que Wilson e Auden abriram, entre o desdém do establishment literário e
    o aplauso popular, continua a marcar a forma como o livro é discutido.
