# Overlay pt-PT das ordens de leitura: `name` + `rationale` (prosa).
# id, type, source e orderedWorkIds nunca se traduzem. Títulos de obras
# citados na prosa usam a edição portuguesa publicada
# (content/franchises/harlan-coben/editions.yaml) ou ficam no original
# inglês quando não existe edição portuguesa - nunca um título inventado.
- id: harlan-coben/myron-bolitar
  name: Myron Bolitar, por ordem da série
  rationale: >
    Os doze romances centrados no agente desportivo tornado investigador
    amador Myron Bolitar, retirados de entre os independentes e os outros
    fios de personagens com que se entrelaçam na estante completa. As
    próprias perguntas frequentes de Coben dão esta sequência exata em
    resposta a um leitor, terminando em Pensa Duas Vezes (2024) como décimo
    segundo título, e resolvem o único empate que a ordem derivada por
    defeito deixa em aberto: Atirar a Matar e O Atleta Desaparecido foram
    ambos publicados em 1996, e a sua própria lista mantém Atirar a Matar em
    primeiro lugar. Windsor Horne Lockwood III (Win) e o sobrinho de Myron,
    Mickey, partilham esta continuidade e reaparecem ao longo de toda a
    série, mas cada um cresceu até se tornar um fio próprio; ver a ordem de
    Mickey Bolitar para o ramo juvenil da família, e Win para o único
    romance centrado antes no melhor amigo de Myron. O custo de destacar
    assim este fio: na estante completa, os casos de Myron chegam espaçados
    ao longo de décadas, com uma dezena de romances independentes sem
    ligação entre eles; lidos seguidos, a premissa do agente desportivo
    tornado investigador repete-se doze vezes seguidas, sem a variedade de
    cenários e elencos dos independentes para a quebrar.

- id: harlan-coben/mickey-bolitar
  name: "Mickey Bolitar: o fio juvenil"
  rationale: >
    O sobrinho adolescente de Myron, Mickey, ganha o seu próprio spin-off de
    três livros, editado numa chancela juvenil, decorrendo sequencialmente
    ao longo de um ano letivo: Shelter, Seconds Away e Found. As próprias
    perguntas frequentes de Coben apresentam-na como a série juvenil,
    remetendo para o site próprio criado para esse público, distinto dos
    thrillers para adultos à sua volta, ainda que o próprio Myron apareça
    nos três livros (confirmado de forma independente pela listagem da
    série na Wikipédia). Aqui enquadrada como o ramo da família dirigido ao
    público juvenil, e não como uma primeira porta de entrada na obra de
    Coben: serve sobretudo quem já está investido nos Bolitar, ou um leitor
    adolescente que conheça Coben pela sua única série pensada para jovens,
    em vez dos romances independentes para adultos. Para nomear o custo
    real: este fio está entrelaçado na cronologia mais alargada dos
    Bolitar, e não isolado dela, sobrepondo-se ao décimo romance de Myron,
    Live Wire (2011), em família e em época, pelo que um leitor com intenção
    de seguir ambos fica melhor servido lendo-os próximos um do outro, onde
    a ligação entre eles se mantém legível, em vez de uma década de
    distância na estante.
