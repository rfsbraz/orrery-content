# Overlay pt-PT dos eventos da franquia: `title` + `description`. Os
# acontecimentos de vida do autor estão em content/i18n/pt-PT/authors/.
# Datas, scope, reach, impact, spoilerAfter e sources nunca se traduzem.
# As citações diretas de Coben (e de outros) ficam no inglês em que foram
# efetivamente ditas: traduzi-las substituiria as suas próprias palavras por
# outras que nunca disse. Só a prosa à volta da citação é traduzida (mesma
# convenção de gillian-flynn/events.yaml e jo-nesbo/events.yaml). Os títulos
# franceses (o filme Ne le dis à personne, a minissérie Une chance de trop)
# e os das séries de televisão originais (The Five, Safe) não são work ids
# deste catálogo e ficam tal como no texto de base. Títulos de obras citados
# usam a edição portuguesa publicada (editions.yaml) ou ficam no original
# inglês quando não existe edição portuguesa.

- id: coben-win-modeled-on-roommate-1995
  title: Win, inspirado num colega de quarto real
  description: >
    Windsor Horne Lockwood III, o amigo rico e perigoso de Myron, estreia-se
    ao lado dele em [[work:harlan-coben/deal-breaker|Deal Breaker]]. Coben
    já disse que Win é "loosely based on my college roommate, though in
    real life, he is less, er, psychotic than his fictional counterpart."
    A personagem sobrevive à piada: 26 anos e mais onze romances de Myron
    depois, Win ganha o seu próprio romance independente,
    [[work:harlan-coben/win|Win]] (2021).

- id: coben-tell-no-one-standalone-2001
  title: O romance independente que não servia para Myron
  description: >
    Depois de seis romances de Myron Bolitar, Coben contou que lhe "came up
    with a great idea that simply would not work for Myron", e escreveu
    [[work:harlan-coben/tell-no-one|Não Contes a Ninguém]] como o primeiro
    romance independente desde o início da série. Tornou-se, nas suas
    próprias palavras, "the most decorated thriller of the year", e abriu o
    fio dos independentes que hoje soma 18 das 44 obras desta estante,
    superando todas as séries juntas.

- id: coben-tell-no-one-cesars-2006
  title: "Ne le dis à personne arrasa nos Césares"
  description: >
    O filme francês de Guillaume Canet baseado em
    [[work:harlan-coben/tell-no-one|Não Contes a Ninguém]] estreia em França
    a 1 de novembro de 2006, torna-se a produção em língua estrangeira de
    maior bilheteira do ano nos Estados Unidos, vence o Lumière de melhor
    filme e arrecada quatro das suas nove nomeações aos Césares (melhor
    realização, ator, montagem e música) na cerimónia de 2007. É a primeira
    prova, bem antes da Netflix, de que um enredo de Coben viaja intacto
    para outra língua e vence pelos seus próprios méritos, e não como
    importação americana.

- id: coben-hold-tight-bestseller-2008
  title: A sua primeira estreia no número um
  description: >
    [[work:harlan-coben/hold-tight|Invasão de Privacidade]] estreia-se
    simultaneamente como número um da lista de mais vendidos do New York
    Times e do Times de Londres a 15 de abril de 2008, o nono romance
    independente de Coben e o primeiro a abrir já no topo, em vez de lá
    chegar aos poucos. A partir daqui, os seus lançamentos passam a ser
    eventos, não apenas publicações.

- id: coben-live-wire-rba-prize-2010
  title: "Um prémio policial espanhol, e o primeiro sinal de escala no estrangeiro"
  description: >
    [[work:harlan-coben/live-wire|Live Wire]] vence o Prémio RBA de Novela
    Policíaca espanhol, no valor de 125 mil euros, um dos maiores prémios da
    ficção policial, prova de um público estrangeiro tão grande como o
    doméstico, anos antes de existir qualquer produção europeia da Netflix.

- id: coben-no-second-chance-tv-2015
  title: A primeira adaptação além de Não Contes a Ninguém
  description: >
    Une chance de trop, minissérie francesa em seis episódios baseada no
    romance de Coben de 2003
    [[work:harlan-coben/no-second-chance|Na Pista de um Rapto]], estreia na
    TF1 a partir de 15 de outubro de 2015, com Coben como showrunner e
    produtor executivo. É a primeira adaptação para ecrã de um romance de
    Coben além de Não Contes a Ninguém em nove anos, e o prelúdio direto de
    The Five e Safe.

- id: coben-the-five-tv-debut-2016
  title: A primeira série sua que não é adaptada de um livro
  description: >
    The Five estreia na Sky1 a 15 de abril de 2016: uma ideia que Coben
    andava a amadurecer para um romance com quatro protagonistas, que ele
    "never written," tornou-se em vez disso a sua primeira série de
    televisão inteiramente original, criada e produzida por ele em vez de
    adaptada de qualquer livro existente. "I wouldn't
    leave novel writing," disse na altura, "but I love storytelling and I
    really do think we've been living in a golden age of television." É o
    ensaio geral para o papel de showrunner que o acordo com a Netflix viria
    a formalizar dois anos depois.

- id: coben-netflix-overall-deal-2018
  title: Começa a era Netflix
  description: >
    Safe, a segunda série original de Coben, estreia na Netflix em 190
    países a 10 de maio de 2018. Com base nesse sucesso, a Netflix assina
    com ele, nesse mesmo agosto, um acordo exclusivo de cinco anos para 14
    dos seus romances, a desenvolver como séries e filmes em todo o mundo,
    com Coben como produtor executivo em todos eles. É o acordo único que
    transforma um catálogo de thrillers independentes americanos numa
    produção internacional contínua, já com doze séries em seis línguas em
    2026, e é por isso que quase todo o romance independente posterior
    nesta estante chega hoje com uma adaptação da Netflix já associada ou
    esperada.

- id: coben-fool-me-once-global-hit-2024
  title: Só Me Enganas uma Vez torna-se a sua maior adaptação até hoje
  description: >
    A adaptação da Netflix de
    [[work:harlan-coben/fool-me-once|Só Me Enganas uma Vez]], em oito
    episódios, estreia a 1 de janeiro de 2024, lidera o Top 10 Global da
    própria Netflix na primeira semana (37,1 milhões de visualizações, 238,2
    milhões de horas vistas) e chega às 98 milhões de visualizações nos
    primeiros três meses, a mais vista de qualquer adaptação de Coben até à
    data. O seu alcance remodela diretamente a estante: Sami Kierce, uma
    figura secundária no romance, é ampliado para o ecrã até se tornar um
    papel principal, e é essa versão da personagem que
    [[work:harlan-coben/nobodys-fool|Nobody's Fool]] (2025) na verdade
    continua.

- id: coben-witherspoon-collaboration-announced-2024
  title: A ideia de Reese Witherspoon, delineada e escrita a dois
  description: >
    A Grand Central Publishing anuncia a 3 de outubro de 2024 que Coben vai
    coescrever um romance de suspense com Reese Witherspoon, o primeiro dela
    como romancista e a primeira coautoria verdadeira da carreira dele. Os
    dois construíram juntos o conceito e as personagens ao longo de meses
    antes de ele escrever os capítulos; foi publicado em 2025 como
    [[work:harlan-coben/gone-before-goodbye|Antes de Desaparecer]].

- id: coben-nobodys-fool-tv-inspired-2025
  title: Uma sequela da série, não do livro
  description: >
    Coben já disse que [[work:harlan-coben/nobodys-fool|Nobody's Fool]] é
    "almost more of a sequel to the TV series than the book", já que Sami
    Kierce e a mulher "weren't major characters in the Fool Me Once book" e
    só se tornaram centrais através da ampliação do papel feita pela
    adaptação da Netflix. "I don't know any time that's ever happened,"
    disse à The Hollywood Reporter. "Certainly, it hasn't happened in my
    career." Corrige a suposição que o rótulo de "sequela" sugere: o livro
    de onde este parte é o ecrã, não a página.
