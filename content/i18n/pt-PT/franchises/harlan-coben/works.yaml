# Overlay pt-PT das obras: apenas `synopsis` (prosa). `title` nunca se
# traduz aqui: um título traduzido só existe como edição publicada, em
# editions.yaml (ver docs/SCHEMA.md, "Never translate a published title").
# `note:` também não é traduzido: é anotação de curadoria, não lida pela
# aplicação no ecrã da obra.
# Vinte e oito das quarenta e quatro obras desta ala têm uma edição pt-PT
# real e verificada (editions.yaml); os títulos mencionados na prosa usam
# essa edição. As restantes dezasseis, incluindo toda a trilogia juvenil de
# Mickey Bolitar, Live Wire, Nobody's Fool (2025, demasiado recente) e as
# quatro obras apócrifas, não têm edição portuguesa, pelo que ficam com o
# título original. Deal Breaker tem duas traduções portuguesas rivais, sem
# nenhuma atualmente em circulação (Círculo de Leitores 2004 e Temas e
# Debates 2008, títulos diferentes); nenhuma das duas é usada como título de
# referência, e o original inglês fica em qualquer menção.

# --- Myron Bolitar ---

- id: harlan-coben/deal-breaker
  synopsis: >
    O agente desportivo Myron Bolitar consegue o cliente da vida, a jovem
    promessa da NFL Christian Steele, até que uma chamada da namorada dele,
    supostamente morta, arrasta Myron de volta ao caso que pôs fim à sua
    própria carreira como jogador.

- id: harlan-coben/drop-shot
  synopsis: >
    Uma antiga prodígio do ténis é assassinada no US Open enquanto a cliente
    de Myron está em quadra, e o agente desportivo tornado investigador tem
    de limpar o nome dela antes que os segredos mais antigos do circuito a
    enterrem junto com a verdade.

- id: harlan-coben/fade-away
  synopsis: >
    Quando um antigo rival do basquetebol desaparece, Myron tem a
    oportunidade de voltar a calçar as sapatilhas e jogar profissionalmente
    outra vez, até os jogos acabarem e ele ser forçado a enfrentar a razão
    que pôs fim precoce à sua própria carreira. Venceu o Prémio Edgar de
    1997 para melhor edição original em brochura.

- id: harlan-coben/back-spin
  synopsis: >
    O filho adolescente de um golfista de renome é raptado num hotel do
    centro da cidade, e a busca de Myron por ele traz à superfície um
    escândalo do mundo do golfe gestado ao longo de décadas.

- id: harlan-coben/one-false-move
  synopsis: >
    Myron aceita como cliente uma jogadora de basquetebol ferozmente
    independente que precisa mais de um guarda-costas do que de um agente,
    e o passo seguinte de Myron põe as vidas de ambos em risco.

- id: harlan-coben/the-final-detail
  synopsis: >
    Myron regressa de um retiro nas Caraíbas para encontrar a sócia
    Esperanza presa por homicídio e a agência a desmoronar-se, e tem de
    trabalhar o caso a partir de fora do sistema que ele próprio construiu.

- id: harlan-coben/darkest-fear
  synopsis: >
    Uma antiga namorada diz a Myron que ele é pai de um rapaz de treze anos
    moribundo, lançando-o à procura de um dador de medula óssea cuja pista o
    leva direito aos assuntos por concluir de um assassino em série.

- id: harlan-coben/promise-me
  synopsis: >
    Seis anos depois de deixar de fazer de herói, Myron promete à filha
    adolescente de um amigo uma boleia segura para casa vinda de uma festa
    se alguma vez estiver em apuros, e essa promessa arrasta-o de volta para
    o mundo a que tinha renunciado.

- id: harlan-coben/long-lost
  synopsis: >
    Uma década depois de o caso entre ambos ter terminado, Terese Collins
    telefona a Myron a partir de Paris, suspeita do homicídio do ex-marido,
    e o que ele descobre ao investigar a história dela remonta a uma
    tragédia familiar soterrada.

- id: harlan-coben/live-wire
  synopsis: >
    Uma tenista grávida pede a Myron que encontre o marido, uma estrela rock
    desaparecida, depois de uma publicação anónima pôr em causa a
    paternidade do bebé, e a busca reúne Myron com a cunhada que desapareceu
    anos antes junto com o próprio irmão dele.

- id: harlan-coben/home
  synopsis: >
    Dois rapazes raptados uma década antes reaparecem em Londres, e Myron e
    Win têm de descobrir quem é quem, e o que lhes aconteceu, antes que quem
    os escondeu durante dez anos os encontre primeiro.

- id: harlan-coben/think-twice
  synopsis: >
    Três anos depois de fazer o elogio fúnebre do antigo rival Greg Downing,
    agentes federais dizem a Myron que Greg está vivo e é o principal
    suspeito de um duplo homicídio, e ele e Win têm de o encontrar antes que
    a verdade cause mais estragos do que a mentira.

# --- Mickey Bolitar ---

- id: harlan-coben/shelter
  synopsis: >
    Ainda a recuperar da morte do pai e da passagem da mãe pela reabilitação,
    Mickey Bolitar muda-se para casa do tio Myron e começa numa nova escola
    secundária, onde o desaparecimento de uma colega o conduz até ao secreto
    Abeona Shelter.

- id: harlan-coben/seconds-away
  synopsis: >
    Quando uma colega é baleada, Mickey e os amigos Ema e Spoon correm para
    descobrir quem foi, sem deixar de perseguir os segredos do Abeona
    Shelter e a verdade por trás da morte do pai.

- id: harlan-coben/found
  synopsis: >
    Oito meses depois da morte do pai, Mickey procura o namorado online
    desaparecido de Ema enquanto se aproxima cada vez mais da verdade sobre
    o Abeona Shelter, no volume que fecha a trilogia.

# --- Sami Kierce ---

- id: harlan-coben/fool-me-once
  synopsis: >
    De regresso da guerra, a antiga piloto de operações especiais Maya vê as
    imagens da câmara da ama e vê o marido a brincar com a filha de ambos,
    duas semanas depois de ele ter sido assassinado, e tem de decidir se
    confia nos próprios olhos ou no próprio passado.

- id: harlan-coben/nobodys-fool
  synopsis: >
    Vinte e dois anos depois de acordar coberto de sangue ao lado do corpo
    da namorada, sem memória do que aconteceu, o investigador privado Sami
    Kierce avista-a viva ao fundo da sala de aulas noturnas que frequenta, e
    ela foge no instante em que os olhares se cruzam.

# --- Wilde ---

- id: harlan-coben/the-boy-from-the-woods
  synopsis: >
    Encontrado quando criança, selvagem e a viver sozinho nos bosques de
    Nova Jérsia, sem memória do seu passado, o homem conhecido apenas como
    Wilde é atraído de volta para a cidade que nunca o aceitou quando um
    adolescente da zona desaparece.

- id: harlan-coben/the-match
  synopsis: >
    Uma correspondência de ADN dá a Wilde a primeira pista real sobre a
    família que o abandonou décadas antes, mas liga-o a um desaparecimento
    atual mais sombrio do que parece à primeira vista.

# --- Windsor Horne Lockwood III ("Win") ---

- id: harlan-coben/win
  synopsis: >
    Um recluso é encontrado assassinado no seu apartamento em Manhattan com
    um Vermeer roubado e uma mala com as suas iniciais, e Win, o amigo rico
    e perigoso de Myron, conduz a sua própria investigação a um crime de
    décadas que o FBI não consegue encerrar sem ele.

# --- Standalone ---

- id: harlan-coben/play-dead
  synopsis: >
    A estreia de Coben, um thriller romântico de suspense, aceite para
    publicação quando ele tinha 26 anos.

- id: harlan-coben/miracle-cure
  synopsis: >
    O segundo romance de Coben, publicado no ano seguinte à estreia, antes
    de se voltar para a série Myron Bolitar.

- id: harlan-coben/tell-no-one
  synopsis: >
    Oito anos depois de a mulher ser raptada e assassinada no fim de semana
    do seu aniversário de casamento, um pediatra recebe um email anónimo que
    cita uma frase que só os dois conheciam.

- id: harlan-coben/gone-for-good
  synopsis: >
    No leito de morte, uma mãe diz ao filho que o irmão, desaparecido há
    muito e tido como assassino, ainda está vivo, lançando-o numa busca pela
    verdade que ameaça todos aqueles que ele ama.

- id: harlan-coben/no-second-chance
  synopsis: >
    Um cirurgião acorda de um ferimento de bala para descobrir a mulher
    morta e a filha bebé raptada, com apenas um bilhete de resgate
    arrepiante a avisá-lo para não chamar a polícia.

- id: harlan-coben/just-one-look
  synopsis: >
    Uma mãe de subúrbio encontra uma fotografia desconhecida, com décadas,
    misturada nas fotos de família, e quando o marido a reconhece e
    desaparece com ela, tem de o encontrar antes de quem quer que também
    queira aquela fotografia.

- id: harlan-coben/the-innocent
  synopsis: >
    Nove anos depois de uma noite de violência o ter transformado num
    assassino acidental, um ex-recluso com uma mulher grávida e uma vida
    nova recebe uma videochamada inexplicável do telemóvel dela, e tudo
    começa a desmoronar-se.

- id: harlan-coben/the-woods
  synopsis: >
    Um procurador cuja irmã desapareceu num campo de férias de verão vinte
    anos antes é atraído de volta para esse caso por resolver quando um
    corpo surge com provas que a ligam diretamente a ela.

- id: harlan-coben/hold-tight
  synopsis: >
    Dois pais de subúrbio instalam software espião no computador do filho
    adolescente, retraído, depois do suicídio de um amigo dele, e um duplo
    homicídio brutal arrasta a família e o bairro para as consequências. O
    primeiro romance de Coben a estrear-se em primeiro lugar na lista de
    mais vendidos do New York Times.

- id: harlan-coben/caught
  synopsis: >
    Uma jornalista de televisão que expõe publicamente predadores sexuais
    tem na mira um assistente social de cuja culpa está certa, só para o
    caso dele se revelar bem mais complicado do que a armadilha dela foi
    montada para apanhar.

- id: harlan-coben/stay-close
  synopsis: >
    Uma mãe de subúrbio, um fotógrafo acabado e um detetive incapaz de
    largar um caso arquivado há dezassete anos veem os seus passados
    soterrados colidir no presente.

- id: harlan-coben/six-years
  synopsis: >
    Seis anos depois de ver o amor da sua vida casar com outro homem, um
    professor universitário vai ao funeral desse marido, só para descobrir
    que a viúva enlutada é uma desconhecida, desfazendo tudo o que julgava
    saber sobre ela.

- id: harlan-coben/missing-you
  synopsis: >
    Uma detetive da polícia de Nova Iorque reconhece a fotografia do
    ex-noivo num site de encontros dezoito anos depois de ele lhe ter
    partido o coração, e ao contactá-lo descobre uma conspiração que faz
    presas dos mais vulneráveis.

- id: harlan-coben/the-stranger
  synopsis: >
    Um estranho que conhece um segredo insuportável sussurra-o a um pai de
    subúrbio com um casamento confortável e dois filhos, e o confronto que
    se segue desfaz uma conspiração maior do que a própria mentira.

- id: harlan-coben/dont-let-go
  synopsis: >
    Um detetive da polícia, ainda a viver na cidade de Nova Jérsia onde o
    irmão gémeo idêntico morreu quinze anos antes, reabre o caso quando as
    impressões digitais da própria namorada, desaparecida há muito, surgem
    numa cena de crime.

- id: harlan-coben/run-away
  synopsis: >
    Um pai avista a filha, toxicodependente e afastada da família, a tocar
    guitarra no Central Park, e segue-a de volta a um mundo perigoso cuja
    existência desconhecia, arriscando tudo para a trazer para casa.

- id: harlan-coben/i-will-find-you
  synopsis: >
    Um homem inocente a cumprir prisão perpétua pelo homicídio do filho
    pequeno recebe provas de que o rapaz pode ainda estar vivo, e foge da
    prisão para descobrir a verdade por si mesmo.

- id: harlan-coben/gone-before-goodbye
  synopsis: >
    Uma antiga cirurgiã de combate do exército, que perdeu a licença médica,
    o marido e a instituição de solidariedade que construíram juntos, aceita
    um trabalho que não pode recusar, e é arrastada para a conspiração que
    já lhe custou tudo o resto.

# --- Illustrated children's book ---

- id: harlan-coben/the-magical-fantastical-fridge
  synopsis: >
    Um livro infantil ilustrado: um rapaz é magicamente transportado para
    dentro de um dos seus próprios desenhos afixados no frigorífico da
    cozinha, numa aventura disparatada que termina numa apreciação da
    família. Ilustrado por Leah Tinari (Dial).

# --- Nonfiction ---

- id: harlan-coben/plot-twist
  synopsis: >
    Umas memórias sobre a vida de escritor: o relato do próprio Coben sobre
    o seu caminho até à publicação e um olhar sobre o seu processo criativo,
    em vez de um romance.

# --- Apocrypha ---

- id: harlan-coben/malice-domestic-7
  synopsis: >
    Uma antologia de contos policiais originais e tradicionais, editada por
    Sharyn McCrumb. O contributo de Coben, um conto, foi finalista dos
    Prémios Anthony e Macavity de 1999 para melhor conto.

- id: harlan-coben/death-do-us-part
  synopsis: >
    Uma antologia de 18 contos policiais sobre relações, da autoria de
    membros da Mystery Writers of America, reunida e editada por Coben, que
    também contribuiu com um conto original seu.

- id: harlan-coben/best-american-mystery-stories-2011
  synopsis: >
    O décimo quinto volume da série anual, reunindo vinte contos policiais
    publicados pela primeira vez em 2010. Coben foi o editor convidado desse
    ano, selecionando os contos e escrevendo a introdução; o editor da
    série, Otto Penzler, escreve o prefácio todos os anos e não está
    registado em withAuthorIds, por não ter entidade de autor neste
    repositório.

- id: harlan-coben/the-rise-and-fall-of-super-d
  synopsis: >
    Um conto exclusivo da edição em capa dura da Dutton (EUA) de Um Estranho
    Caso de Culpa, nunca vendido ou reunido separadamente.
