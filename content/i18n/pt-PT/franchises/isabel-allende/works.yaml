# Português europeu (pt-PT) - sinopses. Os títulos de obras NÃO são
# traduzidos aqui (docs/SCHEMA.md, "Never translate a published title"): um
# título traduzido só existe como edição real, em editions.yaml - mesma
# convenção já fixada em gabriel-garcia-marquez/works.yaml e
# miguel-de-cervantes/works.yaml para um original não-inglês. `note:`
# também não se traduz aqui: nenhum overlay pt-PT deste catálogo o traduz -
# não é lido pela aplicação no ecrã da obra.
#
# Nenhuma sinopse desta ala nomeia outra obra por título (nenhuma
# referência interna do tipo work:id em nenhuma das 36 entradas), pelo que
# a questão do título português vs. espanhol original não se põe dentro
# deste ficheiro - põe-se em franchise.yaml, events.yaml e no ficheiro do
# autor, onde essas referências existem (ver o cabeçalho de franchise.yaml
# para a regra seguida).
#
# A PASSAGEM SOBRE PAULA. A sinopse de isabel-allende/paula segue de perto
# o registo simples e digno da base (docs/CURATION.md): a doença, o coma e
# a morte de Paula Frías Allende são ditos uma vez, com clareza, sem
# linguagem clínica e sem sentimentalismo acrescentado - "posta por
# escrito" e "continuada para lá da morte dela" traduzem literalmente "set
# down" e "carried on past her death", preservando o mesmo tom plano do
# original.

- id: isabel-allende/civilice-a-su-troglodita
  synopsis: >
    Uma coletânea das colunas de humor satírico que Allende escreveu para
    a imprensa chilena no início da década de 1970, ilustrada por Ricardo
    Güiraldes.

- id: isabel-allende/la-abuela-panchita
  synopsis: >
    Uma história infantil ilustrada, uma das duas que Allende publicou
    enquanto fazia parte da redação da revista infantil chilena Mampato.

- id: isabel-allende/lauchas-y-lauchones-ratas-y-ratones
  synopsis: >
    Uma segunda história infantil ilustrada, do mesmo período na Mampato
    de La Abuela Panchita.

- id: isabel-allende/la-casa-de-los-espiritus
  synopsis: >
    Três gerações da família Trueba num país sul-americano sem nome:
    Clara, a matriarca esquiva que prevê as tragédias da família, e
    Esteban, o patriarca orgulhoso e volátil cuja fome de terra é lendária,
    atravessados por um século de mudanças violentas que culmina numa
    crise com ele e a neta que adora em lados opostos das barricadas.

- id: isabel-allende/de-amor-y-de-sombra
  synopsis: >
    Irene Beltrán, repórter de revista num país de detenções arbitrárias,
    desaparecimentos súbitos e execuções sumárias, e Francisco Leal, o
    fotógrafo que se apaixona por ela em reportagem, são enviados para
    escrever sobre uma rapariga do campo que se diz sofrer de crises que
    lhe dão poderes milagrosos - e são arrastados para um turbilhão de
    terror e violência pelo que a reportagem revela.

- id: isabel-allende/eva-luna
  synopsis: >
    Uma contadora de histórias órfã e autodidata, num país sul-americano
    sem nome, narra a própria vida desde uma infância improvisada até
    décadas de convulsão política do país, a sua voz entrelaçada com a de
    Rolf Carlé, um cineasta imigrante austríaco.

- id: isabel-allende/el-plan-infinito
  synopsis: >
    Gregory Reeves, um homem norte-americano, é seguido ao longo de cinco
    décadas, desde uma infância em Los Angeles, passando pela Guerra do
    Vietname, até às crises da sua vida adulta.

- id: isabel-allende/hija-de-la-fortuna
  synopsis: >
    Eliza Sommers, uma jovem chilena criada por expatriados ingleses na
    Valparaíso da década de 1840, disfarça-se e viaja escondida até à
    Califórnia durante a corrida ao ouro em busca do homem que ama, e
    encontra pelo caminho uma vida que não planeara.

- id: isabel-allende/retrato-en-sepia
  synopsis: >
    Aurora del Valle, criada em privilégio pela formidável avó Paulina del
    Valle, não guarda qualquer memória dos primeiros cinco anos de vida e
    - traída pelo homem que ama - parte à procura do trauma que os apagou
    e dos segredos de família enterrados com ele.

- id: isabel-allende/la-ciudad-de-las-bestias
  synopsis: >
    Alexander Cold, um adolescente americano, junta-se à expedição da avó
    jornalista à Amazónia e trava amizade com Nadia Santos, uma rapariga
    local; cada um descobre um espírito animal totémico - jaguar e águia -
    à medida que desvendam o segredo de uma tribo escondida.

- id: isabel-allende/el-reino-del-dragon-de-oro
  synopsis: >
    Alexander e Nadia viajam até um reino escondido nos Himalaias para
    ajudar o jovem príncipe a recuperar uma estátua sagrada de um dragão
    dourado roubada por caçadores de tesouros.

- id: isabel-allende/el-bosque-de-los-pigmeos
  synopsis: >
    Alexander e Nadia viajam até uma floresta tropical da África Central e
    envolvem-se na escravização de uma comunidade pigmeia por um chefe
    local corrupto.

- id: isabel-allende/el-zorro-comienza-la-leyenda
  synopsis: >
    Uma história de origem autorizada do justiceiro mascarado Zorro, que
    acompanha Diego de la Vega desde uma infância dividida entre a
    Califórnia espanhola e a herança indígena da mãe, passando pela
    formação em Barcelona, até à dupla vida que o transforma em lenda.

- id: isabel-allende/ines-del-alma-mia
  synopsis: >
    Já idosa, Inés Suárez escreve a própria vida como umas memórias
    dirigidas à filha adotiva, relatando a viagem de Espanha até às
    Américas e o seu papel, ao lado do conquistador Pedro de Valdivia, na
    fundação de Santiago e na conquista do Chile.

- id: isabel-allende/la-isla-bajo-el-mar
  synopsis: >
    Zarité, chamada Tété, nascida escrava numa plantação de açúcar em
    Saint-Domingue e comprada para servir a casa do colono francês
    Toulouse Valmorain, vive a revolução que transforma a colónia em
    Haiti e recomeça com ele em Nova Orleães, onde se dedica a forjar uma
    vida e uma identidade próprias.

- id: isabel-allende/el-cuaderno-de-maya
  synopsis: >
    Maya Vidal, uma californiana de dezanove anos a fugir do submundo de
    Las Vegas em que caiu, é enviada pela avó chilena para se esconder em
    Chiloé, uma ilha remota ao sul do Chile, em casa de um velho amigo que
    nunca conheceu - e escreve o ano que se segue.

- id: isabel-allende/el-juego-de-ripper
  synopsis: >
    Amanda, uma adolescente brilhante a caminho do MIT, e os amigos com
    quem joga um jogo de mistério online tornam-se detetives amadores
    para caçar um assassino em série real que aterroriza São Francisco.

- id: isabel-allende/el-amante-japones
  synopsis: >
    Alma Belasco, uma mulher idosa recém-instalada num lar de São
    Francisco, revela à jovem cuidadora um caso de amor secreto de toda
    uma vida com Ichimei Fukuda, um jardineiro nipo-americano, começado em
    1939 e ensombrado pelo internamento da família dele durante a guerra.

- id: isabel-allende/mas-alla-del-invierno
  synopsis: >
    Três estranhos, reunidos por um acidente de automóvel durante uma
    tempestade de neve em Brooklyn, passam uma noite a desenredar os
    passados uns dos outros, entre o Chile, a Guatemala e o Brasil.

- id: isabel-allende/largo-petalo-de-mar
  synopsis: >
    Victor Dalmau, médico que lutou pela República Espanhola, e Roser,
    viúva do irmão falecido, fogem de Espanha num navio de refugiados
    depois da Guerra Civil e reconstroem juntos a vida no Chile, apenas
    para viverem, décadas depois, a queda de outro país numa ditadura.

- id: isabel-allende/violeta
  synopsis: >
    Violeta del Valle, nascida num país sul-americano sem nome em 1920 e
    escrevendo já idosa uma carta a alguém que ama, relata cem anos da
    própria vida contra o pano de fundo de um século de convulsões do
    continente.

- id: isabel-allende/el-viento-conoce-mi-nombre
  synopsis: >
    Duas crianças refugiadas separadas das famílias com oito décadas de
    intervalo - um rapaz judeu a fugir de Viena no início do Holocausto, e
    uma rapariga salvadorenha separada da mãe na atual fronteira dos
    Estados Unidos - são contadas em histórias entrelaçadas de perda e
    busca de um lar.

- id: isabel-allende/mi-nombre-es-emilia-del-valle
  synopsis: >
    Emilia del Valle, jornalista americana de ascendência irlandesa e
    chilena, viaja até ao Chile para cobrir a guerra civil de 1891 e
    acaba envolvida com a família - e o pai afastado - que nunca conheceu.

- id: isabel-allende/la-ninfa-de-porcelana
  synopsis: >
    Um escrevente de cartório cinzento e rigidamente pontual apaixona-se
    por uma figura de porcelana chamada Fantasía na montra de uma loja,
    gasta o ordenado de um mês para a levar para casa, e vê a sua vida
    ordenada tomar um rumo maravilhoso à medida que ela lha vai colorindo.

- id: isabel-allende/cuentos-de-eva-luna
  synopsis: >
    Vinte e três contos narrados por Eva Luna, a protagonista contadora de
    histórias do romance anterior, que abrem com "Dos Palabras" ("Duas
    Palavras"), a peça mais conhecida e mais antologiada da coletânea.

- id: isabel-allende/paula
  synopsis: >
    Começado junto à cama de hospital em Madrid, em dezembro de 1991,
    quando a filha de Allende, Paula, adoeceu gravemente e entrou em coma:
    a história da família - os antepassados excêntricos, a infância
    chilena, o golpe de 1973, os anos de exílio - posta por escrito para
    uma filha que não a podia ouvir, e continuada para lá da morte dela,
    no ano seguinte.

- id: isabel-allende/afrodita
  synopsis: >
    Um livro de memórias que mistura géneros, sobre comida, afrodisíacos
    e sensualidade, combinando ensaio pessoal com receitas.

- id: isabel-allende/mi-pais-inventado
  synopsis: >
    Um livro de memórias sobre o Chile e a identidade chilena, escrito
    depois de os ataques de 11 de setembro de 2001 motivarem uma visita a
    casa que reabriu o seu sentido de exílio e pertença.

- id: isabel-allende/la-suma-de-los-dias
  synopsis: >
    Um livro de memórias sobre os anos que se seguiram à morte de Paula: a
    vida de Allende com a família alargada, o segundo marido, William
    Gordon, e os netos.

- id: isabel-allende/mujeres-del-alma-mia
  synopsis: >
    Um livro de memórias ensaístico que traça o feminismo de toda a vida
    de Allende, desde uma autodescrita "feminista desde o infantário" até
    às suas reflexões sobre o envelhecer, no contexto das causas -
    direitos reprodutivos, MeToo - que abraçou já adulta.

- id: isabel-allende/la-palabra-magica
  synopsis: >
    Uma reflexão sobre quase cinco décadas de escrita - o seu processo
    criativo, os seus hábitos, e o que aprendeu com os triunfos e os
    erros de uma longa carreira - apresentada pela editora como memórias e
    masterclass em partes iguais.

- id: isabel-allende/perla-la-super-perrita
  synopsis: >
    O primeiro de uma série de livros ilustrados infantis sobre Perla,
    uma cadela pequena com dois superpoderes improváveis: fazer com que
    todos a amem, e rugir como um leão.

- id: isabel-allende/perla-y-el-pirata
  synopsis: >
    Segundo livro ilustrado da Perla: os seus superpoderes são postos à
    prova quando a aventura do irmão humano com um "pirata" fantasiado
    corre mal.

- id: isabel-allende/perla-y-la-princesa
  synopsis: >
    Terceiro livro ilustrado da Perla: Perla salva o irmão humano, Nico
    Rico, e uma menina vestida de princesa depois de os dois se perderem
    durante uma festa de Cinco de Mayo.

- id: isabel-allende/los-amantes-del-guggenheim
  synopsis: >
    Um volume breve que junta um conto - dois estranhos encontrados a
    dormir juntos ao amanhecer no Museu Guggenheim de Bilbau - com um
    pequeno ensaio sobre o seu próprio processo criativo e as suas
    motivações como escritora.

- id: isabel-allende/amor
  synopsis: >
    Uma antologia compilada de cenas de amor e erotismo retiradas dos seus
    próprios livros já publicados, organizada por etapas da vida, que
    abre com um novo ensaio sobre as suas primeiras experiências sexuais.
