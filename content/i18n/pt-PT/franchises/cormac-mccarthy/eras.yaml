# Português europeu (pt-PT) - eras.
# title, description e themes traduzidos (themes é prosa lida sob a placa da
# era, não decoração - ver docs/SCHEMA.md e docs/CURATION.md). O campo `note`
# não é prosa lida pelo leitor (não faz parte do conjunto que
# i18n_coverage.py verifica) e fica por traduzir, como nas restantes wings.
# Referências a obras usam o título publicado em Portugal onde existe
# edição em editions.yaml (Relógio D'Água, tradução de Paulo Faria).

- id: the-tennessee-period
  title: O Período do Tennessee
  description: >
    Os quatro romances dos Apalaches que o estudo de Dianne Luce fixa como o
    período do Tennessee de McCarthy (1959-1979):
    [[work:cormac-mccarthy/the-orchard-keeper|O Guarda do Pomar]],
    [[work:cormac-mccarthy/outer-dark|Nas Trevas Exteriores]] e
    [[work:cormac-mccarthy/child-of-god|Filho de Deus]], passados num sul
    dos Apalaches de vagabundos, marginais e violência, culminando no
    submundo ribeirinho de Knoxville de
    [[work:cormac-mccarthy/suttree|Suttree]]. Escritos no Tennessee na linha
    do gótico sulista que o Cambridge Companion arquiva sob "Beginnings in
    the American South"; admirados pela crítica, mas vendendo apenas alguns
    milhares de exemplares cada um.
  themes:
    - gótico sulista
    - o Tennessee dos Apalaches
    - marginais e violência
    - mito gnóstico e existencial

- id: the-western-period
  title: O Período do Oeste
  description: >
    A viragem para o sudoeste que o Cambridge Companion chama "The Move
    Westward". Depois de se separar da segunda mulher e deixar o Tennessee
    por El Paso em 1976, e com uma Bolsa MacArthur a financiar a sua
    investigação ao longo da fronteira, McCarthy reinventou a sua ficção no
    oeste americano com [[work:cormac-mccarthy/blood-meridian|Meridiano de
    Sangue]] (1985), o romance dos caçadores de escalpes hoje amplamente
    lido como a sua obra-prima. Seguiu-se o sucesso comercial de
    [[work:cormac-mccarthy/all-the-pretty-horses|Belos Cavalos]] e do resto
    da Trilogia da Fronteira, depois
    [[work:cormac-mccarthy/no-country-for-old-men|Este País Não É para
    Velhos]] e [[work:cormac-mccarthy/the-road|A Estrada]], vencedora do
    Pulitzer.
  themes:
    - o sudoeste americano
    - violência de fronteira e de território
    - mito e profecia
    - reinvenção de género
