# Overlay pt-PT. Apenas prosa; id, slugs, títulos de obras e sources não são
# traduzidos.
# Os startHere.paths ficam aninhados e são fundidos por id (ver SCHEMA.md,
# "Nested lists merge by id"): só `title`, `description` e `note`, nunca
# `workIds`, `orderId` ou `fit`.
# Referências a obras usam o título publicado em Portugal onde existe edição
# em editions.yaml (Relógio D'Água, tradução de Paulo Faria).
- id: cormac-mccarthy
  description: >
    Doze romances que vão do gótico sulista dos Apalaches às fronteiras
    mexicanas da Trilogia da Fronteira até à América pós-apocalíptica,
    emoldurados por duas peças, dois argumentos e o único ensaio que
    publicou na última década, a trabalhar lado a lado com os cientistas do
    Santa Fe Institute.
  startHere:
    paths:
      - id: start-with-border-trilogy
        title: Comece pela Trilogia da Fronteira
        description: >
          O próprio editor de longa data de McCarthy aponta aqui primeiro os
          novos leitores: Belos Cavalos é reconhecivelmente McCarthy, mas o
          mais convencional dos seus romances na construção do enredo, uma
          porta de entrada antes de o estilo se tornar mais difícil. A
          trilogia que se segue alarga-se às vidas de mais dois jovens na
          fronteira entre o Texas e o México.
        note: >
          Três livros em vez de um: o custo é comprometer-se com uma
          trilogia antes de conhecer os romances independentes, em troca da
          primeira amostra mais completa dos romances de fronteira pelos
          quais este autor é mais conhecido.

      - id: try-the-road
        title: Experimente A Estrada
        description: >
          Um pai e um filho a caminhar por uma América devastada, na prosa
          mais simples e despojada que McCarthy alguma vez escreveu. Sem
          trilogia, sem história de fronteira secular para apanhar primeiro:
          apenas um romance curto e angustiante, e o estilo ao nível da
          frase pelo qual é famoso.
        note: >
          O custo é que este é, de longe, o seu livro mais suave e mais
          linear: avance para Meridiano de Sangue ou para a Trilogia da
          Fronteira à espera de algo consideravelmente mais difícil.

      - id: the-masterpiece
        title: "A obra-prima: Meridiano de Sangue"
        description: >
          Amplamente considerado o mais forte candidato ao grande romance
          americano, e tão amplamente considerado o McCarthy mais difícil
          por onde começar: o seu livro mais violento, sustentado numa
          brutalidade quase sem alívio, com prosa capaz de correr uma página
          inteira sem quebra. Leia isto para o livro a que as pessoas se
          referem quando lhe chamam um grande escritor, não à procura de uma
          introdução fácil.
        note: >
          O seu próprio editor recomenda chegar a este depois da Trilogia
          da Fronteira, e não primeiro: o custo de começar aqui em vez disso
          é encontrar McCarthy no seu ponto mais extremo antes de saber se o
          seu registo mais contido é para si.

      - id: everything
        title: Tudo, por ordem
        description: >
          As dezassete obras completas: os doze romances, as duas peças, os
          dois argumentos e o ensaio, por ordem de publicação, desde a
          estreia de 1965 até ao par O Passageiro/Stella Maris que fechou a
          sua carreira.
