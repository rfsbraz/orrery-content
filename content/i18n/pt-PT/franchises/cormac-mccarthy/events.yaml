# Overlay pt-PT dos eventos da franquia: `title` + `description` (prosa).
# id, date, scope, reach, impact, spoilerAfter e sources nunca se traduzem.
# Referências a obras usam o título publicado em Portugal onde existe
# edição em editions.yaml (Relógio D'Água, tradução de Paulo Faria); The
# Kekulé Problem não tem edição portuguesa e fica com o título inglês.

- id: suttree-reception-1979
  title: Vinte anos a escrever, recebido com calor pela crítica, e continua sem ser um êxito de vendas
  description: >
    [[work:cormac-mccarthy/suttree|Suttree]] chega às livrarias em maio de
    1979, vinte anos depois de McCarthy ter começado a escrevê-lo em
    Knoxville. A crítica de Jerome Charyn no New York Times chama-lhe um
    "Huckleberry Finn" condenado; seguem-se críticas calorosas de Anatole
    Broyard (também no Times), de Guy Davenport na National Review e do
    romancista Shelby Foote. Nada disso vende exemplares: tal como o resto
    dos primeiros romances de McCarthy, nenhuma edição ultrapassa os 5000
    exemplares em capa dura.

- id: blood-meridian-reception-1985
  title: Uma obra-prima que ninguém compra, até o Times decidir o contrário
  description: >
    [[work:cormac-mccarthy/blood-meridian|Meridiano de Sangue]] tem uma
    receção crítica e comercial morna quando é publicado em abril de 1985;
    até a própria crítica do New York Times, admirando a prosa mas pouco
    convencida pelo material, é representativa, e o livro vende apenas
    alguns milhares de exemplares. Duas décadas depois, o inquérito do mesmo
    jornal em 2006 sobre a melhor ficção americana dos vinte e cinco anos
    anteriores coloca-o empatado em terceiro lugar, e é hoje amplamente
    chamado a obra-prima de McCarthy e um dos grandes romances americanos.

- id: all-the-pretty-horses-breakthrough-1992
  title: A viragem, vinte e sete anos e cinco romances depois
  description: >
    [[work:cormac-mccarthy/all-the-pretty-horses|Belos Cavalos]] ganha o
    National Book Award e o National Book Critics Circle Award de ficção, e
    torna-se o primeiro sucesso comercial de McCarthy depois de cinco
    romances que, entre todos, nunca tinham produzido um êxito de vendas.
    Incentivado pelo novo editor e pela primeira agente literária que alguma
    vez teve, dá também a entrevista mais completa em quatro décadas para
    promover o livro.

- id: the-road-oprah-pulitzer-2007
  title: "A escolha de Oprah, o Pulitzer, e uma única entrevista de televisão"
  description: >
    Oprah Winfrey escolhe [[work:cormac-mccarthy/the-road|A Estrada]] para o
    seu clube do livro a 28 de março, e o Prémio Pulitzer de Ficção
    segue-se a 16 de abril. Para promover a escolha, McCarthy dá a Winfrey a
    sua primeira entrevista de televisão de sempre, aos 73 anos, depois de
    quatro décadas de silêncio quase total perante a imprensa, quebrado
    apenas uma vez antes, em 1992. No ar, chama ao romance, sobre um pai e
    um filho, uma história de amor para o seu próprio filho pequeno, John
    Francis, a quem o livro é dedicado.

- id: the-counselor-reception-2013
  title: O seu único argumento original, e uma reprovação da crítica
  description: >
    [[work:cormac-mccarthy/the-counselor|O Conselheiro]] é o primeiro e
    único argumento original de McCarthy para um longa-metragem, não
    adaptado de nenhum dos seus romances, realizado por Ridley Scott a
    partir de um guião original. A crítica descarta-o no lançamento como
    falado em excesso e inerte, e o filme fica-se pelos 34% no Rotten
    Tomatoes, apesar de um elenco construído à volta de Michael Fassbender,
    Penélope Cruz, Brad Pitt e Cameron Diaz; McCarthy nunca mais escreve
    outro argumento original para o cinema. Segue-se, nos anos seguintes,
    uma reavaliação de culto, mas apenas entre a crítica, nunca à escala das
    suas outras adaptações.

- id: no-country-best-picture-2008
  title: A adaptação dos irmãos Coen arrasa nos Óscares
  description: >
    O filme de Joel e Ethan Coen baseado em
    [[work:cormac-mccarthy/no-country-for-old-men|Este País Não É para
    Velhos]] ganha Melhor Filme, Melhor Realizador e Melhor Argumento
    Adaptado na 80ª cerimónia dos Óscares, a 24 de fevereiro, com Javier
    Bardem a ganhar também Melhor Ator Secundário pela sua interpretação de
    Anton Chigurh. É a primeira vez que um dos livros de McCarthy alcança um
    público de massas através do ecrã, e não da página.

- id: kekule-problem-essay-2017
  title: O romancista publica um ensaio sobre a origem da linguagem
  description: >
    Em 2017, McCarthy, um romancista que quase nunca escreveu não-ficção,
    publica [[work:cormac-mccarthy/the-kekule-problem|The Kekulé Problem]],
    um ensaio sobre o inconsciente e a origem da linguagem: argumenta que o
    inconsciente é muito mais antigo do que a fala e raciocina em imagens,
    não em palavras. O texto nasce de décadas junto dos cientistas do Santa
    Fe Institute e tira o título do sonho do químico August Kekulé com o
    anel de benzeno. É a sua única obra sustentada de não-ficção publicada,
    e a única vez que o seu nome aparece nos anos entre O Conselheiro (2013)
    e os romances de 2022.

- id: all-the-pretty-horses-film-2000
  title: O primeiro filme baseado num romance de McCarthy chega ao ecrã, e é cortado
  description: >
    Billy Bob Thornton realiza o primeiro longa-metragem baseado num
    romance de McCarthy, [[work:cormac-mccarthy/all-the-pretty-horses|Belos
    Cavalos]], com Matt Damon e Penélope Cruz, lançado no final de 2000. A
    montagem original de Thornton durava perto de quatro horas; o estúdio
    cortou-a para menos de duas, e a receção foi contida. Ficou como um
    primeiro sinal de quão difícil é levar para o cinema a prosa interior e
    centrada na linguagem de McCarthy, um problema a que adaptações
    posteriores responderiam de formas muito diferentes.

- id: no-country-breaks-the-silence-2005
  title: Um silêncio de sete anos termina com um romance policial enxuto
  description: >
    [[work:cormac-mccarthy/no-country-for-old-men|Este País Não É para
    Velhos]] chega em 2005, o primeiro romance de McCarthy nos sete anos
    desde que Cidades da Planície fechou a Trilogia da Fronteira. Depurado e
    propulsivo onde a obra anterior era densa, e reelaborado a partir de um
    argumento nunca produzido, lê-se como uma viragem para o policial e o
    thriller, e é o livro que levaria o seu nome a um público de massas dois
    anos depois, através do cinema.
