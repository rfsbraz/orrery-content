# Overlay pt-PT das ordens de leitura: `name` + `rationale` + `debated`
# (prosa). id, type, source e orderedWorkIds nunca se traduzem.
# Referências a obras usam o título publicado em Portugal onde existe
# edição em editions.yaml (Relógio D'Água, tradução de Paulo Faria).

- id: cormac-mccarthy/border-trilogy-in-order
  name: A Trilogia da Fronteira, por ordem
  rationale: >
    Os três romances da "Trilogia da Fronteira", numerados Livro 1/2/3 na
    própria página de bibliografia de McCarthy, de
    [[work:cormac-mccarthy/all-the-pretty-horses|Belos Cavalos]] até
    [[work:cormac-mccarthy/cities-of-the-plain|Cidades da Planície]]. Cada
    romance é autónomo (um novo protagonista abre os dois primeiros), pelo
    que não é preciso seguir uma ordem rígida para acompanhar nenhuma
    história isolada, mas ler pela ordem é o que permite que os arcos
    separados de John Grady Cole e Billy Parham cheguem ao seu ponto
    pretendido quando o terceiro livro coloca os dois homens no mesmo
    rancho do Novo México. Esta ordem coincide exatamente com a ordem
    derivada por defeito para estas três obras (1992, 1994, 1998, sem
    empate de ano a desfazer); o seu único contributo é nomear e isolar a
    trilogia da própria editora como um fio percorrível à parte dos dez
    romances independentes à sua volta, da mesma forma que a ordem
    lugares-sem-nome de João Tordo nomeia a sua trilogia sem a reorganizar.

- id: cormac-mccarthy/the-passenger-and-stella-maris-in-order
  name: O Passageiro e Stella Maris, por ordem de publicação
  rationale: >
    [[work:cormac-mccarthy/the-passenger|O Passageiro]] (25 de outubro de
    2022) e [[work:cormac-mccarthy/stella-maris|Stella Maris]] (6 de
    dezembro de 2022), com seis semanas de intervalo, os dois últimos
    romances de McCarthy. Stella Maris passa-se uma década antes do seu par,
    mas esta é uma ordem de publicação, não uma ordem cronológica, e essa
    distinção é aqui importante: Stella Maris lê-se como uma prequela apenas
    em diálogo de uma irmã cujo destino as próprias páginas de abertura de O
    Passageiro são construídas para revelar à sua maneira, e ler primeiro a
    prequela antecipa ao leitor esse conhecimento antes de o livro pensado
    para o revelar ter oportunidade de o fazer. Leia primeiro O Passageiro.
  debated:
    - "Alguns leitores relatam que os dois livros se distinguem o
       suficiente, na estrutura e no tom (um romance com enredo e várias
       personagens contra uma peça a duas vozes de apenas 190 páginas), para
       serem lidos por qualquer ordem, ou Stella Maris lido sozinho sem
       perda nenhuma - uma opinião minoritária, contra a recomendação mais
       alargada da crítica sobre a ordem de leitura que esta ordem segue."
