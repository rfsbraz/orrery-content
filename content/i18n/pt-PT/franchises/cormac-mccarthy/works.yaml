# Overlay pt-PT: apenas `synopsis` (prosa). id, title, published, subseries,
# canonTier, featured e sources nunca se traduzem - o título de uma obra é
# dado de edição (ver docs/SCHEMA.md, "Published titles are edition data, not
# translation"), nunca overlay.
# Referências a obras usam o título publicado em Portugal onde existe edição
# em editions.yaml (Relógio D'Água, tradução de Paulo Faria); The Stonemason,
# The Gardener's Son, The Sunset Limited e The Kekulé Problem não têm edição
# portuguesa e ficam com o título inglês.
#
# A sinopse de Stella Maris omite deliberadamente a morte de Alicia: é o
# desfecho que as próprias páginas de abertura de O Passageiro revelam, pelo
# que nomeá-lo aqui estraga Stella Maris para quem chegue primeiro a este
# livro, passado antes na cronologia. A premissa mantém-se sem essa frase.

- id: cormac-mccarthy/the-orchard-keeper
  synopsis: >
    No interior rural do Tennessee, em declínio entre as duas guerras
    mundiais, um rapaz, um velho e o contrabandista que matou sem saber o
    pai do rapaz giram uns à volta dos outros durante anos sem que nenhum
    deles nomeie o que aconteceu.

- id: cormac-mccarthy/outer-dark
  synopsis: >
    Uma mulher e o irmão que é pai do seu filho partem cada um sozinho por
    uma paisagem inominada e bíblico-sombria dos Apalaches, depois de ele
    abandonar o recém-nascido na floresta.

- id: cormac-mccarthy/child-of-god
  synopsis: >
    Expulso das últimas margens da sua comunidade no Tennessee, um posseiro
    marginalizado desce sozinho à loucura e à violência nas colinas acima
    da cidade que o rejeitou.

- id: cormac-mccarthy/suttree
  synopsis: >
    Um homem que se afastou da própria família vive numa casa-barco no rio
    Tennessee, em Knoxville, à deriva entre os bêbedos, ladrões e marginais
    do submundo da cidade, no romance que McCarthy escreveu, ao longo de
    uns vinte anos, mais próximo da própria vida.

- id: cormac-mccarthy/blood-meridian
  synopsis: >
    Um adolescente fugido junta-se a um bando de caçadores de escalpes ao
    longo da fronteira entre o Texas e o México, na década de 1850,
    dominado pelo imenso e imberbe Juiz, uma das encarnações da violência
    mais discutidas da ficção americana. Recebido inicialmente com críticas
    mornas, o romance, financiado pela Bolsa MacArthur, é hoje amplamente
    considerado a obra-prima de McCarthy.

- id: cormac-mccarthy/all-the-pretty-horses
  synopsis: >
    Dois jovens texanos cavalgam para sul, rumo ao México, em 1949,
    perseguindo uma vida de vaqueiro já desaparecida em casa, e encontram em
    vez disso amor e violência. O primeiro sucesso comercial de McCarthy,
    depois de cinco romances anteriores escritos numa obscuridade relativa,
    vencedor do National Book Award e do National Book Critics Circle
    Award.

- id: cormac-mccarthy/the-crossing
  synopsis: >
    Um adolescente atravessa a fronteira para o México três vezes ao longo
    dos anos seguintes, primeiro para devolver uma loba presa às suas
    montanhas, depois em busca dos homens que mataram a sua família.

- id: cormac-mccarthy/cities-of-the-plain
  synopsis: >
    John Grady Cole e Billy Parham, os protagonistas dos dois primeiros
    romances da trilogia, partilham o trabalho no mesmo rancho do Novo
    México, e John Grady é arrastado para um caso amoroso condenado com uma
    prostituta de Juárez.

- id: cormac-mccarthy/no-country-for-old-men
  synopsis: >
    Um soldador que tropeça num negócio de droga que correu mal, e no
    dinheiro deixado para trás, é perseguido pelas terras fronteiriças do
    Texas por um assassino de aluguer que responde a uma lógica só sua,
    enquanto um xerife envelhecido luta para dar sentido a uma violência que
    já não reconhece como pertencendo ao seu país.

- id: cormac-mccarthy/the-road
  synopsis: >
    Um pai e o seu filho pequeno caminham por uma América devastada e
    cinzenta de cinza rumo à costa, sem nada entre eles e a fome, o
    canibalismo e o frio, além um do outro. Vencedor do Prémio Pulitzer de
    Ficção de 2007.

- id: cormac-mccarthy/the-passenger
  synopsis: >
    Um mergulhador de salvados a trabalhar na costa do Golfo no início da
    década de 1980, atormentado pelo papel do pai físico na construção da
    bomba atómica e pela morte da irmã matemática uma década antes, é
    perseguido por homens que querem algo vindo de um avião afundado que
    ele não consegue explicar.

- id: cormac-mccarthy/stella-maris
  synopsis: >
    Passado uma década antes da história do irmão, a prodígio da matemática
    Alicia Western interna-se por vontade própria numa unidade psiquiátrica
    no Wisconsin em 1972, e ao longo de sessões só de diálogo com o seu
    psiquiatra vai circulando em torno do seu génio, do seu diagnóstico e
    das perdas que não consegue racionalizar. O último romance de McCarthy,
    publicado seis semanas depois do seu par.

- id: cormac-mccarthy/the-stonemason
  synopsis: >
    Uma peça em cinco atos, escrita no final da década de 1980: três
    gerações da família Telfair, canteiros negros em Louisville, contada
    através dos monólogos de Ben Telfair enquanto escolhe o ofício da
    família em vez da universidade. Raramente encenada.

- id: cormac-mccarthy/the-gardeners-son
  synopsis: >
    Na cidade-fábrica de Graniteville, na Carolina do Sul, na era da
    Reconstrução, o ressentimento latente de um operário fabril com uma
    perna amputada para com a família dona da fábrica que o mutilou e depois
    descartou cresce até um verdadeiro homicídio de 1876. O primeiro
    argumento de McCarthy, escrito em 1976 a pedido do realizador Richard
    Pearce e transmitido como telefilme da PBS em janeiro de 1977; publicado
    em livro só em 1996, com cenas e falas cortadas da transmissão.

- id: cormac-mccarthy/the-sunset-limited
  synopsis: >
    Dois homens, um professor sem nome que acaba de tentar atirar-se para a
    frente de um comboio e o ex-presidiário que o impediu, passam uma única
    tarde a discutir sobre fé, desespero e se vale a pena viver. Publicada
    com o subtítulo "A Novel in Dramatic Form", que a própria edição de
    bolso da peça usa para perturbar o seu próprio género.

- id: cormac-mccarthy/the-counselor
  synopsis: >
    Um argumento original, não adaptado de nenhum romance de McCarthy: um
    único passo ganancioso de um advogado texano num negócio de droga
    desfaz-lhe a vida e a de todos os que lhe estão ligados. Realizado por
    Ridley Scott e publicado em livro juntamente com o lançamento do filme.

- id: cormac-mccarthy/the-kekule-problem
  synopsis: >
    O único ensaio publicado por McCarthy e a sua primeira obra de
    não-ficção, escrito para o Santa Fe Institute: partindo da descoberta
    em sonho, pelo químico August Kekulé, da estrutura em anel do benzeno,
    pergunta por que razão a linguagem, ao contrário do resto do pensamento
    humano, parece resistir à mente inconsciente que produz tudo o resto.
