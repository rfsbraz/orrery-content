# Português europeu (pt-PT) - sinopses. Os títulos NÃO são traduzidos: já são
# os originais portugueses (proibido pelo próprio validador em works.yaml de
# qualquer forma). As notas de curadoria (`note:`) ficam na língua de base -
# são anotações editoriais, não prosa para o leitor (precedente já
# estabelecido em eca-de-queiros/works.yaml; i18n_coverage.py também não as
# conta).

- id: cesario-verde/o-livro-de-cesario-verde
  synopsis: >
    O livro que fez a reputação de Cesário Verde: a Lisboa urbana e rural
    rendida com uma precisão fotográfica, quase cinematográfica, nova na
    poesia portuguesa, dividido entre poemas sobre a pobreza, a doença e a
    vaidade burguesa da cidade e poemas sobre um campo recordado como
    vital, saudável e livre - a mesma divisão entre cidade e campo em que
    Verde cresceu. Reunido e publicado no ano seguinte à sua morte pelo seu
    amigo, o crítico Silva Pinto.

- id: cesario-verde/obra-completa-de-cesario-verde
  synopsis: >
    A edição crítica, organizada, prefaciada e anotada pelo historiador
    Joel Serrão, que recuperou poemas que Silva Pinto tinha deixado de fora
    da princeps de 1887 - dispersos por jornais e revistas em que Verde
    publicara em vida - e estabeleceu o cânone mais alargado, de cerca de
    quarenta poemas, hoje lido como a obra reunida de Verde.

- id: cesario-verde/o-sentimento-dum-ocidental
  synopsis: >
    Uma longa caminhada por uma tarde e noite lisboetas que se torna o
    poema mais ambicioso de Verde: quatro andamentos com título, do
    anoitecer à madrugada, que contrapõem diretamente a miséria e o tédio
    presentes da cidade à grandeza desaparecida das descobertas
    portuguesas e do Camões que as cantou. Já o seu primeiro andamento
    nomeia as cidades onde o caminhante preferiria estar - "Madrid, Paris,
    Berlim, S. Petersburgo". Amplamente lido como a antecipação mais
    clara, dentro da própria obra de Verde, da linha modernista e, em
    particular, de Álvaro de Campos, que se seguiria na poesia portuguesa.

- id: cesario-verde/nos
  synopsis: >
    O poema mais longo de Verde e, segundo os seus próprios biógrafos, o
    mais diretamente autobiográfico: uma infância idílica no campo
    recordada longamente, e contraposta à tuberculose que levou a sua irmã
    e depois o seu irmão e que, por essa altura, já trabalhava no próprio
    Verde.
