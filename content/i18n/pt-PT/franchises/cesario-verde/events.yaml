# Português europeu (pt-PT) - acontecimentos da franquia (o que aconteceu aos
# LIVROS depois de 1886; a vida do autor está em
# content/i18n/pt-PT/authors/cesario-verde.yaml). Nenhuma destas duas
# entradas tem organisation: epigraph, pelo que nenhuma carrega um campo
# `quote` a traduzir.

- id: cesario-verde-segunda-edicao-1901
  title: Uma segunda edição chega finalmente ao grande público
  description: >
    O [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
    Verde]] de Silva Pinto, de 1887, tinha sido uma edição de oferta de
    200 exemplares, nunca posta à venda. Uma segunda edição em 1901 -
    "primeira lançada ao público em geral", segundo a própria tábua
    bibliográfica de Joel Serrão - é, pela sua própria descrição, uma
    reimpressão textual do original de Silva Pinto, e não uma revisão. Só
    com esta edição, catorze anos após a morte de Verde, o livro que lhe
    fez a reputação chega efetivamente aos leitores com quem a fez.

- id: cesario-verde-linda-a-pastora-fire-1919
  title: Um incêndio em Linda-a-Pastora destrói o que possa ter restado dos seus papéis
  description: >
    Um incêndio destrói parte da casa da família Verde em Linda-a-Pastora,
    Oeiras - a quinta cujo contraste entre cidade e campo percorre toda a
    sua obra -, queimando papéis e livros que poderão ter sido o que
    restava do espólio do próprio Cesário. Nunca mais se recupera nenhum
    manuscrito ou poema inédito além do que já tinha chegado à letra
    impressa em vida ou em
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
    Verde]]: tudo o que Joel Serrão acrescenta ao cânone em 1964 vem de
    periódicos em que Verde tinha publicado, não de papel que alguma vez
    tivesse tido em mãos.
