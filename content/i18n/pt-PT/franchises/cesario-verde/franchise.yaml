# Overlay pt-PT. Apenas prosa; id, slugs, título da obra e sources não se
# traduzem. Cobre a descrição do wing e os percursos de startHere (estes
# últimos já traduzidos por uma passagem anterior).
- id: cesario-verde
  description: >
    O filho de um lojista lisboeta que trouxe à poesia portuguesa a exatidão
    de um jornalista - a pobreza e a vaidade da cidade, a vitalidade do
    campo, tudo rendido com uma precisão que os seus próprios críticos
    chamaram fotográfica - e que morreu de tuberculose aos 31 anos tendo
    publicado quase nada em livro; o seu amigo Silva Pinto reuniu os seus
    poemas dispersos em
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
    Verde]] no ano seguinte, e viria a ser reivindicado pela geração de
    Fernando Pessoa como a primeira voz da poesia portuguesa moderna.
  startHere:
    paths:
      - id: classroom-canon
        title: Comece por O Livro de Cesário Verde
        description: >
          O Livro de Cesário Verde é toda a sua reputação publicada: uma
          única e breve coletânea póstuma, reunida pelo seu amigo Silva
          Pinto no ano seguinte à morte de Verde. Leia-o do princípio ao
          fim, e dedique a maior atenção a "O Sentimento dum Ocidental": o
          poema que praticamente todos os leitores portugueses do ensino
          secundário encontram, leitura integral obrigatória no programa de
          Português do 11.º ano do Ministério da Educação, e apontado de
          forma independente pela crítica - que nunca deu aulas - como a
          sua obra-prima. O custo: fica de fora os restantes poemas que a
          edição crítica de 1964 de Joel Serrão viria a recuperar de
          periódicos - e, para um leitor português que estudou Verde na
          escola, nada disto é uma descoberta.
      - id: everything
        title: Tudo, por ordem
        description: >
          O registo publicado completo: O Livro de Cesário Verde (1887),
          seguido da edição crítica de 1964 de Joel Serrão, que recuperou
          os poemas que a seleção original de Silva Pinto tinha deixado de
          fora e estabeleceu o cânone mais alargado hoje lido como a obra
          reunida de Verde. O custo: o livro de 1964 é um aparato erudito
          montado setenta e oito anos após a sua morte - notas editoriais e
          poemas reconstituídos a partir de periódicos - e não uma segunda
          obra de criação por direito próprio.
