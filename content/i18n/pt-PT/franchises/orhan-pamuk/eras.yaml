# Overlay pt-PT: title, description e themes (prosa lida, exibida na placa
# da era). period, organisation, illustration_type, images_required,
# provenance e sources nunca se traduzem. `note:` não é traduzido: nenhum
# overlay pt-PT deste catálogo o traduz, o campo não é lido pela aplicação.
#
# CITAÇÕES VERBATIM: a description de base cita a Gale Biographical
# Encyclopedia em inglês ("an important turning point...", "he broke with
# the realist tradition...") e o próprio Pamuk na autobiografia do Nobel
# ("felt I found my own voice"); ficam em inglês, verbatim, dentro da prosa
# traduzida - sem tradução portuguesa publicada localizável para nenhuma das
# duas, e não se inventa uma para uma citação atribuída a uma fonte real
# (mesma regra já registada em haruki-murakami.yaml, hp-lovecraft.yaml,
# anna-sewell.yaml e miguel-de-cervantes.yaml). A citação de Fethi Demir
# ("Klasik/Modern Romanlar", "Pamuk'un ilk dönem eserlerinden biri") já está
# em turco no texto de base e mantém-se assim pela mesma razão.
# "Family sagas" é a frase do próprio Pamuk (autobiografia do Nobel, em
# inglês) e mantém-se em inglês, verbatim, sem glosa portuguesa acrescentada.
# Nenhum título de obra citado aqui tem edição pt-PT verificada
# (editions.yaml desta ala), pelo que todas as ligações mantêm o título
# turco original.

- id: the-family-sagas
  title: As Sagas Familiares
  themes: [três gerações de uma família de Istambul, um século de história turca, a herança otomana, o romance oitocentista, a casa como o mundo inteiro]
  description: >
    Os dois romances a que a crítica turca chama o primeiro período de
    Pamuk, e a que o próprio chama "family sagas":
    [[work:orhan-pamuk/cevdet-bey-ve-ogullari|Cevdet Bey ve Oğulları]], três
    gerações de uma família de comerciantes de Istambul seguidas desde os
    últimos anos de Abdülhamid II até à república, escrito à maneira de
    Thomas Mann e dos realistas oitocentistas, e
    [[work:orhan-pamuk/sessiz-ev|Sessiz Ev]], o mesmo século de história
    turca contado de novo através de uma semana que três netos passam em
    casa da avó, à beira-mar, agora repartida por cinco vozes na primeira
    pessoa, na linha de Faulkner e de Woolf. Fethi Demir agrupa os dois como
    "Klasik/Modern Romanlar" e escreve do segundo que, apesar da distância
    técnica ao primeiro, é "Pamuk'un ilk dönem eserlerinden biri", uma das
    obras do primeiro período de Pamuk. O período termina onde a crítica o
    termina, em [[work:orhan-pamuk/beyaz-kale|Beyaz Kale]] (1985), o romance
    a que a Gale encyclopedia chama "an important turning point both for the
    author's career and for Turkish novel in general", em que "he broke with
    the realist tradition and attempted something different from his first
    two novels". Pamuk situa a sua própria chegada um pouco mais tarde
    ainda: foi em [[work:orhan-pamuk/kara-kitap|Kara Kitap]], começado em
    1985, que "felt I found my own voice".
