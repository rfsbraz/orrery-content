# Overlay pt-PT dos eventos da franquia: `title` + `description`. Datas,
# scope, reach, impact, spoilerAfter, organisation, illustration_type,
# images_required, modifier, dateRange e sources nunca se traduzem.
# Uma obra citada aqui tem edição pt-PT publicada e usa esse título como
# texto da ligação: Benim Adım Kırmızı -> "O Meu Nome É Vermelho" (Editorial
# Presença, 2007; ver editions.yaml), reservado a esta menção porque o
# evento é inteiramente sobre esse livro (o prémio que ele por si só venceu)
# - a mesma convenção já usada em michael-connelly/events.yaml para The
# Fifth Witness -> "A Quinta Testemunha". As restantes obras citadas (Beyaz
# Kale, Yeni Hayat, Masumiyet Müzesi, Balkon, The Naive and the Sentimental
# Novelist) não têm edição portuguesa registada e mantêm o título original -
# incluindo essa última, cujo título original (works.yaml) já é inglês, por
# ter sido publicada em inglês antes de qualquer edição turca.
# A citação de Pamuk sobre o prémio de Dublin (pamuk-benim-adim-kirmizi-
# prize-sweep-2002) fica em inglês, verbatim, sem tradução portuguesa
# publicada localizável (mesma regra de haruki-murakami.yaml e
# authors/orhan-pamuk.yaml desta ala).

- id: pamuk-beyaz-kale-international-award-1990
  title: Beyaz Kale vence o Independent Foreign Fiction Prize britânico
  description: >
    [[work:orhan-pamuk/beyaz-kale|Beyaz Kale]] (1985) foi o primeiro romance
    de Pamuk a chegar ao inglês - como The White Castle, traduzido por
    Victoria Holbrook - e venceu o Independent Foreign Fiction Prize
    britânico em 1990. A New York Times Book Review seguiu-se no ano
    seguinte com uma crítica de Jay Parini que abria assim: "A new star has
    risen in the east - Orhan Pamuk," a frase geralmente apontada como o
    início da sua reputação no estrangeiro, anos antes de
    [[work:orhan-pamuk/benim-adim-kirmizi|Benim Adım Kırmızı]] ou do Nobel.

- id: pamuk-yeni-hayat-fastest-seller-1994
  title: Yeni Hayat torna-se o livro mais rapidamente vendido da história editorial turca
  description: >
    A publicação de [[work:orhan-pamuk/yeni-hayat|Yeni Hayat]] em 1994 foi
    uma sensação em casa: tornou-se, segundo várias fontes, o livro mais
    rapidamente vendido da história editorial turca, prova de que a
    reputação internacional que Beyaz Kale e Kara Kitap tinham construído no
    estrangeiro tinha correspondência num verdadeiro público de massas
    dentro da própria Turquia. O apoio público de Pamuk aos direitos
    políticos dos curdos fazia dele, ao mesmo tempo, uma figura de grande
    visibilidade e divisiva no país.

- id: pamuk-benim-adim-kirmizi-prize-sweep-2002
  title: O Meu Nome É Vermelho vence três dos maiores prémios de ficção estrangeira
  description: >
    [[work:orhan-pamuk/benim-adim-kirmizi|O Meu Nome É Vermelho]] (1998)
    venceu o Prix du Meilleur Livre Étranger francês e o Premio Grinzane
    Cavour italiano em 2002, e depois - já traduzido, nessa altura, em 24
    línguas - o International Dublin Literary Award em 2003, atribuído em
    conjunto com o seu tradutor Erdağ M. Göknar e no valor de 127 000
    dólares, um dos prémios mais ricos da literatura. Questionado sobre o
    que a vitória tinha mudado, Pamuk respondeu: "Nothing changed in my life
    since I work all the time. I've spent 30 years writing fiction. For the
    first 10 years, I worried about money and no one asked how much money I
    made... And I've spent the last 10 years with everyone expecting to hear
    how I spend the money, which I will not do." Três anos antes do Nobel,
    esta sequência de prémios é o momento em que a sua reputação deixa de
    ser apenas turca e passa a ser global.

- id: pamuk-norton-lectures-2009
  title: Profere as Norton Lectures de Harvard
  description: >
    Proferiu as Charles Eliot Norton Lectures em Harvard em 2009, uma das
    mais prestigiadas cátedras convidadas das humanidades. Excecionalmente
    na sua bibliografia, o livro daí resultante,
    [[work:orhan-pamuk/the-naive-and-the-sentimental-novelist|The Naive and
    the Sentimental Novelist]] - o seu próprio relato de como os romancistas
    escrevem e leem, na prática - foi publicado primeiro em inglês (Harvard
    University Press, 2010) e só no ano seguinte em turco, invertendo a
    ordem turco-primeiro que todos os outros títulos deste catálogo seguem.

- id: pamuk-museum-of-innocence-opens-2012
  title: Abre em Istambul um verdadeiro Museu da Inocência, construído a par do romance
  description: >
    [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet Müzesi]] (2008) foi
    concebido desde o início a par de um museu real: Pamuk comprou uma casa
    oitocentista no bairro de antiguidades de Çukurcuma, em Istambul, e
    encheu-a de objetos do quotidiano ligados à história do romance - roupas,
    relógios, fotografias, uma caixa de beatas de cigarro - dispostos em 83
    vitrines, uma por capítulo, de modo a que a coleção ficcional do livro se
    tornasse numa que um leitor pode realmente percorrer. Abriu em abril de
    2012 e venceu o European Museum of the Year Award de 2014, uma honra
    pouco comum para um museu construído ao serviço de um romance, e não o
    contrário.

- id: pamuk-balkon-exhibition-2018
  title: Balkon reúne cinco meses de fotografias do Bósforo tiradas da sua própria janela
  description: >
    [[work:orhan-pamuk/balkon|Balkon]] (2018) reúne fotografias que Pamuk
    tirou da vista da sua própria varanda em Istambul com uma teleobjetiva -
    mais de 8500 fotogramas captados ao longo de cinco meses, entre o fim de
    2012 e o início de 2013, observando o mesmo troço do Bósforo a mudar com
    a luz e as estações. Com curadoria do seu editor alemão Gerhard Steidl,
    mais de 600 dessas fotografias foram expostas como "Balkon: Photos by
    Orhan Pamuk" no edifício da Yapı Kredi Culture and Arts, na rua
    İstiklal, durante três meses em 2019.
