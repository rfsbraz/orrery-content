# Overlay pt-PT. Apenas prosa (description); id, name, authorIds, themePreset,
# features, globalEvents e sources nunca se traduzem.
# Títulos de obras citados na prosa: só existe uma edição pt-PT verificada
# nesta ala (editions.yaml), Benim Adım Kırmızı -> "O Meu Nome É Vermelho"
# (Editorial Presença, 2007), e essa substituição fica reservada à menção
# isolada do livro em events.yaml (o prémio que ele por si só venceu). Aqui
# Benim Adım Kırmızı aparece lado a lado com Beyaz Kale, que não tem edição
# portuguesa, numa lista de exemplos de ficção histórica pós-moderna, por
# isso os dois ficam com o título turco original (nunca uma lista com um
# título português e outro inventado). As restantes obras referidas também
# não têm edição portuguesa e mantêm o título turco original.

- id: orhan-pamuk
  description: >
    A obra publicada completa de Orhan Pamuk, o primeiro laureado turco com o
    Nobel (2006): onze romances, da sua estreia de 1982,
    [[work:orhan-pamuk/cevdet-bey-ve-ogullari|Cevdet Bey ve Oğulları]], até ao
    seu épico da peste de 2021,
    [[work:orhan-pamuk/veba-geceleri|Veba Geceleri]], passando da saga
    familiar realista pela ficção histórica pós-moderna
    ([[work:orhan-pamuk/beyaz-kale|Beyaz Kale]],
    [[work:orhan-pamuk/benim-adim-kirmizi|Benim Adım Kırmızı]]) até à
    Istambul contemporânea de [[work:orhan-pamuk/kar|Kar]] e
    [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet Müzesi]]; o seu livro de
    memórias da cidade, [[work:orhan-pamuk/istanbul-hatiralar-ve-sehir|İstanbul:
    Hatıralar ve Şehir]]; duas coletâneas de ensaios e o seu discurso do
    Nobel; o livro das Norton Lectures que proferiu e publicou primeiro em
    inglês; o catálogo de objetos do verdadeiro Museu da Inocência que
    construiu em Istambul a partir do seu próprio romance; duas coletâneas de
    fotografia; um argumento; e um volume de cadernos pessoais. Não há
    nenhuma série recorrente nem universo partilhado a atravessá-la: cada
    romance é autónomo.
