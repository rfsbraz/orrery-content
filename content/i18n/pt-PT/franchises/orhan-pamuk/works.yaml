# Overlay pt-PT das obras: apenas `synopsis` (prosa, sem spoilers). id, title,
# published, subseries, canonTier, format, featured, note e sources nunca se
# traduzem.
# Três sinopses citam outra obra da ala por ligação inline:
# [[work:orhan-pamuk/masumiyet-muzesi|...]] em seylerin-masumiyeti e em
# hatiralarin-masumiyeti, e [[work:orhan-pamuk/kara-kitap|...]] em
# kara-kitabin-sirlari. Nas três o título mantém-se o turco original, porque
# nenhuma das duas obras citadas tem edição pt-PT registada em editions.yaml.
# A questão do título português (ver franchise.yaml e events.yaml desta ala,
# sobre Benim Adım Kırmızı / "O Meu Nome É Vermelho", a única com edição
# portuguesa verificada) não chega a colocar-se em nenhuma sinopse.
# A sinopse de kirmizi-sacli-kadin corresponde ao texto de base já revisto
# para remover o enquadramento de Édipo/Rostam e Sohrab (ver a nota da obra
# em works.yaml): a versão portuguesa segue a mesma premissa, sem os nomear.

- id: orhan-pamuk/cevdet-bey-ve-ogullari
  synopsis: >
    Três gerações de uma abastada família de comerciantes de Istambul, no
    bairro de Nişantaşı, dos últimos anos do reinado do sultão Abdülhamid II
    até aos primeiros anos da república turca, acompanham o lojista Cevdet
    Bey e os seus descendentes ao longo da lenta modernização da cidade
    nesse século.

- id: orhan-pamuk/sessiz-ev
  synopsis: >
    Três irmãos passam uma semana do verão de 1980 em casa da avó, na
    povoação costeira de Cennethisar, cada um trazendo consigo uma leitura
    diferente da agitação política da Turquia às vésperas do golpe militar
    desse ano.

- id: orhan-pamuk/beyaz-kale
  synopsis: >
    Um jovem erudito veneziano, capturado pela frota otomana no século XVII,
    é forçado a anos de parceria e rivalidade intelectual com um sábio turco
    chamado Hoja, que se lhe assemelha de forma inquietante, e as
    identidades dos dois homens vão-se desfazendo à medida que colaboram na
    ciência e num espetacular fogo de artifício real.

- id: orhan-pamuk/kara-kitap
  synopsis: >
    Um advogado de Istambul chamado Galip percorre a cidade à procura da
    mulher desaparecida, Rüya, e do meio-irmão dela, um célebre cronista de
    jornal, num romance que entrelaça essa busca com transcrições das
    próprias crónicas do cronista, densas e labirínticas, sobre o passado
    otomano e o presente de Istambul.

- id: orhan-pamuk/yeni-hayat
  synopsis: >
    Um jovem estudante de engenharia em Istambul lê um livro que diz
    ter-lhe mudado a vida inteira, e lança-se numa série de surreais
    viagens de autocarro pela Anatólia, perseguindo o mundo que o livro
    descreve e Janan, a mulher que partilha a sua obsessão por ele.

- id: orhan-pamuk/benim-adim-kirmizi
  synopsis: >
    Ao longo de nove dias de neve na Istambul de 1591, o assassínio de um
    miniaturista da corte que trabalhava em segredo num manuscrito para o
    sultão Murad III desenrola-se através de um elenco rotativo de
    narradores - incluindo, por vezes, um cadáver, uma moeda, um cão e a
    própria cor vermelha - cada um dando voz a um interesse diferente na
    disputa da corte otomana sobre a pintura de perspetiva ao estilo
    ocidental.

- id: orhan-pamuk/kar
  synopsis: >
    Um poeta turco exilado regressa da Alemanha para investigar uma vaga de
    suicídios entre jovens impedidas de frequentar a escola por usarem o véu
    islâmico, e vê-se bloqueado pela neve na remota cidade de Kars durante
    três dias de golpe, cortejo amoroso e facções políticas rivais.

- id: orhan-pamuk/masumiyet-muzesi
  synopsis: >
    A ligação obsessiva de uma década de um abastado empresário de Istambul
    a uma parente distante e mais pobre, que amou brevemente em 1975, leva-o
    a acumular objetos que um dia lhe pertenceram, montando, objeto a
    objeto, o museu privado que dá nome ao romance.

- id: orhan-pamuk/kafamda-bir-tuhaflik
  synopsis: >
    Mevlut, vendedor ambulante de boza em Istambul, e a sua família e a da
    mulher atravessam a transformação da cidade entre 1969 e 2012, uma saga
    familiar contada sobre o pano de fundo de décadas de migração, expansão
    urbana e convulsão política.

- id: orhan-pamuk/kirmizi-sacli-kadin
  synopsis: >
    Um rapaz do liceu arranja, no verão, um trabalho de aprendiz de um
    mestre cavador de poços numa planície árida nos arredores de Istambul,
    cria com ele um vínculo quase filial ao longo de semanas de escavação
    sem encontrar água, e sente-se atraído por uma atriz itinerante de
    cabelo ruivo, cuja atenção marca os trinta anos de vida que se seguem.

- id: orhan-pamuk/veba-geceleri
  synopsis: >
    Um surto de peste na fictícia ilha otomana de Mingheria, em 1901,
    desencadeia quarentena, charlatanice, uma investigação de assassínio em
    quarto fechado e, por fim, uma revolução - um épico histórico que
    vários dos primeiros críticos leram a par de "The Plague," de Camus.

- id: orhan-pamuk/istanbul-hatiralar-ve-sehir
  synopsis: >
    Um livro de memórias sobre a infância em Nişantaşı, entrelaçado com uma
    história da própria Istambul, centrado no "hüzün" - a melancolia
    específica e coletivamente sentida que Pamuk defende definir a cidade -
    e ilustrado ao longo de todo o livro com fotografias a preto e branco de
    Istambul, muitas de Ara Güler, a par de fotografias de Pamuk e da sua
    família.

- id: orhan-pamuk/oteki-renkler
  synopsis: >
    Uma reunião de ensaios, entrevistas e textos de circunstância de Pamuk,
    percorrendo a sua infância, os seus hábitos de trabalho e as suas
    leituras, publicada pela primeira vez em turco em 1999.

- id: orhan-pamuk/gizli-yuz
  synopsis: >
    Um arquiteto procura obsessivamente por Istambul uma mulher que avistou
    apenas uma vez, num argumento que o próprio Pamuk escreveu, desenvolvido
    a partir de uma passagem do seu próprio romance "Kara Kitap."

- id: orhan-pamuk/babamin-bavulu
  synopsis: >
    O discurso do Nobel de Pamuk, construído à volta da pequena mala com os
    seus próprios escritos inéditos que o pai lhe deu dois anos antes de
    morrer, e sobre o que significa escrever medindo-se a um pai que também
    um dia quis escrever.

- id: orhan-pamuk/the-naive-and-the-sentimental-novelist
  synopsis: >
    Seis ensaios sobre o que se passa dentro de um leitor e de um escritor
    ao longo de um romance - personagem, enredo, a imaginação visual, o
    sentido do "centro" de um romance - desenvolvidos a partir das Charles
    Eliot Norton Lectures que Pamuk proferiu em Harvard entre 2009 e 2010.

- id: orhan-pamuk/seylerin-masumiyeti
  synopsis: >
    O catálogo do verdadeiro Museu da Inocência que Pamuk construiu no
    bairro de Çukurcuma, em Istambul, organizado capítulo a capítulo em
    torno do romance [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet Müzesi]]
    que a própria coleção do museu ilustra.

- id: orhan-pamuk/kara-kitabin-sirlari
  synopsis: >
    Um estudo sobre como foi escrito
    [[work:orhan-pamuk/kara-kitap|Kara Kitap]], construído a partir dos
    próprios cadernos de trabalho de Pamuk, dos seus esboços, de excertos de
    entrevistas e dos vestígios deixados no manuscrito do romance, mostrando
    que a feitura do livro foi, à sua maneira, tão cheia de segredos, jogos
    e enigmas como o próprio romance.

- id: orhan-pamuk/manzaradan-parcalar
  synopsis: >
    Uma nova coletânea de ensaios sobre a vida, as ruas da cidade e a
    literatura, publicada pela İletişim Yayınları em 2010.

- id: orhan-pamuk/hatiralarin-masumiyeti
  synopsis: >
    Construído à volta do documentário de Grant Gee de 2015, com o mesmo
    nome em inglês, este "livro-filme" junta o argumento do filme e uma
    transcrição de uma conversa entre Pamuk e Gee a um novo texto em prosa
    em que Pamuk revisita a história de amor de Kemal e Füsun em
    [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet Müzesi]] pelos olhos de
    Ayla, uma personagem aqui introduzida, a par das próprias imagens do
    filme e das reflexões do próprio Pamuk sobre o romance, o verdadeiro
    Museu da Inocência e o próprio filme.

- id: orhan-pamuk/balkon
  synopsis: >
    Cerca de 600 das aproximadamente 8500 fotografias a cores que Pamuk
    tirou da sua própria varanda em Istambul, ao longo de cinco meses no
    inverno de 2012-2013, olhando para o Bósforo, a cidade antiga e as
    colinas em redor, com um texto introdutório do próprio.

- id: orhan-pamuk/turuncu
  synopsis: >
    Uma nova coletânea de fotografias de Istambul do próprio Pamuk,
    tiradas, segundo o próprio, em caminhadas pelas ruelas esquecidas da
    cidade depois de um dia de escrita, com um texto introdutório do
    próprio.

- id: orhan-pamuk/uzak-daglar-ve-hatiralar
  synopsis: >
    Uma seleção dos cadernos pessoais e fotografias de Pamuk, mantidos
    entre 2009 e 2022, combinando entradas de diário com as suas próprias
    ilustrações.

- id: orhan-pamuk/kelimeler-ve-resimler
  synopsis: >
    Memórias pessoais e textos sobre literatura e arte, reunindo peças
    sobre as suas amizades com Ara Güler, Umberto Eco, Paul Auster e Anselm
    Kiefer, história de família envolvendo o seu pai, Gündüz Pamuk, e a sua
    tia, a professora de direito Türkân Rado, e um relato retrospetivo de
    como o romance e o verdadeiro Museu da Inocência nasceram e se
    desenvolveram, a par de fotografias e desenhos inéditos do seu próprio
    arquivo.
