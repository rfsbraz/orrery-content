# Tradução pt-PT (português europeu) da prosa curada da ala Miguel de
# Cervantes. `startHere.paths` é uma lista aninhada com id: funde-se item a
# item pela chave `id` (docs/SCHEMA.md, "Nested lists merge by id"), pelo
# que aqui só vai prosa (title, description, note) - nunca `workIds`,
# `orderId` ou `fit`.
#
# A description mantém "a segunda escrita para responder à falsa
# continuação de um impostor" - motivo de publicação, não o dispositivo
# dentro da ficção, a mesma leitura já fixada no texto base desta
# franchise.yaml (ungated, ao contrário do que avellaneda-affair-1614
# guarda atrás do seu spoilerAfter).

- id: miguel-de-cervantes
  description: >
    Um soldado, cativo e cobrador de impostos que se tornou romancista
    tardio, cujo grande livro único - contado em duas partes, com dez anos
    de intervalo, a segunda escrita para responder à falsa continuação de
    um impostor - se tornou o primeiro romance moderno.
  startHere:
    paths:
      - id: start-with-don-quixote
        title: Comece por Dom Quixote
        description: >
          Quase toda a gente que abre esta ala está aqui por um livro. Dom
          Quixote é a razão de Cervantes ter sequer uma estante - uma
          sondagem de 2002 junto de uma centena de autores de referência,
          de 54 países, elegeu-o o melhor livro alguma vez escrito - e foi
          lido sozinho, durante uma década, antes de a sua própria
          continuação existir. O fidalgo já entrado em anos que muda o
          próprio nome para o de um cavaleiro, e o lavrador de pés bem
          assentes na terra que o acompanha, não precisam de mais nada
          nesta estante antes disso.
        note: >
          A única decisão que pede antes da primeira página: qual a
          tradução escolher. A versão rápida e coloquial de Edith Grossman,
          de 2003, e a tradução de John Rutherford, de 2000, mais próxima do
          tom da época, costumam ser recomendadas uma em vez da outra, não
          em conjunto - escolher a que não se ajusta ao ouvido do leitor
          muda o registo do livro, não apenas a edição. O custo de ficar
          por aqui são os vinte anos de cada lado: as peças marcadas pelo
          cativeiro que vieram antes, e a década final, atarefada, que veio
          depois.

      - id: beyond-don-quixote
        title: "Para além de Dom Quixote: as Novelas ejemplares"
        description: >
          Para um leitor que já leu Dom Quixote e quer mais do mesmo
          romancista, não a estante inteira. As Novelas ejemplares são
          doze pequenas novelas de ciganos, ladrões, cativos e vigaristas,
          que Cervantes apresentou com uma reivindicação fundadora de
          género: as primeiras novelas escritas em castelhano, e não
          traduzidas de fora. Os resumos de referência sobre Cervantes
          nomeiam apenas estas duas obras, lado a lado, como as suas obras
          notáveis - esta é a segunda paragem, não uma opção entre várias.
        note: >
          O custo é tudo o que fica de fora: a pastoral inicial, La
          Galatea, e por completo as peças e a poesia do nível alargado da
          ala.

      - id: everything
        title: Tudo, por ordem
        description: >
          As oito obras pela ordem de publicação - a estreia pastoril, Dom
          Quixote, a explosiva década final, e o póstumo Persiles - para um
          leitor que já conhece Dom Quixote e quer o resto da estante, ou
          para quem quer o arco completo da viragem tardia de um soldado e
          cobrador de impostos para o romance.
        note: >
          Ordem de publicação significa aqui ordem de impressão, não ordem
          de composição: El trato de Argel e El cerco de Numancia
          pertencem, pela composição, aos primeiros anos de Cervantes,
          levadas à cena por volta de 1582, mas só chegaram à imprensa em
          1784 - por isso "tudo, por ordem" termina com elas, décadas
          depois da sua morte, em vez de começar por elas.
