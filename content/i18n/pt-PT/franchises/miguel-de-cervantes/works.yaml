# Português europeu (pt-PT) - sinopses.
# Os títulos de obras NÃO são traduzidos aqui (ver docs/SCHEMA.md, "Never
# translate a published title"): um título traduzido só existe como edição,
# em editions.yaml. `note:` também não é traduzido: o campo não é lido pela
# aplicação em Work (só `synopsis` chega ao leitor), mesma convenção já
# registada em jo-nesbo/works.yaml e edgar-allan-poe/works.yaml.
#
# NOMES PRÓPRIOS: "Dom Quixote" e "Sancho Pança" são as formas
# convencionadas em português, não uma transliteração do espanhol "Don
# Quijote"/"Sancho Panza" nem uma tradução do inglês "Don Quixote"/"Sancho
# Panza". A própria editions.yaml regista a edição portuguesa de referência
# sob o título "Dom Quixote de La Mancha" (Publicações Dom Quixote, 2017),
# confirmando essa forma; "Sancho Pança" é a grafia usada por essa mesma
# tradição editorial portuguesa. O `title` da obra em si mantém-se sempre o
# espanhol original ("El ingenioso hidalgo don Quijote de la Mancha"), por
# ser um título publicado; apenas a prosa - aqui, a sinopse - usa as formas
# portuguesas ao nomear a personagem e o livro dentro de uma frase.
#
# CUIDADO COM SPOILERS: a sinopse de Dom Quixote fica ao nível da premissa,
# sem qualquer menção ao processo de Avellaneda nem ao seu desfecho dentro
# da Segunda Parte - o mesmo limite já fixado no texto base.

- id: miguel-de-cervantes/la-galatea
  synopsis: >
    Um romance pastoril que acompanha o amor do pastor Elicio por Galatea,
    entrelaçado com as histórias de amor, contadas e recontadas, dos outros
    pastores e viajantes que se juntam à sua caminhada até um casamento.

- id: miguel-de-cervantes/don-quixote
  synopsis: >
    Um fidalgo provinciano já entrado em anos, com a cabeça virada por
    romances de cavalaria a mais, muda o próprio nome para Dom Quixote,
    recruta como escudeiro um lavrador de pés bem assentes na terra, Sancho
    Pança, e parte a cavalo para reviver a cavalaria andante numa Espanha
    que já não lhe tem lugar nenhum.

- id: miguel-de-cervantes/novelas-ejemplares
  synopsis: >
    Doze novelas de ciganos, ladrões, cativos e vigaristas pela Espanha de
    Cervantes, que vão do romance idealizado ao realismo social mais
    cortante - entre elas "La gitanilla", "Rinconete y Cortadillo" e "El
    coloquio de los perros".

- id: miguel-de-cervantes/viaje-del-parnaso
  synopsis: >
    Um poema heroico-cómico em oito capítulos, em que Cervantes navega até
    ao Parnaso a bordo de um navio feito de versos, passando em revista - e,
    nalguns casos que deixa ao critério do leitor, ridicularizando - os seus
    colegas poetas espanhóis.

- id: miguel-de-cervantes/ocho-comedias-y-ocho-entremeses
  synopsis: >
    Um único volume com oito peças de teatro em forma completa e oito
    entremeses cómicos de um ato, publicado para leitores e não para o
    palco - o próprio título afirma que nunca foram representados.

- id: miguel-de-cervantes/el-trato-de-argel
  synopsis: >
    Um drama sobre cativos cristãos retidos para resgate em Argel, inspirado
    diretamente nos cinco anos que o próprio Cervantes ali passou.

- id: miguel-de-cervantes/el-cerco-de-numancia
  synopsis: >
    Uma tragédia sobre o cerco romano à cidade celtibérica de Numância, em
    133 a.C., levada à cena com toda a população da cidade a escolher o
    suicídio coletivo em vez da rendição e da escravidão.

- id: miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda
  synopsis: >
    Dois amantes que viajam sob nomes falsos rumam do extremo norte até Roma
    através de uma sucessão de naufrágios, cativeiros e provações, num
    romance que abraça o fantástico em vez do naturalismo quotidiano de Dom
    Quixote.
