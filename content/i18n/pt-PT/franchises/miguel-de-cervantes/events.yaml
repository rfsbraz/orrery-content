- id: avellaneda-affair-1614
  title: "Uma falsa Segunda Parte provoca a verdadeira"
  description: >
    Por volta de setembro de 1614, com Cervantes ainda a trabalhar na sua
    própria continuação, surge em Tarragona um espúrio "Segundo tomo del
    ingenioso hidalgo don Quijote de la Mancha", atribuído a um licenciado
    "Alonso Fernández de Avellaneda, de Tordesilhas" - quase de certeza um
    pseudónimo. A sua verdadeira identidade nunca reuniu consenso entre os
    estudiosos; mais do que um candidato foi proposto ao longo dos séculos,
    nenhum deles provado. O seu prólogo insulta Cervantes pessoalmente,
    incluindo a sua ferida de guerra. Cervantes responde dentro do seu
    próprio [[work:miguel-de-cervantes/don-quixote|Dom Quixote]], Segunda
    Parte, publicada no ano seguinte: a partir de cerca do capítulo 59, Dom
    Quixote fica a saber do livro falso, visita uma tipografia de Barcelona
    onde este está a ser impresso, e encontra uma das suas personagens, Dom
    Álvaro Tarfe, a quem convence a jurar, em auto formal, que o Quixote e o
    Sancho "oficiais" são os verdadeiros e os de Avellaneda são impostores -
    a falsa continuação respondida dentro da verdadeira, como ficção.
