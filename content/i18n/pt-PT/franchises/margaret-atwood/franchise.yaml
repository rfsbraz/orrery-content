# Português europeu (pt-PT) - descrição da coleção e os cinco caminhos
# startHere (título, descrição, nota). workIds, orderId, fit e sources nunca
# se traduzem.
#
# Os títulos das obras citados inline usam o título português publicado
# quando existe uma edição real (editions.yaml): "A História de Uma Serva"
# e "Os Testamentos". Nota deliberada de registo: a palavra escolhida para
# "Handmaid" em toda esta sobreposição é "serva", a palavra da edição pt-PT
# em vigor (Bertrand) - nunca "aia", que é a palavra da tradução BRASILEIRA
# concorrente ("O Conto da Aia", Rocco), já assinalada como armadilha de
# registo no próprio works.yaml/editions.yaml desta coleção.

- id: margaret-atwood
  description: >
    Uma romancista e poeta canadiana cujas distopias especulativas -
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]] (1985)
    e a sua sequela de 2019,
    [[work:margaret-atwood/the-testaments|Os Testamentos]], a trilogia
    MaddAddam - partilham prateleira com romances realistas da vida canadiana
    contemporânea e um corpo de poesia, contos e ensaios que acompanha os
    romances desde 1961, nunca atrás deles.
  startHere:
    paths:
      - id: start-with-gilead
        title: Comece por Gilead
        description: >
          O livro que a tornou uma força cultural, e a sua sequela direta
          quinze anos depois: o relato fragmentado de uma serva sobre como
          Gilead lhe tomou a vida antiga, e depois três narradoras que
          observam, por dentro, as fendas que aí começam a mostrar-se.
        note: >
          Leia-os por essa ordem - Os Testamentos é uma continuação direta,
          não uma obra paralela, por isso nada aqui é estragado por os ler
          pela ordem certa. O custo é que isto mostra apenas um registo dela:
          a distopia política, sem nenhum dos romances realistas nem da
          poesia que acompanha os romances desde 1961.

      - id: the-other-atwood
        title: "Não gosta de distopias? Comece por aqui"
        description: >
          A estreia, o livro que a revelou e o romance histórico que mostram
          o seu lado realista, centrado nas personagens - o registo que a
          maioria dos leitores que a conheceram por Gilead nunca viu: uma
          jovem cujo corpo se rebela contra um noivado arranjado, uma
          pintora confrontada com uma amizade de infância que quase a
          destruiu, e um homicídio real de 1843 reconstruído a partir das
          sessões da própria acusada com o médico enviado para apurar do que
          ela se lembra.
        note: >
          O custo é saltar por completo a sua ficção especulativa - nada de
          Gilead, nada de MaddAddam - para ver a romancista literária por
          baixo das distopias.

      - id: the-maddaddam-arc
        title: A Trilogia MaddAddam
        description: >
          Um apocalipse de aparência mais suave do que o de Gilead, e um
          compromisso maior: três romances que observam o mesmo colapso de
          uma civilização bioengenheirada a partir de sobreviventes
          diferentes.
        note: >
          O custo são três livros antes de a história se resolver. Cada um
          funciona isoladamente; o efeito de observar o colapso a partir de
          três ângulos, não.

      - id: beyond-the-novels
        title: Para além dos romances
        description: >
          A poesia, os ensaios e os contos que acompanham os romances, e não
          ficam atrás deles, desde 1961 - o argumento de Survival que mudou a
          forma como a literatura canadiana é lida e ensinada, a sequência
          Circe/Mud, as séries de conferências em Oxford e em Cambridge, o
          memoir que fecha a prateleira.
        note: >
          Isto não é uma porta de entrada em Atwood - pressupõe que os
          romances já foram lidos e avança para a parte maior e mais
          silenciosa da prateleira.

      - id: everything
        title: Tudo, por ordem
        description: >
          As sessenta e nove obras pela ordem em que as escreveu, romances,
          poesia e ensaios entrelaçados tal como foram realmente aparecendo
          ao longo de seis décadas.
