# Português europeu (pt-PT) - overlay das ordens de leitura: `name`,
# `rationale` e `debated`. orderedWorkIds e sources nunca se traduzem. Os
# títulos citados em prosa corrida (sem hiperligações inline, porque a base
# inglesa também não as usa aqui) seguem a mesma regra do resto da coleção: o
# título português publicado quando existe uma edição real em editions.yaml,
# o inglês nos restantes casos.
#
# A rationale de maddaddam-trilogy para pela ordem de publicação sem nomear a
# identidade dos sobreviventes vislumbrados no final da trilogia; esta
# tradução mantém exatamente o mesmo limite.

- id: margaret-atwood/maddaddam-trilogy
  name: A Trilogia MaddAddam
  rationale: >
    Órix e Crex, O Ano do Dilúvio e MaddAddam contam uma única história - o
    colapso de uma civilização bioengenheirada e o que fica depois dele - a
    partir de pontos de vista diferentes, e são comercializados e lidos como
    uma trilogia única. A ordem de publicação é a ordem certa, e a segura: O
    Ano do Dilúvio decorre em grande parte em paralelo com Órix e Crex, mais
    do que estritamente depois dele, mas também responde a perguntas que o
    primeiro livro deixa deliberadamente em aberto, pelo que lê-lo em
    segundo lugar deixa o final de Órix e Crex fazer o seu trabalho, em vez
    de o antecipar. O custo é comprometermo-nos com três livros antes de o
    colapso se resolver; cada volume funciona isoladamente, mas o efeito de
    observar a mesma catástrofe a partir de três ângulos só se sente
    lendo-os juntos.

- id: margaret-atwood/beyond-the-novels
  name: "Para além dos romances"
  rationale: >
    Um leitor completista que já leu os dezassete romances quer a seguir a
    não-ficção, a poesia e os contos que moldaram a forma como Atwood é lida
    e sobre os quais ela própria continua a construir há seis décadas - não
    as quarenta e três obras de nível alargado na totalidade, várias das
    quais livros ilustrados, opúsculos limitados ou peças de circunstância
    sem reconhecimento comparável por trás. Todas as obras aqui reunidas têm
    um prémio, uma receção crítica marcante, ou atenção académica
    sustentada: dois Trillium Awards (Wilderness Tips, Morning in the
    Burned House), um Governor General's Award para a sua primeira
    coletânea comercial e uma nomeação a finalista do Governor General's
    para The Door, quatro prémios para a sua primeira coletânea de contos,
    Dancing Girls, um Arthur Ellis Award para Colchão de Pedra, séries de
    conferências em Oxford (Strange Things) e em Cambridge (Negotiating
    with the Dead), e poemas e contos - a sequência Circe/Mud em You Are
    Happy, o ciclo-título de Two-Headed Poems, "Gertrude Talks Back" em
    Good Bones - sobre os quais os académicos continuam a escrever décadas
    depois. Ordem cronológica, seguindo a lógica da própria ordem derivada
    por omissão, porque nada aqui precisa de ser reorganizado. O custo é
    comprometermo-nos com coletâneas de poesia e de ensaios depois de
    terminados os romances; isto não é uma porta de entrada em Atwood, é o
    que um leitor que já gosta dela procura a seguir.
  debated:
    - "Esta é uma ordem parcial: dezasseis das quarenta e três obras de
       nível alargado não estão aqui - os sete livros ilustrados infantis
       (No Alto da Árvore, Anna's Pet, Entre Gatos e Pássaros, Princess
       Prunella and the Purple Peanut, Rude Ramsay and the Roaring
       Radishes, Bashful Bob and Doleful Dorinda, Wandering Wenda and Widow
       Wallop's Wunderground Washery), os três volumes de Angel Catbird e
       War Bears, e cinco coletâneas mais curtas sem reconhecimento
       comparável encontrado por trás delas (Procedures for Underground,
       Days of the Rebels, Murder in the Dark, Interlunar, The Tent).
       Nenhuma fica escondida: works.yaml regista as dezasseis e a ordem de
       publicação por omissão continua a passar por cada uma delas, no seu
       lugar."
    - "Angel Catbird, Volume One venceu o Aurora Award de 2017 de Melhor
       Graphic Novel (a própria página de prémios de margaretatwood.ca), o
       que pesa a favor da inclusão. Ainda assim, fica de fora: as críticas
       à trilogia foram, especificamente quanto à escrita, entre moderadas
       e negativas (Chicago Review of Books; a média do Goodreads está em
       2,75/5), e o veredicto de uma delas - que será ensinada 'para
       mostrar a sua amplitude e o seu gosto pela diversão', e não como
       Atwood essencial - é a leitura mais próxima de onde isto se situa.
       Um completista que pese de outra forma a vitória do Aurora pode
       razoavelmente incluí-la."
    - "The Animals in That Country, You Are Happy e Two-Headed Poems
       assentam em atenção académica sustentada e não num prémio, um caso
       mais discutível do que o Governor General's Award de Circle Game ou
       o Trillium de Wilderness Tips. A inclusão de Moral Disorder é, do
       mesmo modo, estrutural e não um prémio próprio: é a coletânea que
       Old Babes in the Wood (2023) continua, e um leitor que queira esse
       fio narrativo de Tig e Nell na íntegra precisa deste livro primeiro."
