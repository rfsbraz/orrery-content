# Português europeu (pt-PT) - acontecimentos específicos da coleção (o que
# aconteceu aos LIVROS; a vida do autor está em content/i18n/pt-PT/authors/).
# Nenhuma das nove entradas tem organisation: epigraph, pelo que nenhuma
# carrega um campo `quote` a traduzir. `note` fica na língua de base.
#
# O nome do prémio (Governor General's Award / Poetry or Drama) mantém-se em
# inglês, como já acontece nas restantes entradas desta coleção: é o nome
# oficial da distinção canadiana e não tem forma portuguesa consagrada.
#
# margaret-atwood-handmaids-tale-hulu-2017 descreve o figurino de protesto
# ("as túnicas vermelhas e as toucas brancas das Servas") exatamente ao
# mesmo nível de detalhe do inglês de base - nem mais, nem menos - porque a
# organisation/illustration_type desta entrada (mosaic/press-media-collage)
# está deliberadamente montada para nunca desenhar esse figurino em cena (ver
# art-rotation.yaml e visual-language desta coleção); a tradução respeita a
# mesma reserva em prosa.

- id: margaret-atwood-circle-game-gg-1966
  title: Uma primeira colectânea de poemas em edição comercial vence o Governor General's Award
  description: >
    [[work:margaret-atwood/the-circle-game|The Circle Game]], ampliado a
    partir de uma edição de arte limitada de 1964 até ao volume comercial que
    a Contact Press publicou em 1966, venceu o Governor General's Award na
    categoria Poetry or Drama, anunciado a 27 de março de 1967; nesse mesmo
    ano a House of Anansi reeditou a colectânea. Atwood tinha 26 anos e ainda
    não publicara ficção. É o seu primeiro grande prémio nacional, e é o peso
    que a sua poesia já tinha em 1969 que explica a aparição tardia de
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]], com o editor
    que perdera aquele manuscrito a voltar a uma escritora cujo nome estava,
    a essa altura, firmado em verso.

- id: margaret-atwood-edible-woman-delayed-1969
  title: Um primeiro romance perde-se durante quatro anos
  description: >
    Atwood já contou a história de ter escrito
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]] em 1965 e de a
    ter enviado a um editor, que perdeu o manuscrito. Quatro anos depois, já
    com um Governor General's Award de poesia no currículo, o mesmo editor
    levou-a a almoçar e prometeu publicar o romance; perguntado se o tinha
    lido, respondeu que não. O livro saiu em 1969, a edição da McClelland and
    Stewart chegando depois de Atwood ter passado os anos entretanto a dar
    aulas e a publicar poesia em vez de ficção, pelo que a sua estreia em
    prosa só chegou às livrarias quando o seu nome já estava firmado em
    verso.

- id: margaret-atwood-handmaids-tale-award-sweep-1986
  title: Uma rápida onda de grandes prémios transforma uma romancista num nome internacional
  description: >
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
    venceu o Governor General's Award de ficção de 1985, foi finalista do
    Booker Prize de 1986 (perdendo para The Old Devils, de Kingsley Amis), e
    venceu, em 1987, o primeiro Arthur C. Clarke Award de ficção científica
    alguma vez atribuído. Chegando depois de dezasseis anos e cinco romances
    anteriores de uma reputação canadiana sólida mas sobretudo doméstica,
    esta sequência de prémios fez dela um nome maior da ficção de língua
    inglesa em cerca de dezoito meses.

- id: margaret-atwood-cats-eye-booker-1989
  title: Uma segunda finalista do Booker, e uma segunda vaga de finalista do Governor General's
  description: >
    [[work:margaret-atwood/cats-eye|Olho de Gato]] foi finalista do Governor
    General's Award de ficção de 1988 e finalista do Booker Prize de 1989, a
    sua segunda vez na lista do Booker depois de
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]. Não
    venceu nenhum dos dois; o padrão de reconhecimento nos grandes prémios
    sem os maiores triunfos manter-se-ia por mais uma década, incluindo a
    própria finalista do Booker de 1996 de
    [[work:margaret-atwood/alias-grace|Chamavam-lhe Grace]], até
    [[work:margaret-atwood/the-blind-assassin|O Assassino Cego]] finalmente
    vencer o Booker em 2000.

- id: margaret-atwood-alias-grace-giller-1996
  title: Vence o Giller Prize, e uma terceira finalista do Booker fica sem prémio
  description: >
    [[work:margaret-atwood/alias-grace|Chamavam-lhe Grace]] venceu o
    Scotiabank Giller Prize em 1996, o mais rico prémio de ficção do próprio
    país, no mesmo ano em que foi finalista, sem vencer, do Booker Prize. Foi
    a sua terceira vez na lista do Booker sem vitória, depois de
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
    (1986) e [[work:margaret-atwood/cats-eye|Olho de Gato]] (1989):
    reconhecida em toda a parte, ainda sem prémio internacional, quatro anos
    antes de [[work:margaret-atwood/the-blind-assassin|O Assassino Cego]]
    quebrar o padrão.

- id: margaret-atwood-oryx-and-crake-booker-2003
  title: Um romance inaugural pós-apocalíptico chega à lista do Booker
  description: >
    [[work:margaret-atwood/oryx-and-crake|Órix e Crex]], o primeiro volume do
    que se tornaria a Trilogia MaddAddam, foi finalista do Booker Prize, do
    Giller Prize e do Governor General's Award de ficção, todos de 2003, sem
    vencer nenhum dos três. Marcou o momento em que a ficção especulativa de
    catástrofe ecológica, um género que os júris literários costumam manter
    à distância, foi levada a sério pelos três em simultâneo, logo na
    primeira saída de um projeto que só terminaria uma década depois.

- id: margaret-atwood-handmaids-tale-hulu-2017
  title: A adaptação da Hulu, e a segunda vida de um romance como protesto de rua
  description: >
    A adaptação televisiva da Hulu de
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
    estreou a 26 de abril de 2017 e venceu oito Emmy Awards em setembro
    seguinte, incluindo o de Melhor Série Dramática, o primeiro alguma vez
    ganho por um serviço de streaming. As vendas do romance de 1985 já
    tinham disparado depois das eleições americanas de novembro de 2016;
    poucas semanas após a estreia da série, manifestantes no Texas, depois
    no Ohio, no Missouri e mais além, começaram a aparecer junto aos
    parlamentos estaduais vestidos com as túnicas vermelhas e as toucas
    brancas das Servas do romance para se oporem a restrições ao aborto,
    uma imagem do próprio livro adotada como uniforme de protesto real três
    décadas depois da publicação.

- id: margaret-atwood-testaments-booker-2019
  title: Um segundo Booker Prize, repartido contra as regras, na semana em que o companheiro é sepultado
  description: >
    [[work:margaret-atwood/the-testaments|Os Testamentos]] venceu o Booker
    Prize de 2019 em conjunto com Girl, Woman, Other, de Bernardine Evaristo,
    anunciado a 14 de outubro na Guildhall de Londres. Os cinco jurados
    desafiaram a instrução explícita do presidente da Booker Foundation para
    nomear um único vencedor, quebrando uma regra contra prémios partilhados
    adotada em 1993 depois do último prémio repartido; aos 79 anos, Atwood
    tornou-se a vencedora mais velha de sempre do Booker, trinta e três anos
    depois de [[work:margaret-atwood/the-handmaids-tale|A História de Uma
    Serva]] ter chegado pela primeira vez à lista, e dezanove anos depois da
    sua única vitória, com
    [[work:margaret-atwood/the-blind-assassin|O Assassino Cego]]. O anúncio
    chegou quatro semanas depois da morte de Graeme Gibson em Londres,
    durante a digressão de promoção do mesmo livro.

- id: margaret-atwood-handmaids-tale-unburnable-book-2022
  title: Uma edição incombustível, em resposta a uma vaga de proibições de livros
  description: >
    Anunciado na gala anual da PEN America a 23 de maio de 2022 e leiloado na
    Sotheby's até 7 de junho, "The Unburnable Book" era um exemplar único de
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
    impresso em folhas de fio de níquel, aço inoxidável e alumínio com tintas
    resistentes ao fogo, construído pelo estúdio The Gas Company e pela
    agência criativa Rethink. Um vídeo de lançamento mostrava Atwood a
    tentar, sem êxito, queimá-lo. Vendeu-se por 130 000 dólares, com as
    receitas a reverterem para a PEN America, numa altura em que o romance
    era repetidamente visado para remoção de bibliotecas e currículos
    escolares nos Estados Unidos.
