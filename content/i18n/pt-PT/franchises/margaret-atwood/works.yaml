# Português europeu (pt-PT) - sinopses. Os títulos NÃO se traduzem (title é
# sempre o original inglês, nunca sobreposto - ver SCHEMA.md; um título
# traduzido só existe se houver uma edição pt-PT real, e essa vive em
# editions.yaml, nunca aqui). As notas de curadoria (`note:`) ficam na
# língua de base - são anotações editoriais que nunca chegam ao leitor (Work
# não tem campo note em lib/content/types.ts), a mesma regra já aplicada
# noutras coleções desta plataforma.
#
# QUATRO SINOPSES PARAM DELIBERADAMENTE NO LIMITE DA CONTRACAPA DO EDITOR,
# NÃO SÃO RESUMOS POR COMPLETAR. A tradução respeita exatamente o mesmo
# limite do inglês, sem repor o que ali ficou de fora - as edições
# portuguesas da Bertrand para estes quatro títulos são, em geral, mais
# extensas do que a lapela inglesa, e nenhuma delas foi usada para completar
# o que se segue:
#   - oryx-and-crake: não se nomeia quem provocou o colapso do mundo.
#   - the-year-of-the-flood: usa-se "a tão temida inundação sem água" (a
#     própria contracapa), nunca uma explicação de como ela aconteceu.
#   - alias-grace: mantém-se em aberto se Grace se lembra ou não do crime,
#     tal como o romance e a contracapa do editor; "diz não se lembrar" fica,
#     nunca "afirma ser inocente" nem "esconde o que fez".
#   - the-blind-assassin: a atribuição do romance interior a Laura é a que a
#     contracapa usa; nada sobre quem o escreveu de facto.
#
# O verso citado em power-politics ("you fit into me / like a hook into an
# eye") é traduzido diretamente como qualquer outra prosa: não foi possível,
# dentro do âmbito desta fase, confirmar a redação exacta da tradução
# publicada de Ana Luísa Amaral (Relógio D'Água, 2022) para este verso de
# abertura especificamente citado.

- id: margaret-atwood/double-persephone
  synopsis: >
    O primeiro livro publicado de Atwood: um opúsculo de sete poemas,
    composto e impresso à mão pela Hawkshead Press, que venceu a Medalha
    E. J. Pratt.

- id: margaret-atwood/the-circle-game
  synopsis: >
    A sua primeira coletânea comercial completa, expandida de um opúsculo de
    1964 para o volume de 1966 que venceu o Governor General's Award: poemas
    sobre relações e autoperceção estruturados em torno de círculos e jogos
    fechados que se repetem.

- id: margaret-atwood/the-trumpets-of-summer
  synopsis: >
    Um libreto de suite coral para coro misto, quatro solistas, um recitante
    e seis instrumentos, encomendado pela CBC para o quarto centenário de
    Shakespeare em 1964 e publicado como opúsculo de 16 páginas em formato
    oitavo; a música é de John Beckwith. Foi executado uma única vez, perante
    uma plateia de 36 pessoas.

- id: margaret-atwood/expeditions
  synopsis: >
    Um opúsculo de poesia de pequena editora de meados da década de 1960,
    anterior às suas primeiras coletâneas comerciais.

- id: margaret-atwood/speeches-for-doctor-frankenstein
  synopsis: >
    Um opúsculo de poesia de pequena editora, um dos três volumes da
    Cranbrook Academy of Art que publicou antes e depois de The Circle Game.

- id: margaret-atwood/the-animals-in-that-country
  synopsis: >
    Poemas que confrontam o modo como os animais são vistos, caçados e
    mitificados com o modo como realmente vivem, no Canadá e fora dele.

- id: margaret-atwood/the-edible-woman
  synopsis: >
    Marian McAlpin fica noiva de um jovem convencional e vê o próprio corpo
    rebelar-se, alimento a alimento, contra a vida que lhe estão a preparar.

- id: margaret-atwood/the-journals-of-susanna-moodie
  synopsis: >
    Uma sequência de poemas na voz da verdadeira colona e escritora
    oitocentista Susanna Moodie, reimaginando a sua chegada à natureza
    selvagem canadiana e a forma como esta a assombra.

- id: margaret-atwood/procedures-for-underground
  synopsis: >
    Poemas construídos a partir do ritual, do mito e da transformação,
    usando a imagem de um subterrâneo ou de um outro mundo para examinar o
    que se esconde por baixo das relações comuns e do poder.

- id: margaret-atwood/power-politics
  synopsis: >
    Poemas curtos e aforísticos que leem uma relação amorosa como um
    confronto de poder, abrindo com os célebres versos "encaixas em mim /
    como um anzol num olho."

- id: margaret-atwood/surfacing
  synopsis: >
    Uma mulher sem nome regressa à natureza selvagem do Quebeque onde
    cresceu para procurar o pai desaparecido, e a procura afasta-a das
    pessoas que levou consigo e da própria noção de si mesma.

- id: margaret-atwood/survival
  synopsis: >
    Um estudo crítico que defende a sobrevivência contra uma terra hostil e
    uma história colonial como o tema que atravessa a literatura canadiana
    de língua inglesa; controverso e enormemente influente na forma como
    essa literatura passou a ser lida e ensinada.

- id: margaret-atwood/you-are-happy
  synopsis: >
    Poemas que incluem a sequência Circe/Mud, recontando o encontro de Circe
    com Ulisses do seu próprio ponto de vista, ao lado de "Song of the
    Worms."

- id: margaret-atwood/lady-oracle
  synopsis: >
    Joan Foster, autora best-seller de romances de banca a esconder do
    marido uma vida muito diferente, finge a própria morte e foge para
    Itália, olhando para trás, para as fugas que a trouxeram até ali.

- id: margaret-atwood/dancing-girls
  synopsis: >
    A sua primeira coletânea de contos: histórias contemporâneas, muitas
    vezes perturbadoras, de mulheres a navegar relações, imigração e o fosso
    entre a vida que delas se espera e a que realmente vivem.

- id: margaret-atwood/days-of-the-rebels
  synopsis: >
    Um volume da coleção ilustrada "Canada's Illustrated Heritage", sobre a
    história social do quotidiano nas Canadas entre 1815 e 1840 - emigração,
    crime e comércio, entre os cantos menos contados da época.

- id: margaret-atwood/two-headed-poems
  synopsis: >
    Poemas construídos em torno de um ciclo central que imagina gémeos
    siameses como figura da própria dualidade do Canadá (inglês e francês,
    o desejo de se separar e a incapacidade de o fazer), ao lado de poemas
    sobre a condição feminina, a escrita e a história.

- id: margaret-atwood/up-in-the-tree
  synopsis: >
    Um livro ilustrado, escrito e ilustrado pela própria Atwood, sobre duas
    crianças que vivem numa árvore e ficam presas quando castores lhes comem
    a escada.

- id: margaret-atwood/life-before-man
  synopsis: >
    Nate, Elizabeth e Lesje - marido, mulher e amante do marido - narram o
    lento desfazer-se de um casamento em Toronto, visto de dentro do
    departamento de paleontologia do Royal Ontario Museum, onde Lesje
    trabalha.

- id: margaret-atwood/annas-pet
  synopsis: >
    Um livro ilustrado sobre a relação em mudança de uma criança com um
    sapo de estimação encontrado perto de um lago.

- id: margaret-atwood/bodily-harm
  synopsis: >
    A jornalista de Toronto Rennie Wilford, a recuperar de um cancro da mama
    e abalada por um assalto à sua casa, viaja até à ilha caribenha fictícia
    de St. Antoine para uma reportagem e acaba envolvida numa revolução que
    só devia observar.

- id: margaret-atwood/true-stories
  synopsis: >
    Poemas que confrontam a violência política e a tortura no estrangeiro
    lado a lado com peças mais íntimas e domésticas, recusando qualquer
    fronteira nítida entre as duas.

- id: margaret-atwood/second-words
  synopsis: >
    Críticas, ensaios e prosa crítica das primeiras duas décadas da sua
    carreira, sobre a escrita canadiana, o feminismo e o amadurecimento do
    seu próprio ofício.

- id: margaret-atwood/murder-in-the-dark
  synopsis: >
    Textos em prosa muito curtos, vários apresentados como jogos, adivinhas
    ou exercícios de salão, algures entre o conto e o poema em prosa.

- id: margaret-atwood/bluebeards-egg
  synopsis: >
    Contos sobretudo sobre casamentos e sobre filhos adultos e os seus pais,
    ancorados em "Significant Moments in the Life of My Mother."

- id: margaret-atwood/snake-poems
  synopsis: >
    Um opúsculo de poesia de edição limitada.

- id: margaret-atwood/interlunar
  synopsis: >
    Poemas sobre a morte e a transformação, cujo título vem do intervalo
    escuro entre uma lua e a seguinte.

- id: margaret-atwood/the-handmaids-tale
  synopsis: >
    Na república teocrática de Gilead, uma serva conhecida como Offred é
    mantida apenas para gerar filhos para a classe dominante, e conta, em
    fragmentos, como a sua vida antiga terminou e o que resta dela na nova.

- id: margaret-atwood/through-the-one-way-mirror
  synopsis: >
    Um único ensaio sobre a atenção desigual entre o Canadá e os Estados
    Unidos: os canadianos observam de perto os EUA, enquanto os americanos
    mal reparam no Canadá.

- id: margaret-atwood/cats-eye
  synopsis: >
    A pintora Elaine Risley regressa a Toronto para uma retrospetiva da sua
    obra, e a visita traz à tona uma amizade de infância que a moldou e
    quase a destruiu.

- id: margaret-atwood/for-the-birds
  synopsis: >
    Um livro infantil em que uma menina chamada Samantha se transforma numa
    ave e vê, por dentro, o que a poluição e a perda de habitat estão a
    fazer às aves à sua volta.

- id: margaret-atwood/wilderness-tips
  synopsis: >
    Contos que se movem entre a natureza selvagem canadiana e a cidade,
    incluindo "Hairball," "True Trash" e "The Age of Lead."

- id: margaret-atwood/good-bones
  synopsis: >
    Monólogos muito curtos, muitas vezes satíricos, incluindo reescritas
    feministas de contos de fadas e mitos do ponto de vista das suas
    vítimas habituais, como "Gertrude Talks Back" e "The Little Red Hen
    Tells All."

- id: margaret-atwood/the-robber-bride
  synopsis: >
    Três mulheres, Tony, Charis e Roz, reúnem-se no funeral da amiga que
    traiu cada uma delas por sua vez, Zenia, e descobrem que Zenia ainda não
    acabou com nenhuma delas.

- id: margaret-atwood/morning-in-the-burned-house
  synopsis: >
    Poemas que incluem elegias ao pai, morto pouco antes de os escrever,
    assinalando uma viragem para a mortalidade e a memória familiar.

- id: margaret-atwood/strange-things
  synopsis: >
    Baseado nas suas Clarendon Lectures em Oxford: um estudo sobre a figura
    recorrente de um Norte hostil e devorador na escrita canadiana.

- id: margaret-atwood/princess-prunella-and-the-purple-peanut
  synopsis: >
    Um livro ilustrado aliterativo sobre uma princesa e um amendoim.

- id: margaret-atwood/alias-grace
  synopsis: >
    Um relato ficcionado de Grace Marks, uma verdadeira criada doméstica
    canadiana condenada em 1843 pela sua participação nos homicídios do
    patrão e da governanta deste, reconstruído através das sessões com um
    médico contratado por reformistas que procuravam o seu perdão, a quem
    ela diz não se lembrar de nada dos homicídios.

- id: margaret-atwood/the-labrador-fiasco
  synopsis: >
    Um único conto, publicado como pequeno livro ilustrado próprio na
    coleção "Birthday Quid" da Bloomsbury: uma história dentro de outra
    história, que entrelaça a perda de memória de um pai com a malograda
    expedição Hubbard-Wallace ao Labrador em 1903.

- id: margaret-atwood/the-blind-assassin
  synopsis: >
    Já idosa, Iris Chase recorda a morte da irmã Laura, décadas antes, e o
    colapso da rica família à sua volta, entrelaçado com capítulos do
    romance escandaloso que tornou Laura famosa depois de morta, no qual
    dois amantes clandestinos tecem a história de um assassino cego num
    planeta distante.

- id: margaret-atwood/negotiating-with-the-dead
  synopsis: >
    Baseado nas Empson Lectures de 2000 em Cambridge: reflexões sobre porque
    escrevem as pessoas, quem um escritor imagina como leitor, e o que um
    escritor deve aos mortos sobre quem escreve.

- id: margaret-atwood/oryx-and-crake
  synopsis: >
    Snowman, que talvez seja o último ser humano depois de uma peste, cuida
    dos Crakers de olhos verdes, uma espécie mansa e bioengenheirada, e
    reconstitui na memória o mundo que os produziu: o seu melhor amigo
    Crake, a mulher que ambos amavam, Oryx, e os complexos empresariais onde
    os três cresceram.

- id: margaret-atwood/rude-ramsay-and-the-roaring-radishes
  synopsis: >
    Um rapaz ruivo que vive numa casa em ruínas foge para um jardim de
    rabanetes invulgarmente ruidosos.

- id: margaret-atwood/bashful-bob-and-doleful-dorinda
  synopsis: >
    Um rapaz criado por cães e uma rapariga criada por parentes distantes
    encontram-se numa aventura que envolve um búfalo.

- id: margaret-atwood/the-penelopiad
  synopsis: >
    Do Hades, Penélope narra a sua própria versão da Odisseia: o casamento
    com Ulisses, a longa espera durante a sua ausência, e a morte das doze
    criadas enforcadas no regresso dele, que Homero nunca a deixou explicar.

- id: margaret-atwood/writing-with-intent
  synopsis: >
    Uma segunda coletânea abrangente de ensaios, críticas e prosa de
    circunstância, que retoma onde Second Words tinha ficado.

- id: margaret-atwood/the-tent
  synopsis: >
    Textos muito curtos e de géneros indefinidos, de um parágrafo a algumas
    páginas, entre a paródia, o monólogo e a falsa epopeia, ilustrados do
    princípio ao fim com desenhos de traço da própria Atwood.

- id: margaret-atwood/moral-disorder
  synopsis: >
    Contos ligados entre si que seguem uma mulher, Nell, da infância à
    meia-idade, lidos em conjunto como uma única vida de cronologia
    quebrada, e não como peças separadas.

- id: margaret-atwood/the-door
  synopsis: >
    Poemas reflexivos da fase tardia da carreira sobre o envelhecimento, a
    memória e a mortalidade, a sua primeira coletânea nova desde Morning in
    the Burned House, doze anos antes.

- id: margaret-atwood/payback
  synopsis: >
    Baseado nas suas CBC Massey Lectures: um estudo que segue a ideia da
    dívida através da religião, da literatura, da ecologia e da economia.

- id: margaret-atwood/the-year-of-the-flood
  synopsis: >
    A tão temida inundação sem água esvaziou de quase toda a vida humana o
    mundo de Órix e Crex. Toby e Ren, duas mulheres da seita eco-religiosa
    God's Gardeners, sobrevivem-lhe a partir de cantos opostos da cidade em
    ruínas, cada uma reconstituindo como ali chegou.

- id: margaret-atwood/in-other-worlds
  synopsis: >
    Ensaios sobre uma vida inteira a ler e a escrever ficção científica e
    ficção especulativa, e sobre onde traça a fronteira entre as duas.

- id: margaret-atwood/wandering-wenda-and-widow-wallops-wunderground-washery
  synopsis: >
    Um livro ilustrado aliterativo que mais tarde inspirou uma série de
    animação infantil de 2017, Wandering Wenda.

- id: margaret-atwood/maddaddam
  synopsis: >
    Os sobreviventes humanos dispersos da peste, os Crakers e um punhado de
    antigos operacionais das empresas convergem, e têm de decidir que tipo
    de mundo, se algum, se pode construir com o que resta.

- id: margaret-atwood/the-happy-zombie-sunrise-home
  synopsis: >
    Uma história de zombies em folhetim, escrita linha a linha com Naomi
    Alderman para o Wattpad, alternando entre as duas autoras.

- id: margaret-atwood/stone-mattress
  synopsis: >
    Nove contos, vários deles ligados entre si, que vão do alter ego pulp
    de uma envelhecida romancista de fantasia a uma mulher que acerta
    contas antigas num cruzeiro literário no Árctico.

- id: margaret-atwood/the-heart-goes-last
  synopsis: >
    Stan e Charmaine, sem dinheiro e a viver no carro, inscrevem-se no
    Positron Project, uma comunidade fechada que troca segurança por meses
    alternados na prisão, e descobrem que o acordo lhes exige mais do que
    esperavam.

- id: margaret-atwood/hag-seed
  synopsis: >
    O desacreditado encenador de teatro Felix Phillips, escondido anos
    depois de uma traição lhe custar o festival e a sua montagem de A
    Tempestade, reaparece para ensinar Shakespeare dentro de uma prisão, e
    escala os reclusos para uma produção construída para acertar contas
    antigas.

- id: margaret-atwood/angel-catbird-vol-1
  synopsis: >
    Um jovem engenheiro genético, acidentalmente fundido com ADN de gato e
    de coruja num acidente de laboratório, descobre uma população oculta de
    criaturas meio animais, meio humanas, a viver ao lado das pessoas
    comuns.

- id: margaret-atwood/angel-catbird-vol-2
  synopsis: >
    Angel Catbird e os seus aliados viajam até ao Castelo Catula para
    enfrentar uma ameaça de gatos vampiros.

- id: margaret-atwood/angel-catbird-vol-3
  synopsis: >
    O volume final da trilogia, que resolve o conflito entre as criaturas
    meio animais e as forças que as perseguem.

- id: margaret-atwood/war-bears
  synopsis: >
    O criador de banda desenhada de Toronto Al Zurakowski inventa a
    Oursonette, uma super-heroína que combate nazis, no auge da Segunda
    Guerra Mundial, e a ascensão pós-guerra da banda desenhada americana
    acaba lentamente com o sonho para que a criou - um olhar ficcionado
    sobre a própria indústria canadiana de banda desenhada de guerra.

- id: margaret-atwood/the-testaments
  synopsis: >
    Quinze anos depois da história de Offred, três narradoras, incluindo a
    temível Tia Lydia, dão os seus próprios relatos de Gilead por dentro, e
    das fendas que nele começam a mostrar-se.

- id: margaret-atwood/dearly
  synopsis: >
    A sua primeira coletânea de poesia em treze anos, dedicada "for Graeme
    in absentia": poemas sobre o envelhecimento, a perda e o luto, escritos
    sobretudo depois da morte do companheiro, Graeme Gibson, em 2019.

- id: margaret-atwood/burning-questions
  synopsis: >
    Uma terceira coletânea abrangente de ensaios e prosa de circunstância,
    sobre política, alterações climáticas, envelhecimento e o ofício de
    escrever, cobrindo os anos entre O Ano do Dilúvio e a pandemia de
    COVID-19.

- id: margaret-atwood/old-babes-in-the-wood
  synopsis: >
    Quinze contos em três partes: mais histórias de Tig e Nell que
    continuam Moral Disorder em ambas as pontas, e uma secção central de
    contos batizada por "My Evil Mother," sobre o envelhecimento, o luto e
    as perdas que vêm com uma vida longa.

- id: margaret-atwood/fourteen-days
  synopsis: >
    Um projeto da Authors Guild concebido por Douglas Preston: os moradores
    de um prédio de habitação no Lower East Side de Manhattan reúnem-se
    todas as noites no terraço durante os primeiros catorze dias do
    confinamento de COVID-19 de março de 2020, contando histórias sob
    alcunhas dadas pelo zelador do prédio, numa narrativa-moldura inspirada
    em O Decamerão e Os Contos de Cantuária.

- id: margaret-atwood/paper-boat
  synopsis: >
    Um volume abrangente que mistura poemas novos com uma seleção de todas
    as coletâneas anteriores, desde Double Persephone (1961) em diante.

- id: margaret-atwood/book-of-lives
  synopsis: >
    O seu primeiro memoir: uma vida contada desde uma infância nos bosques
    do Quebeque, ao longo das décadas, os casamentos e a parceria com
    Graeme Gibson que deu origem aos livros.
