# Português europeu (pt-PT) - períodos criativos. Traduzem-se o título do
# período, os temas (etiquetas de exibição) e a descrição. `note` fica na
# língua de base. As citações de David Staines (The Cambridge Companion to
# Margaret Atwood) não têm tradução portuguesa publicada localizável e são
# traduzidas aqui como qualquer outra prosa, tal como no texto de base
# inglês.

- id: mapping-her-canada
  title: A Cartografia do Seu Canadá
  themes: [identidade canadiana, mito e arquétipo, a natureza selvagem, sobrevivência e a vítima, a poesia como primeira forma]
  description: >
    O nome que David Staines dá à fase em que Atwood escreve para
    canadianos sobre o Canadá, e que, nas suas palavras, "culmina com a
    publicação, em 1972, de [[work:margaret-atwood/survival|Survival]]" - o
    guia que tornou a literatura canadiana legível para o leitor canadiano
    comum, vendeu mais de 100 000 exemplares e nunca foi publicado fora do
    país. A década anterior é sobretudo de poesia, do opúsculo composto à
    mão [[work:margaret-atwood/double-persephone|Double Persephone]] (1961)
    até [[work:margaret-atwood/the-journals-of-susanna-moodie|The Journals
    of Susanna Moodie]] (1970), com um primeiro romance,
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]] (1969), e
    [[work:margaret-atwood/surfacing|Ressurgir]] (1972), contrapostos a essa
    década.

- id: interpreting-canada-abroad
  title: Interpretar o Canadá no Estrangeiro
  themes: [o Canadá lido de fora, o poder e a sua política, mulheres sob pressão, o político e o doméstico, a distopia]
  description: >
    "Na segunda fase da sua carreira, que decorreu do início dos anos
    setenta até 1985, Atwood passou a fazer críticas de âmbito mais
    alargado", escreve Staines: a crítica que na primeira fase só lia
    livros canadianos passa a "apresentar canadianos a americanos e
    americanos a canadianos", interpretando o seu país para leitores de
    fora dele. A ficção segue o mesmo caminho, da Toronto de
    [[work:margaret-atwood/lady-oracle|Senhora do Oráculo]] (1976) e
    [[work:margaret-atwood/life-before-man|Life Before Man]] (1979) até à
    ilha caribenha de
    [[work:margaret-atwood/bodily-harm|A Morte Beijou-a ao de Leve]] (1981),
    o seu primeiro romance fora do Canadá, e depois até à república
    americana de Gilead em
    [[work:margaret-atwood/the-handmaids-tale|A História de Uma Serva]]
    (1985), que fecha a fase.

- id: canada-in-the-world
  title: O Canadá no Mundo
  themes: [Toronto e o passado canadiano, a reconstrução histórica, a catástrofe ecológica, a escritora como voz pública, a obra tardia]
  description: >
    "Na terceira fase da sua carreira, que vai de meados dos anos oitenta
    até ao presente, Atwood volta a centrar a ficção na Toronto
    contemporânea", escreve Staines, e depois no passado canadiano:
    [[work:margaret-atwood/cats-eye|Olho de Gato]] (1988),
    [[work:margaret-atwood/the-robber-bride|A Impostora]] (1993),
    [[work:margaret-atwood/alias-grace|Chamavam-lhe Grace]] (1996) e
    [[work:margaret-atwood/the-blind-assassin|O Assassino Cego]] (2000). É
    também a fase em que fala do Canadá a partir de fora dele, nas
    conferências de Oxford que deram origem a
    [[work:margaret-atwood/strange-things|Strange Things]] (1995) e nas de
    Cambridge que deram origem a
    [[work:margaret-atwood/negotiating-with-the-dead|Negotiating with the
    Dead]] (2002). A segunda edição do Companion prolonga a fase até
    [[work:margaret-atwood/oryx-and-crake|Órix e Crex]] (2003) e ao resto da
    Trilogia MaddAddam,
    [[work:margaret-atwood/stone-mattress|Colchão de Pedra]] (2014),
    [[work:margaret-atwood/hag-seed|Semente de Bruxa]] (2016) e
    [[work:margaret-atwood/the-testaments|Os Testamentos]] (2019).
