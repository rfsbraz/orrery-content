# Português europeu (pt-PT) - sobreposição de prosa curada (apenas synopsis).
# Traduz-se apenas prosa. Nunca ids, slugs, títulos de obra (já são
# portugueses) nem URLs de fontes.

- id: sophia-de-mello-breyner-andresen/poesia
  synopsis: >
    O seu primeiro livro, publicado pela chancela Cadernos de Poesia quando
    tinha pouco mais de vinte anos: o jardim e a casa da infância, o mar, e
    uma exigência de clareza moral e formal a que o resto da sua obra de
    sessenta anos não deixa de regressar.

- id: sophia-de-mello-breyner-andresen/o-dia-do-mar
  synopsis: >
    A sua segunda coletânea, aprofundando o mar como figura central do
    livro - já nesta fase inicial, o tema que todas as fontes posteriores
    apontam como o mais recorrente em toda a sua obra.

- id: sophia-de-mello-breyner-andresen/coral
  synopsis: >
    A sua terceira coletânea, publicada no Porto e não em Lisboa; mais
    tarde apontou um quadro de Picasso, "Mulheres à Beira-Mar", entre as
    influências reconhecidas deste livro, a par da poesia de Lorca.

- id: sophia-de-mello-breyner-andresen/no-tempo-dividido
  synopsis: >
    Introduz o "tempo dividido" a que o seu posterior "tempo absoluto" se
    opõe ao longo de toda a obra - o tempo dividido como o tempo da
    solidão, do medo e da mentira, ligado à cidade como espaço negativo e
    de exílio.

- id: sophia-de-mello-breyner-andresen/poemas-de-um-livro-destruido
  synopsis: >
    Uma sequência de nove poemas, escritos entre o início e meados da
    década de 1950, entre Coral e No Tempo Dividido, impressos primeiro
    como sequência autónoma antes de serem incorporados numa edição
    posterior do livro anterior.

- id: sophia-de-mello-breyner-andresen/mar-novo
  synopsis: >
    A sua quinta coletânea, cujo poema-título, "Este é o Tempo", figura
    entre os exemplos que as próprias fontes dão dos seus poemas de tempo
    absoluto - o mesmo ano em que publicou os seus primeiros livros
    infantis.

- id: sophia-de-mello-breyner-andresen/o-cristo-cigano
  synopsis: >
    Um único poema narrativo longo, inspirado numa lenda andaluza que o
    poeta brasileiro João Cabral de Melo Neto lhe contou em Sevilha,
    escrito num registo barroco que a própria autora distinguia do resto
    da sua obra poética.

- id: sophia-de-mello-breyner-andresen/livro-sexto
  synopsis: >
    A sua sexta coletânea e, na altura, a mais premiada: o Grande Prémio de
    Poesia da Sociedade Portuguesa de Escritores em 1964, o primeiro grande
    prémio literário da sua carreira.

- id: sophia-de-mello-breyner-andresen/geografia
  synopsis: >
    Inclui "Casa", um dos exemplos recorrentes que as próprias fontes dão
    do tema da casa como memória, presente na sua obra desde os primeiros
    poemas.

- id: sophia-de-mello-breyner-andresen/dual
  synopsis: >
    Reúne alguns dos seus poemas mais nítidos sobre a antiguidade clássica
    ("Os Gregos") e uma homenagem direta ao heterónimo de Fernando Pessoa,
    Ricardo Reis.

- id: sophia-de-mello-breyner-andresen/o-nome-das-coisas
  synopsis: >
    Venceu o Prémio Teixeira de Pascoaes de 1977; reúne alguns dos seus
    poemas helénicos mais conhecidos, incluindo "O Rei de Ítaca" e
    "Cíclades (evocando Fernando Pessoa)".

- id: sophia-de-mello-breyner-andresen/navegacoes
  synopsis: >
    Uma coletânea construída em torno da figura da viagem marítima,
    publicada pela primeira vez com traduções em inglês e francês em
    página oposta ao texto português e uma gravação dos poemas na própria
    voz da autora.

- id: sophia-de-mello-breyner-andresen/ilhas
  synopsis: >
    Venceu o Prémio D. Dinis da Fundação da Casa de Mateus e, no ano
    seguinte, o Grande Prémio de Poesia conjunto Inasset/Inapa-Pen Clube.
    Reúne "Fúrias", um dos seus poemas tardios mais nítidos sobre a cidade
    como espaço negativo.

- id: sophia-de-mello-breyner-andresen/musa
  synopsis: >
    A sua décima terceira coletânea, publicada quando tinha pouco mais de
    setenta anos, cinco anos antes do Prémio Camões.

- id: sophia-de-mello-breyner-andresen/o-buzio-de-cos
  synopsis: >
    A sua décima quarta e última coletânea de poesia inédita, vencedora do
    Prémio da Fundação Luís Miguel Nava no ano seguinte, encerrando uma
    sequência ininterrupta desde 1944.

- id: sophia-de-mello-breyner-andresen/antologia
  synopsis: >
    Uma antologia da sua própria seleção, reunindo as suas primeiras seis
    coletâneas de poesia, mais tarde reeditada com prefácio do crítico
    Eduardo Lourenço.

- id: sophia-de-mello-breyner-andresen/grades
  synopsis: >
    Uma antologia dos seus próprios poemas de resistência à ditadura do
    Estado Novo, reunidos sob um único título no ano anterior à sua
    candidatura pela oposição.

- id: sophia-de-mello-breyner-andresen/11-poemas
  synopsis: >
    Um pequeno opúsculo de 28 páginas, publicado entre Geografia e Dual.

- id: sophia-de-mello-breyner-andresen/poemas-escolhidos-1981
  synopsis: >
    Um volume de poemas escolhidos publicado pelo clube de leitura Círculo
    de Leitores, entre O Nome das Coisas e Navegações.

- id: sophia-de-mello-breyner-andresen/signo
  synopsis: >
    Uma seleção de poesia publicada em conjunto com a Casa Fernando
    Pessoa, acompanhada de um CD com os poemas lidos pelo ator Luís Miguel
    Cintra.

- id: sophia-de-mello-breyner-andresen/primeiro-livro-de-poesia
  synopsis: >
    Uma seleção dos seus poemas organizada para leitores mais novos,
    ilustrada por Júlio Resende.

- id: sophia-de-mello-breyner-andresen/mar-antologia
  synopsis: >
    Uma seleção dos seus poemas em torno do tema do mar, organizada pela
    sua filha Maria Andresen de Sousa Tavares e não pela própria Sophia.

- id: sophia-de-mello-breyner-andresen/orpheu-e-eurydice
  synopsis: >
    Dezoito poemas sobre o mito de Orfeu e Eurídice emparelhados com
    dezoito pinturas de Graça Morais, numa edição limitada de grande
    formato nascida de as duas artistas mostrarem uma à outra o seu
    trabalho.

- id: sophia-de-mello-breyner-andresen/o-sol-o-muro-o-mar
  synopsis: >
    Um portefólio de edição limitada que emparelha seis dos seus poemas
    com seis fotografias de Eduardo Gageiro.

- id: sophia-de-mello-breyner-andresen/ilhas-poemas-escolhidos
  synopsis: >
    Um volume bilingue português/inglês de poemas escolhidos, construído
    em torno de fotografias de Daniel Blaufuks, produzido para a Expo '98
    e incluindo pelo menos um poema nunca antes impresso.

- id: sophia-de-mello-breyner-andresen/cem-poemas-de-sophia
  synopsis: >
    Uma seleção de cem poemas publicada no ano da sua morte, escolhida e
    apresentada pelo jornalista José Carlos de Vasconcelos e não pela
    própria Sophia.

- id: sophia-de-mello-breyner-andresen/poemas-sobre-pessoa
  synopsis: >
    Uma seleção dos seus poemas em diálogo com Fernando Pessoa, organizada
    oito anos após a sua morte pela sua filha Maria Andresen de Sousa
    Tavares.

- id: sophia-de-mello-breyner-andresen/contos-exemplares
  synopsis: >
    Sete contos - entre eles "O Jantar do Bispo", "Os Três Reis do
    Oriente" e "Homero" - que encenam situações exemplares da vida humana
    para lá do bem e do mal, de Deus e do Diabo; o título é uma homenagem
    assumida às Novelas Ejemplares de Cervantes.

- id: sophia-de-mello-breyner-andresen/os-tres-reis-do-oriente
  synopsis: >
    Um único conto de Contos Exemplares, publicado inicialmente de forma
    autónoma como opúsculo ilustrado antes de ser reincorporado na
    coletânea original.

- id: sophia-de-mello-breyner-andresen/historias-da-terra-e-do-mar
  synopsis: >
    Cinco contos de terra e mar - "História da Gata Borralheira", "O
    Silêncio", "A Casa do Mar", "Saga" e "Vila d'Arcos" - em que as
    personagens veem a sua verdadeira vida revelada no silêncio, na noite,
    no som do mar.

- id: sophia-de-mello-breyner-andresen/a-casa-do-mar
  synopsis: >
    Um único conto, publicado inicialmente como volume ilustrado autónomo
    cinco anos antes de passar a integrar Histórias da Terra e do Mar.

- id: sophia-de-mello-breyner-andresen/o-anjo-de-timor
  synopsis: >
    Um conto tardio e autónomo, publicado no ano anterior à sua morte.

- id: sophia-de-mello-breyner-andresen/o-carrasco
  synopsis: >
    Uma pequena cidade prepara-se para assistir à execução de uma
    sentença de morte - o mais antigo dos quatro contos mais tarde
    reunidos em Quatro Contos Dispersos.

- id: sophia-de-mello-breyner-andresen/era-uma-vez-uma-praia-atlantica
  synopsis: >
    Uma história de luto passada numa pequena vila costeira, mais tarde
    reunida em Quatro Contos Dispersos.

- id: sophia-de-mello-breyner-andresen/leitura-no-comboio
  synopsis: >
    Uma mulher a ler no comboio é repetidamente interrompida pelas
    perguntas de um desconhecido - conto mais tarde reunido em Quatro
    Contos Dispersos.

- id: sophia-de-mello-breyner-andresen/o-cego
  synopsis: >
    Um músico de rua cego na Lisboa pós-revolucionária, e o modo como as
    sequelas da Revolução dos Cravos moldam o que ele toca - conto mais
    tarde reunido em Quatro Contos Dispersos.

- id: sophia-de-mello-breyner-andresen/quatro-contos-dispersos
  synopsis: >
    Quatro contos - O Carrasco (1991), Era Uma Vez Uma Praia Atlântica
    (1997), Leitura no Comboio e O Cego (2002) - cada um publicado
    inicialmente em separado, reunidos num livro quatro anos após a sua
    morte, editado pela sua filha Maria Andresen Sousa Tavares.

- id: sophia-de-mello-breyner-andresen/a-menina-do-mar
  synopsis: >
    Uma amizade entre o filho de um pescador e uma menina que vive debaixo
    do mar - um dos dois livros de 1958, a par de A Fada Oriana, que
    abriram a sua carreira como autora infantil.

- id: sophia-de-mello-breyner-andresen/a-fada-oriana
  synopsis: >
    Uma fada encarregada do bem-estar de uma floresta e de tudo o que
    nela vive deixa-se prender pelo próprio reflexo no rio, negligencia a
    floresta e é despojada das asas por isso - uma história de
    responsabilidade, vaidade e consequência.

- id: sophia-de-mello-breyner-andresen/a-noite-de-natal
  synopsis: >
    Uma história de véspera de Natal, o seu terceiro livro infantil.

- id: sophia-de-mello-breyner-andresen/o-cavaleiro-da-dinamarca
  synopsis: >
    Um cavaleiro anuncia, na ceia de Natal, que parte da sua casa na
    floresta da Dinamarca para orar na gruta de Belém, e passa o longo
    regresso retido entre os contadores de histórias de Veneza, Florença e
    Antuérpia, com um único desejo: estar de novo com a família na noite
    de Natal - entre os livros mais consistentemente recomendados pelo
    Plano Nacional de Leitura de Portugal para o início do ensino
    secundário.

- id: sophia-de-mello-breyner-andresen/o-rapaz-de-bronze
  synopsis: >
    Uma estátua de jardim que ganha vida à noite e governa com justiça as
    suas plantas torna-se amiga de Florinda, a jovem filha do jardineiro
    do próprio jardim.

- id: sophia-de-mello-breyner-andresen/a-floresta
  synopsis: >
    Uma menina descobre um anão a viver no seu jardim e, juntos, exploram
    um tesouro escondido na floresta.

- id: sophia-de-mello-breyner-andresen/o-tesouro
  synopsis: >
    O seu sétimo livro infantil.

- id: sophia-de-mello-breyner-andresen/a-arvore
  synopsis: >
    Duas histórias reelaboradas a partir de contos tradicionais japoneses:
    a história-título, sobre uma árvore de uma ilha que cresce tanto que a
    sua sombra adoece quem vive debaixo dela, e "O Espelho ou o Retrato
    Vivo", sobre laços familiares - natureza, harmonia e parentesco num
    cenário explicitamente não português, pouco habitual entre os seus
    livros infantis.

- id: sophia-de-mello-breyner-andresen/os-ciganos
  synopsis: >
    Um rapaz trepa o muro do jardim para seguir um grupo de ciganos
    itinerantes e descobre a liberdade fora da sua casa cheia de regras -
    um fragmento inacabado encontrado nos papéis de Sophia em 2009 e
    concluído pelo seu neto, publicado oito anos após a sua morte.

- id: sophia-de-mello-breyner-andresen/nao-chores-minha-querida
  synopsis: >
    A sua primeira peça de teatro publicada.

- id: sophia-de-mello-breyner-andresen/filho-de-alma-e-sangue
  synopsis: >
    A sua segunda peça de teatro publicada, no ano anterior ao Prémio
    Camões.

- id: sophia-de-mello-breyner-andresen/o-azeiteiro
  synopsis: >
    A sua terceira peça de teatro publicada.

- id: sophia-de-mello-breyner-andresen/o-bojador
  synopsis: >
    Uma peça construída em torno do Cabo Bojador como barreira real à
    navegação e, ao mesmo tempo, figura do medo do desconhecido - as
    lendas do mar que impediram durante muito tempo os navegadores
    portugueses de o dobrar, e os que ainda assim se atreveram.

- id: sophia-de-mello-breyner-andresen/o-colar
  synopsis: >
    Um drama romântico passado em Veneza no primeiro quartel do século
    XIX, centrado nas personagens Vanina e Pietro - a sua última peça
    publicada.

- id: sophia-de-mello-breyner-andresen/o-nu-na-antiguidade-classica
  synopsis: >
    Um ensaio sobre o nu na antiguidade clássica, em que o seu
    conhecimento do mundo helénico se volta para a crítica de arte.
