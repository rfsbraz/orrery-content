# Português europeu (pt-PT) - sobreposição de prosa curada (title +
# description). Traduz-se apenas prosa. Nunca ids, slugs, URLs de fontes.
# As referências internas do tipo work:<id>|texto mantêm o id; traduz-se
# apenas o texto apresentado depois do pipe. As citações diretas já em
# português no original (Guilherme d'Oliveira Martins, o processo da PIDE,
# a própria Sophia em entrevista) mantêm-se tal como estão, sem o glosário
# inglês que as acompanhava no ficheiro-base.

- id: sophia-de-mello-breyner-andresen-mar-novo-origin-1958
  title: Dá a Mar Novo o nome do monumento de Sagres do irmão, cancelado pelo regime
  description: >
    Em 1956, o seu irmão, o arquiteto João Andresen, vence o concurso para
    um monumento ao Infante D. Henrique em Sagres - com o pintor Júlio
    Resende e o escultor Salvador Barata Feyo - sob o nome de projeto "Mar
    Novo". Salazar sobrepõe-se ao júri e o Conselho de Ministros cancela o
    monumento por completo, mandando construir em Lisboa, em sua
    substituição, uma cópia em pedra do Padrão dos Descobrimentos de 1940.
    Dois anos depois, Sophia intitula uma coletânea de poesia
    [[work:sophia-de-mello-breyner-andresen/mar-novo|Mar Novo]] em
    homenagem ao projeto morto - "um livro de rotura, politicamente muito
    significativo", nas palavras de Guilherme d'Oliveira Martins, seu
    colega no Centro Nacional de Cultura - depositando nele um ato de
    revolta contra a injustiça feita ao irmão. O seu próprio processo da
    PIDE desse período descreve-a apenas como "desafeta ao atual regime",
    sem atividades conhecidas - um veredicto oficial mais brando do que o
    que o marido, Francisco, viria a merecer após as suas próprias
    detenções nos anos seguintes.

- id: sophia-de-mello-breyner-andresen-o-nome-das-coisas-pascoaes-prize-1977
  title: O Nome das Coisas vence o Prémio Teixeira de Pascoaes
  description: >
    [[work:sophia-de-mello-breyner-andresen/o-nome-das-coisas|O Nome das
    Coisas]], publicado no mesmo ano, vence o Prémio Teixeira de Pascoaes.
    A própria Sophia descreve o livro, numa entrevista posterior, como
    escrito contra a demagogia que se seguiu a 25 de abril de 1974:
    "Aquele livro é mais uma crítica de certos desmandos... É um livro
    contra tudo, contra uma forma de linguagem muito demagógica, uma
    tentativa de procurar a verdade" - um acerto de contas, nas suas
    próprias palavras, com uma Revolução que não cumprira a promessa.

- id: sophia-de-mello-breyner-andresen-ilhas-prizes-1989
  title: Ilhas vence o Prémio D. Dinis e o prémio do Pen Clube
  description: >
    [[work:sophia-de-mello-breyner-andresen/ilhas|Ilhas]] recebe, no ano
    da sua publicação, tanto o Prémio D. Dinis, da Fundação da Casa de
    Mateus, como o Prémio do Pen Clube Português de Poesia - a primeira
    vez que dois dos seus prémios distinguem um livro específico e não o
    conjunto da obra, dez anos antes do Camões.
