# Português europeu (pt-PT) - sobreposição de prosa curada.
# Traduz-se apenas prosa. Nunca ids, slugs, nomes de autor, títulos de obra
# (já são portugueses) nem URLs de fontes.
#
# As listas encaixadas fundem-se item a item pelo id (ver SCHEMA.md, "Nested
# lists merge by id"), pelo que os percursos de startHere trazem apenas o id
# e a prosa, nunca a estrutura (workIds, orderId, fit). A descrição do wing
# em franchise.yaml ainda não tem sobreposição própria; esta entrada cobre
# apenas os percursos de startHere.

- id: sophia-de-mello-breyner-andresen
  startHere:
    paths:
      - id: start-with-poesia
        title: Comece por Poesia
        description: >
          O seu primeiro livro, publicado pela chancela Cadernos de Poesia
          em 1944, quando tinha pouco mais de vinte anos, já traz o jardim
          e a casa da infância, o mar, e a exigência de clareza moral a que
          o resto da sua obra de sessenta anos não deixa de regressar - não
          um livro de aprendizagem que mais tarde ultrapassou, mas aquele
          que todos os relatos sobre a sua poesia contam como o início.
          Seguem-se mais catorze coletâneas ao longo dos cinquenta e três
          anos seguintes, sem interrupção, até O Búzio de Cós, em 1997.
        note: >
          O custo é tudo o que uma estreia ainda não pode conter: nenhum
          poema helénico (estes vêm depois, a partir de Dual), nenhum dos
          contos, livros infantis ou peças, e nada da urgência política que
          Livro Sexto e os anos do Estado Novo trazem. Um livro, não o
          alcance.

      - id: classroom-canon
        title: Comece por O Cavaleiro da Dinamarca
        description: >
          Um cavaleiro deixa a sua casa na floresta decidido a passar a
          próxima noite de Natal na gruta de Belém, viaja por Veneza e
          Florença, e regressa através de uma floresta coberta de neve e
          rondada por lobos para chegar a tempo junto da família. Sophia
          escreveu oito livros para crianças; este é o que o Ministério da
          Educação oferece de facto aos alunos portugueses do 7.º ano, e de
          longe o seu êxito mais duradouro, uma 56.ª edição em quatro
          décadas desde a primeira.
        note: >
          O custo: esta não é a poeta a quem foi atribuído o Prémio Camões.
          Um leitor que fique por aqui conheceu a Sophia lida em voz alta a
          crianças portuguesas durante sessenta anos, não aquela que, nesses
          mesmos sessenta anos, construiu a poesia que o resto desta estante
          guarda.

      - id: everything
        title: Tudo, por ordem
        description: >
          As 52 obras por ordem de publicação: as catorze coletâneas de
          poesia sem interrupção entre 1944 e 1997, as duas coletâneas de
          contos, os oito livros infantis, as cinco peças de teatro
          tardias, e as antologias, seleções e compilações póstumas
          reunidas à sua volta. Para um leitor que queira o alcance
          completo de uma carreira de sessenta anos em quatro géneros, ou
          que já conheça um canto dela e queira o resto.
        note: >
          O custo é a escala, não a qualidade: catorze coletâneas, dois
          livros de contos, oito histórias infantis e cinco peças é muita
          estante para se comprometer antes de saber se a sua voz é para
          si - os dois percursos acima existem porque a maioria dos
          leitores quer primeiro uma porta.
