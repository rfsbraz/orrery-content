# Português europeu (pt-PT) - descrição da coleção e os cinco caminhos
# startHere (título, descrição e nota). workIds, orderId, fit e sources nunca
# se traduzem.
#
# Nenhum destes campos de base usa referências inline entre parênteses
# retos duplos (a description de topo e as cinco descriptions/notes de
# startHere só nomeiam obras a espaço, sem marcação), por isso não há aqui
# nenhum título de trabalho a resolver via editions.yaml.
#
# "The Trilogy of the Rat" (id trilogy-of-the-rat) é uma etiqueta curatorial,
# não o título publicado de uma obra - works.yaml e orders.yaml já a
# descrevem como o nome informal com que a crítica e os leitores tratam o
# conjunto, nunca um título de capa. Traduz-se como qualquer outro título
# curado: "A Trilogia do Rato", com "o Rato" para a personagem a quem o
# inglês chama "the Rat" ao longo de toda esta ala (ver a mesma opção em
# content/i18n/pt-PT/authors/haruki-murakami.yaml e .../works.yaml).

- id: haruki-murakami
  description: >
    Um antigo proprietário de um bar de jazz que se tornou romancista de
    gatos desaparecidos, poços e Tóquios paralelos, traduzido para inglês ao
    longo de quatro décadas por três tradutores principais, com dois
    romances iniciais mantidos fora do lançamento geral no Ocidente durante
    mais de vinte e cinco anos.
  startHere:
    paths:
      - id: essentials
        title: Se só ler um
        description: >
          O romance que fixou a forma longa, onírica e assombrada pela
          história que a maioria dos leitores associa hoje distintamente a
          ele: a busca de um homem pelo gato desaparecido alarga-se numa
          busca pela mulher desaparecida, e arrasta consigo uma vidente, um
          poço seco e o relato há muito enterrado de um soldado sobre a
          Manchúria em tempo de guerra.
        note: >
          O custo é a extensão e a densidade - mais de 600 páginas,
          originalmente três volumes ligados de forma solta, um enredo que
          resiste a um resumo arrumado - o oposto de uma prova rápida da sua
          escrita.

      - id: the-famous-one
        title: "Conhece-o só de fama? Comece por aqui mesmo assim - com cuidado"
        description: >
          A história de amor universitária e realista que o tornou um
          bestseller no Japão e, para muitos leitores fora dele, o único
          título de Murakami que conhecem pelo nome - o luto de um estudante
          de Tóquio por um amigo de infância, dividido entre duas mulheres
          muito diferentes.
        note: >
          O custo é a representatividade: é o seu grande romance menos
          típico, sem o surrealismo, os poços, os animais que falam ou os
          mundos paralelos que movem o resto da prateleira. Um leitor que o
          adore e espere mais do mesmo vai surpreender-se com tudo o resto
          aqui.

      - id: trilogy-of-the-rat
        title: A Trilogia do Rato
        description: >
          O mesmo narrador sem nome e o amigo a quem chama o Rato, ao longo
          de três romances iniciais, despidos e marcados pelo jazz - um
          verão sem rumo, uma máquina de pinball desaparecida, e uma caça
          empresarial a uma ovelha com uma marca que molda a história -
          lidos como o conjunto informal e de nome solto a que a crítica e
          os leitores efetivamente os chamam.
        note: >
          Não é uma porta de entrada: Murakami já chamou aos dois primeiros
          "immature," e uma lista de classificação (Vulture) lê as próprias
          ideias de Em Busca do Carneiro Selvagem como "forced" ao lado do
          seu trabalho posterior. Isto é para um leitor que já o conhece e
          quer o período inicial como um conjunto, pela ordem em que foi
          escrito - Dança, Dança, Dança é um romance posterior e separado
          que revisita o mesmo narrador, não um quarto volume deste trio.

      - id: beyond-the-novels
        title: Para além dos romances
        description: >
          Cinco obras da ficção breve e da não-ficção que correu a par dos
          dezasseis romances - uma coletânea de contos premiada, uma segunda
          que se tornou um filme vencedor de um Óscar, uma terceira levada
          ao palco internacionalmente, um livro premiado de conversas com o
          maestro Seiji Ozawa, e a história oral do ataque de sarin de
          Tóquio em 1995, que esta coleção segue como o ponto de viragem da
          sua carreira.
        note: >
          Isto não é todo o nível extended - ficam aqui mais sete títulos,
          incluindo duas coletâneas posteriores e bem recebidas pela crítica
          (Auto-Retrato do Escritor Enquanto Corredor de Fundo, Primeira
          Pessoa do Singular) deixadas de fora só por falta de espaço. A
          ordem por defeito continua a incluir as doze por ordem de
          publicação; isto é um atalho por elas, não uma substituição.

      - id: everything
        title: Tudo, por ordem
        description: >
          As vinte e nove obras pela ordem em que as escreveu - dezasseis
          romances, seis coletâneas de contos, uma novela, cinco obras de
          não-ficção e uma antologia editada, entrelaçadas tal como
          apareceram ao longo de quase cinco décadas.
