# Português europeu (pt-PT) - título, descrição e themes das duas eras
# (docs/SCHEMA.md; `themes` é a lista de frases curtas mostrada sob o título
# na placa da era, e é prosa lida, não metadado). `note:` não é traduzido:
# nenhum overlay pt-PT deste catálogo o traduz, o campo não é lido pela
# aplicação em Era.
#
# TÍTULO NÃO TRADUZIDO, DE PROPÓSITO. O próprio eras.yaml de base já decide
# isto: "Detachment" e "Commitment" são os termos recebidos de Murakami, em
# escrita latina - o mesmo par de palavras inglesas que ele usa como
# empréstimo em japonês (デタッチメント / コミットメント) - "nothing here is
# translated by us". O título fica aqui igual ao inglês de base, não por
# omissão mas porque essa É a forma correta em qualquer língua desta
# plataforma; qualquer outra ocorrência destes dois termos no corpo da
# descrição (nomeadamente na citação verbatim de Murakami a Kawai, ver
# abaixo) segue a mesma regra e fica em inglês.
#
# CITAÇÃO VERBATIM na descrição de commitment: a fala de Murakami a Hayao
# Kawai em 1996 é citada entre aspas no inglês de base e fica em inglês,
# verbatim, dentro da prosa traduzida - sem tradução portuguesa publicada
# localizável, e não se inventa uma para uma citação atribuída a uma pessoa
# real (mesma regra de content/i18n/pt-PT/authors/hp-lovecraft.yaml,
# anna-sewell.yaml e miguel-de-cervantes.yaml).
#
# Os títulos de obras citados inline usam o título português publicado
# quando existe uma edição real (editions.yaml): Norwegian Wood e Underground
# mantêm-se tal como no mercado português (a edição pt-PT usa o mesmo título
# inglês); after the quake não tem edição pt-PT (editions.yaml) e fica como
# está, em minúsculas tal como no inglês de base.

- id: detachment
  title: Detachment
  themes: [o narrador sem nome, a cultura pop americana num bar de Tóquio, a perda e a coisa que desaparece, o estranho dentro do vulgar, a distância mantida de propósito]
  description: >
    デタッチメント, a palavra do próprio Murakami para a postura a partir da
    qual escreveu primeiro, e aquela em que os seus críticos no Japão se
    fixaram: um narrador que se mantém frio e intelectualmente distante do
    que quer que de estranho lhe esteja a acontecer, contado numa prosa
    contida, com um ar traduzido, que rompia com o romance literário
    japonês da época. A Trilogia do Rato estabelece quase todos os hábitos
    posteriores de uma só vez, desde
    [[work:haruki-murakami/hear-the-wind-sing|Ouve a Canção do Vento]]
    (1979) e [[work:haruki-murakami/pinball-1973|Flíper, 1973]] até
    [[work:haruki-murakami/a-wild-sheep-chase|Em Busca do Carneiro
    Selvagem]] (1982). Depois é a vez do fantástico assumir o comando em
    [[work:haruki-murakami/hard-boiled-wonderland-and-the-end-of-the-world|O
    Impiedoso País das Maravilhas e o Fim do Mundo]] (1985), o realismo
    retoma-o em [[work:haruki-murakami/norwegian-wood|Norwegian Wood]]
    (1987), que vendeu milhões de exemplares e tornou impossível continuar
    a viver no Japão, e [[work:haruki-murakami/dance-dance-dance|Dança,
    Dança, Dança]] (1988) traz de volta, uma última vez, o narrador do
    Rato. Kojin Karatani lia o detachment como a ausência de um sentido de
    história; Murakami, mais tarde, leu-o como uma posição que estava
    pronto para deixar.

- id: commitment
  title: Commitment
  themes: [a história e o que nela se fez, o trauma coletivo, a violência sob a superfície, a entrevista e o documento, o romance longo]
  description: >
    コミットメント. "More recently, I've been thinking a lot about the concept
    of commitment," Murakami told Hayao Kawai in 1996. "For example, even
    when I'm writing a novel it's become a very important thing for me.
    Though up until now detachment has been important for me." A mudança
    mostra-se primeiro em
    [[work:haruki-murakami/the-wind-up-bird-chronicle|Crónica do Pássaro de
    Corda]], que coloca as atrocidades cometidas pelo Japão em tempo de
    guerra na Manchúria dentro de um romance que começa como a história de
    um homem à procura do seu gato. Murakami regressou dos Estados Unidos
    em junho de 1995, entre o terramoto de Kobe, em janeiro, e o ataque de
    gás sarin da Aum Shinrikyo ao metro de Tóquio, em março, e respondeu
    diretamente a ambos: [[work:haruki-murakami/underground|Underground]]
    (1997) são entrevistas com as vítimas, o seu primeiro livro de
    não-ficção, e todos os contos de
    [[work:haruki-murakami/after-the-quake|after the quake]] (2000)
    passam-se no único mês entre os dois acontecimentos. Os romances que se
    seguem são os mais longos e estruturalmente mais ambiciosos que
    escreveu, de [[work:haruki-murakami/kafka-on-the-shore|Kafka à
    Beira-Mar]] (2002) e [[work:haruki-murakami/1q84|1Q84]] (2009) a
    [[work:haruki-murakami/killing-commendatore|A Morte do Comendador]]
    (2017) e
    [[work:haruki-murakami/the-city-and-its-uncertain-walls|A Cidade e as
    Suas Muralhas Incertas]] (2023).
