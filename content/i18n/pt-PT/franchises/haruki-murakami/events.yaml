# Português europeu (pt-PT) - acontecimentos específicos da coleção (o que
# aconteceu aos LIVROS; a vida do autor está em content/i18n/pt-PT/authors/).
# Nenhuma das três entradas tem organisation: epigraph, pelo que nenhuma
# carrega um campo `quote` a traduzir.
#
# Os títulos de obras citados a espaço (sem marcação de referência interna
# no inglês de base) usam o título português publicado quando existe uma edição real
# (editions.yaml): "A Morte do Comendador" por "Killing Commendatore" no
# título da própria entrada de censura, "Kafka à Beira-Mar" por "Kafka on
# the Shore" na descrição do lançamento de 1Q84. The Tale of KAHO não tem
# edição pt-PT (editions.yaml) e fica como está, tal como no inglês de base.

- id: murakami-1q84-launch-2009
  title: 1Q84 esgota no dia de lançamento após um apagão informativo imposto pela editora
  description: >
    A Shinchosha lançou [[work:haruki-murakami/1q84|1Q84]] no Japão a 29 de
    maio de 2009 sem revelar nada sobre o enredo de antemão - nem a editora
    nem o autor deram entrevistas ou escreveram texto de contracapa -
    depois de Murakami ter concluído que a divulgação de detalhes de Kafka
    à Beira-Mar pela crítica, em 2002, tinha estragado a novidade do livro
    para os leitores. Os fãs, que conheciam apenas o título e o autor,
    encomendaram o livro antecipadamente da mesma forma; a primeira
    tiragem (300 000 exemplares do Livro 1, 280 000 do Livro 2) esgotou no
    próprio dia de lançamento, e a Shinchosha comunicou 680 000 exemplares
    vendidos nos primeiros dias. Nos doze meses seguintes, 1Q84 tornou-se o
    primeiro romance literário a liderar a lista anual de mais vendidos da
    Tohan Corporation desde que a distribuidora começou a compilá-la, em
    1990.

- id: murakami-killing-commendatore-hk-censorship-2018
  title: "Tribunal de Artigos Obscenos de Hong Kong classifica A Morte do Comendador como \"indecente\""
  description: >
    O Tribunal de Artigos Obscenos de Hong Kong atribuiu à edição em chinês
    de [[work:haruki-murakami/killing-commendatore|A Morte do Comendador]]
    uma classificação provisória de Classe II ("indecente") a 12 de julho de
    2018, tornada oficial a 26 de julho, devido ao seu conteúdo sexual. A
    decisão significava que o romance só podia ser vendido com a capa
    envolta num aviso, e restrito a compradores com dezoito ou mais anos, e
    foi retirado da banca da editora na Feira do Livro de Hong Kong desse
    ano; as bibliotecas públicas aplicaram o mesmo invólucro opaco aos seus
    próprios exemplares. A decisão gerou uma petição com quase 2000
    assinaturas e críticas públicas da PEN Hong Kong, cujo presidente
    perguntou por que motivo o tratamento do sexo por Murakami era
    considerado mais indecente do que passagens ensinadas como clássicos
    nas escolas de Hong Kong. O romance tinha sido posto à venda no Japão
    no ano anterior com aberturas de livrarias à meia-noite e filas de fãs,
    a mesma receção repetida mais tarde para The Tale of KAHO.

- id: murakami-kaho-midnight-launch-2026
  title: Fãs fazem fila até depois da meia-noite por The Tale of KAHO, o seu primeiro romance com uma única protagonista feminina
  description: >
    [[work:haruki-murakami/the-tale-of-kaho|The Tale of KAHO]] foi posto à
    venda no Japão a 3 de julho de 2026, com uma contagem decrescente numa
    livraria Kinokuniya de Tóquio, onde os fãs que tinham feito a
    encomenda antecipada receberam os seus exemplares no instante em que o
    relógio bateu a meia-noite. Numa mensagem publicada no site da campanha
    da editora, Murakami escreveu sobre a sua protagonista: "Kaho, a
    picture book author, is just an average young woman. But truly bizarre
    things start happening around her. I wrote this novel as I put myself
    in her shoes" - uma mudança de rumo que os fãs presentes no evento
    destacaram, já que quase todos os seus protagonistas de romances de
    fôlego, antes de Kaho, tinham sido homens jovens ou de meia-idade.
