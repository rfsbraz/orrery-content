# Português europeu (pt-PT) - sinopses. Os títulos NÃO se traduzem (title é
# sempre o original japonês, nunca sobreposto - ver SCHEMA.md; um título
# traduzido só existe se houver uma edição pt-PT real, e essa vive em
# editions.yaml, nunca aqui). As notas (`note:`) ficam na língua de base,
# incluindo a nota de cada sinopse abaixo sobre o que deliberadamente não
# diz - a mesma regra já aplicada noutras coleções desta plataforma.
#
# QUATRO SINOPSES PARAM DELIBERADAMENTE NO LIMITE DA CONTRACAPA DO EDITOR. A
# tradução respeita exatamente o mesmo limite do inglês de base, sem repor o
# que ali ficou de fora:
#   - hard-boiled-wonderland-and-the-end-of-the-world: não se diz como as
#     duas narrativas (Tóquio, a Cidade murada) se relacionam.
#   - killing-commendatore: não se nomeia o que o objeto encontrado liberta
#     nem o que o quadro regista; fica só "uma sucessão de acontecimentos".
#   - pinball-1973: a busca pela máquina fica sem desfecho.
#   - 1q84: a ligação entre Aomame e Tengo fica só como "as suas duas
#     histórias vão-se aproximando", nunca "colegas de infância" nem
#     qualquer outra explicação do que os une.
#
# REFERÊNCIAS A OUTRAS OBRAS DENTRO DA PRÓPRIA SINOPSE (dance-dance-dance
# nomeia A Wild Sheep Chase a espaço, sem marcação de referência interna no
# inglês de base) usam o título português publicado quando existe uma edição real
# (editions.yaml), tal como as referências marcadas - "Em Busca do Carneiro
# Selvagem", não "A Wild Sheep Chase".
#
# SEIS OBRAS SEM EDIÇÃO PT-PT (editions.yaml): after-the-quake, the-strange-
# library, murakami-t, birthday-stories, lets-meet-in-a-dream e
# the-tale-of-kaho. Nenhuma delas é referenciada a partir de outra sinopse
# desta ala, por isso a questão do título só se põe nas próprias entradas
# abaixo, onde o título original/inglês fica como está.

- id: haruki-murakami/hear-the-wind-sing
  synopsis: >
    Um narrador sem nome recorda um verão sem rumo de 1970, a beber com o
    amigo a quem chama o Rato e com uma mulher de quatro dedos que conhece
    num bar, na estreia contida e marcada pelo jazz do próprio Murakami.

- id: haruki-murakami/pinball-1973
  synopsis: >
    O mesmo narrador, um ano depois, divide o tempo entre a pequena agência
    de traduções que gere com um amigo, as gémeas idênticas que aparecem sem
    aviso no seu apartamento, e uma busca obsessiva pela máquina de pinball
    que costumava jogar.

- id: haruki-murakami/a-wild-sheep-chase
  synopsis: >
    O narrador é arrastado para uma bizarra busca, entre o mundo empresarial
    e o submundo, por uma ovelha possuída por um espírito sobrenatural que
    molda a história, seguindo o rasto do seu velho amigo o Rato por
    Hokkaido.

- id: haruki-murakami/hard-boiled-wonderland-and-the-end-of-the-world
  synopsis: >
    Os capítulos alternam entre duas narrativas: uma Tóquio de tom
    cyberpunk, onde um "Calcutec" que lava dados, treinado para encriptar
    usando o próprio subconsciente, aceita um trabalho para um cientista
    recluso escondido sob a cidade, e uma Cidade murada e fora do tempo,
    onde um recém-chegado tem a sombra cortada ao entrar pelo portão e é
    posto a ler sonhos antigos.

- id: haruki-murakami/norwegian-wood
  synopsis: >
    Toru Watanabe recorda os seus anos de estudante na Tóquio do final dos
    anos 1960, dividido entre Naoko, ainda a chorar o suicídio de um amigo
    comum a ambos, e a extrovertida e decidida Midori - o romance realista
    que tornou Murakami num escritor de grande sucesso, e desconfortavelmente
    famoso, no Japão.

- id: haruki-murakami/dance-dance-dance
  synopsis: >
    Anos depois de Em Busca do Carneiro Selvagem, o mesmo narrador sem nome
    regressa ao Hotel Dolphin à procura do homem-ovelha e de uma mulher
    desaparecida, num romance que o próprio artigo da Wikipédia inglesa
    sobre a "Trilogia do Rato" descreve como o epílogo tardio da trilogia, e
    não o seu quarto volume.

- id: haruki-murakami/south-of-the-border-west-of-the-sun
  synopsis: >
    Um bem-sucedido proprietário de um clube de jazz em Tóquio, casado e
    confortável, já perto dos quarenta anos, é perturbado pelo reaparecimento
    de uma amiga de infância, num romance mais breve e íntimo do que a vasta
    Crónica do Pássaro de Corda que se lhe seguiu.

- id: haruki-murakami/the-wind-up-bird-chronicle
  synopsis: >
    A busca de Toru Okada pelo gato desaparecido alarga-se numa busca pela
    mulher que se esvai, e arrasta consigo uma dupla de irmãs com poderes
    psíquicos, um poço seco e o relato há muito enterrado de um veterano
    sobre a ocupação japonesa da Manchúria - o romance que fixou a forma
    longa, onírica e de múltiplos fios que a maioria dos leitores associa
    hoje a Murakami.

- id: haruki-murakami/sputnik-sweetheart
  synopsis: >
    Um jovem professor narra o seu amor não correspondido por Sumire, uma
    aspirante a romancista obcecada por Jack Kerouac que se apaixona por uma
    mulher mais velha e depois desaparece numa ilha grega.

- id: haruki-murakami/kafka-on-the-shore
  synopsis: >
    Um adolescente fugitivo que se dá o nome de Kafka Tamura e um amnésico
    idoso que fala com gatos seguem dois caminhos separados que se vão
    aproximando, num romance impregnado do mito de Édipo e de ideias
    xintoístas sobre o espírito e a profecia.

- id: haruki-murakami/after-dark
  synopsis: >
    Uma única noite em Tóquio, contada em grande parte no presente por uma
    perspetiva narrativa sem nome, semelhante a uma câmara, acompanha uma
    jovem que não consegue dormir, a irmã mais velha que não consegue
    despertar, e um punhado de estranhos cujos caminhos se cruzam depois da
    meia-noite.

- id: haruki-murakami/1q84
  synopsis: >
    Aomame e Tengo, em cantos separados da mesma cidade, percebem cada um
    por si que a Tóquio de 1984 se tornou discretamente um mundo paralelo
    com duas luas, e as suas duas histórias vão-se aproximando ao longo de
    uma trama que envolve o líder recluso de uma seita e um bestseller
    escrito por outrem em nome de uma jovem de dezassete anos.

- id: haruki-murakami/colorless-tsukuru-tazaki-and-his-years-of-pilgrimage
  synopsis: >
    Tsukuru Tazaki, o único membro de um grupo de amigos do liceu antes
    inseparável a não ter uma cor no nome, parte aos 36 anos para descobrir
    porque é que os outros quatro o baniram sem explicação dezasseis anos
    antes.

- id: haruki-murakami/killing-commendatore
  synopsis: >
    Um pintor de retratos, recentemente abandonado pela mulher, isola-se na
    casa de montanha de um artista célebre, agora incapacitado, e encontra
    no sótão um quadro do homem mais velho que nunca ninguém viu.
    Desenterrá-lo desencadeia uma sucessão de acontecimentos que só
    consegue encerrar descendo a um outro mundo.

- id: haruki-murakami/the-city-and-its-uncertain-walls
  synopsis: >
    Um homem que há muito perdeu, para uma misteriosa cidade murada, a
    rapariga que amava tenta finalmente regressar a esse lugar, num romance
    construído a partir de um conto homónimo que Murakami publicou em 1980
    e que há muito considerava um assunto por resolver.

- id: haruki-murakami/the-tale-of-kaho
  synopsis: >
    Uma autora de livros ilustrados de 26 anos ouve de um desconhecido, num
    encontro às escuras, que é a mulher mais feia que ele já conheceu, e vê
    acontecimentos cada vez mais bizarros - um tamanduá, um jaguar, uma
    rainha das térmitas - a acumularem-se à sua volta enquanto tenta
    entender o que ele quis dizer, no primeiro romance de fôlego de
    Murakami construído em torno de uma única protagonista feminina.

- id: haruki-murakami/lets-meet-in-a-dream
  synopsis: >
    Uma coletânea de microcontos, cada um associado a uma palavra de origem
    estrangeira escrita em katakana que lhe serve de título, alternando
    entre Murakami e o publicitário Shigesato Itoi numa competição amigável
    sobre o mesmo conceito partilhado.

- id: haruki-murakami/the-elephant-vanishes
  synopsis: >
    Dezassete contos escritos entre 1980 e 1991, reunidos por primeira vez
    num único volume pelo editor de língua inglesa de Murakami, e não como
    livro japonês.

- id: haruki-murakami/after-the-quake
  synopsis: >
    Seis contos, cada um passado nas semanas seguintes ao terramoto de Kobe
    de janeiro de 1995, embora nenhum o retrate diretamente, seguindo
    personagens cujas vidas são silenciosamente remodeladas por uma
    catástrofe que acontece longe, nos ecrãs de televisão.

- id: haruki-murakami/blind-willow-sleeping-woman
  synopsis: >
    Vinte e quatro contos escritos entre 1980 e 2005, selecionados pelo
    próprio Murakami como a sua coletânea definitiva de ficção breve em
    língua inglesa.

- id: haruki-murakami/men-without-women
  synopsis: >
    Sete contos, cada um centrado num homem que perdeu, ou nunca teve, a
    mulher que desejava - incluindo "Drive My Car", mais tarde adaptado ao
    filme homónimo de 2021 vencedor de um Óscar.

- id: haruki-murakami/first-person-singular
  synopsis: >
    Oito contos, todos narrados na primeira pessoa, que vão de um panfleto
    de poesia sobre basebol dedicado a uma equipa que já não joga a um
    macaco que confessa ter-se apaixonado.

- id: haruki-murakami/the-strange-library
  synopsis: >
    Um rapaz enviado para devolver livros à biblioteca é trancado numa sala
    de leitura labiríntica no subsolo por um velho que pretende comer-lhe o
    cérebro, numa novela breve, ilustrada, com ar de fábula.

- id: haruki-murakami/underground
  synopsis: >
    Uma história oral construída a partir de entrevistas com sobreviventes,
    e, num volume complementar, com membros da seita responsável pelo
    ataque de gás sarin ao metro de Tóquio de 20 de março de 1995 - a
    tentativa de Murakami para compreender uma atrocidade que sacudiu a sua
    ideia de um país sobre o qual escrevia há anos a partir da distância.

- id: haruki-murakami/what-i-talk-about-when-i-talk-about-running
  synopsis: >
    Um memoir sobre corridas de fundo, construído em torno da preparação
    para a Maratona de Nova Iorque de 2005, que serve também como o relato
    mais direto de Murakami sobre a sua própria disciplina de trabalho como
    romancista. O título faz um jogo de palavras com a coletânea de contos
    de Raymond Carver, "What We Talk About When We Talk About Love".

- id: haruki-murakami/absolutely-on-music
  synopsis: >
    Uma longa série de conversas sobre música clássica com o maestro Seiji
    Ozawa, registadas ao longo de vários anos, que percorrem a carreira do
    próprio Ozawa a par de sessões de audição atenta de gravações de Brahms,
    Beethoven e Mahler.

- id: haruki-murakami/novelist-as-a-vocation
  synopsis: >
    Uma coletânea de ensaios sobre o ofício e a disciplina diária da
    escrita, que aborda como Murakami começou, como trabalha e para que
    pensa que serve um romance.

- id: haruki-murakami/murakami-t
  synopsis: >
    Pequenos ensaios pessoais construídos em torno de fotografias de
    t-shirts da própria coleção de Murakami, publicados originalmente em
    série na revista Popeye entre 2018 e 2020.

- id: haruki-murakami/birthday-stories
  synopsis: >
    Uma antologia temática de contos sobre aniversários de outros autores
    (Paul Theroux, Denis Johnson, Lynda Barry, entre outros), selecionados e
    traduzidos para japonês por Murakami, que contribuiu também com um
    conto original seu, "Birthday Girl".
