# Overlay pt-PT: apenas `synopsis` (prosa). id, title, published, subseries,
# canonTier, featured, images e sources nunca se traduzem - o título de uma
# obra é dado de edição (ver docs/SCHEMA.md, "A published title is edition
# data, not translation"), nunca overlay. `note` também não é prosa lida
# pelo leitor (não faz parte do conjunto que i18n_coverage.py verifica) e
# fica por traduzir, como nas restantes wings.
#
# O autor escreve originalmente em português europeu, pelo que estas sinopses
# foram escritas a partir das sinopses reais do próprio autor em
# joserodriguesdossantos.com/portfolio/ (a versão portuguesa do site, não a
# inglesa) sempre que essa página existia, preferindo o vocabulário e os
# nomes próprios genuínos aí usados a uma tradução literal do inglês da base
# - nunca alterando a premissa nem o alcance de spoiler já fixados no campo
# `synopsis` em inglês. o-sexto-sentido (2025) ainda não tem página no site
# do autor (ver a nota do próprio works.yaml); a sinopse segue de perto a
# cobertura de imprensa do lançamento já citada em `sources`, que usa o termo
# português corrente "enteógenos".

- id: jose-rodrigues-dos-santos/o-codex-632
  synopsis: >
    O historiador e criptanalista Tomás Noronha é chamado a terminar a
    investigação inacabada de um erudito já falecido e descobre uma cifra
    capaz de reescrever a história aceite sobre a descoberta das Américas -
    e a verdadeira identidade de Cristóvão Colombo.

- id: jose-rodrigues-dos-santos/a-formula-de-deus
  synopsis: >
    Agentes da CIA vigiam um encontro privado, em 1951, entre Albert
    Einstein e o primeiro-ministro israelita David Ben-Gurion. Décadas
    depois, a busca por aquilo que Einstein realmente acreditava sobre as
    armas nucleares e a existência de Deus arrasta Tomás Noronha para o
    segredo mais bem guardado do físico.

- id: jose-rodrigues-dos-santos/o-setimo-selo
  synopsis: >
    Uma vasta plataforma de gelo da Antártida desprende-se à vista de uma
    estação científica, e o fenómeno insólito revela-se o primeiro fio de
    uma investigação que arrasta Tomás Noronha para um segredo climático
    oculto, de consequências apocalípticas.

- id: jose-rodrigues-dos-santos/furia-divina
  synopsis: >
    Um comando checheno rouba urânio altamente enriquecido de um complexo
    nuclear russo, e a CIA tira Tomás Noronha das férias para decifrar uma
    mensagem intercetada da Al-Qaeda antes que o roubo se transforme numa
    bomba.

- id: jose-rodrigues-dos-santos/o-ultimo-segredo
  synopsis: >
    Um assassino deixa enigmas bíblicos junto de académicos mortos na
    Biblioteca do Vaticano. Tomás Noronha e uma inspetora da polícia
    italiana seguem o rasto até à Terra Santa e ao último segredo do Novo
    Testamento - a verdadeira identidade de Jesus Cristo.

- id: jose-rodrigues-dos-santos/a-mao-do-diabo
  synopsis: >
    Despedido numa vaga de cortes orçamentais nas universidades, Tomás
    Noronha cruza-se com um velho amigo perseguido por homens armados por
    causa de um DVD capaz de expor os responsáveis pela crise financeira
    global - se conseguir decifrar o criptograma que esconde o seu
    paradeiro.

- id: jose-rodrigues-dos-santos/a-chave-de-salomao
  synopsis: >
    O diretor da CIA é encontrado morto dentro do Grande Colisor de
    Hadrões, no preciso momento em que o CERN se aproxima do bosão de
    Higgs, com uma mensagem enigmática que aponta Tomás Noronha como a
    chave do crime - e o seu principal suspeito.

- id: jose-rodrigues-dos-santos/vaticanum
  synopsis: >
    Militantes islamitas tomam a Cidade do Vaticano e fazem do Papa refém.
    Enquanto o mundo conta os minutos até uma execução ameaçada, a
    investigação de Tomás Noronha nos próprios arquivos da Santa Sé revela
    um segredo bem real no coração da Igreja.

- id: jose-rodrigues-dos-santos/sinal-de-vida
  synopsis: >
    O SETI intercepta uma transmissão alienígena, e uma nave não
    identificada está a duas semanas da órbita terrestre. Tomás Noronha
    junta-se à tripulação internacional enviada ao seu encontro, levando
    consigo a mais antiga das perguntas: será a vida um acidente cósmico,
    ou um imperativo cósmico?

- id: jose-rodrigues-dos-santos/imortal
  synopsis: >
    O rapto de um cientista chinês que alega ter criado os primeiros bebés
    geneticamente modificados arrasta Tomás Noronha para um projeto secreto
    que o coloca frente a frente com a Singularidade - o momento em que as
    máquinas superam a mente humana.

- id: jose-rodrigues-dos-santos/o-jardim-dos-animais-com-alma
  synopsis: >
    Um cadáver surge num tanque do Oceanário de Lisboa e todas as pistas
    apontam para Maria Flor. Para ilibar a mulher, Tomás Noronha tem de
    desvendar um projeto secreto escondido na mais esotérica pintura de
    Hieronymus Bosch - e o que ela revela sobre a mente dos animais.

- id: jose-rodrigues-dos-santos/a-mulher-do-dragao-vermelho
  synopsis: >
    O rapto de uma mulher em Amritsar arrasta Tomás Noronha e um contacto
    da CIA para uma investigação sobre a campanha do Partido Comunista
    Chinês contra o seu próprio povo, e a pergunta de saber se é Pequim, e
    não Moscovo, a maior ameaça às sociedades abertas.

- id: jose-rodrigues-dos-santos/o-protocolo-caos
  synopsis: >
    Um homem mascarado abre fogo sobre uma multidão e, ao tirar a máscara,
    revela ser Tomás Noronha. Fios que vão de uma cave russa a uma família
    americana em desagregação convergem num caso bem real: como a
    desinformação e as redes sociais são usadas para desestabilizar as
    democracias ocidentais.

- id: jose-rodrigues-dos-santos/o-sexto-sentido
  synopsis: >
    Um homem cai para a morte de um hotel de Lisboa, murmurando uma frase
    em latim e deixando o nome de Tomás Noronha para trás. A investigação,
    e um aviso da CIA de que a sua vida corre agora perigo, conduzem a
    investigações sobre enteógenos e os limites extremos da consciência
    humana.

- id: jose-rodrigues-dos-santos/o-homem-de-constantinopla
  synopsis: >
    Uma vida romanceada de Calouste Sarkisian Gulbenkian, desde uma
    infância arménia na Constantinopla otomana até à construção da
    arquitetura do negócio mundial do petróleo e à ascensão a homem mais
    rico do seu século.

- id: jose-rodrigues-dos-santos/um-milionario-em-lisboa
  synopsis: >
    O genocídio arménio e o caos da Segunda Guerra Mundial arrancam
    Calouste Gulbenkian de Paris e de Londres, e o filho conduz-no até à
    cidade que se torna o seu último lar: a Lisboa neutral em tempo de
    guerra, de 1942 a 1955.

- id: jose-rodrigues-dos-santos/as-flores-de-lotus
  synopsis: >
    A revolução marxista, a Rússia leninista e a Itália de Mussolini viram
    do avesso o mundo de quatro jovens - no Japão, na China, na Rússia e em
    Portugal - que serão arrastados para as catástrofes que definem o
    século XX.

- id: jose-rodrigues-dos-santos/o-pavilhao-purpura
  synopsis: >
    As mesmas quatro vidas - Satake Fukui no Japão militarista, Lian-hua
    presa entre os comunistas de Mao e os nacionalistas, Nadezhda sob a
    coletivização soviética, Artur a assistir à ascensão da ditadura de
    Salazar em Portugal - avançam pelos anos que antecedem a Segunda Guerra
    Mundial.

- id: jose-rodrigues-dos-santos/o-reino-do-meio
  synopsis: >
    Com Espanha em chamas e o Japão a invadir a China, um caso amoroso nos
    Açores, um atentado bombista contra Salazar e intrigas palacianas em
    Tóquio convergem na Berlim de Adolf Hitler, onde o oficial colonial
    Artur Teixeira encontra o cônsul japonês Satake Fukui.

- id: jose-rodrigues-dos-santos/a-amante-do-governador
  synopsis: >
    Depois de Pearl Harbor e da queda de Hong Kong, o Japão cerca Macau
    portuguesa. O governador Artur Teixeira, enfrentando o coronel Sawa, da
    Kempeitai, conta apenas com um punhado de aliados para salvar a colónia
    - entre eles a própria concubina de Sawa, Lian-hua, por quem se
    apaixona.

- id: jose-rodrigues-dos-santos/a-vida-num-sopro
  synopsis: >
    No Estado Novo recém-consolidado de Salazar, o estudante Luís
    apaixona-se por Amélia no liceu de Bragança que ambos frequentam - um
    amor posto à prova pela oposição da mãe dela, um assassinato
    inexplicado e a Guerra Civil de Espanha do outro lado da fronteira.

- id: jose-rodrigues-dos-santos/o-anjo-branco
  synopsis: >
    O médico José Branco muda-se para Moçambique nos anos 1960 e funda o
    Serviço Médico Aéreo, tornando-se uma lenda do mato conhecida como "o
    anjo branco" - até que uma missão em tempo de guerra o coloca frente a
    frente com o mais sombrio segredo colonial de Portugal.

- id: jose-rodrigues-dos-santos/o-magico-de-auschwitz
  synopsis: >
    O mágico judeu Herbert Levin é deportado de Praga ocupada para
    Auschwitz. O soldado português da Legião Estrangeira Francisco Latino,
    depois de combater o Exército Vermelho em Leninegrado, infiltra-se na
    elite nazi para seguir o rasto de uma mulher russa levada pelas SS - e
    os dois caminhos convergem dentro do campo.

- id: jose-rodrigues-dos-santos/o-manuscrito-de-birkenau
  synopsis: >
    Dentro de Auschwitz-Birkenau, o soldado português, a mulher russa e o
    mágico judeu têm de cooperar para sobreviver enquanto os prisioneiros
    do Sonderkommando do campo da morte organizam a sua revolta.

- id: jose-rodrigues-dos-santos/a-ilha-das-trevas
  synopsis: >
    Paulino da Conceição carrega um segredo da ocupação indonésia de
    Timor-Leste, desde a invasão de 1975 ao referendo de independência de
    1999 - e a coragem, ou a sua falta, para finalmente o revelar.

- id: jose-rodrigues-dos-santos/a-filha-do-capitao
  synopsis: >
    Dois meses depois de chegar às trincheiras da Flandres, o capitão
    português Afonso Brandão passa uma noite de descanso num castelo perto
    de Armentières e conhece uma baronesa francesa; nasce entre eles uma
    atração irresistível - enquanto o Alto Comando alemão prepara, para a
    primavera de 1918, uma ofensiva dirigida precisamente ao setor que o
    Corpo Expedicionário Português defende.

- id: jose-rodrigues-dos-santos/o-segredo-de-espinosa
  synopsis: >
    Amesterdão, 1640: uma criança assiste à excomunhão de um judeu da
    Sinagoga Portuguesa por questionar as Escrituras. Essa criança, Bento
    de Espinosa, leva consigo a semente dessa dúvida até à investigação
    filosófica que lhe custará tudo - uma investigação que a Igreja chama
    heresia.

- id: jose-rodrigues-dos-santos/comunicacao
  synopsis: >
    O primeiro livro do autor, um ensaio de 133 páginas que percorre a
    teoria da comunicação do século XX - dos modelos da Bala Mágica e do
    Fluxo em Duas Etapas às críticas marxistas e mcluhanianas - e a forma
    como políticos e académicos entenderam o poder dos media.

- id: jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau
  synopsis: >
    Uma história da reportagem de guerra desde a Guerra da Crimeia, o
    primeiro conflito coberto por uma imprensa incorporada, passando pela
    Guerra Civil Americana e pela Guerra Hispano-Americana, até à cobertura
    portuguesa da Primeira Guerra Mundial e da Guerra Civil de Espanha.

- id: jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade
  synopsis: >
    Correspondentes de guerra portugueses do Vietname à Guerra do Golfo:
    entrevistas, fotografias e crónicas de Cabul, Kigali, Khe Sanh,
    Chechénia e Sarajevo.

- id: jose-rodrigues-dos-santos/a-verdade-da-guerra
  synopsis: >
    Mais do que uma nova história, uma investigação filosófica e
    científica sobre se os correspondentes de guerra alguma vez conseguem
    transmitir a verdade da guerra - a cultura, os motivos e os mitos dos
    próprios correspondentes, e a forma como as organizações militares e a
    tecnologia moldam aquilo que é noticiado.

- id: jose-rodrigues-dos-santos/conversas-de-escritores
  synopsis: >
    Dez conversas com grandes romancistas internacionais entrevistados
    para a televisão portuguesa em 2009 - Dan Brown, Ian McEwan, Paulo
    Coelho, Isabel Allende, José Saramago, Günter Grass, Jeffrey Archer,
    Miguel Sousa Tavares, Sveva Casati Modignani e Luís Sepúlveda - com os
    bastidores do encontro com cada um deles.

- id: jose-rodrigues-dos-santos/a-ultima-entrevista-de-jose-saramago
  synopsis: >
    A última grande entrevista de José Saramago, gravada em outubro de
    2009 na biblioteca de Lisboa onde, em jovem, descobriu a ficção pela
    primeira vez, percorrendo toda a sua obra e as suas ideias sobre a
    escrita, a política, a vida e a morte. Morreria oito meses depois.

- id: jose-rodrigues-dos-santos/novas-conversas-de-escritores
  synopsis: >
    Um segundo volume de entrevistas a escritores - Philip Roth, Umberto
    Eco, Arturo Pérez-Reverte, Paul Auster, Peter Carey, Paul Theroux,
    Robin Cook, Jeffery Deaver, Ken Follett, Martin Amis, Hubert Reeves e
    Amin Maalouf - dando continuidade às conversas iniciadas em Conversas
    de Escritores (2010).
