# Português europeu (pt-PT) - eras. title, description e themes traduzidos
# (themes é prosa lida sob a placa da era, não decoração - ver
# docs/SCHEMA.md e docs/CURATION.md). O campo `note` não é prosa lida pelo
# leitor (não faz parte do conjunto que i18n_coverage.py verifica) e fica
# por traduzir, como nas restantes wings. Referências a obras repetem o
# título original, já em português.

- id: the-gradiva-years
  title: Os Anos da Gradiva
  themes:
    - Tomás Noronha
    - história e religião crípticas
    - Calouste Gulbenkian
    - Macau e a China em guerra
    - Moçambique colonial
  description: >
    Duas décadas sob uma só editora. A Gradiva publicou todos os livros
    desde [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
    de Guerra I]] (2001) até [[work:jose-rodrigues-dos-santos/o-jardim-dos-animais-com-alma|O
    Jardim dos Animais com Alma]] (2021), com uma única exceção: a sua
    estreia na ficção, [[work:jose-rodrigues-dos-santos/a-ilha-das-trevas|A
    Ilha das Trevas]] (2002), publicada primeiro pela Temas & Debates e só
    integrada no catálogo da Gradiva em 2007. Este período abrange toda a
    sua ascensão de jornalista a romancista mais vendido de Portugal:
    [[work:jose-rodrigues-dos-santos/o-codex-632|O Codex 632]] (2005)
    apresenta Tomás Noronha e é adquirido pela HarperCollins; [[work:jose-rodrigues-dos-santos/a-formula-de-deus|A
    Fórmula de Deus]] (2006) torna-se o título de referência da série. São
    publicados aqui onze romances de Tomás Noronha, a duologia de Calouste
    Gulbenkian, a Saga do Lótus em quatro volumes e as duas duologias
    passadas em Moçambique.

- id: the-planeta-years
  title: Os Anos da Planeta
  themes:
    - Tomás Noronha sob nova chancela
    - desinformação e o Partido Comunista Chinês
    - a Amesterdão de Espinosa
  description: >
    O Grupo Planeta torna-se sua editora em maio de 2022, com um livro
    novo já escrito e anunciado para esse outubro: [[work:jose-rodrigues-dos-santos/a-mulher-do-dragao-vermelho|A
    Mulher do Dragão Vermelho]], o décimo segundo romance de Tomás Noronha.
    Segue-se o seu primeiro livro autónomo para a nova chancela, [[work:jose-rodrigues-dos-santos/o-segredo-de-espinosa|O
    Segredo de Espinosa]] (2023), e a série Noronha continua com [[work:jose-rodrigues-dos-santos/o-protocolo-caos|O
    Protocolo Caos]] (2024) e [[work:jose-rodrigues-dos-santos/o-sexto-sentido|O
    Sexto Sentido]] (2025).
