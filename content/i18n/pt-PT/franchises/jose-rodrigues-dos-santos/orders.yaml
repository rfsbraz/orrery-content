# Overlay pt-PT das ordens de leitura: `name` e `rationale` apenas (nenhuma
# destas ordens usa `debated`). id, type, source e orderedWorkIds nunca se
# traduzem. Os títulos das obras já estão em português (o autor escreve em
# português), por isso o texto de exibição das referências internas a obras
# repete o título original.

- id: jose-rodrigues-dos-santos/tomas-noronha-in-order
  name: Tomás Noronha, a série completa
  rationale: >
    Os 14 romances de [[work:jose-rodrigues-dos-santos/o-codex-632|Tomás
    Noronha]] (2005-2025) são o núcleo desta estante e o seu maior fio
    narrativo: os casos de um historiador-criptanalista que atravessam
    criptografia real, física e história religiosa, numerados 1-14 pela
    editora e listados exatamente pela mesma ordem na própria página de
    série do Goodreads. Esta ordem coincide exatamente com a ordem derivada
    por defeito para estas 14 obras (sem empates de ano entre elas); o seu
    único contributo é nomear e isolar a série como um fio percorrível à
    parte da biografia de Gulbenkian, da Saga do Lótus e dos romances
    históricos autónomos que a rodeiam. O custo: ler apenas estes deixa de
    fora parte do trabalho mais aclamado do autor fora da série, incluindo o
    seu romance mais pessoal,
    [[work:jose-rodrigues-dos-santos/o-anjo-branco|O Anjo Branco]].

- id: jose-rodrigues-dos-santos/saga-do-lotus-in-order
  name: Saga do Lótus, por ordem
  rationale: >
    Quatro romances ligados (2015-2018) que seguem as mesmas quatro vidas -
    Satake Fukui, Lian-hua, Nadezhda e Artur Teixeira - desde o Japão, a
    China, a Rússia e Portugal da era revolucionária, atravessando a ascensão
    do fascismo até à Segunda Guerra Mundial e à queda de Macau português:
    uma verdadeira saga contínua, não quatro livros que apenas partilham
    cenário. Esta ordem coincide exatamente com a ordem derivada por defeito
    para estas quatro obras (2015, 2016, 2017, 2018, sem empate de ano a
    desfazer); o seu único contributo é nomear e isolar a saga como um arco
    percorrível à parte da série Tomás Noronha e dos romances históricos
    autónomos que a rodeiam. O custo: ler apenas estes quatro deixa de fora a
    série principal e o resto da ficção histórica do autor.

- id: jose-rodrigues-dos-santos/gulbenkian-duology-in-order
  name: A duologia de Calouste Gulbenkian, por ordem
  rationale: >
    [[work:jose-rodrigues-dos-santos/o-homem-de-constantinopla|O Homem de
    Constantinopla]] (19 de setembro de 2013) e
    [[work:jose-rodrigues-dos-santos/um-milionario-em-lisboa|Um Milionário em
    Lisboa]] (18 de novembro de 2013), com seis semanas de intervalo, contam
    uma única biografia de Calouste Gulbenkian em dois volumes: uma infância
    arménia na Constantinopla otomana até à construção do império petrolífero
    no primeiro livro; o genocídio arménio, a Segunda Guerra Mundial e os
    seus últimos anos na Lisboa neutral (1942-1955) no segundo. Uma crítica
    de leitor ao par afirma sem rodeios que "constituem apenas uma única
    obra, dividida em dois volumes, e não dois romances distintos" - uma obra
    lida ao contrário se lida fora de ordem. Ambos os livros estão datados de
    2013 em works.yaml, onde `published` regista apenas o ano, pelo que a
    colocação entre eles na ordem derivada por defeito é arbitrária e não
    garante colocar a ascensão do homem antes do seu exílio e morte. Leia
    primeiro O Homem de Constantinopla.

- id: jose-rodrigues-dos-santos/auschwitz-duology-in-order
  name: A duologia de Auschwitz, por ordem
  rationale: >
    [[work:jose-rodrigues-dos-santos/o-magico-de-auschwitz|O Mágico de
    Auschwitz]] introduz a deportação do mágico Herbert Levin para o campo e
    o percurso do soldado português Francisco Latino até à elite nazi, em
    busca de uma mulher russa levada pelas SS, e os três caminhos convergem
    dentro do campo.
    [[work:jose-rodrigues-dos-santos/o-manuscrito-de-birkenau|O
    Manuscrito de Birkenau]] abre já com os três aliados dentro do campo, a
    organizar a revolta do Sonderkommando, e é descrito por um crítico
    francês como "a continuação e o desfecho" do seu par. Lê-lo primeiro
    lança o leitor numa aliança e num plano já em curso, sem o encontro que
    os explica. Ambos os livros estão datados de 2020 em works.yaml, onde
    `published` regista apenas o ano, pelo que a colocação entre eles na
    ordem derivada por defeito é arbitrária. Leia primeiro O Mágico de
    Auschwitz.

- id: jose-rodrigues-dos-santos/cronicas-de-guerra-in-order
  name: A trilogia de reportagem de guerra, por ordem
  rationale: >
    Três volumes de não-ficção retirados da própria tese de doutoramento do
    autor sobre reportagem de guerra (Universidade Nova de Lisboa), descritos
    nesses exatos termos no seu próprio site:
    [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|
    Crónicas de Guerra I]] é "o primeiro de uma série em três partes sobre
    reportagem de guerra",
    [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade|
    Crónicas de Guerra II]] "o segundo", e
    [[work:jose-rodrigues-dos-santos/a-verdade-da-guerra|A Verdade da
    Guerra]] "o terceiro". Os dois primeiros são uma história da reportagem
    de guerra, da Guerra da Crimeia até ao Vietname e à Guerra do Golfo; o
    terceiro passa da história a uma investigação filosófica sobre se os
    correspondentes alguma vez conseguem transmitir a verdade da guerra, e
    lê-se como uma conclusão que os dois primeiros são construídos para
    merecer. Crónicas de Guerra II e A Verdade da Guerra estão ambos datados
    de 2002 em works.yaml, onde `published` regista apenas o ano, pelo que a
    colocação entre eles na ordem derivada por defeito é arbitrária; esta
    ordem resolve-a pela sequência que o próprio site do autor indica.
