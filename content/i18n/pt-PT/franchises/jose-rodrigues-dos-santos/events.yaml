# Português europeu (pt-PT) - eventos da franquia. title e description
# traduzidos para todas as 5 entradas. Onde a imprensa portuguesa citada em
# `sources` regista as próprias palavras dos intervenientes (a frase
# improvisada de Rodrigues dos Santos sobre as câmaras de gás, a citação de
# Irene Pimentel, a de João Pinto Coelho, a de Roger Lee de Jesus), estas
# citações foram recuperadas dos artigos originais em português, não
# retraduzidas a partir da paráfrase inglesa da base.
#
# jrs-saga-do-lotus-origin-2016 (organisation: epigraph) repete `quote` sem
# alteração: o campo de base já é o português original da entrevista ao
# Diário de Notícias (não uma tradução), pelo que este overlay reproduz o
# mesmo texto em vez de o traduzir.

- id: jrs-cronicas-de-guerra-origin-2001
  title: Um doutoramento sobre reportagem de guerra transforma-se num estudo em três partes
  description: >
    O doutoramento de Rodrigues dos Santos em Ciências da Comunicação, na
    Universidade Nova de Lisboa, debruça-se sobre a história da reportagem
    de guerra; a dissertação dá origem a três volumes de não-ficção
    publicados em rápida sucessão, [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
    de Guerra I]] (2001, da Guerra da Crimeia à Guerra Civil de Espanha),
    [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade|Crónicas
    de Guerra II]] (2002, do Vietname à Guerra do Golfo) e [[work:jose-rodrigues-dos-santos/a-verdade-da-guerra|A
    Verdade da Guerra]] (2002, uma investigação filosófica sobre se um
    correspondente de guerra pode alguma vez transmitir a verdade da
    guerra). Os três livros transformam a própria investigação de
    pós-graduação de um jornalista em atividade, e duas décadas da sua
    reportagem de guerra de Timor à Bósnia, no único estudo académico
    sustentado que publica fora da ficção.

- id: jrs-o-ultimo-segredo-church-row-2011
  title: A Igreja Católica chama "intolerante" ao seu romance sobre Jesus; ele responde que nenhum facto foi contestado
  description: >
    Dias depois do lançamento de [[work:jose-rodrigues-dos-santos/o-ultimo-segredo|O
    Último Segredo]], o Secretariado Nacional da Pastoral da Cultura da
    Igreja portuguesa acusa Rodrigues dos Santos de tentar, "com grande
    estardalhaço", "arrombar uma porta há muito aberta", e de condensar
    "várias imprecisões" em três linhas sobre a formação da Bíblia e a
    fiabilidade da doutrina católica. Respondendo através da agência Lusa,
    ele chama à acusação "muito interessante", já que equivale a "uma
    admissão implícita de que as afirmações do livro são verdadeiras": nada
    disso, diz, é novidade para os académicos ou para a própria Igreja,
    "quem não sabe é o público. Limitei-me a levar esta informação ao
    grande público." A troca de argumentos prolonga-se durante semanas na
    imprensa; à quarta edição, o romance já vendeu 80 000 exemplares.

- id: jrs-saga-do-lotus-origin-2016
  title: "Entrevista ao Diário de Notícias, sobre O Pavilhão Púrpura (23 de maio de 2016)"
  quote: >
    O facto de que o fascismo é um movimento que tem origem marxista, por
    exemplo, é uma das demonstrações feitas nesta saga que poderá parecer
    polémica.
  description: >
    O fascismo, diz, tem origem marxista: uma das afirmações
    deliberadamente "politicamente incorretas" que, segundo ele, [[work:jose-rodrigues-dos-santos/as-flores-de-lotus|As
    Flores de Lótus]] e O Pavilhão Púrpura se propõem demonstrar, a par do
    seu argumento de que o nazismo bebeu de ideias já correntes nas
    democracias ocidentais do entreguerras (cita a proposta do Carnegie
    Institute, em 1911, nos Estados Unidos, para gasear os deficientes).
    Enquadra toda a saga como um regresso deliberado ao colapso da
    legitimidade democrática entre os anos 1920 e 1940, escrita, nas suas
    palavras, porque os paralelos com o presente são inconfundíveis.

- id: jrs-auschwitz-holocaust-framing-2020
  title: O seu relato sobre as câmaras de gás atrai a repreensão de historiadores do Holocausto
  description: >
    A promover [[work:jose-rodrigues-dos-santos/o-magico-de-auschwitz|O
    Mágico de Auschwitz]] e [[work:jose-rodrigues-dos-santos/o-manuscrito-de-birkenau|O
    Manuscrito de Birkenau]] na Grande Entrevista da RTP, Rodrigues dos
    Santos improvisa uma versão dramatizada do raciocínio das cúpulas
    nazis para as câmaras de gás: "A certa altura, há alguém que diz: eh,
    pá, estão nos guetos, estão a morrer de fome, não podemos alimentá-los.
    Se é para morrer, mais vale morrer de uma forma mais humana. E porque
    não com gás?" Descreve também os prisioneiros de Auschwitz-Birkenau
    como capazes de uma certa adaptação à vida do campo. Semanas depois, as
    declarações chegam às redes sociais e atraem duras críticas de
    historiadores identificados: Irene Pimentel fala em "chocante
    ignorância e desfaçatez"; o romancista João Pinto Coelho, que já
    visitou o campo e trabalhou com sobreviventes e investigadores, chama
    "obsceno" ao argumento da "adaptação", já que os prisioneiros
    "resistiam semanas, por vezes dias", e diz que a historiografia sobre
    os motivos da Solução Final está esclarecida há muito. Rodrigues dos
    Santos responde, em carta aberta publicada na Sábado, que nunca chamou
    humana à Solução Final, tendo apenas exposto, em termos figurados, o
    raciocínio que acredita ter movido as cúpulas nazis, citando um
    documento histórico em sua defesa; Pinto Coelho contrapõe que um
    documento escrito por uma só pessoa não pode qualificar o pensamento de
    um regime.

- id: jrs-colombo-historians-dispute-2023
  title: Um historiador chama "vergonha nacional" à sua teoria sobre Colombo e à sua tese sobre o fascismo
  description: >
    Entrevistado no Jornal da 2 da RTP2 sobre a adaptação televisiva de
    [[work:jose-rodrigues-dos-santos/o-codex-632|O Codex 632]], Rodrigues
    dos Santos repete a premissa do romance de que Cristóvão Colombo seria
    provavelmente português e não genovês, acrescentando que são muitas
    vezes os romancistas, não os académicos, que "vêm desmistificar e
    derrubar" mitos históricos recebidos. A sua defesa, na mesma
    entrevista, é que quando o romance surgiu em 2005 já havia
    historiadores que se tinham manifestado publicamente a dizer que também
    achavam que Colombo era português. O historiador Roger Lee de Jesus, da
    Universidade de Coimbra, responde nas redes sociais que a afirmação é
    uma "vergonha nacional", acusando-o de "difundir teorias da conspiração
    da História, sem qualquer sustento nem credibilidade" contra um
    consenso historiográfico estabelecido, e, em declarações à Visão,
    estende a acusação à tese de [[work:jose-rodrigues-dos-santos/as-flores-de-lotus|As
    Flores de Lótus]] sobre a origem marxista do fascismo, a mesma tese que
    ele próprio tinha defendido um ano antes na sua segunda tese de
    doutoramento, na Sorbonne.
