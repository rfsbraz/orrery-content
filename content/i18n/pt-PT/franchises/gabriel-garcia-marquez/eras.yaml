# Português europeu (pt-PT) - eras. Cada entrada leva `title`, `description`
# e `themes` (docs/SCHEMA.md; scripts/i18n_coverage.py conta exatamente estes
# três campos). `note:` não é traduzido: nenhum overlay pt-PT deste catálogo
# o traduz (confirmado em miguel-de-cervantes/eras.yaml, cujo próprio
# cabeçalho regista a mesma regra) - o campo é uma justificação de fronteira
# dirigida a quem cura a ala, não prosa que o leitor vê.
#
# TÍTULOS DE OBRAS: ver a regra fixada no cabeçalho de franchise.yaml deste
# mesmo overlay - título português publicado (editions.yaml) quando existe
# edição real, espanhol original quando não existe. As quatro obras citadas
# abaixo têm todas edição pt-PT.
#
# CITAÇÕES DIRETAS. Duas citações da crítica académica em inglês (Raymond
# Leslie Williams; a Gale's Literature and Its Times) mantêm-se em inglês,
# tal como a fonte as registou - são as palavras exatas de um crítico
# nomeado, não prosa deste catálogo, o mesmo princípio que já mantém as
# citações em espanhol de Cervantes (e aqui, a de García Márquez sobre "en
# verdad un solo libro") na língua original em que foram ditas.

- id: macondo-cycle
  title: O Ciclo de Macondo
  themes:
    - Macondo
    - La Violencia e as guerras civis
    - a povoação ribeirinha sem nome
    - solidão
    - família e herança
  description: >
    Os cinco livros que a crítica agrupa como o ciclo de Macondo, el ciclo
    de Macondo em espanhol: as ficções construídas sobre uma única
    povoação caribenha inventada e as suas vizinhanças, que se abrem com
    [[work:gabriel-garcia-marquez/la-hojarasca|A Revoada]], onde Macondo
    aparece pela primeira vez, e se encerram com
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cem Anos de
    Solidão]]. Raymond Leslie Williams, no capítulo que escreve sobre o
    ciclo em A Companion to Gabriel García Márquez, chama a este último
    romance "the culmination of the 'cycle of Macondo' fictions that
    García Márquez began constructing in the early 1950s and continued to
    elaborate, in short fictions and novels, until 1967". A Literature and
    Its Times, da Gale, traça o mesmo período, com o ciclo "beginning with
    his first one, Leafstorm (1955), and lasting through the release of
    his masterpiece One Hundred Years of Solitude (1967)". Entre estes
    dois livros situam-se
    [[work:gabriel-garcia-marquez/el-coronel-no-tiene-quien-le-escriba|Ninguém
    Escreve ao Coronel]],
    [[work:gabriel-garcia-marquez/la-mala-hora|A Hora Má: O Veneno da
    Madrugada]] e
    [[work:gabriel-garcia-marquez/los-funerales-de-la-mama-grande|Os
    Funerais da Mamã Grande]], os três livros que o próprio García Márquez
    disse serem "en verdad un solo libro", na verdade um único livro.
