# Português europeu (pt-PT) - sinopses. Os títulos de obras NÃO são
# traduzidos aqui (docs/SCHEMA.md, "Never translate a published title"): um
# título traduzido só existe como edição real, em editions.yaml - mesma
# convenção já fixada em miguel-de-cervantes/works.yaml e
# haruki-murakami/works.yaml para um original não-inglês. `note:` e
# `translationNote:` também não se traduzem aqui: nenhum overlay pt-PT deste
# catálogo os traduz (confirmado nos dois ficheiros acima) - `note` não é lido
# pela aplicação no ecrã da obra, e translationNote "renders nowhere in the
# app yet" pela própria definição em docs/SCHEMA.md.
#
# Nenhuma sinopse desta ala nomeia outra obra por título (nenhuma referência
# interna do tipo work:id em nenhuma das 25 entradas), pelo que a questão do
# título português vs. espanhol original não se põe dentro deste ficheiro -
# põe-se em franchise.yaml, eras.yaml, events.yaml, orders.yaml e no ficheiro
# do autor, onde essas referências existem (ver o cabeçalho de
# franchise.yaml para a regra seguida).

- id: gabriel-garcia-marquez/la-hojarasca
  synopsis: >
    Um avô, a filha e o neto pequeno velam o corpo de um médico francês
    caído em desgraça na povoação fictícia de Macondo, aguardando a hora
    do enterro que toda a povoação lhes recrimina por terem permitido,
    enquanto cada um dos três revive em silêncio o que ali trouxe o
    médico.

- id: gabriel-garcia-marquez/el-coronel-no-tiene-quien-le-escriba
  synopsis: >
    Um coronel envelhecido e empobrecido e a mulher, asmática, esperam,
    ano após ano, pela pensão do Estado que lhe fora prometida pelos
    serviços prestados numa guerra civil décadas antes, caminhando até ao
    cais todas as sextas-feiras para receber um barco do correio que nunca
    traz a carta.

- id: gabriel-garcia-marquez/la-mala-hora
  synopsis: >
    Panfletos anónimos aparecem de um dia para o outro nas portas de toda
    uma povoação ribeirinha sem nome, expondo os segredos e mexericos de
    cada morador, e a resposta cada vez mais dura do presidente da câmara
    para descobrir quem está por detrás deles empurra a povoação para a
    violência.

- id: gabriel-garcia-marquez/cien-anos-de-soledad
  synopsis: >
    Sete gerações da família Buendía fundam, constroem e acabam por perder
    a povoação de Macondo, numa história que repete os seus próprios
    nomes, obsessões e solidões ao longo de cem anos.

- id: gabriel-garcia-marquez/el-otono-del-patriarca
  synopsis: >
    As décadas de poder absoluto de um ditador caribenho sem nome são
    contadas e recontadas por pontos de vista sobrepostos e mutáveis,
    depois de a sua morte ser descoberta no próprio palácio em ruínas,
    compondo um único retrato da tirania a partir de rumores e memórias
    contraditórias.

- id: gabriel-garcia-marquez/cronica-de-una-muerte-anunciada
  synopsis: >
    Um repórter reconstrói, testemunha a testemunha, a manhã em que toda
    uma pequena povoação sabia que dois irmãos iam matar um homem por
    supostamente ter desonrado a irmã, e mesmo assim não conseguiu
    impedi-lo.

- id: gabriel-garcia-marquez/el-amor-en-los-tiempos-del-colera
  synopsis: >
    Um homem espera mais de cinquenta anos, através do casamento dela com
    outro homem e de centenas de casos amorosos seus, para retomar o
    namoro que uma mulher rompera com ele na juventude de ambos, sobre o
    pano de fundo de uma cidade portuária caribenha que vive sob a ameaça
    recorrente da cólera.

- id: gabriel-garcia-marquez/el-general-en-su-laberinto
  synopsis: >
    A última viagem de Simón Bolívar, já fisicamente arruinado, sete meses
    a descer o rio Madalena rumo à costa, despojado do poder e da união
    das nações a que dedicara a vida, encerra os seus últimos meses antes
    da morte.

- id: gabriel-garcia-marquez/del-amor-y-otros-demonios
  synopsis: >
    Num porto colonial caribenho, a jovem filha de um marquês é mordida
    por um cão raivoso e, à medida que o medo da doença se espalha, passa
    a ser suspeita de possessão demoníaca e entregue à Igreja para ser
    exorcizada.

- id: gabriel-garcia-marquez/memoria-de-mis-putas-tristes
  synopsis: >
    Um jornalista solteiro de noventa anos decide oferecer-se, como
    presente de aniversário, uma noite com uma adolescente virgem, e em
    vez disso cai numa devoção inesperada e casta que desfaz a solidão de
    toda a sua vida.

- id: gabriel-garcia-marquez/en-agosto-nos-vemos
  synopsis: >
    Todos os agostos, no aniversário da morte da mãe, uma mulher feliz no
    seu casamento de vinte e sete anos apanha sozinha o ferry para a ilha
    caribenha onde a mãe está sepultada, e regressa, ano após ano, com um
    amante diferente.

- id: gabriel-garcia-marquez/los-funerales-de-la-mama-grande
  synopsis: >
    Oito contos passados sobretudo em Macondo e na mesma povoação
    ribeirinha sem nome de La mala hora, terminando com o conto-título: a
    morte e os funerais desmedidos de uma matriarca fictícia que governou
    discretamente toda uma província durante décadas, narrados numa voz
    deliberadamente exagerada, de pregoeiro de feira, que satiriza o poder
    latino-americano a todos os níveis.

- id: gabriel-garcia-marquez/erendira
  synopsis: >
    Uma novela-título - uma adolescente vendida para a prostituição
    forçada pela própria avó depois de incendiar por acidente a casa da
    velha, e o vagabundo que se apaixona por ela e tenta libertá-la - a
    par de seis contos mais breves: um anjo que cai no quintal de uma
    família costeira pobre, um gigante afogado cuja beleza transforma a
    aldeia de pescadores que o encontra, um navio fantasma, um vigarista
    ambulante que negoceia milagres, uma povoação costeira decadente
    transformada por um forasteiro misterioso que leva um homem local a
    um mundo submerso e intemporal sob as águas, e a paixão ilícita de um
    senador terminal por uma jovem que o próprio pai lhe entrega durante a
    sua campanha eleitoral.

- id: gabriel-garcia-marquez/ojos-de-perro-azul
  synopsis: >
    A ficção breve mais antiga de García Márquez, escrita e publicada pela
    primeira vez em jornais entre 1947 e 1955, quando ainda tinha vinte e
    poucos anos, reunida em livro duas décadas depois - incluindo um dos
    primeiros contos a apresentar a sua povoação fictícia de Macondo.

- id: gabriel-garcia-marquez/doce-cuentos-peregrinos
  synopsis: >
    Doze contos ligados entre si, na sua maioria escritos ao longo das
    décadas de 1970 e 80 mas só publicados em livro em 1992, que seguem
    personagens latino-americanas à deriva e deslocadas pela Europa.

- id: gabriel-garcia-marquez/relato-de-un-naufrago
  synopsis: >
    O relato verdadeiro, contado a García Márquez pelo próprio marinheiro,
    de dez dias à deriva numa jangada sem comida nem água depois de cair
    de um contratorpedeiro da marinha colombiana, e do que a história do
    marinheiro revelou sobre a verdadeira causa do naufrágio.

- id: gabriel-garcia-marquez/el-olor-de-la-guayaba
  synopsis: >
    Uma conversa em forma de livro, gravada ao longo de vários anos, em
    que García Márquez percorre a própria vida, os seus métodos de
    trabalho e a política, com um amigo próximo e colega jornalista.

- id: gabriel-garcia-marquez/la-aventura-de-miguel-littin-clandestino-en-chile
  synopsis: >
    Contado a García Márquez pelo próprio protagonista: o regresso
    disfarçado e clandestino do cineasta chileno exilado Miguel Littín ao
    Chile de Pinochet, doze anos depois de o ter deixado, para filmar em
    segredo um documentário sobre as condições sob a ditadura.

- id: gabriel-garcia-marquez/noticia-de-un-secuestro
  synopsis: >
    Um relato de não-ficção sobre uma vaga de sequestros levada a cabo
    pelo cartel de Medellín de Pablo Escobar contra colombianos de
    destaque no início da década de 1990, reconstruído a partir do próprio
    testemunho dos reféns.

- id: gabriel-garcia-marquez/vivir-para-contarla
  synopsis: >
    O primeiro e, como se veio a revelar, único volume do relato que
    García Márquez fez da própria vida, cobrindo a infância e juventude na
    costa caribenha até aos anos imediatamente anteriores à sua partida da
    Colômbia para a Europa.

- id: gabriel-garcia-marquez/yo-no-vengo-a-decir-un-discurso
  synopsis: >
    Vinte e dois discursos e alocuções do próprio García Márquez,
    abrangendo o período entre 1944 e 2007, incluindo a sua alocução de
    aceitação do Nobel de 1982, "La soledad de América Latina."

- id: gabriel-garcia-marquez/obra-periodistica
  synopsis: >
    Uma antologia em cinco volumes que reúne a obra jornalística do
    próprio García Márquez ao longo de quatro décadas de trabalho na
    imprensa, desde as suas primeiras colunas na costa caribenha até à
    reportagem mais tardia para publicações colombianas e internacionais.

- id: gabriel-garcia-marquez/diatriba-de-amor-contra-un-hombre-sentado
  synopsis: >
    Um único e longo monólogo: uma mulher confronta o marido de décadas,
    sentado em silêncio no palco durante toda a peça, com tudo o que
    ficou por resolver no casamento de ambos.

- id: gabriel-garcia-marquez/el-cataclismo-de-damocles
  synopsis: >
    Um único discurso contra as armas nucleares, proferido no aniversário
    do bombardeamento de Hiroshima e mais tarde publicado como texto breve
    independente.

- id: gabriel-garcia-marquez/viva-sandino
  synopsis: >
    Um "relato cinematográfico" (narrativa/argumento cinematográfico)
    sobre a revolução sandinista na Nicarágua.
