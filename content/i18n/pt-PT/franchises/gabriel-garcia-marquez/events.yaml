# Português europeu (pt-PT) - eventos. `title` e `description` (docs/SCHEMA.md;
# scripts/i18n_coverage.py). Nenhum dos oito eventos desta ala tem campo
# `quote` (organisation não é epigraph em nenhum), por isso não há esse
# campo a traduzir aqui.
#
# TÍTULOS DE OBRAS: mesma regra do resto desta ala (ver franchise.yaml) -
# título português publicado quando existe edição pt-PT real, espanhol
# original quando não existe.
#
# CITAÇÕES DIRETAS. Onde a própria base cita García Márquez em espanhol (com
# glosa inglesa entre parênteses), mantém-se o espanhol e traduz-se a glosa
# para português - "Este pueblo de mierda" abaixo é o único caso neste
# ficheiro. Onde a base só regista uma versão inglesa, sem original espanhol
# preservado (o revisor de La mala hora, a entrevista sobre El amor en los
# tiempos del cólera, a declaração de Rodrigo García em 2024), não há
# original a citar - é texto relatado, traduzido aqui como qualquer outra
# prosa, tal como o próprio ficheiro base o apresenta em inglês por não ter
# preservado o espanhol de origem.

- id: garcia-marquez-mala-hora-esso-prize-1961
  title: Um manuscrito reescrito ganha o Prémio Esso de Romance da Colômbia
  description: >
    Escrito em Paris sob o título de trabalho "Este pueblo de mierda"
    ("Esta Povoação de Merda"), o manuscrito que se tornaria
    [[work:gabriel-garcia-marquez/la-mala-hora|A Hora Má: O Veneno da
    Madrugada]] foi reescrito e apresentado ao Premio Esso de Novela, a
    etapa colombiana de um concurso literário latino-americano patrocinado
    pela petrolífera; venceu em 1961, um ano inteiro antes de qualquer
    edição do romance chegar às livrarias. O prémio surgiu no mesmo
    período discreto do próprio debute modesto de
    [[work:gabriel-garcia-marquez/el-coronel-no-tiene-quien-le-escriba|Ninguém
    Escreve ao Coronel]], em 1961 - o tipo de reconhecimento que chegou
    anos antes de
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cem Anos de
    Solidão]] o tornar famoso, não depois.

- id: garcia-marquez-mala-hora-disavowed-edition-1962
  title: As correções de um revisor levam a renegar toda uma edição
  description: >
    A primeira tiragem de
    [[work:gabriel-garcia-marquez/la-mala-hora|A Hora Má: O Veneno da
    Madrugada]], publicada em Madrid em 1962 pela Talleres de Artes
    Gráficas Luis Pérez, só chegou aos leitores depois de um revisor ter,
    segundo o próprio relato posterior de García Márquez, "alterado certas
    palavras e enrijecido o estilo em nome da pureza da língua." Ele
    renegou essa edição por completo. Quatro anos depois, a editora
    mexicana Ediciones Era publicou uma segunda edição que restaurava a
    sua redação original - "as incorreções idiomáticas e as atrocidades de
    estilo," como ele próprio a descreveu - que reconheceu como a
    verdadeira primeira edição do romance, apesar de ter chegado à
    imprensa em segundo lugar.

- id: garcia-marquez-vargas-llosa-thesis-1971
  title: A tese de doutoramento de um amigo torna-se o primeiro estudo sério da sua obra
  description: >
    Mario Vargas Llosa, ainda um amigo próximo na altura, doutora-se pela
    Universidad Complutense de Madrid com García Márquez: historia de un
    deicidio, um estudo crítico de livro inteiro sobre a ficção de García
    Márquez até
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cem Anos de
    Solidão]] - o primeiro tratamento académico sério da sua obra.
    Publicado no mesmo ano, é o momento mais amistoso da relação pública
    entre os dois escritores; cinco anos depois, Vargas Llosa deu um murro
    na cara de García Márquez e os dois não voltaram a falar-se durante
    décadas.

- id: garcia-marquez-colera-parents-courtship-1985
  title: Um namoro real transforma-se numa história de amor de cinquenta anos
  description: >
    [[work:gabriel-garcia-marquez/el-amor-en-los-tiempos-del-colera|O Amor
    nos Tempos de Cólera]] tira os seus jovens namorados, Fermina Daza e
    Florentino Ariza, diretamente do namoro real dos próprios pais de
    García Márquez: o pai, Gabriel Eligio García, conquistou a mãe, Luisa
    Santiaga Márquez, contra a vontade da família dela, com serenatas de
    violino, poemas de amor e cartas, depois de o pai dela a ter enviado
    para longe para os separar. García Márquez apontou numa entrevista a
    única diferença deliberada: "A única diferença é que [os meus pais] se
    casaram. E logo que se casaram, deixaram de ser interessantes como
    figuras literárias." A metade da história de amor do
    romance passada na velhice vem de uma fonte sem qualquer relação: a
    notícia de jornal sobre dois norte-americanos idosos, cada um casado
    com outra pessoa, assassinados por um barqueiro em Acapulco depois de
    o seu romance secreto de décadas só ter vindo à luz com as suas
    mortes.

- id: garcia-marquez-general-laberinto-bolivar-outrage-1989
  title: Um Bolívar desmitificado indigna parte da América Latina
  description: >
    [[work:gabriel-garcia-marquez/el-general-en-su-laberinto|O General no
    Seu Labirinto]] rompe com a imagem heroica tradicional de Simón
    Bolívar, "El Libertador," retratando em vez disso um homem
    prematuramente envelhecido, fisicamente doente e mentalmente exausto
    nos seus últimos meses, incluindo pormenores íntimos que os
    historiadores convencionalmente deixavam de fora. O romance indignou
    inicialmente figuras proeminentes de toda a América Latina, que
    argumentaram que dava ao mundo exterior uma imagem diminuída de uma
    das figuras fundadoras da região; outros leram-no como uma correção
    necessária, um desafio a um continente mais confortável com o mito do
    que com o homem.

- id: garcia-marquez-vargas-llosa-thesis-reissued-2007
  title: Um estudo hostil torna-se uma introdução amistosa
  description: >
    A tese de doutoramento de Mario Vargas Llosa sobre García Márquez, de
    1971, García Márquez: historia de un deicidio, é cinco anos anterior
    ao murro de 1976 que pôs fim à sua amizade, e o próprio autor não
    voltou a mencioná-la publicamente durante as três décadas seguintes.
    Em 2007, pelo 40.º aniversário de
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cem Anos de
    Solidão]], Vargas Llosa aceitou que parte desse mesmo estudo servisse
    de introdução à edição comemorativa lançada em toda a Espanha e
    América Latina; Historia de un deicidio foi reeditada separadamente no
    mesmo ano, como parte das suas próprias obras completas. Nenhum dos
    dois falou publicamente sobre uma reconciliação.

- id: garcia-marquez-cien-anos-netflix-2019
  title: O espólio vende os direitos de adaptação que ele recusou vender em vida
  description: >
    García Márquez recusou, pelo resto da vida, vender os direitos de
    adaptação de
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cem Anos de
    Solidão]], por acreditar que nenhum filme conseguiria conter o romance
    na sua duração. A Netflix adquiriu os direitos ao espólio em março de
    2019 e, com a condição da família de que fosse filmada na Colômbia, em
    espanhol, com atores colombianos, lançou a primeira metade de uma
    adaptação de 16 episódios a 11 de dezembro de 2024, produzida com os
    filhos, Rodrigo e Gonzalo García Barcha, como produtores executivos. É
    a primeira adaptação do romance para os ecrãs, de qualquer tipo.

- id: garcia-marquez-en-agosto-nos-vemos-published-2024
  title: Publicado contra a sua vontade explícita, uma década depois da sua morte
  description: >
    García Márquez pedira que o manuscrito inacabado de
    [[work:gabriel-garcia-marquez/en-agosto-nos-vemos|En agosto nos
    vemos]], que existia em cinco rascunhos, fosse destruído após a sua
    morte. Os filhos, Rodrigo e Gonzalo García Barcha, releram em vez
    disso os rascunhos guardados no Harry Ransom Center, julgaram o
    romance digno de publicação, e lançaram-no a 6 de março de 2024, no
    97.º aniversário do seu nascimento. "Pensámos nisso durante talvez três
    segundos - seria uma traição aos meus pais, à vontade do meu pai?"
    disse Rodrigo García. "E decidimos que sim, que era uma traição. Mas é
    para isso que servem os filhos." A decisão atraiu críticas
    públicas de leitores e críticos que defenderam que o livro deveria ter
    ficado inédito; as críticas ao próprio romance foram mistas. Foram
    feitas mais de 250 000 reservas em toda a América Latina antes do
    lançamento.
