# Português europeu (pt-PT) - `name`, `rationale` e `debated` (docs/SCHEMA.md;
# scripts/i18n_coverage.py). `debated` chega ao leitor no disclosure do
# seletor de ordens, tal como qualquer outro campo de prosa (docs/SCHEMA.md,
# secção translationNote) - traduz-se como o resto.
#
# TÍTULOS DE OBRAS: mesma regra do resto desta ala (ver franchise.yaml) -
# título português publicado quando existe edição pt-PT real. As três obras
# citadas abaixo têm todas edição pt-PT.

- id: gabriel-garcia-marquez/tres-libros
  name: "Três livros, uma só história"
  rationale: >
    O único agrupamento desta bibliografia que o próprio García Márquez
    nomeou. De
    [[work:gabriel-garcia-marquez/el-coronel-no-tiene-quien-le-escriba|Ninguém
    Escreve ao Coronel]],
    [[work:gabriel-garcia-marquez/los-funerales-de-la-mama-grande|Os
    Funerais da Mamã Grande]] e
    [[work:gabriel-garcia-marquez/la-mala-hora|A Hora Má: O Veneno da
    Madrugada]], disse claramente que eram "na verdade um único livro: um
    mesmo tema, as mesmas personagens, o mesmo ambiente, que se repetem e
    se misturam." Lida por esta ordem, para um leitor curioso sobre o que
    essa afirmação realmente significa na página: um coronel à espera de
    uma carta de pensão que nunca chega, a Mamã Grande da mesma povoação
    ribeirinha sem nome e o seu funeral, e os panfletos anónimos que
    empurram essa mesma povoação para a violência, todos escritos no
    "realismo tradicional" que ele contrapunha ao que viria depois. O
    custo: estes três situam-se no início da sua carreira e partilham um
    único registo: sem realismo mágico, sem os cem anos de Macondo, nada
    do que o tornou famoso. Esta ordem também não reordena nada - são os
    mesmos três livros na mesma sequência que a ordem derivada por defeito
    já lhes dá, isolados dos outros vinte e dois para que um leitor possa
    percorrer exatamente esta afirmação e nada mais.
  debated:
    - >
      Idêntica à ordem de publicação das três obras, e a um trecho da
      ordem derivada por defeito sem mais nada intercalado (nada mais
      nesta bibliografia foi publicado entre Ninguém Escreve ao Coronel,
      em 1961, e Cem Anos de Solidão, em 1967). O seu único contributo é
      o filtro e o rótulo do próprio autor, exatamente como em
      chuck-palahniuk/horror-trilogy; um leitor que siga a ordem por
      defeito não perde nada além do rótulo ao ignorá-la.
    - >
      Os Funerais da Mamã Grande e A Hora Má: O Veneno da Madrugada
      apresentam ambos uma mera datação "1962" em todas as fontes
      consultadas, sem mês ou data de composição encontrada que permita
      determinar qual foi escrita primeiro. A sequência acima segue a
      ordem em que a própria citação de García Márquez as nomeia
      (Ninguém Escreve ao Coronel, depois Os Funerais da Mamã Grande,
      depois A Hora Má), e não uma afirmação cronológica sustentada sobre
      este par; nenhuma fonte consultada estabelece uma prioridade real
      entre as duas, e esta ordem não a reivindica.
