# Português europeu (pt-PT) - períodos criativos.
# Traduzem-se o título do período, os temas (etiquetas de exibição) e a
# descrição. Os ids das referências inline ficam intocados; o texto visível
# dessas referências já é o título português original. A frase "inteiramente
# dedicada ao romance" na primeira entrada recupera a própria autobiografia
# de Saramago para o Nobel ("a década de 80 foi inteiramente dedicada ao
# romance"), lida diretamente em josesaramago.org/biografia/, em vez de
# traduzir de novo a paráfrase inglesa. As citações do New York Times e do
# Guardian na segunda entrada são de imprensa anglófona sem original
# português para recuperar, e foram traduzidas como qualquer outra prosa.
# `note` fica na língua de base: é uma anotação de curadoria, não prosa para
# o leitor (mesma regra já aplicada às notas de works.yaml nesta coleção).

- id: the-historical-novels
  title: Os Romances Históricos
  themes: [história oficial versus o registo, a Inquisição e o império, os heterónimos de Pessoa, identidade ibérica, poder institucional]
  description: >
    A própria autobiografia de Saramago para o Nobel marca "os anos 80" como
    a década "inteiramente dedicada ao romance" (à exceção de uma peça de
    teatro, A Segunda Vida de Francisco de Assis, 1987):
    [[work:jose-saramago/levantado-do-chao|Levantado do Chão]], onde diz ter
    nascido o modo de narrar que caracteriza os seus romances, depois
    [[work:jose-saramago/memorial-do-convento|Memorial do Convento]],
    [[work:jose-saramago/o-ano-da-morte-de-ricardo-reis|O Ano da Morte de
    Ricardo Reis]], [[work:jose-saramago/a-jangada-de-pedra|A Jangada de
    Pedra]] e
    [[work:jose-saramago/historia-do-cerco-de-lisboa|História do Cerco de
    Lisboa]]. Cada um mede uma história inventada contra um registo histórico
    real: o latifúndio alentejano, a construção do convento de Mafra, a
    Lisboa fascista de Pessoa, o lugar da Península Ibérica na Europa, o
    cerco medieval de Lisboa. A Encyclopaedia Britannica agrupa
    [[work:jose-saramago/o-evangelho-segundo-jesus-cristo|O Evangelho Segundo
    Jesus Cristo]] (1991) com A Jangada de Pedra como partilhando a mesma
    prática, "colocando parábolas fantasiosas sobre um pano de fundo
    histórico realista" - aqui, história bíblica em vez de nacional. O veto
    do governo português a O Evangelho, retirado em 1992 da candidatura a um
    prémio literário europeu por ofender os católicos, encerrou esta fase e
    mandou Saramago para o exílio em Lanzarote.

- id: the-allegorical-novels
  title: Os Romances Alegóricos
  themes: [a cidade sem nome, a burocracia e a perda do indivíduo, a epidemia como diagnóstico social, identidade e duplicação, mortalidade]
  description: >
    Dois obituários escritos de forma independente assinalam
    [[work:jose-saramago/ensaio-sobre-a-cegueira|Ensaio sobre a Cegueira]]
    (1995) como a abertura de uma fase mais alegórica na ficção de Saramago.
    O New York Times: "nos últimos anos, a ficção de Saramago tornou-se mais
    marcadamente alegórica", citando o próprio Blindness como exemplo. O
    Guardian: os temas desta fase "eram filosóficos e, cada vez mais,
    milenaristas", citando
    [[work:jose-saramago/todos-os-nomes|Todos os Nomes]] (1997) e
    [[work:jose-saramago/a-caverna|A Caverna]] (2000). A fase prossegue com
    [[work:jose-saramago/o-homem-duplicado|O Homem Duplicado]] (2002),
    [[work:jose-saramago/ensaio-sobre-a-lucidez|Ensaio sobre a Lucidez]]
    (2004, sequela direta de Ensaio sobre a Cegueira, na mesma cidade sem
    nome) e
    [[work:jose-saramago/as-intermitencias-da-morte|As Intermitências da
    Morte]] (2005). Todos os romances desta fase se passam numa cidade ou
    país sem nome, ao contrário dos romances históricos anteriores ou dos
    dois últimos livros de Saramago, A Viagem do Elefante e Caim, que
    regressam a cenários históricos e bíblicos nomeados.
