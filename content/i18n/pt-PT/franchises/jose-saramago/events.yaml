# Português europeu (pt-PT) - acontecimentos específicos da coleção (o que
# aconteceu aos LIVROS; a vida do autor está em content/i18n/pt-PT/authors/).
# Nenhuma destas sete entradas tem organisation: epigraph, pelo que nenhuma
# carrega um campo `quote` a traduzir. A citação de Pontiero ("Lamentably, I
# can only write Portuguese...") não tem original português localizado apesar
# de duas fontes verificadas diretamente (a autobiografia do próprio Saramago
# em josesaramago.org/biografia/ e a página "Traduzido por Saramago" da
# Fundação, nenhuma das quais a regista) - traduzida de novo como qualquer
# outra prosa, tal como as citações do New York Times e do Guardian no evento
# de Cannes, que são imprensa anglófona sem original português a recuperar.

- id: saramago-blimunda-la-scala-1990
  title: Memorial do Convento torna-se ópera na Scala
  description: >
    A ópera Blimunda, de Azio Corghi, com libreto extraído de
    [[work:jose-saramago/memorial-do-convento|Memorial do Convento]], estreou
    no Teatro alla Scala, em Milão. Foi a primeira de três obras de Corghi a
    partir de Saramago: seguiu-se a ópera Divara, em Münster, em 1993, a
    partir da peça [[work:jose-saramago/in-nomine-dei|In Nomine Dei]], e A
    Morte de Lázaro em 1995. Oito anos após a publicação e dois antes de o
    seu próprio governo retirar um romance de Saramago de uma lista de
    prémios, o livro que lhe tinha feito o nome lá fora era cantado na mais
    famosa casa de ópera de Itália.

- id: saramago-pontiero-english-voice-1996
  title: Morre a meio de um projeto o tradutor que construiu a estante inglesa
  description: >
    Giovanni Pontiero, académico nascido em Glasgow e a lecionar em
    Manchester, deu a Saramago a sua voz inglesa: Baltasar and Blimunda em
    1987, depois The Year of the Death of Ricardo Reis, The Gospel According
    to Jesus Christ, The Stone Raft, A Manual of Painting and Calligraphy e
    The History of the Siege of Lisbon, vencendo o Independent Foreign
    Fiction Award em 1993 e o prémio da American Literary Translators
    Association no ano seguinte. Traduziu até ao fim de uma doença terminal e
    morreu a 10 de fevereiro de 1996, pelo que a sua versão de
    [[work:jose-saramago/ensaio-sobre-a-cegueira|Ensaio sobre a Cegueira]] só
    saiu, postumamente, em 1997, sob o título Blindness. A perda do "Ensaio
    sobre" no título incomodou bastante Saramago, e é por isso que o par
    inglês se lê Blindness e Seeing onde o português lê Ensaio sobre a
    Cegueira e Ensaio sobre a Lucidez. Margaret Jull Costa deu continuidade
    ao trabalho depois disso e ainda era sua tradutora quando ele morreu.
    "Lamentavelmente, só sei escrever em português", disse. "São os meus
    tradutores que tornam a minha obra universal."

- id: saramago-blindness-cannes-2008
  title: Blindness abre o Festival de Cannes
  description: >
    A adaptação de Fernando Meirelles a
    [[work:jose-saramago/ensaio-sobre-a-cegueira|Ensaio sobre a Cegueira]],
    uma coprodução brasileira, canadiana e japonesa com Julianne Moore e Mark
    Ruffalo, foi selecionada para a competição em Cannes e exibida como filme
    de abertura do festival. O obituário do Guardian, dois anos depois,
    dizia-o sem rodeios: de uma obra lida por toda a Europa e América Latina,
    foi através deste filme que alcançou o seu público mais vasto. Descreveu
    o livro como uma metáfora do modo como as nações ricas perseguem mais
    riqueza enquanto os pobres continuam pobres, e reduziu toda a parábola a
    uma pergunta: será uma grande conquista um mundo em que as trezentas
    pessoas mais ricas possuem tanto quanto os quarenta por cento mais
    pobres?

- id: saramago-claraboia-published-2011
  title: Claraboia é publicado, cinquenta e oito anos depois de escrito
  description: >
    Dezasseis meses após a sua morte, e com autorização dos herdeiros, a
    Editorial Caminho publicou [[work:jose-saramago/claraboia|Claraboia]], o
    romance que um editor lisboeta tinha deixado sem resposta em 1953 e
    reencontrado em 1989. O prefácio de Pilar del Río regista a sua reação ao
    reaparecimento do livro, e ele tinha dito à família que, depois de morto,
    fizessem o que achassem melhor. Seguiram-se edições em espanhol, italiano
    e brasileiro em 2012, e a versão inglesa de Margaret Jull Costa,
    Skylight, em 2014. Uma edição fac-similada de 2013 reproduziu as 245
    folhas dactilografadas, ainda com as suas correções manuscritas.

- id: saramago-alabardas-published-2014
  title: Trinta páginas de um último romance
  description: >
    À sua morte, tinha escrito trinta páginas do que seria o seu romance
    seguinte: Artur Paz Semedo, um homem apaixonado por artilharia, empregado
    numa fábrica de armamento, pressionado pela ex-mulher pacifista a
    investigar o seu próprio patrão.
    [[work:jose-saramago/alabardas-alabardas-espingardas-espingardas|Alabardas,
    Alabardas, Espingardas, Espingardas]] foi publicado inacabado em 2014,
    com ensaios de Fernando Gómez Aguilera e Roberto Saviano e gravuras de
    Günter Grass; a edição espanhola acrescenta as suas notas de trabalho,
    onde regista como a história haveria de terminar.

- id: saramago-ultimo-caderno-2018
  title: Um sexto caderno de Lanzarote sai de um disco rígido antigo
  description: >
    Tinha prometido aos leitores, em 2001, que faltava mais um volume dos
    diários de Lanzarote, relativo a 1998, e depois este desapareceu: uma
    troca de computador deixou-o, nas suas próprias palavras, preso ao disco
    rígido de uma máquina que já ninguém usava. Foi encontrado no seu arquivo
    no início de 2018, oito anos após a sua morte, e o
    [[work:jose-saramago/ultimo-caderno-de-lanzarote|Último Caderno de
    Lanzarote]] foi publicado a 8 de outubro de 2018, vinte anos ao dia
    depois do anúncio do Nobel que descreve por dentro.

- id: saramago-a-viuva-restored-2022
  title: O primeiro romance recupera o seu próprio título
  description: >
    A fechar o centenário do seu nascimento, a Porto Editora reeditou
    [[work:jose-saramago/terra-do-pecado|Terra do Pecado]] sob o título A
    Viúva, o que Saramago lhe tinha dado em 1947 e que o editor o obrigou a
    mudar como condição para o publicar. Nunca aceitou a mudança. A
    caligrafia da capa é de Violante Saramago Matos, a sua única filha,
    nascida no mesmo ano em que o livro saiu.
