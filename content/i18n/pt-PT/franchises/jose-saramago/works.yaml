# Português europeu (pt-PT) - sinopses.
# Os títulos NÃO são traduzidos: já são os originais portugueses. As notas de
# curadoria (`note:`) ficam na língua de base - são anotações editoriais, não
# prosa para o leitor. As sinopses de a-caverna e de as-intermitências-da-morte
# param deliberadamente no nível de revelação da contracapa do editor (ver a
# nota em cada entrada); a tradução mantém esse mesmo limite, sem reintroduzir
# o que ali ficou por dizer. Os títulos ingleses de edição (Blindness, Seeing,
# The Cave, Skylight, Baltasar and Blimunda...) mantêm-se em inglês onde o
# texto de base os cita como o título publicado nesse mercado.

# --- Romances ---

- id: jose-saramago/terra-do-pecado
  synopsis: >
    O romance de estreia de Saramago, sobre uma viúva dividida entre dois
    homens numa quinta na planície do Ribatejo. Intitulou-o A Viúva; o editor
    mudou-lhe o nome por razões comerciais, e só voltou a sair sob o título
    original numa edição de centenário em 2022.

- id: jose-saramago/manual-de-pintura-e-caligrafia
  synopsis: >
    Um retratista medíocre, contratado para pintar um homem poderoso,
    vira-se antes para a escrita sobre o ato de ver e de fazer arte. O
    regresso de Saramago à ficção depois de três décadas afastado do
    romance.

- id: jose-saramago/levantado-do-chao
  synopsis: >
    Três gerações de uma família alentejana sem terra atravessam a fome, o
    trabalho forçado e a ditadura ao longo do século XX. A crítica
    portuguesa assinala este como o livro em que surge pela primeira vez o
    estilo "saramaguiano" pelo qual é conhecido, de frase longa e sem aspas
    de diálogo.

- id: jose-saramago/memorial-do-convento
  synopsis: >
    Na Lisboa barroca do século XVIII, sob a Inquisição, um soldado maneta e
    uma mulher vidente apaixonam-se enquanto um padre renegado sonha
    construir uma máquina voadora, tendo como pano de fundo a construção do
    Convento de Mafra. Publicado em inglês como Baltasar and Blimunda
    (1988); o romance que deu a Saramago leitores internacionais e
    conquistou definitivamente a crítica portuguesa.

- id: jose-saramago/o-ano-da-morte-de-ricardo-reis
  synopsis: >
    Ricardo Reis - um dos heterónimos de Fernando Pessoa - regressa do
    Brasil a Lisboa em 1936 e é assombrado pelo fantasma de Pessoa ao longo
    de um ano de fascismo crescente em Portugal e na Europa.

- id: jose-saramago/a-jangada-de-pedra
  synopsis: >
    A Península Ibérica separa-se da Europa e vai à deriva pelo Atlântico
    como uma ilha própria, uma fábula sobre o lugar de Portugal e Espanha
    entre a Europa e as Américas, escrita quando os dois países aderiam à
    CEE.

- id: jose-saramago/historia-do-cerco-de-lisboa
  synopsis: >
    Um revisor de meia-idade insere impulsivamente um único "não" no texto
    histórico que está a corrigir, desfazendo na página o cerco medieval de
    Lisboa e complicando a sua própria vida com o historiador que o
    contratou.

- id: jose-saramago/o-evangelho-segundo-jesus-cristo
  synopsis: >
    Um reconto da vida de Jesus que o retrata, a ele e a Deus, como
    falíveis e humanos. Em 1992 o governo português mandou retirar o livro
    da candidatura de Portugal ao Prémio Aristeion por ofensa religiosa, o
    episódio que mandou Saramago para o exílio em Lanzarote pelo resto da
    vida.

- id: jose-saramago/ensaio-sobre-a-cegueira
  synopsis: >
    Uma epidemia inexplicada de cegueira branca espalha-se por uma cidade
    sem nome; as autoridades confinam os cegos a um manicómio vazio, e uma
    mulher que mantém a visão torna-se os olhos do pequeno grupo à sua
    volta. Publicado em inglês simplesmente como Blindness (1997), para
    desagrado de Saramago com a perda do "Ensaio sobre" do seu próprio
    título; o seu romance internacionalmente mais conhecido. A adaptação de
    Fernando Meirelles, em 2008, abriu o Festival de Cannes, a concurso
    pela Palma de Ouro, o maior palco a que alguma adaptação de Saramago
    chegou.

- id: jose-saramago/todos-os-nomes
  synopsis: >
    Um funcionário solitário da Conservatória Central do Registo Civil fica
    obcecado por localizar uma mulher desconhecida depois de levar o
    processo dela para casa por engano.

- id: jose-saramago/a-caverna
  synopsis: >
    Cipriano Algor, um oleiro idoso, entrega mensalmente as suas panelas e
    bilhas ao Centro, um vasto complexo de lojas, apartamentos e
    escritórios à beira da sua aldeia - até que este deixa de as receber, e
    depois deixa de receber também os bonecos de barro a que ele recorre em
    seguida, e a família tem de abandonar a aldeia e mudar-se para dentro do
    próprio Centro. Publicado em inglês como The Cave (2002).

- id: jose-saramago/o-homem-duplicado
  synopsis: >
    Um professor de história descobre, ao ver um filme alugado, que um ator
    é o seu duplo físico exato, e vai à procura do desconhecido. Publicado
    em inglês como The Double (2004).

- id: jose-saramago/ensaio-sobre-a-lucidez
  synopsis: >
    Na mesma cidade sem nome de Ensaio sobre a Cegueira, umas eleições
    produzem uma esmagadora maioria de votos em branco, e o governo, em
    pânico, suspeita de conspiração por parte dos sobreviventes da
    cegueira. Publicado em inglês como Seeing (2006).

- id: jose-saramago/as-intermitencias-da-morte
  synopsis: >
    No primeiro dia de um novo ano, num país sem nome, ninguém morre, e o
    governo, a igreja, os hospitais, as seguradoras e o setor funerário
    ficam a braços com o que custa realmente uma vida sem morte. Depois a
    própria morte, com letra minúscula, decide fazer a sua própria
    experiência. Publicado em inglês como Death with Interruptions (Reino
    Unido) ou Death at Intervals (Estados Unidos).

- id: jose-saramago/a-viagem-do-elefante
  synopsis: >
    Um relato ficcionado de Salomão, um elefante indiano oferecido pelo rei
    João III de Portugal ao arquiduque Maximiliano da Áustria em 1551, e da
    sua verdadeira travessia terrestre pela Europa do século XVI.

- id: jose-saramago/caim
  synopsis: >
    Caim percorre a própria cronologia do Antigo Testamento - o Éden,
    Sodoma, Abraão e Isaac, Job, a arca de Noé - discutindo diretamente com
    um Deus vingativo. O último romance de Saramago publicado em vida,
    editado em inglês como Cain (2011).

- id: jose-saramago/claraboia
  synopsis: >
    Seis famílias que partilham um prédio de apartamentos em Lisboa vivem
    as suas dificuldades privadas e pequenas bondades sob o mesmo teto.

- id: jose-saramago/alabardas-alabardas-espingardas-espingardas
  synopsis: >
    Artur Paz Semedo, funcionário de faturação numa histórica fábrica de
    armamento de Lisboa que passou quase vinte anos a faturar armas ligeiras
    e munições, começa a questionar o ofício a que serviu em silêncio. O
    título vem da Exortação da Guerra, de Gil Vicente.

# --- Poesia ---

- id: jose-saramago/os-poemas-possiveis
  synopsis: >
    O primeiro livro de Saramago publicado depois de Terra do Pecado
    (1947), e o fim dos seus 19 anos de ausência das livrarias.

- id: jose-saramago/provavelmente-alegria
  synopsis: A segunda coletânea de poesia de Saramago.

- id: jose-saramago/o-ano-de-1993
  synopsis: >
    Um único e longo poema narrativo em fragmentos datados, que imagina uma
    futura ditadura e um movimento de resistência.

# --- Crónicas e ensaio político ---

- id: jose-saramago/deste-mundo-e-do-outro
  synopsis: A primeira das coletâneas de crónicas de jornal de Saramago.

- id: jose-saramago/a-bagagem-do-viajante
  synopsis: >
    Uma segunda coletânea de crónicas de jornal. Um dos textos foi mais
    tarde republicado isoladamente como o livro ilustrado de 2022
    [[work:jose-saramago/uma-luz-inesperada|Uma Luz Inesperada]].

- id: jose-saramago/as-opinioes-que-o-dl-teve
  synopsis: Uma terceira coletânea de crónicas.

- id: jose-saramago/os-apontamentos
  synopsis: >
    Uma coletânea de textos políticos do tempo em que Saramago foi
    diretor-adjunto do jornal Diário de Notícias, em 1975, o cargo que
    terminou com a sua demissão depois do golpe de 25 de novembro.

- id: jose-saramago/folhas-politicas
  synopsis: >
    Artigos políticos escritos para jornais e revistas portugueses e
    estrangeiros entre 1976 e 1998, cobrindo assuntos nacionais e
    internacionais a par de cultura e memória.

# --- Literatura de viagens ---

- id: jose-saramago/viagem-a-portugal
  synopsis: >
    Um relato de viagem em primeira pessoa pelas regiões, paisagens,
    monumentos e pequenas vilas de Portugal. Publicado em inglês como
    Journey to Portugal (2000).

# --- Memórias ---

- id: jose-saramago/as-pequenas-memorias
  synopsis: >
    Umas memórias da infância e adolescência de Saramago, entre Azinhaga e
    Lisboa. Publicadas em inglês como Small Memories (2010). Um episódio
    foi mais tarde republicado isoladamente como o livro ilustrado de 2011
    [[work:jose-saramago/o-silencio-da-agua|O Silêncio da Água]].

# --- Diários ---

- id: jose-saramago/cadernos-de-lanzarote-i
  synopsis: >
    O primeiro de cinco volumes de diários mantidos depois da mudança de
    Saramago para Lanzarote em 1992, misturando o quotidiano, política,
    viagens e reflexões sobre a sua própria escrita.

- id: jose-saramago/cadernos-de-lanzarote-ii
  synopsis: O segundo volume dos diários de Lanzarote.

- id: jose-saramago/cadernos-de-lanzarote-iii
  synopsis: O terceiro volume dos diários de Lanzarote.

- id: jose-saramago/cadernos-de-lanzarote-iv
  synopsis: O quarto volume dos diários de Lanzarote.

- id: jose-saramago/cadernos-de-lanzarote-v
  synopsis: O quinto e último volume numerado dos diários de Lanzarote.

- id: jose-saramago/o-caderno
  synopsis: >
    Textos de blogue, ensaios e polémicas - sobre Israel, o fundamentalismo,
    George Bush e Silvio Berlusconi, entre outros alvos - escritos para o
    próprio blogue de Saramago entre setembro de 2008 e agosto de 2009.

- id: jose-saramago/ultimo-caderno-de-lanzarote
  synopsis: >
    Um volume póstumo com as últimas entradas do caderno de Lanzarote de
    Saramago, publicado pela Fundação José Saramago.

# --- Ficção curta ---

- id: jose-saramago/objecto-quase
  synopsis: >
    Seis contos, entre os quais "A Cadeira", um relato ficcionado da queda
    da cadeira que levou à incapacitação de Salazar. Publicado em inglês
    como The Lives of Things (2012).

- id: jose-saramago/o-conto-da-ilha-desconhecida
  synopsis: >
    Um homem pede ao rei um barco para partir à procura de uma ilha
    desconhecida, e a mulher da limpeza que limpa o palácio decide ir com
    ele. Publicado em inglês como The Tale of the Unknown Island (1999).

# --- Teatro ---

- id: jose-saramago/a-noite
  synopsis: >
    Uma peça de teatro passada na noite da revolução de 25 de abril de
    1974.

- id: jose-saramago/que-farei-com-este-livro
  synopsis: >
    Uma peça que imagina Luís de Camões depois de terminar Os Lusíadas, sem
    conseguir encontrar ninguém na corte portuguesa disposto a ajudá-lo a
    publicá-lo.

- id: jose-saramago/a-segunda-vida-de-francisco-de-assis
  synopsis: >
    Uma peça que imagina o desconforto de Francisco de Assis perante o
    culto de santo que cresceu à sua volta.

- id: jose-saramago/in-nomine-dei
  synopsis: >
    Uma peça passada no cerco anabatista de Münster, no século XVI,
    encenando fanatismo religioso e massacre em nome de Deus.

- id: jose-saramago/don-giovanni-ou-o-dissoluto-absolvido
  synopsis: >
    Uma peça que reescreve a lenda de Don Giovanni, pondo o sedutor em
    julgamento e, contra a tradição operática, absolvendo-o.

# --- Ensaios ---

- id: jose-saramago/a-estatua-e-a-pedra
  synopsis: >
    Saramago reflete sobre os seus próprios romances, livro a livro,
    usando as figuras de uma estátua e de uma pedra para descrever uma
    mudança na sua ficção, da descrição de superfície para a profundidade
    interior.

- id: jose-saramago/democracia-e-universidade
  synopsis: >
    Duas conferências sobre democracia e ensino superior: "Democracia e
    Universidade", proferida na Universidade Complutense de Madrid em 2005,
    e "Verdade e Ilusão Democrática", proferida em Santiago do Chile em
    2003.

# --- Livros infantis e ilustrados ---

- id: jose-saramago/a-maior-flor-do-mundo
  synopsis: >
    Um menino numa pequena aldeia aventura-se para lá dos lugares que já
    conhece e encontra uma flor a murchar numa encosta, e trata de a
    reanimar, levando-lhe água nas mãos em concha. Saramago escreve-se a si
    próprio na história, perguntando em voz alta se está à altura da
    simplicidade que a escrita para crianças exige.

- id: jose-saramago/o-silencio-da-agua
  synopsis: >
    Uma aventura de infância que termina num pequeno despertar de
    autoconhecimento, contada como fábula.

- id: jose-saramago/o-lagarto
  synopsis: >
    Uma fábula infantil, ilustrada pelo artista de xilogravura J. Borges.

- id: jose-saramago/uma-luz-inesperada
  synopsis: >
    Uma memória de infância de ajudar um tio a vender porcos numa feira, e
    um pequeno momento de espanto dentro dela.

- id: jose-saramago/o-primeiro-barco
  synopsis: >
    Um homem lança um barco à água pela primeira vez e reflete sobre a
    imensidão do mar à sua frente.

# --- Apócrifos: correspondência e uma colaboração pontual ---

- id: jose-saramago/jose-rodrigues-migueis-e-jose-saramago-correspondencia
  synopsis: >
    186 cartas trocadas entre Saramago e o escritor luso-americano José
    Rodrigues Miguéis (1901-1980) entre 1959 e 1971, dos anos em que
    Saramago foi diretor literário na Editorial Estúdios Cor, onde Miguéis
    também publicava.

- id: jose-saramago/com-o-mar-por-meio
  synopsis: >
    Cartas, bilhetes, postais e faxes trocados entre Saramago e o
    romancista brasileiro Jorge Amado entre 1992 e 1998, com mexericos e
    especulação sobre prémios literários a par de notícias mais íntimas.

- id: jose-saramago/poetica-dos-cinco-sentidos-o-ouvido
  synopsis: >
    A contribuição de Saramago, sobre o sentido da audição, para uma
    coleção em cinco partes da Bertrand Editora em que seis escritores
    portugueses (Saramago, Maria Velho da Costa, Augusto Abelaira, Nuno
    Bragança, Ana Hatherly e Isabel da Nóbrega) responderam cada um a um
    dos sentidos representados no ciclo de tapeçarias medievais La Dame à
    la Licorne.
