# Overlay pt-PT: title + description de cada evento (nunca date, impact,
# scope, reach, sources ou os campos de ilustração). `quote` não existe em
# nenhum destes doze eventos, por isso não há campo a mais a traduzir aqui.
#
# Referências a livros específicos com edição portuguesa verificada em
# editions.yaml usam aqui o título dessa edição, mesmo onde o original em
# inglês só nomeia o livro em prosa corrida, sem referência interna
# marcada: Along Came a Spider -> "A Conspiração da Aranha" (Presença, 2001)
# e The President Is Missing -> "O Presidente Desapareceu" (Porto Editora,
# 2018). The Thomas Berryman Number, Season of the Machete, Black Market,
# The Midnight Club e Miracle on the 17th Green não têm edição portuguesa
# registada e mantêm-se em inglês.
#
# The Angel Experiment TEM edição portuguesa ("Maximum Ride", Topseller,
# 2012, sem subtítulo próprio) mas fica em inglês aqui de propósito: a mesma
# frase do evento books-for-a-reluctant-reader-2005 já usa "Maximum Ride" para
# nomear a série ("o primeiro livro de Maximum Ride"), e substituir também o
# título do livro pelo mesmo texto tornaria a frase confusa (o nome do livro
# e o nome da série ficariam idênticos onde o inglês os distingue).
#
# Títulos de filmes (Kiss the Girls, Along Came a Spider enquanto filme de
# 2001, Cross enquanto série da Prime Video) mantêm-se em inglês: não foi
# possível confirmar o título de distribuição em Portugal para nenhum deles
# nesta passagem (sem acesso a pesquisa na web nesta sessão), e inventar um
# título de estreia portuguesa violaria a regra de não fabricar factos.

- id: berryman-edgar-1976
  title: Um primeiro romance que ninguém queria ganha o Edgar
  description: >
    [[work:james-patterson/the-thomas-berryman-number|The Thomas Berryman
    Number]] é recusado por mais de uma dúzia de editoras antes de a Little,
    Brown o comprar, vender cerca de dez mil exemplares e ganhar, no ano
    seguinte, o Prémio Edgar de Melhor Primeiro Romance da Mystery Writers of
    America. É também o último livro que Patterson escreve desta forma:
    sombrio, estilizado, mais próximo de Chandler do que de tudo aquilo por
    que viria a ser conhecido. Desde então já disse que as suas frases são as
    melhores que já escreveu e a história a mais fraca, e que nunca teria
    conseguido viver a escrever mais livros assim.

- id: season-of-the-machete-disowned-1977
  title: O único livro que manda os leitores saltar
  description: >
    [[work:james-patterson/season-of-the-machete|Season of the Machete]],
    sobre um casal que comete assassínios a catana numa ilha das Caraíbas, é o
    único título que Patterson repudia publicamente. "That's an absolutely
    horrifying book," disse à New York Times Magazine em 2010. "I actually
    tell people not to read it." Semanas depois, um leitor que lhe levou um
    exemplar para autografar numa livraria de Nova Jérsia ouviu o mesmo
    conselho, frente a frente.

- id: one-novel-in-nine-years-1986
  title: Nove anos, um romance
  description: >
    [[work:james-patterson/black-market|Black Market]] é o único romance que
    Patterson publica entre 1980 e 1989. Os livros que se seguiram à estreia
    saíram em várias editoras diferentes e não tiveram vendas nem críticas, e
    ao longo destes anos a sua vida profissional é a publicidade, não a
    ficção: escreve de noite e aos fins de semana enquanto sobe até ao topo
    da empresa norte-americana da J. Walter Thompson. A carreira que mais
    tarde produz quinze a vinte títulos por ano não produz, durante a maior
    parte desta década, nenhum.

- id: back-to-little-brown-1989
  title: De volta à editora com que começou
  description: >
    Patterson deixou a Little, Brown depois da estreia e passou a década de
    1980 noutras editoras. Regressa em 1989 com
    [[work:james-patterson/the-midnight-club|The Midnight Club]], quatro anos
    antes de A Conspiração da Aranha, e fica: a Little, Brown é a sua editora
    desde então, e contou a partir deste livro os seus vinte anos a
    publicá-lo. A relação torna-se invulgar em escala, com pessoal dedicado
    só aos livros dele e reuniões de marketing feitas na sala de estar dele.

- id: spider-television-commercial-1993
  title: O romancista que pagou o seu próprio anúncio de televisão
  description: >
    A Little, Brown resistiu a anunciar A Conspiração da Aranha na televisão.
    Os livros anteriores de Patterson tinham vendido pouco, achava-se que as
    personagens de série precisavam de ser construídas devagar, e vender um
    romance como um produto doméstico era visto como capaz de afastar
    leitores. Patterson, então à frente da empresa norte-americana da J.
    Walter Thompson, escreveu, produziu e pagou o anúncio do próprio bolso:
    uma aranha a descer pelo ecrã, a fechar com a frase "You can stop waiting
    for the next Silence of the Lambs." A editora partilhou depois o custo de
    o passar em Nova Iorque, Chicago e Washington. O livro entrou na lista de
    capa dura do New York Times no número nove, o que lhe garantiu as mesas
    junto à porta, e continua a ser o seu título mais vendido. Alex Cross
    ganha aqui uma série, e a edição ganha um modelo para promover um
    romancista como se promove uma marca.

- id: first-collaborator-1996
  title: O primeiro livro com um segundo nome na capa
  description: >
    [[work:james-patterson/miracle-on-the-17th-green|Miracle on the 17th
    Green]] é escrito por Peter de Jonge, redator publicitário na própria
    agência de Patterson e parceiro ocasional de golfe, a partir de um
    argumento fornecido por Patterson, e é o primeiro romance de Patterson a
    trazer o nome de um colaborador. Os dois homens recordam o início de
    forma diferente: de Jonge lembra-se de Patterson, então presidente da
    agência, a espreitar pela porta do gabinete onde ele escrevia
    discretamente artigos de revista em vez de textos publicitários;
    Patterson lembra-se de uma cerveja no clubhouse depois de uma ronda de
    golfe. A Little, Brown avisou que coautores diluiriam a marca. Patterson
    publicou três livros nesse ano em vez de um, todos best-sellers, e o
    esquema que sustenta a maior parte desta estante vem daqui: um argumento
    longo e muito específico da parte dele, um rascunho do colaborador,
    reescrita repetida por ele, e o colaborador pago do bolso dele, não pela
    editora.

- id: alex-cross-on-screen-1997
  title: Morgan Freeman torna-se Alex Cross
  description: >
    Kiss the Girls chega aos cinemas com Morgan Freeman no papel de Cross e
    Ashley Judd no de Kate McTiernan, feito por 27 milhões de dólares e
    arrecadando cerca de 100 milhões. Freeman regressa em Along Came a
    Spider, em abril de 2001, arrecadando cerca de 105 milhões, pelo que o
    público de cinema conhece Cross pela ordem inversa dos romances: o
    segundo livro é filmado primeiro, o primeiro livro depois. Patterson não
    teve grande opinião de nenhum dos filmes, e ainda em 2010 nenhuma
    adaptação dos seus livros tinha sido um sucesso no ecrã.

- id: books-for-a-reluctant-reader-2005
  title: Escrito para um rapaz que não queria ler
  description: >
    [[work:james-patterson/the-angel-experiment|The Angel Experiment]], o
    primeiro livro de Maximum Ride, é o primeiro romance de Patterson para
    leitores mais novos. Ele próprio atribui a viragem ao filho, um leitor
    relutante, a um acordo de verão que trocava tarefas domésticas por uma
    hora de leitura por dia, e à conclusão de que frases simples e capítulos
    curtos convêm a uma criança que nunca acabou um livro. As coleções
    infantis e juvenis que se seguem tornam-se a parte da estante que mais
    cresce, e acabam por ultrapassar em número os thrillers.

- id: jimmy-patterson-imprint-2015
  title: Torna-se o seu próprio editor
  description: >
    Anunciada na BookExpo America: a JIMMY Patterson, uma chancela da Little,
    Brown que publica de oito a doze livros infantis por ano, com Patterson a
    escolher os manuscritos e a definir o marketing de cada um, e a escrever
    ele próprio quatro a seis por ano. Disse que doaria os seus ganhos como
    editor aos seus programas de literacia. É por isso que tantos títulos
    infantis e juvenis desta ala trazem uma chancela com o seu próprio nome, e
    por isso que a lista de onde esses títulos vêm também inclui livros de
    outros autores que não são dele.

- id: stylometry-of-the-collaborations-2017
  title: Contar as palavras para saber de quem são
  description: >
    Simon Fuller e James O'Sullivan publicam um estudo estilométrico das
    colaborações na Digital Humanities Quarterly, comparando os romances
    coescritos com livros a solo de Patterson, Andrew Gross e Peter de Jonge,
    e concluem que são os colaboradores que escrevem a esmagadora maioria da
    prosa. A conclusão não contradiz nada do que Patterson diz sobre si
    próprio: sempre foi claro que fornece enredos, não frases. O que o estudo
    estabelece é a proporção, e o que levanta é se é o enredo ou a linguagem
    que faz o contador de histórias - a pergunta que esta estante coloca a
    todo o leitor que pega num livro com dois nomes na capa.

- id: the-president-is-missing-2018
  title: A colaboração em que foi ele o escriba
  description: >
    Anunciado em maio de 2017 e publicado em junho de 2018, em conjunto pela
    Alfred A. Knopf e pela Little, Brown,
    [[work:james-patterson/the-president-is-missing|O Presidente
    Desapareceu]] é o único livro nesta ala em que o segundo nome vem no
    mesmo tamanho do de Patterson. Ao aplicar-lhe o mesmo teste estilométrico,
    O'Sullivan encontrou o resultado habitual invertido: o estilo dominante ao
    longo do romance é o de Patterson, com o sinal a passar para Bill Clinton
    só no desfecho - exatamente onde a crítica de Anthony Lane na New Yorker
    já tinha situado a mudança, só pela leitura. Na sua colaboração mais
    visível, quem escreveu foi Patterson.

- id: cross-on-television-2024
  title: O sucesso no ecrã, trinta e um anos depois
  description: >
    Cross estreia na Prime Video com Aldis Hodge no papel de Alex Cross, com
    Patterson entre os produtores executivos. É renovada para uma segunda
    temporada antes de a primeira sequer ter ido para o ar, a segunda chega
    em fevereiro de 2026 e uma terceira é encomendada no mês seguinte. A
    lacuna que o perfil da New York Times Magazine de 2010 apontava - o
    romancista mais vendido vivo sem nada de bem-sucedido feito a partir dos
    seus livros - fecha-se aqui, três décadas depois de A Conspiração da
    Aranha.
