# Português europeu (pt-PT) - sinopses. Os títulos NÃO são traduzidos: já
# são os originais portugueses (proibido pelo próprio validador em
# works.yaml). As notas de curadoria (`note:`) ficam na língua de base -
# são anotações editoriais, não prosa para o leitor, a mesma convenção já
# usada nas estantes de Eça de Queirós, José Saramago e José Luís Peixoto.
# A redondilha citada na sinopse das Rimas, "Sôbolos rios que vão", já está
# em português e mantém-se tal como está no original.

- id: luis-de-camoes/os-lusiadas
  synopsis: >
    Um poema épico em dez cantos de oitava rima, que conta - e
    constantemente interrompe para louvar, chorar ou discutir - a viagem de
    Vasco da Gama entre 1497 e 1499, à volta do Cabo da Boa Esperança até à
    Índia, enquadrada como o culminar de toda a história de Portugal e
    vigiada, e disputada, pelos deuses clássicos do Olimpo.

- id: luis-de-camoes/rimas
  synopsis: >
    A poesia lírica de Camões, reunida a partir de manuscritos após a sua
    morte: redondilhas, odes, elegias, éclogas, sonetos e outras formas
    breves, que vão da poesia amorosa de influência petrarquista a versos
    escritos diretamente a partir dos seus anos de exílio e naufrágio -
    entre eles "Sôbolos rios que vão", a redondilha que a tradição liga ao
    naufrágio no Mekong do qual, segundo se diz, saiu sem nada além do
    manuscrito de Os Lusíadas.

- id: luis-de-camoes/filodemo
  synopsis: >
    Uma comédia de costumes em cinco atos: Filodemo, um criado de
    nascimento nobre que ele próprio desconhece, ama Dionisa, filha do
    fidalgo a quem serve - um enredo que a crítica, tanto em português como
    em inglês, lê como portador de traços autobiográficos do próprio amor
    frustrado de Camões na corte.

- id: luis-de-camoes/anfitrioes
  synopsis: >
    Uma adaptação cómica do Anfitrião de Plauto: Júpiter, disfarçado do
    general Anfitrião, seduz a própria mulher deste enquanto ele está
    ausente na guerra, e a peça trata as identidades duplas daí resultantes
    como farsa, não como tragédia.

- id: luis-de-camoes/el-rei-seleuco
  synopsis: >
    Um auto num só ato que satiriza a nobreza: um rei já idoso pretende
    casar com a mulher que o próprio filho ama, inspirado numa história de
    Antíoco e da sua madrasta Estratonice, contada por Plutarco e retomada
    por Petrarca.

- id: luis-de-camoes/cartas
  synopsis: >
    As cartas em prosa de Camões que chegaram até nós: textos informais,
    muitas vezes satíricos, escritos a partir dos meios boémios de Lisboa
    e dos seus anos no estrangeiro, valorizados pelos biógrafos pelos
    vislumbres diretos e sem artifício da sua personalidade e do seu
    quotidiano que a poesia e o teatro não oferecem - entre eles o relato
    de uma noite na enfermaria dos apaixonados de um hospital de Lisboa,
    tratado inteiramente como comédia.
