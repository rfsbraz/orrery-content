# Tradução pt-PT (português europeu) da prosa curada da ala Luís de
# Camões. `startHere.paths` é uma lista aninhada com id: funde-se item a
# item pela chave `id` (docs/SCHEMA.md, "Nested lists merge by id"), pelo
# que aqui só vai prosa (title, description, note) - nunca `workIds`,
# `orderId` ou `fit`.

- id: luis-de-camoes
  description: >
    Um soldado que perdeu um olho em Ceuta, um poeta que, por tradição,
    chegou a nado à costa de um naufrágio perto do Mekong com o único
    manuscrito do poema que o tornou a voz nacional de Portugal, e, pela
    sua morte na pobreza em 1580, a razão pela qual o português é por
    vezes chamado "a língua de Camões".
  startHere:
    paths:
      - id: start-with-os-lusiadas
        title: Comece por Os Lusíadas
        description: >
          O poema épico é a razão de Camões ter sequer uma estante: dez
          cantos em oitava rima que acompanham a viagem de Vasco da Gama à
          Índia, enquadrada como toda a história de Portugal, sob o olhar e
          a disputa dos deuses do Olimpo. É o poema épico nacional de
          Portugal, e a razão pela qual "a língua de Camões" é por vezes
          usada para o próprio português. Nada mais nesta estante precisa de
          vir primeiro.
        note: >
          A verdadeira escolha aqui não é qual obra, mas qual tradução:
          quase nenhum leitor lê este poema no português original do século
          XVI, e o inglês não tem uma tradução-padrão única de Os Lusíadas.
          A tradução de Landeg White, de 1997, na coleção Oxford World's
          Classics, em verso branco, é a que as edições críticas atuais e a
          crítica recomendam a novos leitores - venceu o Prémio
          Teixeira-Gomes de tradução em 1998, e a revista Portuguese Studies
          chamou-lhe "a melhor tradução de Os Lusíadas em inglês". A
          tradução em prosa mais antiga de William Atkinson, lida por
          gerações, é, por avaliação posterior, "profundamente não-poética"
          face ao original; a tradução de Richard Fanshawe, de 1655, a
          primeira em inglês, resiste bem mas lê-se, honestamente, como
          verso de 1655. O custo de ficar apenas pelo poema épico é todo o
          resto que Camões escreveu: nenhuma da poesia lírica, das cartas ou
          do teatro.

      - id: beyond-os-lusiadas
        title: "Para além de Os Lusíadas: as Rimas"
        description: >
          Para um leitor que já leu o poema épico e quer mais do mesmo
          poeta, não a estante inteira. As Rimas reúnem a poesia lírica de
          Camões - sonetos, elegias, odes e as redondilhas que escreveu a
          partir dos seus próprios anos de exílio e naufrágio -, a segunda
          metade do par que os resumos de referência sobre Camões nomeiam
          em conjunto, ainda que quase nada dela tenha viajado com a sua
          fama da mesma forma que o poema épico.
        note: >
          O custo é tudo o que a fama do poema épico deixa na sombra: esta
          coletânea só foi reunida a partir de manuscritos depois da morte
          de Camões, o seu texto autêntico por assentar durante séculos
          (ver a própria nota de works.yaml sobre as Rimas), e continua a
          alcançar uma fração dos leitores do poema épico - a própria edição
          da Princeton chama-lhe "quase completamente desconhecida fora de
          Portugal" ao lado de um poema épico "mundialmente famoso". Landeg
          White, recomendado acima para o poema épico, também produziu a
          tradução inglesa de referência das Rimas, pelo que a mesma voz se
          mantém. Ficar por aqui continua a deixar de fora as peças e as
          cartas por completo.

      - id: everything
        title: Tudo, por ordem
        description: >
          As seis obras pela ordem de publicação: o poema épico, a poesia
          lírica reunida, as duas comédias não contestadas do início da sua
          carreira, a terceira comédia contestada, e as cartas recuperadas
          aos poucos, séculos depois da sua morte. Para um leitor que já
          conhece Os Lusíadas e quer o resto da estante, ou para quem quer o
          registo completo de um poeta-soldado que trabalhou a épica, a
          lírica, o teatro e a prosa por igual.
        note: >
          Ordem de publicação significa aqui data de impressão, não data de
          composição: todas as obras à exceção do próprio poema épico só
          chegaram à imprensa anos ou décadas depois de escritas - as duas
          comédias não contestadas só em 1587, a terceira, contestada, só em
          1645, e as Cartas só reunidas numa edição dedicada em 2011 (ver a
          nota de cada obra). "Tudo, por ordem" avança, por isso, bem para
          lá da morte de Camões em 1580 antes de terminar.
