# Português europeu (pt-PT) - títulos e descrições dos cinco eventos desta
# estante. Nenhum destes eventos usa `quote` (organização epígrafe) na base,
# pelo que não há campo a traduzir aqui além de title e description.

- id: luis-de-camoes-fanshawe-1655
  title: "Richard Fanshawe publica os primeiros Lusíadas em inglês"
  description: >
    Richard Fanshawe, um poeta-diplomata realista então caído em desgraça
    sob a Commonwealth inglesa, publica "The Lusiad", a primeira tradução
    inglesa de Os Lusíadas, 75 anos depois da morte de Camões e 83 depois
    da primeira impressão do próprio poema. Verte-o na mesma oitava rima
    que Camões usou, em verso inglês de época - uma forma que nenhuma das
    traduções inglesas posteriores, mais recomendadas hoje, repete. Abre o
    poema ao mundo anglófono pela primeira vez e dá início à questão ainda
    em aberto, presente nas próprias notas de leitura desta estante, sobre
    qual Lusíadas em inglês um novo leitor deve escolher.

- id: luis-de-camoes-national-myth-1880
  title: "Uma estátua, depois um tricentenário: Camões torna-se o poeta da nação"
  description: >
    Em 1867, Lisboa inaugura o Monumento a Camões, esculpido por Victor
    Bastos e integralmente pago por subscrição pública - a primeira
    estátua pública erguida a um escritor português, na que viria a ser a
    Praça Luís de Camões. O monumento prepara o terreno para o terceiro
    centenário da sua morte, a 10 de junho de 1880: uma comemoração
    nacional organizada sobretudo pelo intelectual republicano Teófilo
    Braga, com Antero de Quental, Oliveira Martins, Ramalho Ortigão e João
    de Deus, associada a uma data de morte que o registo, na verdade, não
    fixa com certeza. O próprio Braga chamou-lhe o início de uma nova era
    de "regeneração" portuguesa. A data fica: um decreto real desse mesmo
    ano declara 10 de junho dia de festa nacional, a raiz direta do que
    mais tarde se torna o feriado nacional de Portugal. É este o momento em
    que um soldado-poeta do século XVI é transformado no símbolo cultural
    fundador da nação - a razão pela qual, um século e meio depois, o
    português ainda é por vezes chamado "a língua de Camões".

- id: luis-de-camoes-rimas-1932-critical-edition
  title: "Umas Rimas \"críticas\" que ainda se apoiam no texto corrompido"
  description: >
    Dois séculos de acrescentos tinham tornado as Rimas irreconhecíveis: os
    65 sonetos da primeira edição de 1595 tinham crescido para 352 numa
    edição de 1861, a maioria mais tarde identificada como obra de outros
    poetas mal atribuída a Camões, muito dela filtrada pelo texto fortemente
    reescrito de Manuel de Faria e Sousa, de 1685. José Maria Rodrigues e
    Afonso Lopes Vieira publicam uma nova edição das Rimas em 1932,
    chamando-lhe "crítica", um rótulo que a investigação posterior
    considera não ser inteiramente merecido: continua a apoiar-se em boa
    parte nas leituras corrompidas do próprio Faria e Sousa, apesar de os
    editores alegarem ter trabalhado a partir dos originais de 1595 e 1598.
    O que a edição consegue é pôr fora de dúvida, pela primeira vez, a
    questão da fraude textual, dando continuidade ao trabalho que Wilhelm
    Storck e Carolina Michaëlis de Vasconcelos tinham começado décadas
    antes - pelo que as Rimas "fiáveis" que um leitor compra hoje assentam
    numa discussão que, na prática, ainda estava a ser resolvida um século
    depois da vida de Camões.

- id: luis-de-camoes-dia-de-portugal-1978
  title: "O feriado do dia da sua morte é resgatado de um slogan colonial"
  description: >
    10 de junho, data da morte de Camões, torna-se feriado nacional pela
    primeira vez sob a Primeira República portuguesa, e é fixado
    nacionalmente como "Festa de Portugal" por uma lei de 1925. A ditadura
    do Estado Novo mantém a data, mas reformula-a: a partir de 1933 passa a
    ser conhecido como "Dia de Camões, de Portugal e da Raça", com "Raça"
    um termo cunhado pelo próprio Salazar para o efeito, e a partir de 1963
    passa também a assinalar as forças armadas e o domínio colonial. Após a
    Revolução dos Cravos, em 1974, a Terceira República abandona o
    enquadramento racial: uma lei de 1978 rebatiza-o "Dia de Portugal, de
    Camões e das Comunidades Portuguesas" - o dia de Portugal, de Camões e
    das comunidades portuguesas no estrangeiro -, o nome e o sentido que
    ainda hoje mantém. A mesma data de morte serviu de âncora a duas
    histórias nacionais muito diferentes.

- id: luis-de-camoes-quincentenary-2024
  title: "Camões 500: uma comemoração de Estado para um ano de nascimento que ninguém consegue provar"
  description: >
    O governo português organiza um programa oficial de comemorações do
    quinto centenário do nascimento de Camões, com início a 10 de junho de
    2024 e encerramento a 10 de junho de 2026 - exposições, prémios para
    escolas, e um comissariado dedicado (Estrutura de Missão) sob a alçada
    da Biblioteca Nacional. A data em que assenta, 1524, é a mesma
    estimativa que o registo desta estante só consegue chamar "a melhor
    reconstituição disponível": construída a partir de um documento de
    alistamento de 1550 que dá a Camões vinte e cinco anos de idade, e não
    a partir de qualquer registo de nascimento ou batismo, dos quais
    nenhum sobrevive. Um Estado assinala meio milénio com base num número
    que os historiadores ainda qualificam com "ou 1525".
