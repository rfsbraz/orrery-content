# Overlay pt-PT das obras: apenas `synopsis` (prosa). `title` nunca se
# traduz aqui: um título traduzido só existe como edição publicada, em
# editions.yaml (ver docs/SCHEMA.md, "Never translate a published title").
# `note:` também não é traduzido: é anotação de curadoria e não chega ao
# leitor no ecrã da obra.
# Referências inline usam o título da edição pt-PT publicada onde existe
# uma (ver editions.yaml): Fortaleza Digital, Anjos e Demónios, A
# Conspiração, O Código da Vinci, O Símbolo Perdido, Inferno, Origem, O
# Segredo dos Segredos, A Sinfonia dos Animais. 187 Men to Avoid não tem
# edição portuguesa e fica no original inglês.
#
# SPOILER. As sinopses de inferno e de the-secret-of-secrets são traduzidas
# exatamente como estão, sem repor nenhuma revelação: a de inferno para no
# capítulo de abertura do livro (o mesmo excerto que Brown publica
# gratuitamente no seu site), sem explicar nem enquadrar o que a meio do
# livro esse início se torna; a de the-secret-of-secrets para no
# desaparecimento de Katherine Solomon com o seu manuscrito, sem revelar o
# que a caça que se segue encontra.
#
# Maestro Mouse (wild-symphony): não foi encontrada nenhuma fonte para o
# nome desta personagem numa edição portuguesa publicada, pelo que o nome
# original fica por traduzir em vez de se inventar um.

- id: dan-brown/digital-fortress
  synopsis: >
    Quando o supercomputador de decifração de códigos da NSA encontra uma
    cifra que não consegue quebrar, a chefe de criptografia Susan Fletcher
    é chamada - e vê-se a trabalhar contra o plano de um programador
    moribundo para forçar a exposição pública dos métodos de vigilância da
    agência, enquanto o seu noivo persegue um anel desaparecido pelas ruas
    de Sevilha.

- id: dan-brown/angels-demons
  synopsis: >
    Chamado ao CERN pelo assassínio ritual de um padre físico, o
    simbologista de Harvard Robert Langdon descobre o ressurgimento dos
    Illuminati e um cilindro roubado de antimatéria com temporizador para
    destruir a Cidade do Vaticano durante um conclave papal.

- id: dan-brown/deception-point
  synopsis: >
    Quando a NASA anuncia um meteorito que prova a existência de vida
    extraterrestre dias antes de uma eleição presidencial, a analista de
    informações da Casa Branca Rachel Sexton é enviada para ajudar a
    verificar a descoberta - e vê-se perseguida a partir do momento em que
    a ciência deixa de fazer sentido.

- id: dan-brown/the-da-vinci-code
  synopsis: >
    Chamado ao Louvre depois do assassínio do conservador, Robert Langdon
    e a criptóloga Sophie Neveu seguem um rasto de códigos escondidos nas
    próprias obras-primas do museu, perseguidos pela polícia, que acredita
    que Langdon é o assassino.

- id: dan-brown/the-lost-symbol
  synopsis: >
    Chamado a Washington, D.C. por aquilo que se revela ser um convite
    forjado, Robert Langdon tem doze horas para desvendar uma história
    maçónica oculta da capital e encontrar a Palavra Perdida - ou o seu
    mentor sequestrado, Peter Solomon, morre.

- id: dan-brown/inferno
  synopsis: >
    Robert Langdon acorda num hospital de Florença com um ferimento na
    cabeça, amnésia e sem memória dos últimos dias - apenas um cilindro de
    perigo biológico no casaco e uma voz de mulher a dizer-lhe para
    "procurar e encontrar", enquanto um assassino se aproxima.

- id: dan-brown/origin
  synopsis: >
    Num evento no Guggenheim de Bilbau destinado a revelar uma descoberta
    que acredita que vai abalar a religião organizada, o futurólogo Edmond
    Kirsch é silenciado antes de poder terminar - e o seu antigo professor
    Robert Langdon e a diretora do museu têm de encontrar e divulgar
    aquilo que estava prestes a dizer.

- id: dan-brown/the-secret-of-secrets
  synopsis: >
    Em Praga para uma palestra da cientista noética Katherine Solomon,
    cujo próximo livro sobre a consciência humana ameaça séculos de
    crenças estabelecidas, Robert Langdon vê-se envolvido num assassínio
    brutal e no desaparecimento súbito de Katherine, juntamente com o seu
    manuscrito - e é depois perseguido por Praga, Londres e Nova Iorque
    por uma organização poderosa e um agressor saído da mitologia mais
    antiga da cidade.

- id: dan-brown/wild-symphony
  synopsis: >
    Maestro Mouse guia os leitores mais novos pelo reino animal - um livro
    ilustrado emparelhado com um álbum original de música clássica
    composto por Brown, tocado através de uma aplicação gratuita de
    realidade aumentada que ativa a peça de cada animal quando a câmara do
    telemóvel encontra a sua página.

- id: dan-brown/187-men-to-avoid
  synopsis: >
    Uma coletânea humorística de avisos de uma linha sobre homens, escrita
    do ponto de vista de uma mulher para "mulheres de todas as idades e
    fases" a navegar o mundo dos encontros.
