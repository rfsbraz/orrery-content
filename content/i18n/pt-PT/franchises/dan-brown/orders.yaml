# Overlay pt-PT das ordens de leitura: `name` e `rationale`. id, type,
# source, orderedWorkIds e sources nunca se traduzem. A ordem "publication
# default" (todas as dez obras) é derivada automaticamente e não tem
# entrada própria em orders.yaml, pelo que não há nada a fundir aqui para
# ela.
# Referências inline usam o título da edição pt-PT publicada onde existe
# uma (ver editions.yaml): Fortaleza Digital, A Conspiração, A Sinfonia dos
# Animais. "Robert Langdon", na referência a angels-demons, continua a ser
# o nome da personagem, não o título do livro, e não se traduz.

- id: dan-brown/robert-langdon-in-order
  name: A série Robert Langdon, por ordem
  rationale: >
    Os seis romances de [[work:dan-brown/angels-demons|Robert Langdon]]
    (2000-2025), agrupados como "Robert Langdon Series" no site do próprio
    Brown e numerados de #1 a #6 pela mesma sequência na ficha de cada
    romance na Wikipédia. Ordem de publicação e ordem interna da história
    são aqui a mesma coisa - o artigo da Wikipédia sobre Robert Langdon
    afirma claramente que, "nos livros, os acontecimentos de O Código da
    Vinci seguem-se aos de Anjos e Demónios" - por isso esta ordem não
    resolve nada que alguma fonte discuta; o seu único contributo é
    destacar o fio principal do resto da estante. Para um leitor que quer
    só Langdon: primeiro a verdadeira estreia da personagem, depois cada
    caso seguinte pela ordem em que Brown os escreveu e ambientou. O
    custo: ler só estes seis deixa de fora os dois thrillers autónomos
    genuinamente bons ([[work:dan-brown/digital-fortress|Fortaleza
    Digital]], [[work:dan-brown/deception-point|A Conspiração]]) e o
    livro ilustrado ([[work:dan-brown/wild-symphony|A Sinfonia dos
    Animais]]) que ficam à volta dele na estante completa.
