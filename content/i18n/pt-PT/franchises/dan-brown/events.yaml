# Overlay pt-PT dos eventos da franquia: `title` + `description`. Os
# acontecimentos de vida do autor estão em content/i18n/pt-PT/authors/.
# Datas, scope, reach, impact, organisation, illustration_type,
# images_required, spoilerAfter e sources nunca se traduzem.
#
# SPOILER. O tema da ação de Baigent e Leigh, em
# dan-brown-baigent-leigh-lawsuit-2006, fica em "as origens do
# Cristianismo", nunca no casamento de Jesus e Maria Madalena nem numa
# linhagem sobrevivente - a mesma delimitação já presente no inglês. A
# imprensa e as edições portuguesas de O Código da Vinci descrevem esta
# tese de forma bem mais aberta do que a capa do livro; essa liberdade não
# é usada aqui.
#
# Referências inline usam o título da edição pt-PT publicada (ver
# editions.yaml): O Código da Vinci.

- id: dan-brown-baigent-leigh-lawsuit-2006
  title: Dois autores processam por causa do "tema central" de O Código da Vinci - e perdem, duas vezes
  description: >
    Michael Baigent e Richard Leigh, autores do livro de não-ficção de
    1982 The Holy Blood and the Holy Grail, processam a editora britânica
    de Brown, a Random House, alegando que
    [[work:dan-brown/the-da-vinci-code|O Código da Vinci]] retirou o "tema
    central" e a "arquitetura" da sua própria investigação sobre as
    origens do Cristianismo. Brown passa três dias no banco das
    testemunhas do High Court de Londres. A 7 de abril de 2006, o juiz
    Peter Smith decide que não houve violação: ideias e teorias históricas
    não são protegidas, só a sua expressão específica, e Baigent e Leigh
    não tinham demonstrado que o "tema central" que reivindicavam sequer
    existisse no seu próprio livro. O recurso de Baigent e Leigh é
    rejeitado pelo Tribunal de Recurso a 28 de março de 2007, deixando-os
    responsáveis por custos judiciais próximos de 6 milhões de dólares.

- id: dan-brown-phenomenon-2006
  title: O filme desencadeia, ao mesmo tempo, um apelo ao boicote do Vaticano e um boom de turismo no Louvre
  description: >
    A adaptação cinematográfica de Ron Howard (com Tom Hanks e Audrey
    Tautou, estreada a 19 de maio de 2006) faz explodir uma controvérsia
    que se vinha a acumular desde a publicação do romance em 2003. O
    cardeal Tarcisio Bertone pede o boicote ao próprio livro em 2005; dias
    antes da estreia do filme, monsenhor Angelo Amato diz a estudantes da
    Pontifícia Universidade da Santa Cruz, em Roma, "espero que todos
    boicotem este filme", comparando o tratamento dado à Igreja a uma
    calúnia que teria provocado "uma revolta mundial" se tivesse visado o
    Islão ou o Holocausto. O filme chega a ser proibido em vários países.
    Ao mesmo tempo, o romance e o filme levam os leitores à procura dos
    seus locais reais: o Louvre regista uma afluência recorde em 2005 (7,3
    milhões de visitantes, atribuída em parte ao livro), operadores
    turísticos de Paris organizam passeios pedestres dedicados a "O
    Código da Vinci", e, na data de estreia do filme na China, o livro tem
    aí uma estimativa de dez milhões de leitores entre exemplares
    legítimos e pirateados.

- id: dan-brown-inferno-bunker-translation-2013
  title: Onze tradutores, uma cave fechada à chave, seis línguas ao mesmo tempo
  description: >
    [[work:dan-brown/inferno|Inferno]] é publicado nos seus principais
    mercados europeus no mesmo dia, 14 de maio de 2013, e a máquina por
    trás dessa simultaneidade torna-se uma história por direito próprio.
    Durante quase dois meses antes disso, onze tradutores trabalham numa
    cave sem janelas e de alta segurança na sede milanesa da Mondadori, a
    maior editora italiana, a verter o manuscrito para francês, alemão,
    espanhol, catalão, italiano e português. Assinam acordos de
    confidencialidade, entregam os telemóveis à porta, trabalham sete dias
    por semana sob guarda armada, com os portáteis fixos às secretárias e
    um único computador vigiado para acesso à internet, devolvem as
    páginas ao fim de cada dia e recebem histórias de cobertura para
    justificar a sua presença no edifício. Nada no romance exigia isto; o
    que o exigia era aquilo em que um romance de Langdon se tinha tornado
    em 2013 - um livro cuja fuga de enredo uma semana antes era avaliada
    como um risco comercial que justificava um bunker. Mais tarde, o
    esquema viria a dar o mote ao filme francês Les Traducteurs (2019).
