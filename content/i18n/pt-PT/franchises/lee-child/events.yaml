# Overlay pt-PT dos eventos da franquia: `title` + `description`.
# Alturas convertidas para o sistema métrico (Portugal não usa pés/polegadas);
# os valores em dólares e as datas mantêm-se como no original.
# Killing Floor -> "Do Fundo do Abismo" (única obra citada aqui com edição
# portuguesa, editions.yaml); One Shot não tem edição em português e fica no
# título original.
- id: lee-child/jack-reacher-film-cruise-cast-2012
  title: Tom Cruise interpreta Reacher no ecrã, a treze centímetros menos do que no livro
  description: >
    Jack Reacher, da Paramount, adaptado pelo argumentista e realizador
    Christopher McQuarrie a partir de
    [[work:lee-child/one-shot|One Shot]] (2005), estreia em Londres a 10 de
    dezembro de 2012 e chega às salas americanas a 21 de dezembro,
    arrecadando 218,3 milhões de dólares com um orçamento de 60 milhões: a
    primeira aparição do personagem no ecrã, quinze anos depois de Do Fundo
    do Abismo. Tom Cruise, com 1,70 m, interpreta um homem que os romances
    descrevem com 1,96 m e 113 quilos. Child defende a escolha na altura:
    "Se conhecer o Reacher, nos primeiros dois ou três minutos vai pensar,
    'isto é estranho.' Mas depois dos primeiros dois ou três minutos,
    deixa-se envolver, é absorvido pela história, e ele convence-o." Noutro
    momento resume o compromisso sem rodeios: com outro ator "podia ficar
    com cem por cento da altura, mas só noventa por cento do Reacher. Com o
    Tom, fica com cem por cento do Reacher e noventa por cento da altura."

- id: lee-child/never-go-back-film-2016
  title: Uma sequela mais fraca encerra a passagem de Cruise por Reacher
  description: >
    Jack Reacher: Never Go Back, adaptado do romance homónimo de 2013,
    estreia em Nova Orleães a 16 de outubro de 2016 e chega às salas
    americanas a 21 de outubro. Cruise regressa como Reacher (Child faz uma
    breve participação como agente da TSA); o filme arrecada 162 milhões de
    dólares em todo o mundo com o mesmo orçamento de 60 milhões, bem abaixo
    dos 218 milhões do primeiro filme, e obtém 37 por cento de aprovação da
    crítica, face às críticas mais fortes do original. Não se segue um
    terceiro filme de Reacher com Cruise.

- id: lee-child/child-admits-cruise-casting-wrong-2018
  title: "Os leitores tinham razão, diz Child sobre a escolha de Cruise"
  description: >
    Seis anos depois de a defender, Child inverte a sua posição pública
    sobre a escolha de Cruise. "O tamanho do Reacher é mesmo, mesmo
    importante e é uma grande parte de quem ele é", diz, acrescentando que
    "o Cruise, com todo o seu talento, não tinha aquela presença física" e
    que "os leitores ficaram terrivelmente incomodados com isso e acho que,
    no fundo, os leitores tinham razão." Descreve o trabalho com Cruise nos
    dois filmes como "um prazer e um privilégio", mas afasta um terceiro,
    anunciando em vez disso planos para uma nova versão televisiva que
    reelenca o papel de acordo com os livros. Repete o mesmo veredito numa
    entrevista distinta anos depois, dizendo ao The Independent em 2025 que
    Cruise "não é enorme e não é assustador", qualidades que Child continua
    a considerar centrais para a personagem.

- id: lee-child/reacher-amazon-series-ritchson-2022
  title: A Amazon escolhe o físico certo, e Child tem finalmente o Reacher que escreveu
  description: >
    Reacher, da Amazon Prime Video, com Child como produtor executivo,
    estreia a 4 de fevereiro de 2022, com Alan Ritchson, 1,90 m contra
    1,96 m nos livros, uma aproximação muito mais próxima do que os 1,70 m
    de Cruise. Child atribui diretamente à escolha do ator a correção do
    que os filmes fizeram mal: "Acho que a questão do tamanho é importante
    para certas partes da narrativa. O Reacher tem de assustar as pessoas,
    e isso é muito mais fácil de conseguir com um único olhar deste animal
    enorme do que com um ator de tamanho normal." A série é renovada para
    mais temporadas.

- id: lee-child/the-enemy-sweeps-prizes-2005
  title: The Enemy arrasa nos prémios do género
  description: >
    Um ano depois da publicação, [[work:lee-child/the-enemy|The Enemy]]
    (2004), a primeira prequela de Reacher escrita por Child, vence tanto o
    Barry Award de Melhor Romance como o Nero Award, e é nomeado para o
    Dilys Award: reconhecimento de três júris distintos dentro do género
    policial americano para um único livro, oito romances volvidos na
    série.
