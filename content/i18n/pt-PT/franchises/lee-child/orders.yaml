# Overlay pt-PT das ordens de leitura: `name`, `rationale` e `debated`.
# orderedWorkIds e sources não se traduzem.
# A ordem "publication default" é derivada automaticamente (ver SCHEMA.md) e
# não tem entrada própria em orders.yaml, pelo que não há nada a fundir aqui
# para ela; só a ordem cronológica-no-universo tem `name`/`rationale` para
# traduzir.
# Títulos citados usam a edição portuguesa publicada quando existe
# (editions.yaml): Killing Floor -> "Do Fundo do Abismo", Night School ->
# "Escola da Noite". The Enemy, The Secret e The Affair não têm edição em
# português e ficam no título original.
# A rationale não nomeia nenhuma revelação concreta das quatro prequelas -
# só a propriedade genérica de terem sido escritas depois e com conhecimento
# do que se segue - e a tradução preserva essa mesma reserva.
- id: lee-child/chronological-inuniverse
  name: A vida de Reacher, por ordem
  rationale: >
    Os 31 romances de Jack Reacher, reordenados da sequência de publicação
    para a ordem em que acontecem na vida do próprio Reacher. Quatro deles
    recuam aos seus últimos anos como oficial da Polícia Militar, bem antes
    da vida de andarilho pós-Exército com que a série numerada abre; esta
    ordem coloca esses quatro no início e deixa os restantes 27 seguir a
    sua sequência habitual. Para um leitor que queira ver a carreira de
    Reacher encaixar do princípio ao fim, ou para um completista a reler
    toda a série com a cronologia em linha reta. O custo é real: as quatro
    prequelas foram escritas bem depois, e com pleno conhecimento, de tudo
    o que se segue, pelo que lê-las primeiro significa conhecer o círculo
    recorrente de colegas de Reacher já moldado por uma história a que esta
    ordem ainda não chegou. Todos os guias consultados, incluindo o próprio
    site oficial da personagem, continuam a encaminhar um leitor de
    primeira vez para a ordem de publicação exatamente por esta razão;
    esta sequência foi construída para a segunda passagem pela série, não
    para a primeira.
  debated:
    - "A sequência em si não é contestada: a coluna de ordem cronológica da Wikipédia, a lista cronológica do próprio bookseriesinorder.com e o guia escrito de forma independente por T.L. Branson colocam todos os mesmos quatro romances (The Enemy, The Secret, Escola da Noite, The Affair, por esta ordem) antes de Do Fundo do Abismo, e nenhum dos três discorda quanto a qualquer um dos restantes 27 romances."
    - "Ler primeiro as quatro prequelas é fortemente desaconselhado para uma primeira leitura, pela razão indicada na justificação. A própria página de ordem de leitura de jackreacher.com remete os novos leitores, por defeito, para a ordem de publicação, apesar de dizer que os livros podem ser lidos por qualquer ordem, e o guia de T.L. Branson afirma diretamente a mesma preferência: comece por Do Fundo do Abismo, a não ser que já saiba que se vai comprometer com a série inteira."
    - "As duas coletâneas de contos, os quatro contos independentes de Reacher nunca recolhidos, o ensaio de não-ficção e as memórias de 2025 ficam fora do âmbito desta ordem; ver o comentário de cabeçalho deste ficheiro para a razão de cada exclusão, em vez de uma suposição."
