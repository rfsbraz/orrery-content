# Overlay pt-PT das sinopses. NUNCA inclui `title`: o título traduzido é dado
# pela edição (ver editions.yaml), não tradução de prosa.
# Títulos citados dentro das sinopses usam a edição portuguesa publicada
# quando existe: Killing Floor -> "Do Fundo do Abismo" (Edições Asa, 2003).
# As restantes obras citadas (Blue Moon) não têm edição em português e ficam
# no título original.
- id: lee-child/killing-floor
  synopsis: "Ao descer de um autocarro Greyhound na pequena cidade de Margrave, na Geórgia, para investigar um velho boato sobre um músico de blues, Reacher é preso por homicídio poucas horas depois de chegar - o caso que abre a sua vida fora do Exército e o primeiro romance da série."

- id: lee-child/die-trying
  synopsis: "Apanhado num rapto de rua em Chicago destinado à agente do FBI Holly Johnson, Reacher é arrastado até ao complexo de uma milícia separatista armada no Montana, sem ainda saber porque é que ela lhes interessa tanto."

- id: lee-child/tripwire
  synopsis: "O homicídio de um investigador privado em Key West arrasta Reacher de volta ao seu próprio passado militar, até um veterano do Vietname dado como desaparecido em combate décadas antes e que reaparece a guardar um segredo pelo qual vale a pena matar."

- id: lee-child/the-visitor
  synopsis: "Recrutado pelo FBI, Reacher persegue um assassino que visa antigas militares do Exército e não deixa provas forenses."

- id: lee-child/echo-burning
  synopsis: "A pedir boleia pelo Texas depois de uma briga num bar, Reacher aceita a boleia de uma mulher que quer ajuda com o marido, e torna-se o principal suspeito de um homicídio antes de o dia terminar."

- id: lee-child/without-fail
  synopsis: "Contratado para testar a capacidade dos Serviços Secretos de proteger um futuro vice-presidente, Reacher descobre que o atentado que devia estar apenas a imaginar é real."

- id: lee-child/persuader
  synopsis: "A trabalhar extraoficialmente com um agente da DEA, Reacher infiltra-se numa operação de contrabando para resolver um assunto pendente dos seus anos de farda."

- id: lee-child/the-enemy
  synopsis: "Uma prequela situada na última noite de 1989: o major Reacher investiga a morte suspeita de um general num motel degradado e vê a política interna do próprio Exército a atravessar-se-lhe no caminho."

- id: lee-child/one-shot
  synopsis: >
    Um tiroteio de um franco-atirador numa praça do Indiana parece
    resolvido assim que o suspeito é detido, só que a única coisa que ele
    diz é "tragam o Jack Reacher."

- id: lee-child/the-hard-way
  synopsis: "Em Manhattan, Reacher é envolvido na busca de um homem rico pela mulher e enteada raptadas, num caso assente em mais mentiras do que esperava."

- id: lee-child/bad-luck-and-trouble
  synopsis: "Um a um, os membros sobreviventes da antiga unidade de investigação militar de Reacher estão a ser assassinados, e ele reúne a equipa para descobrir porquê."

- id: lee-child/nothing-to-lose
  synopsis: "A caminhar pela estrada entre duas pequenas cidades vizinhas do Colorado, uma acolhedora e outra hostil, Reacher tropeça numa conspiração que nenhuma das duas quer ver examinada de perto."

- id: lee-child/gone-tomorrow
  synopsis: "Reacher repara nos sinais reveladores de um homem-bomba suicida numa carruagem do metro de Nova Iorque a altas horas da noite, e um tiroteio fatal arrasta-o para uma conspiração anos a preparar-se."

- id: lee-child/61-hours
  synopsis: "Isolado pela neve numa pequena cidade do Dakota do Sul depois de o autocarro se despistar, Reacher torna-se a proteção de uma testemunha idosa contra uma rede de metanfetaminas apoiada por alguém bem maior do que os traficantes locais."

- id: lee-child/worth-dying-for
  synopsis: "Num condado do Nebraska governado pelo medo, a decisão de Reacher de ajudar uma mulher maltratada põe-no contra a família que controla toda a gente ali, e um desaparecimento por resolver que ninguém esqueceu."

- id: lee-child/the-affair
  synopsis: "Uma prequela situada seis meses antes de Do Fundo do Abismo: enviado disfarçado para investigar um homicídio perto de uma base do Exército no Mississípi, Reacher trabalha o seu último caso de farda antes de deixar o Exército de vez."

- id: lee-child/a-wanted-man
  synopsis: "De boleia outra vez, Reacher aceita a boleia de três desconhecidos cujas histórias não batem certo, e acaba ligado a uma conspiração que o transforma em alvo de todos os lados."

- id: lee-child/never-go-back
  synopsis: "Reacher regressa ao quartel-general da sua antiga unidade para enfrentar uma acusação de homicídio de décadas antes e uma alegação de paternidade inesperada, ambas fabricadas para o impedir de fazer as perguntas erradas."

- id: lee-child/personal
  synopsis: "Depois de um disparo de franco-atirador contra o Presidente francês ser rastreado até munições fabricadas nos Estados Unidos, Reacher é chamado de volta ao serviço do governo para caçar um atirador que ele próprio ajudou a prender."

- id: lee-child/make-me
  synopsis: "Curioso com o nome de uma pequena cidade do Midwest chamada Mother's Rest, Reacher sai do comboio ali e encontra um desaparecimento que dá acesso a algo muito maior do que um homem desaparecido."

- id: lee-child/night-school
  synopsis: "Uma prequela situada em 1996: destacado para uma força-tarefa interagências secreta, o major Reacher investiga um americano a vender algo a extremistas por um preço enorme."

- id: lee-child/the-midnight-line
  synopsis: "Um anel de finalista de West Point empenhado convence Reacher de que a dona nunca o teria vendido de livre vontade, e a busca por ela arrasta-o para o tráfico de opioides que está a destruir uma pequena cidade do Midwest."

- id: lee-child/past-tense
  synopsis: "Um desvio até à terra natal do pai, no New Hampshire, torna-se estranho quando Reacher descobre que nunca ali viveu ninguém com o apelido Reacher, enquanto dois jovens viajantes ficam presos num motel nos arredores da cidade."

- id: lee-child/blue-moon
  synopsis: "Reacher intervém para impedir um assalto e acaba por proteger um casal idoso do agiota a quem devem dinheiro, desencadeando uma guerra de território entre dois grupos criminosos rivais."

- id: lee-child/the-sentinel
  synopsis: "Reacher protege um administrador de informática despedido numa pequena cidade, culpado por um ataque de ransomware e perseguido por homens armados que o querem silenciado antes que possa explicar o que realmente aconteceu."

- id: lee-child/better-off-dead
  synopsis: "No deserto do Arizona, Reacher junta-se a uma veterana do Exército tornada agente do FBI que procura o irmão gémeo desaparecido, e o rasto leva a uma cidade fronteiriça inteiramente controlada nas sombras."

- id: lee-child/no-plan-b
  synopsis: "Convencido de que a morte de uma mulher debaixo de um autocarro foi um homicídio disfarçado de suicídio, Reacher segue o rasto até uma prisão privada no Mississípi, onde uma libertação agendada não é o que parece."

- id: lee-child/the-secret
  synopsis: "Uma prequela situada em 1992: destacado para uma força-tarefa interagências que investiga uma série de mortes encenadas para parecerem acidentes, o capitão Reacher descobre um encobrimento com raízes num projeto militar arquivado."

- id: lee-child/in-too-deep
  synopsis: "Reacher acorda algemado, ferido e sem memória de dois dias, retido por homens que presumem que ele foi cúmplice na morte do condutor de quem tinha aceitado boleia."

- id: lee-child/exit-strategy
  synopsis: "Três paragens não planeadas em Baltimore num só dia arrastam Reacher para o pedido de ajuda desesperado de um administrador portuário e um esquema de extorsão que termina debaixo de terra, numa velha mina de calcário."

- id: lee-child/chain-reaction
  synopsis: "A general Susan Turner localiza Reacher depois de um membro da sua equipa secreta ser assassinado, enviando-o a uma cidade quase vazia do Colorado construída à volta de um conjunto de centros de dados."

- id: lee-child/the-hero
  synopsis: "A primeira obra de não-ficção de Child: um breve ensaio que traça a ideia do herói desde Aquiles a Robin dos Bosques até James Bond, e porque perdura essa figura."

- id: lee-child/no-middle-name
  synopsis: "Uma coletânea de duas novelas e dez contos, reunindo as peças independentes de Reacher que Child publicou entre romances a partir de 1999."

- id: lee-child/safe-enough
  synopsis: >
    Dezanove contos policiais que percorrem a carreira de Child fora de
    Reacher, reunidos das revistas e antologias onde foram publicados pela
    primeira vez, mais uma peça inédita: um crossover exclusivo entre Jack
    Reacher e Maggie Bird, escrito com Tess Gerritsen.

- id: lee-child/killer-year-stories-to-die-for
  synopsis: "Uma antologia que dá a conhecer a geração de estreantes de 2007 do Killer Year, da International Thriller Writers, com contos inéditos apresentados por mentores já consagrados."

- id: lee-child/first-thrills
  synopsis: "Uma antologia da International Thriller Writers que junta autores consagrados de best-sellers a novos escritores estreantes em contos inéditos."

- id: lee-child/best-american-mystery-stories-2010
  synopsis: "O décimo quarto volume da antologia anual de Otto Penzler; Child atuou como editor convidado, selecionando os vinte melhores contos policiais publicados nesse ano."

- id: lee-child/jack-reachers-rules
  synopsis: "Uma compilação, em formato de livro de oferta, das próprias máximas e observações de Reacher, retiradas dos romances publicados até 2012, com uma introdução inédita de Child."

- id: lee-child/the-christmas-scorpion
  synopsis: >
    Isolado por uma nevasca fora do normal numa pequena cidade do sul da
    Califórnia, no Natal, Reacher abriga-se numa taberna de estrada com
    desconhecidos que escoltavam uma personalidade a uma reunião militar
    secreta, até chegar a notícia de que o assassino mais perigoso do
    mundo se aproxima.

- id: lee-child/anatomy-of-innocence
  synopsis: "Uma coletânea de ensaios sobre condenações injustas, organizada por Laura Caldwell; o capítulo de Child conta a história de Kirk Bloodsworth, o primeiro americano libertado do corredor da morte graças a provas de ADN."

- id: lee-child/smile
  synopsis: "Um grupo secreto de agentes dos serviços de informação segue o rasto de Reacher pelo aeroporto de Heathrow."

- id: lee-child/the-fourth-man
  synopsis: "Um agente do FBI localiza Reacher para lhe dizer que o seu nome surgiu numa lista encontrada numa rusga a uma casa na Austrália, e Reacher parte à procura de saber porquê."

- id: lee-child/the-nicotine-chronicles
  synopsis: "Um volume da série Drug Chronicles da Akashic Books; Child organizou a antologia e contribuiu com um conto próprio, mais tarde reeditado em Safe Enough."

- id: lee-child/how-to-write-a-mystery
  synopsis: "Um manual da Mystery Writers of America com ensaios sobre o ofício, escritos por romancistas policiais em atividade, sobre os conselhos de escrita que gostariam de ter tido quando começaram."

- id: lee-child/many-happy-returns
  synopsis: "Pouco antes do Natal, o MI5 repara em alguém a comportar-se de forma estranha nas câmaras de vigilância de Heathrow, e Reacher é chamado a descobrir porquê."

- id: lee-child/reacher-the-stories-behind-the-stories
  synopsis: >
    O relato do próprio Child sobre a escrita dos primeiros vinte e quatro
    romances de Reacher, livro a livro, desde Do Fundo do Abismo até Blue
    Moon, terminando com "A Better Place", um conto inédito de Reacher.
