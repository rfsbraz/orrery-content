pseudonyms:
  - name: Danielle Brown
    note: >
      The byline on the 1995 first edition of
      [[work:dan-brown/187-men-to-avoid|187 Men to Avoid]], his first
      published book, three years before Digital Fortress. Reissued under
      his own name in 2006 once he was established.
lifeEvents:
  - id: db-born-1964
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1964-06-22
    title: Born in Exeter, New Hampshire, into a household built on puzzles
    impact: high
    description: >
      Born in Exeter, New Hampshire, and raised on the campus of Phillips
      Exeter Academy, where his father taught mathematics and his mother
      trained as a church organist. Codes and ciphers were, in his own
      account, the link between his parents' two disciplines, and the family
      marked birthdays and holidays with elaborate treasure hunts his father
      devised, sending the children through coded clues around the house and
      town rather than straight to a pile of gifts. Brown has said his
      relationship with his father directly shaped the one between Jacques
      Sauniere and Sophie Neveu in
      [[work:dan-brown/the-da-vinci-code|The Da Vinci Code]], and that one
      chapter of that novel is drawn straight from a childhood hunt: the
      puzzle-chain-under-time-pressure structure of every Langdon novel
      traces to this household, not to an invented thriller convention.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Dan_Brown
  - id: db-marries-blythe-newlon-1997
    organisation: beside
    illustration_type: relationship-tableau
    images_required: 1
    date: 1997
    title: Marries Blythe Newlon, who reshapes every novel that follows
    impact: high
    description: >
      Brown meets Blythe Newlon in Los Angeles in the early 1990s, when he is
      an aspiring singer-songwriter and she directs artist development at the
      National Academy of Songwriters; the two marry in 1997. Newlon, about
      twelve years his senior and later an art historian, becomes his
      primary researcher and first reader - by his own account in a 2006
      court witness statement, she is mentioned in more than a quarter of
      its paragraphs. She reads source material, "highlighting exciting
      ideas," and by Brown's own telling pushes him toward the strand of
      early-Church history that would define
      [[work:dan-brown/the-da-vinci-code|The Da Vinci Code]] - the material
      he credits to her rather than to himself.
    spoilerAfter: null
    sources:
      - https://www.today.com/popculture/da-vinci-code-key-dan-brown-s-wife-wbna11865556
  - id: db-angels-demons-cd-ambigram-1999
    organisation: diptych
    illustration_type: symbolic-still-life
    images_required: 2
    date: 1999
    title: A last, failed CD gives Robert Langdon his name
    impact: high
    description: >
      By Brown's own sworn account in his 2006 High Court witness statement,
      he first sees the ambigram artwork of John Langdon - "a close friend
      of my father" - in the early 1990s, and is impressed enough to
      commission Langdon for the cover of a self-produced CD of his own,
      titled Angels & Demons after the religious themes that already
      interest him. The CD is released in 1999 - three years into Brown's
      published writing career, not 1994, the year usually repeated for it -
      with Langdon's ambigram on the cover. A year later, Simon & Schuster
      reuses the same ambigram on the first edition of
      [[work:dan-brown/angels-demons|Angels & Demons]] the novel, and
      Langdon lends both his name and, in Brown's own words, part of his
      inspiration to Robert Langdon, the character who has carried every
      Brown thriller since.
    spoilerAfter: null
    sources:
      - https://www.johnlangdon.net/works/angels-demons/
      - https://drexel.edu/news/archive/2009/may/ambigram-artist-and-drexels-john-langdon-behind-symbols-appearing-in-angels--demons
  - id: db-da-vinci-code-breaks-out-2003
    organisation: immersion
    illustration_type: establishing-landscape
    images_required: 1
    modifier: anchor-with-satellites
    date: 2003-03-18
    title: "The Da Vinci Code turns a mid-list thriller writer into a phenomenon"
    impact: high
    description: >
      Brown's first three novels had sold fewer than 10,000 copies each in
      their first printings. [[work:dan-brown/the-da-vinci-code|The Da Vinci
      Code]] went to the top of the New York Times bestseller list in its
      first week, pulled all three earlier novels back onto the list with
      it, and had sold more than 80 million copies by 2009 - the hinge that
      turned a struggling genre writer into one of the best-selling authors
      alive and set the template (Christian history, a 24-hour chase, a
      secret society) every later Langdon novel works from.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Dan_Brown
  - id: db-exeter-technology-endowment-2004
    organisation: floating-object
    illustration_type: book-object
    images_required: 1
    date: 2004-10
    title: Endows a technology fund at Exeter in his father's name
    impact: low
    description: >
      Days before The Da Vinci Code's paperback release, Brown and his
      siblings Valerie and Gregory announce a $2.2 million gift to their
      father's school, Phillips Exeter Academy, at the black-tie launch of
      the school's largest-ever fundraising campaign. It creates the
      Richard G. Brown Technology Endowment, providing computers and
      high-tech equipment to students who cannot afford them, in honor of
      the 35 years (1962-1997) their father spent teaching mathematics and
      writing textbooks there. Seven years later, on April 14, 2011, Brown
      and Newlon separately endow a writing-focused scholarship fund at his
      own alma mater, Amherst College, to mark his 25th class reunion.
    spoilerAfter: null
    sources:
      - https://web.archive.org/web/20090523225741/http://phillips.exeter.edu/ei/news/news_danbrown.html
      - https://en.wikipedia.org/wiki/Dan_Brown
  - id: db-ritman-library-donation-2016
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 2016-06
    title: Funds the digitization of the esoteric library behind two Langdon novels
    impact: low
    description: >
      Brown donates 300,000 euros (about $340,000) to Amsterdam's Ritman
      Library, home to a roughly 25,000-volume private collection of
      Hermetic, alchemical and esoteric texts he had visited repeatedly
      while researching [[work:dan-brown/the-lost-symbol|The Lost Symbol]]
      and [[work:dan-brown/inferno|Inferno]]. The gift funds digitization of
      the library's core pre-1900 holdings; director Esther Ritman calls him
      "a friend of the library." The relationship later leads Brown to open
      the Embassy of the Free Mind, a public center in Amsterdam built
      around the collection.
    spoilerAfter: null
    sources:
      - https://www.dutchnews.nl/2016/06/92088-2/
      - https://mymodernmet.com/ritman-library-dan-brown/
  - id: db-divorce-and-lawsuit-2021
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 2021-12
    title: Divorces after 22 years, then is sued over money and the story of the marriage
    impact: high
    description: >
      Brown and Newlon divorce in 2019. In June 2020, Newlon sues him in a
      New Hampshire court, calling his conduct "unlawful and egregious" and
      alleging he concealed marital assets - including future projects she
      says were worth "millions," among them the manuscript that becomes
      [[work:dan-brown/wild-symphony|Wild Symphony]] - while diverting money
      toward gifts for an unnamed horse trainer as part of what she
      describes as a pattern of affairs. Brown says he is "stunned" by the
      allegations and calls the complaint "written without regard for the
      truth," adding that Newlon received half their marital assets in the
      divorce. Neither account is tested in court: the two settle and
      jointly dismiss "any and all claims and counterclaims" in December
      2021, declining further comment. The suit reopens, without resolving,
      the question the 2006 copyright trial had already put on the record -
      how much of the work credited to Brown alone was actually Newlon's.
    spoilerAfter: null
    sources:
      - https://www.newsweek.com/da-vinci-code-author-dan-brown-ex-wife-settle-lawsuit-over-alleged-affairs-finances-1663718
      - https://www.cbsnews.com/boston/news/dan-brown-lawsuit-ex-wife-secret-life/
