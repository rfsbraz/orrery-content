id: shelly-tanaka
name: Shelley Tanaka
aka: ["Shelly Tanaka"]
born: null
died: null
bio: >
  Canadian children's author and editor from Toronto, a third-generation
  Japanese Canadian; fiction editor at Groundwood Books since 1983 and
  author of more than twenty children's and YA books. Co-wrote
  [[work:margaret-atwood/for-the-birds|For the Birds]] (1990) with Atwood;
  the cover of that edition credits her as "Shelly Tanaka."
sources:
  - https://en.wikipedia.org/wiki/Shelley_Tanaka
  - https://writersunion.ca/member/shelley-tanaka
