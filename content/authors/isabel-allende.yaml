# Global author entity. Authors are referenced by id from franchises and
# works (authorIds / withAuthorIds), so the same person resolves the same
# everywhere. Author-LIFE events live here; franchise-specific events belong
# in content/franchises/isabel-allende/events.yaml.
#
# FAMILY CONNECTION TO SALVADOR ALLENDE - resolved. Her father, Tomás
# Allende, was Salvador Allende's first cousin, making Isabel his first
# cousin once removed. Three independent, dated, editorially-accountable
# sources agree: her own official site's timeline (isabelallende.com/en/
# timeline, "a Chilean diplomat and first cousin of Salvador Allende");
# Linda Gould Levine's scholarly biography, Isabel Allende (Twayne, 2002,
# pp. 114-133); and Mirta Ojito, "A Writer's Heartbeats Answer Two Calls,"
# The New York Times, 28 July 2003 ("the only relative on her father's side
# with whom Ms. Allende had remained close was Salvador Allende"). English
# Wikipedia's own article on the debut novel independently carries the same
# figure in its infobox ("Salvador Allende (first cousin once removed)").
# Against this, Spanish Wikipedia's infobox alone reads "tío segundo"
# (second uncle) with no citation attached to that field at all - the same
# article's own prose instead says "primo hermano" (first cousin), and a
# third Spanish Wikipedia article (on Mi país inventado) calls him "su tío"
# (her uncle), a third term again. That spread of uncited, mutually
# inconsistent Spanish-language usage is not a rival sourced claim; it is
# the absence of one. "First cousin" / "first cousin once removed" stands.
#
# CITIZENSHIP DATE - checked hard, still genuinely unresolved. Her own
# official timeline states plainly, under a 1993 heading, "Isabel becomes
# an American citizen" - five years after her 1988 move to California,
# which is an ordinary marriage-based naturalization timeline. But a
# contemporary wire report - "Escritora Isabel Allende es ahora
# estadounidense," DPA via La Prensa (Panama), 4 June 2003, archived at
# https://web.archive.org/web/20111020112103/http://mensual.prensa.com/
# mensual/contenido/2003/06/04/hoy/revista/1053248.html - reports her
# naturalization as recent news at the time, quoting her directly on why
# she sought it (to sponsor her children from her first marriage) and
# stating she had "lived 15 years in California," which lands on 2003 by
# the same 1988 anchor. Habla Cultura's author profile independently gives
# "desde 2003" as well. Both years are internally consistent with the same
# 1988 start date and each rests on a source with real editorial
# accountability (her own record vs. a dated wire report); neither
# corroborates the other, and no third source was found to break the tie.
# Left unresolved; bio prose below states naturalization without a year.
id: isabel-allende
name: Isabel Allende
born: 1942-08-02
died: null
bio: >
  Born Isabel Angélica Allende Llona in Lima, Peru, where her father
  Tomás Allende was serving as a second secretary at the Chilean
  embassy, and raised mostly in Santiago, Chile after her parents
  separated in 1945, with further childhood years in La Paz, Bolivia and
  Beirut, Lebanon during her mother's second marriage to diplomat Ramón
  Huidobro. She worked for the United Nations Food and Agriculture
  Organization in Santiago and, later, Europe through the mid-1960s,
  then moved into Chilean journalism and television from 1967: on the
  editorial staff of Paula magazine, editor of the children's magazine
  Mampato, and author of a satirical newspaper-column collection,
  [[work:isabel-allende/civilice-a-su-troglodita|Civilice a Su
  Troglodita]] (1974) - by her own account her actual first published
  book, written on the advice of the poet Pablo Neruda, whom she had
  gone to interview and who told her she had too much imagination for
  journalism. She was also a playwright in Santiago in the early 1970s,
  with four staged plays between 1971 and 1975 (none confirmed published
  as scripts). She had married Chilean engineering student Miguel Frías
  in 1962; their children are Paula and Nicolás Frías Allende. After the
  11 September 1973 coup that overthrew her
  father's cousin, President Salvador Allende, and brought General
  Augusto Pinochet to power, she helped arrange safe passage for people
  on the new regime's wanted lists until she herself was threatened and
  fled with her family to Venezuela in 1975, working there as a
  journalist and school administrator for the next thirteen years. In
  Caracas in January 1981, on hearing that her 99-year-old grandfather
  was dying, she began a letter to him that grew into the manuscript of
  [[work:isabel-allende/la-casa-de-los-espiritus|La casa de los
  espíritus]] (1982), her literary debut and the novel that established
  her, alongside Gabriel García Márquez, as a leading voice of Latin
  American magical realism. She has written in that register and in
  historical fiction since, alongside memoir:
  [[work:isabel-allende/paula|Paula]] (1994) is an account of her
  daughter Paula Frías Allende's fatal 1991-1992 illness. She and Frías
  had divorced in 1987; she moved to California in 1988 after marrying
  her second husband, attorney William C. Gordon, and has lived in San
  Rafael since, though the marriage ended in a 2015 separation after 27
  years. In Paula's honor she founded the Isabel Allende Foundation in
  1996. She later became a naturalized United States citizen while
  keeping her Chilean citizenship (sources disagree on the year - see
  above). Chile awarded her its National Prize for Literature in 2010,
  and in 2014 she received the United States Presidential Medal of
  Freedom from Barack Obama. She married a third time, to lawyer Roger
  Cukras, in 2019, and continues to publish annually, by her own
  description starting a new book every 8 January - the anniversary of
  the letter that became her first novel.
pseudonyms: []
lifeEvents:
  - id: isabel-allende-born-1942
    date: 1942-08-02
    title: Born in Lima, raised across three countries
    impact: low
    description: >
      Born in Lima, Peru, where her father Tomás Allende was a Chilean
      diplomat; raised mostly in Santiago after her parents' 1945 split,
      with further childhood years in La Paz, Bolivia and Beirut,
      Lebanon during her mother's second marriage. The displacement
      recurs across her fiction's exiles and border-crossers.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/Isabel_Allende

  - id: isabel-allende-coup-1973
    date: 1973-09-11
    title: The coup against her father's cousin
    impact: high
    description: >
      General Augusto Pinochet's coup overthrows and kills President
      Salvador Allende, her father's first cousin (see this file's own
      header on the exact degree). Allende, then a journalist and
      television personality in Santiago, spends the following months
      helping people on the new regime's wanted lists reach safety,
      until she herself is threatened.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/Isabel_Allende

  - id: isabel-allende-exile-venezuela-1975
    date: 1975
    title: Blacklisted, flees to Venezuela
    impact: high
    description: >
      Added to Pinochet's wanted lists, she flees Chile with her husband
      and children for what becomes thirteen years of exile in Caracas.
      The loss of her country - and the fear of never returning - is the
      wound her early fiction returns to.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/Isabel_Allende

  - id: isabel-allende-caracas-journalism-1976
    date: 1976
    title: Rebuilding a working life in exile
    impact: low
    description: >
      With no clear way back to Chile, she supports her family in
      Caracas as a freelance contributor to the newspaper El Nacional
      from 1976 and, from 1979, as an administrator at the Colegio
      Marroco secondary school - the unglamorous years of exile between
      the coup and the letter that becomes her first novel.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://www.theguardian.com/books/2000/feb/05/isabelallende.fiction

  - id: isabel-allende-grandfather-letter-1981
    date: 1981-01-08
    title: The letter that becomes her first novel
    impact: high
    description: >
      On hearing that her 99-year-old grandfather is dying in Chile and
      unable to return to him, she begins a letter in Caracas that grows
      into the manuscript of La casa de los espíritus, published the
      following year. She has kept the date since, by her own account
      starting a new book every 8 January out of superstition.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/The_House_of_the_Spirits

  - id: isabel-allende-divorces-frias-1987
    date: 1987
    title: Divorces Miguel Frías
    impact: med
    description: >
      Twenty-five years after marrying, and nine years after a brief
      1978 separation, Allende and Miguel Frías divorce. She meets her
      second husband, California attorney William Gordon, on a book
      tour the following year.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/Isabel_Allende

  - id: isabel-allende-paula-dies-1992
    date: 1992-12-06
    title: Paula's death
    impact: high
    description: >
      Her daughter Paula, hospitalized in Madrid since falling into a
      porphyria-induced coma in December 1991, dies at 29 in Isabel and
      William Gordon's home in San Rafael, California. The grief becomes
      the memoir Paula (1994) and, in 1996, the foundation Allende
      starts in her name.
    spoilerAfter: isabel-allende/paula
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/Isabel_Allende
      - https://es.wikipedia.org/wiki/Isabel_Allende

  - id: isabel-allende-foundation-1996
    date: 1996-12
    title: Founds the Isabel Allende Foundation
    impact: med
    description: >
      In her daughter's name, Allende launches the Isabel Allende
      Foundation, funding programs that support the rights of women and
      children - work she has described as separate from her writing
      but no less a mission.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://en.wikipedia.org/wiki/Isabel_Allende

  - id: isabel-allende-my-invented-country-2003
    date: 2003
    title: My Invented Country and a writer's two countries
    impact: med
    description: >
      Her memoir Mi país inventado, on the pull between Chile and the
      United States after nearly three decades split between them, draws
      wide press attention, including a feature on Bill Moyers' PBS
      program NOW - a rare instance of the immigrant-identity theme
      running through her later fiction getting stated in her own voice,
      at length, outside a novel.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline

  - id: isabel-allende-medal-of-freedom-2014
    date: 2014-11-24
    title: Presidential Medal of Freedom
    impact: med
    description: >
      Barack Obama awards Allende the Presidential Medal of Freedom,
      the United States' highest civilian honor, at a White House
      ceremony; the announcement had come two weeks earlier.
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://obamawhitehouse.archives.gov/blog/2014/11/10/president-obama-announces-presidential-medal-freedom-recipients

  - id: isabel-allende-separates-gordon-2015
    date: 2015-04
    title: Separates from William Gordon
    impact: med
    description: >
      After 27 years of marriage, Allende and William Gordon separate.
      She has said she was finishing The Japanese Lover, written before
      the split, as the marriage was already ending - "a time for me to
      reflect upon love and relationships, romance and passion, ageing,
      memory, loss."
    spoilerAfter: null
    sources:
      - https://www.isabelallende.com/en/timeline
      - https://www.independent.co.uk/arts-entertainment/books/features/isabel-allende-the-japanese-fiction-comes-from-the-womb-not-the-brain-book-review-a6733596.html
