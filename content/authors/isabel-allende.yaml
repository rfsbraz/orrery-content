# Global author entity. Authors are referenced by id from franchises and
# works (authorIds / withAuthorIds), so the same person resolves the same
# everywhere. Author-LIFE events live here; franchise-specific events belong
# in content/franchises/isabel-allende/events.yaml. lifeEvents is left
# empty: real, well-documented anchors exist (the Lima birth and the
# Santiago/La Paz/Beirut childhood, the 1973 coup and 1975 flight to
# Venezuela, the January 1981 letter to her dying grandfather that became
# La casa de los espíritus, her daughter Paula's 1991-1992 illness and
# death, the 2014 Presidential Medal of Freedom), but a dated, sourced
# lifeEvent entry also needs the layout-grammar fields
# (docs/SCHEMA.md's organisation/illustration_type/images_required) that
# depend on a visual language this wing does not have yet. The clearest
# anchors are folded into bio prose below instead, so none of them is lost.
#
# FAMILY CONNECTION TO SALVADOR ALLENDE - sourced, but the exact degree is
# not settled across sources, and this file does not resolve it. Her own
# official site's timeline (isabelallende.com/en/timeline, cited by English
# Wikipedia) calls her father, Tomás Allende, "a Chilean diplomat and first
# cousin of Salvador Allende" - which would make Isabel his first cousin
# once removed, the exact phrasing both English Wikipedia's infobox and
# prose use, each sourced onward to Linda Gould Levine's Isabel Allende
# (Twayne, 2002) and to a New York Times profile ("the only relative on her
# father's side with whom Ms. Allende had remained close was Salvador
# Allende"). Spanish Wikipedia's own prose agrees ("primo hermano" - first
# cousin) but its infobox instead reads "tío segundo" (second uncle), and
# the same article separately notes that some publications wrongly call
# the two men brothers. Two independently-sourced accounts (her own site;
# the NYT profile via Levine) support "father's first cousin" specifically;
# the infobox figure is not corroborated elsewhere found. Nothing about
# this connection is asserted as a lifeEvent here - see the note above.
#
# CITIZENSHIP DATE. Sources disagree on the year she naturalized as a U.S.
# citizen: English Wikipedia's prose gives 1993, Spanish Wikipedia's
# infobox gives 2003 (citing a Big Think interview and a Habla Cultura
# profile). Not resolved here; bio prose below states the fact without
# picking a year.
id: isabel-allende
name: Isabel Allende
born: 1942-08-02
died: null
bio: >
  Born Isabel Angélica Allende Llona in Lima, Peru, where her father
  Tomás Allende was serving as a second secretary at the Chilean
  embassy, and raised mostly in Santiago, Chile after her parents
  separated in 1945, with further childhood years in La Paz, Bolivia and
  Beirut, Lebanon during her mother's second marriage to diplomat Ramón
  Huidobro. She worked for the United Nations Food and Agriculture
  Organization in Santiago and, later, Europe through the mid-1960s,
  then moved into Chilean journalism and television from 1967: on the
  editorial staff of Paula magazine, editor of the children's magazine
  Mampato, and author of a satirical newspaper-column collection,
  [[work:isabel-allende/civilice-a-su-troglodita|Civilice a Su
  Troglodita]] (1974) - by her own account her actual first published
  book, written on the advice of the poet Pablo Neruda, whom she had
  gone to interview and who told her she had too much imagination for
  journalism. She was also a playwright in Santiago in the early 1970s,
  with four staged plays between 1971 and 1975 (none confirmed published
  as scripts). After the 11 September 1973 coup that overthrew her
  father's cousin, President Salvador Allende, and brought General
  Augusto Pinochet to power, she helped arrange safe passage for people
  on the new regime's wanted lists until she herself was threatened and
  fled with her family to Venezuela in 1975, working there as a
  journalist and school administrator for the next thirteen years. In
  Caracas in January 1981, on hearing that her 99-year-old grandfather
  was dying, she began a letter to him that grew into the manuscript of
  [[work:isabel-allende/la-casa-de-los-espiritus|La casa de los
  espíritus]] (1982), her literary debut and the novel that established
  her, alongside Gabriel García Márquez, as a leading voice of Latin
  American magical realism. She has written in that register and in
  historical fiction since, alongside memoir:
  [[work:isabel-allende/paula|Paula]] (1994) is an account of her
  daughter Paula Frías Allende's fatal 1991-1992 illness, in whose honor
  she founded the Isabel Allende Foundation in 1996. She moved to
  California in 1988 after marrying her second husband, attorney William
  C. Gordon, and has lived in San Rafael since; she later became a
  naturalized United States citizen while keeping her Chilean
  citizenship (sources disagree on the year - see above). Chile awarded
  her its National Prize for Literature in 2010, and in 2014 she
  received the United States Presidential Medal of Freedom from Barack
  Obama. She married a third time, to lawyer Roger Cukras, in 2019, and
  continues to publish annually, by her own description starting a new
  book every 8 January - the anniversary of the letter that became her
  first novel.
pseudonyms: []
lifeEvents: []
sources:
