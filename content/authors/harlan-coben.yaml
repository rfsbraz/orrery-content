# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
#
# Identity verified against two independent primary sources before anything
# else was built on it: Wikipedia's own infobox (born January 4, 1962, Newark,
# New Jersey) and harlancoben.com's own bio page, which agree on birth date,
# birthplace, Livingston upbringing, Amherst College, and the Myron Bolitar
# series as his breakout work. This is the American thriller writer behind the
# Myron Bolitar novels, not a namesake.
#
# Four lifeEvents: this is a career built on discipline and a fairly private
# family life rather than scandal, so the record does not offer twelve. The
# one true rupture - his father's sudden death in his 20s - is graded high
# because Coben has said so himself, on the record, twice independently; the
# rest are graded med or low deliberately rather than inflated to fill space.
# Anything about his health, finances or family beyond what appears here was
# either single-sourced or not found: no illness, addiction or legal trouble
# is discoverable in the contemporary or current record.
id: harlan-coben
name: Harlan Coben
aka: []
born: 1962-01-04
died: null
bio: >
  American writer of mystery and thriller novels, born in Newark, New Jersey
  and raised in Livingston, where he graduated from Livingston High School
  alongside future governor Chris Christie. Studied political science at
  Amherst College, graduating in 1984, and worked in his grandfather's travel
  business before his first novel,
  [[work:harlan-coben/play-dead|Play Dead]] (1990), was accepted for
  publication. His third novel, [[work:harlan-coben/deal-breaker|Deal
  Breaker]] (1995), introduced sports agent turned amateur investigator Myron
  Bolitar and launched a still-running series; a large body of standalone
  thrillers followed from
  [[work:harlan-coben/tell-no-one|Tell No One]] (2001) on, later joined by
  further series built around recurring characters from Myron's world. Coben
  is the first author to win the Edgar, Shamus and Anthony Awards, and his
  books have been translated into 46 languages. He lives in Ridgewood, New
  Jersey with his wife, pediatrician Anne Armstrong-Coben, and their four
  children.
pseudonyms: []
images:
  portrait: "https://upload.wikimedia.org/wikipedia/commons/7/76/Harlan_Coben_cropped_12_mars_2009.jpg"
  portraitCredit: "KoS, CC BY-SA 3.0"
  portraitSource: "https://commons.wikimedia.org/wiki/File:Harlan_Coben_cropped_12_mars_2009.jpg"
  # Already cropped to a head-and-shoulders portrait by the photographer,
  # taken at a Fnac Saint-Lazare signing in Paris, 12 March 2009. Preferred
  # over two other licensed candidates on Commons (a 2008 LA Times Festival
  # of Books shot with a visible event lanyard, and a 2018 Lyon festival
  # photo in a cluttered venue) for being the cleanest close portrait crop.
lifeEvents:
  - id: coben-travel-agency-writing-1990
    date: 1990
    title: Selling package tours while writing on the side
    impact: med
    description: >
      After graduating Amherst in 1984, Coben spent about six years running
      group tours out of his grandfather's travel agency in Union, New
      Jersey, writing on the side. [[work:harlan-coben/play-dead|Play
      Dead]], his debut, was accepted for publication when he was 26 and
      released in 1990; he has said the idea for it came directly out of
      that job. He did not leave the travel business behind until the Myron
      Bolitar series took hold several years later.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Harlan_Coben"
      - "https://www.bigissue.com/culture/books/harlan-coben-interview-books-netflix-parents-death/"

  - id: coben-father-dies-1988
    date: 1988
    title: His father's sudden death at 59
    impact: high
    description: >
      Coben's father died of a heart attack at 59 in 1988, the first of what
      Coben has since called "quite a bit of tragedy" in his 20s, a decade
      that also took his mother and, by his own count, ran to some seven
      eulogies. Speaking in 2025 he called his father's death "still the
      most traumatic" of the losses, "because it was the first one. It came
      out of nowhere," and credited that decade of grief directly for his
      writing: "tragedy is a very cruel but effective teacher... it helped
      push me and made my writing better." He wrote about his father
      directly once, in "The Key to My Father," a Father's Day essay
      commissioned by the New York Times op-ed page in 2003, the first
      original fiction the page had run in more than a decade.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Harlan_Coben"
      - "https://www.bigissue.com/culture/books/harlan-coben-interview-books-netflix-parents-death/"
      - "https://www.harlancoben.com/bio/"

  - id: coben-triple-award-1997
    date: 1997
    title: First author to win the Edgar, Shamus and Anthony
    impact: med
    description: >
      [[work:harlan-coben/deal-breaker|Deal Breaker]] won the 1996 Anthony
      Award for Best Paperback Original; the following year
      [[work:harlan-coben/fade-away|Fade Away]] won both the Edgar and the
      Shamus in the same category, completing a set no crime writer had held
      before. It is the credential every later bio leads with, and it landed
      on his second and third novels, years before the standalones or any
      screen adaptation existed.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Harlan_Coben"
      - "https://www.harlancoben.com/bio/"

  - id: coben-daughter-charlotte-writer-2020
    date: 2020
    title: His daughter joins him as a screenwriter
    impact: low
    description: >
      Charlotte Coben, one of his four children, wrote the fifth episode of
      the 2020 Netflix adaptation of [[work:harlan-coben/the-stranger|The
      Stranger]], her first writing credit on one of her father's shows; he
      has said it was producer Nicola Shindler's idea, not his, and that he
      now relies on her on every production. She went on to write further
      episodes for the Stay Close and Shelter adaptations.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Harlan_Coben"
      - "https://www.tyla.com/tv-and-film/stay-close-harlan-coben-daughter-writer-charlotte-coben-netflix-20220107"
sources:
