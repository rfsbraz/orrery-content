id: john-beckwith
name: John Beckwith
aka: []
born: 1927-03-09
died: 2022-12-05
bio: >
  Canadian composer and scholar, born in Victoria, British Columbia; on the
  University of Toronto's Faculty of Music from 1952 (dean 1970-1977) and a
  leading authority on Canadian music. Composed the music for
  [[work:margaret-atwood/the-trumpets-of-summer|The Trumpets of Summer]]
  (1964) to Atwood's text, commissioned by the CBC for the Shakespeare
  quatercentenary.
sources:
