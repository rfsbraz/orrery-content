bio: >
  English theatre director. Co-originated the story of
  [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter and the
  Cursed Child]] with [[author:jk-rowling|J. K. Rowling]] and playwright
  [[author:jack-thorne|Jack Thorne]], and directed its stage productions; the
