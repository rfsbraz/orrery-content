# Global author entity. Authors are referenced by id from franchises and
# works (authorIds / withAuthorIds), so the same person resolves the same
# everywhere. Author-LIFE events live here; franchise-specific events stay in
# content/franchises/matt-dinniman/events.yaml.
id: matt-dinniman
name: Matt Dinniman
aka: []
born: null
died: null
bio: >
  American writer and artist. His father served in the U.S. Army and the
  family moved frequently while he was growing up, a childhood he has
  described as being a "military brat"; once his father retired in Tucson,
  Arizona, he attended and graduated from Sabino High School, later studying
  at the University of Arizona and Prescott College and taking creative
  writing classes at Pima Community College. He started his first novel,
  the basis of The Shivered Sky trilogy, as a high-school senior. After
  college he worked at a newspaper in Yakima, Washington writing obituaries,
  and discovered an aptitude for illustration that led him to travel to pet
  and cat shows drawing portraits of owners' animals for a living. Through
  the 2010s, working those art booths, he published
  [[work:matt-dinniman/the-grinding|The Grinding]] and the first two books of
  the unfinished [[work:matt-dinniman/dominion-of-blades|Dominion of Blades]]
  series. In 2019 he began serializing a new project on the web-fiction
  platform Royal Road, partly inspired by a tortoise-shell Persian cat he had
  sketched at a show; when the COVID-19 pandemic shut down the pet-show
  circuit in 2020, he self-published the finished novel on Amazon as
  [[work:matt-dinniman/dungeon-crawler-carl|Dungeon Crawler Carl]]. An
  audiobook narrated by Jeff Hays followed in 2021, and the series was
  acquired for print publication by Penguin Random House's Ace Books in
  2024, with Dinniman retaining the e-book and audiobook rights. As of 2026
  the series runs to eight volumes with more than fourteen million copies
  sold, was shortlisted for the 2026 Arthur C. Clarke Award, and has been
  given a straight-to-series order by Peacock, produced by Seth MacFarlane's
  Fuzzy Door. He plays bass in a band. He and his wife settled in the
  Pacific Northwest during the 2010s, first on Bainbridge Island and then in
  Gig Harbor, Washington, where they live with their four children; around
  2026 he began a move back to Tucson to be closer to his mother and his
  wife's family.
pseudonyms: []

# No source establishes an exact, or even a specific, birth year. Wikipedia
# gives only "ca. 1970s", citing a single profile, and carries its own "Year
# of birth missing" category; his own site's About/FAQ page, the Seattle Met
# and Gig Harbor Now profiles, the Grimdark Magazine and Audible interviews,
# and a Tucson TV profile were all checked directly and none states an age,
# a birth year, or a graduation year precise enough to back-calculate one -
# the closest anything comes is Seattle Met's "in his early 50s" (May 2026),
# a bracket, not a date. Every wing's timeline is expected to open on a
# birth-dated anchor (CURATION.md, "the aura editorial standard"), and that
# anchor cannot be sourced here; this file opens instead on the earliest
# dated fact the record actually gives, a 2017 novel.
lifeEvents:
  - id: matt-dinniman-dominion-of-blades-addiction-2017
    date: 2017-03-21
    title: A death-game about the addiction he avoids in real life
    impact: low
    description: >
      By his own account he has deliberately avoided the most addictive
      MMORPGs - he never played World of Warcraft, knowing his "addictive
      personality" would cost him a year of his life to it. Dominion of
      Blades, his first novel about players trapped inside a lethal
      full-immersion game with no way to log out, channels exactly that
      fear onto characters who never get the choice he gave himself.
    sources:
      - https://www.audible.com/blog/matt-dinniman-dungeon-crawler-carl-audio-interview

  - id: matt-dinniman-meets-jeff-hays-2019
    date: 2019-06-07
    title: Meets future narrator Jeff Hays in Kansas City
    impact: med
    description: >
      The Hobgoblin Riot, his second Dominion of Blades novel, wins the
      Game-Lit category at the Independent Audiobook Awards, held that year
      in Kansas City as part of the HEAR Now Festival. Fellow attendee Jeff
      Hays, a Kansas City-based narrator he had not worked with before, is
      in the room; the two meet and become friends. When he starts writing
      Dungeon Crawler Carl six months later he already has Hays's voice in
      mind, and the resulting audiobooks - not the print or e-book editions
      - become the series' single largest source of sales.
    sources:
      - https://mattdinniman.com/about/
      - https://www.audible.com/blog/matt-dinniman-dungeon-crawler-carl-audio-interview
      - https://www.independentaudiobookawards.com/past-awards
      - https://hearnowfestival2019.sched.com/list/descriptions/

  - id: matt-dinniman-starts-dcc-2019
    date: 2019-12-26
    title: Starts writing Dungeon Crawler Carl
    impact: med
    description: >
      Begins the book that becomes Dungeon Crawler Carl on December 26,
      2019, purely as a hobby with no expectation anyone will read it, and
      posts it free on the web-fiction platform Royal Road. Its cat
      character is drawn from a tortoiseshell Persian he had sketched at a
      cat show years earlier, whose stare made him think, "I'm going to
      write a book with that cat in it one day."
    sources:
      - https://www.audible.com/blog/matt-dinniman-dungeon-crawler-carl-audio-interview
      - https://mattdinniman.com/about/

  - id: matt-dinniman-pandemic-ends-income-2020
    date: 2020-03
    title: The pandemic ends his cat-show income
    impact: high
    description: >
      When the pandemic shuts down public events in March 2020, the
      pet-show circuit that had been quietly supporting his family -
      commissioned cat and dog portraits at Cat Fanciers' Association
      shows, a trade he had backed into after a newspaper obituary-writing
      job forced him to learn Adobe Photoshop - disappears overnight along
      with the rest of his income. With nothing left to lose he finishes
      the story he had been posting for fun and self-publishes it on Amazon
      that September as Dungeon Crawler Carl.
    sources:
      - https://www.audible.com/blog/matt-dinniman-dungeon-crawler-carl-audio-interview
      - https://www.seattlemet.com/arts-and-culture/2026/05/dungeon-crawler-carl-matt-dinniman
      - https://www.gigharbornow.org/news/arts-entertainment/dungeon-crawler-carl-author-matt-dinniman-where-is-matt-dinniman-from/

  - id: matt-dinniman-ace-books-deal-2024
    date: 2024
    title: Ace Books acquires Dungeon Crawler Carl for print
    impact: med
    description: >
      Penguin Random House's Ace Books signs him for print publication in
      2024, on the unusual condition that he keeps his e-book and audiobook
      rights rather than selling them along with print - the two formats
      that between them already account for most of the series' readers.
      The first Ace hardcover, carrying a new cover and an exclusive
      Backstage at the Pineapple Cabaret chapter as backmatter, reaches
      stores August 27.
    sources:
      - https://www.publishersweekly.com/pw/by-topic/new-titles/adult-announcements/article/96198-litrpg-goes-mainstream.html
      - https://deadline.com/2024/08/dungeon-crawler-carl-seth-macfarlane-universal-chris-yost-series-1236045866/

  - id: matt-dinniman-tv-rights-2024
    date: 2024-08-21
    title: Universal options Dungeon Crawler Carl for television
    impact: med
    description: >
      Universal International Studios buys the TV rights to Dungeon
      Crawler Carl in what is described as a highly competitive situation,
      attaching Seth MacFarlane's Fuzzy Door to produce and Chris Yost
      (Thor: Ragnarok, The Mandalorian) to adapt it - six days before the
      first Ace hardcover reaches stores.
    sources:
      - https://deadline.com/2024/08/dungeon-crawler-carl-seth-macfarlane-universal-chris-yost-series-1236045866/

  - id: matt-dinniman-clarke-award-shortlist-2026
    date: 2026-06-05
    title: Dungeon Crawler Carl shortlisted for the Arthur C. Clarke Award
    impact: med
    description: >
      The UK's Arthur C. Clarke Award, marking its 40th anniversary,
      shortlists Dungeon Crawler Carl for science fiction book of the year,
      chosen from a record 132 submissions across 52 publishing imprints -
      the genre establishment's clearest acknowledgment yet of a series
      that began as a free web serial.
    sources:
      - https://www.kcl.ac.uk/news/arthur-c.-clarke-award-shortlist-revealed-at-the-digital-futures-institute-festival-of-storytelling
      - https://locusmag.com/2026/06/2026-clarke-award-shortlist/

  - id: matt-dinniman-peacock-series-order-2026
    date: 2026-06-18
    title: Peacock orders the Dungeon Crawler Carl series
    impact: med
    description: >
      Peacock gives Dungeon Crawler Carl a straight-to-series order, with
      Fuzzy Door and Universal Global Television producing, Chris Yost
      writing, and Dinniman credited as a non-writing co-executive
      producer - the series pickup capping what Deadline calls "a wild
      seven-year journey" from a free web serial to a greenlit show.
    sources:
      - https://deadline.com/2026/06/dungeon-crawler-carl-tv-series-peacock-seth-macfarlane-matt-dinniman-1236962525/
      - https://variety.com/2026/tv/news/dungeon-crawler-carl-series-order-peacock-1236785705/
      - https://mattdinniman.com/dungeon-crawler-carl-coming-to-peacock/

