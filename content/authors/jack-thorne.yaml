bio: >
  British playwright and screenwriter. Wrote the published script of
  [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter and the
  Cursed Child]] (2016) from a story he originated together with
  [[author:jk-rowling|J. K. Rowling]] and director
  [[author:john-tiffany|John Tiffany]]; Wikipedia's own credit line is
  explicit that the play is "written by Jack Thorne from an original story by
  Thorne, J. K. Rowling, and John Tiffany" - the script's prose is his alone.
sources:
