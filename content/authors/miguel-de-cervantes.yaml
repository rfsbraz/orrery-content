# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds). Author-LIFE events live here (lifeEvents);
# franchise-specific events stay in the franchise.
#
# `born` follows the traditionally assumed date, not a documented record:
# Wikipedia's own infobox marks it "(assumed)" and ties the day to no known
# register entry. He was baptised at Santa María la Mayor in Alcalá de
# Henares; 29 September 1547 (the feast of St Michael, source of the name
# "Miguel") is the conventional birth date built backward from that baptism
# and used by every standard reference, not a birth certificate.
id: miguel-de-cervantes
name: Miguel de Cervantes
aka: ["Miguel de Cervantes Saavedra"]
born: 1547-09-29
died: 1616-04-22
bio: >
  Born in Alcalá de Henares, the second son of an itinerant barber-surgeon.
  Little is documented of his early life or education. By 1569 he was in
  Rome in a cardinal's household; in 1570 he enlisted in a Spanish infantry
  regiment and in October 1571 was badly wounded at the Battle of Lepanto,
  taking two wounds to the chest and a third that permanently disabled his
  left hand - the injury behind his lifelong nickname "El manco de Lepanto"
  ("the one-handed man of Lepanto"), a wound he referred to with pride for
  the rest of his life. He continued in Mediterranean service until
  September 1575, when the galley carrying him home was taken by Ottoman
  corsairs and he was held for ransom in Algiers. His family could ransom
  his brother in 1577 but not him; he made four escape attempts over almost
  five years before the Trinitarian religious order ransomed him in 1580.
  Back in Spain, he married Catalina de Salazar y Palacios in 1584 and
  fathered an illegitimate daughter, Isabel, with Ana Franca de Rojas.
  [[work:miguel-de-cervantes/la-galatea|La Galatea]] (1585), his first
  novel, drew little notice, and for the next two decades he supported
  himself as a purchasing agent for the Spanish Armada and then as a tax
  collector, briefly jailed over irregularities in his accounts in 1592.
  [[work:miguel-de-cervantes/don-quixote|Don Quixote]]'s first part, published
  in January 1605 when he was 57, was an immediate popular success and
  brought him a degree of financial security for the first time, though its
  sequel was delayed for a decade and then hurried into print by an
  unauthorised impostor's version. His last productive years, from 1613 to
  1616, were his most prolific: the Novelas ejemplares, the completed second
  part of Don Quixote, Ocho comedias y ocho entremeses, and the Viaje del
  Parnaso all appeared within three years of each other. He joined the lay
  Third Order of St Francis in July 1613. He died in Madrid on 22 April 1616,
  days after finishing the dedication to [[work:miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda|Los
  trabajos de Persiles y Sigismunda]], the romance he considered his best
  work, and was buried at the Convent of the Barefoot Trinitarians.
lifeEvents: []
sources:
