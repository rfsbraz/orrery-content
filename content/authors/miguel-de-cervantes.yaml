# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds). Author-LIFE events live here (lifeEvents);
# franchise-specific events stay in the franchise.
#
# `born` follows the traditionally assumed date, not a documented record:
# Wikipedia's own infobox marks it "(assumed)" and ties the day to no known
# register entry. He was baptised at Santa María la Mayor in Alcalá de
# Henares; 29 September 1547 (the feast of St Michael, source of the name
# "Miguel") is the conventional birth date built backward from that baptism
# and used by every standard reference, not a birth certificate.
id: miguel-de-cervantes
name: Miguel de Cervantes
aka: ["Miguel de Cervantes Saavedra"]
born: 1547-09-29
died: 1616-04-22
bio: >
  Born in Alcalá de Henares, the second son of an itinerant barber-surgeon.
  Little is documented of his early life or education. By 1569 he was in
  Rome in a cardinal's household; in 1570 he enlisted in a Spanish infantry
  regiment and in October 1571 was badly wounded at the Battle of Lepanto,
  taking two wounds to the chest and a third that permanently disabled his
  left hand - the injury behind his lifelong nickname "El manco de Lepanto"
  ("the one-handed man of Lepanto"), a wound he referred to with pride for
  the rest of his life. He continued in Mediterranean service until
  September 1575, when the galley carrying him home was taken by Ottoman
  corsairs and he was held for ransom in Algiers. His family could ransom
  his brother in 1577 but not him; he made four escape attempts over almost
  five years before the Trinitarian religious order ransomed him in 1580.
  Back in Spain, he married Catalina de Salazar y Palacios in 1584 and
  fathered an illegitimate daughter, Isabel, with Ana Franca de Rojas.
  [[work:miguel-de-cervantes/la-galatea|La Galatea]] (1585), his first
  novel, drew little notice, and for the next two decades he supported
  himself as a purchasing agent for the Spanish Armada and then as a tax
  collector, briefly jailed over irregularities in his accounts in 1592.
  [[work:miguel-de-cervantes/don-quixote|Don Quixote]]'s first part, published
  in January 1605 when he was 57, was an immediate popular success and
  brought him a degree of financial security for the first time, though its
  sequel was delayed for a decade and then hurried into print by an
  unauthorised impostor's version. His last productive years, from 1613 to
  1616, were his most prolific: the Novelas ejemplares, the completed second
  part of Don Quixote, Ocho comedias y ocho entremeses, and the Viaje del
  Parnaso all appeared within three years of each other. He joined the lay
  Third Order of St Francis in July 1613. He died in Madrid on 22 April 1616,
  days after finishing the dedication to [[work:miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda|Los
  trabajos de Persiles y Sigismunda]], the romance he considered his best
  work, and was buried at the Convent of the Barefoot Trinitarians.
lifeEvents:
  - id: cervantes-born-1547
    organisation: full-bleed-vista
    illustration_type: place-portrait
    images_required: 1
    date: 1547-09-29
    title: "Born in Alcalá de Henares"
    impact: low
    description: >
      Born in Alcalá de Henares, a university town near Madrid, one of seven children of an
      itinerant barber-surgeon father who kept moving the family - through Córdoba, Seville,
      Toledo and Madrid - chasing work and dodging his own debts. Cervantes received no
      university education. The 29 September date is the traditional one, built backward from
      his baptism at Santa María la Mayor rather than from any surviving birth record.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes
      - https://es.wikipedia.org/wiki/Miguel_de_Cervantes

  - id: cervantes-lepanto-1571
    organisation: beside
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1571-10-07
    title: "Wounded at the Battle of Lepanto"
    impact: high
    description: >
      Sailing with the Holy League fleet aboard the Marquesa, Cervantes fights in the naval
      battle that breaks Ottoman sea power in the Mediterranean, reportedly commanding a
      twelve-man skiff despite a bout of fever that should have kept him below deck. He takes
      three wounds - two to the chest, and a third that permanently disables his left hand. The
      injury gives him his lifelong nickname, "el manco de Lepanto": manco means maimed or
      disabled, not amputated - the hand stayed attached but useless for the rest of his life.
      He wore the title with pride to the end, and in the Viaje del Parnaso, published two years
      before his death, wrote of having "lost the movement of the left hand for the glory of
      the right."
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes
      - https://en.wikipedia.org/wiki/Battle_of_Lepanto_(1571)

  - id: cervantes-algiers-captivity-1575
    organisation: immersion
    illustration_type: atmospheric-motif-field
    images_required: 1
    date: 1575-09-26
    dateRange: "1575-1580"
    title: "Captured and enslaved in Algiers"
    impact: high
    description: >
      Sailing home from Naples aboard the galley Sol, Cervantes and his younger brother Rodrigo
      are taken by Ottoman corsairs off the Catalan coast on 26 September 1575 and held for
      ransom in Algiers rather than sold outright as slaves. Rodrigo is ransomed in 1577;
      Cervantes's family cannot raise his own fee, and he remains. Over nearly five years he
      organises or joins four escape attempts, each betrayed or discovered before it succeeds,
      and each time he insists the plan was his alone rather than let his fellow captives share
      the punishment. Trinitarian friars ransom him in 1580, reportedly just before his captors
      intend to ship him on to Constantinople, where escape would have been effectively
      impossible. The captivity supplies the material for two of his earliest surviving plays,
      [[work:miguel-de-cervantes/el-trato-de-argel|El trato de Argel]] and
      [[work:miguel-de-cervantes/el-cerco-de-numancia|El cerco de Numancia]], and for the
      Captive's tale told inside [[work:miguel-de-cervantes/don-quixote|Don Quixote]].
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes
      - https://es.wikipedia.org/wiki/Miguel_de_Cervantes

  - id: cervantes-seville-imprisonment-1597
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1597
    title: "Jailed in Seville over a shortfall in the tax accounts"
    impact: high
    description: >
      Back in Spain, Cervantes spends the 1580s and 1590s in unglamorous government work:
      purveyor for the Spanish Armada from 1587, requisitioning wheat and oil across Seville
      province, then a tax collector from 1594, going house to house to collect back taxes owed
      the crown. Both jobs are hazardous to his freedom. In 1592 he is jailed at Castro del Río,
      in Córdoba, after the Archbishopric of Seville excommunicates him over a shipment of
      church grain he had requisitioned without authorisation. Then in 1597 a bank holding his
      tax receipts collapses; a royal order of 6 September gives him thirty days to account for
      a shortfall of nearly 80,000 maravedís, and he spends several months, between September
      and December, in the Cárcel Real de Sevilla (the Royal Prison of Seville). Don Quixote's
      prologue says the book was "engendered in a prison" - whether that means he started
      writing it there, or simply that the idea first came to him there, is disputed, and
      Cervantes scholars are not even agreed on which of his two documented imprisonments he
      meant: some argue for Seville in 1597, others for the earlier Castro del Río stay in 1592.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes
      - https://es.wikipedia.org/wiki/Miguel_de_Cervantes

  - id: cervantes-don-quixote-published-1605
    organisation: mosaic
    illustration_type: press-media-collage
    images_required: 1
    date: 1605-01-16
    title: "Don Quixote makes him famous, at 57"
    impact: high
    description: >
      Twenty years after La Galatea's muted reception, and deep into an unglamorous second
      career as a purveyor and tax collector, Cervantes publishes
      [[work:miguel-de-cervantes/don-quixote|Don Quixote]]'s first part on 16 January 1605. It
      sells out its first Madrid printing within months, runs to two further Madrid editions and
      two Lisbon ones the same year, and travels fast: most of the 400 copies of the first
      edition are shipped straight to the New World, and although most are lost in a shipwreck
      near Havana, some 70 reach Lima within the year and are sent on to Cuzco. At 57, after a
      life of soldiering, captivity and debt, Cervantes has his first real popular success -
      though not, for years yet, the financial security to match it.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Don_Quixote
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

  - id: cervantes-final-prolific-years-1613
    organisation: layered-stack
    illustration_type: archive-stack
    images_required: 1
    date: 1613
    dateRange: "1613-1616"
    title: "A late, prolific final act"
    impact: med
    description: >
      Don Quixote's success finally gives Cervantes, approaching sixty, something close to
      financial security after a lifetime of debt and precarious jobs, and the last three years
      of his life become his most productive: [[work:miguel-de-cervantes/novelas-ejemplares|Novelas
      ejemplares]] (1613), [[work:miguel-de-cervantes/viaje-del-parnaso|Viaje del Parnaso]]
      (1614), [[work:miguel-de-cervantes/ocho-comedias-y-ocho-entremeses|Ocho comedias y ocho
      entremeses]] and the real Part Two of Don Quixote (both 1615) all appear within three
      years of each other, a pace nothing in the preceding two decades of tax collecting and
      jailhouse accounting had allowed. In July 1613 he also joined the lay Third Order of St
      Francis, a common way for Catholics of the period to gain spiritual merit.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

  - id: cervantes-persiles-dedication-1616
    organisation: epigraph
    quote: >
      Puesto ya el pie en el estribo,
      con las ansias de la muerte,
      gran señor, esta te escribo.
    images_required: 0
    date: 1616-04-19
    title: "Dedication to Los trabajos de Persiles y Sigismunda"
    impact: high
    description: >
      Four days before he dies, Cervantes writes the dedication to
      [[work:miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda|Los trabajos de Persiles y
      Sigismunda]] to his patron, the Count of Lemos, opening with a line borrowed from an old
      ballad - roughly, "with one foot already in the stirrup, with the anguish of death upon
      me, great lord, I write this to you." He will not live to see the book published.
    spoilerAfter: null
    sources:
      - https://es.wikipedia.org/wiki/Los_trabajos_de_Persiles_y_Sigismunda

  - id: cervantes-death-1616
    organisation: immersion
    illustration_type: symbolic-still-life
    images_required: 1
    date: 1616-04-22
    title: "Dies in Madrid, days after finishing Persiles"
    impact: high
    description: >
      Cervantes dies in Madrid on 22 April 1616, probably of complications from diabetes -
      contemporary accounts describe an unquenchable thirst in his final weeks. He is buried the
      next day, 23 April, at the Convent of the Barefoot Trinitarians - a date long mistaken for
      his death date rather than his burial date, and the date, that same year, of William
      Shakespeare's death in England. The coincidence is real, but the "same day" is not: Spain
      had used the Gregorian calendar since 1582, while England still used the Julian calendar,
      ten days behind it by 1616, so Shakespeare's 23 April (Julian) death converts to 3 May on
      the Gregorian calendar Cervantes's date uses - Shakespeare in fact died eleven days after
      Cervantes, not on the same day. UNESCO nonetheless fixed World Book and Copyright Day on
      23 April in 1995, citing the "shared" date.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Miguel_de_Cervantes
      - https://en.wikipedia.org/wiki/World_Book_Day
