# Global author entity. Referenced by authorIds/withAuthorIds everywhere.
# Author-LIFE events live here (lifeEvents) since they follow the person;
# franchise-specific events stay in content/franchises/jrr-tolkien/events.yaml.
#
# lifeEvents is left empty rather than filled with unvalidated guesses:
# life events carry the same layout fields as franchise events
# (organisation/illustration_type/images_required), each checked against a
# fixed catalogue of 16 layout organisations and 25 illustration types, and
# picking those blind would be inventing data rather than recording it. The
# sourced biography behind the eventual entries is nonetheless real and
# substantial: childhood and his parents' deaths, the T.C.B.S. and the
# First World War (the Somme, trench fever, the two closest T.C.B.S.
# friends killed, beginning The Book of Lost Tales while convalescing), the
# Oxford English Dictionary job, the Leeds readership then professorship,
# the 1925 Rawlinson and Bosworth Professorship at Oxford where The Hobbit
# and the first two volumes of The Lord of the Rings were written, the
# 1937 publisher rejection of an early Silmarillion draft that redirected
# him to write a Hobbit sequel, completing The Lord of the Rings in 1948,
# his 1972 CBE, Edith's death in 1971 and his own in 1973.
id: jrr-tolkien
name: J. R. R. Tolkien
aka: ["John Ronald Reuel Tolkien", "Ronald Tolkien"]
born: 1892-01-03
died: 1973-09-02
bio: >
  English writer, poet, philologist and academic, author of
  [[work:jrr-tolkien/the-hobbit|The Hobbit]] (1937) and
  [[work:jrr-tolkien/the-lord-of-the-rings|The Lord of the Rings]]
  (1954-1955). Born in Bloemfontein in the Orange Free State to an English
  bank manager and his wife, he was brought to England as a small child
  after his father's death and orphaned outright at twelve when his mother
  died of diabetes; he was raised from then on by a Birmingham Oratory
  priest, Father Francis Xavier Morgan. He served as a signals officer with
  the Lancashire Fusiliers at the Battle of the Somme in 1916, where trench
  fever eventually invalided him home and where two of his closest school
  friends were killed; the writing that became his legendarium begins in
  its aftermath, during his convalescence, with the earliest version of what
  is now [[work:jrr-tolkien/the-fall-of-gondolin|The Fall of Gondolin]].
  After the war he worked on the Oxford English Dictionary, then held
  posts at the University of Leeds before returning to Oxford in 1925 as
  Rawlinson and Bosworth Professor of Anglo-Saxon (Pembroke College) and
  later, from 1945, as Merton Professor of English Language and Literature
  (Merton College), retiring in 1959. He was a devout Roman Catholic and a
  central member of the Inklings, the Oxford literary discussion group he
  shared with C. S. Lewis. He died in 1973, having named his third child
  and literary executor, [[author:christopher-tolkien|Christopher
  Tolkien]], as the person who would spend the following 45 years editing
  and publishing the vast unfinished body of legendarium material - poems,
  annals, drafts and notes going back to 1914 - that Tolkien left behind.
pseudonyms: []
lifeEvents: []
sources:
