# Global author entity. Authors are referenced by id from franchises and
# works (authorIds / withAuthorIds), so the same person resolves the same
# everywhere. Kept thin by design: her solo bibliography under her own name
# (three historical novels, named in bio below) and her second joint pen
# name with her husband, Alex Ahndoril (2023-, a puzzle-mystery series about
# private investigator Julia Stark), sit outside this wing, which spans only
# the complete published work under the joint pen name Lars Kepler
# (content/franchises/lars-kepler/) - the same shape this catalogue already
# uses for Andrew Child's solo Andrew Grant novels relative to lee-child.
#
# Living person: the two lifeEvents below are her own, individual,
# pre-Kepler record - a birth and a solo literary prize, neither health,
# family, finance or legal, so the standard sourcing bar applies rather
# than the two-independent-source one, and both clear it (see each entry's
# own sources). The couple's SHARED history - the 2009 debut, choosing the
# pen name, its unmasking, any screen adaptation - is modelled as
# content/franchises/lars-kepler/events.yaml material rather than a
# lifeEvent on either author (ruling, orrery-content#64: "a life event
# belongs to a person; if no single person owns it, it is a franchise
# event"). Nothing about her health, marriage or family was found to clear
# the two-independent-source bar this pass, so none is recorded.
#
# PORTUGUESE FAMILY CONNECTION, verified rather than repeated from the
# request issue's own recollection (flagged there as unsourced). English
# Wikipedia's "Alexandra Coelho Ahndoril" article states she "was born to a
# Portuguese mother and a Swedish father," citing Albert Bonniers Förlag's
# own author biography (the books' Swedish publisher, archived 2017) as its
# source. Swedish Wikipedia's biography section independently states the
# same specific fact in its own words ("växte upp i Helsingborg, med en
# svensk far och en portugisisk mor") - though that section as a whole
# carries an unrelated citation-needed banner, not attached to this
# sentence specifically. Two independently written encyclopedia articles,
# one tracing to the publisher's own biography, converge on the same
# specific claim (a Portuguese mother, a Swedish father), so it is recorded
# here as sourced rather than dropped or left as a vaguer "heritage" claim.
id: alexandra-coelho-ahndoril
name: Alexandra Coelho Ahndoril
aka: ["Pia Alexandra Coelho Ahndoril"]
born: 1966-03-02
died: null
bio: >
  Swedish novelist and literary critic, born in Helsingborg to a Swedish
  father and a Portuguese mother. Trained as an actress at Stockholm's
  National Academy of Mime and Acting before earning a master's degree in
  literary science and beginning a doctoral dissertation on the Portuguese
  poet Fernando Pessoa. Published three historical novels under her own
  name before turning to crime fiction: Stjärneborg (2003, on the astronomer
  Tycho Brahe, awarded the Katapult Prize), Birgitta och Katarina (2006, on
  Saint Birgitta of Sweden) and Mäster (2009, on the socialist agitator
  August Palm). Has also written literary criticism for the newspapers
  Göteborgs-Posten and Dagens Nyheter. Since 2009 she and her husband
  [[author:alexander-ahndoril|Alexander Ahndoril]] have co-written the
  [[franchise:lars-kepler|Joona Linna]] crime series jointly under the pen
  name Lars Kepler.
pseudonyms:
  - name: "Lars Kepler"
    note: >
      Shared with her husband Alexander Ahndoril since their 2009 debut;
      both wrote every book under the name from its first page, never one
      primary author later joined by a second. "Lars" honours the Swedish
      crime writer Stieg Larsson, whose success inspired the couple to try
      crime fiction; "Kepler" honours the astronomer Johannes Kepler.
  - name: "Alex Ahndoril"
    note: >
      A second joint pseudonym the couple began using in 2023 for a
      separate puzzle-mystery series about the private investigator Julia
      Stark, distinct from Lars Kepler and outside this catalogue's
      lars-kepler wing.
lifeEvents:
  - id: alexandra-coelho-ahndoril-born-1966
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1966-03-02
    title: Born in Helsingborg
    impact: low
    description: >
      Pia Alexandra Coelho Ahndoril is born in Helsingborg's Maria parish, on
      Sweden's south coast, to a Swedish father and a Portuguese mother. She
      grows up in the city, works small parts at Helsingborg City Theatre and
      with free theatre groups, and leaves at the start of the 1990s for
      Stockholm and a place at the National Academy of Mime and Acting - the
      first step away from Helsingborg and toward the writing career, and
      later the pen name, that follow.
    spoilerAfter: null
    sources:
      - "https://sv.wikipedia.org/wiki/Alexandra_Coelho_Ahndoril"
      - "https://en.wikipedia.org/wiki/Alexandra_Coelho_Ahndoril"

  - id: alexandra-coelho-ahndoril-katapult-prize-2004
    organisation: medallion
    illustration_type: book-object
    images_required: 1
    date: 2004
    title: A historical debut about Tycho Brahe wins the Katapult Prize
    impact: med
    description: >
      Stjärneborg (2003), her debut novel about the astronomer Tycho Brahe,
      is awarded the Katapult Prize for best literary debut of the year -
      recognition for a solo career under her own name, years before Lars
      Kepler exists, built alongside acting, literary criticism for
      Göteborgs-Posten and Dagens Nyheter, and a doctoral dissertation on the
      poet Fernando Pessoa. She completes the loosely linked historical
      trilogy Stjärneborg began with Birgitta och Katarina (2006, on Saint
      Birgitta of Sweden) and Mäster (2009, on the socialist agitator August
      Palm) - published the same year she and her husband debut as Lars
      Kepler.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Alexandra_Coelho_Ahndoril"
      - "https://sv.wikipedia.org/wiki/Alexandra_Coelho_Ahndoril"
      - "https://www.svd.se/rygg-mot-rygg"
