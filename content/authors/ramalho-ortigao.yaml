# Global author entity, added as a collaborator reference (withAuthorIds) from
# the Eça de Queirós wing's O Mistério da Estrada de Sintra (1870), which the
# two wrote together. A minimal stub, not a wing of his own: Ortigão has no
# franchise here and none is implied by this file existing (see
# content/franchises/eca-de-queiros/works.yaml's own note on the collaboration).
id: ramalho-ortigao
name: Ramalho Ortigão
aka: ["José Duarte Ramalho Ortigão"]
born: 1836-11-24
died: 1915-09-27
bio: >
  Portuguese writer and critic, Eça de Queirós's schoolmaster at the Colégio
  da Lapa in Porto before becoming his lifelong friend and, in 1870,
  co-author of [[work:eca-de-queiros/o-misterio-da-estrada-de-sintra|O
  Mistério da Estrada de Sintra]], considered the first Portuguese detective
  novel. From 1871 the two also co-wrote the monthly satirical magazine As
  Farpas; Eça's own contribution ended in 1872, and Ortigão continued it
  alone until 1882. He was present at Eça's death in 1900.
sources:
  - https://en.wikipedia.org/wiki/Ramalho_Ortig%C3%A3o
  - https://pt.wikipedia.org/wiki/As_Farpas
