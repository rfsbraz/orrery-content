id: viola-davis
name: "Viola Davis"
aka: []
born: 1965-08-11
died: null
bio: >
  Viola Davis is an American actress and one of the few performers to hold
  EGOT status (Emmy, Grammy, Oscar and Tony), the first Black actress to do
  so. She won the Academy Award for Best Supporting Actress for Fences
  (2016), an Emmy for How to Get Away with Murder, and two Tony Awards for
  August Wilson stage productions. She co-wrote the thriller
  [[work:james-patterson/judge-stone|Judge Stone]] (2026) with James
  Patterson.
