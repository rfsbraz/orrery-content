# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# A co-author entity, kept thin by design: McCloskey's own memoir (When Truth
# Is All You Have, 2020, Doubleday) and the rest of his work as founder of
# Centurion Ministries belong to his own biography, not to this wing - this
# file exists so his withAuthorIds reference on Framed (2024) resolves, not to
# catalogue a second person's career. No lifeEvents recorded: he is a living
# person, and anything about his health, finances, family or legal affairs
# would need two independent sources before it belongs here.
#
# born is approximate: no source states a birth date directly. One profile
# states he left a 12-year management-consulting career in 1979 "at age 37",
# which places a birth year of 1941 or 1942; treated as a derived estimate,
# not a stated fact.
id: jim-mccloskey
name: Jim McCloskey
aka: ["James C. McCloskey"]
born: 1942
died: null
bio: >
  American investigator and minister, born in Havertown, Pennsylvania. Left a
  management-consulting career in 1979 to attend Princeton Theological
  Seminary; while serving as a student chaplain at Trenton State Prison he
  became convinced of a life-sentenced inmate's innocence and helped free him.
  On graduating in 1983 he founded Centurion Ministries, the first
  organization devoted to freeing the wrongly convicted, and has led its work
  ever since. Co-authored [[work:john-grisham/framed|Framed]] (2024) with
  John Grisham, gathering true stories of wrongful conviction from Centurion's
  own casework.
pseudonyms: []
lifeEvents: []
sources:
  - https://centurion.org/faq/
  - https://www.penguinrandomhouse.com/authors/2195582/jim-mccloskey/
