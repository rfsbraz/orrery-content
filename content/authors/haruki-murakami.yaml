  - id: haruki-murakami-jerusalem-speech-2009
    organisation: epigraph
    quote: >
      If there is a hard, high wall and an egg that breaks against it, no
      matter how right the wall or how wrong the egg, I will stand on the
      side of the egg. Why? Because each of us is an egg, a unique soul
      enclosed in a fragile egg. Each of us is confronting a high wall. The
      high wall is the system which forces us to do the things we would not
      ordinarily see fit to do as individuals.
    images_required: 0
    date: 2009-02-15
    title: Jerusalem Prize acceptance speech, "Always on the Side of the Egg"
    impact: high
    description: >
      Accepting the Jerusalem Prize in Israel despite calls to boycott the
      ceremony over Israel's bombing of Gaza, Murakami told the audience he
      had chosen to come and speak rather than stay home and say nothing. His
      remarks named the individual-against-the-system framing that runs
      through most of his fiction, from A Wild Sheep Chase's corporate
      underworld to 1Q84's cult.
    spoilerAfter: null
    sources:
      - https://www.theguardian.com/books/2009/feb/16/haruki-murakami-jerusalem-prize
      - https://en.wikipedia.org/wiki/Jerusalem_Prize

  - id: haruki-murakami-catalunya-fukushima-2011
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 2011
    title: Donates his Catalunya Prize winnings to earthquake and Fukushima relief
    impact: med
    description: >
      In 2011 Murakami donated his 80,000 euro prize from the International
      Catalunya Prize to victims of the 11 March earthquake and tsunami and to
      those affected by the Fukushima nuclear disaster. Accepting the award,
      he called the Fukushima crisis "the second major nuclear disaster that
      the Japanese people have experienced... however, this time it was not a
      bomb being dropped upon us, but a mistake committed by our very own
      hands," and argued Japan should have rejected nuclear power after
      "the sacrifice of the hibakusha" of Hiroshima and Nagasaki had already
      shown the cost of radiation.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Haruki_Murakami

  - id: haruki-murakami-andersen-speech-2016
    organisation: epigraph
    quote: >
      No matter how high a wall we build to keep intruders out, no matter how
      strictly we exclude outsiders, no matter how much we rewrite history to
      suit us, we just end up damaging and hurting ourselves.
    images_required: 0
    date: 2016-10-30
    title: Hans Christian Andersen Literature Award speech, "The Meaning of Shadows"
    impact: med
    description: >
      Receiving the Hans Christian Andersen Literature Award in Odense,
      Denmark, Murakami titled his speech after Andersen's own story "The
      Shadow", calling it a "dark and hopeless story," and argued that
      individuals, societies and nations alike have to learn to live with
      their own shadow rather than deny or forcibly eliminate it. The theme of
      a suppressed or estranged double runs through his fiction from Hard-
      Boiled Wonderland's surrendered shadow to Kafka on the Shore.
    spoilerAfter: null
    sources:
      - https://www.theguardian.com/books/2016/nov/01/haruki-murakami-hans-christian-anderdersen-prize-speech-outsiders

  - id: haruki-murakami-asturias-2023
    organisation: medallion
    illustration_type: emblem-seal
    images_required: 1
    date: 2023-10-20
    title: Wins the Princess of Asturias Award for Literature
    impact: med
    description: >
      Awarded the Princess of Asturias Award for Literature in May 2023 and
      presented with it at a ceremony in Oviedo, Spain, on 20 October
      alongside that year's Arts laureate, Meryl Streep. The jury's citation
      named his novels, from Norwegian Wood (1987) to The City and Its
      Uncertain Walls (2023), for exploring "loneliness, existential
      uncertainty, dehumanization in big cities and terrorism" - close to a
      one-line description of the whole bibliography's recurring concerns.
    spoilerAfter: null
    sources:
      - https://lithub.com/haruki-murakami-wins-spains-princess-of-asturias-award-for-literature/
      - https://japannews.yomiuri.co.jp/culture/books-literature/20231021-144593/
