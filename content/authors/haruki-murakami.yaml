    illustration_type: emblem-seal
    images_required: 1
    date: 2005-11-06
    title: Trains four months for the New York City Marathon, the spine of his running memoir
    impact: low
    description: >
      What became [[work:haruki-murakami/what-i-talk-about-when-i-talk-about-running|What
      I Talk About When I Talk About Running]] is built around his four months
      of training for the New York City Marathon in the autumn of 2005,
      running courses that range from Tokyo's Jingu Gaien gardens to the
      Charles River in Boston to, fittingly, an ultramarathon route retracing
      the original run from Marathon to Athens in Greece, the country he had
      once lived and written in.
    spoilerAfter: null
