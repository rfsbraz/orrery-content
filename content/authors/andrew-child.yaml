# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# A co-author entity, kept thin by design: Andrew Child's own solo bibliography
# (the David Trevellyan, Cooper Devereaux and Paul McGrath series, written as
# Andrew Grant) belongs to his own work, not to this wing, and is out of scope
# here - this file exists so his authorIds/withAuthorIds resolve, not to
# catalogue a second author's career. No lifeEvents recorded: he is a living
# person, and anything about his health, finances, family or legal affairs
# would need two independent sources before it belongs here.
id: andrew-child
name: Andrew Child
aka: ["Andrew Grant"]
born: 1968
died: null
bio: >
  Pen name of Andrew Grant, English novelist born in Birmingham in 1968, the
  younger brother of [[author:lee-child|Lee Child]] (born James Grant). Grant
  wrote several series of his own as Andrew Grant before taking on the
  [[franchise:lee-child|Jack Reacher]] series as co-author from
  [[work:lee-child/the-sentinel|The Sentinel]] (2020) onward, under the new
  surname "Child" to match his brother's pen name.
# PORTRAIT. No licensed photograph is recorded. The Andrew Grant/Andrew Child
# identity is independently corroborated on Wikidata, whose "Andrew Grant"
# entity (Q4757157, the novelist, not any of the several unrelated Andrew
# Childs entities) lists "Andrew Child" as an alias - but that entity carries
# no P18 image claim, and the Andrew Grant (writer) Wikipedia infobox has no
# photo either. Wikimedia Commons has no author-photo hits under "Andrew
# Grant" writer/novelist searches (the name is too generic for a plain search
# to be useful, and no dedicated category exists). Openverse (Flickr) returns
# nothing under "Andrew Child" or "Andrew Grant" combined with Reacher/author/
# writer. The Library of Congress Prints & Photographs catalog has no
# "Andrew Grant author" hits. jackreacher.com's authors page and his own
# site (andrewgrantbooks.com) both carry a headshot but neither states any
# editorial-use permission - andrewgrantbooks.com's footer instead reserves
# "All content © 2009-2026, Andrew Grant". The slot stays empty.
pseudonyms: []
lifeEvents: []
sources:
  - https://en.wikipedia.org/wiki/Andrew_Child
  - https://en.wikipedia.org/wiki/Lee_Child
