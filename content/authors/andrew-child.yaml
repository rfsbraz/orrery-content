# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# A co-author entity, kept thin by design: Andrew Child's own solo bibliography
# (the David Trevellyan, Cooper Devereaux and Paul McGrath series, written as
# Andrew Grant) belongs to his own work, not to this wing, and is out of scope
# here - this file exists so his authorIds/withAuthorIds resolve, not to
# catalogue a second author's career. No lifeEvents recorded: he is a living
# person, and anything about his health, finances, family or legal affairs
# would need two independent sources before it belongs here.
id: andrew-child
name: Andrew Child
aka: ["Andrew Grant"]
born: 1968
died: null
bio: >
  Pen name of Andrew Grant, English novelist born in Birmingham in 1968, the
  younger brother of [[author:lee-child|Lee Child]] (born James Grant). Grant
  wrote several series of his own as Andrew Grant before taking on the
  [[franchise:lee-child|Jack Reacher]] series as co-author from
  [[work:lee-child/the-sentinel|The Sentinel]] (2020) onward, under the new
  surname "Child" to match his brother's pen name.
# PORTRAIT. No licensed photograph is recorded. The Andrew Grant/Andrew Child
# identity is independently corroborated on Wikidata: the "Andrew Grant"
# entity (Q4757157, the novelist, not any of the several unrelated Andrew
# Childs entities) lists "Andrew Child" as an alias, and separately carries a
# sibling claim to Lee Child (Q333719) and a birth date of 8 May 1968 in the
# UK matching the biography recorded here - but the entity carries no P18
# image claim. The English "Andrew Grant (writer)" infobox and the separate
# "Andrew Child" article both carry no photo, and none of the Bulgarian,
# Arabic or Urdu Wikipedia editions (its only other language editions) carry
# one either. Wikimedia Commons has no author-photo hits under "Andrew Grant"
# or "Andrew Child" writer/novelist/Reacher searches (the names are too
# generic for a plain search to be useful, and no dedicated category exists).
# Openverse's full aggregation (Flickr plus its other indexed providers)
# returns nothing genuine under "Andrew Child" or "Andrew Grant" combined
# with Reacher/author/writer/novelist - matches are unrelated Andrew/Grant/
# Child name collisions. The Library of Congress Prints & Photographs
# catalog has no "Andrew Grant author" hits, and unlike Tana French he has no
# Library of Congress National Book Festival page. He attended Bouchercon in
# 2008 (where he met his wife, novelist Tasha Alexander) but that predates
# his Reacher co-authorship and no CC-licensed photography from it survives;
# his own site's appearances page lists a single stale 2018 entry (Murder in
# the Magic City, Birmingham AL) and nothing since, and no ThrillerFest or
# CWA appearance turns up. International Thriller Writers' own magazine, The
# Big Thrill, ran a genuine 2022 photo of "Lee & Andrew Child" credited to
# Tasha Alexander, but the page states only that photo credit, no reuse or
# editorial-use licence. jackreacher.com's authors page and his own site
# (andrewgrantbooks.com, which has no separate press page) both carry a
# headshot but neither states any editorial-use permission -
# andrewgrantbooks.com's footer instead reserves "All content © 2009-2026,
# Andrew Grant". His UK publisher Pan Macmillan's author page carries a
# headshot too, with no rights terms and no separate press room on the site.
#
# FORENSIC FOLLOW-UP PASS. Rather than checking source categories again, this
# pass searched the open web broadly for every distinct photograph of him in
# circulation and traced each back to its rights holder, downloading files
# and reading them with exiftool rather than trusting captions. It surfaces
# one new photograph and closes off the one already flagged, without moving
# either past the same obstacle. The 2022 Big Thrill "Lee & Andrew Child"
# photo (credited only "Tasha Alexander", no reuse terms) is joined by a
# second, independent Tasha Alexander credit: a solo photograph of Andrew
# alone, published by the Meridian Star (Meridian, Mississippi) on 22 July
# 2025 ("Reacher in new hands - A conversation with Andrew Child"), whose own
# uploaded filename states "Photo credit is Tasha Alexander" and whose
# caption reads "Andrew Child. Photo by Tasha Alexander." Both files were
# downloaded and read with exiftool; both have had EXIF/IPTC/XMP stripped by
# their respective CMS on upload (WordPress, in both cases), so neither
# carries embedded rights data beyond what the page itself states, and
# neither page states anything beyond a photo credit - a byline is not a
# licence. Tasha Alexander's own author site (tashaalexander.com) was
# checked directly, following the credit to its source rather than stopping
# at the caption: it hosts a single photo of Tasha herself on its /about
# page, no photo of Andrew anywhere on the site, no press or media-kit page,
# and no site-wide copyright or licensing statement distinguishing family
# photography from an implicit "all rights reserved" - there is no more
# permissive source to find there. A Getty/Alamy/AP Images search for
# "Andrew Child"/"Andrew Grant" turned up nothing: unlike Tana French, he
# does not appear to be a wire-service or stock-photography subject at all,
# so every photograph of him traces back to the same informal,
# family-credited, unlicensed source rather than a mix of stock and personal
# ones. InkWell Management's own client-page headshot (his literary agency)
# was also checked and is a small, metadata-stripped file with no rights
# statement, consistent with the publisher-page pattern already ruled out.
# The slot stays empty.
pseudonyms: []
lifeEvents: []
sources:
