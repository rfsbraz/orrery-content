# (authorIds / withAuthorIds). Author-LIFE events live here (they follow the
# person); franchise-specific events stay in
# content/franchises/umberto-eco/events.yaml.
#
# LIFEEVENTS. Cross-checked against English and Italian Wikipedia's own
# "Umberto Eco" articles (the Italian article is fuller on the RAI years, the
# academic career and the Italian honours list, each with its own citations
# to the Quirinale and period press), the Guardian's 2016 obituary (Ian
# Thomson, who interviewed Eco in person in 1986), and Wikiquote's citation
# of Myriem Bouzaher's introduction to the French edition of Il nome della
# rosa for the "I wanted to poison a monk" line. Eco died in 2016; every
# claim here is a matter of public record and none concerns a living
# person's health, finances, family or legal affairs.
id: umberto-eco
name: Umberto Eco
aka: []
born: 1932-01-05
died: 2016-02-19
images:
  portrait: "https://upload.wikimedia.org/wikipedia/commons/6/64/Italiaanse_schrijver_Umberto_Eco%2C_portret.jpg"
  portraitCredit: "Rob Bogaerts / Anefo (Nationaal Archief, the Netherlands), CC0"
  portraitSource: "https://commons.wikimedia.org/wiki/File:Italiaanse_schrijver_Umberto_Eco,_portret.jpg"
  # Dutch press photo, 22 May 1984 (Eco's Amsterdam visit for the Dutch
  # publication of Il nome della rosa), donated to the Nationaal Archief and
  # released CC0 - the extmetadata itself gives LicenseShortName "CC0" and
  # AttributionRequired "false"; credited anyway per the file's own artist
  # field. Also the current English Wikipedia infobox photo and a Commons
  # Featured Picture, at a genuine portrait crop (2440x3667, tall) rather
  # than a wide press frame needing a blind centre-crop.
bio: >
  Born in Alessandria, Piedmont, and educated at the University of Turin,
  where he earned his philosophy degree in 1954 with a thesis on the
  aesthetics of Thomas Aquinas under Luigi Pareyson. After several years at
  the state broadcaster RAI he moved into academia, teaching visual
  communications at Florence and, from 1971, semiotics at the University of
  Bologna, where [[work:umberto-eco/trattato-di-semiotica-generale|Trattato di
  semiotica generale]] (1975) won him a full professorship; he remained there,
  eventually as professor emeritus, for the rest of his career. Alongside a
  large body of academic and popular nonfiction on semiotics, medieval
  aesthetics, media and interpretation, he published seven novels beginning
  with [[work:umberto-eco/the-name-of-the-rose|Il nome della rosa]] (1980),
  a medieval murder mystery that became one of the best-selling novels of
  the twentieth century and brought him a general readership far beyond his
  academic one. He married the German graphic designer and art teacher
  Renate Ramge in 1962; they had a son and a daughter. Eco died at his home
  in Milan on 19 February 2016, of pancreatic cancer he had lived with for
  two years, having published his last novel,
  [[work:umberto-eco/numero-zero|Numero zero]], the year before.
pseudonyms:
  - name: Daedalus
    note: >
      A James Joyce-inspired pen name Eco used at least twice: for Filosofi
      in libertà (1959), a 550-copy pamphlet of cartoons and verse, and
      again (as the Italian spelling "Dedalus") for the 1973 children's book
      Ammazza l'uccellino, illustrated by Monica Sangberg.
lifeEvents:
  - id: umberto-eco-born-1932
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1932-01-05
    title: Born in Alessandria, the elder brother of the actress Emy Eco
    impact: low
    description: >
      Born in the Piedmont city of Alessandria on 5 January 1932, the son of
      Giulio Eco and Giovanna Bisio and the elder brother of the actress Emy
      Eco. Italian Fascism shaped his whole childhood there: during the
      Second World War he and his mother left the city for a small village
      in the Piedmontese mountains, where the family waited out the war
      until its 1945 liberation. In the village Eco first encountered
      American comic books alongside first-hand accounts of the Resistance
      and the Holocaust, the same collision of pulp culture and history his
      fiction and criticism returned to for the rest of his career.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-ludi-juveniles-1942
    organisation: floating-object
    illustration_type: isolated-object
    images_required: 1
    date: 1942
    title: Wins a Fascist youth prize at ten for an essay on dying for Mussolini
    impact: med
    description: >
      At ten years old Eco won the First Provincial Award of the Ludi
      Juveniles, a Fascist youth writing competition, for an essay arguing
      the affirmative on the set prompt: should Italians die for the glory
      of Mussolini and the immortal destiny of Italy? He spent much of his
      later career studying the shape of the ideology that had put that
      question to a ten-year-old, most directly in his widely read 1995
      essay "Ur-Fascism", collected in
      [[work:umberto-eco/cinque-scritti-morali|Cinque scritti morali]] (1997).
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-rai-corsari-1954
    organisation: beside
    illustration_type: workplace-workshop
    images_required: 1
    date: 1954
    dateRange: "1954-1958"
    title: Graduates Turin and joins RAI's reformist corsari cohort
    impact: med
    description: >
      Eco earned his Laurea in philosophy at the University of Turin in 1954
      with a thesis on the aesthetics of Thomas Aquinas under Luigi
      Pareyson, then immediately won a hiring competition at the state
      broadcaster RAI alongside the future philosopher Gianni Vattimo and
      the future journalist and politician Furio Colombo. The three were
      among the young hires later nicknamed the corsari (corsairs), brought
      in under director Filiberto Guala to modernise Italian television
      programming. Eco left RAI in 1958, partway through the corsari years,
      to complete eighteen months of compulsory military service in the
      Italian Army; by the end of the decade all three original hires had
      moved on regardless, but the friendships and cultural contacts Eco
      made at RAI, including with future members of the Gruppo 63
      avant-garde, ran through his writing for years afterward.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-filosofi-in-liberta-bompiani-1959
    organisation: floating-object
    illustration_type: book-object
    images_required: 1
    date: 1959
    title: A 550-copy pseudonymous pamphlet catches a publisher's eye
    impact: med
    description: >
      [[work:umberto-eco/filosofi-in-liberta|Filosofi in libertà]], a
      pamphlet of cartoons and verse Eco had printed in a run of 550 copies
      under the James Joyce-inspired pen name Daedalus, was how the
      publisher Valentino Bompiani first became aware of him. Bompiani
      approached Eco in 1959 to edit a series called "Idee nuove" (New
      Ideas) at his Milan house, the start of an editorial relationship
      that ran until 1975 and that went on to publish every one of Eco's
      later books, from [[work:umberto-eco/opera-aperta|Opera aperta]] to
      [[work:umberto-eco/the-name-of-the-rose|Il nome della rosa]].
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-guerriglia-semiologica-1967
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1967
    title: Coins "semiological guerrilla warfare" in a New York seminar
    impact: med
    description: >
      At the Vision '67 conference in New York in 1967, Eco delivered the
      seminar "Per una guerriglia semiologica" ("Towards a Semiological
      Guerrilla Warfare"), arguing that resisting the mass media meant
      contesting how a message gets decoded at the point it is received
      rather than trying to control the broadcast source. Later collected
      in his own [[work:umberto-eco/la-struttura-assente|La struttura
      assente]] (1968) and [[work:umberto-eco/il-costume-di-casa|Il
      costume di casa]] (1973), the essay's coinages "communications
      guerrilla warfare" and "cultural guerrilla" went on to shape later
      theorising of guerrilla television and culture jamming.
    spoilerAfter: null
    sources:
      - https://it.wikipedia.org/wiki/Umberto_Eco
      - https://en.wikipedia.org/wiki/Faith_in_Fakes

  - id: umberto-eco-milan-polytechnic-1969
    organisation: marginalia
    illustration_type: emblem-seal
    images_required: 1
    date: 1969
    title: Leaves Florence for a chair in semiotics at Milan Polytechnic
    impact: low
    description: >
      After four years as Professor of Visual Communications at the
      University of Florence, Eco moved to Milan Polytechnic as Professor of
      Semiotics in 1969, spending his first year there as a visiting
      professor at New York University.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-bologna-versus-1971
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1971
    title: Joins Bologna, founds Versus, and helps launch its DAMS degree
    impact: med
    description: >
      Eco took up a post at the University of Bologna in 1971 and, the same
      year, founded the semiotics journal Versus - Quaderni di studi
      semiotici, which he edited until his death, and was among the founders
      of Bologna's first DAMS degree course (Discipline delle Arti, della
      Musica e dello Spettacolo), the university's arts, music and
      performance programme.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-bologna-professorship-1975
    organisation: beside
    illustration_type: book-object
    images_required: 1
    date: 1975
    title: A Theory of Semiotics wins him Bologna's chair in semiotics
    impact: med
    description: >
      The publication of
      [[work:umberto-eco/trattato-di-semiotica-generale|Trattato di
      semiotica generale]] (A Theory of Semiotics) in 1975 won Eco full
      promotion to Professor of Semiotics at the University of Bologna,
      where he remained, eventually as professor emeritus, for the rest of
      his career. He stepped down the same year from the post of senior
      nonfiction editor at the publisher Bompiani, which he had held since
      1959.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-poison-a-monk-1978
    organisation: epigraph
    quote: >
      I started to write [The Name of the Rose] in March of 1978, moved by a
      seminal idea. I wanted to poison a monk.
    images_required: 0
    date: 1978
    title: On starting Il nome della rosa
    impact: high
    description: >
      Eco's own account of how his first novel began: he was forty-six, an
      established academic with no fiction to his name, and spent close to
      two years writing it before its 1980 publication made him, at
      forty-eight, one of the best-selling novelists in the world.
    spoilerAfter: null
    sources:
      - https://en.wikiquote.org/wiki/Umberto_Eco

  - id: umberto-eco-bustina-di-minerva-1985
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 1985
    dateRange: "1985-2016"
    title: Launches the twice-monthly column La Bustina di Minerva
    impact: low
    description: >
      From 1985 Eco wrote a twice-monthly column, "La Bustina di Minerva"
      (Minerva's Matchbook), for the magazine L'Espresso, a running record
      of his opinions on politics, media and culture that he kept up for
      more than thirty years. His last column, on the Romantic paintings of
      Francesco Hayez, appeared on 27 January 2016, three weeks before his
      death.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-name-of-the-rose-film-1986
    organisation: immersion
    illustration_type: symbolic-still-life
    images_required: 1
    date: 1986
    title: Jean-Jacques Annaud's film version makes him inescapably famous
    impact: high
    description: >
      Jean-Jacques Annaud's 1986 film of
      [[work:umberto-eco/the-name-of-the-rose|The Name of the Rose]],
      starring Sean Connery as William of Baskerville, turned a novel
      already selling in the millions into a mass-culture event, and Eco
      refused to discuss the film with the press on its release. Visited at
      Bologna University that year, he described feeling trapped by his own
      success: "I feel blackmailed by journalists, by myself, by my
      publisher. I don't feel free any more. When I wrote The Name of the
      Rose it was half for fun, a free act. Now I ask myself: am I writing a
      new book because I want to, or because it's expected of me?" He
      privately judged Annaud's monks "too grotesque-looking" but approved
      of the film's sets.
    spoilerAfter: null
    sources:
      - https://www.theguardian.com/books/2016/feb/20/umberto-eco-obituary

  - id: umberto-eco-tanner-lectures-1990
    organisation: medallion
    illustration_type: editorial-portrait
    images_required: 1
    date: 1990
    title: Delivers the Tanner Lectures at Cambridge
    impact: low
    description: >
      Eco was invited to deliver the prestigious Tanner Lectures on Human
      Values at the University of Cambridge in 1990, one of a run of such
      invitations (he also served as secretary, vice-president and, from
      1994, honorary president of the International Association for
      Semiotic Studies) that placed him among the most sought-after
      international lecturers in his field.
    spoilerAfter: null
    sources:
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-luther-blissett-rumor-1999
    organisation: mosaic
    illustration_type: press-media-collage
    images_required: 1
    date: 1999
    dateRange: "1997-1999"
    title: Denies founding the prankster collective Luther Blissett
    impact: med
    description: >
      The German weekly Der Spiegel named Eco, in its 25 May 1997 issue, as
      one of the founders of Luther Blissett, a shared pseudonym used by
      hundreds of Italian media pranksters and activists for hoaxes,
      pamphlets and mock-scholarly stunts. An anonymous pamphlet that same
      year went further, claiming the whole project was run by a secret
      circle of Bologna semiologists under Eco. The rumour peaked in 1999
      around the publication of Q, the collective's own historical novel,
      when Italian papers openly speculated that Eco himself was one of
      its hidden authors; he denied it on the record to Il Messaggero on 6
      March 1999, the same day La Repubblica ran an interview with Q's
      four real, and until then anonymous, writers.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Luther_Blissett_(pseudonym)
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-scuola-superiore-2000
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 2000
    title: Founds Bologna's Scuola Superiore di Studi Umanistici
    impact: low
    description: >
      Eco became founding president of the University of Bologna's Scuola
      Superiore di Studi Umanistici in 2000, a graduate school coordinating
      the university's humanities doctoral programmes, echoing the
      institution-building of Versus and DAMS three decades earlier. The
      following year he designed and launched its Master's programme in
      print and digital publishing (Editoria Cartacea e Digitale).
    spoilerAfter: null
    sources:
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-legion-of-honour-2012
    organisation: marginalia
    illustration_type: emblem-seal
    images_required: 1
    date: 2012-01-13
    title: Promoted within France's Legion of Honour at a ceremony in Paris
    impact: low
    description: >
      Eco was made a Commendatore of France's Legion of Honour in Paris on
      13 January 2012, having already been named an Ufficiale of the same
      order in 2003. Italy had earlier given him its own highest civil
      honour, Cavaliere di Gran Croce dell'Ordine al merito della Repubblica
      Italiana (Knight Grand Cross of the Order of Merit of the Italian
      Republic), in Rome on 9 January 1996.
    spoilerAfter: null
    sources:
      - https://it.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-imbecilli-controversy-2015
    organisation: beside
    illustration_type: press-media-collage
    images_required: 1
    date: 2015
    title: An honorary degree speech turns into a broadside against social media
    impact: med
    description: >
      Receiving an honorary degree in communication sciences from the
      University of Turin in June 2015, Eco used the occasion to attack
      social media, saying it had given "legions of idiots" (legioni di
      imbecilli) the same right to speak as a Nobel laureate, a standing he
      said used to belong only to people who aired their opinions at a bar
      over a glass of wine without doing any harm. The remark, reported
      first by the newspaper La Stampa, was picked up internationally and
      provoked days of public argument for and against it.
    spoilerAfter: null
    sources:
      - https://it.wikipedia.org/wiki/Umberto_Eco
      - https://en.wikipedia.org/wiki/Umberto_Eco

  - id: umberto-eco-death-2016
    organisation: immersion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 2016-02-19
    title: Dies in Milan of pancreatic cancer, three weeks after his last column
    impact: high
    description: >
      Eco died at his home in Milan, facing the Castello Sforzesco, at 22:30
      on 19 February 2016, aged 84, of a pancreatic cancer diagnosed two
      years earlier. His last novel,
      [[work:umberto-eco/numero-zero|Numero zero]], had appeared the year
      before. A secular funeral at the Castello Sforzesco on 23 February
      drew thousands of mourners; by his own written wish, no seminar or
      conference about him was to be authorised for ten years after his
      death.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Umberto_Eco
      - https://it.wikipedia.org/wiki/Umberto_Eco
