id: umberto-eco
name: Umberto Eco
aka: []
born: 1932-01-05
died: 2016-02-19
bio: >
  Born in Alessandria, Piedmont, and educated at the University of Turin,
  where he earned his philosophy degree in 1954 with a thesis on the
  aesthetics of Thomas Aquinas under Luigi Pareyson. After several years at
  the state broadcaster RAI he moved into academia, teaching visual
  communications at Florence and, from 1971, semiotics at the University of
  Bologna, where [[work:umberto-eco/trattato-di-semiotica-generale|Trattato di
  semiotica generale]] (1975) won him a full professorship; he remained there,
  eventually as professor emeritus, for the rest of his career. Alongside a
  large body of academic and popular nonfiction on semiotics, medieval
  aesthetics, media and interpretation, he published seven novels beginning
  with [[work:umberto-eco/the-name-of-the-rose|Il nome della rosa]] (1980),
  a medieval murder mystery that became one of the best-selling novels of
  the twentieth century and brought him a general readership far beyond his
  academic one. He married the German graphic designer and art teacher
  Renate Ramge in 1962; they had a son and a daughter. Eco died at his home
  in Milan on 19 February 2016, of pancreatic cancer he had lived with for
  two years, having published his last novel,
  [[work:umberto-eco/numero-zero|Numero zero]], the year before.
pseudonyms:
  - name: Daedalus
    note: >
      A James Joyce-inspired pen name Eco used at least twice: for Filosofi
      in libertà (1959), a 550-copy pamphlet of cartoons and verse, and
      again (as the Italian spelling "Dedalus") for the 1973 children's book
      Ammazza l'uccellino, illustrated by Monica Sangberg.
lifeEvents: []
