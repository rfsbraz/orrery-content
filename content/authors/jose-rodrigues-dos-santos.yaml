lifeEvents:
  - id: jrs-born-1964
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1964-04-01
    title: Born in Beira, shaped by Tete, Lisbon and Penafiel before Macau
    impact: low
    description: >
      José António Afonso Rodrigues dos Santos is born in Beira, in the then
      Portuguese overseas province of Mozambique, son of a doctor father and a
      mother from Lisbon. At fifteen months the family moves to Tete, where he
      lives amid the Colonial War until he is eight. After his parents
      separate he goes to Lisbon with his mother; economic hardship then sends
      him to his father's house in Penafiel, in northern Portugal. His
      father's own difficulty settling back into Portuguese life is what
      eventually sends the family on to Macau, where the itinerant childhood
      ends and the journalism begins.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

  - id: jrs-father-death-1986
    organisation: diptych
    illustration_type: symbolic-still-life
    images_required: 2
    date: 1986-01
    title: His father's death funds a BBC internship, and later a novel
    impact: high
    description: >
      His father, José da Paz Brandão Rodrigues dos Santos, a doctor born in
      Penafiel in 1930, dies in January 1986. By his own account, Rodrigues
      dos Santos had just finished his Comunicação Social degree and been
      accepted for an unpaid three-month internship at the BBC in England with
      no funding attached; he pays for it himself with his father's
      inheritance. The trip earns him two Portuguese press prizes the
      following two years (the Clube Português de Imprensa's essay prize in
      1986, the American Club of Lisbon's academic merit prize in 1987),
      credentials that in turn get him hired by BBC World Service in London.
      Nearly a quarter century later he draws directly on his father's own
      life as a doctor in colonial Mozambique for
      [[work:jose-rodrigues-dos-santos/o-anjo-branco|O Anjo Branco]] (2010), a
      novel about a Flying Doctors' service he has called his most intimate
      and emotional book.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"
      - "https://joserodriguesdossantos.com/en/bio/"

  - id: jrs-gulf-war-debut-1991
    organisation: immersion
    illustration_type: establishing-landscape
    images_required: 1
    date: 1991-01-16
    title: A ten-hour Gulf War marathon makes him the face of Telejornal
    impact: high
    description: >
      Presenting RTP's late-night newscast 24 Horas, Rodrigues dos Santos is
      on air on 16 January 1991 when the US-led coalition begins bombing
      Baghdad. He anchors a roughly ten-hour marathon broadcast on the attack,
      including a live phone link into Baghdad, a first for Portuguese
      television. The broadcast makes him one of the station's most
      recognised faces; within the year RTP moves him to the flagship evening
      newscast, Telejornal, which he still presents today.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"
      - "https://www.infopedia.pt/artigos/$jose-rodrigues-dos-santos"

  - id: jrs-cnn-huambo-1994
    organisation: marginalia
    illustration_type: emblem-seal
    images_required: 1
    date: 1994
    title: Wins his first CNN award, reporting the Angolan civil war
    impact: low
    description: >
      A year into his run as a permanent CNN World Report contributor
      (1993-2002, alongside presenting Telejornal), Rodrigues dos Santos wins
      CNN's Best News Breaking Story of the Year for "Huambo Battle", his
      report on fighting in the Angolan civil war.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

  - id: jrs-cnn-albania-1998
    organisation: floating-object
    illustration_type: isolated-object
    images_required: 1
    date: 1998
    title: A second CNN award, for a report on Albania's Cold War bunkers
    impact: low
    description: >
      CNN names his report "Albania Bunkers", on the hundreds of thousands of
      concrete bunkers built under Enver Hoxha's paranoid Cold War regime,
      its Best News Story of the Year for the Sunday. It is the second of
      three CNN awards over his decade as the network's Portuguese
      correspondent, the run capped in 2000 by the Contributor Achievement
      Award for the body of his work.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

  - id: jrs-rtp-director-conflict-2004
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 2004-11
    title: Resigns as RTP's Information Director over "illegitimate interference"
    impact: med
    description: >
      Serving (for the first time of two) as RTP's Director of Information
      under the PSD/CDS government of Durão Barroso, Rodrigues dos Santos is
      publicly needled in October 2004 by Nuno Morais Sarmento, the minister
      overseeing RTP, who tells parliament there are "limits" to the public
      broadcaster's independence and that "it isn't doctorate-holding
      journalists" who answer for the spending of public money, a plain jab
      at Rodrigues dos Santos's own PhD. Two weeks later the RTP board
      overrides his own selection for a Madrid correspondent post; he resigns,
      alleging editorial "interference". Portugal's media regulator (the
      AACS, predecessor to today's ERC) later investigates and concludes there
      had in fact been "illegitimate interference" by the administration,
      vindicating him.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

  - id: jrs-rtp-disciplinary-cleared-2007
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 2007-11
    title: Survives a dismissal proceeding after repeating the 2004 charge
    impact: low
    description: >
      After he repeats his 2004 accusations of editorial interference, RTP
      opens a disciplinary process seeking his dismissal. The station's own
      internal investigators conclude, at the end of the process, that there
      are no grounds for it.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

  - id: jrs-gradiva-to-planeta-2022
    organisation: diptych
    illustration_type: book-object
    images_required: 2
    date: 2022-05
    title: Ends 21 years with Gradiva, moving to the Spanish giant Planeta
    impact: med
    description: >
      After 21 years and 23 novels with Gradiva, Rodrigues dos Santos signs
      with the Spanish multinational Planeta, which announces on 17 May 2022
      that it will publish his next novel that October; by nit.pt's account he
      had spent about a year weighing the offer. Gradiva's founder, Guilherme
      Valente, tells Expresso there are no hard feelings ("I always lived with
      the ghost of someone taking him away") but that the departure is a real
      budget hole the house will have to redistribute resources to cover. The
      move also draws public criticism of Planeta from a rival: Manuel de
      Freitas, Penguin Random House Portugal's director-general, tells the
      same paper that "the author wasn't looking for a new publisher" and that
      poaching one from a rival house breaks an unwritten rule of the trade.
      His first novel for Planeta,
      [[work:jose-rodrigues-dos-santos/a-mulher-do-dragao-vermelho|A Mulher do
      Dragão Vermelho]], becomes the country's best-selling book that year.
    spoilerAfter: null
    sources:
      - "https://www.nit.pt/cultura/livros/mercado-editorial-ao-rubro-jose-rodrigues-dos-santos-troca-gradiva-por-planeta"
      - "https://www.flash.pt/celebridades/detalhe/jose-rodrigues-dos-santos-acaba-casamento-de-longa-duracao-com-editora-e-muda-se-para-a-planeta"

  - id: jrs-sorbonne-thesis-2022
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 2022-11-16
    title: Defends a second doctoral thesis, at the Sorbonne, on fascism's roots
    impact: low
    description: >
      Already holding a doctorate in Communication Sciences from Universidade
      Nova de Lisboa, Rodrigues dos Santos announces on social media that he
      has defended a second doctoral thesis, at the Sorbonne in Paris, before
      an international jury, "with distinction and high honours," scoring 19
      out of 20. RTP's own arts desk reports the thesis's subject: that
      fascism has an ideological origin in Marxism, a claim the author himself
      stresses is not the same as saying fascism and Marxism are one and the
      same thing. It is the same claim, argued years earlier in his novel
      [[work:jose-rodrigues-dos-santos/as-flores-de-lotus|As Flores de
      Lótus]] and its sequel O Pavilhão Púrpura, that draws public fire from
      a historian the following year.
    spoilerAfter: null
    sources:
