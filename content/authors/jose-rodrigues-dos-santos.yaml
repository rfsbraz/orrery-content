# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds). Author-LIFE events live here (lifeEvents);
# franchise-specific events stay in the franchise.
#
# A living, still-working public figure (RTP's Telejornal anchor since 1991),
# so sourced from Portuguese primary material: the Portuguese Wikipedia
# article (itself citing Público, RTP and the Biblioteca Nacional), his own
# publisher's author page, and his official author site, cross-checked
# against each other.
id: jose-rodrigues-dos-santos
name: José Rodrigues dos Santos
aka: ["Jose Rodrigues dos Santos"]
born: 1964-04-01
died: null
bio: >
  Born in Beira, in the then Portuguese overseas province of Mozambique, the
  son of a doctor. Moved to Tete at fifteen months and lived there amid the
  Colonial War until he was eight; after his parents separated he lived
  between Lisbon and his father's hometown of Penafiel before the family
  moved to Macau, where he began working in journalism at Rádio Macau in
  1981, aged seventeen. He returned to Portugal in 1983 to study Social
  Communication at the Universidade Nova de Lisboa; after his father's death
  he used the inheritance to fund a three-month unpaid internship at the BBC
  in England. Two Portuguese press prizes (1986, 1987) led to a post at BBC
  World Service in London (1990-1993). He joined RTP in 1991, presenting the
  late-night newscast 24 Horas before moving, on the day the Gulf War began,
  to the flagship evening newscast Telejornal, which he still anchors. He was
  a permanent CNN contributor from 1993 to 2002, winning three CNN
  journalism awards, and holds a doctorate in Communication Sciences
  (Universidade Nova de Lisboa) on the subject of war reportage, later
  expanded into a three-part study: [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
  de Guerra I]], [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade|Crónicas
  de Guerra II]] and [[work:jose-rodrigues-dos-santos/a-verdade-da-guerra|A
  Verdade da Guerra]]. He has twice served as RTP's Director of Information
  and teaches at the Universidade Nova de Lisboa. He married Florbela
  Cardoso in 1988; they have two daughters, Catarina (b. 1991) and Inês
  (b. 1998).

  He published his first novel, [[work:jose-rodrigues-dos-santos/a-ilha-das-trevas|A
  Ilha das Trevas]], in 2002, but his career-defining book was
  [[work:jose-rodrigues-dos-santos/o-codex-632|O Codex 632]] (2005), which
  introduced the historian and cryptanalyst Tomás Noronha and was acquired
  by HarperCollins for the US market. Its sequel,
  [[work:jose-rodrigues-dos-santos/a-formula-de-deus|A Fórmula de Deus]]
  (2006, published in English as The Einstein Enigma), became his
  best-known novel and the series' signature title. The Noronha series,
  numbered by its publisher and fourteen books long by 2025, anchors a
  wider shelf of historical fiction: a two-part biographical novel of
  Calouste Gulbenkian, a four-book saga set across wartime Macau and China,
  and several other linked pairs and standalones, more than one of them
  drawing on his own family's history in colonial Mozambique. After
  twenty-one years with the publisher Gradiva, he moved to Grupo Planeta in
  2022. He is also a prolific essayist and interviewer, publishing on media
  theory, on the history of war reporting, and collecting his own
  television conversations with major international novelists.
