      - "https://www.flash.pt/celebridades/nacional/detalhe/aluno-de-excelencia-tese-de-jose-rodrigues-dos-santos-aprovada-com-19-valores-em-universidade-sorbonne-em-paris"
      - "https://www.atelevisao.com/rtp/jose-rodrigues-dos-santos-defende-tese-em-paris-e-e-distinguido-com-19-valores/"
      - "https://www.rtp.pt/noticias/cultura/origens-do-fascismo-tese-de-jose-rodrigues-dos-santos-defende-ligacoes-ao-marxismo_v1447707"
