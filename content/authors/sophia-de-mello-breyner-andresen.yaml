  - id: sophia-de-mello-breyner-andresen-panteao-2014
    organisation: strip
    illustration_type: serial-contact-sheet
    images_required: 1
    date: 2014-07-02
    title: Reburied in the National Pantheon, ten years to the day after her death
    impact: high
    description: >
      On 20 February 2014 the Assembleia da República votes unanimously to
      grant her honras de Panteão; the transfer takes place on 2 July, the
      tenth anniversary of her death. A cortège travels from the
      Cemitério de Carnide, past the Assembleia da República, to the
      Panteão Nacional, where writer José Manuel dos Santos, a close
      friend, delivers the eulogy before President Aníbal Cavaco Silva
      speaks. She becomes the second woman given Pantheon honours, after
      fado singer Amália Rodrigues in 2001; the official act names her "a
      escritora universal, a mulher digna, a cidadã corajosa, a
      portuguesa insigne" ("the universal writer, the dignified woman,
      the courageous citizen, the eminent Portuguese woman").
    spoilerAfter: null
    sources:
      - "https://panteaonacional.gov.pt/homenageados/sophia-de-mello-breyner-andresen"
      - "https://www.panteaonacional.gov.pt/homenageados/amalia-rodrigues"
