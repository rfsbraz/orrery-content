  - id: sophia-de-mello-breyner-andresen-vida-literaria-1994
    organisation: marginalia
    illustration_type: emblem-seal
    images_required: 1
    date: 1994
    title: Receives the Portuguese Writers' Association's career prize
    impact: low
    description: >
      Fifteen years before the Camões, at 74, receives the Prémio de Vida
      Literária of the Associação Portuguesa de Escritores - a
      lifetime-achievement recognition that, together with the Prémio D.
      Dinis and Pen Club prize
      [[work:sophia-de-mello-breyner-andresen/ilhas|Ilhas]] won in 1989,
      marks the critical establishment closing in around her in the
      decade before the country's highest literary honour.
    spoilerAfter: null
