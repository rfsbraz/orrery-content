  - id: sophia-de-mello-breyner-andresen-camoes-prize-1999
    organisation: layered-stack
    illustration_type: press-media-collage
    images_required: 1
    date: 1999
    title: First woman awarded the Prémio Camões
    impact: high
    description: >
      Becomes the first woman to receive the Prémio Camões, the highest
      literary honour in the Portuguese language, thirty-five years after
      her first major prize and fifty-five years after her debut. The Max
      Jacob poetry prize (2001) and Spain's Reina Sofía prize for
      Ibero-American poetry (2003) follow.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
      - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

  # Both Wikipedias name Hospital Pulido Valente, citing an unclear
  # secondary reference; three Lisbon papers filed within two days of her
  # death (Público and Jornal de Notícias same-day, Correio da Manhã the
  # next) all give Hospital da Cruz Vermelha instead. The contemporary
  # press is used here.
  - id: sophia-de-mello-breyner-andresen-death-2004
    organisation: immersion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 2004-07-02
    title: Dies in Lisbon, aged 84, ten days short of a Chilean honour
    impact: high
    description: >
      Dies at Lisbon's Hospital da Cruz Vermelha on 2 July 2004, aged 84,
      after roughly fifteen days admitted there. The Chilean embassy had
      announced the day before that she was to receive the Medalha de
      Honra do Presidente do Chile, timed to Pablo Neruda's centenary (12
      July) and shared with fellow honouree José Saramago, who receives
      his as scheduled; she is first buried in the Cemitério de Carnide.
    spoilerAfter: null
    sources:
