    date: 1969-12-31
    title: Co-founds the National Commission for Support of Political Prisoners
    impact: high
    description: >
      Co-founds the Comissão Nacional de Socorro aos Presos Políticos
      (CNSPP), an opposition organisation that provided financial and
      legal aid to the families of political prisoners of the Estado Novo
      dictatorship until the regime fell in 1974; the same year she stands
      as a candidate for the opposition CEUD (Comissão Eleitoral de
      Unidade Democrática) list. Her "Cantata da Paz" - "Vemos, ouvimos e
      lemos. Nao podemos ignorar!" - becomes an anthem of the Progressive
      Catholic opposition to the regime. The justice her poetry keeps
      returning to is not only an abstraction.
