  - id: sophia-de-mello-breyner-andresen-constituent-assembly-1975
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    modifier: breakout
    date: 1975
    title: Elected to the Constituent Assembly; coins "A Poesia está na rua"
    impact: high
    description: >
      Following the 25 April 1974 Carnation Revolution that ends the
      Estado Novo, is chosen by Mário Soares as the Socialist Party's
      number-one candidate for the Porto constituency and elected in 1975
      to the Constituent Assembly that drafts Portugal's current
      constitution - one of 19 women deputies, and the only one to chair a
      commission, the one that drafts the constitution's preamble, whose
      text has stood unchanged since 1976. It is Sophia who gives the
      Revolution its most quoted line, "A Poesia está na rua" ("Poetry is
      in the street"). On the floor she protests folding the Secretariat
      of State for Culture into the Ministry of Social Communication (2
      August), argues against political "dirigismo" over culture (3
      September), and demands urgent state support for people with
      disabilities, many of them war-wounded from the just-ended colonial
      war (3-4 October). On 12-13 November she is among the deputies
      besieged for 36 hours inside the Palácio de São Bento by some
      100,000 protesting construction workers during the "Verão Quente";
      asked as she finally leaves whether she is a fascist, her only
      recorded answer is "Fascista? Eu?..." Her husband Francisco Sousa
      Tavares, despite his own record of opposing the dictatorship, is
      passed over by every party for the same election and feels
      ostracised - a resentment that outlives the Assembly, which
      dissolves in 1976; she is never elected to office again.
    spoilerAfter: null
    sources:
      - "https://app.parlamento.pt/comunicar/v1/201912/61/artigos/art4.html"
      - "https://especiais.rr.pt/sophia-100-anos/"
      - "https://observador.pt/especiais/a-mae-desatenta-a-preocupacao-doentia-com-as-doencas-e-o-divorcio-de-francisco-pre-publicacao-da-primeira-biografia-de-sophia/"

  - id: sophia-de-mello-breyner-andresen-writing-as-politics-1982
    organisation: epigraph
    quote: >
      Fiquei a conversar com as crianças - e pensei, de repente, que
      escrever era a minha verdadeira participação política.
    images_required: 0
    date: 1982-02-16
    # An epigraph's `title` is the attribution, not a second copy of the
    # quotation (docs/LAYOUT.md): the quote renders large and this line sits
    # beneath it saying where the words come from.
    title: "Jornal de Letras interview, 16 February 1982 (interviewer Maria Armanda Passos)"
    impact: high
    description: >
      Never re-elected after the Constituent Assembly dissolves, she tells
      the Jornal de Letras (16 February 1982, interviewer Maria Armanda
      Passos) about the moment that settled it for her: leaving the
      Assembly early one evening, she crosses the Bairro Alto on foot and
      is stopped by children playing on a doorstep who recognise her from
      a story their teacher had read aloud in class. "Fiquei a conversar
      com as crianças - e pensei, de repente, que escrever era a minha
      verdadeira participação política" ("I stayed talking with the
      children - and thought, suddenly, that writing was my true
      political participation"). She tells the same story again, close to
      verbatim, in at least one further interview a decade later, and is
      blunter elsewhere about the cost of the alternative: being a
      deputy, she says in 1989, "custou-me horrorosamente, fez-me imenso
      mal à saúde" ("cost me horribly, did real damage to my health").
    spoilerAfter: null
    sources:
      - "https://app.parlamento.pt/comunicar/v1/201912/61/artigos/art4.html"
      - "https://especiais.rr.pt/sophia-100-anos/"

  - id: sophia-de-mello-breyner-andresen-separation-divorce-1986
    organisation: medallion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1986
    title: Separates from Francisco Sousa Tavares after politics widens the rift
    impact: high
    description: >
      The marriage, between two temperamental opposites who argued often
      but forgot it by the next day, frays for good after 25 April 1974:
      Sophia goes to the Constituent Assembly while Francisco, despite his
      own record of resisting the dictatorship, is not called by any
      party to run and feels ostracised, at points accused of being a
      "social-democrata burguês" for not standing further left. The
      couple separates in 1986, forty years into the marriage, and
      divorces in 1988 after a litigious process; Francisco remarries the
      following year.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Francisco_Sousa_Tavares"
      - "https://observador.pt/especiais/a-mae-desatenta-a-preocupacao-doentia-com-as-doencas-e-o-divorcio-de-francisco-pre-publicacao-da-primeira-biografia-de-sophia/"

  - id: sophia-de-mello-breyner-andresen-gulbenkian-children-1992
    organisation: beside
    illustration_type: book-object
    images_required: 1
    date: 1992
    title: Wins the Gulbenkian children's-literature prize
    impact: med
    description: >
      Receives the Grande Prémio Calouste Gulbenkian de Literatura para
      Crianças, awarded this time for the whole of her children's-book
      catalogue rather than a single title - recognition, some four
      decades after motherhood first turned her to the form, that the
      eight tales written for her own children had become a body of work
      in its own right.
    spoilerAfter: null
    sources:
      - "https://www.dn.pt/cultura/centenario-de-sophia-de-mello-breyner-e-10138353.html"
      - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

