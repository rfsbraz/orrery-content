  - id: sophia-de-mello-breyner-andresen-husband-arrested-1959
    organisation: layered-stack
    illustration_type: archive-stack
    images_required: 1
    modifier: pull-focus
    date: 1959-03-11
    title: Husband jailed in the failed Revolta da Sé; the couple invent a code the PIDE never broke
    impact: high
    description: >
      Francisco Sousa Tavares, expelled from the civil service in 1958 for
      campaigning in General Humberto Delgado's opposition presidential
      bid, takes part in the Revolta da Sé, a military uprising against
      Salazar that collapses within hours on 11 March 1959; he is jailed
      along with many of its supporters, among them Sophia's close friend
      the poet Jorge de Sena. During this and a second imprisonment in
      1968 (over his role in exposing the Ballet Rose scandal), Sophia and
      Francisco correspond in a private code the political police never
      manage to break; their son Miguel, entrusted with the key, still
      declines decades later to say what it was.
    spoilerAfter: null
    sources:
