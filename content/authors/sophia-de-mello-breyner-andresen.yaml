# GLOBAL author entity (docs/SCHEMA.md). Eight lifeEvents mark her birth,
# her 1944 debut, her 1946 marriage, the 1964 Grande Prémio for Livro
# Sexto, her 1969 co-founding of the Comissão Nacional de Socorro aos
# Presos Políticos, the 1975 Constituent Assembly election following the
# Carnation Revolution, her 1999 Camões Prize (the first ever awarded to a
# woman), and her 2004 death - a first draft against the 6-12 range this
# catalogue's aura standard calls for (docs/CURATION.md). Further
# candidates a fuller pass could corroborate and add include her divorce,
# the 1926 coup that produced the dictatorship she spent her life
# opposing, and her 2014 reburial in the National Pantheon. Every date
# below is corroborated by at least the Portuguese and English Wikipedia
# biographies; where a further primary source strengthens a fact, it is
# cited alongside.
#
# aka: none found. Some sources render the name "Sophia de Mello Breyner
# Andersen" (with a "d" rather than a Danish "e" i.e. a misspelling of her
# own paternal surname); pt.wikipedia's own bibliography section uses this
# misspelling in at least one citation title (Luísa Pessoa's 2006 study),
# which argues it is a real, recurring publishing-world error rather than a
# deliberate alternate form, so it is not recorded as an aka here.

id: sophia-de-mello-breyner-andresen
name: Sophia de Mello Breyner Andresen
born: 1919-11-06
died: 2004-07-02
bio: >
  Born in Porto at 11:15 on 6 November 1919, the daughter of Maria Amélia de
  Mello Breyner and João Henrique Andresen; the Andresen surname descends
  from her paternal great-grandfather Jan Andresen, a Danish merchant who
  settled in Porto and never left the region, and whose son bought the
  Quinta do Campo Alegre in 1895, the family estate now Porto's Botanical
  Garden. Her mother's side carried old Portuguese aristocratic and
  financial lineage: Maria Amélia was the daughter of Tomás de Mello
  Breyner, Count of Mafra, a physician and friend of King Carlos I, and the
  granddaughter of the Belgian-descended capitalist and future Count of
  Burnay, Henrique Burnay. Raised in a household she later described as "a
  fabulous territory with a large and rich family served by a large
  household staff", she began school at Porto's newly opened Colégio
  Sagrado Coração de Jesus and studied Classical Philology at the
  University of Lisbon from 1936 to 1939, without completing the course;
  she led Catholic university movements during these years and collaborated
  with the magazine Cadernos de Poesia, where she formed lasting friendships
  with Ruy Cinatti and Jorge de Sena. Her first book,
  [[work:sophia-de-mello-breyner-andresen/poesia|Poesia]], appeared under
  that magazine's imprint in 1944 and opened a body of work - the sea,
  ancient Greece, the demand for justice and moral clarity, the house and
  garden of memory - that would run for sixty years. In 1946 she married the
  journalist, lawyer and politician Francisco Sousa Tavares, moved to
  Lisbon, and had five children: Isabel; Maria, later a literature
  professor and the editor of several posthumous anthologies of her
  mother's work; Miguel, a journalist and writer; Sofia; and Xavier, a
  painter and ceramist who illustrated several of her later books. It was
  motherhood that turned her to children's writing, starting in the
  mid-1950s. The marriage ended in separation in 1986 and divorce in 1988.
  A committed opponent of the Estado Novo dictatorship and, later, the
  Portuguese Colonial War, she co-founded the Comissão Nacional de Socorro
  aos Presos Políticos in 1969 and stood as a candidate for the opposition
  CEUD list the same year; her "Cantata da Paz" became an anthem of the
  Progressive Catholic opposition. Following the 25 April 1974 Carnation
  Revolution she was elected in 1975 to the Constituent Assembly that wrote
  Portugal's current constitution, representing the Socialist Party for the
  Porto constituency, while her husband moved toward the rival Social
  Democratic Party. Alongside her poetry she published two collections of
  short tales, eight children's books written mostly for her own children,
  five stage plays, occasional essays, and translations of Dante, Shakespeare
  and Euripides into Portuguese; see
  [[franchise:sophia-de-mello-breyner-andresen|the franchise entry]] for the
  full, tiered bibliography. In 1999 she became the first woman to receive
  the Prémio Camões, Portuguese-language literature's highest honour; further
  recognition followed, including the Max Jacob prize (2001) and Spain's
  Reina Sofía prize for Ibero-American poetry (2003). She died in Lisbon's
  Hospital Pulido Valente on 2 July 2004, aged 84, and was first buried in
  the Cemitério de Carnide; on 2 July 2014, the tenth anniversary of her
  death, the Assembleia da República had her remains moved to the National
  Pantheon.
