# GLOBAL author entity (docs/SCHEMA.md). Fourteen lifeEvents: her birth,
# her 1944 debut, her 1946 marriage, her husband's 1959 arrest in the
# failed Revolta da Sé and the code the couple used to write to each
# other in prison, the 1964 Grande Prémio for Livro Sexto, her 1969
# co-founding of the Comissão Nacional de Socorro aos Presos Políticos,
# the 1975 Constituent Assembly election (deepened here with her actual
# parliamentary record, not just the fact of the seat), a 1982 interview
# naming writing itself as her "true political participation", her 1986
# separation and 1988 divorce from Francisco Sousa Tavares amid
# post-revolution political friction, a 1992 children's-literature prize,
# her 1994 Prémio Vida Literária, her 1999 Camões Prize (the first ever
# awarded to a woman), her 2004 death, and her 2014 reburial in the
# National Pantheon. Two franchise-level events
# (content/franchises/sophia-de-mello-breyner-andresen/events.yaml) record
# prizes tied to a specific book rather than the career: O Nome das
# Coisas (1977) and Ilhas (1989). Every new date below is corroborated by
# at least two independent sources per the aura standard
# (docs/CURATION.md). One correction along the way: a full run of
# contemporary Portuguese press (Público, Jornal de Notícias and Correio
# da Manhã, all filed within two days of her death) gives the hospital
# she died in as the Hospital da Cruz Vermelha, not the Hospital Pulido
# Valente both Wikipedias name.
#
# aka: none found. Some sources render the name "Sophia de Mello Breyner
# Andersen" (with a "d" rather than a Danish "e" i.e. a misspelling of her
# own paternal surname); pt.wikipedia's own bibliography section uses this
# misspelling in at least one citation title (Luísa Pessoa's 2006 study),
# which argues it is a real, recurring publishing-world error rather than a
# deliberate alternate form, so it is not recorded as an aka here.

id: sophia-de-mello-breyner-andresen
name: Sophia de Mello Breyner Andresen
born: 1919-11-06
died: 2004-07-02
bio: >
  Born in Porto at 11:15 on 6 November 1919, the daughter of Maria Amélia de
  Mello Breyner and João Henrique Andresen; the Andresen surname descends
  from her paternal great-grandfather Jan Andresen, a Danish merchant who
  settled in Porto and never left the region, and whose son bought the
  Quinta do Campo Alegre in 1895, the family estate now Porto's Botanical
  Garden. Her mother's side carried old Portuguese aristocratic and
  financial lineage: Maria Amélia was the daughter of Tomás de Mello
  Breyner, Count of Mafra, a physician and friend of King Carlos I, and the
  granddaughter of the Belgian-descended capitalist and future Count of
  Burnay, Henrique Burnay. Raised in a household she later described as "a
  fabulous territory with a large and rich family served by a large
  household staff", she began school at Porto's newly opened Colégio
  Sagrado Coração de Jesus and studied Classical Philology at the
  University of Lisbon from 1936 to 1939, without completing the course;
  she led Catholic university movements during these years and collaborated
  with the magazine Cadernos de Poesia, where she formed lasting friendships
  with Ruy Cinatti and Jorge de Sena. Her first book,
  [[work:sophia-de-mello-breyner-andresen/poesia|Poesia]], appeared under
  that magazine's imprint in 1944 and opened a body of work - the sea,
  ancient Greece, the demand for justice and moral clarity, the house and
  garden of memory - that would run for sixty years. In 1946 she married the
  journalist, lawyer and politician Francisco Sousa Tavares, moved to
  Lisbon, and had five children: Isabel; Maria, later a literature
  professor and the editor of several posthumous anthologies of her
  mother's work; Miguel, a journalist and writer; Sofia; and Xavier, a
  painter and ceramist who illustrated several of her later books. It was
  motherhood that turned her to children's writing, starting in the
  mid-1950s. A committed opponent of the Estado Novo dictatorship, she sees
  Francisco jailed in 1959 for taking part in the failed Revolta da Sé and
  again in 1968; the couple write to each other in prison in a private code
  the political police never break. She co-founds the Comissão Nacional de
  Socorro aos Presos Políticos in 1969 and stands as a candidate for the
  opposition CEUD list the same year; her "Cantata da Paz" becomes an anthem
  of the Progressive Catholic opposition. Following the 25 April 1974
  Carnation Revolution she is elected in 1975 to the Constituent Assembly
  that writes Portugal's current constitution, representing the Socialist
  Party for the Porto constituency, chairs the commission that drafts the
  constitution's preamble, and coins the line "A Poesia está na rua" -
  while her husband, despite his own record against the dictatorship, is
  passed over by every party and feels politically ostracised. The
  friction outlives the Assembly: the marriage frays through the later
  1970s and separates in 1986, forty years in, with the divorce finalised
  in 1988. Alongside her poetry she published two collections of short
  tales, eight children's books written mostly for her own children, five
  stage plays, occasional essays, and translations of Dante, Shakespeare
  and Euripides into Portuguese; see
  [[franchise:sophia-de-mello-breyner-andresen|the franchise entry]] for the
  full, tiered bibliography. In 1999 she became the first woman to receive
  the Prémio Camões, Portuguese-language literature's highest honour; further
  recognition followed, including the Max Jacob prize (2001) and Spain's
  Reina Sofía prize for Ibero-American poetry (2003). She died at Lisbon's
  Hospital da Cruz Vermelha on 2 July 2004, aged 84, ten days short of a
  ceremony to receive Chile's Medalha de Honra do Presidente for the Pablo
  Neruda centenary, and was first buried in the Cemitério de Carnide; on 2
  July 2014, the tenth anniversary of her death, the Assembleia da
  República had her remains moved to the National Pantheon, making her the
  second woman - after fado singer Amália Rodrigues in 2001 - to receive
  that honour.
