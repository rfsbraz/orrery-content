  - id: sophia-de-mello-breyner-andresen-poesia-debut-1944
    date: 1944
    title: Publishes Poesia, her first book, at 24
    impact: high
    description: >
      Publishes [[work:sophia-de-mello-breyner-andresen/poesia|Poesia]]
      through the Cadernos de Poesia imprint in Coimbra, while still in her
      mid-twenties, having left the University of Lisbon's Classical
      Philology course unfinished five years earlier. The book already
      carries the themes - the garden and house of childhood, the sea, a
      demand for moral clarity - that the rest of her sixty-year body of
      work returns to.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
      - "https://purl.pt/19841/1/bibliografia/bibliografia.html"

  - id: sophia-de-mello-breyner-andresen-marriage-1946
    date: 1946
    title: Marries Francisco Sousa Tavares; motherhood turns her to children's books
    impact: med
    description: >
      Marries journalist, lawyer and politician Francisco Sousa Tavares
      and moves from Porto to Lisbon. They have five children - Isabel,
      Maria, Miguel, Sofia and Xavier - and it is for them, starting in
      the mid-1950s, that she begins writing the children's tales
      ([[work:sophia-de-mello-breyner-andresen/a-menina-do-mar|A Menina do
      Mar]] and the seven further titles that follow it) that made her as
      widely read by Portuguese schoolchildren as by readers of her
      poetry. The marriage ends in separation in 1986 and divorce in 1988.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
      - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

  - id: sophia-de-mello-breyner-andresen-grande-premio-1964
    date: 1964
    title: Wins the Portuguese Writers' Society Grand Prize for Poetry
    impact: med
    description: >
      Receives the Grande Prémio de Poesia of the Sociedade Portuguesa de
      Escritores for
      [[work:sophia-de-mello-breyner-andresen/livro-sexto|Livro Sexto]]
      (1962), her sixth poetry collection - the first major literary
      recognition of a career that had already run twenty years, and the
      book most often named alongside her Camões Prize thirty-five years
      later.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
      - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

  - id: sophia-de-mello-breyner-andresen-cnspp-1969
    date: 1969-12-31
    title: Co-founds the National Commission for Support of Political Prisoners
    impact: high
    description: >
      Co-founds the Comissão Nacional de Socorro aos Presos Políticos
      (CNSPP), an opposition organisation that provided financial and
      legal aid to the families of political prisoners of the Estado Novo
      dictatorship until the regime fell in 1974; the same year she stands
      as a candidate for the opposition CEUD (Comissão Eleitoral de
      Unidade Democrática) list. Her "Cantata da Paz" - "Vemos, ouvimos e
      lemos. Nao podemos ignorar!" - becomes an anthem of the Progressive
      Catholic opposition to the regime. The justice her poetry keeps
      returning to is not only an abstraction.
    spoilerAfter: null
    sources:
      - "https://pt.wikipedia.org/wiki/Comiss%C3%A3o_Nacional_de_Socorro_aos_Presos_Pol%C3%ADticos"
      - "https://panteaonacional.gov.pt/en/homenageados/sophia-de-mello-breyner-andresen"
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

  - id: sophia-de-mello-breyner-andresen-constituent-assembly-1975
    date: 1975
    title: Elected to the Constituent Assembly after the Carnation Revolution
    impact: med
    description: >
      Following the 25 April 1974 Carnation Revolution that ends the
      Estado Novo, is elected in 1975 to the Constituent Assembly that
      drafts Portugal's current constitution, representing the Socialist
      Party for the Porto constituency and serving through 1976. Her
      husband Francisco Sousa Tavares moves toward the rival Social
      Democratic Party in the same period.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
      - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

  - id: sophia-de-mello-breyner-andresen-camoes-prize-1999
    date: 1999
    title: First woman awarded the Prémio Camões
    impact: high
    description: >
      Becomes the first woman to receive the Prémio Camões, the highest
      literary honour in the Portuguese language, thirty-five years after
      her first major prize and fifty-five years after her debut. The Max
      Jacob poetry prize (2001) and Spain's Reina Sofía prize for
      Ibero-American poetry (2003) follow.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
      - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"

  - id: sophia-de-mello-breyner-andresen-death-2004
    date: 2004-07-02
    title: Dies in Lisbon, aged 84
    impact: high
    description: >
      Dies in Lisbon's Hospital Pulido Valente on 2 July 2004, aged 84, and
      is first buried in the Cemitério de Carnide. On 2 July 2014, the
      tenth anniversary of her death, the Assembleia da República has her
      remains moved to the National Pantheon - the first Portuguese woman
      writer honoured there.
    spoilerAfter: null
