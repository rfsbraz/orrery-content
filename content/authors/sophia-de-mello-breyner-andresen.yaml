  - id: sophia-de-mello-breyner-andresen-born-1919
    date: 1919-11-06
    title: Born in Porto, into a Danish-descended merchant family
    impact: low
    description: >
      Born at 11:15 on 6 November 1919 in Porto, daughter of Maria Amélia
      de Mello Breyner and João Henrique Andresen. Her paternal
      great-grandfather Jan Andresen was a Danish merchant who settled in
      Porto; her father's family bought the Quinta do Campo Alegre in
      1895, now Porto's Botanical Garden, where she grew up around "a
