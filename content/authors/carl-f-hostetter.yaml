# Minimal collaborator stub - sole editor of The Nature of Middle-earth,
# published after Christopher Tolkien's 2020 death (by arrangement with
# him, per Wikipedia). His own Wikipedia article gives no birth year, so
# born stays null.
id: carl-f-hostetter
name: Carl F. Hostetter
aka: ["Carl Franklin Hostetter"]
born: null
died: null
bio: >
  American Tolkien scholar and NASA computer scientist (Goddard Space
  Flight Center, from 1985); a key figure in the Elvish Linguistic
  Fellowship and long-time editor of the Tolkien linguistics journals
  Vinyar Tengwar and Tengwestië. Edited
  [[work:jrr-tolkien/the-nature-of-middle-earth|The Nature of Middle-earth]]
  (2021), a collection of J. R. R. Tolkien's late philosophical and
  linguistic writings on Middle-earth, by arrangement with
  [[author:christopher-tolkien|Christopher Tolkien]] before the latter's
  death in January 2020. Tolkien scholar Douglas C. Kane's review of the
  book judges that Hostetter "appears to overstep his role as editor" in
  places by reading his own interpretive framing into the material.
sources:
  - https://en.wikipedia.org/wiki/Carl_F._Hostetter
