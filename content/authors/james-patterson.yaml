id: james-patterson
name: James Patterson
aka: ["James Brendan Patterson"]
born: 1947-03-22
died: null
bio: >
  American thriller writer, born in Newburgh, New York, and the best-selling
  novelist of the last three decades by unit sales. He spent his working life
  in advertising at J. Walter Thompson, rising to chief executive, and wrote
  fiction at the edges of it until he left the agency in 1996; his first
  novel, [[work:james-patterson/the-thomas-berryman-number|The Thomas
  Berryman Number]] (1976), won the Edgar Award for Best First Novel.
  [[work:james-patterson/along-came-a-spider|Along Came a Spider]] (1993)
  introduced the forensic psychologist Alex Cross and became the top-selling
  American detective series of the 2010s. From the mid-2000s onward he has
  published fifteen to twenty titles a year across a dozen ongoing series and
  three readerships, the great majority written with a credited collaborator
  working from his outline, and he has said plainly that he is better at
  inventing plots than at writing sentence after sentence. He founded the
  JIMMY Patterson children's imprint, holds the record for most number-one
  New York Times bestsellers by one author, and received the National Book
  Foundation's Literarian Award in 2015 and the National Humanities Medal in
  2019.
