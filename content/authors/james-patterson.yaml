# lifeEvents span 1947-2015 and carry the person rather than the shelf: the
# birth in Newburgh, the night shifts at McLean Hospital that made him a reader
# (mid-1960s), the top of J. Walter Thompson (1988), leaving advertising at
# forty-nine (1996), the advertisements he bought to argue for bookshops and
# libraries (2013), the money he has given them since (2014), and the awards
# that honour that service rather than the novels (2015 onward). Book and
# publishing events live in content/franchises/james-patterson/events.yaml.
#
# Living author. Two facts about his private life are attested in the record
# and are not here: each rests on a single first-person telling, held out under
# the two-source bar, and neither is to be added from that source alone.
lifeEvents:
  - id: patterson-born-1947
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1947-03-22
    title: Born in Newburgh, New York
    impact: low
    description: >
      Born in Newburgh, on the Hudson north of New York City, the eldest of
      four and the only son, in a working-class family of Irish descent. His
      mother taught school; his father sold insurance, having been raised in
      the local poorhouse by a single mother, and had wanted to write. In
      Patterson's last year of high school the family moved to a town outside
      Boston. He has said he read almost nothing as a child beyond what was
      needed to come first in the class.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/James_Patterson
      - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
      - https://web.archive.org/web/20130929023535/http://www.theguardian.com/books/2009/apr/05/james-patterson-author-bestseller

  # Dated from two facts that fix each other: the Observer places the job in
  # his last year of high school in the mid-1960s, and his Manhattan College
  # degree is 1969.
  - id: patterson-mclean-hospital-1965
    organisation: beside
    illustration_type: workplace-workshop
    images_required: 1
    date: 1965
    title: Night shifts at McLean
    impact: med
    description: >
      Needing money after the family moved to Massachusetts, he takes a job as
      an aide working nights and weekends at McLean, the psychiatric hospital
      in Belmont, and reads through the quiet hours: this is where a young man
      who had not been a reader becomes one. Robert Lowell was a patient during
      that period and would read and explain poetry aloud in his room once or
      twice a day, and Patterson sat in when he could. He read plays then,
      Genet and Ionesco, and has described the combination of the absurd on the
      page and the distress on the ward as opening a world he had not known
      existed. He has also drawn the opposite conclusion to the one the setting
      invites, and says he has never believed a writer needs to be tortured to
      be any good.
    spoilerAfter: null
    sources:
      - https://web.archive.org/web/20130929023535/http://www.theguardian.com/books/2009/apr/05/james-patterson-author-bestseller
      - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
      - https://www.neh.gov/award/james-patterson

  - id: patterson-jwt-chief-executive-1988
    organisation: beside
    illustration_type: process-diagram
    images_required: 1
    date: 1988
    title: Runs the advertising agency
    impact: med
    description: >
      He had joined J. Walter Thompson in New York as a junior copywriter after
      abandoning a doctorate at Vanderbilt, and rose to become the youngest
      creative director in the firm's history, writing among other things the
      line "I'm a Toys 'R' Us kid". In 1988 he becomes chief executive of the
      agency's North American company, and its chairman in 1990. He has been
      candid that he did not much enjoy the work. The method is nonetheless the
      one the books are made by: a brief, a team, drafts reviewed and sent
      back, and a novelist who handles his own advertising and reads his own
      sales figures.
    spoilerAfter: null
    sources:
      - https://www.britannica.com/biography/James-Patterson
      - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
      - https://web.archive.org/web/20240220213046/https://www.nationalbook.org/people/james-patterson/

  - id: patterson-leaves-advertising-1996
    organisation: floating-object
    illustration_type: isolated-object
    images_required: 1
    date: 1996
    title: Leaves advertising at forty-nine
    impact: med
    description: >
      Twenty years after his first novel and three after
      [[work:james-patterson/along-came-a-spider|Along Came a Spider]], he
      resigns from the agency to write full time. It is the same year he
      publishes three books rather than one and the first with a collaborator's
      name beside his. Asked about it in 2009 he put it as a recovery: as they
      say about advertising, he had been clean for thirteen years.
    spoilerAfter: null
    sources:
      - https://web.archive.org/web/20130929023535/http://www.theguardian.com/books/2009/apr/05/james-patterson-author-bestseller
      - https://www.britannica.com/biography/James-Patterson
      - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html

  - id: patterson-who-will-save-our-books-2013
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 2013-04
    title: Buys advertisements asking who will save the bookshops
    impact: med
    description: >
      He pays for full-page advertisements on the cover of Publishers Weekly
      and inside the New York Times Book Review and Kirkus, headed "Who will
      save our books? Our bookstores? Our libraries?" and listing novels he
      thinks would not be published now. The copy asks why governments rescued
      banks and carmakers and said nothing about books. The man who taught
      publishing to advertise on television is spending his own money
      advertising against the trade's decline; asked what he expected to
      achieve, he said all he could do was stir the pot a little.
    spoilerAfter: null
    sources:
      - https://web.archive.org/web/20130430053424/http://www.publishersweekly.com/pw/by-topic/industry-news/publisher-news/article/56940-patterson-sees-ads-as-a-wake-up-call.html
      - https://en.wikipedia.org/wiki/James_Patterson

  - id: patterson-grants-to-bookshops-and-libraries-2014
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 2014-02-19
    title: Starts handing the money back
    impact: low
    description: >
      He announces a million dollars of his own money for independent
      bookshops, the first fifty-five stores sharing more than $267,000 in
      grants of $2,000 to $15,000 that they may spend however they wish. School
      libraries follow, more than $1.5 million pledged in 2015 and an annual
      figure raised to $2 million in 2018, distributed as four thousand grants
      of $500 to individual teachers, alongside scholarships for trainee
      teachers at four universities.
    spoilerAfter: null
    sources:
      - https://web.archive.org/web/20140220070705/http://www.usatoday.com/story/news/nation/2014/02/19/james-patterson-to-donate-1m/5627325/
      - https://web.archive.org/web/20180720022356/http://www.spokesman.com/stories/2018/mar/19/james-patterson-donating-2-million-to-classroom-li/
      - https://web.archive.org/web/20150530000223/http://www.nytimes.com/2015/05/29/business/media/james-patterson-best-selling-crime-novelist-is-starting-an-imprint-for-childrens-books.html

  - id: patterson-literarian-award-2015
    organisation: medallion
    illustration_type: emblem-seal
    images_required: 1
    date: 2015
    title: Honoured for the reading, not the writing
    impact: low
    description: >
      The National Book Foundation gives him its Literarian Award for
      Outstanding Service to the American Literary Community, and the Los
      Angeles Times Book Prizes an Innovator's Award, in the same year; a
      National Humanities Medal follows in 2019, its citation naming his
      championship of literacy alongside the books themselves. The distinction
      is one the citations draw for him: the most reviewed-against novelist in
      America is honoured by the literary establishment for what he has done
      for reading rather than for what he has written.
    spoilerAfter: null
    sources:
      - https://web.archive.org/web/20240220213046/https://www.nationalbook.org/people/james-patterson/
      - https://www.neh.gov/award/james-patterson
      - https://www.britannica.com/biography/James-Patterson
