  portraitSource: "https://commons.wikimedia.org/wiki/File:Cesario_Verde.JPG"
lifeEvents:
  - id: cesario-verde-born-1855
    date: 1855-02-25
    title: Born in the Madalena parish of Lisbon
    impact: low
    description: >
      Born José Joaquim Cesário Verde in the freguesia da Madalena, central
      Lisbon, eldest surviving child of hardware merchant José Anastácio
      Verde and Maria da Piedade David dos Santos. The household ran an
      ironmongery shop on Rua dos Fanqueiros and a small farm at
      Linda-a-Pastora, Oeiras, where the family also spent time - the
      city/country split that runs through his whole body of work.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
