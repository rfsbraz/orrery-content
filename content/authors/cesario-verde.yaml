    date: 1855-02-25
    title: Born in the Madalena parish of Lisbon
    impact: low
    description: >
      Born José Joaquim Cesário Verde in the freguesia da Madalena, central
      Lisbon, eldest surviving child of hardware merchant José Anastácio
      Verde and Maria da Piedade David dos Santos. The household ran an
      ironmongery shop on Rua dos Fanqueiros; the family's other address, a
      small farm at Linda-a-Pastora, Oeiras, entered their life in 1857, when
      an outbreak of cholera-morbo and yellow fever in Lisbon sent them there
      to shelter - the start of the city/country split that runs through his
      whole body of work.
