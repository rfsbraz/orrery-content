# GLOBAL author entity (docs/SCHEMA.md). Seven lifeEvents mark his birth, his
# sister's death, his enrollment at the Curso Superior de Letras (where he
# meets Silva Pinto), Ramalho Ortigao's notorious review, the onset of his own
# tuberculosis, his brother's death, and his own death; the posthumous 1887
# publication by Silva Pinto is catalogued as a franchise fact on
# content/franchises/cesario-verde/works.yaml rather than repeated here, since
# it is a fact about the book, not about him. Every date below is corroborated
# by at least the Portuguese and English Wikipedia biographies and Infopedia
# (Porto Editora); where they diverge in a small way, the divergence and its
# resolution are noted inline.
#
# The household ran a hardware and ironmongery shop (loja de ferragens) on
# Rua dos Fanqueiros in Lisbon, plus a small farm at Linda-a-Pastora, Oeiras -
# not the textile trade a plausible-sounding but unverified account
# associates with the "Fanqueiros" street name (historically a drapers'
# street): Infopedia states plainly "filho de um comerciante com uma loja de
# ferragens em Lisboa", and pt.wikipedia independently corroborates the same
# ferragens business. Corrected here rather than carried over.

id: cesario-verde
name: Cesário Verde
aka: ["José Joaquim Cesário Verde"]
born: 1855-02-25
died: 1886-07-19
bio: >
  Born José Joaquim Cesário Verde in the Lisbon parish of Madalena, the
  eldest of the surviving children of a prosperous hardware merchant,
  José Anastácio Verde, and Maria da Piedade David dos Santos; the family
  traced its name to Genoese merchant forebears named Verdi. He grew up
  between the household's ironmongery shop on Rua dos Fanqueiros and a small
  farm at Linda-a-Pastora, Oeiras, a city/country split that became the
  defining axis of his poetry. In 1873, at eighteen, he enrolled in the
  University of Lisbon's Curso Superior de Letras, left within months without
  finishing it, and that same year published his first poems in the Diário
  de Notícias - the start of roughly a decade in which some forty poems of
  his appeared scattered across Lisbon newspapers and magazines (also Diário
  da Tarde, Tribuna, A Ilustração), almost always to critical indifference or
  worse: the critic Ramalho Ortigão's 1874 dig in As Farpas, that the young
  poet should be "mais Cesário, menos Verde" (playing on "verde" also meaning
  unripe, inexperienced), stung him for years, though the two later became
  friends. He worked the family business throughout, and after 1879, weary of
  the literary world's indifference, gave it more and more of his time.
  Tuberculosis had already taken his elder sister Maria Júlia in 1872; the
  disease reached him too, with first symptoms in 1877, and took his brother
  Joaquim Tomás in 1882 - the losses that shape his best-known poem, "Nós".
  He died of the same disease in Lisbon's Lumiar parish on 19 July 1886, aged
  31, and is buried in the family tomb at the Cemitério dos Prazeres. He
  published almost nothing as a book in his lifetime: an 1874 announcement of
  a forthcoming volume came to nothing, and the poems that made his name
  reached readers only the following year, gathered by his friend Silva Pinto
  into [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
  Verde]] - see that work's own entry for the fuller, uncertain story of how
  much of its shape is Verde's and how much is Silva Pinto's. He went on to
  be claimed as a direct forerunner by the Portuguese modernists, above all
  Fernando Pessoa, whose heteronyms Alberto Caeiro and Bernardo Soares cite
  him directly and whose Álvaro de Campos is widely read as continuing his
  line.
images:
