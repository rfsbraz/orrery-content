  - id: cesario-verde-curso-superior-letras-1873
    organisation: beside
    illustration_type: relationship-tableau
    images_required: 1
    date: 1873
    title: Enrolls in the Curso Superior de Letras and meets Silva Pinto
    impact: med
    description: >
      Enrolls at eighteen in the University of Lisbon's Curso Superior de
      Letras, attends only a few months without completing it, and there
      meets the critic Silva Pinto, who becomes his lifelong friend and, a
      year after his death, the editor of
      [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
      Verde]]. The same year, he publishes his first poems in the Diário de
      Notícias, the start of roughly a decade of poems scattered across
      Lisbon's press.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
