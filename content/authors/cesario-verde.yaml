  - id: cesario-verde-sister-julia-death-1872
    date: 1872
    title: His sister Maria Júlia dies of tuberculosis
    impact: high
    description: >
      His sister Maria Júlia Verde (1853-1872) dies of pulmonary
      tuberculosis, the disease that will also take his brother Joaquim
      Tomás in 1882 and Verde himself in 1886. Her death is the loss the
      autobiographical poem "Nós" (1884) names directly.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde

  - id: cesario-verde-curso-superior-letras-1873
    date: 1873
    title: Enrolls in the Curso Superior de Letras and meets Silva Pinto
    impact: med
    description: >
      Enrolls at eighteen in the University of Lisbon's Curso Superior de
      Letras, attends only a few months without completing it, and there
      meets the critic Silva Pinto, who becomes his lifelong friend and, a
      year after his death, the editor of
      [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
      Verde]]. The same year, he publishes his first poems in the Diário de
      Notícias, the start of roughly a decade of poems scattered across
      Lisbon's press.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://www.infopedia.pt/%24cesario-verde

  - id: cesario-verde-ortigao-review-1874
    date: 1874
    title: Ramalho Ortigão's "mais Cesário, menos Verde" jab
    impact: med
    description: >
      His 1874 poem "Esplêndida" draws a stinging notice from critic and
      social commentator Ramalho Ortigão in the satirical magazine As Farpas,
      advising the young poet to be "mais Cesário, menos Verde" (playing on
      "verde" also meaning unripe or inexperienced). Verde is said to have
      taken the jab hard and complained for years of the literary world's
      indifference to his work; he and Ortigão later become friends
      regardless. The same year, an announced edition of his poems as a book
      is publicized but never materializes - the closest he comes to a
      lifetime book before
      [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
      Verde]].
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://www.infopedia.pt/%24cesario-verde

  - id: cesario-verde-tuberculosis-onset-1877
    date: 1877
    title: First symptoms of the tuberculosis that will kill him
    impact: high
    description: >
      Shows the first symptoms of pulmonary tuberculosis, the disease that
      had already killed his sister Maria Júlia in 1872 and would kill his
      brother Joaquim Tomás in 1882 before killing him in 1886. His
      biographers link the years after 1877 to a marked falling-off in his
      output, alongside his growing disillusionment with how his poetry was
      received.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde

  - id: cesario-verde-brother-joaquim-death-1882
    date: 1882
    title: His brother Joaquim Tomás dies of tuberculosis
    impact: high
    description: >
      His brother Joaquim Tomás Verde (1858-1882) dies of the same
      pulmonary tuberculosis that had already killed their sister Maria
      Júlia a decade earlier and that Verde already carried himself. Along
      with Maria Júlia's death, this is the double loss "Nós" (1884) is
      written out of.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://www.infopedia.pt/%24cesario-verde

  - id: cesario-verde-death-1886
    date: 1886-07-19
    title: Dies of tuberculosis in Lumiar, aged 31
    impact: high
    description: >
      Dies of pulmonary tuberculosis in the Lumiar parish of Lisbon, aged
      31, having published almost nothing as a book. Buried in the Verde
      family tomb at the Cemitério dos Prazeres. Fewer than a year later,
      his friend Silva Pinto gathers his scattered poems into
      [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
      Verde]], the book that will make his reputation.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://commons.wikimedia.org/wiki/Category:Ces%C3%A1rio_Verde
