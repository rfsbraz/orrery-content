  # frontispiece of O Livro de Cesário Verde's own 1887 first edition;
  # Columbano (1857-1929) is a separate, well-documented Portuguese portrait
  # painter, so this is a contemporary likeness commissioned for the book,
  # not a later invention. Public domain (artist died 1929, well past a
  # life-plus-70 term); the same file is the portrait used in both the
  # Portuguese and English Wikipedia infoboxes and by a dozen other language
  # editions.
  portrait: "https://upload.wikimedia.org/wikipedia/commons/d/d3/Cesario_Verde.JPG"
