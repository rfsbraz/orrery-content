  - id: cesario-verde-sister-julia-death-1872
    organisation: medallion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1872
    title: His sister Maria Júlia dies of tuberculosis
    impact: high
    description: >
      His sister Maria Júlia Verde (1853-1872) dies of pulmonary
      tuberculosis, the disease that will also take his brother Joaquim
      Tomás in 1882 and Verde himself in 1886. Her death is the loss the
      autobiographical poem "Nós" (1884) names directly.
    spoilerAfter: null
