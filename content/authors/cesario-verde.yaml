  - id: cesario-verde-ortigao-review-1874
    organisation: mosaic
    illustration_type: press-media-collage
    images_required: 1
    modifier: anchor-with-satellites
    date: 1874
    title: Ramalho Ortigão's "mais Cesário, menos Verde" jab
    impact: med
    description: >
      His 1874 poem "Esplêndida" - published 22 March in the Diário de
      Notícias under the general title "Fantasias do Impossível", alongside
      "Caprichos" and "Arrojos" - sets off a real literary scandal over its
      "baudelairianismo". Critic and social commentator Ramalho Ortigão takes
      aim in the satirical magazine As Farpas, telling the young poet, in his
      own words, to "seja menos verde e mais cesário" (be less verde and more
      cesário - a double pun on his surname and his own given name), a jab
      usually paraphrased today as "mais Cesário, menos Verde". Fialho de
      Almeida, who will later become one of his admirers, needles him too at
      the time, and Teófilo Braga adds that a modern poet "devia ser
      trabalhador, forte e digno e não devia rebaixar-se assim" (should be
      hardworking, strong and worthy, and should not lower himself like
      this). Verde is said to have taken the jab hard and complained for
      years of the literary world's indifference to his work; he and Ortigão
      do become friends in person, later on. That December, an edition of his
      poems as a book is announced in the newspaper A República (27
      December) and never materializes, then or ever - the closest he comes
      to a lifetime book before
      [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
      Verde]].
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://www.infopedia.pt/%24cesario-verde
      - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=9&o=p"
      - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=10&o=p"

  - id: cesario-verde-tuberculosis-onset-1877
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1877
    title: First symptoms of the tuberculosis that will kill him
    impact: high
    description: >
      Shows the first symptoms of pulmonary tuberculosis, the disease that
      had already killed his sister Maria Júlia in 1872 and would kill his
      brother Joaquim Tomás in 1882 before killing him in 1886. His
      biographers link the years after 1877 to a marked falling-off in his
      output, alongside his growing disillusionment with how his poetry was
      received: writing to Macedo Papança in 1880, after
      [[work:cesario-verde/o-sentimento-dum-ocidental|"O Sentimento dum
      Ocidental"]] ran to near-total silence, he complains that the poem
      "não obteve um olhar, um sorriso, uma observação" (did not get a look,
      a smile, a remark), and that Lisbon itself, next to its own glorious
      past, "parece um cadáver de cidade" (looks like the corpse of a city).
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=14&o=p"

  - id: cesario-verde-brother-joaquim-death-1882
    organisation: medallion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1882-03-20
    title: His brother Joaquim Tomás dies of tuberculosis
    impact: high
    description: >
      His brother Joaquim Tomás Verde (1858-1882) dies of the same
      pulmonary tuberculosis that had already killed their sister Maria
      Júlia a decade earlier and that Verde already carried himself, on 20
      March, aged 24. Along with Maria Júlia's death, this is the double
      loss "Nós" (1884) is written out of.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde
      - https://www.infopedia.pt/%24cesario-verde
      - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=15&o=p"

  - id: cesario-verde-death-1886
    organisation: immersion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1886-07-19
    title: Dies of tuberculosis in Lumiar, aged 31
    impact: high
    description: >
      In May, the physician Sousa Martins tells Silva Pinto the poet is
      "irremediavelmente perdido" (beyond hope). Writing to Macedo Papança on
      16 June, weeks before the end, Verde admits his fear plainly: "Mas
      subitamente chegam-me dúvidas, descrenças, terrores do futuro. Curo-me?
      Sim, talvez." He dies of the same pulmonary tuberculosis at 5am on 19
      July, aged 31, at Largo de São Sebastião 64 in Lisbon's Lumiar parish,
      having spent his final weeks at Caneças in hope of a cure; his last
      words, recorded by his brother Jorge Verde - by then the only one of
      Anastácio Verde's children still living - were "Não quero nada,
      deixa-me dormir" (I want nothing, let me sleep). His death draws
      little notice: the Jornal do Comércio's own obituary states plainly
      that "Cesário Verde morre quase ignorado" (Cesário Verde dies almost
      unknown), and only the Correio da Manhã and A Imprensa print an
      obituary of any length. He is buried in the Verde family tomb at the
      Cemitério dos Prazeres, having published almost nothing as a book.
      Fewer than a year later, his friend Silva Pinto gathers his scattered
      poems into
      [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
      Verde]], the book that will make his reputation.
    spoilerAfter: null
    sources:
