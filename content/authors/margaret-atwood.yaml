lifeEvents:
  - id: margaret-atwood-born-1939
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1939-11-18
    title: Born in Ottawa, raised in the Quebec backwoods
    impact: low
    description: >
      Born in Ottawa, Ontario, the second of three children of forest
      entomologist Carl Edmund Atwood and Margaret Dorothy Killam Atwood.
      From infancy the family spent half of every year in the bush of
      northern Quebec and northern Ontario, where her father did forest-insect
      fieldwork, and half in Toronto, where he taught; she did not attend a
      full school year until she was twelve. Both landscapes stayed in the
      fiction: the wilderness return-and-reckoning of
      [[work:margaret-atwood/surfacing|Surfacing]] (1972) and the naturalist's
      eye that runs through her later speculative work both start here.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Margaret_Atwood
      - https://margaretatwood.ca/biography/
      - https://eeb.utoronto.ca/support-us/carl-atwood-graduate-award/

  - id: margaret-atwood-double-persephone-harvard-1961
    organisation: medallion
    illustration_type: book-object
    images_required: 1
    date: 1961
    title: Graduates, hand-prints her first book, and leaves for Harvard
    impact: low
    description: >
      Atwood graduated from Victoria College, University of Toronto, in
      1961, having studied under Northrop Frye and Jay Macpherson, and that
      same year hand-set and self-published her first book,
      [[work:margaret-atwood/double-persephone|Double Persephone]]: 220
      copies on a flatbed press, with a cover she designed herself from
      linoblocks. It won the E.J. Pratt Medal, her first literary prize,
      in the same year she left for Radcliffe College at Harvard on a
      Woodrow Wilson Fellowship, the graduate study that occupied the next
      several years without ever producing the dissertation she began, on
      the English metaphysical romance.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Margaret_Atwood
      - https://en.wikipedia.org/wiki/Double_Persephone
      - https://margaretatwood.ca/biography/

  - id: margaret-atwood-gibson-family-1973
    organisation: passage
    illustration_type: journey-transit
    images_required: 1
    date: 1976
    dateRange: "1973-1980"
    title: A farm near Alliston, a new partnership, a daughter
    impact: med
    description: >
      Atwood's five-year marriage to the American writer Jim Polk, whom she
      had met at Harvard, ended in divorce in 1973, the same year she began a
      relationship with the Canadian novelist Graeme Gibson. The couple moved
      to a farm near Alliston, Ontario; their daughter, Eleanor Jess Atwood
      Gibson, was born in 1976; and the family returned to Toronto in 1980.
      Atwood and Gibson never married, and stayed together until his death 46
      years later.
    note: >
      Some later summaries of the relationship's length imply a mid-1980s
      start; Wikipedia's entries for both Atwood and Gibson, and the CBC's
      2019 obituary coverage of Gibson, date its actual beginning to 1973,
      the year of the Polk divorce.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Margaret_Atwood
      - https://en.wikipedia.org/wiki/Graeme_Gibson
      - https://www.cbc.ca/news/entertainment/obit-graeme-gibson-1.5288049

  - id: margaret-atwood-writers-organizations-1981
    organisation: medallion
    illustration_type: emblem-seal
    images_required: 1
    date: 1981
    dateRange: "1981-1986"
    title: Chairs both of Canada's national writers' bodies
    impact: med
    description: >
      Elected President of the Writers' Union of Canada for a term running
      May 1981 to May 1982. When the country's PEN centre split into
      autonomous English- and French-speaking bodies in 1983, she co-founded
      the new English-speaking Canadian PEN centre the following year with
      fellow novelist Eugene Benson; the two were elected co-presidents at its
      founding meeting in November 1984, and she continued in the role
      through 1986. Both terms ran on into the same stretch of her career that
      produced [[work:margaret-atwood/the-handmaids-tale|The Handmaid's
      Tale]] (1985): PEN's founding mandate is defending persecuted and
      imprisoned writers, in a country she was, on the page, imagining as the
      one doing the silencing.
    note: >
      Her own published biography lists the PEN role simply as "President,
      1984-1986"; the PEN International archive project's history of the
      Canadian Centre records Atwood and Benson as co-founders elected
      co-presidents at the November 1984 founding meeting. Both are recorded
      here rather than resolved in favour of one.
    spoilerAfter: null
    sources:
      - https://www.pen100archive.org/pen_centre/canadian-centre/history-of-the-canadian-centre/
      - https://pencanada.ca/who-we-are/history/
      - https://orlando.cambridge.org/organizations/461063dc-7fa4-4be6-b48c-5844dadc4117
      - https://margaretatwood.ca/biography/

  - id: margaret-atwood-father-death-1993
    organisation: interlude
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1993-01-05
    title: Her father dies, and grief finds its way into verse
    impact: high
    description: >
      Carl Edmund Atwood, the forest entomologist whose fieldwork shaped her
      own childhood summers and, by her account, her sense of humans as one
      biological community among many, died in Toronto on 5 January 1993, at
      86. [[work:margaret-atwood/morning-in-the-burned-house|Morning in the
      Burned House]] (1995), her first new poetry collection in eleven years,
      carries elegies for him alongside its wider turn toward mortality and
      family memory.
    spoilerAfter: null
    sources:
      - https://www.theglobeandmail.com/culture/books/article-margaret-atwood-author-science/
      - https://eeb.utoronto.ca/support-us/carl-atwood-graduate-award/
      - https://www.wikitree.com/wiki/Atwood-935

  - id: margaret-atwood-twitter-2009
    organisation: floating-object
    illustration_type: isolated-object
    images_required: 1
    date: 2009-06
    title: Sets up a Twitter account to promote a book, and never really leaves
    impact: low
    description: >
      Building the promotional website for
      [[work:margaret-atwood/the-year-of-the-flood|The Year of the Flood]] in
      June 2009, Atwood was told by the site's designers that it needed a
      Twitter feed; by her own account she had barely heard of the service.
      Within weeks two impostor accounts using her name and photograph had to
      be chased off, and her following grew past 30,000 within months, an
      audience she used that winter to needle the Vancouver Olympics slogan
      "Own the Podium" into "A podium might be nice." She wrote up the
      disorienting arrival for The New York Review of Books the following
      spring, and stayed a notably active, closely watched voice on the
      platform for the next decade and more.
    spoilerAfter: null
    sources:
      - https://www.nybooks.com/online/2010/03/29/atwood-in-the-twittersphere/
      - https://www.theatlantic.com/entertainment/archive/2010/03/op-ed-spotlight-margaret-atwood-s-adventures-in-the-twitterverse/346158/
      - https://en.wikipedia.org/wiki/Margaret_Atwood

  - id: margaret-atwood-dan-david-prize-2010
    organisation: medallion
    illustration_type: emblem-seal
    images_required: 1
    date: 2010-05-09
    title: Accepts an Israeli prize over calls for a cultural boycott
    impact: med
    description: >
      Atwood travelled to Tel Aviv University to accept the Dan David Prize's
      Present-category award, "Literature: Rendition of the 20th Century,"
      shared with the Indian novelist Amitav Ghosh and worth $500,000 each.
      Palestinian student groups had publicly urged her to refuse it in
      protest of Israeli policy toward Gaza; she accepted anyway, telling
      Bloomberg News "we don't do cultural boycotts" and adding that artists
      "have names but no armies," and that declining would mean "throwing
      overboard the thousands of writers around the world who are in prison,
      censored, exiled and murdered for what they have published."
    spoilerAfter: null
    sources:
      - https://archive.nytimes.com/artsbeat.blogs.nytimes.com/2010/05/11/atwood-says-we-dont-do-cultural-boycotts-and-accepts-israeli-prize/
      - https://en.wikipedia.org/wiki/Dan_David_Prize
      - https://en.wikipedia.org/wiki/Margaret_Atwood

  - id: margaret-atwood-future-library-2015
    organisation: medallion
    illustration_type: book-object
    images_required: 1
    date: 2015-05-26
    title: Hands over a manuscript no one will read for a century
    impact: low
    description: >
      Named in 2014 as the inaugural contributor to the Future Library, a
      Norwegian project that will publish one sealed, unread manuscript a
      year for a hundred years, printed in 2114 on paper from a forest of a
      thousand trees planted outside Oslo for the purpose, Atwood handed over
      her own sealed manuscript, titled Scribbler Moon, at a ceremony in that
      forest on 26 May 2015, reading instead from
      [[work:margaret-atwood/maddaddam|MaddAddam]] for the assembled crowd.
      No one, including Atwood, has read it since.
    spoilerAfter: null
    sources:
      - https://www.theglobeandmail.com/arts/books-and-media/margaret-atwood-submits-manuscript-to-future-library-wont-be-read-for-100-years/article24624453/
      - https://www.futurelibrary.no/
      - https://en.wikipedia.org/wiki/Margaret_Atwood

  - id: margaret-atwood-gibson-death-2019
    organisation: immersion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 2019-09-18
    title: Graeme Gibson dies during the Testaments tour
    impact: high
    description: >
      Graeme Gibson's dementia, disclosed publicly in an April 2017 New
      Yorker profile of Atwood, ended in a stroke and death in a London
      hospital on 18 September 2019, five days after the stroke, while he was
      accompanying Atwood on the publicity tour for
      [[work:margaret-atwood/the-testaments|The Testaments]]; the two had
      been together 46 years. In a statement, Atwood and the family said they
      were "devastated by the loss of Graeme, our beloved father, grandfather,
      and spouse, but we are happy that he achieved the kind of swift exit he
      wanted and avoided the decline into further dementia that he feared."
      [[work:margaret-atwood/dearly|Dearly]] (2020), her first new poetry
      collection in over a decade, is dedicated "for Graeme in absentia" and
      gathers poems of aging, loss and grief written mostly after his death.
    spoilerAfter: null
    sources:
      - https://www.cbc.ca/news/entertainment/obit-graeme-gibson-1.5288049
      - https://time.com/5680297/author-graeme-gibson-dies-margaret-atwood/
      - https://www.scotsman.com/news/obituaries/obituary-graeme-gibson-canadian-author-and-conservationist-2469601
      - https://longreads.com/2017/04/10/margaret-atwood-the-prophet-of-dystopia/
