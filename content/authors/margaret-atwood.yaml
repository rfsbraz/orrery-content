bio: >
  Margaret Eleanor Atwood was born in Ottawa, Ontario, and raised partly in
  the backwoods of northern Quebec, where her father Carl Edmund Atwood
  conducted forest-entomology fieldwork half of every year, and partly in
  Toronto; she did not attend school full-time until the age of twelve. She
  published her first poetry pamphlet, Double Persephone, in 1961, and her
  first novel, [[work:margaret-atwood/the-edible-woman|The Edible Woman]],
  in 1969. Her fiction ranges from realist novels of contemporary Canadian
  life to the speculative dystopias
  [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] (1985) and
  its 2019 sequel [[work:margaret-atwood/the-testaments|The Testaments]],
  and the [[work:margaret-atwood/oryx-and-crake|MaddAddam]] trilogy, alongside
  a body of poetry, short fiction, essays and children's books that runs
  alongside the novels for her entire career rather than sitting outside it.
  She lives in Toronto.
