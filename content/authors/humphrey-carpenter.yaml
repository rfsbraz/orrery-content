# Minimal collaborator stub - co-editor, with Christopher Tolkien, of The
# Letters of J. R. R. Tolkien. Carpenter's OWN book, the 1977 authorised
# biography J. R. R. Tolkien: A Biography, is not itself a Tolkien work and
# is deliberately not catalogued here (see works.yaml's header, "NOT
# included" section) - his connection to this wing is the co-editing credit
# alone.
id: humphrey-carpenter
name: Humphrey Carpenter
born: 1946-04-29
died: 2005-01-04
bio: >
  English writer, biographer and broadcaster; wrote the authorised
  biography J. R. R. Tolkien: A Biography (1977) and The Inklings (1982),
  and co-edited (with [[author:christopher-tolkien|Christopher Tolkien]])
  [[work:jrr-tolkien/the-letters-of-jrr-tolkien|The Letters of J. R. R.
  Tolkien]] (1981).
sources:
  - https://en.wikipedia.org/wiki/Humphrey_Carpenter
