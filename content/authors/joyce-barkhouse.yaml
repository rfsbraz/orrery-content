id: joyce-barkhouse
name: Joyce Barkhouse
aka: ["Joyce Carman Barkhouse"]
born: 1913-05-03
died: 2012-02-02
bio: >
  Canadian children's author from Woodville, Nova Scotia, and Margaret
  Atwood's aunt; a former teacher best known for her own novel Pit Pony
  (1989). Co-wrote [[work:margaret-atwood/annas-pet|Anna's Pet]] (1980) with
  her niece. Made a Member of the Order of Canada in 2008 for her
  contribution to children's literature.
sources:
  - https://en.wikipedia.org/wiki/Joyce_Barkhouse
  - https://www.theglobeandmail.com/news/national/nova-scotia-teacher-turned-author-wrote-award-winning-pit-pony/article543630/
