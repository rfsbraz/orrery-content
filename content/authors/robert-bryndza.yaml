  - id: bryndza-slovakia-manuscript-deal-2012
    organisation: artifact-spread
    illustration_type: manuscript-proof
    images_required: 1
    date: 2012-01-17
    title: A cheese toasty, a phone call, and a book deal
    impact: high
    description: >
      Late in 2011, with a UK publishing deal for
      [[work:robert-bryndza/the-not-so-secret-emails-of-coco-pinchard|Coco
      Pinchard]] having collapsed and his agent's interest gone, Bryndza
      moves from Los Angeles to live with his husband Ján's mother in her
      small Slovak flat, at what he has called "a very low ebb" - about to
      give up writing and start looking for work as an English teacher. Ján
      talks him into writing down their year in Hollywood instead; Bryndza
      writes it in English through October to December 2011, working every
      day, while Ján translates it into Slovak in parallel, so that by
      Christmas the couple effectively have two manuscripts of the same
      book. On Tuesday 17 January 2012, making a cheese toasty and
      rehearsing for a Skype interview for a language-school job the next
      day, Bryndza is told a Slovak publisher wants the book: it becomes
      [[work:robert-bryndza/bitch-hollywood|Bitch Hollywood]], published in
      Slovak translation as Mrcha Hollywood that March, the small advance
      buying him the time to turn the teaching job down and self-publish his
      way into a career.
    spoilerAfter: null
    sources:
      - https://www.robertbryndza.com/blogs/blog/how-my-writing-career-began

  - id: bryndza-erika-foster-idea-2015
    organisation: beside
    illustration_type: symbolic-still-life
    images_required: 1
    date: 2015
    title: A Kate Bush album and a face under the ice
    impact: high
    description: >
      Bryndza has always wanted to write a crime novel and reads little
      else, but spends his self-published romantic-comedy years telling
      interviewers he will get to it eventually. He traces the actual image
      that becomes [[work:robert-bryndza/the-girl-in-the-ice|The Girl in the
      Ice]] to listening, some years earlier, to Kate Bush's album 50 Words
      for Snow: "an image came into my mind of standing on a frozen lake,
      scraping away the snow and seeing a girl's face staring back at me
      from underneath the ice." The character of Detective Erika Foster
      spends "the past few years" taking shape in notes he keeps scribbling
      down, and by 2015 he has decided to finally write the book: "I've
      always wanted to write a crime thriller, and I realised that if I
      didn't do it soon, I never would." It is his first attempt at the
      genre and his first book with a traditional publisher, Bookouture,
      after four self-published Coco Pinchard years.
    spoilerAfter: null
    sources:
