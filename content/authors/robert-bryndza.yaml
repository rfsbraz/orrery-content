# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
#
# ONE BYLINE, NOT A PEN NAME. The founding question for this wing was whether
# the early romantic comedy novels and the later crime novels are the same
# published identity or a pseudonym split the request had gotten wrong (a
# real failure mode elsewhere in this catalogue). They are the same identity:
# every self-published Coco Pinchard edition, every Erika Foster and Kate
# Marshall edition, and his own current imprint all carry the name "Robert
# Bryndza" with no variant. Raven Street Publishing - his own imprint,
# launched after two spells with traditional publishers - sells both the
# crime backlist and the Coco Pinchard romantic comedies side by side today,
# under one name; the site's own account of the imprint frames the return to
# self-publishing as coming "full circle" to where the Coco Pinchard series
# began. Nothing here is held back under a different name.
#
# The exact birth day is not corroborated by an independent primary source
# (only an unreliable aggregator gives one); the year is consistent across
# Wikidata and multiple bibliographic sources, so only the year is recorded.
id: robert-bryndza
name: Robert Bryndza
born: 1979
died: null
bio: >
  British-born novelist (Lowestoft, Suffolk), who studied at Aberystwyth
  University and trained at the Guildford School of Acting, working for
  several years as an actor before a self-written play at the Edinburgh
  Festival redirected him toward fiction. He wrote the first
  [[work:robert-bryndza/the-not-so-secret-emails-of-coco-pinchard|Coco
  Pinchard]] novel in 2010, and after a UK publishing deal for it fell
  through, self-published his way into a career: a comic novel written with
  his husband Ján about their year in Los Angeles was published in Slovak
  translation first (Mrcha Hollywood, March 2012, by which point the couple
  had left for Slovakia), followed the same year by English
  self-publication of both that
  book and Coco Pinchard, and four further Coco Pinchard novels through 2015.
  His crime debut, [[work:robert-bryndza/the-girl-in-the-ice|The Girl in the
  Ice]] (2016), introduced Detective Chief Inspector Erika Foster and sold
  over a million copies within a year; the Erika Foster series continues
  alongside a second series following P.I. Kate Marshall and, from 2026, a
  third following Detective Jamie Day. Lives in Slovakia with his husband
  Ján.
pseudonyms: []
