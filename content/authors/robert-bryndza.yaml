    title: Born in Lowestoft, Suffolk
    impact: low
    description: >
      Robert Bryndza is born in the East Anglian seaside town of Lowestoft,
      the day itself uncorroborated by any primary record, though every
      bibliographic source agrees on the year. He leaves for Aberystwyth
      University and the Guildford School of Acting, and does not write
      about Lowestoft again until decades later: Detective
      [[work:robert-bryndza/the-quiet-kill|Jamie Day]], the first male lead
      of his career, is given the same small coastal hometown and the same
      move to an overwhelming London at twenty-two that Bryndza made
      himself.
