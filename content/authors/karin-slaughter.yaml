# American crime writer, born Covington, Georgia, raised in Lake Spivey.
# Cross-checked against her publisher site (karinslaughter.com) and Wikipedia;
# the two agree on every fact below.
#
# Three lifeEvents, picked for what changes a reading rather than for a
# complete biography. Book-specific origin stories (why Will Trent is
# dyslexic, why Criminal has the shape it has, the debut's post-9/11 tour,
# Cop Town's Steel Dagger, the two screen adaptations) are franchise events
# instead (content/franchises/karin-slaughter/events.yaml), since each is tied
# to a specific work rather than to her life as a whole.
#
# Candidates tested and left out on this press pass:
#   - a 2012 Atlanta Magazine profile has Slaughter's sister described as
#     dyslexic and credited as part of the inspiration for Will Trent's own
#     dyslexia; no second independent source corroborates it, and it is a
#     health/family fact about a private third party, so it does not ship.
#     The safe half of that origin story - Slaughter's own account of why she
#     gave Will Trent the trait - survives on a different, single-author-
#     interview source and is carried as a franchise event instead.
#   - the "significant other" Slaughter alludes to in the same 2012 profile,
#     without naming or describing them further: she says explicitly she
#     protects the privacy of her home life, which settles the question the
#     skill asks about living people - she has not put this in public herself.
#   - the entrepreneurial detour running a sign-making business (Snappy
#     Signs) before she sold Blindsighted: true and sourced, but it does not
#     change how any book reads once the three-month first draft and the
#     agent/deal story are already carried below; would have padded, not added.
id: karin-slaughter
name: Karin Slaughter
born: 1971-01-06
died: null
bio: >
  An American crime writer, born in Covington, Georgia and raised in Lake
  Spivey. She attended Morrow High School, studied literature at Georgia State
  University without finishing the degree, and wrote her debut,
  [[work:karin-slaughter/blindsighted|Blindsighted]], in three months. Published
  in some 120 countries with more than 40 million copies sold, she writes three
  ongoing series - Grant County, [[character:karin-slaughter/will-trent|Will
  Trent]] and North Falls - alongside half a dozen standalone thrillers, and
  lives in Atlanta. She founded Save the Libraries, a nonprofit supporting
  American public libraries.
lifeEvents:
  - id: karin-slaughter-childhood-macabre
    date: 1971-01-06
    title: A childhood spent reading in a Georgia library
    impact: low
    description: >
      Born in Covington, Georgia, and raised in the Lake Spivey area south of
      Atlanta, the daughter of a used-car salesman and (by her stepmother) a
      bank manager, with a stepaunt who served as chief of detectives for
      Forest Park. She has described taping the autopsy photos from Marilyn
      Monroe's death inside her fifth-grade lunchbox and writing stories in
      which someone always died, prompting a ninth-grade English teacher to
      suggest she not kill off every character; she has credited her father's
      love of horror films with cultivating that interest, and the Jonesboro
      public library, where her mother dropped the children off most
      Saturdays, with feeding it.
    spoilerAfter: null
    sources:
      - https://www.atlantamagazine.com/great-reads/karin-slaughter/
      - https://en.wikipedia.org/wiki/Karin_Slaughter

  - id: karin-slaughter-agent-and-first-deal-2000
    date: 2000
    title: An unpublished novel becomes a career, on someone else's advice
    impact: high
    description: >
      Slaughter set herself the goal of a book contract by thirty and spent
      years writing a historical novel, "Spit in One Hand," set in the
      antebellum South. It was never published, but it reached the desk of
      Manhattan literary agent Victoria Sanders (who also represents the
      estate of Zora Neale Hurston), who found real talent in it but couldn't
      sell historical fiction in that market, and suggested she try a
      thriller instead. Slaughter wrote the first draft of
      [[work:karin-slaughter/blindsighted|Blindsighted]] in three months; the
      manuscript, pitched as "a cross between Thomas Harris's Hannibal
      Lecter series and Patricia Cornwell's Kay Scarpetta mysteries," sold as
      a three-book deal to William Morrow for a sum in the high six figures,
      reported by Variety under the headline "Morrow, Slaughter Ink Killer
      Book Deal." She was twenty-nine. Everything published under her name
      since - three series and counting - follows from that redirection.
    spoilerAfter: null
    sources:
      - https://www.atlantamagazine.com/great-reads/karin-slaughter/
      - https://en.wikipedia.org/wiki/Karin_Slaughter

  - id: karin-slaughter-save-the-libraries-2010
    date: 2010-09-10
    title: Founds Save the Libraries
    impact: med
    description: >
      At a meeting of the American Library Association, Slaughter, already a
      library advocate, heard from librarians around the country how badly
      public libraries were struggling and was struck by the statistic that
      80 percent of children in rural areas relied on their local library for
      their only access to books and the internet. On September 10, 2010 the
      Atlanta Journal-Constitution ran her op-ed "Fight for Libraries as You
      Do Freedom," recalling how her own father, not a reader himself, took
      her to the Jonesboro library as a child and let her read anything in
      the building so long as she talked to him about it. She founded Save
      the Libraries the same year, piloted with the DeKalb County (Georgia)
      Public Library system; the fund has since raised more than $300,000 for
      it.
    spoilerAfter: null
    sources:
      - http://www.savethelibraries.com/save_the_libraries_about_us.html
      - https://www.karinslaughter.com/save-the-libraries
      - https://en.wikipedia.org/wiki/Karin_Slaughter
sources:
  - https://en.wikipedia.org/wiki/Karin_Slaughter
  - https://www.karinslaughter.com/bio-1
