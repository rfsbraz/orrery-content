    illustration_type: book-object
    images_required: 1
    date: 2016-10-21
    title: His papers become a public archive in Texas
    impact: low
    description: >
      Following his death, his family placed his personal papers, manuscript
      drafts, correspondence and photographs at the University of Texas at
      Austin's Harry Ransom Center, which opened the Gabriel García Márquez
      Papers to researchers on 21 October 2016; a digitized selection went
      fully online and freely available in 2018. The five drafts of
      [[work:gabriel-garcia-marquez/en-agosto-nos-vemos|En agosto nos vemos]]
      later published against his wishes came from this same collection.
    spoilerAfter: null
