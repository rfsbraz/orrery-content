    description: >
      Born into a Quaker family in Great Yarmouth, Norfolk. Her father's
      failed businesses moved the family repeatedly through London, Sussex
      and Gloucestershire over the next four decades before they settled
      back in Norfolk for good, at Old Catton, in 1867.
