# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds). Author-LIFE events live here (they follow the
# person); franchise-specific events stay in the franchise.
#
# Her mother, Mary Wright Sewell (1797-1884), was herself a popular author of
# religious verse and children's ballads (Homely Ballads for the Working Man's
# Fireside, Mother's Last Words) and transcribed Black Beauty from dictation in
# her daughter's last illness. She is named here in prose only: nothing in this
# wing is published under her name or credits her as author/co-author/editor of
# a work, so she gets no global author entity of her own.
id: anna-sewell
name: Anna Sewell
born: 1820-03-30
died: 1878-04-25
bio: >
  Born in Great Yarmouth, Norfolk, to Quaker parents Isaac and Mary Wright
  Sewell. The family's frequent moves for her father's work took them through
  London, Sussex and Gloucestershire before they settled back in Norfolk. At
  fourteen a fall running home from school in the rain injured her ankle badly
  enough that she had difficulty walking for the rest of her life, and from
  1839 a further chronic illness left her a permanent invalid. She never
  married, lived with her parents throughout, and helped her mother - herself
  a popular author of children's books - with charitable work and with editing
  her mother's writing. Seriously ill and largely confined to a sofa from
  1871, she spent her last years writing [[work:anna-sewell/black-beauty|Black
  Beauty]], first dictating it to her mother and later, in a period of
  slightly improved health, writing it out in pencil for her mother to
  transcribe. Published in November 1877, it was her only book. She died five
  months later, having lived to see it succeed.
lifeEvents: [] # none sourced and dated to the standard this needs yet; left empty rather than guessed
