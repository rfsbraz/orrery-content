id: mike-lupica
name: "Mike Lupica"
aka: []
born: 1952-05-11
died: null
bio: >
  Mike Lupica is an American sportswriter and novelist, long a columnist at
  the New York Daily News and a regular panelist on ESPN's The Sports
  Reporters since 1988. Beyond his journalism he has written sports novels
  for adults and young readers, including Travel Team and Heat, and
  co-authored autobiographies with figures such as Reggie Jackson and Bill
  Parcells. He has co-written six books with James Patterson, from
  [[work:james-patterson/the-horsewoman|The Horsewoman]] (2022) to
  [[work:james-patterson/the-country-road-murders|The Country Road
  Murders]] (2026).
