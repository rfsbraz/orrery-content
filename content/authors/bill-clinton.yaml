name: "Bill Clinton"
aka: []
born: 1946-08-19
died: null
bio: >
  Bill Clinton served two terms as the 42nd President of the United States
  (1993-2001), after two terms as Governor of Arkansas. His presidency
  spanned a long economic expansion and the passage of NAFTA and welfare
  reform, and included his impeachment by the House of Representatives in
  1998 and acquittal by the Senate in 1999. Since leaving office he has run
  the Clinton Foundation's public health and development programmes. He
  turned to fiction in his seventies, co-writing three political thrillers
  with James Patterson:
  [[work:james-patterson/the-president-is-missing|The President Is Missing]]
  (2018), [[work:james-patterson/the-presidents-daughter|The President’s
  Daughter]] (2021) and
  [[work:james-patterson/the-first-gentleman|The First Gentleman]] (2025).
sources:
