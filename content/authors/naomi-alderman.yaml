name: Naomi Alderman
aka: []
born: 1974-10-23
died: null
bio: >
  English novelist, born in London, best known for
  [[work:margaret-atwood/the-happy-zombie-sunrise-home|The Happy Zombie
  Sunrise Home]]'s co-author role and, on her own, the 2017 Women's Prize
  winner The Power. Selected by Atwood in 2012 as a protegee under the Rolex
  Mentor and Protege Arts Initiative, which led to their 2013 co-written
  Wattpad serial.
sources:
