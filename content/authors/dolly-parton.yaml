id: dolly-parton
name: "Dolly Parton"
aka: []
born: 1946-01-19
died: null
bio: >
  Dolly Parton is an American singer-songwriter and one of the most
  successful recording artists in country music history, with hits including
  "Jolene," "9 to 5" and "I Will Always Love You" (later a chart-topping
  cover by Whitney Houston). She has won eleven Grammy Awards and owns the
  Dollywood theme park and resort in Tennessee, alongside a long-running
  charitable foundation supporting literacy. In 2022 she co-wrote the
  thriller [[work:james-patterson/run-rose-run|Run, Rose, Run]] with James
  Patterson and released a companion studio album of the same name.
