id: ken-steacy
name: Ken Steacy
aka: []
born: 1955-01-08
died: null
bio: >
  Canadian comics artist and writer, born on the Zweibrücken Air Base,
  Germany, and based in Victoria, British Columbia since 1987; a graduate of
  the Ontario College of Art. Illustrated
  [[work:margaret-atwood/war-bears|War Bears]] (2018) with Atwood, drawing on
  his own decades of work in Canadian comics.
sources:
