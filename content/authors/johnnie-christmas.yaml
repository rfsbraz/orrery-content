name: Johnnie Christmas
aka: []
born: null
died: null
bio: >
  Comics writer and artist born in Puerto Rico, raised in Miami, based in
  Vancouver since 2009; a Pratt Institute graduate. Illustrated all three
  volumes of [[work:margaret-atwood/angel-catbird-vol-1|Angel Catbird]]
  (2016-2017) with Atwood, and later wrote and drew his own graphic novels
  (Firebug, Swim Team).
