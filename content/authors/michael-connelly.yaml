# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# Author-LIFE events live here (they follow the person); franchise-specific
# events stay in content/franchises/michael-connelly/events.yaml.
#
# Living author (born 1956): the nine anchors below rest on Wikipedia's cited
# biography, the official Mystery Writers of America presidents list, a Gale
# Newsmakers reference biography and contemporary trade press, which draw on
# interviews Connelly has given repeatedly over three decades (the
# gun-in-the-hedge story and the Altman-film conversion are both told in his
# own words in multiple places). His health and finances are not recorded
# here: a search of his own interviews, reference biographies and the trade
# press turned up no on-the-record account of illness or financial
# difficulty to weigh against the two-source bar for a living person. The
# marriage itself (Linda McCaleb, met in college, married April 1984, one
# daughter) is corroborated by two independent reference biographies but
# stops there; neither carries anything beyond the fact of it, and no
# divorce or separation is recorded anywhere. That is read here as a quiet
# record, not an unresearched one.
id: michael-connelly
name: Michael Connelly
aka: []
born: 1956-07-21
died: null
bio: >
  American novelist, born in Philadelphia, the second of five children of a
  property developer and a homemaker who introduced him to crime fiction.
  Moved to Fort Lauderdale, Florida at 12; a teenage encounter with a
  discarded gun and, later, Robert Altman's film of Raymond Chandler's
  The Long Goodbye turned him from a construction-management student into a
  journalism major who wanted to write mysteries. Worked the crime beat at
  three newspapers (Daytona Beach, Fort Lauderdale, then the Los Angeles
  Times, which he joined after his Delta Flight 191 reporting made him a
  Pulitzer finalist), and set his fiction in the city that job moved him to.
  His debut, [[work:michael-connelly/the-black-echo|The Black Echo]] (1992),
  introduced LAPD Detective Hieronymus "Harry" Bosch and won the Edgar Award
  for Best First Novel. Connelly has described his body of work as one big
  canvas that his characters cross and recross - Bosch's own investigations
  now run alongside defense attorney Mickey Haller,
  Detective Renée Ballard, crime reporter Jack McEvoy, FBI profiler Terry
  McCaleb, and, from 2025, Catalina Island's Detective Sergeant Stilwell.
  President of the Mystery Writers of America, 2003-2004.
pseudonyms: []
images:
