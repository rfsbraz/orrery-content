  # other independently-credited Commons photos of Connelly (2009 Anthony
  # Award and a 2014 London signing) - the same round glasses and grey-white
  # goatee in all three. A fourth candidate surfaced by a Commons author
  # search ("Michael Connelly at College of DuPage 2014.jpg") does not match
  # any of them and is not used.
lifeEvents:
  - id: connelly-born-1956
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1956-07-21
    title: Born in Philadelphia
    impact: low
    description: >
      Second-eldest of five children of a property developer and a
      homemaker; his mother's own fondness for crime fiction introduces him
      to the genre. The family relocates to Fort Lauderdale, Florida when he
      is 12.
    spoilerAfter: null
