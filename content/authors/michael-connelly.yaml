  - id: connelly-gun-in-the-hedge-1972
    organisation: beside
    illustration_type: aftermath-scene
    images_required: 1
    date: 1972
    title: A dishwasher finds a gun in a hedge
    impact: high
    description: >
      Walking home from his job washing dishes at a hotel, 16-year-old
      Connelly sees a man toss something into a hedge, investigates, and
      finds a handgun wrapped in a shirt. He follows the man to a bar, then
      fetches his father and the police, who arrive too late. The night is
      his first real brush with the world of cops and crime he would spend
      the rest of his life writing about.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Michael_Connelly

  - id: connelly-the-long-goodbye-1973
    organisation: floating-object
    illustration_type: book-object
    images_required: 1
    date: 1973
    title: A Chandler adaptation redirects a construction-management student
    impact: high
    description: >
      Enrolled at the University of Florida studying construction
      management (his father's own trade) and earning worse grades than
      expected, Connelly sees Robert Altman's The Long Goodbye, adapted from
      Raymond Chandler's Philip Marlowe novel. He goes home, reads
      everything Chandler wrote, and transfers to journalism with a minor in
      creative writing, deciding he wants to become a mystery novelist.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Michael_Connelly

  - id: connelly-crime-beat-reporter-1980
    organisation: passage
    illustration_type: serial-contact-sheet
    images_required: 1
    date: 1980
    title: Onto the crime beat, first in Florida
    impact: med
    description: >
      Graduates from the University of Florida and takes a crime-reporting
      job at the Daytona Beach News-Journal, moving the following year to
      the Fort Lauderdale News and Sun-Sentinel, where he covers the South
      Florida cocaine wars. The years of real police-beat reporting become
      the procedural bedrock under every novel that follows.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Michael_Connelly

  - id: connelly-delta-191-los-angeles-times-1987
    organisation: beside
    illustration_type: workplace-workshop
    images_required: 1
    date: 1987
    title: A plane-crash story earns a ticket to the LA Times, and to LA
    impact: med
    description: >
      Connelly and two colleagues spend months interviewing survivors of the
      1985 Delta Flight 191 crash, a story that makes him a Pulitzer Prize
      finalist and lands him a crime-reporting job at the Los Angeles Times.
      He and his wife relocate to Los Angeles in 1987 - the city that
      becomes the fixed setting of nearly everything he goes on to write.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Michael_Connelly

  - id: connelly-black-echo-edgar-1992
    organisation: immersion
    illustration_type: symbolic-still-life
    images_required: 1
    date: 1992
    title: The Black Echo introduces Harry Bosch, and wins the Edgar
    impact: high
    description: >
      After three years at the LA Times and two unpublished practice novels,
      Connelly sells [[work:michael-connelly/the-black-echo|The Black Echo]]
      to Little, Brown. It introduces LAPD homicide detective Hieronymus
      "Harry" Bosch - named after the 15th-century Dutch painter, whose print
      of Hell still hangs behind Connelly's writing desk - and wins the
      Mystery Writers of America's Edgar Award for Best First Novel, the
      start of a still-running, 26-novel-and-counting series.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Michael_Connelly
      - https://en.wikipedia.org/wiki/Harry_Bosch

  - id: connelly-clinton-concrete-blonde-1994
    organisation: beside
    illustration_type: press-media-collage
    images_required: 1
    date: 1994
    title: A president is photographed carrying his third novel
    impact: high
    description: >
      In early 1994, cameras trailing President Bill Clinton catch him
      leaving a Washington, D.C. bookstore carrying a copy of
      [[work:michael-connelly/the-concrete-blonde|The Concrete Blonde]].
      Clinton turns out to be a genuine fan of the first two Bosch novels,
      and White House staff arrange a brief, late-night meeting between the
      two men at Los Angeles International Airport. It is the moment
      Connelly's LAPD procedurals cross from a well-reviewed midlist series
      into a much larger public visibility, three books and two years before
      he risks the brand on a Bosch-free novel.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Michael_Connelly
      - https://www.notablebiographies.com/newsmakers2/2007-A-Co/Connelly-Michael.html

  - id: connelly-mwa-president-2003
    organisation: medallion
    illustration_type: emblem-seal
    images_required: 1
    date: 2003
    title: Elected to lead his own profession, twice running
    impact: med
    description: >
      Connelly serves as President of the Mystery Writers of America for two
      consecutive one-year terms, 2003 and 2004, the professional
      organization behind the Edgar Award that had launched him in 1992.
      Peer leadership of the guild rather than a sales or reception
      milestone, it marks the point his colleagues, not just his readers,
      recognized him as a senior figure in the genre.
    spoilerAfter: null
    sources:
      - https://mysterywriters.org/about-mwa/mwa-presidents/
      - https://en.wikipedia.org/wiki/Michael_Connelly

  - id: connelly-diamond-dagger-2018
    organisation: marginalia
    illustration_type: isolated-object
    images_required: 1
    date: 2018-03
    title: The Diamond Dagger, for sustained excellence
    impact: med
    description: >
      The UK Crime Writers' Association awards Connelly its Cartier Diamond
      Dagger, given annually for a career of "sustained excellence" in crime
      writing rather than for any single book. Coming a quarter-century into
      the Bosch series and a British honor for an American author, it marks
      the same run of unbroken, prize-recognized output on the other side of
      the Atlantic that the RBA and Harper Lee prizes mark at home in 2012.
    spoilerAfter: null
    sources:
      - https://www.thebookseller.com/news/connelly-honoured-cwa-diamond-dagger-743301
      - https://en.wikipedia.org/wiki/Michael_Connelly
