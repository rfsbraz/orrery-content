# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# Author-LIFE events live here (they follow the person); franchise-specific
# events stay in content/franchises/jk-rowling/events.yaml.
#
# Living author (born 1965): every lifeEvent below is already fully public -
# self-disclosed, court-documented, or covered contemporaneously by at least
# two independent outlets. Two entries carry a higher bar because they touch
# a living person's history and current public life. rowling-flees-marriage-
# 1993 (the abuse she has described from her first marriage) rests on her own
# June 2020 essay and February 2023 podcast account, corroborated by
# contemporary press coverage and, on the fact of the slapping itself, her
# ex-husband's own on-record admission; it earns its place because it
# explains the physical survival of the Philosopher's Stone manuscript
# already central to the entries around it, not as biography for its own
# sake. rowling-gender-advocacy-2025 (her public advocacy on sex and gender
# since 2019) is written from her own dated public statements and actions,
# with every reaction attributed to the specific person or organisation who
# made it, and takes no position on the underlying dispute; it earns its
# place because it is, on the record, the single fact most consequential to
# how some readers and collaborators now approach her earlier books.
id: jk-rowling
name: J. K. Rowling
aka: ["Joanne Rowling", "Jo Rowling"]
born: 1965-07-31
died: null
bio: >
  Born Joanne Rowling, with no middle name; the "K" (for her paternal
  grandmother Kathleen) was added at her publisher's suggestion, who believed
  young boys, the target readership for
  [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter]],
  would be reluctant to read a book by a woman. Born in Yate, Gloucestershire,
  and raised mainly in Winterbourne and then Tutshill, on the Welsh border
  near Chepstow, from age nine. Read French and Classics at the University of
  Exeter, graduating in 1987. Worked temp jobs in London and Manchester and,
  from November 1991, taught English as a foreign language in Porto, Portugal,
  writing during the day. Conceived the Harry Potter series on a delayed train
  in mid-1990 and continued writing it through her mother's death later that
  year, a divorce, and a period as a single parent surviving on state benefits
  in Edinburgh, where she completed
  [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter and
  the Philosopher's Stone]] in 1995. The seven-book series that followed
  became the best-selling book series in history. Since 2012 has also
  published adult fiction under her own name and, as the revealed pseudonym
  Robert Galbraith, the [[work:jk-rowling/the-cuckoos-calling|Cormoran
  Strike]] crime series. Lives in Edinburgh, Scotland.
pseudonyms:
  - name: Robert Galbraith
    note: >
      Adopted in 2013 for the [[work:jk-rowling/the-cuckoos-calling|Cormoran
      Strike]] crime novels, so the books "could be judged on [their] own
      merits" without her name attached. Unmasked after four months, on 14
      July 2013, when the Sunday Times traced the authorship to a leak from
      her own law firm; the firm later made a substantial charitable donation
      after Rowling pursued the breach of confidence. She has continued
      publishing the series under the pseudonym since.
  - name: Newt Scamander
    note: >
      The in-universe fictional "author" credited on the cover of
      [[work:jk-rowling/fantastic-beasts-and-where-to-find-them|Fantastic
      Beasts and Where to Find Them]] (2001); Rowling's own name did not
      appear on the first edition. A charity-book device rather than a
      concealed identity, distinct from the Galbraith pseudonym.
  - name: Kennilworthy Whisp
    note: >
      The in-universe fictional "author" credited on the cover of
      [[work:jk-rowling/quidditch-through-the-ages|Quidditch Through the
      Ages]] (2001), the companion volume to Fantastic Beasts and Where to
      Find Them and published for the same charity, Comic Relief.
lifeEvents:
  - id: rowling-born-1965
    date: 1965-07-31
    title: Born in Yate, Gloucestershire
    impact: low
    description: >
      Born to Peter Rowling, an assembly-line worker who later became a
      chartered engineer, and Anne Rowling (née Volant), later a science
      technician; the couple met on a train the year before. Raised in
      Winterbourne and, from around age nine, in Tutshill on the Welsh
      border, in a house near a family named Potter, a surname she always
      liked.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-conceives-harry-potter-1990
    date: 1990-06
    title: Harry Potter arrives on a delayed train
    impact: high
    description: >
      On a train delayed four hours between Manchester and London, Harry,
      Ron and Hermione "came plainly into her mind" fully formed. With no pen
      or paper to hand, she spent the journey working out the characters and
      story in her head before writing anything down.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-mother-dies-1990
    date: 1990-12-30
    title: Her mother dies while she is writing the first book
    impact: high
    description: >
      Anne Rowling dies of multiple sclerosis, aged 45, soon after her
      daughter began writing what became
      [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter
      and the Philosopher's Stone]]. Rowling has said, "I really think from
      that moment on, death became a central, if not the central, theme of
      the seven books" - the loss she later located in the Mirror of Erised,
      and in the losses that run through the whole series.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-flees-marriage-1993
    date: 1993-11-17
    title: Flees a violent marriage with the manuscript smuggled out in pieces
    impact: high
    description: >
      Rowling has described her marriage to Jorge Arantes, whom she married
      in Porto in October 1992, as violent and controlling. She has said he
      searched her bag when she came home and would not let her have a key
      to their own front door, and that he once took the growing manuscript
      of what became
      [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter
      and the Philosopher's Stone]] and hid it, holding it hostage against
      her leaving. Fearing he would destroy it, she began smuggling the
      manuscript out in small batches to photocopy at work, building a
      hidden second copy page by page while pregnant with their daughter
      Jessica. Arantes threw her out of the house on 17 November 1993; she
      returned with the police to collect Jessica and her belongings, then
      left for Edinburgh, where she finished the novel in June 1995, writing
      much of it in cafés - Nicolson's, then part-owned by her
      brother-in-law, with Jessica asleep beside her. The Elephant House,
      the Edinburgh cafe that later marketed itself as the "birthplace of
      Harry Potter,"
      came afterward: Rowling has said she had already been writing the book
      for several years before she first set foot in it. She disclosed the
      abuse publicly for the first time in June 2020 and gave the manuscript
      account in a February 2023 podcast interview; Arantes has confirmed
      slapping her while disputing that the abuse was sustained.
    spoilerAfter: null
    sources:
      - https://www.theguardian.com/books/2023/feb/22/jk-rowling-reveals-abuse-in-past-relationship
      - https://www.bbc.com/news/uk-53023543
      - https://www.cnn.com/2020/05/21/us/jk-rowling-reveals-truth-about-harry-potter-trnd-wellness/index.html
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-bloomsbury-accepts-1996
    date: 1996-08
    title: Twelve rejections, then an eight-year-old's verdict
    impact: high
    description: >
      Twelve publishers turn the manuscript down before Bloomsbury's Barry
      Cunningham buys it, reportedly telling her "you'll never make any
      money out of children's books, Jo." Bloomsbury's chairman Nigel Newton
      is said to have been swayed after his eight-year-old daughter Alice
      read the first chapter and immediately demanded the rest. A Scottish
      Arts Council grant helps support Rowling, then a single parent, while
      she finishes the sequel.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-name-change-1996
    date: 1996
    title: Becomes "J. K. Rowling" at her publisher's suggestion
    impact: low
    description: >
      Bloomsbury staff suggest she publish under two initials rather than
      "Joanne," believing boy readers would be reluctant to pick up a book
      by a woman. She has no middle name, so she takes "K" from her paternal
      grandmother, Kathleen.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-remarries-2001
    date: 2001-12-26
    title: Remarries, and buys some distance from the press along with it
    impact: low
    description: >
      Marries Neil Murray, an anaesthetist, in a small, secret ceremony at
      Killiechassie House, the Perthshire estate she had just bought; the
      couple had planned a Galapagos wedding that July but moved it after
      details leaked to the press. Months earlier the UK Press Complaints
      Commission had ruled that a magazine breached the privacy of her
      daughter Jessica, then eight, by publishing a paparazzi photograph
      taken on a family holiday. The remarriage closes the arc that opens
      with her 1993 flight from Arantes: from a single mother on state
      benefits to a publicly wealthy author now actively buying privacy from
      the press that had covered her rise.
    spoilerAfter: null
    sources:
      - https://www.hellomagazine.com/celebrities/20011231881408/jkrowling/
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-harvard-speech-2008
    date: 2008-06-05
    title: Tells Harvard about the fringe benefits of failure
    impact: med
    description: >
      Delivers the Harvard University commencement address, "The Fringe
      Benefits of Failure and the Importance of Imagination," describing the
      "period of failure" that preceded
      [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry
      Potter]]'s success - "an exceptionally short-lived marriage had
      imploded, and I was jobless, a lone parent, and as poor as it is
      possible to be in modern Britain, without being homeless" - and
      arguing that "rock bottom became the solid foundation on which I
      rebuilt my life." The speech is the direct source of
      [[work:jk-rowling/very-good-lives|Very Good Lives]], published as a
      short book seven years later.
    spoilerAfter: null
    sources:
      - https://news.harvard.edu/gazette/story/2008/06/text-of-j-k-rowling-speech/
      - https://www.harvard.edu/president/speeches-faust/2008/2008-commencement-speech/
  - id: rowling-mother-ms-clinic-2010
    date: 2010
    title: Turns forty-five and founds a clinic in her mother's name
    impact: high
    description: >
      The year she reaches the age at which her mother, Anne, died of
      multiple sclerosis, Rowling donates £10 million to the University of
      Edinburgh to found the Anne Rowling Regenerative Neurology Clinic, a
      research and treatment centre for MS and other neurodegenerative
      conditions; she adds a further £15.3 million in 2019. The clinic opens
      in October 2013. "I cannot think of anything more important," she has
      said of the gift, "than to help Edinburgh University attract
      world-class minds in the field of neuroregeneration ... and,
      ultimately, to seek a cure for a very Scottish disease."
    spoilerAfter: null
    sources:
      - https://www.annerowlingclinic.org/about/our-history
      - https://www.nbcnews.com/id/wbna38930972
      - https://en.wikipedia.org/wiki/J._K._Rowling
  - id: rowling-galbraith-unmasked-2013
    date: 2013-07-14
    title: Unmasked as Robert Galbraith
    impact: med
    description: >
      Four months after
      [[work:jk-rowling/the-cuckoos-calling|The Cuckoo's Calling]]'s quiet
      publication as a debut crime novel, the Sunday Times reveals Rowling as
      its author, tracing the leak to her own law firm. Sales of the novel,
      until then a modest seller, jump immediately; Rowling pursues the firm
      for the breach and directs its resulting settlement to charity.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/J._K._Rowling
      - https://en.wikipedia.org/wiki/Robert_Galbraith
  - id: rowling-daily-mail-vindicated-2015
    date: 2015-05-21
    title: Forces the tabloid press to retract a "sob story" claim
    impact: high
    description: >
      In September 2013, Rowling wrote an article for the single-parent
      charity Gingerbread about her years as a single mother in Edinburgh
      while writing
      [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry
      Potter and the Philosopher's Stone]], recalling one occasion when a
      fellow churchgoer stigmatised her for it. Ten days later the Daily
      Mail ran a two-page story alleging her account was a "sob story" that
      had left the church members who knew her "upset and bewildered."
      Rowling sued for libel; at a High Court hearing on 21 May 2015 the
      paper's publisher accepted the allegations were "completely false and
      indefensible," apologised, and paid substantial damages, which Rowling
      donated to charity. The ruling settles, on the public record, that the
      poverty-and-single-motherhood account she has told about writing the
      first book was true as told.
    spoilerAfter: null
    sources:
      - https://www.huffingtonpost.co.uk/2015/05/21/harry-potter-author-jk-rowling-wins-apology-damages-daily-mail_n_7350782.html
      - https://time.com/3893777/jk-rowling-dail-mail-court/
  - id: rowling-gender-advocacy-2025
    date: 2025-04-16
    title: A Supreme Court ruling caps six years of public advocacy on sex and gender
    impact: high
    description: >
      On 19 December 2019, Rowling tweeted support for Maya Forstater, a
      researcher who had lost her job after tweeting that biological sex is
      immutable: "Dress however you please ... But force women out of their
      jobs for stating that sex is real?" It was the first widely-cited
      public marker of a position on gender self-identification she went on
      to argue at length in a June 2020 essay on her own website - the same
      essay in which she first disclosed the abuse described above. Daniel
      Radcliffe, Emma Watson and Rupert Grint, who played Harry, Hermione
      and Ron in the films, each publicly distanced themselves from her
      position within days; Radcliffe, writing that "transgender women are
      women," added: "To all the people who now feel that their experience
      of the books has been tarnished or diminished, I am deeply sorry for
      the pain these comments have caused you. I really hope that you don't
      entirely lose what was valuable in these stories to you." Rowling has
      continued to fund gender-critical campaigning since, including the
      group For Women Scotland, whose case reached the UK Supreme Court; on
      16 April 2025 the court ruled unanimously that "sex" under the
      Equality Act 2010 means biological sex, a ruling Rowling welcomed
      publicly as having "protected the rights of women and girls." She
      denies that her position is transphobic; it has drawn sustained public
      criticism, including from LGBT organisations, and, she said in 2023,
      "so many death threats I could paper the house with them."
    spoilerAfter: null
    sources:
      - https://www.cnn.com/2019/12/20/uk/jk-rowling-transgender-tweets-scli-intl-gbr
      - https://www.bbc.com/news/uk-53023543
      - https://www.bbc.com/news/entertainment-arts-53023580
      - https://www.thetrevorproject.org/blog/daniel-radcliffe-responds-to-j-k-rowlings-tweets-on-gender-identity/
      - https://www.lbc.co.uk/article/jk-rowling-supreme-court-ruling-gender-5Hjd5TC_2/
      - https://www.theguardian.com/books/2023/feb/22/jk-rowling-reveals-abuse-in-past-relationship
      - https://en.wikipedia.org/wiki/J._K._Rowling
