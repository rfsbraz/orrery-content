id: kwame-alexander
name: "Kwame Alexander"
aka: []
born: 1968-08-21
died: null
bio: >
  Kwame Alexander is an American author and poet whose verse novel The
  Crossover (2014) won the Newbery Medal and a Coretta Scott King Honor; his
  illustrated poem The Undefeated later won a Newbery Honor and the Coretta
  Scott King Award for Illustrator. He has built a wide body of bestselling
  work for young readers, including Booked, Solo and Rebound. He co-wrote
  [[work:james-patterson/becoming-muhammad-ali|Becoming Muhammad Ali]] (2020)
  with James Patterson.
