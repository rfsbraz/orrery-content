id: michael-crichton
name: "Michael Crichton"
aka: []
born: 1942-10-23
died: 2008-11-04
bio: >
  Michael Crichton was an American author and filmmaker known for
  research-heavy science thrillers, many of which he adapted for the screen.
  He earned an MD from Harvard Medical School in 1969 before turning to
  writing full time. His novels include The Andromeda Strain (1969) and
  Jurassic Park (1990), and he created the television series ER; several of
  his books became major films that he also wrote or directed. He died in
  Los Angeles in 2008. James Patterson completed
  [[work:james-patterson/eruption|Eruption]] (2024) from a partial manuscript
  found in Crichton's archives after his death, publishing it as a posthumous
  collaboration.
