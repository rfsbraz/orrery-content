id: jean-claude-carriere
name: Jean-Claude Carrière
aka: []
born: 1931-09-17
died: 2021-02-08
bio: >
  French screenwriter, novelist and playwright, best known for his long
  screenwriting collaborations with Luis Buñuel (Belle de Jour, The
  Discreet Charm of the Bourgeoisie) and for adapting the Mahabharata for
  Peter Brook's stage and screen productions. Conducted a book-length
  conversation with Umberto Eco on books and libraries, edited by
  Jean-Philippe de Tonnac and published as
  [[work:umberto-eco/non-sperate-di-liberarvi-dei-libri|Non sperate di
  liberarvi dei libri]] (2009).
lifeEvents: []
