# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# Author-LIFE events live here; franchise-specific events would stay in
# content/franchises/orhan-pamuk/events.yaml (none yet).
#
# NAME. Full birth name Ferit Orhan Pamuk; publishes and is known everywhere
# as Orhan Pamuk. No pseudonym or pen name found in any source checked
# (English and Turkish Wikipedia, his own site orhanpamuk.net) - a single
# byline across the whole bibliography.
#
# LIVING AUTHOR (born 1952). Cross-checked against English Wikipedia's
# "Orhan Pamuk" article and infobox, Turkish Wikipedia's "Orhan Pamuk"
# article (fuller on the Turkish-language biographical detail, particularly
# the 1979 Milliyet contest and the exact prosecution timeline), and his own
# site's biography page.
id: orhan-pamuk
name: Orhan Pamuk
aka: ["Ferit Orhan Pamuk"]
born: 1952-06-07
died: null
bio: >
  Turkish novelist born in Istanbul into a large, secularized, once-wealthy
  bourgeois family that had made its money in railway construction and was
  by his childhood in visible decline - the world he returns to directly in
  his debut novel [[work:orhan-pamuk/cevdet-bey-ve-ogullari|Cevdet Bey ve
  Oğulları]] and in his own memoir
  [[work:orhan-pamuk/istanbul-hatiralar-ve-sehir|İstanbul: Hatıralar ve
  Şehir]]. Raised in Nişantaşı, an affluent, Westernized district of
  Istanbul, in a household he has described as full of extended family and
  of his father's own large library of European and Russian novels. Studied
  at the English-language Robert College, then architecture for three years
  at Istanbul Technical University, before switching to the Institute of
  Journalism at the University of Istanbul, graduating in 1976. Decided in
  1974 to become a novelist and, living with his mother through most of his
  twenties, worked for years without a publisher before his first novel
  appeared in 1982. Married historian Aylin Türegün in 1982 (their daughter
  Rüya was born in 1991; they divorced in 2002); married Aslı Akyavaş in
  2022. Pamuk's paternal grandmother was Circassian. His novels turned
  increasingly toward historical and postmodern form through the 1980s and
  1990s, and international recognition followed
  [[work:orhan-pamuk/benim-adim-kirmizi|My Name Is Red]] (1998) and
  [[work:orhan-pamuk/kar|Snow]] (2002); he was awarded the Nobel Prize in
  Literature in 2006, the first Turkish writer to receive it. He has taught
  at Columbia University since the mid-2000s, latterly as the Robert
  Yik-Fong Tam Professor in the Humanities, dividing his time between New
  York and Istanbul, and continues to publish new fiction and nonfiction
  from both cities.
pseudonyms: []
lifeEvents:
  - id: pamuk-born-1952
    date: 1952-06-07
    title: Born Ferit Orhan Pamuk in Istanbul, raised in Nişantaşı
    impact: low
    description: >
      Born in Istanbul on 7 June 1952 into a large, secularized family that
      had grown wealthy building railways and was, by his own account,
      visibly living off a shrinking inheritance by his childhood. Raised in
      Nişantaşı, then an affluent and Westernized district on the European
      side of the city, in a household crowded with extended family under
      one roof - the setting he returns to directly in his debut novel and
      describes at length in his own memoir of the city.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Orhan_Pamuk
      - https://en.wikipedia.org/wiki/Istanbul:_Memories_and_the_City

  - id: pamuk-article-301-prosecution-2005
    date: 2005-02-05
    dateRange: "2005-2006"
    title: Prosecuted under Article 301 for "denigrating Turkishness"
    impact: high
    description: >
      Told the Swiss magazine Das Magazin in February 2005, "Thirty thousand
      Kurds have been killed here, and a million Armenians. And almost
      nobody dares to mention that. So I do" - a direct reference to the
      Kurdish conflict and the Armenian genocide, both subjects Turkish law
      treated as taboo. Nationalist groups filed complaints, copies of his
      books were burned in public protests, and prosecutors charged him
      under Article 301 of the Turkish Penal Code for "insulting
      Turkishness," a charge carrying up to three years in prison. The trial
      opened in Istanbul in December 2005 under intense international
      attention - the EU, PEN and a long list of prominent writers publicly
      backed him - and the case was dropped in January 2006 on a procedural
      technicality (the justice ministry withheld the authorization required
      to proceed) rather than on the merits; a later civil suit still
      required him to pay compensation in 2011. He was awarded the Nobel
      Prize in Literature the same year the case was dropped, and has faced
      recurring nationalist hostility and credible threats to his safety
      since, at times living outside Turkey for his own security.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Orhan_Pamuk
      - https://news.bbc.co.uk/2/hi/europe/4369562.stm
      - https://news.bbc.co.uk/2/hi/europe/4533664.stm

  - id: pamuk-nobel-prize-2006
    date: 2006-10-12
    title: Awarded the Nobel Prize in Literature, the first Turkish laureate
    impact: high
    description: >
      Awarded the Nobel Prize in Literature on 12 October 2006, cited for
      work in which, "in the quest for the melancholic soul of his native
      city, he has discovered new symbols for the clash and interlacing of
      cultures." The first Turkish writer to receive the prize, awarded only
      months after a Turkish court dropped its own prosecution of him under
      Article 301 for remarks on the Armenian genocide and the Kurdish
      conflict - a juxtaposition international coverage noted at the time.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Orhan_Pamuk
      - https://www.nytimes.com/2006/10/12/world/europe/12iht-nobel.3142293.html
