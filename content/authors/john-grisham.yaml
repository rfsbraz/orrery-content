# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# Author-LIFE events live here (they follow the person); franchise-specific
# events stay in content/franchises/john-grisham/events.yaml (the 1990s
# legal-thriller boom, shared with Scott Turow's readership rather than
# personal to Grisham).
#
# lifeEvents span 1955-2023: two terms in the Mississippi legislature
# (1983-1990); A Time to Kill's rejection by roughly 28 publishers and its
# 5,000-copy debut (1989); The Firm's pre-publication Hollywood bidding war
# (1990); the one lawsuit Grisham tried after leaving the bar, honoring a
# commitment made before he was famous (1996); the youth ballpark he built
# in Virginia the same year, the source of the baseball thread running
# through several later books (1996); the Ron Williamson obituary that
# becomes his first nonfiction book and the start of his wrongful-
# conviction advocacy (2004); meeting Jim McCloskey, who turns that
# advocacy into board seats, a novel and a co-authored book (2009); a New
# York Times op-ed for a Guantanamo detainee (2013); the 2014
# sentencing-comments controversy and its next-day apology; a December 2015
# TEDx talk introducing The Tumor; and joining the Authors Guild's 2023
# copyright suit against OpenAI. No sourced, load-bearing fact turned up
# for 1997-2003, the wing's longest resulting gap (7 years), or for
# 2016-2019; the press record for those years is book tours and
# bestseller-list coverage, not aura.
#
# Living author (born 1955). Single confirmed byline throughout his career:
# no pseudonym, pen name or ghostwriting history was found anywhere in the
# sources checked (Wikipedia's biography, his own site, and the reporting
# around each of his co-authored/contributed works below, all of which credit
# him openly as himself). The two co-authored or multi-author books in this
# wing (Framed with Jim McCloskey; the Don't Quit Your Day Job and Wavedancer
# Benefit anthology contributions) are all attributed to "John Grisham" by
# name, not a shared or alternate identity.
id: john-grisham
name: John Grisham
aka: ["John Ray Grisham Jr."]
born: 1955-02-08
died: null
images:
  portrait: "https://upload.wikimedia.org/wikipedia/commons/e/e3/Grisham_John_by_C_Harrison_%28cropped%29.jpg"
  portraitCredit: "Carol Harrison, CC BY-SA 4.0"
  portraitSource: "https://commons.wikimedia.org/wiki/File:Grisham_John_by_C_Harrison_(cropped).jpg"
  # The current English Wikipedia infobox photo for this article (confirmed
  # via its pageimages API): a professional head-and-shoulders portrait,
  # dated by the file's own record to 10 January 2016. Preferred over a 2009
  # Flickr event photo also linked from Wikidata's P18 claim, which is
  # correctly licensed but only 240x320px, well under a usable resolution.
bio: >
  American novelist and former lawyer, born in Jonesboro, Arkansas, the second
  of five children of a construction worker/cotton farmer and a homemaker; the
  family settled in Southaven, Mississippi, near Memphis, when he was four,
  and he was raised there. Earned a BS from Mississippi State University and
  a JD from the University of Mississippi School of Law (1981), practiced
  criminal and civil law for about a decade, and served in the Mississippi
  House of Representatives from 1983 to 1990. Wrote his first novel,
  [[work:john-grisham/a-time-to-kill|A Time to Kill]], longhand on yellow
  legal pads before work over three years, finishing it in 1987; it was
  rejected by many publishers before a small press gave it a 5,000-copy
  printing in 1989. His second novel, [[work:john-grisham/the-firm|The Firm]]
  (1991), became a bestseller and made him one of the best-selling novelists
  alive, a position he has held continuously since.
pseudonyms: []
