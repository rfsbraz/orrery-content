# GLOBAL author entity (docs/SCHEMA.md). Eight lifeEvents mark her birth,
# her 1917 law-school enrollment, her first divorce, her brother Apeles's
# death, her own death, her father's 1948 paternity edict, the 1985
# discovery of a poem misattributed to Pessoa in his own papers, and Dal
# Farra's 1994 critical edition of Trocando Olhares - each dated and
# sourced inline on the event. The facts below - the three marriages, the
# brother's death, her illness and suicide - are also verified and sourced
# in this bio's own prose. The once-repeated Pessoa "twin soul" line is
# corrected here rather than dropped, since the correction is itself the
# more interesting fact: the poem is not his.
#
# aka: "Flor Bela Lobo" is her baptismal name (see the born event).
# "Florbela d'Alma" is a fragment of "Florbela d'Alma da Conceição
# Espanca," the fuller name Portuguese Wikipedia says she chose for
# herself ("optou por se autonomear") over the baptismal one; Treccani's
# own authority record for her independently uses that same full form as
# its entry id, corroborating it as a real, standing name rather than a
# one-off. She is on record signing an earlier version, "Flor d'Alma da
# Conceição," during her 1899-1908 primary-school years, but no source
# checked dates the fuller self-naming to a specific moment or gives a
# reason beyond her own choice, so it stays here rather than in
# pseudonyms, which needs a dated adoption moment or a stated motive.

id: florbela-espanca
name: Florbela Espanca
aka: ["Flor Bela Lobo", "Florbela d'Alma"]
born: 1894-12-08
died: 1930-12-08
bio: >
  Born Flor Bela Lobo in the parish of Conceição, Vila Viçosa, in the
  Alentejo (baptized there 20 June 1895), the daughter of her father's
  household maid; her father, the antiquarian, photographer and early
  cinema exhibitor João Maria Espanca, raised her and her brother Apeles in
  his own home, where his wife Mariana do Carmo Toscano - unable to have
  children of her own - became Florbela's godmother and effectively raised
  her alongside her birth mother, though João Maria only acknowledged
  Florbela as his daughter in a 1948 municipal edict, eighteen years after
  her death. She grew up in Vila Viçosa until 1907, when the family moved
  to Évora so she could attend secondary school; that same year she first
  complained to her father of the fatigue and headaches that recurred, on
  and off, for the rest of her life. She married three times in twelve
  years: Alberto Moutinho (1913-1921), a schoolmate she married on her own
  nineteenth birthday and with whom she ran a small language school in
  Redondo before the marriage broke down over her return to Lisbon for law
  school; António Guimarães (1921-1925), a Guarda Nacional Republicana
  artillery officer she married in Porto and followed to Lisbon, a marriage
  that ended in mutual accusations of mistreatment; and the physician Mário
  Lage (1925 until her death). She was one of the first women admitted to
  the law course at the University of Lisbon, enrolling in October 1917;
  she lost the first of several pregnancies within a year, and a further
  miscarriage in 1919 - the year Livro de Mágoas appeared - marked a
  serious escalation of her illness. Best known for erotically direct,
  formally traditional sonnets that broke sharply with the reticence
  expected of a woman poet in 1920s Portugal, moving from the mourning,
  cloistered voice of
  [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] and
  [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]]
  to the open sensual claim of
  [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]], finished in
  manuscript years before her death but not yet in print when she died. Her
  brother Apeles, a naval officer and painter and the sibling she was
  closest to, died on 6 June 1927 when the seaplane he was piloting to
  complete his pilot's-license tests crashed into the Tejo between Porto
  Brandão and Trafaria; his body was never recovered, and the loss shadows
  her last two years and the short stories collected in
  [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]],
  dedicated to him. Espanca died in Matosinhos on 8 December 1930, her own
  thirty-sixth birthday, from an overdose of barbiturates, after two
  earlier attempts that October and November; her death certificate
  recorded the cause as pulmonary edema. A typewritten, unsigned poem
  addressed "to the memory of Florbela Espanca" and calling her "alma
  sonhadora, irmã gémea da minha" (dreaming soul, my twin sister) turned up
  among Fernando Pessoa's own papers in 1985, found by scholar Teresa
  Sobral Cunha, and was published in 1994 as the epigraph to Maria Lúcia
  Dal Farra's critical edition of
  [[work:florbela-espanca/trocando-olhares|Trocando Olhares]], taken at
  the time for Pessoa's own; Dal Farra has since credited Pessoa textual
  editor Jerónimo Pizarro's identification of the poem as one of Eliezer
  Kamenezki's, from the 1932 collection Alma Errante, for which Pessoa
  wrote only the preface.
