lifeEvents:
  - id: florbela-espanca-born-1894
    organisation: beside
    illustration_type: establishing-landscape
    images_required: 1
    date: 1894-12-08
    title: Born in Vila Viçosa, raised there and in Évora
    impact: low
    description: >
      Born Flor Bela Lobo in the parish of Conceição, Vila Viçosa,
      Alentejo, baptized there 20 June 1895, daughter of her father's
      household maid Antónia da Conceição Lobo; raised in her father
      João Maria Espanca's home by his wife Mariana do Carmo Toscano
      alongside her birth mother. Grew up in Vila Viçosa - the charneca
      (heath) that gives Charneca em Flor its title - until the 1907
      move to Évora for secondary school.
    spoilerAfter: null
    # Porto Editora's Infopédia (infopedia.pt) gives her birth year as
    # 1895, twice, with no 1894 anywhere on the page - fetched and
    # confirmed live. Every other source checked uses 8 December 1894,
    # as does this wing's own "died on her own thirty-sixth birthday"
    # framing below, which only holds for an 1894 birth. The discrepancy
    # resolves against the baptism date already on this event: 20 June
    # 1895 is seven months after 8 Dec 1894, an ordinary baptism lag, and
    # Infopédia reads as dating her by that registration rather than by
    # the birth itself.
    sources:
      - https://pt.wikipedia.org/wiki/Florbela_Espanca
      - http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386

  - id: florbela-espanca-lisbon-law-1917
    date: 1917
    title: Enrolls in the University of Lisbon's law course
    impact: med
    description: >
      Returns to Lisbon in 1917, completes her final year of the Curso
      Complementar de Letras and enrolls at the Faculdade de Direito da
      Universidade de Lisboa, one of a small number of women admitted that
      year - a break from what a woman of her time and place was expected
      to study. Classmates include the writers Américo Durão and Mário
      Beirão. Her marriage to Alberto Moutinho, left behind in Vila Viçosa,
      does not survive the move.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Florbela_Espanca
      - http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386

  - id: florbela-espanca-first-divorce-1921
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1921-04-30
    title: Divorces her first husband, Alberto Moutinho
    impact: med
    description: >
      Divorced from Alberto Moutinho, married on her own nineteenth
      birthday in 1913, by a Comarca de Vila Viçosa court judgment on 30
      April 1921; the marriage had effectively been over since her 1917
      return to Lisbon for law school while Moutinho stayed behind.
      Remarried two months later, to António Guimarães.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Florbela_Espanca
      - http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386

