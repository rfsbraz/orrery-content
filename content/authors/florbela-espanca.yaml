  # Commons licence reads the same public-domain status independently of
  # that usage. Photographer unrecorded; the file's own categories and a
  # 1930 terminus (Categories: PD-Portugal-URAA) place it in her lifetime.
  portrait: "https://upload.wikimedia.org/wikipedia/commons/d/d9/Picture_of_Florbela_Espanca.jpg"
  portraitCredit: "Unknown photographer, public domain"
