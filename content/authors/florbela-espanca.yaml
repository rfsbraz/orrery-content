  - id: florbela-espanca-paternity-edict-1948
    date: 1948-07-19
    title: Her father formally acknowledges her as his daughter
    impact: low
    description: >
      João Maria Espanca registers her as his daughter by municipal edict
      of the Câmara Municipal de Lisboa, 19 July 1948 - eighteen years
      after her death, and decades after he raised her in his own home
      without ever giving her his name; she and Apeles had always been
      registered as her mother Antónia's children by an unlisted father.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Florbela_Espanca

  - id: florbela-espanca-pessoa-poem-found-1985
    date: 1985
    title: A poem "to the memory of Florbela Espanca" surfaces in Pessoa's papers
    impact: med
    description: >
      Scholar Teresa Sobral Cunha finds a typewritten, unsigned poem in
      Fernando Pessoa's own papers, dated after 1930 and dedicated "to the
      memory of Florbela Espanca," calling her "alma sonhadora, irmã
      gémea da minha" (dreaming soul, my twin sister). Read for decades as
      Pessoa's own tribute to a poet he may never have met, it is later
      identified as Eliezer Kamenezki's, from his 1932 collection Alma
      Errante, which Pessoa had only prefaced - a copy of which, inscribed
      to Pessoa, sits in his own library.
    spoilerAfter: null
    sources:
      - http://arcagulharevistadecultura.blogspot.com/2017/05/maria-lucia-dal-farra-duas-vezes.html
      - https://bibliotecaparticular.casafernandopessoa.pt/8-628

  - id: florbela-espanca-trocando-olhares-1994
    date: 1994
    title: Dal Farra's critical edition of Trocando Olhares is published
    impact: med
    description: >
      Maria Lúcia Dal Farra's critical edition of the unfinished Trocando
      Olhares - the only pt-PT edition this fragmentary late work has ever
      had - is published by Imprensa Nacional-Casa da Moeda, with the
      "twin sister" poem found in Pessoa's papers printed as its epigraph
      and, at the time, taken for his. The edition arrives in Florbela's
      centenary year.
    spoilerAfter: null
    sources:
      - https://pt.wikipedia.org/wiki/Trocando_Olhares
      - http://arcagulharevistadecultura.blogspot.com/2017/05/maria-lucia-dal-farra-duas-vezes.html
