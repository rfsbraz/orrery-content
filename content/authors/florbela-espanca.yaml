id: florbela-espanca
name: Florbela Espanca
aka: ["Flor Bela Lobo", "Florbela d'Alma"]
born: 1894-12-08
died: 1930-12-08
bio: >
  Born Flor Bela Lobo in Vila Viçosa, in the Alentejo, the daughter of her
  father's household maid and christened with an unknown father named on
  the register; her father's wife raised her from birth alongside her own
  biological mother, and she later adopted the name Florbela Espanca
  herself. She was one of the first women admitted to the law course at the
  University of Lisbon, and married three times in twelve years - Alberto
  Moutinho (1913-1921), António Guimarães (1921-1925) and the physician
  Mário Lage (1925 until her death) - alongside several miscarriages and
  the first signs, from 1919 on, of a chronic illness that shadowed the
  rest of her life. Best known for erotically direct, formally traditional
  sonnets that broke sharply with the reticence expected of a woman poet in
  1920s Portugal, moving from the mourning, cloistered voice of
  [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] and
  [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]]
  to the open sensual claim of
  [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]], finished in
  manuscript years before her death but not yet in print when she died. Her
  brother Apeles, the sibling she was closest to, died in a 1927 plane
  crash into the river Tejo, a loss that shadows her last two years and the
  short stories collected in
  [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]].
  Espanca died by suicide in Matosinhos on 8 December 1930, her own
  thirty-sixth birthday. Fernando Pessoa is remembered for calling her his
  "irmã gémea" (twin sister/soul) in a poem found among his own papers
  after her death, beginning "Dorme, dorme, alma sonhadora, Irmã gêmea da
  minha!" (Sleep, sleep, dreaming soul, twin sister of mine).
