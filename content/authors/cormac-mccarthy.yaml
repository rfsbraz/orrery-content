# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere -
# across franchises and past name collisions. Author-LIFE events live here (they
# follow the person); franchise-specific events stay in the franchise.
#
# Sourced from English Wikipedia's main article and its "Cormac McCarthy
# bibliography" companion page (both fetched directly), cross-checked against
# the individual work articles cited on each work entry.
id: cormac-mccarthy
name: Cormac McCarthy
aka: ["Charles Joseph McCarthy Jr.", "C. J. McCarthy Jr."]
born: 1933-07-20
died: 2023-06-13
bio: >
  Born Charles Joseph McCarthy Jr. in Providence, Rhode Island, one of six
  children, and raised from 1937 on in Knoxville, Tennessee, where his father
  worked as a lawyer for the Tennessee Valley Authority. He enrolled at the
  University of Tennessee in 1951, left in 1953 to join the U.S. Air Force
  (stationed in Alaska, where he read widely for what he said was the first
  time in his life), and returned to the university in 1957, publishing early
  stories in the student magazine The Phoenix under the name C. J. McCarthy,
  Jr. He changed his first name to Cormac, a family nickname his Irish aunts
  had given his father, before his writing career began, partly (by his own
  account) to avoid comparison with ventriloquist Edgar Bergen's dummy Charlie
  McCarthy. His debut novel, [[work:cormac-mccarthy/the-orchard-keeper|The
  Orchard Keeper]] (1965), submitted unsolicited to Random House editor Albert
  Erskine, who would edit McCarthy's next four books, won the William Faulkner
  Foundation Award for a first novel. Literary grants and fellowships shaped
  the decades that followed: an American Academy of Arts and Letters award and
  a Rockefeller Foundation grant sent him through southern Europe to write
  [[work:cormac-mccarthy/outer-dark|Outer Dark]] (1968), and a 1981 MacArthur
  Fellowship funded the research trips into the American Southwest and
  Mexican borderlands behind [[work:cormac-mccarthy/blood-meridian|Blood
  Meridian]] (1985) and, later, [[work:cormac-mccarthy/all-the-pretty-horses|All
  the Pretty Horses]] (1992), [[work:cormac-mccarthy/the-crossing|The
  Crossing]] (1994) and [[work:cormac-mccarthy/cities-of-the-plain|Cities of
  the Plain]] (1998), published together as The Border Trilogy. All the Pretty
  Horses, which won the National Book Award and the National Book Critics
  Circle Award, was his first commercial success after five novels written in
  relative obscurity. [[work:cormac-mccarthy/the-road|The Road]] (2006) won
  the 2007 Pulitzer Prize for Fiction and the James Tait Black Memorial Prize.
  He had been drawn into the Santa Fe Institute, a multidisciplinary research
  center, in 1984 by the physicist Murray Gell-Mann, a friend since their
  shared 1981 MacArthur Fellows' ceremony, and worked alongside its scientists
  for the rest of his life, eventually as a lifetime trustee, before
  publishing his only essay, [[work:cormac-mccarthy/the-kekule-problem|The
  Kekulé Problem]] (2017), on the origin of language. His final two novels,
  [[work:cormac-mccarthy/the-passenger|The Passenger]] and
  [[work:cormac-mccarthy/stella-maris|Stella Maris]], both following siblings
  Bobby and Alicia Western, were published six weeks apart in the fall of
  2022. He died on June 13, 2023, in Santa Fe, New Mexico, aged 89.
lifeEvents:
  # A 2024 Vanity Fair profile of Augusta Britt, a decades-long correspondent
  # of McCarthy's whose letters entered his archive at Texas State University
  # in 2025, describes a relationship that began when she was 16 and he was
  # in his 40s. Her existence as a real, significant correspondent is
  # independently corroborated (the Wittliff Collections' own finding aid,
  # and a Cormac McCarthy Journal piece examining his correspondence with
  # Guy Davenport and Robert Coles). The age and nature of the relationship,
  # the fact that would earn this a slot, rests on one source: her own
  # account as reported by that single profile. No second, independent
  # account confirms it; every other outlet repeats or reacts to the same
  # piece. Not recorded here.
  - id: mccarthy-born-1933
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1933-07-20
    title: Born in Providence, Rhode Island
    impact: low
    description: >
      Charles Joseph McCarthy Jr., one of six children of Gladys McGrail and
      Charles Joseph McCarthy, born into an Irish Catholic family in
      Providence. In 1937 his father takes work as a lawyer for the Tennessee
      Valley Authority and the family moves to Knoxville, Tennessee, where
      McCarthy is raised and which becomes the city of
      [[work:cormac-mccarthy/suttree|Suttree]]. Of the house on Martin Mill
      Pike in South Knoxville he later said: "We were considered rich because
      all the people around us were living in one- or two-room shacks."
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Cormac_McCarthy
      - https://global.penguinrandomhouse.com/announcements/author-cormac-mccarthy-dies-at-89/

  - id: mccarthy-delisle-ibiza-1966
    organisation: beside
    illustration_type: domestic-interior
    images_required: 1
    date: 1966
    title: A second marriage, and the isolation that shapes Outer Dark
    impact: med
    description: >
      McCarthy wrote the early draft of
      [[work:cormac-mccarthy/outer-dark|Outer Dark]] alone in Knoxville after
      his first wife and their son left him following his 1963 divorce; he
      finished the final draft eighteen months after marrying Anne DeLisle, a
      singer he had met aboard the liner taking him to Europe on his 1965
      travelling fellowship. They married in England in 1966 and settled on
      Ibiza, where the novel was completed on Rockefeller Foundation grant
      money, the marriage itself lasting until 1981.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Outer_Dark
      - https://www.irishtimes.com/obituaries/2023/07/01/cormac-mccarthy-obituary-stripped-down-novels-mirrored-his-dislike-of-trappings-of-success/
  - id: mccarthy-guggenheim-1969
    organisation: marginalia
    illustration_type: emblem-seal
    images_required: 1
    date: 1969
    title: A first Guggenheim Fellowship, and a second in 1976
    impact: low
    description: >
      Awarded a Guggenheim Fellowship for Creative Writing in 1969, funding
      the return from Ibiza to Rockford, Tennessee, and the years spent
      drafting [[work:cormac-mccarthy/child-of-god|Child of God]] (1973). A
      second Guggenheim followed in 1976.
    spoilerAfter: null
    sources:
      - https://www.gf.org/fellows/cormac-mccarthy/
  - id: mccarthy-delisle-separation-el-paso-1976
    organisation: beside
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1976
    title: Walks out mid-draft, and finishes Suttree from El Paso
    impact: high
    description: >
      Midway through the two-decade draft of
      [[work:cormac-mccarthy/suttree|Suttree]], McCarthy separated from Anne
      DeLisle and left their rented cottage outside Knoxville for El Paso,
      Texas, the city that anchored the rest of his life and, three years
      later, the American Southwest of
      [[work:cormac-mccarthy/blood-meridian|Blood Meridian]]. He kept mailing
      pages back to Knoxville for DeLisle to type; she recalled waiting for
      him to come home "for years and years." The novel reached print in
      1979, still set entirely in the Knoxville he had just left.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Cormac_McCarthy
      - https://www.irishtimes.com/obituaries/2023/07/01/cormac-mccarthy-obituary-stripped-down-novels-mirrored-his-dislike-of-trappings-of-success/
  - id: mccarthy-macarthur-fellowship-1981
    organisation: medallion
    illustration_type: emblem-seal
    images_required: 1
    date: 1981-12
    title: A MacArthur Fellowship funds the years that produce Blood Meridian
    impact: high
    description: >
      Named to the MacArthur Foundation's December 1981 class of Fellows at
      48, then living in El Paso. The five-year, no-strings "genius grant"
      freed him from teaching or other paid work and funded the research
      trips into the Southwest and the Mexican borderlands behind
      [[work:cormac-mccarthy/blood-meridian|Blood Meridian]] (1985) and,
      later, the Border Trilogy. At the Fellows' ceremony he also met the
      physicist Murray Gell-Mann, a friendship that brought him to the Santa
      Fe Institute three years afterward.
    spoilerAfter: null
    sources:
      - https://www.macfound.org/fellows/class-of-december-1981/cormac-mccarthy
      - https://www.santafe.edu/news-center/news/cormac-and-sfi-abiding-friendship
  - id: mccarthy-santa-fe-institute-1984
    organisation: beside
    illustration_type: workplace-workshop
    images_required: 1
    date: 1984
    title: Brought into the Santa Fe Institute at its founding
    impact: med
    description: >
      Murray Gell-Mann, met at their shared 1981 MacArthur ceremony,
      co-founded the Santa Fe Institute in 1984 and brought McCarthy along.
      He became a trustee for life, and decades later wrote the Institute's
      Operating Principles; its scientists and their questions about
      complexity and language run under his only essay,
      [[work:cormac-mccarthy/the-kekule-problem|The Kekulé Problem]] (2017),
      and his last two novels, [[work:cormac-mccarthy/the-passenger|The
      Passenger]] and [[work:cormac-mccarthy/stella-maris|Stella Maris]]
      (2022).
    spoilerAfter: null
    sources:
      - https://www.santafe.edu/news-center/news/cormac-and-sfi-abiding-friendship
      - https://www.santafe.edu/news-center/news/memoriam-cormac-mccarthy
  - id: mccarthy-erskine-fisketjon-1987
    organisation: beside
    illustration_type: relationship-tableau
    images_required: 1
    date: 1987
    title: His editor of twenty-two years retires; the shelf changes hands
    impact: med
    description: >
      Albert Erskine, who had championed
      [[work:cormac-mccarthy/the-orchard-keeper|The Orchard Keeper]]
      unsolicited in 1965 and edited the four McCarthy novels after it,
      retired from Random House in 1987 with neither of them ever having had
      a bestseller between them. By the time
      [[work:cormac-mccarthy/all-the-pretty-horses|All the Pretty Horses]]
      appeared in 1992, McCarthy had a new editor, Gary Fisketjon (who had
      joined Alfred A. Knopf in 1990), a new publisher, and, for the first
      time in his career, a literary agent, Amanda Urban. Fisketjon and Urban
      also talked him into the fullest interview he had given in four
      decades, timed to the new novel.
    spoilerAfter: null
    sources:
      - https://www.bookforum.com/print/2904/cormac-mccarthy-s-dream-songs-about-genius-siblings-in-love-25134
      - https://www.irishtimes.com/obituaries/2023/07/01/cormac-mccarthy-obituary-stripped-down-novels-mirrored-his-dislike-of-trappings-of-success/
      - https://en.wikipedia.org/wiki/Gary_Fisketjon
  - id: mccarthy-death-2023
    organisation: immersion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 2023-06-13
    title: Dies at home in Santa Fe
    impact: high
    description: >
      Died of natural causes at 89, still a trustee and Senior Fellow of the
      Santa Fe Institute that had been his second home since 1984. The
      Institute led its own tribute with a line from Harold Bloom, the critic
      whose advocacy had done most to turn [[work:cormac-mccarthy/blood-meridian|Blood
      Meridian]] into a modern classic: "the true heir to Melville and
      Faulkner."
    spoilerAfter: null
    sources:
      - https://www.santafe.edu/news-center/news/memoriam-cormac-mccarthy
      - https://www.legacy.com/news/celebrity-deaths/cormac-mccarthy-1933-2023-pulitzer-prize-winning-author-of-the-road/
