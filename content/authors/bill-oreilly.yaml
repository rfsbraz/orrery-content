name: "Bill O'Reilly"
aka: []
born: 1949-09-10
died: null
bio: >
  Bill O'Reilly is an American television host and author who anchored The
  O'Reilly Factor on Fox News from 1996 until 2017, when the network
  declined to renew his contract after the New York Times reported that he
  and Fox had settled several sexual harassment complaints against him. With
  Martin Dugard he co-wrote the bestselling Killing history series (Killing
  Lincoln, Killing Kennedy and others), several of which were adapted into
  National Geographic films. He co-wrote the children's book
  [[work:james-patterson/give-please-a-chance|Give Please a Chance]] (2016)
  with James Patterson.
