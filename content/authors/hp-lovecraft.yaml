# Global author entity. Referenced by authorIds from
# content/franchises/hp-lovecraft/works.yaml. Author-LIFE events live here,
# not on the franchise; what happened to the WORK after his death (Arkham
# House, the Derleth Mythos, the critical reversals, the World Fantasy Award
# trophy) belongs to the franchise and lives in
# content/franchises/hp-lovecraft/events.yaml instead.
#
# Birth and death are settled beyond dispute: born in his family's home at
# 454 (now 194) Angell Street, Providence, Rhode Island, on August 20, 1890;
# died at Jane Brown Memorial Hospital, Providence, on March 15, 1937, and is
# buried in the family plot at Swan Point Cemetery (the H. P. Lovecraft
# Archive's biography, hplovecraft.com/life/biograph.aspx, cross-checked
# against Wikipedia's "H. P. Lovecraft"). Cause of death was cancer of the
# small intestine; neither of those two sources gives malnutrition as a
# contributing cause, so it is not stated here.
#
# Lovecraft's racism is recorded below as sourced biographical fact, at the
# points in the life where the record puts it, rather than as a single
# summary line: his first professionally published poem (1912), the letters
# and the New York years (1924-26), and the partial moderation of the 1930s.
# The primary sources for those entries are his own published verse and
# letters, Sonia Greene's 1948 memoir in the Providence Sunday Journal, and
# S. T. Joshi's and L. Sprague de Camp's biographies. It also reaches
# specific texts, which carry their own notes in works.yaml
# ([[work:hp-lovecraft/the-rats-in-the-walls|The Rats in the Walls]],
# [[work:hp-lovecraft/the-horror-at-red-hook|The Horror at Red Hook]],
# [[work:hp-lovecraft/medusas-coil|Medusa's Coil]],
# [[work:hp-lovecraft/facts-concerning-the-late-arthur-jermyn-and-his-family|Arthur
# Jermyn]]).
id: hp-lovecraft
name: H. P. Lovecraft
aka: ["Howard Phillips Lovecraft"]
born: 1890-08-20
died: 1937-03-15
bio: >
  American writer of weird, horror and cosmic-horror fiction, born in
  Providence, Rhode Island, the only child of Winfield Scott Lovecraft and
  Sarah Susan Phillips Lovecraft. His father was committed to a psychiatric
  hospital in 1893, when Lovecraft was two, and died there in 1898; his
  mother's family's wealth, substantial at his birth, had largely
  dissipated by his father's death, and she was herself committed to the
  same hospital in 1919, dying there in 1921. He wrote for amateur
  journalism associations from 1914, began publishing fiction in the pulp
  magazine Weird Tales from 1923, and for most of his working life
  supported himself less by his own fiction than by ghostwriting and
  revising the work of other, often much less accomplished, writers for a
  fee. He married Sonia Greene in 1924 and lived with her in New York City
  for two years, a period he found professionally and personally
  difficult; the marriage ended in separation (never formally divorced) and
  he returned to Providence in 1926, where he lived for the rest of his
  life and wrote most of the fiction he is now known for, including
  [[work:hp-lovecraft/the-call-of-cthulhu|The Call of Cthulhu]] (1928) and
  [[work:hp-lovecraft/at-the-mountains-of-madness|At the Mountains of
  Madness]] (1936). He was almost entirely unknown outside pulp-magazine
  readership in his own lifetime and died in poverty in Providence in 1937;
  his posthumous reputation was built mainly through Arkham House, the
  small press his friends August Derleth and Donald Wandrei founded in 1939
  specifically to keep his work in print. His letters, of which several
  thousand survive, extensively document racist and antisemitic views he
  held for most of his adult life.
pseudonyms: []
lifeEvents:
  - id: hp-lovecraft-born-1890
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1890-08-20
    title: Born in Providence, in the house he spent the rest of his life leaving and returning to
    impact: low
    description: >
      Born Howard Phillips Lovecraft in the family home at 454 (now 194)
      Angell Street, Providence, Rhode Island, the only child of Winfield
      Scott Lovecraft and Sarah Susan Phillips Lovecraft. He was raised in
      that house by his mother, her two unmarried sisters and her parents.
      His grandfather Whipple Van Buren Phillips, who paid for all of it,
      taught him to read before he was four, put Bulfinch and the Arabian
      Nights and Poe in front of him, and invented weird tales of "winged
      horrors" to entertain him. Lovecraft left Rhode Island only twice for
      any length of time, and set most of his fiction within a day of it.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://www.hplovecraft.com/life/biograph.aspx"

  - id: hp-lovecraft-father-dies-in-butler-hospital-1898
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1898-07-19
    dateRange: "1893-1898"
    title: His father dies in the hospital he was committed to when Lovecraft was two
    impact: med
    description: >
      Winfield Scott Lovecraft, a commercial traveller, was returned to
      Providence under restraint after an episode in a Chicago hotel room in
      the spring of 1893 and admitted to Butler Hospital on April 25. He
      never left it, dying there on July 19, 1898; his death certificate
      gave "general paresis", the term then used for late-stage syphilis.
      Lovecraft was two when his father went in and seven when he died, and
      he maintained for the rest of his life that his father had been
      paralysed by insomnia and overwork. He repeatedly denied ever having
      visited him. Winfield left an estate of about $10,000; the household
      that raised his son was his wife's family's, not his.
    spoilerAfter: null
    sources:
      - "https://lovecraft.en-academic.com/333/Lovecraft,_Winfield_Scott"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-loses-the-family-home-1904
    organisation: beside
    illustration_type: place-portrait
    images_required: 1
    date: 1904
    title: The money goes, the house goes, and he thinks about ending it
    impact: high
    description: >
      In the spring of 1904 Whipple Phillips's largest business venture
      failed; within months he was dead of a stroke at 70. What was left of
      the estate could not keep 454 Angell Street, and Lovecraft and his
      mother moved into a small duplex a few doors along. He called it one
      of the darkest periods of his life, and wrote in a 1934 letter that he
      had seen no point in going on and had considered killing himself,
      taking long bicycle rides to look at the water of the Barrington
      River; what stopped him, by his own account, was wanting to know more
      about the world. The lost ancestral house, and the family that cannot
      hold on to what it inherited, are in the fiction from the beginning.
    spoilerAfter: null
    sources:
      - "https://www.hplovecraft.com/life/biograph.aspx"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-breakdown-leaves-school-1908
    organisation: interlude
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1908
    dateRange: "1908-1913"
    title: A breakdown ends his schooling, and five years go almost unrecorded
    impact: high
    description: >
      Weeks before he would have graduated from Hope Street High School,
      Lovecraft suffered what he later called variously a "nervous collapse"
      and "a sort of breakdown". He never graduated, never entered Brown
      University as he had always said he would, and treated the failure as
      a private shame for the rest of his life. Whether the cause was
      physical, psychiatric or both has never been established; he wrote
      afterwards that he was "prey to intense headaches, insomnia, and
      general nervous weakness which prevents my continuous application to
      any thing", and that he "could hardly bear to see or speak to anyone".
      Almost nothing of the next five years is on record. He abandoned
      fiction entirely, kept up his amateur astronomy, and lived alone with
      his mother, who told a friend that her son was so hideous he would not
      walk where people could look at him.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://www.hplovecraft.com/life/biograph.aspx"

  # The 1912 date, paper and characterisation are from the Joshi/Schultz
  # "An H. P. Lovecraft Encyclopedia" entry on his poetry, which gives
  # "Providence in 2000 A.D." ([Providence] Evening Bulletin, March 4, 1912).
  # The two unpublished racist poems of the same period are documented in
  # Joshi's biography; the conclusion of one of them was quoted in the
  # Guardian's 2014 coverage of the World Fantasy Award campaign. Their
  # wording is not reproduced here, and the title of one is itself a slur.
  - id: hp-lovecraft-first-published-poem-1912
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1912-03-04
    title: His first professionally published poem is a xenophobic satire on his own city
    impact: high
    description: >
      "Providence in 2000 A.D." appeared in the Providence Evening Bulletin
      on March 4, 1912: the first thing Lovecraft published anywhere outside
      his own hectographed schoolboy journals. It imagines a future
      Providence in which Americans of English descent have been displaced
      by Irish, Italian, Portuguese and Jewish immigrants and the streets
      renamed after them, and Joshi and Schultz's encyclopedia of his work
      describes it flatly as a satire directed against the Italian-American
      residents of his native city. Two further racist poems date from the
      same period, one of them arguing that Black people are a separate
      creation standing between the animal and the human; neither was
      published in his lifetime. The documentary record of Lovecraft's
      racism and the documentary record of his publishing therefore begin at
      the same moment, in the same newspapers.
    spoilerAfter: null
    sources:
      - "https://lovecraft.en-academic.com/453/Poetry,_Lovecraft%E2%80%99s"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://www.theguardian.com/books/2014/sep/17/world-fantasy-awards-hp-lovecraft-racism-row-statuette"

  # Transcriptions of the 1921 letter about amateur journalism differ: the
  # H. P. Lovecraft Archive's biography gives "as close to the state of
  # vegetation as any animal well can be" and "a renewal to live", where
  # Joshi's 2010 biography is quoted as "a renewed will to live; a renewed
  # sense of existence as other than a superfluous weight". Only the
  # phrase both renderings agree on is quoted below.
  - id: hp-lovecraft-argosy-feud-joins-uapa-1914
    organisation: passage
    illustration_type: serial-contact-sheet
    images_required: 1
    date: 1914-04
    dateRange: "1913-1916"
    title: A letters-column feud drags him out of five years of silence
    impact: high
    description: >
      In 1913 Lovecraft, deep in seclusion, wrote to the pulp magazine
      Argosy attacking its romance writer Fred Jackson, whose stories he
      called "trivial, effeminate, and, in places, coarse" and whose
      characters, he wrote, showed "the delicate passions and emotions
      proper to negroes and anthropoid apes". It set off a feud in the
      letters pages that ran for most of a year, conducted on his side in
      heroic couplets. Edward F. Daas of the United Amateur Press
      Association noticed it and invited both Lovecraft and his chief
      opponent to join; Lovecraft joined in April 1914. He said afterwards
      that before amateur journalism reached him he had been "as close to
      the state of vegetation as any animal well can be". He was elected to
      run its criticism department that year, published his first short
      story in its main journal in 1916, and wrote
      [[work:hp-lovecraft/the-tomb|The Tomb]] and
      [[work:hp-lovecraft/dagon|Dagon]] soon after: the first fiction he had
      written in eight years.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://www.hplovecraft.com/life/biograph.aspx"

  - id: hp-lovecraft-mother-committed-1919
    organisation: beside
    illustration_type: domestic-interior
    images_required: 1
    date: 1919-03
    title: His mother is committed to the hospital his father died in
    impact: high
    description: >
      Susie Lovecraft's health, mental and physical, had been failing for
      years; she broke down over the winter of 1918-19 and was admitted to
      Butler Hospital in March 1919, where her husband had died twenty-one
      years earlier. A neighbour interviewed long afterwards recalled her
      describing "weird and fantastic creatures that rushed out from behind
      buildings and from corners at dark", and meeting her in downtown
      Providence when she did not know where she was. Lovecraft wrote to a
      correspondent that "existence seems of little value" and that he
      wished "it might terminate". He visited her and walked the hospital
      grounds with her. Her medical file was later destroyed in a fire at
      Butler, so what was actually wrong with her cannot now be determined.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-mother-dies-1921
    organisation: medallion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1921-05-24
    title: His mother dies, and six weeks later he meets his wife
    impact: high
    description: >
      Susie Lovecraft died at Butler Hospital on May 24, 1921, of
      complications from a gallbladder operation five days earlier. At 30,
      her son had never lived apart from her. His letters in the weeks after
      describe a grief that stopped him working and a renewed wish that his
      own life would end; within a few more weeks he was writing that he
      could now live independently, and his health began, unaccountably to
      him, to improve. He went to an amateur journalism convention in Boston
      on July 4 all the same. There he met Sonia Haft Greene, a
      Ukrainian-born Jewish businesswoman seven years his senior, who was
      running a Fifth Avenue women's-wear business and earning, by her own
      later account, close to $10,000 a year.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://www.hplovecraft.com/life/biograph.aspx"
      - "https://repository.library.brown.edu/studio/item/bdr:425853/"

  - id: hp-lovecraft-marries-sonia-greene-1924
    organisation: beside
    illustration_type: relationship-tableau
    images_required: 1
    date: 1924-03-03
    title: Marries Sonia Greene and moves to Brooklyn
    impact: med
    description: >
      They married at St Paul's Chapel in Manhattan on March 3, 1924. The
      venue was his choice, she wrote later, because Washington had
      worshipped there; in that as in most things, she said, "I let him have
      his way. In nearly everything he was the 'victor' and I the
      'vanquished.'" His aunts, who disapproved, were told by letter after
      the fact. She was the one with money: while she supported him, his
      aunts were sending $5 a week out of the $15 of his own share of the
      Phillips estate he was supposed to receive, and not always regularly.
      Within months her hat business had failed and her savings had gone in
      a bank failure, and Lovecraft, 33 and with no employment history at
      all, could not find anyone willing to hire him.
    spoilerAfter: null
    sources:
      - "https://repository.library.brown.edu/studio/item/bdr:425853/"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://en.wikipedia.org/wiki/Sonia_Greene"

  - id: hp-lovecraft-red-hook-and-the-letters-1925
    organisation: layered-stack
    illustration_type: archive-stack
    images_required: 1
    date: 1925
    dateRange: "1924-1926"
    title: Alone at Red Hook, in the letters, and among friends who argued with him
    impact: high
    description: >
      On January 1, 1925, Sonia left for a job in Cleveland and Lovecraft
      moved into a single room at 169 Clinton Street, at the edge of Red
      Hook. That summer the room was burgled and he was left with the
      clothes he was wearing. Out of the period came
      [[work:hp-lovecraft/the-horror-at-red-hook|The Horror at Red Hook]]
      and [[work:hp-lovecraft/he|He]], both of which stage their horror in
      the immigrant city around him, and the outline of
      [[work:hp-lovecraft/the-call-of-cthulhu|The Call of Cthulhu]].
      The fullest first-hand account of what he was like in those two years
      is his wife's, published in the Providence Sunday Journal on August
      22, 1948. She described him becoming "livid with rage" in New York's
      mixed crowds, and said it was "this attitude toward minorities and his
      desire to escape them that eventually prompted him back to
      Providence". When she protested at being counted among what he called
      the "alien hordes", he answered: "You are now Mrs. H. P. Lovecraft of
      598 Angell Street, Providence, Rhode Island." She also set down a
      sentence of his that has been quoted ever since: "It is more important
      to know what to hate than it is to know what to love."
      It is the same period in which his closest circle formed. The Kalem
      Club included Samuel Loveman, who was Jewish and whom Lovecraft
      counted a close friend, and James F. Morton, a Harvard-educated
      anarchist twenty years his senior who had published a pamphlet called
      The Curse of Race Prejudice in 1906, served on NAACP committees in the
      1910s, and was living in Harlem. Joshi calls the letters between them
      "the single greatest correspondence Lovecraft ever wrote"; race was
      among the subjects they argued over for years. Of the roughly 100,000
      letters Lovecraft is estimated to have written, about a fifth survive,
      and they are where most of the documented racism is: not inferred from
      the fiction, but written in his own hand, to named people, over
      decades, and disputed at the time by people who liked him.
    spoilerAfter: null
    sources:
      - "https://repository.library.brown.edu/studio/item/bdr:425853/"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://en.wikipedia.org/wiki/James_Ferdinand_Morton_Jr."

  - id: hp-lovecraft-returns-to-providence-1926
    organisation: full-bleed-vista
    illustration_type: establishing-landscape
    images_required: 1
    date: 1926-04-17
    title: Goes home to Providence, and writes almost everything he is read for
    impact: high
    description: >
      Lovecraft returned to Providence on April 17, 1926, to 10 Barnes
      Street and the care of his aunts, who had already refused to let his
      wife join him there on the grounds that a woman in trade would not do.
      The marriage was over in everything but law. The eleven years that
      followed hold nearly all the fiction this wing rests on, among them
      [[work:hp-lovecraft/the-call-of-cthulhu|The Call of Cthulhu]],
      [[work:hp-lovecraft/the-case-of-charles-dexter-ward|The Case of
      Charles Dexter Ward]],
      [[work:hp-lovecraft/at-the-mountains-of-madness|At the Mountains of
      Madness]] and
      [[work:hp-lovecraft/the-shadow-over-innsmouth|The Shadow over
      Innsmouth]], along with the antiquarian travels down the eastern
      seaboard that he wrote up at enormous length and a correspondence that
      made him the centre of a circle of much younger writers.
    spoilerAfter: null
    sources:
      - "https://www.hplovecraft.com/life/biograph.aspx"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-fear-of-the-unknown-1927
    organisation: epigraph
    images_required: 0
    date: 1927
    title: "Supernatural Horror in Literature, first sentence"
    impact: med
    quote: "The oldest and strongest emotion of mankind is fear, and the oldest and strongest kind of fear is fear of the unknown."
    description: >
      The opening line of the long survey of weird fiction he wrote for
      W. Paul Cook's amateur circular The Recluse, and the closest thing he
      left to a statement of his own programme.
    spoilerAfter: null
    sources:
      - "https://www.hplovecraft.com/writings/texts/essays/shil.aspx"

  - id: hp-lovecraft-divorce-never-completed-1929
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1929
    title: The divorce decree he never signed
    impact: med
    description: >
      Sonia obtained the divorce in 1929. Lovecraft assured her it was
      complete and then never signed the final decree, so that in law they
      remained married until his death. She moved to California, married
      again in 1936 believing herself free to, and did not learn that
      Lovecraft had died until 1945, eight years after the fact. She was
      told late in life that her second marriage had therefore been
      technically bigamous, and Joshi records that it disturbed her
      considerably.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/Sonia_Greene"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-mountains-of-madness-rejected-1931
    organisation: diptych
    illustration_type: manuscript-proof
    images_required: 2
    date: 1931-07
    dateRange: "1931-1936"
    title: The book Weird Tales turned down, and what a sub-editor did to it five years later
    impact: high
    description: >
      Lovecraft wrote
      [[work:hp-lovecraft/at-the-mountains-of-madness|At the Mountains of
      Madness]] in February and March 1931 and sent it to Weird Tales;
      Farnsworth Wright rejected it in July on grounds of length. He took it
      badly enough to put the manuscript away for years, and by then his
      habit was to stop trying to sell a story after a single refusal. His
      agent Julius Schwartz placed it in 1935 with F. Orlin Tremaine at
      Astounding Stories, who accepted it apparently without reading it. It
      ran in three instalments in February, March and April 1936 and earned
      $315, more than he was ever paid for anything else; it also came back
      re-spelled, re-punctuated, his long paragraphs broken up and roughly a
      thousand words cut from the ending. He called Tremaine "that
      god-damn'd dung of a hyaena". Shortly after finishing
      [[work:hp-lovecraft/the-haunter-of-the-dark|The Haunter of the Dark]],
      his last original story, he wrote that the hostile reception of
      Mountains had done "more than anything to end my effective fictional
      career". A fully restored text did not exist in print until
      S. T. Joshi's corrected Arkham House edition of 1985.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/At_the_Mountains_of_Madness"
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-politics-shift-1930s
    organisation: beside
    illustration_type: historical-context-tableau
    images_required: 1
    date: 1933
    dateRange: "1930-1936"
    title: The Depression makes him a socialist; his racial views moderate without going away
    impact: med
    description: >
      Through the 1920s Lovecraft was an Anglophile who opposed democracy
      and thought the United States should be governed by an aristocracy.
      The Depression broke that: he became a socialist, backed Franklin
      Roosevelt while judging the New Deal too timid, and set out his own
      programme in the 1933 essay "Some Repetitions on the Times" -
      government control of resource distribution, shorter hours, higher
      wages, unemployment insurance, old-age pensions, administered by an
      aristocracy of intellect rather than of money.
      His views on race moved too, and the honest account of the movement is
      the one his biographers give. By the 1930s, Joshi writes, they had
      moderated: he had shifted from demanding that minorities assimilate to
      arguing that each culture should be left to remain itself, and he
      wrote warmly about Quebecois and First Nations traditions in his
      Quebec travelogue, the longest thing he ever wrote. It was a
      moderation and not an abandonment, and the same scholarship says so.
      He had also expressed early support for Hitler, on the grounds that he
      would preserve German culture, while objecting that a racial policy
      ought to rest on culture rather than descent; Joshi records that
      Lovecraft and his aunt were angered by his downstairs neighbour Harry
      Brobst's eyewitness account of Jews being beaten in Germany, and that
      his references to Hitler stopped after it.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

  - id: hp-lovecraft-robert-e-howard-dies-1936
    organisation: artifact-spread
    illustration_type: document-facsimile
    images_required: 1
    date: 1936-06-11
    title: Robert E. Howard shoots himself, and Lovecraft writes the memoir
    impact: med
    description: >
      The correspondence had begun in 1930, when Farnsworth Wright forwarded
      Lovecraft a letter Howard had sent Weird Tales about the Gaelic
      references in [[work:hp-lovecraft/the-rats-in-the-walls|The Rats in
      the Walls]]. It ran for six years and drew Howard into the circle
      Lovecraft maintained by post, introducing his correspondents to each
      other, lending them his invented names and pushing them to publish. On
      June 11, 1936, told that his comatose mother would not wake, Howard
      walked out to his car and shot himself. Lovecraft wrote a short memoir,
      "In Memoriam: Robert Ervin Howard", almost immediately and circulated
      it among his correspondents, and consoled Howard's father by letter.
      He had nine months to live.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://en.wikipedia.org/wiki/Robert_E._Howard"

  - id: hp-lovecraft-dies-1937
    organisation: immersion
    illustration_type: portrait-of-absence
    images_required: 1
    date: 1937-03-15
    title: Dies at 46, having never had a book of his own properly published
    impact: high
    description: >
      Afraid of doctors all his life, Lovecraft was not examined until a
      month before his death, by which point the cancer of his small
      intestine was past treating. He entered Jane Brown Memorial Hospital
      on March 10, 1937, and died there five days later; in keeping with the
      scientific habits of a lifetime, he kept a diary of his own symptoms
      until he could no longer hold a pen. He was buried on March 18 in the
      Phillips family plot at Swan Point Cemetery, named on the family
      monument beside his parents. Nothing he had written had ever appeared
      as a book of his own except
      [[work:hp-lovecraft/the-shadow-over-innsmouth|The Shadow over
      Innsmouth]], issued in 1936 by a small press in 400 error-ridden
      copies of which only about 200 were ever bound, the rest destroyed
      when the publisher folded. In 1977 his readers paid for a headstone of
      his own and cut into it a line from one of his letters: I AM
      PROVIDENCE.
    spoilerAfter: null
    sources:
      - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
      - "https://www.hplovecraft.com/life/biograph.aspx"
sources:
  - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
  - "https://www.hplovecraft.com/life/"
