id: john-shirley
name: John Shirley
aka: []
born: 1953-02-10
died: null
bio: >
  American novelist, short-story writer, screenwriter and musician. Born in
  Houston, Texas, and raised largely in and around Portland, Oregon. Over
  more than 80 books he has moved between pioneering cyberpunk
  ([[work:john-shirley/city-come-a-walkin|City Come A-Walkin']], the
  [[franchise:john-shirley|A Song Called Youth]] trilogy), visceral
  splatterpunk-associated horror ([[work:john-shirley/wetbones|Wetbones]],
  the Bram Stoker Award-winning collection
  [[work:john-shirley/black-butterflies|Black Butterflies]]), a long run of
  licensed tie-in novels, and, from 2022, the Spur Award-winning Cleve Trewe
  western series. He was the initial screenwriter on the 1994 film The Crow,
  before David Schow reworked the script, and has written 23 song lyrics
  recorded by Blue Öyster Cult while fronting his own punk and post-punk
  bands (Sado-Nation, Obsession, the Panther Moderns, currently the Screaming
  Geezers). He married Michelina "Micky" Shirley in 1992; they have three
  adult sons. He lives in Vancouver, Washington.
pseudonyms:
  - name: D. B. Drumm
    note: >
      House pseudonym for the post-apocalyptic men's-adventure series
      Traveler, shared across its run with other writers (its creator Ed
      Naha among them, per ISFDB's series record). Shirley wrote six of its
      volumes (1984-1986); the other numbered entries are not his and are
      not part of this bibliography.
  - name: John Cutter
    note: >
      Pseudonym for his own 11-volume mercenary-adventure series The
      Specialist (1984-1985); unlike D. B. Drumm, ISFDB records every
      numbered entry as his alone.
  - name: Ralph Compton
    note: >
      Not a personal pen name but the continuing house byline of the
      Western writer Ralph Compton (d. 1998), used posthumously by a
      rotating set of ghostwriters for his estate. Shirley wrote two of
      these novels (2020): Prairie Fire, Kansas and Broken Rider.
