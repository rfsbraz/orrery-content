id: liza-marklund
name: "Liza Marklund"
aka: []
born: 1962-09-09
died: null
bio: >
  Liza Marklund is a Swedish journalist and crime novelist best known for
  the Annika Bengtzon series, following a Stockholm tabloid reporter, which
  has been published in some forty languages. Her debut novel The Bomber
  (1998) won the Poloni Prize for best Swedish crime novel by a woman, and
  she was the second Swedish author, after Stieg Larsson, to reach number
  one on the New York Times bestseller list. She co-wrote
  [[work:james-patterson/the-postcard-killers|The Postcard Killers]] (2010)
  with James Patterson.
