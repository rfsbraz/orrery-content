# Global author entity. Authors are referenced by id from franchises and works
# (authorIds / withAuthorIds), so the same person resolves the same everywhere.
# Author-LIFE events live here; franchise-specific events belong in
# content/franchises/tana-french/events.yaml. The three lifeEvents below are a
# small set of well-sourced anchors rather than a complete account of the life.
#
# BIRTHPLACE, stated carefully because a wrong version is in wide circulation.
# Wikipedia's infobox and prose give Burlington, Vermont, United States (10 May
# 1973), sourced to French's own publisher-hosted biography at Bookreporter.com
# and corroborated by her Wikipedia category tags ("Actors from Burlington,
# Vermont", "American emigrants to Ireland"). Portuguese retail listings for
# her books (WOOK's own author bio, checked directly on three separate product
# pages) instead state she was "born in Ireland" ("Tana French nasceu em 1973,
# na Irlanda"), with no citation of its own. The Vermont birth, an itinerant
# childhood, and her permanent move to Dublin in 1990 are the more heavily
# sourced and internally consistent account and are what this entry records;
# the Irish-birth claim looks like retail-copy shorthand for "the Irish
# novelist" rather than a competing biographical fact.
id: tana-french
name: Tana French
aka: ["Tana Elizabeth French"]
born: 1973-05-10
died: null
# PORTRAIT. No licensed photograph is recorded. Wikidata's entry for her
# (Q271423) carries no P18 image claim, and none of her 23 Wikipedia language
# editions (English, German and French, plus Spanish, Italian, Portuguese,
# Polish, Swedish, Norwegian, Czech, Romanian, Asturian, Ukrainian, Russian,
# Japanese, Chinese, Hebrew, Armenian, Bulgarian, Arabic (x2), Uzbek and
# Esperanto - she has no Irish-language article at all) carries an infobox or
# lead image. Wikimedia Commons holds no author photograph of her (checked by
# an exact-title search, a broader author-plus-"writer" search, and by
# attempting her own Commons category, which does not exist - the only file
# matches are unrelated photographs that happen to be captioned with quotes
# from her novels). Openverse's full aggregation (Flickr plus its other
# indexed providers) turns up nothing but book-quote graphics and unrelated
# Antananarivo travel photos. She has never been interviewed by Wikinews. She
# has appeared at the West Cork Literary Festival (2018) and the
# International Literature Festival Dublin (2026), but neither festival runs
# a CC-licensed Flickr/media account with a photo of her, and Commons has no
# Wikimedia-photo-a-thon category for either festival; the surviving press
# photography of those appearances (Irish Times staff photographers) is
# conventionally copyrighted. The Library of Congress Prints & Photographs
# catalog has zero hits under her name; a separate LOC page for her 2021
# National Book Festival appearance exists but reuses the same photo already
# found on her own site, captioned only "Photo credit: Jessica Ryan" with no
# rights grant. Her own site (tanafrench.com) and her Penguin Random House
# author page both carry that credited author photo (© Jessica Ryan) and a
# second one (© Steve Pyke) respectively, but neither states any
# editorial-use permission; PRH's separate media-queries page is a directory
# of per-imprint publicity contact emails (including Viking, her own
# imprint), not a press kit, and offers no downloadable image or reuse terms.
# The Mystery Writers of America's member-directory entry for her (the body
# behind the Edgar Award, one of the four her debut novel won alongside the
# Anthony, Macavity and Barry) carries no photograph at all.
#
# FORENSIC FOLLOW-UP PASS. Rather than checking source categories again, this
# pass searched the open web broadly for every distinct photograph of her in
# circulation and traced each back to its rights holder - downloading files
# and reading them with exiftool rather than trusting captions. It closes off
# both photographs already on record rather than finding a third. The Steve
# Pyke portrait (PRH's author page, reused unchanged by Cultured Magazine's
# April 2026 profile under the same credit) is confirmed a licensed Getty
# Images news photo: Getty's own listing describes "Tana French ...
# photographed ... at the Lilliput publishing house in Stoneybatter, Dublin",
# dated June 2025 - wire-service stock, and so not a candidate regardless of
# any future rights-clearance angle. The Jessica Ryan portrait turns out to
# be more widely mirrored than the earlier pass found: RTÉ Culture's own
# article ("On the hunt", rte.ie, 27 March 2024) runs the identical
# photograph - same close-cropped red hair, same stone-wall backdrop,
# confirmed by direct visual comparison against the Library of Congress's
# copy - but with no photographer credit at all, meaning RTÉ is
# redistributing the same rights-encumbered image rather than offering an
# independently licensed one. Every downloadable copy was checked file-by-
# file: the Library of Congress's own copy is the only one that still
# carries embedded rights data, an EXIF Copyright field reading "Jessica
# Ryan" - confirming the rights holder from the file itself rather than a
# caption, but granting no reuse permission; every other copy (PRH,
# tanafrench.com, RTÉ, Cultured) has had its metadata stripped by its
# hosting CMS. A search for a "Jessica Ryan" with an independent portfolio
# ran into the name's ubiquity: an Irish IPPA-registered "Photography by
# Jessica" (photographybyjessica.ie), several same-named US wedding/family
# photographers, and one Dublin-based about.me profile with no book or
# author connection - none confirmed as the same person, so the credit
# stays a dead end rather than a lead. Irish Times staff photography (Nick
# Bradshaw, 2024 and 2025; Alan Betson, 2026) and the West Cork Literary
# Festival's own Facebook page (2018) were also checked and remain
# conventionally copyrighted with no reuse terms stated, consistent with
# the earlier pass's finding for press and festival photography generally.
# DELIBERATE EXCEPTION, Rodrigo's explicit call rather than a normal
# clearance: rather than leave the slot empty, the Jessica Ryan portrait
# above is used credited-but-unlicensed, the way general editorial and fan
# coverage of authors commonly does, not under any of this skill's usual
# rights tiers. Chosen over the Steve Pyke/Getty photo because a wire-service
# stock image is the one candidate actually excluded outright; a named,
# individually-credited photographer with no stated terms is the weaker
# instrument to enforce against for a small, credited, non-commercial-in-
# spirit use.
images:
  portrait: "https://www.loc.gov/static/managed-content/uploads/sites/7/2021/07/French-Tana-NBF2021.jpg"
  portraitCredit: "Jessica Ryan (credited, not independently rights-cleared)"
  portraitSource: "https://www.loc.gov/events/2021-national-book-festival/authors/item/n2006077370/tana-french/"
bio: >
  American-born Irish crime novelist and stage actress. Born in Burlington,
  Vermont, to an economist father whose work took the family to Ireland,
  Italy and Malawi during her childhood, she attended Trinity College
  Dublin, trained as a professional actor, and has lived in Dublin since
  1990. She worked in theatre, film and voiceover through her twenties,
  writing her debut novel [[work:tana-french/in-the-woods|In the Woods]]
  (2007) in the lulls between castings; it won the Edgar, Anthony, Macavity
  and Barry awards for best first novel and began the six-book Dublin Murder
  Squad series, which rotates its lead detective from book to book while
  supporting characters recur and take the case in turn. She followed it
  with the standalone [[work:tana-french/the-witch-elm|The Witch Elm]]
  (2018) and the Cal Hooper trilogy set in rural County Ireland
  ([[work:tana-french/the-searcher|The Searcher]],
  [[work:tana-french/the-hunter|The Hunter]] and
  [[work:tana-french/the-keeper|The Keeper]], 2020-2026). She lives in
  Dublin with her husband and two daughters.
pseudonyms: []
lifeEvents:
  - id: french-born-1973
    organisation: full-bleed-vista
    illustration_type: map-route
    images_required: 1
    date: 1973-05-10
    title: Born in Vermont, raised across four countries
    impact: med
    description: >
      Born Tana Elizabeth French in Burlington, Vermont, to Elena
      Hvostoff-Lombardi and David French, an economist who worked on
      resource management for the developing world. His postings took the
      family to Ireland, Italy, the United States and Malawi during her
      childhood, an itinerant, outsider-looking-in upbringing that recurs in
      her fiction's own outsiders: Rob Ryan's invented English accent in
      [[work:tana-french/in-the-woods|In the Woods]], and, most literally,
      the retired Chicago detective who moves to rural Ireland in the Cal
      Hooper trilogy.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Tana_French
      - https://www.bookreporter.com/authors/au-french-tana.asp

  - id: french-settles-dublin-1990
    organisation: beside
    illustration_type: place-portrait
    images_required: 1
    date: 1990
    title: Settles permanently in Dublin
    impact: med
    description: >
      Enrolled at Trinity College Dublin and trained there as a professional
      actor; has lived in Dublin ever since. Every one of her ten novels to
      date is set in Ireland, and all but the Cal Hooper trilogy in Dublin
      itself, making the city and its Murder Squad the constant her rotating
      cast of detectives investigates against.
    spoilerAfter: null
    sources: [https://en.wikipedia.org/wiki/Tana_French]

  - id: french-debut-written-between-castings-2007
    organisation: artifact-spread
    illustration_type: manuscript-proof
    images_required: 1
    date: 2007-01-30
    title: Writes a debut novel between acting jobs
    impact: high
    description: >
      Trained and working as a stage, film and voiceover actor through her
      twenties, French wrote [[work:tana-french/in-the-woods|In the Woods]]
      in her early 30s during the months-long lulls between castings. It won
      the 2008 Edgar, Anthony, Macavity and Barry awards for best first
      novel and made her, in The Independent's phrase, "the First Lady of
      Irish Crime" - a career pivot from performing other people's words to
      writing detectives whose defining trait is how convincingly they
      perform for one another and for their suspects.
    spoilerAfter: null
    sources:
      - https://en.wikipedia.org/wiki/Tana_French
      - https://www.washingtonpost.com/lifestyle/style/in-tana-frenchs-broken-harbor-the-mundane-sets-stage-for-mayhem/2012/08/02/gJQAiCmRSX_story.html

