# Minimal collaborator stub - sole editor of The Story of Kullervo. Flieger
# is independently one of the most cited Tolkien scholars (Splintered
# Light, Interrupted Music, A Question of Time), but her only editorial
# CREDIT on a J. R. R. Tolkien-attributed work in this catalogue is this
# one book, so the bio stays scoped to that rather than reaching into her
# separate career as a critic.
id: verlyn-flieger
name: Verlyn Flieger
born: 1933
died: null
bio: >
  American Tolkien scholar and Professor Emerita of English at the
  University of Maryland; edited
  [[work:jrr-tolkien/the-story-of-kullervo|The Story of Kullervo]] (2015),
  [[author:jrr-tolkien|J. R. R. Tolkien]]'s unfinished 1914-15 retelling of
  a tale from the Finnish Kalevala, an early seed of the legendarium.
sources:
  - https://en.wikipedia.org/wiki/Verlyn_Flieger
