bio: >
  John Connolly is an Irish novelist best known for the Charlie Parker
  series, private-detective crime fiction shading into horror and the
  supernatural, begun with Every Dead Thing (1999). He worked for five years
  as a journalist at The Irish Times before turning to fiction full time, and
  his novels have won the Shamus, Barry, Agatha, Anthony and Edgar awards. He
  co-wrote the nonfiction book
  [[work:james-patterson/filthy-rich|Filthy Rich]] (2016) with James
  Patterson.
