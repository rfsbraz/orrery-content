# Minimal collaborator stub: exists so withAuthorIds on
# jk-rowling/fantastic-beasts-the-secrets-of-dumbledore resolves. His long
# career adapting other authors' novels for the screen (all eight main Harry
# Potter films but one, Wonder Boys, The Fabulous Baker Boys) is out of scope
# here.
id: steve-kloves
name: Steve Kloves
aka: ["Stephen Keith Kloves"]
born: 1960-03-18
died: null
bio: >
  American screenwriter, director and producer, born in Austin, Texas.
  Adapted all but one of the main Harry Potter novels for film before
  co-writing [[work:jk-rowling/fantastic-beasts-the-secrets-of-dumbledore|
  Fantastic Beasts: The Secrets of Dumbledore]] (2022) with
  [[author:jk-rowling|J. K. Rowling]], the only Fantastic Beasts screenplay
  she did not write alone.
sources:
  - https://en.wikipedia.org/wiki/Steve_Kloves
  - https://en.wikipedia.org/wiki/Fantastic_Beasts:_The_Secrets_of_Dumbledore
