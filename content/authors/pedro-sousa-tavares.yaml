# Minimal collaborator stub. Journalist; grandson of
# [[author:sophia-de-mello-breyner-andresen|Sophia de Mello Breyner Andresen]]
# (son of her daughter, poet Maria Andresen de Sousa Tavares). No
# independent Wikipedia article or bibliographic record giving a birth
# date was found, so it stays null.
id: pedro-sousa-tavares
name: Pedro Sousa Tavares
born: null
died: null
bio: >
  Portuguese journalist. In 2009 an unfinished story fragment was found
  among his grandmother
  [[author:sophia-de-mello-breyner-andresen|Sophia de Mello Breyner
  Andresen]]'s papers, five years after her death; at the invitation of
  his aunt, poet Maria Andresen de Sousa Tavares, he wrote an ending for
  it, published as
  [[work:sophia-de-mello-breyner-andresen/os-ciganos|Os Ciganos]] (2012) -
  his literary debut.
sources:
  - "https://sol.sapo.pt/2012/10/14/conto-os-ciganos-de-sophia-de-mello-breyner-foi-acabada-pelo-seu-neto/"
