# Editions of Cormac McCarthy: 16 English (en) and 13 Portuguese (pt-PT).
#
# COVERAGE
#   en     16 of 17 works. Every published book has one English edition; the
#          sole gap is The Kekulé Problem (see below).
#   pt-PT  13 editions over 13 of 17 works, all from a single publisher and
#          translator. See "THE PORTUGUESE RUN" below for why it stops there.
#
# English editions are carried here because English originals are what drive
# the exact-edition store links. No `title` is set on any English entry: the
# work title IS the published title, and repeating it would manufacture a
# translation event that never happened. All 15 novel/play/screenplay entries
# are Vintage International's current trade paperback, the edition McCarthy's
# backlist is sold in today; each ISBN and its publication date were read
# directly off the book's own product page at penguinrandomhouse.com (Vintage
# is a Knopf Doubleday/Penguin Random House imprint), which prints the ISBN in
# both the page title and the "Product Details" block.
#
# THE ONE WORK WITH NO EDITION AT ALL: The Kekulé Problem. McCarthy's only
# essay ran in Nautilus magazine (issue 47, April 20, 2017) and has never been
# collected into a standalone book with its own ISBN. Wikipedia, the Santa Fe
# Institute's own announcement and Nautilus's own site agree it exists only as
# a magazine piece. No entry is coined for a magazine essay; the app will show
# its English title and nothing else, which is correct.
#
# BLOOD MERIDIAN has two current Penguin Random House formats: a Modern
# Library hardcover (9780679641049, $28, 2001 reissue) and the Vintage
# International trade paperback recorded here (9780679728757, $20). The
# paperback is the standard edition a reader reaches for and the one every
# other McCarthy novel here matches in format, so it is the one recorded.
#
# THE GARDENER'S SON carries no ISBN-13 anywhere in print; Ecco Press (a
# HarperCollins imprint not carried on penguinrandomhouse.com) issued it in
# 1996 with only an ISBN-10, 0-88001-481-4, confirmed by the Library of
# Congress record via OpenLibrary (openlibrary.org/isbn/0880014814: Ecco
# Press, 1996, 93pp, "a screenplay"). The isbn13 below is derived from that
# ISBN-10 by the standard conversion (drop the old check digit, prefix 978,
# recompute): 978088001481 -> check digit 6 -> 9780880014816. No source prints
# the 13-digit form directly, so this entry is single-sourced on the ISBN-10
# itself; format is omitted because no record states the binding.
#
# THE COUNSELOR's only book edition is the 2013 Vintage "Movie Tie-in
# Edition" (9780345803597), published alongside Ridley Scott's film; there was
# no earlier standalone printing of the screenplay.
#
# THE PORTUGUESE RUN, and why it stops at 13 of 17.
# All 13 pt-PT editions are Relógio D'Água Editores (Lisbon), every one
# translated by Paulo Faria, read off the publisher's own product pages at
# relogiodagua.pt and cross-checked against a second independent listing
# (WOOK, Bertrand, Fnac or Amazon.com's own product page, all citing the same
# ISBN-13) for every entry below. Every EAN carries a 978-972 or 978-989
# registrant prefix (Portugal); none is 978-85 or 978-65 (Brazil) - the
# Alfaguara "A estrada" edition surfaced during research (9788556522580,
# 978-85 prefix) is Brazilian and is correctly excluded.
#
# Relógio D'Água has translated all 12 novels and The Counselor screenplay.
# It has NOT translated the two plays (The Stonemason, The Sunset Limited),
# The Gardener's Son, or The Kekulé Problem essay - a search of the
# publisher's full author page turned up no Portuguese product for any of
# the four, and no other Portuguese publisher's catalogue does either.
#
# Two of the 13 pt-PT titles print the exact English title unchanged (Stella
# Maris, Suttree) - recorded here per SCHEMA.md, since a matching title is
# still a fact about what the jacket prints, not an omission.
#
# STOCK STATUS (checked against relogiodagua.pt at time of writing): A
# Estrada, Este País Não É para Velhos, Meridiano de Sangue, Nas Trevas
# Exteriores, O Conselheiro, O Passageiro, Stella Maris and Suttree are
# in print. A Travessia, Belos Cavalos, Cidades da Planície, Filho de Deus
# and O Guarda do Pomar are marked "Esgotado" (sold out) on the publisher's
# own site; each still earns its slot here because no other pt-PT edition of
# that work exists, per SCHEMA.md's out-of-print rule.
#
# O GUARDA DO POMAR exists in two Relógio D'Água printings of the same Paulo
# Faria translation: this file records the more recent one, the 2018 reissue
# (9789896416898). An earlier 1996 printing, 9789727083114, is a distinct
# valid ISBN (check-digit verified) for the same text and is not recorded
# separately, since it is not a genuinely different object for a reader - see
# its own note below.

