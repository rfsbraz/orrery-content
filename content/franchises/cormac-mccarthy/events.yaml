# Screen adaptations considered and left out beyond the two below: All the
# Pretty Horses (2000, a critical and commercial failure that changed nothing
# about how the novel itself reads) and The Sunset Limited (HBO, 2011, a
# straight filming of the play with no separate reception story). Neither
# left a mark beyond its own work entry; industry trivia rather than aura.

- id: suttree-reception-1979
  date: 1979
  title: Twenty years in the writing, warmly reviewed, still no bestseller
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:cormac-mccarthy/suttree|Suttree]] reaches print in May 1979,
    twenty years after McCarthy began drafting it in Knoxville. Jerome
    Charyn's New York Times review calls it a doomed "Huckleberry Finn";
    warm notices from Anatole Broyard (also the Times), Guy Davenport in
    National Review and novelist Shelby Foote follow. None of it moves
    copies: as with the rest of McCarthy's early novels, no edition passes
    5,000 hardcover copies.
  spoilerAfter: null
  sources:
    - https://www.nytimes.com/books/98/05/17/specials/mccarthy-suttree.html
    - https://en.wikipedia.org/wiki/Suttree
    - https://en.wikipedia.org/wiki/Cormac_McCarthy

- id: blood-meridian-reception-1985
  date: 1985
  title: A magnum opus nobody buys, until the Times decides otherwise
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:cormac-mccarthy/blood-meridian|Blood Meridian]] gets a lukewarm
    critical and commercial reception on publication in April 1985; even the
    New York Times' own review, admiring the prose while unconvinced by the
    material, is representative, and the book sells only a few thousand
    copies. Two decades later, the same paper's own 2006 survey of the best
    American fiction of the previous twenty-five years ties it for third
    place, and it is now widely called McCarthy's magnum opus and one of the
    great American novels.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Blood_Meridian
    - "https://en.wikipedia.org/wiki/What_Is_the_Best_Work_of_American_Fiction_of_the_Last_25_Years%3F"

- id: all-the-pretty-horses-breakthrough-1992
  date: 1992
  title: The breakthrough, twenty-seven years and five novels in
  scope: industry
  reach: franchise
  impact: high
  description: >
    [[work:cormac-mccarthy/all-the-pretty-horses|All the Pretty Horses]] wins
    the National Book Award and the National Book Critics Circle Award for
    fiction, and becomes McCarthy's first commercial success after five
    novels that had, between them, never produced a bestseller. Prodded by
    his new editor and his first-ever literary agent, he also gives his
    fullest interview in four decades to promote it.
  spoilerAfter: null
  sources:
    - https://www.bookcritics.org/past-awards/1992/
    - "https://en.wikipedia.org/wiki/All_the_Pretty_Horses_(novel)"

- id: the-road-oprah-pulitzer-2007
  date: 2007
  title: "Oprah's pick, the Pulitzer, and one television interview"
  scope: culture
  reach: franchise
  impact: high
  description: >
    Oprah Winfrey selects [[work:cormac-mccarthy/the-road|The Road]] for her
    book club on March 28, and the Pulitzer Prize for Fiction follows on
    April 16. To promote the pick, McCarthy gives Winfrey his first
    television interview ever, at 73, after four decades of near-total press
    silence broken only once before, in 1992. On air he calls the novel,
    about a father and a son, a love story for his own young son, John
    Francis, to whom the book is dedicated.
  spoilerAfter: null
  sources:
    - https://www.today.com/popculture/oprah-makes-road-new-book-club-pick-wbna17831619
    - https://www.today.com/popculture/mccarthy-wins-fiction-pulitzer-road-wbna18139055

- id: the-counselor-reception-2013
  date: 2013
  title: His only original screenplay, and a critical drubbing
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:cormac-mccarthy/the-counselor|The Counselor]] is McCarthy's first
    and only feature screenplay not adapted from one of his own novels,
    directed by Ridley Scott from an original script. Critics dismiss it on
    release as talky and inert, and it lands at 34% on Rotten Tomatoes
    against a cast built around Michael Fassbender, Penélope Cruz, Brad Pitt
    and Cameron Diaz; McCarthy never writes another original screenplay for
    the screen. A cult reappraisal follows in the years after, but only among
    critics, never at the scale of his other adaptations.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Counselor
    - https://screenrant.com/the-counselor-negative-reviews-ridley-scott-response/

- id: no-country-best-picture-2008
  date: 2008
  title: The Coen brothers' adaptation sweeps the Oscars
  scope: culture
  reach: franchise
  impact: med
  description: >
    Joel and Ethan Coen's film of
    [[work:cormac-mccarthy/no-country-for-old-men|No Country for Old Men]]
    wins Best Picture, Best Director and Best Adapted Screenplay at the 80th
    Academy Awards on February 24, with Javier Bardem also winning Best
    Supporting Actor for his performance as Anton Chigurh. It is the first
    time one of McCarthy's own books reaches a mainstream audience through
    the screen rather than the page.
  spoilerAfter: null
  sources:
    - https://www.npr.org/2008/02/25/19333989/no-country-for-old-men-wins-big-at-oscars
    - https://www.cbc.ca/news/entertainment/no-country-for-old-men-wins-oscar-gold-1.696853

- id: kekule-problem-essay-2017
  date: 2017
  title: The novelist publishes an essay on the origin of language
  scope: culture
  reach: franchise
  impact: med
  description: >
    In 2017 McCarthy, a novelist who almost never wrote nonfiction, publishes
    [[work:cormac-mccarthy/the-kekule-problem|The Kekulé Problem]], an essay on
    the unconscious and the origin of language: it argues that the unconscious
    is far older than speech and reasons in images rather than words. The piece
    grows out of decades among the scientists of the Santa Fe Institute and
    takes its title from the chemist August Kekulé's dream of the benzene ring.
    It is his only sustained work of published nonfiction, and the sole
    appearance of his byline in the years between The Counselor (2013) and the
    2022 novels.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Kekul%C3%A9_Problem
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: no-country-breaks-the-silence-2005
  date: 2005
  title: A seven-year silence ends with a lean crime novel
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:cormac-mccarthy/no-country-for-old-men|No Country for Old Men]]
    arrives in 2005, McCarthy's first novel in the seven years since Cities of
    the Plain closed the Border Trilogy. Pared down and propulsive where the
    earlier work was dense, and reworked from an unproduced screenplay, it
    reads as a turn toward crime and the thriller, and it is the book that would
    put his name in front of a mass audience two years later on screen.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/No_Country_for_Old_Men
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: the-crossing-second-border-book-1994
  date: 1994
  title: The trilogy darkens with its second volume
  scope: culture
  reach: franchise
  impact: med
  description: >
    Two years after the breakthrough of
    [[work:cormac-mccarthy/all-the-pretty-horses|All the Pretty Horses]],
    [[work:cormac-mccarthy/the-crossing|The Crossing]] arrives as the second
    Border Trilogy novel and a New York Times bestseller. Bleaker and more
    mythic than the first, it follows a different young man, Billy Parham,
    across three journeys into Mexico, and confirms the trilogy as a single
    sustained project rather than a sequel to a hit.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Crossing_(McCarthy_novel)
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cities-of-the-plain-completes-trilogy-1998
  date: 1998
  title: The Border Trilogy closes
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:cormac-mccarthy/cities-of-the-plain|Cities of the Plain]] completes
    the Border Trilogy, bringing together the two young men introduced
    separately in the first two books on a New Mexico ranch at mid-century. It
    draws the decade-long sequence to a close and, with it, the most sustained
    connected work of McCarthy's career before the 2022 novels.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Cities_of_the_Plain_(novel)
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography
