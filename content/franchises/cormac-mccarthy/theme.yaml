# Branding for the Cormac McCarthy wing (see Orrery CONCEPT §6 - the design
# law, and docs/SCHEMA.md#themeyaml). A stub: palette, display face and
# signature only. `art` (theme.yaml's illustration-language block) is left
# unset here by design; the app degrades to a neutral default without it.
#
# Checked against every existing wing before choosing. The catalogue's other
# arid, near-black wing is jose-luis-peixoto's alentejo-plains: scorched
# earth, wheat-gold. McCarthy's country runs harder and colder than that -
# desert, ash and bone rather than dry farmland - so the palette below keeps
# the same family of near-black grounds but moves the accent from Peixoto's
# wheat-gold (hue ~40) into an ember orange (hue ~21), and stephen-king's
# oxblood (hue ~12, a paperback-spine red) is avoided on the same logic: this
# accent is meant to read as one small coal of warmth against overwhelming
# ash and dark, closer to "the fire" the father and son carry in The Road
# than to blood at all - a restrained, literary choice over the obvious one.
preset: borderland-ash
palette:
  bg: "#100f0d"       # near-black with a warm ash-brown cast - burnt ground
                      # at night, not pure black and not King's warm paper-brown
  surface: "#1a1714"  # a shade lifted, for cards
  ink: "#e9e2d3"      # bone/parchment - high contrast, very readable
  muted: "#8f8779"    # ash-grey, for metadata
  accent: "#c1662c"   # one banked ember-orange, for links and markers only
displayFace: fraunces # from the app's implemented set (fraunces | spectral |
                      # sourceSerif); a characterful literary serif suited to
                      # prose that runs from the King James-cadenced,
                      # near-Biblical sentences of Blood Meridian to the
                      # stripped, unpunctuated dialogue of The Road and Stella
                      # Maris - already used by stephen-king and tana-french,
                      # each for its own reason
signature: rule       # a firm, unadorned architectural line: the flat,
                      # indifferent horizon his landscapes are built from,
                      # and the same discipline as his own famously spare
                      # punctuation
art:
  emblem:
    object: >
      A worn, second-hand portable typewriter sitting alone on a bare plank
      table, one sheet rolled into the platen, its case latches scuffed
      bright where a thumb has opened them thousands of times, everything
      else on the table cleared away.
    why: >
      McCarthy bought a used Olivetti Lettera 32 in a Knoxville, Tennessee
      pawnshop around 1963 for fifty dollars and typed every book he wrote on
      that one machine for the next forty-six years, by his own later
      estimate some five million words, until it was retired and auctioned
      in 2009 (its proceeds benefiting the Santa Fe Institute) and replaced
      with an identical used model bought for a few dollars more, because to
      him the object itself was interchangeable and the discipline it
      enforced was not. One unchanged machine, bought in the exact city
      Suttree never leaves, went on to type Blood Meridian's desert and the
      Border Trilogy's ranch country and The Road's ash without ever being
      swapped for another: it is the single object literally present at the
      writing of both eras, not just a theme common to them.
  motifs:
    - a slow brown river seen through morning fog, a houseboat or fish-camp
      shanty half hidden in the willows along the bank
    - a river-town street of brick storefronts, a market house or a
      jailhouse, seen at dusk with no one on the sidewalk
    - a dry arroyo cutting through creosote and mesquite flat, no water in it
      and no bridge over it
    - a barbed-wire fence line running dead straight to a vanishing point
      across open range, one post leaning
    - a broken line of far mesas or low mountains at the very edge of an
      otherwise empty horizon
    - a dirt track or two-lane blacktop running straight into the distance,
      grey ash or pale dust drifting across it, no traveler anywhere on it
    - bone-pale chaparral flat under a huge, empty sky, no tree offering shade
  atmosphere: >
    A flat, unblinking gaze rather than drama: hardship and violence are
    recorded, never dramatized, the way the prose's own King James cadence
    delivers a killing and a sunrise in the same plain, unpunctuated
    sentence. Heat, cold, river-damp and dust are stated as fact, not
    mood-lighting, and the land is drawn as though it takes no notice of
    what is happening on it. The Appalachian river-fog and hollows carry the
    same indifferent weight as the desert light and the ash of a burned
    country, so early and late books read as one moral country rather than
    two genres stitched together. Never a Western film's warm romance and
    never a postcard's glow: the light stays flat, the horizon final.
  lineCharacter: >
    A dry, half-starved brush line pulled in one continuous stroke wherever
    possible, so it breaks up into a scoured, granular scatter rather than
    thinning to a clean point, closer to a stick dragged through ash and
    caliche dust than a pen laid on wet paper. No cross-hatching and no
    retraced contour: each edge is stated once and left alone, the way the
    prose states a fact once and moves past it without qualification or
    quotation marks. Where the house style allows a lightly imperfect hand,
    this wing puts the imperfection into dryness and scarcity of ink, never
    into tremor.
  backgroundTexture: >
    Bone-pale, coarse-grained paper the color of caliche or spent ash, with
    a faint scorched darkening pooling at the corners as if the sheet had
    been held too near a fire, no laid fibre, no wash: the ground itself
    looks spent rather than aged.
  accentUse: >
    Banked ember-orange on exactly one element per image, never as a fill: a
    single glowing coal in a grate or fire pit, one lit window in an
    otherwise dark building, a strand of sun-rusted wire, or the head of one
    struck match.
  avoid:
    - cowboy-movie pastiche - gunslinger silhouettes, Stetsons, spurs,
      six-shooters drawn as hero props, saloon doors
    - a romanticized desert sunset, travel-poster glow or Grand Canyon
      postcard light
    - literal blood-splatter or gore shown as shock rather than aftermath
    - skulls, longhorn horns, tumbleweeds or cacti used as generic
      shorthand for "the West"
    - Southern-gothic plantation kitsch - hoop skirts, Spanish moss,
      rocking-chair-porch nostalgia - and kudzu-green Georgia iconography,
      already this catalogue's register for a different author
    - the film adaptations' visual identity (No Country for Old Men, All the
      Pretty Horses, The Road, The Counselor) - their casting, poster art
      or color grade
notes: >
  An ash-and-bone register: near-black ground with a warm ash cast, bone-
  parchment ink, and a single banked ember-orange accent used only for links
  and markers, standing for one small warmth persisting through otherwise
  indifferent, violent landscapes rather than for blood or gunfire. No desert
  cliche (skulls, cacti, six-guns), no genre costume; readability first. The
  firm rule signature matches the flat horizons and the discipline of the
  prose itself. The single typewriter on which both eras were written is the
  wing's emblem; the full `art` block is set out above.
