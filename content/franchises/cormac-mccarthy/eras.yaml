# Creative periods - the narrative spine of the aura. Inline references use
# [[type:id|text]] and must resolve.
#
# McCarthy's career carries a received two-part periodisation, geographic and
# biographical rather than evaluative: an early Southern/Appalachian phase
# written in Tennessee, and a later Western/Southwestern phase that begins when
# he left Tennessee for the border country and reset his fiction in the American
# West. It is used, under these names, by the standard reference work and by a
# dedicated scholarly monograph:
#   - Dianne C. Luce, "Reading the World: Cormac McCarthy's Tennessee Period"
#     (University of South Carolina Press, 2009) periodises the first four
#     novels as "McCarthy's Tennessee period", dated 1959-1979, and reads
#     Suttree as its culmination.
#   - "The Cambridge Companion to Cormac McCarthy" (ed. Steven Frye, Cambridge
#     University Press, 2013) is built in these parts: "Beginnings in the
#     American South" (chapters on "McCarthy, Tennessee and the Southern Gothic"
#     and "the Tennessee Novels") and "The Move Westward" (chapters on
#     "McCarthy's Western Novels" and "The Border Trilogy, The Road, and the
#     Cold War").
# The boundary is a sourced fact about his life and settings, not a verdict on
# the books: he moved from Tennessee to El Paso in 1976, a MacArthur Fellowship
# funded his research in the Southwest, and Blood Meridian (1985) is the first
# novel of the Western phase. The 1980-1984 gap between Suttree and Blood
# Meridian holds no published work.
#
# No third "late period" is recorded. Reviewers describe the 2022 Passenger /
# Stella Maris duology as a departure, but that is described evolution, not a
# named received periodisation with a recognised name and sourced edges, so it
# sits inside the Western span rather than being coined into its own era.

- id: the-tennessee-period
  title: The Tennessee Period
  period: "1965-1979"
  themes: [southern gothic, appalachian Tennessee, outcasts and violence, gnostic and existential myth]
  provenance: critical
  description: >
    The four Appalachian novels Dianne Luce's study fixes as McCarthy's
    Tennessee period (1959-1979): [[work:cormac-mccarthy/the-orchard-keeper|The Orchard Keeper]],
    [[work:cormac-mccarthy/outer-dark|Outer Dark]] and
    [[work:cormac-mccarthy/child-of-god|Child of God]], set in a southern
    Appalachia of drifters, outcasts and violence, culminating in the Knoxville
    riverfront underworld of [[work:cormac-mccarthy/suttree|Suttree]]. Written
    in Tennessee in the Southern Gothic line the Cambridge Companion files under
    "Beginnings in the American South"; admired by critics but selling only a
    few thousand copies each.
  note: >
    Luce dates the period 1959-1979 and reads Suttree (1979) as its close; the
    span here runs from the first published novel (1965) to Suttree. McCarthy
    left Tennessee for El Paso in 1976, and Suttree is his last Appalachian
    novel, so the boundary is a fact about setting and biography rather than a
    rounded date.
  sources:
    - https://books.google.com/books/about/Reading_the_World.html?id=8IxM8F912EsC
    - https://books.google.com/books?id=KkXzUOuJqdgC
    - https://en.wikipedia.org/wiki/Cormac_McCarthy

- id: the-western-period
  title: The Western Period
  period: "1985-2022"
  themes: [the American Southwest, frontier and border violence, myth and prophecy, genre reinvention]
  provenance: critical
  description: >
    The Southwestern turn the Cambridge Companion calls "The Move Westward".
    After separating from his second wife and leaving Tennessee for El Paso in
    1976, and with a MacArthur Fellowship funding his research along the border,
    McCarthy reset his fiction in the American West with
    [[work:cormac-mccarthy/blood-meridian|Blood Meridian]] (1985), the
    scalp-hunter novel now widely read as his magnum opus. The commercial
    breakthrough of [[work:cormac-mccarthy/all-the-pretty-horses|All the Pretty Horses]]
    and the rest of the Border Trilogy followed, then
    [[work:cormac-mccarthy/no-country-for-old-men|No Country for Old Men]] and
    the Pulitzer-winning [[work:cormac-mccarthy/the-road|The Road]].
  note: >
    The sourced hinge is the era's opening - the 1976 move to the Southwest and
    Blood Meridian (1985) as the first Western novel; the Cambridge Companion
    groups even The Road under "The Move Westward". The 2022 Passenger / Stella
    Maris duology, steeped in physics and mathematics from McCarthy's Santa Fe
    Institute years, is read in its reviews as a late departure but carries no
    separately named received periodisation, so it falls inside this span rather
    than forming a third era. The span ends at the last published work (2022);
    McCarthy died in 2023.
  sources:
    - https://books.google.com/books?id=KkXzUOuJqdgC
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
