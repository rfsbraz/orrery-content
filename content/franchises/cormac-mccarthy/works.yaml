# Bibliography (Works) - the abstract books/plays/screenplay/essay; editions
# and covers are a separate layer. IDs are STABLE and permanent (user data
# references them).
#
# Sourced from English Wikipedia's main article and its "Cormac McCarthy
# bibliography" companion page (fetched directly, and they agree on every
# year below), cross-checked against the dedicated Wikipedia article for
# each work published as its own page (The Passenger, Stella Maris, The
# Sunset Limited, The Stonemason, The Kekulé Problem, The Counselor).
#
# canonTier convention for this franchise:
#   core     - the 12 novels: the narrative-fiction spine every "Notable
#              works" list and the bibliography's own "Novels" table build
#              from.
#   extended - the 2 plays, the 2 screenplays and the 1 essay: genuinely his,
#              in forms he published relatively rarely, off the novel
#              reading spine.
# No apocrypha entries: no anthology contribution, introduction or
# editor credit is on record for this author.
#
# NOT INCLUDED, and why:
# - Four early short stories in student and literary magazines before his
#   first novel ("Wake for Susan", 1959; "A Drowning Incident", 1960;
#   "Bounty", 1965; "The Dark Waters", 1965) were never gathered into a
#   book of their own, the same reasoning that excludes uncollected
#   periodical work in this catalogue's other author wings. McCarthy's own
#   infobox tally ("three short stories") does not even agree with his
#   bibliography page's own table of four, which is a second reason no
#   entry is coined from either count here.
# - Three screenplays never reached publication or production as written:
#   an unproduced 1978 screenplay called "Cities of the Plain" (unrelated
#   to the 1998 novel of the same title beyond the shared title itself),
#   "Whales and Men" (late 1980s), and a 1987 screenplay titled "No Country
#   for Old Men" that predates and is a wholly different work from the 2005
#   novel. None has a purchasable text a reader could encounter, so none is
#   a book this catalogue can honestly list.

# --- Novels ---

- id: cormac-mccarthy/the-orchard-keeper
  title: "The Orchard Keeper"
  authorIds: [cormac-mccarthy]
  published: 1965
  subseries: null
  canonTier: core
  synopsis: >
    In the fading Tennessee backcountry between the World Wars, a boy, an
    old man and the bootlegger who unknowingly killed the boy's father
    circle each other for years without any of them naming what happened.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/outer-dark
  title: "Outer Dark"
  authorIds: [cormac-mccarthy]
  published: 1968
  subseries: null
  canonTier: core
  synopsis: >
    A woman and the brother who fathered her child each set out alone
    across a nameless, Bible-dark Appalachian landscape after he abandons
    the newborn in the woods.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/child-of-god
  title: "Child of God"
  authorIds: [cormac-mccarthy]
  published: 1973
  subseries: null
  canonTier: core
  synopsis: >
    Cast out of the last edges of his Tennessee community, an outcast
    squatter descends alone into derangement and violence in the hills
    above the town that rejected him.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/suttree
  title: "Suttree"
  authorIds: [cormac-mccarthy]
  published: 1979
  subseries: null
  canonTier: core
  synopsis: >
    A man who has walked away from his own family lives on a houseboat on
    the Tennessee River in Knoxville, drifting among the drunks, thieves
    and outcasts of the city's underclass, in the novel McCarthy wrote,
    over some twenty years, closest to his own life.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/blood-meridian
  title: "Blood Meridian, or the Evening Redness in the West"
  authorIds: [cormac-mccarthy]
  published: 1985
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A teenage runaway falls in with a scalp-hunting gang along the
    Texas-Mexico border in the 1850s, dominated by the towering, hairless
    Judge, one of American fiction's most argued-over embodiments of
    violence. Initially met with lukewarm notices, the MacArthur
    Fellowship-funded novel is now widely called McCarthy's magnum opus.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/all-the-pretty-horses
  title: "All the Pretty Horses"
  authorIds: [cormac-mccarthy]
  published: 1992
  subseries: "The Border Trilogy"
  canonTier: core
  featured: true
  synopsis: >
    Two young Texans ride south into Mexico in 1949 chasing a vaquero life
    already gone from home, and find love and violence instead. McCarthy's
    first commercial success, after five earlier novels written in
    relative obscurity, winning the National Book Award and the National
    Book Critics Circle Award.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/the-crossing
  title: "The Crossing"
  authorIds: [cormac-mccarthy]
  published: 1994
  subseries: "The Border Trilogy"
  canonTier: core
  synopsis: >
    A teenager crosses the border into Mexico three times over the years
    that follow, first to return a trapped wolf to its mountains, then in
    search of the men who killed his family.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/cities-of-the-plain
  title: "Cities of the Plain"
  authorIds: [cormac-mccarthy]
  published: 1998
  subseries: "The Border Trilogy"
  canonTier: core
  synopsis: >
    John Grady Cole and Billy Parham, the protagonists of the trilogy's
    first two novels, share work on the same New Mexico ranch, and John
    Grady is drawn into a doomed love affair with a Juarez prostitute.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/no-country-for-old-men
  title: "No Country for Old Men"
  authorIds: [cormac-mccarthy]
  published: 2005
  subseries: null
  canonTier: core
  synopsis: >
    A welder who stumbles on a drug deal gone wrong, and the cash left
    behind, is hunted across the Texas borderlands by a hitman who answers
    to a logic of his own, while an aging sheriff struggles to make sense
    of a violence he no longer recognizes as belonging to his country.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/the-road
  title: "The Road"
  authorIds: [cormac-mccarthy]
  published: 2006
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A father and his young son walk a devastated, ash-grey America toward
    the coast, with nothing between them and starvation, cannibalism and
    cold but each other. Winner of the 2007 Pulitzer Prize for Fiction.
  sources:
    - https://en.wikipedia.org/wiki/Cormac_McCarthy
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

# The Passenger subseries. Named identically to its own first entry, on
# sourced evidence rather than by accident: McCarthy's own bibliography page
# lists these as "Book 1" and "Book 2" in "The Passenger Series", and the
# Czech (Argo, 2024) and Greek (Gutenberg, 2022) editions both title Stella
# Maris itself as "The Passenger, 2" / "The Passenger, Vol. 2" on the book.
# `connections` is not set between the two: subseries already threads them,
# and SCHEMA.md's own rule is not to duplicate that with a connection.

- id: cormac-mccarthy/the-passenger
  title: "The Passenger"
  authorIds: [cormac-mccarthy]
  published: 2022
  subseries: "The Passenger"
  canonTier: core
  synopsis: >
    A salvage diver working the Gulf coast in the early 1980s, haunted by
    his physicist father's part in building the atomic bomb and by his
    mathematician sister's death a decade before, is pursued by men who
    want something from a sunken plane he cannot explain.
  sources:
    - https://en.wikipedia.org/wiki/The_Passenger_(McCarthy_novel)
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/stella-maris
  title: "Stella Maris"
  authorIds: [cormac-mccarthy]
  published: 2022
  subseries: "The Passenger"
  canonTier: core
  synopsis: >
    Set a decade before her brother's story, mathematics prodigy Alicia
    Western checks herself into a Wisconsin psychiatric facility in 1972,
    and across dialogue-only conversations with her psychiatrist works
    through the ideas and losses that will end in her death. McCarthy's
    last novel, published six weeks after its companion.
  sources:
    - https://en.wikipedia.org/wiki/Stella_Maris_(novel)
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

# --- Plays, screenplays and essay ---

- id: cormac-mccarthy/the-stonemason
  title: "The Stonemason"
  authorIds: [cormac-mccarthy]
  published: 1995
  subseries: null
  canonTier: extended
  synopsis: >
    A play in five acts, written in the late 1980s: three generations of
    the Telfair family, Black stonemasons in Louisville, told through the
    monologues of Ben Telfair as he chooses the family trade over college.
    Rarely produced.
  sources:
    - https://en.wikipedia.org/wiki/The_Stonemason
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/the-gardeners-son
  title: "The Gardener's Son"
  authorIds: [cormac-mccarthy]
  published: 1996
  subseries: null
  canonTier: extended
  synopsis: >
    In the Reconstruction-era company town of Graniteville, South Carolina, a
    one-legged mill worker's smoldering resentment toward the mill-owning
    family that maimed and then discarded him builds toward a real 1876
    murder. McCarthy's first screenplay, written in 1976 at director Richard
    Pearce's request and aired as a PBS television film in January 1977;
    published as a book only in 1996, containing scenes and lines cut from
    the broadcast.
  sources:
    - https://en.wikipedia.org/wiki/The_Gardener%27s_Son
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography
    - https://openlibrary.org/isbn/0880014814

- id: cormac-mccarthy/the-sunset-limited
  title: "The Sunset Limited"
  authorIds: [cormac-mccarthy]
  published: 2006
  subseries: null
  canonTier: extended
  synopsis: >
    Two men, an unnamed professor who has just tried to jump in front of a
    train and the ex-convict who stopped him, spend a single afternoon
    arguing over faith, despair and whether life is worth living. Published
    with the subtitle "A Novel in Dramatic Form", which the play's own
    paperback edition uses to unsettle its own genre.
  sources:
    - https://en.wikipedia.org/wiki/The_Sunset_Limited_(play)
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/the-counselor
  title: "The Counselor"
  authorIds: [cormac-mccarthy]
  published: 2013
  subseries: null
  canonTier: extended
  synopsis: >
    An original screenplay, not adapted from any McCarthy novel: a Texas
    lawyer's single greedy step into a drug deal unravels his life and
    everyone connected to it. Directed by Ridley Scott and published as a
    book alongside the film's release.
  sources:
    - https://en.wikipedia.org/wiki/The_Counselor
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography

- id: cormac-mccarthy/the-kekule-problem
  title: "The Kekulé Problem"
  authorIds: [cormac-mccarthy]
  published: 2017
  subseries: null
  canonTier: extended
  synopsis: >
    McCarthy's only published essay and his first work of nonfiction,
    written for the Santa Fe Institute: starting from chemist August
    Kekulé's dream-discovery of benzene's ring structure, it asks why
    language, unlike the rest of human thought, seems to resist the
    unconscious mind that produces everything else.
  sources:
    - https://en.wikipedia.org/wiki/The_Kekul%C3%A9_Problem
    - https://en.wikipedia.org/wiki/Cormac_McCarthy_bibliography
