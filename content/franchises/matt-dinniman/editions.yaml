# Editions of Matt Dinniman. COVERAGE: 17 of 20 works carry at least one
# edition. The three gaps (backstage-at-the-pineapple-cabaret, apocalypse,
# the-last-yong-shi) are explained below, not unsearched.
#
# THE SELF-PUB-TO-ACE TRANSITION (Dungeon Crawler Carl, books 1-6). Dinniman
# originally self-published these six under his own imprint "Dandy House"
# (2020-2023). Ace Books (Penguin Random House) then acquired PRINT rights
# only, starting Aug 2024, and issued new hardcover editions with new cover
# art; Dinniman kept ebook and audiobook rights. mattdinniman.com's own book
# pages carry this exactly as two dates, "Published" (the Dandy House
# original) and "RePublished" (the Ace edition), for every one of the six.
# Consequently, for books 1-6, the Dandy House PRINT editions found on
# OpenLibrary (paperback/hardcover SKUs from 2020-2023) are now superseded by
# Ace's own print run and are not recorded here; the Dandy House EBOOK stays
# a live, distinct, currently-buyable object (Dinniman never sold ebook
# rights), so it is recorded alongside the Ace print edition on every volume
# where a Dandy House ebook edition/ASIN could be found. Book 1's ebook was
# reissued under a fresh 2025 ISBN (Dandy House re-lists periodically); books
# 2-6 still carry their original 2020/2021/2022/2023 self-pub ebook ASINs,
# with no equivalent refresh found - an asymmetry in the source data itself,
# not a gap in coverage.
#
# Books 7 (This Inevitable Ruin, 2024) and 8 (A Parade of Horribles, 2026)
# were announced on mattdinniman.com as published directly by Ace, with no
# "RePublished" line and no self-pub predecessor claimed. For book 8 that
# holds up under an independent OpenLibrary check. For book 7 it does NOT:
# OpenLibrary carries a real, separately-cataloged "Independently published"
# paperback (ISBN 9798344591230, 722pp, Amazon ASIN B0DLTHPBQJ) dated Nov 3
# 2024 - the exact day mattdinniman.com gives as the book's only publication
# date - alongside Ace's own hardcover (ISBN 9798217190041, 880pp), whose
# OpenLibrary record separately dates it Sept 23 2025 and is independently
# corroborated at that date by isbnsearch.org and matching Amazon/AbeBooks/
# Walmart/eBay listings. Both are recorded below, Ace first as the current
# flagship print edition; the self-pub paperback's existence, on the date the
# author's own site claims for the single "Published" release, is a real
# discrepancy with that site's own claim of no separate self-pub edition, not
# an invention here.
#
# AUDIOBOOKS. This series' audiobooks (Jeff Hays narrating almost every
# volume, per mattdinniman.com's own audio previews) are, by the author's own
# public account, its single largest sales channel, so they are catalogued
# with the same rigor as the print editions rather than as an afterthought.
# Every audiobook `isbn13` below (where present) or Amazon-identifier
# `sources` link (where absent, since Audible editions are ASIN-based, not
# ISBN-based - the schema's own documented no-ISBN case) is traced to a named
# OpenLibrary edition record. One candidate ASIN, for a "Kaiju: Battlefield
# Surgeon" audiobook, does not resolve on its own Audible product page (a
# live 404) and is not recorded; Kaiju's own mattdinniman.com page still
# reads "Audiobook (coming soon)", consistent with no real edition existing
# yet.
#
# FOREIGN LANGUAGES. pt-PT and pt-BR are different translations by different
# publishers and are tagged accordingly (978-989 and 978-655 prefixes
# respectively, both checked against the registrant-prefix table): Kathartika
# (Portugal, book 1 only, confirmed on the publisher's own catalogue page)
# and HarperCollins Brasil (Brazil, book 2 only so far). French is the
# furthest along: Lorestone has released books 1-5 (2024-2026), all
# corroborated on OpenLibrary with `translated_from: eng` and French cover
# art. German (FISCHER Tor, books 1-2, book 1's own publisher page names
# translator Ruggero Leo and lists books 3-4 as "Zukünftig"/forthcoming) and
# Spanish (Ediciones B, book 5 only so far - an unusual place for a Spanish
# program to start; no earlier Spanish volume was found anywhere searched,
# so this is recorded as a real, if odd, market fact) round out what a
# targeted search turned up. No Italian, Polish, Dutch or Japanese edition of
# anything in this wing was found.
#
# EXCLUDED, DELIBERATELY:
#   - Two "Diversified Publishing" OpenLibrary records (Dungeon Anarchist's
#     Cookbook, ISBN 9798217287185; Gate of the Feral Gods, ISBN
#     9798217287192) are thin, single-source, Better-World-Books-imported
#     records with no format and no cover; a second lookup on the same two
#     ISBNs returned a different publisher ("Random House") for both. Real
#     PRH paperback reprints likely sit behind these numbers, but the
#     publisher-name conflict between the two sources consulted was not
#     resolved, so neither ISBN is recorded rather than shipping a publisher
#     name that might be wrong.
#   - A second UK "Penguin Books, Limited" ISBN exists alongside the one
#     recorded for several volumes (e.g. Dungeon Crawler Carl: both
#     9780241816271 and 9780241816264, identical page count, identical year,
#     no distinguishing format field on either record) - almost certainly a
#     hardback/paperback pair, but which is which could not be confirmed, so
#     only the Ace US edition is recorded for the plain "en" market; nothing
#     about the text differs between the US and UK printings regardless.
#   - "Backstage at the Pineapple Cabaret" has no edition here: it is
#     published only as serialized backmatter fragments inside the Ace
#     hardcover editions of the main series (works.yaml's own account),
#     confirmed by zero results on an OpenLibrary title search, an empty
#     Audible catalogue search, and ISFDB listing all eight fragments with no
#     standalone ISBN/ASIN on any of them.
#   - "Apocalypse" (2010) and "The Last Yong-Shi" (2013) have no edition
#     here. Both are real, ISFDB-attested short stories, but each survives
#     only inside a now-defunct small-press MULTI-AUTHOR venue (Necrotic
#     Tissue, a horror magazine that ceased circa 2011, ISBN
#     978-0-9824969-2-3; and the anthology Clockwork Chaos, ISBN
#     978-1-937051-56-3) - recording either ISBN here would misattribute a
#     book with a dozen other names on it to a single Dinniman story, the
#     same reasoning this catalogue applies to anthology-only short fiction
#     elsewhere, and no standalone single-author printing of either story was
#     found.
#
# SOURCING. Every ISBN below was opened at a named OpenLibrary edition record
# (per-ISBN or per-work JSON, not the search index alone) and its check
# digit recomputed by hand; three (Kathartika's pt-PT edition, the two
# Necro/Elastic-Press-descended small-press numbers used only in the header
# above) were additionally cross-checked against the publisher's own
# catalogue page or ISFDB directly. Worked example, Kathartika's "Carl, o
# Herói das Masmorras" (9789895626762):
#   digits   9 7 8 9 8 9 5 6 2 6 7 6
#   weights  1 3 1 3 1 3 1 3 1 3 1 3
#   products 9 21 8 27 8 27 5 18 2 18 7 18   sum = 168
#   168 mod 10 = 8  ->  check digit = 10 - 8 = 2  ->  ...762  OK

