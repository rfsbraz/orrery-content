# Creative periods. None: no received periodisation of this career exists.
#
# The publication record has shape - a 2003-2019 stretch across four genres
# and near-anonymity, then the LitRPG run from 2019 on that made him a
# bestseller - but no source outside this file periodises it. The author's own
# site groups the shelf by series and genre ("The Dungeon Crawler Carl
# Series", then "Matt's Other Books" tagged Sci-Fi Thriller, LitRPG Horror,
# LitRPG Sci-Fi Fantasy, Fantasy Horror, Horror, Fantasy) and never by period;
# asked in 2024 how his writing changed between The Shivered Sky (2003) and
# The Eye of the Bedlam Bride (2023), he answers "greatly" and names no phase.
# John Clute's SF Encyclopedia entry lists the two sequences and no periods.
# Wikipedia carries one undivided "Career" section over a bibliography grouped
# by series. Publishers Weekly, Locus, Slate and the Oakland Review of Books
# write about the Dungeon Crawler Carl books and the LitRPG genre rather than
# about a career with parts.
#
# The 2024 Ace Books acquisition is real, dated and sourced - print rights
# only with digital retained, the first three books bought in April 2024 and
# books one to six in all, the imprint's first LitRPG acquisition, first
# hardcover 27 August 2024 - and it is still the wrong boundary. Era
# membership follows first-publication year, and all six books Ace acquired
# were first published 2020-2023. A line at 2024 would hold four of twenty
# works and exclude every book the acquisition was about. The Ace reissue
# dates sit per-work in works.yaml, where they describe editions.
#
# Dandy House, the author's own imprint, is a real fact that bounds nothing:
# it begins mid-shelf in 2020, leaves 2003-2019 outside it (The Shivered Sky
# was Silver Lake Publishing, 2003), and has not ended - the digital editions
# still carry it alongside the Ace print run.
#
# The 2019/2020 pivot is a life event rather than a period, and unstable as a
# line: the turn to LitRPG is 2017 (Dominion of Blades), the web serial is
# 26 December 2019, the cat-art income ends with the pandemic in 2020, and the
# readership the author himself dates to "around August 2024 when the Penguin
# Random House version hit bookstores, and TikTok discovered it."
