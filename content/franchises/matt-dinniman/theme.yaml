# Branding for the Matt Dinniman wing (see Orrery CONCEPT section 6, the
# design law). This catalogue's first LitRPG/progression-fantasy wing, so there is
# no existing sibling to differentiate from directly; the palette is drawn
# from the shelf's own recurring, sourced facts instead - Earth stripped for
# parts and rebuilt as a hazard-lit dungeon, broadcast as a reality show, with
# the game's own status readouts as the one graphic element every book
# shares - rather than genre costume (no swords, no HUD widgets, no glowing
# runes).
preset: hazard-broadcast
palette:
  bg: "#0c0f0a"        # near-black with a cold, faintly toxic green-black
                        # cast - the void of a mined-out Earth, not a warm
                        # paperback near-black or a cosmic blue-black
  surface: "#171c12"   # a hair lifted, for cards
  ink: "#e9e6d8"        # warm bone/parchment - a battered paperback's page,
                        # readable, not a cold digital white
  muted: "#8d9280"     # dusty grey-green, for metadata
  accent: "#a8c53a"     # a single hazard/status-readout yellow-green, used
                        # sparingly - grounded in the books' own premise
                        # (mined, toxic salvage; the System's glowing HUD
                        # text), not a decorative genre-green. Deliberately
                        # more saturated and warning-toned than the
                        # catalogue's other, oxidised/verdigris greens
                        # (agatha-christie #2f6146, chuck-palahniuk #74a89a,
                        # karin-slaughter #7c9a3e, hp-lovecraft #4a7d72,
                        # fernando-pessoa #4f8f7c, luis-de-camoes #367d3f,
                        # anna-sewell #5a7a4f, umberto-eco #6f7a4c) so it
                        # does not read as one more patina.
displayFace: sourceSerif # the plainest of the curated serifs - the commercial
                          # workhorse serif already picked for this
                          # catalogue's other fast, self-pub-rooted,
                          # unpretentious genre prose (lars-kepler, dan-brown),
                          # not a literary showcase face; matches a career
                          # that started as a serialized web novel
signature: beam           # a bold, straight accent rail the works string
                           # along - read as the vertical descent through the
                           # World Dungeon's numbered floors that structures
                           # the flagship series (and, more loosely, every
                           # subseries in this wing: Dominion of Blades' own
                           # in-game leveling, the Shivered Sky's three-part
                           # war), never a decorative flourish

# The hazard-broadcast accent sits in the same cold, near-black, instrumented
# territory as brandon-sanderson's cosmere-metallic - this catalogue's other
# wing whose magic or game system is drawn as a documented mechanism rather
# than spectacle - which makes it the wing nearest this one. They are kept
# apart by material and register, not mood: Sanderson's mechanism is a magic
# law a scholar studies calmly, on clean blueprint vellum, in one steady
# ruled hand. This wing's mechanism is a game a corporation runs on people
# for ratings - its gauge is welded from stripped Earth wreckage on cheap
# warped pulp paper, and the System's own ruled marks break down into a
# scored, gouged hand the moment the drawing meets the physical world.
#
# The second collision is narrower but real: this wing's ruled half shares
# its unvarying, no-visible-hand quality with chuck-palahniuk's
# clinical-minimal, the catalogue's other wing built on that same even
# ruling-pen line. Palahniuk holds it for an entire drawing - the deadpan
# calm of an institution's laminated instruction card, never broken. This
# wing only ever holds it for half a drawing; the break itself, the instant
# a System-made mark gives way to flesh, wreckage or weather, is what the
# wing is actually about, and Palahniuk's line never breaks at all.
art:
  emblem:
    object: >
      A single salvaged gauge dial - its face welded from mismatched sheet
      scrap, its needle resting partway along a worn arc, no numerals or
      readable markings on it, riveted into a housing patched from at least
      two different scrap sources.
    why: >
      The flagship series turns on one mechanic: surviving a floor keeps the
      crawlers alive, but keeping the audience entertained is what keeps
      them funded and supplied, so a live gauge reading something out is the
      one image every book shares. Its mismatched, welded construction is
      Earth itself, stripped for parts and rebuilt into the dungeon that
      measures them.
  motifs:
    - a status gauge or partly-filled bar, its needle or fill-line the only
      readable thing in the frame, welded into scavenged housing rather than
      drawn as a floating digital readout
    - a heavy stamped or cast threshold plate marking a level change - a
      gate, hatch or barricade meant to be passed once and not again
    - girders, rebar, corrugated panelling and cannibalised machine parts
      repurposed as shelter, tools or barricades - Earth's own wreckage,
      reused rather than reclaimed
    - a spotlight, floodlit arena rim or observation window implying an
      audience watching from outside the frame, never the audience itself
    - an alert Persian cat's silhouette or a show rosette ribbon - Princess
      Donut is a character in the fiction, not a real person, and appears
      wary and physically present, never as a plush mascot
    - a fortified corridor or gauntlet checkpoint under siege, echoing the
      flagship series' floor-by-floor descent in the other subseries' own
      tower-defense and trapped-arena settings
  atmosphere: >
    A dangerous game show being aired live, not an adventure being had: the
    danger is real and the cameras are still rolling. Grimy, enclosed and
    functional - salvage-lit rather than torch-lit, a floodlit arena rather
    than a fantasy vista. Held cold and clinical wherever the System's own
    marks appear, then genuinely rough and endangered wherever the drawing
    meets a body or the wreckage. Avoid the two easy readings this genre
    invites: a glossy anime power fantasy (glowing weapons, triumphant
    poses, magical armour) and a tidy, cosy progression story (friendly
    numbers, comfortable inventories). This reads closer to a wartime
    newsreel with a scoreboard bolted to it than to either.
  lineCharacter: >
    One ruling pen, used two ways. Wherever the System itself has made a
    mark - a gauge, a threshold plate, a level gate - the line is held dead
    straight and mechanically even, no variation, no visible hand: the
    dungeon's own manufacture. Everywhere else - flesh, wreckage, scavenged
    material, weather - the same pen is dragged too fast and pressed too
    hard, producing a scored, gouged line with burrs, double-struck
    corrections and the odd skipped stroke, the way a note gets scratched
    down by someone with no time to make it neat. The contrast between the
    two, inside a single drawing, is the wing's identity.
  backgroundTexture: >
    Cheap mass-market pulp paper stock, the kind a self-published paperback
    is printed on, scuffed and faintly laminated in patches like reused
    hazard signage, warped at the edges as if it has been through weather
    and handled hard.
  accentUse: >
    The hazard yellow-green lights exactly one status-reading mark per
    image - a gauge's needle, a bar's fill-edge, or a single stencilled
    hazard notch standing in for a numeral - and nothing else in the frame.
    Never a fill, never a wash, never the gauge's whole face or housing:
    only the live reading itself. The gauge is a single dial with one
    needle, not concentric rings with riding nodes, and is never staged to
    be mistaken for the orrery motif, which belongs elsewhere in the frame
    if it appears at all.
  avoid:
    - floating glowing numbers, damage pop-ups, minimaps or any other
      literal HUD widget pasted over the scene
    - generic isekai/anime power-fantasy armour, glowing magic weapons,
      triumphant hero poses
    - Princess Donut played as a cute plush mascot rather than a wary,
      physically present animal
    - any likeness of Matt Dinniman himself, for any career or life event -
      he is living; draw the room, the object or the consequence instead
    - glossy video-game concept-art rendering, chrome or neon "gamer"
      surfaces
    - legible text, digits or UI chrome standing in for the System's
      readouts - the gauge and the threshold plate carry that idea without
      ever needing to be read

notes: >
  A cold, near-black ground with one warning-toned yellow-green accent used
  exactly once per surface, and a plain commercial serif rather than a
  literary display face: the intent is to read as an interface (a status
  readout, a hazard marker) rather than as fantasy-poster costume, since the
  actual shared image across this author's shelf is a game system's glowing
  text over a ruined world, not a sword or a dragon. A curator tunes the
  exact hues.
