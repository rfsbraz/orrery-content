# Bibliography (works). IDs are STABLE and permanent (user data references
# them). The default reading order (all works in publication order) is
# DERIVED from this file.
#
# Coverage: the complete Dungeon Crawler Carl series to date (8 novels, 2020-
# 2026, ongoing - the author has stated two more volumes are planned to
# complete it), its in-hardcover backmatter novella, the revised Shivered Sky
# trilogy, the two published Dominion of Blades novels, both standalone
# horror/thriller novels, the 2005 story collection, the 2026 standalone
# science-fiction novel, and the two uncollected short stories ISFDB records
# outside any of the above. Every DCC and standalone `published` year is
# checked directly against that book's own page on mattdinniman.com (the
# "Published" date), not just against Wikipedia or ISFDB; Wikipedia's own
# Dungeon Crawler Carl article carries a second bibliography table sourced to
# BookScouter resale listings that disagrees with the author's site by two to
# four weeks on several volumes (years never differ) - the author's site is
# the primary source and is what this file follows.
#
# Deliberately NOT catalogued: "The Thieves of Grandeur", a third Dominion of
# Blades novel the author has announced with no publication date (TBA on
# every bibliography checked, and https://mattdinniman.com/books/the-thieves-
# of-grandeur/ 404s) - noted on the-hobgoblin-riot below rather than added as
# a work, since `forthcoming` requires a sourced date this does not have. Also
# not catalogued: a short story donated to the charity anthology "Unbroken:
# New Tales By Masters of Fantasy" (Peter Orullian / Grim Oak Press, a
# multi-author benefit anthology) - Dinniman's participation is confirmed by
# two of the anthology's other contributors on their own sites and by the
# anthology's Goodreads listing (not yet published, expected Sep 3, 2026), but
# no story title or table of contents naming his contribution was found
# anywhere, so there is nothing to catalogue yet even setting the
# multi-author scope question aside. Also not catalogued: the ninth and final
# DCC volume, which Dinniman described in a February 2026 interview as likely
# split into two books ("this isn't set in stone") - no title or date has
# been announced for either half.
#
# Publication-date note (first-publication dating, since Ace Books later
# reissued print editions of the first six DCC novels in 2024-2025):
# mattdinniman.com's own book pages carry BOTH an original "Published" date
# and, where it applies, a separate "RePublished" date for the Ace print
# edition. `published` below uses the ORIGINAL self-publication year in every
# case, matching Wikipedia's bibliography exactly; the Ace reissue dates are
# recorded per-work in a `note:` rather than used as `published`, since they
# are a print-rights reissue of an already-published book, not its first
# publication. This-Inevitable-Ruin and A-Parade-of-Horribles carry no
# RePublished date because both published directly through Ace, after the
# 2024 acquisition closed.

# --- Dungeon Crawler Carl ---
- id: matt-dinniman/dungeon-crawler-carl
  title: "Dungeon Crawler Carl"
  authorIds: [matt-dinniman]
  published: 2020
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  featured: true
  synopsis: >
    Coast Guard veteran Carl and his ex-girlfriend's prize-winning Persian
    cat, Princess Donut, are among the few survivors when an alien
    corporation destroys every man-made structure on Earth and rebuilds the
    wreckage as an eighteen-level dungeon, broadcast across the galaxy as a
    reality show. Surviving each floor keeps them alive; keeping the
    audience entertained keeps them funded.
  note: >
    Self-published Sept 21, 2020, after serialization on Royal Road from
    2019; reissued in print by Ace Books Aug 27, 2024.
  sources:
    - https://mattdinniman.com/books/dungeon-crawler-carl/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl
    - https://en.wikipedia.org/wiki/Matt_Dinniman

- id: matt-dinniman/carls-doomsday-scenario
  title: "Carl's Doomsday Scenario"
  authorIds: [matt-dinniman]
  published: 2021
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    Deeper in the dungeon, Carl and Donut reach the Over City, a devastated
    metropolis stalked by an undead circus and an ancient spell nearing
    completion, and race to solve its mystery before the floor's clock runs
    out.
  note: Self-published Jan 2, 2021; reissued in print by Ace Books Sept 24, 2024.
  sources:
    - https://mattdinniman.com/books/carls-doomsday-scenario/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/the-dungeon-anarchists-cookbook
  title: "The Dungeon Anarchist's Cookbook"
  authorIds: [matt-dinniman]
  published: 2021
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    A spot on the dungeon's top-ten list puts a bounty on Carl and Donut's
    heads on the fourth floor, forcing them to trust other crawlers to crack
    a puzzle whose answer may be hidden inside an unassuming book.
  note: Self-published Apr 2, 2021; reissued in print by Ace Books Aug 22, 2024.
  sources:
    - https://mattdinniman.com/books/the-dungeon-anarchists-cookbook/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/the-gate-of-the-feral-gods
  title: "The Gate of the Feral Gods"
  authorIds: [matt-dinniman]
  published: 2021
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    On the fifth floor, Carl's team has fifteen days to capture four
    fortified strongholds, among them a floating citadel held by warrior
    gnomes, and has to rely on the ragtag low-level crawlers trapped in the
    same bubble to do it.
  note: Self-published Jul 1, 2021; reissued in print by Ace Books Mar 11, 2025.
  sources:
    - https://mattdinniman.com/books/the-gate-of-the-feral-gods/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/the-butchers-masquerade
  title: "The Butcher's Masquerade"
  authorIds: [matt-dinniman]
  published: 2022
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    The sixth floor opens the dungeon to paying off-world tourists free to
    hunt the surviving crawlers for sport, among them a celebrated trophy
    hunter with no idea her prey intends to hunt back.
  note: Self-published Feb 28, 2022; reissued in print by Ace Books Apr 8, 2025.
  sources:
    - https://mattdinniman.com/books/the-butchers-masquerade/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/the-eye-of-the-bedlam-bride
  title: "The Eye of the Bedlam Bride"
  authorIds: [matt-dinniman]
  published: 2023
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    Carl and Donut set out to capture Shi Maria, the dungeon's most lethal
    and unhinged monster and the widow of a missing god, and learn that
    capturing her is a different problem entirely from controlling her.
  note: Self-published Jul 2, 2023; reissued in print by Ace Books May 13, 2025.
  sources:
    - https://mattdinniman.com/books/the-eye-of-the-bedlam-bride/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/this-inevitable-ruin
  title: "This Inevitable Ruin"
  authorIds: [matt-dinniman]
  published: 2024
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    The dungeon's NPCs become fully self-aware and field an army of their
    own for the first time as the Faction Wars begin: a level where the
    dead stay dead, and only one of Donut and her rival Katia will be
    allowed to leave.
  note: >
    Published directly by Ace Books Nov 3, 2024, after the acquisition
    closed - no separate self-published edition or later reissue.
  sources:
    - https://mattdinniman.com/books/this-inevitable-ruin/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/a-parade-of-horribles
  title: "A Parade of Horribles"
  authorIds: [matt-dinniman]
  published: 2026
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    Stripped of any real agency by the current floor's rules, Carl plots a
    scheme too dangerous to share even with his own crew, while the
    dungeon's System AI drops hints about whatever it has already started
    calling A Parade of Horribles.
  note: Published directly by Ace Books May 12, 2026.
  sources:
    - https://mattdinniman.com/books/a-parade-of-horribles/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

- id: matt-dinniman/backstage-at-the-pineapple-cabaret
  title: "Backstage at the Pineapple Cabaret"
  authorIds: [matt-dinniman]
  published: 2024
  subseries: "Dungeon Crawler Carl"
  canonTier: apocrypha
  format: novella
  synopsis: >
    A multi-part novella set inside the dungeon, published a chapter at a
    time as backmatter in the Ace hardcover editions of the main series.
  note: >
    A single novella, broken by the author into short-story-sized fragments
    and added as backmatter to each Ace print edition rather than published
    as its own book; ISFDB catalogues the eight fragments published
    2024-2026 as separate titles under this series name, tagged SF.
  sources:
    - https://www.isfdb.org/cgi-bin/pe.cgi?60962=
    - https://www.grimdarkmagazine.com/an-interview-with-matt-dinniman/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl

# --- The Shivered Sky ---
# All three volumes were originally published as one novel, "The Shivered
# Sky", on Jun 1, 2003 (his senior year of high school, per Wikipedia) and
# split into this three-volume revised edition on republication in early
# 2020 (mattdinniman.com dates each volume's "Originally Published" to the
# same Jun 1, 2003, with staggered 2020 RePublished dates below). An omnibus,
# "The Shivered Sky: The Complete Series: Books 1-3" (2021), also exists
# (ISFDB) and is edition-level data, not catalogued as a separate work here.
- id: matt-dinniman/every-grain-of-sand
  title: "Every Grain of Sand"
  authorIds: [matt-dinniman]
  published: 2003
  subseries: "The Shivered Sky"
  canonTier: extended
  synopsis: >
    Part one of a war fought after Heaven falls: Indigo wakes into a ruined
    afterlife with only fragments of memory, finds the angels hunted nearly
    to extinction and humanity reduced to livestock, and joins what is left
    of the resistance.
  note: Originally published Jun 1, 2003; this revised edition republished Jan 21, 2020.
  sources:
    - https://mattdinniman.com/books/every-grain-of-sand/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

- id: matt-dinniman/in-the-city-of-demons
  title: "In the City of Demons"
  authorIds: [matt-dinniman]
  published: 2003
  subseries: "The Shivered Sky"
  canonTier: extended
  synopsis: >
    Part two: the surviving angels suffer another terrible blow, and
    Indigo and her scattered human companions search for a way to keep
    fighting.
  note: Originally published Jun 1, 2003; this revised edition republished Feb 28, 2020.
  sources:
    - https://mattdinniman.com/books/in-the-city-of-demons/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

- id: matt-dinniman/the-great-devouring-darkness
  title: "The Great Devouring Darkness"
  authorIds: [matt-dinniman]
  published: 2003
  subseries: "The Shivered Sky"
  canonTier: extended
  synopsis: >
    The trilogy's conclusion: one last war, in which this time the winner
    takes everything.
  note: Originally published Jun 1, 2003; this revised edition republished Mar 27, 2020.
  sources:
    - https://mattdinniman.com/books/the-great-devouring-darkness/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

# --- Dominion of Blades ---
# Wikipedia describes this as "the as-of-yet unfinished A Dominion of Blades
# series" - two novels published, a third announced with no date (see the
# file header note above; not catalogued as a work here).
- id: matt-dinniman/dominion-of-blades
  title: "Dominion of Blades"
  authorIds: [matt-dinniman]
  published: 2017
  subseries: "Dominion of Blades"
  canonTier: extended
  synopsis: >
    Jonah wakes trapped inside Dominion of Blades, once the world's most
    popular full-immersion role-playing game, now shut down after a string
    of real-world deaths left players unable to eject. With two companions
    and no memory of how he arrived, he has to fight his way across a game
    world built for millions and now all but emptied, just to survive it.
  note: Published Mar 21, 2017. Narrated on audiobook by Andrea Parsneau.
  sources:
    - https://mattdinniman.com/books/dominion-of-blades/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

- id: matt-dinniman/the-hobgoblin-riot
  title: "The Hobgoblin Riot"
  authorIds: [matt-dinniman]
  published: 2018
  subseries: "Dominion of Blades"
  canonTier: extended
  synopsis: >
    A supposedly simple scouting mission into the Spiral, the tower-defense
    gauntlet guarding the hobgoblin capital, goes exactly as badly as the
    book's own opening promises.
  note: >
    Published Apr 13, 2018. A third volume, "The Thieves of Grandeur", is
    announced on multiple bibliography sites with no publication date; its
    own page on the author's site does not exist yet.
  sources:
    - https://mattdinniman.com/books/the-hobgoblin-riot/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

# --- Standalones ---
- id: matt-dinniman/trailer-park-fairy-tales
  title: "Trailer Park Fairy Tales"
  authorIds: [matt-dinniman]
  published: 2005
  subseries: null
  canonTier: extended
  format: short-story-collection
  synopsis: >
    Twelve stories mixing the mundane with the uncanny inside a
    caricatured, unglamorous America, among them an ex-conjoined-twin
    sculptor who works in Spam, a math-genius lunch lady, and a teenage
    exorcist.
  note: >
    Twelve stories per the collection's own back-cover copy; ISFDB's title
    index lists six by name (A Trailer Park Fairy Tale, Bad Karma at the
    Interstellar Swap Meet, Correspondence, The Escape Velocity of
    Millicent McDearly, The Liberation of Father Richards, Verona: Hospital
    for the Insane), an incomplete accounting rather than a contradiction.
  sources:
    - https://mattdinniman.com/books/trailer-park-fairy-tales/
    - https://www.isfdb.org/cgi-bin/ea.cgi?123759=

- id: matt-dinniman/the-grinding
  title: "The Grinding"
  authorIds: [matt-dinniman]
  published: 2013
  subseries: null
  canonTier: extended
  synopsis: >
    Six months after the U.S. military reportedly destroyed Tucson to stop
    it, a survivor gives an eyewitness account of the Grinder, an
    ever-growing monster assembled from the bodies of everyone and
    everything it touched.
  note: >
    Published Sept 16, 2013. A German translation, "Der gefraessige
    Grinder", followed in 2014 (ISFDB) - edition-level detail, not recorded
    here.
  sources:
    - https://mattdinniman.com/books/the-grinding/
    - https://www.isfdb.org/cgi-bin/ea.cgi?123759=

- id: matt-dinniman/kaiju-battlefield-surgeon
  title: "Kaiju: Battlefield Surgeon"
  authorIds: [matt-dinniman]
  published: 2019
  subseries: null
  canonTier: extended
  synopsis: >
    On an illegal private VR server built for players who want the game's
    pain to be real, a combat medic tasked with keeping giant kaiju alive
    has to become as ruthless as the sadists running the server, just to
    survive it.
  note: Published Nov 6, 2019, marketed by the author as "LitRPG Horror".
  sources:
    - https://mattdinniman.com/books/kaiju-battlefield-surgeon/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

- id: matt-dinniman/operation-bounce-house
  title: "Operation Bounce House"
  authorIds: [matt-dinniman]
  published: 2026
  subseries: null
  canonTier: core
  synopsis: >
    On a frontier colony Earth's government has decided to evict, a
    corporation turns the eviction into a game, letting bored Earthers pay
    to remotely pilot war machines against the colonists for sport; rancher
    Oliver Lewis has to defend the only home he has ever known with an old
    book of his grandfather's and a bucket of spare parts.
  note: >
    Published by Ace Books Feb 10, 2026, digital and print; audiobook via
    Penguin Audio, narrated by Travis Baldree and Jeff Hays. A standalone,
    not part of Dungeon Crawler Carl.
  sources:
    - https://mattdinniman.com/books/operation-bounce-house/
    - https://en.wikipedia.org/wiki/Matt_Dinniman

