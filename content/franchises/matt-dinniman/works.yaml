# Bibliography (works). IDs are STABLE and permanent (user data references
# them). The default reading order (all works in publication order) is
# DERIVED from this file.
#
# Coverage: the complete Dungeon Crawler Carl series to date (8 novels, 2020-
# 2026, ongoing - the author has stated two more volumes are planned to
# complete it), its in-hardcover backmatter novella, the revised Shivered Sky
# trilogy, the two published Dominion of Blades novels, both standalone
# horror/thriller novels, the 2005 story collection, the 2026 standalone
# science-fiction novel, and the two uncollected short stories ISFDB records
# outside any of the above. Every DCC and standalone `published` year is
# checked directly against that book's own page on mattdinniman.com (the
# "Published" date), not just against Wikipedia or ISFDB; Wikipedia's own
# Dungeon Crawler Carl article carries a second bibliography table sourced to
# BookScouter resale listings that disagrees with the author's site by two to
# four weeks on several volumes (years never differ) - the author's site is
# the primary source and is what this file follows.
#
# Deliberately NOT catalogued: "The Thieves of Grandeur", a third Dominion of
# Blades novel the author has announced with no publication date (TBA on
# every bibliography checked, and https://mattdinniman.com/books/the-thieves-
# of-grandeur/ 404s) - noted on the-hobgoblin-riot below rather than added as
# a work, since `forthcoming` requires a sourced date this does not have. Also
# not catalogued: a short story donated to the charity anthology "Unbroken:
# New Tales By Masters of Fantasy" (Peter Orullian / Grim Oak Press, a
# multi-author benefit anthology) - Dinniman's participation is confirmed by
# two of the anthology's other contributors on their own sites and by the
# anthology's Goodreads listing (not yet published, expected Sep 3, 2026), but
# no story title or table of contents naming his contribution was found
# anywhere, so there is nothing to catalogue yet even setting the
# multi-author scope question aside. Also not catalogued: the ninth and final
# DCC volume, which Dinniman described in a February 2026 interview as likely
# split into two books ("this isn't set in stone") - no title or date has
# been announced for either half.
#
# Publication-date note (first-publication dating, since Ace Books later
# reissued print editions of the first six DCC novels in 2024-2025):
# mattdinniman.com's own book pages carry BOTH an original "Published" date
# and, where it applies, a separate "RePublished" date for the Ace print
# edition. `published` below uses the ORIGINAL self-publication year in every
# case, matching Wikipedia's bibliography exactly; the Ace reissue dates are
# recorded per-work in a `note:` rather than used as `published`, since they
# are a print-rights reissue of an already-published book, not its first
# publication. This-Inevitable-Ruin and A-Parade-of-Horribles carry no
# RePublished date because both published directly through Ace, after the
# 2024 acquisition closed.

# --- Dungeon Crawler Carl ---
- id: matt-dinniman/dungeon-crawler-carl
  title: "Dungeon Crawler Carl"
  authorIds: [matt-dinniman]
  published: 2020
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  featured: true
  synopsis: >
    Coast Guard veteran Carl and his ex-girlfriend's prize-winning Persian
    cat, Princess Donut, are among the few survivors when an alien
    corporation destroys every man-made structure on Earth and rebuilds the
    wreckage as an eighteen-level dungeon, broadcast across the galaxy as a
    reality show. Surviving each floor keeps them alive; keeping the
    audience entertained keeps them funded.
  note: >
    Self-published Sept 21, 2020, after serialization on Royal Road from
    2019; reissued in print by Ace Books Aug 27, 2024.
  sources:
    - https://mattdinniman.com/books/dungeon-crawler-carl/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl
    - https://en.wikipedia.org/wiki/Matt_Dinniman
