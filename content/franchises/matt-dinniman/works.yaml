- id: matt-dinniman/this-inevitable-ruin
  title: "This Inevitable Ruin"
  authorIds: [matt-dinniman]
  published: 2024
  subseries: "Dungeon Crawler Carl"
  canonTier: core
  synopsis: >
    The ninth floor is Faction Wars: nine armies led by rich and powerful
    aliens fight to hold the castle at the heart of the battlefield, and for
    the first time the crawlers field an army of their own, the dungeon's
    NPCs having become fully self-aware. Anyone who dies on this battlefield
    stays dead, and Donut and one of her own teammates are told that only
    one of them will be allowed to leave the level.
  note: >
    Published directly by Ace Books Nov 3, 2024, after the acquisition
    closed, per the author's own site, which names no self-published
    predecessor and no later reissue. Open Library separately records an
    "Independently published" paperback (ISBN 9798344591230) dated that
    same Nov 3, 2024, alongside the Ace hardcover (ISBN 9798217190041),
    which Open Library and isbnsearch.org independently date to Sept 23,
    2025 - an unresolved discrepancy with the author's site.

    The back-cover copy names the teammate who shares that one-way rule with
    Donut. The name is deliberately left out of the synopsis above: on a page
    that lists all eight volumes at once, naming her discloses that she is
    alive at book seven, which no earlier volume's own jacket copy reveals
    and which several of those volumes put in genuine doubt. Everything else
    here is that jacket's own wording.
  sources:
    - https://mattdinniman.com/books/this-inevitable-ruin/
    - https://en.wikipedia.org/wiki/Dungeon_Crawler_Carl
  images:
    cover: "https://covers.openlibrary.org/b/id/15142977-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL60639135M"

