# --- The Shivered Sky ---
# All three volumes were originally published as one novel, "The Shivered
# Sky", on Jun 1, 2003 (his senior year of high school, per Wikipedia) and
# split into this three-volume revised edition on republication in early
# 2020 (mattdinniman.com dates each volume's "Originally Published" to the
# same Jun 1, 2003, with staggered 2020 RePublished dates below). An omnibus,
# "The Shivered Sky: The Complete Series: Books 1-3" (2021), also exists
# (ISFDB) and is edition-level data, not catalogued as a separate work here.
