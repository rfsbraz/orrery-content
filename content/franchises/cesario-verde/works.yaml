# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent.
#
# SHAPE OF THIS WING: everything here descends from a poet who published
# almost nothing as a book in his own lifetime. Of the roughly forty poems
# Cesário Verde is credited with publishing in Lisbon and Porto newspapers
# and magazines across his decade of writing (1873-1886; en.wikipedia's own
# figure), only twenty-two reached book form before his death was even a
# year old: gathered by his friend, the critic Silva Pinto, into "O Livro de
# Cesário Verde" (1887), the book that made his reputation, catalogued here
# as `core` and `featured`. Silva Pinto's twenty-two were not the whole
# story - historian Joel Serrão's critical "Obra Completa de Cesário Verde",
# first published in 1964 (Lisboa: Portugália; see that work's own note for
# the full editorial history), recovered the remaining poems from
# periodicals under a "poesias dispersas" heading and established the wider,
# roughly forty-poem canon now in common circulation. It is catalogued here
# too, as `extended`: genuinely his, and the edition most modern readers
# actually meet him through, but a scholarly re-assembly of poems the 1887
# book had already introduced rather than a second, independent creative
# achievement in its own right.
#
# Two further, individually significant poems are catalogued as their own
# works and marked `containedIn` the book whose text reprints them whole
# (SCHEMA.md, added for Fernando Pessoa's O Guardador de Rebanhos): "Nós"
# (1884) and "O Sentimento dum Ocidental" (1880). Both are collected among
# the fifteen poems of the 1887 book's "Naturais" section (per
# pt.wikisource.org's own table of contents for the book) and both are
# singled out, repeatedly and independently, in the critical literature as
# Verde's two most-studied individual poems - "O Sentimento dum Ocidental"
# is described as his "obra-prima" (masterpiece) in the very table that
# dates it (see that work's own note).
#
# NOT catalogued as further individual works, despite now having their own
# sourced first-publication dates in the same table (Revista Colóquio/Letras
# n.º 93, Setembro de 1986, "Tábua biobibliográfica de Cesário Verde" by
# Joel Serrão, read directly via coloquio.gulbenkian.pt's own digital
# archive, pp.10-18, rather than via a secondary citation of it): "Num
# Bairro Moderno" (1878, in a Diário de Notícias subscriber almanac dated
# 1877 but actually distributed the following year), "Merina" (1878,
# Ocidente, Lisboa), "Sardenta" (1878, Renascença, Porto), "Cristalizações"
# (1879, Revista de Coimbra), "Noite Fechada" (1879, published as "Noitada"
# in Novidades under the pseudonym Cláudio), "Num Álbum" (1879, in the
# anthology Cancioneiro Portuguez) and "Em Petiz" (1879, Diário de
# Notícias). Each has a real, sourced date, but none is singled out in the
# critical literature checked here the way "Nós" and "O Sentimento dum
# Ocidental" are - the bar this wing applies for an individual poem to
# become its own catalogued work, not merely having a date. "Esplêndida"
# (1874, the poem that drew Ramalho Ortigão's notorious review) is
# catalogued on the author entity's own lifeEvents rather than as a work
# here, since it was NOT among Silva Pinto's twenty-two and its later
# folding into the wider canon is not independently dated here.
#
# ALSO NOT catalogued: Pedro da Silveira's "A 'Obra Completa' de Cesário
# Verde" (Coimbra, 1964, 34p.), a corrections pamphlet responding to
# Serrão's then-new edition - a work of criticism about Verde, not a work of
# Verde's (Biblioteca Nacional de Portugal catalogue, record
# catbnp/1245756). Also held out: at least three later editions pairing a
# selection of Verde's poems with a selection of his own letters - Joel
# Serrão's "Cesário Verde: Interpretação, Poesias Dispersas e Cartas"
# (Lisboa: Minerva, 1957; 2.ª ed. rev., Delfos, 1961), a Brazilian "Poesia
# Completa e Cartas Escolhidas" organized by Carlos Felipe Moisés (reviewed
# in Revista Colóquio/Letras n.º 69, Setembro de 1982, but not itself dated
# or sourced here), and Teresa Sobral Cunha's "Cânticos do Realismo e Outros
# Poemas: 32 Cartas" (Lisboa: Relógio d'Água, 2006; BNP catbnp/1697342),
# which also carries a Fernando Pessoa critical study of Verde. Verde's own
# letters are real and have been in print since at least 1957; which
# edition is their own first publication, and whether a letters collection
# belongs in this bibliography the way Florbela Espanca's and Luís de
# Camões's own `apocrypha`-tier "Cartas" do, is not settled here.

- id: cesario-verde/o-livro-de-cesario-verde
  title: "O Livro de Cesário Verde"
  authorIds: [cesario-verde]
  published: 1887
  subseries: null
  canonTier: core
  featured: true
  format: poetry-collection
  synopsis: >
    The book that made Cesário Verde's reputation: urban and rural Lisbon
    rendered with a photographic, almost cinematic precision new to
    Portuguese verse, split between poems of the city's poverty, disease and
    bourgeois vanity and poems of a countryside remembered as vital, healthy
    and free - the same city/country divide Verde grew up inside. Gathered
    and published the year after his death by his friend, the critic Silva
    Pinto.
  note: >
    Published by Typographia Elzeveriana, Lisbon, April 1887, as "O Livro de
    Cesario Verde: 1873-1886" - 103 pages, a print run of 200 copies not
    offered for sale, distributed by Silva Pinto and Verde's brother Jorge to
    family, friends and figures they judged worthy of the gift; the book only
    reached general readers in a second, commercial edition in 1901. Silva
    Pinto selected twenty-two poems, in two sections, "Crise Romanesca" and
    "Naturais" - Infopedia's own account of the edition states plainly that
    it is not known whether that division reflects Verde's own intentions or
    Silva Pinto's editorial judgment as compiler, an open and specifically
    flagged uncertainty rather than an assumed one. Most of those twenty-two
    poems had already appeared individually in Lisbon newspapers and
    magazines across the previous fourteen years - Verde's first poems ran in
    the Diário de Notícias in 1873, and thereafter also in the Diário da
    Tarde, Tribuna and A Ilustração - so this 1887 print date is, for most of
    the book's contents, years or over a decade later than when a poem was
    actually written and first read; three poems in the 1887 selection, "De
    Tarde", "De Verão" and "Provincianas", are recorded as probably reaching
    print here for the first time (Joel Serrão, "Tábua biobibliográfica de
    Cesário Verde", Revista Colóquio/Letras n.º 93, Setembro de 1986, p.18,
    read directly at coloquio.gulbenkian.pt's own digital archive). Later
    twentieth-century editions expanded the collected canon with further
    poems recovered from periodicals under a "poesias dispersas" heading,
    bringing the commonly cited total close to the roughly forty poems Verde
    is credited with publishing across his lifetime, well beyond Silva
    Pinto's original twenty-two - see
    [[work:cesario-verde/obra-completa-de-cesario-verde|Obra Completa de
    Cesário Verde]] for that edition's own history.
  sources:
    - "https://pt.wikipedia.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
    - "https://www.infopedia.pt/%24o-livro-de-cesario-verde"
    - "https://www.infopedia.pt/%24cesario-verde"
    - "https://www.infopedia.pt/%24silva-pinto"
    - "https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://pt.wikisource.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
    - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=18&o=p"
  images:
    # The lithograph frontispiece (Columbano Bordalo Pinheiro) is used as the
    # author portrait on content/authors/cesario-verde.yaml instead of here;
    # no separate period cover scan or modern-edition jacket has a clear,
    # checked licence. Checked OpenLibrary by title (multiple mixed-language
    # editions and reprints, no usable cover image attached to any of them)
    # and by the author's own OpenLibrary record.

- id: cesario-verde/obra-completa-de-cesario-verde
  title: "Obra Completa de Cesário Verde"
  authorIds: [cesario-verde]
  published: 1964
  subseries: null
  canonTier: extended
  format: poetry-collection
  synopsis: >
    The critical edition, organized, prefaced and annotated by historian
    Joel Serrão, that recovered poems Silva Pinto had left out of the 1887
    princeps - scattered across newspapers and magazines Verde had published
    in during his lifetime - and established the wider, roughly forty-poem
    canon now read as Verde's collected work.
  note: >
    The Biblioteca Nacional de Portugal catalogue records the first edition
    as Lisboa: Portugália, 1964, no.15 in the "Poetas de hoje" collection,
    254 pages - catalogued there twice, under two different statements of
    responsibility ("org., pref. e anot. Joel Serrão" and "pref. de Joel
    Serrão") but agreeing on publisher, year, collection number and
    pagination, evidently the same printing (BNP catbnp/1847701 and
    catbnp/213088). The edition went through at least eight further
    printings: a 2nd (Portugália, 1970) and an undated 3rd (Portugália), a
    4th (Livros Horizonte, 1983 - previously the earliest year established
    for this edition), a 5th (Livros Horizonte, 1988), a 6th (Livros
    Horizonte, 1992, ISBN 972-24-0829-1) and a 7th (Livros Horizonte, 1999,
    same ISBN), an 8th (Livros Horizonte, 2003, same ISBN), and a further
    reissue under the title "Poesia Completa 1855-1886" (Publicações Dom
    Quixote, 2001), Serrão again credited with establishing the text
    (pt.wikipedia's own bibliografia section for the poet). A corrections
    pamphlet responding to the 1964 first edition, Pedro da Silveira's "A
    'Obra Completa' de Cesário Verde" (Coimbra: Pedro da Silveira, 1964,
    34p., a separata of Vértice v.24), is a work of criticism about this
    edition rather than a Verde work, and is not catalogued here (BNP
    catbnp/1245756).
  sources:
    - "https://id.bnportugal.gov.pt/bib/catbnp/1847701"
    - "https://id.bnportugal.gov.pt/bib/catbnp/213088"
    - "https://id.bnportugal.gov.pt/bib/catbnp/1245756"
    - "https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde"

- id: cesario-verde/o-sentimento-dum-ocidental
  title: "O Sentimento dum Ocidental"
  authorIds: [cesario-verde]
  published: 1880
  subseries: null
  canonTier: extended
  format: poem
  containedIn: cesario-verde/o-livro-de-cesario-verde
  synopsis: >
    A long walk through a Lisbon evening that becomes Verde's most
    ambitious poem: four titled movements from dusk to the small hours,
    setting the city's present squalor and ennui directly against the
    vanished grandeur of the Portuguese voyages of discovery and the Camões
    who sang them. Its opening movement already names the cities the walker
    would rather be in - "Madrid, Paris, Berlim, S. Petersburgo". Widely
    read as the clearest anticipation, inside Verde's own work, of the
    modernist and specifically Álvaro de Campos strain of Portuguese poetry
    that would follow him.
  note: >
    Dated 1880 - Verde's twenty-fifth year - by Joel Serrão's "Tábua
    biobibliográfica de Cesário Verde" (Revista Colóquio/Letras n.º 93,
    Setembro de 1986, p.14, read directly at coloquio.gulbenkian.pt's own
    digital archive), which calls it his "obra-prima" (masterpiece) and
    records its first publication as a special issue of the Porto magazine
    Jornal de Viagens on 10 June 1880 marking the tricentenary of Camões's
    death - a placement the poem's own contrast between the Age of Discovery
    and the diminished present makes legible - that, per the same source,
    "passou quase apercebida" (passed almost unnoticed) at the time. Reprinted
    seven years later among the fifteen poems of the "Naturais" section of
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário
    Verde]] (1887), whose text is the one now generally read; no independent
    revision between the two is established here. Individually and
    repeatedly singled out in the critical literature apart from general
    studies of Verde's work - among others, an essay by Jacinto do Prado
    Coelho is devoted entirely to it ("Verso e Frase em 'O Sentimento dum
    Ocidental'"), and it draws sustained individual discussion in at least
    three separate essays in the same Colóquio/Letras centenary issue that
    dates it. The poem runs in four titled movements - "Ave-Marias" (printed
    "Avá-Maria" in pt.wikisource.org's text of the 1887 book), "Noite
    fechada", "Ao gás" and "Horas mortas" - and the much-quoted "Madrid,
    Paris, Berlim, S. Petersburgo" stands in the third stanza of the first
    of them, near the poem's opening, not at its close. That line's last
    word is printed "no mundo!" in the wikisource text against the "o
    mundo!" of common citation; the quotation in the synopsis above stops
    short of it.
  sources:
    - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=14&o=p"
    - "https://pt.wikisource.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
    - "https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde"

- id: cesario-verde/nos
  title: "Nós"
  authorIds: [cesario-verde]
  published: 1884
  subseries: null
  canonTier: extended
  format: poem
  containedIn: cesario-verde/o-livro-de-cesario-verde
  synopsis: >
    Verde's longest poem and, by his own biographers' account, his most
    directly autobiographical: an idyllic country childhood recalled at
    length, and set against the tuberculosis that took his sister and then
    his brother and was by then working on Verde himself.
  note: >
    Joel Serrão's "Tábua biobibliográfica de Cesário Verde" (Revista
    Colóquio/Letras n.º 93, Setembro de 1986, read directly at
    coloquio.gulbenkian.pt's own digital archive) records that Verde
    probably began writing "Nós" in 1881 (p.14) - a year before his brother
    Joaquim Tomás's March 1882 death from tuberculosis and nine years after
    his sister Maria Júlia's 1872 death from the same disease, both losses
    the poem names directly, so the writing straddles his brother's death -
    and that it was first published in the magazine A Ilustração, Paris, on
    5 September 1884 (p.16), quoting Verde's own dedicatory confidence
    there: "sinto só desdém pela literatura, / E até desprezo e esqueço os
    meus amados versos!" - lines that are also the poem's own closing
    quatrain in the 1887 text (pt.wikisource.org). `published` follows that
    1884 periodical date rather than the 1881 composition date, per this
    catalogue's convention. Collected three
    years later among the fifteen poems of the "Naturais" section of
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
    (1887), whose text reprints it whole - see that work's own note for the
    fuller publication history.
  sources:
    - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=14&o=p"
    - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=16&o=p"
    - "https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://pt.wikisource.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
