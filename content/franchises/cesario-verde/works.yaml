# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent.
#
# SHAPE OF THIS WING: the thinnest possible shelf, and the reason the issue
# that requested this wing called it out - Cesário Verde published almost
# nothing as a book in his own lifetime. A single posthumous collection,
# gathered and edited by his friend Silva Pinto a year after Verde's death,
# is both the whole of his standalone-book bibliography and the entire
# reason he has a page in this catalogue. This wing's `published` convention
# (this catalogue's standard: year of first print, see also Florbela
# Espanca's and Luís de Camões's own posthumous shelves) genuinely means the
# BOOK'S print year here, 1887 - not the newspaper years most of its poems
# were actually written and first read in, 1873-1886. That gap is real and
# is exactly what the second entry below, "Nós", is for: one individually
# significant, individually dated poem, catalogued as its own work and
# marked `containedIn` the book its text is reprinted whole inside, per this
# catalogue's mechanism for exactly this shape (SCHEMA.md, added for
# Fernando Pessoa's O Guardador de Rebanhos).
#
# NOT catalogued as further individual works, and why: of the roughly forty
# poems Verde is credited with publishing in newspapers and magazines during
# his decade of writing (1873-1886; en.wikipedia's own figure), only a
# handful have an individually sourced first-publication date in the record
# checked here - "Esplêndida" (1874, the poem that drew Ramalho Ortigão's
# notorious review, catalogued on the author entity's own lifeEvents rather
# than as a work here since it was NOT among the twenty-two poems Silva Pinto
# selected for the 1887 princeps, per the Wikisource table of contents
# cross-checked against Infopedia's poem count below; which later,
# differently-titled edition first folded it back into the collected canon
# is not established here) and "Nós" (1884, below). The authoritative source
# for a full poem-by-poem chronology is the "Tábua bibliográfica de Cesário
# Verde" in Revista Colóquio/Letras n.º 93 (Setembro de 1986), cited by
# pt.wikipedia's own dedicated article on the book but not itself read here.
#
# ALSO NOT catalogued as a separate work: the modern critical edition
# tradition descending from historian Joel Serrão, who "organized, prefaced
# and annotated" (per an antiquarian bookseller's listing of its 4th
# edition, Livros Horizonte, 1983, Colecção Horizonte Poesia n.20) a fuller
# "Obra Completa" that is the source of the wider, roughly forty-poem canon
# now in circulation (the same edition line was republished by Publicações
# Dom Quixote in 2001 as "Poesia Completa 1855-1886", with Serrão again
# credited for establishing the text). This is a real, distinct editorial
# achievement and arguably earns its own catalogued work, but only a 4th
# Livros Horizonte edition by 1983 is established here, not the year Serrão's
# edition first appeared - and `published` cannot honestly carry an edition
# number as a year. Held out on that specific citation gap rather than dated
# to a guess.

- id: cesario-verde/o-livro-de-cesario-verde
  title: "O Livro de Cesário Verde"
  authorIds: [cesario-verde]
  published: 1887
  subseries: null
  canonTier: core
  featured: true
  format: poetry-collection
  synopsis: >
    The book that made Cesário Verde's reputation: urban and rural Lisbon
    rendered with a photographic, almost cinematic precision new to
    Portuguese verse, split between poems of the city's poverty, disease and
    bourgeois vanity and poems of a countryside remembered as vital, healthy
    and free - the same city/country divide Verde grew up inside. Gathered
    and published the year after his death by his friend, the critic Silva
    Pinto.
  note: >
    Published by Typographia Elzeveriana, Lisbon, April 1887, as "O Livro de
    Cesario Verde: 1873-1886" - 103 pages, a print run of 200 copies not
    offered for sale, distributed by Silva Pinto and Verde's brother Jorge to
    family, friends and figures they judged worthy of the gift; the book only
    reached general readers in a second, commercial edition in 1901. Silva
    Pinto selected twenty-two poems, in two sections, "Crise Romanesca" and
    "Naturais" - Infopedia's own account of the edition states plainly that
    it is not known whether that division reflects Verde's own intentions or
    Silva Pinto's editorial judgment as compiler, an open and specifically
    flagged uncertainty rather than an assumed one. Most of those twenty-two
    poems had already appeared individually in Lisbon newspapers and
    magazines across the previous fourteen years - Verde's first poems ran in
    the Diário de Notícias in 1873, and thereafter also in the Diário da
    Tarde, Tribuna and A Ilustração - so this 1887 print date is, for most of
    the book's contents, years or over a decade later than when a poem was
    actually written and first read; three poems in the 1887 selection, "De
    Tarde", "De Verão" and "Provincianas", are recorded as probably reaching
    print here for the first time (Revista Colóquio/Letras n.º 93, Setembro
    de 1986, "Tábua bibliográfica de Cesário Verde", p.18, cited via
    pt.wikipedia's dedicated article on the book). Later twentieth-century
    editions, most importantly historian Joel Serrão's critical "Obra
    Completa" (Livros Horizonte, reaching at least a 4th edition by 1983) and
    "Poesia Completa 1855-1886" (Publicações Dom Quixote, 2001, Serrão again
    credited with establishing the text), expanded the collected canon with
    further poems recovered from periodicals under a "poesias dispersas"
    heading - bringing the commonly cited total close to the roughly forty
    poems Verde is credited with publishing across his lifetime, well beyond
    Silva Pinto's original twenty-two.
  sources:
    - "https://pt.wikipedia.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
    - "https://www.infopedia.pt/%24o-livro-de-cesario-verde"
    - "https://www.infopedia.pt/%24cesario-verde"
    - "https://www.infopedia.pt/%24silva-pinto"
    - "https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://pt.wikisource.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
  images:
    # The lithograph frontispiece (Columbano Bordalo Pinheiro) is used as the
    # author portrait on content/authors/cesario-verde.yaml instead of here;
    # no separate period cover scan or modern-edition jacket has a clear,
    # checked licence. Checked OpenLibrary by title (multiple mixed-language
    # editions and reprints, no usable cover image attached to any of them)
    # and by the author's own OpenLibrary record.

- id: cesario-verde/nos
  title: "Nós"
  authorIds: [cesario-verde]
  published: 1884
  subseries: null
  canonTier: extended
  format: poem
  containedIn: cesario-verde/o-livro-de-cesario-verde
  synopsis: >
    Verde's longest poem and, by his own biographers' account, his most
    directly autobiographical: an idyllic recollection of a country
    childhood, written in the shadow of the tuberculosis that had already
    killed one sibling and would shortly kill another, and that was already
    working on Verde himself.
  note: >
    Dated 1884 by pt.wikipedia's own account of Verde's biography, two years
    after his brother Joaquim Tomás's death from tuberculosis and twelve
    years after his sister Maria Júlia's death from the same disease; both
    losses are named directly in the poem, per the same source. That 1884
    date is not distinguished there as composition or first periodical
    publication, and no independent periodical appearance predating the 1887
    book has been found to confirm which; if one is found, `published` here
    should move to it. Collected among the fifteen poems of the "Naturais"
    section of
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
    (1887), whose text reprints it whole - see that work's own note for the
    fuller publication history.
  sources:
    - "https://pt.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://en.wikipedia.org/wiki/Ces%C3%A1rio_Verde"
    - "https://pt.wikisource.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"
