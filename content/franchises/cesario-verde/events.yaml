# FRANCHISE events: what happened to the BOOKS and the estate after Cesário
# Verde's death in 1886. His own life is on the author entity at
# content/authors/cesario-verde.yaml.
#
# The gap this file addresses: a 200-copy 1887 gift edition, never sold, is
# all that exists of him in book form for fourteen years. The two entries
# below anchor 1901, when a second edition finally reaches general readers,
# and 1919, when a fire at the family's own farm destroys what may have
# remained of his papers - the reason nothing beyond the printed record (the
# 1887/1901 book and the periodicals it drew from) is ever recovered, Joel
# Serrão's 1964 "poesias dispersas" included. The stretch from 1920 to
# Serrão's 1964 critical edition stays dark: no further dated, sourced
# reception milestone for Cesário Verde specifically survives in the record
# for those years.
#
# Append-only file; parallel branches merge here.

- id: cesario-verde-segunda-edicao-1901
  organisation: artifact-spread
  illustration_type: book-object
  images_required: 1
  date: 1901
  title: A second edition finally reaches general readers
  scope: industry
  reach: franchise
  impact: med
  description: >
    Silva Pinto's 1887
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
    had been a 200-copy gift edition, never offered for sale. A second
    edition in 1901 - "primeira lançada ao público em geral" (the first
    launched to the general public), per Joel Serrão's own bibliographic
    table - is, by its own stated account, a textual reprint of Silva
    Pinto's original rather than a revision. Only with this edition, fourteen
    years after Verde's death, does the book that made his reputation
    actually reach the readers it made it with.
  spoilerAfter: null
  sources:
    - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=19&o=p"

- id: cesario-verde-linda-a-pastora-fire-1919
  organisation: interlude
  illustration_type: atmospheric-motif-field
  images_required: 1
  date: 1919
  title: A fire at Linda-a-Pastora destroys what may have remained of his papers
  scope: culture
  reach: franchise
  impact: med
  description: >
    A fire destroys part of the Verde family's house at Linda-a-Pastora,
    Oeiras - the farm whose city/country contrast runs through his whole body
    of work - burning papers and books that may have been what remained of
    Cesário's own estate. No manuscript or unpublished poem beyond what had
    already reached print in his lifetime or in
    [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
    is ever recovered: everything Joel Serrão adds to the canon in 1964 comes
    from periodicals Verde had published in, not from paper he once held.
  spoilerAfter: null
  sources:
    - "https://coloquio.gulbenkian.pt/cat/sirius.exe/issueContentDisplay?n=93&p=19&o=p"
