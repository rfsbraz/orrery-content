# Creative periods. There are none on record for this poet, and the request
# that opened this wing (orrery-content#108) called this exact question out
# in advance: a career this short may genuinely have none to name.
#
# Verde's writing life runs about thirteen years, 1873 (his first poems in
# the Diário de Notícias) to 1886 (his death), and the whole of it collapses
# into a single posthumous book,
# [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
# (1887) - see that work's own note for how much of even that shape is
# Verde's rather than his editor Silva Pinto's. No source checked for this
# pass periodises his output by date at all; the only division his own
# critics draw is thematic and runs the length of his whole career rather
# than marking phases within it - poems of the city (poverty, disease,
# bourgeois vanity, a corrupted modernity) against poems of the countryside
# (health, freedom, a remembered childhood), a duality rooted in his own
# upbringing between the family's Lisbon shop and its farm at
# Linda-a-Pastora and present from his earliest surviving poems to his last.
# Infopedia's own account of his poetics reaches for at least four different
# period-literary affinities to describe him at once - Realism, Naturalism,
# Parnasianism and an emergent Impressionism/Symbolism - explicitly as
# simultaneous currents in the same body of work, not a sequence of dated
# phases. A career this compressed, this thinly documented year to year
# beyond a handful of named poems, and this consistently described as one
# continuous voice gives an era boundary nothing real to rest on.
[]
