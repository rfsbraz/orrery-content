# Creative periods. There are none on record for this poet.
#
# Verde's working life is about a dozen years of publication, from the first
# poems that carry his name in the Diário de Notícias and the Diário da Tarde
# in November and December 1873 to the last in 1884, closed by his death in
# July 1886; some thirty-six poems are known to have been published or left
# for publication across it, and the whole of it collapses into a single
# posthumous book,
# [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
# (1887). He assembled no book himself, a volume announced in 1874 never
# appeared, and no statement of his own dividing his work into phases is on
# record. The nearest thing to one is a boast inside a poem, "Contrariedades"
# ("E apuro-me em lançar, originais e exactos, / Os meus alexandrinos"),
# which claims a verse form rather than a period of work.
#
# The criticism that does read a development into the poetry reads it in two
# opposite directions, and the account that sets the two side by side takes
# neither:
#
#   - Joel Serrão sees "uma jornada poética [...] que começa no campo e se
#     dirige à lenta revelação da cidade" (Cesário Verde: Interpretação,
#     Poesias Dispersas e Cartas, Lisboa, 1957; 2.ª ed., 1961, pp.66-113).
#   - David Mourão-Ferreira sees the reverse trajectory, a poet who "fora um
#     enamorado da cidade" and stopped being one at the decisive turn
#     crystallised in [[work:cesario-verde/o-sentimento-dum-ocidental|O
#     Sentimento dum Ocidental]] ("Notas sobre Cesário Verde: III. Da Cidade
#     para o Campo", 1949, in Hospital das Letras, Lisboa, 1966; 2.ª ed.,
#     1981, pp.71-85).
#   - Helder Macedo, quoting both, holds the city/country contrast to be "a
#     antinomia estruturante da poesia de Cesário", a polarity of meaning
#     rather than a progression from one pole to the other, and finds it
#     "verificável logo nos poemas de juventude" ("Cesário Verde, o bucolista
#     do realismo", Revista Colóquio/Letras n.º 93, Setembro de 1986, p.20).
#
# The other structures critics find in the poetry run its whole length in the
# same way. Alfredo Margarido's white/black opposition is "uma constância
# estruturante [...] que percorre a poesia de Cesário, dos poemas da
# juventude ao 'Nós'" ("A dicotomia branco-negro na poesia de Cesário Verde",
# same issue, p.57). Infopedia's account of his poetics holds that it
# "dificilmente cabe nas classificações da história literária" and reaches
# for Realism, Parnasianism, romantic and Baudelairean influence and a
# symbolist-indebted impressionism at once, as currents crossing one body of
# work rather than a sequence of dated phases.
#
# Two real divisions of the poems exist, and neither periodises the career:
#
#   - Serrão's [[work:cesario-verde/obra-completa-de-cesario-verde|Obra
#     Completa de Cesário Verde]] files the poems in dated bands, of which
#     three are named in the criticism, 1875-1876, 1877-1880 and 1881-1886;
#     what covers the poems of 1873-1874 is not. They work as a dating
#     apparatus and are argued over as one: four poems in O Livro have no
#     known date of either composition or publication and are placed by
#     editorial judgement, and Mourão-Ferreira argues that two of them,
#     "Humilhações" and "De Verão", belong in 1877-1880 rather than where the
#     edition puts them ("Sobre o decassílabo e o alexandrino na poesia de
#     Cesário Verde", same issue, p.80). Of the works catalogued here only
#     the two individual poems fall inside those bands; the book that
#     collects them (1887) and the edition that established them (1964) fall
#     outside every one.
#   - The 1887 princeps divides its twenty-two poems into two sections,
#     "Crise Romanesca" and "Naturais". The split is not chronological:
#     "Ironias do Desgosto", which Verde dated Lisboa, 1874, sits in the
#     first section and "A Débil", dated Lisboa, 1875, in the second.
#     Whether the division is Verde's or his editor Silva Pinto's is not
#     known (see that work's own note), and both sections sit inside one
#     catalogued work.
#
# The one dated movement on record is metrical. Mourão-Ferreira traces
# Verde's passage from the decassílabo to the alexandrino across a single
# year: none of the five poems that first carried his name, in November and
# December 1873, is in alexandrines; of the fourteen poems of 1874 whose day
# of publication is known, the eleven of the first quarter are practically
# all decassilábicas while the three of the last quarter, "Cabelos", "Flores
# Velhas" and "Cadências Tristes", are already alexandrine; and the
# combination of the two metres inside a single stanza appears no earlier
# than 1876 (same issue, pp.78-80). No period is drawn from it, there or
# elsewhere: the reading is of two metres deliberately diversified across the
# whole output, alternated and combined poem by poem, and the movement dated
# falls entirely in the years before the earliest work catalogued here.
#
# Portuguese secondary education, where a received framing for a poet on the
# national syllabus would surface, sets him without one: the Aprendizagens
# Essenciais for Português, 11.º ano (Direção-Geral da Educação) prescribe
# "Cânticos do Realismo (O Livro de Cesário Verde)" with "O Sentimento dum
# Ocidental" read whole, one poet, one book, no phase.
[]
