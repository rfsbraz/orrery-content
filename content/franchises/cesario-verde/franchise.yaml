startHere:
  paths:
    # Source: DGE (Direção-Geral da Educação), Aprendizagens Essenciais,
    # Português, 11.º ano (dge.mec.pt/sites/default/files/Curriculo/
    # Aprendizagens_Essenciais/11_portugues.pdf), Anexo 1, "Lista de Obras e
    # Textos para Educação Literária - 11.º ano", fetched and read directly:
    # "Cesário Verde - Cânticos do Realismo (O Livro de Cesário Verde)
    # (leitura integral de 'O Sentimento dum Ocidental')" - the only work of
    # his the national syllabus sets, and the only poem it requires read in
    # full. Independently corroborated in the criticism: that poem's own
    # works.yaml note records Joel Serrão's "Tábua biobibliográfica" calling
    # it Verde's "obra-prima", and three separate essays in the same
    # Colóquio/Letras centenary issue give it sustained individual
    # discussion apart from general studies of his work.
    - id: classroom-canon
      title: Start with O Livro de Cesário Verde
      description: >
        O Livro de Cesário Verde is the whole of his published reputation -
        one slim posthumous collection, gathered by his friend Silva Pinto
        the year after Verde's death. Read it start to finish, and give your
        closest attention to "O Sentimento dum Ocidental": the poem
        literally every Portuguese secondary-school reader meets, required
        reading in full under the Ministry of Education's 11th-year
        Português syllabus, and independently singled out by critics who
        never taught a classroom as his masterpiece. The cost: it leaves out
        the further poems Joel Serrão's 1964 critical edition later
        recovered from periodicals - and for a Portuguese reader who studied
        Verde at school, none of this is a fresh discovery.
      workIds:
        - cesario-verde/o-livro-de-cesario-verde
      orderId: null
      fit:
        experience: [new]
        commitment: [taste]
    - id: everything
      title: Everything, in order
      description: >
        The complete published record: O Livro de Cesário Verde (1887),
        then Joel Serrão's 1964 critical edition, which recovered the poems
        Silva Pinto's original selection left out and established the wider
        canon now read as Verde's collected work. The cost: the 1964 book is
        a scholarly apparatus assembled seventy-eight years after his
        death - editorial notes and poems reconstructed from periodicals -
        rather than a second creative achievement in its own right.
      workIds: null
      orderId: default
      fit:
        experience: [returning, completionist]
        commitment: [complete]

