# A wing spans an author's complete published body of work (standing ruling,
# 2026-07-21). For Cesário Verde that is, by any strict standard, one book:
# see works.yaml's own header for the full accounting of what that book is,
# what it grew to include across later editions, and what is documented
# there as a known gap rather than an invented fact.
#
# globalEvents block below: every event in content/events/global.yaml
# postdates Verde's 1886 death - the nearest, the Berne Convention
# (9 September 1886), by about seven weeks, and he died before international
# copyright protection existed for authors publishing the way he did, in
# uncollected newspaper print. Ruled: all excluded, none reach a life and
# career that closes in 1886, before the modern publishing-industry history
# this catalogue's global events track even begins.

id: cesario-verde
name: Cesário Verde
kind: author
description: >
  A Lisbon shopkeeper's son who brought a newspaperman's exactness to
  Portuguese verse - the city's poverty and vanity, the countryside's
  vitality, rendered with a precision his own critics called photographic -
  and who died of tuberculosis at 31 having published almost nothing as a
  book; his friend Silva Pinto gathered his scattered poems into
  [[work:cesario-verde/o-livro-de-cesario-verde|O Livro de Cesário Verde]]
  the following year, and Fernando Pessoa's own generation would go on to
  claim him as modern Portuguese poetry's first voice.
authorIds: [cesario-verde]
themePreset: fanqueiros-ledger

# Capabilities are auto-detected from the data (docs/SCHEMA.md); nothing is
# forced here. The wing carries a 7-lifeEvent author entity (enough for a
# thin river) and two works, one of them featured; no editions.yaml (no
# usable cover found - see works.yaml), no orders.yaml (two works need no
# curated order), no achievements.yaml, no startHere (no sourced entry-point
# recommendation found for a one-book shelf a reader takes in whole or not
# at all), no characters.yaml. eras.yaml is present and empty; see that
# file's own header for why.
features: {}

