    reprints the 1887 Typographia Elzeviriana text with new introductory
    matter. A second ISBN, 9789728651619, is recorded for what the same
    source treats as the same edition (likely a binding variant); not
    duplicated here.
  sources:
    - "https://openlibrary.org/isbn/9789728651602"

