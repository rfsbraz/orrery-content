  language: pt-PT
  format: ebook
  publisher: Projecto Adamastor
  year: 2013
  readUrl: "https://projectoadamastor.org/o-livro-de-cesario-verde-cesario-verde/"
  note: >
    A free ebook with its own ISBN, read directly off the publisher's product
    page: cover art by Ana Ferreira using José Malhoa's "Praia das Maçãs,"
    revision by Ricardo Lourenço, EPUB/MOBI/Kobo formats. The page itself
    states the eBook's own 2013 publication date against the book's 1887
    original.
  sources:
