# Additional reading orders only - the default (publication-chronological
# over every work) is derived from works.yaml and is not written here.
#
# NO ADDITIONAL ORDER CLEARS THE BAR. Four candidates were checked: does
# the arrangement differ materially from the derived default, and is there
# an actionable reason a reader would choose it over publication order?
# None survives both tests.
#
# 1. THE 1958 AND 2001 SAME-YEAR TIES. 1958 ties three works - the poetry
#    collection Mar Novo and the children's books A Fada Oriana and A
#    Menina do Mar; 2001 ties three more - the poetry anthology Mar, the
#    play O Colar, and the poem-and-painting collaboration Orpheu e
#    Eurydice. Real ties the derived sort leaves arbitrary, exactly the
#    condition agatha-christie/poirot-novels exists to fix - but unlike the
#    five Poirot novels, already one series a reader is reading as a set,
#    neither cluster is a single reading practice: each mixes a different
#    genre and tier under one shared year, and no source sequences either
#    cluster at finer than year-precision. Settling them would be
#    curatorial invention dressed as data, not the genuine known intra-year
#    sequence the one permitted exception requires.
#
# 2. A POETRY-ONLY CHRONOLOGICAL THREAD (the fourteen core collections, or
#    every poetry-tagged work, isolated and walked in publication order).
#    This reproduces the derived default's own relative order for exactly
#    those works - a chronological order for an already-chronological set,
#    kill-on-sight per the skill. Unlike Discworld's six subseries threads,
#    no publisher, critic or school source treats "the poetry" as a walked
#    unit apart from the tales, children's books and theatre around it, and
#    a reader who wants poetry only already has `format: poetry-collection`
#    to filter by without an order restating what that field already shows.
#
# 3. A CHILDREN'S-BOOKS-ONLY OR THEATRE-ONLY THREAD, same failure as 2: both
#    sets already run as an unbroken chronological sequence within their own
#    genre - the eight children's books 1958-2012, the five plays
#    1993-2001 - with no dating gap or publisher numbering for a curated
#    order to resolve, and no source groups either set as a sequence
#    distinct from year of publication.
#
# 4. THE PUBLISHER'S COLLECTED-POEMS NUMBERING. OBRA POÉTICA I, II, III
#    (Editorial Caminho, 1990-1991) and the later single-volume OBRA
#    POÉTICA (Assírio & Alvim, 2015) are excluded from works.yaml entirely
#    as reissues gathering the fourteen collections already catalogued,
#    not new content (works.yaml's own header). There is accordingly no
#    publisher numbering to encode here either; an order built from those
#    volumes would be the derived default rewritten by hand under a
#    collected edition's binding.
[]
