# FRANCHISE events: what happened to the BOOKS, not the life (author-life
# events belong on content/authors/sophia-de-mello-breyner-andresen.yaml
# instead). Three entries, in publication order: the family injustice
# behind Mar Novo's title (1958), and two literary prizes awarded the same
# year as, or the year after, the book they crown - O Nome das Coisas
# (1977) and Ilhas (1989).
#
# Append-only file; parallel branches merge here.

- id: sophia-de-mello-breyner-andresen-mar-novo-origin-1958
  date: 1958
  title: Names Mar Novo after her brother's crushed Sagres monument
  scope: culture
  reach: franchise
  impact: med
  description: >
    In 1956 her brother, architect João Andresen, wins the design
    competition for a monument to Prince Henry the Navigator at Sagres -
    with painter Júlio Resende and sculptor Salvador Barata Feyo - under
    the project name "Mar Novo." Salazar overrules the jury and the
    Council of Ministers cancels the monument outright, ordering a stone
    copy of the 1940 Padrão dos Descobrimentos built in Lisbon instead.
    Two years later Sophia titles a poetry collection
    [[work:sophia-de-mello-breyner-andresen/mar-novo|Mar Novo]] after the
    killed project - "um livro de rotura, politicamente muito
    significativo" ("a book of rupture, politically very significant"),
    in the words of Guilherme d'Oliveira Martins, her colleague at the
    Centro Nacional de Cultura - depositing in it an act of revolt against
    the injustice done to her brother. Her own PIDE file from the period
    describes her only as "desafeta ao atual regime" ("disaffected from
    the current regime") with no known activities - a milder official
    verdict than her husband Francisco earns after his own arrests in the
    years that follow.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Mar_Novo"
    - "https://pt.wikipedia.org/wiki/Jo%C3%A3o_Andresen"
    - "https://especiais.rr.pt/sophia-100-anos/"

- id: sophia-de-mello-breyner-andresen-o-nome-das-coisas-pascoaes-prize-1977
  date: 1977
  title: O Nome das Coisas wins the Prémio Teixeira de Pascoaes
  scope: culture
  reach: franchise
  impact: low
  description: >
    [[work:sophia-de-mello-breyner-andresen/o-nome-das-coisas|O Nome das
    Coisas]], published the same year, wins the Prémio Teixeira de
    Pascoaes. Sophia describes the book herself, in a later interview, as
    written against the demagoguery that followed 25 April 1974: "Aquele
    livro é mais uma crítica de certos desmandos... É um livro contra
    tudo, contra uma forma de linguagem muito demagógica, uma tentativa de
    procurar a verdade" ("That book is more a critique of certain
    excesses... it is a book against everything, against a very demagogic
    form of language, an attempt to search for the truth") - a reckoning,
    in her own words, with a Revolution that had not kept its promise.
  spoilerAfter: null
  sources:
    - "https://www.dn.pt/cultura/centenario-de-sophia-de-mello-breyner-e-10138353.html"
    - "https://especiais.rr.pt/sophia-100-anos/"

- id: sophia-de-mello-breyner-andresen-ilhas-prizes-1989
  date: 1989
  title: Ilhas wins the Prémio D. Dinis and the Pen Club prize
  scope: culture
  reach: franchise
  impact: low
  description: >
    [[work:sophia-de-mello-breyner-andresen/ilhas|Ilhas]] is awarded both
    the Prémio D. Dinis, from the Fundação da Casa de Mateus, and the
    Prémio do Pen Clube Português de Poesia the year it is published -
    the first time two of her prizes single out one specific book rather
    than the body of work, ten years before the Camões.
  spoilerAfter: null
  sources:
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?AutorId=9859"
    - "https://www.dn.pt/cultura/centenario-de-sophia-de-mello-breyner-e-10138353.html"
    - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
