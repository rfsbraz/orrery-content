# Concrete published editions. Coverage: 29 of the wing's 52 works carry a
# verified edition (two of those, Contos Exemplares and Histórias da Terra e
# do Mar, carry two - a literary paperback and a separately illustrated
# edition, genuinely different objects). The other 23 are real gaps: no
# ISBN-bearing edition was found for them in any source checked here, which
# for a mid-century Portuguese poet is the expected shape rather than a
# research failure - see SCHEMA.md's own coverage table for comparable
# franchises. The gap concentrates in one place: the ten "extended" poetry
# anthologies and selections (Antologia, Grades, 11 Poemas, the 1981 Poemas
# Escolhidos, Signo, Primeiro Livro de Poesia, Mar, Orpheu e Eurydice, Ilhas -
# Poemas Escolhidos, and the posthumous Cem Poemas de Sophia) never resurfaced
# in a current ISBN-bearing edition anywhere checked; the fourteen-book core
# poetry spine, by contrast, has 14 of 14 covered, all still in print under
# Assírio & Alvim's "Obras de Sophia de Mello Breyner Andresen" reissue
# series (2013-2019, marking her 2019 birth centenary).
#
# No `title` field on any pt-PT entry below: Sophia wrote in Portuguese, so a
# same-language edition carrying the work's own title would only duplicate
# it. Two combined-volume entries (Musa and O Búzio de Cós e Outros Poemas)
# are the one exception, because the physical object's own printed title,
# "Musa : O Búzio de Cós e Outros Poemas," differs from either individual
# work's own title - see their entries.
#
# SOURCING, ranked as used: the Biblioteca Nacional de Portugal's own
# catalogo.bnportugal.gov.pt (ISBN search, cited as a re-runnable
# ?index=ISBN&term=<isbn> query) for the physical record - publisher,
# edition statement, page count and legal-deposit number; Porto Editora's own
# product pages (portoeditora.pt, part of the same publishing group as
# Assírio & Alvim since 2013) where a direct ISBN was needed and BNP had
# indexed only the eBook SKU; retailer listings (Wook, Bertrand, Fnac,
# Amazon) only as a second, corroborating source, never as the sole basis for
# a number. wook.pt, bertrand.pt and assirio.pt all return HTTP 403 to an
# automated fetch, so those three were never fetched directly - only read via
# search-engine result summaries and cross-checked against the BNP record
# actually opened. Every ISBN-13 below was recomputed digit by digit; every
# one is a real, arithmetically valid check digit tied to a title read at
# the source, not copied from a lookup table on trust.
#
# NO coverUrl ON ANY ENTRY. The only cover-image candidates surfaced anywhere
# in this wing's research were retailer jacket scans (img.bertrand.pt,
# img.wook.pt) - excluded per SCHEMA.md's image-rights rule, not evaluated
# further. The app falls back to a typographic cover for every slot.
#
# EXCLUDED - COLLECTED-WORKS OMNIBUSES, same treatment works.yaml already
# gives Obra Poética I/II/III and the 2010-2011 Obra Poética: Assírio & Alvim's
# "Prosa" (2021, 9789723721294, 512p) "groups all of Sophia's prose in a
# single volume" per its own publisher copy - Contos Exemplares, Histórias da
# Terra e do Mar, Quatro Contos Dispersos and more, already catalogued
# individually below and in works.yaml. Not recorded as an edition of any one
# of them; recording it under any single workId would misstate what the
# object is.
#
# EXCLUDED - REAL ENGLISH-LANGUAGE SELECTIONS THAT DO NOT MAP TO ANY SINGLE
# WORK: four real English-language books exist, and are deliberately not
# recorded, because each gathers material from several of this catalogue's
# works (or from her whole career) under one cover, and this file records
# editions of ONE work, never a multi-work anthology with no
# Portuguese-language counterpart in works.yaml: "Marine Rose: Selected
# Poems" (Black Swan Books, 1988, tr. Ruth Fainlight, 9780933806375,
# bilingual, spans her whole poetic career from 1944 on); "Log Book: Selected
# Poems" (Carcanet/Gulbenkian, 1997, tr. Richard Zenith, no ISBN found,
# likewise a career-spanning selection); "shores, horizons, voyages: selected
# poems" (Orchid Press, tr. Rui Cascais Parada, 42 poems, actually published
# 2005 - a "2019" date attached to this title elsewhere is wrong); and "The
# Girl from the Sea & Other Stories" (Dedalus, 2020, tr. Margaret Jull Costa
# and Robin Patterson, 9781912868032) - eight children's tales translated
# together, drawn from A Fada Oriana, A Floresta, O Rapaz de Bronze and
# others, not a translation of the single picture book A Menina do Mar its
# title borrows.
#
# EXCLUDED - A BRAZILIAN EDITION OF A DIFFERENT OBJECT: "Coral e outros
# poemas" (Companhia das Letras, São Paulo, 2018, 9788535930795, 978-85
# prefix confirms Brazil) is a themed Brazilian selection, not a pt-BR
# printing of Coral itself - its own title already says so. The same
# publisher's 2004 "Poemas Escolhidos" (9788535905519) is excluded on the
# identical basis works.yaml's own note for poemas-escolhidos-1981 already
# states.
#
# A LIVE BNP CATALOGUING ERROR, found and not silently corrected: the
# Biblioteca Nacional de Portugal's ISBN index carries THREE records under
# 978-972-37-1716-7, two for O Colar (1st ed. 2013, reimp. 2014) and one for
# Histórias da Terra e do Mar (1st ed. 2013) - the same number attributed to
# two different books. Histórias da Terra e do Mar already has its own,
# separately confirmed ISBN (978-972-37-1715-0, one digit-block off, both
# from the same autumn 2013 publishing batch - the likely source of the
# clerical slip) recorded under that work below. O Colar's own number is
# corroborated independently by Porto Editora's, Bertrand's and Wook's
# separate product listings (title, 136p, preface by Luís Miguel Cintra, the
# Vanina/Pietro synopsis works.yaml already carries) and recorded there.
#
# A LIVE ISBN OWNERSHIP, checked and confirmed genuine rather than assumed:
# the 2019 Assírio & Alvim edition of O Nu na Antiguidade Clássica
# (9789723720235, 224p) reads as suspicious on its face - the catalogued work
# is a 1975 essay, and 224 pages is long for one - because the object is a
# 2019 centenary reissue of that same essay bound together with a NEW poetry
# anthology on classical antiquity curated by Maria Andresen de Sousa
# Tavares, per the publisher's own synopsis ("a Assírio & Alvim volta a
# publicá-lo agora... em conjunto com uma antologia significativa de
# poemas..."). The essay is genuinely inside this object, so it is recorded
# under o-nu-na-antiguidade-classica; the bundled anthology is not itself
# catalogued as a work.

