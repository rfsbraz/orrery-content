                                       # her own work or censorship history
    - fantasy-paperback-boom-1965      # English-language genre-publishing
                                       # phenomenon, unconnected
    - carnation-revolution-1974        # ended censorship and brought her into
                                       # politics briefly, but her published
                                       # works don't show a response; she had
                                       # already written her major poetry
                                       # under censorship and ultimately chose
                                       # writing as her true political
                                       # participation
    - chain-bookshop-1982              # English-language retail-industry
                                       # shift, unconnected
    - online-bookselling-1995          # she died in 2004; no sourced
                                       # engagement found
    - comics-code-authority-1954       # US comics industry, unconnected
    - satanic-verses-fatwa-1989        # no sourced connection found
    - sept-11-2001                     # she was 81-82, near the end of her
                                       # writing life; no sourced engagement
                                       # found
    - world-war-i-1914                 # predates her birth by 5 years
    - elementary-education-act-1870    # predates her birth by 49 years
    - berne-convention-1886            # predates her birth by 33 years
    - financial-crisis-2008            # postdates her death by 4 years
