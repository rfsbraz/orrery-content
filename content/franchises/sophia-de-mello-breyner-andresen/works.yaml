- id: sophia-de-mello-breyner-andresen/no-tempo-dividido
  title: "No Tempo Dividido"
  authorIds: [sophia-de-mello-breyner-andresen]
  published: 1954
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Introduces the "divided time" against which her later "absolute time"
    is opposed throughout her work - divided time as the time of
    loneliness, fear and lies, bound up with the city as a negative,
    exiled space.
  note: >
    1st ed. 1954, Lisbon, Guimarães Editores. Later editions absorb the
    separately-printed sequence "Poemas de um Livro Destruído" (1972),
    per the BNP bibliography's own cross-reference.
  sources:
    - "https://pt.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
    - "https://purl.pt/19841/1/bibliografia/bibliografia.html"

