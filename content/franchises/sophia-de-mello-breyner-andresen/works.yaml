# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent. `title` is the original Portuguese
# title (this catalogue's rule for a Portuguese author writing in
# Portuguese; see also Cesário Verde, Florbela Espanca, Eca de Queiros).
#
# SHAPE OF THIS WING: a sixty-year career across four real genres she worked
# in seriously - poetry, short tales, children's literature, and theatre -
# plus a handful of essays and (excluded below) her translation work. The
# spine below tiers 45 works: the fourteen poetry collections en.wikipedia's
# own summary counts ("published fourteen poetry books between 1944 and
# 1997") sit `core`, cross-checked title-by-title and year-by-year against
# the Biblioteca Nacional de Portugal's own dedicated bibliography
# (purl.pt/19841/1/bibliografia/bibliografia.html) and pt.wikipedia's
# bibliography section - all three agree on the same fourteen titles and
# years. Around that spine sit two tale collections, eight children's
# books (written for and largely because of her own five children, mostly
# 1950s-1960s), and five stage plays (all much later, 1993-2001) - all
# `core`, all real distinct genres rather than miscellany. `extended` and
# `apocrypha` below are anthologies, selections and posthumous
# compilations: real books, catalogued honestly, but not new creative work
# in the way the fourteen collections are.
#
# EXCLUDED FROM THIS FILE ENTIRELY, and why:
#   - Her translations of other authors (Dante's Purgatorio, Shakespeare's
#     Hamlet and Much Ado About Nothing, Euripides' Medea, Paul Claudel,
#     Emile Mireaux, Leif Kristiansson, a four-poet French-language
#     anthology of Camões/Cesário Verde/Sá-Carneiro/Pessoa) are real and
#     substantial - the BNP bibliography's own TRADUÇÕES section lists
#     seven items - but they are not works she authored; this catalogue's
#     `works.yaml` has no field for "translated by" and cataloguing Dante's
#     Purgatorio as a Sophia work would misstate whose book it is. Recorded
#     in the author entity's bio prose instead.
#   - OBRA POETICA I, II, III (Editorial Caminho, 1990-1991, multiple later
#     editions) - a three-volume collected-poems reissue gathering the
#     fourteen collections already catalogued below, not a new book with
#     new content. Same treatment this catalogue gives any collected-works
#     reprint (see editions.yaml's own scope note pattern on other wings).
#   - Individually uncollected periodical poems and essays (the BNP
#     bibliography's own "Poemas não incluídos na Obra Poética" section
#     lists roughly a dozen, 1950-1999, in small literary magazines) - real
#     and hers, but never gathered into a book, the same standard Florbela
#     Espanca's wing applies to her own uncollected periodical poems.
#
# A NOTE ON WHAT "PUBLISHED" MEANS HERE: this catalogue's `published` is
# always the first print year of the BOOK, not of an individual poem's
# earlier magazine appearance - stated once here rather than repeated on
# every entry, per this catalogue's standing convention (see also Cesário
# Verde and Luís de Camões).
#
# FEATURED: capped at 3 by the validator; only `poesia` is marked here.
# Every source checked treats it as the unambiguous start of everything
# that follows - the book the "fourteen poetry books, 1944-1997" framing
# itself begins counting from. A second or third hinge is not marked: her
# most-taught children's book is genuinely contested between A Menina do
# Mar and O Cavaleiro da Dinamarca in the sources checked here, and no
# single tale collection or late poetry landmark stood out clearly enough
# in those same sources to name as a hinge rather than a guess.

# ============================== POETRY: CORE ==============================

- id: sophia-de-mello-breyner-andresen/poesia
  title: "Poesia"
  authorIds: [sophia-de-mello-breyner-andresen]
  published: 1944
  subseries: null
  canonTier: core
  featured: true
  format: poetry-collection
  synopsis: >
    Her first book, published through the Cadernos de Poesia imprint while
    she was in her mid-twenties: the garden and house of childhood, the sea,
    and a demand for moral and formal clarity that the rest of her sixty-year
    body of work keeps returning to.
  note: >
    1st ed. 1944, Coimbra, Cadernos de Poesia no.1, edição da autora. Later
    editions (Editorial Caminho, then Assírio & Alvim's 2013 7th ed. with a
    preface by Pedro Eiras) are reissues of the same book, not new content.
  sources:
    - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
    - "https://purl.pt/19841/1/bibliografia/bibliografia.html"

- id: sophia-de-mello-breyner-andresen/o-dia-do-mar
  title: "O Dia do Mar"
  authorIds: [sophia-de-mello-breyner-andresen]
  published: 1947
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Her second collection, deepening the sea as the book's central figure -
    already, this early, the theme every later source names as the most
    recurrent in her whole body of work.
  note: >
    1st ed. 1947, Lisbon, Edições Ática.
  sources:
    - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
    - "https://purl.pt/19841/1/bibliografia/bibliografia.html"

