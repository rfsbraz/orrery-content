  title: "Mar Novo"
  authorIds: [sophia-de-mello-breyner-andresen]
  published: 1958
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Her fifth collection, its title poem, "Este é o Tempo", among the
    sources' own examples of her absolute-time poems - the same year she
