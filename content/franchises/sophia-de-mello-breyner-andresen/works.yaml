- id: sophia-de-mello-breyner-andresen/o-cristo-cigano
  title: "O Cristo Cigano"
  authorIds: [sophia-de-mello-breyner-andresen]
  published: 1961
  subseries: null
  canonTier: core
  format: poem
  synopsis: >
    A single long narrative poem, drawn from an Andalusian legend the
    Brazilian poet João Cabral de Melo Neto told her in Seville, written in
    a Baroque register she herself set apart from the rest of her poetic
    work.
  note: >
    Full title "O Cristo Cigano ou A Lenda do Cristo Cachorro". 1st ed.
    1961, Lisbon, Estúdios Cor/Minotauro, illustrated by Júlio Pomar - a
    numbered, author-signed print run of 400 copies. Catalogued by the BNP
    bibliography under POESIA alongside the fourteen collections rather than
    under PROSA, and by a peer-reviewed article on its Baroque form
    (Revista Decifrar) as a distinct narrative-poem "special case" within
    her lyric, which is why `format: poem` rather than
    `poetry-collection` here.
  sources:
    - "https://purl.pt/19841/1/bibliografia/bibliografia.html"
    - "https://www.periodicos.ufam.edu.br/index.php/Decifrar/article/view/13916"

- id: sophia-de-mello-breyner-andresen/livro-sexto
