  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Her sixth collection and, at the time, her most decorated: the
    Sociedade Portuguesa de Escritores' Grande Prémio de Poesia in 1964,
    the first major literary prize of her career.
  note: >
    1st ed. 1962, Lisbon, Livraria Morais Editora.
  sources:
    - "https://en.wikipedia.org/wiki/Sophia_de_Mello_Breyner_Andresen"
    - "https://purl.pt/19841/1/bibliografia/bibliografia.html"

