  published: 1984
  subseries: null
  canonTier: core
  format: short-story-collection
  synopsis: >
    Five tales of land and sea - "História da Gata Borralheira", "O
    Silêncio", "A Casa do Mar", "Saga" and "Vila d'Arcos" - in which
