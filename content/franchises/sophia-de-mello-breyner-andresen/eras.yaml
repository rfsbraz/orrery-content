# Creative periods: none established here. Her fourteen lifetime poetry
# collections run continuously from 1944 to 1997 with no publishing gap
# longer than six years (Musa 1994 to O Búzio de Cós 1997 is the shortest
# gap; Ilhas 1989 to Musa 1994 the longest before that); her two tale
# collections sit twenty-two years apart (1962, 1984); her eight children's
# books cluster tightly in 1958-1970 with one late outlier (A Árvore,
# 1985); and all five stage plays are late work, 1993-2001, a genuinely
# distinct late-career turn to a genre she had never published in before.
# That last fact is a single hinge (prose to theatre, sometime in her
# seventies), not a scheme dividing her sixty years into spans with themes
# of their own. No source consulted here offers a named periodisation of
# her work (an "early/middle/late Sophia" of the kind Portuguese criticism
# has articulated for some other twentieth-century poets), and a
# periodisation derived only from the publication dates above, with no
# received critical source behind it, would be invented rather than
# received.
