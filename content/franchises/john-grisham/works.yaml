# Bibliography (works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent (user data references them). Dates
# are year-precision (docs/SCHEMA.md); the default reading order (all works,
# publication order) is DERIVED from this file, never written by hand.
#
# SCOPE. Every adult novel from A Time to Kill (1989) through the announced
# The French Illusion (2026); the complete 7-book Theodore Boone YA series;
# both short-story collections (Ford County, Sparring Partners) and every
# short piece that had its own standalone publication event before or instead
# of being collected; both true-crime nonfiction books; the one screenplay he
# is actually credited as writing; and one multi-author anthology essay.
#
# CANON TIER is a publication-kind judgment, not a fame or quality one
# (SCHEMA.md, CURATION.md#7) - the same discipline this catalogue already
# applies to Christie (66 novels core regardless of which are most loved;
# extended is short-story collections and the Westmacott romances) and to
# Coben (18 standalones core alongside the Bolitar series; extended is the
# YA-imprint spin-off). Grisham has no natural "acclaimed vs minor" split
# among his 40-plus adult novels - critical and commercial reception varies
# title to title, but every one of them is a full trade novel in his primary
# adult mode, whatever its genre (courtroom thriller, baseball, a heist
# trilogy, a 2025 whodunit, a 2026 spy novel). So CORE here means exactly
# that: every adult novel, full stop, including the non-legal-genre ones
# Wikipedia itself marks apart (A Painted House, Skipping Christmas,
# Bleachers, Playing for Pizza, Calico Joe, Sooley, the Camino Island
# trilogy). EXTENDED is reserved for real category shifts: the Theodore Boone
# YA series (a different imprint and a different readership entirely), the
# two short-story collections, and the two nonfiction books. APOCRYPHA is
# for what never had a normal trade-novel life at all: ebook-only singles
# that were never collected, one multi-author anthology essay, and the one
# screenplay.
#
# SUBSERIES. Five real ones, all publisher/character-confirmed, none
# invented: Jake Brigance (A Time to Kill / Sycamore Row / A Time for Mercy,
# plus the "Homecoming" novella inside Sparring Partners), Mitch McDeere
# (The Firm / The Exchange), Sebastian Rudd (Rogue Lawyer, plus the "Partners"
# e-short), Lacy Stoltz (The Whistler / The Judge's List, plus the "Witness
# to a Trial" e-short), and Camino Island (a non-legal heist trilogy sharing
# novelist Mercer Mann and bookseller Bruce Cable throughout - confirmed via
# Camino Ghosts' own plot summary). Per this catalogue's rule that a
# collection containing a series novella is not itself part of that series,
# Ford County and Sparring Partners both carry subseries: null even though
# each contains Ford-County/Brigance-adjacent material - see the notes on
# each. No crossover exists between any of the five threads (each stays in
# its own lane): a real, verified fact, not an assumption carried over from
# the request that first proposed this wing.
#
# CORRECTIONS TO THE PUBLISHED RECORD. Several widely repeated details do
# not survive cross-checking against a second, more specific source:
# - Theodore Boone ran 2010-2019, not 2010-2016. Wikipedia's own main
#   bibliography article lists the seventh book, The Accomplice, under 2016
#   in one place; the character's own dedicated Wikipedia page and its
#   infobox both date The Accomplice to May 14, 2019, and no fan or
#   publisher list found dates it 2016. Treated as a Wikipedia inconsistency,
#   resolved to the later, more specific, independently corroborated date.
# - "Sparring Partners" as a Sebastian Rudd 0.5 novella (2016) does not
#   exist. The 2016 Kindle Single is titled "Partners" (confirmed on
#   PenguinRandomHouse.com and Goodreads) and is a Rogue Lawyer prequel about
#   how Rudd found his driver/bodyguard. "Sparring Partners" is a different,
#   unrelated work: the title novella of the 2022 collection, about the
#   feuding Malloy brothers - no Rudd connection at all. Wikipedia's main
#   bibliography article conflates the two under the Sebastian Rudd heading;
#   the two are catalogued here as the separate works they are.
# - "The Tumor" is dated 2015: the Focused Ultrasound Foundation's own
#   retail listings (Amazon, Barnes & Noble) give a December 4, 2015 release,
#   and Grisham introduced the story at a Foundation TEDx talk in
#   Charlottesville that same December. Wikipedia's main bibliography article
#   lists it as 2016 in its "Uncollected short stories" list, but its own
#   navbox template (transcluded across Grisham-related articles, including
#   this same page) lists The Tumor at 2015 - Wikipedia disagreeing with
#   itself, not a rival source with an equal claim.
# - Lacy Stoltz's surname is spelled two ways even within Wikipedia's own
#   pages (its Judge's List article uses both "Stoltz" and "Stolz" in
#   adjacent paragraphs). "Stoltz" is used here, and is now confirmed against
#   the books' own text: the excerpts John Grisham's own site posts from both
#   The Whistler and The Judge's List consistently spell the character's name
#   "Lacy Stoltz" throughout.
#
# CONSIDERED AND LEFT OUT:
# - The Gingerbread Man (1998 film): based on a discarded, unpublished
#   Grisham manuscript, but the screenplay itself was written by director
#   Robert Altman (credited as "Al Hayes") - the film's own Wikipedia infobox
#   states "Screenplay by Robert Altman (as Al Hayes)" and "Based on: A
#   manuscript by John Grisham". Not a Grisham-authored work by this wing's
#   own rule (an adaptation of his material is not a work by him) - Mickey
#   (2004), where Grisham is the sole credited screenwriter, is the one
#   screenplay that qualifies and is catalogued below. (Wikipedia's own
#   Grisham-bibliography navbox lists The Gingerbread Man under
#   "Screenplays" as his, contradicting the film's own infobox on the same
#   site - another instance of the navbox disagreeing with the underlying
#   article rather than a real rival claim.)
# - The Wavedancer Benefit (2002): an audio recording of a live charity
#   reading/tribute event for injured audiobook narrator Frank Muller,
#   crediting Grisham alongside Stephen King, Pat Conroy and Peter Straub.
#   No title-page work of his own authorship exists here to catalogue - it is
#   a recorded appearance, not a book - and Stephen King's own wing (95
#   works) does not carry it either, on the same reasoning. Recorded here as
#   a considered omission rather than an oversight.

