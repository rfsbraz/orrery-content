#
# One entry: the 1990s legal-thriller boom, a genre-wide moment Grisham is
# credited with alongside Scott Turow rather than a fact personal to him
# (which is why it sits here and not on the author file). Everything else
# considered for this file - the real, sourced connections between specific
# novels and the mass-tort/tobacco litigation of the 1990s (The Runaway
# Jury, The King of Torts) - turned up plenty of literary analysis but no
# dated, on-the-record statement from Grisham himself naming a specific
# case as a novel's source, so nothing was added for either book.

- id: john-grisham-legal-thriller-boom-1991
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 1991
  dateRange: "1989-1996"
  title: The Firm ignites the 1990s legal-thriller boom
  scope: culture
  reach: franchise
  impact: med
  description: >
    Scott Turow's Presumed Innocent (1987) had already returned the legal
    thriller to the bestseller lists, but The Firm's 1991 breakout -
    followed in quick succession by The Pelican Brief, The Client, The
    Chamber and The Runaway Jury - turns the genre into the decade's
    dominant commercial form. Grisham and Turow are named together, then
    and since, as the two writers who defined the 1990s legal thriller.
  spoilerAfter: null
  sources:
    - https://crimereads.com/drama-in-the-court-a-brief-history-of-the-legal-thriller/
    - https://en.wikipedia.org/wiki/Legal_thriller
