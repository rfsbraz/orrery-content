# ADDITIONAL reading orders only. The DEFAULT order - all 58 works in
# publication-chronological order - is derived automatically from works.yaml
# and is NOT listed here. Grisham has almost no eras and no debated internal
# chronology (see eras.yaml's finding and each order's rationale below): the
# real editorial work on this shelf is pulling a recurring thread out from
# between the standalones it is scattered through, the same shape Michael
# Connelly's Jack McEvoy order and Harlan Coben's Mickey Bolitar order take.
#
# Four of the five subseries works.yaml documents qualify: Jake Brigance (3
# novels), Lacy Stoltz (2 novels plus a short-story prequel), Camino Island (3
# novels) and Theodore Boone (7 novels) each carry a real multi-year gap
# between entries, with a dozen or more unrelated Grisham novels published in
# between - a reader following just the thread meets it as a small, continuous
# set instead of a surprise return every few years.
#
# Mitch McDeere (The Firm, The Exchange) and Sebastian Rudd (Rogue Lawyer,
# Partners) do NOT get orders, on the same reasoning Coben's Win/Wilde/Sami
# Kierce (one or two books each) and Connelly's Terry McCaleb/Catalina (two
# books) ship none: at two books, there is nothing for a reader to feel pulled
# out of line - "read The Firm, then decades later The Exchange" and "read
# Rogue Lawyer, then its one short prequel" are already exactly what the
# derived default gives, in full, for free. Both stay covered by it.
#
# Checked and declined: a Grisham "essentials" shortlist. Several outlets rank
# his full catalogue (Collider and ScreenRant both publish "20 Best John
# Grisham Books" lists), but by different methods - one sorts on aggregate
# Goodreads star ratings, the other is a single writer's own ranking - and
# their top picks do not converge on a shared shortlist the way the entry-point
# recommendations below do. That is exactly the "one blog post, or several that
# do not agree" shape this catalogue declines to promote into a curated order;
# see startHere for what does have real, converging sourcing.

- id: john-grisham/jake-brigance-in-order
  name: "Jake Brigance, in order"
  type: curated
  source: canon
  rationale: >
    Grisham's most enduring character, pulled out from between the other
    fifty-five works he's scattered across on the full shelf.
    [[work:john-grisham/a-time-to-kill|A Time to Kill]] is his 1989 debut;
    [[work:john-grisham/sycamore-row|Sycamore Row]] picks Jake back up in the
    same fictional Clanton, Mississippi twenty-four years later in real time
    (three, for Jake); [[work:john-grisham/a-time-for-mercy|A Time for Mercy]]
    follows seven years after that. Publication order settles nothing here -
    the three arrived in exactly this sequence and no guide argues for reading
    them any other way - but reading them close together keeps Clanton's
    recurring cast (Harry Rex Vonner, Lucien Wilbanks) and Jake's own
    slow-earned reputation legible across the gaps, instead of meeting him
    again after a dozen unrelated Grisham novels have gone by. Sycamore Row is
    written to stand on its own - readers who come to it without A Time to
    Kill first still find a complete, self-contained trial - so this order is
    a continuity aid, not a requirement; the cost of pulling it out this way
    is the reverse benefit, the pleasant surprise of Jake resurfacing mid-shelf
    after years away, which this order trades for keeping the thread
    continuous.
  orderedWorkIds:
    - john-grisham/a-time-to-kill
    - john-grisham/sycamore-row
    - john-grisham/a-time-for-mercy
  debated:
    - "\"Homecoming\", inside the 2022 collection Sparring Partners, revisits
       Jake and this same Clanton continuity, but is not catalogued as its own
       work (per this catalogue's rule that a collection is not part of the
       series a story inside it belongs to) - see Sparring Partners in the
       derived default for where it falls."
    - "Ford County (2009) and The Last Juror (2004) are both set in Clanton
       and share supporting characters with these three novels, but center
       different protagonists, so they stay out of Jake's own thread; the
       derived default still carries both in their place."
  sources:
    - https://en.wikipedia.org/wiki/A_Time_to_Kill_(Grisham_novel)
    - https://en.wikipedia.org/wiki/A_Time_for_Mercy
    - https://www.goodreads.com/questions/301878-do-you-need-to-read-a-time-to-kill-to

- id: john-grisham/lacy-stoltz-in-order
  name: "Lacy Stoltz, in order"
  type: curated
  source: canon
  rationale: >
    Judicial-conduct investigator Lacy Stoltz's own thread, introduced in a
    short story built specifically to open the door before her first novel:
    [[work:john-grisham/witness-to-a-trial|Witness to a Trial]] reached
    readers weeks ahead of [[work:john-grisham/the-whistler|The Whistler]] in
    2016, written to introduce Lacy rather than to reward someone who has
    already read the novel it precedes.
    [[work:john-grisham/the-judges-list|The Judge's List]] follows five years
    later, with a dozen other Grisham novels (both Camino Island books so
    far, two more Theodore Boones, The Reckoning, The Guardians and A Time for
    Mercy among them) published in between. Pulling the thread out here means
    reading Lacy's cases back to back instead of years apart. The cost: this
    order leaves out everything else Grisham published across those five
    years, and a reader who wants novels only loses nothing skipping the short
    story - The Whistler introduces Lacy on its own terms regardless.
  orderedWorkIds:
    - john-grisham/witness-to-a-trial
    - john-grisham/the-whistler
    - john-grisham/the-judges-list
  sources:
    - https://www.penguinrandomhouse.com/books/554117/witness-to-a-trial-by-john-grisham/
    - https://en.wikipedia.org/wiki/The_Whistler_(novel)
    - https://en.wikipedia.org/wiki/The_Judge%27s_List

- id: john-grisham/camino-island-in-order
  name: "The Camino Island trilogy, in order"
  type: curated
  source: canon
  rationale: >
    Grisham's one recurring non-legal-thriller thread: bookseller Bruce Cable
    and novelist Mercer Mann's story runs across three books from 2017 to
    2024 - a manuscript heist, a hurricane-cover murder, a land dispute -
    with dozens of unrelated legal thrillers published in between them on the
    full shelf. Reading the three together keeps Cable, Mann and the island
    itself continuous rather than a surprise return every few years. The
    cost: read this way, you set aside what Grisham is actually best known
    for almost entirely - no courtroom, no law firm - and each book is built
    to work as its own satisfying stand-alone mystery, so reading them back
    to back trades some of that surprise-return pleasure for continuity
    instead.
  orderedWorkIds:
    - john-grisham/camino-island
    - john-grisham/camino-winds
    - john-grisham/camino-ghosts
  sources:
    - https://jgrisham.com/camino-island
    - https://en.wikipedia.org/wiki/Camino_Island
    - https://en.wikipedia.org/wiki/Camino_Winds

- id: john-grisham/theodore-boone-in-order
  name: "Theodore Boone, in order"
  type: curated
  source: canon
  rationale: >
    The complete seven-book middle-grade series, published by Grosset &
    Dunlap/Puffin rather than Grisham's usual adult imprint, for a distinctly
    younger readership than the other fifty-one works on this shelf. It
    follows thirteen-year-old Theo Boone through one Strattenburg school year
    after another, in the order the books themselves were written, with no
    guide arguing for any other sequence. Pulled out here, a reader - or a
    parent choosing what's next for a child partway through - can walk Theo's
    seven cases in sequence without also sorting through Grisham's adult
    thrillers scattered through the same years. The cost of the pull is
    exactly that: none of Grisham's courtroom or crime fiction for grown
    readers appears in this order, by design.
  orderedWorkIds:
    - john-grisham/theodore-boone-kid-lawyer
    - john-grisham/theodore-boone-the-abduction
    - john-grisham/theodore-boone-the-accused
    - john-grisham/theodore-boone-the-activist
    - john-grisham/theodore-boone-the-fugitive
    - john-grisham/theodore-boone-the-scandal
    - john-grisham/theodore-boone-the-accomplice
  sources:
    - https://en.wikipedia.org/wiki/Theodore_Boone
