# Creative periods. There are none on record.
#
# No critic, scholar, reference work, settled fan consensus or the author
# himself divides this career into named creative periods with recognisable
# names and boundary years, the way "the Golden Age of detective fiction" or
# "the Bachman years" are received. Searched in English, his working and
# critical language, and in Portuguese, this catalogue's reading language;
# both corpora return chronological biography and book-by-book criticism.
#
# What the fullest sources actually do:
#
#  - His own site's biography names no phases at all. It sums the whole career
#    in one figure - "the author of more than fifty consecutive #1
#    bestsellers" - and lists the recent books flat (https://jgrisham.com/bio/).
#  - The two book-length critical studies are organised by novel, not by
#    period. Mary Beth Pringle's John Grisham: A Critical Companion (Greenwood,
#    1997) gives one chapter to each novel; her follow-up volume is titled
#    Revisiting John Grisham (Greenwood, 2007) and covers "1997 to the
#    present", which is where the first volume stopped, not a phase of the
#    work. That pair is the nearest thing here to the Twayne studies that
#    periodise Stephen King in their own subtitles ("The First Decade", "The
#    Second Decade", each naming its boundary books) - and the difference is
#    the whole point: "Revisiting" names no period and claims none.
#  - Patrick Anderson's The Triumph of the Thriller (Random House, 2007)
#    argues the genre's history, placing Grisham as the writer who turned
#    Scott Turow's invention into bestsellers, and draws no line through his
#    shelf.
#  - Reference works run straight through. Wikipedia carries a single
#    undivided "Writing career" section; the Academy of Achievement profile and
#    Contemporary Authors both narrate one continuous rise at "the rate of
#    nearly one a year".
#  - The major-press career retrospective says so outright. David Marchese's
#    New York Times Magazine interview, published on the 47th book, opens on
#    exactly this quality: "while his professional life has been marked by a
#    certain steadfastness, his personal and political evolution wasn't quite
#    so smooth" (https://www.nytimes.com/interactive/2022/06/21/magazine/john-grisham-interview.html).
#    The evolution that piece traces is a man's politics, not a writer's
#    periods.
#  - Fandom has named nothing either. The phase language that exists is
#    single-author ranking posts issuing quality verdicts on stretches of the
#    shelf, each with its own boundaries and none picked up by anyone else.
#
# Three shapes look like candidate boundaries and fail on the record itself,
# before sourcing is even reached:
#
#  - THE NON-LEGAL NOVELS ARE CONCURRENT, NOT A PERIOD. Every departure sits
#    beside a legal thriller in the same or the adjacent year:
#    [[work:john-grisham/a-painted-house|A Painted House]] and
#    [[work:john-grisham/skipping-christmas|Skipping Christmas]] (2001) against
#    [[work:john-grisham/the-summons|The Summons]] (2002),
#    [[work:john-grisham/bleachers|Bleachers]] (2003) against
#    [[work:john-grisham/the-king-of-torts|The King of Torts]] (2003),
#    [[work:john-grisham/playing-for-pizza|Playing for Pizza]] (2007) against
#    [[work:john-grisham/the-appeal|The Appeal]] (2008),
#    [[work:john-grisham/calico-joe|Calico Joe]] (2012) against
#    [[work:john-grisham/the-racketeer|The Racketeer]] (2012),
#    [[work:john-grisham/sooley|Sooley]] (2021) against
#    [[work:john-grisham/the-judges-list|The Judge's List]] (2021), and the
#    Camino Island trilogy (2017, 2020, 2024) alongside the legal thrillers of
#    each of those years. The pattern runs from 2001 to the announced
#    [[work:john-grisham/the-french-illusion|The French Illusion]] (2026)
#    without ever displacing the annual courtroom novel. Grisham describes the
#    arrangement in exactly those terms: "I can play around with a baseball
#    book or a football book or short stories or a kids' book in my spare time,
#    but I know my readers want the legal thriller every fall" (New York Times
#    Magazine, above). An era renders full-bleed across the whole timeline; a
#    "departures" plate would render over the legal thrillers it excludes, on
#    the author's own account of what he was doing.
#  - THE SEQUELS DO NOT CUT THE SHELF EITHER. The return to Jake Brigance in
#    [[work:john-grisham/sycamore-row|Sycamore Row]] (2013), 24 years after
#    [[work:john-grisham/a-time-to-kill|A Time to Kill]], is a real and
#    dateable event, but it opens nothing: Clanton and its lawyers had already
#    recurred in [[work:john-grisham/the-last-juror|The Last Juror]] (2004) and
#    [[work:john-grisham/ford-county|Ford County]] (2009), and the standalones
#    continue unbroken afterwards through
#    [[work:john-grisham/gray-mountain|Gray Mountain]] (2014),
#    [[work:john-grisham/the-rooster-bar|The Rooster Bar]] (2017),
#    [[work:john-grisham/the-reckoning|The Reckoning]] (2018),
#    [[work:john-grisham/the-guardians|The Guardians]] (2019),
#    [[work:john-grisham/the-boys-from-biloxi|The Boys from Biloxi]] (2022) and
#    [[work:john-grisham/the-widow|The Widow]] (2025). All five subseries run in
#    parallel with the standalone shelf, not after it.
#  - THEODORE BOONE IS A SECOND READERSHIP, NOT A CHAPTER. The seven-book YA
#    series (2010-2019) is a genuine category shift, but a 2010-2019 plate
#    would render across eleven concurrent adult books it does not describe.
#
# The publishing record offers no boundary to fall back on. Doubleday has
# published every adult novel from [[work:john-grisham/the-firm|The Firm]]
# (1991) to the present without a break; the single publisher change in the
# whole bibliography is at the debut, A Time to Kill, issued by Wynwood Press
# in 1989 in a 5,000-copy printing after 28 rejections. Naming a period after
# that would slice a 58-work shelf at book one and call one title an era.
#
# Two near-misses are recorded so they are not mistaken for periodisations
# later. Salem Press's reference article (June Harris, via EBSCO) names a
# boundary work in passing - "starting with The Chamber, he began to include
# some social commentary in his stories, and his plots became more intricate"
# - which is one sentence, in one source, naming no period, and would cut a
# 37-year shelf into 1989-1993 and everything else. And Newsweek's Malcolm
# Jones called Grisham "the best-selling author" of the 1990s, a sales record
# for a decade rather than a creative period, and one that did not stop at its
# edge: the #1 bestsellers run continuously either side of it.
#
# eras: [] is the honest record of a career that has published at nearly one
# novel a year since 1989 with no break anyone has named - its author
# included.
[]
