# A wing spans an author's complete published work, not just the genre he is
# famous for. Grisham's shelf is almost entirely legal thrillers, but five
# real subseries run
# through it - Jake Brigance, Mitch McDeere, Sebastian Rudd, Lacy Stoltz and
# the non-legal Camino Island heist trilogy - modelled as `subseries` on
# works.yaml inside this one wing, never as separate franchises. The
# Theodore Boone YA series is his one genuinely distinct-audience spin-off.
# See works.yaml's header for the tiering principle and every sourced
# correction found along the way.
id: john-grisham
name: John Grisham
kind: author
description: >
  The complete published work of John Grisham: forty-plus legal thrillers from
  his 1989 debut [[work:john-grisham/a-time-to-kill|A Time to Kill]] through
  his most recent novels, spanning small-town Mississippi courtrooms to
  Washington power plays; five recurring threads inside that shelf -
  [[work:john-grisham/a-time-to-kill|Jake Brigance]],
  [[work:john-grisham/the-firm|Mitch McDeere]],
  [[work:john-grisham/rogue-lawyer|Sebastian Rudd]],
  [[work:john-grisham/the-whistler|Lacy Stoltz]] and the non-legal
  [[work:john-grisham/camino-island|Camino Island]] heist trilogy; the
  Theodore Boone series for younger readers; two true-crime nonfiction books;
  two short-story collections; and a handful of ebook-only shorts and
  contributions.
authorIds: [john-grisham]
themePreset: yellow-pad-brief

# Capabilities (docs/SCHEMA.md) are auto-detected from the data and left auto
# here on purpose: with no theme.art, no events.yaml and no eras.yaml yet,
# `river` and `companion` will not activate until those exist; `wizard` will
# not activate until a startHere is written; `editions` will not activate
# until editions.yaml exists. Nothing needs forcing off in the meantime.
features:
  river: auto
  wizard: auto
  companion: auto
  editions: auto

globalEvents:
  include: []
  exclude:
    - sept-11-2001  # lived through it; no novel centers on post-9/11 security or terrorism
    - financial-crisis-2008  # The Litigators (2011) engagement with the crisis is unverified; excluded pending press-archaeology review
    - covid-19-pandemic-2020  # lived through it; novels do not write about it
    - world-war-i-1914  # predate his birth; engine filters these
    - world-war-ii-1939  # predate his birth; engine filters these
    - pulp-magazines-1926  # predate his birth
    - penguin-paperback-1935  # predate his birth
    - armed-services-editions-1943  # predate his birth
    - lady-chatterley-trial-1960  # age 5; permissive publishing was industry infrastructure, not in his work
    - fantasy-paperback-boom-1965  # not a fantasy writer
    - comics-code-authority-1954  # born 1955; not a comics writer
    - carnation-revolution-1974  # Portuguese event; his work is set in America
    - portugal-bailout-2011  # Portuguese event; his work is set in America
    - chain-bookshop-1982  # benefited sales; not a theme in novels
    - online-bookselling-1995  # industry mechanism; novels do not write about it
    - ebook-and-self-publishing-2007  # industry mechanism; novels do not write about it
    - prestige-fantasy-adaptation-2011  # works adapted but not as fantasy
    - booktok-2020  # modern phenomenon; career predates and novels do not engage with it
    - elementary-education-act-1870  # predate his birth

sources:
  - https://en.wikipedia.org/wiki/John_Grisham
  - https://www.jgrisham.com/books/
