# Editions of John Grisham: 57 English (en) editions over 57 of 58 works.
# English only - Grisham has been widely translated, including into
# Portuguese, but no pt-PT edition is recorded here; that is a gap, not a
# finding of absence.
#
# SOURCING. Every ISBN is taken from its own OpenLibrary edition record
# (openlibrary.org/isbn/<isbn>.json, cited per entry) or, for the three
# entries OpenLibrary does not carry at all (Partners, Witness to a Trial,
# The French Illusion), from the book's own product page at
# penguinrandomhouse.com, the publisher's storefront and Source Ranking #1 in
# docs/CURATION.md. Every OpenLibrary record was opened and read, not taken
# from a title-only search hit: several editions share an OpenLibrary "work"
# with a same-year Limited Edition, Large Print, audiobook or e-book record
# carrying an identical or near-identical title, the single most common trap
# in this catalogue (see below).
#
# WHICH EDITION. Doubleday (via its Bantam/Dell/Vintage paperback imprints)
# has published nearly the entire adult catalogue since The Firm (1991), so
# the default pick throughout is that book's own original Doubleday trade
# hardcover - not a same-year Limited/Signed edition, not a Large Print
# edition, not an e-book-only OpenLibrary stub - confirmed on each entry by
# opening its OpenLibrary record and checking for exactly those flags before
# recording the ISBN. Nine records looked like a plain trade hit from their
# title alone and turned out to be a Limited Edition or Large Print edition
# once opened: The Brethren (9780385497480), The Rainmaker (9780385475136),
# The Pelican Brief (9780385470483 - literally `"edition_name": "Limited
# Edition"`), The Associate (9780385528030), The Broker (9780385510462), The
# Last Juror (9780385510448), The Confession (9780385528054), Guardians and
# Camino Winds each carry a same-year Limited Edition ISBN alongside the
# plain one. Every one of those was swapped for a same-year, non-flagged
# Doubleday trade ISBN instead - never for a later reprint unless no plain
# original could be found.
#
# A TIME TO KILL: FIRST EDITION VS. CURRENT PRINT. Grisham's 1989 debut was
# not a Doubleday book - Wynwood Press published it first, in a famously
# small initial printing (Doubleday only picked up the backlist after The
# Firm's success). The Wynwood first edition does have a real, verifiable
# ISBN (9780922066032, under works/OL77001W, distinct from the ISBN-less
# work record at works/OL34706016W a narrower search surfaces first) - see
# the entry's own note for the details. Per this skill's default rule ("the
# most recent in-print edition... the one a reader can actually buy today"),
# the edition recorded below is still Dell's current 20th-anniversary
# mass-market paperback (2009, ISBN 9780440245919) rather than the
# long out-of-print Wynwood first printing, not because the Wynwood ISBN is
# unrecoverable.
#
# THEODORE BOONE: A DIFFERENT IMPRINT. All seven books are Dutton Children's
# Books (a Penguin Young Readers imprint), never Doubleday - confirmed
# individually on each entry, not assumed from the adult pattern. The Scandal
# (2016) is the one exception where the OpenLibrary record itself omits the
# `publishers` field; it is still recorded as Dutton on the strength of its
# ISBN sitting inside the same 978-0-525-4263xx block as every other
# confirmed Dutton Boone hardcover and its Internet Archive/library holdings,
# flagged in its own note rather than asserted as fact.
#
# THE APOCRYPHA-TIER E-SHORTS DO HAVE ISBNs, JUST DIGITAL ONES. Partners
# (2016) and Witness to a Trial (2016) are Kindle Single-style digital
# originals with no print run at all, but PenguinRandomHouse.com assigns each
# a standard-shaped ISBN-13 for the e-book/audio product itself (9780385541923
# and 9780385542579) - format `ebook`, recorded here rather than omitted,
# since a real identifier exists and OpenLibrary simply never indexed either
# one. The Tumor (2015) is different again: a free promotional short released
# by the Focused Ultrasound Foundation (not Grisham's usual publisher) that
# DOES carry a conventional trade ISBN (9781495179402, self-published via
# CreateSpace) - also recorded. Mickey (2004) is the one apocrypha work with
# no edition at all: it is a screenplay for a film, never published as a
# book in any form, and no ISBN, print or digital, was found anywhere for it.
# That is a market fact, not a research gap - see the note on the work itself.
#
# DON'T QUIT YOUR DAY JOB (2010): an anthology, not a Grisham solo book, and
# harder to source than the numbered novels - OpenLibrary's title search
# surfaces a dozen unrelated books sharing the generic title before the real
# one, and the record it does hold under the correct MP Publishing ISBN omits
# the publisher name entirely. Confirmed instead by its own table of contents
# (which lists "underwear salesman -- John Grisham" among the 23 essays,
# matching this catalogue's synopsis) and cross-checked against a second,
# independent Amazon listing for the same MP Publishing 2010 edition. That
# same table of contents gives Grisham's own essay a title not otherwise
# established in works.yaml's own sources: "The Underwear Salesman".
#
# THE FRENCH ILLUSION (forthcoming Sep 29, 2026): unpublished, so OpenLibrary
# carries no record at all. Sourced instead directly from its own
# PenguinRandomHouse.com product page, which lists a hardcover ISBN, page
# count and a release date matching works.yaml's own `forthcoming` field. A
# preorder identifier, not a published book yet - flagged in its own note.
#
# ISBN scope check: every ISBN below was independently re-derived (EAN-13
# check digit recomputed from the first twelve digits, not merely trusted
# from OpenLibrary's own `isbn_ok`-style flag) and every one begins 978-0 or
# 978-1 (English-language registrant groups) - no region mismatch is possible
# for an English-only pass, so the pt-PT/pt-BR trap this skill warns about
# does not apply here. No ISBN below is duplicated across two entries.

# =============================================================================
# English (en) - 57 editions, 57 of 58 works
# =============================================================================

