# Branding for the Miguel de Cervantes wing (see the design law: palette + one
# display face + one signature, readability first, no genre costume). The `art`
# block below is the wing's visual language for generated illustrations,
# settled once the wing's aura existed to draw for.
preset: siglo-de-oro-parchment
palette:
  bg: "#14110f"        # near-black, an iron-gall-ink undertone rather than a warm brown
  surface: "#1c1815"   # a hair lifted, for cards
  ink: "#e8e0cf"        # aged manuscript/print paper - high contrast, very readable
  muted: "#8f8570"      # faded parchment-grey-brown, for metadata
  accent: "#5c4fae"     # one restrained indigo/ultramarine, for links and markers only -
                        # the prized pigment of illuminated manuscripts and fine printing
                        # in Cervantes's own period, and a hue this catalogue's warm
                        # amber-to-oxblood-heavy accent set (King, Rowling, McCarthy,
                        # Connelly, Sanderson/Jordan, Pratchett, Peixoto, Valter Hugo Mãe)
                        # does not already occupy
displayFace: fraunces  # a characterful literary serif, for a wing this foundational
signature: thread       # a quiet hairline - the shelf is sparse (eight works across
                        # three decades, with a twenty-year silence in the middle) rather
                        # than continuously productive, so a bold rail would overstate it
notes: >
  Restraint over costume: no windmills, no tilting-knight silhouette, no
  sun-baked La Mancha cliche standing in for the work itself. Ink, paper and
  a single manuscript-blue accent, carried by the plainest possible palette
  a four-century-old book earns on the strength of the text alone.
art:
  # Checked against every other wing's theme.yaml before writing this
  # (`theme_digest.py --exclude miguel-de-cervantes`). Two wings collide on
  # both displayFace (fraunces) and signature (thread): Tana French
  # (bog-noir, an incised dry-point line on damp peat-toned paper, cold
  # heather-violet accent) and J. K. Rowling (manuscript-ink, a dry ballpoint
  # biro line on ruled exercise-book paper, aged postbox-red accent). Neither
  # collides on hue - the accent below sits in indigo/ultramarine, unclaimed
  # by any other wing - and this wing's line, ground and material culture
  # (an iron-gall dip pen on handmade rag paper, Golden Age Castile and the
  # Mediterranean rather than modern Dublin or Edinburgh) sit far enough from
  # both that the three will not be mistaken for one another.
  #
  # The wing leans toward the material honesty of what Cervantes actually
  # depicts - ledgers, requisition slips, a rented room, a hand press -
  # rather than the chivalric-romance imagery his own fiction parodies. Don
  # Quixote is a book about a man whose imagination outruns his
  # circumstances; drawing this wing in swords-and-plumes fantasy register
  # would depict the delusion the text is laughing at, not the text itself.
  emblem:
    object: >
      A dog-eared, cheaply bound romance of chivalry lying closed under a
      heavier stack of ruled ledger sheets and requisition slips, a single
      trimmed quill laid across both, its nib worn flat rather than sharp.
    why: >
      Don Quixote opens with an aging gentleman whose head has been turned
      by too many books of chivalry; the twenty years between La Galatea
      and the Quixote were not spent writing anything at all, but
      requisitioning wheat and oil for the Armada and collecting overdue
      taxes across Andalusia, work that left Cervantes jailed twice and
      excommunicated once before a page of the novel existed. The heavier
      stack outweighing the lighter book states that plainly: the fiction
      he set out to parody, physically buried under the paperwork of the
      working life that produced it.
  motifs:
    - a composing stick and a fresh page proof at a hand press, its
      operator named on the frontispiece rather than invented (Juan de la
      Cuesta, Blas de Robles, Juan de Villarroel)
    - ransom papers and a religious order's seal, the paperwork of
      captivity rather than the captivity itself
    - an open-air corral de comedias trestle stage, benches empty after a
      performance
    - grain sacks, oil jars and a requisition ledger tied across a mule's
      saddle
    - a barred window and a locked door, unremarkable rather than gothic
    - a privilegio and printer's device stamped on a title page
    - a writing table crowded with more paper than surface
    - a gloved or bandaged left hand resting still beside an inkwell, never
      gripping the pen
  atmosphere: >
    Grounded, workaday and itinerant rather than heroic or magical - the
    material world of a jobbing writer who spent most of his working life
    as an unglamorous purveyor and tax collector on the roads of Andalusia,
    not a knight-errant's Spain. Sun and dust stand in for administration
    rather than adventure; a rented room's ink and paper stand in for
    glamour. The Mediterranean scenes (Lepanto, the Algiers captivity)
    carry the register of hard labour, confinement and waiting, never naval
    spectacle or Orientalist exoticism. Where the fiction itself turns
    fantastic - Persiles's shipwrecks and journeys to Rome, the captivity
    plays' tragedy, Numancia's collective sacrifice - it is still rendered
    through period material culture and solemn record, not fairy-tale or
    theatrical imagery.
  lineCharacter: >
    A fine iron-gall dip-pen line that browns slightly at the edge of a
    stroke, the way period ink oxidises on paper, laid down with a
    period-plausible single-nib inconsistency: heaviest just after the pen
    is dipped, thinning to a near-vanishing hairline as the ink runs dry
    before the next dip, rather than a uniform modern contour. Never a
    ruled straightedge, never a wash.
  backgroundTexture: >
    Coarse handmade rag paper in a warm buff tone, its laid lines (the
    chain and wire lines of a period mould) visible at a raking angle
    rather than painted in as a wash, with the occasional small foxing
    spot - the surface of a cheaply printed quarto four centuries on, never
    a luxury vellum or parchment finish, which belongs to the illuminated
    manuscript world Cervantes's own printed books were never part of.
  accentUse: >
    The manuscript-indigo on exactly one element per image, never a fill: a
    freshly pressed wax seal, a length of thread stitching a gathering of
    pages, the wet ink of a signature or stamp, one ribbon marking a place
    in a ledger.
  avoid:
    - windmills used as the default establishing image or as a stand-in for
      the whole book - a real period technology, allowed once among
      several ordinary structures on a working horizon, never centred,
      never given arms to tilt at
    - a knight in armour tilting a lance, plume flying - the parody's own
      target staged straight, exactly what the text undercuts
    - swashbuckling swords-and-plumes costume drama, doublet-and-ruff
      aristocratic finery standing in for a household mostly in debt
    - Orientalist exoticism for the Algiers captivity - minarets-and-scimitars
      imagery, harem or slave-market spectacle; render captivity as
      confinement, labour and waiting, not costume drama
    - Inquisition-dungeon horror cliches (rack, hood, torch-lit torture
      chamber) - nothing in Cervantes's own documented imprisonments
      supports them
    - an oversized ornate quill, an outsized wax seal or an unfurled
      parchment scroll used as generic "old book" shorthand
    - Sancho Panza's donkey or the tilt-at-a-windmill scene reached for as
      the default illustration for any Don Quixote material
    - Alonso Quixano's deathbed or his return to sanity at the end of Part
      Two
    - the Barcelona print-shop scene or Don Alvaro Tarfe, the answer to
      Avellaneda from late in Part Two
