# Additional reading orders. There are none on record.
#
# TWO CANDIDATES BOTH FAIL THE BAR FOR A RECORDED ORDER.
#
# 1. A curated order settling which of El trato de Argel and El cerco de
#    Numancia comes first. Both are dated `published: 1784` (Antonio de
#    Sancha's Madrid edition, the first time either reached print - see each
#    entry's note in works.yaml), so the derived default ties them, exactly
#    the kind of tie agatha-christie/poirot-novels exists to settle. But
#    unlike that five-tie case, this is one tie between two adjacent,
#    extended-tier plays that a reader is very unlikely to be reading as a
#    pair in the first place: the divergence test fails outright - nobody
#    feels two minor plays trade places at the tail of an eight-work shelf.
#    Composition order (both written and staged around 1582, in the same
#    captivity-inflected period) isn't a documented sequence between the two
#    either, only a shared window; there is no genuinely known intra-year
#    order here to encode, only a real tie with nothing riding on it.
#
# 2. A "prose only" order collecting the four core-tier works (La Galatea,
#    Don Quixote, Novelas ejemplares, Los trabajos de Persiles y
#    Sigismunda) and skipping the four extended-tier plays and poetry. The
#    core/extended split itself is sourced (works.yaml's header note: it
#    mirrors the Prose/Drama/Verse division of the English Wikipedia
#    infobox), but that is a bibliographic classification, not a documented
#    reading practice - no source found recommends walking the prose works
#    as a deliberate sequence while skipping the drama and verse outright.
#    Filtered by tier and sorted by year, it would also be identical to the
#    default order with four titles removed: no tie to settle, no thread
#    identity beyond "not drama or verse". The two startHere paths already
#    cover this reader's actual need - read Don Quixote, then (per a
#    sourced recommendation) Novelas ejemplares - without inventing an order
#    to carry it.
#
# A NOVELS-ONLY OR PLAYS-ONLY DEBATED PLACEMENT DOES NOT ARISE EITHER: every
# work in this wing sits in exactly one obvious slot (see works.yaml); there
# is no companion, anthology or disputed-attribution piece needing a home.
