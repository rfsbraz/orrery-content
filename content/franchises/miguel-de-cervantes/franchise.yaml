id: miguel-de-cervantes
name: Miguel de Cervantes
kind: author
description: >
  A soldier, captive and tax collector turned late-blooming novelist, whose
  one big book - told in two parts, ten years apart, the second written
  after an impostor's fake sequel - became the first modern novel.
