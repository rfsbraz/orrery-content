- id: miguel-de-cervantes/novelas-ejemplares/bertrand-2016-pt
  workId: miguel-de-cervantes/novelas-ejemplares
  isbn13: "9789722531733"
  language: pt-PT
  title: "Novelas Exemplares"
  translator: "Aquilino Ribeiro"
  format: paperback
  publisher: Bertrand Editora
  year: 2016
  note: >
    Aquilino Ribeiro's own celebrated but famously free rendering, not a
    literal translation - the publisher's own synopsis says as much
    ("é mais Aquilino do que Cervantes que aqui aparece"), so a reader
    reaching for a strictly faithful Novelas ejemplares should know this
    edition is closer to a Portuguese master novelist's retelling.
  sources:
    - https://www.wook.pt/livro/novelas-exemplares-miguel-de-cervantes-saavedra-aquilino-ribeiro/17385011

- id: miguel-de-cervantes/ocho-comedias-y-ocho-entremeses/humus-2022-pt
  workId: miguel-de-cervantes/ocho-comedias-y-ocho-entremeses
  isbn13: "9789897557934"
  language: pt-PT
  title: "Entremezes"
  format: paperback
  publisher: Edições Húmus
  year: 2022
  note: >
    Covers only the eight one-act entremeses from the 1615 volume - not the
    eight full-length comedias also bound into it, which this catalogue
    records as one work with them. A genuinely partial edition rather than
    an abridgement: a reader wanting the comedias will not find them here.
    Recorded anyway, with this note, because the alternative (no entry)
