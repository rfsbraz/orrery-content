# Concrete published editions: English, Portuguese (pt-PT) and, for the three
# works whose most substantial modern edition is a scholarly Spanish critical
# text rather than a translation, the original-language edition itself.
#
# Sourcing: publisher own-catalogue pages (wordsworth-editions.com, wook.pt,
# bertrand.pt) where reachable; archive.org's per-book metadata (scanned from
# a real physical copy, cross-checked against its embedded WorldCat/xisbn
# block) and openlibrary.org's /isbn/ endpoint elsewhere. Every ISBN below
# carries a valid check digit and resolves at one of those sources to the
# publisher, year and title recorded against it; none is derived from a prefix.
#
# COVERAGE: 6 of 8 works have at least one edition; 11 editions total. La
# Galatea, Novelas ejemplares and El cerco de Numancia are recorded in their
# original Spanish (no `title` field, since works.yaml's own `title` already
# is that language) rather than in translation - each is a real, still-cited
# scholarly critical edition (Cátedra's Letras Hispánicas series, twice), not
# a token entry. Viaje del Parnaso and El trato de Argel have no edition here:
# a repeated search (publisher catalogues, archive.org, Cátedra/Castalia's own
# critical-edition lines) turned up nothing past pre-ISBN 19th-century
# reprints for the former and a single non-978 identifier of unclear
# provenance for the latter - a fact about how thin the market is for
# Cervantes's earliest, least-read work and one of his two rediscovered early
# plays, not a research gap.
#
# Don Quixote alone carries six editions, matching every translator its
# work.yaml `translationNote` names (Grossman, Rutherford, Ormsby, Putnam)
# plus one further public-domain-era translation (Motteux) still in print,
# and one pt-PT edition. Titles that are NOT the bare "Don Quixote" are
# edition-specific facts, not typos: Rutherford's Penguin printing carries the
# full title "The Ingenious Hidalgo Don Quixote de la Mancha" on its own
# title page (confirmed against the scanned book, not just its catalogue
# record), matching the Spanish-title convention works.yaml itself uses for
# this book.
#
# Two editions carry a note beyond translator/publisher because the object
# itself needs one to avoid misleading a reader:
#   - The Wordsworth Classics Don Quixote is Peter Motteux's 18th-century
#     translation, not Ormsby's - worth flagging since Wordsworth is also a
#     byword for cheap Ormsby reprints elsewhere, and this one specifically
#     is not that.
#   - The Edições Húmus "Entremezes" is only the eight one-act entremeses,
#     not the eight full-length comedias also bound into the 1615 volume
#     this catalogue records as one work - a genuinely partial edition, not
#     an abridgement, and said so plainly rather than left for a buyer to
#     discover after purchase.
#
# Region check: every pt-PT ISBN below carries a 978-972 or 978-989 prefix
# (Portugal); none is a 978-85/978-65 (Brazil) edition mistagged.

