# Creative periods - the narrative spine of the aura. Inline references use
# [[type:id|text]] and must resolve.
#
# Cervantes's working life is divided here the way the Biblioteca Virtual
# Miguel de Cervantes divides it: by the section titles of the biography Jean
# Canavaggio wrote for that library's Cervantes portal, dated against the
# portal's own year-by-year chronology by Florencio Sevilla Arroyo and Begoña
# Rodríguez Rodríguez. Four of those sections name stretches in which
# Cervantes was writing or publishing, and they are the four eras below:
# "Retorno a las letras", "Comisiones andaluzas", "El ingenioso hidalgo" and
# "El taller cervantino". The titles are Spanish because the periodisation is,
# and each description glosses its own.
#
# One scope shift comes with borrowing them: they are the sections of a life,
# not labels anyone attached to a body of work. The three that precede 1580 -
# "Infancia", "Lepanto", "Cautiverio" - are therefore not eras here. Nothing
# was written in them that survives, and an era renders full-bleed across the
# works timeline, so a plate over the Lepanto wound or the five years of
# slavery in Algiers would assert an authorship that does not exist in those
# years. They belong to the life events instead.
#
# "El período andaluz" merges two adjacent sections, "Comisiones andaluzas"
# (June 1587 to April 1594) and "Encarcelamiento" (August 1594 to the summer
# of 1600), under the name Canavaggio himself uses for the whole stretch when
# he dates composition to it: two of the Novelas ejemplares "fueron escritas
# en el período de sus comisiones andaluzas", and the Persiles was begun
# "quizá durante el período andaluz". The two sections are one job and one
# absence of books; the second names an episode inside it rather than a period
# of its own.
#
# Two works sit outside every span, deliberately. El trato de Argel and El
# cerco de Numancia were written and staged around 1581 to 1582, inside
# "Retorno a las letras", and survive only as manuscripts until Antonio de
# Sancha printed them in Madrid in 1784. Their `published` year is that
# printing, which sorts them two centuries after everything else in this
# bibliography, and no era reaches them. Stretching a span to 1784 would draw
# a Golden Age period around a Bourbon-era book; the era their composition
# belongs to is named in each work's note instead.
#
# Los trabajos de Persiles y Sigismunda (1617) is inside the last era rather
# than outside it, although it too was printed after its author died.
# Cervantes finished it four days before his death on 22 April 1616, and his
# widow handed the manuscript to Juan de Villarroel, the bookseller who had
# published the Ocho comedias months earlier; it was in print in January 1617.
# That distance is a season of estate business, not a rediscovery, so the last
# era closes on the printing rather than on the death.

- id: retorno-a-las-letras
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: Retorno a las letras
  period: "1580-1586"
  themes: [captivity remembered, the corrales de comedias, pastoral romance, petitions refused]
  provenance: critical
  description: >
    The return to letters: the six years between Algiers and Andalusia, and
    the only stretch in which Cervantes writes for the stage and for the press
    at once. Trinitarian friars ransom him on 19 September 1580, days before
    he was to be shipped to Constantinople, and he lands at Denia that
    October. A year spent trying to convert his war record into a post yields
    one obscure errand to Oran; from 1581, the portal's chronology has it, he
    turned to the theatre in earnest. Two plays survive of the "veinte
    comedias o treinta" he later counted up,
    [[work:miguel-de-cervantes/el-trato-de-argel|El trato de Argel]], which
    puts his own five years of slavery on stage, and
    [[work:miguel-de-cervantes/el-cerco-de-numancia|El cerco de Numancia]] -
    all of them performed, he says, "sin que se les ofreciese ofrenda de
    pepinos ni de otra cosa arrojadiza". In March 1585 the bookseller Blas de
    Robles prints [[work:miguel-de-cervantes/la-galatea|La Galatea]], the
    first book he published and the last for twenty years, three months after
    his marriage in Esquivias to Catalina de Salazar.
  note: >
    The section titles used for the eras in this file are the sections of a
    biography of the man, so a period of the life is doing duty as a period of
    the work. It fits here better than anywhere else in the file: the return
    from captivity and the return to writing are the same event. The span
    opens on the ransom of 19 September 1580 and closes a year before the
    appointment that ends it, because the chronology dates his first journeys
    south to 1586 and he is installed in Seville as a royal commissary at the
    beginning of June 1587. El trato de Argel and El cerco de Numancia belong
    to these years by composition and to 1784 by printing, which is the year
    their entries carry, so they fall outside this span and every other.
  sources:
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_cronologia/"

- id: el-periodo-andaluz
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: El período andaluz
  period: "1587-1599"
  themes: [requisitioning wheat and oil, excommunication and arrears, the royal prison of Seville, thirteen years without a book]
  provenance: critical
  description: >
    The Andalusian period: thirteen years on the roads of the south, and not
    one book. From June 1587 Cervantes requisitions grain and oil for the
    Armada as a royal commissary under Antonio de Guevara, work that earns him
    an excommunication at the request of a reluctant canon and a spell in the
    jail at Castro del Río in 1592 for selling wheat illegally; from August
    1594 he is collecting two and a half million maravedís of arrears in the
    kingdom of Granada, and when the merchant holding the money goes bankrupt
    he is thrown into the royal prison of Seville. The Quixote's own prologue
    places the book's conception in a jail "donde toda incomodidad tiene su
    asiento". Nothing reaches print in these years, but much of what does
    later is begun in them: Rinconete y Cortadillo and El celoso extremeño,
    two of the [[work:miguel-de-cervantes/novelas-ejemplares|Novelas
    ejemplares]], are dated here, the Captive's tale of the
    [[work:miguel-de-cervantes/don-quixote|Quixote]] to about 1590, and
    [[work:miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda|Persiles
    y Sigismunda]] perhaps here too. A petition for a post in the Indies comes
    back on 6 June 1590 with six words in the margin: "Busque por acá en que
    se le haga merced".
  note: >
    No work in this bibliography carries a year inside this span, and that
    absence is the point: the twenty years between La Galatea and the Quixote
    are the most conspicuous feature of Cervantes's shelf, and the era says
    what he was doing in them. The name is Canavaggio's phrase for the stretch
    as a whole rather than either of his two section titles for its halves.
    The closing boundary is his definitive farewell to Seville in the summer
    of 1600, so 1600 falls on the Castilian side of the line; the chronology
    still records him domiciled in Seville that year, and no work is affected
    either way.
  sources:
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_2/"
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_3/"
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_cronologia/"

- id: el-ingenioso-hidalgo
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: El ingenioso hidalgo
  period: "1600-1605"
  themes: [the return to Castile, a book written in obscurity, Valladolid, sudden fame]
  provenance: critical
  description: >
    Named for the book: the years in which
    [[work:miguel-de-cervantes/don-quixote|El ingenioso hidalgo don Quijote de
    la Mancha]] was written, about which almost nothing is known. Cervantes
    leaves Seville for good in the summer of 1600, is in Toledo that August
    and at a baptism in Esquivias in January 1602, and by 1603 has moved his
    whole household to Valladolid, where Philip III had taken the court. There
    he finds a publisher in Francisco de Robles, son of the man who printed La
    Galatea, obtains his royal privilege on 26 September 1604, and in the last
    days of that December the book comes off Juan de la Cuesta's Madrid press
    with 1605 on its title page. The success is immediate and uncontrollable:
    two pirate editions in Lisbon by March, a second Madrid edition before the
    summer, cargoes registered for the Indies, and Don Quixote and Sancho
    walking in the Valladolid masquerades held that June for the English
    ambassador. Days later a knight of Santiago is stabbed outside his door
    and dies in his house, and the investigation puts the author of the
    Quixote in a cell for two days.
  note: >
    The title is the section title, and it is the first half of the book's
    own: a period named after the work it produced. Both boundaries are dated
    moves rather than rounded years - the farewell to Seville in the summer of
    1600, and the court's return to Madrid in 1606, which Cervantes followed.
    This wing files Don Quixote as one work dated 1605, so the entry sits in
    this era; Part Two was written and printed in 1615, inside the era that
    follows.
  sources:
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_2/"
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_cronologia/"

- id: el-taller-cervantino
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: El taller cervantino
  period: "1606-1617"
  themes: [work against the clock, printing plays nobody would stage, Lope's monopoly, the answer to Avellaneda]
  provenance: critical
  description: >
    The Cervantine workshop: ten years in Madrid, in rented rooms behind the
    Atocha hospital and later in the calle de León, in which a man past sixty
    published five of his eight books. The
    [[work:miguel-de-cervantes/novelas-ejemplares|Novelas ejemplares]] were
    approved in July 1612 and printed a year later, running to four editions
    in ten months and carrying the only description of his own face he ever
    wrote; [[work:miguel-de-cervantes/viaje-del-parnaso|Viaje del Parnaso]],
    prefaced in 1613, followed in November 1614. Refused by the theatre
    managers who had gone over to Lope de Vega, he sold his plays to a
    bookseller instead and printed them unperformed as
    [[work:miguel-de-cervantes/ocho-comedias-y-ocho-entremeses|Ocho comedias y
    ocho entremeses nuevos, nunca representados]] in September 1615: he had
    gone back to his old trade, he wrote, and "no hallé pájaros en los nidos
    de antaño". A stranger calling himself Avellaneda published a continuation
    of the [[work:miguel-de-cervantes/don-quixote|Quixote]] at Tarragona in
    1614 while Cervantes was halfway through his own; he answered it inside
    the fiction, and his Part Two appeared at the end of November 1615. He
    dedicated
    [[work:miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda|Persiles
    y Sigismunda]] three days before he died, having finished it four days
    before, and it was printed in January 1617.
  note: >
    Canavaggio's sections divide these years three ways - by residence ("En la
    Villa y Corte"), by output ("El taller cervantino") and by the quarrel
    with Avellaneda - and they cover the same span rather than following one
    another, so only the one that names the work is used here. The opening
    boundary is the court's return to Madrid in 1606, which Cervantes followed
    that year; the closing one is the posthumous printing of the Persiles in
    January 1617, eight months after his death on 22 April 1616, which is the
    last book this workshop put in front of readers.
  sources:
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_3/"
    - "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_cronologia/"
