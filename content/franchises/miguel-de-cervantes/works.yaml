# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent. `title` is the original Spanish
# title (or, for Don Quixote, the Part One title - see that entry's note);
# `published` is the year of first publication.
#
# SHAPE OF THIS WING: eight works spanning Cervantes's working life, 1582 to
# 1617, not the two the wing was scoped from. Tiered core/extended along the
# line Wikipedia's own "Miguel de Cervantes" infobox draws between his Prose,
# Drama and Verse - the four prose works (La Galatea, Don Quixote, Novelas
# ejemplares, Persiles y Sigismunda) are core; the four dramatic and poetic
# works (Viaje del Parnaso, Ocho comedias y ocho entremeses, El trato de
# Argel, El cerco de Numancia) are extended, off the prose spine without
# being a lesser judgement of them - El cerco de Numancia in particular is
# widely called the best Spanish tragedy of its century, well before Lope de
# Vega. Two works usually attributed to two genuinely separate creative
# periods - a captivity-inflected 1580s and a final, explosively productive
# decade - rather than a two-title career. Two of the eight, El trato de
# Argel and El cerco de Numancia, belong to that early 1580s period by
# composition but were not printed until 1784 (each entry's note sources
# this); `published` follows the print date, this catalogue's convention
# (also applied to Edgar Allan Poe's The Poetic Principle), so the derived
# reading order sorts them last rather than first.
#
# Excluded: no entry for "La tía fingida", a novella found in the lost Porras
# de la Cámara manuscript and sometimes attributed to Cervantes - the
# attribution itself is disputed, not merely under-sourced, so it is left out
# entirely rather than recorded with a hedge. Checked against the Biblioteca
# Virtual Miguel de Cervantes's own catalogue of attributed works
# (cervantesvirtual.com/portales/miguel_de_cervantes/obras_atribuciones/) for
# others clearing that same bar; none does:
#   - "El Buscapié" - published in the 1840s by Adolfo de Castro as a
#     rediscovered Cervantes manuscript; Castro's own biography records that
#     Bartolomé José Gallardo exposed it as Castro's pastiche of Golden Age
#     prose, and that Castro confirmed his own authorship after his widow's
#     death. A settled forgery, not an open attribution.
#   - "La conquista de Jerusalén por Godofre de Bullón" - a manuscript play
#     published by the Hispanist Stefano Arata in 1992, proposed as
#     Cervantes's own lost "La Jerusalén" (a title he names among his lost
#     early comedias). Unlike "El Buscapié", this is an active, still-argued
#     attribution case with a Cátedra critical edition (2009) and a further
#     attribution study (Kahn, 2010) rather than a settled one either way;
#     held out on that basis rather than added on one side of it.
#   - "Las semanas del jardín" - a book Cervantes announced in more than one
#     prologue and never delivered complete; one surviving dialogue fragment
#     has been argued as part of it (Eisenberg, 1988) on one scholar's
#     reading, not a corroborated find.
#   - "Los habladores" - an entremés attributed to Cervantes in general
#     accounts of his theatre, but the only surviving text is a nineteenth
#     century reworking credited to Manuel de Foronda, not Cervantes's own.

- id: miguel-de-cervantes/la-galatea
  title: "La Galatea"
  authorIds: [miguel-de-cervantes]
  published: 1585
  subseries: null
  canonTier: core
  synopsis: >
    A pastoral romance following the shepherd Elicio's love for Galatea,
    interwoven with the told-and-retold love stories of the other shepherds
    and travellers who join their journey to a wedding.
  note: >
    Cervantes's first published book and, by his own account in its
    dedication, only the first half of a longer work - he promised a sequel
    in the text itself and never wrote one. It found modest contemporary
    success and was not reprinted for decades.
  sources:
    - https://en.wikipedia.org/wiki/La_Galatea
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/don-quixote
  title: "El ingenioso hidalgo don Quijote de la Mancha"
  authorIds: [miguel-de-cervantes]
  published: 1605
  subseries: null
  canonTier: core
  featured: true
  translationNote: >
    Almost no reader of this wing reads the original Spanish, and which
    English translation they pick changes the book's register more than is
    usual even for a classic. Edith Grossman's 2003 translation is the
    modern standard - The New York Times called it a "major literary
    achievement" - fast, comic and colloquial. John Rutherford's 2000
    Penguin Classics translation, three years earlier, sits closer to
    period cadence and reads as more melancholy. Both compete with older,
    public-domain translations still widely reprinted: John Ormsby's 1885
    version, which most 20th-century translators used as their own base
    text, and Samuel Putnam's 1949 translation. This is true of the work
    regardless of which specific printing a reader buys.
  synopsis: >
    An aging country gentleman, his head turned by too many chivalric
    romances, renames himself Don Quixote, recruits a practical-minded
    farmer, Sancho Panza, as his squire, and rides out to revive knight
    errantry in a Spain that has no place left for it.
  note: >
    Published a decade apart as two independently issued books - Part One
    in January 1605 as "El ingenioso hidalgo don Quijote de la Mancha", Part
    Two in 1615 as "Segunda parte del ingenioso caballero don Quijote de la
    Mancha" - and recorded here as a single work because they are one
    continuous narrative under one title, not a book and its sequel:
    virtually every modern edition, in Spanish and in translation, binds
    both parts under the single title "Don Quixote" and reads the second as
    completing rather than following the first. Part One was a bestseller
    in its own right for a decade before Part Two existed, and its
    popularity created demand for a continuation; before Cervantes produced
    one, an unauthorised "Part Two" appeared in 1614 under the invented
    name Alonso Fernández de Avellaneda, an identity scholars still
    dispute. Cervantes's own Part Two, finished the following year, refers
    directly to the Avellaneda book and has Don Quixote meet and denounce a
    character from it - the spurious sequel is answered inside the real
    one, not merely provoked by it. That answer belongs to the last quarter
    of Part Two, so it is stated here, in a field that does not render, and
    in the 1614 event behind that event's spoiler boundary; the synopsis,
    the era descriptions and the startHere paths carry the 1614 publication
    quarrel without it. The two parts differ in register: the first is
    broader and more purely comic and was the more popular of the
    two at the time; the second is more structurally sophisticated, written
    by an author now directly addressing a readership that had already
    read - and, in Avellaneda's case, forged - the first.
  sources:
    - https://en.wikipedia.org/wiki/Don_Quixote
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/novelas-ejemplares
  title: "Novelas ejemplares"
  authorIds: [miguel-de-cervantes]
  published: 1613
  subseries: null
  canonTier: core
  synopsis: >
    Twelve novellas of gypsies, thieves, captives and confidence tricks
    across Cervantes's Spain, ranging from idealised romance to sharp social
    realism - among them "La gitanilla", "Rinconete y Cortadillo" and "El
    coloquio de los perros".
  note: >
    Written over roughly 1590 to 1612 and published as a single authored
    volume in 1613 under Cervantes's own title and foreword, not a
    magazine miscellany assembled after the fact - recorded here as one
    work rather than twelve for that reason. Its foreword claims a
    genre-founding role in Spanish letters: "I am the first who has
    written novelas in the Spanish language, though many have hitherto
    appeared among us, all of them translated from foreign authors."
    Tiered core, alongside Don Quixote, rather than with the wing's other
    collections: standard reference summaries of Cervantes name only these
    two works as his "notable works".
  sources:
    - https://en.wikipedia.org/wiki/Novelas_ejemplares
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/viaje-del-parnaso
  title: "Viaje del Parnaso"
  authorIds: [miguel-de-cervantes]
  published: 1614
  subseries: null
  canonTier: extended
  synopsis: >
    A mock-heroic poem in eight chapters, in which Cervantes sails to
    Parnassus aboard a ship built out of verse, surveying - and, in cases he
    leaves the reader to guess at, mocking - his fellow Spanish poets.
  note: >
    His most ambitious verse work, published two years before his death.
    Verse, not prose or drama - carries no `format` value here for want of
    one that fits, rather than a misleading `novel` or `play`.
  sources:
    - https://en.wikipedia.org/wiki/Viaje_del_Parnaso
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/ocho-comedias-y-ocho-entremeses
  title: "Ocho comedias y ocho entremeses nuevos, nunca representados"
  authorIds: [miguel-de-cervantes]
  published: 1615
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A single volume of eight full-length plays and eight one-act comic
    interludes, published for readers rather than for the stage - the title
    itself states they were "never performed".
  note: >
    The eight comedias are El gallardo español, Los baños de Argel, La gran
    sultana, La casa de los celos, El laberinto de amor, La entretenida, El
    rufián dichoso and Pedro de Urdemalas; the eight entremeses are El juez
    de los divorcios, El rufián viudo llamado Trampagos, La elección de los
    alcaldes de Daganzo, La guarda cuidadosa, El vizcaíno fingido, El
    retablo de las maravillas, La cueva de Salamanca and El viejo celoso.
    Recorded as one work, matching this catalogue's convention for a single
    authored volume, since Cervantes assembled and published all sixteen
    together under one title in 1615. Does not include El trato de Argel or
    El cerco de Numancia, two earlier, separately written and separately
    published plays.
  sources:
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/el-trato-de-argel
  title: "El trato de Argel"
  authorIds: [miguel-de-cervantes]
  published: 1784
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A drama of Christian captives held for ransom in Algiers, drawn directly
    from Cervantes's own five years there.
  note: >
    Also titled "Los tratos de Argel". Composed and performed around 1582,
    in Cervantes's earliest theatrical period, drawing directly on his own
    captivity - one of only two plays from the twenty or thirty comedias he
    later said he wrote in these years to survive at all, and only as a
    manuscript (Biblioteca Nacional de España, Ms. 14630-23). It went
    unprinted for two centuries: first publication was Antonio de Sancha's
    1784 Madrid edition of Viaje del Parnaso, whose own title page
    advertises it and El cerco de Numancia as two previously unpublished
    Cervantes pieces added to that volume. `published` here records that
    first-print date rather than the composition date, the same convention
    this catalogue applies to Edgar Allan Poe's The Poetic Principle (an
    1848 lecture, not published until 1850): no reader could obtain a copy
    of this play before 1784, so it sorts after every other work in this
    bibliography rather than at the front of it. Later reworked under the
    title "Los baños de Argel" (the version collected in Ocho comedias), a
    distinct later text rather than a reprint of this one.
  sources:
    - https://www.cervantesvirtual.com/obra/el-trato-de-argel-0/
    - https://es.wikipedia.org/wiki/El_trato_de_Argel
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/el-cerco-de-numancia
  title: "El cerco de Numancia"
  authorIds: [miguel-de-cervantes]
  published: 1784
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A tragedy of the Roman siege of the Celtiberian city of Numantia in 133
    BC, staged as the city's entire population chooses mass suicide over
    surrender and slavery.
  note: >
    Commonly known as "La Numancia". Widely regarded as the best Spanish
    tragedy written before Lope de Vega, and by some assessments of the
    entire Spanish Golden Age. Composed around 1582, in the same early
    theatrical period as El trato de Argel, and survives the same way: only
    as a manuscript (Biblioteca Nacional de España, Ms. 15000-29), unprinted
    until Antonio de Sancha's 1784 Madrid edition of Viaje del Parnaso added
    it alongside El trato de Argel as a previously unpublished piece - more
    than a century and a half after it was written and performed.
    `published` records that 1784 first-print date rather than the
    composition date, per El trato de Argel's note and this catalogue's
    general dating convention (see also Edgar Allan Poe's The Poetic
    Principle).
  sources:
    - https://www.cervantesvirtual.com/obra/el-trato-de-argel-0/
    - https://en.wikipedia.org/wiki/La_Numancia
    - https://es.wikipedia.org/wiki/La_Numancia
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes

- id: miguel-de-cervantes/los-trabajos-de-persiles-y-sigismunda
  title: "Los trabajos de Persiles y Sigismunda"
  authorIds: [miguel-de-cervantes]
  published: 1617
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    Two lovers travelling under assumed names journey from the far north to
    Rome through a string of shipwrecks, captivities and trials, in a
    romance that embraces the fantastic rather than the everyday
    naturalism of Don Quixote.
  note: >
    Cervantes's last work, completed only days before his death and
    published posthumously in 1617. He dedicated it to the Count of Lemos
    three days before he died, and by his own stated judgement - not later
    critical consensus - it was his best book, standing in deliberate
    contrast to Don Quixote's realism.
  sources:
    - https://en.wikipedia.org/wiki/Los_trabajos_de_Persiles_y_Sigismunda
    - https://en.wikipedia.org/wiki/Miguel_de_Cervantes
