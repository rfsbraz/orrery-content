- id: avellaneda-affair-1614
  organisation: artifact-spread
  illustration_type: book-object
  images_required: 1
  date: 1614
  title: "A fake Part Two provokes the real one"
  scope: culture
  reach: franchise
  impact: high
  description: >
    In about September 1614, with Cervantes still working on his own sequel, a spurious
    "Segundo tomo del ingenioso hidalgo don Quijote de la Mancha" appears in Tarragona,
    credited to a licenciado "Alonso Fernández de Avellaneda, of Tordesillas" - almost
    certainly a pseudonym. Its real identity has never been settled by scholarly consensus;
    more than one candidate has been proposed over the centuries, none proven. Its prologue
    insults Cervantes personally, including his war wound. Cervantes responds inside his own
    [[work:miguel-de-cervantes/don-quixote|Don Quixote]], Part Two, published the following
    year: from around chapter 59 onward, Don Quixote learns of the fake book, visits a
    Barcelona printing house where it is being run off the press, and meets one of its
    characters, Don Álvaro Tarfe, whom he persuades to swear an affidavit that the "official"
    Quixote and Sancho are the real ones and Avellaneda's are impostors - the fake sequel
    answered inside the real one, as fiction.
  spoilerAfter: miguel-de-cervantes/don-quixote
  sources:
    - https://en.wikipedia.org/wiki/Don_Quixote
    - https://en.wikipedia.org/wiki/Alonso_Fern%C3%A1ndez_de_Avellaneda
