# Branding for the A. J. Finn wing (see Orrery CONCEPT §6 - the design law,
# and docs/SCHEMA.md#themeyaml). Checked against every existing wing's
# palette before choosing.
#
# Both novels are explicitly built from watching through glass: Anna Fox
# spies on her neighbors' windows and loses herself in Rear Window and
# Gaslight; End of Story's central device is one person's account of another
# person's life, told across a mansion at night. A cold, glassy register -
# night glimpsed through a lit window - reads truer to that than either of
# this catalogue's crowded warm registers (amber/gold: Sanderson, Jordan,
# Peixoto, Pratchett; red/oxblood/terracotta: King, Gwynne, Grisham, Saramago,
# Rodrigues dos Santos, Rowling, Valter Hugo Mae, Connelly, McCarthy) or its
# existing greens, violets and pinks (Christie, Sewell, Palahniuk, Lovecraft,
# Slaughter; Cervantes, French, Flynn; Shirley, Bryndza, Lee Child). Checked
# hue-by-hue against all thirty-plus existing accents: the gap between HP
# Lovecraft's oceanic teal (hue ~167) and Dan Brown's sky-blue cyan (hue
# ~201) is the widest genuinely open lane in the catalogue's whole wheel, and
# a true cyan sitting near its center (hue ~186) is close to neither - warmer
# and more saturated than Lovecraft's dark teal, cooler and greener than
# Brown's brighter sky-blue or Joao Tordo's slate-blue (hue ~202).
preset: brownstone-noir
palette:
  bg: "#0d1315"        # near-black, a cold blue cast - a dark street or an
                       # unlit room, not yet the lit window
  surface: "#161e21"   # a shade lifted, for cards
  ink: "#e6edee"       # pale, cool off-white - high contrast, very readable
  muted: "#8a9598"     # cool grey, for metadata (AA-checked against surface)
  accent: "#2e9aa6"    # one cold cyan-teal - the glow of a lit window, a
                       # screen, or a camera viewfinder seen from outside;
                       # used sparingly, never as a wash
displayFace: spectral # from the app's implemented set (fraunces | spectral |
                      # sourceSerif). Every other psychological-thriller wing
                      # in the catalogue (Coben, Flynn, Slaughter, Bryndza,
                      # Nesbo, Connelly) reaches for sourceSerif's plain,
                      # commercial register; this shelf earns a cooler,
                      # more self-aware one instead - a former editor's pen
                      # name whose two novels are both explicitly about the
                      # act of narrating someone else's life, reviewed for
                      # being "about the nature of storytelling itself." Not
                      # yet used by any crime wing; used elsewhere only for
                      # literary and fantasy wings (Atwood, Murakami, Valter
                      # Hugo Mae, Sanderson, Jordan, Butcher, Lovecraft).
signature: rule       # a single straight editorial mark, the same reasoning
                      # Gillian Flynn's wing uses for her decade at a
                      # newsdesk - here standing for a manuscript's margin,
                      # not a copy desk: the author's own pre-fiction years
                      # as an editor at Little, Brown and at William Morrow,
                      # the imprint that went on to publish both these
                      # novels (content/authors/aj-finn.yaml). Not `thread`:
                      # two unconnected standalones have no recurring cast or
                      # world to string a hairline along.
art:
  emblem:
    object: >
      A circular lens or viewfinder frame, held up from inside a darkened
      room against a windowpane, its round edge cropping the view down to
      one distant lit window across the way - sharp at the small circle in
      the centre, dissolving to blur at the rim. No hand holds it, no face
      sits behind either pane.
    why: >
      Anna Fox's own method in The Woman in the Window is exactly this: a
      camera with a telephoto lens, worked from inside her own Harlem
      brownstone, turning her neighbours' windows into a sequence of small
      lit rectangles she watches and misreads, explicitly modeled on Rear
      Window and Gaslight. Both novels are built from one person's account
      of another's life, so the emblem is the instrument of that watching,
      not the window it watches through - it shows exactly what it is
      pointed at and nothing past the frame's own edge, which is where the
      catalogue's other framing device (End of Story's Nicky, transcribing
      Sebastian Trapp's account of his own history) belongs too. Kept the
      reverse, on purpose, of this catalogue's other two window emblems:
      Robert Bryndza's sash window (viewer outside in the cold, looking at
      lamplight behind glass, standing for an English writer viewing his own
      country from abroad) and Jose Saramago's unlit window in a basalt wall
      (viewer outside a wall, no interior implied at all). Both stage the
      window from without. Here the viewer is inside the dark room doing the
      watching - the one direction neither of those two wings uses, and the
      one this author's own books actually work from.
  motifs:
    - a brownstone's tall sash windows seen from indoors, one lit rectangle
      glimpsed across a park at night
    - a camera or a pair of binoculars resting on a windowsill, lens toward
      the glass, no hand on it
    - an old black-and-white film flickering on a screen in an otherwise
      dark room, its light the only warmth
    - rain or condensation blurring a windowpane from inside, the world
      outside reduced to smeared light
    - a manuscript page's ruled margin beside a desk lamp, a tall dark
      window behind the desk
    - an empty chair angled toward a window, no one sitting in it
  atmosphere: >
    Cold, hushed and insomniac: a dark interior lit only by whatever glows
    through glass or off a screen, never by a lamp turned on for the room
    itself. The suspense is optical, not gothic - what a window shows and
    what it withholds, a reflection that could be the street outside or the
    room behind you - and never played as a haunted house or a slasher's
    shadow. The biographical rupture events (drawn document-facsimile or
    portrait-of-absence per events.yaml) stay outside this mood entirely:
    plain paper, an empty room, ordinary daylight where the record calls for
    it, never this fiction's night-glass register borrowed to dramatise a
    real person's own crisis.
  lineCharacter: >
    A soft-focus photographic line rather than a drawn one: fine, sharp
    detail held in one small area - the size a telephoto lens keeps in
    focus - dissolving to a grainy, out-of-focus blur toward the edges of
    the frame, as if traced from a low-light photograph or a paused
    television broadcast rather than inked by hand. Distinct from this
    catalogue's other editorial-adjacent wings on purpose: Gillian Flynn's
    uniform ballpoint precision, Robert Bryndza's even dip-pen line and Jose
    Saramago's flat, unmodulated fill all hold one sharpness across the
    whole image; nothing here does.
  backgroundTexture: >
    Near-black paper with a faint streaked sheen, like a windowpane at night
    holding a smear of condensation or rain, rather than laid paper's fibre
    or a printed halftone dot.
  accentUse: >
    The cold cyan-teal on exactly one glowing source per image, never as a
    fill: one lit window seen at a distance, a screen's glow across a face
    turned from it, or the ring of light inside a lens barrel or viewfinder.
  avoid:
    - Daniel Mallory's own face or any likeness standing in for him, and any
      "unmasking," mask, torn photograph or shattered-mirror-double imagery
      for the 2013 and 2019 fabrication lifeEvents - those already carry
      their own document-facsimile and portrait-of-absence treatment, and
      neither calls for a staged reveal of a real person's own health crisis
    - a sash window staged from outside in warm lamplight (Robert Bryndza's
      emblem), or an unlit window in a bare wall with no interior implied
      (Jose Saramago's) - this wing's window is always seen from indoors,
      looking out, never the reverse
    - spy-thriller costume - trench coats, sunglasses, a magnifying glass, a
      lit-up "surveillance" control room
    - gothic haunted-house staging - creaking doors, cobwebs, a looming
      silhouette - the dread here is psychological and domestic, never
      supernatural
    - warm domestic cosiness (firelight, a laid table, a family gathered) -
      these interiors are watched from, not lived in
    - blood, violence or crime-scene evidence shown outright
notes: >
  A cold, glassy register rather than a warm one: night outside a brownstone
  window, one muted cyan-teal for the glow inside it or on a screen, used
  once per surface and never as a fill. No streetlamp amber, no blood-red,
  nothing that reaches for genre-thriller costume - the restraint is the
  point, and the theme.art block (a later pass) is where the actual visual
  language - the window, the film-reel flicker, the manuscript margin - gets
  written out in full.
