    - "https://en.wikipedia.org/wiki/The_Woman_in_the_Window_(novel)"

- id: aj-finn-plot-similarity-allegations-2019
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  date: 2019-02-14
  scope: industry
  reach: franchise
  impact: med
  title: Plot-similarity claims surface, then are substantially rebutted
  description: >
    On February 14, 2019, the New York Times reported "numerous, and
    detailed" plot similarities, and "nearly identical plot twists in the
    final act," between [[work:aj-finn/the-woman-in-the-window|The Woman in
    the Window]] and Sarah A. Denzil's 2016 novel "Saving April," published
    two years earlier. A William Morrow spokeswoman countered that Finn's
    outline, including its characters and main plot points, had been
    "fully formed by Sept. 20, 2015," before "Saving April" came out. Five
    days later the Times updated its story with further detail Mallory's
    lawyer and agent supplied after publication: the actual outline he had
    sent his agent, Jennifer Joel, in the fall of 2015. Denzil herself
    confirmed to Publishers Lunch that March 2016 was the earliest anyone
    besides her own publisher could have read her manuscript in full -
    after Mallory's outline existed. The dispute stopped there: no lawsuit
    followed, and the correction stands as the record's final word on it.
    Separately, in the same week's New Yorker profile, Jon Amiel, director
    of the 1995 film "Copycat," was asked about parallels between his
    film's agoraphobic, online-alias-using protagonist and Finn's Anna Fox;
    he called them "not actionable, but certainly worth noting," adding,
    "one would have hoped that the author might have noted it himself."
  spoilerAfter: null
  sources:
    - "https://web.archive.org/web/20191208212921/https://www.nytimes.com/2019/02/14/books/dan-mallory-woman-window-denzil.html"
    - "https://lunch.publishersmarketplace.com/2019/02/nyt-updates-dan-mallory-story-with-details-from-authors-outlines/"
    - "https://www.newyorker.com/magazine/2019/02/11/a-suspense-novelists-trail-of-deceptions"

- id: aj-finn-film-adaptation-delayed-2021
  organisation: layered-stack
  illustration_type: press-media-collage
  images_required: 1
  date: 2021-05-14
  scope: culture
  reach: franchise
  impact: med
  title: The film adaptation reaches Netflix after three release dates and a pandemic
  description: >
    Fox 2000 bought film rights to
    [[work:aj-finn/the-woman-in-the-window|The Woman in the Window]] in
    September 2016, before the novel was even published; Joe Wright signed
    on to direct in March 2018, from a Tracy Letts screenplay, with Amy
    Adams, Gary Oldman and Julianne Moore filming in New York City that
    August and October. Its route to release then ran almost as long as
    the wait for Finn's second novel: pulled from an October 2019
    theatrical date, re-edited by new studio owner Disney after weak test
    screenings, pushed to May 2020, then dropped from the release calendar
    entirely for the COVID-19 pandemic before Netflix bought the
    distribution rights in August 2020. It streamed from May 14, 2021, to
    mixed reviews; Wright later said the released cut had been "watered
    down" from what he shot. The following year, the novel and film's
    premise - an agoraphobic narrator, a possible murder seen through a
    window - was itself parodied in Netflix's "The Woman in the House
    Across the Street From the Girl in the Window," starring Kristen Bell.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/The_Woman_in_the_Window_(2021_film)"
    - "https://web.archive.org/web/20240220202008/https://www.washingtonpost.com/books/2024/02/18/end-story-aj-finn-review/"

- id: aj-finn-end-of-story-return-2024
  organisation: beside
  illustration_type: aftermath-scene
  images_required: 1
  date: 2024-02-20
  scope: culture
  reach: franchise
  impact: med
  title: "End of Story arrives four years late, reviewed against the scandal as much as the plot"
  description: >
    [[work:aj-finn/end-of-story|End of Story]] - the second half of the
    two-book deal signed in 2016, originally expected in 2020 - was
    published on February 20, 2024. In the interim Mallory had kept a
    public profile chiefly as a blurb writer for other thriller authors.
    Reviewing the novel for the Washington Post under the headline "A.J.
    Finn had a spectacular rise and fall. Now he has a new novel," Nora
    Krug opened by asking, "Will it be enough to save Finn's reputation?"
    and recapped the 2019 New Yorker revelations before assessing the
    fiction on its own terms; other outlets, including a starred
    Publishers Weekly review calling it a "tour de force," judged it on
    craft alone. No outlet reported any further fallout from the 2019
    episode; the book debuted at number twelve on Publishers Weekly's
    hardcover fiction list.
  spoilerAfter: null
  sources:
    - "https://web.archive.org/web/20240220202008/https://www.washingtonpost.com/books/2024/02/18/end-story-aj-finn-review/"
    - "https://en.wikipedia.org/wiki/End_of_Story"
