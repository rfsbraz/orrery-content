# FRANCHISE-SPECIFIC events only (things that happen to the books, not to the
# author - those are lifeEvents on content/authors/aj-finn.yaml). Inline
# references use [[type:id|text]] and must resolve.
#
# The 2019 plot-similarity entry keeps the Sarah A. Denzil claim and the Jon
# Amiel remark as what the record actually shows: a New York Times
# investigation that Morrow and Mallory's own outline rebutted within days,
# and a single on-the-record observation from a film director who called it
# "not actionable." Neither ever became a lawsuit or a finding of plagiarism,
# and the entry does not say otherwise.
- id: aj-finn-woman-in-the-window-number-one-2018
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2018-01
  scope: culture
  reach: franchise
  impact: med
  title: The debut enters the New York Times list at number one
  description: >
    Published by William Morrow in January 2018 under a lightly worn
    pseudonym, [[work:aj-finn/the-woman-in-the-window|The Woman in the
    Window]] entered the New York Times best-seller list at number one -
    the first debut novel to do so in twelve years - on the strength of a
    two-book, two-million-dollar deal, a Stephen King blurb calling it "one
    of those rare books that really is unputdownable," and a review in The
    New Yorker itself. Coverage at the time made much of the novel
    publishing insider angle: Mallory had spent a decade as an editor in
    London and New York, most recently at William Morrow, the imprint that
    bought and published his own book.
  spoilerAfter: null
  sources:
