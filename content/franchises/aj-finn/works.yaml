# Bibliography. Two novels, both published by William Morrow (a HarperCollins
# imprint), both under the byline "A. J. Finn" - no other title, short story,
# essay or contribution under either that name or "Daniel Mallory"/"Dan
# Mallory" turned up on Wikipedia's bibliography sections (author page and
# each novel's own page), Wikidata's work list for the author entity, or
# Publishers Weekly's own catalogue record - the two novels below are the
# complete published shelf as far as these sources establish it.
#
# No subseries: the two novels share no characters, setting or timeline
# (Woman in the Window is New York; End of Story is San Francisco with an
# unrelated cast) - two standalones, not a series.

- id: aj-finn/the-woman-in-the-window
  title: "The Woman in the Window"
  authorIds: [aj-finn]
  published: 2018
  subseries: null
  canonTier: core
  featured: true # the debut that made the pen name a #1 New York Times
                 # bestseller and the book the rest of the shelf is read
                 # against - the hinge, not a padded shelf pretending to more
                 # than one.
  synopsis: >
    Dr. Anna Fox, a child psychologist confined to her Harlem brownstone by
    agoraphobia, fills her days spying on the neighborhood through a camera
    lens and losing herself in old film noir - until she witnesses something
    at the house across the park that no one else believes happened.
  sources:
    - "https://en.wikipedia.org/wiki/The_Woman_in_the_Window_(novel)"
    - "https://en.wikipedia.org/wiki/A._J._Finn"

- id: aj-finn/end-of-story
  title: "End of Story"
  authorIds: [aj-finn]
  published: 2024
  subseries: null
  canonTier: core
  synopsis: >
    Sebastian Trapp, a reclusive novelist made rich by a long-running
    detective series and infamous for the unsolved disappearance of his
    first wife and teenaged son twenty years earlier, is dying and wants his
    story told. He invites Nicky Hunter, a young Manhattan crime-fiction
    critic, into his Victorian San Francisco mansion to write it - and the
    two circle each other, both charming and both possibly unreliable,
    toward whatever actually happened that New Year's Eve.
  sources:
    - "https://en.wikipedia.org/wiki/End_of_Story"
    - "https://www.publishersweekly.com/9780062678454"
