# Additional reading orders. There are none on record.
#
# NO INTERNAL SEQUENCE EXISTS TO ORDER. works.yaml's own header rules this
# directly: subseries is null throughout, and the one candidate considered
# there - Romanceiro e Cancioneiro Geral's three tomes - is one multi-volume
# work, not three related ones. Garrett wrote across poetry, theatre, prose
# fiction and political/occasional prose in one career; nothing forms a
# series, a numbered sequence, or a publisher-acknowledged trilogy the way
# João Tordo's Trilogia dos Lugares Sem Nome or Valter Hugo Mãe's two
# tetralogies do on this catalogue's other Portuguese-language wings.
#
# A GENRE-THREAD ORDER (THE THREE "HISTORICAL THEATRE" PLAYS) WAS CONSIDERED
# AND FAILS THE DIVERGENCE TEST. English Wikipedia's own account of Garrett
# groups Um Auto de Gil Vicente (1838), Frei Luís de Sousa (1844) and D.
# Filipa de Vilhena (1846) as his historical-theatre trio (see works.yaml's
# own note on D. Filipa de Vilhena) - real, but already exactly the derived
# default's order for these three titles, three works out of forty-four with nothing
# to reshuffle. A curated order restating the default over an
# already-sequential set is a duplicate wearing a costume, the same failure
# this catalogue already rejects on jose-luis-peixoto and tana-french.
#
# SAME-YEAR TIES WERE CHECKED AND DO NOT CLEAR THE BAR EITHER. Five years
# carry more than one first publication (1821, 1826, 1829, 1845, 1846), so
# the derived default leaves several same-year orderings arbitrary - exactly
# the condition agatha-christie/poirot-novels exists to fix. But every one of
# these clusters mixes unrelated genres and tiers with no shared thread a
# reader could feel (1846 alone ties a historical play, a comedy, Viagens na
# Minha Terra and a folklore essay): unlike the five Poirot novels, already
# one series a reader is reading as a set, there is no reading practice here
# for a tie-break to serve, and no source sequences any of these clusters at
# finer than year-precision. Settling them would be curatorial invention
# dressed as data, not the genuine known intra-year sequence the one
# permitted exception requires.
#
# No publisher omnibus, "collected/complete works" reading path, or academic
# reading sequence distinct from the derived default was found either.
[]
