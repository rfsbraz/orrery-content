# A wing spans an author's complete published body of work (standing ruling,
# 2026-07-21). Garrett wrote across poetry, theatre,
# prose fiction and a large body of political/occasional prose in one career,
# and none of it forms a separate universe or numbered series - see
# works.yaml's own header for why `subseries` is null throughout and how
# `format` (SCHEMA.md), not a genre-scoped wing boundary, is this catalogue's
# actual answer to a bibliography that spans a dramatist, a poet and a prose
# writer under one author.
id: almeida-garrett
name: Almeida Garrett
kind: author
description: >
  The founder of Portuguese literary Romanticism: poet, playwright, novelist,
  soldier of the Liberal cause and the parliamentary orator who built
  Portugal's national theatre. [[work:almeida-garrett/camoes|Camões]] (1825),
  written in French exile, is usually credited as the first Romantic poem in
  Portuguese; [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]]
  (1844) and [[work:almeida-garrett/viagens-na-minha-terra|Viagens na Minha
  Terra]] (1846) remain his two most-read works.
authorIds: [almeida-garrett]
themePreset: proscenium-gaslight

