# --- Prose fiction ---

- id: almeida-garrett/o-arco-de-santana
  title: "O Arco de Sant'Ana"
  authorIds: [almeida-garrett]
  published: 1845
  subseries: null
  canonTier: core
  format: novel
  synopsis: >
    A historical novel set in Lisbon, begun in 1845 and completed in 1850 -
    English Wikipedia's own biography names Victor Hugo's The Hunchback of
    Notre-Dame as its inspiration, and credits it with marking a shift in
    Garrett's prose toward the more complex, subjective style he then
    carried into [[work:almeida-garrett/viagens-na-minha-terra|Viagens na
    Minha Terra]].
  note: >
    Published in two volumes five years apart (1845, 1850); `published`
    records the first volume's year, the same convention this file uses for
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]] below.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/viagens-na-minha-terra
  title: "Viagens na Minha Terra"
  authorIds: [almeida-garrett]
  published: 1846
  subseries: null
  canonTier: core
  featured: true
  format: novel
  synopsis: >
    A journey from Lisbon to Santarém, told in Garrett's own digressive
    travel-writer's voice, opens onto a second, novelistic story of two
    young lovers, Carlos and Joaninha, that the narrator claims to have
    picked up along the way - the real and the invented threading through
    each other for the length of the book. Serialised from 1843, published
    in two volumes in 1846, and credited by its own dedicated Portuguese
    Wikipedia article as the starting point of modern Portuguese literary
    prose, anticipating Eça de Queirós; the third of English Wikipedia's own
    named "notable works" for Garrett, and generally his single most-read
    book.
  sources:
    - https://pt.wikipedia.org/wiki/Viagens_na_Minha_Terra
    - https://en.wikipedia.org/wiki/Almeida_Garrett

