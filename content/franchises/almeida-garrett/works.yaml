# --- Folklore and literary scholarship ---

- id: almeida-garrett/bosquejo-da-historia-da-poesia-e-da-lingua-portuguesa
  title: "Bosquejo da História da Poesia e da Língua Portuguesa"
  authorIds: [almeida-garrett]
  published: 1826
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    A literary-historical essay on the history of Portuguese poetry and the
    Portuguese language, published in Paris in 1826 - the critical
    groundwork behind Garrett's later folklore-collecting project,
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]].
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/parnaso-lusitano
  title: "Parnaso Lusitano ou Poesias Selectas de Autores Antigos e Modernos"
  authorIds: [almeida-garrett]
  published: 1826
  subseries: null
  canonTier: apocrypha
  format: anthology
  authorRole: editor
  synopsis: >
    A five-volume anthology of classic and contemporary Portuguese poetry,
    selected and edited by Garrett and published in Paris across 1826 and
    1827 - a canon-forming project of the same kind, in poetry, that
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]] later became for popular balladry.
  note: >
    `published` records the first volume's 1826 year; the full set spans
