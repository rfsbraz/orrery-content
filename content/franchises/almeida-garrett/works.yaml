- id: almeida-garrett/romanceiro-e-cancioneiro-geral
  title: "Romanceiro e Cancioneiro Geral"
  authorIds: [almeida-garrett]
  published: 1843
  subseries: null
  canonTier: core
  format: reference
  synopsis: >
    A landmark collection of traditional Portuguese ballads, songs and oral
    poetry that Garrett gathered and edited, the first volume published in
    1843 and two further volumes completing the project in 1851 - a
    scholarly project a reader dips into rather than reads start to finish,
    tagged `reference` for that reason (SCHEMA.md's `format` taxonomy).
  note: >
    `published` records the first volume's year, matching this file's
    treatment of [[work:almeida-garrett/o-arco-de-santana|O Arco de
    Sant'Ana]] above; the full three-volume set spans 1843-1851. Distinct
    from [[work:almeida-garrett/cancioneiro-de-romances-xacaras-e-solaus|Cancioneiro
    de Romances, Xácaras e Soláus]], an earlier, separately drafted
    manuscript only published in 1987.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

