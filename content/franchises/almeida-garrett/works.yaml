# Bibliography (Works) - the abstract books/plays/poems; editions/covers are
# a separate, not-yet-written layer (editions.yaml - see franchise.yaml).
# IDs are STABLE and permanent (user data references them). Titles are the
# ORIGINAL Portuguese as first published - Garrett wrote in Portuguese
# throughout (his brief English-exile writing was journalism and letters,
# never a book), so, as on this catalogue's other Lusophone wings, there is
# no first-publication-language exception to record here.
#
# SOURCES. Built primarily from Portuguese Wikipedia's own "Bibliografia
# ordenada e completa" section for Almeida Garrett - an unusually thorough,
# dated, edition-by-edition bibliography organised by Portuguese Wikipedia
# itself into Poemas / Peças teatrais / Artigos-ensaios-biografias-folhetos /
# Romances-cancioneiros-contos / Cartas e diários / Discursos, plus its
# separate "Cronologia das obras" section (a curated shortlist of "primeiras
# edições ou representações" - first editions or performances - which this
# file leans on to judge which minor items rose to a named milestone rather
# than the undifferentiated full list). Cross-checked against English
# Wikipedia's "Almeida Garrett" article (whose infobox names exactly three
# "notable works" - Viagens na Minha Terra, Camões, Frei Luís de Sousa - the
# received signal this file follows for `featured`, capped at three by the
# validator) and, for the two most-read works individually, their own
# dedicated Portuguese Wikipedia articles (Viagens na Minha Terra; Frei Luís
# de Sousa, the play; O Alfageme de Santarém). Infopédia (infopedia.pt) is
# reachable with a `$`-prefixed path (`/$almeida-garrett`, not the
# `/apoio/...` patterns that 403/404) and its own Garrett biography is used
# below, alongside the Biblioteca Nacional de Portugal's dedicated 1999
# Bicentenário bio-bibliography (purl.pt/96/1/bio/), a day-by-day
# chronology and edition-by-edition bibliography more granular than either
# Wikipedia article, and the source for five minor works below (a hymn, two
# occasional poems, a leaflet poem and a posthumous farce) that Portuguese
# Wikipedia's own bibliography names but its higher-level "Cronologia das
# obras" milestone list does not.
#
# WHAT COUNTS AS A WORK HERE, AND WHAT DOES NOT. Garrett founded and directed
# several periodicals across his career (O Toucador, O Português, O
# Cronista, Chaveco Liberal, O Precursor, Português Constitucional,
# Entreacto, Jornal do Conservatório, Jornal das Belas-Artes, Ilustração) -
# none is listed below. Unlike Eça de Queirós's As Farpas, none of Garrett's
# periodical writing was later gathered by him or his editors into a
# standalone book of his own authorship the way [[work:eca-de-queiros/uma-campanha-alegre|Uma
# Campanha Alegre]] collects Eça's As Farpas columns; editing and directing a
# newspaper is a biographical fact (see content/authors/almeida-garrett.yaml),
# not a bibliographic entry.
#
# FORMAT ANSWERS THE "WHAT IS READING A PLAY" QUESTION. The request issue
# (#105) that opened this wing flags a real schema question: a third of this
# bibliography is theatre - scripts whose canonical existence is meant for
# performance, not cover-to-cover reading, unlike a prose-only author's
# shelf. This catalogue already has an answer, `format: play` (SCHEMA.md),
# used throughout below; no special per-wing structure is needed. The
# issue's secondary question - whether Garrett's cross-genre range (poetry,
# theatre, prose) needs `subseries` to mean "genre" rather than "story arc" -
# is answered here too: it does not. `subseries` is null throughout this
# file. Nothing in Garrett's bibliography is a publisher-numbered or
# author-grouped sequence of separately titled books (the closest candidate,
# Romanceiro e Cancioneiro Geral's three tomes, is one multi-volume work, not
# three related ones); genre is fully captured by `format` alone, and a
# reading order that wants to group his plays together, if one is ever
# sourced, belongs in orders.yaml, not in a repurposed `subseries` field.
#
# `PUBLISHED` IS ALWAYS THE FIRST PRINT YEAR, never the composition or
# premiere year, matching this catalogue's standing rule (SCHEMA.md) and the
# precedent already set on Eça de Queirós's and Fernando Pessoa's wings for
# a text written or performed well before it reached print. Several entries
# below carry a real, sourced gap between composition/premiere and first
# publication (Frei Luís de Sousa: read and staged privately in 1843,
# published 1844; As Profecias do Bandarra: written 1845, staged 1848,
# not printed until 1877) - each notes both dates.
#
# GROUPED ENTRIES. Four groups below gather real, individually-dated items
# from the detailed bibliography that are too numerous and too slight
# individually to serve a reader as separate works: occasional political and
# ceremonial prose (parliamentary speeches, funeral orations, legal reports,
# exile pamphlets - 1821-1916), personal and official diaries/correspondence
# (1823-1995), unfinished or unperformed juvenile plays first printed
# 1898-1974, and scattered or posthumous minor poetry (1877-1985). This is
# the same tool this catalogue already uses for Eça de Queirós's six-volume
# Textos de Imprensa and J. R. R. Tolkien's twelve-volume History of
# Middle-earth: a real, sourced body of material recovered or occasionally
# published piece by piece, not a series a reader picks individual items of.
# It is this file's own editorial call, not a discovery already settled
# elsewhere, and each group's own note says so explicitly, so a later editor
# can split out any individual item judged load-bearing enough to stand
# alone - Portuguese Wikipedia's own bibliography (cited throughout) already
# lists every constituent title and date to work from.

# --- Poetry ---

- id: almeida-garrett/hino-patriotico
  title: "Hino Patriótico"
  authorIds: [almeida-garrett]
  published: 1820
  subseries: null
  canonTier: extended
  format: poem
  synopsis: >
    A patriotic hymn written on news of the 24 August 1820 Liberal Revolution
    in Porto, printed as a leaflet in the city within days and sung at the
    Teatro de São João on the 27th with music by J. A. Ribas - Garrett's
    first published work, a year before
    [[work:almeida-garrett/o-retrato-de-venus|O Retrato de Vénus]] and Catão
    brought him his first real notice.
  note: >
    Absent from Portuguese Wikipedia's own "Cronologia das obras" milestone
    list despite appearing in its detailed bibliography; the Biblioteca
    Nacional de Portugal's dedicated bicentenary bio-bibliography (cited
    below) gives the fuller performance and print context.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://purl.pt/96/1/bio/bio_02.html
    - https://purl.pt/96/1/bio/bibliografia01.html

- id: almeida-garrett/ao-corpo-academico
  title: "Ao Corpo Académico"
  authorIds: [almeida-garrett]
  published: 1821
  subseries: null
  canonTier: apocrypha
  format: poem
  synopsis: >
    A poem printed in a multi-author collection of verse recited at the
    University of Coimbra's Sala dos Actos Grandes in 1821 - one of several
    short occasional pieces from Garrett's Coimbra years, recovered and
    reprinted by Martins de Carvalho in the newspaper O Conimbricense in
    1874.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://purl.pt/96/1/bio/bibliografia01.html

- id: almeida-garrett/o-retrato-de-venus
  title: "O Retrato de Vénus"
  authorIds: [almeida-garrett]
  published: 1821
  subseries: null
  canonTier: core
  format: poem
  synopsis: >
    A libertine narrative poem, written while Garrett was a law student at
    Coimbra, that led to his prosecution for "materialism, atheism and
    immorality" - he was acquitted in 1822. His first brush with the state
    over his own writing, a pattern that recurred across his career.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/camoes
  title: "Camões"
  authorIds: [almeida-garrett]
  published: 1825
  subseries: null
  canonTier: core
  featured: true
  format: poem
  synopsis: >
    A narrative poem on the last days of Luís de Camões, Portugal's own
    national poet, written in French exile after the 1823 Vilafrancada. One
    of English Wikipedia's own three named "notable works" for Garrett, and
    generally credited, alongside
    [[work:almeida-garrett/dona-branca|Dona Branca]] the following year, as
    the first Romantic poem in Portuguese literature.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/dona-branca
  title: "Dona Branca ou a Conquista do Algarve"
  authorIds: [almeida-garrett]
  published: 1826
  subseries: null
  canonTier: core
  format: poem
  publishedAs: "F. E."
  synopsis: >
    An epic-Romantic poem set during the medieval Christian conquest of the
    Algarve, published in Paris under the initials "F. E." the year after
    [[work:almeida-garrett/camoes|Camões]] - the second of the two poems
    usually credited as founding Portuguese literary Romanticism.
  note: >
    Credited on its 1826 first edition to the initials "F. E."; no source
    checked expands what they stand for (see
    content/authors/almeida-garrett.yaml's `pseudonyms`).
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/adozinda
  title: "Adozinda"
  authorIds: [almeida-garrett]
  published: 1828
  subseries: null
  canonTier: core
  format: poem
  synopsis: >
    A narrative poem published in London during Garrett's second exile,
    drawing on Portuguese oral balladry - an early instance of the interest
    in popular tradition that later produced
    [[work:almeida-garrett/romanceiro-e-cancioneiro-geral|Romanceiro e
    Cancioneiro Geral]].
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/lirica-de-joao-minimo
  title: "Lírica de João Mínimo"
  authorIds: [almeida-garrett]
  published: 1829
  subseries: null
  canonTier: extended
  format: poetry-collection
  synopsis: >
    A collection of lyric poems published in London in 1829, under the
    invented poetic persona "João Mínimo" - a minor entry between the
    exile-era epics and his later, more personal verse.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/lealdade-ou-a-vitoria-da-terceira
  title: "Lealdade, ou a Vitória da Terceira"
  authorIds: [almeida-garrett]
  published: 1829
  subseries: null
  canonTier: extended
  format: poem
  synopsis: >
    A song published as a leaflet in London in 1829, the same year as
    [[work:almeida-garrett/lirica-de-joao-minimo|Lírica de João Mínimo]],
    honouring the Liberal resistance on Terceira - the Azorean island where
    Garrett's own family had taken refuge from the second French invasion in
    1809 and that anchored the Liberal cause through his exile years.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://purl.pt/96/1/bio/bibliografia01.html

- id: almeida-garrett/miragaia
  title: "Miragaia"
  authorIds: [almeida-garrett]
  published: 1844
  subseries: null
  canonTier: extended
  format: poem
  synopsis: >
    A shorter poem published in Lisbon in 1844, the year before
    [[work:almeida-garrett/flores-sem-fruto|Flores sem Fruto]] and nearly a
    decade before [[work:almeida-garrett/folhas-caidas|Folhas Caídas]].
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/os-exilados-a-senhora-rossi-caccia
  title: "Os Exilados, À Senhora Rossi Caccia"
  authorIds: [almeida-garrett]
  published: 1845
  subseries: null
  canonTier: apocrypha
  format: poem
  synopsis: >
    A poem written for a charity ball raising funds for political exiles,
    first published anonymously on 31 March 1845 in the newspaper Revolução
    de Setembro (as "A Madame Rossi Caccia") and the same day as its own
    leaflet, honouring the singer Rossi-Caccia who performed at the event.
  note: >
    Later folded into expanded editions of
    [[work:almeida-garrett/folhas-caidas|Folhas Caídas]]; its own leaflet and
    newspaper printing, eight years earlier, is the first publication
    recorded here.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://purl.pt/96/1/bio/bibliografia01.html
    - https://purl.pt/96/1/bio/bio_06.html

- id: almeida-garrett/flores-sem-fruto
  title: "Flores sem Fruto"
  authorIds: [almeida-garrett]
  published: 1845
  subseries: null
  canonTier: extended
  format: poetry-collection
  synopsis: >
    A poetry collection English Wikipedia's own biography credits, alongside
    [[work:almeida-garrett/folhas-caidas|Folhas Caídas]] eight years later,
    with an "innovative manner" that marked a shift toward the more complex,
    subjective register his prose was taking at the same time in
    [[work:almeida-garrett/o-arco-de-santana|O Arco de Sant'Ana]].
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/folhas-caidas
  title: "Folhas Caídas"
  authorIds: [almeida-garrett]
  published: 1853
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Garrett's last completed book and, by his own English-Wikipedia
    biography's judgment, "probably his best" book of poems - written for
    Rosa de Montúfar, a Spanish noblewoman who became his companion in his
    final years, and first published in Rio de Janeiro before reaching
    Lisbon the same year.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

# --- Theatre ---

- id: almeida-garrett/catao
  title: "Catão"
  authorIds: [almeida-garrett]
  published: 1822
  subseries: null
  canonTier: core
  format: play
  synopsis: >
    A neoclassical tragedy on the death of Cato the Younger, written as a
    Coimbra student and premiered at Lisbon's Teatro do Bairro Alto on 29
    September 1821 before its 1822 publication - Garrett's earliest staged
    work, later revived in London (1830), Rio de Janeiro (1833) and Lisbon
    again (1845).
  note: >
    Its 1822 Lisbon edition was published jointly with the short comedy O
    Corcunda por Amor, which this file does not list as a separate entry -
    no synopsis or independent critical treatment for it was found in the
    sources checked here beyond its existence as Catão's companion piece.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/merope
  title: "Mérope"
  authorIds: [almeida-garrett]
  published: 1841
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A neoclassical tragedy written in 1820, named in Portuguese Wikipedia's
    own milestone chronology of Garrett's early work alongside
    [[work:almeida-garrett/lucrecia|Lucrécia]],
    [[work:almeida-garrett/o-retrato-de-venus|O Retrato de Vénus]] and
    [[work:almeida-garrett/catao|Catão]] - but, unlike those three, it was
    never staged in his lifetime, reaching print only in 1841.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/um-auto-de-gil-vicente
  title: "Um Auto de Gil Vicente"
  authorIds: [almeida-garrett]
  published: 1838
  subseries: null
  canonTier: core
  format: play
  synopsis: >
    A historical play built around Gil Vicente, the founding figure of
    Portuguese theatre himself, staged at Lisbon's Teatro Nacional da Rua
    dos Condes - written in the years Garrett was campaigning for the
    national theatre and drama conservatory that would eventually stage it.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/o-alfageme-de-santarem
  title: "O Alfageme de Santarém ou A Espada do Condestável"
  authorIds: [almeida-garrett]
  published: 1842
  subseries: null
  canonTier: core
  format: play
  synopsis: >
    A historical play staged at the Teatro Nacional da Rua dos Condes,
    written in the same theatre-building years as
    [[work:almeida-garrett/um-auto-de-gil-vicente|Um Auto de Gil Vicente]].
  note: >
    1842 is corroborated by three independent sources: Portuguese
    Wikipedia's own detailed bibliography, its dedicated article on the play
    itself (infobox "Lançamento 1842," sourced to Infopédia), and Infopédia's
    own Garrett biography. The "1841" that appears in Portuguese Wikipedia's
    separate "Cronologia das obras" milestone list, hedged there as "1842
    segundo algumas fontes," names the year the play was staged at the
    Teatro Nacional da Rua dos Condes rather than the year it was printed -
    the same premiere/print gap already recorded on
    [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]] below.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://pt.wikipedia.org/wiki/O_Alfageme_de_Santar%C3%A9m
    - https://www.infopedia.pt/$almeida-garrett

- id: almeida-garrett/frei-luis-de-sousa
  title: "Frei Luís de Sousa"
  authorIds: [almeida-garrett]
  published: 1844
  subseries: null
  canonTier: core
  featured: true
  format: play
  synopsis: >
    Twelve years after her first husband is believed to have died at the
    Battle of Alcácer-Quibir, Madalena de Vilhena has remarried Manuel de
    Sousa Coutinho and had a daughter - until a pilgrim arrives at their
    door claiming to be him. A three-act drama loosely based on the real
    life of Manuel de Sousa Coutinho, who did take religious vows as Frei
    Luís de Sousa; read publicly for the first time at a private theatre in
    1843 and published the following year. Directly inspired by the
    illegitimacy of Garrett's own daughter, Maria Adelaide (see
    content/authors/almeida-garrett.yaml's own lifeEvents), and one of
    English Wikipedia's own three named "notable works" for Garrett.
  sources:
    - https://pt.wikipedia.org/wiki/Frei_Lu%C3%ADs_de_Sousa_(pe%C3%A7a_teatral)
    - https://en.wikipedia.org/wiki/Almeida_Garrett
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/d-filipa-de-vilhena
  title: "D. Filipa de Vilhena"
  authorIds: [almeida-garrett]
  published: 1846
  subseries: null
  canonTier: core
  format: play
  synopsis: >
    A historical play on Filipa de Vilhena, remembered for arming her sons
    for the 1640 Restoration that ended sixty years of Spanish rule -
    staged at the Conservatório's own Rua do Salitre theatre by its student
    company, the third of English Wikipedia's own named historical-theatre
    trio alongside
    [[work:almeida-garrett/um-auto-de-gil-vicente|Um Auto de Gil Vicente]]
    and [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]].
  note: >
    Premiered on the same 1846 bill as
    [[work:almeida-garrett/falar-verdade-a-mentir|Falar Verdade a Mentir]]
    and a third short piece, "Tio Simplício," which this file does not list
    separately - no independent publication record or synopsis for it was
    found in the sources checked here.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett
    - https://en.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/falar-verdade-a-mentir
  title: "Falar Verdade a Mentir"
  authorIds: [almeida-garrett]
  published: 1846
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A comedy first staged in 1846 on the same bill as
    [[work:almeida-garrett/d-filipa-de-vilhena|D. Filipa de Vilhena]], and
    republished in Rio de Janeiro in 1858.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/a-sobrinha-do-marques
  title: "A Sobrinha do Marquês"
  authorIds: [almeida-garrett]
  published: 1848
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A comedy published in Lisbon in 1848.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/camoes-do-rossio
  title: "Camões do Rossio"
  authorIds: [almeida-garrett]
  published: 1852
  subseries: null
  canonTier: apocrypha
  format: play
  authorRole: co-author
  synopsis: >
    A comedy published in 1852, co-written with Inácio Feijó.
  note: >
    Inácio Feijó has no entity of his own yet in this catalogue's
    content/authors/, so this entry records the collaboration in prose
    (authorRole: co-author) rather than in withAuthorIds, which the schema
    requires to resolve to a real author file.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/lucrecia
  title: "Lucrécia"
  authorIds: [almeida-garrett]
  published: 1914
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    A tragedy on the legend of Lucretia, drafted at Coimbra in 1819 when
    Garrett was twenty, and named in Portuguese Wikipedia's own milestone
    chronology as his earliest listed work - though, like most of his
    Coimbra-era juvenilia, it did not reach print until 1914, sixty years
    after his death.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/um-noivado-no-dafundo
  title: "Um Noivado no Dafundo ou Cada Terra com Seu Uso, Cada Roca com Seu Fuso"
  authorIds: [almeida-garrett]
  published: 1857
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    A one-act comic proverb-play written in 1847 and first published only
    in 1857, three years after Garrett's death.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/as-profecias-do-bandarra
  title: "As Profecias do Bandarra"
  authorIds: [almeida-garrett]
  published: 1877
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    A comedy written in 1845 and, per Portuguese Wikipedia's own milestone
    chronology, staged or otherwise known by 1848 - but not published as a
    book until 1877, twenty-three years after Garrett's death.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/teatro-de-juventude-inedito
  title: "Teatro de juventude inédito"
  authorIds: [almeida-garrett]
  published: 1898
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    Ten short or unfinished plays Garrett drafted as a teenager in Coimbra,
    the Azores and Sintra between roughly 1816 and 1822 - tragedies,
    comedies and one opera libretto in Italian - none published in his
    lifetime and several explicitly left incomplete.
  note: >
    Grouped as one entry (see this file's own header on grouping) rather
    than ten: Átala (drama, unfinished), Afonso de Albuquerque (tragedy,
    unfinished), Sofonisba (tragedy, unfinished), Édipo em Colona (tragedy,
    unfinished, published 1952), Ifigénia em Tauride (tragedy, unfinished,
    published 1952), O Amor da Pátria (elogio dramático), La Lezione agli
    Amanti (opera bufa, in Italian), Conde de Novion (comedy), Impromptu de
    Sintra (comedy, published 1898) and Os Namorados Extravagantes (drama,
    published 1974). All ten are individually dated and titled in
    Portuguese Wikipedia's own detailed bibliography, cited below, for a
    future pass to split out if any is judged load-bearing on its own.
  sources:
    - https://pt.wikipedia.org/wiki/Almeida_Garrett

- id: almeida-garrett/entremez-dos-velhos-namorados
  title: "Entremez dos Velhos Namorados que Ficaram Logrados, Bem Logrados"
  authorIds: [almeida-garrett]
  published: 1954
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    A comic one-act interlude written in 1841, the same year as
    [[work:almeida-garrett/o-alfageme-de-santarem|O Alfageme de
    Santarém]], and not published until 1954, a century after Garrett's
    death - recovered by Damien Saunal for his critical edition of
    previously unpublished Garrett texts.
  note: >
    Distinct from the Coimbra-Azores-Sintra juvenilia grouped in
    [[work:almeida-garrett/teatro-de-juventude-inedito|Teatro de juventude
    inédito]]: written when Garrett was forty-two, not as a teenager, so it
    stands as its own entry rather than joining that group.
