# FRANCHISE events: what happened to the BOOKS. Garrett's own life is on the
# author entity at content/authors/almeida-garrett.yaml.
#
# Both entries below belong to Frei Luís de Sousa (1844) specifically, not to
# Garrett generally: two screen adaptations, fifty-one years apart, that
# between them explain why this one play - not Camões, not Viagens na Minha
# Terra - is the work still assigned to secondary-school students today.
#
# Append-only file; parallel branches merge here.

- id: almeida-garrett-frei-luis-de-sousa-film-1950
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 1950-09-21
  title: First screen adaptation, more than a century after the play
  scope: culture
  reach: franchise
  impact: low
  description: >
    António Lopes Ribeiro's black-and-white
    [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]] opened at
    Lisbon's Cinema São Jorge on 21 September 1950, a hundred and six years
    after the play, with a script and cast (Maria Sampaio, Raul de Carvalho,
    João Villaret)
    drawn straight from the play and a score by composer Luís de Freitas
    Branco. Its cinematography, by Aquilino Mendes, won the Secretariado
    Nacional de Informação's prize for best photography that year - the
    Estado Novo's own propaganda and culture body putting its annual award
    behind the first film made of the play.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Frei_Lu%C3%ADs_de_Sousa_(filme)"

- id: almeida-garrett-quem-es-tu-film-2001
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 2001-11-23
  title: A second film, explicitly aimed at students required to read the play
  scope: culture
  reach: franchise
  impact: low
  description: >
    João Botelho's "Quem És Tu?" (23 November 2001) adapts
    [[work:almeida-garrett/frei-luis-de-sousa|Frei Luís de Sousa]] again, shot
    in confined, low-lit interiors that isolate the characters rather than
    open the play out - and was made, by the director's own stated purpose,
    for secondary-school students who have Frei Luís de Sousa as set reading.
    A second adaptation, more than ninety years after the first, made
    expressly for the classroom rather than the box office, is itself a fact
    about the play's afterlife: it is read here, still, as a matter of
    curriculum, not just of literary history.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Quem_%C3%89s_Tu%3F"
