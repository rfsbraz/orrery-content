# Creative periods. Empty, deliberately.
#
# Garrett's career has an obvious shape in outline - two spells of political
# exile (1823-1826, 1828-1832) that produced his founding Romantic poems,
# then two decades in Portugal building the national theatre and writing
# most of his plays and prose, then a final, more personal stretch closing
# with Folhas Caídas (1853) - but this file does not turn that outline into
# `eras` entries. An era is a received, sourced periodisation, not a reading
# of the biography by whoever last touched this file, and no
# literary-historical source establishing named creative periods for
# Garrett's work has been found and cited here. `eras: []` is the honest,
# complete state the schema allows (CURATION.md #1) until a source is found
# that either supplies a real periodisation or confirms none exists to cite.
[]
