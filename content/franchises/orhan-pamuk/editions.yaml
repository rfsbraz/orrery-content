# Concrete published editions - the buyable objects behind works.yaml's 24
# abstract works. COVERAGE: 24/24 works carry a Turkish-original edition
# (full coverage); 18/24 also carry at least one English edition; 1/24 (My
# Name Is Red) carries a verified pt-PT edition. 55 editions total.
#
# SOURCING. Three tiers, cross-checked against each other wherever more than
# one existed: (1) dr.com.tr (D&R), a major Turkish retailer whose per-product
# pages expose a `gtin13` field plus "İlk Baskı Yılı" (first-printed-year for
# that ISBN)/page-count/format spec table - reachable where the publisher's
# own yapikrediyayinlari.com.tr (Cloudflare-gated) and the usual Turkish
# retailers (kitapyurdu.com, wook.pt, bertrand.pt, fnac.pt) were not; (2)
# Turkish Wikipedia's own per-book infobox, which independently corroborated
# the D&R ISBN outright for four titles (Cevdet Bey ve Oğulları, Beyaz Kale,
# Kafamda Bir Tuhaflık, Kırmızı Saçlı Kadın) and named the superseded original
# publisher/ISBN for seven more (Sessiz Ev, Kara Kitap, Yeni Hayat, Benim Adım
# Kırmızı, Kar, Masumiyet Müzesi, Şeylerin Masumiyeti); (3) OpenLibrary's per-ISBN
# records (Amazon- and MARC-sourced), which corroborated most of the
# remaining D&R ISBNs and supplied every English-language ISBN via
# openlibrary.org/search.json, cross-checked in turn against
# orhanpamuk.net, Knopf/Penguin Random House's own product pages, and
# Turkish Wikipedia as noted per entry. Every isbn13 below was independently
# recomputed for its EAN-13 check digit (script, not eyeballed) and every
# `tr` ISBN begins 978-975 (Turkey's registrant range for these publishers);
# no ISBN is duplicated across two entries.
#
# THE BACKLIST-CONSOLIDATION PATTERN. Pamuk's Turkish backlist was originally
# split across several publishers - Can Yayınları (Sessiz Ev, the first Kara
# Kitap), İletişim Yayınları (Kar, Yeni Hayat, Benim Adım Kırmızı, Masumiyet
# Müzesi, Şeylerin Masumiyeti, Babamın Bavulu, Saf ve Düşünceli Romancı,
# Manzaradan Parçalar) - now consolidated under Yapı Kredi Yayınları (YKY),
# which holds new ISBNs for its current print runs distinct
# from the original first-edition ISBNs Turkish Wikipedia's infoboxes still
# cite. Every Turkish edition below is the current YKY ISBN (the one a reader
# can actually buy today); the superseded original ISBN is named in the note
# wherever a second source supplied it, purely as bibliographic history.
#
# TWO EXPANDED-REISSUE PAIRS, recorded as distinct editions because their
# titles and page counts genuinely differ from the plain work even within
# Turkish: İstanbul: Hatıralar ve Şehir / Resimli İstanbul (the photograph-
# enriched reissue, with its English counterpart "Illustrated Istanbul"), and
# Şeylerin Masumiyeti / Şeylerin Masumiyeti - 6 Yeni Vitrin İle (the current
# in-print reissue adding six new museum display cases; the original 2012
# İletişim first edition is out of print and not recorded).
#
# THE ONE REVERSED-LANGUAGE CASE: The Naive and the Sentimental Novelist is
# the sole work in this bibliography whose `title` in works.yaml is already
# English (Harvard University Press published it before any Turkish
# edition). An edition carries a `title` only where the published title
# differs from the work's own; repeating an identical one would manufacture
# a translation event that never happened. So it is the TURKISH edition
# below that carries a `title` ("Saf ve Düşünceli Romancı"), not the
# English one.
#
# PORTUGUESE: only one genuine pt-PT edition was found anywhere in this
# bibliography - My Name Is Red / O Meu Nome É Vermelho (Editorial Presença,
# 2007). Snow and Istanbul both turned up only pt-BR editions (Companhia das
# Letras); per this catalogue's region-strict rule a pt-BR ISBN is never
# recorded as pt-PT, so those two are simply absent rather than mistagged.
#
# NO ENGLISH EDITION FOUND for six works, each a market fact rather than a
# research gap: Kara Kitap'ın Sırları and Manzaradan Parçalar (absent from
# every English-language source checked, per works.yaml's own notes),
# Gizli Yüz (the screenplay was never published in English), Kelimeler ve
# Resimler (June 2026 release, too recent for a translation to exist yet),
# Babamın Bavulu (the Nobel lecture's English translation appeared in The New
# Yorker and the Nobel Foundation's archive, neither of them a book with an
# ISBN), and Balkon (even its Turkish printing carries Steidl's own
# 978-3 registration; no separate English-language object exists).
# Manzaradan Parçalar's Turkish edition (İletişim Yayınları, 2010) is also
# the one Turkish edition in this file NOT confirmed as currently in print -
# it does not appear on D&R's live catalogue, unlike every Yapı Kredi-era
# title here - but it is recorded regardless as the sole edition found.
#
# THE FORTHCOMING EDITION: Cevdet Bey and His Sons (Knopf, translated by
# Robert Finn, announced for 2027-03-30) is recorded with its real,
# check-digit-valid pre-order ISBN sourced directly from Penguin Random
# House's own product page, following this catalogue's standing convention
# for an announced-but-unpublished book (see e.g. john-gwynne/editions.yaml
# and lars-kepler/editions.yaml) - the schema's `forthcoming` field lives on
# the work, not the edition, so the announced status is carried in this
# entry's `note` instead.

