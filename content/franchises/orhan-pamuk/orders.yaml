# Additional reading orders. There are none on record here.
#
# No subseries and no shared universe run through the eleven core novels
# (works.yaml's own header lays out the check): each is a standalone story
# with its own cast and period, so there is no thread to isolate, no
# in-universe chronology to reconstruct, and no publisher-numbered sequence
# covering the whole shelf that differs from first-publication order.
#
# The publisher's own three thematic omnibuses - "Three Historical Novels"
# (Beyaz Kale / Benim Adım Kırmızı / Veba Geceleri), "Three Istanbul Novels"
# (Kara Kitap / Masumiyet Müzesi / Kafamda Bir Tuhaflık), and the "Delta"
# collected-works volume "Fathers, Mothers and Sons" (Cevdet Bey ve Oğulları
# / Sessiz Ev / Kırmızı Saçlı Kadın) - were considered and rejected as
# orders, for the same reason works.yaml already excludes all three as
# works in their own right: each groups novels by shared setting or a
# father-son throughline for marketing, not by a continuing narrative, and
# orhanpamuk.net's own listing is the only place any of the three is
# grouped at all. Each is also already in first-publication order
# internally, so an order built from any of them would restate the derived
# default under a curated label.
#
# No entry-point consensus was found either, in English or in Turkish.
# Orhan Pamuk's own site (orhanpamuk.net) lists all of his books with no
# ranking, star, or "start here" marker of any kind. No dedicated "where to
# start with Orhan Pamuk" guide turned up from a major outlet, a
# books-focused publication (Five Books, Literary Hub), a canonical
# community guide, or a bookseller reading-order feature: Wook's own "por
# onde começar" series, the format behind Valter Hugo Mãe's startHere on
# this catalogue, blocks automated access the same way it does for
# Portuguese-language authors, and no cached or archived copy of a Pamuk
# entry could be retrieved. English and Turkish Wikipedia's own articles
# single out Benim Adım Kırmızı (translated into 24 languages, the 2003
# International Dublin Literary Award) and Kar (a New York Times Ten Best
# Book of 2004) as his most internationally awarded and covered novels -
# a fact about reception, already recorded on those two works in
# works.yaml, and not the same claim as a reader, critic, or bookseller
# actually recommending either as where to begin. No source makes that
# second claim, so no startHere path exists for it either.
[]
