# Branding for the Orhan Pamuk wing (see docs/SCHEMA.md#themeyaml). Non-art
# fields only - the `art` block (motifs, emblem, line, etc.) is scaffolded
# separately by the visual-language stage, once the bibliography and any
# eras are settled. Checked against every existing wing's palette before
# choosing (python scripts/theme_digest.py).
#
# Pamuk's own writing names its own palette directly: his memoir
# "İstanbul: Hatıralar ve Şehir" devotes a chapter to "hüzün," the
# collective, specifically Istanbul melancholy he argues the whole city
# feels, and illustrates the book throughout with black-and-white
# photographs (many by Ara Güler) of a grey, wintry, fog-bound Bosphorus and
# fading Ottoman wooden houses - a documented, sourced palette rather than a
# reading of the prose. So this wing takes a pale, overcast, near-monochrome
# grey as its ground (old silver-gelatin print paper, winter daylight over
# the strait), rather than the near-black most of this catalogue's serious
# literary wings default to.
#
# The accent breaks that monochrome deliberately, and is sourced the same
# way: red is not a critic's reading of Pamuk's palette, it is literally two
# of his own titles - "Benim Adım Kırmızı" ("My Name Is Red," a novel
# structured around Ottoman miniaturists and the ground cinnabar/vermilion
# pigment their red paint was made from) and "Kırmızı Saçlı Kadın" ("The Red-
# Haired Woman"). The accent below is pitched as that pigment - hot,
# saturated, slightly orange - rather than the wound-dark or brick reds
# already in the catalogue: distinct from Stephen King's oxblood (#b04a34),
# Cormac McCarthy's rust (#c1662c), Valter Hugo Mãe's terracotta (#a8461f),
# John Gwynne's dark oxblood (#7a2420), JK Rowling's and José Rodrigues dos
# Santos's brick (#a1392b / #b23327), and Lee Child's pink-leaning flare
# (#c62f57). It sits closest to John Grisham's pure rubber-stamp red
# (#c0272c) of anything in the catalogue, but on an entirely different
# ground and for a different reason - Grisham's is ink stamped on a pale
# legal pad, this is pigment ground for a miniaturist's brush - and is
# tuned brighter and slightly more orange than Grisham's to read as paint
# rather than ink.
preset: istanbul-huzun
palette:
  bg: "#e6e3dc"       # pale, cool-neutral grey - old photograph paper and
                      # winter Bosphorus daylight, not Agatha Christie's
                      # warmer interwar cream (#f3ecdf) or Jo Nesbo's colder
                      # blue-white (#e6ebee)
  surface: "#dad6cc"  # a shade deeper, for cards
  ink: "#221f1c"      # near-black warm charcoal, for maximum contrast on
                      # the pale ground
  muted: "#54503f"    # dulled warm grey, for metadata (AA-checked against
                      # bg and surface: 6.31:1 and 5.57:1)
  accent: "#d1401f"   # one hot, slightly orange vermilion - the miniaturist's
                      # pigment, used only for links and markers
displayFace: spectral  # from the app's implemented set (fraunces | spectral
                       # | sourceSerif | instrument-serif); a quiet, exact
                       # literary serif rather than fraunces's warmer
                       # ornament, in the same register this catalogue
                       # already gives Murakami, Pessoa and García Márquez -
                       # other Nobel-adjacent, internationally-translated
                       # literary wings
signature: thread     # a fine, quiet hairline - already this catalogue's
                       # most common choice, and deliberately so here: it
                       # stands for a single grey thread of memory running
                       # through decades of black-and-white photographs and
                       # recollection, never a bold rail or a firm
                       # architectural edge, which would overstate a body of
                       # work built on understatement and melancholy rather
                       # than drama
# ART. This wing shares both displayFace (spectral) and signature (thread)
# with exactly two other wings in the catalogue - haruki-murakami and
# fernando-pessoa - the tightest three-way cluster on that pair of axes,
# and the palette comment above already groups all three as this
# catalogue's Nobel-adjacent, internationally-translated literary
# register, so the two need pushing apart in words, not just in colour.
# Pessoa's own emblem is an open trunk overflowing with the 25,000 loose
# sheets of his espólio - the object his entire bibliography is assembled
# from. This wing's own strongest paper-object candidate is the small
# suitcase of his father's unpublished writing that gives Pamuk's Nobel
# lecture, "Babamın Bavulu" ("My Father's Suitcase"), its name - and it is
# deliberately not used as the emblem below: a second paper-filled travel
# case beside Pessoa's overflowing trunk would read as the same idea
# restated smaller. This wing's emblem is a vitrine of objects instead, and
# its doubling motifs (Beyaz Kale, Kara Kitap) are built the same way, as
# paired objects and interleaved prose rather than paper. Murakami's own
# wing rules out drawing its two-Tokyo doubling "as one figure, one mind or
# a mirrored self" for a different reason - two co-existing realities,
# neither resolved as the real one - where this wing's doubling is two
# people or two texts converging toward each other. Both wings agree,
# independently, on the same rule for a different plot: no mirror, no
# reflected double, which is in any case already this catalogue's Dan
# Brown device. avoid holds that line explicitly below.
art:
  emblem:
    object: >
      A small wall-mounted glass vitrine holding a handful of ordinary,
      unremarkable objects - a hairpin, a cigarette stub, a ferry ticket, a
      saltshaker - each set on its own small numbered card beneath one
      internal light, the way a museum exhibit is lit and labelled.
    why: >
      Masumiyet Müzesi's own synopsis in this bibliography is exactly this
      act: a wealthy man's decade-long attachment to a woman he loved
      briefly "leads him to hoard objects that once belonged to her,
      assembling, object by object, the private museum the novel is named
      for." Pamuk then built that museum for real, in Istanbul's Çukurcuma
      district; its own catalogue, "Şeylerin Masumiyeti" (2012, "The
      Innocence of Objects"), won the 2014 Mary Lynn Kotz Award for Art
      Book of the Year, and the physical museum won the European Museum of
      the Year Award the same year - the one point in this whole
      bibliography where a novel's central image became a real, visitable,
      prize-winning building rather than staying a metaphor.
  motifs:
    - a small glass vitrine of ordinary, unremarkable personal objects (a
      hairpin, a cigarette stub, a ferry ticket, a matchbox), each lit and
      set on its own card like a museum label
    - a ferry crossing the Bosphorus at dusk, the European and Asian shores
      each caught in a different quality of light, never both clear at once
    - a weathered wooden yalı at the water's edge, paint fading, listing
      slightly toward the strait
    - an Ottoman court miniaturist's workbench holding a gold coin, a
      manuscript page pinned flat under a weight, a mussel shell of ground
      red pigment, and an unfinished sketch of a dog - three of Benim Adım
      Kırmızı's own rotating narrators, held as the objects and the
      creature the novel gives a voice to, never staged as speaking
    - two identical sets of a scholar's instruments - two astrolabes, two
      ink-wells, two pairs of spectacles - set down side by side on one
      desk, arranged so it is not clear which belonged to which man
    - "two kinds of prose sharing one spread: a plain handwritten search
      recounted on one page, a dense printed newspaper column reprinted
      opposite it in a visibly different type"
    - a personal notebook lying open, diary text on one page and a small
      unfinished ink-wash sketch in the margin of the other
  atmosphere: >
    A civic melancholy held in common rather than a private mood: hüzün, in
    Pamuk's own naming of it, is a feeling the whole city is understood to
    share, never one figure's sadness projected onto its buildings. Grey,
    overcast and faintly damp more often than not; interiors are modest and
    domestic - a shop counter, a shared desk, a museum case - rather than
    grand or gothic. The city sits on the fault line the Nobel citation
    names outright, "the clash and interlacing of cultures," so a scene is
    often built from two things meeting rather than one thing shown alone:
    two shores, two hands, two kinds of prose, never fully reconciled.
    Never Orientalist wonder or postcard exoticism, never a warm nostalgic
    glow (that register belongs to a different wing on this shelf), never
    gothic dread or candlelit menace - closer to standing at a window in
    low winter light, aware of a great deal of history under an ordinary,
    unremarkable present moment.
  lineCharacter: >
    A fine graphite pencil line, level and modest, held the way someone
    annotates a photograph rather than composes a drawing - Pamuk's own
    working notebooks pair diary text with exactly this kind of small
    marginal sketch (Uzak Dağlar ve Hatıralar, Kara Kitap'ın Sırları), and
    that documentary restraint, not an illustrator's flourish, is the hand
    this wing draws in. The one exception is deliberate and total: wherever
    the accent appears, the tool changes completely, to a small brush
    loaded with wet vermilion pigment, laid down once in a single unblended
    stroke - the miniaturist's own gouache-on-paper technique, the same
    ground pigment "My Name Is Red" is named for - never softened into the
    graphite around it. Distinct from Pessoa's line, which corrects and
    re-annotates itself in a single hand over time, and from Murakami's,
    which blurs at one seam per image: this wing's line never blurs and
    never self-corrects, it simply changes instrument once, in the one
    place the accent is allowed to live.
  backgroundTexture: >
    A cool grey, faintly grained sheet reading as an old press photograph's
    matte print paper rather than an artist's stock - the register of Ara
    Güler's own Istanbul photojournalism, not a warm family snapshot. The
    faint ghost of a photo corner-mount triangle occasionally shows at one
    edge, as if the sheet had once been pasted into an album and lifted
    back off it.
  accentUse: >
    Vermilion appears as wet pigment on exactly one element per image,
    never a wash, a fill or a garment: the loaded brush or the mussel shell
    of ground colour itself, a single bookbinding thread laid across closed
    pages, or one corrected word inked over in a manuscript's margin. Never
    a flag, a fez, a rug or any other object whose redness would read as
    national or folkloric costume rather than pigment.
  avoid:
    - minarets on a skyline, whirling dervishes, nargile cafés, Grand
      Bazaar carpet stacks, nazar/evil-eye charms or fortune-telling coffee
      cups - tourist-Orientalist Istanbul shorthand the Nobel citation's
      own "clash and interlacing of cultures" argues against, not for
    - a single warm-toned faded photograph held or propped up as the
      emblem object - already this catalogue's Isabel Allende register;
      this wing's photographs stay cool grey and documentary, never a warm
      family keepsake
    - two identical or mirror-reflected faces or figures standing in for
      Beyaz Kale's or Kara Kitap's doubling - object and text only, never a
      face, and never a mirror or reflection device, which is already this
      catalogue's Dan Brown territory
    - a decorative illuminated-manuscript border, interlace or gilt
      curlicue - this wing's miniaturist imagery is workshop craft (a coin,
      a pinned page, a shell of ground pigment), never ornamental border
      illumination
    - the vitrine's objects read as scientific specimens, insects or
      taxidermy pinned under glass - personal love-relics, never a
      laboratory collection
    - the real Museum of Innocence building's exterior, or any tourist-site
      photograph of it as itself - the vitrine and its objects carry the
      idea, never the building
notes: >
  A pale, overcast, near-monochrome register - grey winter light over the
  Bosphorus, old photograph paper - broken by exactly one hot vermilion
  accent, applied only as wet pigment, standing for the ground colour his
  own title "My Name Is Red" names outright and gives a voice to as one of
  that novel's own narrators. The one emblem is a small vitrine of
  ordinary objects, after the real Museum of Innocence Pamuk built from his
  own novel; the line is a documentary pencil that changes to a loaded
  brush only where the accent lives.
