- id: pamuk-beyaz-kale-international-award-1990
  date: 1990
  title: Beyaz Kale wins Britain's Independent Foreign Fiction Prize
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:orhan-pamuk/beyaz-kale|Beyaz Kale]] (1985) was the first Pamuk
    novel to appear in English - as The White Castle, translated by
    Victoria Holbrook - and won the UK's Independent Foreign Fiction Prize
    in 1990. The New York Times Book Review followed the next year with a
    review by Jay Parini that opened, "A new star has risen in the
    east - Orhan Pamuk," the line usually credited with launching his
    reputation abroad, years before either
    [[work:orhan-pamuk/benim-adim-kirmizi|Benim Adım Kırmızı]] or the
    Nobel.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Orhan_Pamuk
    - http://movies2.nytimes.com/books/98/06/28/nnp/pamuk-castle.html

- id: pamuk-yeni-hayat-fastest-seller-1994
  date: 1994
  title: Yeni Hayat becomes the fastest-selling book in Turkish publishing history
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:orhan-pamuk/yeni-hayat|Yeni Hayat]]'s 1994 publication was a
    sensation at home: it became, by multiple accounts, the fastest-selling
    book in Turkish publishing history, proof that the international
    reputation Beyaz Kale and Kara Kitap had built abroad was matched by a
    genuine mass readership in Turkey itself. Pamuk's public support for
    Kurdish political rights was making him a high-profile, divisive
    figure in the country at the same time.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Orhan_Pamuk
    - https://www.encyclopedia.com/international/encyclopedias-almanacs-transcripts-and-maps/pamuk-orhan-1952

- id: pamuk-benim-adim-kirmizi-prize-sweep-2002
  date: 2002
  dateRange: "2002-2003"
  title: Benim Adım Kırmızı sweeps three major foreign-fiction prizes
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:orhan-pamuk/benim-adim-kirmizi|Benim Adım Kırmızı]] (1998) won
    France's Prix du Meilleur Livre Étranger and Italy's Premio Grinzane
    Cavour in 2002, then - translated by that point into 24 languages -
    the International Dublin Literary Award in 2003, awarded jointly with
    its translator Erdağ M. Göknar and worth $127,000, one of the richest
    prizes in literature. Asked what winning it had changed, Pamuk said:
    "Nothing changed in my life since I work all the time. I've spent 30
    years writing fiction. For the first 10 years, I worried about money
    and no one asked how much money I made... And I've spent the last 10
    years with everyone expecting to hear how I spend the money, which I
    will not do." Three years before the Nobel, this sweep is the moment
    his reputation stopped being merely Turkish and became global.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Orhan_Pamuk
    - https://tr.wikipedia.org/wiki/Orhan_Pamuk

- id: pamuk-norton-lectures-2009
  date: 2009
  title: Delivers Harvard's Charles Eliot Norton Lectures
  scope: culture
  reach: franchise
  impact: med
  description: >
    Delivered the Charles Eliot Norton Lectures at Harvard in 2009, one of
    the most prestigious visiting lectureships in the humanities. Unusually
    for his bibliography, the resulting book,
    [[work:orhan-pamuk/the-naive-and-the-sentimental-novelist|The Naive and
    the Sentimental Novelist]] - his own account of how novelists actually
    write and read - was published first in English (Harvard University
    Press, 2010) and only the following year in Turkish, a reversal of the
    Turkish-first order every other title in this catalogue follows.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Orhan_Pamuk

- id: pamuk-museum-of-innocence-opens-2012
  date: 2012-04
  dateRange: "2012-2014"
  title: Opens a real Museum of Innocence in Istanbul, built in tandem with the novel
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet Müzesi]] (2008) was
    conceived from the start alongside an actual museum: Pamuk bought a
    nineteenth-century house in Istanbul's Çukurcuma antiques quarter and
    filled it with everyday objects tied to the novel's story - clothes,
    watches, photographs, a case of cigarette butts - arranged as 83
    vitrines, one per chapter, so the book's fictional collection became
    one a reader can actually walk through. It opened in April 2012 and
    won the 2014 European Museum of the Year Award, an unusual honor for a
    museum built to serve a novel rather than the reverse.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Museum_of_Innocence_(museum)

- id: pamuk-balkon-exhibition-2018
  date: 2018
  dateRange: "2018-2019"
  title: Balkon collects five months of Bosphorus photographs shot from his own window
  scope: culture
  reach: franchise
  impact: low
  description: >
    [[work:orhan-pamuk/balkon|Balkon]] (2018) collects photographs Pamuk
    took of the view from his own Istanbul balcony with a telephoto lens -
    over 8,500 frames shot across five months in late 2012 and early 2013,
    watching the same stretch of the Bosphorus change with the light and
    the seasons. Curated by his German publisher Gerhard Steidl, more than
    600 of them were shown as "Balkon: Photos by Orhan Pamuk" at the Yapı
    Kredi Culture and Arts building on İstiklal Street for three months in
    2019.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Orhan_Pamuk
