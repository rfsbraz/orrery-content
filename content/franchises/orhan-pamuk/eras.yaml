# Creative periods. One is claimed, and one only.
#
# THE TWO FIRST NOVELS ARE A RECEIVED PERIOD, AND THE WORK THAT ENDS IT IS
# NAMED. Turkish criticism groups Cevdet Bey ve Oğulları and Sessiz Ev as
# Pamuk's "ilk dönem", his first period, and puts the break at
# [[work:orhan-pamuk/beyaz-kale|Beyaz Kale]] (1985), which it calls a geçiş
# eseri, a transitional work, and his first postmodern narrative. The
# Türk Edebiyatı İsimler Sözlüğü, Ahmet Yesevi University's biographical
# dictionary of Turkish literature, states both in
# its Pamuk entry: "Orhan Pamuk romancılığında bir geçiş eseri niteliğindeki
# Beyaz Kale (1985)" and "Beyaz Kale, aynı zamanda yazarın ilk postmodern
# anlatısıdır" (https://teis.yesevi.edu.tr/madde-detay/pamuk-orhan). The Gale
# Biographical Encyclopedia of the Modern Middle East and North Africa draws
# the same line in English, and draws it as a boundary rather than as a review:
# Beyaz Kale "constitutes an important turning point both for the author's
# career and for Turkish novel in general. In The White Castle he broke with
# the realist tradition and attempted something different from his first two
# novels" (Engin Kılıç, via
# https://www.encyclopedia.com/international/encyclopedias-almanacs-transcripts-and-maps/pamuk-orhan-1952).
# Pamuk groups the same two books himself, and dates his own arrival after
# them: "My two first novels, Cevdet Bey and Sons, and Silent House, are
# family sagas", and "it was in The Black Book, which I began in 1985, that I
# felt I found my own voice"
# (https://www.nobelprize.org/prizes/literature/2006/pamuk/biographical/).
#
# NOTHING PERIODISES THE FORTY YEARS AFTER 1983. Searched in Turkish, the
# language he writes in and the language his criticism is written in, and in
# English. Four candidate shapes fail, each for its own reason.
#
#  - ONE SCHOLAR'S FIVE-PART CLASSIFICATION, AND HE HAS SINCE RENAMED PART OF
#    IT. Fethi Demir sorts the novels "Klasik/Modern Romanlar: Cevdet Bey ve
#    Oğulları / Sessiz Ev; Postmodernizme Geçiş: Beyaz Kale; Postmodern
#    Romanlar: Kara Kitap / Yeni Hayat; Tematik Romanlara Geçiş: Benim Adım
#    Kırmızı; Tematik Romanlar: Kar / Masumiyet Müzesi / Kafamda Bir Tuhaflık /
#    Kırmızı Saçlı Kadın", and names three dönem, three periods, around the two
#    transitional novels (Uluslararası Sosyal Araştırmalar Dergisi 9:46,
#    October 2016, pp. 85-99,
#    https://www.sosyalarastirmalar.com/articles/a-transition-novel-of-orhan-pamuk-in-his-novelist-career-my-name-is-red.pdf).
#    It is the only full periodisation of this career in any source consulted
#    for this file, it is his alone, and the Türk Edebiyatı İsimler Sözlüğü
#    reports it as his rather than adopting it. He has also revised it, in
#    print: "Orhan Pamuk'un üçüncü
#    dönem romanları ise 'küresel romanlar' olarak değerlendirilebilir. Daha
#    önce konuyla ilgili yazdığım birçok makalede yazarın bu dönem eserlerini
#    tematik romanlar olarak görmüş, bu bağlamda tasnif etmiştim" (Hacettepe
#    Üniversitesi Edebiyat Fakültesi Dergisi 42:1, June 2025, pp. 168-181,
#    doi:10.32600/huefd.1486480,
#    https://dergipark.org.tr/tr/download/article-file/3940519). His first
#    period survives that revision unchanged and is corroborated by the sources
#    above, which is why it is the one entry below. His second and third rest
#    on that single reading alone, and its author has since renamed the third.
#  - A "POSTMODERN PERIOD" HAS NO AGREED EDGES, AND NO END AT ALL. Its start is
#    given as Beyaz Kale (1985) by the sources that call that novel the first
#    postmodern narrative, and as [[work:orhan-pamuk/kara-kitap|Kara Kitap]]
#    (1990) by Demir, who reads Beyaz Kale as the transition into it. Its
#    contents are disputed in the same breath: the Türk Edebiyatı İsimler
#    Sözlüğü entry that supplies the 1985 boundary also writes that Pamuk
#    "özellikle Kara Kitap, Yeni Hayat ve Kar gibi romanlarıyla postmodernizmin
#    tekniklerini özümsemiş bir yazar olarak değerlendirilmelidir", counting
#    [[work:orhan-pamuk/kar|Kar]] (2002) among the postmodern novels that Demir
#    places in a later period entirely. And the technique never stops:
#    [[work:orhan-pamuk/veba-geceleri|Veba Geceleri]] (2021) is still told by
#    "the contemporary historian who narrates the book", whose tale "is
#    supposedly constructed, by her great-granddaughter Mîna, from these
#    letters" (James Wood, The New Yorker, 24 October 2022,
#    https://www.newyorker.com/magazine/2022/10/31/outbreaks-and-uprisings-in-orhan-pamuks-nights-of-plague).
#    What begins in 1985 and runs to the present is a manner of writing, not a
#    span with two ends.
#  - THE POLITICAL TURN IS ONE BOOK, ON THE AUTHOR'S OWN ACCOUNT. Pamuk calls
#    Kar "my first and last political novel"
#    (https://www.orhanpamuk.net/biography.aspx; the Gale encyclopedia cited
#    above reports the same self-description), and the shelf after it agrees: [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet
#    Müzesi]] (2008) is a love story, [[work:orhan-pamuk/kafamda-bir-tuhaflik|Kafamda
#    Bir Tuhaflık]] (2014) a street vendor's Istanbul,
#    [[work:orhan-pamuk/kirmizi-sacli-kadin|Kırmızı Saçlı Kadın]] (2016) a
#    conte philosophique on Oedipus and Rostam, Veba Geceleri (2021) an Ottoman
#    historical novel set in 1901. A plate drawn from Kar onward would render
#    over four novels that do not share its subject.
#  - THE NOBEL PRIZE (2006) CUTS NOTHING. It falls between books, four years
#    after Kar and two before Masumiyet Müzesi, and no source dates a change in
#    the work to it. It sits on the author entity's life events instead.
#
# THE STANDARD ENGLISH-LANGUAGE MONOGRAPH DECLINES TO PERIODISE. Erdağ
# Göknar's Orhan Pamuk, Secularism and Blasphemy (Routledge, 2013), described
# by its publisher as "the first critical study of all of Pamuk's novels", is
# built in thematic parts, "Tropes of 'Turkishness' from Islam to State", "The
# Archive of Ottoman Istanbul" and "The Literary Politics of the
# Secular-Sacred", with no dated phase anywhere in its table of contents
# (https://www.routledge.com/Orhan-Pamuk-Secularism-and-Blasphemy-The-Politics-of-the-Turkish-Novel/Goknar/p/book/9780415505383).
# Its second chapter, "The Untranslated Novels of a Nobel Laureate", is
# nevertheless one more grouping of the same two books that the era below
# holds, on a bibliographic basis rather than a critical one.
#
# THE TWO TRANSITIONAL NOVELS SIT OUTSIDE EVERY ERA BECAUSE THAT IS WHERE THE
# SOURCES PUT THEM. Beyaz Kale (1985) and
# [[work:orhan-pamuk/benim-adim-kirmizi|Benim Adım Kırmızı]] (1998) are named
# geçiş works, between periods rather than inside one. The other twenty works
# published from 1985 onward sit outside for the plainer reason that nobody has
# drawn a period around them.

- id: the-family-sagas
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: The Family Sagas
  period: "1982-1983"
  themes: [three generations of one Istanbul family, a century of Turkish history, the Ottoman inheritance, the nineteenth-century novel, the house as the whole world]
  provenance: critical
  description: >
    The two novels Turkish criticism calls Pamuk's first period, and that Pamuk
    calls "family sagas": [[work:orhan-pamuk/cevdet-bey-ve-ogullari|Cevdet Bey
    ve Oğulları]], three generations of an Istanbul merchant family followed
    from the last years of Abdülhamid II into the republic, written in the
    manner of Thomas Mann and the nineteenth-century realists, and
    [[work:orhan-pamuk/sessiz-ev|Sessiz Ev]], the same century of Turkish
    history told again through one week three grandchildren spend at their
    grandmother's house by the sea, now split between five first-person voices
    in the Faulkner and Woolf line. Fethi Demir groups the two as the
    "Klasik/Modern Romanlar" and writes of the second that despite its
    technical distance from the first it is "Pamuk'un ilk dönem eserlerinden
    biri", one of Pamuk's first-period works. The period
    ends where the criticism ends it, at
    [[work:orhan-pamuk/beyaz-kale|Beyaz Kale]] (1985), the novel the Gale
    encyclopedia calls "an important turning point both for the author's career
    and for Turkish novel in general", in which "he broke with the realist
    tradition and attempted something different from his first two novels".
    Pamuk dates his own arrival slightly later still: it was in
    [[work:orhan-pamuk/kara-kitap|Kara Kitap]], begun in 1985, that he "felt I
    found my own voice".
  note: >
    The title is Pamuk's phrase for the two books, not his name for a period:
    he writes "My two first novels, Cevdet Bey and Sons, and Silent House, are
    family sagas" in his Nobel autobiography, describing their form. That the
    two constitute a period, and that Beyaz Kale closes it, is the criticism's
    claim rather than his, which is what `provenance` records here. The span
    holds exactly these two works and nothing else was published in those two
    years.
  sources:
    - "https://www.nobelprize.org/prizes/literature/2006/pamuk/biographical/"
    - "https://www.encyclopedia.com/international/encyclopedias-almanacs-transcripts-and-maps/pamuk-orhan-1952"
    - "https://teis.yesevi.edu.tr/madde-detay/pamuk-orhan"
    - "https://www.sosyalarastirmalar.com/articles/a-transition-novel-of-orhan-pamuk-in-his-novelist-career-my-name-is-red.pdf"
