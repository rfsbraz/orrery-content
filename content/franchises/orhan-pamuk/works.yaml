- id: orhan-pamuk/kelimeler-ve-resimler
  title: "Kelimeler ve Resimler: Seçme Hatıralar, Yazılar ve Bir Hikâye"
  authorIds: [orhan-pamuk]
  published: 2026
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Personal memories and writings on literature and art, gathering pieces
    on his friendships with Ara Güler, Umberto Eco, Paul Auster and Anselm
    Kiefer, family history involving his father Gündüz Pamuk and his aunt,
    the law professor Türkân Rado, and a retrospective account of how the
    novel and the real Museum of Innocence originated and developed,
    alongside previously unpublished photographs and drawings from his own
    archive.
  note: >
    Published 4 June 2026 by Yapı Kredi Yayınları, absent from both English
    and Turkish Wikipedia's per-book articles at the time this was checked,
    but confirmed by Yapı Kredi's own 3 June 2026 press release
    (kitap.ykykultur.com.tr) and its own catalogue listing, cross-checked
    against Turkish Wikipedia's own bibliography table, which lists it at
    ISBN 978-975-08-6815-3. This is not merely a "seçme" (selection) of
    previously-published material: the press release states Pamuk recounts
    his military service and the difficulties of publishing his first book
    "for the first time" in writing composed for this volume, alongside
    archive photographs and drawings never published before, so it is
    catalogued as a genuine work rather than excluded as a reader. The
    subtitle's "bir hikâye" (a story) is not named or excerpted separately
    by any source checked, so it is not split into its own entry; the new
    material stays folded into this one book, which the publisher describes
    as also reworking previously scattered magazine pieces into a single
    coherent whole alongside it.
  sources:
    - https://kitap.ykykultur.com.tr/basin-odasi/basin-bultenleri/orhan-pamuktan-yeni-kitap-kelimeler-ve-resimler
    - https://tr.wikipedia.org/wiki/Orhan_Pamuk
