- id: orhan-pamuk/hatiralarin-masumiyeti
  title: "Hatıraların Masumiyeti"
  authorIds: [orhan-pamuk]
  published: 2016
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Built around the 2015 Grant Gee documentary of the same English name,
    this "film book" pairs the film's screenplay and a transcript of Pamuk
    in conversation with Gee with a new prose piece in which Pamuk revisits
    Kemal and Füsun's love story from
    [[work:orhan-pamuk/masumiyet-muzesi|Masumiyet Müzesi]] through the eyes
    of Ayla, a character introduced here, alongside the film's own images
    and Pamuk's own reflections on the novel, the real Museum of Innocence
    and the film itself.
  note: >
    Published by Yapı Kredi Yayınları in 2016. Has a real English edition,
    "The Innocence of Memories," translated by Ekin Oklap and published in
    London by Faber & Faber - confirmed via the New York Public Library's
    own research catalogue record (dated 2018) and independently via
    Goodreads and Amazon.co.uk listings crediting Oklap as translator. A
    trap for the next reader: Goodreads merges both editions into one work
    record whose displayed "first published" date is the 2016 Turkish
    original, so a search that stops at Goodreads without opening the
    edition list reads as "Turkish only" when an English edition is in fact
    listed underneath it. Distinct from the documentary film "Innocence of
    Memories" itself, which is not a book and is outside this
    bibliography's scope (see the exclusions above).
  sources:
