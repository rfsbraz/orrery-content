# Creative periods. There are none on record.
#
# No critic, scholar, reference work, settled fan consensus or the author
# himself divides this career into named creative periods with recognisable
# names and boundary years, the way "the Golden Age of detective fiction" or
# "the Bachman years" are received. Searched in English, the language he
# writes in and is reviewed in; and in Portuguese, this catalogue's reading
# language, where the question cannot arise at all, because no title has been
# translated into Portuguese - Bertrand carries the whole shelf as
# English-language import stock, "Idioma: Inglês"
# (https://www.bertrand.pt/pesquisa/john%20gwynne).
#
# What the fullest sources actually do:
#
#  - There is no author site to consult. john-gwynne.com is an unrelated
#    casino-affiliate page; his own presence is social media and his
#    publishers' catalogue pages, and none of those periodise.
#  - Wikipedia's "Career" section is three sentences and undivided, running
#    series by series: the 2012 debut, "The novel was followed by Valour
#    (2014), Ruin (2015), and Wrath (2016)", "His next project was the Of
#    Blood and Bone trilogy", "In 2021 he began The Bloodsworn Saga". Its
#    bibliography is grouped by series and by nothing else - which is exactly
#    what this wing's `subseries` field already carries
#    (https://en.wikipedia.org/wiki/John_Gwynne_(author)).
#  - The tier that periodises Stephen King and Agatha Christie does not exist
#    here. No book-length critical study, no reference-work career article,
#    and no obituary, that being the single best periodising document a career
#    produces: he is alive and publishing, with
#    [[work:john-gwynne/the-wolves-of-war|The Wolves of War]] announced for
#    November 2026 and a fourth setting behind it.
#  - The fullest career profile runs the line unbroken and describes the
#    method as invariant. Dan Bavister's February 2025 Palatinate interview
#    traces the whole arc - the late start ("I came to writing really quite
#    late - my 30s"), the 2002 spark, the three series - and reports the
#    working routine as one repeated per book, not a sequence of manners:
#    "Every project starts with research - choosing a historical period, a
#    world mythology"; "I balance planning and improvisation - starting with
#    research and a rough outline, but letting characters and events evolve as
#    I write." Of the current books it says only that they take "a different
#    but equally compelling direction"
#    (https://www.palatinate.org.uk/john-gwynne-the-loss-made-me-more-attuned-to-the-fragility-of-life/).
#  - Fandom has named nothing. r/Fantasy, the largest general forum for this
#    genre and the place that produced the Wheel of Time "slog", discusses
#    Gwynne book by book and series by series across review threads, bingo
#    posts and top-novel polls, with no phase term in circulation and no
#    argument about where one period ends.
#
# Three shapes look like candidate boundaries and fail on the record itself.
#
#  - THE 2021 BREAK IS A WORLD, AND THE WORLD IS ALREADY ON THE PAGE. The
#    author marks the move himself: "the Shadow of the Gods is book 1 of a new
#    series, and my first book in a new world away from the Banished Lands";
#    "I've spent my whole writing career in the Banished Lands, the best part
#    of twenty years since I started writing Malice and constructing the
#    Banished Lands in my head" (Fantasy Hive, 6 May 2021,
#    https://fantasy-hive.co.uk/2021/05/interview-with-john-gwynne-shadow-of-the-gods/).
#    What that names is a setting, and the setting is precisely what
#    `subseries` states: The Faithful and the Fallen and Of Blood and Bone in
#    the Banished Lands, The Bloodsworn Saga in Vigrið, The Wolfheart
#    Chronicles somewhere new again. An era plate over the same span would be
#    the world's own name in a larger font, or a period name of our coining
#    laid over the author's word for it. He hedges the break in the same
#    breath - "I hope that it feels markedly different from my previous books
#    in its tone and world-setting, but there are also similarities. Family
#    and friendship are themes that I will always write about" - and by 2024
#    puts the whole shelf under one continuous method: "I had two rules as I
#    started writing with Malice, and they have stayed with me"; "I have had a
#    mantra through all my books. Epic and intimate"; the next book "will be
#    inspired by mythology and history, as all my books are" (Fantasy Hive, 22
#    October 2024,
#    https://fantasy-hive.co.uk/2024/10/interview-with-john-gwynne-the-fury-of-the-gods/).
#    On craft he says the same: "I've always approached writing combat in the
#    same way" (Grimdark Magazine, 18 May 2021,
#    https://www.grimdarkmagazine.com/an-interview-with-john-gwynne-2/).
#  - THE PUBLISHER DID NOT CHANGE, THE TERRITORY DID. The tempting
#    publishing-historical fact is a 2021 move from Tor UK / Pan Macmillan to
#    Orbit, and it is only half true. Orbit has published him in the United
#    States from the first book: [[work:john-gwynne/malice|Malice]] carries a
#    2012 Tor UK edition, a Pan Macmillan edition and a 2013 Orbit edition,
#    and Orbit editions run unbroken through
#    [[work:john-gwynne/a-time-of-courage|A Time of Courage]] (2020) into the
#    Bloodsworn books (https://openlibrary.org/works/OL19347291W,
#    https://openlibrary.org/works/OL24243445W). What changed in 2021 is the
#    UK imprint alone. "The Orbit years" would be false of the nine books it
#    excluded; "the Tor UK years" would render a one-market fact full-bleed
#    over a catalogue that reads him in neither market.
#  - THE SILENCE OF 2021-2023 IS A LIFE, NOT A PERIOD. It is the one boundary
#    in this career that can be dated and named, and it is not one to draw.
#    Gwynne finished [[work:john-gwynne/the-hunger-of-the-gods|The Hunger of
#    the Gods]] in April 2021, his daughter Harriett died that September, and
#    he wrote nothing until the end of 2023 (Fantasy Hive, October 2024,
#    above). No source periodises the work around it; one published novel
#    stands on its far side; and the change he describes is to himself - "the
#    loss made me more attuned to the fragility of life... I try to reflect
#    that in my characters" (Palatinate, above) - not to a body of work anyone
#    has since grouped. The bereavement belongs to the author's life record,
#    where it is sourced and dated. It is not a plate to walk a reader through.
#
# One near-miss is recorded so it is not mistaken for a periodisation later.
# Reviewing [[work:john-gwynne/the-shadow-of-the-gods|The Shadow of the Gods]],
# Nils Shukla wrote that "the characters you will find in this book are a far
# cry from the heroes of Gwynne's previous works. There are no heroes here"
# (Fantasy Hive, 3 March 2021,
# https://fantasy-hive.co.uk/2021/03/the-shadow-of-the-gods-by-john-gwynne-book-review/).
# That is one reviewer, on one book, at the same site whose interviews are
# cited above - an observation about a novel, naming no period and picked up
# by no one else.
#
# eras: [] is the honest record of a fourteen-year career, still running, that
# three named series already divide and that nobody - its author included -
# has divided any other way.
[]
