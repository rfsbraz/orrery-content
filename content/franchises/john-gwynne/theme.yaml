# Branding for the John Gwynne wing (see Orrery CONCEPT §6 - the design law).
# The three series are held together by two motifs that recur across all of
# them, not just the Norse-flavored Bloodsworn Saga: oaths sworn in blood
# (the Bloodsworn company itself, the sword-brotherhoods of the Banished
# Lands) and a holy war fought between literal beings of faith - fallen
# angels and their opposites in the Banished Lands, dead-and-returning gods
# in Vigrid. "shieldwall-liturgy" names both halves: the warband/shieldwall
# culture common to all three series, and the scriptural framing (Faithful
# and the Fallen, the God-War, gods raised or slain) that gives the violence
# its stakes. No horned helmets, no rune-carved borders, no fantasy-poster
# costume - a restrained, cold, iron-and-parchment palette instead.
preset: shieldwall-liturgy
palette:
  bg: "#101012"       # near-black cold iron-grey, not the indigo/blue-black
                       # already used by the catalogue's other epic-fantasy
                       # wings (Wheel of Time, Cosmere)
  surface: "#1a1a1d"  # a hair lifted, for cards
  ink: "#e8e3d8"       # warm bone/parchment - high contrast, very readable
  muted: "#8c8a86"    # ash grey, for metadata
  accent: "#7a2420"   # a single restrained oxblood red - blood oaths, the
                       # God-War, Ragnarok; used sparingly, never as a wash
displayFace: sourceSerif # the plainest of the curated serifs - grim, workmanlike
                          # prose (Publishers Weekly's own word for it), not a
                          # showy display face; also keeps this wing distinct
                          # from the two closest neighbours in genre, which
                          # both use spectral (Wheel of Time, Cosmere)
signature: beam # a bold, straight accent rail the works string along - read
                 # as a blade edge or a spear-shaft, not a decorative flourish

# This wing shares its `beam` signature with jrr-tolkien - both are
# multi-series, single-author epic-fantasy wings using the same "one bold
# rail" logic for a large through-line body of work - and sits inside the
# wider genre-and-shelf cluster theme_digest.py groups with
# brandon-sanderson and robert-jordan. None of the three share this wing's
# accent (oxblood #7a2420 against their common gold #c8a24a) or its
# near-black cold-grey ground, but signature and genre alone would still
# read as one more armoured-epic wing without a distinct hand. What
# actually separates Gwynne's bibliography, read whole in works.yaml and
# the author bio, is that the author is himself an active Viking
# re-enactor who drills shieldwall combat alongside his own three sons and
# has said the practice directly shapes how he writes fighting and
# equipment - a physical, present-tense rehearsal behind the fiction, not a
# researched costume. So this wing's line is cut rather than corrected:
# where Tolkien's line takes a second, revising pass laid back over the
# first (a scholar annotating his own draft), Gwynne's lands once, the way
# a training blow lands and is not taken back. Where Jordan draws thread
# and Sanderson draws a ruled instrument, Gwynne draws a scored edge - gear
# worn and nicked by repeated real use, not built or woven. The emblem
# below is drawn from that same fact (the author's own practice gear, hung
# up after a drill), never from a book's cover, an in-world banner, or
# either setting's own faith-iconography (the Ben-Elim's wings, the
# Kadoshim's horns, Vigrid's gods) - the shieldwall and the blood oath
# already carry this wing above any one pantheon, which is also what lets
# one visual law honestly cover the Banished Lands, Vigrid and (once
# published) the Wolfheart Chronicles' Clans alike, rather than costuming
# whichever setting is being drawn that day.
art:
  emblem:
    object: >
      A round, iron-bossed practice shield hung on a peg after a drill,
      its face scored and dented by real, overlapping blows struck in
      training - resting flat against a wall, never held up, raised or
      mid-swing.
    why: >
      Gwynne is an active Viking re-enactor who drills shieldwall combat
      alongside his own three sons and has said the practice directly
      shapes how he writes fighting and equipment in every setting he has
      built (his own account, in the bio) - a real, present-tense
      rehearsal behind the sword-brotherhoods of the Banished Lands and
      the Bloodsworn company alike. Hung up rather than raised: the
      object is his own drilled gear, marked by practice, never a trophy
      claimed from a battle this wing is not allowed to show the end of.
  motifs:
    - a drinking horn or shared cup passed hand to hand at an
      oath-swearing, worn smooth at the rim - the blood oath the
      Bloodsworn company is named for and the sword-brotherhoods of the
      Banished Lands both swear
    - a bare rock face or outcrop stained dark at its foot, as though
      wept on - the omen the whole shelf opens on ("the stones weep
      red"), kept a natural stain rather than a carved or ancient
      monument
    - a shovel laid beside a sack or basket of dug bone fragments, dark
      tundra soil still clinging to them - the Bloodsworn Saga's own
      premise, gods' bones dug from frozen ground for the power they
      still hold
    - a trapper's kit laid out in snow - a skinning knife, a stretched
      hide, a set snare - the snowbound north a hunter's son works
      through in Of Blood and Bone
    - a manacle chain or a pit-fighting arena's rope-and-post fence,
      half-buried in packed sand - the brutal pit-fights Valour puts one
      of its own through
    - a parent's hand steadying a child's shoulder, or a cloak drawn
      round them, in the last quiet moment before a march or a watch -
      the intimate half of Gwynne's own account of his method, present at
      both ends of the shelf he has published (he began Malice telling
      his own children bedtime stories while caring for his disabled
      daughter; The Wolves of War opens on a father whose only concern is
      protecting his)
    - a handful of small bone or wood lots cast for a reading, unmarked
      and unreadable to us - the omen-reading Malice opens the shelf on
      ("those who can still read the signs"), recurring in every setting
      without borrowing any one setting's own script or iconography
  atmosphere: >
    Cold, plain and unglamorous - the calm of gear laid out before a
    duty, never the wonder or dread of magic on display. Grey coastal
    daylight over the Banished Lands, snow-glare over Vigrid's fjords and
    tundra, a hard low sun through the Wolfheart Clans' forests - weather
    more often than firelight, and never gilded or gothic-lit. Interiors
    are a training yard, a trapper's camp, a company's hall the morning
    after, not a throne room or a cathedral. War shows in what it leaves
    on an object - scored wood, a stained stone, mended leather - rather
    than in the moment of a blow landing or a war ending: this wing draws
    the mark a fight leaves behind, never who wins it.
  lineCharacter: >
    A blunt, single-pass cut rather than a drawn line: marks look struck
    into the surface with one bevelled tool, the way a blade repeatedly
    nicks the same haft, not built up in hatching or corrected after the
    fact. Pressure stays even and heavy with no tapered flourish at a
    stroke's end - a workmanlike hand, matching what Publishers Weekly
    calls this prose, not a calligrapher's. Never a second pass laid back
    over the first the way jrr-tolkien's revising hand works, never
    robert-jordan's flowing interlace or brandon-sanderson's ruled
    diagrammatic edge: one committed cut, once, the way a training blow
    lands and does not take itself back.
  backgroundTexture: >
    Coarse, oil-dark leather or scraped hide stock, its grain visible and
    slightly stiff at a cured edge rather than a milled one - the
    material of a warband's own practice gear, not a scribe's laid paper,
    a loom's woven cloth, or a draughtsman's blueprint vellum.
  accentUse: >
    Oxblood red on exactly one element per image, never a fill or a
    wash: a single fresh nick in scored wood, one strand of cord binding
    an oath-cup's handle, or the one dark stain at the foot of a wept
    stone - never a wound, a blade in the act of striking, or blood
    drawn as spectacle.
  avoid:
    - any imagery that scores an ending this wing is not allowed to show
      - a victor's citadel over a beaten horde, anyone left standing
      after Drassil's fall or either Banished Lands finale, a dragon
      loose over Vigrid (Shadow of the Gods' own climax, not its premise)
    - the Ben-Elim's wings, the Kadoshim's horns, or any other single
      setting's own faith-iconography rendered literally - the shieldwall
      and the blood oath carry this wing above any one pantheon on
      purpose, the same restraint due to the Wolfheart Chronicles' own
      mythology once it publishes
    - horned helmets, rune-carved borders, or fantasy-poster Viking
      costume - real re-enactment kit is plain, worn and functional, not
      ornamental
    - crowns, thrones, a sword raised mid-blow, and other generic
      epic-fantasy poster trims
    - a flowing woven or braided curve (robert-jordan's territory), a
      ruled diagrammatic or orthographic instrument line
      (brandon-sanderson's territory), or a second corrective pass laid
      back over the first stroke (jrr-tolkien's territory)
    - oxblood red used as a wash, a wound, or blood spray rather than one
      exact accent mark
    - a shield drawn raised skyward, held aloft, or composed as a ring or
      halo - shields here are always resting, propped or hung, never
      posed to echo the shared orrery rings
notes: >
  A cold, iron-and-parchment edition rather than a fantasy poster: near-black
  ground, warm bone type, one oxblood accent used exactly once per surface -
  a single pulled thread of the blood-oath imagery that runs under all three
  series, never a fill or a glow. Nothing horned, runed, or heraldic; the
  restraint is the point.
