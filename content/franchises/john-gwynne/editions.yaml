# Editions for John Gwynne's complete bibliography: 17/17 works carry at
# least one edition, 19 entries total. Ten published novels plus the
# forthcoming The Wolves of War each carry their first UK (or, where UK and
# US launched in the same week, first English) edition, sourced to ISFDB's
# own per-title publication listings (isfdb.org/cgi-bin/title.cgi), each
# opened individually and cross-read against the ISBN's registrant prefix.
# All six anthology contributions carry a real edition of the anthology
# itself, also ISFDB-sourced. Every isbn13 below has been independently
# summed against the EAN-13 check-digit formula and matches its own last
# digit.
#
# PORTUGUESE MARKET: swept via wook.pt (archived copies, wook.pt itself
# blocks automated fetches) for every capture ever made of a "gwynne" URL.
# Exactly one hit: Edições Asa's "A Sombra dos Deuses", the Portuguese
# translation of The Shadow of the Gods (Bloodsworn Saga book 1), published
# July 2022 in both paperback and ebook. Nothing else - no Banished Lands
# novel, no Hunger/Fury of the Gods, no anthology piece - has ever been
# captured on the same domain. A dated (2025) reader review on that same
# product page says outright that they are still hoping the next volumes
# aren't long in coming, direct testimony that no sequel had reached
# Portuguese as of three years after the run opened. Coverage is therefore
# 1 of 10 published novels, and that is the honest fraction, not a research
# gap: Asa started the Bloodsworn Saga and has not (yet) continued it.
#
# ENGLISH PUBLISHING HISTORY: Gwynne's UK publisher changed twice.
# Malice-Wrath (The Faithful and the Fallen) carry the Tor UK imprint of Pan
# Macmillan. Of Blood and Bone (A Time of Dread/Blood/Courage) drops the Tor
# imprint for plain Macmillan UK, per ISFDB's own publication records - the
# same parent company, a different imprint name on the jacket. The Bloodsworn
# Saga and The Wolves of War move to Orbit (Little, Brown Book Group/Hachette
# UK) entirely. None of this is a UK/US lag of the kind that separates Jo
# Nesbo's Norwegian and English publication years - UK and US editions of
# every Gwynne novel from Malice onward release within days of each other,
# noted per-book below only where ISFDB's own dates make the gap checkable.

