# Bibliography (Works) - the abstract books; editions/covers are separate metadata.
# IDs are STABLE and permanent (user data references them). Dates are year-precision
# unless a source states a full date. The default reading order (all works in
# publication order) is DERIVED from this file - so a missing work is a gap
# in the spine.
#
# Coverage: John Gwynne's complete published bibliography as listed by ISFDB
# (https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne) - ten published novels
# across three series, one further announced novel opening a fourth series,
# plus six short-fiction contributions to multi-author anthologies. Excluded
# as not independent works: "Malice (excerpt)" and "The Shadow of the Gods
# (excerpt)", both ISFDB title records for promotional samples of the novels
# themselves, not separate content. Also excluded: the two omnibus editions
# ISFDB records (The Faithful and the Fallen omnibus; The Bloodsworn Saga
# omnibus, 2025) - these repackage works already catalogued individually and
# are edition data, not separate works.
#
# THE WOLVES OF WAR (2026): announced after ISFDB's own bibliography page was
# last updated, so it carries no ISFDB record yet. Sourced instead to its
# Amazon UK product listing (full jacket copy, ISBN, publisher and page
# count), corroborated independently by Publishers Weekly's book database
# (title/author/ISBN registered) and by Open Library's edition record for the
# same ISBN. Orbit, 3 November 2026, opening a new series (The Wolfheart
# Chronicles) in a fourth setting inspired by Slavic rather than Norse or
# invented mythology - a clean break from both the Banished Lands and Vigrid.
#
# SERIES STRUCTURE: The Faithful and the Fallen (4 books) and Of Blood and
# Bone (3 books) share one continuous setting, the Banished Lands - confirmed in
# Gwynne's own words ("My second series, Of Blood and Bone, is set in the
# Banished Lands, the same world as the first series. Book 1, A Time of
# Dread, begins 130 years after the events of the first series," Goodreads
# author bio) and independently corroborated by Publishers Weekly's review of
# A Time of Dread, which identifies the character Sig as "a bear-riding giant
# familiar from Gwynne's The Faithful and the Fallen series." ISFDB models
# this the same way: both are subseries under one parent "The Faithful and
# the Fallen universe" listing. The Bloodsworn Saga (3 books, begun 2021) is
# a genuinely separate setting - Wikipedia states it plainly ("a separate
# setting drawing on Norse mythology, Beowulf, and the Viking period") and
# nothing in the Banished Lands novels or their reviews connects the two
# worlds. Modelled as three subseries strings rather than two (Faithful and
# the Fallen / Of Blood and Bone) plus one, the same pattern this catalogue
# already uses for one world spanning multiple eras (see brandon-sanderson's
# "Mistborn: Era 1" / "Mistborn: Era 2"). The Wolfheart Chronicles, opened by
# the announced The Wolves of War (2026), is a fourth setting again separate
# from all three.
#
# CANON TIER: all eleven novels (ten published, one announced) are core -
# this is the entire spine of a living author with no juvenilia, ghost-written
# work, or discarded early drafts on record. The six anthology contributions
# are apocrypha per authorRole: contributor (SCHEMA.md's own worked example):
# real, completionist-relevant, but not John Gwynne's own book.

# --- The Faithful and the Fallen (Banished Lands) ---
- id: john-gwynne/malice
  title: "Malice"
  authorIds: [john-gwynne]
  published: 2012
  subseries: "The Faithful and the Fallen"
  canonTier: core
  featured: true
  synopsis: >
    The world is broken and can never be made whole again. In the Banished
    Lands, a loosely allied collection of kingdoms with a violent past of
    men and giants at war, Corban wants nothing more than to be a warrior
    under King Brenin's rule; Veradis, newest man in the warband of the
    High Prince Nathair and one of the finest swordsmen of his homeland,
    lives in his older brother's shadow while Nathair makes plans his
    father the High King knows nothing of; and Evnis has already sacrificed
    too much for the power he means to hold. Now the stones weep red, giant
    wyrms stir, and those who can still read the signs see a danger far
    worse than anything that has come before.
  note: >
    Debut novel; won the David Gemmell Morningstar Award for Best Fantasy
    Debut in 2013. Marked featured as the hinge the rest of the shelf is read
    from: the world (the Banished Lands), the central prophecy, and the
    tetralogy's title all originate here.

    The seven treasures, the Kadoshim and the true nature of Nathair's
    counsellor are absent from Malice's own jacket copy on both sides of the
    Atlantic; they enter the publisher's copy from Ruin onward, and the
    synopsis above holds to what Malice itself is sold on.
  images:
    cover: "https://covers.openlibrary.org/b/id/8458717-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL19347291W"
    # The Pan (Tor UK imprint) hardback, 6 Dec 2012, ISBN 9780230767270 - a
    # single sword icon on an icy-white ground over a marching army
    # silhouette, the same house design language Tor/Orbit UK carried
    # across all four Faithful and the Fallen jackets (see Valour, Ruin,
    # Wrath below), each book's own weapon and accent colour. This work's
    # own OL record and the OL search API both surface it as representative.
    # A separate 2013 US Orbit paperback (ISBN 9780316399739, cover id
    # 11574415) exists at a lower resolution and is not used.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.publishersweekly.com/9780316399739"
    - "https://en.wikipedia.org/wiki/John_Gwynne_(author)"

- id: john-gwynne/valour
  title: "Valour"
  authorIds: [john-gwynne]
  published: 2014
  subseries: "The Faithful and the Fallen"
  canonTier: core
  synopsis: >
    War erupts in the Banished Lands as the race for power intensifies.
    Corban flees his homeland searching for peace and finds no haven in the
    west, hounded at every step by Queen Rhin's agents and by roaming bands
    of giants; Veradis leaves the battleground and rushes to his king's
    side, his duty weighing heavily on him; Maquin seeks only revenge, with
    pirate slavers and the brutal world of the pit-fights in his way; and
    Nathair is drawn into the wars of the west as Rhin marches against King
    Owain.
  note: >
    Published 2014, per both ISFDB and Wikipedia's bibliography section - not
    2013, the year sometimes quoted for it.

    Valour is sold on two different jackets. Pan Macmillan's says
    considerably more about how Malice ends than Malice's own copy does,
    including naming outright what Malice spends its length arriving at.
    The synopsis above follows Orbit's copy instead, which covers the same
    four threads and states none of it.
  images:
    cover: "https://covers.openlibrary.org/b/id/8404705-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL19088187W"
    # Tor, 11 Sep 2014, ISBN 9780330545761 - an axe icon on the same
    # icy-white ground as Malice, Ruin and Wrath. This work has two other OL
    # records under variant capitalisations ("Valor" with no cover, "valour"
    # lower-cased with a duplicate of this same image) - the one used here
    # is titled exactly "Valour", matching this file's own title field.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://en.wikipedia.org/wiki/John_Gwynne_(author)"
    - "https://www.fantasybookreview.co.uk/John-Gwynne/Valour.html"

- id: john-gwynne/ruin
  title: "Ruin"
  authorIds: [john-gwynne]
  published: 2015
  subseries: "The Faithful and the Fallen"
  canonTier: core
  synopsis: >
    The God-War stops being a looming prophecy and becomes real: the
    factions of the Banished Lands, gathered around Corban, Maquin and a
    widening cast on both sides of the widening conflict, are pulled into
    open sieges and set-piece battles as the alliances that will fight the
    final war take shape.
  note: >
    Published 2015, per both ISFDB and Wikipedia's bibliography section - not
    2014, the year sometimes quoted for it.

    Ruin's own jacket copy is unusually forthcoming about how Valour ends -
    who holds what, and which of the two men at the centre of the previous
    book has learned what about the other. None of that is carried into the
    synopsis above, which stays with the shape of the war.
  images:
    cover: "https://covers.openlibrary.org/b/id/13773681-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL34948197W"
    # Tor, 2015, ISBN 9781447259626 - a spear icon on the same icy-white
    # ground as Malice, Valour and Wrath. A second OL work record for "Ruin"
    # (OL21119971W) carries no cover and is not used.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://en.wikipedia.org/wiki/John_Gwynne_(author)"
    - "https://www.fantasybookreview.co.uk/John-Gwynne/Ruin.html"

- id: john-gwynne/wrath
  title: "Wrath"
  authorIds: [john-gwynne]
  published: 2016
  subseries: "The Faithful and the Fallen"
  canonTier: core
  featured: true
  synopsis: >
    The tetralogy's melee-laden climax. Events come to a head as the war
    reaches new heights: King Nathair holds the fortress of Drassil and
    three of the seven treasures, and with Calidus and his ally Queen Rhin
    behind him he will do anything to take the rest - all seven under one
    command would open a portal through which Asroth and his demon-horde
    could break into the Banished Lands and become flesh. Corban, his
    warband scattered, has been taken prisoner by the Jotun, warrior giants
    who ride enormous bears into battle, and if he is to counter Nathair at
    all he must make allies of competing factions of giants who have no
    reason to give him any. His life hangs in the balance, and with it the
    fate of the Banished Lands.
  note: >
    Won Best Traditionally Published Novel at the 2017 BookNest Awards.
    Marked featured as the tetralogy's ending, the other hinge alongside
    Malice's beginning.

    Wrath's own jacket copy ends on the balance and names no outcome; the
    synopsis above stops in the same place, and states nothing about who is
    standing at the end or how the God-War is settled. Where Veradis and
    Alcyon stand by this point belongs to Ruin's ending and is left out for
    the same reason.
  images:
    cover: "https://covers.openlibrary.org/b/id/8737621-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL19913259W"
    # Orbit, 6 Dec 2016, ISBN 9780316386333 - a warhammer icon closing out
    # the same icy-white house design as Malice, Valour and Ruin. A sibling
    # OL work record (OL19913258W, "Wrath (The Faithful and the Fallen)")
    # carries the identical image at a different cover id.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.publishersweekly.com/9780316386340"
    - "https://en.wikipedia.org/wiki/John_Gwynne_(author)"

# --- Of Blood and Bone (Banished Lands, 130 years later) ---
- id: john-gwynne/a-time-of-dread
  title: "A Time of Dread"
  authorIds: [john-gwynne]
  published: 2018
  subseries: "Of Blood and Bone"
  canonTier: core
  synopsis: >
    A century and a third after the God-War, the Banished Lands are held to
    a peace that is brutally enforced. In the south the hotheaded Riv wants
    nothing more than to be admitted to the winged Ben-Elim's peacekeeping
    force, and unearths a deadly secret instead; in the west the giantess
    Sig investigates demon sightings and turns up signs of an uprising and
    of black magic; in the snowbound north Drem, a trapper's son, finds
    mutilated corpses in the forests, the work of a predator or of
    something far darker; and the hostage prince Bleda is kept at the
    Ben-Elim's court. It is a time of shifting loyalties, and in the
    shadows something is gathering.
  note: >
    Reviewed by Publishers Weekly as set in the same world as The Faithful
    and the Fallen, explicitly naming Sig as "a bear-riding giant familiar
    from Gwynne's The Faithful and the Fallen series" - the strongest
    external corroboration found for the shared-Banished-Lands ruling on
    this wing's subseries structure.

    The book's own jacket copy opens by summarising how the God-War ended.
    That is precisely the question Wrath's jacket leaves standing, so the
    opening line is deliberately not carried into the synopsis above, which
    describes the world Of Blood and Bone starts in without scoring the war
    that produced it. Sig is named because A Time of Dread's own copy names
    her; nothing here says where else she has been.
  images:
    cover: "https://covers.openlibrary.org/b/id/8519260-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL19550170W"
    # Orbit, 20 Feb 2018, ISBN 9780316502238 - opens Of Blood and Bone's own
    # house design: a weapon engulfed in flame over an army silhouette,
    # carried through A Time of Blood and A Time of Courage below (each
    # book's own weapon: a sword hilt here).
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.publishersweekly.com/9780316502245"
    - "https://www.goodreads.com/author/show/5898355.John_Gwynne"

- id: john-gwynne/a-time-of-blood
  title: "A Time of Blood"
  authorIds: [john-gwynne]
  published: 2019
  subseries: "Of Blood and Bone"
  canonTier: core
  synopsis: >
    The middle Of Blood and Bone novel: the conflict between the Ben-Elim,
    the Kadoshim and the human factions of the Banished Lands widens.
    Fritha, the demons' deadly high priestess, hunts Drem and his friends
    through the north; the demonic forces multiply and send a host against
    the angels' stronghold; and Drem grows into the fight's emotional
    center.
  note: >
    Its own jacket copy opens on what the characters carry out of the
    previous volume's closing battle, and states plainly the thing A Time
    of Dread's jacket keeps back as "a deadly secret". Neither is carried
    into the synopsis above.
  images:
    cover: "https://covers.openlibrary.org/b/id/8804513-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL20159286W"
    # Orbit, 16 Apr 2019, ISBN 9780316502276 - a dagger wreathed in red
    # smoke over the army silhouette, continuing A Time of Dread's design.
    # Macmillan and Pan export editions of the same year (ISBNs
    # 9781509812981, 9781509812974) carry their own OL cover records,
    # not inspected here; this Orbit UK edition is used for consistency
    # with A Time of Dread and A Time of Courage.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.fantasybookreview.co.uk/John-Gwynne/A-Time-of-Blood.html"

- id: john-gwynne/a-time-of-courage
  title: "A Time of Courage"
  authorIds: [john-gwynne]
  published: 2020
  subseries: "Of Blood and Bone"
  canonTier: core
  synopsis: >
    The trilogy's finale, and the last book set in the Banished Lands:
    heroes rise and fall, the earth is stained red, and the fate of the
    Banished Lands is decided once and for all as Riv, Drem and the Order
    of the Bright Star converge on the final reckoning.
  note: >
    Made the Spiegel bestseller list in Germany per Gwynne's own author bio.

    Its own jacket copy opens on the state A Time of Blood leaves the war
    in, and resolves the secret A Time of Dread's jacket sets up; the
    synopsis above keeps to the finale's own framing and states neither.
  images:
    cover: "https://covers.openlibrary.org/b/id/10188972-L.jpg"
