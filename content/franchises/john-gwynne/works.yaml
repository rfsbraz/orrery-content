# --- The Wolfheart Chronicles (a fourth, Slavic-mythology-inspired setting) ---
- id: john-gwynne/the-wolves-of-war
  title: "The Wolves of War"
  authorIds: [john-gwynne]
  published: 2026
  forthcoming: 2026-11-03
  subseries: "The Wolfheart Chronicles"
  canonTier: core
  synopsis: >
    The Clans once lived free, honouring their own gods and traditions, until
    northern invaders broke them with blood and fire. A father's only
    concern is protecting his daughter Halia, who has been trapped in her
    own body since birth yet dreams at night of running with wolves and
    speaking to the fae creatures of the forest - powers many call a curse
    but that may be the only way her family survives what is coming, as two
    princes turned mortal enemies and an iron-toothed witch drag whole
    nations toward war.
  note: >
    Opens a new series in a setting drawing on Slavic rather than Norse
    mythology - a clean break from both the Banished Lands and the Bloodsworn
    Saga's Vigrid, the same pattern by which Gwynne opened Vigrid as a break
    from the Banished Lands in 2021.
  # No cover: a real UK jacket for ISBN 9780356527871 is already live on
  # Amazon's product page, but a retailer's own jacket file carries no
  # statable licence. Open Library carries no edition record for this ISBN
  # yet (isbn/9780356527871 404s, and the OL work record - itself split
  # across a different author-id duplicate, OL45398326W - has no cover
  # field). orbit-books.co.uk's own product pages serve a stale, unrelated
  # stock cover on other backlist titles on the same site, so its og:image
  # is not a reliable source either. Revisit once Open Library or Commons
  # carries a real edition.
  sources:
    - "https://www.amazon.co.uk/dp/0356527875"
    - "https://www.publishersweekly.com/9780356527871"
    - "https://openlibrary.org/isbn/9780356527871"

