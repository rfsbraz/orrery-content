  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.fantasybookreview.co.uk/John-Gwynne/A-Time-of-Courage.html"
    - "https://www.goodreads.com/author/show/5898355.John_Gwynne"

# --- The Bloodsworn Saga (a separate, Norse-inspired setting) ---
- id: john-gwynne/the-shadow-of-the-gods
  title: "The Shadow of the Gods"
  authorIds: [john-gwynne]
  published: 2021
  subseries: "The Bloodsworn Saga"
  canonTier: core
  featured: true
  synopsis: >
    A century has passed since the gods of this world fought and drove
    themselves to extinction. Only their bones remain, promising great
    power to whoever is brave enough to dig them out, and the monsters they
    left behind still roam a Norse-flavored land of fjords and tundra. As
    whispers of war echo across Vigrid, fate follows three warriors: Orka,
    a huntress on a dangerous quest; Elvar, a noblewoman pursuing battle
    fame; and Varg, a thrall seeking vengeance among the mercenary company
    known as the Bloodsworn.
  note: >
    Opens a setting Wikipedia describes as separate from the Banished Lands,
    drawing on Norse mythology, Beowulf and the Viking period; Gwynne is
    himself a Viking re-enactor. Marked featured as the start of the wing's
    third, unconnected world.

    Orbit's jacket copy, UK and US alike, dates the gods' fall at a century
    and introduces the three leads by role alone - huntress, noblewoman,
    thrall - without naming what each of them loses or what they are really
    walking into. Both are followed above. What the stolen children are
    wanted for is a late reveal and is not stated here. (An earlier
    three-hundred-year dating for the gods' fall circulates in reader
    summaries; the publisher's own copy says a century, and that is what is
    used.)
  images:
    cover: "https://covers.openlibrary.org/b/id/12380838-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL24243445W"
    # Little, Brown Book Group (Orbit UK), 2021, ISBN 9780356514208 - a
    # dragon's head over a lone figure on ice, opening the Bloodsworn
    # Saga's own house design (each book its own creature). Rejected: a
    # "cover to be revealed" placeholder still on file for a 2021
    # Blackstone/Hachette audio edition (cover id 10722712), and a 25 Nov
    # 2025 Orbit UK "Deluxe Limited Hardcover" (ISBN 9780356528571) whose OL
    # cover is a sprayed-edge boxed-set product photo, not a plain jacket.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.publishersweekly.com/9780316539883"
    - "https://en.wikipedia.org/wiki/John_Gwynne_(author)"

- id: john-gwynne/the-hunger-of-the-gods
  title: "The Hunger of the Gods"
  authorIds: [john-gwynne]
  published: 2022
  subseries: "The Bloodsworn Saga"
  canonTier: core
  synopsis: >
    The dead gods are rising, and a new age of blood and conquest opens
    over the divided realms of Vigrid. Orka continues the hunt for her
    missing son; the Bloodsworn sweep south in a desperate race to save one
    of their own while Varg takes the first steps on the path of vengeance;
    and Elvar, sworn to a blood oath, must first talk the Battle-Grim into
    following her. Against the dragon-god Lik-Rifa and her dragon-born
    followers neither company can stand alone, and their only hope may lie
    in the mad writings of a chained god - a book of forbidden magic with
    the power to raise the wolf god Ulfrir from the dead.
  note: >
    The jacket copy leads on how The Shadow of the Gods ends. The synopsis
    above takes the situation the second book opens in without the event
    that produced it. Ulfrir is named because this book's own copy names
    him, and as a possibility rather than as something that happens.
  images:
    cover: "https://covers.openlibrary.org/b/id/12817685-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL25922920W"
    # A wolf's head over a mountainside camp, continuing the Bloodsworn
    # Saga's creature-per-book design. This is the work's own OL cover
    # (attached at the work level, not tied to one listed edition); the
    # 2022 Orbit US paperback (ISBN 9780316539920, cover id 13131615) is
    # the same art and a fine edition-linked alternative if one is needed.
    # Rejected: a 25 Nov 2025 Orbit UK "Deluxe Limited Hardcover" (ISBN
    # 9780356528588) whose OL cover is a boxed-set product photo.
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
    - "https://www.publishersweekly.com/9780316539920"

- id: john-gwynne/the-fury-of-the-gods
  title: "The Fury of the Gods"
  authorIds: [john-gwynne]
  published: 2024
  subseries: "The Bloodsworn Saga"
  canonTier: core
  synopsis: >
    The Bloodsworn trilogy's concluding volume: the final battle for the
    fate of Vigrid approaches. Varg and the Bloodsworn face their biggest
    challenge yet, slaying a dragon; Elvar faces threats from without and
    within as she readies herself for the coming conflict; Biorr and his
    warband make their way north eager for blood while Gudvarr pursues a
    mission of his own, hoping to win the dragon-god Lik-Rifa's favour and
    further his ambitions. All paths lead to Snakavik and a titanic clash
    that will shake the foundations of the world.
  note: >
    Reached number five on the New York Times Trade Fiction Paperback
    bestseller list in November 2024 and was named the second-best fantasy
    book of 2024 by ScreenRant.

    Its own jacket copy states where The Hunger of the Gods leaves Varg and
