# A wing spans an author's complete published work. John Gwynne's shelf is
# ten published novels across three series, one further announced novel
# opening a fourth, plus six anthology contributions (see works.yaml's header
# for the full sourcing and the series-structure ruling): The Faithful and
# the Fallen and Of Blood and Bone share one continuous setting, the Banished
# Lands, 130 years apart; The Bloodsworn Saga is a separate, Norse-inspired
# setting; The Wolfheart Chronicles, opening with the announced The Wolves of
# War (2026), is a fourth, Slavic-mythology-inspired setting. All four are
# modelled as `subseries` inside this one wing, never as separate franchises.
id: john-gwynne
name: John Gwynne
kind: author
description: >
  The complete published work of John Gwynne: the Banished Lands, a world of
  prophesied holy war between the faithful and the fallen, spanning the
  [[work:john-gwynne/malice|Faithful and the Fallen]] tetralogy and its
  direct sequel trilogy, [[work:john-gwynne/a-time-of-dread|Of Blood and
  Bone]], set 130 years later in the same world; and
  [[work:john-gwynne/the-shadow-of-the-gods|The Bloodsworn Saga]], a
  separate, Norse-inspired setting of fallen gods and blood oaths begun in
  2021. Alongside the ten novels, six short stories contributed to
  multi-author anthologies round out the shelf, along with
  [[work:john-gwynne/the-wolves-of-war|The Wolves of War]] (2026), the
  announced opening volume of a new series, The Wolfheart Chronicles, in a
  Slavic-mythology-inspired setting.
authorIds: [john-gwynne]
themePreset: shieldwall-liturgy
sources:
  - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Gwynne"
  - "https://en.wikipedia.org/wiki/John_Gwynne_(author)"
  - "https://www.goodreads.com/author/show/5898355.John_Gwynne"
