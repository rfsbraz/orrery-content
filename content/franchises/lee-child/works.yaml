# The complete published fiction and nonfiction of Lee Child (pen name of
# James Dover Grant), spine and periphery both. The Jack Reacher novels are
# the wing's spine and share subseries: "Jack Reacher" - a deliberate label
# even though the wing has no second series, so that it reads apart from the
# short-fiction and nonfiction entries below it. Every novel from
# lee-child/the-sentinel (2020, the twenty-fifth) onward carries
# withAuthorIds: [andrew-child] and authorRole: co-author: Andrew Grant, Lee
# Child's younger brother, co-writes the series under his own new pen name,
# Andrew Child, and no solo Andrew Child Reacher novel has yet been published.
#
# Short fiction sits outside the subseries label because the two collections
# differ in what they actually are. No Middle Name (2017) collects two
# novellas and ten stories entirely drawn from the Reacher series - the
# individually published ebook singles Child released between novels from
# 2011 on (Second Son, Deep Down, High Heat, Not a Drill, Small Wars, Too Much
# Time, among others) all live here rather than as separate entries, since
# this collection is where a reader now finds them. Safe Enough (2024) is a
# different kind of book: nineteen non-Reacher stories spanning Child's whole
# career, first published across three decades of anthologies (a Sherlock
# Holmes tribute, the Nicotine Chronicles, a collection inspired by Edward
# Hopper paintings, among others), plus one new piece: a Jack Reacher/Maggie
# Bird crossover written with Tess Gerritsen. It carries subseries: null
# accordingly.
#
# Reacher short fiction that never reached either collection is catalogued
# below as its own apocrypha entries, when Child wrote it alone: The
# Christmas Scorpion (2017), Smile (2019), The Fourth Man (2019) and Many
# Happy Returns (2023). The crossover novellas pairing Reacher with other
# authors' own series characters (Karin Slaughter's Will Trent, Joseph
# Finder's Nick Heller, Kathy Reichs's Temperance Brennan) sit outside this
# file: cataloguing them properly would need a global author entity for each
# collaborator, a wing-boundary question this file does not resolve. Andrew
# Child has since published two solo Reacher short stories with no Lee Child
# involvement at all (New Kid in Town, 2022; Bat Out of Hell, 2025); both
# raise the same boundary question and sit outside this file for the same
# reason.
#
# Child has also edited several multi-author anthologies, twice alongside a
# contribution of his own; those appear below as apocrypha entries with
# authorRole: editor, since assembling a volume is not the same claim as
# writing what is in it.

