# Branding for the Lee Child wing (see docs/SCHEMA.md#themeyaml). Checked
# against every existing crime wing before settling this palette.
#
# Six crime wings are already built: Harlan Coben (cul-de-sac-noir - a cool,
# low-chroma teal-grey suburban near-black, bug-light yellow), Gillian Flynn
# (heartland-noir - pale overcast newsprint-grey, bruise-plum), Michael
# Connelly (murder-book-noir - warm sepia-brown LA near-black, burnt-copper),
# Karin Slaughter (kudzu-noir - warm humid olive-green, kudzu-green), Tana
# French (bog-noir - cold peaty green-grey, heather-violet) and Jo Nesbo
# (vinterlys - pale cold blue-white, cobalt). Every one of them commits to a
# specific place and a specific color family for its near-black: a region,
# a season, a weather. Reacher has none of those - he arrives new in almost
# every book, owns nothing, and the series' whole identity is the absence of
# a home town. So this wing does the one thing none of the others can: its
# near-black carries **no color family at all**, a true achromatic asphalt
# grey rather than a warm brown, a cool teal, a peaty green or a blue-white.
# That emptiness is the point, not a missed opportunity to pick a hue.
#
# The accent needed the same scrutiny. A warm highway-yellow was the obvious
# first reach (the double yellow line, the highway shield) and it does not
# survive contact with the rest of the catalogue: gold/amber/yellow already
# belongs to six wings (Sanderson and Jordan's brass #c8a24a, Jose Luis
# Peixoto's alentejo gold #c2952a, Terry Pratchett's warm gold #d9a441, Jim
# Butcher's sodium-amber #d98a3d, and now Coben's own bug-light yellow
# #d2c83a) - a seventh in the same 30-56 degree band would be one more amber
# nobody could tell apart from the last. Moved instead to the widest open gap
# left in the catalogue's whole accent wheel: a deep flare-red at hue ~344,
# roughly equidistant from Gillian Flynn's bruise-plum (hue 318) and Stephen
# King's oxblood (hue 11 via the wraparound), and nowhere near any of this
# catalogue's reds, oranges, greens, blues or violets. It reads as a taillight
# on the interstate, a roadside flare, a motel's neon sign, not as "yet
# another warm accent."
preset: hitchhiker-noir
palette:
  bg: "#151515"        # true neutral asphalt - no hue, no color family at
                       # all, unlike every other crime wing's near-black
  surface: "#1c1c1c"   # a shade lifted, for cards - still neutral
  ink: "#e9e8e5"       # near-white, the barest breath of warmth - a page
                       # under headlights rather than case-file cream
  muted: "#94918c"     # neutral warm-grey, for metadata (AA-checked against
                       # bg and surface)
  accent: "#c62f57"    # one deep flare-red, for links and markers only
displayFace: sourceSerif  # from the app's implemented set (fraunces | spectral
                          # | sourceSerif); the plainest of the three. Critics
                          # and Child himself describe the prose as built for
                          # speed - short chapters, short sentences, nothing
                          # ornamental in the way - closer to Connelly's own
                          # reporter's economy than to anything atmospheric;
                          # already used six times in this catalogue, each for
                          # its own plain-prose reason, this one for a voice
                          # that is famously fast rather than literary
signature: rule       # a firm, straight architectural line. Already used by
                      # five other wings, but each for a different object:
                      # Palahniuk's is a clinical instruction-manual rule,
                      # McCarthy's a borderland horizon, Flynn's a copy-desk
                      # strike, Nesbo's a ledger column, Valter Hugo Mae's a
                      # typographic rule. This one is none of those - it is
                      # the literal painted line down the middle of the road,
                      # the one constant of a series that changes its town in
                      # every book, and it doubles for the flat, declarative,
                      # unadorned sentence Child's own prose is built from.
# ART. This wing's six crime neighbours each commit to a drawing instrument
# and a line that does two things: Coben's stays disciplined everywhere
# except one tangled treeline; Connelly's stays flat and procedural except
# for the LA basin's smog-smudge; Slaughter's stays exact except where
# humidity blots it; French's incises every contour twice, once true and once
# off; Nesbo's alternates a ruled hand for built things and a freehand one for
# living things. This wing does the opposite on purpose: **one line, and it
# never changes register**, whether it is drawing the road surface, a diner
# counter, a face or a fight breaking out. Reacher's own defining trait,
# repeated across the whole series, is that his method never varies from town
# to town - he counts paces, reads a room the same way every time, carries
# nothing to slow him down - and a line that refuses to loosen for feeling or
# tighten for procedure is that same constancy made visual. The emblem is not
# the road (every prose synopsis already leans on it) but the one object that
# explains why Reacher needs nothing else: he owns a folding toothbrush, an
# ATM card and an expired passport, and nothing more - he wears a shirt until
# it's dirty, then buys a new one and throws the old one away, a detail
# repeated across profiles of the character since Killing Floor.
art:
  emblem:
    object: >
      A folding toothbrush, closed, resting alone on a bare surface - a
      motel nightstand, a diner counter, a bus-depot bench - with nothing
      else beside it: no wallet, no bag, no second object of any kind.
    why: >
      Reacher's defining fact, stated identically across the series and
      every profile of the character since Killing Floor (1997), is that he
      owns almost nothing: a folding toothbrush, an ATM card and an expired
      passport are the whole of it. He wears a shirt until it's dirty, buys
      a new one, and throws the old one away rather than carry a bag. A
      drifter with thirty-one novels behind him and literally nothing to
      show for it is the shape of this whole wing, and the toothbrush is
      the one object small and plain enough to say that without becoming a
      still life about luggage.
  motifs:
    - an empty two-lane interstate running dead straight to the horizon,
      the white and yellow lane-lines the only mark in the whole frame
    - a chrome-and-Formica diner counter after midnight, one cup of black
      coffee, a stool worn pale at its center from years of use
    - a motel walkway seen from the parking lot, one window lit behind thin
      curtains, a sign at the office half burned-out
    - a small-town Greyhound depot at night, a bus idling at the curb, its
      destination board too far away to read
    - a small-town main street at closing time, one storefront still lit,
      the rest shuttered for the night
    - a stretch of highway scrubland behind chain-link, a lone figure on
      foot along the shoulder, seen from behind or at distance
    - a police-station front desk under fluorescent light, a duty ledger
      open on the counter, the room otherwise empty
  atmosphere: >
    Placeless and exact rather than regional: this is the one crime wing in
    the catalogue with no weather system or landscape of its own, because
    Reacher never stays anywhere long enough to earn one. The register is
    functional light at any hour - a gas-station forecourt at noon, a diner
    at 2 a.m., a motel parking lot at dusk - held to the same flat, alert
    calm throughout. Violence in this wing happens in bright, ordinary
    places as often as in the dark: a parking lot, a diner, a police-station
    lobby. Nothing here is gothic, nothing is cosy small-town nostalgia -
    the small towns are real and undecorated, tidy or run-down as the facts
    require, never picturesque and never sinister by design.
  lineCharacter: >
    A single, unvarying ballpoint-weight line - the same economy for a road
    surface, a diner counter, a face, or a fistfight, with no loosening for
    emotion and no tightening for procedure. Where every other crime wing in
    this catalogue splits its line into two registers (disciplined versus
    one deliberate breakdown), this one refuses the split: the constancy of
    the mark is the point, matching a character whose method never changes
    from one town to the next.
  backgroundTexture: >
    Thin, slightly rough mass-market paperback stock, a little grey at the
    edges as if handled by a hundred readers - not laid paper, not case-file
    manila, not glossy real-estate stock, not drafting paper. Cheap and
    disposable rather than precious, the way these books are actually sold
    and read: off a spinner rack, in an airport, on a bus.
  accentUse: >
    Flare-red on exactly one element per image, never as a fill: a single
    taillight receding down the interstate, a motel sign's neon glow, one
    lit EXIT sign at the end of a corridor, or a roadside flare burning on
    the shoulder.
  avoid:
    - the 2012 and 2016 Tom Cruise "Jack Reacher" films or Amazon's
      "Reacher" television series - their casting, colour grade, title
      cards, or any actor's likeness (docs/VISUAL.md SS3 forbids a real
      person's likeness in any case)
    - a flexed, muscular torso or an action-poster fight pose - Reacher's
      size is a fact stated in the prose, never a subject for illustration
    - graphic violence, blood, or a body shown in detail - a fight is drawn
      as its charge or its aftermath, never its gore
    - hitchhiking-hobo romanticism, a thumb out on the roadside played as
      folk-Americana nostalgia
    - Western gunslinger iconography - holsters, cowboy hats, a showdown
      stance - this is a contemporary thriller, not a Western, despite the
      open road
    - big-rig trucker iconography - Reacher moves by bus, on foot or by
      hitched ride, never as a long-haul driver
    - legible highway shield numbers, exit signage or any other readable
      road-sign text (docs/VISUAL.md SS1 bans typography inside the image)
    - Norman Rockwell small-town wholesomeness - these towns are real and
      plain, never a nostalgic postcard
notes: >
  A placeless register, not a regional one: true neutral asphalt near-black
  with no color family at all, near-white ink with the barest warmth, and
  one deep flare-red accent used only for links and markers - deliberately
  off every gold/amber hue this catalogue already owns six times over, and
  nowhere near any of its existing reds, greens, blues or violets. The art
  block's one instrument is a folding toothbrush, Reacher's entire estate,
  and its line refuses the two-register trick every other crime wing in the
  catalogue uses, staying one exact weight everywhere on purpose.
