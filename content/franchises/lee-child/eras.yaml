# Creative periods. There are none on record.
#
# Jack Reacher is one continuous series, thirty-one novels from Killing Floor
# (1997) to the forthcoming Chain Reaction (2026), a single procedural voice
# held so deliberately steady that no critic, reference work or settled fan
# consensus divides it, or Child's career around it, into named creative
# periods. The whole 1997-2026 shelf sits outside any era by design.
#
# One genuine boundary exists in the record, and it is the reason this file
# needed a decision rather than a default. Novels 1-24 (Killing Floor 1997
# through Blue Moon 2019) are Lee Child alone; from the 25th, The Sentinel
# (2020), through Chain Reaction, every novel is co-written with his younger
# brother Andrew Grant, who writes as Andrew Child. Wikipedia's series article
# states it plainly ("Starting with the 25th novel in the series, The Sentinel
# (2020), all subsequent books in the series have been co-authored by and
# credited to both brothers"), and Child announced the handover in January
# 2020 (https://www.bbc.co.uk/news/entertainment-arts-51162838). That is a
# real, dated, sourced fact about who wrote the books.
#
# It is a byline change, not a received reading period, and the record treats
# it as one. Three things keep it from earning a full-bleed plate:
#
#  - Its own authors frame it as continuity, not a new chapter. Andrew Child's
#    stated aim is "to make everything the same, only different"; Lee Child
#    says of the co-written novels "I would have been extremely proud if I had
#    written it myself"
#    (https://crimereads.com/lee-child-andrew-child-jack-reacher-past-present/).
#    The cover keeps reading "Lee Child" precisely so readers do not register a
#    boundary. A period the producers deliberately built to be invisible is not
#    one the site can announce over their objection.
#
#  - The shift readers actually discuss does not fall on 2020. The perceived
#    decline in the series is commonly dated to Night School (2016, the 21st
#    novel and still solo Lee Child), four years before Andrew arrived, and is
#    a diffuse, contested reader argument rather than a named phase
#    (https://en.wikipedia.org/wiki/Night_School_(novel); reader threads at
#    https://www.goodreads.com/book/show/28077464-night-school). An open
#    argument about where, or whether, the series turned is the opposite of a
#    settled period, and its line does not match the byline's.
#
#  - The byline split is itself not clean. Lee Child kept writing solo Reacher
#    stories after handing over the novels: Many Happy Returns (2023) is his
#    alone. A "co-authored era" dated 2020 would already be false to the shelf
#    inside it.
#
# Nothing else periodises the career either. Reference works, the publisher
# pages and the press are all chronological. Heather Martin, Child's own
# biographer, writing directly on how the character changed ("The Evolution of
# Jack Reacher", https://crimereads.com/the-evolution-of-jack-reacher/),
# describes a continuous evolution and names no phases: an evolution essay by
# the person best placed to periodise, that declines to.
#
# eras: [] is the honest record of a single long series no one has divided into
# periods, its author included. If the co-authorship is ever taken up as a
# named reading period, or the series' close draws a critical retrospective
# that cuts it, that is a call to make on that evidence, not this.
[]
