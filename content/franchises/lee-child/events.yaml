# FRANCHISE-SPECIFIC events only. Author-LIFE events live on the author entity
# (content/authors/lee-child.yaml). Shared world/culture events live in
# content/events/global.yaml.
#
# Five entries. Four span the screen life of the character, placed to break
# up the 2008-2019 stretch that otherwise carried no context at all: the
# first film and its casting (2012), the weaker sequel that ends Cruise's run
# (2016), the author's own reversal on the casting question (2018), and the
# streaming series that resolves it (2022, just past the gap's far edge,
# closing the loop the other three open). The fifth sits earlier, splitting
# the 2002-2006 stretch that was the wing's next-longest silence: the one
# year in that run with an outside-verified honour attached to a specific
# book (2005).
#
# Candidates tested and left out:
#   - Lee Child's TSA-agent cameo in Never Go Back: real, but a single-frame
#     walk-on with nothing behind it beyond the fact of its existence;
#     mentioned in passing in that entry rather than given one of its own
#   - a first NYT #1 bestseller claim: search results disagree on which title
#     did it first and no publisher or Times source was found to settle it,
#     so it stays out rather than shipping a guess
#   - the crossover novellas and Andrew Child's solo short fiction: bibliographic
#     scope questions already logged against works.yaml, not events

- id: lee-child/jack-reacher-film-cruise-cast-2012
  date: 2012-12-21
  title: Tom Cruise plays Reacher on screen, five inches short of the book
  scope: industry
  reach: franchise
  impact: med
  description: >
    Paramount's Jack Reacher, adapted by writer-director Christopher
    McQuarrie from [[work:lee-child/one-shot|One Shot]] (2005), premieres in
    London on 10 December 2012 and opens in the US on 21 December, grossing
    $218.3 million against a $60 million budget: the character's first
    screen appearance, fifteen years after Killing Floor. Tom Cruise, 5'7",
    plays a man the novels describe as 6'5" and 250 pounds. Child defends
    the casting at the time: "If you do know Reacher, for the first two or
    three minutes you're going to think, 'this is weird.' But after the
    first two or three minutes, you buy into it, it sucks you in, and he
    convinces you." He puts the trade-off plainly elsewhere: with another
    actor "you might get 100 per cent of the height but only 90 per cent of
    Reacher. With Tom, you'll get 100 per cent of Reacher with 90 per cent
    of the height."
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Jack_Reacher_(film)
    - https://screenrant.com/jack-reacher-tom-cruise-casting-size-reason/
    - https://gulfnews.com/entertainment/hollywood/tom-cruise-too-short-to-play-jack-reacher-creator-1.60376890

- id: lee-child/never-go-back-film-2016
  date: 2016-10-21
  title: A weaker sequel closes out Cruise's run as Reacher
  scope: industry
  reach: franchise
  impact: med
  description: >
    Jack Reacher: Never Go Back, adapted from the 2013 novel of the same
    name, premieres in New Orleans on 16 October 2016 and opens in the US on
    21 October. Cruise returns as Reacher (Child makes a brief cameo as a
    TSA agent); the film earns $162 million worldwide against the same $60
    million budget, well down on the first film's $218 million, and a 37
    per cent critics' score against the original's stronger reviews. No
    third Cruise-led Reacher film follows.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Jack_Reacher:_Never_Go_Back
    - https://www.showbiz411.com/2016/12/05/tom-cruises-jack-reacher-never-go-back-comes-to-an-end-his-10th-worst-box-office-total-of-37-films

- id: lee-child/child-admits-cruise-casting-wrong-2018
  date: 2018-11-15
  title: "The readers were right, Child says of Cruise's casting"
  scope: culture
  reach: franchise
  impact: high
  description: >
    Six years after defending it, Child reverses his public position on
    Cruise's casting. "The size of Reacher is really, really important and
    it's a big component of who he is," he says, adding that "Cruise, for
    all his talent, didn't have that physicality" and that "the readers
    were terribly upset about it and I think, ultimately, the readers were
    right." He describes working with Cruise on the two films as "a
    pleasure and a privilege" but rules out a third, announcing plans
    instead for a television reboot that recasts the role to match the
    books. He repeats the same verdict in a separate interview years later,
    telling The Independent in 2025 that Cruise "is not huge and he's not
    scary", qualities Child still holds are central to the character.
  spoilerAfter: null
  sources:
    - https://www.foxnews.com/entertainment/tom-cruise-too-short-to-be-jack-reacher-lee-child-says
    - https://gulfnews.com/entertainment/hollywood/tom-cruise-too-short-to-play-jack-reacher-creator-1.60376890
    - https://www.slashfilm.com/1799389/jack-reacher-author-lee-child-tom-cruise-casting-mistake/

- id: lee-child/reacher-amazon-series-ritchson-2022
  date: 2022-02-04
  title: Amazon casts to type, and Child gets the Reacher he wrote
  scope: industry
  reach: franchise
  impact: med
  description: >
    Amazon Prime Video's Reacher, with Child as an executive producer,
    premieres 4 February 2022 starring Alan Ritchson, 6'3" against the
    books' 6'5", a much closer match than Cruise's 5'7". Child credits the
    casting directly with fixing what the films got wrong: "I think that the
    size thing is important to certain parts of the narrative. Reacher has
    got to scare people and you can do that so much easier with one glance
    of this huge animal rather than a normal-sized actor." The series is
    renewed for further seasons.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Reacher_season_1
    - https://movieweb.com/lee-child-pleased-alan-ritchson-reacher/
    - https://www.slashfilm.com/1799712/alan-ritchson-jack-reacher-height-series-books/

- id: lee-child/the-enemy-sweeps-prizes-2005
  date: 2005
  title: The Enemy sweeps the genre's own awards
  scope: industry
  reach: franchise
  impact: med
  description: >
    A year after publication, [[work:lee-child/the-enemy|The Enemy]] (2004),
    Child's first Reacher prequel, wins both the Barry Award for Best Novel
    and the Nero Award, and is nominated for the Dilys Award: recognition
    from three separate juries inside the American mystery field for a
    single book, eight novels into the series.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Enemy_(Child_novel)
    - https://en.wikipedia.org/wiki/Nero_Award
    - http://therapsheet.blogspot.com/2007/04/my-lee-child-tradition-part-i.html
