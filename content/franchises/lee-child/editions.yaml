# Editions of Lee Child: 46 English editions across 45 of 46 works, and 8
# Portuguese (pt-PT) editions across 7 of the 31 Jack Reacher novels.
#
# COVERAGE
#   en    45 of 46 works. All 31 novels, all 4 extended-tier works (The Hero,
#         No Middle Name, Safe Enough, Reacher: The Stories Behind the
#         Stories) and 10 of the 11 apocrypha entries. The one gap, Many
#         Happy Returns, is explained below: it has no edition at all, by
#         fact rather than by omission.
#   pt-PT 8 editions over 7 novels (killing-floor carries two, under two
#         different titles). See "THE PORTUGUESE HISTORY" below for why
#         coverage is this thin and where it stops.
#
# SOURCING. English: primarily OpenLibrary's own per-edition records (each
# ISBN traced to its own https://openlibrary.org/books/OL...M permalink,
# never a search snippet), plus the publisher's own product page
# (penguinrandomhouse.com, akashicbooks.com, simonandschuster.com) wherever
# a work is recent enough or obscure enough that OpenLibrary's author sweep
# did not surface it. Portuguese: WOOK and Bertrand product pages, read via
# their own JSON-LD "Book" block; both sites currently answer a browser
# User-Agent with a Cloudflare challenge page rather than the catalogue
# (checked directly: HTTP 403, "Just a moment..."), so every pt-PT citation
# below is a web.archive.org Common Crawl capture of the same page rather
# than a live fetch - a documented, current negative on the live site, not
# a weaker source; the JSON-LD block is identical either way. Every
# Portuguese title below was matched to its work by synopsis, not by title,
# per this skill's method: two of the three earliest-era translations use
# non-literal titles.
#
# ONE EDITION PER WORK, not a US/UK pair, with one deliberate exception. All
# 31 novels used the same UK/US English text until publication temporarily
# forked into two different titles for the sixth novel (see below); nothing
# else in the run needs a second English row, so none of the later novels
# carries one. For the recent co-authored novels, the current mass-market
# paperback (Dell/Bantam) is recorded once it exists; where OpenLibrary has
# not yet indexed one (In Too Deep), the original Delacorte hardcover is
# recorded instead, and will read as superseded once a paperback ships.
#
# THE ONE ENGLISH TITLE SPLIT: THE VISITOR / RUNNING BLIND. Novel six
# published in the UK on 20 April 2000 as The Visitor (works.yaml's own
# title) and in the US on 13 July 2000 as Running Blind, at Putnam's
# request (works.yaml's note cites the reason: the original title tested as
# sounding too much like science fiction to American readers). Two rows
# below, per SCHEMA.md's en-GB/en-US rule: the UK edition needs no `title`
# override since it matches the work's own title exactly; the US edition
# carries `language: en-US` and `title: "Running Blind"`.
#
# CHAIN REACTION is not yet published (works.yaml: forthcoming 2026-10-20;
# today is 2026-07-25). Its ISBN below is real and pre-assigned by the
# publisher's own product page, not a rights-agency placeholder, so it ships
# here rather than being withheld - but the note says plainly that it is a
# pre-order.
#
# SMILE has no printing of its own. Its only English object is Invisible
# Blood, Maxim Jakubowski's seventeen-story anthology (works.yaml already
# documents this); the ISBN below is the anthology's, explained in the note
# rather than passed off as a standalone "Smile" printing.
#
# MANY HAPPY RETURNS carries no edition at all, on either side. It ran once,
# in The Spectator (16 December 2023, works.yaml's own source), and has
# never been reprinted as a standalone ebook, unlike its three siblings
# (Christmas Scorpion, Smile, Fourth Man), each of which did get one. No
# ISBN, ASIN or standalone product record exists for it under any source
# checked. A magazine page is not a buyable object in the sense this file
# tracks, so nothing is coined for it; the app will show its English title
# and nothing else, which is correct.
#
# THE PORTUGUESE HISTORY, and why it stops at 7 of 31.
# Reacher's Portuguese publication is not one continuous program but three
# unrelated ones, recovered from WOOK's and Bertrand's own "bibliografia"
# listings for Lee Child (sorted by edition date, so read as a complete
# record of what each site has ever carried):
#   1. Edições Asa (Lisbon), 2003-2012: Killing Floor only, as "Do Fundo do
#      Abismo" (2003), and 61 Hours, as "Jack Reacher - 61 Horas" (2012).
#      Two unrelated novels almost a decade apart, not a series program.
#   2. Two standalone one-off deals: Mill Books republished Killing Floor
#      again in 2008 under a THIRD title, "Dinheiro Sujo" ("Dirty Money") -
#      confirmed by matching its synopsis, not its title, to the same
#      Margrave/counterfeit-money plot as "Do Fundo do Abismo" above, a
#      retitled reissue rather than a duplicate-ISBN error. Livros d'Hoje
#      published Gone Tomorrow once, in 2010, as "Amanhã Será Outro Dia"
#      ("Tomorrow Will Be Another Day") - again matched by synopsis (the
#      subway suicide-bomber plot), since the title is not a translation of
#      the English one at all.
#   3. Bertrand Editora's own run, 2015-2018: four consecutive-ish novels,
#      Never Go Back ("Nunca Voltes Atrás", 2015), Personal ("Uma Questão
#      Pessoal", 2016), Make Me ("Nem Morto!", 2017, itself a non-literal
#      title matched by its Mother's Rest synopsis) and Night School
#      ("Escola da Noite", 2018). Bertrand's own bibliography listing (WOOK
#      mirrors the same catalogue) shows nothing published after Escola da
#      Noite: no Portuguese edition of The Midnight Line, Past Tense, Blue
#      Moon or any of the co-authored novels from The Sentinel on was found
#      anywhere, on either site, under any title. The program simply
#      stopped in 2018; the app will correctly show all later titles in
#      English to a pt-PT reader.
#
# STOCK STATUS. Nunca Voltes Atrás (Never Go Back) reads "EM STOCK" (in
# stock) on Bertrand's own live site as fetched via archive.org. Amanhã Será
# Outro Dia (Gone Tomorrow) and Dinheiro Sujo (the Mill Books Killing Floor)
# are both marked "Esgotado" / "ESGOTADO OU NÃO DISPONÍVEL" (sold out / not
# available) on WOOK; each still earns its slot since no other pt-PT edition
# of that work exists, per SCHEMA.md's out-of-print rule. Do Fundo do
# Abismo, Jack Reacher - 61 Horas, Uma Questão Pessoal, Nem Morto! and Escola
# da Noite carry no explicit stock flag in the captures read; treat them as
# unconfirmed rather than assumed current.

