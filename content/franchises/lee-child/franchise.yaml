# A wing spans an author's complete published work. Lee Child's is almost
# entirely one thing - the Jack Reacher series, works.yaml's subseries "Jack
# Reacher" - plus two short-fiction collections and one nonfiction essay
# outside it. See works.yaml's header for how the short fiction is split
# between the two collections and why several individual Reacher ebook
# singles do not get their own entries.
id: lee-child
name: Lee Child
kind: author
description: >
  The complete published work of Lee Child, pen name of James Dover Grant:
  the ongoing [[work:lee-child/killing-floor|Jack Reacher]] thriller series
  (1997-present, 31 novels), two collections of short fiction, and one
  nonfiction essay on the hero archetype. Every novel from
  [[work:lee-child/the-sentinel|The Sentinel]] (2020) onward is co-written
  with his younger brother, novelist Andrew Grant, under Grant's own new pen
  name [[author:andrew-child|Andrew Child]].
authorIds: [lee-child, andrew-child]

# An empty two-lane highway through desert scrubland, a double yellow line
# running to the horizon: the territory Reacher crosses on foot and by bus
# between towns, in book after book (Killing Floor's Greyhound into Margrave,
# the hitchhiked rides in Echo Burning and A Wanted Man, the walked road
# between two Colorado towns in Nothing to Lose). A landscape rather than a
# location tied to one novel, since no single setting represents a series
# that moves through a new town almost every book.
images:
  header: "https://upload.wikimedia.org/wikipedia/commons/4/40/Desert_Empty_Highway_%28Unsplash%29.jpg"
  headerCredit: "John King, CC0"
  headerSource: "https://commons.wikimedia.org/wiki/File:Desert_Empty_Highway_(Unsplash).jpg"

# Which shared global events actually reach this author (docs/SCHEMA.md).
# Checked against the Jack Reacher character's own documented biography, not
# assumed from Child's lifespan.
globalEvents:
  include:
    - sept-11-2001  # Reacher's own post-2001 habits (an ATM card, an expired
                     # passport, no more casual wire transfers) are stated
                     # directly on his own Wikipedia page as a consequence of
                     # the attacks and their aftermath - a rare case of a
                     # global event reaching a character's daily life rather
                     # than a book's plot.
    - ebook-and-self-publishing-2007  # explains a real, unusual shape of this
                     # shelf: from 2011 on Child released a run of Reacher
                     # novellas and short stories as standalone ebook singles
                     # between novels (Second Son, Deep Down, High Heat, Not a
                     # Drill, Small Wars, Too Much Time), later gathered into
                     # No Middle Name - a format that did not exist for the
                     # first decade of the series.
  # Considered and refused. Nothing renders unless it is in `include` above,
  # so these change nothing; kept as the record of a judgement already made.
  exclude:
    - financial-crisis-2008        # published three novels across this window;
                                    # no plot found that answers it directly
    - covid-19-pandemic-2020       # The Sentinel published during the
                                    # pandemic but its plot (a ransomware
                                    # attack on a small town) does not
                                    # reference it; checked the novel's own
                                    # plot summary rather than assuming from
                                    # publication timing
    - world-war-i-1914             # predates his lifetime (born 1954)
    - world-war-ii-1939             # predates his lifetime (born 1954)
    - pulp-magazines-1926           # predates him; not a pulp writer
    - penguin-paperback-1935        # predates him
    - armed-services-editions-1943  # predates him
    - lady-chatterley-trial-1960    # he was six years old; no resonance to a
                                     # commercial thriller writer
    - fantasy-paperback-boom-1965   # Child writes crime/thriller, not fantasy
    - carnation-revolution-1974     # Portuguese history; Child is British
    - chain-bookshop-1982           # shaped the retail landscape his books
                                     # sold into, not addressed in them
    - online-bookselling-1995       # coincided with his career's start but
                                     # not addressed in the books' content
    - prestige-fantasy-adaptation-2011  # Game of Thrones; not his genre
    - booktok-2020                  # a video-discovery phenomenon that shaped
                                     # backlist sales, not the books
    - portugal-bailout-2011         # Portuguese national crisis; unrelated

# "Where to start" - Reacher is the rare case where the character's own
# official site says outright that order barely matters ("The Jack Reacher
# books can be read in any order, but here they are in the order in which
# they were written", jackreacher.com/us/books/) while every independent
# reading-order guide checked (T.L. Branson, SlashFilm, Parade, Dexerto)
# still opens a new reader at the same book. Both halves are sourced, so
# both ship: the permission and the actual, converged recommendation. Three
# paths: the standard newcomer's door, the default completionist walk, and
# the documented chronological order from orders.yaml, built for a reread.
startHere:
  paths:
    # Source: https://www.jackreacher.com/us/books/ - the character's own
    # official site lists Killing Floor first on its "Books in order" page.
    # Echoed as the standard newcomer's pick by every independent guide
    # checked: T.L. Branson calls it "Lee Child's debut novel and still the
    # best entry point for most readers"; SlashFilm, Parade and Dexerto all
    # open their own reading-order guides at the same title.
    - id: start-with-killing-floor
      title: Start with Killing Floor
      description: >
        Jack Reacher gets off a Greyhound bus in a small Georgia town and is
        arrested for a murder within hours of arriving: the book that
        introduces him and the standard door into the series. One novel is
        the cheapest possible test of whether this drifter and this voice
        are for you, before committing to thirty more.
      workIds:
        - lee-child/killing-floor
      orderId: null
      fit:
        experience: [new]
        commitment: [taste, arc]
      note: >
        The official Jack Reacher site is explicit that the books "can be
        read in any order" - Reacher arrives new in almost every novel and
        rarely carries an unresolved plot into the next one - but even it
        still lists them starting here, and no guide checked recommends a
        different door in.
    - id: whole-shelf
      title: The whole shelf, as published
      description: >
        Every novel, short story and the two nonfiction pieces, in the order
        Lee Child, and later Andrew Child alongside him, actually wrote and
        published them: a 1997 debut through to a 2026 novel not yet out.
        The way most readers have lived alongside Reacher for three decades,
        one book at a time.
      workIds: null
      orderId: default
      fit:
        experience: [returning, completionist]
        commitment: [complete]
    # Source: see lee-child/chronological-inuniverse in orders.yaml for how
    # the sequence itself is sourced. jackreacher.com and T.L. Branson's
    # guide both frame chronological order as a re-read or a committed
    # completionist's arrangement, never as the way in for a new reader.
    - id: chronological
      title: Reacher's life, in order
      description: >
        The 31 novels resequenced into the order they happen to Reacher,
        prequels first. Built for completionists and re-readers who want his
        Army years to lead straight into his drifting years, with no
        publication date getting in the way.
      workIds: null
      orderId: lee-child/chronological-inuniverse
      fit:
        experience: [completionist]
        commitment: [complete]
      note: >
        Not the recommended way in: these four prequels were written well
        after, and with knowledge of, everything that follows them. Read
        publication order first, and save this arrangement for the second
        pass through the series.

sources:
  - https://en.wikipedia.org/wiki/Lee_Child
  - https://en.wikipedia.org/wiki/Jack_Reacher
  - https://en.wikipedia.org/wiki/Andrew_Child
  - https://www.leechild.com/
