# Additional reading orders. There are none on record here.
#
# No publisher-numbered sequence or named grouping exists across the
# eighteen core novels, unlike João Tordo's publisher-numbered Trilogia dos
# Lugares Sem Nome or Valter Hugo Mãe's two author-named tetralogies. The
# only structural grouping in works.yaml is the five-volume Cadernos de
# Lanzarote diary, already carried as subseries: "Cadernos de Lanzarote".
# It was considered and rejected as an order: a diary is chronological by
# construction (each volume is one distinct year, 1994-1998, with no
# same-year ties to settle), no publisher or critic sequences it any other
# way, and an order restating publication order over an already-chronological
# set is a duplicate wearing a costume - the same failure mode this
# catalogue already rejects for a single-thread series published in story
# order.
#
# No startHere path either. His unpunctuated dialogue and page-long
# sentences are real and well documented (both Wikipedias, the Nobel and
# Guardian obituary material already sourced elsewhere in this wing), and
# whether "don't start with the hardest book" applies to him was checked
# directly rather than assumed: the José Saramago Foundation's own site,
# English- and Portuguese-language press (Guardian, NYT, Público,
# Observador), LitHub, The Paris Review, Book Riot, themodernnovel.org,
# Wook's own "por onde começar" reading-guide series (the source behind
# Valter Hugo Mãe's startHere on this catalogue, so a real and findable
# format when it exists), and r/books. No publisher, critic, translator or
# bookshop guide ranking his novels by accessibility turned up in either
# language. One 2010 personal blog names The Year of the Death of Ricardo
# Reis and The Gospel According to Jesus Christ as easier starts; it is the
# only source found taking a position, which is one blog post, not a
# reading practice, and is held out for the same reason a single unreliable
# aggregator was rejected as a source for José Luís Peixoto's startHere on
# this catalogue. Reddit's r/books shows Blindness is both the novel
# English-language readers overwhelmingly read first and a recurring source
# of "struggling to finish" and "ruined by the writing" threads - real
# texture about the book's reception, not a guide anyone could cite as
# recommending an alternative.
[]
