# Creative periods.
#
# Two eras are claimed, both anchored to sources read directly rather than to
# Portuguese Wikipedia's own prose synthesis, which groups the novels the same
# way but cites only a single print dossier (Revista Entre Livros no. 23,
# Editora Duetto, Sao Paulo, 2007) with no URL and no further corroboration -
# an unreachable, unverifiable citation under the paywalled-or-dead rule, and
# not used here even though its grouping turned out to match what the sources
# below independently support.
#
# A third, much longer-lived shape does NOT appear as an era: Saramago's own
# nineteen-year absence from print (1947-1966, in his own words on the Nobel
# site) and thirty-year absence from the novel (1947-1977, per the Guardian
# and New York Times obituaries) is a real and well-documented "late bloomer"
# biographical fact, but it is an absence, not a body of work - there is
# nothing to plate an era entry for across those decades, and the shape
# belongs to the author's own life story rather than to a period of his
# fiction. It sits on the jose-saramago author entity's lifeEvents instead.

- id: the-historical-novels
  organisation: chapter-gate
  illustration_type: establishing-landscape
  images_required: 1
  title: The Historical Novels
  period: "1980-1991"
  themes: [official history versus the record, the Inquisition and empire, Pessoa's heteronyms, Iberian identity, institutional power]
  provenance: author
  description: >
    Saramago's own Nobel autobiography marks "the 1980s" as the decade "entirely
    dedicated to the Novel" (one exception aside, the play A Segunda Vida de
    Francisco de Assis, 1987): [[work:jose-saramago/levantado-do-chao|Levantado
    do Chão]], where he says the narrating style that characterises his novels
    was born, then [[work:jose-saramago/memorial-do-convento|Memorial do
    Convento]], [[work:jose-saramago/o-ano-da-morte-de-ricardo-reis|O Ano da
    Morte de Ricardo Reis]], [[work:jose-saramago/a-jangada-de-pedra|A Jangada
    de Pedra]] and
    [[work:jose-saramago/historia-do-cerco-de-lisboa|História do Cerco de
    Lisboa]]. Each measures an invented story against a real historical record:
    the Alentejo latifúndio, the building of the Mafra convent, Pessoa's
    fascist-era Lisbon, the Iberian Peninsula's place in Europe, the medieval
    siege of Lisbon. Encyclopaedia Britannica groups
    [[work:jose-saramago/o-evangelho-segundo-jesus-cristo|O Evangelho Segundo
    Jesus Cristo]] (1991) with A Jangada de Pedra as sharing the same practice,
    "setting whimsical parables against realistic historical backgrounds" -
    here, biblical rather than national history. The Portuguese government's
    veto of O Evangelho from a European literary prize nomination in 1992, as
    offensive to Catholics, ended the run and sent Saramago into exile in
    Lanzarote.
  sources:
    - "https://www.nobelprize.org/prizes/literature/1998/saramago/biographical/"
    - "https://web.archive.org/web/20210109080156/https://www.britannica.com/biography/Jose-Saramago"
    - "https://www.theguardian.com/books/2010/jun/18/jose-saramago-obituary"

- id: the-allegorical-novels
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: The Allegorical Novels
  period: "1995-2005"
  themes: [the unnamed city, bureaucracy and the loss of the individual, epidemic as social diagnosis, identity and doubling, mortality]
  provenance: critical
  description: >
    Two independently written obituaries mark
    [[work:jose-saramago/ensaio-sobre-a-cegueira|Ensaio sobre a Cegueira]]
    (1995) as opening a more allegorical run in Saramago's fiction. The New
    York Times: "In his later years, Mr. Saramago's fiction became more
    starkly allegorical," citing Blindness itself as the example. The
    Guardian: the themes of this run "were philosophical and, increasingly,
    millennial", citing
    [[work:jose-saramago/todos-os-nomes|Todos os Nomes]] (1997) and
    [[work:jose-saramago/a-caverna|A Caverna]] (2000). The run continues with
    [[work:jose-saramago/o-homem-duplicado|O Homem Duplicado]] (2002),
    [[work:jose-saramago/ensaio-sobre-a-lucidez|Ensaio sobre a Lucidez]]
    (2004, Blindness's own direct sequel, set in the same unnamed city) and
    [[work:jose-saramago/as-intermitencias-da-morte|As Intermitências da
    Morte]] (2005). Every novel in the run is set in an unnamed city or
    country, unlike the earlier historical novels or Saramago's final two,
    A Viagem do Elefante and Caim, both of which return to named historical
    and biblical settings.
  note: >
    Neither obituary gives an end year for this later run; the span closes at
    As Intermitências da Morte (2005), the last core novel with an unnamed
    setting before A Viagem do Elefante (2008, a dated 1551 journey) and Caim
    (2009, Eden, Sodom and the Old Testament's other named settings) return to
    history and scripture by name.
  sources:
    - "https://web.archive.org/web/20201109002949/http://www.nytimes.com/2010/06/19/books/19saramago.html"
    - "https://www.theguardian.com/books/2010/jun/18/jose-saramago-obituary"
