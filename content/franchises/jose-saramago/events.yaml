    - https://pt.wikipedia.org/wiki/José_Saramago

- id: saramago-pontiero-english-voice-1996
  organisation: layered-stack
  illustration_type: archive-stack
  images_required: 1
  date: 1996-02-10
  title: The translator who built the English shelf dies mid-project
  scope: industry
  reach: franchise
  impact: med
  description: >
    Giovanni Pontiero, a Glasgow-born scholar at Manchester, gave Saramago
    his English voice: Baltasar and Blimunda in 1987, then The Year of the
    Death of Ricardo Reis, The Gospel According to Jesus Christ, The Stone
    Raft, A Manual of Painting and Calligraphy and The History of the Siege
    of Lisbon, winning the Independent Foreign Fiction Award in 1993 and
    the American Literary Translators Association's award the year after.
    He translated through a final illness and died on 10 February 1996, so
    that his version of [[work:jose-saramago/ensaio-sobre-a-cegueira|Ensaio
    sobre a Cegueira]] appeared posthumously in 1997, under the title
    Blindness. The loss of the essay from the title annoyed Saramago
    considerably, and it is why the English pair reads Blindness and Seeing
    where the Portuguese reads Essay on Blindness and Essay on Lucidity.
    Margaret Jull Costa carried the work on afterwards and was still his
    translator when he died. "Lamentably, I can only write Portuguese," he
    said. "It is my translators who render my work universal."
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Giovanni_Pontiero
    - https://www.theguardian.com/books/2010/jun/18/jose-saramago-obituary
    - https://www.theguardian.com/books/2010/jun/18/jose-saramago-writer-nobel-dies

- id: saramago-blindness-cannes-2008
  organisation: layered-stack
  illustration_type: press-media-collage
  images_required: 1
  date: 2008
  title: Blindness opens the Cannes Film Festival
  scope: culture
  reach: franchise
  impact: med
  description: >
    Fernando Meirelles's adaptation of
    [[work:jose-saramago/ensaio-sobre-a-cegueira|Ensaio sobre a Cegueira]],
    a Brazilian, Canadian and Japanese co-production with Julianne Moore
    and Mark Ruffalo, was selected in competition at Cannes and shown as
    the festival's opening film. The Guardian's obituary two years later
    put it plainly: of a body of work read all over Europe and Latin
    America, it was through this film that he reached his widest audience.
    He described
    the book as a metaphor for the way rich nations pursue more wealth
    while the poor stay poor, and reduced the whole parable to one
    question: is a world in which the richest three hundred people own as
    much as the poorest forty per cent a great achievement?
  spoilerAfter: null
  sources:
    - https://www.festival-cannes.com/en/f/blindness/
    - https://www.theguardian.com/books/2010/jun/18/jose-saramago-obituary
    - https://www.theguardian.com/books/2010/jun/18/jose-saramago-writer-nobel-dies

- id: saramago-claraboia-published-2011
  organisation: diptych
  illustration_type: book-object
  images_required: 2
  date: 2011-10-17
  title: Claraboia is published, fifty-eight years after it was written
  scope: culture
  reach: franchise
  impact: med
  description: >
    Sixteen months after his death, and with his heirs' authorisation,
    Editorial Caminho published [[work:jose-saramago/claraboia|Claraboia]],
    the novel a Lisbon publisher had left unanswered in 1953 and found
    again in 1989. Pilar del Río's foreword records his response to its
    reappearance, and he had told his family that once he was dead they
    could do as they thought best. Spanish, Italian and Brazilian editions
    followed in 2012, and Margaret Jull Costa's English Skylight in 2014.
    A facsimile edition in 2013 reproduced the 245 typed sheets with his
    handwritten corrections still on them.
  spoilerAfter: null
  sources:
    - https://www.josesaramago.org/livro/claraboia/
    - https://g1.globo.com/pop-arte/noticia/2012/03/claraboia-o-livro-perdido-de-jose-saramago.html
    - https://pt.wikipedia.org/wiki/Claraboia_(livro)
    - https://en.wikipedia.org/wiki/Skylight_(novel)

- id: saramago-alabardas-published-2014
  organisation: artifact-spread
  illustration_type: manuscript-proof
  images_required: 1
  date: 2014
  title: Thirty pages of a last novel
  scope: culture
  reach: franchise
  impact: med
  description: >
    At his death he had written thirty pages of what would have been his
    next novel: Artur Paz Semedo, a man in love with artillery, employed by
    an arms factory, pushed by his pacifist ex-wife into investigating his
    own employer.
    [[work:jose-saramago/alabardas-alabardas-espingardas-espingardas|Alabardas,
    Alabardas, Espingardas, Espingardas]] was published unfinished in 2014,
    with essays by Fernando Gómez Aguilera and Roberto Saviano and
    engravings by Günter Grass; the Spanish edition adds his working notes,
    in which he sets down how the story was to end.
  spoilerAfter: null
  sources:
    - https://www.josesaramago.org/livro/alabardas-alabardas-espingardas-espingardas/
    - https://pt.wikipedia.org/wiki/José_Saramago

- id: saramago-ultimo-caderno-2018
  organisation: marginalia
  illustration_type: isolated-object
  images_required: 1
  date: 2018-10-08
  title: A sixth Lanzarote notebook comes off an old hard drive
  scope: culture
  reach: franchise
  impact: med
  description: >
    He had promised readers in 2001 that there was one more volume of the
    Lanzarote diaries, covering 1998, and then it vanished: a change of
    computer left it, in his own phrase, stuck to the hard disk of a
    machine nobody used any more. It was found in his archive in early
    2018, eight years after his death, and
    [[work:jose-saramago/ultimo-caderno-de-lanzarote|Último Caderno de
    Lanzarote]] was published on 8 October 2018, twenty years to the day
    after the Nobel announcement it describes from the inside.
  spoilerAfter: null
  sources:
    - https://www.josesaramago.org/livro/ultimo-caderno-de-lanzarote/

- id: saramago-a-viuva-restored-2022
  organisation: medallion
  illustration_type: book-object
  images_required: 1
  date: 2022
  title: The first novel gets its own title back
  scope: culture
  reach: franchise
  impact: med
  description: >
    Closing the centenary of his birth, Porto Editora reissued
    [[work:jose-saramago/terra-do-pecado|Terra do Pecado]] under A Viúva,
    the title Saramago gave it in 1947 and which his publisher made him
    drop as a condition of printing it. He never accepted the change. The
    cover calligraphy is by Violante Saramago Matos, his only daughter,
    born in the same year the book appeared.
  spoilerAfter: null
  sources:
    - https://www.josesaramago.org/livro/terra-do-pecado/
    - https://pt.wikipedia.org/wiki/José_Saramago
