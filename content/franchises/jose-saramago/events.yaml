- id: saramago-blimunda-la-scala-1990
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 1990
  title: Memorial do Convento becomes an opera at La Scala
  scope: culture
  reach: franchise
  impact: med
  description: >
    Azio Corghi's opera Blimunda, with a libretto drawn from
    [[work:jose-saramago/memorial-do-convento|Memorial do Convento]],
    premiered at the Teatro alla Scala in Milan. It was the first of three
    Corghi works taken from Saramago: the opera Divara followed in Münster
    in 1993, from the play [[work:jose-saramago/in-nomine-dei|In Nomine
    Dei]], and A Morte de Lázaro in 1995. Eight years after publication and
    two years before his own government struck a Saramago novel from a
    prize list, the book that had made his name abroad was being sung at
    the most famous opera house in Italy.
  spoilerAfter: null
