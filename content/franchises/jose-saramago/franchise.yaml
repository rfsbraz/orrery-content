id: jose-saramago
name: José Saramago
kind: author
description: >
  The Portuguese Nobel laureate (1998) of the long, unpunctuated sentence:
  eighteen novels running from a 1947 debut through the 1992 censorship
  affair that sent him into Lanzarote exile, to an unfinished manuscript
  found on his computer at his death, alongside poetry, crónicas, plays,
  diaries and a rediscovered lost novel written decades before it was
  finally published.
authorIds: [jose-saramago]
themePreset: lanzarote-basalt

# Capabilities are auto-detected from the data (docs/SCHEMA.md). This wing
# ships works.yaml (52 works: 18 core novels plus poetry, crónicas, travel
# writing, memoir, the five-volume Cadernos de Lanzarote diaries, short
# fiction, plays, essays, children's books and two correspondence volumes),
# a 14-lifeEvent author entity, a 7-event events.yaml, a 2-era eras.yaml
# (The Historical Novels 1980-1991, The Allegorical Novels 1995-2005 -
# sourced from primary documents, not from the Portuguese Wikipedia prose
# synthesis this comment used to cite, which traced to an unreachable
# citation), and a globalEvents ruling (1 included, 13 excluded). No
# orders.yaml and no startHere yet: no publisher-numbered sequence exists
# beyond the Cadernos de Lanzarote diaries (already marked as a subseries in
# works.yaml), and while his long sentences and unmarked dialogue are a real
# first-read consideration, no citable ranked entry-point guidance has been
# collected here yet.
features: {}

globalEvents:
  include:
    # His own Nobel lecture narrates Levantado do Chão (1980) as running "from
    # the beginning of the century to the April revolution of 1974 which
    # toppled dictatorship" - the novel's own ending. The revolution also ends
    # the Estado Novo censorship that had vetted every prior Portuguese book,
    # and its Alentejo land-reform aftermath (the Boa Esperança collective he
    # lived among while writing) is the direct source of the novel's material;
    # the same revolutionary process (PREC) is the setting of his own 1975
    # removal from Diário de Notícias, already a lifeEvent on this wing.
    - carnation-revolution-1974
  exclude:
    # Announced April 2011, after his June 2010 death; no work or word of his
    # can answer an event that had not happened yet.
    - portugal-bailout-2011
    # His father's WWI artillery service is in his own Nobel autobiography,
    # but it explains his father's 1924 move to Lisbon, not Saramago's own
    # work; the war itself predates his 1922 birth by eight years.
    - world-war-i-1914
    # Neutral Portugal; his own Nobel autobiography narrates 1939-1945 (age
    # 17-23) without mentioning the war at all, and no novel is set in or
    # answers it - Ricardo Reis (1984) is set in 1936, three years before it
    # starts.
    - world-war-ii-1939
    # Lived through it at 78-79; Seeing (2004) predates it, and no source
    # checked (including the Guardian's contemporary review of Seeing) names
    # it as the occasion for any specific page.
    - sept-11-2001
    # A lifelong critic of capitalism and the IMF from his 1969 PCP
    # membership on; his blog O Caderno happens to start the same month as
    # the crash (September 2008), but no source ties its founding or content
    # to the crisis specifically rather than to his standing politics.
    - financial-crisis-2008
    # Anglophone genre-magazine industry history; no evidence it reached a
    # Portuguese literary novelist.
    - pulp-magazines-1926
    # UK paperback-retail history; no sourced Portuguese-market equivalent
    # tied to his career.
    - penguin-paperback-1935
    # US wartime military book-distribution programme; no plausible link to
    # a Portuguese author.
    - armed-services-editions-1943
    # A UK obscenity-law fight; his own 1992 censorship battle was a distinct
    # national dispute over religious offence, not a descendant of this one.
    - lady-chatterley-trial-1960
    # A commercial category for secondary-world fantasy; he does not write in
    # it.
    - fantasy-paperback-boom-1965
    # Anglophone retail-bookselling trend; no sourced connection to his
    # career or the Portuguese market.
    - chain-bookshop-1982
    # Generic publishing-industry milestone; no sourced connection found.
    - online-bookselling-1995
    # He died in 2010, three years after the Kindle launched, with no found
    # trace of him engaging ebooks or self-publishing.
    - ebook-and-self-publishing-2007

sources:
  - https://www.josesaramago.org/
  - https://pt.wikipedia.org/wiki/José_Saramago
  - https://en.wikipedia.org/wiki/José_Saramago
  - https://www.nobelprize.org/prizes/literature/1998/saramago/biographical/
