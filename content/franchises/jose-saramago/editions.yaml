# Portuguese editions - the actual books a Portuguese reader buys.
#
# Saramago writes in Portuguese, so there is nothing to translate: every
# work's `title` in works.yaml IS the published Portuguese title. Per
# SCHEMA.md the `title` field is therefore OMITTED throughout.
#
# PUBLISHING HISTORY: Caminho (Lisbon, later Alfragide) was Saramago's
# Portuguese-language publisher from 1980 until Grupo LeYa's acquisition of
# Caminho. Since 2014, Grupo Porto Editora - a separate company from LeYa -
# has been running "Obras de José Saramago", a systematic paperback
# reissue of nearly the entire backlist, confirmed directly on
# portoeditora.pt's own product pages (Coleção: "Obras de José Saramago")
# and cross-checked against the Biblioteca Nacional de Portugal's ipac20
# catalogue (catalogo.bnportugal.gov.pt / id.bnportugal.gov.pt permalinks),
# which independently records the same ISBNs across repeated reprints
# running into 2024-2026 (Memorial do Convento alone is at its 64th
# printing). Where both sources were opened and agree, both are cited;
# where only Porto Editora's own page could be confirmed (no BND record
# under that ISBN), the entry says so. The older Caminho printings these
# superseded are not separately recorded, per the "most recent in-print"
# default rule; a few (e.g. A Noite, A Jangada de Pedra) remain visible
# elsewhere in print or on the Fundação's own channels under a different,
# not-recorded-here ISBN.
#
# ISBN-10 CONVERSION: Objecto Quase's BNP record carries only a 10-digit
# ISBN (972-21-0292-3). Converted here by dropping the ISBN-10 check
# digit, prefixing 978, and recomputing the check digit from scratch, per
# the editions skill's own worked method - 9789722102926, re-verified by
# its own ISBN-13 check digit and by validate.py.
#
# COVERAGE: 46 of 52 works have a recorded edition (18/18 core, 27/31
# extended, 1/3 apocrypha). The six gaps, none padded:
#   - Democracia e Universidade: first published in Spain (Editorial
#     Complutense, 2010) and Brazil (UFPA Press, 2013) only; no Portuguese
#     printing was found in BNP, Porto Editora's own catalogue or
#     elsewhere.
#   - O Lagarto, Uma Luz Inesperada, O Primeiro Barco: all three
#     posthumous picture-book-adjacent texts are sourced in works.yaml to
#     Companhia das Letras, a Brazilian publisher; no pt-PT edition was
#     found in BNP under any title search.
#   - José Rodrigues Miguéis e José Saramago - Correspondência: Caminho's
#     own site lists this title (cited in works.yaml), but no BNP catalogue
#     record was found under any search of the title, either author's
#     name, or the volume's editor.
#   - Com o Mar por Meio: sourced in works.yaml to a Brazilian
#     Companhia das Letras edition only; no pt-PT printing found.
# These are market facts, not a research gap left for later - see each
# work's own note in works.yaml for the sourcing already on record there.
#
# Two entries carry no isbn13 by design, per SCHEMA's "when there is no
# ISBN" allowance: As Opiniões que o DL Teve (Seara Nova, 1974, pre-ISBN
# Portugal) and Poética dos Cinco Sentidos - O Ouvido (Bertrand, 1979,
# no ISBN in its BNP record either). A Estátua e a Pedra also carries none:
# its only Portuguese-language printing is the Fundação José Saramago's own
# 2013 bilingual Portuguese/Spanish edition, sold with no ISBN on the
# Fundação's own shop page.

