- id: jose-saramago/a-caverna
  title: "A Caverna"
  authorIds: [jose-saramago]
  published: 2000
  subseries: null
  canonTier: core
  synopsis: >
    Cipriano Algor, an elderly potter, delivers his pots and jugs each
    month to the Center, a vast complex of shops, apartments and offices
    on the edge of his village - until it stops taking them, and then
    stops taking the ceramic dolls he turns to instead, and the family has
    to give up the village and move inside the Center itself. Published in
    English as The Cave (2002).
  note: >
    The publisher's jacket copy stops at the family's move into the Center
    and at the "mysterious sounds of digging" that follow from beneath
    their apartment, without saying what is found down there. That
    discovery is the novel's closing turn and the source of its title, so
    the synopsis above stays at the jacket's own level of disclosure.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
    - https://www.josesaramago.org/bibliografia-ativa/
    - https://www.josesaramago.org/livro/a-caverna/
  images:
    cover: "https://covers.openlibrary.org/b/id/1047745-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL7922531W"
    # A Spanish edition (La caverna); no Portuguese or English edition on Open
    # Library carries a usable cover. Shows a stylised flame/silhouette, not
    # the underground chamber - see the spoiler note on this entry.

