    # DCPL0000662317 visible across the jacket - kept for want of a
    # cleaner alternative, same as the Boston Public Library scan on
    # A Bagagem do Viajante.

- id: jose-saramago/memorial-do-convento
  title: "Memorial do Convento"
  authorIds: [jose-saramago]
  published: 1982
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    In baroque 18th-century Lisbon, under the Inquisition, a one-handed
    soldier and a clairvoyant woman fall in love while a renegade priest
    dreams of building a flying machine, against the building of the
    Convent of Mafra. Published in English as Baltasar and Blimunda (1988);
    the novel that won Saramago international readership and definitively
    won over Portuguese critics.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
  images:
    cover: "https://covers.openlibrary.org/b/id/14422896-L.jpg"
