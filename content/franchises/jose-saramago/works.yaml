# Bibliography (Works) - the abstract books; editions/covers are separate.
# IDs are STABLE and permanent (user data references them). Titles are the
# ORIGINAL PORTUGUESE (canonical); prose/synopses are in English.
#
# Cross-checked against the José Saramago Foundation's own "Bibliografia
# Ativa" (fetched in both its pt and en renderings - the two agree on every
# title and year), Portuguese and English Wikipedia's full "Obras
# publicadas" / "List of works" tables (fetched directly), and, for
# individually flagged titles, further sourcing noted on that entry. No
# pseudonym is used anywhere in this bibliography.
#
# canonTier convention for this franchise:
#   core      - the 18 novels: the narrative-fiction spine his own
#               foundation's "Romance" category and both Wikipedias'
#               infoboxes are built from, including the two posthumous
#               ones (a rediscovered 1953 manuscript and an unfinished
#               work-in-progress - see their own notes).
#   extended  - poetry (3), crónicas/political-essay collections (5),
#               travel writing (1), memoir (1), the Cadernos de Lanzarote
#               diaries (5, plus two related diary-adjacent volumes),
#               short fiction (2), plays (5), single-lecture essays (2),
#               and children's picture books (5). Genuinely his, off the
#               novel-reading spine.
#   apocrypha - a contributor credit in a multi-author series, and two
#               correspondence volumes co-published with another writer
#               (Saramago wrote only his own side of each exchange).
#
# NOT INCLUDED as its own entry: "O Embargo", first published separately in
# 1973 (an English Wikipedia bibliography table lists it as a standalone
# 1973 title), is the opening story of Objecto Quase (1978) and is noted on
# that entry rather than duplicated as a second work. Periodical crónicas,
# articles and interviews never gathered into one of the volumes below are
# also excluded - no single dated book exists for the rest to anchor an
# entry to.
#
# DATE NOTE: "Folhas Políticas" (the 1976-1998 political-writing
# collection) is dated 1999 here, per English Wikipedia's bibliography
# table, Fnac.pt, Goodreads and Livraria Ultramarina (which independently
# agree on the same first edition, Editorial Caminho, ISBN 972-21-1303-8,
# printed November 1999) - the Fundação's own "Bibliografia Ativa" filter
# page lists a "Folhas Políticas" at 1993 instead, which the four
# 1999-dated sources' matching ISBN and title outweighs.
#
# DATE NOTE: "O Ano da Morte de Ricardo Reis" is dated 1984 by the
# Fundação's own bibliography, its English-Wikipedia table entry and its
# Portuguese-Wikipedia "Obras publicadas" list; Portuguese Wikipedia's own
# prose narrative elsewhere gives 1985 for the same book, which the other
# three agreeing sources (two of them the same site's own list) override.
#
# DATE NOTE: "A Caverna" is dated 2000 by the Fundação's bibliography (both
# language renderings) and English Wikipedia's table; Portuguese
# Wikipedia's prose narrative alone gives 2001, again outweighed by the
# other three.
#
# DATE NOTE: "A Estátua e a Pedra" is dated 1999 here (its first print
# edition, in Italian), not 1997 (the year of the spoken lecture at the
# University of Turin it transcribes, and the year the Fundação's own
# bibliography lists it under) - see that entry's own note.

# --- Novels ---

- id: jose-saramago/terra-do-pecado
  title: "Terra do Pecado"
  authorIds: [jose-saramago]
  published: 1947
  subseries: null
  canonTier: core
  synopsis: >
    Saramago's debut novel, about a widow torn between two men on a farm on
    the Ribatejo plain. He titled it A Viúva; his publisher renamed it for
    commercial reasons, and it was not reissued under his own title until a
    2022 centenary edition.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
    - https://www.josesaramago.org/bibliografia-ativa/
  # No cover: the only Open Library record (OL19906306W) carries one cover id
  # (3748106) and it resolves to Open Library's blank placeholder, not an image;
  # no other work record, translation or the untitled "A Viúva" survives a
  # title sweep either. Terra do Pecado was never widely translated (only a
  # 2022 centenary Portuguese reissue exists beyond the original), so no
  # foreign edition fills the gap.

