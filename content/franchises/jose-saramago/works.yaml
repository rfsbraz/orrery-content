- id: jose-saramago/o-evangelho-segundo-jesus-cristo
  title: "O Evangelho Segundo Jesus Cristo"
  authorIds: [jose-saramago]
  published: 1991
  subseries: null
  canonTier: core
  synopsis: >
    A retelling of the life of Jesus that portrays him, and God, as fallible
    and human. In 1992 the Portuguese government ordered the book removed
    from Portugal's Aristeion Prize nomination as religiously offensive,
    the episode that sent Saramago into exile in Lanzarote for the rest of
    his life.
