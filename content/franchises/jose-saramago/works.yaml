  title: "Levantado do Chão"
  authorIds: [jose-saramago]
  published: 1980
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    Three generations of a landless Alentejo family endure hunger, forced
    labour and dictatorship across the twentieth century. Portuguese
    criticism marks this as the book where the long-sentence,
    quotation-mark-free "saramaguiano" style he is known for first appears.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
