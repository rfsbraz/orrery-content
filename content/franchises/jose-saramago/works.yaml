- id: jose-saramago/as-intermitencias-da-morte
  title: "As Intermitências da Morte"
  authorIds: [jose-saramago]
  published: 2005
  subseries: null
  canonTier: core
  synopsis: >
    On the first day of a new year, in an unnamed country, nobody dies,
    and the government, the church, the hospitals, the insurers and the
    funeral trade are left to work out what a life without death actually
    costs. Then death herself, with a small d, sets about an experiment of
    her own. Published in English as Death at Intervals (UK, Harvill
    Secker) or Death with Interruptions (US, Harcourt).
  note: >
    The Portuguese publishers (Caminho, Leya, Círculo de Leitores, Porto
    Editora) all print the same jacket copy, which goes no further than
    the novel's opening line, "No dia seguinte ninguém morreu", and a
    promise of "uma ampla divagação sobre a vida, a morte, o amor". The US
    jacket (Harcourt, 2008) goes furthest and still only asks what death
    might become. The turn the second half takes is stated on none of them
    and is not stated here.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
    - https://www.josesaramago.org/livro/as-intermitencias-da-morte/
  images:
    cover: "https://covers.openlibrary.org/b/id/14422897-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL22749431M"
    # The Caminho pt-PT edition. The same edition record's other cover id
    # (8619758) is a scanned copyright/colophon page, not the jacket - the
    # search API surfaced that one first; rejected on inspection. Shows a
    # skull motif, not the second-half turn - see the spoiler note on this
    # entry.

- id: jose-saramago/a-viagem-do-elefante
  title: "A Viagem do Elefante"
  authorIds: [jose-saramago]
  published: 2008
  subseries: null
  canonTier: core
  synopsis: >
    A fictionalised account of Solomon, an Indian elephant gifted by King
    João III of Portugal to Archduke Maximilian of Austria in 1551, and his
    real overland journey across 16th-century Europe.
  note: >
    The Fundação's page for this book carries a remark of Saramago's own
    about how the historical elephant's life ended, and says the novel
    would not have been written otherwise. That is the book's closing
    turn; the publisher's own jacket copy (Porto Editora, Caminho) stops
    at the gift and the journey, and so does the synopsis above.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
    - https://www.josesaramago.org/livro/a-viagem-do-elefante/
  images:
    cover: "https://covers.openlibrary.org/b/id/11625581-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL24824686W"

- id: jose-saramago/caim
  title: "Caim"
  authorIds: [jose-saramago]
  published: 2009
  subseries: null
  canonTier: core
  synopsis: >
    Cain wanders through the Old Testament's own chronology - Eden, Sodom,
    Abraham and Isaac, Job, Noah's ark - arguing directly with a vengeful
    God. Saramago's last novel published in his lifetime, published in
    English as Cain (2011).
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
  # No cover: Open Library's only cover for this work (id 9642663) carries a
  # "PDL - Projeto Democratização da Leitura" scan-credit banner burned into
  # the image, the same laundering problem as a retailer watermark - rejected
  # on inspection. No other edition record exists.

- id: jose-saramago/claraboia
  title: "Claraboia"
  authorIds: [jose-saramago]
  published: 2011
  subseries: null
  canonTier: core
  synopsis: >
    Six households sharing a Lisbon apartment building live out their
    private hardships and small kindnesses under the same roof.
  note: >
    Written in 1953 and submitted to a publisher, who never responded and
    never returned the manuscript. In 1989 the same publisher found it
    while moving offices and offered to publish it; Saramago took the
    typescript back and refused - the book would not appear while he
    lived. Published only in 2011, a year after his death. Published in
    English as Skylight (2014).
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
  images:
    cover: "https://covers.openlibrary.org/b/id/11290383-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL24619506W"
    # Edicions 62's Catalan edition ("Novel.la (El Balancí)") - this work's
    # only cover on Open Library. No Porto Editora pt-PT or English edition
    # carries one.

- id: jose-saramago/alabardas-alabardas-espingardas-espingardas
  title: "Alabardas, Alabardas, Espingardas, Espingardas"
  authorIds: [jose-saramago]
  published: 2014
  subseries: null
  canonTier: core
  synopsis: >
    Artur Paz Semedo, a billing clerk at a historic Lisbon arms factory who
    has spent nearly twenty years invoicing light weapons and ammunition,
    begins to question the trade he has quietly served. Its title is drawn
    from Gil Vicente's Exortação da Guerra.
  note: >
    Left unfinished at Saramago's death: only the first three chapters and
    his working notes exist, found on his computer. Published in 2014 with
    those notes, contextual essays by Fernando Gómez Aguilera and Roberto
    Saviano, and illustrations by Günter Grass.
  sources:
    - https://www.publico.pt/2014/07/25/culturaipsilon/noticia/o-romance-inacabado-de-saramago-vai-ser-publicado-em-outubro-1664264
    - https://www.josesaramago.org/en/book/halberds-halberds-shotguns-shotguns/
    - https://pt.wikipedia.org/wiki/Alabardas
  images:
    cover: "https://covers.openlibrary.org/b/id/7395132-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL17316579W"

