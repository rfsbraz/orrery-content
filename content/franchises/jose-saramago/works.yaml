- id: jose-saramago/ensaio-sobre-a-cegueira
  title: "Ensaio sobre a Cegueira"
  authorIds: [jose-saramago]
  published: 1995
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    An unexplained epidemic of white blindness spreads through an unnamed
    city; the authorities confine the blind to an empty asylum, and one
    woman who keeps her sight becomes the eyes of the small group around
    her. Published in English simply as Blindness (1997), to Saramago's
    annoyance at the loss of "Essay on" from his own title; his best-known
    novel internationally. Fernando Meirelles's 2008 film adaptation opened
    the Cannes Film Festival, in competition for the Palme d'Or, the widest
    stage any Saramago adaptation has reached.
  sources:
    - https://pt.wikipedia.org/wiki/José_Saramago
    - https://en.wikipedia.org/wiki/José_Saramago
    - https://www.theguardian.com/books/2010/jun/18/jose-saramago-obituary
    - https://www.festival-cannes.com/en/2008/opening-film-also-in-competition-blindness-by-fernando-meirelles/
    - https://www.josesaramago.org/livro/ensaio-sobre-a-cegueira/
  images:
    cover: "https://covers.openlibrary.org/b/id/10482411-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL27420W"

