# Creative periods. There are none on record.
#
# Nobody divides Fernando Pessoa's work into named periods with boundary years.
# The one grouping he made of it himself is not a period at all, and the one
# periodisation Portuguese criticism does make sits inside a single heteronym's
# poetry, where an era span cannot reach it.
#
# THE SHAPE OF THIS SHELF, WHICH DECIDES WHAT AN ERA COULD EVEN COVER. An era is
# a span of publication years. Pessoa published eight items in his lifetime, the
# last of them in 1934; the other forty-six volumes here were made by editors out
# of the trunk between 1942 and 2015. So on this wing a period of the writing
# life would have to be plated over the years the books appeared, and for
# everything after 1935 those years belong to an editorial history rather than to
# a working writer.
#
# WHAT PESSOA HIMSELF DID WITH HIS OWN WORK. He divided it, in the "Tábua
# Bibliográfica" he printed in Presença no. 17 (December 1928), into two
# CATEGORIES and not into two periods: "O que Fernando Pessoa escreve pertence a
# duas categorias de obras, a que poderemos chamar ortónimas e heterónimas."
# Casa Fernando Pessoa quotes exactly that passage as his account of his own
# shelf. The division is by which invented author signed the book, it carries no
# dates, and this wing already holds it on every entry as `heteronym` and
# `publishedAs`.
#   https://casafernandopessoa.pt/pt/fernando-pessoa/obra/fernando-pessoa
#
# THE ISMS ARE HIS AND COVER NO BOOK HERE. Infopédia lists the literary currents
# as ones he made himself: "várias correntes literárias (todas por si criadas e
# teorizadas, como o paulismo, o intersecionismo ou o sensacionismo)". They
# belong to roughly 1913-1917 and to poems that appeared in magazines. The first
# volume on this shelf is Antinous, 1918. An era for any of them would contain
# no books.
#   https://www.infopedia.pt/artigos/$fernando-pessoa
#
# THE REFERENCE WORKS RUN THE CAREER UNBROKEN.
#
#  - Infopédia names no phase and warns against looking for one: "Dificilmente se
#    pode chegar a sínteses simplistas diante de um autor que, além da obra
#    assinada com o seu próprio nome, criou vários autores aparentemente
#    autónomos".
#  - Britannica is chronological and periodises only the reception: "Fame came to
#    Pessoa posthumously, when his extraordinarily imaginative poems first
#    attracted attention in both Portugal and Brazil in the 1940s." Read at
#    https://web.archive.org/web/20231202162447/https://www.britannica.com/biography/Fernando-Pessoa
#    because the live article refuses the request.
#  - The Poetry Foundation and the Academy of American Poets biographies are the
#    same shape, a life told forward with no phases named
#    (https://www.poetryfoundation.org/poets/fernando-pessoa,
#    https://poets.org/poet/fernando-pessoa).
#  - Portuguese Wikipedia asserts phases without producing any: "A obra ortónima
#    de Pessoa passou por diferentes fases", and then names influences -
#    theosophy, the Rosicrucians, symbolism - instead of dating a single one
#    (https://pt.wikipedia.org/wiki/Fernando_Pessoa).
#
# THE ONE RECEIVED PERIODISATION IN PESSOA STUDIES IS INSIDE ÁLVARO DE CAMPOS,
# and it is explicitly the only one: "Entre todos os heterónimos, Álvaro de
# Campos foi o único a manifestar fases poéticas diferentes. Houve três fases
# distintas na sua obra" - a decadentist opening under symbolism, then the "fase
# sensacionista" of the futurist odes, then the nihilist or intimist late manner
# of "Tabacaria". That division is settled, taught and named. It also periodises
# poems written between 1914 and 1935 which reach this shelf inside one volume,
# Poesias de Álvaro de Campos (1944), so there is no span of publication years
# for it to be drawn across.
#   https://pt.wikipedia.org/wiki/%C3%81lvaro_de_Campos
#
# THE TWO CANDIDATE CUTS IN THE WRITING LIFE.
#
#  - 1914, THE DIA TRIUNFAL, IS THE HINGE OF THE LIFE AND CUTS NOTHING ON THIS
#    SHELF. Every account of Pessoa turns on 8 March 1914 and on Caeiro
#    appearing, and it is on the author entity as a life event. As an era
#    boundary it has no books on its near side: the first volume here is 1918,
#    four years later.
#  - 1923, THE OLISIPO SEIZURE, IS DATED AND REAL AND STILL NOT A PERIOD. The
#    Governo Civil de Lisboa ordered the Botto and Leal books seized in March
#    1923 and the press did not survive it; that is a life event here too. As a
#    boundary it fails twice. No source periodises his work at it, and Olisipo
#    printed two of the eight lifetime items (English Poems I-II and English
#    Poems III, both 1921), so a period named for the press would describe two
#    books out of fifty-four.
#
# THE POSTHUMOUS PROGRAMME, WHICH IS WHERE FORTY-SIX OF THE FIFTY-FOUR ARE.
#
#  - CASA FERNANDO PESSOA STATES IT AS ONE UNBROKEN PROGRAMME. The work "tem
#    vindo a ser editada em vários livros desde 1942", with the long gaps between
#    volumes explained by how slow the papers are to read and order. Eighty
#    years, no phases
#    (https://casafernandopessoa.pt/pt/fernando-pessoa/obra).
#  - THE ONLY DIVISION OF THE PUBLICATION RECORD ANY SOURCE DRAWS carries no
#    name. Arquivo Pessoa's "Bibliografia geral de referência" splits the primary
#    bibliography into "A. Bibliografia activa (até 1997)" and "B. Bibliografia
#    activa (desde 1997)", and gives neither list a title or a reason. What the
#    two lists show is a change of house: Ática and its contemporaries in A,
#    Assírio & Alvim almost throughout B
#    (http://arquivopessoa.net/info/bibliografia).
#  - "THE ÁTICA YEARS" HAS A SOURCED BEGINNING AND NO SOURCED END. Ática's Obras
#    Completas begin in 1942 and the house is still issuing first editions in
#    1982, with the Livro do Desassossego. Nothing in the record closes the run,
#    so the closing year would have to be invented.
#  - "THE CRITICAL-EDITION YEARS" WOULD BE NAMED AFTER BOOKS THIS BIBLIOGRAPHY
#    DOES NOT LIST. The Imprensa Nacional-Casa da Moeda critical edition is real
#    and running by 1990 (Poemas de Álvaro de Campos, ed. Cleonice Berardinelli,
#    1990; Poemas de Ricardo Reis, ed. Luiz Fagundes Duarte, 1994), but those
#    volumes re-establish bodies of text already published, which works.yaml
#    files as rival editions of one work rather than as works of their own.
#  - THE 1979 TRANSFER OF THE ESPÓLIO to the Biblioteca Nacional is dated,
#    sourced and consequential, and it is carried here as an event. No source
#    uses it to divide the editing into periods.
#  - CASA FERNANDO PESSOA'S OWN EXHIBITION ON THE AFTERLIFE DIVIDES IT BY STRAND,
#    NOT BY PERIOD. "A arca eterna: Fernando Pessoa e a posteridade", curated by
#    Antonio Sáez Delgado and open from 27 November 2025, walks "as 'vidas' de
#    Pessoa após 1935" through the biographies, the editing of the writings, the
#    part critics and editors played in building the work, and the translations and
#    international receptions
#    (https://casafernandopessoa.pt/pt/cfp/A-Arca-Eterna-Fernando-Pessoa-e-a-Posteridade).
#
# The lifetime books and the posthumous ones are two different things, and the
# shelf already says so where it should: works.yaml sections them, the death is
# dated 30 November 1935 on the author entity, and the seven-year silence before
# 1942 shows on the timeline by itself. A death is not a creative period, and
# plating it would tile the whole span with a distinction the dates already make.
#
# The question was put in Portuguese, which is the language of his criticism, his
# reference works and the institutions that hold him, and in English for the
# anglophone reference works and the translation history.
#
# eras: [] is the honest record of a writer who grouped his own work by invented
# author instead of by period, and whose books have been coming out for eighty
# years under an editorial programme nobody has cut into named phases.
[]
