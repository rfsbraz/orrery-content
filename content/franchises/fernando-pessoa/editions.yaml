# Editions - the concrete books behind the bibliography, in Portuguese and in
# English. Works are abstract; these are objects with a publisher, a year and,
# where one exists, an ISBN.
#
# TITLES. Almost everything on this shelf was written in Portuguese and is
# bought in Portuguese, so the work title IS the published title and `title` is
# omitted on every pt-PT entry, per SCHEMA.md. `title` appears only on the
# English editions, where it records what is actually printed on the jacket
# ("The Book of Disquiet", "Message", "The Keeper of Sheep"). One reversal is
# worth knowing: Lisboa: O Que o Turista Deve Ver was written in English and
# reached print in Portuguese first, so the Portuguese edition below carries a
# translator (Maria Amélia Santos Gomes) and the English one does not.
#
# NO ISBN BEFORE 1970, AND NOT IN PORTUGAL FOR YEARS AFTER. The five books
# Pessoa published in his lifetime (1918-1934) and the first waves out of the
# trunk (Ática, 1942-1980) predate the ISBN entirely; the Biblioteca Nacional's
# records for them carry no number, and neither do the entries here. Three
# concrete cases, all confirmed against BNP records: the 1982 Ática first
# edition of the Livro do Desassossego has no ISBN; the 1952 Ática Poemas
# Dramáticos has none, and its 1997 reimpression is the first printing that
# does; Da República (Ática, 1978) and Poesias Inéditas (1919-1930) are sold
# today under bare 13-digit EANs (5600001250470, 0135000124997) that are not
# ISBNs at all and are therefore not recorded. Where a work's only buyable
# object is a later printing, that printing is what appears below, and the
# first edition's imprint is named in the note.
#
# THE LIVRO DO DESASSOSSEGO, AND WHY ITS ENTRIES NAME AN EDITOR
#
# works.yaml dates this work to 1982, Jacinto do Prado Coelho's first full
# edition for Ática, and rules that the rival reconstructions are editions of
# one work rather than separate works. That ruling is what makes this file the
# place where the difference between them has to be recorded, because there is
# nowhere else for it to live. Every entry below therefore names its editor and
# the Portuguese text it descends from. The differences are not cosmetic: the
# editions disagree about which fragments belong in the book, in what order
# they stand, and in one case who wrote them - Teresa Sobral Cunha splits the
# book between two ascribed authors, Vicente Guedes for the early material and
# Bernardo Soares for the rest.
#
# Restricting the file to the 1982 arrangement alone would leave the work with
# no buyable object at all: the 1982 Ática two-volume first edition has no
# ISBN, its 1997 second edition (Ática, ISBN 972-617-069-9 and 972-617-131-8)
# is out of print, and no house has reprinted that arrangement since. The
# reconstructions that are in print are therefore the ones listed, each labelled
# with whose it is.
#
# The consequence for the English editions is the substantive part, and it is
# documented rather than inferred. They do not descend from a single Portuguese
# text:
#
#   Carcanet 1997, tr. Richard Zenith          -> Prado Coelho's 1982 Ática text
#                                                 plus 48 further fragments and
#                                                 some previously unpublished
#                                                 (Carcanet's own catalogue)
#   Serpent's Tail 1991, tr. Margaret Jull Costa -> Maria José de Lancastre's
#                                                 1986 Italian Feltrinelli
#                                                 edition, not a Portuguese one
#   Allen Lane 2001 / Penguin Classics 2002,
#     tr. Richard Zenith                       -> Zenith's OWN 1998 Assírio &
#                                                 Alvim reordering
#   New Directions 2017 / Serpent's Tail 2018,
#     tr. Margaret Jull Costa                  -> Jerónimo Pizarro's 2013
#                                                 Tinta-da-china edition
#
# So the two English editions in print are translations of different books. A
# reader choosing between them is choosing an editor before they choose a
# translator, and the notes below say which is which. The schema has no field
# for this - there is no `textVariant` or `editorialArrangement` - so it lives
# in the notes, which is the same accommodation the abridged-Christie cases get.
#
# SOURCES, in order of authority. Publisher catalogues where the
# publisher still lists the book (New Directions, Carcanet, Shearsman); the
# Biblioteca Nacional de Portugal's ipac20 catalogue for Portuguese imprints,
# editors and first-edition years; Bertrand's per-product bibliographic records
# for the ISBN, format and edition date of what is on sale now; and the
# Library of Congress / Harvard / Columbia MARC records surfaced through Open
# Library for a second reading of the Portuguese ISBNs. Project Gutenberg for
# the public-domain English originals.
#
# Every ISBN-13 below passes its check digit. Every pt-PT entry carries a
# Portuguese registrant prefix (978-972-*, 978-989-*); no Brazilian editions
# (978-85-*, 978-65-*) are recorded, and Pessoa has a large Brazilian backlist
# that would be wrong to offer a Lisbon reader.
#
# SINGLE-SOURCED ENTRIES. Most ISBNs below are corroborated twice. Seventeen
# rest on Bertrand's product record alone, because the BNP holds the volume
# without an ISBN and Open Library holds no edition record for it: the two
# Livro do Desassossego editions of 2023, the four Assírio & Alvim volumes of
# 1998-2003 whose numbers the BNP does not carry, Poesias de Álvaro de Campos,
# Odes de Ricardo Reis, Páginas de Estética e de Teoria e Crítica Literárias,
# both Textos Filosóficos volumes, Poemas Ingleses, Sobre Portugal, Heróstrato,
# Crítica, Teoria da Heteronímia, Associações Secretas, O Interregno,
# Correspondência 1923-1935 and Cartas a Armando Côrtes-Rodrigues. Each says so
# where it matters. Bertrand's records are per-product and structured, but
# Bertrand and WOOK are the same house, so a WOOK agreement would not be an
# independent second reading and was not treated as one.
#
# COVERAGE: 42 of 54 works have at least one edition; 58 entries in all. The
# twelve without are the volumes with no separately buyable modern object:
# Poesias (1942), Páginas de Doutrina Estética, both Poesias Inéditas volumes,
# Cartas a João Gaspar Simões, Páginas Íntimas e de Auto-Interpretação, Da
# República, Ultimatum e Páginas de Sociologia Política, and the four esoteric
# volumes established by Pedro Teixeira da Mota in 1988-89 (A Grande Alma
# Portuguesa; Moral, Regras de Vida; Rosea Cruz; Poesia Profética, Mágica e
# Espiritual). Several are still printed by Ática under bare EANs rather than
# ISBNs; the rest are out of print and carried by no Portuguese catalogue.
# That is a fact about the market, not an omission.

