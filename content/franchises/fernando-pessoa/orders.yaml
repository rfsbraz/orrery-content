# ADDITIONAL reading orders only. The DEFAULT order (every work, publication-
# chronological) is derived from works.yaml and is not written here.
#
# WHY THIS WING HAS ONE. Forty-six of the fifty-four works below the default
# order are posthumous: editors reached the trunk in the order they reached it,
# so first-publication year records when a book was MADE out of the papers, not
# when the text was written or how it was meant to be read. The one grouping
# this shelf is organised by outside publication is the name on the cover, and
# that grouping is received rather than devised here. Three independent records
# carry it:
#
#   - The Portuguese national curriculum. "Aprendizagens Essenciais |
#     Articulação com o Perfil dos Alunos, 12.º ano, Português" (Direção-Geral
#     da Educação, August 2018, in force), Anexo 1, "Lista de obras e textos
#     para educação literária", sets under OBRAS DE FERNANDO PESSOA exactly:
#     "Poesia lírica: Poesia do ortónimo (escolher seis poemas), poesia dos
#     heterónimos (escolher dois poemas de Alberto Caeiro, três poemas de
#     Ricardo Reis e três poemas de Álvaro de Campos)" and "Poesia épica:
#     Mensagem (escolher seis poemas)". That is the order in which every
#     Portuguese school-leaver meets him, and the order followed below.
#   - Casa Fernando Pessoa, the museum in his last house, divides its "Obra"
#     section into five names and no other axis: Fernando Pessoa, Álvaro de
#     Campos, Ricardo Reis, Alberto Caeiro, Bernardo Soares.
#   - The publishing programmes do the same. Ática issued the trunk's poetry
#     one signature to a volume from 1942 (Poesias, Poesias de Álvaro de
#     Campos, Poemas de Alberto Caeiro, Odes de Ricardo Reis), and Assírio &
#     Alvim's later "Poesia" series repeats the arrangement one author at a
#     time (Caeiro 2001, Campos 2002, Reis 2003).
#
# The internal sequence Caeiro, Reis, Campos is the one Pessoa gave in his
# letter to Adolfo Casais Monteiro of 13 January 1935, where Caeiro appears
# first and is the master the others are measured against; the curriculum lists
# the three in that same sequence.
#
# WHAT WAS CONSIDERED AND IS NOT HERE. An order by date of writing, which is
# the order a reader of this shelf would most want, because it would undo the
# posthumous scrambling entirely. The record will not support one: the
# composition dates of the posthumous volumes are ranges rather than points,
# many are contested between editors, and no published chronology sequences the
# volumes that way. A "lifetime books only" order, which is the derived default
# filtered to 1918-1934 and reorders nothing. And an order following Ática's
# Obras Completas numbering, which does not survive contact with the record:
# the Arquivo Pessoa bibliography lists those volumes without series numbers,
# and their years are their publication years, so such an order would be the
# derived default rewritten by hand.

- id: fernando-pessoa/by-signature
  name: By the name on the cover
  type: curated
  source: canon
  rationale: >
    Pessoa sorted his own work by which invented author signed it, and Portugal
    still reads him that way: the school syllabus, the museum in his last house
    and every publisher who has gathered the poetry all arrange it one name at a
    time. Publication order cannot show that, because these books came out of a
    trunk in whatever order editors got to them, decades apart and in no
    relation to each other. This order puts one volume per name back into the
    sequence the syllabus sets: the poetry Pessoa signed himself, then the
    shepherd Alberto Caeiro, the classicist Ricardo Reis and the naval engineer
    Álvaro de Campos, then [[work:fernando-pessoa/mensagem|Mensagem]], and last
    the two prose books left by the half-invented men, Bernardo Soares and the
    Barão de Teive, whose personalities are Pessoa's own with pieces cut away
    rather than other men's entirely. Each voice arrives whole, with
    its own manner and its own argument with the others, instead of a decade
    apart. It costs a great deal: seven volumes out of fifty-four, which leaves
    out the criticism, the politics, the occult writing, the theatre, the
    fiction and the letters, most of this shelf. It also hides the one thing the
    default order tells better than anything else, that this body of work was
    assembled in public across seventy years by people reading a dead man's
    handwriting.
  orderedWorkIds:
    - fernando-pessoa/poesias
    - fernando-pessoa/poemas-de-alberto-caeiro
    - fernando-pessoa/odes-de-ricardo-reis
    - fernando-pessoa/poesias-de-alvaro-de-campos
    - fernando-pessoa/mensagem
    - fernando-pessoa/livro-do-desassossego
    - fernando-pessoa/a-educacao-do-estoico
  debated:
    - "Where the poetry signed Fernando Pessoa himself belongs is not settled. The Portuguese syllabus puts it first, ahead of the invented authors, and this order follows it because that is the one document that actually sets out a sequence. Pessoa's own account runs the other way: Caeiro appeared first and is the master every other voice is positioned against, his own included, which is the argument for opening with Poemas de Alberto Caeiro instead."
    - "[[work:fernando-pessoa/o-guardador-de-rebanhos|O Guardador de Rebanhos]] is deliberately not listed separately here. Portuguese bibliography catalogues it as a book of 1925, from its appearance in the magazine Athena, and it is also the opening third of [[work:fernando-pessoa/poemas-de-alberto-caeiro|Poemas de Alberto Caeiro]] (1946), which this order carries instead. A reader walking publication order meets those forty-nine poems twice, six volumes and twenty-one years apart."
    - "[[work:fernando-pessoa/a-educacao-do-estoico|A Educação do Estóico]] is the one signature no guide places. The syllabus and Casa Fernando Pessoa both stop at five names and the Barão de Teive is not among them. It stands last here because it is the latest of these volumes to reach print, and because it reads against [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]: one man who cannot stop writing about nothing, and one who burned everything he wrote."
    - "The orthonymous poetry did not stop at the 1942 Poesias. Poesias Inéditas (1930-1935), Poesias Inéditas (1919-1930) and Novas Poesias Inéditas are three later supplements to the same body, and Poemas Ingleses gathers the English verse. On the orthonymous side this order carries only the 1942 volume and Mensagem, so all four sit outside it; the derived default has them in their own years."
  sources:
    - "https://www.dge.mec.pt/sites/default/files/Curriculo/Aprendizagens_Essenciais/12_portugues.pdf"
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra"
    - "http://arquivopessoa.net/info/bibliografia"
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/alberto-caeiro"
