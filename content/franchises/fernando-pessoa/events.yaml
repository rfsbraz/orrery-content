# FRANCHISE events: what happened to the BOOKS. Pessoa's own life is on the
# author entity at content/authors/fernando-pessoa.yaml, and it ends in 1935.
#
# This file exists because the shelf does not. Pessoa published five books and
# died with a trunk of more than 25,000 sheets, so forty-nine of the fifty-four
# works in this wing were made by editors after his death, and the years 1936 to
# 2015 are the story of that trunk being read. Without these entries a reader
# walks eighty years of books with nothing around them.
#
# The spine of the chronology below is Casa Fernando Pessoa's own "Cronologia da
# vida de Fernando Pessoa", which continues past 1935 and dates the posthumous
# programme year by year. Where a second source exists it is cited with it;
# where the sources disagree, the entry says so on itself.
#
# Append-only file; parallel branches merge here.

- id: pessoa-presenca-homage-1936
  organisation: floating-object
  illustration_type: book-object
  images_required: 1
  date: 1936
  title: presença gives him a whole issue
  scope: culture
  reach: franchise
  impact: med
  description: >
    Within a year of the funeral the Coimbra magazine presença, which had
    printed "Tabacaria" and "Autopsicografia" and whose editor Adolfo Casais
    Monteiro had received the January 1935 letter explaining the heteronyms,
    devoted an entire number to Pessoa. The presença group is the reason there
    was anything to publish afterwards: its critics knew what was in the trunk
    because he had told them, and two of them, Casais Monteiro and João Gaspar
    Simões, edited the first books out of it.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"

- id: pessoa-atica-obras-completas-1942
  organisation: passage
  illustration_type: serial-contact-sheet
  images_required: 1
  date: 1942
  title: The trunk starts coming out
  scope: industry
  reach: franchise
  impact: high
  description: >
    Two things happened in 1942, seven years after the death and after a silence
    in which nothing of his had been printed. Editorial Confluência issued an
    anthology assembled by Adolfo Casais Monteiro out of the hundred-odd poems
    Pessoa had published in magazines during his life, and Ática began the
    Obras Completas, five volumes of poetry between 1942 and 1946 edited by
    João Gaspar Simões and Luiz de Montalvor, drawing for the first time on the
    unpublished papers in the trunk. Every posthumous volume on this shelf
    descends from that programme, and the reason so many of them are called
    Páginas or Poesias Inéditas is that Ática kept going back to the same
    papers.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
    - "http://arquivopessoa.net/info/bibliografia"

- id: pessoa-first-study-1949
  organisation: beside
  illustration_type: network-constellation
  images_required: 1
  modifier: anchor-with-satellites
  date: 1949
  title: The first book about him
  scope: culture
  reach: franchise
  impact: med
  description: >
    Jacinto do Prado Coelho's Diversidade e Unidade em Fernando Pessoa (Verbo)
    was the first substantial study of the work, and it set the question the
    criticism has argued about ever since: whether the heteronyms are one mind
    or several. Prado Coelho went on to edit the first
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]
    thirty-three years later.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"

- id: pessoa-first-biography-1950
  organisation: artifact-spread
  illustration_type: manuscript-proof
  images_required: 1
  modifier: fold-reveal
  date: 1950
  title: His own editor writes the life
  scope: culture
  reach: franchise
  impact: med
  description: >
    Vida e Obra de Fernando Pessoa (Bertrand), by João Gaspar Simões, the
    presença critic who was at that moment editing the Ática volumes. The first
    biography of Pessoa was therefore written by the man deciding what of him
    got printed, from papers nobody else had seen, and it fixed the popular
    image of a clerk with no life, which the correspondence published half a
    century later has been steadily complicating.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"

- id: pessoa-first-spanish-caeiro-1957
  organisation: full-bleed-vista
  illustration_type: map-route
  images_required: 1
  date: 1957
  title: Caeiro crosses the border first
  scope: culture
  reach: franchise
  impact: med
  description: >
    Poemas de Alberto Caeiro, selected, translated and prefaced by Ángel Crespo
    for the Adonais collection in Madrid (Rialp), was the first book of Pessoa's
    to appear in Spanish, and it went out under the shepherd's name rather than
    his own. The pattern held: outside Portugal the heteronyms have often
    arrived before the man, which is why readers meet Caeiro or Bernardo Soares
    and only afterwards find out who wrote them.
  # From the Spanish Wikipedia bibliography of translations, which is the
  # earliest Spanish edition it lists.
  spoilerAfter: null
  sources:
    - "https://es.wikipedia.org/wiki/Fernando_Pessoa"

- id: pessoa-octavio-paz-1962
  organisation: artifact-spread
  illustration_type: book-object
  images_required: 1
  date: 1962
  title: Octavio Paz makes him a Latin American writer
  scope: culture
  reach: franchise
  impact: high
  description: >
    Paz selected, translated and prefaced an Antología for the Universidad
    Nacional Autónoma de México, and his introduction is the reading that
    carried Pessoa into Spanish for good: "los poetas no tienen biografía; su
    obra es una biografía", and of Pessoa in particular, "nada en su vida es
    sorprendente, nada excepto sus poemas". A Nobel laureate arguing that the
    life is empty and the work is the life is where the popular idea of Pessoa
    as a man who did nothing but invent people comes from, and it is worth
    reading against the 1923 seizure and the 1935 newspaper fight.
  spoilerAfter: null
  sources:
    - "https://es.wikipedia.org/wiki/Fernando_Pessoa"
    - "https://en.wikipedia.org/wiki/Fernando_Pessoa"

- id: pessoa-lourenco-revisitado-1973
  organisation: beside
  illustration_type: process-diagram
  images_required: 1
  date: 1973
  title: Pessoa Revisitado
  scope: culture
  reach: franchise
  impact: med
  description: >
    Eduardo Lourenço's Pessoa Revisitado (Inova) broke with the psychological
    reading Gaspar Simões had installed, treating the heteronyms as a structure
    the poetry needed rather than as symptoms of the man who made them. It is
    the study most later Portuguese criticism starts from, and Lourenço wrote
    the preface to
    [[work:fernando-pessoa/fausto-tragedia-subjectiva|Fausto]] when it was
    finally assembled fifteen years afterwards.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"

- id: pessoa-cartas-de-amor-1978
  organisation: diptych
  illustration_type: manuscript-proof
  images_required: 2
  date: 1978
  title: The love letters are published while she is still alive
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:fernando-pessoa/cartas-de-amor|Cartas de Amor]] put the letters to
    Ophélia Queiroz in bookshops fifty-eight years after the first of them was
    written. Ophélia was alive, and lived until 1991: the one woman in Pessoa's
    life outlived the publication of her own courtship by thirteen years and
    could be interviewed about a book whose author had been dead since 1935.
    The letters are also where readers first met Álvaro de Campos writing to a
    real person.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
    - "http://arquivopessoa.net/info/bibliografia"

- id: pessoa-espolio-bnp-1979
  organisation: full-bleed-vista
  illustration_type: place-portrait
  images_required: 1
  date: 1979
  title: The State buys the trunk
  scope: industry
  reach: franchise
  impact: high
  description: >
    The Portuguese State bought the espólio from Pessoa's half-sister Henriqueta
    Madalena Nogueira Rosa Dias, who had kept it since 1935, and it was
    transferred to the Biblioteca Nacional de Portugal. Until then the papers
    behind every posthumous volume had been in a family's flat, and access to
    them depended on the family; from 1979 they are a public archive that
    anyone with a reader's card can order, which is why the editing on this
    shelf changes character after this date, from selections to critical
    editions.
  # The English Wikipedia dates the papers' arrival at the National Library to
  # 1988. That is the year the Câmara Municipal de Lisboa bought a separate
  # thing, the personal library and furniture that became the Casa Fernando
  # Pessoa; the 1979 purchase of the manuscript espólio by the State is the one
  # Casa Fernando Pessoa's chronology records, and it names the seller.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
    - "https://pt.wikipedia.org/wiki/Fernando_Pessoa"

- id: pessoa-desassossego-first-edition-1982
  organisation: layered-stack
  illustration_type: archive-stack
  images_required: 1
  date: 1982
  title: The Livro do Desassossego finally becomes a book
  scope: industry
  reach: franchise
  impact: high
  description: >
    Forty-seven years after his death, Ática published the first full
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]], in two
    volumes, organised by Jacinto do Prado Coelho from transcriptions by Maria
    Aliete Galhoz and Teresa Sobral Cunha. A thin selection had appeared in 1961,
    edited by Pedro Veiga, and had left no mark. What followed 1982 did: the
    book most people now mean when they say Pessoa was unavailable for the first
    forty-seven years of his posthumous career, and every rival reconstruction
    of it, and every translation, comes after this date.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
    - "https://pt.wikipedia.org/wiki/Livro_do_Desassossego"

- id: pessoa-saramago-ricardo-reis-1984
  organisation: medallion
  illustration_type: portrait-of-absence
  images_required: 1
  date: 1984
  title: Saramago gives Ricardo Reis a death
  scope: culture
  reach: franchise
  impact: med
  description: >
    José Saramago's O Ano da Morte de Ricardo Reis brings the heteronym back
    from Brazil to Lisbon in 1936 and kills him there, haunted by Pessoa's
    ghost, through a year of rising fascism. Pessoa never wrote Reis an ending,
    so the one most readers carry was invented fifty years later by another
    novelist, and it is not part of Reis's authored biography. A future Nobel
    laureate treating an invented author as a character available to anyone is
    also the clearest measure of what the heteronyms had become by the 1980s.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Saramago"
    - "https://en.wikipedia.org/wiki/Jos%C3%A9_Saramago"

- id: pessoa-jeronimos-1985
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 1985
  title: Moved to the Jerónimos, next to Camões
  scope: author-life
  reach: franchise
  impact: high
  description: >
    On the fiftieth anniversary of his death the State moved Pessoa's remains
    from the Prazeres cemetery to the Mosteiro dos Jerónimos in Belém, in an
    official ceremony. The tomb, by Lagoa Henriques, stands in the north wing of
    the lower cloister, in the building that already held Vasco da Gama and Luís
    de Camões. Fifty years after a funeral attended by a handful of friends, the
    author of [[work:fernando-pessoa/mensagem|Mensagem]] was installed in the
    national pantheon of the discoveries his one Portuguese book had written
    about.
  # The Portuguese Wikipedia article on Pessoa places the transfer at the 1988
  # birth centenary. Two independent sources give 1985 and tie it to the
  # fiftieth anniversary of the death: Casa Fernando Pessoa's chronology and the
  # Jerónimos article, which dates the Lagoa Henriques tomb to 1985.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
    - "https://pt.wikipedia.org/wiki/Mosteiro_dos_Jer%C3%B3nimos"

- id: pessoa-centenary-1988
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 1988
  title: The centenary, and the city buys his library
  scope: culture
  reach: franchise
  impact: med
  description: >
    The hundredth anniversary of the birth was marked with colloquia,
    exhibitions and a wave of new editions, by which point he was read,
    translated and studied worldwide rather than nationally. In the same year
    the Câmara Municipal de Lisboa bought from the family a lot of personal
    objects, two pieces of furniture and around twelve hundred books from his
    own library, the annotated English and Portuguese volumes he had read. That
    purchase, distinct from the manuscript espólio the State had bought in 1979,
    is what the Casa Fernando Pessoa opened with five years later.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"

- id: pessoa-disquiet-four-english-1991
  organisation: strip
  illustration_type: serial-contact-sheet
  images_required: 1
  date: 1991
  title: The Book of Disquiet arrives in English four times at once
  scope: industry
  reach: franchise
  impact: high
  description: >
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]] had
    gone into Spanish in 1984, German in 1985, Italian in 1986 and French in
    1988; in 1991 four separate English versions appeared in the same year,
    translated by Richard Zenith, Iain Watson, Alfred Mac Adam and Margaret Jull
    Costa. Since Pessoa left the fragments unordered and every editor rebuilds
    the book differently, the four are not competing translations of one text so
    much as four different books, which is how an anglophone reader can own two
    copies of the Book of Disquiet that barely overlap.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/The_Book_of_Disquiet"

- id: pessoa-casa-opens-1993
  organisation: beside
  illustration_type: domestic-interior
  images_required: 1
  date: 1993-11-30
  title: The house on the Rua Coelho da Rocha opens
  scope: culture
  reach: franchise
  impact: med
  description: >
    Casa Fernando Pessoa opened on 30 November 1993, the anniversary of his
    death, at Rua Coelho da Rocha 16-18 in Campo de Ourique: the building he
    rented in his mother's name in March 1920 and lived in until he died. The
    Câmara Municipal de Lisboa had bought it in the late 1980s in poor
    condition and at risk of demolition. Its holding of record is his own
    library, roughly thirteen hundred titles, mostly in English and heavily
    annotated, online since 2010.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Casa_Fernando_Pessoa"
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"

- id: pessoa-western-canon-1994
  organisation: medallion
  illustration_type: emblem-seal
  images_required: 1
  date: 1994
  title: Bloom puts him among the twenty-six
  scope: culture
  reach: franchise
  impact: med
  description: >
    Harold Bloom's The Western Canon named twenty-six writers as the centre of
    Western literature and Pessoa was one of them, alongside Shakespeare,
    Cervantes, Tolstoy and Joyce. Fifty-nine years after a death at which he was
    a minor Lisbon figure known to a magazine circle, an American critic writing
    for a general audience treated him as unarguable.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/The_Western_Canon"

- id: pessoa-zenith-desassossego-1998
  organisation: artifact-spread
  illustration_type: book-object
  images_required: 1
  date: 1998
  title: Zenith's reconstruction becomes the standard text
  scope: industry
  reach: franchise
  impact: med
  description: >
    Richard Zenith's single-volume
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]] for
    Assírio & Alvim is the version most Portuguese readers have held since, and
    the basis of the English edition he published for Penguin three years later.
    It is one reconstruction among several rather than a definitive text, which
    is the permanent condition of this book: there is no manuscript order to
    restore, so the editor decides what the reader experiences.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Livro_do_Desassossego"
    - "https://en.wikipedia.org/wiki/The_Book_of_Disquiet"

- id: pessoa-bokklubben-2002
  organisation: marginalia
  illustration_type: isolated-object
  images_required: 1
  date: 2002
  title: A hundred writers vote the Disquiet into the world's best
  scope: culture
  reach: franchise
  impact: low
  description: >
    The Norwegian Book Club's list of the hundred best books of all time, chosen
    by a hundred writers from fifty-four countries, included the
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]]. A poll
    is a poll, but the voters were novelists and poets rather than critics, and
    it registers how completely a book with no fixed text, published in 1982
    from an unsorted heap, had entered the working canon of people who write.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Bokklubben_World_Library"
    - "https://en.wikipedia.org/wiki/The_Book_of_Disquiet"

- id: pessoa-critical-desassossego-2010
  organisation: beside
  illustration_type: workplace-workshop
  images_required: 1
  date: 2010
  title: The critical edition goes back to the papers
  scope: industry
  reach: franchise
  impact: med
  description: >
    Jerónimo Pizarro's critical edition for the Imprensa Nacional-Casa da Moeda,
    in two volumes, re-established the
    [[work:fernando-pessoa/livro-do-desassossego|Livro do Desassossego]] from the
    manuscripts in the Biblioteca Nacional rather than from the earlier
    editors' arrangements, and reached general readers as a Tinta-da-china trade
    edition in 2013. It belongs to the phase the 1979 purchase made possible:
    the trunk is a public archive, so an editor's choices can be checked against
    the sheets instead of taken on trust.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Livro_do_Desassossego"

- id: pessoa-national-treasure-2019
  organisation: full-bleed-vista
  illustration_type: establishing-landscape
  images_required: 1
  date: 2019
  title: The papers are classified a national treasure
  scope: industry
  reach: franchise
  impact: med
  description: >
    The documentary espólio was classified a good of national interest and
    designated a national treasure, the strongest protection Portuguese
    heritage law gives a collection. Eighty-four years after a trunk of loose
    sheets was left in a flat in Campo de Ourique, the unpublished remainder of
    it is legally on a level with a monument, and it is still being edited: the
    volumes at the end of this shelf are drawn from papers nobody had read when
    the Casa Fernando Pessoa opened.
  spoilerAfter: null
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
