# Bibliography (Works) - the abstract books; editions/covers are separate.
# IDs are STABLE and permanent (user data references them). Titles are the
# ORIGINAL Portuguese or English as first published; prose/synopses are in
# English.
#
# WHAT COUNTS AS A WORK HERE. Pessoa published five books in his lifetime and
# left more than 25,000 sheets in a trunk. Almost everything else on this shelf
# is a book an editor made after his death out of those papers, which forces a
# rule this wing's spine depends on:
#
#   A work is a published VOLUME, dated to its first edition. Where several
#   later editors reconstruct the SAME body of text differently (the Livro do
#   Desassossego, the Caeiro and Campos and Reis poetry), those rival
#   reconstructions are EDITIONS of the one work, not separate works. Where a
#   volume gathers a body of text for the first time, it is a work.
#
# One deliberate exception: O Guardador de Rebanhos is listed as its own work at
# its 1925 magazine publication as well as inside Poemas de Alberto Caeiro
# (1946), because Portuguese bibliography catalogues it as a book of 1925 in its
# own right and because it is the text Pessoa named on the day the heteronyms
# began. Both entries carry a note pointing at the other, and the 1925 entry
# carries containedIn: fernando-pessoa/poemas-de-alberto-caeiro (SCHEMA.md,
# orrery#168), so the derived default order and completion tracking treat
# reading the 1946 collection as covering it, rather than asking a reader to
# walk the same 49 poems twice.
#
# DATING. `published` is the year the text first appeared complete, not the year
# of the volume that later carried it. Two entries below therefore sit at their
# magazine dates: O Guardador de Rebanhos (Athena, 1925; in book form 1946) and
# O Banqueiro Anarquista (Contemporânea, 1922; first standalone book 1999).
#
# NOT LISTED, and why. Periodical appearances are not works here: the Orpheu
# odes (1915), the "Ultimatum" in Portugal Futurista (1917), "Tabacaria" in
# presença (1933), O Marinheiro in A Águia (1915). They are the events of the
# life, and they are named in the synopses of the volumes that later collected
# them. Rival critical reconstructions of a body already listed are also absent:
# Álvaro de Campos - Livro de Versos (ed. Teresa Rita Lopes, Estampa, 1993),
# Poemas Completos de Alberto Caeiro (ed. Teresa Sobral Cunha, Presença, 1994),
# Poemas de Álvaro de Campos and Poemas de Ricardo Reis (the INCM critical
# editions of 1990 and 1994), and the several Europa-América and Lello
# gatherings of the 1980s, which redistribute texts already published by Ática.
#
# SOURCE. The publisher, editor and year of the posthumous volumes below come
# from the "Bibliografia geral de referência" of Arquivo Pessoa (the online form
# of MultiPessoa, co-edited by Casa Fernando Pessoa), which lists first editions
# with their editors. That bibliography closes in 2008: the volumes dated 2009
# and later come from the catalogue of the Biblioteca Nacional de Portugal,
# which is also the tiebreaker where two sources give different first-edition
# years. Casa Fernando Pessoa's own page counts five books published in his
# lifetime, all of them poetry, and names them; the 1928 pamphlet O Interregno
# and the 1922 magazine novella O Banqueiro Anarquista sit outside that count
# and are documented at the Biblioteca Nacional.
#
# HETERONYMS. Where a book carries an invented author's name on the cover, the
# entry uses `heteronym:` (pointing at content/authors/fernando-pessoa.yaml's
# heteronyms list) and `publishedAs:`. `authorIds` stays [fernando-pessoa]
# everywhere, because the real person who wrote all of it is one man.
#
# SUBSERIES is null on every entry, deliberately. The natural grouping inside
# this wing is by which invented author signed the book, and `heteronym` already
# carries exactly that; a parallel `subseries` on the same axis would give the
# wing two competing groupings of the same shelf.

# --- Published in his lifetime ---

- id: fernando-pessoa/antinous
  title: "Antinous"
  # No cover. Neither 1918 pamphlet is held with a jacket anywhere open, and
  # the two Open Library candidates fail on their own terms: the Serbian
  # Antinoj carries a bookseller's "RASPRODATO" banner burned into the image,
  # and the 2014 print-on-demand Antinous & David and Jonathan pairs this poem
  # with one by another writer.
  authorIds: [fernando-pessoa]
  published: 1918
  subseries: null
  canonTier: core
  format: poem
  synopsis: >
    A long poem in English, published as a sixteen-page pamphlet: the emperor
    Hadrian keeping vigil over the body of his drowned lover Antinous, and
    talking himself out of the fact of the death. One of the first two things
    Pessoa printed as a book, at his own expense.
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/fernando-pessoa"
    - "https://en.wikipedia.org/wiki/Fernando_Pessoa"

- id: fernando-pessoa/35-sonnets
  title: "35 Sonnets"
  authorIds: [fernando-pessoa]
  published: 1918
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Thirty-five English sonnets in a deliberately Elizabethan register, printed
    in Lisbon in the same year as Antinous and sent to the British press. The
    Times Literary Supplement noticed them, which was the closest thing to
    literary recognition Pessoa received outside Portugal in his lifetime.
  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/fernando-pessoa"
    - "https://en.wikipedia.org/wiki/Fernando_Pessoa"
  images:
    # The Siltolá bilingual edition of 2018, which carries the original
    # English title on the jacket. Neither 1918 Lisbon printing is held with a
    # cover anywhere open.
    cover: "https://covers.openlibrary.org/b/id/14017195-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL847044W"

- id: fernando-pessoa/english-poems-i-ii
  title: "English Poems I-II"
  authorIds: [fernando-pessoa]
  published: 1921
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Part I a revised Antinous, part II the "Inscriptions", fourteen short
