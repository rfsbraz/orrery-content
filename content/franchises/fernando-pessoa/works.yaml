- id: fernando-pessoa/livro-do-desassossego
  title: "Livro do Desassossego"
  authorIds: [fernando-pessoa]
  heteronym: bernardo-soares
  publishedAs: "Bernardo Soares"
  published: 1982
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A "factless autobiography" in more than five hundred fragments, kept by an
    assistant bookkeeper on the Rua dos Douradores who goes nowhere, does
    nothing, and records the weather of a mind with terrible precision. Pessoa
    wrote at it for two decades, finished nothing, ordered nothing, and left it
    in the trunk.
  # There is no single Livro do Desassossego. Pessoa left the fragments loose
  # and unordered, so every edition is one editor's reconstruction, and they
  # differ in which fragments are in the book and in what order they stand.
  # The 1982 date here is the first full edition (Jacinto do Prado Coelho for
  # Ática, in two volumes, from transcriptions by Maria Aliete Galhoz and
  # Teresa Sobral Cunha), which is the earliest date the book can honestly
  # carry; a selection edited by Pedro Veiga had appeared in 1961. The rival
  # reconstructions - António Quadros (Europa-América, 1986), Teresa Sobral
  # Cunha (Presença, 1990, and again Relógio d'Água, 2008), Richard Zenith
  # (Assírio & Alvim, 1998) and Jerónimo Pizarro (INCM critical edition 2010,
  # Tinta-da-china 2013) - are editions of this work, not other works. They
  # disagree substantively: Sobral Cunha splits the book between two ascribed
  # authors, Vicente Guedes for the 1910s and 1920s material and Bernardo
  # Soares for the rest, while Quadros gives the first phase to Pessoa himself.
  # `publishedAs` here follows the 1982 first edition and the book's own
  # subtitle, "composto por Bernardo Soares, ajudante de guarda-livros na
  # cidade de Lisboa".
  sources:
    - "http://arquivopessoa.net/info/bibliografia"
    - "https://pt.wikipedia.org/wiki/Livro_do_Desassossego"
    - "https://en.wikipedia.org/wiki/The_Book_of_Disquiet"

