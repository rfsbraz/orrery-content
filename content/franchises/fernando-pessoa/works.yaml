  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/fernando-pessoa"
    - "https://en.wikipedia.org/wiki/Fernando_Pessoa"

- id: fernando-pessoa/o-banqueiro-anarquista
  title: "O Banqueiro Anarquista"
  authorIds: [fernando-pessoa]
  published: 1922
  subseries: null
  canonTier: core
  format: novella
  synopsis: >
    Over dinner, a rich banker proves to his companion, by pure logic and
    without once raising his voice, that he is the only consistent anarchist
    alive and that his fortune is the proof. A satire whose argument is airtight
    and whose conclusion is monstrous.
  # The whole novella ran in the first issue of the magazine Contemporânea in
  # May 1922, which is the year here: it is the one substantial piece of fiction
  # Pessoa published in his lifetime. Its first standalone book edition is 1999
  # (ed. Manuela Parreira da Silva, Assírio & Alvim), the year most retail
  # metadata carries. Casa Fernando Pessoa's chronology confirms the month and
  # the issue: "Maio: Publica O Banqueiro Anarquista no primeiro numero da
  # Contemporanea". The same first year of the magazine carried "Mar Portugues"
  # in October, eleven of whose twelve poems ended up in Mensagem.
  sources:
    - "http://arquivopessoa.net/info/bibliografia"
    - "https://pt.wikipedia.org/wiki/Fernando_Pessoa"
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia"
  images:
    # Projecto Adamastor's 2013 Portuguese ebook, the only open cover of the
    # novella on its own. The 2014 Luso Livros jacket on the same record is
    # for a seven-story collection; the German, French and Spanish editions
    # carry the single text under their own titles.
    cover: "https://covers.openlibrary.org/b/id/14821550-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL39307957W"

- id: fernando-pessoa/o-guardador-de-rebanhos
  title: "O Guardador de Rebanhos"
  authorIds: [fernando-pessoa]
  heteronym: alberto-caeiro
  publishedAs: "Alberto Caeiro"
  # SCHEMA.md's containedIn (orrery#168): this text is reprinted whole inside
  # poemas-de-alberto-caeiro (1946), so the app's derived default order skips
  # this entry rather than walking the same 49 poems twice. This id stays a
  # real work in its own right - the 1925 date and the Athena publication are
  # not restated anywhere else in the wing.
  containedIn: fernando-pessoa/poemas-de-alberto-caeiro
  published: 1925
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Forty-nine poems by the shepherd Alberto Caeiro, written in a single day in
    March 1914 and published eleven years later in the fourth and fifth issues
    of Pessoa's magazine Athena. A poetry that refuses to think: things are
    exactly as many as they are, a flower means nothing but itself, and the
    only mystery is that anyone should look for one.
  # Poem 8, the one in which the infant Christ comes down to live in Caeiro's
  # village, was held back and appeared only in 1931, in presença. The whole
  # sequence was collected in book form in
  # [[work:fernando-pessoa/poemas-de-alberto-caeiro|Poemas de Alberto Caeiro]]
  # (1946), which is listed separately below.
  sources:
    - "https://pt.wikipedia.org/wiki/O_Guardador_de_Rebanhos"
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/alberto-caeiro"
  images:
    # Sheep Meadow Press's 1997 bilingual edition, the Portuguese faced with
    # the Honig and Brown translation.
    cover: "https://covers.openlibrary.org/b/id/924852-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL847117W"

- id: fernando-pessoa/o-interregno
  title: "O Interregno: Defesa e Justificação da Ditadura Militar em Portugal"
  authorIds: [fernando-pessoa]
  published: 1928
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A pamphlet arguing the military dictatorship installed in 1926 as a matter
    of political science rather than of politics: a country whose public opinion
    has disintegrated cannot be governed by opinion, so what it needs is an
    interregnum, a suspended state held by force until a nation exists to be
    consulted again. Issued by the Núcleo de Acção Nacional in Lisbon, and the
    hardest single item in the bibliography to square with the writings against
    Salazar that came out of the same drawer a few years later.
  # Absent from the Arquivo Pessoa bibliography. The Biblioteca Nacional de
  # Portugal holds three copies of the 1928 first edition, one catalogued as a
  # manifesto, plus a later Nova Ática reprint; the imprint is Lisboa, Núcleo
  # de Acção Nacional, 1928, printed at the Sociedade Nacional de Typographia,
  # and the title page spells it "defeza ... da dictadura militar".
  #
  # No contemporary reception is recorded here because none was found. The
  # pamphlet is absent from Casa Fernando Pessoa's chronology and from the
  # Portuguese Wikipedia article on Pessoa, and the reachable record carries no
  # review, rebuttal or press notice from 1928 or after. What the record does
  # carry is the reversal: the political prose collected in 2015 by Jose Barreto
  # has him turning against Salazar's Estado Novo in his last years.
  sources:
    - "http://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?menu=search&profile=bn&index=.GW&term=interregno+pessoa"
    - "https://openlibrary.org/search?q=Interregno+Pessoa"

- id: fernando-pessoa/mensagem
  title: "Mensagem"
  authorIds: [fernando-pessoa]
  published: 1934
  subseries: null
  canonTier: core
  format: poetry-collection
  featured: true
  synopsis: >
    Forty-four short poems arranged as a coat of arms, a sea and a prophecy:
    the founders of Portugal, the navigators, and a promised Fifth Empire that
    is spiritual rather than territorial. The only Portuguese-language book
    Pessoa published in his lifetime, and the one that won him a national prize
    the year before he died.
  sources:
    - "https://pt.wikipedia.org/wiki/Mensagem_(livro)"
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/fernando-pessoa"
  images:
    # The 1934 first edition itself: the orange typographic wrapper of the
    # Parceria Antonio Maria Pereira printing, Rua Augusta 44-54, Lisboa. It
    # is only 202px wide, and it is the one cover on this shelf Pessoa saw.
    cover: "https://covers.openlibrary.org/b/id/6812846-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL847128W"

