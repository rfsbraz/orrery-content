  sources:
    - "https://casafernandopessoa.pt/pt/fernando-pessoa/obra/fernando-pessoa"
    - "https://en.wikipedia.org/wiki/Fernando_Pessoa"

- id: fernando-pessoa/english-poems-iii
  title: "English Poems III"
  authorIds: [fernando-pessoa]
  published: 1921
  subseries: null
  canonTier: core
  format: poem
  synopsis: >
    "Epithalamium", a wedding-night poem of frank and relentless physical
    appetite, issued by Olisipo as the third of the English Poems booklets and
