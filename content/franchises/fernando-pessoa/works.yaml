- id: fernando-pessoa/paginas-de-doutrina-estetica
  title: "Páginas de Doutrina Estética"
  authorIds: [fernando-pessoa]
  published: 1946
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    The first book of Pessoa's critical prose, selected, prefaced and annotated
    by the poet Jorge de Sena: sensationism explained by its inventor, the case
    against the literature of his moment, and the pages on what a poet is and
    what Portugal was supposed to do with one. It put the theory in readers'
    hands twenty years before Ática's Páginas volumes.
  # Absent from the Arquivo Pessoa bibliography. Lisboa, Editorial Inquérito,
  # 1946, with a second edition in 1962. The Biblioteca Nacional also holds
  # copies of the Sena selection bearing 1944 and 1947 imprints; 1946 is the
  # year on the four Library of Congress records and the year the volume is
  # cited by in the literature.
  sources:
    - "http://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?menu=search&profile=bn&index=.GW&term=paginas+doutrina+estetica+pessoa"
    - "https://openlibrary.org/search?q=%22doutrina+estetica%22"

- id: fernando-pessoa/poemas-dramaticos
  title: "Poemas Dramáticos"
  authorIds: [fernando-pessoa]
  published: 1952
  subseries: null
  canonTier: core
  format: play
  synopsis: >
    Pessoa's theatre, such as it is: the static drama O Marinheiro, in which
    three women keep vigil over a fourth through a night and tell each other
    the story of a shipwrecked sailor who dreamed himself a homeland until he
    could no longer remember the real one, alongside the first published
    fragments of his lifelong Faust.
  note: >
    The synopsis carries the sailor's dream, which the second watcher tells at
    length in the middle of the play, and stops there. O Marinheiro closes on
    her asking whether the sailor is the only real thing and the watchers
    themselves his dream; it is the last thing said before the day breaks and
    the drama ends, so it is not stated here.
  sources:
    - "http://arquivopessoa.net/info/bibliografia"

