- id: fernando-pessoa/odes-de-ricardo-reis
  title: "Odes de Ricardo Reis"
  authorIds: [fernando-pessoa]
  heteronym: ricardo-reis
  publishedAs: "Ricardo Reis"
  published: 1946
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Short pagan odes in strict classical measure, counselling distance from a
    life that is going to end anyway: crown yourself with roses, ask nothing,
    and let the river carry it. The first of the Odes had appeared in Athena in
    1924; this is the volume that made Reis a poet with a book.
  sources:
    - "http://arquivopessoa.net/info/bibliografia"

