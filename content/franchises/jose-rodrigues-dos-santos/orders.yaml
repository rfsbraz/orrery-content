    - jose-rodrigues-dos-santos/o-ultimo-segredo
    - jose-rodrigues-dos-santos/a-mao-do-diabo
    - jose-rodrigues-dos-santos/a-chave-de-salomao
    - jose-rodrigues-dos-santos/vaticanum
    - jose-rodrigues-dos-santos/sinal-de-vida
    - jose-rodrigues-dos-santos/imortal
    - jose-rodrigues-dos-santos/o-jardim-dos-animais-com-alma
    - jose-rodrigues-dos-santos/a-mulher-do-dragao-vermelho
    - jose-rodrigues-dos-santos/o-protocolo-caos
    - jose-rodrigues-dos-santos/o-sexto-sentido
  sources:
    - "https://www.goodreads.com/series/356698-tom-s-noronha"
    - "https://www.gradiva.pt/autor/jose-rodrigues-dos-santos/"
