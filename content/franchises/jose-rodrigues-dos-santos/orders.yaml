# ADDITIONAL reading orders only. The DEFAULT order (all 34 works, publication-
# chronological) is derived automatically from works.yaml and is NOT listed
# here. The 14-book Tomás Noronha series is already publisher-numbered 1-14
# in strict publication order (works.yaml's own header), so it needs no order
# to represent internally - what it does need, and gets below, is an order
# that pulls the whole series out as one walkable thread apart from the other
# 20 works around it.
#
# Five entries below, each earning its place on its own grounds - two pull a
# named thread out of the wider shelf even though they reorder nothing
# (Noronha, Saga do Lótus), three fix a same-year tie the derived default
# cannot resolve on its own, published being year-only (Gulbenkian, Auschwitz,
# Crónicas de Guerra).
#
# Checked and declined: A Vida num Sopro / O Anjo Branco (2008, 2010), the
# continuing but unnamed Mozambique family-saga pair (works.yaml's header on
# why no series name is invented for it). Different years, so the derived
# default already places them correctly with nothing to fix, and at two books
# with no tie to break, extracting them reorders nothing a reader could feel -
# the same floor Michael Connelly's wing applies to its own two-book Terry
# McCaleb and Catalina groups, and Harlan Coben's to its Sami Kierce and Wilde
# threads. An order here would exist only to pad the file.

- id: jose-rodrigues-dos-santos/tomas-noronha-in-order
  name: Tomás Noronha, the complete series
  type: curated
  source: canon
  rationale: >
    The 14 [[work:jose-rodrigues-dos-santos/o-codex-632|Tomás Noronha]] novels
    (2005-2025) are the flagship of this shelf and its largest thread: a
    historian-cryptanalyst's cases threading real cryptography, physics and
    religious history, publisher-numbered 1-14 and independently listed in
    that same order by Goodreads' own series page. This order matches the
    derived default exactly for these 14 works (no year ties among them); its
    whole contribution is naming and isolating the series as a walkable
    thread apart from the Gulbenkian biography, the Saga do Lótus and the
    standalone historical novels around it. The cost: reading only these
    skips some of the author's most acclaimed work off the series, including
    his own most personal novel, [[work:jose-rodrigues-dos-santos/o-anjo-branco|
    O Anjo Branco]].
  orderedWorkIds:
