# Creative periods. Inline references use [[type:id|text]] and must resolve.
#
# PROVENANCE WARNING: no critic, obituary-style profile, academic source or
# fan community periodises this career into named phases at all. Searched in
# both Portuguese (the language of his own press coverage) and English:
# Português - "fases"/"período"/"carreira literária", "antes de O Codex 632",
# a 60th-birthday-style retrospective profile, a thesis/dissertação search for
# "primeira fase"/"segunda fase" of his fiction; English - his Wikipedia
# article directly. All came back with chronological biography, not
# periodisation. Two things that look like a periodisation on first read are
# not:
#
#  - "O Codex 632" (2005) and "A Fórmula de Deus" (2006) are called career-
#    making in several places - Bertrand's own retail copy says the latter
#    "mudou para sempre o panorama do romance português" - but a 2026 Forbes
#    Portugal piece marking the 20th anniversary, read in full, praises one
#    book's impact and draws no line through the shelf around it; it is
#    publicity language about a title, not a division of a career.
#  - The three-part war-reportage study - [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
#    de Guerra I]], [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade|Crónicas
#    de Guerra II]] and [[work:jose-rodrigues-dos-santos/a-verdade-da-guerra|A
#    Verdade da Guerra]] - is periodised, but only as one nonfiction project
#    inside a single year (2001-2002), by the author's own portfolio pages
#    ("first/second/third of a three-part study"), already recorded on each
#    work's own `note:`. It never touches the fiction shelf this wing's aura
#    otherwise walks, so promoting it to a wing-wide chapter-gate plate would
#    misrepresent three linked essays as a creative era the size of a decade.
#
# The one genuine periodisation available is bibliographic rather than
# critical: the publisher record. Two independent 2022 press pieces (NiT,
# Flash) report the same fact in the same words - a 21-year relationship with
# Gradiva ending in a move to Grupo Planeta - and a third source, an
# independent per-book bibliography, dates his first Gradiva title to 2001 and
# confirms Gradiva published everything else across that span except one 2002
# exception. The two eras below meet at the same publisher change from
# opposite sides, the same shape as Stephen King's "Doubleday Years"/"golden
# decade" boundary in this catalogue.
#
# ORPHAN, genuinely outside both eras: [[work:jose-rodrigues-dos-santos/comunicacao|Comunicação]]
# (1992), his first book, predates the Gradiva relationship by nine years with
# nothing published in between - a single early academic essay from a
# different, unrelated publisher (Difusão Cultural), not the opening of any
# period covered here.

- id: the-gradiva-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Gradiva Years
  period: "2001-2021"
  themes: [Tomás Noronha, cryptic history and religion, Calouste Gulbenkian, wartime Macau and China, colonial Mozambique]
  provenance: publishing
  description: >
    Two decades under one publisher. Gradiva issued every book from
    [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
    de Guerra I]] (2001) to [[work:jose-rodrigues-dos-santos/o-jardim-dos-animais-com-alma|O
    Jardim dos Animais com Alma]] (2021), the one exception being his fiction
    debut [[work:jose-rodrigues-dos-santos/a-ilha-das-trevas|A Ilha das
    Trevas]] (2002), first issued by Temas & Debates and folded into Gradiva's
    own catalogue only in 2007. The span carries his entire rise from
    journalist to Portugal's best-selling novelist:
    [[work:jose-rodrigues-dos-santos/o-codex-632|O Codex 632]] (2005)
    introduces Tomás Noronha and is acquired by HarperCollins;
    [[work:jose-rodrigues-dos-santos/a-formula-de-deus|A Fórmula de Deus]]
    (2006) becomes the series' signature title. Eleven Tomás Noronha novels,
    the Calouste Gulbenkian duology, the four-book Saga do Lótus, the Branco
    family pair that runs from Estado Novo Portugal into colonial Mozambique,
    and the Auschwitz duology are all published here.
  note: >
    RECEIVED as a publishing fact, not as any critical or fan periodisation -
    see the wing-level provenance note above for what was searched and ruled
    out. The 21-year span is reported identically, down to the same "casamento"
    figure of speech, by NiT and Flash; the 2001 start is not stated directly
    by either but is independently confirmed by a third, unrelated source: a
    per-book bibliography dating his first Gradiva title, Crónicas de Guerra I,
    to 2001, and separately recording that Gradiva published everything else in
    this span except A Ilha das Trevas. The boundary is drawn on the last
    Gradiva-era book by publication year rather than the month of the announced
    move (May 2022): O Jardim dos Animais com Alma (2021) is his last Gradiva
    novel and A Mulher do Dragão Vermelho (2022) his first for Planeta, so the
    two eras meet without claiming a shared year.
  sources:
    - "https://www.nit.pt/cultura/livros/mercado-editorial-ao-rubro-jose-rodrigues-dos-santos-troca-gradiva-por-planeta"
    - "https://www.flash.pt/celebridades/detalhe/jose-rodrigues-dos-santos-acaba-casamento-de-longa-duracao-com-editora-e-muda-se-para-a-planeta"
    - "https://ocheirodoslivros.blogs.sapo.pt/jose-rodrigues-dos-santos-biografia-109091"

- id: the-planeta-years
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: The Planeta Years
  period: "2022-present"
  themes: [Tomás Noronha under a new imprint, disinformation and the Chinese Communist Party, Espinosa's Amsterdam]
  provenance: publishing
  description: >
    Grupo Planeta became his publisher in May 2022, with a new book already
    written and announced for that October:
    [[work:jose-rodrigues-dos-santos/a-mulher-do-dragao-vermelho|A Mulher do
    Dragão Vermelho]], the twelfth Tomás Noronha novel. His first standalone
    for the new imprint, [[work:jose-rodrigues-dos-santos/o-segredo-de-espinosa|O
    Segredo de Espinosa]] (2023), followed, and the Noronha series continued
    with [[work:jose-rodrigues-dos-santos/o-protocolo-caos|O Protocolo Caos]]
    (2024) and [[work:jose-rodrigues-dos-santos/o-sexto-sentido|O Sexto
    Sentido]] (2025).
  note: >
    RECEIVED on the same publishing-fact basis as the era before it (see its
    note and the wing-level note above). The same two press sources that date
    the move to May 2022 name the October release as the first Planeta book,
    matching A Mulher do Dragão Vermelho's own publication year and this
    wing's own note on that work, "his first novel with Grupo Planeta after 21
    years with Gradiva". Left open-ended because the relationship has not
    ended. Gradiva continuing to reissue his Gradiva-era backlist after 2022 -
    a 20th-anniversary edition of O Codex 632 followed in February 2026 - is a fact
    about that backlist, not a second publisher for new work, and does not
    reopen this boundary.
  sources:
    - "https://www.nit.pt/cultura/livros/mercado-editorial-ao-rubro-jose-rodrigues-dos-santos-troca-gradiva-por-planeta"
    - "https://www.flash.pt/celebridades/detalhe/jose-rodrigues-dos-santos-acaba-casamento-de-longa-duracao-com-editora-e-muda-se-para-a-planeta"
