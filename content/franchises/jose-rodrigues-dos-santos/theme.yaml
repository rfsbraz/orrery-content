# Branding for the José Rodrigues dos Santos wing (see the design law: palette
# + one display face + one signature, readability first, no genre costume).
preset: newsroom-cipher
palette:
  bg: "#0a0f0e"        # cold near-black with a faint cathode-teal cast - a
                       # broadcast monitor in a dark studio, not any other
                       # wing's warm brown (King, McCarthy, Connelly, Peixoto)
                       # or violet-indigo (Jim Butcher, Robert Jordan, Poe)
  surface: "#121a18"   # a hair lifted, for cards
  ink: "#e6ede9"       # cool phosphor white - high contrast, very readable
  muted: "#7d938c"     # cool teal-grey, for metadata
  accent: "#b23327"    # one restrained cardinal/breaking-news red, for links
                        # and markers only - the colour of both a live chyron
                        # and the Vatican thread running through several of
                        # the Tomás Noronha novels (Vaticanum, O Sétimo Selo,
                        # A Chave de Salomão); distinct from Stephen King's
                        # browner oxblood (#b04a34) and Cormac McCarthy's
                        # orange ember (#c1662c)
displayFace: sourceSerif  # the plainest of the curated serifs - a news
                           # anchor's plain-spoken register, even while
                           # writing thrillers
signature: beam            # a bold accent rail: the fourteen-book Tomás
                            # Noronha series is explicitly numbered by its
                            # publisher and has run for two decades at close
                            # to a book a year, a genuinely continuous shelf
                            # rather than a sparse or episodic one
notes: >
  The palette reads as a newsroom after hours rather than as a thriller's
  genre costume - no gilt crosses, no parchment-and-wax-seal pastiche, no
  Da-Vinci-Code cover cliches - because the author's own identity (a working
  TV news anchor of over three decades) is the more specific and more
  truthful anchor than the conspiracy-thriller furniture his books are
  sometimes marketed with.

# ART. Checked against the catalogue's closest neighbours before settling
# this. Harlan Coben and José Luís Peixoto share this wing's displayFace
# (sourceSerif) and signature (beam) exactly, so the divide has to sit in the
# art block itself: Coben draws a tended cul-de-sac and Peixoto a sunbaked
# inland plain, neither anywhere near a newsroom or an archive. Chuck
# Palahniuk owns the catalogue's other cold, teal-cast near-black register
# and a flat, unvarying ruling-pen line - this wing keeps the cold cast (a
# working journalist's world is not warmed up for comfort) but breaks from
# Palahniuk's line on purpose: where his never varies, this one is exact
# until a fact is being checked or a cipher worked out, and then it doubles
# back on itself rather than staying flat. Jo Nesbø's emblem is a ruled
# ledger of numeric rows; this wing's is a cipher square of single letters,
# a different object for a different profession. Michael Connelly's wing
# already owns warm sepia case-file paper and a felt-tip procedural line;
# this wing's paper is cold wire-service stock, not manila, and its
# instrument corrects rather than smudges.
art:
  emblem:
    object: >
      A hand-ruled cipher square on graph paper - rows and columns of single
      letters, most cells filled in a small precise hand, a few still blank
      - with one short phrase pencilled out beneath it, half of its letters
      crossed through and rewritten once already.
    why: >
      Every one of the fourteen Tomás Noronha novels turns on the historian
      and cryptanalyst working out something hidden - a substitution cipher
      in a dead scholar's papers in O Codex 632, a physicist's private
      notation in A Fórmula de Deus, a killer's cryptogram in A Chave de
      Salomão - and the series' own titles (Codex, Fórmula, Chave, Segredo,
      Protocolo) keep naming the same recurring object: a thing that has to
      be worked out, not simply found. The author's own instinct outside the
      fiction runs the same way: three decades checking a report before it
      airs, and two doctorates built on going back over a primary record
      rather than repeating the received account - the same habit that got
      the Columbus claim in O Codex 632 and the fascism-origin claim in Saga
      do Lótus called a "national shame" by a historian in 2023. A half-solved
      grid, corrected once and still not finished, is that habit drawn: a
      code worked at, not received whole.
  motifs:
    - a wire-service telex ribbon or ticker tape, printed or punched,
      curling off the edge of a desk
    - the hand-ruled cipher square itself, reappearing at a smaller scale
      inside a scene - chalked on a board, scrawled on a napkin, typed into
      a terminal - always rows and columns of single characters, never a
      finished, legible sentence
    - a redacted or officially stamped archive page, a black bar over a
      paragraph or a round ink stamp half-legible - a Vatican archive box, a
      declassified file, a recovered wartime manuscript, depending on the
      scene
    - an open-reel tape recorder or a shortwave radio dial, a single red
      record light lit, standing in for the correspondent years (Baghdad,
      Huambo, the Albanian bunkers)
    - a hand-inked great-circle line crossing a plain world map, no borders
      filled in, just the line and a few coordinate marks - the shelf's own
      reach, from Antarctica to the Vatican to a Beijing-run reeducation camp
    - a broadcast control room after the programme ends, one monitor still
      lit to a test card or static, the rest gone dark
  atmosphere: >
    A newsroom in the hour after the broadcast ends: the monitors still on,
    the wire feed still running, nobody left in the room but the story. That
    same cold, procedural light is carried into the historical settings too,
    so an archive reading room or a wartime file gets the same treatment as
    a studio rather than an invented gothic hush - a document is given
    weight by its actual paper and stamp, not by candle or shadow. Tension
    comes from verification, a fact being run down and checked against
    another source, never from a conspiracy's staged menace. This is
    explicitly not a Da Vinci Code candlelit cathedral, and it is not warm
    campfire-saga glow for the historical fiction either: one cold, checking
    light for both halves of the shelf, because the author's own eye is the
    thing that connects them.
  lineCharacter: >
    A fine, taut technical pen line, held level and exact like a wire photo
    desk's crop mark. Where a fact is being checked or a cipher worked out,
    the line doubles back on itself in a second, very slightly offset pass -
    a correction laid directly over the first stroke rather than an erasure
    - so the mark thickens at exactly the point something was verified.
    Nothing is ever shaded loose or expressive, and the correction itself
    stays a straight second stroke, never a scribble.
  backgroundTexture: >
    Cool grey wire-service stock: thin, faintly waxy paper like an old telex
    roll or fax sheet, with a very fine horizontal scan-line grain running
    through it, as though the paper itself had come off a monitor rather
    than a press. Not warm parchment, not laid paper, not a photocopy's
    halftone dot - this is broadcast-grade stock, colder and thinner than
    anything else in the catalogue.
  accentUse: >
    Cardinal red on exactly one element per image, never as a fill: a single
    lit tally or "on air" lamp, one length of red splicing tape on a reel of
    recording tape, a hand-stamped red archive seal pressed half onto a
    page, or one ruled correction mark in red pencil over the cipher square.
  avoid:
    - gilt crosses, wax seals, illuminated-manuscript curlicues or any
      Da Vinci Code cover pastiche - this wing draws a newsroom, not that
      furniture
    - on-screen news graphics, lower-thirds, chyron bars or any actual
      broadcast typography inside the artwork itself
    - generic spy-thriller gadgetry - sunglasses, silenced pistols, tuxedos,
      a gilded gadget briefcase
    - swastikas, SS insignia or any graphic Holocaust shorthand played as
      thriller-cover iconography for the Auschwitz duology - drawn only as
      document and consequence (a stamped manifest, an empty rail siding, a
      recovered page), never as costume
    - pith-helmet colonial-adventure kitsch or an exoticised "Orient" for
      the Macau, China and Mozambique settings
    - a cipher wheel, rotary cryptograph disc or any concentric-ring device
      standing in for the cipher motif - reads as the orrery's own mark;
      this wing's cipher stays a flat ruled square, never a wheel
