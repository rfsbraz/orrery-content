- id: jrs-cronicas-de-guerra-origin-2001
  organisation: layered-stack
  illustration_type: manuscript-proof
  images_required: 1
  date: 2001
  title: A PhD on war reportage becomes a three-part study
  scope: author-life
  reach: franchise
  impact: med
  description: >
    Rodrigues dos Santos's doctorate in Communication Sciences at
    Universidade Nova de Lisboa examines the history of war reportage; the
    dissertation grows into three nonfiction volumes published in quick
    succession,
    [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-i-da-crimeia-a-dachau|Crónicas
    de Guerra I]] (2001, from the Crimean War to the Spanish Civil War),
    [[work:jose-rodrigues-dos-santos/cronicas-de-guerra-ii-de-saigao-a-bagdade|Crónicas
    de Guerra II]] (2002, Vietnam to the Gulf War) and
    [[work:jose-rodrigues-dos-santos/a-verdade-da-guerra|A Verdade da
    Guerra]] (2002, a philosophical inquiry into whether a war correspondent
    can ever convey the truth of war). The three books turn a working
    journalist's own postgraduate research, and two decades of his own war
    reporting from Timor to Bosnia, into the only sustained academic study he
    publishes outside his fiction.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

- id: jrs-o-ultimo-segredo-church-row-2011
  organisation: layered-stack
  illustration_type: press-media-collage
  images_required: 1
  date: 2011-10
  title: The Catholic Church calls his Jesus novel "intolerant"; he answers that no fact was disputed
  scope: culture
  reach: franchise
  impact: med
  description: >
    Days after
    [[work:jose-rodrigues-dos-santos/o-ultimo-segredo|O Último Segredo]]'s
    release, the Portuguese Church's National Secretariat for Pastoral
    Culture accuses Rodrigues dos Santos of trying, "with great fanfare", to
    "break down a door that has long been open", and of packing "several
    inaccuracies" into three lines about the Bible's formation and the
    reliability of Catholic doctrine. Responding through the Lusa news
    agency, he calls the accusation "very interesting", since it amounts to
    "an implicit admission that the claims in the book are true": none of
    it, he says, is new to academics or to the Church itself, "the public
    is who doesn't know it. I limited myself to bringing this information to
    the wider public." The exchange runs for weeks in the press; by its
    fourth edition the novel has sold 80,000 copies.
  spoilerAfter: null
  sources:
    - "https://www.rtp.pt/noticias/cultura/jose-rodrigues-dos-santos-contesta-a-critica-da-pastoral-a-o-ultimo-segredo_n492901"
    - "https://www.publico.pt/2011/10/25/sociedade/noticia/igreja-catolica-arrasa-o-ultimo-romance-de-jose-rodrigues-dos-santos-1518107"

- id: jrs-saga-do-lotus-origin-2016
  organisation: epigraph
  images_required: 0
  date: 2016-05-23
  title: "Interview with Diário de Notícias, on O Pavilhão Púrpura (23 May 2016)"
  quote: >
    O facto de que o fascismo é um movimento que tem origem marxista, por
    exemplo, é uma das demonstrações feitas nesta saga que poderá parecer
    polémica.
  description: >
    Fascism, he says, has Marxist origins: one of the deliberately
    "politically incorrect" claims he says
    [[work:jose-rodrigues-dos-santos/as-flores-de-lotus|As Flores de
    Lótus]] and O Pavilhão Púrpura set out to demonstrate, alongside his
    argument that Nazism drew on ideas already mainstream across interwar
    Western democracies (he cites the Carnegie Institute's 1911 proposal, in
    the United States, to gas the disabled). He frames the whole saga as a
    deliberate return to the 1920s-1940s collapse of democratic legitimacy,
    written, in his words, because its parallels to the present are
    unmistakable.
  impact: med
  spoilerAfter: null
  sources:
    - "https://www.dn.pt/arquivo/diario-de-noticias/jose-rodrigues-dos-santos-o-fascismo-tem-origem-marxista-5189844.html"

- id: jrs-auschwitz-holocaust-framing-2020
  organisation: immersion
  illustration_type: portrait-of-absence
  images_required: 1
  date: 2020-11-18
  title: His own account of the gas chambers draws a rebuke from Holocaust historians
  scope: culture
  reach: franchise
  impact: high
  description: >
    Promoting
    [[work:jose-rodrigues-dos-santos/o-magico-de-auschwitz|O Mágico de
    Auschwitz]] and
    [[work:jose-rodrigues-dos-santos/o-manuscrito-de-birkenau|O Manuscrito de
    Birkenau]] on RTP's Grande Entrevista, Rodrigues dos Santos improvises a
    dramatised version of the Nazi leadership's own reasoning for the gas
    chambers: "At some point, someone says: look, they're in the ghettos,
    they're dying of hunger, we can't feed them. If they're going to die,
    better a more humane way. And why not with gas?" He also describes
    Auschwitz-Birkenau prisoners as capable of a kind of adaptation to camp
    life. Weeks later the remarks reach social media and draw sharp
    criticism from named historians: Irene Pimentel calls them "shockingly
    ignorant and shameless"; novelist João Pinto Coelho, who has visited the
    camp and worked with survivors and researchers, calls the "adaptation"
    claim "obscene" given conditions under which prisoners "survived weeks,
    sometimes days", and says the historiography of the Final Solution's
    motives has long been settled. Rodrigues dos Santos answers, in an open
    letter published in Sábado, that he never called the Final Solution
    humane, only voiced, in figurative terms, the reasoning he believes drove
    the Nazi leadership, and cites a historical document in his defence;
    Pinto Coelho counters that a document written by one person cannot
    characterise a regime's thinking.
  spoilerAfter: null
  sources:
    - "https://www.nit.pt/cultura/livros/jose-rodrigues-dos-santos-dizer-que-os-judeus-se-adaptaram-a-auschwitz-e-obsceno"
    - "https://www.sabado.pt/vida/detalhe/jose-rodrigues-dos-santos-responde-a-polemica-sobre-as-camaras-de-gas"
    - "https://www.sabado.pt/portugal/detalhe/jose-rodrigues-dos-santos-ignorante-ou-incompreendido"

- id: jrs-colombo-historians-dispute-2023
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2023-09-28
  title: A historian calls his Columbus theory and his fascism thesis a "national shame"
  scope: culture
  reach: franchise
  impact: med
  description: >
    Interviewed on RTP2's Jornal da 2 about the television adaptation of
    [[work:jose-rodrigues-dos-santos/o-codex-632|O Codex 632]], Rodrigues dos
    Santos repeats the novel's premise that Christopher Columbus was likely
    Portuguese rather than Genoese, adding that it is often novelists, not
    academics, who "come to demystify and overturn" received historical
    myths. His defence, offered in the same segment, is that when the novel
    first appeared in 2005 historians had themselves come forward publicly to
    say they too thought Columbus was Portuguese. Historian Roger Lee de
    Jesus, of the University of Coimbra, responds on social media that the
    claim is a "national shame", accusing him of "spreading historical
    conspiracy theories with no support or credibility" against a settled
    historiographical consensus, and, in comments to Visão, extends the
    charge to
    [[work:jose-rodrigues-dos-santos/as-flores-de-lotus|As Flores de
    Lótus]]'s fascism-has-Marxist-origins thesis, the same claim he had
    defended a year earlier in his own second doctorate, at the Sorbonne.
  spoilerAfter: null
  sources:
    - "https://visao.pt/atualidade/sociedade/2023-10-01-o-problema-de-jose-rodrigues-dos-santos-e-de-outros-jornalistas-e-fazerem-afirmacoes-sobre-um-campo-cientifico-que-nao-dominam/"
