# Portuguese editions - the actual books a pt-PT reader buys.
#
# Santos writes in Portuguese, so there is nothing to translate: every work's
# `title` in works.yaml IS the published Portuguese title. Per SCHEMA.md the
# `title` field is therefore OMITTED throughout - repeating it would duplicate
# the work title rather than record a genuinely different published title.
#
# COVERAGE: 34 of 34 works have a verified pt-PT edition. The 27 novels and
# "Comunicação" are sourced to the current publisher's own product page -
# gradiva.pt (his publisher 2001-2022) or planetadelivros.pt (Grupo Planeta,
# 2022-present) - read directly for ISBN, year and binding. The three
# war-reportage essays and all three interview volumes are out of print at
# both current publishers; those six rest on the Biblioteca Nacional de
# Portugal's ipac20 catalogue (catalogo.bnportugal.gov.pt, which answers to a
# browser User-Agent) and, for one, OpenLibrary's aggregation of a Harvard
# Library MARC record. 24 of the 28 gradiva.pt-sourced ISBNs are additionally
# corroborated by an independent OpenLibrary record for the same title; the
# remainder rest on the publisher's own catalogue alone, the top-ranked
# source in this skill's hierarchy.
#
# Region check: every ISBN below carries a 978-972 or 978-989 prefix
# (Portugal); none is a 978-85/978-65 (Brazil) edition mistagged - checked
# individually against a search that surfaced a genuine Brazilian edition of
# "O Sétimo Selo" (Editora Record, 978-85-...) and one of "O Segredo de
# Espinosa" (Planeta do Brasil, 978-85-...), neither used here.
#
# THREE DATA CORRECTIONS, each the product's own catalogue disagreeing with
# itself or with a second source:
#
# - "Conversas de Escritores": gradiva.pt's own product page prints
#   "ISBN: 378-989-616-366-2" - not a real Bookland prefix, so not a real
#   ISBN. The Biblioteca Nacional de Portugal's own catalogue record for the
#   same book (1ª ed., Gradiva, 2010, 254 p.) gives 978-989-616-366-2, which
#   passes its check digit and is independently corroborated by OpenLibrary.
#   That number is used below; Gradiva's page is cited as the source of the
#   typo, not of the ISBN.
#
# - "O Protocolo Caos": OpenLibrary carries a user-contributed record with a
#   different, also check-digit-valid ISBN (978-989-777-955-8) that traces to
#   no library or publisher source. Planeta's own current product page gives
#   978-989-777-933-6 for the in-print trade paperback; that is the number
#   used here.
#
# - "O Codex 632" and "A Fórmula de Deus": both were reissued as 2026
#   Gradiva 20th-anniversary editions (new ISBNs, "Fora de Colecção"/"Gradiva
#   Romance"), and gradiva.pt's own product pages for the original 2005/2006
#   printings now link to the anniversary edition as "Também disponível em:
#   Livro físico" - i.e. the original printing is ebook-only there today. The
#   anniversary edition is recorded below as the current in-print physical
#   edition; the two superseded ISBNs (978-989-616-072-2 for the 2005 Codex
#   632 first edition, per OpenLibrary; 978-989-616-139-2 for the 2006
#   Fórmula de Deus first edition, per gradiva.pt) are not recorded as
#   separate entries since a current edition of each exists.
#
# THE WAR-REPORTAGE VOLUMES, disentangled from one shared "Fora de Colecção"
# numbering (174/180/185): BNP's own first-edition record (1ª ed., 2001-2002,
# id.bnportugal.gov.pt/bib/bibnacional/1078198) catalogues all three volumes
# as one three-ISBN set and lists them in an order that does not agree with
# every later record for the same numbers. Every subsequent edition record
# that catalogues a single volume on its own agrees with the mapping used
# below: four independent records (3ª-7ª ed., 2001-2003) tie 972-662-816-4 to
# "Da Crimeia a Dachau" alone; a combined 3ª ed. record
# (id.bnportugal.gov.pt/bib/bibnacional/1082532, matching each ISBN to a
# separate legal-deposit number) ties 978-972-662-837-8 to "De Saigão a
# Bagdade"; and four further standalone records (3ª-6ª ed., 2002-2005) plus
# an OpenLibrary entry sourced to a Harvard Library MARC record independently
# catalogue "A verdade da guerra" alone under 972-662-867-9. That is the
# mapping used below, over the one dissenting first-edition record.

