- id: jose-rodrigues-dos-santos/a-filha-do-capitao
  title: "A Filha do Capitão"
  authorIds: [jose-rodrigues-dos-santos]
  published: 2004
  subseries: null
  canonTier: core
  synopsis: >
    Two months into the Flanders trenches, Portuguese Captain Afonso
    Brandão spends a night's rest at a château near Armentières and meets a
    French baroness; an irresistible attraction takes hold - while the
    German High Command settles on a spring 1918 offensive aimed at the
    very sector the Portuguese Corps is holding.
  note: >
    Published in English as "The Captain's Daughter". Dedicated to the
    author's own paternal grandfather and maternal great-grandfather, both
    of whom served in the First World War. The publisher's own copy, in
    both languages, stops at the attraction and leaves the ending of the
    affair open; the press quotes it prints alongside pull in opposite
    directions on it. The synopsis therefore goes no further than the
    jacket does - a summary that settles the outcome would resolve what the
    book is written to keep open.
  images:
    cover: "https://covers.openlibrary.org/b/id/13274529-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL34320904W"
    # The Spanish edition ("La amante francesa", Roca) - Open Library's
    # edition record for it explicitly cross-references "Filha do capitao"
    # as the work_titles entry, confirming the match; the retitling fits the
    # French-baroness plot. No pt-PT or English cover survived verification
    # (Bertrand's jacket carries the retailer's own watermark).
  sources:
    - "https://joserodriguesdossantos.com/en/portfolio/the-captains-daughter/"
    - "https://pt.wikipedia.org/wiki/Jos%C3%A9_Rodrigues_dos_Santos"

