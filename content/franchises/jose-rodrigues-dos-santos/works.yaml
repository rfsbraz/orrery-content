# ---------------------------------------------------------------------------
# Saga do Lótus (4) - wartime Macau and China across four linked novels
# sharing recurring characters (Artur Teixeira, Lian-hua, Satake Fukui,
# Nadezhda). Real section heading in Portuguese Wikipedia and independently
# used by Goodreads' own series listing. NOTE: the author's own site's press
# synopsis for the second book calls it "The Lotus Trilogy" ("the sequel to
# The Lotus Flowers in The Lotus Trilogy") - language consistent with the
# saga's original three-book plan before a fourth volume, A Amante do
# Governador, extended it three years later; a FNAC product listing for the
# second book still carries the old "Trilogia do Lótus" label. "Saga do
# Lótus" is used here as the name that accurately covers all four books.
# ---------------------------------------------------------------------------

