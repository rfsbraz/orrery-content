# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent. `title` is the original Portuguese
# title; `published` is the year of first publication.
#
# SHAPE OF THIS WING: 34 works - 27 novels (core) and 7 nonfiction books, four
# essays and three published-interview volumes (extended, off the fiction
# spine). The 27 novels split into the numbered 14-book Tomás Noronha series
# plus 13 non-Noronha novels: a two-part biographical novel of Calouste
# Gulbenkian, a four-book saga set across wartime Macau and China, two
# unlabelled two-book pairs, and three true standalones. Verified against the
# author's own official bibliography (joserodriguesdossantos.com), the
# Portuguese Wikipedia article and his publisher's author page (Gradiva, his
# publisher 2001-2022; Grupo Planeta since 2022), which independently agree
# on a count of 27 novels.
#
# A CORRECTION TO A RECEIVED GROUPING: Portuguese Wikipedia's "Obras
# publicadas" section bundles four books - A Vida num Sopro, O Anjo Branco,
# O Mágico de Auschwitz and O Manuscrito de Birkenau - under a bolded label,
# "Série Francisco Latino", that (unlike the article's other series headers)
# carries no actual section markup and no entry in the article's own table of
# contents - a plain editorial insertion, not a sourced grouping. It is also
# factually wrong: only the second pair shares a protagonist named Francisco
# Latino (a Portuguese Foreign Legion soldier at Auschwitz, confirmed on the
# publisher's and the author's own synopsis pages, and one is press-quoted as
# "the continuation and ending of" the other). The first pair is a separate,
# unrelated family saga about a doctor named José Branco in colonial
# Mozambique, explicitly stated to continue from book to book but sharing no
# character with the Auschwitz pair. Each pair is recorded below with
# subseries left null and the link documented in a sourced `note:` instead,
# per this catalogue's convention for a continuing thread with no citable
# series name - inventing a combined four-book series name here would
# publish a Wikipedia editing artefact as received fact.
#
# canonTier: all 27 novels are core (this wing's spine is undifferentiated by
# format or prestige - no juvenilia, no disputed attributions); the 7
# nonfiction books are extended, genuinely his but off the narrative spine.
# No apocrypha: no contributor-only or ghost-written volume was found, and
# the author has repeatedly and publicly denied using any research or writing
# assistance.

# ---------------------------------------------------------------------------
# Série Tomás Noronha (14) - the flagship. Publisher-numbered 1-14, and the
# numbering matches strict publication-chronological order throughout, so no
# additional orders.yaml entry is needed to represent it: the derived default
# order already walks it correctly end to end.
# ---------------------------------------------------------------------------

- id: jose-rodrigues-dos-santos/o-codex-632
  title: "O Codex 632"
  authorIds: [jose-rodrigues-dos-santos]
  published: 2005
  subseries: "Tomás Noronha"
  canonTier: core
  featured: true
  synopsis: >
    Historian and cryptanalyst Tomás Noronha is asked to finish a dead
    scholar's unresolved research and uncovers a cipher that could rewrite
    the accepted story of the discovery of the Americas - and the true
    identity of Christopher Columbus.
  note: >
    The book that launched the series and the author's international career:
    acquired by HarperCollins for the US market in 2005 and published there
    in 2009 as "Codex 632: The Secret of Christopher Columbus". Gradiva
    published a 20th-anniversary edition on 24 February 2026 (ISBN
    978-989-785-405-7), the date and number printed on Gradiva's own product
    page for it and recorded in editions.yaml.
  images:
    cover: "https://covers.openlibrary.org/b/id/13531006-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL34783816W"
