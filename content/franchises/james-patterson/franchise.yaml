# A wing spans an author's complete published work. Patterson's is the
# largest in this catalogue by some distance: 465 books across three
# readerships and more than forty separately marketed series, and 105
# credited collaborators. The wing is built as Patterson because he is the
# throughline and the reason a reader opens it, and every collaborator is
# recorded per book in `withAuthorIds` with `authorRole: co-author`, never
# folded into an anonymous "and others" - the jacket says who, so the data
# can too.
id: james-patterson
name: James Patterson
kind: author
description: >
  The complete published work of James Patterson: the
  [[work:james-patterson/along-came-a-spider|Alex Cross]] novels (1993 to
  the present), the [[work:james-patterson/1st-to-die|Women's Murder Club]],
  [[work:james-patterson/step-on-a-crack|Michael Bennett]],
  [[work:james-patterson/private|Private]] and a dozen other thriller
  series, some seventy standalone thrillers, the young-adult
  [[work:james-patterson/the-angel-experiment|Maximum Ride]] and
  [[work:james-patterson/witch-and-wizard|Witch & Wizard]] books, the
  [[work:james-patterson/middle-school-the-worst-years-of-my-life|Middle
  School]], [[work:james-patterson/i-funny|I Funny]] and
  [[work:james-patterson/treasure-hunters|Treasure Hunters]] lines for
  younger readers, the 2016-2018 BookShots novellas, picture books, true
  crime and a memoir. From
  [[work:james-patterson/miracle-on-the-17th-green|Miracle on the 17th
  Green]] (1996) onward most of it carries a second name on the jacket in
  smaller type, and this wing records all 105 of them.
authorIds: [james-patterson]
themePreset: paperback-rack
sources:
  - "https://www.jamespatterson.com/landing-page/james-patterson-checklist/"
  - "https://en.wikipedia.org/wiki/James_Patterson"
  - "https://en.wikipedia.org/wiki/James_Patterson_bibliography"
