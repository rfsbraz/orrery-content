- id: james-patterson/private-novels
  name: The Private novels, in order
  type: curated
  source: canon
  rationale: >
    Jack Morgan's international investigation agency, the most geographically
    restless of Patterson's series: a new co-author and a new city almost
    every entry (London, Berlin, Los Angeles, Mumbai, Sydney, Paris, Delhi,
    Moscow and more) rather than one detective's home turf. Pulling it from
    the shelf suits a reader who wants the agency thread specifically, without
    Alex Cross, the Women's Murder Club, Michael Bennett or the standalones
    breaking up the run of cities. The record does not establish a
    month-level sequence for two same-year clusters: Private, Private:
    #1 Suspect and Private: Oz (all 2012), and Count to Ten, Private: Missing,
    Private Paris and The Games (all 2016, Private Games in the first group
    already fixed by numbering). Both clusters are listed alphabetically by
    title pending a better source. The cost of reading it straight through is
    the same rotating-author feel that makes the series distinctive: prose
    voice and pacing shift more novel to novel here than in Patterson's other
    series, because a different co-author, often based in the city itself,
    writes each entry.
