    - james-patterson/max
    - james-patterson/fang
    - james-patterson/angel
    - james-patterson/nevermore
    - james-patterson/maximum-ride-forever
  debated:
    - "Maximum Ride: Forever (2015) reopens a story Nevermore (2012) was marketed as closing; some readers treat it as an optional coda rather than a required ninth book. Listed here in publication order regardless."
