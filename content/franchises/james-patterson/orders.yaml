- id: james-patterson/michael-bennett
  name: Michael Bennett, the novels in order
  type: curated
  source: canon
  rationale: >
    An NYPD detective with a famously large family, Patterson's third major
    present-day crime lead alongside Alex Cross and the Women's Murder Club.
    Pulling the eighteen novels from the same four-hundred-and-eighty-work
    shelf suits a reader who wants to follow Bennett case to case without the
    other series or the standalones breaking in. No two entries share a publication year, so this order adds nothing a
    careful reader of the default could not reconstruct by filtering; its only
    value is not having to do that filtering by hand. The cost is the one any
    single-series read in this catalogue carries: losing the variety of
    register across Patterson's leads, and Bennett's family-first tone is
    quieter than Cross's or the Women's Murder Club's, so a reader expecting
    either of those will find this a different, slower book.
