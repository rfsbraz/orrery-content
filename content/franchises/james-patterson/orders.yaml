# ADDITIONAL canon orders only. The DEFAULT order - all 480 works in
# publication-chronological order - is derived automatically from works.yaml
# and is NOT listed here.
#
# Five thread orders below, one per named, numbered, branded series long
# enough that a reader plausibly wants to follow it alone through a shelf
# where standalones and a dozen other series interleave with it every year.
# Alex Cross, the Women's Murder Club and Maximum Ride are the three series
# the author's own site names when asked what order to read him in (see the
# FAQ source on each); Michael Bennett and the Private novels are the other
# two runs with the same branded numbering and enough length (18 and 20
# novels) to earn the same kind of read. Each order covers novels only, in
# publication order; the BookShots-era novellas and short stories each series
# also carries sit outside it and are named in `debated`, not silently
# dropped. Every order references stable Work IDs only.

- id: james-patterson/alex-cross
  name: Alex Cross, the novels in order
  type: curated
  source: canon
  rationale: >
    The Washington DC homicide detective and forensic psychologist Patterson
    is best known for, and the series his own FAQ names first when asked what
    order to read him in. Pulling it out of the wider catalogue lets a reader
    follow one detective's whole career, now thirty-six novels across three
    decades, without the Women's Murder Club, Michael Bennett, Private and the
    standalone thrillers the derived order interleaves with it every year.
    Publication order settles three same-year pairs the derived order's
    year-only precision cannot: Alex Cross's Trial before I, Alex Cross
    (2009), Alex Cross, Run before Cross My Heart (2013), and Cross Down
    before Alex Cross Must Die (2023), each following the sequence recorded
    in the series' own Wikipedia infobox. The cost of reading the whole run:
    the plotting and pace of the 1993 debut read differently from the
    shorter, faster chapters the collaborator model settles into from the
    mid-2000s on, so committing to all thirty-six means riding that shift in
    style along with the character.
