- id: james-patterson/maximum-ride
  name: Maximum Ride, the novels in order
  type: curated
  source: canon
  rationale: >
    A flock of genetically engineered kids on the run from the lab that made
    them, Patterson's flagship young-adult series and, with Alex Cross and the
    Women's Murder Club, the third his own FAQ names for a reading-order
    question. Pulling it out gives a reader after Patterson's YA register a
    single run of nine books with nothing else mixed in, a different
    readership from the adult crime series that otherwise fill this
    catalogue. No two entries share a publication year, so this is a plain
    thread pull with no ties to resolve. It excludes the two-book Hawk
    spin-off (2020-2021, a new protagonist in the same world) and the
    ten-volume manga adaptation, both real but separate lines a reader who
    finishes this run can move to next. The cost of reading it as its own
    block: the flock's story was billed as complete at Nevermore (2012), and
    Maximum Ride Forever (2015) reopens it three years later as a
    continuation some series readers treat as optional.
  orderedWorkIds:
    - james-patterson/the-angel-experiment
    - james-patterson/schools-out-forever
    - james-patterson/saving-the-world-and-other-extreme-sports
