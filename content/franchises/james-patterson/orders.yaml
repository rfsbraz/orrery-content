- id: james-patterson/womens-murder-club
  name: The Women's Murder Club, the novels in order
  type: curated
  source: canon
  rationale: >
    Four professional women investigating crime together in San Francisco - a
    police detective, a medical examiner, a prosecutor and a crime reporter -
    and, with Alex Cross and Maximum Ride, one of the three series Patterson's
    own FAQ names when asked what order to read him in. Every entry from 1st
    to Die carries its own position in the title, so the sequence needs no
    outside reconstruction: 18th Abduction and 19th Christmas share a 2019
    publication year and the numbers in the titles alone settle which comes
    first. Pulling the twenty-six novels out of the wider catalogue lets a
    reader follow the same ensemble and the same city without Alex Cross,
    Michael Bennett, Private and the standalones the derived order interleaves
    with them. The cost: twenty-six books of one ensemble and one city is a
    narrower read than Patterson's catalogue as a whole, and a reader wanting
    variety of tone across the run is better served by mixing series or
    reading the standalones instead.
