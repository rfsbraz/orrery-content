# Bibliography (Works) - the abstract books; editions and covers are separate
# metadata. IDs are STABLE and permanent (user data references them), and
# `published` records first publication, under the title the book first
# carried: Virgin (1980) rather than the rewritten Cradle and All (2000),
# Black Market (1986) rather than Black Friday, The Jericho Commandment
# (1979) rather than the See How They Run reissue, Murder Games (2017) rather
# than the television-tie-in reissue Instinct, NYPD Red 5 rather than the US
# Red Alert. Where a title differs by market the alternate is recorded in a
# note on the work.
#
# The single largest trap in dating this shelf is that a Patterson book often
# reaches one market a year or more before another, and the American edition
# is the one the bibliographies index. Six entries here are dated by a
# non-American first edition: Count to Ten (Private Delhi, Century, 2016),
# Private Rome, Private Beijing, Private Monaco and Private Dublin (Century,
# 2022-2025, ahead of Little, Brown by two to seven years), Middle School:
# Escape to Australia (Rafe's Aussie [Mis]Adventure, Random House Australia,
# 2015) and three Dog Diaries titles (Arrow (Young), one to two years ahead of
# JIMMY Patterson Books). Each says so in its own note.
#
# Three sources carry this list. The author's own alphabetical checklist at
# jamespatterson.com is authoritative on what exists, on series membership
# (its By Series tab is what settles every `subseries` value here) and on
# which volumes a bindup collects; the publisher's individual title pages at
# hachettebookgroup.com give the jacket credit and an on-sale date per format,
# and are what every date here is checked against where the book is still
# listed; Wikipedia's James Patterson bibliography reaches further back and is
# the only list of several 2016-2018 BookShots novellas that are now out of
# print. Where they disagree the publisher wins, because the publisher is
# reporting its own record.
#
# Scope. Every book credited to James Patterson: novels for adults, for young
# adults and for children, the BookShots novellas, picture books, nonfiction,
# and the manga and graphic-novel adaptations of his own work. Deliberately
# excluded, with the reason in each case:
#
#   - James Patterson Presents titles. His imprint publishes other writers'
#     books under that banner and the checklist lists them alongside his own;
#     they are not his work. Same for the three checklist entries whose own
#     title pages credit somebody else outright (Burn It All Down, The Family
#     That Cooks Together, The Radcliffes).
#   - The twenty BookShots Flames romance titles (Shopping for Love, Once
#     Upon a Kiss, Dawn's Early Light, 50 Hidden Desires, Bedding the
#     Highlander, Bodyguard, the three Diamond Trilogy volumes, The
#     Experiment, Hot Winter Nights, Learning to Ride, the three McCullagh
#     Inn stories, Radiant, The Return, Sabotage, Sacking the Quarterback,
#     Sexy Summer Flings, The Weekend Wife) and their bindups Kisses at
#     Midnight and The Radcliffes. They sit on the checklist's BookShots tab
#     but carry other writers' bylines. Three Flames titles do carry a
#     Patterson credit and are included: Christmas Sanctuary (with Lauren
#     Hawkeye), Love Me Tender (with Laurie Horowitz) and The Mating Season.
#   - Rafe's Aussie [Mis]Adventure, which is not a separate book: Random
#     House Australia published it in 2015 and the same story reached the
#     rest of the world in 2017 as Middle School: Escape to Australia, which
#     carries the 2015 date here. The other four non-American Middle School
#     titles are distinct books and are listed: How I Got Lost in London,
#     Going Bush, Hollywood 101 and G'day, America.
#   - Dog Diaries: Double-Dog Dare (2020) and Dog Diaries: Doggy
#     Doubleheader (2022), two-in-one reissues of books already listed here.
#     Unlike the bindups below they are not on the checklist, which numbers
#     the series 01 to 07 and stops.
#   - Books announced for 2027 and later: Bulldog (with Mike Lupica), Face
#     Off (with J. D. Barker) and Animal Doctors (with Matt Eversmann and
#     Chris Mooney).
#
# Bindups are kept where the checklist sells them as books (Triple Threat,
# Kill or Be Killed, The Family Lawyer, The Moores Are Missing, Two From the
# Heart, Triple Homicide, Murder in Paradise, The 13-Minute Murder, The House
# Next Door, The River Murders, The Palm Beach Murders, The Paris Detective,
# 3 Days to Live, 23 1/2 Lies). Their component novellas are listed separately
# as well, because each was published on its own first - except in 3 Days to
# Live and 23 1/2 Lies, whose stories have never appeared anywhere else.
#
# A component novella carries `containedIn` naming the bindup that reprints it
# whole, so a reader walking the shelf in order meets each story once. Thirty
# two novellas are marked this way. Two cases the field cannot express: the
# title story of The Moores Are Missing, The Family Lawyer and The House Next
# Door has no separate entry, because in each the bindup and its lead novella
# share a title and a year; and the United Kingdom edition of The Moores Are
# Missing collects Kill and Tell and Dead Heat where the American one collects
# The Housewife and Absolute Zero, so those two are contained in the American
# contents only.
#
# canonTier here records the shelf a book belongs to, not its quality:
# `core` is the novels written for adults, `extended` the books for young
# readers and the nonfiction, `apocrypha` the short forms - BookShots
# novellas, short stories, bindups, and the manga and graphic-novel
# adaptations drawn by other hands.
#
# `subseries` follows the publisher's own By Series tab wherever it has an
# opinion, which is most of the shelf. Fourteen sequences it does not list
# are taken from Wikipedia's bibliography, which groups them under named
# series headings: Travis McKinley (the three golf novels, which the
# checklist files only under a Golf Novels category), When the Wind Blows,
# Honeymoon, Zoo, Caleb Rooney, David Shelley, and the BookShots micro-series
# Jon Roscoe, Owen Taylor, Mitchum and Detective Luc Moncrief - plus Katt &
# Dogg, MK's Detective Club, The Time Travel Twins and Little Geniuses, which
# the checklist numbers as series in its alphabetical listing without giving
# them a By Series entry.
#
# One boundary worth stating because it looks wrong at a glance: the six
# unnumbered Cross books the publisher files under "Others (Not Part of Main
# Series)" - Alex Cross's Trial, Merry Christmas Alex Cross, Cross Kill,
# Detective Cross, Cross Down and Cross & Sampson - carry
# `subseries: "Alex Cross"`, because that is where the publisher puts them,
# even though two of them follow John Sampson rather than Cross. Ali Cross is
# a different matter and is its own subseries: a separate middle-grade line
# about Cross's son, separately numbered and separately marketed.
#
# Illustrators are not recorded in `withAuthorIds`, which is why the picture
# books mostly stand alone here even though the publisher's contributor list
# names the artist alongside Patterson: Michael Garland, Hsinping Pan, Sydney
# Hanson, Joe Kulka and the Middle School and I Funny illustrators drew books
# somebody else wrote. What `withAuthorIds` records is whoever made the book
# as a book - the writing collaborator for the prose, and for the manga and
# graphic-novel adaptations the adapter and the artist, since the adaptation
# is their work and not Patterson's.

