# Bibliography (Works) - the abstract books; editions and covers are separate
# metadata. IDs are STABLE and permanent (user data references them), and
# `published` records first publication, under the title the book first
# carried: Virgin (1980) rather than the rewritten Cradle and All (2000),
# Black Market (1986) rather than Black Friday, Murder Games (2017) rather
# than the television-tie-in reissue Instinct, NYPD Red 5 rather than the US
# Red Alert. Where a title differs by market the alternate is recorded in a
# note on the work.
#
# Two sources carry this list, and they disagree about its edges. The
# author's own alphabetical checklist at jamespatterson.com is current and
# authoritative on what is in print, on series membership (its By Series tab
# is what settles every `subseries` value here) and on who is credited on the
# jacket; Wikipedia's James Patterson bibliography reaches further back, is
# the only list of the 2016-2018 BookShots novellas, and is the source of
# first-publication years for everything before roughly 2023. Where the
# checklist's own title page gives a co-author it is preferred over
# Wikipedia's, because it is the jacket credit itself.
#
# Scope. Every book credited to James Patterson: novels for adults, for young
# adults and for children, the BookShots novellas, picture books, nonfiction,
# and the manga and graphic-novel adaptations of his own work. Deliberately
# excluded, with the reason in each case:
#
#   - James Patterson Presents titles. His imprint publishes other writers'
#     books under that banner and the checklist lists them alongside his own;
#     they are not his work. Same for the three checklist entries whose own
#     title pages credit somebody else outright (Burn It All Down, The Family
#     That Cooks Together, The Radcliffes).
#   - The BookShots Flames romance line. Those titles sit on the checklist's
#     BookShots tab but carry other writers' bylines, and no independent
#     source credits Patterson on them; the handful that Wikipedia does
#     credit to him (Christmas Sanctuary, Love Me Tender, The Mating Season)
#     are included.
#   - Five Australian and British Middle School titles (How I Got Lost in
#     London, Rafe's Aussie Adventure, Going Bush, Hollywood 101, G'day
#     America). Neither source establishes whether these are separate books
#     or retitled editions of ones already listed here.
#   - The Family Cross, announced as the next Alex Cross novel with no
#     release date on the publisher's record, so there is nothing to date it
#     against.
#
# Bindups are kept where the checklist sells them as books (Triple Threat,
# Kill or Be Killed, The Family Lawyer, Triple Homicide, Murder in Paradise,
# The House Next Door, The River Murders, The Palm Beach Murders, The Paris
# Detective, Two From the Heart, The Moores Are Missing). Their component
# novellas are listed separately as well, because each was published on its
# own first.
#
# canonTier here records the shelf a book belongs to, not its quality:
# `core` is the novels written for adults, `extended` the books for young
# readers and the nonfiction, `apocrypha` the short forms - BookShots
# novellas, short stories, bindups, and the manga and graphic-novel
# adaptations drawn by other hands.
#
# `subseries` follows the publisher's own By Series tab wherever it has an
# opinion, which is most of the shelf. Fourteen sequences it does not list
# are taken from Wikipedia's bibliography, which groups them under named
# series headings: Travis McKinley (the three golf novels, which the
# checklist files only under a Golf Novels category), When the Wind Blows,
# Honeymoon, Zoo, Caleb Rooney, David Shelley, and the BookShots micro-series
# Jon Roscoe, Owen Taylor, Mitchum and Detective Luc Moncrief - plus Katt &
# Dogg, MK's Detective Club, The Time Travel Twins and Little Geniuses, which
# the checklist numbers as series in its alphabetical listing without giving
# them a By Series entry.
#
# One boundary worth stating because it looks wrong at a glance: the six
# unnumbered Cross books the publisher files under "Others (Not Part of Main
# Series)" - Alex Cross's Trial, Merry Christmas Alex Cross, Cross Kill,
# Detective Cross, Cross Down and Cross & Sampson - carry
# `subseries: "Alex Cross"`, because that is where the publisher puts them,
# even though two of them follow John Sampson rather than Cross. Ali Cross is
# a different matter and is its own subseries: a separate middle-grade line
# about Cross's son, separately numbered and separately marketed.
#
# Illustrators are not recorded in `withAuthorIds`; the credit recorded there
# is the writing collaborator named on the jacket.

