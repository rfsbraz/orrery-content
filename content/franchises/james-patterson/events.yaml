# FRANCHISE-SPECIFIC events only. Author-LIFE events live on the author entity
# (content/authors/james-patterson.yaml), since they follow the person across
# any franchise. Shared world/culture events live in content/events/global.yaml.
# Inline references use [[type:id|text]] and must resolve (see CONCEPT §4c).
#
# This shelf changes shape twice, and both turns are dated here. A television
# commercial Patterson wrote and paid for himself puts Along Came a Spider on
# the bestseller list in 1993; the collaborator model that begins in 1996 turns
# one novelist into the fifteen to twenty titles a year the bibliography
# records from the mid-2000s on. Everything before 1993 is a part-time career
# that produced one novel between 1980 and 1989.
#
# When the collaborations began. The practice is usually placed in the 2000s,
# with the Women's Murder Club and Michael Bennett books. It is earlier:
# Miracle on the 17th Green (1996), drafted by Peter de Jonge from Patterson's
# outline, is the first novel to carry a second name, and the two nonfiction
# books with Peter Kim (1991, 1994) carry one before that. Britannica, the
# Observer's 2009 profile and the New York Times's 2009 piece on de Jonge all
# fix the novels' starting point at that book. A 2017 stylometry paper instead
# dates the decision to scale collaboration up to a three-book year in 2000;
# the bibliography puts the three-book year in 1996 (Miracle on the 17th Green,
# Hide & Seek, Jack & Jill), with one title published in 2000.
#
# Where the 2010 New York Times Magazine profile and the bibliography disagree
# on a date, the bibliography wins: Black Market is 1986, not the 1987 the
# profile gives it.

- id: berryman-edgar-1976
  date: 1976
  title: A first novel nobody wanted takes the Edgar
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:james-patterson/the-thomas-berryman-number|The Thomas Berryman
    Number]] is turned down by more than a dozen publishers before Little,
    Brown buys it, sells around ten thousand copies, and wins the Mystery
    Writers of America's Edgar Award for Best First Novel the following year.
    It is also the last book Patterson writes this way: brooding, stylised,
    closer to Chandler than to anything he becomes known for. He has since
    said its sentences are the best he has written and its story the weakest,
    and that he could not have made a living writing more of them.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
    - https://web.archive.org/web/20130929023535/http://www.theguardian.com/books/2009/apr/05/james-patterson-author-bestseller
    - https://www.britannica.com/biography/James-Patterson

- id: season-of-the-machete-disowned-1977
  date: 1977
  title: The one book he tells readers to skip
  scope: culture
  reach: franchise
  impact: low
  description: >
    [[work:james-patterson/season-of-the-machete|Season of the Machete]], about
    a husband-and-wife pair carrying out machete killings on a Caribbean
    island, is the single title Patterson publicly disowns. "That's an
    absolutely horrifying book," he told the New York Times Magazine in 2010.
    "I actually tell people not to read it." A reader who handed him a copy to
    sign at a New Jersey bookshop weeks later got the same advice across the
    table.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html

- id: one-novel-in-nine-years-1986
  date: 1986
  title: Nine years, one novel
  scope: industry
  reach: franchise
  impact: med
  description: >
    [[work:james-patterson/black-market|Black Market]] is the only novel
    Patterson publishes between 1980 and 1989. The books that followed his
    debut appeared with several different houses and drew neither sales nor
    reviews, and through these years his working life is advertising rather
    than fiction: he writes at night and at weekends while climbing to the top
    of J. Walter Thompson's North American company. The career that later
    produces fifteen to twenty titles a year is, for most of this decade,
    producing none.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
    - https://www.britannica.com/biography/James-Patterson

- id: back-to-little-brown-1989
  date: 1989
  title: Back to the publisher he started with
  scope: industry
  reach: franchise
  impact: med
  description: >
    Patterson left Little, Brown after his debut and spent the 1980s at other
    houses. He returns in 1989 with
    [[work:james-patterson/the-midnight-club|The Midnight Club]], four years
    before [[work:james-patterson/along-came-a-spider|Along Came a Spider]],
    and stays: Little, Brown has been his publisher ever since, and counted its
    twentieth year of publishing him from this book. The relationship becomes
    unusual in its scale, with staff assigned to his books alone and marketing
    meetings held in his living room.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html

- id: spider-television-commercial-1993
  date: 1993
  title: The novelist who bought his own television advertisement
  scope: industry
  reach: franchise
  impact: high
  description: >
    Little, Brown resisted advertising
    [[work:james-patterson/along-came-a-spider|Along Came a Spider]] on
    television. Patterson's earlier books had sold poorly, series characters
    were thought to need slow building, and selling a novel like a household
    product was expected to put readers off. Patterson, by then running J.
    Walter Thompson's North American company, wrote, produced and paid for the
    commercial himself: a spider dropping down the screen, closing on the line
    "You can stop waiting for the next Silence of the Lambs." The publisher
    then shared the cost of running it in New York, Chicago and Washington. The
    book entered the New York Times hardcover list at number nine, which bought
    it the tables by the door, and it remains his best-selling title. Alex
    Cross has a series from here, and publishing has a template for marketing a
    novelist the way a brand is marketed.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
    - https://www.britannica.com/biography/James-Patterson

- id: first-collaborator-1996
  date: 1996
  title: The first book with a second name on the cover
  scope: industry
  reach: franchise
  impact: high
  description: >
    [[work:james-patterson/miracle-on-the-17th-green|Miracle on the 17th
    Green]] is drafted by Peter de Jonge, a copywriter in Patterson's own
    agency and an occasional golf partner, from an outline Patterson supplied,
    and is the first Patterson novel to carry a collaborator's name. The two
    men remember the beginning differently: de Jonge recalls Patterson, then
    the agency's chairman, putting his head round the door of the office where
    he was quietly writing magazine pieces instead of advertising copy;
    Patterson recalls a beer in a clubhouse after a round of golf. Little,
    Brown warned that co-authors would dilute the brand. Patterson published
    three books that year instead of one, all bestsellers, and the arrangement
    behind most of this shelf dates from here: a long and highly specific
    outline from him, a draft from the collaborator, repeated rewriting by him,
    and the collaborator paid out of his own pocket rather than by the
    publisher.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20120401042703/http://www.nytimes.com/2009/05/05/books/05dejo.html
    - https://web.archive.org/web/20130929023535/http://www.theguardian.com/books/2009/apr/05/james-patterson-author-bestseller
    - https://www.britannica.com/biography/James-Patterson

- id: alex-cross-on-screen-1997
  date: 1997-10-03
  title: Morgan Freeman becomes Alex Cross
  scope: culture
  reach: franchise
  impact: med
  description: >
    Kiss the Girls reaches cinemas with Morgan Freeman as Cross and Ashley
    Judd as the survivor who hunts alongside him, made for $27 million and
    taking around $100 million. Freeman returns for Along Came a Spider in
    April 2001, taking around $105 million, so screen audiences meet Cross in
    the reverse of the novels' order: the second book is filmed first, the
    first book second. Patterson thought little of either film, and as late as
    2010 nothing adapted from his books had been a hit on screen.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Kiss_the_Girls_(1997_film)
    - https://en.wikipedia.org/wiki/Along_Came_a_Spider_(film)
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html

- id: books-for-a-reluctant-reader-2005
  date: 2005
  title: Written for a boy who would not read
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:james-patterson/the-angel-experiment|The Angel Experiment]], the
    first Maximum Ride book, is Patterson's first novel for young readers. He
    has traced the turn to his son, a reluctant reader, and to a summer
    bargain that traded household chores for an hour of reading a day, and to
    the conclusion that plain sentences and short chapters suit a child who has
    never finished a book. The children's and young-adult lines that follow
    become the fastest-growing part of the shelf and eventually outnumber the
    thrillers on it.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
    - https://www.neh.gov/award/james-patterson

- id: jimmy-patterson-imprint-2015
  date: 2015-05-28
  title: He becomes his own publisher
  scope: industry
  reach: franchise
  impact: med
  description: >
    Announced at BookExpo America: JIMMY Patterson, an imprint of Little,
    Brown publishing eight to twelve children's books a year, with Patterson
    choosing the manuscripts and shaping the marketing for each, and writing
    four to six of them himself annually. He said he would give his earnings as
    its publisher to his literacy programmes. It is why so many of the
    middle-grade and young-adult titles here carry an imprint with his own name
    on it, and why the checklist those titles come from also lists books by
    other writers that are not his.
  spoilerAfter: null
  sources:
    - https://web.archive.org/web/20150530000223/http://www.nytimes.com/2015/05/29/business/media/james-patterson-best-selling-crime-novelist-is-starting-an-imprint-for-childrens-books.html
    - https://www.neh.gov/award/james-patterson

- id: stylometry-of-the-collaborations-2017
  date: 2017
  title: Counting the words to see whose they are
  scope: culture
  reach: franchise
  impact: med
  description: >
    Simon Fuller and James O'Sullivan publish a stylometric study of the
    collaborations in Digital Humanities Quarterly, clustering the co-written
    novels against solo books by Patterson, Andrew Gross and Peter de Jonge,
    and find that the collaborators commit the great majority of the prose to
    paper. The finding contradicts nothing Patterson says about himself; he has
    been open that he supplies plots rather than sentences. What it settles is
    the proportion, and what it raises is whether it is plot or language that
    makes the storyteller, which is the question this shelf asks of every
    reader who picks up a book with two names on it.
  spoilerAfter: null
  sources:
    - http://www.digitalhumanities.org/dhq/vol/11/1/000286/000286.html
    - https://www.theguardian.com/books/booksblog/2018/jun/07/bill-clinton-james-patterson-the-president-is-missing-co-authors

- id: the-president-is-missing-2018
  date: 2018
  title: The collaboration where he was the scribe
  scope: culture
  reach: franchise
  impact: med
  description: >
    Announced in May 2017 and published in June 2018 jointly by Alfred A.
    Knopf and Little, Brown,
    [[work:james-patterson/the-president-is-missing|The President Is Missing]]
    is the one book here whose second name is set in the same size as
    Patterson's. Running the same stylometric test on it, O'Sullivan found the
    usual result reversed: Patterson's is the dominant style through the
    novel, with the signal shifting to Bill Clinton only in the finale, the
    passage reviewers read as the former president's own thinking about power.
    On his most conspicuous collaboration, Patterson did the writing.
  spoilerAfter: null
  sources:
    - https://www.theguardian.com/books/booksblog/2018/jun/07/bill-clinton-james-patterson-the-president-is-missing-co-authors
    - https://web.archive.org/web/20170509193539/https://www.nytimes.com/2017/05/08/books/james-patterson-and-bill-clinton-team-up-to-write-a-novel.html

- id: cross-on-television-2024
  date: 2024-11-14
  title: The screen hit, thirty-one years on
  scope: culture
  reach: franchise
  impact: med
  description: >
    Cross premieres on Prime Video with Aldis Hodge as Alex Cross, with
    Patterson among its executive producers. It is renewed for a second season
    before the first has aired, the second arrives in February 2026 and a third
    is ordered the following month. The gap the 2010 New York Times Magazine
    profile named, the best-selling novelist alive with nothing successful made
    from his books, closes here, three decades after
    [[work:james-patterson/along-came-a-spider|Along Came a Spider]].
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Cross_(American_TV_series)
    - https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html
