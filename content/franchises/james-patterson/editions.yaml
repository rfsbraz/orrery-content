# Editions of James Patterson: 416 English (en) editions over 415 of 480
# works, plus 67 Portuguese (pt-PT) editions over 67 of 480 works (one work,
# Virgin, carries two en editions - see below - which is where 416 and 415
# diverge). 416 of the 480 works carry at least one edition.
#
# COVERAGE, BY TIER. core 196/220, extended 143/155, apocrypha 77/105. The 64
# empty works skew heavily toward: 2024-2026 titles too new for a source to
# have indexed yet (about a third of the gap); the ten Maximum Ride manga
# volumes, three Daniel X manga volumes and three Witch & Wizard manga
# volumes, none of which OpenLibrary's author sweep surfaced under a
# matchable title; and a long tail of 2016-2022 BookShots-era novellas and
# Private/Alex Cross entries whose own OpenLibrary work record returned no
# candidate at all. One is worth a second, human look rather than being
# treated as settled: Black Market (1986) was reissued as Black Friday and
# may be indexed only under that title.
#
# SOURCING (en). Every candidate came from one sweep of OpenLibrary's author
# search (`scripts/metadata/lookup.py james-patterson --author "James
# Patterson" --markets en,pt --limit 1000 --json`), which returned 6193
# English-market rows; every ISBN kept here carries its own OpenLibrary
# edition permalink (openlibrary.org/books/OL...M), not a search snippet, and
# every isbn13 was re-derived from the check digit rather than trusted from
# the record.
#
# THE SAME-SURNAME TRAP. 1263 of those 6193 rows were Henry Patterson (Jack
# Higgins' legal name) under an author search that does not distinguish first
# names well; every one was dropped on the row's own `same_author` flag
# before anything else ran. A second, quieter trap survived that filter:
# several of the oldest titles (Kiss the Girls, Cat & Mouse, The Thomas
# Berryman Number, The Midnight Club and others) resolved by default to a
# Book-of-the-Month-Club edition (OpenLibrary ISBNs in the 978-0-7394 block)
# rather than the trade edition, because the BOMC record happened to carry
# the work's first-publication year and the trade record did not. Every BOMC
# ISBN found this way was deprioritized in favour of a real trade edition
# once one existed among the candidates, per this file's own tiebreak rule
# (trade beats book-club reprint); none is used unless it was the only
# candidate.
#
# WHICH EDITION. For the large majority of works with several dozen
# candidate SKUs (a full Patterson backlist title can carry a hardcover, a
# same-year Limited/Signed edition, a Large Print edition, an ebook, an
# audiobook, a UK edition and multiple later paperback printings, each its
# own ISBN), the edition recorded is the one from Patterson's own continuous
# US publisher family (Little, Brown and Company / Grand Central Publishing /
# Warner Books / Warner Vision Books / Center Street / Jimmy Patterson Books,
# all the same Hachette lineage) whose year matches the work's own first
# publication year in works.yaml; large-print, library-binding, audio,
# movie/TV tie-in, boxed-set/omnibus and signed/collector's SKUs were
# excluded from consideration throughout. Where no candidate from that family
# survives filtering (a UK-first title, a foreign co-edition, a novella-line
# imprint with its own name), the earliest surviving candidate of any
# publisher is used instead - this is the expected, not the exceptional,
# case for a number of real bibliographic facts already on the shelf:
# - The Private spinoffs Rome, Beijing, Monaco and Dublin (Penguin Random
#   House/Century, 2022-2025) are recorded under their UK-first edition,
#   because the UK reached them years ahead of the US, exactly as
#   works.yaml's own header already documents for this series.
# - Four Middle School titles (Escape to Australia, Going Bush, Hollywood
#   101, How I Got Lost in London) are recorded under Random House
#   Australia or Young Arrow (UK) editions for the same reason: works.yaml
#   dates each by its non-American first edition.
# - The BookShots-era novellas (Deadly Cargo, Airport: Code Red, Dead Heat,
#   Kidnapped, Absolute Zero, The Hostage, The Verdict, Bloody Valentine and
#   others) are recorded under the "BookShots" or UK "Arrow" novella-line
#   imprints Patterson actually published them under; that is correct, not a
#   fallback that failed.
#
# THREE EDITIONS THAT ARE NOT WHAT THEIR TITLE MATCH SUGGESTS, EACH VERIFIED
# BY OPENING ITS OWN RECORD RATHER THAN TRUSTED FROM THE TITLE STRING:
# - Virgin (1980) carries TWO entries. Patterson rewrote the novel and
#   Little, Brown reissued it as Cradle and All in 2000; every "Virgin"
#   candidate OpenLibrary's search actually returns under a matchable title
#   is that rewritten text, so the current in-print Grand Central Publishing
#   edition is recorded under Cradle and All with a note saying so, and the
#   true 1980 McGraw-Hill first edition (out of print, its ISBN converted
#   from OpenLibrary's 10-digit form) is recorded alongside it rather than
#   silently dropped or silently substituted for the original.
# - Operation Zero (2011) and Battle for Shadowland (2010), two Witch &
#   Wizard apocrypha entries, resolve on OpenLibrary only to IDW's
#   graphic-novel adaptations, noted as such on each entry below (the schema
#   has no graphic-novel edition format, so `format` is left unset rather
#   than mislabelled paperback or hardcover); no prose edition of either was
#   found by this sweep, so the comic is what is recorded, flagged as such
#   rather than passed off as a prose novella.
# - Torn Apart (2008)'s OpenLibrary work record mixes a genuine Century (UK)
#   hardcover with an ebook-flagged Random House Publishing Group record
#   sharing the same year; the Century hardcover is recorded, the ebook is
#   not.
#
# TWO SMALLER HONEST GAPS. The Day America Told the Truth (1991)'s only
# OpenLibrary candidates carried no isbn13 at all; its isbn13 here is
# converted from the Prentice Hall Press first edition's 10-digit ISBN,
# 0134634802, and checked against the digit. The Great Mouse Escape (2025)
# has only ever been indexed as a Hachette Audio audiobook so far; no print
# ISBN exists in any source consulted, so format: audiobook is recorded
# rather than guessing a print SKU that has not surfaced yet.
#
# Action (2014) and Boys Will Be Boys (2011) are real but unusual objects,
# recorded with a note rather than silently treated as ordinary novels:
# Action is a 9-page Kindle-exclusive short story co-written with a 2014
# fan-writing-challenge winner, format: ebook; Boys Will Be Boys exists only
# inside HarperCollins' multi-author "Guys Read" anthology of the same name,
# whose ISBN is recorded because that anthology is the story's only
# publication.
#
# SOURCING (pt-PT) AND THE PORTUGUESE PUBLISHING HISTORY. None of the four
# pt-PT retail providers this catalogue's tooling queries (Bertrand, Wook,
# Almedina, Presença's own storefront) returned a single Patterson hit, and
# OpenLibrary's own 'por'-language sweep surfaced only 4 real candidates (of
# 9 nominally 'pt' rows; the other 5 were, again, Henry Patterson editions
# under Portuguese and Brazilian imprints). The pt-PT list below instead
# comes from the Biblioteca Nacional de Portugal's own author index
# (catalogo.bnportugal.gov.pt, index=AUTHOR, browser-UA reachable per
# CURATION.md), which holds 108 catalogue records for "Patterson, James,
# 1947-" once the same-surname noise (11 further Pattersons, none of them
# this one) is excluded. Those 108 records collapse to 65 distinct
# translations plus 2 Bill Clinton co-writes, spanning four publishing eras
# confirmed record by record rather than assumed from the brief: Editorial
# Presença published a handful of standalones and the opening Alex Cross
# novel from 2001 to 2012; Quinta Essência (Alfragide) ran the Women's
# Murder Club from 2009 to 2011; Topseller and its children's-list sibling
# Booksmile (both Porto Editora group) carried the bulk of the run from 2012
# to 2020, restarting the Alex Cross series mid-stream at Cross (2006, sold
# generically as "Alex Cross") rather than continuing from Presença's
# earlier Along Came a Spider; and after 2020 only Patterson's celebrity
# co-writes have continued to appear, one publisher at a time (Bill Clinton
# via Porto Editora, Dolly Parton via Casa das Letras, Michael Crichton via
# Cultura, Viola Davis via Bertrand for 2026). Every translated title below
# was matched to its work via the BNP record's own "Tít. orig." field, never
# guessed from the Portuguese title, and every isbn13 was re-derived from its
# check digit. Pre-2007 Presença titles carry only a 10-digit ISBN in the BNP
# record; four of those (Along Came a Spider, Suzanne's Diary for Nicholas,
# Sam's Letters to Jennifer, Pop Goes the Weasel) are converted to their
# 13-digit form here.
#
# COVERAGE STOPS ARE MARKET FACTS, not research gaps. The Private series'
# Portuguese run ends at Private, Paris (2017); none of Private London,
# Berlin, India, Games, Missing, Royals, Gold, Oz, Vegas-adjacent sequels or
# anything after 2017 has a Portuguese edition in the BNP catalogue. The
# Middle School line stops at Middle School: Born to Rock (2019); Max
# Einstein stops after its second volume (2020); no BookShots novella was
# ever translated. Where a work has no pt-PT entry below, that silence is
# this market fact, not an unfinished search.
#
# ONE MULTI-VOLUME EDITION. Topseller's 2012 "Maximum Ride" release is a
# single BNP catalogue record covering two bound volumes under two ISBNs (1o
# v.: O Resgate de Angel; 2o v., 2013: Adeus à Escola); each ISBN is recorded
# against its own work (The Angel Experiment and School's Out - Forever
# respectively), with a note on each explaining the split.
#
# ONE UNVERIFIABLE SOURCE NUMBER. The BNP record for Doidos à Solta! (2016,
# House of Robots: Robots Go Wild!) prints its own ISBN as 989-989-8839-44-2,
# which is not 13 digits under a real prefix and fails its check digit
# outright. Every neighbouring Booksmile ISBN from the same 2016 batch sits
# in the 978-989-8839-xx-x block, which makes 978-989-8839-44-2 (itself
# check-digit valid) a plausible transposition - but no second source
# confirms that specific number, so isbn13 is left unset here rather than
# silently "corrected" on pattern-matching alone (see CURATION.md and the
# editions skill's own Wee Free Men precedent for why a plausible fix still
# needs a second source before it ships).
#
# THREE APPEARANCES DELIBERATELY EXCLUDED. The BNP catalogue also lists three
# Reader's Digest Selecções condensed-book anthology volumes carrying a
# Patterson story abridged alongside three or four other authors' unrelated
# work: "Bjs." (2016, with a condensed "O Homicídio do Tutancâmon" /The
# Murder of King Tut), "Gralhas" (2002, a condensed "Diário para o meu
# filho"/Suzanne's Diary for Nicholas, redundant with Presença's full 2003
# translation below) and "Nem um Adeus" (2007, a condensed "Juiz e Júri"/
# Judge & Jury). None is recorded: each ISBN describes the multi-author bound
# volume, not Patterson's story alone, the same reasoning the Harlan Coben
# file already applies to its own Reader's Digest anthology finding. The
# Murder of King Tut and Judge & Jury accordingly carry no pt-PT edition at
# all in this file - a condensed multi-author excerpt is not a fact this
# schema has a field for, and inventing one would misrepresent what a reader
# could actually buy.
#
# Region-strict throughout: every pt-PT isbn13 below carries a 978-972 or
# 978-989 prefix (Portugal); none is a pt-BR edition mislabeled pt-PT.

