# Creative periods. There are none on record.
#
# No critic, scholar, reference work, settled fan consensus or Patterson
# himself divides this 480-title, 1976-2026 shelf into named creative periods
# with recognisable names and boundary years. Searched in English, the only
# language his criticism is written in.
#
# What the fullest sources actually do:
#
#  - His own site and Wikipedia both run one undivided, chronological
#    "writing career" narrative from the 1976 debut to the current year, with
#    no phase language anywhere in either.
#  - The deepest profile, David Kirkpatrick's 2010 New York Times Magazine
#    piece (https://web.archive.org/web/20201229113830/https://www.nytimes.com/2010/01/24/magazine/24patterson-t.html),
#    narrates the advertising years, the 1993 spider commercial, the
#    collaborator system and the children's books as one continuous story
#    about how he works, not as a sequence of named periods. Same for Sam
#    Leith's 2009 Guardian profile
#    (https://web.archive.org/web/20130929023535/http://www.theguardian.com/books/2009/apr/05/james-patterson-author-bestseller):
#    biography end to end, no phase divides it.
#  - The one full-length critical study, Joan G. Kotker's James Patterson: A
#    Critical Companion (Greenwood, 2004), is built exactly like Mary Beth
#    Pringle's Grisham volume in the same series: one chapter per novel (The
#    Thomas Berryman Number, Along Came a Spider, Kiss the Girls, Jack & Jill,
#    Cat & Mouse, Pop! Goes the Weasel, Roses Are Red, Violets Are Blue, Four
#    Blind Mice, 1st to Die, 2nd Chance), not a periodisation, and it stops in
#    2002 - fourteen years and roughly 400 titles before the end of the
#    bibliography this file covers, so it cannot speak to any turn after that
#    date either way.
#  - The one academic study that reaches past 2002, Simon Fuller and James
#    O'Sullivan's stylometric analysis in Digital Humanities Quarterly
#    (http://www.digitalhumanities.org/dhq/vol/11/1/000286/000286.html),
#    measures how much of the collaborative prose is whose. It answers a
#    question about authorship, not about periods, and proposes no phases.
#
# Three candidate boundaries are already documented as dated, sourced facts on
# this shelf's own events.yaml and author lifeEvents. Each is tested here
# against the bibliography itself, not assumed from the fact alone.
#
#  - THE 1996 COLLABORATOR SHIFT (patterson-leaves-advertising-1996,
#    first-collaborator-1996) IS A PRODUCTION-METHOD FACT, NOT A BIBLIOGRAPHIC
#    HINGE. Miracle on the 17th Green (1996) is real: the first Patterson book
#    with a second name on it. But the flagship series does not turn with it.
#    Jack & Jill, the Alex Cross novel published the same year, is solo, and
#    so is Cat & Mouse the following year - the series that defines the shelf
#    runs solo for two more books after the "first collaborator" event. The
#    bibliography's own authorship credits climb gradually rather than
#    stepping in 1996: no book carries a co-author before 1991 (nonfiction,
#    Peter Kim), the fiction share is a single title in 1996 out of three,
#    stays under half most years to 2004, first passes half in 2005-2007, and
#    only becomes near-universal (90%+) from 2008 on - twelve years after the
#    event this would date the era to. A boundary a source can name in one
#    year but the shelf itself takes twelve to reach is the shelf's own
#    evidence against the boundary, the same failure Lee Child's 2020 byline
#    change hits on this catalogue: a real, dated, sourced fact about who
#    wrote the books that the bibliography does not actually cut on.
#  - THE GENERAL SOLO-TO-HIGH-VOLUME SHIFT FAILS THE SAME WAY, ON VOLUME
#    RATHER THAN CREDIT. Output does not step up in 1996 either: one to three
#    titles a year through 2000, still single digits through 2007, low
#    double digits by 2010-2015, a spike to 48 and 59 titles in 2016-2017,
#    then back down to the high teens and twenties every year since. That
#    shape is a ramp-up-then-plateau-then-recede, not a before/after; a line
#    drawn at 1996, or anywhere else on this curve, tiles a gradient rather
#    than marking a turn anyone has named.
#  - JIMMY PATTERSON (jimmy-patterson-imprint-2015) IS A REAL, DATED,
#    SOURCED PUBLISHING FACT THAT FAILS ON FIT, NOT ON SOURCING - THE SAME WAY
#    "THE COLIN SMYTHE YEARS" WOULD MISDESCRIBE PRATCHETT. It is one imprint
#    among several concurrent homes for Patterson's children's and YA work
#    (Maximum Ride, Daniel X and Witch & Wizard all run through other imprints
#    and are not JIMMY titles), publishing, by its own 2015 announcement,
#    four to six Patterson-written books a year out of the fifteen to twenty
#    the whole shelf produces. The children's readership itself long predates
#    it: Patterson's first YA novel, The Angel Experiment, is 2005, a decade
#    before JIMMY exists. An era plate at 2015 would render full-bleed across
#    the adult thrillers, the existing Maximum Ride and Daniel X series and
#    the general fiction that all continue unbroken through and after it -
#    the same concurrency the Grisham file records for the non-legal novels,
#    which "sit beside a legal thriller in the same or the adjacent year"
#    rather than displacing it.
#
# Nothing else in the record offers a fourth candidate. Fandom has not named
# a period either: the phase language that exists online is single-title
# ranking and "which Cross book to start with" advice, not a career-wide
# scheme, and no two independent sources use the same term for any stretch of
# this shelf.
#
# eras: [] is the honest record of a career whose only book-length critical
# treatment stops at 2002 and reads chronologically even there, and whose
# best-documented turning points - a co-author's name, a children's imprint -
# are true, dated facts about how and where the books were made that the
# bibliography itself does not divide into befores and afters.
[]
