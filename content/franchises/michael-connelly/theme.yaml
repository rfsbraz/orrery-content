# Branding for the Michael Connelly wing (see docs/SCHEMA.md#themeyaml).
#
# Checked against the catalogue's existing crime wings before choosing: Tana
# French (wet peaty Irish green-grey), Gillian Flynn (pale overcast Midwest
# newsprint-grey), Jo Nesbo (cold Nordic blue-white) and Karin Slaughter
# (warm humid Georgia olive-green) all claim their own registers already.
# None of them is Los Angeles. This wing's register is the one they leave
# open: LA basin haze at dusk, warm rather than cold, urban rather than
# rural or Nordic.
preset: murder-book-noir
palette:
  bg: "#1a1410"       # near-black with a warm sepia-brown cast - LAPD case
                      # file paper gone dark, an LA dusk haze over the
                      # basin; warmer and browner than Jim Butcher's violet
                      # night or Karin Slaughter's olive-green humidity
  surface: "#241c15"  # a shade lifted, for cards
  ink: "#ece2cf"      # warm parchment - case-file paper, high contrast
  muted: "#948572"    # dusty tan, for metadata
  accent: "#b8622c"   # a burnt copper-orange - LA's smog-filtered sunset
                      # light and the brass of the jazz Connelly and Bosch
                      # both listen to while working; distinct from Jim
                      # Butcher's cooler sodium-amber streetlamp glow
displayFace: sourceSerif  # from the app's implemented set (fraunces | spectral
                          # | sourceSerif). Connelly is a former crime-beat
                          # reporter whose own prose, per critic David
                          # Geherin, "deliberately avoids ornate language...
                          # anything [that might] inhibit the forward
                          # momentum" - the plainest of the three faces fits
                          # writing built for speed and clarity over style
signature: thread   # a quiet hairline the works are strung along - and a
                    # literal description of this wing's own structure:
                    # Harry Bosch's own unbroken numbering (1-26) is the one
                    # thread every other subseries (Haller, Ballard, McEvoy,
                    # McCaleb, and now Catalina) crosses at some point, per
                    # Connelly's own description of his work as one canvas
                    # his characters cross and recross
# ART. The catalogue's other three crime instruments are each a real object
# from the author's own life outside fiction: Tana French's chair under a
# bulb (an audition, then a real interrogation); Gillian Flynn's copy-desk
# rule (a decade editing text at Entertainment Weekly); Jo Nesbo's ruled
# ledger page (his years as a financial analyst); Karin Slaughter's stainless
# exam table (a small-county forensic examiner's own furniture). This wing's
# instrument is the murder book: not a tool from a former career but the
# actual LAPD case object Connelly met firsthand as a police reporter before
# he wrote fiction, and the one nearly every book in the wing turns on
# directly rather than only echoing. Its line is grounded the same way - a
# photo desk's flat annotation mark for procedural objects, loosened only
# into a smog-smudge for the basin's own haze - which keeps this wing's line
# apart from Flynn's dry copy-desk cut and Slaughter's wet dip-pen humidity
# alike.
art:
  emblem:
    object: >
      A closed murder book: a thick, dark blue three-ring binder standing
      upright on its own, swollen with everything slotted inside it, one wide
      rubber band doubled around its width to hold it shut, a blank paper tab
      down its spine where a case number would sit. Drawn alone, resting
      closed on a bare surface, never opened to show a page.
    why: >
      Connelly spent a decade as a police reporter, first at the Fort
      Lauderdale Sun-Sentinel and then on the crime beat at the Los Angeles
      Times, before writing fiction, and it was there he first encountered
      the actual LAPD object the murder book is: the binder a homicide
      detective compiles case by case, every report, photo and lead slotted
      in behind its rings. It is not set dressing borrowed from the genre's
      reputation - it is the physical engine nearly every Bosch novel turns
      on, cold-case work above all, where reopening a killing means pulling
      its murder book back off a records-room shelf. Bosch's own working
      principle, that everybody counts or nobody counts, is what the murder
      book is for: a documented promise that no case stays closed simply
      because it went unsolved. Drawn shut rather than open, because the wing
      draws the object investigators return to, never the evidence inside it.
  motifs:
    - the LA basin at night seen from a hillside window or deck, the street
      grid running out flat to the horizon under a haze that turns the light
      amber rather than white
    - the concrete channel of the LA River, dry-bedded, chain-link along its
      rim, a drainage culvert wide enough to walk into
    - a police helicopter's searchlight sweeping low over rooftops at night,
      its sound implied by the light rather than by the machine itself
    - the back seat of a Lincoln Town Car doing duty as a rolling office,
      case files fanned across the seat, a driver's silhouette up front
    - a courthouse corridor, recessed lighting and worn marble, a bench
      outside a courtroom door
    - a records-room shelf of identical binders receding into the dark, one
      gap where a single volume has been pulled
    - sunset through smog over a freeway interchange, tail-lights strung
      along the concrete in a long red line
  atmosphere: >
    Procedural and unglamorous rather than moody-artistic: the flat,
    functional light of a squad room or a fold-down courtroom table, not
    chiaroscuro staged for effect. Connelly's own prose, trained on deadline
    copy rather than atmosphere for its own sake, sets the register -
    incident is filed, not lingered over. Against that flatness sits the one
    thing allowed to be beautiful: the LA basin itself at dusk, smog-softened
    and amber-lit, the one moment the procedural material and the physical
    world share the same warmth. Never gothic, never rain-slicked; night in
    this wing is dry heat and haze, not weather doing duty for dread.
  lineCharacter: >
    A flat, felt-tip line held level and exact for procedural objects - the
    murder book, a case tab, a badge edge - the same economical mark a
    wire-service photo desk uses to crop and annotate a print, never a
    flourish. The same pen loosens only for the basin haze and smog: there
    the line is dragged sideways with the flat of the nib rather than drawn,
    so the ink smudges into a soft amber grain, as if a case photograph had
    picked up a film of exhaust dust from being carried between records
    rooms. One instrument, two disciplines: exact for the procedural,
    smudged for the atmosphere it works inside.
  backgroundTexture: >
    Aged manila case-file stock, warmed toward sepia and slightly yellowed,
    thumbed soft at the corners from records-room handling, with the faint
    ghost of a duplicated form where a page has been copied one generation
    too many - never the bright white of a fresh sheet.
  accentUse: >
    Burnt copper-orange on exactly one element per image, never as a fill: a
    single sodium streetlamp or brake light in a night skyline, one case tab
    or index marker, a lone brass button, badge edge or trumpet bell (Bosch's
    own jazz).
  avoid:
    - fedora-and-venetian-blinds 1940s hardboiled costume, an anachronism the
      contemporary LAPD setting doesn't wear
    - neon rain-slicked streets played as generic noir weather - the basin's
      dusk haze is dry heat, not rain
    - a gun brandished or shown in use as the image's subject
    - Hollywood-sign, palm-tree or postcard-skyline iconography standing in
      for the city
    - yellow crime-scene tape or a chalk body outline as generic genre
      shorthand
    - the Bosch television adaptation's visual identity - its casting, title
      cards, colour grade
notes: >
  A warm LA-noir register: near-black sepia-brown rather than any of this
  catalogue's existing cold or humid crime palettes, warm parchment ink, one
  burnt-copper accent standing for both smog-lit dusk and brass instruments.
  The art block's instrument is the murder book, drawn shut: a real LAPD case
  object from Connelly's own reporting years rather than a genre prop, held
  to one flat photo-desk line that only loosens into smog-smudge for the
  basin's own haze.
