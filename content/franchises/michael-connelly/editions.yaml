# Editions of Michael Connelly: 51 editions over 47 of 47 works (every work in
# works.yaml carries at least one edition).
#
# COVERAGE
#   en    47 editions, one per work: the true FIRST US TRADE EDITION of every
#         novel and the nonfiction collection (hardcover for the 43 novels +
#         Crime Beat's original printing; the ebook-only originals for the
#         three short-fiction bundles, since no print edition of those exists).
#   pt-PT  3 editions, real published Portuguese translations, verified
#          against Wook's own per-product record: The Brass Verdict, The
#          Fifth Witness and The Waiting. Coverage here is partial, not
#          exhaustive - Connelly is one of Porto Editora's and Cultura
#          Editora's long-running crime backlist authors, and two further
#          Wook listings ("Luna Funesta", "As Garras do Mal") could not be
#          opened (the shop returned HTTP 403 on every attempt) and so are
#          not matched to a work or recorded here.
#   crime-beat, the-brass-verdict, the-fifth-witness and the-waiting each
#   carry two editions (an original + a reissue, or an English + a pt-PT);
#   every other work carries exactly one.
#
# WHICH EDITION, AND WHY. Little, Brown and Company (the Hachette Book Group
# imprint) has published every one of Connelly's 43 novels and Crime Beat's
# 2006 reissue in US hardcover first, without a single break, for over thirty
# years - there is no "which house" question on the English side, only which
# PRINTING. Recorded below is each work's true first hardcover, not whichever
# ISBN a bulk catalogue search surfaces first, for a documented reason: a
# single publisher commonly issues FIVE OR MORE parallel SKUs for one hardcover
# release under adjacent ISBNs - a plain trade edition, a "signed edition", a
# "B&N signed edition", a "B&N Black Friday signed edition", a large-print
# edition, an "international edition" and the ebook - all real, valid,
# catalogued ISBNs attached to the same title, most of them indexed with no
# ranking as to which is the plain trade hardcover. Twelve of this wing's
# titles (Echo Park, The Crossing, Two Kinds of Truth, The Wrong Side of
# Goodbye, Dark Sacred Night, The Night Fire, Fair Warning, The Law of
# Innocence, The Dark Hours, Desert Star, Resurrection Walk, Nightshade) carry
# such a variant ISBN that reads as plausible without the LOC record in hand -
# each is named in its entry's note below, alongside the real ISBN it is not.
# Every entry below is traced to its Library of Congress cataloguing record
# (bath.title+bath.author search, lx2.loc.gov SRU gateway) except the three
# short-fiction ebook bundles (no print CIP record exists for an ebook-only
# release) and the two 2025-2026 titles (Ironwood, The Hollow), which are too
# new for an LCCN and are instead corroborated by the publisher's own product
# page plus a second retailer record (see each entry's sources).
#
# A DARKNESS MORE THAN NIGHT'S YEAR IS 2001 ON THIS EDITION, NOT A CONTRADICTION
# OF WORKS.YAML'S 2000. This edition's own Library of Congress CIP record
# (LCCN 00031025, confirmed via direct SRU lookup) states "Boston: Little,
# Brown, c2001" - the edition's own copyright-page year, recorded as-is
# rather than reconciled against the work's separately-sourced `published:
# 2000` in works.yaml (a fact about the first release, not about this
# printing's own copyright date). Editions here never edit works.yaml, so a
# related problem is flagged instead of fixed: works.yaml's own note cites
# "https://lccn.loc.gov/00046204" as a source for the 2000 date.
# That LCCN resolves to an entirely unrelated book - David E. Bernstein's
# "Only One Place of Redress" (Duke University Press, 2001) - not to any
# Michael Connelly title. The correct LCCN for this edition is 00031025. The
# 2000-vs-2001 date question itself is unaffected (it rests on the other,
# correctly-cited evidence: Wikipedia's infobox and categories, ten
# independent OpenLibrary editions, and the LCCN this file now uses), but the
# citation itself is wrong and should be corrected at the source.
#
# CRIME BEAT carries two editions on purpose, not a duplicate: the original
# 2004 Steven C. Vascik Publications hardcover (a small press; "Not Avail" is
# OpenLibrary's own placeholder for the publisher field, corrected here to the
# name works.yaml's own note already established from the 2006 edition's
# copyright-page reprint statement) and the 2006 Little, Brown and Company
# trade hardcover that superseded it and remains the one a reader can actually
# buy today. The Vascik original is out of print and included per this
# skill's "out-of-print editions earn a slot when they are the only one"
# rule - here it is not the ONLY one, but it is the true first, and dropping
# it would lose that fact.
#
# THE OVERLOOK is genuinely short (225 pages per its own LOC record) - it
# began as a serialized New York Times Magazine piece before its novel
# publication (see works.yaml's note) and was not padded out for book form.
# Not a data error.
#
# PUBLISHED TITLES. No `title` field is set on any `en` entry: the work's own
# title IS the published title throughout, so recording one would manufacture
# a translation event that never happened. The two pt-PT titles ARE real,
# non-literal published titles, matched by synopsis rather than by name, per
# this skill's method: "O Veredicto" ("The Verdict") for The Brass Verdict and
# "A Quinta Testemunha" ("The Fifth Witness," a literal rendering this time)
# for The Fifth Witness. "A Espera" for The Waiting is the one literal,
# unremarkable translation of the three.
#
# SOURCING. Every `en` hardcover entry is corroborated by its Library of
# Congress CIP record (lx2.loc.gov SRU gateway, bath.title+bath.author, cited
# per-record rather than to the search front door) cross-checked against the
# matching OpenLibrary edition record. The three ebook-only bundles rest on
# OpenLibrary alone (no LCCN exists for an ebook with no print counterpart).
# Ironwood and The Hollow rest on the publisher's own product page
# (michaelconnelly.com's own store-link block, and Hachette Book Group's own
# product page respectively) cross-checked against Barnes & Noble's or
# Hachette's own structured (schema.org) product data, which states the
# format explicitly. The three pt-PT entries are Wook.pt's own per-product
# schema.org/Book structured data (JSON-LD), the same source class as this
# catalogue's other Wook-sourced pt-PT entries; Bertrand.pt returned HTTP 403
# on every attempt this session and could not be used as the required second
# source, so each pt-PT entry here rests on Wook alone - stated plainly
# rather than presented as equally corroborated to the `en` entries.
#
# EVERY ISBN-13 CHECK DIGIT WAS COMPUTED, NOT TRUSTED: the standard EAN-13
# algorithm (weights 1,3,1,3...,1,3 over the first twelve digits, check digit
# = 10 - (sum mod 10), or 0 when the sum is already a multiple of ten) run
# over every isbn13 below, independent of what any source's own field said.

# --- Harry Bosch ---
