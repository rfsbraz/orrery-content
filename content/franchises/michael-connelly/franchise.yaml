# A wing spans an author's complete published work; it is not scoped to
# whichever character made them famous. Connelly himself describes his body
# of work as one big canvas his characters cross and recross, so the six
# threads below - Harry Bosch, Mickey Haller, Renée Ballard, Jack McEvoy,
# Terry McCaleb and the new Catalina books - are modelled as `subseries` on
# works.yaml inside this one wing, never as separate franchises. See
# works.yaml's header for how the five Bosch/Ballard joint novels and the
# one Bosch/McCaleb joint novel are each assigned a single subseries.
id: michael-connelly
name: Michael Connelly
kind: author
description: >
  The complete published fiction of Michael Connelly: the ongoing LAPD
  procedural [[work:michael-connelly/the-black-echo|Harry Bosch]] series
  (1992-present, 26 novels), the legal thrillers of defense attorney
  [[work:michael-connelly/the-lincoln-lawyer|Mickey Haller]] (2005-present, 8
  novels), Detective Renée Ballard's own run alongside five further novels
  she shares with Bosch, crime reporter Jack McEvoy's three novels
  (bookended by [[work:michael-connelly/the-poet|The Poet]] and
  [[work:michael-connelly/fair-warning|Fair Warning]]), FBI profiler Terry
  McCaleb's two, the new Catalina Island series introducing Detective
  Sergeant Stilwell (2025-present), two standalone thrillers, three
  short-fiction ebook collections, and one nonfiction collection of
  Connelly's own crime journalism. Every thread shares one Los Angeles and
  one continuous cast that recurs across all of them.
authorIds: [michael-connelly]
themePreset: murder-book-noir
globalEvents:
  include:
    - financial-crisis-2008  # The Fifth Witness is built on the foreclosure-defense beat during the 2008-11 mortgage crisis
    - covid-19-pandemic-2020  # The Dark Hours is explicitly set during the pandemic, opening on New Year's Eve 2020
  exclude:
    - sept-11-2001  # lived through it; no Connelly novel directly addresses it as a central event
    - world-war-i-1914  # predates his lifetime (born 1956)
    - world-war-ii-1939  # predates his lifetime (born 1956)
    - pulp-magazines-1926  # predates him; he is not a pulp writer
    - penguin-paperback-1935  # shaped the publishing landscape he entered, not the books' content
    - armed-services-editions-1943  # predates him; not a veteran
    - lady-chatterley-trial-1960  # predates his publication; no resonance to crime/thriller writer
    - fantasy-paperback-boom-1965  # Connelly writes crime/thriller, not fantasy
    - carnation-revolution-1974  # Portuguese history; Connelly is American, LA-set books
    - chain-bookshop-1982  # shaped retail landscape but not addressed in his books
    - online-bookselling-1995  # shaped his career but not the books' content
    - ebook-and-self-publishing-2007  # infrastructure that didn't reach the page
    - prestige-fantasy-adaptation-2011  # Game of Thrones; Connelly writes crime/procedural, not fantasy
    - booktok-2020  # shaped his book sales but not the books' content
    - portugal-bailout-2011  # Portuguese history; American author
images:
  header: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Downtown_LA_at_Sunset..jpg/1920px-Downtown_LA_at_Sunset..jpg"
  headerCredit: "Kevin Stanchfield, CC BY 2.0"
  headerSource: "https://commons.wikimedia.org/wiki/File:Downtown_LA_at_Sunset..jpg"
  # Downtown LA's skyline just after sunset, the warm purple-orange dusk
  # theme.yaml's palette is built from - the setting every subseries in this
  # wing shares, rather than any one adaptation's still.

# Capabilities auto-detect from the data (docs/SCHEMA.md). This wing earns a
# real connections layer: characters.yaml carries the six-character
# throughline (Bosch, Haller, Ballard, McEvoy, McCaleb, Rachel Walling), and
# works.yaml carries the specific crossover links (Bosch/McCaleb,
# Bosch/Haller, Bosch-Ballard, McEvoy/Haller, Ballard/Catalina). The wizard
# is active too (startHere below). No theme.art, eras.yaml (a reasoned empty
# list, see eras.yaml), editions.yaml or achievements.yaml exists yet.

startHere:
  paths:
    # Structural note, not a citation: the derived default already keeps this
    # safe on its own. Every solo Bosch novel publishes by 2017's Two Kinds
    # of Truth; Ballard's own thread does not fold into his for good until
    # Dark Sacred Night the same year (works.yaml, orders.yaml) - so
    # publication order finishes Bosch's earlier run before her thread joins
    # it, with no curated reordering needed to make that true.
    - id: everything-in-order
      title: Everything, in order
      description: >
        Every novel across Harry Bosch, the Lincoln Lawyer, Renée Ballard,
        Jack McEvoy, Terry McCaleb and the new Catalina series, plus the two
        standalones, in publication order.
      workIds: null
      orderId: default
      fit:
        experience: [completionist]
        commitment: [complete]
      note: >
        Also includes the three ebook-only Bosch short-story bundles and the
        nonfiction collection Crime Beat, alongside the novels.

    # Source: https://www.novelsuspects.com/series-list/which-michael-connelly-book-should-you-read-first/
    # "If you want to start at the very beginning... The Black Echo... Michael
    # Connelly's first novel... introduces readers to his most well-known
    # character, Hieronymus 'Harry' Bosch."
    # Source: https://www.tlbranson.com/michael-connelly-books-in-order/
    # "Michael Connelly's books are easier to follow when you start with Harry
    # Bosch, since Bosch sits at the center of the larger shared world."
    - id: start-with-bosch
      title: Start with Harry Bosch
      description: >
        The original series and the hub every other thread in Connelly's fiction
        eventually crosses: an LAPD detective's career from his Vietnam-
        veteran rookie years toward a retirement he never quite accepts.
      workIds: null
      orderId: michael-connelly/harry-bosch-in-order
      fit:
        experience: [new]
        commitment: [arc]
      note: >
        A long commitment, still growing past 26 novels - the reward is a
        character who visibly ages and changes across three decades of
        cases, at the cost of the newer series's tighter shape.

    # Source: https://www.novelsuspects.com/series-list/which-michael-connelly-book-should-you-read-first/
    # "If you like legal thrillers... The Lincoln Lawyer... introduces readers
    # to Mickey Haller, a criminal defense attorney who operates out of the
    # back of his Lincoln Town Car... Note: Mickey Haller also appears in the
    # Harry Bosch series in Nine Dragons and The Crossing."
    - id: try-lincoln-lawyer
      title: Try the Lincoln Lawyer
      description: >
        Mickey Haller's solo debut: a Los Angeles defense attorney who runs
        his practice from the back seat of a chauffeured car, on a case that
        turns out to be nothing like the easy payday it looked.
      workIds:
        - michael-connelly/the-lincoln-lawyer
      orderId: null
      fit:
        experience: [new]
        commitment: [taste]
      note: >
        A safe taste on its own, but the next book brings Harry Bosch into
        Haller's casework and reveals how the two men are tied to each
        other - if you plan on reading Bosch's own series too, decide which
        one you want to meet that reveal in first.

    # Source: https://www.novelsuspects.com/series-list/which-michael-connelly-book-should-you-read-first/
    # "If you want to read the backstory of Renée Ballard... The Late Show."
    # Source: https://mysterysequels.com/renee-ballard-books-in-order
    # "Her partnership with Harry Bosch, which begins in Dark Sacred Night,
    # becomes central to both series from that point forward."
    - id: try-ballard
      title: Try Ballard
      description: >
        Renée Ballard's solo debut: an LAPD detective exiled to the overnight
        shift after a harassment complaint went nowhere, working two cases
        on her own time that she refuses to hand off at shift's end.
      workIds:
        - michael-connelly/the-late-show
      orderId: null
      fit:
        experience: [new]
        commitment: [taste]
      note: >
        A safe taste on its own, but Ballard partners with Harry Bosch from
        the very next book and their cases stay joined for the rest of her
        run - if you plan on reading Bosch's own series too, read his solo
        novels first so the ground they cover isn't met already underway.

    # Structural note, not a citation: derived directly from the two paths
    # above and orders.yaml's michael-connelly/harry-bosch-in-order.
    - id: continue-into-bosch
      title: Continue into Bosch
      description: >
        For a reader who has tried the Lincoln Lawyer or Ballard and wants
        the series both of them eventually fold into: the complete Harry
        Bosch novels, in order.
      workIds: null
      orderId: michael-connelly/harry-bosch-in-order
      fit:
        experience: [returning]
        commitment: [arc]
      note: >
        Two Kinds of Truth (2017) is the last Bosch novel before Ballard's
        thread joins his for good; reading Bosch's own run from the start
        keeps that merge in its original order rather than meeting it
        already underway.

sources:
  - https://en.wikipedia.org/wiki/Michael_Connelly
  - https://en.wikipedia.org/wiki/Harry_Bosch
  - https://www.michaelconnelly.com/series/
