# Recurring characters whose appearances thread the wing's six subseries
# together - the connective tissue the app's connections map renders, not a
# full character wiki (Connelly's own Wikipedia page lists dozens of
# secondary recurring names; only the ones whose crossovers are sourced and
# load-bearing are kept here). Every appearsIn list below is built directly
# from the author's own "Series Order" page (michaelconnelly.com/series/),
# which lists each character's appearances by name; nothing here is inferred.
#
# Two characters worth the reading discipline: Renée Ballard's own solo
# subseries is a single book (The Late Show) before she becomes a co-lead of
# Harry Bosch's numbered sequence; Terry McCaleb's is likewise a single book
# (Blood Work) before A Darkness More Than Night joins him to Bosch. Their
# appearsIn lists below carry the full picture that a single `subseries`
# string per work (see works.yaml's header) cannot.
#
# TERRY McCALEB carries the wing's one gated fact. His fate turns on The
# Narrows, so his appearance there is gated with spoilerAfter rather than
# described: the row is shielded for a reader who has not yet read that book,
# and no note on it, nor his description, states what becomes of him. The
# Bosch/Haller blood tie is protected too, but it lives in no gated field (it
# is a plot relationship, not an appearance or an event), so it is held out
# of every rendered synopsis and description by wording alone, not by a
# boundary here (see works.yaml's The Brass Verdict note).

- id: michael-connelly/harry-bosch
  name: Hieronymus "Harry" Bosch
  aka: ["Harry Bosch"]
  description: >
    A Los Angeles Police Department homicide detective and Vietnam veteran,
    named by the author after the 15th-century Dutch painter. The lead of
    his own 26-novel series and the hub every other thread in Connelly's fiction
    eventually crosses.
  appearsIn:
    - workId: michael-connelly/the-brass-verdict
      note: First Bosch/Haller crossover; investigating the same murder as Haller's inherited case.
    - workId: michael-connelly/the-reversal
      note: Serves as lead investigator for Haller, prosecuting for once instead of defending.
    - workId: michael-connelly/the-fifth-witness
      note: Brief appearance.
    - workId: michael-connelly/the-gods-of-guilt
      note: Brief appearance.
    - workId: michael-connelly/the-law-of-innocence
      note: Assists Haller's defense from the outside while Haller is jailed.
    - workId: michael-connelly/resurrection-walk
      note: Works as Haller's investigator, slowed by age but still active.
  sources:
    - https://en.wikipedia.org/wiki/Harry_Bosch
    - https://www.michaelconnelly.com/series/

- id: michael-connelly/mickey-haller
  name: "Mickey Haller (J. Michael Haller, Jr.)"
  aka: ["The Lincoln Lawyer"]
  description: >
    A Los Angeles criminal defense attorney who runs his practice from the
    back seat of a chauffeured Lincoln, son of the prominent defense attorney
    J. Michael Haller Sr. Lead of his own 8-novel Lincoln Lawyer series.
  appearsIn:
    - workId: michael-connelly/nine-dragons
      note: Brief appearance.
    - workId: michael-connelly/the-crossing
      note: Bosch works as his defense investigator for the first time.
    - workId: michael-connelly/the-wrong-side-of-goodbye
      note: Supporting appearance.
    - workId: michael-connelly/two-kinds-of-truth
      note: Supporting appearance.
    - workId: michael-connelly/the-night-fire
      note: Supporting appearance.
    - workId: michael-connelly/desert-star
      note: Supporting appearance.
    - workId: michael-connelly/the-hollow
      note: Brings Bosch the news of the class-action settlement that opens the case.
  sources:
    - https://en.wikipedia.org/wiki/Mickey_Haller
    - https://www.michaelconnelly.com/series/

- id: michael-connelly/renee-ballard
  name: Renée Ballard
  description: >
    A Los Angeles Police Department detective transferred to the overnight
    shift after a harassment complaint went nowhere. Solo lead of her own
    debut before becoming Harry Bosch's co-lead across five further novels
    and, from 2026, a cross-channel partner to Catalina's Detective Sergeant
    Stilwell.
  appearsIn:
    - workId: michael-connelly/dark-sacred-night
      note: First joint case with Bosch; co-lead from here through The Waiting.
    - workId: michael-connelly/the-night-fire
      note: Co-lead with Bosch.
    - workId: michael-connelly/the-dark-hours
      note: Co-lead with Bosch.
    - workId: michael-connelly/desert-star
      note: Co-lead with Bosch.
    - workId: michael-connelly/the-waiting
      note: Co-lead with Bosch.
    - workId: michael-connelly/resurrection-walk
      note: Brief appearance.
    - workId: michael-connelly/ironwood
      note: Works the case from the mainland side alongside Stilwell.
    - workId: michael-connelly/the-hollow
      note: Brief appearance.
  sources:
    - https://www.michaelconnelly.com/series/

- id: michael-connelly/jack-mcevoy
  name: Jack McEvoy
  description: >
    A crime reporter whose career runs from the Denver Rocky Mountain News
    to the Los Angeles Times to freelance consumer-affairs journalism as the
    newspaper industry contracts around him. Lead of his own 3-novel
    subseries.
  appearsIn:
    - workId: michael-connelly/a-darkness-more-than-night
      note: Small appearance.
    - workId: michael-connelly/the-brass-verdict
      note: Small appearance.
    - workId: michael-connelly/the-proving-ground
      note: Digs up the whistleblower witness who turns Haller's civil case.
  sources:
    - https://www.michaelconnelly.com/series/

- id: michael-connelly/terry-mccaleb
  name: "Terry McCaleb (Terrell McCaleb)"
  description: >
    A former FBI criminal profiler, recovering from a heart transplant when
    introduced. Lead of his own debut before joining Bosch as a co-investigator
    in his second appearance.
  appearsIn:
    - workId: michael-connelly/a-darkness-more-than-night
      note: Co-lead with Bosch; McCaleb's second appearance.
    - workId: michael-connelly/the-narrows
      note: Small appearance.
      spoilerAfter: michael-connelly/the-narrows
  sources:
    - https://www.michaelconnelly.com/series/

- id: michael-connelly/rachel-walling
  name: Rachel Walling
  description: >
    An FBI agent who first partners with Jack McEvoy and recurs across both
    the McEvoy and Bosch strands over more than two decades.
  appearsIn:
    - workId: michael-connelly/the-poet
      note: First appearance, alongside Jack McEvoy.
    - workId: michael-connelly/the-narrows
      note: Supporting appearance.
    - workId: michael-connelly/echo-park
      note: Supporting appearance.
    - workId: michael-connelly/the-overlook
      note: Supporting appearance.
    - workId: michael-connelly/the-scarecrow
      note: Supporting appearance, alongside Jack McEvoy.
    - workId: michael-connelly/fair-warning
      note: Supporting appearance, alongside Jack McEvoy.
    - workId: michael-connelly/the-reversal
      note: Brief appearance.
    - workId: michael-connelly/the-black-box
      note: Brief appearance.
    - workId: michael-connelly/the-burning-room
      note: Brief appearance.
  sources:
    - https://www.michaelconnelly.com/series/
