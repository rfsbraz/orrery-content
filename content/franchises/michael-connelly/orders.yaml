# ADDITIONAL canon orders only. The DEFAULT order - ALL 47 works in
# publication-chronological order - is derived automatically from works.yaml
# and is NOT listed here.
#
# These four are the four subseries with enough of their own books to walk as
# a thread apart from the rest of the shelf, each filtered to the publisher's
# own numbered list at michaelconnelly.com/series/ - the same pattern Karin
# Slaughter's grant-county-in-order/will-trent-in-order and Agatha Christie's
# poirot-novels/marple-novels orders use. Terry McCaleb (one lead novel, one
# co-lead appearance) and the Catalina series (two books so far) are each too
# thin to walk as their own thread yet; both stay fully covered by the
# derived default.
#
# No combined Bosch + Ballard order exists here, and none is needed: the
# derived default already interleaves both by publication year, and every
# solo Bosch novel through Two Kinds of Truth (2017) precedes Ballard's own
# debut The Late Show (2017) and every book on which they co-lead, so the
# default keeps Bosch's earlier solo run intact before her thread joins his.
# A hand-written copy of that same interleaving, narrowed to just these two
# threads, would carry no information the default does not already give for
# free.

- id: michael-connelly/harry-bosch-in-order
  name: The Harry Bosch novels, in order
  type: curated
  source: canon
  rationale: >
    All 26 Harry Bosch novels, in the publication order the author's own site
    numbers them, from [[work:michael-connelly/the-black-echo|The Black Echo]]
    to the forthcoming [[work:michael-connelly/the-hollow|The Hollow]]. Novels
    only: the three ebook-only short-story bundles tagged to this subseries
    (Angle of Investigation, Suicide Run, Mulholland Dive) are left out here
    because the author's own numbered Bosch list excludes them too, the same
    grain Agatha Christie's Poirot/Marple orders use for her short-story
    collections.
  orderedWorkIds:
    - michael-connelly/the-black-echo
    - michael-connelly/the-black-ice
    - michael-connelly/the-concrete-blonde
    - michael-connelly/the-last-coyote
