# Creative periods. There are none on record.
#
# No critic, reference work or settled fan consensus divides this author's
# career into named creative periods. Reviewers describe an evolution - an
# "early" Bosch, a "mature" or "late-period" Bosch, a widening shared universe -
# but in generic descriptive language, not as a received periodisation with
# period names a reader would recognise the way "the Golden Age of detective
# fiction" or "the Bachman years" are recognised. Career-spanning pieces sort
# the work by character and by publication date and name no phases: First
# Things' survey of "the Michael Connelly literary universe" organises it
# entirely by series and chronology
# (https://firstthings.com/the-michael-connelly-literary-universe/).
#
# The author names no periods of his own. In interviews he frames his "early
# work" only as the years before writing was full-time, with no period label
# and no start or end year (https://strandmag.com/interview-with-michael-connelly/).
#
# The one candidate boundary - the "shift" from Harry Bosch to Renee Ballard as
# the lead - is described by the author and by reviewers as integration, not a
# break: Ballard is woven into late Bosch continuity, the two share cases from
# Dark Sacred Night (2018) onward, and Bosch continues alongside her
# (https://www.michaelconnelly.com/writing/dark-sacred-night/ballard-and-bosch/).
# There is no early/late sequence to cut.
#
# A whole-career periodisation by publication chronology also fails on the
# record itself, not only on sourcing: the series run concurrently, not in
# sequence. Bosch has appeared since 1992, the Lincoln Lawyer (Mickey Haller)
# since 2005 and Ballard since 2017, all inside one shared universe, with
# crossover novels (Bosch/Haller in The Brass Verdict, Bosch/McCaleb in A
# Darkness More Than Night, Bosch/Ballard in Dark Sacred Night) binding the
# strands together in parallel. An era renders full-bleed across the wing's
# whole timeline; any "early Bosch" span would also swallow the concurrent
# Lincoln Lawyer legal thrillers - a different protagonist and subgenre - under
# one plate.
#
# eras: [] is the honest record of a career no one has divided into named
# periods, including its author.
[]
