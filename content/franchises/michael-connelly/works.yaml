# Bibliography (Works) - the abstract books; editions/covers are separate metadata.
# IDs are STABLE and permanent (user data references them). Dates are year-precision
# unless a source states a full date. The default reading order (all works in
# publication order) is DERIVED from this file, so every published work belongs
# here.
#
# Coverage: all 26 Harry Bosch novels, all 8 Lincoln Lawyer (Mickey Haller)
# novels, Renée Ballard's solo debut plus the five further novels she shares
# with Bosch, all 3 Jack McEvoy novels, both Terry McCaleb novels, both
# Catalina novels (Detective Sergeant Stilwell), the two standalones (Void
# Moon, Chasing the Dime), the three Bosch short-fiction ebook collections
# (Angle of Investigation, Suicide Run, Mulholland Dive), and the nonfiction
# collection Crime Beat. Years are taken from the author's own "Series Order"
# page (michaelconnelly.com/series/), cross-checked against Wikipedia's
# bibliography table and, for the three newest titles, the publisher's own
# product pages.
#
# Subseries and the shared-numbering problem: five books (Dark Sacred Night
# through The Waiting) carry BOTH a Harry Bosch number and a Renée Ballard
# number on the author's own site - they are marketed as joint leads, not as
# one character guesting in the other's book. This schema's `subseries` field
# holds one value per work, so a call had to be made: these five are tagged
# "Harry Bosch" because Bosch's own numbering runs unbroken from 1 to 26
# straight through them, where Ballard's numbering only starts in 2017 and is
# the one that is interrupted by his. The dual billing is recorded in a note
# on the hinge work (Dark Sacred Night) instead of a second, invented
# subseries value. The same reasoning places A Darkness More Than Night
# (jointly Bosch's #7 and Terry McCaleb's second appearance) under "Harry
# Bosch" rather than "Terry McCaleb".
#
# Deliberately NOT catalogued as individual works: the four multi-author
# anthologies Connelly edited (The Best American Mystery Stories 2003, Murder
# in Vegas, The Blue Religion, In the Shadow of the Master) - editor-role
# volumes, none built around original long-form Connelly fiction of his own,
# the same call the jim-butcher wing makes about his edited anthologies. The
# Blue Religion also carries one original Connelly story ("Father's Day"),
# which does not change the call: it is one story inside a multi-author
# anthology, the same grain that excludes the several dozen other short
# stories - Bosch/Haller pieces and non-series stand-alones alike - published
# only inside shared multi-author anthologies or magazines (the full list is
# on Wikipedia's "Michael Connelly" page under Short stories): among them
# "Blue on Black," "Blood Washes Off," "Homicide Special," "A Fine Mist of
# Blood," "Red Eye" (co-written with Dennis Lehane, crossing Bosch with his
# Patrick Kenzie), "The Crooked Man," "Nighthawks," "The Guardian," "After
# Midnight," "The Safe Man" (also separately adapted as an audio drama),
# "The Third Panel," and "Avalon" (in TV development at ABC as of 2022). All
# are either already folded into Angle of Investigation, Suicide Run or
# Mulholland Dive, or remain uncollected singletons, including the solo
# ebook short story "Switchblade" (2014). Also not catalogued: the three
# "Harry Bosch Novels" omnibus volumes (2001, 2003, 2010), each of which only
# rebundles novels already listed here individually, and the single
# children's short story "Short Cut" (2009, in the multi-author Half-Minute
# Horrors).

# --- Harry Bosch ---
