  synopsis: >
    Renée Ballard finds Harry Bosch, off the books, going through old case
    files in her station house at night - searching for whoever killed a
    runaway teenager years earlier - and the two detectives, one active and
    one retired, team up to finish what he started.
  note: >
    The first Bosch/Ballard joint novel. From here through
    [[work:michael-connelly/the-waiting|The Waiting]] (2024), five
    consecutive novels carry both a Harry Bosch number and a Renée Ballard
    number on the author's own site - the two are billed as equal leads.
    They are tagged "Harry Bosch" throughout this file (see the file header)
    because Bosch's own numbering is the one that runs unbroken across all
    of them; the joint billing itself is real and is recorded here, once, on
    this hinge work rather than repeated on every one after it.
