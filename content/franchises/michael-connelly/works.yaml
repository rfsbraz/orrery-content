- id: michael-connelly/a-darkness-more-than-night
  title: "A Darkness More Than Night"
  authorIds: [michael-connelly]
  published: 2000
  subseries: "Harry Bosch"
  canonTier: core
  synopsis: >
    Retired FBI profiler Terry McCaleb, called in to consult on a ritualistic
    murder, follows the evidence to a suspect he never expects: Harry Bosch
    himself. Told from both men's points of view, the case becomes as much
    an examination of Bosch's methods as of the killing.
  note: >
    Terry McCaleb's second appearance and the first Bosch/McCaleb crossover
    (see connections). Dated 2000: the Little, Brown hardcover's own
    publication date is November 8, 2000, per Wikipedia's infobox, its "2000
    American novels" categories and its own Harry Bosch series navbox; ten
    separate OpenLibrary library-catalogue editions independently give a
    first-publish year of 2000, and the Library of Congress control number
    00031025 was assigned that same year (a CIP-assignment year, which can
    precede publication). 2001 is a defensible alternative and not merely an
    outlier: the first edition's copyright line reads c2001 and the author's own
    Series Order page lists 2001. 2000 is used here as the better-supported
    date, with the contest noted.
  images:
    cover: "https://covers.openlibrary.org/b/id/8363105-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL111733W"
  sources:
