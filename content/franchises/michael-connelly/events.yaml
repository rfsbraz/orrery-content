# FRANCHISE-SPECIFIC events only. Author-LIFE events live on the author entity
# (content/authors/michael-connelly.yaml). Shared world/culture events live in
# content/events/global.yaml.
#
# Seven entries span the wing's screen life end to end and, between them,
# close two runs of publishing years that carried the least outside context.
# 2012-2019: two industry prizes for two different books in the same year
# (2012), the streaming adaptation that turned a solo novelist into a
# television co-creator and that spawned everything after it (2013-2015),
# and the CWA's career-spanning honor (2018) sit inside the gap itself; the
# two film adaptations that came before it (2002, 2011) and the two later
# expansions of the television side (2022, 2025) give the screen history its
# full shape rather than just its middle. 1996-2000: the risk of publishing
# a Bosch-free novel, and its reward, sits at the front edge of that gap.
#
# Candidates tested and left out:
#   - Bosch: Start of Watch, the announced MGM+ prequel: reported only as an
#     October 2025 series order with a lead actor attached, no premiere date
#     or first-hand account of its origin to anchor an entry to yet
#   - a precise count of how many years Connelly spent pitching a Bosch
#     adaptation before Amazon: his own retelling (in a 2026 tribute to the
#     show's creator) puts the first meeting about a decade before the 2013
#     pilot shoot, but gives no date exact enough to state as a fact
#   - the claim that 1990s film-option money funded Connelly's leap to
#     full-time novelist: he has said so himself, but only one interview
#     carries it, well short of the two-source bar for a living author's
#     finances

- id: michael-connelly/the-poet-breaks-the-bosch-mold-1996
  date: 1996
  title: "The Poet risks the brand: a thriller with no Bosch in it"
  scope: industry
  reach: franchise
  impact: med
  description: >
    Four Bosch novels into a still-new career, Connelly publishes a
    thriller with no LAPD detective in it at all.
    [[work:michael-connelly/the-poet|The Poet]] follows crime reporter Jack
    McEvoy investigating his own twin brother's death, introduces recurring
    FBI agent Rachel Walling, and wins both the Mystery Writers of
    America's 1997 Anthony Award and the Independent Mystery Booksellers
    Association's 1997 Dilys Award, matching the recognition Bosch's debut
    had earned Connelly four years earlier. Little, Brown reissues it in
    paperback in April 2004 with an introduction by Stephen King. The
    gamble proves Connelly's readers will follow him past a single
    detective, opening the door to every thread in this wing that isn't
    Bosch's.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Poet_(novel)
    - https://www.michaelconnelly.com/writing/thepoet/

- id: michael-connelly/blood-work-film-2002
  date: 2002-08-09
  title: Clint Eastwood puts Terry McCaleb on screen, and it bombs
  scope: industry
  reach: franchise
  impact: med
  description: >
    Warner Bros. releases Blood Work, adapted by Brian Helgeland (L.A.
    Confidential) from Connelly's 1997 novel. Clint Eastwood produces,
    directs, and stars as [[character:michael-connelly/terry-mccaleb|Terry
    McCaleb]], the retired FBI profiler recovering from a heart transplant.
    It is the first of Connelly's characters to reach a movie screen, a
    decade after [[work:michael-connelly/the-black-echo|The Black Echo]]
    introduced Bosch, and it underperforms: $31.8 million against a $50
    million budget. Nine years pass before another of his books returns to a
    screen.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Blood_Work_(film)
    - https://www.michaelconnelly.com/writing/bloodwork/blood-work-movie/

- id: michael-connelly/lincoln-lawyer-film-2011
  date: 2011-03-18
  title: Matthew McConaughey nails Mickey Haller, in the author's own verdict
  scope: industry
  reach: franchise
  impact: med
  description: >
    Lionsgate releases The Lincoln Lawyer, adapted by John Romano from the
    2005 novel that introduced Bosch's defense-attorney half-brother
    [[character:michael-connelly/mickey-haller|Mickey Haller]]. Two days
    after seeing an unfinished cut in November 2010, Connelly wrote of
    Matthew McConaughey's performance: "I thought it was very loyal to the
    story and the character of Mickey Haller. Matthew McConaughey nails
    him." Where Blood Work had underperformed, this one is a hit ($87.1
    million against a $40 million budget), reviving Hollywood's confidence
    in adapting Connelly's backlist and, years later, giving Connelly a
    fixed mental image of Haller he says he still writes toward.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Lincoln_Lawyer_(film)
    - https://www.wbur.org/news/2016/12/13/michael-connelly

- id: michael-connelly/double-prize-year-2012
  date: 2012
  title: Two prizes, two different books, one year
  scope: industry
  reach: franchise
  impact: med
  description: >
    In the same year, two separate institutions honor two different
    Connelly novels. [[work:michael-connelly/the-black-box|The Black Box]]
    wins the RBA Prize for Crime Writing, a Spanish award billed as the
    world's most lucrative in the genre at 125,000 euros. Separately, the
    University of Alabama School of Law and the ABA Journal award the 2012
    Harper Lee Prize for Legal Fiction, for the book that "best exemplifies
    the role of lawyers in society," to
    [[work:michael-connelly/the-fifth-witness|The Fifth Witness]] (2011), in
    which [[character:michael-connelly/mickey-haller|Mickey Haller]]
    defends a client accused of killing the banker foreclosing on her home.
    Connelly is chosen from three finalists by a committee that includes
    former Secretary of State Condoleezza Rice and NPR's Nina Totenberg, and
    receives the award at Washington's National Press Club that September.
    A year with no new franchise on screen and no new lead character is, by
    these two institutional measures, one of the most recognized of his
    career.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/RBA_Prize_for_Crime_Writing
    - https://www.abajournal.com/news/article/michael_connelly_wins_2012_harper_lee_prize_for_legal_fiction
    - https://blogs.loc.gov/law/2012/08/author-michael-connelly-wins-2012-harper-lee-prize/

- id: michael-connelly/bosch-amazon-series-2013-2015
  date: 2015-02-13
  title: Bosch reaches the screen, and Connelly joins the writers' room
  scope: industry
  reach: franchise
  impact: high
  description: >
    Years after first meeting television writer-producer Eric Overmyer
    (Homicide, The Wire, Treme) to pitch him on adapting the Bosch novels,
    Connelly and producing partner Henrik Bastin get Overmyer to commit to
    a still-unproven platform: "The show was going to be on this new form
    of television watching called streaming. Amazon was dipping its toe in
    it, and Bosch would be its first drama." Shooting on the pilot begins
    November 4, 2013; Amazon streams it to subscribers in February 2014 to
    let them vote on a full order, greenlights the series that March, and
    releases all ten episodes of season one on February 13, 2015.
    Connelly personally brought Titus Welliver's name to the production
    after seeing him in a supporting TV role, becomes a co-creator and one
    of six writers in the show's room, and describes his own function there
    as "the watchdog of Harry Bosch's integrity" rather than its lead voice,
    a solo novelist's first sustained turn as part of a writing team.
    The series runs seven seasons to 2021, becomes Amazon Prime Video's
    longest-running series to date, and spawns two further spinoffs.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Bosch_(TV_series)
    - https://deadline.com/2026/03/michael-connelly-eric-overmyer-tribute-1236759772/
    - https://www.wbur.org/news/2016/12/13/michael-connelly

- id: michael-connelly/streaming-universe-expands-2022
  date: 2022-05
  title: The Bosch universe splits in two, a week apart
  scope: industry
  reach: franchise
  impact: med
  description: >
    Within a week of each other, two continuations of Connelly's screen
    world premiere on two different services. Bosch: Legacy, which star
    Titus Welliver calls "essentially Bosch season 8," debuts on Amazon
    Freevee on May 6, 2022, less than a year after the original series
    ended; Connelly and Overmyer co-create and executive produce it. On May
    13, Netflix's The Lincoln Lawyer premieres, created by David E. Kelley
    and adapted from [[work:michael-connelly/the-brass-verdict|The Brass
    Verdict]] (2008), with Manuel Garcia-Rulfo taking over the role of
    [[character:michael-connelly/mickey-haller|Mickey Haller]] from
    McConaughey's 2011 film performance. Two different characters, two
    different platforms, the same month: the backlist's screen life
    outlives any single show built on it.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Bosch:_Legacy
    - https://en.wikipedia.org/wiki/The_Lincoln_Lawyer_(TV_series)

- id: michael-connelly/ballard-tv-series-2025
  date: 2025-07-09
  title: Renée Ballard headlines her own show, eight years after her debut
  scope: industry
  reach: franchise
  impact: med
  description: >
    [[character:michael-connelly/renee-ballard|Detective Renée Ballard]],
    introduced as a solo lead in 2017's
    [[work:michael-connelly/the-late-show|The Late Show]] before five
    novels as Bosch's co-lead, gets her own Prime Video series. Announced in
    2023 and developed by Michael Alaimo and Kendall Sherwood with Connelly
    as co-creator and executive producer, Ballard draws on The Late Show,
    The Dark Hours (2021) and Desert Star (2022), stars Maggie Q in the
    title role, and releases all ten episodes on July 9, 2025, with Titus
    Welliver appearing as Bosch. It is renewed for a second season that
    October, the third character from this wing (after Bosch and Haller) to
    lead her own screen adaptation.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Ballard_(TV_series)
