# Branding for the Dan Brown wing (see docs/SCHEMA.md#themeyaml). The `art`
# block, at the bottom of this file, has its own header.
# Checked against every existing wing's palette before choosing.
#
# The obvious reference point for this wing is Brown's own book-cover
# furniture - gilt crosses, wax seals, candlelit cathedral stone - and that
# is exactly what this catalogue's design law (no genre costume) and the
# José Rodrigues dos Santos wing's own notes rule out for a THRILLER wing
# built around conspiracy trappings. But Brown's actual defining device is
# more specific and better documented than that furniture: the ambigram -
# a word redrawn to read identically rotated 180 degrees - designed for his
# covers and interiors by his friend John Langdon (who the character Robert
# Langdon is named after), and the character's whole métier, symbology, is a
# discipline of diagrams, floor plans and cipher grids rather than gothic
# atmosphere. So this wing draws from the drafting table, not the crypt: a
# blueprint/cyanotype register - the technical drawing an ambigram or a
# cipher square is actually built on. Distinct from every blue already in
# the catalogue: cooler and more saturated than João Tordo's muted Atlantic
# azulejo blue-grey (#141a1e bg / #3d6f8c accent) and Jo Nesbo's dark cobalt
# ice-blue (#2a3e8f, on a pale bg); distinct from José Rodrigues dos Santos's
# cathode-teal near-black next door in the catalogue, which reads as a
# newsroom monitor rather than a drafting sheet.
preset: blueprint-cipher
palette:
  bg: "#0a141f"        # deep cyanotype blue-black - technical drafting paper
                       # gone dark, not gothic near-black or newsroom teal
  surface: "#101d2b"   # a shade lifted, for cards - a page further into the set
  ink: "#e4ecf2"       # cool blueprint-linework white, high contrast
  muted: "#8598a7"      # dusty blue-grey, for metadata (AA-checked against
                        # bg and surface)
  accent: "#4fa3d1"     # one cyanotype blue, for links and markers only - the
                        # traced line of a diagram, never a fill or a glow
displayFace: sourceSerif  # from the app's implemented set (fraunces | spectral
                          # | sourceSerif); the plainest of the three, matching
                          # the efficient, page-turning commercial-thriller
                          # register critics have consistently described his
                          # prose in (already used for Coben, Lee Child,
                          # Connelly, JRDS for the same reason)
signature: rule            # a single firm, straight line - read here as the
                            # axis of symmetry an ambigram is built and read
                            # across, not as a generic architectural rule
notes: >
  A drafting-table register rather than a cathedral one: deep cyanotype
  blue-black, blueprint-white ink, one precise cyan-blue line used only for
  links and markers. Deliberately not the gilt-and-parchment, candlelit-stone
  costume Brown's own paperback covers use - the wing draws on the actual
  documented mechanics behind that furniture (the ambigram, the floor plan,
  the cipher grid) rather than reproducing the genre furniture itself.

# ART. The "blueprint-cipher" framing holds on register and palette, and is
# realised away from literal blueprint and cipher imagery, because two
# neighbouring wings already own it. Brandon Sanderson already owns a
# ruled, draughtsman's-instrument line on blueprint-grade vellum with a
# printed grid (his own theme.yaml, verbatim) - a technical-drafting
# lineCharacter here would sit almost on top of it, differing only by hue.
# José Rodrigues dos Santos already owns the cipher/code-breaking territory
# outright: a hand-ruled letter grid emblem, a technical pen line that
# doubles back on a verified fact, wire-service paper. So this wing does not
# draw ciphers-as-grids or engineering-as-diagram at all; it draws Robert
# Langdon's actual discipline instead, which neither neighbour touches -
# symbology, the reading of an image (a painting, a floor plan, a symbol)
# for a second meaning already sitting in it. The one specific, documented
# fact that is genuinely this wing's own - Brown's friend John Langdon's
# ambigram, commissioned for the 1999 Angels & Demons CD and reused on the
# novel, which gives the character his name (dan-brown.yaml lifeEvents) - is
# an artwork that reads identically from two opposite orientations. Actual
# ambigram lettering cannot be drawn (no baked text, catalogue-wide), so the
# emblem below translates the mechanic rather than the letterforms: a
# reproduction paired with its own reflection, not a word.
art:
  emblem:
    object: >
      A reproduction of a historical image - a fragment of a fresco, an
      anatomical study, an architectural elevation, never a specific named
      or identifiable work - propped upright on a work table against a
      small rectangular hand mirror tilted just enough to throw back its
      own reflection, so the print and its reversed twin sit in view
      together.
    why: >
      Robert Langdon's actual métier across every appearance is reading a
      familiar image for the second, true meaning already inside it
      (works.yaml's own synopses: the Louvre's paintings, Vatican symbols
      and sculpture, Masonic Washington architecture, Dante's Map of Hell,
      Barcelona's architecture, Prague alchemy). A mirror held to a
      reproduction is that discipline made physical, and it is also the one
      way to honour the wing's single most specific documented fact - the
      real ambigram commissioned from John Langdon that gave the character
      his name - without drawing the banned thing (lettering) it actually
      is: an ambigram is one surface that reads true both ways depending only
      on how it is turned, and a print doubled by its own reflection is that
      principle without a single invented letterform.
  motifs:
    - the reproduction-against-a-mirror device recurring at smaller scale
      elsewhere in a scene - a photograph propped against a shaving mirror,
      a page held up to a windowpane to read its reverse bleed-through
    - a magnifying loupe or linen-tester angled over a printed reproduction
      or a photostat sheet, one hard raking desk-lamp beam
    - an architectural floor plan or elevation of an invented building in a
      real historical style (a domed rotunda, a fortified archive, a
      cathedral nave) with faint construction lines - a sightline, a plumb
      drop, a proportion diagram - pencilled directly onto it
    - a physical sample under hand-lens examination - an ice core, a rock
      cross-section, a reel of perforated tape - standing in for the two
      non-Langdon technical thrillers (Digital Fortress, Deception Point),
      where the hidden reading is scientific rather than art-historical
    - a locked specimen crate, document tube or courier's dispatch case,
      mid-transit, strapped shut
    - a research desk mid-work holding four or five things at most - a
      photostat, a foreign-language dictionary, a torn page of notes, one
      object leading (per PROMPT-MODULES §4c, never a flatlay of ten)
  atmosphere: >
    A study or conservation bench mid-examination: one hard raking lamp
    across a print or sample, the rest of the room left dim - closer to a
    reading room after closing than to a laboratory or a chapel. The
    subject under the light has not changed; only how it is being held,
    turned or lit has. The tension is in re-orientation and recovery of a
    reading that was already there, not in checking a fact against a second
    source (that register belongs next door, to José Rodrigues dos Santos's
    newsroom) and not in awe at a holy or occult presence. Cool, exact,
    unhurried.
  lineCharacter: >
    Two passes in one hand, not one uniform weight throughout. The
    reproduced or examined subject - a print, a plan, a sample - is drawn
    in a soft, slightly blurred graphite contour, as if seen a half-second
    out of focus. Over it, in the same nib but pressed harder, one or two
    short straight analytical marks - a sightline, a measured span, a
    loupe's circle - laid on top rather than built into the drawing, the
    way a reader marks a page rather than the way an engineer drafts a
    plan. Never a uniform ruled or draughtsman's hand throughout a whole
    image (Brandon Sanderson's wing already owns that instrument), and
    never a single stroke doubled directly over itself as a correction
    (José Rodrigues dos Santos's wing already owns that gesture).
  backgroundTexture: >
    A large uncoated art-reproduction sheet - the stock of an old
    exhibition-catalogue plate or a museum photostat, carrying a fine
    printed halftone dot rather than a ruled grid, a laid weave or a
    scanline. Cool and slightly toothy, distinct from the blueprint vellum
    and the wire-service stock the catalogue's two nearest technical-line
    wings already claim.
  accentUse: >
    Cyanotype blue on exactly one analytical mark per image, never a fill:
    a single ruled sightline, a loupe's rim, or the hairline edge of a
    tilted mirror catching the light.
  avoid:
    - gilt crosses, wax seals, candlelit cathedral stone or any Da Vinci
      Code paperback-cover pastiche
    - a cipher wheel, rotary cryptograph disc or any concentric-ring
      device - reads as the catalogue's shared orrery mark; this wing's
      reading tools (a mirror, a loupe, a plan) stay rectilinear or
      hand-held, never a wheel or disc
    - a lettered cipher grid or crossword-style square - already this
      catalogue's José Rodrigues dos Santos wing
    - exploded mechanism diagrams, gear trains or ruled blueprint-grid
      paper - already this catalogue's Brandon Sanderson wing
    - hooded secret-society robes, a glowing all-seeing eye or Masonic
      regalia worn as costume rather than drawn as an actual place or
      document
    - fedora-and-torch treasure-hunt or adventure-movie iconography
    - actual ambigram lettering, or any word rendered as image - banned
      catalogue-wide regardless (no baked text) and doubly wrong here,
      where it would be the one thing this wing must not literalise
    - a precise, recognisable copy of any specific named painting,
      sculpture or building - draw the fragment, the reproduction, the
      plan, never a copy exact enough to be that work
