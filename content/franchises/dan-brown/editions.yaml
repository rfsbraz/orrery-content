# Editions of Dan Brown: 25 editions over all 10 works - 12 English (en)
# first/notable editions and 13 Portuguese (pt-PT) editions.
#
# SCOPE. English coverage is deliberately the FIRST edition only (hardcover,
# US publisher) per work, not a US+UK pair: Brown's English backlist is
# reissued constantly across Transworld/Corgi/Bantam/Anchor/Doubleday imprints
# with dozens of overlapping ISBNs (confirmed on a 235-candidate OpenLibrary
# sweep), and recording the true first edition is the one choice that stays
# correct as later printings come and go. Portuguese coverage follows the
# opposite rule (SCHEMA.md default): the most recent IN-PRINT pt-PT edition,
# because that is the one a Portuguese reader can actually buy today.
#
# THE PLANETA MIGRATION (2025-2026): Bertrand/LeYa held Brown's
# Portuguese rights for decades (Fortaleza Digital 2006 on), but Planeta has
# been re-releasing the Robert Langdon backlist under its own imprint since
# July 2025 - Anjos e Demónios and O Código da Vinci (July 2025), O Segredo
# dos Segredos (Sept 2025, day-and-date with the US original), O Símbolo
# Perdido (Nov 2025) and A Conspiração (Jan 2026) are all now live on
# Bertrand's own storefront under the Planeta imprint, confirmed by fetching
# bertrand.pt/wook.pt directly rather than trusting a stale search index. The
# migration is NOT complete: Inferno, Origem and Fortaleza Digital are still
# sold under their existing Bertrand Editora printings as of this writing, so
# those three keep their Bertrand editions here rather than being marked
# out-of-print for a Planeta reissue that does not yet exist. Wild Symphony
# (Rodale Kids/Random House Children's Books in English, a different rights
# chain entirely) is unaffected and stays with Bertrand.
#
# NON-LITERAL PT TITLE: Deception Point publishes in Portuguese as "A
# Conspiração" ("The Conspiracy"), not a literal translation - carried over
# from the original Bertrand-era translation into the new Planeta edition.
#
# THE DA VINCI CODE: YOUNG ADULT EDITION (2016) is recorded here as
# edition-level data, not a works.yaml entry (see works.yaml's
# considered-and-left-out note and ISFDB's own "Variant" treatment of the
# same title): both the English original (Delacorte Press) and its own
# Portuguese edition (Bertrand's "edição juvenil", which - unlike the adult
# Código da Vinci - has NOT migrated to Planeta) are below, under
# dan-brown/the-da-vinci-code.
#
# 187 MEN TO AVOID (1995) carries two genuinely different editions, not a
# reprint and its parent: the 1995 Berkley Books original under the
# pseudonym "Danielle Brown" (verified against the Internet Archive scan of
# the actual physical book), and the August 2006 Berkley Trade reissue that
# put "Dan Brown Formerly Writing As Danielle Brown" on the cover - a
# different printed byline is a different object, per works.yaml's own note.
# No Portuguese edition was found for this title in either Bertrand's or
# Wook's live catalogue.
#
# ISBN DISCIPLINE. Every ISBN-10 sourced from a Wikipedia infobox was
# reconverted to ISBN-13 from scratch (never trusting a printed check digit
# carried over), and every ISBN-13 below, sourced or converted, carries a
# valid check digit. Two would-be discrepancies turned
# out to be real, distinct ISBNs rather than errors: The Secret of Secrets'
# hardcover (9780385546898, used here) and Kindle edition (9780385546928)
# both validate and are both genuine, confirmed against Amazon/AbeBooks/
# Wikipedia's own infobox; likewise the Young Adult Edition's three
# candidate ISBNs (hardcover 9781524715847, used here; two further ISBN13s
# seen on OpenLibrary belong to other bindings of the same 2016 book, not to
# a data error). No entry in this file uses a Brazilian ISBN (978-85-*,
# 978-65-* were seen for this author on Arqueiro/Sextante and excluded) or a
# bare `pt` where the region was not verified - every pt-PT prefix below is
# 978-972-* or 978-989-*.
#
# SOURCING. English facts are Wikipedia's own infobox (which for Digital
# Fortress, Angels & Demons, Deception Point, The Da Vinci Code, The Lost
# Symbol, Inferno, Origin and The Secret of Secrets explicitly states the
# ISBN as printed on the book, several marked "(first edition hardcover)"),
# cross-checked against a publisher product page for the two exceptions
# (Wild Symphony, the Young Adult Edition) that lack a Wikipedia infobox of
# their own. Portuguese facts are read from bertrand.pt's/wook.pt's own
# JSON-LD product data (ISBN, publisher, date, page count, binding), fetched
# directly rather than taken from a search index - Bertrand 403s a
# rate-limited fetch; wook.pt, the same underlying platform, answered where
# Bertrand didn't.

