# A wing spans an author's complete published work. Brown's shelf is small
# and almost entirely genre-pure (nine works over thirty years under his own
# name, plus one pseudonymous first book), so it does not need `subseries`
# for anything beyond the one real, publisher-numbered series: Robert
# Langdon (see works.yaml's header for the tiering and sourcing behind every
# entry, including the pseudonym and the two considered-and-excluded books).
id: dan-brown
name: Dan Brown
kind: author
description: >
  Two early standalone thrillers - [[work:dan-brown/digital-fortress|Digital
  Fortress]] (1998, his actual fiction debut) and
  [[work:dan-brown/deception-point|Deception Point]] (2001) - before the
  Robert Langdon series that made him one of the best-selling novelists
  alive: [[work:dan-brown/angels-demons|Angels & Demons]] (2000) through
  [[work:dan-brown/the-secret-of-secrets|The Secret of Secrets]] (2025), six
  novels running in the same order as their own internal chronology. A
  children's picture book, [[work:dan-brown/wild-symphony|Wild Symphony]]
  (2020), and his real first book - a 1995 humor title published under the
  pseudonym "Danielle Brown" - complete the shelf.
authorIds: [dan-brown]
themePreset: blueprint-cipher

# Capabilities (docs/SCHEMA.md) are left auto on purpose: with no theme.art,
# no events.yaml and no eras.yaml yet, `river` and `companion` will not
# activate until those exist; `wizard` will not activate until a startHere
# is written; `editions` will not activate until editions.yaml exists.
# Nothing needs forcing off in the meantime.
features:
  river: auto
  wizard: auto
  companion: auto
  editions: auto

globalEvents:
  include:
    - online-bookselling-1995  # his first book published the month Amazon launched; online backlist discovery was essential when The Da Vinci Code pulled his earlier novels onto bestseller lists in 2003
  exclude:
    - fantasy-paperback-boom-1965       # created the commercial category for fantasy authors, not thriller writers; predates him by one year but does not shape his genre
    - carnation-revolution-1974         # Portuguese political event; Brown is American with no documented connection to his work
    - chain-bookshop-1982               # shaped bookselling while he was in college; no specific documented influence on his thrillers
    - sept-11-2001                      # lived through it; his themes predate or bypass it (Digital Fortress 1998 on NSA/cryptography predates 9/11; Da Vinci Code 2003 on religious conspiracy unrelated to terrorism)
    - financial-crisis-2008             # Inferno's overpopulation theme is independent of financial-crisis ethics; no resonance
    - ebook-and-self-publishing-2007    # Brown remained traditionally published with Doubleday; self-publishing platforms did not shape his career
    - prestige-fantasy-adaptation-2011  # Game of Thrones example; Brown writes thrillers, not fantasy; his own film adaptations preceded this shift
    - portugal-bailout-2011             # Portuguese financial crisis; Brown is American with no documented connection
    - booktok-2020                      # established bestselling author; BookTok reaches lesser-known and younger writers, not career-defining authors in their peak
    - covid-19-pandemic-2020            # lived through it; no documented influence on his work or themes

sources:
  - https://en.wikipedia.org/wiki/Dan_Brown
  - https://en.wikipedia.org/wiki/Robert_Langdon
  - https://danbrown.com/books/
