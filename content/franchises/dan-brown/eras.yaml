# Creative periods. There are none on record.
#
# No critic, reference work, settled fan consensus or Brown himself divides this
# career into named creative periods with recognisable names and boundary years,
# the way "the Golden Age of detective fiction" or "the Bachman years" are
# received. Searched in English, the language he writes in and the language of
# every reference work, review and career essay about him.
#
# HIS OWN SITE PERIODISES NOTHING. danbrown.com groups the shelf once, into
# "Robert Langdon Series" against "Other Bestselling novels"
# (https://danbrown.com/books/). That is a series-and-standalone split, not a
# chronology. It is also the clearest evidence against the division that looks
# obvious from outside: the site files Digital Fortress (1998) and Deception
# Point (2001) under "Other Bestselling novels", drawing no distinction at all
# between the books that sold modestly on release and the ones that did not.
#
# THE REFERENCE RECORD IS CHRONOLOGICAL, and frames the debut as the template
# for everything after rather than as a period sealed off from it: Digital
# Fortress, "centred on clandestine organizations and code breaking", "became a
# model for Brown's later works" (Britannica,
# https://web.archive.org/web/2024/https://www.britannica.com/biography/Dan-Brown).
# The article runs from 1995 to the present naming no phase at all.
#
# THE FULLEST CAREER ESSAY DOES GROUP THE NOVELS, AND ITS GROUPINGS CANNOT
# BECOME SPANS. Geoff Shullenberger's "Mythology of the Deep State: The Novels
# of Dan Brown" (American Affairs, Winter 2022,
# https://americanaffairsjournal.org/2022/11/mythology-of-the-deep-state-the-novels-of-dan-brown/)
# writes of "his early techno-thrillers", of "his mid-period novels,
# particularly The Da Vinci Code and The Lost Symbol", and of "Brown's novels of
# the 2010s". Those are descriptions, not names a reader would recognise. And
# the first of them is not contiguous: the essay calls Deception Point (2001)
# the "successor" to "his debut, Digital Fortress" (1998), passing over Angels &
# Demons (2000), which sits between them in time and belongs to the other group.
# The grouping is thematic and skips a book. Era membership is computed from the
# publication year, so a thematic set with a hole in the middle cannot be drawn
# as a span at all.
#
# THE COMMERCIAL SPLIT IS REAL AND IS NOT A PERIODISATION. The numbers are as
# stark as they look: each of the first three novels had "fewer than 10,000
# copies in each of their first printings", while The Da Vinci Code went to the
# top of the New York Times list in its first week of release in 2003 and had
# sold 81 million copies by 2009 (https://en.wikipedia.org/wiki/Dan_Brown).
#
# What that gap is not is a line through the work, because the earlier books
# crossed it too. The Da Vinci Code "sparked sales of Brown's earlier works; in
# 2004 all four of his novels appeared simultaneously on The New York Times
# best-seller lists" (Britannica, above), and Boston magazine's 2009 profile
# calls the first three "the nearly forgotten Dan Brown tomes that had sold at a
# dizzying clip after The Da Vinci Code was released"
# (https://www.bostonmagazine.com/news/2009/08/17/the-dan-brown-code/). An era
# renders full-bleed across every work inside its span, and a "pre-breakout"
# plate would stand over three books that spent 2004 on the bestseller list. The
# breakout is a dated event in the reception of one book, and it is carried in
# this wing as an aura event on that footing. It is not a property of a period
# of the writing.
#
# THE PUBLISHING RECORD, the usual fallback, does not yield a usable era either.
# The imprints did change: Digital Fortress was St. Martin's Press (1998),
# Angels & Demons and Deception Point were Pocket Books (2000, 2001), and every
# adult novel from The Da Vinci Code (2003) to The Secret of Secrets (2025) is
# Doubleday. Two things spoil the fit. Before 2003 there are two publishers and
# not one, so there are no "years" to name on that side. And a Doubleday span of
# 2003-2025 would by year also cover Wild Symphony (2020), a Rodale Kids /
# Random House Children's Books picture book that Doubleday did not publish. The
# boundary would land precisely on the breakout as well, so the plate would
# assert in bibliographic dress the sales verdict the record above refuses.
#
# THE SERIES DOES NOT CUT THE SHELF EITHER. The Robert Langdon novels run 2000
# to 2025, and any span across them swallows Deception Point (2001), a
# standalone with no Langdon in it, and Wild Symphony (2020). Publication order
# equals story order here, which makes the series a reading structure rather
# than a period; orders.yaml is where it belongs.
#
# Reader argument about whether the later novels fell off is real and diffuse.
# It carries no name and no agreed year, and it is a live critical dispute this
# catalogue reports rather than joins.
#
# britannica.com serves HTTP 403 to non-browser clients; its biography is cited
# here through web.archive.org.
#
# eras: [] is the honest record of a career nobody has divided into named
# periods, its author included.
[]
