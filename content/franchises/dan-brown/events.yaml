- id: dan-brown-baigent-leigh-lawsuit-2006
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  date: 2006-04
  title: Two authors sue over The Da Vinci Code's "central theme" - and lose, twice
  scope: industry
  reach: franchise
  impact: med
  description: >
    Michael Baigent and Richard Leigh, authors of the 1982 nonfiction book
    The Holy Blood and the Holy Grail, sue Brown's UK publisher Random House,
    claiming [[work:dan-brown/the-da-vinci-code|The Da Vinci Code]] lifted
    the "central theme" and "architecture" of their own research into the
    origins of Christianity. Brown spends three days in the witness box at
    London's High Court. On April 7, 2006, Mr Justice Peter Smith rules
    there was no infringement: ideas and historical theories are not
    protected, only their specific expression, and Baigent and Leigh had not
    shown the "central theme" they claimed even existed in their own book.
    Baigent and Leigh's appeal is dismissed by the Court of Appeal on March
    28, 2007, leaving them liable for close to $6 million in legal costs.
  spoilerAfter: null
  sources:
    - https://time.com/archive/6908202/the-da-vinci-legal-code/
    - https://www.wipo.int/en/web/wipo-magazine/articles/copyright-in-the-courts-the-da-vinci-code-35264

- id: dan-brown-phenomenon-2006
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2006-05
  title: The film ignites a Vatican boycott call and a Louvre tourist boom at once
  scope: culture
  reach: franchise
  impact: high
  description: >
    Ron Howard's film adaptation (Tom Hanks, Audrey Tautou, released May 19,
    2006) detonates a controversy that had been building since the novel's
    2003 publication. Cardinal Tarcisio Bertone calls for a boycott of the
    book itself in 2005; days before the film opens, Monsignor Angelo Amato
    tells students at Rome's Pontifical Holy Cross University "I hope all of
    you boycott this film," comparing its treatment of the Church to slander
    that would have provoked "worldwide revolt" had it been aimed at Islam
    or the Holocaust. The film is banned outright in several countries. At
    the same time, the novel and film send readers hunting for its real
    locations: the Louvre reports record attendance in 2005 (7.3 million
    visitors, credited in part to the book), Paris tour operators run
    dedicated "Da Vinci Code" walking tours, and by the film's day-and-date
    China release the book has an estimated ten million readers there
    between legitimate and pirated copies.
  spoilerAfter: null
  sources:
    - https://www.nbcnews.com/id/wbna7204914
    - https://www.cbsnews.com/news/louvre-thanks-da-vinci-code
    - https://www.npr.org/2004/09/04/3889742/art-historian-launches-da-vinci-code-tour
    - https://www.npr.org/transcripts/5414324

# The sources agree on the bunker itself - Mondadori's Milan headquarters,
# eleven translators, six languages, close to two months, seven-day weeks
# under guard - and disagree on the year the sessions ran, February to April
# of 2012 in the trade reporting and of 2013 in the French translators' own
# accounts. The entry is dated to the simultaneous release instead, which
# nothing disputes, and states the duration rather than the months.
- id: dan-brown-inferno-bunker-translation-2013
  organisation: layered-stack
  illustration_type: manuscript-proof
  images_required: 1
  date: 2013-05-14
  title: Eleven translators, one locked basement, six languages at once
  scope: industry
  reach: franchise
  impact: med
  description: >
    [[work:dan-brown/inferno|Inferno]] is published across its main European
    markets on the same day, May 14, 2013, and the machinery behind that
    simultaneity becomes a story in its own right. For close to two months
    beforehand, eleven translators work in a windowless high-security
    basement at the Milan headquarters of Mondadori, Italy's largest
    publisher, turning the manuscript into French, German, Spanish, Catalan,
    Italian and Portuguese. They sign confidentiality agreements, surrender
    their phones at the door, work seven days a week under armed guard with
    their laptops fixed to the desks and a single supervised computer for
    internet access, hand the pages back each evening, and are given cover
    stories to explain their presence in the building. Nothing about the
    novel required it; what required it was what a Langdon novel had become
    by 2013 - a book whose plot leaking a week early was priced as a
    commercial risk worth a bunker. The arrangement later supplied the
    premise of the 2019 French film Les Traducteurs.
  spoilerAfter: null
  sources:
    - https://publishingperspectives.com/2013/05/dan-browns-inferno-translated-in-an-underground-bunker/
    - https://www.npr.org/sections/thetwo-way/2013/05/08/182132540/book-news-translators-of-dan-brown-novel-toiled-in-bunker
    - https://en.wikipedia.org/wiki/The_Translators
