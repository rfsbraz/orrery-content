# Branding for the Robert Bryndza wing (see Orrery CONCEPT §6 and
# docs/SCHEMA.md#themeyaml).
#
# This wing carries two genres under one name, and the palette is built to
# hold both rather than costume-switch between them. The crime side is set
# almost entirely on English coastlines and streets the catalogue's other
# crime wings have not used - the Metropolitan Police procedurals (Erika
# Foster, Jamie Day) and the fog-bound English Riviera of the Kate Marshall
# novels (Devon's Dartmoor, reservoirs and estuaries) - rather than Ireland
# (Tana French), the American South (Karin Slaughter), Los Angeles (Michael
# Connelly) or Scandinavia (Jo Nesbø). The ground below reads as coastal fog
# rather than any of those.
preset: harbour-noir
palette:
  bg: "#171a1c"       # near-black with a cool slate-grey, faintly blue-green
                      # cast - Channel fog at night, not Coben's teal-grey
                      # aluminum-siding cool or Tana French's peaty green
  surface: "#202426"  # a shade lifted, for cards
  ink: "#e8eaea"      # pale, cool off-white - high contrast, very readable
  muted: "#8b9294"    # cool grey, for metadata (AA-checked against bg/surface)
  accent: "#c4587a"   # one warm rose-coral, for links and markers only - no
                      # other wing in the catalogue has used pink/rose (the
                      # nearest neighbours are Flynn's cooler, more purple
                      # bruise-plum at hue ~320 and King's browner oxblood at
                      # hue ~5); this sits at hue ~340, warmer and pinker than
                      # either. It stands for the one warm thing that survives
                      # into an otherwise cold register: the Coco Pinchard
                      # years are still on the shelf, not costumed over by the
                      # crime brand that came after them.
displayFace: sourceSerif  # from the app's implemented set (fraunces | spectral
                          # | sourceSerif); the plainest of the three, matching
                          # the brisk, commercial, page-turner prose on both
                          # sides of this wing rather than a literary register
                          # - the same reasoning already used for Connelly,
                          # Nesbø, Lee Child and Karin Slaughter's own
                          # procedural crime wings
signature: thread    # a quiet hairline the works are strung along - standing
                      # here for the single unbroken byline running from the
                      # 2012 romantic comedies through to the 2026 Jamie Day
                      # series, rather than two shelves spliced together.
                      # Already used by Sewell, French, Karin Slaughter and
                      # Connelly, each for a different throughline; here it is
                      # literal - the thread is the name on the cover, not
                      # changing
# ART. The catalogue's other crime wings each commit to one instrument tied
# to a biographical fact: Tana French's is a chair under a bulb, Karin
# Slaughter's a stainless exam table, Michael Connelly's a closed murder
# book. This wing cannot do that alone, because it is not only a crime wing:
# every book in it, comedy and procedural both, is England seen from
# somewhere else. Bryndza and his husband Ján left for a year in Los Angeles
# behind Bitch Hollywood, then moved to Slovakia at the low ebb that produced
# it, and the bio still reads "Lives in Slovakia" - every Coco Pinchard book
# past the first, and all seventeen crime novels since, were written by an
# Englishman looking at England from abroad. A lit window seen from outside,
# in the dark, is that distance made physical, and it is also literally how
# the earliest book works: The Not So Secret Emails of Coco Pinchard is told
# through correspondence, a life read by someone not standing in the room.
# One instrument carries both registers rather than two illustration systems
# stitched together: the same fine dip-pen line, held ruled and exact for
# procedural material and let loose into busier, warmer strokes for the
# comedy, per the difference eras.yaml already named between them.
art:
  emblem:
    object: >
      A single sash window seen from outside, in the dark: warm lamplight
      behind the glass and something of a room half-visible through it -
      curtains not quite drawn, a print or a paper pinned near the sill -
      while the frame, the brick or render around it, and everything
      outside the glass stays in cold, unlit weather. Drawn as a real
      window in a real wall, never a picture-within-a-picture, and never
      showing a face inside it.
    why: >
      Every book in this wing is set in England - Coco Pinchard's London,
      Erika Foster's Met, Kate Marshall's Devon, Jamie Day's 1987 London -
      and almost none of it was written there. The bio's own "Lives in
      Slovakia with his husband Ján" is the fact: Bryndza has written this
      entire catalogue, comedy and crime alike, from outside the country
      every book takes place in. The window is that working position made
      visible, one lit rectangle of England seen from elsewhere. It also
      echoes how the earliest book is built: The Not So Secret Emails of
      Coco Pinchard is told entirely through correspondence, a life read
      by someone who is not in the room.
  motifs:
    - a London flat's kitchen table, cluttered with wedding stationery, a
      closed laptop beside a mug, a string of fairy lights along a shelf
    - an addressed airmail envelope or a small stack of opened letters,
      postmarked somewhere else - the correspondence at the heart of the
      earliest book, and the distance every later one is written across
    - a South London terrace street or the Thames towpath at dusk, wet
      paving catching sodium light
    - a Metropolitan Police incident room window streaked with rain, a
      case board reflected faintly in the glass rather than shown outright
    - a fog-bound Dartmoor reservoir or Devon estuary, reeds and still
      water, a single marker flag or length of tape caught on a fence post
      far off
    - a 1987 London street at night - a phone box, a folded A-Z map, cars
      and shopfronts of the period, held to texture rather than pastiche
    - the lit window itself, found wherever the scene allows it, always
      seen from the cold and dark outside
  atmosphere: >
    Two registers, kept distinct because the record keeps them distinct,
    not blended into one compromise mood. The self-published comedies:
    warm, crowded and indoors - a kitchen table under lamplight, wedding
    stationery, a Christmas tree half-dressed, a London flat too full of
    other people's opinions, played bright and a little overexposed. The
    traditional-publishing and Raven Street crime years: cold, wet and
    procedural - Met incident rooms and rain-streaked glass for Erika
    Foster, fog and standing water on Kate Marshall's moor and coast, a
    colder period London for Jamie Day - solved by method and daylight,
    never gaslit or gothic. The Raven Street years hold both at once
    because the imprint does: a Raven Street crime scene is drawn exactly
    as cold and procedural as the Bookouture years were, and if a Coco
    Pinchard moment from this era is ever drawn, it is exactly as warm as
    2012 - two shelves standing side by side under one imprint, never
    averaged into a single temperature between them.
  lineCharacter: >
    One fine dip-pen line throughout, the same nib for every era,
    disciplined the way a diary entry is disciplined and let go the way a
    case note is not. For procedural material - incident-room furniture,
    evidence, the window frame itself - the line runs level, straightedge-
    true and economical, closer to something ruled than drawn. For the
    comedy material it is the same pen under different pressure: faster,
    busier strokes, small energetic cross-hatching crowding the foreground
    of a kitchen table or a wedding reception. Never two tools; one hand,
    held steady for the case work and let run for the comedy - the wing's
    own distance between a diary voice and a police procedural, made into
    a single physical gesture rather than two illustration systems glued
    together.
  backgroundTexture: >
    Cold, faintly damp coastal paper - Channel fog rather than dry studio
    stock - its grain lightly foxed as if it had spent a night outdoors,
    with the fine ruled cross-hatching of a used airmail sheet showing
    through here and there: paper for something sent home from somewhere
    else.
  accentUse: >
    The warm rose-coral on exactly one small source of light per image,
    never as a fill: the one lit window pane, a struck match, a votive
    candle, a single strand of fairy lights, or one scrap of ribbon or
    tinsel. It is warmth surviving inside an otherwise cold scene, present
    in a procedural image as much as a comic one, and it is never repainted
    as a genre costume - no pink title lettering, no valentine gloss, no
    chick-lit packaging, even for the Coco Pinchard material itself.
  avoid:
    - seaside-postcard England - bunting, deckchairs, ice-cream vans,
      candy-striped beach huts
    - chick-lit packaging for the Coco Pinchard material - pastel pink,
      hearts, high-heeled shoes, cocktail glasses, cursive lettering
    - Hound-of-the-Baskervilles gothic horror for Dartmoor - a spectral
      hound, a lone gnarled tree, menace played through the landscape
      itself; Kate Marshall's moor is procedural weather, not a ghost
      story
    - crime-thriller cover shorthand - chalk outlines, crime-scene tape as
      a main subject, a magnifying glass, a weapon shown in use
    - a laptop, phone or any lit screen drawn as a device or interface;
      the correspondence motif stays on paper, a letter or an envelope,
      never a UI
    - blending the two registers into one flat crime-comedy compromise
      mood inside a single image - each sketch commits to the temperature
      its own era or event calls for

notes: >
  A cold coastal register - Channel fog rather than noir basement or
  Nordic winter light - with one warm rose-coral accent that is the wing's
  only concession to its earlier romantic-comedy years. No literal blood, no
  seaside-postcard cliché (bunting, ice cream, deckchairs) and no chick-lit
  pastel palette for the Coco Pinchard side - the accent carries that history
  as a single warm note inside a cold design, not as a genre costume change.
