# FRANCHISE-specific events only. Author-LIFE events (the birth in Lowestoft,
# the 2012 Slovak manuscript deal that launched him, the 2015 decision to
# finally write crime) live on the author entity
# (content/authors/robert-bryndza.yaml). Shared world events live in
# content/events/global.yaml. Inline [[type:id|text]] refs must resolve.

# The "within five months" figure that circulates today (including on
# robertbryndza.com's own current About page) does not match the contemporary
# record: Bryndza's own blog post announcing the million-copy mark is dated 6
# February 2017 - "this time last year I was nervously gearing up for the
# book launch" - a year after the book's February 2016 release, and
# Bookouture's press release (its image asset is timestamped
# wp-content/uploads/2017/02) says the same milestone was hit "in less than a
# year" / "in little under a year," not five months. Dated and worded here to
# the two contemporary sources rather than the later marketing copy.
- id: robert-bryndza/girl-in-the-ice-million-sales-2017
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2017-02-06
  title: A debut crime novel sells a million copies in under a year
  scope: author-life
  reach: franchise
  impact: high
  description: >
    Released in February 2016, [[work:robert-bryndza/the-girl-in-the-ice|The
    Girl in the Ice]] reaches number one on Amazon in the US, Canada,
    Australia and the Netherlands and, in less than a year, sells over a
    million copies - the Erika Foster series' first book to do that for its
    publisher, Bookouture, with the series as a whole (now three books) past
    1.4 million. It is the second-biggest-selling Kindle title of 2016 on
    Amazon.com, with rights sold into twenty-four countries, including a
    six-figure deal in Germany. Bryndza's own account a year on from a launch
    he had been nervous about, worried how readers would take "my change of
    direction from writing romantic comedies to crime thrillers": "I never
    dreamed I would sell so many books in such a short time." A single
    self-published romantic-comedy author's first attempt at crime fiction
    becomes, inside a year, the commercial foundation the rest of the
    catalogue is built on.
  spoilerAfter: null
  sources:
    - https://robertbryndza.com/the-girl-in-the-ice-sells-one-million/
    - https://bookouture.com/robert-bryndzas-global-bestseller-the-girl-in-the-ice-hits-one-million-sales-in-less-than-a-year/

- id: robert-bryndza/kate-marshall-launch-2019
  organisation: full-bleed-vista
  illustration_type: establishing-landscape
  images_required: 1
  date: 2019
  title: A second detective, and a different England
  scope: author-life
  reach: franchise
  impact: med
  description: >
    Three years into Erika Foster's Metropolitan Police procedural, Bryndza
    launches a second series with [[work:robert-bryndza/nine-elms|Nine
    Elms]], moving his crime fiction out of London for the first time: P.I.
    Kate Marshall works the fog-bound reservoirs, moorland and estuaries of
    the English Riviera in South Devon rather than the capital. Nine Elms
    hits number one on Amazon US and the top five in the UK, proving the
    commercial pull of The Girl in the Ice was not a one-book or a
    one-setting phenomenon, and giving the catalogue a second, geographically
    distinct crime series running in parallel with the first.
  spoilerAfter: null
  sources:
    - https://www.robertbryndza.com/pages/about
    - https://www.robertbryndza.com/products/nine-elms

- id: robert-bryndza/raven-street-publishing-2022
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 2022-07-07
  title: Back to self-publishing, on his own imprint
  scope: author-life
  reach: franchise
  impact: med
  description: >
    [[work:robert-bryndza/fatal-witness|Fatal Witness]], the seventh Erika
    Foster novel, is published in July 2022 under Raven Street Publishing,
    Bryndza's own new imprint - the first of his traditionally-published
    crime novels to appear this way, with the rest of the crime backlist and
    the Coco Pinchard romantic comedies following it there over time. He
    names the imprint after the fictional theatre in
    [[work:robert-bryndza/miss-wrong-and-mr-right|Miss Wrong and Mr Right]]
    and frames the move in his own words as coming "full circle": from
    self-published debut, through traditional publishing built on Erika
    Foster and Kate Marshall's success, back to releasing his own
    English-language books independently while keeping full creative
    control.
  spoilerAfter: null
  sources:
    - https://www.robertbryndza.com/pages/raven-street-publishing
    - https://www.goodreads.com/work/editions/95743780-fatal-witness
    - https://en.touchelivros.com.br/fatal-witness-robert-bryndza/

- id: robert-bryndza/fear-the-silence-czech-award-2024
  organisation: floating-object
  illustration_type: emblem-seal
  images_required: 1
  date: 2024-03-01
  title: A standalone thriller wins a Czech bestseller award
  scope: culture
  reach: franchise
  impact: med
  description: >
    Tíživé ticho, the Czech edition of the standalone
    [[work:robert-bryndza/fear-the-silence|Fear the Silence]], wins the
    Translated Fiction category of the Český bestseller (Czech Bestseller)
    awards for 2023, presented by bookshop chain Knihcentrum at Ostrava's
    Dům knihy on 1 March 2024. Bryndza calls the win "incredible" and
    "unreal," thanking his Czech readers, Knihcentrum and his Czech
    publisher Grada by name - a reception marker for a book he wrote as a
    stand-alone departure from two running detective series, and the only
    award among his crime fiction won outside the English-language market.
  spoilerAfter: null
  sources:
