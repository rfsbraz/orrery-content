- id: robert-bryndza/jamie-day-launch-2026
  organisation: diptych
  illustration_type: manuscript-proof
  images_required: 2
  date: 2026-07-07
  title: A failed draft about a squatter becomes a third detective series
  scope: author-life
  reach: franchise
  impact: high
  description: >
    [[work:robert-bryndza/the-quiet-kill|The Quiet Kill]] does not start as
    a Jamie Day novel. Bryndza's own account of writing it: it began as the
    story of Joanna, a young homeless woman squatting in a London house
    whose life is upended when a body appears there. The first chapters
    work; by chapter twenty the story has stalled, because the stakes only
    hold while Joanna stays hidden. Then he writes a scene where a rookie
    police officer, Jamie, arrives at the crime scene with an older
    colleague - "suddenly, the story came alive and all the pieces began to
    fall into place," Joanna shrinking to a smaller role as Jamie takes over
    the book. "Completely without planning," Bryndza finds himself starting
    a third crime series and, for the first time in twenty-three books,
    writing a male lead. He has called Jamie "probably the character I've
    written who is most like me": both are from Lowestoft, and Jamie's
    disorientation arriving in 1980s London at the start of the book echoes
    Bryndza's own move to an overwhelming London at twenty-two.
  spoilerAfter: null
  sources:
    - https://www.robertbryndza.com/blogs/blog/how-the-quiet-kill-became-something-completely-different
