# Creative periods. Inline references use [[type:id|text]] and must resolve.
#
# PROVENANCE. Bryndza periodises his own career, in the same three parts the
# eras below use, on the Raven Street Publishing page of his site: "I started
# out as an indie author, self-publishing my debut romantic comedy The Not So
# Secret Emails of Coco Pinchard, followed by more Coco Pinchard novels and
# Miss Wrong and Mr Right. That success led me to traditional publishing, where
# I created the Detective Erika Foster and Private Investigator Kate Marshall
# thriller series. Now, I've come full circle. Through Raven Street Publishing,
# I'm once again releasing my English-language books independently, keeping
# full creative control." Indie, then traditional, then independent again, with
# the boundaries falling where the record puts them: the crime debut in
# February 2016 and the first self-issued new novel in July 2022.
#
# The genre boundary is his too, said at the moment it happened: "I started out
# writing romantic comedies, but I have just switched to writing crime
# thrillers" (June 2016). His own About page uses the same two-part shape from
# the other side: "Before his crime fiction success, Robert made his mark
# self-publishing a romantic comedy series starring Coco Pinchard."
#
# What the phrases are and are not. Bryndza is describing how he published and
# what he wrote, not naming periods; no critic, reference work or press piece
# periodises him at all, and there is no encyclopedia article on him to check
# against. The three-part shape and the boundary years are his. The titles are
# built from his own nouns rather than quoted from a name he gives a period.
#
# BOUNDARIES NOT DRAWN, and why:
#
#  - 2019, the change of publishing house. Erika Foster books one to six were
#    Bookouture; the Kate Marshall novels moved to Sphere in the UK and Thomas
#    & Mercer in the US, announced in May 2018 ("my new publishers are very
#    excited and enthusiastic about this new series") and arriving with Nine
#    Elms in November 2019. A real, dated, bibliographic fact, and not a period:
#    his own account folds both houses into the single stretch of "traditional
#    publishing", and a three-book span named after two imprints would be a
#    contract change rounded up into an era.
#
#  - 2026, the Jamie Day series. A new series and his first male lead, but by
#    his own account on publication day the same work continuing: "It's my 23rd
#    book and the start of a brand-new crime thriller series... So, completely
#    without planning, I now find myself writing a third crime thriller series."
#    Same imprint, same police procedural form (a rookie Met officer and his
#    team, in 1987 London), arrived at by accident rather than as a turn.
#
#  - The series themselves. Erika Foster, Kate Marshall and Jamie Day overlap in
#    publication from 2022 onward, so any periodisation by series would claim
#    the same years twice.
#
# Raven Street now carries the earlier books too, so the imprint on an edition
# is not by itself a period marker. The boundary follows first publication of
# new work: Darkness Falls (2021) is the last novel published for him by
# somebody else, Fatal Witness (July 2022) the first he published himself.
#
# The three spans meet without gaps or overlaps and cover all 25 works.

- id: the-self-published-comedies
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Self-Published Comedies
  period: "2012-2015"
  themes: [self-publishing, comic voice, Coco Pinchard, writing from life]
  provenance: author
  description: >
    Four years of comedy issued by the author himself, after a literary agent
    took on [[work:robert-bryndza/the-not-so-secret-emails-of-coco-pinchard|The
    Not So Secret Emails of Coco Pinchard]] in 2010, failed to sell it and
    dropped him. The first book to reach print was
    [[work:robert-bryndza/bitch-hollywood|Bitch Hollywood]], written with his
    husband Ján in three months at the end of 2011 and published in Slovak
    translation in March 2012; its success paid for the English editions of both
    books, uploaded together to Kindle Direct Publishing. Four more Coco
    Pinchard titles and the standalone
    [[work:robert-bryndza/miss-wrong-and-mr-right|Miss Wrong and Mr Right]]
    follow at speed. In his own summary of the stretch: "The next two years were
    so much fun, I wrote and we self-published a second, third, fourth, and
    fifth book, and with each publication, my audience grew."
  note: >
    The title is descriptive and covers a slightly wider range than the phrase
    "romantic comedies" he uses for the period, which fits the Coco Pinchard
    books and Miss Wrong and Mr Right but not Bitch Hollywood, a co-written
    Hollywood satire. He groups that book with the others as the two he uploaded
    to Kindle Direct Publishing at the start, so it belongs here rather than
    apart. Bookouture reissued several of these titles from 2016, which is why
    later editions of a 2012-2015 comedy can carry a crime publisher's imprint.
  sources:
    - "https://www.robertbryndza.com/pages/raven-street-publishing"
    - "https://www.robertbryndza.com/blogs/blog/never-give-up-on-your-dreams"
    - "https://www.robertbryndza.com/blogs/blog/how-my-writing-career-began"
    - "https://www.robertbryndza.com/pages/about"

- id: the-traditional-publishing-years
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: The Traditional Publishing Years
  period: "2016-2021"
  themes: [the switch to crime, Erika Foster, Kate Marshall, scale]
  provenance: author
  description: >
    A wanted change of genre, and the one that made his name:
    "I started out writing romantic comedies, but I have just switched to
    writing crime thrillers." [[work:robert-bryndza/the-girl-in-the-ice|The Girl
    in the Ice]] appeared from Bookouture in February 2016, sold over a million
    copies in five months and has since been translated into 31 languages. Six
    Erika Foster novels come in three years, at a pace he later stepped back
    from for his health; a second series follows with new publishers, Sphere in
    the UK and Thomas & Mercer in the US, moving from Erika Foster's London to
    the reservoirs and moorland Kate Marshall works in South Devon.
  note: >
    "Traditional publishing" is his own term for the stretch, used on the Raven
    Street page against the indie years on either side of it. He signed with
    Bookouture in 2015, a year before the first crime novel reached print, so
    the switch is slightly older than the span: the span is drawn on publication
    because that is what the shelf records.
  sources:
    - "https://www.robertbryndza.com/pages/raven-street-publishing"
    - "https://bookaholicconfessions.wordpress.com/2016/06/02/author-interview-robert-bryndza-3/"
    - "https://chellesbookreviews.blogspot.com/2016/02/q-interview-with-robert-bryznda.html"
    - "https://www.robertbryndza.com/blogs/blog/is-it-the-end-for-erika-foster"
    - "https://www.robertbryndza.com/pages/about"

- id: the-raven-street-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Raven Street Years
  period: "2022-present"
  themes: [independence, three series at once, creative control]
  provenance: author
  description: >
    "Now, I've come full circle." Bryndza publishes his English-language books
    himself again, through his own imprint Raven Street Publishing, named after
    the fictional theatre in
    [[work:robert-bryndza/miss-wrong-and-mr-right|Miss Wrong and Mr Right]]. It
    opens with [[work:robert-bryndza/fatal-witness|Fatal Witness]] in July 2022,
    which brings Erika Foster back after a four-year absence, and runs three
    series at once: Kate Marshall continues, the standalone
    [[work:robert-bryndza/fear-the-silence|Fear the Silence]] wins Czech
    Bestseller of the Year, and [[work:robert-bryndza/the-quiet-kill|The Quiet
    Kill]] starts a third, set in 1987 London around his first male lead.
  note: >
    The span opens with the first new novel he published himself. Fatal Witness
    (July 2022) carries Raven Street's own ISBN registrant, 978-1-914547, as
    does every new title since; the last novel published for him by another
    house is Darkness Falls (2021). The imprint also reissues the earlier books,
    so its name on an edition does not date the work.
  sources:
    - "https://www.robertbryndza.com/pages/raven-street-publishing"
    - "https://catalog.2seasagency.com/publisher/raven-street-publishing/"
    - "https://openlibrary.org/works/OL28184502W"
    - "https://www.robertbryndza.com/blogs/blog/erika-foster-returns-in-fatal-witness"
    - "https://www.robertbryndza.com/blogs/blog/how-the-quiet-kill-became-something-completely-different"
