# Editions of Robert Bryndza: 43 editions (23 en + 1 sk + 18 pt-PT + 1 pt-BR)
# over 23 of 25 works. The two gaps are both correct, not oversights: The Burning
# Lie has no ISBN because it is unpublished (forthcoming 2027-03-04, per
# works.yaml) and Breaking Point has no ISBN because it was never sold (a
# free newsletter-subscriber short story, per works.yaml's own APOCRYPHA
# note).
#
# ONE ENGLISH EDITION PER WORK, the most recent in-print, not a full reissue
# history. This author has been reissued repeatedly - the original
# self-published (CreateSpace, 2012-2015) and Bookouture-published
# (2016-2021) backlist is now resold under Raven Street Publishing's own
# ISBNs, his current imprint - and recording every superseded printing would
# bury the buyable object in dead numbers. Where an old and a new ISBN both
# exist for the same text, this file records the new one and states the old
# one existed, following the same rule Karin Slaughter's file states
# explicitly: a reissue with an unchanged text is one object, not two.
#
# THE REISSUE QUESTION, answered per work: every one of the 21 novels once
# self-published or Bookouture-published now has a live Raven Street
# Publishing ISBN on the author's own shop (robertbryndza.com, itself
# Shopify, fetched product-by-product rather than assumed) - EXCEPT Bitch
# Hollywood, confirmed absent from the current shop (both "bitch-hollywood"
# and "lost-in-crazytown" product handles 404). Bitch Hollywood's only
# edition remains its 2012 CreateSpace original; every other pre-Raven-Street
# title is superseded, not doubled. The six earliest Erika Foster novels
# (Girl in the Ice through Deadly Secrets, originally Bookouture 2016-2018)
# are sold direct from the author only as a "large print" line (tag on each
# product, GBP 19.95 vs GBP 14.95 for the standard-format later novels) -
# real, current and the highest-ranked source available, but recorded with a
# note so a reader is not surprised by the format. The standard-size
# Bookouture/Sphere paperback these six replace is not re-recorded here,
# consistent with the one-edition rule above.
#
# A DUPLICATE-ISBN BUG ON THE AUTHOR'S OWN SITE, verified twice (including a
# --refresh fetch to rule out a stale cache): the product pages for Nine Elms,
# Shadow Sands and Darkness Falls (Private Investigator Kate Marshall #1-3)
# each carry barcode 9781914547263 - which is The Lost Victim's (#5) real,
# independently-confirmed ISBN, also carrying that book's own `sku`. All
# three carry no `sku` of their own, unlike every other product checked on
# the site, so this reads as three listings created without their own barcode
# ever being entered. Recording 9781914547263 a second, third or fourth time
# would both fail the duplicate-ISBN check this skill requires and send a
# reader to the wrong book, so these three instead use their original
# Little, Brown Book Group (Sphere) paperback ISBNs, independently confirmed
# on OpenLibrary against the correct work (matching Open Library work keys
# and the same author key, OL7527807A, on every record). Devil's Way (#4) and
# The Lost Victim (#5) carry their own correct, distinct Raven Street ISBNs
# and are unaffected.
#
# PORTUGUESE (PT-PT) COVERAGE IS ESSENTIALLY COMPLETE for the two established
# crime series and the standalone: all 9 Erika Foster novels, all 5 Kate
# Marshall novels and Fear the Silence (15 of 15) are in print from Alma dos
# Livros, cross-checked against Bertrand's retail listing where both carry
# the same ISBN. None of the fifteen Portuguese titles is a literal
# translation of the English one - every match below was made by synopsis,
# not by guessing a Portuguese title from the English, per this skill's own
# warning. Two pairs are close enough in wording to be a genuine trap for a
# title-based match and are called out on their own entries: "A Noite Está a
# Chegar" ("The Night Is Coming") is Shadow Sands, not The Night Stalker;
# "Silêncio Mortal" ("Deadly/Mortal Silence") is Devil's Way, not Fear the
# Silence (which is "Antes de Dizer Adeus", "Before Saying Goodbye"). Jamie
# Day (2026-) has no Portuguese edition yet, plausibly just too new. Coco
# Pinchard's Portuguese run is partial and recent: Alma dos Livros began
# publishing the trilogy in 2026 (the two prequel novellas and Miss Wrong and
# Mr Right are not among them, and neither is Bitch Hollywood) - the third
# volume, "A Vida, o Amor e Outros Desastres de Coco Pinchard", is in
# pre-order on the publisher's own shop as this file is written, shipping
# 12 August 2026; its ISBN is already registered and live on the publisher's
# own site, so it is recorded, with that status stated on the entry.
#
# COLD BLOOD carries three real, differently-registered editions: the current
# Raven Street English printing, Alma dos Livros' Portuguese "Sangue Frio"
# (978-989- prefix, Portugal), and a separate Brazilian "Sangue Frio" from
# Gutenberg (978-85- prefix, Brazil, per the prefix table this skill sets
# out) - two editions sharing one Portuguese-language title by coincidence,
# not the same book. Both are recorded, correctly tagged pt-PT and pt-BR.
#
# THE SLOVAK EDITION. Bitch Hollywood's true first edition was a Slovak
# translation, Mrcha Hollywood (Marenčin PT, March 2012, per the author's own
# account already sourced in works.yaml) - published before either language
# edition of Coco Pinchard, and worth recording given the author's own
# Slovakia connection. Martinus.sk, the major Slovak bookshop, carries a live
# retail record (real cover image, a 8.98-average reader rating, publisher
# "Marenčin PT", year 2012) - but its own ISBN field for this title reads
# "0", not null, the value it uses elsewhere in the same result set for a
# genuinely unlisted field. That is a real book with no registered ISBN, the
# schema's own documented case, not a search failure - recorded below without
# isbn13, exactly as this skill directs.
#
# SOURCING. English Raven Street editions are the author's own shop,
# robertbryndza.com (itself Shopify; fetched as JSON per product, which
# exposes the ISBN in the `barcode` field directly rather than screen-scraping
# a rendered page). English pre-Raven-Street editions and the Brazilian
# edition are OpenLibrary per-ISBN records, matched to the correct work by
# OpenLibrary's own work key and Bryndza's consistent author key
# (OL7527807A) rather than by title alone. Portuguese editions are Bertrand's
# retail page and/or Alma dos Livros' own Shopify product JSON, cross-checked
# against each other where both carry the title; every Portuguese match was
# verified against the book's own synopsis, not assumed from the title. Every
# isbn13 below passes its check digit and no isbn13 repeats across two
# entries.

