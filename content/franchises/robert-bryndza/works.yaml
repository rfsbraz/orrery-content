# Bibliography (Works) - the abstract works; editions and covers are separate
# metadata not recorded here. IDs are STABLE and permanent.
#
# SHAPE OF THIS WING: twenty-four works across four subseries and three
# standalones, plus one apocrypha entry, all under one byline (see
# content/authors/robert-bryndza.yaml - this is not a pen-name split).
#
#   Erika Foster (9) - The Girl in the Ice (2016) through Chasing Shadows
#     (2025), a Metropolitan Police detective procedural. Years cross-checked
#     across the publisher's own collection page (robertbryndza.com) and
#     independent bibliographic aggregators (Goodreads, FantasticFiction,
#     BookSeriesInOrder), which agree on every year.
#   Kate Marshall (5) - Nine Elms (2019) through The Lost Victim (2024): a
#     former detective turned private investigator, working the fog-bound
#     reservoirs, moorland and estuaries of the English Riviera in South
#     Devon rather than Erika Foster's London.
#   Jamie Day (2) - The Quiet Kill (2026), the start of a new series set in
#     1987 London and Bryndza's first male lead, with the sequel The Burning
#     Lie announced for 2027 (see the `forthcoming` note below).
#   Standalone crime (1) - Fear the Silence (2023), a stand-alone thriller
#     whose Czech edition won the translated-fiction category of the Cesky
#     bestseller (Czech Bestseller) awards for 2023. The author's own site
#     rounds this up to "the Czech Bestseller of the Year award"; the
#     contemporary Czech trade record does not support that - the main
#     category that year went to Patrik Hartl's Gazely, one of ten
#     categories awarded on 1 March 2024 (see events.yaml's own sourcing).
#   Coco Pinchard (5) - the romantic comedy series he self-published between
#     2012 and 2015, before the switch to crime; see the PREQUEL NUMBERING
#     note below for how the publisher's own book numbers diverge from
#     publication-year order for two of the five.
#   Standalone romantic comedy (1) - Miss Wrong and Mr Right, self-published
#     in 2015. Its fictional theatre gave Raven Street Publishing, Bryndza's
#     own current imprint, its name.
#   Comic novel, co-authored (1) - Bitch Hollywood (2012); see the CO-AUTHOR
#     note below.
#
# ONE BYLINE, NOT TWO. A confidently stated lead about an author identity
# has turned out to belong to someone else elsewhere in this catalogue before.
# Checked independently here: every edition of every work below, romantic
# comedy and crime alike, credits "Robert Bryndza" with no pen name, on the
# publisher's own current site as much as on the 2012 self-published
# originals. That question is settled. A separate question - how a reader
# arriving for one body of work should be warned about, or pointed toward,
# the other - is about entry paths, not about whether both belong in this
# wing.
#
# PREQUEL NUMBERING. The publisher's own current collection page numbers the
# five Coco Pinchard books 1 through 5 in this order: The Not So Secret
# Emails of Coco Pinchard, Coco Pinchard's Big Fat Tipsy Wedding, Coco
# Pinchard, the Consequences of Love and Sex, A Very Coco Christmas, Coco
# Pinchard's Must-Have Toy Story. But the fourth and fifth are both
# explicitly billed as prequel novellas/short stories set years before book
# one internally (A Very Coco Christmas in 1985, when Coco is eighteen;
# Must-Have Toy Story in December 1992, when her son is four) - written and
# published after the core trilogy, not before it. `published` below is
# publication year, not internal chronology, so the derived default order
# will not reproduce the publisher's 1-5 numbering; A Very Coco Christmas
# (published 2013) will fall next to Big Fat Tipsy Wedding (also 2013) rather
# than after book three. Both are tiered extended rather than core: they are
# genuinely his, but novellas/short stories off the three-novel spine, the
# same test this catalogue already applies to short fiction elsewhere (see
# jo-nesbo/works.yaml).
#
# CO-AUTHOR: Bitch Hollywood. Written with his husband Ján Bryndza and
# credited to both names on every edition checked (AbeBooks, Google Books,
# Goodreads, the CreateSpace paperback record) - recorded here with
# authorRole: co-author rather than by adding a second global author id for
# a one-off collaborator outside this catalogue's scope, the same pattern
# already used for a Jo Nesbø co-written title. Its true first edition was a
# Slovak translation, Mrcha Hollywood (March 2012, per the author's own
# account of how his career began), published before either language edition
# of Coco Pinchard - but Bryndza wrote the manuscript in English, so `title`
# carries his own English title from the original 2012 CreateSpace edition,
# Bitch Hollywood, rather than the Slovak translation's title. The book was
# later retitled and re-released as Lost in Crazytown; that is a rename of
# the same English text, not a new edition, so it is recorded in this note
# rather than as a separate work or a change to `title`.
#
# APOCRYPHA (1). Breaking Point, a short story given free to subscribers of
# the author's own newsletter (the "Robert Bryndza Readers' Club") rather
# than sold - real and published (Raven Street Publishing, 2025) but not
# counted among his numbered novels on his own site, and excluded from the
# "23rd book" count he gives for The Quiet Kill, which this wing's total
# otherwise matches book for book (21 self-published/traditionally-published
# novels plus the co-authored Bitch Hollywood = 22, then The Quiet Kill is
# his 23rd - a count that only works if Breaking Point stays uncounted).
# Verified past the single Goodreads listing: the author's own site
# (robertbryndza.com) runs the newsletter signup itself, offering "a free
# short story Breaking Point" as the Readers' Club welcome gift, and an
# independent book-review blog (worcestersource, May 2026) confirms a reader
# actually received and read it. Clears the bar for an apocrypha entry.

