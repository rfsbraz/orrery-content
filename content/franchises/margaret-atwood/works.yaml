- id: margaret-atwood/fourteen-days
  title: "Fourteen Days: A Collaborative Novel"
  authorIds: [margaret-atwood]
  published: 2024
  subseries: null
  canonTier: apocrypha
  format: novel
  authorRole: contributor
  synopsis: >
    An Authors Guild project conceived by Douglas Preston: residents of a
    Lower East Side Manhattan tenement gather nightly on the rooftop during
    the first fourteen days of the March 2020 COVID-19 lockdown, telling
    stories under nicknames given by the building's superintendent, in a
    frame narrative modelled on The Decameron and The Canterbury Tales.
  note: >
    This is Preston and HarperCollins's book, not Atwood's: thirty-six
    Authors Guild members each contributed one tenant's story under a
    nickname assigned by the building's superintendent, Preston wrote the
    connecting frame narrative (the superintendent, "Yessie"), and Atwood
    served as the project's general editor and one of the thirty-six
    contributing writers. The book withholds which author wrote which
    tenant's story until its own end-of-book contributor bios; Wikipedia,
    the Authors Guild, NPR and Kirkus's review all confirm Atwood's
    participation but none identifies her specific character or night, so
    that pairing is not recorded here. The other thirty-five contributors
    are not listed as collaborators for the same reason Harlan Coben's
    Malice Domestic 7 entry omits its editor and other contributors: this
    is a many-author collaborative project catalogued for one contributor's
    wing, not a joint work between named co-authors. Filed as a novel
    rather than an anthology: Wikipedia, the Authors Guild and HarperCollins
    all describe the book as one continuous narrative carried by a shared
    frame story, not a themed gathering of independent stories.
  sources:
    - https://en.wikipedia.org/wiki/Fourteen_Days
    - https://authorsguild.org/news/order-fourteen-days-out-now/
    - https://www.npr.org/2024/02/12/1230878858/margaret-atwood-douglas-preston-story-collaboration-fourteen-days-pandemic
    - https://www.kirkusreviews.com/book-reviews/margaret-atwood/fourteen-days-atwood-preston/
  images:
    cover: "https://covers.openlibrary.org/b/id/14746368-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL50646690M"

