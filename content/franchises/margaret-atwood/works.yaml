- id: margaret-atwood/alias-grace
  title: "Alias Grace"
  authorIds: [margaret-atwood]
  published: 1996
  subseries: null
  canonTier: core
  note: >
    Whether Grace is innocent, guilty or insane is left open by the novel and
    by the publisher's copy alike - "some believe Grace is innocent; others
    think her evil or insane... Grace claims to have no memory of the
    murders" - so this entry records what she was convicted of and what she
    says, and settles neither. A summary that has her remembering, or
    concealing, what she did resolves the question the book exists to keep
    open, and does not belong here however it is phrased.
  synopsis: >
    A fictionalized account of Grace Marks, a real Canadian domestic servant
    convicted in 1843 for her part in the murders of her employer and his
    housekeeper, reconstructed through her sessions with a doctor engaged by
    reformers seeking her pardon, to whom she says she remembers nothing of
    the killings.
  sources:
