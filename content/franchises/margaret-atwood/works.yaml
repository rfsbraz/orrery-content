# Margaret Atwood: author wing spanning her complete published body of work,
# early poetry pamphlets (1961) through Book of Lives (2025).
#
# Tiering: the novels (including the novella-length Penelopiad and the two
# Handmaid's Tale-cycle books) are core. Poetry collections, short-story
# collections, essay and nonfiction collections, children's books and the
# two original graphic novels are extended - genuinely hers, off the main
# reading spine. Single-appearance or single-production pieces, small-press
# pamphlets and minor collaborative contributions sit in apocrypha.
#
# Poetry and essay/nonfiction entries carry a synopsis describing the
# collection's scope rather than a plot, since they have none - the same
# approach already used for poetry and essay collections elsewhere in this
# catalogue (Saramago's and Palahniuk's works.yaml).
#
# Two subseries: "The Handmaid's Tale" (the 1985 novel and its 2019 sequel,
# both publisher-marketed as a pair) and "MaddAddam Trilogy" (Oryx and Crake,
# The Year of the Flood, MaddAddam). "Angel Catbird" groups the three
# graphic-novel volumes.
#
# Excluded entirely (not apocrypha, not present in any form):
# - Scribbler Moon (2014), her Future Library contribution: a manuscript
#   sealed with no readable text released before 2114.
# - The 2019 graphic-novel adaptation of The Handmaid's Tale, adapted and
#   illustrated by Renée Nault: her visual adaptation of an existing Atwood
#   novel, not a work Atwood herself wrote - the same test that keeps film
#   and TV adaptations out of this catalogue.
# - The Servant Girl (1974), Snowbird (1981) and Heaven on Earth (1987), TV
#   movie scripts with no found record of a published reading text; and
#   Pauline (2014), a chamber-opera libretto likewise performed but not found
#   published as a text (contrast The Trumpets of Summer below, whose text
#   was published).
# - The four Positron e-book episodes (2012-2013): a serialized draft Atwood
#   substantially revised into The Heart Goes Last (2015), noted on that
#   entry rather than catalogued separately.
# - Good Bones and Simple Murders (1994, a US repackaging of Good Bones and
#   Murder in the Dark), A Trio of Tolerable Tales (2017, an omnibus of Rude
#   Ramsay, Bashful Bob and Wandering Wenda) and the four Selected/Collected
#   Poems anthologies (1976, 1987, 1990, 1998): each recombines poems or
#   stories already catalogued under their original collection rather than
#   presenting new work. On Writers and Writing (2015) and Moving Targets:
#   Writing with Intent 1982-2004 (2004) are, respectively, a Canadian
#   reissue title of Negotiating with the Dead and a Canadian edition of
#   Writing with Intent, both noted on those entries below.
# - My Evil Mother, published alone as a 2022 chapbook/e-book before becoming
#   the title story of Old Babes in the Wood's middle section in 2023.
# - Kanadian Kultchur Komix, the 1975-1980 pseudonymous comic strip: recorded
#   as a pseudonym on the author entity, never collected into a book of its
#   own.
#
# The widely cited counts in Wikipedia's own lead (18 poetry books, 18
# novels, 11 nonfiction, 9 short fiction, 8 children's books) match this list
# work-for-work against Wikipedia's and margaretatwood.ca's own category
# tables, except the children's count: only 7 distinct titles are sourced
# here. A Trio of Tolerable Tales (above) is the only candidate found for an
# 8th, and it is a compilation rather than new content.

