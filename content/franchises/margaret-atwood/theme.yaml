# Branding for the Margaret Atwood wing (see Orrery CONCEPT SS6 and
# docs/SCHEMA.md#themeyaml).
#
# The register is drawn from two well-documented facts rather than genre
# iconography, deliberately avoiding the one obvious costume (Gilead's red
# cloak and white bonnet, which would flatten a whole-career wing into its
# single most-adapted book): her father Carl Atwood was a forest
# entomologist, and Atwood's own childhood in the Quebec backwoods was spent
# around his fieldwork and specimen collecting; and her fiction, across
# realist and speculative books alike, returns again and again to obsessive
# record-keeping under institutional control - Gilead's ledgers and
# ceremonies, the Positron Project's paperwork, the catalogued, engineered
# species of the MaddAddam trilogy. "specimen-ledger" reads both at once: a
# preserved specimen with its own hand-written label, filed in an official
# register.
#
# Checked against scripts/theme_digest.py before choosing anything. No wing
# in the catalogue yet covers literary dystopia/speculative fiction as a
# register, so there is no direct neighbour to differentiate from the way
# Poe/Lovecraft or the crime wings had to. The accent is a muted
# iodine-tincture brown - the colour a specimen turns preserved in old
# formaldehyde, not a costume red - sitting between edgar-allan-poe's
# brighter brass (#9c7a3d) and jose-luis-peixoto's warmer ochre (#c2952a)
# without duplicating either.
preset: specimen-ledger
palette:
  bg: "#12140f"        # near-black with a faint olive-brown cast - an
                       # archive basement or a specimen-drawer's felt lining
  surface: "#1b1d16"   # one step up, same cast, for cards
  ink: "#e8e2d0"       # aged specimen-label card, warm cream against the
                       # cold-dark background - AA-checked, high contrast
  muted: "#8b8672"     # faded pencil grey-brown, for metadata and captions
  accent: "#8f6a3a"    # iodine-tincture brown; see the note above on why
                       # this and not Gilead red
displayFace: spectral   # from the app's implemented set (fraunces |
                       # spectral | sourceSerif). fraunces reads warm and
                       # is heavily used already (8 wings); sourceSerif is
                       # the catalogue's most common face (12 wings).
                       # spectral's colder, more architectural letterforms
                       # suit her exacting, unsentimental prose better than
                       # either.
signature: rule         # a firm, ruled line - the field line on a form or
                       # ledger, the rule under a specimen label - fits the
                       # record-keeping register directly. Reused rather
                       # than invented (nine other wings use it), which is
                       # allowed; the app's closed set is small on purpose,
                       # and correctness matters more than exclusivity here.
notes: >
  Institutional record-keeping and a naturalist's specimen archive, held in
  one register rather than two: cold, exact, filed. No red, no bonnets, no
  genre costume - the shelf this wing describes is a career, not one
  adaptation.
# Checked against scripts/theme_digest.py before drafting a single field.
# displayFace spectral + signature rule is not the empty axis the scaffold
# note above implies for genre - two wings already share exactly that pair:
# hp-lovecraft and valter-hugo-mae. Both read in full. Lovecraft's own
# emblem is a naturalist's instrument too (a telescope and a star-notebook)
# and his motifs already include a sealed, string-tied deposition standing
# in for the thing itself - the two most obvious moves for this wing
# (a field-naturalist object; a found/verified document) are exactly the
# two Lovecraft already made his own. Kept distinct on both: the instrument
# here is closed rather than aimed (a sealed specimen jar, not a telescope
# pointed at open sky - inward and terrarium-scaled where his is outward
# and cosmic, matching her own repeated insistence in In Other Worlds
# (2011) that her speculative fiction extrapolates from the world we have
# rather than reaching for one we don't), and the document motif here is
# never sealed with wax or string (already Lovecraft's shape, and Poe's
# too - a sealed letter, a string-tied pamphlet stack) but held together
# with a rusted paperclip or dog-eared and loose, marked up later by a
# second, different hand rather than sworn or stamped once. Valter Hugo
# Mãe shares the same two values by a different route entirely - warm
# umber earth tones and a tremulous hand-drawn dip-pen line - so the
# separation there is atmosphere and line character rather than subject:
# this wing stays cold and exact where his is warm and loose. The accent
# (#8f6a3a) was already checked at scaffold against edgar-allan-poe
# (#9c7a3d) and jose-luis-peixoto (#c2952a); nothing below moves it.
art:
  emblem:
    object: >
      A glass specimen jar, screw-lidded, holding one preserved insect
      pinned upright inside; a hand-written paper label is wired to its
      neck, and the jar sits on the lip of an open card-catalogue drawer,
      its brass number-holder frame empty of a card.
    why: >
      Atwood's father, Carl Edmund Atwood, was a forest entomologist, and
      her own childhood ran on his fieldwork calendar - summers in the
      Quebec and Ontario bush collecting and recording insects, winters
      back in Toronto. She has named that habit of exact observation and
      classification, more than any book she read, as the root of how her
      fiction watches its own invented societies: Gilead's ceremonies kept
      in a Compendium and read aloud from a lectern, the Positron Project's
      paperwork, MaddAddam's catalogued, engineered species. A specimen
      under glass, labelled and filed rather than displayed, is that habit
      in one object - close observation held inside an institutional
      system, not an inventory of horror-genre creature-collecting or a
      museum-of-curiosities cabinet.
  motifs:
    - a glass specimen jar or a pinned, mounted insect under glass, its
      label filled in by hand
    - an open card-catalogue drawer, or a bank of them, brass number-frames
      on the fronts
    - a hand-ruled ledger page, its columns filled in different inks and
      hands across visibly different sittings
    - a field-naturalist's collecting kit - specimen box, forceps, a small
      glass killing jar - set down in a clearing at the edge of northern
      bush, never inside a lab
    - a loose sheaf of typed or handwritten pages, held by a rusted
      paperclip or gone dog-eared with handling, carrying marginal notes in
      a second, later hand rather than the first
    - a glassine specimen envelope holding a dried leaf, seed head or
      insect wing, backlit enough to show through
    - a sealed, unopened package or crate, addressed and postmarked but
      never shown opened
    - a boreal treeline or a stretch of cleared farmland glimpsed past an
      institutional window, fence-line or doorway - the wild the record-
      keeping is trying to hold at arm's length
  atmosphere: >
    Cold, exact and close-scaled - a specimen under glass, an experiment
    read off its own instruments, never a monster story and never a vast
    unknowable cosmos. Institutions (a registry, a laboratory, a filing
    room, a rural schoolroom) are plain, functional and poorly lit rather
    than gothic; the unease is procedural, sitting in what is being
    measured and by whom, not in a shadow. Where the wild appears at all it
    is northern bush or worked farmland, glimpsed rather than entered,
    always at a remove from whatever is being catalogued about it.
  lineCharacter: >
    A fine stippled line built the way a Victorian entomological field
    plate accumulates tone - many small dots and short cross-strokes laid
    down patiently rather than a single continuous contour, a technical
    pen's ruled hatching or a wash. Precise and additive: a form goes dark
    by more passes of stipple, never by a flooded pool of ink or a loaded
    brush.
  backgroundTexture: >
    A dense, slightly toothy specimen-mount or herbarium-sheet stock, pale
    and made to be written on and filed rather than admired - corners
    softened by repeated handling and re-filing, not water-damage foxing or
    a decorative wash.
  accentUse: >
    The iodine-tincture brown appears only where something preserved has
    visibly aged or stained - a label's ink gone amber, a chemical
    tide-line on a mounting card, a single rubber date-stamp - on exactly
    one element per image, never as a wash, a wall or a garment.
  avoid:
    - Gilead's red cloak and white bonnet, on a figure or as a colour field
      standing in for the book - the wing's own most reproduced and most
      adapted image, ruled out already at scaffold and restated here
    - any depiction of what causes the collapse in Oryx and Crake, or of
      anyone enacting it - the novel withholds the agent, and so does this
      wing's art
    - the closing convergence of survivors at the end of The Year of the
      Flood - the emptied city and its two women stop short of it
    - a hand or a desk staged to imply authorship of the inner novel in
      The Blind Assassin
    - any image answering whether Grace is guilty in Alias Grace - no
      blood, no weapon, no re-enactment; the ledger and testimony motifs
      stay administrative, never accusatory
    - the MaddAddam trilogy's survivors shown assembled or identifiable as
      a group
    - tentacles, deep-space imagery or any cosmic-horror register - this
      wing's speculative fiction extrapolates from the world at hand, never
      reaches for one that couldn't happen
    - taxidermy-horror or curiosity-cabinet staging - a specimen here is
      catalogued, not sinister
    - generic dystopia signage (barbed wire, gas masks, ruined skylines)
      used as shorthand with nothing specific to this author behind it
