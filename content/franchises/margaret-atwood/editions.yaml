# Editions of Margaret Atwood: 18 English (en) editions over 17 of 18
# novel/novella-format works (all 17 core novels, plus one apocrypha short
# story), and 23 Portuguese (pt-PT) editions over 23 of 69 works (15 of the
# 17 core novels, plus 8 extended-tier poetry/essay/children's titles).
#
# ENGLISH SCOPE: the true FIRST edition, not the most recent, because her
# English backlist is reissued constantly across Anchor/Vintage/Seal/Emblem/
# Virago imprints with dozens of overlapping ISBNs (the OpenLibrary sweep
# for this wing returned well over a hundred English candidates for The
# Handmaid's Tale alone) - recording the true first is the one choice that
# stays correct as later printings come and go, same rule as this
# catalogue's Dan Brown file. Where the Canadian McClelland & Stewart first
# could be independently confirmed with its own ISBN (Surfacing, Lady
# Oracle, Bodily Harm, Cat's Eye, The Handmaid's Tale, Alias Grace, The
# Blind Assassin, The Year of the Flood, The Testaments - nine of the
# seventeen), it is recorded as her home-market edition. Where it could not
# be found with a working ISBN (Life Before Man, The
# Robber Bride, Oryx and Crake, MaddAddam, The Heart Goes Last), the
# same-year Simon & Schuster or Nan A. Talese/Doubleday US first is recorded
# instead - a real first edition, just not the Canadian one. Hag-Seed
# carries no Canadian M&S printing at all: it launched as part of the
# Hogarth Shakespeare series, and the UK Hogarth Shakespeare edition
# (6 October 2016) is recorded ahead of the US Hogarth edition (11 October
# 2016, five days later).
#
# THE EDIBLE WOMAN (1969) has no ISBN on this file, deliberately. Its true
# McClelland & Stewart first carries no ISBN in OpenLibrary's own edition
# record for that year - plausible for a 1969 Canadian book, since the ISBN
# standard was still being adopted market by market at the time - and no
# second source supplied one. A 2009 Virago reissue does carry an ISBN
# (9780860681298), but shipping that under a "first edition" entry would
# misrepresent a 40-years-later reprint as the original, so it is left out
# rather than substituted. Publisher and year are recorded with no isbn13,
# per this skill's own rule for a real edition with no working number.
#
# PORTUGUESE SCOPE: the most recent in-print edition (the opposite default,
# per SCHEMA.md, since the concern for a translated market is buyability
# today, not stability against reissues). Bertrand has been Atwood's
# dominant Portuguese publisher since 2009, absorbing older Círculo de
# Leitores/Livros do Brasil/Europa-América translations and reissuing eight
# of her novels a second time between 2020 and 2026 (Alias Grace, The
# Blind Assassin, The Handmaid's Tale, Oryx and Crake, The Year of the
# Flood all have a confirmed 2nd Bertrand edition recorded here in
# preference to their 1st). Two novels never made it into the Bertrand
# programme and their sole pt-PT edition is consequently an older,
# out-of-print one, recorded because it is the only one, per this skill's
# own rule: Bodily Harm ("A Morte Beijou-a ao de Leve", Círculo de
# Leitores) and The Robber Bride ("A Impostora", Livros do Brasil). THE
# EDIBLE WOMAN AND LIFE BEFORE MAN HAVE NO PT-PT EDITION AT ALL - a full
# sweep of the Biblioteca Nacional de Portugal's 44-record Atwood catalogue
# (catalogo.bnportugal.gov.pt, author-word index, all five result pages
# read) turned up nothing for either title. That is the Portuguese market,
# not a research gap: 15 of 17 core novels is a strong hit rate for a
# living, heavily-translated author, and the two absences are real.
#
# NON-LITERAL PT TITLES, confirmed by synopsis and publishing history, not
# by guessing a translation: "A Morte Beijou-a ao de Leve" ("Death Kissed
# Her Lightly") is Bodily Harm; "A Impostora" ("The Impostor") is The
# Robber Bride, whose plot is exactly that - a woman who impersonates her
# own death and returns; "Senhora do Oráculo" ("Lady of the Oracle") is a
# direct rendering of Lady Oracle, not literal-sounding in English word
# order; "Chamavam-lhe Grace" ("They Called Her Grace") is Alias Grace;
# "Desforra" ("Payback"/"Revenge") is Payback: Debt and the Shadow Side of
# Wealth; "Semente de Bruxa" ("Witch's Seed") is Hag-Seed, Caliban's own
# insult in The Tempest and the novel's own title conceit; "Afectuosamente"
# ("Affectionately"/"Fondly") is Dearly, matching its dedication "for
# Graeme in absentia"; "Colchão de Pedra" is a direct match for Stone
# Mattress; "Questões Escaldantes" ("Burning Questions") and "Entre Gatos e
# Pássaros" ("Between Cats and Birds", matched by its own jacket synopsis
# naming the girl Samantha and her cat, not by title) round out the set.
#
# A PT-BR TRAP AVOIDED: "O Conto da Aia" (Rio de Janeiro: Rocco) is the
# BRAZILIAN Handmaid's Tale, a different translation with a different
# title from the pt-PT "A História de Uma Serva" this file records - see
# CURATION.md's registrant-prefix rule. OpenLibrary's own "pt" market
# bucket for this wing returned thirteen candidates and every one of them
# was Brazilian (Rocco, Companhia das Letras, Livros do Brasil-BR), which
# is why this file's pt-PT sourcing rests on the Biblioteca Nacional de
# Portugal catalogue directly rather than on OpenLibrary's merged bucket -
# the trap CURATION.md warns is "live on every ... translated English
# [author]" turned out to be total here, not partial.
#
# AN OMNIBUS ISBN AVOIDED: "Quatro Contos Consonantes" (Ponto de Fuga,
# 2021, ISBN 978-989-8881-37-3) bundles Portuguese translations of FOUR
# separate alliterative picture books - Rude Ramsay and the Roaring
# Radishes, Bashful Bob and Doleful Dorinda, Princess Prunella and the
# Purple Peanut, and Wandering Wenda and Widow Wallop's Wunderground
# Washery - under one binding and one ISBN. None of the four appears below:
# an omnibus ISBN standing in for any one of them would send a reader
# shopping for a single title to a listing for all four, the same rule
# this catalogue's Jim Butcher and John Shirley files already state. None
# of the four alliterative titles has ever had a standalone pt-PT printing
# as far as this catalogue can establish.
#
# THE GRAPHIC-NOVEL ADAPTATION IS NOT HERE ON PURPOSE. Bertrand has
# published Renée Nault's graphic-novel adaptation of The Handmaid's Tale
# in Portuguese twice (2020, 2026 - both real, both with valid ISBNs
# independently confirmed at the BNP). Neither is recorded: works.yaml's
# own header excludes the Nault adaptation entirely, on the same test that
# keeps film and TV adaptations out of this catalogue - it is Nault's book,
# not Atwood's text - and an edition cannot exist here for a work this
# wing does not catalogue.
#
# FOURTEEN DAYS (2024, apocrypha, authorRole: contributor) was investigated
# and deliberately NOT shipped, unlike this catalogue's Harlan Coben
# precedent (Malice Domestic 7), which does carry one English entry for an
# anthology a contributor merely appears in. No pt-PT edition exists (absent
# from the BNP's full 44-record Atwood sweep - too recent and too diffusely
# authored to have reached Portuguese translation). An English ISBN
# (9781784745455) is cited on Wikipedia's own infobox, but OpenLibrary's
# edition record for that same number attributes it to a different
# publisher (Penguin Random House) than Wikipedia's infobox states
# (HarperCollins) - a direct conflict between the two sources this file
# would otherwise cross-check against each other, and OpenLibrary and the
# Google Books API were both unreachable to settle it (Internet Archive-wide
# outage; Google Books quota exhausted).
# Per this skill's own rule, an unresolved conflict does not ship rather
# than picking a side - a human with a browser can settle publisher vs.
# ISBN for this one specific fact.
#
# THE LABRADOR FIASCO (1996, apocrypha short story) carries its own English
# first edition, surfaced while sweeping the BNP's Atwood catalogue for
# Portuguese material: Bloomsbury's "Birthday Quid" series printed it as
# its own small illustrated book, in English, and the BNP holds a copy.
#
# SOURCING. English: OpenLibrary's own per-ISBN records
# (openlibrary.org/api/books?bibkeys=ISBN:...), cross-checked against
# Wikipedia infoboxes and bookseller bibliographic pages (Biblio, AbeBooks)
# for the exact publisher/year pairing; every ISBN-10 found this way was
# converted to ISBN-13 and the check digit recomputed from scratch, never
# carried over. Portuguese: the Biblioteca Nacional de Portugal's own
# catalogue (catalogo.bnportugal.gov.pt, author-word index, browser
# User-Agent required), all five result pages read individually rather
# than trusting the first page's ten records; ISBN-10 records from the
# 1990s were likewise converted and rechecked. Every isbn13 below passes
# `valid_isbn13`.

