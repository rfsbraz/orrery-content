    title. An earlier, differently-titled translation exists at Europa-
    América ("Crónica de uma Serva", 1988, no ISBN found) but is long out of
    print. NOT TO BE CONFUSED with "O Conto da Aia" (Rio de Janeiro: Rocco),
    the unrelated pt-BR translation of the same novel under a different
    title.
