- id: margaret-atwood-circle-game-gg-1966
  organisation: beside
  illustration_type: emblem-seal
  images_required: 1
  date: 1966
  title: A first trade collection of poems takes the Governor General's Award
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/the-circle-game|The Circle Game]], expanded from a
    1964 limited art-press edition into the trade volume Contact Press issued
    in 1966, won the Governor General's Award for Poetry or Drama, announced
    on 27 March 1967; House of Anansi reissued the collection the same year.
    Atwood was 26 and had published no fiction. It is her first major national
    prize, and the standing her poetry had by 1969 is what
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]]'s own belated
    appearance turns on, the publisher who had lost that manuscript coming
    back to a writer whose name was by then made in verse.
  note: >
    The award is dated here to 1966, the year of the book and the year the
    prize is named for; the winners were announced on 27 March 1967.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/1966_Governor_General%27s_Awards
    - https://en.wikipedia.org/wiki/The_Circle_Game_(poetry_collection)

- id: margaret-atwood-edible-woman-delayed-1969
  organisation: artifact-spread
  illustration_type: manuscript-proof
  modifier: pull-focus
  images_required: 1
  date: 1969
  dateRange: "1965-1969"
  title: A first novel sits lost for four years
  scope: industry
  reach: franchise
  impact: med
  description: >
    Atwood has told the story of writing
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]] in 1965 and
    sending it to a publisher, who lost the manuscript. Four years later,
    after she had already won a Governor General's Award for poetry, the same
    publisher took her to lunch and promised to publish the novel; asked
    whether he had read it, he said no. It appeared in 1969, McClelland and
    Stewart's edition arriving after Atwood had spent the intervening years
    teaching and publishing poetry rather than fiction, so that her prose
    debut reached print only once her name was already established in verse.
  note: >
    Recounted by Atwood herself in a 1995 Hay Festival talk; no independent
    account of the publisher's side has been found, so this is her own telling
    of events about herself rather than a verified third-party record.
  spoilerAfter: null
  sources:
    - https://www.encyclopedia.com/arts/educational-magazines/edible-woman
    - https://en.wikipedia.org/wiki/The_Edible_Woman

- id: margaret-atwood-handmaids-tale-award-sweep-1986
  organisation: mosaic
  illustration_type: press-media-collage
  modifier: anchor-with-satellites
  images_required: 1
  date: 1986
  dateRange: "1985-1987"
  title: A rapid sweep of major honors turns a novelist into an international name
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] won the
    1985 Governor General's Award for fiction, was shortlisted for the 1986
    Booker Prize (losing to Kingsley Amis's The Old Devils), and won the
    inaugural Arthur C. Clarke Award for science fiction in 1987, the first
    time the new prize had been given to anyone. Coming after sixteen years
    and five previous novels of a substantial but mostly domestic Canadian
    reputation, the sequence made her a major name in English-language
    fiction within about eighteen months.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/1985_Governor_General%27s_Awards
