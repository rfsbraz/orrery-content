- id: margaret-atwood-cats-eye-booker-1989
  organisation: beside
  illustration_type: press-media-collage
  images_required: 1
  date: 1989
  title: A second Booker shortlisting, and a second Governor General's finalist slot
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/cats-eye|Cat's Eye]] was a finalist for the 1988
    Governor General's Award for fiction and was shortlisted for the 1989
    Booker Prize, her second Booker shortlisting after
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]]. It did
    not win either; the pattern of major-prize recognition without the
    biggest wins would hold for another decade, through
    [[work:margaret-atwood/alias-grace|Alias Grace]]'s own 1996 Booker
    shortlisting, until [[work:margaret-atwood/the-blind-assassin|The Blind
    Assassin]] finally won the Booker in 2000.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Cat%27s_Eye_(novel)
    - https://thebookerprizes.com/the-booker-library/authors/margaret-atwood

- id: margaret-atwood-alias-grace-giller-1996
  organisation: diptych
  illustration_type: book-object
  images_required: 2
  date: 1996
  title: Wins the Giller Prize, and a third Booker shortlisting goes unrewarded
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/alias-grace|Alias Grace]] won the Scotiabank
    Giller Prize in 1996, the country's own richest fiction prize, the same
    year it was shortlisted for, and did not win, the Booker Prize. It was
    her third Booker shortlisting without a win, following
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] (1986)
    and [[work:margaret-atwood/cats-eye|Cat's Eye]] (1989): recognized
    everywhere, awarded internationally nowhere yet, four years before
    [[work:margaret-atwood/the-blind-assassin|The Blind Assassin]] broke the
    pattern.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Alias_Grace
