- id: margaret-atwood-circle-game-gg-1966
  organisation: beside
  illustration_type: emblem-seal
  images_required: 1
  date: 1966
  title: A first trade collection of poems takes the Governor General's Award
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/the-circle-game|The Circle Game]], expanded from a
    1964 limited art-press edition into the trade volume Contact Press issued
    in 1966, won the Governor General's Award for Poetry or Drama, announced
    on 27 March 1967; House of Anansi reissued the collection the same year.
    Atwood was 26 and had published no fiction. It is her first major national
    prize, and the standing her poetry had by 1969 is what
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]]'s own belated
    appearance turns on, the publisher who had lost that manuscript coming
    back to a writer whose name was by then made in verse.
  note: >
    The award is dated here to 1966, the year of the book and the year the
    prize is named for; the winners were announced on 27 March 1967.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/1966_Governor_General%27s_Awards
    - https://en.wikipedia.org/wiki/The_Circle_Game_(poetry_collection)

- id: margaret-atwood-edible-woman-delayed-1969
  organisation: artifact-spread
  illustration_type: manuscript-proof
  modifier: pull-focus
  images_required: 1
  date: 1969
  dateRange: "1965-1969"
  title: A first novel sits lost for four years
  scope: industry
  reach: franchise
  impact: med
  description: >
    Atwood has told the story of writing
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]] in 1965 and
    sending it to a publisher, who lost the manuscript. Four years later,
    after she had already won a Governor General's Award for poetry, the same
    publisher took her to lunch and promised to publish the novel; asked
    whether he had read it, he said no. It appeared in 1969, McClelland and
    Stewart's edition arriving after Atwood had spent the intervening years
    teaching and publishing poetry rather than fiction, so that her prose
    debut reached print only once her name was already established in verse.
  note: >
    Recounted by Atwood herself in a 1995 Hay Festival talk; no independent
    account of the publisher's side has been found, so this is her own telling
    of events about herself rather than a verified third-party record.
  spoilerAfter: null
  sources:
    - https://www.encyclopedia.com/arts/educational-magazines/edible-woman
    - https://en.wikipedia.org/wiki/The_Edible_Woman

- id: margaret-atwood-handmaids-tale-award-sweep-1986
  organisation: mosaic
  illustration_type: press-media-collage
  modifier: anchor-with-satellites
  images_required: 1
  date: 1986
  dateRange: "1985-1987"
  title: A rapid sweep of major honors turns a novelist into an international name
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] won the
    1985 Governor General's Award for fiction, was shortlisted for the 1986
    Booker Prize (losing to Kingsley Amis's The Old Devils), and won the
    inaugural Arthur C. Clarke Award for science fiction in 1987, the first
    time the new prize had been given to anyone. Coming after sixteen years
    and five previous novels of a substantial but mostly domestic Canadian
    reputation, the sequence made her a major name in English-language
    fiction within about eighteen months.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/1985_Governor_General%27s_Awards
    - https://www.ontheprize.co.uk/blog/the-handmaids-tale-margaret-atwood-1986-booker-shortlisted
    - https://en.wikipedia.org/wiki/The_Handmaid%27s_Tale

- id: margaret-atwood-cats-eye-booker-1989
  organisation: beside
  illustration_type: press-media-collage
  images_required: 1
  date: 1989
  title: A second Booker shortlisting, and a second Governor General's finalist slot
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/cats-eye|Cat's Eye]] was a finalist for the 1988
    Governor General's Award for fiction and was shortlisted for the 1989
    Booker Prize, her second Booker shortlisting after
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]]. It did
    not win either; the pattern of major-prize recognition without the
    biggest wins would hold for another decade, through
    [[work:margaret-atwood/alias-grace|Alias Grace]]'s own 1996 Booker
    shortlisting, until [[work:margaret-atwood/the-blind-assassin|The Blind
    Assassin]] finally won the Booker in 2000.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Cat%27s_Eye_(novel)
    - https://thebookerprizes.com/the-booker-library/authors/margaret-atwood

- id: margaret-atwood-alias-grace-giller-1996
  organisation: diptych
  illustration_type: book-object
  images_required: 2
  date: 1996
  title: Wins the Giller Prize, and a third Booker shortlisting goes unrewarded
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/alias-grace|Alias Grace]] won the Scotiabank
    Giller Prize in 1996, the country's own richest fiction prize, the same
    year it was shortlisted for, and did not win, the Booker Prize. It was
    her third Booker shortlisting without a win, following
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] (1986)
    and [[work:margaret-atwood/cats-eye|Cat's Eye]] (1989): recognized
    everywhere, awarded internationally nowhere yet, four years before
    [[work:margaret-atwood/the-blind-assassin|The Blind Assassin]] broke the
    pattern.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Alias_Grace
    - https://gillerprize.ca/1996-finalists/

- id: margaret-atwood-oryx-and-crake-booker-2003
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 2003
  title: A post-apocalyptic opening novel reaches the Booker shortlist
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/oryx-and-crake|Oryx and Crake]], the first volume
    of what became the MaddAddam Trilogy, was shortlisted for the 2003 Booker
    Prize, the 2003 Giller Prize and the 2003 Governor General's Award for
    fiction, without winning any of the three. It marked speculative fiction
    of ecological catastrophe, a genre often kept at arm's length by literary
    prize juries, being taken seriously by all three at once, on the first
    outing of a project she would not finish for another decade.
  spoilerAfter: null
  sources:
    - https://thebookerprizes.com/the-booker-library/books/oryx-and-crake
    - https://en.wikipedia.org/wiki/Oryx_and_Crake

- id: margaret-atwood-handmaids-tale-hulu-2017
  organisation: mosaic
  illustration_type: press-media-collage
  modifier: pull-focus
  images_required: 1
  date: 2017-04-26
  title: The Hulu adaptation, and a novel's second life as a street protest
  scope: culture
  reach: franchise
  impact: high
  description: >
    Hulu's television adaptation of
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] premiered
    on 26 April 2017 and won eight Emmy Awards that September, including
    Outstanding Drama Series, the first won by a streaming service. Sales of
    the 1985 novel had already risen sharply after the November 2016 US
    election; within weeks of the show's premiere, protesters in Texas,
    then Ohio, Missouri and beyond, were appearing at statehouses in the
    red robes and white bonnets of the novel's Handmaids to oppose abortion
    restrictions, a piece of the book's own imagery adopted as a real-world
    protest uniform three decades after publication.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Handmaid%27s_Tale_(TV_series)
    - https://deadline.com/2017/09/the-handmaids-tale-wins-emmy-best-drama-series-hulu-streaming-service-1202171581/
    - https://slate.com/culture/2017/03/texas-women-gathered-dressed-as-characters-from-the-handmaid-s-tale-to-protest-anti-abortion-measures.html

- id: margaret-atwood-testaments-booker-2019
  organisation: diptych
  illustration_type: book-object
  images_required: 2
  date: 2019-10-14
  title: A second Booker Prize, split against the rules, the week her partner is buried
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:margaret-atwood/the-testaments|The Testaments]] won the 2019
    Booker Prize jointly with Bernardine Evaristo's Girl, Woman, Other,
    announced on 14 October at London's Guildhall. The five judges defied the
    Booker Foundation chair's explicit instruction to name one winner,
    breaking a rule against joint prizes adopted in 1993 after the last
    split award; at 79, Atwood became the oldest Booker winner, thirty-three
    years after The Handmaid's Tale first made the shortlist and nineteen
    years after her sole win for
    [[work:margaret-atwood/the-blind-assassin|The Blind Assassin]]. The
    announcement came four weeks after Graeme Gibson's death in London
    during the same book's publicity tour.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/2019_Booker_Prize
    - https://www.theglobeandmail.com/arts/books/article-booker-prize-rocked-by-controversy-after-panel-selects-two-winners/
    - https://www.aljazeera.com/features/2019/10/15/booker-judges-break-rules-to-honour-novelists-atwood-and-evaristo

- id: margaret-atwood-handmaids-tale-unburnable-book-2022
  organisation: artifact-spread
  illustration_type: document-facsimile
  modifier: breakout
  images_required: 1
  date: 2022-05-23
  title: An unburnable edition, answering a wave of book bans
  scope: culture
  reach: franchise
  impact: med
  description: >
    Announced at PEN America's annual gala on 23 May 2022 and auctioned at
    Sotheby's through 7 June, "The Unburnable Book" was a single copy of
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] printed
    on sheets of nickel wire, stainless steel and aluminum with fire-resistant
    inks, built by the studio The Gas Company and creative agency Rethink. A
    launch video showed Atwood trying and failing to burn it. It sold for
    $130,000, with proceeds going to PEN America, timed to a year in which
    the novel was repeatedly targeted for removal from school libraries and
    curricula across the United States.
  spoilerAfter: null
  sources:
    - https://www.sothebys.com/en/buy/auction/2022/the-unburnable-book
    - https://www.cbc.ca/books/burn-proof-edition-of-margaret-atwood-s-the-handmaid-s-tale-up-for-auction-1.6464903
    - https://www.cnn.com/style/article/the-handmaids-tale-unburnable-book-sothebys/index.html
