- id: margaret-atwood-oryx-and-crake-booker-2003
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 2003
  title: A post-apocalyptic opening novel reaches the Booker shortlist
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/oryx-and-crake|Oryx and Crake]], the first volume
    of what became the MaddAddam Trilogy, was shortlisted for the 2003 Booker
    Prize, the 2003 Giller Prize and the 2003 Governor General's Award for
    fiction, without winning any of the three. It marked speculative fiction
    of ecological catastrophe, a genre often kept at arm's length by literary
    prize juries, being taken seriously by all three at once, on the first
    outing of a project she would not finish for another decade.
  spoilerAfter: null
  sources:
    - https://thebookerprizes.com/the-booker-library/books/oryx-and-crake
