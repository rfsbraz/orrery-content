- id: margaret-atwood-handmaids-tale-hulu-2017
  organisation: mosaic
  illustration_type: press-media-collage
  modifier: pull-focus
  images_required: 1
  date: 2017-04-26
  title: The Hulu adaptation, and a novel's second life as a street protest
  scope: culture
  reach: franchise
  impact: high
  description: >
    Hulu's television adaptation of
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] premiered
    on 26 April 2017 and won eight Emmy Awards that September, including
    Outstanding Drama Series, the first won by a streaming service. Sales of
    the 1985 novel had already risen sharply after the November 2016 US
    election; within weeks of the show's premiere, protesters in Texas,
    then Ohio, Missouri and beyond, were appearing at statehouses in the
    red robes and white bonnets of the novel's Handmaids to oppose abortion
    restrictions, a piece of the book's own imagery adopted as a real-world
    protest uniform three decades after publication.
  note: >
    The costume this description ends on is the one image the wing's `avoid`
    list rules out: Gilead's red cloak and white bonnet, on a figure or as a
    colour field standing in for the book. The entry reads the moment through
    the press response to it, not through a rendered costume - and the
    pull-focus inset here magnifies a press artefact, a headline, a chyron,
    an awards podium, never a figure in the protest crowd or what that figure
    is wearing.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Handmaid%27s_Tale_(TV_series)
    - https://deadline.com/2017/09/the-handmaids-tale-wins-emmy-best-drama-series-hulu-streaming-service-1202171581/
    - https://slate.com/culture/2017/03/texas-women-gathered-dressed-as-characters-from-the-handmaid-s-tale-to-protest-anti-abortion-measures.html

- id: margaret-atwood-testaments-booker-2019
  organisation: diptych
  illustration_type: book-object
  images_required: 2
  date: 2019-10-14
  title: A second Booker Prize, split against the rules, the week her partner is buried
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:margaret-atwood/the-testaments|The Testaments]] won the 2019
    Booker Prize jointly with Bernardine Evaristo's Girl, Woman, Other,
    announced on 14 October at London's Guildhall. The five judges defied the
    Booker Foundation chair's explicit instruction to name one winner,
    breaking a rule against joint prizes adopted in 1993 after the last
    split award; at 79, Atwood became the oldest Booker winner, thirty-three
    years after The Handmaid's Tale first made the shortlist and nineteen
    years after her sole win for
    [[work:margaret-atwood/the-blind-assassin|The Blind Assassin]]. The
    announcement came four weeks after Graeme Gibson's death in London
    during the same book's publicity tour.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/2019_Booker_Prize
    - https://www.theglobeandmail.com/arts/books/article-booker-prize-rocked-by-controversy-after-panel-selects-two-winners/
    - https://www.aljazeera.com/features/2019/10/15/booker-judges-break-rules-to-honour-novelists-atwood-and-evaristo

- id: margaret-atwood-payback-massey-lectures-2008
  organisation: passage
  illustration_type: journey-transit
  images_required: 1
  date: 2008-10-12
  title: Delivers the Massey Lectures in five cities before the book exists
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/payback|Payback: Debt and the Shadow Side of
    Wealth]] began as the 2008 Massey Lectures, Canada's flagship public
    lecture series: five free, one-hour lectures, one per chapter, delivered
    live to a different city each time - St. John's on 12 October, Vancouver
    on the 15th, Winnipeg on the 17th, Montreal on the 20th, and Toronto on 1
    November - then recorded for national broadcast on CBC Radio One's Ideas,
    10-14 November. The lectures had been meant for 2009; her publisher moved
    her novel [[work:margaret-atwood/the-year-of-the-flood|The Year of the
    Flood]] the other way, from 2008 to 2009, to keep it clear of the US
    presidential election, and the Massey Lectures organizers pulled Atwood's
    turn forward a year to fill the resulting gap in her schedule, finding out
    about the swap from a newspaper article. Atwood wrote the text between
    January and June 2008 and delivered it as spoken argument, audience
    questions included, months before House of Anansi ever set the book.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Payback:_Debt_and_the_Shadow_Side_of_Wealth
    - http://www.winnipegfreepress.com/local/33155104.html

- id: margaret-atwood-year-of-the-flood-tour-2009
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2009-09
  title: A book tour restaged as a touring theatrical, choral event
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:margaret-atwood/the-year-of-the-flood|The Year of the Flood]]'s
    publicity tour, launched on the eve of Atwood's 70th birthday, replaced
    readings and signings with a travelling theatrical production: actors
    performing in character as the novel's God's Gardeners alongside a local
    volunteer choir in each city, singing a set of fourteen hymns written for
    the book and later released as a CD. CBC's Heather Mallick reviewed the
    Toronto stop, staged inside an Anglican cathedral with Atwood herself
    "reciting from on high"; the tour's own promotional material called it a
    reinvention of "what a book tour could be," and it continued
    internationally into 2010, documented in Ron Mann's film In the Wake of
    the Flood.
  note: >
    The tour's own site listed stops across Canada, the UK, the US and
    Australia; beyond the Toronto and Manchester performances press covered
    at the time, individual city dates were not independently corroborated
    here and are left general.
  spoilerAfter: null
  sources:
    - https://www.cbc.ca/news/entertainment/here-comes-the-flood-1.797204
    - https://en.wikipedia.org/wiki/The_Year_of_the_Flood
    - https://web.archive.org/web/20130830032320/http://yearoftheflood.com/ca/tour/wake-of-the-flood

- id: margaret-atwood-payback-documentary-2012
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 2012-01-20
  title: The Massey Lectures return as a Sundance documentary
  scope: culture
  reach: franchise
  impact: low
  description: >
    Jennifer Baichwal's documentary Payback, based on
    [[work:margaret-atwood/payback|Payback: Debt and the Shadow Side of
    Wealth]] and its 2008 Massey Lectures, premiered at the Sundance Film
    Festival on 20 January 2012 and reached Canadian theatres with Mongrel
    Media that March. Produced by the National Film Board of Canada, it widens
    Atwood's own five-city argument about debt into a globe-spanning
    documentary featuring economist Raj Patel, ecologist William Rees and
    former UN human-rights commissioner Louise Arbour; Baichwal told CBC Radio
    that reading the book was "like a roller coaster ride through every
    possible idea" of indebtedness.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Payback_(2012_film)
