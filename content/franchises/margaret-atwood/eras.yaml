# Creative periods.
#
# The three eras below are David Staines's, not a shape derived from the
# shelf. "Margaret Atwood in Her Canadian Context", the opening chapter of
# The Cambridge Companion to Margaret Atwood (Cambridge University Press,
# 1st ed. 2006, pp. 12-27; 2nd ed. 2021, pp. 14-31), divides the career into
# three named phases and dates the boundaries in its own prose. The titles
# here are his section headings, and the scheme survived the Companion's 2021
# revision intact, with the third phase carried forward to The Testaments.
#
# Where Staines is vague, his adjacent sentence fixes the year. He dates the
# second phase "from the early seventies until 1985" and the third "from the
# mid-eighties until the present", and writes separately that the first
# period "culminates with the 1972 publication of Survival". "Early
# seventies" therefore resolves to 1973 and "mid-eighties" to 1986, the only
# reading on which the three phases neither overlap nor leave a year
# unaccounted for. Both resolved edges are flagged on their entries.
#
# The scheme covers the whole catalogue rather than the novels alone: the
# first phase is mostly a poetry phase, and Staines follows "poetry, fiction,
# and literary criticism" together throughout. The publication record
# corroborates the 1985/1986 boundary from a direction he does not use.
# Atwood publishes thirteen poetry collections in the twenty-four years up to
# Interlunar (1984) and four in the forty years after it, so the poetry thins
# abruptly at the same line his prose draws. It does not thin at 1972, which
# is why the first boundary rests on Staines alone.
#
# Two candidate boundaries are deliberately absent:
# - A realist-then-speculative split. The dates refuse it. Surfacing (1972)
#   is already speculative-adjacent and arrives three years after The Edible
#   Woman (1969), and the poetry runs under both halves without a break.
# - The MaddAddam Trilogy (2003-2013). It is a real publisher-marketed
#   grouping, and it is recorded as a subseries in works.yaml, but nothing
#   periodises the career at either end of it. Staines places the trilogy
#   inside the third phase, alongside the 1990s historical novels, rather
#   than treating it as a phase of its own.

- id: mapping-her-canada
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: Mapping Her Canada
  period: "1961-1972"
  themes: [Canadian identity, myth and archetype, the wilderness, survival and the victim, poetry as the first form]
  provenance: critical
  description: >
    David Staines's name for the phase in which Atwood writes for Canadians
    about Canada, and which he says "culminates with the 1972 publication of
    [[work:margaret-atwood/survival|Survival]]" - the guide that made Canadian
    literature legible to general Canadian readers, sold more than 100,000
    copies, and was never published outside the country. The decade before it
    is mostly poetry, from the hand-set pamphlet
    [[work:margaret-atwood/double-persephone|Double Persephone]] (1961)
    through [[work:margaret-atwood/the-journals-of-susanna-moodie|The Journals
    of Susanna Moodie]] (1970), with a first novel,
    [[work:margaret-atwood/the-edible-woman|The Edible Woman]] (1969), and
    [[work:margaret-atwood/surfacing|Surfacing]] (1972) set against it.
  note: >
    Staines names the end of this phase (1972) but not its start; 1961 is the
    year of the first published book rather than a boundary he draws.
  sources:
    - https://www.cambridge.org/core/books/abs/cambridge-companion-to-margaret-atwood/margaret-atwood-in-her-canadian-context/A3B617E03E33A29703F8D249F43F26D1
    - https://doi.org/10.1017/9781108626651.003

- id: interpreting-canada-abroad
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: Interpreting Canada Abroad
  period: "1973-1985"
  themes: [Canada read from outside, power and its politics, women under pressure, the political and the domestic, dystopia]
  provenance: critical
  description: >
    "In the second phase of her career, which ran from the early seventies
    until 1985, Atwood began to review more widely," Staines writes: the
    Canadian-books-only reviewer of the first phase starts "reviewing
    Canadians for Americans and Americans for Canadians", and finds herself
    interpreting her country for readers outside it. The fiction travels the
    same way, from the Toronto of
    [[work:margaret-atwood/lady-oracle|Lady Oracle]] (1976) and
    [[work:margaret-atwood/life-before-man|Life Before Man]] (1979) to the
    Caribbean island of [[work:margaret-atwood/bodily-harm|Bodily Harm]]
    (1981), her first novel set outside Canada, and then to the American
    republic of Gilead in
    [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] (1985),
    which closes the phase.
  note: >
    Staines dates this phase to "the early seventies"; 1973 is the first year
    consistent with his placing of Survival (1972) at the end of the previous
    one.
  sources:
    - https://www.cambridge.org/core/books/abs/cambridge-companion-to-margaret-atwood/margaret-atwood-in-her-canadian-context/A3B617E03E33A29703F8D249F43F26D1
    - https://doi.org/10.1017/9781108626651.003

- id: canada-in-the-world
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: Canada in the World
  period: "1986-present"
  themes: [Toronto and the Canadian past, historical reconstruction, ecological catastrophe, the writer as public voice, late work]
  provenance: critical
  description: >
    "In the third phase of her career, which goes from the mid-eighties until
    the present, Atwood again focuses on contemporary Toronto in her fiction,"
    Staines writes, and then on the Canadian past: [[work:margaret-atwood/cats-eye|Cat's
    Eye]] (1988), [[work:margaret-atwood/the-robber-bride|The Robber Bride]]
    (1993), [[work:margaret-atwood/alias-grace|Alias Grace]] (1996) and
    [[work:margaret-atwood/the-blind-assassin|The Blind Assassin]] (2000). It
    is also the phase in which she speaks about Canada from outside it, in the
    Oxford lectures that became
    [[work:margaret-atwood/strange-things|Strange Things]] (1995) and the
    Cambridge ones that became
    [[work:margaret-atwood/negotiating-with-the-dead|Negotiating with the
    Dead]] (2002). The Companion's second edition carries the phase forward
    through [[work:margaret-atwood/oryx-and-crake|Oryx and Crake]] (2003) and
    the rest of the MaddAddam Trilogy,
    [[work:margaret-atwood/stone-mattress|Stone Mattress]] (2014),
    [[work:margaret-atwood/hag-seed|Hag-Seed]] (2016) and
    [[work:margaret-atwood/the-testaments|The Testaments]] (2019).
  note: >
    Staines dates the start to "the mid-eighties"; 1986 is the first year
    consistent with his second phase running "until 1985". The phase is left
    open because both editions of the Companion do: the first runs it "until
    the present" (2006), the second to The Testaments (2019), and neither
    closes it.
  sources:
    - https://www.cambridge.org/core/books/abs/cambridge-companion-to-margaret-atwood/margaret-atwood-in-her-canadian-context/A3B617E03E33A29703F8D249F43F26D1
    - https://doi.org/10.1017/9781108626651.003
