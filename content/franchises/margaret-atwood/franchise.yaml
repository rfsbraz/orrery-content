# Identity + features. Per this catalogue's standing rule, the wing spans
# Atwood's complete published body of work: seventeen novels and novellas
# (including the Handmaid's Tale/Testaments pair and the MaddAddam Trilogy,
# both subseries inside this wing, never its boundary), plus the poetry,
# short fiction, essays, children's books and two graphic novels that make
# up the larger part of her actual output - see works.yaml's header for the
# full tiering rationale and what was checked and excluded.
#
# features is left unset (auto): editions.yaml, eras.yaml, orders.yaml,
# events.yaml and startHere are all absent (empty is a supported state).
# globalEvents is likewise unset - a 1939-present lifespan crosses most of
# this catalogue's shared events, and which of them actually reach the books,
# rather than merely overlapping her lifetime, is a sourced editorial
# question with its own answer for each event, not yet answered here.
id: margaret-atwood
name: Margaret Atwood
kind: author
description: >
  A Canadian novelist and poet whose speculative dystopias -
  [[work:margaret-atwood/the-handmaids-tale|The Handmaid's Tale]] (1985) and
  its 2019 sequel [[work:margaret-atwood/the-testaments|The Testaments]], the
  MaddAddam trilogy - sit on the same shelf as realist novels of
  contemporary Canadian life and a body of poetry, short fiction and essays
  that has run alongside the novels since 1961, not behind them.
authorIds: [margaret-atwood]
themePreset: specimen-ledger
sources:
  - https://en.wikipedia.org/wiki/Margaret_Atwood
  - https://margaretatwood.ca/full-bibliography-2/
