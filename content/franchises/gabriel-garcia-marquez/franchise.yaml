# A wing spans an author's complete published work, not the one genre or
# one book he is famous for. Here
# that matters more than usual: outside Cien años de soledad, García
# Márquez's shelf is mostly short (his novels run well under 400 pages) but
# genuinely wide - novels, novellas, four story collections, nonfiction
# reportage, a memoir, a speech collection, a play, a screenplay and a
# five-volume journalism anthology - see works.yaml's own header for the
# full tiering rationale and the considered-and-left-out list (41
# individually documented prologues to other people's books, and a cluster
# of overlapping late-life press-article compilations neither Wikipedia
# nor the sources checked so far confidently untangle from one another).
id: gabriel-garcia-marquez
name: Gabriel García Márquez
kind: author
description: >
  The Colombian Nobel laureate (1982) of Macondo and the Caribbean coast:
  eleven novels running from his 1955 debut
  [[work:gabriel-garcia-marquez/la-hojarasca|La hojarasca]] through
  [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cien años de
  soledad]] (1967) to a manuscript found unfinished at his 2014 death and
  published a decade later, alongside four short-story collections,
  journalism and reportage, a memoir, a collection of his own speeches, one
  play and one screenplay - read worldwide almost entirely in translation.
authorIds: [gabriel-garcia-marquez]
themePreset: macondo-noon
