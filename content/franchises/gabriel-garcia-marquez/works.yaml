  title: "El cataclismo de Damocles"
  authorIds: [gabriel-garcia-marquez]
  published: 1986
  subseries: null
  canonTier: apocrypha
  format: essay
  synopsis: >
    A single anti-nuclear-weapons speech, delivered on the anniversary of
    the Hiroshima bombing and later published as its own short text.
  note: >
    Delivered in Ixtapa, Mexico, on 6 August 1986, the 41st anniversary of
    the atomic bombing of Hiroshima. A single occasional speech rather
    than a trade book, tiered apocrypha on that basis; also collected
    inside Yo no vengo a decir un discurso (2010). English translation
    title: The Cataclysm of Damocles.
