# Bibliography (works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent (user data references them). Dates
# are year-precision (docs/SCHEMA.md); the default reading order (all
# works, publication order) is DERIVED from this file, never written by
# hand.
#
# SCOPE. Every novel from La hojarasca (1955) through the posthumous En
# agosto nos vemos (2024); all four of his own short-story collections; the
# nonfiction and journalism books with a clear, singular publication event
# (a shipwreck memoir, a Chilean-exile reportage, a kidnapping account, his
# one memoir volume, a speeches collection, and a five-volume journalism
# anthology treated as one entry); his one play; his one solely-credited
# screenplay (a second, co-written screenplay credit for a produced film is
# named and left out below).
# Sourced from Wikipedia's dedicated English bibliography article and the
# Spanish-language "Anexo:Bibliografía" annex (the more complete of the
# two, and the one used to cross-check every English-side date), plus each
# major novel's own dedicated Wikipedia article. The gaps this draft
# leaves open are named explicitly below, for verification against primary
# and publisher sources.
#
# CANON TIER is a publication-kind judgment, not a fame or quality one
# (SCHEMA.md, CURATION.md#7) - the same discipline this catalogue already
# applies to Saramago and Grisham. CORE is the eleven novels: the
# narrative-fiction spine every source checked (both Wikipedia
# bibliography pages' own "Novels and novellas" table, the Nobel
# citation's own "novels and short stories") builds from - including the
# 1955 debut usually described in English as a novella and the 2024
# posthumous release (see its own note on why it is tiered here, not
# resolved). EXTENDED is genuinely his, off the novel-reading spine: the
# four short-story collections, the nonfiction/reportage/memoir/speeches
# books, the journalism anthology, and the one play - all had a normal
# trade-book life. APOCRYPHA is for what never had one: a single
# occasional-speech pamphlet and one uncredited-as-a-book screenplay
# credit for a political documentary short.
#
# TRANSLATORS. No single translator covers this bibliography, so no work
# below assumes one and the translationNote field is used exactly once,
# where the record actually supports it (see cien-anos-de-soledad). Per
# each work's own English Wikipedia infobox: J. S. Bernstein translated
# El coronel no tiene quien le escriba; Gregory Rabassa translated La mala
# hora, Cien años de soledad, El otoño del patriarca and Crónica de una
# muerte anunciada (and, per his own English Wikipedia entry, also La
# hojarasca); Edith Grossman translated El amor en los tiempos del cólera
# onward through Memoria de mis putas tristes; Anne McLean translated the
# 2024 posthumous En agosto nos vemos. This is per-edition information and
# belongs in editions.yaml's own translator field once that stage runs;
# it is recorded here only as the reason no blanket single-translator
# assumption is made anywhere in this file.
#
# THE "TRES DE MIS LIBROS SON UN SOLO LIBRO" GROUPING. García Márquez said,
# of El coronel no tiene quien le escriba, Los funerales de la Mamá Grande
# and La mala hora: "Tres de mis libros ... son en verdad un solo libro. Un
# mismo tema, unos mismos personajes, un mismo ambiente, que se repiten y
# se mezclan" ("Three of my books ... are really just one book. A single
# subject matter, the same characters, the same setting, that are repeated
# and combined") - a genuine author's-own-words grouping (both English and
# Spanish Wikipedia bibliography pages quote it, sourced there to Centro
# Gabo). It is recorded as a `note:` on each of the three works rather than
# forced into `subseries`: the claim is about shared theme/characters/
# setting across two novels and a short-story collection, not a numbered or
# titled sequence, and no source checked here names what, if anything, a
# publisher or critic actually calls the grouping - a real label, if one
# exists, is not yet in this file. Separately, Macondo itself is a still
# broader thread - La hojarasca is its first appearance and Cien años de
# soledad "signals the end of the Macondo period" per both Wikipedia
# bibliography pages - but that is a periodisation claim about his whole
# early career, not a work-grouping, and belongs in eras.yaml rather than
# guessed at here (which is why eras.yaml names both shapes without
# claiming either).
#
# CONSIDERED AND LEFT OUT:
# - 41 documented prologues/introductions García Márquez wrote for other
#   people's books (catalogued individually in the Spanish Wikipedia
#   bibliography annex, 1949-2008) are not catalogued here. Each is a
#   paratext to a book by someone else, not a book of his own - the same
#   principle this catalogue already applies to a recorded appearance or a
#   brief contribution with no title-page work of the author's own
#   (john-grisham/works.yaml's Wavedancer Benefit note is the precedent).
#   One of these prologues, per the annex's own listing, is to "Taller de
#   guion de Gabriel García Márquez, Cómo se cuenta un cuento" (1995) -
#   direct confirmation that the book itself is credited to that workshop,
#   not to him, and that his own contribution to it was the prologue.
# - A cluster of late-life press-article compilations. Two groupings within
#   it are confirmed rather than merely suspected:
#   - El amante inconcluso y otros textos de prensa (2001), La nostalgia de
#     las almendras amargas (2014) and Gabo contesta (2015) overlap by the
#     Spanish Wikipedia annex's own account (La nostalgia is stated there as
#     an "ampliación" of El amante inconcluso; Gabo contesta reuses texts
#     "ya incluidos" in both of the others).
#   - Chile, el golpe y los gringos (1974) is not a book of García Márquez's
#     own: WorldCat's record for it (OCLC 2063154, "Cuadernos Alternativa"
#     no. 1, 93 p.) lists its contents as his own essay of that title
#     alongside two separate pieces by Michael Klare and Nancy Stein - a
#     multi-author political pamphlet in which he is one of three
#     contributors, on the same footing as this catalogue's existing
#     multi-author-anthology exclusions.
#   The remaining four - Cuando era feliz e indocumentado (1973), Crónicas y
#   reportajes (1976), De viaje por los países socialistas: 90 días en la
#   Cortina de Hierro (1978) and Primeros reportajes (1990) - are each a
#   real, independently published, solely-authored collection of García
#   Márquez's own previously published newspaper writing (confirmed via
#   distinct library catalogue records and edition histories for each, not
#   shown to duplicate one another). They are left out because their
#   content, like the rest of this cluster, falls inside the four decades of
#   newspaper writing (1948-1995) that
#   [[work:gabriel-garcia-marquez/obra-periodistica|Obra periodística]]
#   already gathers as the one systematic, scholarly edition of his
#   journalism catalogued here. This rests on the two bodies of work
#   covering the same career span, not on a page-by-page collation against
#   Obra periodística's own contents confirming no new text among them.
#   Two further third-party-assembled anthologies of his journalism, not
#   part of either the periodismo list above or the Obra periodística
#   volumes, appear in the Spanish Wikipedia annex under "Cuentos de
#   televisión": García Márquez habla de García Márquez en 33 grandes
#   reportajes (1979, "recopilación y prólogo de Alfonso Rentería
#   Mantilla") and Para que no se las lleve el viento (2011, "recopilación
#   y prólogo de Fernando Jaramillo"). Both are compiled and introduced by
#   someone else rather than assembled by García Márquez, the same basis on
#   which Gabo periodista is excluded below; neither turns up in any library
#   catalogue checked here, which limits how far that exclusion could be
#   verified.
# - Gabo periodista (2013) is a tribute anthology about García Márquez's
#   journalism - other people's testimony plus a selection of his texts,
#   assembled by others as a homage volume - not a book of his own, on the
#   same reasoning as the prologues above.
# - Two of the three film-workshop transcripts are confirmed, not merely
#   suspected, to not be solely his own book: WorldCat's edition records for
#   both Cómo se cuenta un cuento (1995) and La bendita manía de contar
#   (1998), across their many editions and publishers from 1990 to 2006,
#   credit the author as "Taller de guión de Gabriel García Márquez" (his
#   screenwriting workshop), not as García Márquez himself. The third, Me
#   alquilo para soñar (1995 - a distinct book from the identically-titled
#   1980 short story), shares the same workshop and year but turns up in no
#   library catalogue checked here, so its authorship credit rests on that
#   pattern rather than on an independent record of its own.
# - La Soledad de América Latina (1982), his Nobel acceptance lecture, is
#   not catalogued as a work: it is collected inside
#   [[work:gabriel-garcia-marquez/yo-no-vengo-a-decir-un-discurso|Yo no
#   vengo a decir un discurso]] rather than separately published on its
#   own, and reads more naturally as a life event (an epigraph-organisation
#   entry, the Saramago Nobel-lecture precedent) than as a bibliography
#   entry, so it is not catalogued as a work here. Confirming this: its one
#   standalone print appearance found (Cali, Colombia: Corporación
#   Editorial Universitaria de Colombia, 1983, paired with his separate,
#   shorter Nobel-banquet toast "Brindis por la poesía") is itself a
#   multi-author commemorative volume - it also carries the Swedish
#   Academy's own presentation speech and essays by Fernando Cruz Kronfly
#   and Nils K. Ståhle - not a solo publication of his own.
# - El año de la peste (1978), a Mexican film directed by Felipe Cazals
#   adapting Daniel Defoe's A Journal of the Plague Year, credits García
#   Márquez as one of three screenplay writers alongside José Agustín and
#   Juan Arturo Brennan. It appears in neither Wikipedia bibliography page
#   used as this file's primary sources, only in the "Works by Gabriel
#   García Márquez" navigation template's own dedicated film article, and
#   is left uncatalogued here as a multi-author screen credit adapting
#   another author's novel rather than a book of his own.

# --- Novels (11) ---

- id: gabriel-garcia-marquez/la-hojarasca
  title: "La hojarasca"
  authorIds: [gabriel-garcia-marquez]
  published: 1955
  subseries: null
  canonTier: core
  synopsis: >
    A grandfather, his daughter and her young son sit with the corpse of a
    disgraced French doctor in the fictional town of Macondo, waiting out
    the hour before the burial the whole town has turned against them for
    allowing, while each of the three privately relives what brought the
    doctor there.
  note: >
    García Márquez's first published novel, and Macondo's first
    appearance in his fiction. El Heraldo printed one chapter in 1952; the
    book itself followed in 1955, per its own dedicated English Wikipedia
    article (infobox and prose) and both language Wikipedias' bibliography
    tables' own prose. Both of those same bibliography tables list "1954"
    in their Year column, contradicting their own prose on the same page;
    1955 is used here as the more specific, corroborated date. English
    translation title: Leaf Storm.
  images:
    cover: "https://covers.openlibrary.org/b/id/10096897-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL274513W"
    # Editorial Sudamericana edition. This cover is attached to the OL WORK
    # record itself rather than to any one edition in editions.json, so the
    # work page is cited in place of an edition/ISBN link.
  sources:
    - https://en.wikipedia.org/wiki/Leaf_Storm
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography

- id: gabriel-garcia-marquez/el-coronel-no-tiene-quien-le-escriba
  title: "El coronel no tiene quien le escriba"
  authorIds: [gabriel-garcia-marquez]
  published: 1961
  subseries: null
  canonTier: core
  synopsis: >
    An aging, impoverished colonel and his asthmatic wife wait out year
    after year for the government pension he was promised for his service
    in a civil war decades earlier, walking to the harbor every Friday to
    meet a mail boat that never brings the letter.
  note: >
    Written 1956-1957, serialized in the magazine Mito in 1958, published
    as a book in 1961 (Aguirre Editor, Medellín). One of three books
    García Márquez himself grouped as "really just one book" - see this
    file's own header. English translation title: No One Writes to the
    Colonel.
  images:
    cover: "https://covers.openlibrary.org/b/id/10096705-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL22291514M"
    # Espasa Calpe "Colección Austral" edition (1990).
  sources:
    - https://en.wikipedia.org/wiki/No_One_Writes_to_the_Colonel
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography

- id: gabriel-garcia-marquez/la-mala-hora
  title: "La mala hora"
  authorIds: [gabriel-garcia-marquez]
  published: 1962
  subseries: null
  canonTier: core
  synopsis: >
    Anonymous lampoons appear overnight on doors across an unnamed river
    town, airing every resident's secrets and rumors, and the mayor's
    escalating response to find out who is behind them tips the town
    toward violence.
  note: >
    First published in 1962 (Taller de Artes Gráficas Luis Pérez), an
    edition whose proofreader altered García Márquez's language and which
    he later disavowed; a 1966 Ediciones Era edition restored his original
    text and is the one he recognized as authoritative. `published` is set
    to 1962, the actual first-publication event, per both Wikipedia
    bibliography tables' own Year column; the authorship dispute over
    which edition's text is canonical is recorded here rather than shifting
    the date. One of three books García Márquez himself grouped as "really
    just one book" - see this file's own header. English translation
    title: In Evil Hour.
  images:
    cover: "https://covers.openlibrary.org/b/id/168230-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL9744816M"
    # The jacket itself reads DEBOLSILLO, Colección Contemporánea (ISBN
    # 9780307350497, a Random House prefix) - not the Plaza y Janés edition
    # OpenLibrary's own record (OL9744816M) names; the image is real and
    # correctly licensed, the OL record is just mislabelled. The OL work's
    # own representative cover (10096558, a 1968 EDHASA printing) is a plain
    # library binding with a call-number sticker and no visible jacket art -
    # rejected for this edition instead.
  sources:
    - https://en.wikipedia.org/wiki/In_Evil_Hour
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography

- id: gabriel-garcia-marquez/cien-anos-de-soledad
  title: "Cien años de soledad"
  authorIds: [gabriel-garcia-marquez]
  published: 1967
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    Seven generations of the Buendía family found, build and eventually
    lose the town of Macondo, in a history that repeats its own names,
    obsessions and solitudes across a hundred years.
  note: >
    Written over roughly eighteen months in Mexico City; García Márquez
    sold the family car and his wife took food on credit from their
    butcher and baker while he worked. Published 1967 by Editorial
    Sudamericana with a first print run of 8,000 copies; the novel most
    responsible for both his international fame and the Latin American
    Boom/magic-realism association. English translation title: One
    Hundred Years of Solitude.
    The synopsis stays inside what the novel's own publishers put on the
    book: Harper Perennial's jacket gives "the rise and fall, birth and
    death of the mythical town of Macondo through the history of the
    Buendía family", Penguin's the "seven generations of the Buendía
    family and of Macondo, the town they built". Neither describes the
    closing pages, and neither does this entry.
  translationNote: >
    Gregory Rabassa's 1970 English translation carries an unusually
    strong, if secondhand, endorsement: García Márquez is reported, by
    Rabassa's own English Wikipedia entry and independently by Paul Elie's
    history of the novel (as quoted in The Paris Review's 2016 obituary of
    Rabassa), to have read the Harper & Row English edition and called it
    better than his own Spanish original, and to have called Rabassa "the
    best Latin American writer in the English language." No primary
    recording or transcript of the remark turns up in either source, only
    these two secondary accounts, so it is recorded as a widely reported
    anecdote rather than a confirmed direct quotation.
  images:
    cover: "https://covers.openlibrary.org/b/id/10114038-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL28176709M"
    # Harper & Row's 1970 first English-language edition (Gregory Rabassa's
    # translation) - the jacket most associated with the novel outside
    # Spanish-language markets. The OL work's own representative cover
    # (12627383) is a German Fischer Taschenbuch edition, correctly
    # licensed but not this reader's likeliest point of recognition.
  sources:
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography
    - https://en.wikipedia.org/wiki/Gregory_Rabassa
    - https://www.theparisreview.org/blog/2016/06/14/gregory-rabassa-1922-2016/
    - https://www.harpercollins.com/products/one-hundred-years-of-solitude-gabriel-garcia-marquez

- id: gabriel-garcia-marquez/el-otono-del-patriarca
  title: "El otoño del patriarca"
  authorIds: [gabriel-garcia-marquez]
  published: 1975
  subseries: null
  canonTier: core
  synopsis: >
    An unnamed, ancient Caribbean dictator's decades in absolute power are
    told and retold from shifting, overlapping points of view after his
    death is discovered in his own crumbling palace, building a single
    portrait of tyranny out of contradictory rumor and memory.
  note: >
    García Márquez's first "dictator novel," which he called "a poem on
    the solitude of power." Published simultaneously by Plaza & Janés and
    Editorial Sudamericana. English translation title: The Autumn of the
    Patriarch.
  images:
    cover: "https://covers.openlibrary.org/b/id/7985786-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL26312247M"
    # Editorial Sudamericana edition (2015). The OL work's own
    # representative cover (10097268, a 1996 Sudamericana printing of the
    # same art) carries a "SPANISH FICTION" library spine sticker over one
    # corner; this later printing of the same illustration is clean.
  sources:
    - https://en.wikipedia.org/wiki/The_Autumn_of_the_Patriarch
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography

- id: gabriel-garcia-marquez/cronica-de-una-muerte-anunciada
  title: "Crónica de una muerte anunciada"
  authorIds: [gabriel-garcia-marquez]
  published: 1981
  subseries: null
  canonTier: core
  synopsis: >
    A reporter reconstructs, witness by witness, the morning an entire
    small town knew two brothers were going to kill a man for supposedly
    dishonoring their sister, and still failed to stop it.
  note: >
    Built as a "purely realist" narrative technique modeled on a real-life
    chronicle, in a departure from the more overtly magical-realist
    register of his two preceding novels; rumor at the time linked García
    Márquez personally to the real case it draws on. English translation
    title: Chronicle of a Death Foretold.
  images:
    cover: "https://covers.openlibrary.org/b/id/8489859-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL24945433M"
    # Bruguera "Narradores de Hoy" edition (1981).
  sources:
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography

- id: gabriel-garcia-marquez/el-amor-en-los-tiempos-del-colera
  title: "El amor en los tiempos del cólera"
  authorIds: [gabriel-garcia-marquez]
  published: 1985
  subseries: null
  canonTier: core
  synopsis: >
    A man waits more than fifty years, through her marriage to another
    man and hundreds of love affairs of his own, to renew the courtship a
    woman broke off with him in their youth, against the backdrop of a
    Caribbean port city living under the recurring threat of cholera.
  note: >
    Drawn substantially from the courtship of García Márquez's own
    parents. He called it his own favorite among his books: "Ese es el
    mejor ... ese es el libro que escribí desde mis entrañas" ("That one
    is the best ... that one is the book I wrote from the bottom of my
    heart"). English translation title: Love in the Time of Cholera.
  images:
    cover: "https://covers.openlibrary.org/b/id/10096404-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL9134511M"
    # Círculo de Lectores edition (1985).
  sources:
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography
    - https://en.wikipedia.org/wiki/Love_in_the_Time_of_Cholera

- id: gabriel-garcia-marquez/el-general-en-su-laberinto
  title: "El general en su laberinto"
  authorIds: [gabriel-garcia-marquez]
  published: 1989
  subseries: null
  canonTier: core
  synopsis: >
    Simón Bolívar's final, physically ruined seven-month river voyage down
    the Magdalena toward the coast, stripped of the power and the union of
    nations he had spent his life building, closes out his last months
    before his death.
  note: >
    García Márquez's second "dictator novel" in theme, this time built
    around a real, documented historical figure and, per its own English
    Wikipedia bibliography note, following "documented history with
    considerable accuracy." English translation title: The General in His
    Labyrinth.
  images:
    cover: "https://covers.openlibrary.org/b/id/10097362-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL9130999M"
    # Mondadori "Narrativa" edition (1989).
  sources:
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez_bibliography

