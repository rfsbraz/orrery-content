- id: gabriel-garcia-marquez/obra-periodistica
  title: "Obra periodística"
  authorIds: [gabriel-garcia-marquez]
  published: 1981
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    A five-volume anthology gathering García Márquez's own newspaper
    writing across four decades of working journalism, from his earliest
    Caribbean-coast columns through his later reporting for Colombian and
    international outlets.
  note: >
    ONE ENTRY for a five-volume, 1981-1999 anthology, compiled by scholar
    Jacques Gilard from García Márquez's own previously published
    newspaper writing - no catalogue entry exists for Gilard, whose role
    here is editorial compilation rather than authorship of the content
    itself. published is set to 1981, the first volume's year. The five
    volumes, per the Spanish Wikipedia bibliography annex, each cross-
    checked against the volume's own printed subtitle in library catalogue
    editions: Textos costeños (1981, covering 1948-1952); Entre cachacos
    (1982, covering 1954-1955); De Europa y América (1983, covering
    1955-1960); Por la libre (1999, covering 1974-1995, listed as volume
    4); Notas de prensa (1991, listed as volume 5). The Spanish Wikipedia
    annex states Notas de prensa covers 1980-1984, but the volume's own
    printed subtitle, on multiple independent library editions (Grijalbo
    Mondadori 1991, Mondadori 1999, Diana 2010), reads "Notas de prensa.
    Obra periodística 5 (1961-1984)" - 1961-1984 is used here as the
    book's own stated range. The Spanish Wikipedia annex's own intro
    states García Márquez "authored five major journalistic works"
    without naming them; these five volumes are the closest documented
    match, though that identification is not independently confirmed
    against a second source.
  images:
    cover: "https://covers.openlibrary.org/b/id/5266685-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/books/OL13263869M"
    # Grijalbo Mondadori edition of "Textos costeños. Obra periodística 1
    # (1948-1952)" (1981) - volume 1, matching this entry's own
    # `published` date. Open Library holds this scan only at 128x224px,
    # well under this catalogue's usual cover resolution; the only other
    # two cover ids on this same work record are a plain cloth binding
    # with no visible title (9645552) and a copy stamped with a library's
    # ownership ink across the jacket (11689834), both rejected as worse.
  sources:
    - https://es.wikipedia.org/wiki/Anexo:Bibliograf%C3%ADa_de_Gabriel_Garc%C3%ADa_M%C3%A1rquez
    - https://openlibrary.org/works/OL468804W/editions.json

# --- Play (1) ---

- id: gabriel-garcia-marquez/diatriba-de-amor-contra-un-hombre-sentado
  title: "Diatriba de amor contra un hombre sentado"
  authorIds: [gabriel-garcia-marquez]
  published: 1994
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A single long monologue: a woman confronts her husband of decades,
    seated silently on stage through the whole performance, with
    everything unresolved in their marriage.
  note: >
    García Márquez's first and only play. Finished in 1987, premiered in
    1988 to mixed reviews (both the New York Times and the Los Angeles
    Times covered the split critical reception at the time), published as
    a book in 1994. English translation title: Diatribe of Love Against a
    Seated Man.
