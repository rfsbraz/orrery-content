- id: gabriel-garcia-marquez/viva-sandino
  title: "Viva Sandino"
  authorIds: [gabriel-garcia-marquez]
  published: 1982
  subseries: null
  canonTier: apocrypha
  format: screenplay
  synopsis: >
    A "relato cinematográfico" (cinematic narrative/screenplay) on the
    Sandinista revolution in Nicaragua.
  note: >
    Listed under "Guiones" (screenplays) in the Spanish Wikipedia
    bibliography annex; no evidence turns up of it ever being published
