# Concrete published editions: English translations and Portuguese (pt-PT)
# translations. No original-language Spanish edition is recorded: unlike
# Cervantes's La Galatea or El cerco de Numancia (this catalogue's only other
# precedent for a Spanish-original entry), every work below already has a
# real English and/or Portuguese translation in print, so there is no gap a
# Spanish original would be filling.
#
# TRANSLATORS. works.yaml's own header names four: J. S. Bernstein (El
# coronel no tiene quien le escriba), Gregory Rabassa (La hojarasca, La mala
# hora, Cien años de soledad, El otoño del patriarca, Crónica de una muerte
# anunciada), Edith Grossman (El amor en los tiempos del cólera onward through
# Memoria de mis putas tristes, plus Noticia de un secuestro, Vivir para
# contarla and Strange Pilgrims) and Anne McLean (En agosto nos vemos). The
# English Innocent Eréndira and Other Stories is also Rabassa's, confirmed
# here on the edition's own Open Library record rather than in works.yaml,
# which does not name this title. Recorded per edition below exactly where a
# source states it; left blank rather than assumed where the source is silent
# (the pt-PT nonfiction run, I Am Not Here to Give a Speech).
#
# SOURCING. Every English ISBN below is cross-checked against Open Library's
# own `/isbn/<isbn>.json` record (publisher, year, page count, and - where
# present - the `contributions` translator field); the flagship one hundred
# years of solitude edition is additionally confirmed live on
# harpercollins.com's own current product page. Every pt-PT ISBN is read
# directly off Bertrand's own product page, whose JSON-LD `Book` block or
# (where that block is absent) its own rendered "Detalhes do Produto" panel
# states ISBN, publisher, edition date and language - the same source
# already established as authoritative for pt-PT in this catalogue's other
# wings (Saramago, Cervantes). Every ISBN's check digit is independently
# recomputed by hand from the first twelve digits, not read off the source;
# every pt-PT prefix is a Portugal one (14 of 17 are 978-972, 3 are the newer
# 978-989 range), never 978-85/978-65 (Brazil).
#
# COVERAGE: 21 of 25 works carry at least one edition (36 editions total: 19
# English, 17 pt-PT). All eleven core novels have an English edition; ten of
# the eleven also have a pt-PT one. The honest gaps:
#   - En agosto nos vemos (2024) has no pt-PT edition. Bertrand currently
#     stocks only Spanish-language imports of it (Debolsillo/Random House,
#     978-84 prefix - Spain, confirmed on three separate live product pages),
#     no Portuguese translation. Two years after original publication this
#     reads as a real market gap, not a lookup failure - worth a second check
#     nearer the time a Portuguese edition might appear.
#   - El olor de la guayaba, Vivir para contarla and the play Diatriba de amor
#     contra un hombre sentado turned up no pt-PT edition on repeated Bertrand
#     searches (multiple phrasings each). Vivir para contarla has real
#     Brazilian editions (Editora Record, 978-85 prefix) - not recorded here,
#     since a pt-BR edition is a different book from a pt-PT one and would
#     send a Lisbon reader to a title they cannot buy locally.
#   - Obra periodística (the five-volume journalism anthology) and both
#     apocrypha entries carry no edition in either language: the former is a
#     scholarly Spanish-language critical edition with no translation
#     history found; the latter never had a normal trade-book life per their
#     own works.yaml notes.
#
# THREE OMISSIONS ARE DELIBERATE, NOT OVERSIGHTS - all are cases where a real,
# findable edition exists but is not the right object for the workId it would
# have to sit under:
#   - Harper & Row's long-running "No One Writes to the Colonel and Other
#     Stories" (e.g. ISBN 9780060907006, Harper Perennial 1979) binds the
#     novel and the entire Los funerales de la Mamá Grande story collection
#     into one English volume (confirmed via its own Open Library
#     table_of_contents) - a two-books-in-one English packaging with no
#     equivalent in the original Spanish publication history. Recording it
#     under either workId would put the other work's content behind a title
#     that does not name it. Not used: el-coronel-no-tiene-quien-le-escriba's
#     English edition below is instead Penguin's clean 2014 80-page
#     standalone printing (the novella alone), and los-funerales-de-la-mama-
#     grande simply has no English edition recorded - a real, sourced gap
#     rather than an invented workaround.
#   - Dom Quixote's own 2011 omnibus "Contos Completos (1947-1992)" (ISBN
#     9789722048491, translated by Luís Nazaré) gathers all four of García
#     Márquez's story collections under one binding. Not recorded under any
#     of the four workIds, on this catalogue's standing rule against an
#     omnibus ISBN standing in for one work (the Atwood, Jim Butcher and John
#     Shirley files state the same rule for their own omnibus finds).
#   - Dom Quixote also sells two 28-page illustrated single-story booklets -
#     "Um Senhor Muito Velho Com Umas Asas Enormes" (ISBN 9789722018906,
#     2000) and "A Luz é Como a Água" (ISBN 9789722018111, 2000), each one
#     story lifted out of Eréndira and Doce cuentos peregrinos respectively
#     and repackaged as a children's picture book. Neither is recorded under
#     its parent collection's workId: a reader shopping for either full
#     collection would get one-sixth to one-twelfth of it in an illustrated
#     children's format, which is a different object from the collection
#     this catalogue means by that workId, not an abridgement of it.
#
# A FOURTH BERTRAND FIND HAS NO WORKID TO ATTACH TO. "Duas Solidões" (ISBN
# 9789722073301, Dom Quixote, 2021) is credited on its own product page to
# "Gabriel García Márquez e Mario Vargas Llosa" - a real, apparently
# co-authored dialogue/essay volume between the two Nobel laureates that
# works.yaml does not catalogue at all. Every edition here must resolve to an
# existing workId, and none exists for this book, so it is not recorded - a
# real bibliography gap in works.yaml, not an omission in this file.
#
# "MOST RECENT IN PRINT" SUPERSEDED THREE OLDER PORTUGUESE PRINTINGS, not
# separately recorded per this catalogue's default rule: La mala hora's plain
# "A Hora Má" (Dom Quixote, 2008, 9789722031561) under the current "A Hora
# Má: O Veneno da Madrugada" repackaging; Crónica de uma Morte Anunciada's
# 1998 Dom Quixote trade printing (9789722012782) under BIS's current 2022
# pocket edition; and El general en su laberinto's 1990 Dom Quixote first
# printing (9789722007818) under its own 2018 reissue.

