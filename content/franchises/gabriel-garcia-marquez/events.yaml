# Franchise-specific events: what happened to the BOOKS, not the life
# (author-life events belong on content/authors/gabriel-garcia-marquez.yaml
# instead). Six entries, in publication order: Vargas Llosa's 1971 doctoral
# thesis, the first serious study of the work and the two writers' friendliest
# public exchange before the 1976 punch; the real courtship behind El amor en
# los tiempos del cólera (1985); the 1989 outrage over El general en su
# laberinto's de-mythologized Bolívar; a 2007 reconciliation-of-sorts that put
# Vargas Llosa's hostile study on the cover of Cien años de soledad's own
# anniversary edition; the 2019 sale of Cien años de soledad's screen rights,
# which García Márquez had refused for life, and the 2024 series it became;
# and the 2024 posthumous publication of En agosto nos vemos against the
# author's explicit wishes. The Rabassa translation anecdote stays on
# cien-anos-de-soledad's own translationNote in works.yaml rather than
# duplicated here. Append-only; parallel branches merge here.
- id: garcia-marquez-vargas-llosa-thesis-1971
  organisation: floating-object
  illustration_type: book-object
  images_required: 1
  date: 1971
  title: A friend's doctoral thesis becomes the first serious study of his work
  scope: culture
  reach: franchise
  impact: low
  description: >
    Mario Vargas Llosa, still a close friend at the time, earns his doctorate
    from the Complutense University of Madrid with García Márquez: historia
    de un deicidio, a book-length critical study of García Márquez's fiction
    up through
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cien años de
    soledad]] - the first serious academic treatment of his work. Published
    the same year, it stands as the two writers' friendliest public
    exchange; five years later Vargas Llosa punched García Márquez in the
    face and the two did not speak again for decades.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Mario_Vargas_Llosa

- id: garcia-marquez-colera-parents-courtship-1985
  organisation: diptych
  illustration_type: symbolic-still-life
  images_required: 2
  date: 1985
  title: A real courtship becomes a fifty-year love story
  scope: author-life
  reach: franchise
  impact: med
  description: >
    [[work:gabriel-garcia-marquez/el-amor-en-los-tiempos-del-colera|El amor
    en los tiempos del cólera]] draws its young lovers, Fermina Daza and
    Florentino Ariza, directly from the real courtship of García Márquez's
    own parents: his father, Gabriel Eligio García, won his mother, Luisa
    Santiaga Márquez, over her family's objections with violin serenades,
    love poems and letters after her father sent her away to separate them.
    García Márquez pointed out the one deliberate difference in an
    interview: "The only difference is [my parents] married. And as soon as
    they were married, they were no longer interesting as literary figures."
    The old-age half of the novel's love story is drawn from an unrelated
    source: a newspaper account of two elderly Americans, each married to
    someone else, murdered by a boatman in Acapulco after their decades-long
    secret romance came to light only through their deaths.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez

- id: garcia-marquez-general-laberinto-bolivar-outrage-1989
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 1989
  title: A de-mythologized Bolívar outrages parts of Latin America
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:gabriel-garcia-marquez/el-general-en-su-laberinto|El general en su
    laberinto]] breaks with the traditional heroic image of Simón Bolívar,
    "El Libertador," portraying instead a prematurely aged, physically ill
    and mentally exhausted man in his final months, including intimate
    details historians conventionally left out. The novel initially outraged
    prominent figures across Latin America, who argued it gave the outside
    world a diminished image of one of the region's founding figures; others
    read it as a needed corrective, a challenge to a continent more
    comfortable with myth than with the man.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_General_in_His_Labyrinth

- id: garcia-marquez-vargas-llosa-thesis-reissued-2007
  organisation: diptych
  illustration_type: book-object
  images_required: 2
  date: 2007
  title: A hostile study becomes a friendly introduction
  scope: culture
  reach: franchise
  impact: med
  description: >
    Mario Vargas Llosa's 1971 doctoral thesis on García Márquez, García
    Márquez: historia de un deicidio, predates the 1976 punch that ended
    their friendship by five years and had gone unmentioned by its own
    author for three decades afterward. In 2007, for the 40th anniversary of
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cien años de
    soledad]], Vargas Llosa agreed to let part of that same study run as the
    introduction to the commemorative edition released across Spain and
    Latin America; Historia de un deicidio was reissued separately the same
    year as part of his own collected works. Neither man spoke publicly
    about a reconciliation.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Mario_Vargas_Llosa

- id: garcia-marquez-cien-anos-netflix-2019
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 2019-03
  dateRange: "2019-2024"
  title: The estate sells the screen rights he refused to sell alive
  scope: industry
  reach: franchise
  impact: med
  description: >
    García Márquez refused for the rest of his life to sell the screen
    rights to
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cien años de
    soledad]], believing no feature film's running time could hold it.
    Netflix acquired the rights from his estate in March 2019 and, with his
    family's condition that it be shot in Colombia, in Spanish, with
    Colombian actors, released the first half of a 16-episode adaptation on
    11 December 2024, produced with his sons Rodrigo and Gonzalo García
    Barcha as executive producers. It is the novel's first screen
    adaptation of any kind.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/One_Hundred_Years_of_Solitude_(TV_series)

- id: garcia-marquez-en-agosto-nos-vemos-published-2024
  organisation: artifact-spread
  illustration_type: manuscript-proof
  images_required: 1
  date: 2024-03-06
  title: Published against his explicit wishes, a decade after his death
  scope: industry
  reach: franchise
  impact: high
  description: >
    García Márquez had asked that the unfinished manuscript of
    [[work:gabriel-garcia-marquez/en-agosto-nos-vemos|En agosto nos vemos]],
    which existed in five drafts, be destroyed after his death. His sons
    Rodrigo and Gonzalo García Barcha instead re-read the drafts held at the
    Harry Ransom Center, judged the novel worth publishing, and released it
    on 6 March 2024, the 97th anniversary of his birth. "We did think about
    it for about three seconds - was it a betrayal to my parents, to my
    father's wishes?" Rodrigo García said. "And we decided, yes, it was a
    betrayal. But that's what children are for." The decision drew public
    criticism from readers and critics who argued the book should have
    stayed unpublished; reviews of the novel itself were mixed. Over 250,000
    copies were pre-ordered across Latin America ahead of release.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Until_August
    - https://en.wikipedia.org/wiki/Gabriel_Garc%C3%ADa_M%C3%A1rquez
