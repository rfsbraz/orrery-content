# Branding for the Gabriel García Márquez wing (see Orrery CONCEPT §6 - the
# design law, and docs/SCHEMA.md#themeyaml). Not a "tropical paradise" or
# "fiesta" costume: the register is the Caribbean lowlands at their most
# oppressive - the heat that drives Cien años de soledad's insomnia plague
# and its four-year rain, the banana company's noon light over Aracataca,
# the single sourced flash of colour readers actually carry out of the
# book (the yellow butterflies that follow Mauricio Babilonia). Near-black
# jungle green stands in for the humid Caribbean lowlands rather than a
# postcard blue; one warm gold accent, used sparingly, for that light and
# those butterflies. The `art` block below carries the wing's generated-
# sketch visual language, built on the same two anchors rather than beside
# them.
#
# ART. The eleven novels split into a Macondo-and-river-town half and a
# wider half - two dictator novels, a Bolívar novel, a cholera-era love
# story, a colonial exorcism, an old man's last romance, a woman's grief
# ferry - plus a memoir, four story collections, and a run of nonfiction
# (a shipwreck account, a Chilean-exile reportage, a kidnapping chronicle,
# a five-volume journalism anthology) built entirely from other people's
# testimony or his own newspaper trade. What is native across both halves
# is not Macondo itself but the method: a career that started and never
# stopped being newspaper work (a column byline at nineteen, the 1955
# shipwreck serial that got him exiled, four decades collected as Obra
# periodística), and a fiction built the same way journalism is - dictated
# testimony rendered in flat, certifying prose, whether the source is a
# shipwrecked sailor, a kidnapped hostage, a grandmother's ghost stories
# told as plain fact, or a reporter reconstructing a killing witness by
# witness in Crónica de una muerte anunciada. The emblem draws that method
# as an object rather than a metaphor: hand-set newsprint, damaged by the
# same climate the palette already commits to, corrected by a human hand -
# the actual, sourced mechanics of the 1962 La mala hora edition he
# disowned over a proofreader's changes and only saw restored four years
# later. Checked against the catalogue's one other journalist wing, José
# Rodrigues dos Santos: that wing is a cold, modern broadcast newsroom
# (telex ribbon, cipher grid, tape recorder, wire-photo line) built from a
# working TV anchor's instrument; this one is warm, hand-set, pre-broadcast
# print left to rot in the humidity, built from a wire-service stringer's
# instrument forty years earlier. No object, paper stock or line
# vocabulary is shared between the two.
preset: macondo-noon
palette:
  bg: "#171d12"        # near-black jungle-shadow green, not postcard blue
  surface: "#212b19"   # a hair lifted, for cards
  ink: "#f2e8cf"        # warm parchment - high contrast, very readable
  muted: "#98956f"      # dusty olive, for metadata (4.8:1 on surface, AA)
  accent: "#d6a527"     # one warm gold - banana-company noon light, the
                         # yellow butterflies of Cien años de soledad -
                         # used sparingly, never as a fill or a wash
displayFace: spectral   # from the app's implemented set (fraunces | spectral
                         # | sourceSerif); a literary, slightly cooler serif
                         # than fraunces's showier register, left as a
                         # deliberate first pick rather than the unset
                         # default - open to revision at visual-language once
                         # the full aura exists to weigh it against
signature: beam          # a bold accent rail - the banana company's railway
                          # line that runs through Macondo and through the
                          # novel's own history, not a decorative flourish
notes: >
  A tropical register built from two sourced anchors rather than generic
  "magical realism" costume: the oppressive Caribbean heat that drives the
  fiction's own recurring weather (rain, drought, plague), and the single
  gold accent standing in for both the banana company's light and the
  yellow butterflies. displayFace and signature are a first, revisable
  pick from the app's implemented sets; the full `art` block is
  visual-language's job once the bibliography and any eras are settled.
art:
  emblem:
    object: >
      A single torn strip of daily newsprint, set in narrow columns of
      dense, mechanically even type too small to read, its cut edge
      ragged and its corners already foxed and browning with humidity.
      One line near its centre is corrected by a human hand: a looser,
      slightly wet ink stroke struck through the printed words, a
      replacement pencilled above them.
    why: >
      García Márquez's whole working life is bracketed by newspapers, not
      just Macondo: a column byline at nineteen, the 1955 shipwreck
      account serialized daily in El Espectador that got him sent abroad,
      four decades of it later gathered as Obra periodística, and a late
      career that kept returning to reported nonfiction (a Chilean
      exile's clandestine return, a wave of Escobar-era kidnappings). The
      corrected line makes that trade's actual mechanics literal and
      sourced rather than symbolic: the 1962 first edition of La mala
      hora that a proofreader altered and García Márquez disowned outright,
      restored by hand four years later - the same tension between a
      fixed printed record and a human hand insisting on the truer
      version that also drives Crónica de una muerte anunciada's
      witness-by-witness reconstruction of a killing the whole town failed
      to stop. The foxing keeps it inside this wing's own established
      climate rather than a generic old-paper wash: this paper is rotting
      in the same humidity the palette already commits to.
  motifs:
    - a torn, densely-set strip of daily newsprint, corners foxed and
      curling with damp, never legible as words
    - a hand-written correction or annotation inked directly over a line
      of set type, the one legible gesture on an otherwise illegible page
    - a slow ceiling fan turning under one bare bulb in a shuttered room
      at midday, heat made visible as still, heavy air rather than a view
    - a plain river ferry or wooden riverboat at a bare wharf, paddlewheel
      or plank ramp, no passengers named or shown boarding
    - a lone yellow butterfly caught mid-flight against a shadowed doorway
      or a half-closed shutter
    - a weathered two-storey wooden house with iron-grille balconies and a
      walled courtyard, shutters closed against the noon glare
    - a folded, hand-addressed letter or telegram left unopened on a bare
      table or windowsill
  atmosphere: >
    The hour when heat itself is the antagonist: shutters closed against a
    flat white noon glare, the held stillness before one of the recurring
    rains or the drained quiet just after one. The register is a
    reporter's flat certainty, not gothic dread or carnival wonder - the
    fantastic, where it appears at all, is stated as plainly as the
    weather, in the same even voice a wire report states a fact, never
    staged as horror and never played for whimsy or fiesta colour. This is
    inland river-town heat, not a beach: no palm-fringed shoreline, no
    postcard turquoise water, no parade colour standing in for "Latin
    America."
  lineCharacter: >
    Set type rendered as a tight, mechanically even field of fine,
    illegible dashes - a printer's stereotype, not a scrawl - held level
    and uniform wherever it appears. That mechanical field is broken only
    where a human hand corrects or annotates it: a single looser,
    slightly wet-edged ink stroke that bleeds a little into the humid
    paper, visibly a different instrument and a different pressure from
    the type it crosses. The two textures - machine-set and hand-corrected
    - sit in the same image on purpose; neither one alone is this wing's
      line.
  backgroundTexture: >
    Cheap, absorbent newsprint pulp rather than a book's finer laid or
    wove sheet - stock that was never built to last, already tanning to a
    warm tobacco-brown at the edges and spotted with humidity-foxing, the
    way an actual daily paper left out in the Caribbean lowlands would go.
  accentUse: >
    Gold on exactly one element per image, never a fill: a single yellow
    butterfly passing through or resting in the frame, one hard bar of
    noon light falling across the newsprint strip or through a shutter
    slat, or a lit oil lamp or bare bulb left burning in an otherwise
    shadowed room.
  avoid:
    - swarms of butterflies used as decorative wallpaper, floating or
      levitating figures, or ghosts rendered as translucent decoration -
      "magical realism" as costume rather than the plainly-stated fact
      this wing's own fiction treats it as
    - palm-fringed beaches, cruise-brochure turquoise water, carnival
      parade colour or salsa/rumba imagery - this Caribbean is an inland
      river town under oppressive heat, not a resort
    - the cold, modern broadcast-newsroom register already owned by this
      catalogue's other journalist wing, José Rodrigues dos Santos - no
      telex ribbon, cipher grid, tape recorder or studio monitor here -
      this wing's print trade is hand-set, pre-broadcast and warped by
      tropical damp
    - Simón Bolívar's face or likeness, or any other real person's (per
      docs/VISUAL.md §3) - draw the river voyage, the wharf or the
      palace, never the man
    - the closing pages of Cien años de soledad (the storm that erases
      Macondo, the decoded manuscript) or any other reveal named in this
      wing's spoiler ledger
    - armed, uniformed cartel or military violence staged as thriller
      action for the kidnapping and political material - that register
      stays document and aftermath, never a staged shootout
    - legible words, headlines or captions standing in for the newsprint's
      type - per the house ban on in-image lettering, the set type stays
      a dense, illegible field
