# Creative periods. One is claimed, and one only.
#
# THE MACONDO CYCLE is received: it is named, and its two ends are named, in
# criticism outside this catalogue. Its sources sit on the entry below.
#
# THE TWO "DICTATOR NOVELS" ARE NOT AN ERA HERE. El otoño del patriarca (1975)
# and El general en su laberinto (1989) are a real received grouping: both are
# catalogued as instances of the Latin American novela del dictador, the
# subgenre that runs from Valle-Inclán's Tirano Banderas (1926) through
# Asturias, Carpentier and Roa Bastos. That is membership of a genre shared
# with other writers, not a period of this writer's career. The fourteen years
# between the two novels hold Crónica de una muerte anunciada and El amor en
# los tiempos del cólera, which belong to neither the subgenre nor to any
# grouping that takes in both dictator books, so a span drawn around the pair
# would plate two novels it does not describe. A Companion to Gabriel García
# Márquez (Boydell & Brewer, 2021) reads the same way: its chapter on El otoño
# del patriarca pairs that novel with the political writings rather than with
# El general en su laberinto.
#   https://en.wikipedia.org/wiki/Dictator_novel
#   https://es.wikipedia.org/wiki/Novela_del_dictador
#
# THE "TRES DE MIS LIBROS SON UN SOLO LIBRO" TRIO carries no period name of its
# own in any source consulted for this file, in Spanish or in English. It does
# not need one: all three books fall inside 1955-1967, and the criticism that
# defines the Macondo cycle counts them among its books, so the author's own
# grouping sits inside the era below rather than beside it. It stays recorded
# as a note on each of the three works.
#
# NOTHING AFTER 1967 IS PERIODISED. Searched in Spanish and in English: no
# critic, reference work or obituary divides the later career into named
# phases. Nick Caistor's Guardian obituary, the fullest career retrospective
# reached, runs chronologically and names no phase at all
# (https://www.theguardian.com/books/2014/apr/17/gabriel-garcia-marquez-obituary).
# The twenty works published from 1970 onward therefore sit outside every era,
# which is what an honestly uncovered career looks like: the alternative would
# be spans nobody but this file draws.

- id: macondo-cycle
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: The Macondo Cycle
  period: "1955-1967"
  themes: [Macondo, La Violencia and the civil wars, the unnamed river town, solitude, family and inheritance]
  provenance: critical
  description: >
    The five books critics group as the cycle of Macondo, el ciclo de Macondo
    in Spanish: the fictions built on one invented Caribbean town and its
    neighbours, opening with
    [[work:gabriel-garcia-marquez/la-hojarasca|La hojarasca]], where Macondo
    first appears, and closing with
    [[work:gabriel-garcia-marquez/cien-anos-de-soledad|Cien años de soledad]].
    Raymond Leslie Williams, writing the cycle's chapter in A Companion to
    Gabriel García Márquez, calls that last novel "the culmination of the
    'cycle of Macondo' fictions that García Márquez began constructing in the
    early 1950s and continued to elaborate, in short fictions and novels, until
    1967". Gale's Literature and Its Times draws the same span, the cycle
    "beginning with his first one, Leafstorm (1955), and lasting through the
    release of his masterpiece One Hundred Years of Solitude (1967)". Between
    those two books stand
    [[work:gabriel-garcia-marquez/el-coronel-no-tiene-quien-le-escriba|El
    coronel no tiene quien le escriba]],
    [[work:gabriel-garcia-marquez/la-mala-hora|La mala hora]] and
    [[work:gabriel-garcia-marquez/los-funerales-de-la-mama-grande|Los funerales
    de la Mamá Grande]], the three García Márquez said were "en verdad un solo
    libro", really just one book.
  note: >
    The span is the criticism's, not a rounding: 1955 and 1967 are the two
    dates the sources name, and Williams counts the same total this catalogue
    holds between them, "the five books of the cycle of Macondo". Where the
    sources differ is at the edges rather than the ends. El coronel no tiene
    quien le escriba and La mala hora are set in an unnamed river town rather
    than in Macondo itself, and the accounts vary in how far the cycle reaches
    below book level: the 2013 dissertation cited below admits both novels and
    counts individual stories inside Los funerales de la Mamá Grande as well.
    One story usually counted in
    the cycle sits outside this span for a bibliographic reason: "Monólogo de
    Isabel viendo llover en Macondo" appeared in Mito in 1955 but reached book
    form only in
    [[work:gabriel-garcia-marquez/ojos-de-perro-azul|Ojos de perro azul]]
    (1972), and this catalogue dates works by their book publication.
  sources:
