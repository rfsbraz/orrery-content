# ADDITIONAL canon orders only. The DEFAULT order - ALL 145 works in
# publication-chronological order - is derived automatically from works.yaml
# and is NOT listed here. Poe assembled no numbered series of his own (see
# works.yaml's header on the seven lifetime books and why none of them are
# treated as a work or an order); the one exception is Dupin, an
# author-declared sequel chain rather than a book Poe himself numbered.

- id: edgar-allan-poe/dupin-in-order
  name: The C. Auguste Dupin tales, in order
  type: curated
  source: canon
  rationale: >
    The three Dupin tales are this wing's one genuine series - not merely a
    recurring character, but a thread the author himself continued on the
    page.
    [[work:edgar-allan-poe/the-mystery-of-marie-roget|The Mystery of Marie
    Rogêt]] was first published subtitled "A Sequel to 'The Murders in the
    Rue Morgue,'" and [[work:edgar-allan-poe/the-purloined-letter|The
    Purloined Letter]] closes out the same narrator-and-detective frame as
    the third case. Reading them in this order - the order they were
    written and published - lets Dupin's method, his standing with the
    unnamed narrator, and his running friction with the Paris police carry
    forward as intended, and each case moves through a different kind of
    space: city streets, open riverbank, a locked private study. The cost
    is small and worth naming honestly: Poe re-introduces Dupin well enough
    in each tale that none of the three is unintelligible read alone or out
    of order, so what a reader loses by skipping the order is the sequel's
    own resonance, not comprehension.
  orderedWorkIds:
    - edgar-allan-poe/the-murders-in-the-rue-morgue
    - edgar-allan-poe/the-mystery-of-marie-roget
    - edgar-allan-poe/the-purloined-letter
  debated:
    - "This order matches the derived publication-chronological default for these three works exactly (1841, 1842, 1844 - no same-year tie to break). It earns its place as a named thread with an author-declared sequel relationship pulled out of a 145-work shelf, the same justification the Discworld thread orders use for a subseries filtered and sorted by year, not as a reshuffle or a tie-break."
  sources:
    - https://en.wikipedia.org/wiki/The_Mystery_of_Marie_Rog%C3%AAt
    - https://en.wikipedia.org/wiki/The_Purloined_Letter
    - https://en.wikipedia.org/wiki/C._Auguste_Dupin
