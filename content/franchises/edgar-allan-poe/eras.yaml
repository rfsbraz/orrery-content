# Creative periods - the narrative spine of the aura. Inline references use
# [[type:id|text]] and must resolve.
#
# Poe's working life is periodised by where he was living and which magazine he
# was writing for, and that is how the standard biography, the museums that keep
# his houses and the National Park Service all divide it. Arthur Hobson Quinn's
# "Edgar Allan Poe: A Critical Biography" (D. Appleton-Century, 1941) gives five
# of the six periods below their shape in its own chapter titles: "Baltimore -
# The Early Fiction" (IX), "The Editor of the 'Messenger'" (X), "Philadelphia -
# The 'Tales of the Grotesque and Arabesque'" (XI), "At the Summit - The Editor
# of 'Graham's Magazine'" (XII), "New York - 'The Raven' and Other Matters"
# (XIV), "The Broadway Journal and the 'Poems' of 1845" (XV), and the four
# closing chapters that cover the Fordham years, "Eureka" (XVII) through "The
# Recoil of Fate" (XX). The first period is Poe's own: POEMS WRITTEN IN YOUTH is
# the section heading he gave the 1827-1831 poems when he reprinted them at the
# back of The Raven and Other Poems (1845).
#
# Every boundary is a dated event rather than a rounded decade: the West Point
# court-martial and the 1831 Poems (January to March 1831) against the Saturday
# Courier prose contest he entered later that year; the first Messenger
# contributions (March 1835); the move to Philadelphia (1838); the move to New
# York (6 April 1844); and the Broadway Journal's last issue (3 January 1846),
# after which the family left the city for the Fordham cottage.
#
# Two works sit outside every span, deliberately, and are not a gap to be
# closed:
#   - "Poetry" (1824) is a juvenile fragment written at about fifteen, never
#     published in his lifetime and in none of his own collections. It predates
#     his first book by three years and belongs to his schooldays rather than to
#     a working period.
#   - "The Poetic Principle" (1850) was first printed ten months after he died.
#     The lecture behind it was delivered from December 1848 onward and belongs
#     inside the Fordham years; the publication does not.
#
# No era is drawn around the tales of ratiocination. "Ratiocination" is Poe's own
# word and the detective story is his invention, but it names a kind of tale
# rather than a period of his life, and the three Dupin stories straddle the move
# from Philadelphia to New York (1841, 1842, 1844). They are carried as a
# subseries in works.yaml instead.

- id: poems-written-in-youth
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: Poems Written in Youth
  period: "1827-1831"
  themes: [romantic apprenticeship, dream and reverie, the army and West Point, books nobody bought]
  provenance: author
  description: >
    Poe's own heading for these poems, used when he reprinted them at the back of
    The Raven and Other Poems (1845) as "the crude compositions of my earliest
    boyhood". Five years, three thin volumes of verse, and no prose at all:
    [[work:edgar-allan-poe/tamerlane|Tamerlane]] and Other Poems (Boston, 1827),
    issued anonymously "By a Bostonian" as he enlisted in the army under a false
    name; Al Aaraaf, Tamerlane, and Minor Poems (Baltimore, 1829), carrying
    [[work:edgar-allan-poe/al-aaraaf|Al Aaraaf]] and
    [[work:edgar-allan-poe/sonnet-to-science|Sonnet - To Science]]; and Poems
    (New York, 1831), sold by subscription to the West Point cadets who had just
    watched him get himself court-martialled, and holding the first
    [[work:edgar-allan-poe/to-helen-1831|To Helen]],
    [[work:edgar-allan-poe/israfel|Israfel]] and
    [[work:edgar-allan-poe/the-city-in-the-sea|The City in the Sea]]. None of the
    three sold. [[work:edgar-allan-poe/alone|Alone]] was written in these years
    and stayed in a private album until decades after his death.
  note: >
    The label is Poe's, capitalised, in a book of his own, and the poems he filed
    under it are exactly those of the 1827, 1829 and 1831 volumes, which is what
    fixes the span. One scope shift comes with it: he used the heading for a group
    of poems in a retrospective collection, not for a period of his working life.
    The closing boundary is dated rather than rounded. He was court-martialled on
    27 January 1831, dismissed from West Point as of 6 March, published Poems that
    spring, and by the second half of the year had entered the Philadelphia
    Saturday Courier's prose competition. No further volume of verse followed for
    fourteen years.
  sources:
    - "https://www.eapoe.org/works/editions/raopc.htm"
    - "https://www.eapoe.org/works/mabbott/tom1p118.htm"
    - "https://poets.org/poet/edgar-allan-poe"

- id: baltimore-and-the-early-fiction
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: Baltimore and the Early Fiction
  period: "1832-1834"
  themes: [the turn from verse to prose, magazine prize contests, the Folio Club, burlesque and the grotesque]
  provenance: critical
  description: >
    Quinn's title for the years in Maria Clemm's Baltimore household, where Poe
    stopped being a poet who published books and became a writer who sold prose to
    magazines. Five tales ran in the Philadelphia Saturday Courier through 1832,
    beginning with [[work:edgar-allan-poe/metzengerstein|Metzengerstein]], all of
    them unsigned; by 1833 he had eleven drafted as Tales of the Folio Club, a
    collection no publisher ever took. In October 1833 the Baltimore Saturday
    Visiter gave [[work:edgar-allan-poe/ms-found-in-a-bottle|MS. Found in a Bottle]]
    its fifty dollar prize and placed
    [[work:edgar-allan-poe/the-coliseum|The Coliseum]] second in its poetry
    contest, and through John Pendleton Kennedy he was put in touch with Thomas W.
    White, who had just begun publishing the Southern Literary Messenger in
    Richmond.
  note: >
    "Baltimore - The Early Fiction" is chapter IX of Quinn's biography, and the
    Poe Museum's own life of Poe dates the shift from poetry to short stories to
    these four Baltimore years. The span opens with the first published fiction
    (the 1832 Saturday Courier tales, entered in a competition he submitted to in
    the second half of 1831) and closes at the end of 1834, a few months before
    his first Messenger contributions.
  sources:
    - "https://www.eapoe.org/papers/misc1921/quinn00c.htm"
    - "https://www.eapoe.org/works/mabbott/tom1p118.htm"
    - "https://poemuseum.org/edgar-allan-poe/"

- id: the-messenger-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Messenger Years
  period: "1835-1837"
  themes: [the editor's desk, reviewing with a tomahawk, Richmond, the marriage to Virginia]
  provenance: critical
  description: >
    Quinn's chapter X is "The Editor of the 'Messenger'", and these are the years
    it covers. [[work:edgar-allan-poe/berenice|Berenice]] appeared in the Southern
    Literary Messenger in March 1835 and drew complaints from its readers;
    [[work:edgar-allan-poe/morella|Morella]] and
    [[work:edgar-allan-poe/the-unparalleled-adventure-of-one-hans-pfaall|Hans Pfaall]]
    followed, and by that autumn Poe was in Richmond working for the magazine's
    publisher, Thomas W. White. He and his thirteen year old cousin Virginia Clemm
    were publicly married there on 16 May 1836. The book reviews he wrote for the
    Messenger rivalled the British quarterlies for severity and made his name as a
    critic before his fiction did. The arrangement ended in January 1837.
  note: >
    The span opens with the first Messenger contributions in March 1835 rather
    than with the move to Richmond that August, since the magazine is what the
    period is named for. It runs to the end of 1837 to hold the lean New York year
    between the editorship and the move to Philadelphia, which produced almost
    nothing beyond the finished manuscript of
    [[work:edgar-allan-poe/the-narrative-of-arthur-gordon-pym-of-nantucket|Arthur Gordon Pym]],
    whose first instalments the Messenger had already run. That stretch is inside
    the span and outside the magazine.
  sources:
    - "https://www.eapoe.org/papers/misc1921/quinn00c.htm"
    - "https://www.eapoe.org/works/mabbott/tom1p118.htm"
    - "https://poemuseum.org/edgar-allan-poe/"

- id: the-philadelphia-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Philadelphia Years
  period: "1838-1843"
  themes: [the magazine economy, Gothic interiors, ratiocination, the magazine he never founded]
  provenance: critical
  description: >
    The six years the National Park Service, which keeps the surviving Poe house
    in Philadelphia, calls his happiest and most productive. He was coeditor of
    Burton's Gentleman's Magazine from May 1839 and editor of Graham's Magazine
    from 1841, and wrote for them the work most readers mean by Poe:
    [[work:edgar-allan-poe/the-fall-of-the-house-of-usher|The Fall of the House of Usher]],
    [[work:edgar-allan-poe/william-wilson|William Wilson]],
    [[work:edgar-allan-poe/the-masque-of-the-red-death|The Masque of the Red Death]],
    [[work:edgar-allan-poe/the-pit-and-the-pendulum|The Pit and the Pendulum]],
    [[work:edgar-allan-poe/the-tell-tale-heart|The Tell-Tale Heart]],
    [[work:edgar-allan-poe/the-black-cat|The Black Cat]], and in Graham's for
    April 1841 [[work:edgar-allan-poe/the-murders-in-the-rue-morgue|The Murders in the Rue Morgue]],
    the first detective story. Lea and Blanchard gathered twenty five of the tales
    as Tales of the Grotesque and Arabesque late in 1839, and
    [[work:edgar-allan-poe/the-gold-bug|The Gold-Bug]] took the Dollar Newspaper's
    hundred dollar prize in 1843, his first national success. Through all of it he
    was trying and failing to raise the capital for a magazine of his own, first
    the Penn and then the Stylus, for which he was still taking subscriptions when
    he died.
  note: >
    Quinn gives these years three chapters, from "Philadelphia - The 'Tales of the
    Grotesque and Arabesque'" through "At the Summit - The Editor of 'Graham's
    Magazine'". "Happiest and most productive" is the Park Service's judgement,
    quoted rather than asserted. The span closes at the end of 1843 because Poe
    left Philadelphia for New York on 6 April 1844, which puts most of that year's
    work on the New York side of the line; the pieces published in its first three
    months were still Philadelphia work.
  sources:
    - "https://www.nps.gov/edal/index.htm"
    - "https://www.eapoe.org/papers/misc1921/quinn00c.htm"
    - "https://www.eapoe.org/works/mabbott/tom1p118.htm"

- id: the-new-york-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The New York Years
  period: "1844-1845"
  themes: [instant fame, the hoax as journalism, running his own paper, literary warfare]
  provenance: critical
  description: >
    Poe and Virginia moved to New York on 6 April 1844, and a week later the Extra
    Sun carried [[work:edgar-allan-poe/the-balloon-hoax|The Balloon-Hoax]] as
    news. On 29 January 1845 the Evening Mirror printed
    [[work:edgar-allan-poe/the-raven|The Raven]] with his name attached; it was
    copied and parodied everywhere within weeks, and made him famous without
    making him solvent. Mabbott calls 1845 his annus mirabilis: the year Wiley and
    Putnam issued both Tales and The Raven and Other Poems, and the year he worked
    his way from contributor to sole owner of the Broadway Journal, the only
    magazine he ever controlled. [[work:edgar-allan-poe/the-purloined-letter|The Purloined Letter]]
    and [[work:edgar-allan-poe/the-facts-in-the-case-of-m-valdemar|The Facts in the Case of M. Valdemar]]
    belong to these two years.
  note: >
    Quinn's chapters XIV and XV, "New York - 'The Raven' and Other Matters" and
    "The Broadway Journal and the 'Poems' of 1845". Both boundaries are dated
    events: the move of 6 April 1844, and the Broadway Journal's last issue, dated
    3 January 1846, after which the family left the city. "New York" is meant
    strictly here, since the cottage Poe moved to next was outside it.
  sources:
    - "https://www.eapoe.org/papers/misc1921/quinn00c.htm"
    - "https://www.eapoe.org/works/mabbott/tom1p118.htm"

- id: the-fordham-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Fordham Years
  period: "1846-1849"
  themes: [widowhood, cosmology, the late lyrics, the lecture circuit]
  provenance: critical
  description: >
    Poe rented a cottage in the village of Fordham, then a farming suburb in
    Westchester County rather than part of the city, for a hundred dollars a year,
    and it was his last permanent home; the Bronx County Historical Society, which
    keeps the cottage, dates his time in it 1846 to 1849. Virginia died there of
    tuberculosis on 30 January 1847. The late work follows:
    [[work:edgar-allan-poe/the-cask-of-amontillado|The Cask of Amontillado]],
    [[work:edgar-allan-poe/ulalume|Ulalume]], the cosmological lecture he
    delivered in February 1848 and expanded into
    [[work:edgar-allan-poe/eureka|Eureka]], and the last lyrics,
    [[work:edgar-allan-poe/the-bells|The Bells]],
    [[work:edgar-allan-poe/annabel-lee|Annabel Lee]],
    [[work:edgar-allan-poe/eldorado|Eldorado]] and
    [[work:edgar-allan-poe/for-annie|For Annie]]. He was travelling and lecturing
    when he was found delirious in Baltimore on 3 October 1849; he died four days
    later.
  note: >
    Quinn's four closing chapters, "Eureka" through "The Recoil of Fate", cover
    exactly these years. The span opens with the calendar year of the move, which
    happened during 1846, so the pieces published early that year, including
    [[work:edgar-allan-poe/the-philosophy-of-composition|The Philosophy of Composition]],
    were still written in the city. It closes at his death, which is why
    [[work:edgar-allan-poe/the-poetic-principle|The Poetic Principle]], lectured
    from December 1848 and printed in 1850, falls outside every span in this file.
  sources:
    - "https://bronxhistoricalsociety.org/poe-cottage/"
    - "https://www.eapoe.org/papers/misc1921/quinn00c.htm"
    - "https://www.eapoe.org/works/mabbott/tom1p118.htm"
