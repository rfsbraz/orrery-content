# Editions of Edgar Allan Poe: 126 en editions (126 works) + 8 pt-PT editions
# (6 works, all already among the 126) = 134 editions over 126 of 145 works
# (87%).
#
# THE STRUCTURAL PROBLEM THIS FILE SOLVES. Poe died in 1849, before ISBNs
# existed and before any "complete" volume of his own tales or poems did;
# works.yaml already departs from this catalogue's usual "a short-story
# collection is one work" rule for exactly that reason (see its own header).
# So almost none of the 145 works below were ever, or could ever have been,
# published alone as a book with its own ISBN - a magazine tale or a four-line
# valentine is not a standalone commercial object. What DOES exist, real and
# buyable, is a small number of modern scholarly and trade anthologies that
# each gather many of these works under one ISBN. The schema's `editions.yaml`
# shape is one edition per one `workId` (SCHEMA.md; validate.py enforces a
# single workId per entry, resolved against works.yaml) - there is no
# "one edition, many works" field. This file does not invent one. Instead,
# where an anthology's actual contents were independently verified against a
# published table of contents (not assumed from its title or scope), it is
# recorded as a separate edition entry FOR EACH work it verifiably contains,
# all entries sharing the same real ISBN/publisher/year - the way a library
# catalogues a short story: as itself, with the book that holds it named as
# its edition. No edition below was invented, and no edition was extended to
# a work whose presence in that book could not be checked.
#
# EN: LIBRARY OF AMERICA, the two-volume scholarly edition of Poe's complete
# work (Patrick Quinn's "Poetry & Tales", LOA No. 19, ISBN 9780940450189, and
# G.R. Thompson's "Essays & Reviews", LOA No. 20, ISBN 9780940450196, both
# Literary Classics of the U.S., 1984; publish_date and publisher confirmed
# against each ISBN's OpenLibrary record). Both are out of print with no
# reprint scheduled per loa.org's own product pages, and are recorded anyway
# per SCHEMA.md's own-edition tiebreak rule: they are the only edition, and no
# in-print alternative with a comparably verifiable table of contents was
# found. "Poetry & Tales" publishes its full table of contents on its own
# product page, alphabetised within Poetry and within Tales and Sketches; the
# 123 works cited to it below (65 tales/the novel, 53 poems, plus Eureka, The
# Journal of Julius Rodman, The Philosophy of Furniture and the "Scenes from
# Politian" excerpt, all separately itemised in that same table) were matched
# against it title by title. "Essays & Reviews" publishes only six section
# headings, not an itemised table, so the 3 works cited to it (The Philosophy
# of Composition, The Rationale of Verse, The Poetic Principle) are only the
# ones its own publisher description names outright in running text - a
# stricter bar than the itemised volume, deliberately: an essay this file does
# not name was not confirmed, not merely omitted.
#
# EN OMISSIONS FROM LOA, BY REASON:
#  - A Predicament, The Landscape Garden: not in Poetry & Tales' own itemised
#    table. Both were later absorbed into a revision LOA does carry under a
#    different title (Landscape Garden into The Domain of Arnheim), so this
#    reads as the volume's own "authoritative text" choice rather than a gap.
#  - Dreams (distinct from the retained "A Dream"), the second untitled 1829
#    "To —" (opening "I heed not", distinct from the retained "To — [The
#    bowers whereat]"), A Paean (superseded there by its own revision, Lenore,
#    which IS in the table), Fanny, To Mary, To Elizabeth, May Queen Ode,
#    Spiritual Song, Latin Hymn, Song of Triumph, Impromptu to Kate Carol, The
#    Divine Right of Kings, To Marie Louise, Poetry (1824): none appear in the
#    itemised poetry table under any spelling checked. To Mary and To
#    Elizabeth in particular sit inside a tangled revision history (works.yaml
#    notes both poems as later feeding into separately-retitled pieces); the
#    likelier reading is that LOA's own text-selection collapsed some of
#    these fourteen into the poems it does carry rather than dropping them
#    outright, but that collapse was not traced item by item here, so none of
#    the fourteen is cited to a survivor poem it was not confirmed against.
#  - Maelzel's Chess-Player, A Few Words on Secret Writing: plausible
#    candidates for "Essays & Reviews" (both are exactly its kind of
#    material) but neither is named in the volume's own running description,
#    and its table of contents is not itemised online to check further.
#  - The Conchologist's First Book: Poe's contributor-role preface and
#    classification-text translation inside Thomas Wyatt's own natural-history
#    schoolbook, a different physical book by a different primary author, not
#    a Poe tale or essay; neither LOA volume claims it, correctly.
#
# PT-PT: eight real editions across six works, each independently confirmed
# at the Biblioteca Nacional de Portugal catalogue (catalogo.bnportugal.gov.pt,
# permalink query cited per entry) and cross-checked against a second source
# (OpenLibrary's per-ISBN record, or - for the two ISBNs OpenLibrary does not
# carry - the bertrand.pt and wook.pt retail listings that independently agree
# on the same ISBN/title/publisher/year). Two further real, currently-selling
# Portuguese anthologies turned up in the same research and are deliberately
# NOT recorded: Temas e Debates' "Todos os Contos" (1st ed. 2014, ISBN
# 9789896443191, still in print as of a 6th edition in 2022) and BIS's
# "Histórias Extraordinárias" (ISBN 9789896530037, into a 7th edition by
# 2017). Both are confirmed real books by a real, durable publishing history;
# neither publisher has an itemised table of contents on record anywhere
# checked, so neither is matched to any individual work here rather than
# guessed onto the ~66 tales a "todos os contos" title implies. A third
# candidate, "Espíritos dos Mortos" (ISBN 9788366589308, G. Floy Studio), is
# excluded outright: it carries no Biblioteca Nacional de Portugal record at
# all, and its registrant prefix (978-83) is Polish, not Portuguese - wrong
# geography for a book with no other confirmation, the same red flag
# SCHEMA.md's region table exists to catch.
#
# =============================================================================
# EN - Library of America, "Poetry & Tales" and "Essays & Reviews" (1984)
# =============================================================================

