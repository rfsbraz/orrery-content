# =============================================================================
# EN - STANDARD EBOOKS AND PROJECT GUTENBERG (free, public-domain editions)
# =============================================================================
#
# Poe's public domain status makes free, direct-to-source digital editions a
# legitimate primary target here, not just a fallback for gaps LOA leaves -
# per the wing's own tracking issue (#65). This later pass adds them
# generously across the whole wing, including onto works LOA already covers,
# because a reader gets a real, currently-maintained, freely-licensed edition
# option out of it, and because it breaks up how often the wing's shelf shows
# the identical LOA "Poetry & Tales" jacket: 103 of the 126 LOA-covered works
# share that one ISBN/cover, since the schema derives a work's cover from its
# edition's ISBN when the work has no images.cover of its own.
#
# STANDARD EBOOKS (standardebooks.org) publishes exactly three real,
# currently-maintained editions of Poe, each with its own distinct cover art
# and its own itemised table of contents (fetched and checked per volume,
# not assumed from scope): "Poetry" (51 poems, first edition released May
# 30, 2023), "Short Fiction" (66 tales, released November 18, 2020) and "The
# Narrative of Arthur Gordon Pym of Nantucket" (the novel, released May 25,
# 2014). Every one of the 118 works cited below to a Standard Ebooks entry
# was checked individually against that volume's own table of contents at
# /ebooks/edgar-allan-poe/<slug>/text.
#
# PROJECT GUTENBERG (gutenberg.org) ebook #25525, "The Works of Edgar Allan
# Poe, The Raven Edition" (a transcription of the 1903 Raven Edition
# collected works, released May 19, 2008, credited to David Widger and Carlo
# Traverso), is a single ebook whose own front-matter Contents section and
# body headings between them itemise the same ~66 tales as Standard Ebooks'
# "Short Fiction", the same core poem set as Standard Ebooks' "Poetry" (with
# two differences - it lacks A Paean and it separately carries the "Scenes
# from Politian" verse-drama excerpt Standard Ebooks does not) and three
# essays (Maelzel's Chess-Player, The Poetic Principle, The Philosophy of
# Furniture). Its own printed Contents block undercounts by a few titles (A
# Dream Within a Dream and To My Mother are both real, present poems in the
# body with no corresponding Contents line - a transcription omission in the
# front matter, not evidence of absence), so entries here were confirmed
# against the actual body heading and text, not the Contents list alone.
#
# Both sources are free, non-commercial, born-digital editions with no ISBN
# to record - `isbn13` is deliberately omitted throughout this section, the
