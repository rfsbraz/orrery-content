- id: edgar-allan-poe/metzengerstein
  title: "Metzengerstein"
  authorIds: [edgar-allan-poe]
  published: 1832
  subseries: null
  canonTier: core
  synopsis: >
    Poe's first published tale: a young Hungarian nobleman, sole heir to a
    house locked in a centuries-old feud with its neighbours, becomes
    fixated on a strange fiery-coloured horse that comes out of the blaze
    at his rival's stables.
  note: First published anonymously, subtitled "A Tale in Imitation of the German."
  sources:
    - https://en.wikipedia.org/wiki/Edgar_Allan_Poe_bibliography
    - https://www.eapoe.org/works/tales/index.htm

