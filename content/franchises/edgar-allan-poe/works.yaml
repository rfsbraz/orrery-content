  authorIds: [edgar-allan-poe]
  published: 1843
  subseries: null
  canonTier: core
  synopsis: A prisoner of the Spanish Inquisition endures a slowly descending blade and a shrinking, red-hot-walled cell before a last-second rescue.
  sources:
    - https://en.wikipedia.org/wiki/Edgar_Allan_Poe_bibliography
    - https://www.eapoe.org/works/tales/index.htm

