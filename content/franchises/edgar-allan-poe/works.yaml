# --- Nonfiction, incomplete and disputed works ---

- id: edgar-allan-poe/the-philosophy-of-composition
  title: "The Philosophy of Composition"
  authorIds: [edgar-allan-poe]
  published: 1846
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    An essay claiming to reconstruct, step by calculated step, exactly how
    Poe composed "The Raven" - his most influential single piece of literary
    theory, still debated as sincere method or elaborate performance.
  sources:
    - https://en.wikipedia.org/wiki/Edgar_Allan_Poe_bibliography

- id: edgar-allan-poe/the-rationale-of-verse
  title: "The Rationale of Verse"
  authorIds: [edgar-allan-poe]
  published: 1848
  subseries: null
  canonTier: extended
  format: essay
  synopsis: A long technical essay setting out Poe's own theory of poetic meter and versification.
  sources:
    - https://en.wikipedia.org/wiki/Edgar_Allan_Poe_bibliography

- id: edgar-allan-poe/eureka
  title: "Eureka: A Prose Poem"
  authorIds: [edgar-allan-poe]
  published: 1848
  subseries: null
  canonTier: core
  synopsis: >
    Poe's longest and last major work, a nearly 40,000-word non-fiction
    essay proposing an intuitive theory of the origin and fate of the
    universe, dedicated to Alexander von Humboldt. Received poorly, even by
    friends, in his lifetime; some of its speculative cosmology has since
    been noted for anticipating later scientific ideas. Poe called it, only
    half in jest, more important than the discovery of gravity.
  # No cover: the work's own Open Library record's only cover is a plain
  # library-binding scan (barcode and spine sticker, no legible title or
  # art); checked and rejected as a degraded scan rather than left in.
  sources:
    - https://en.wikipedia.org/wiki/Eureka:_A_Prose_Poem
    - https://www.eapoe.org/works/editions/index.htm

- id: edgar-allan-poe/the-poetic-principle
  title: "The Poetic Principle"
  authorIds: [edgar-allan-poe]
  published: 1850
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    Poe's aesthetic manifesto, arguing that a poem should pursue Beauty
    alone rather than truth or moral instruction, and that a "long poem"
    is a contradiction in terms.
  note: >
    First delivered as a lecture in Providence in December 1848 and revised
    for further lectures in Virginia in August 1849, but not published
    until after Poe's death: Home Journal, August 31, 1850, followed within
    weeks by Griswold's edition and Sartain's Union Magazine. The lecture
    dates are often given as its date; the year here is first publication.
  sources:
    - https://www.eapoe.org/works/info/petpp.htm
    - https://en.wikipedia.org/wiki/The_Poetic_Principle

- id: edgar-allan-poe/maelzels-chess-player
  title: "Maelzel's Chess-Player"
  authorIds: [edgar-allan-poe]
  published: 1836
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    An essay dissecting the celebrated chess-playing automaton touring
    America under Johann Maelzel, arguing through close observation that no
    true machine could be responsible and a concealed operator must be
    inside it - an early public display of the analytical method Poe would
    later dramatize in the Dupin tales.
  sources:
    - https://www.eapoe.org/works/info/pemcp.htm

- id: edgar-allan-poe/the-philosophy-of-furniture
  title: "The Philosophy of Furniture"
  authorIds: [edgar-allan-poe]
  published: 1840
  subseries: null
  canonTier: extended
  format: essay
  synopsis: A satirical essay on American interior-decorating taste, contrasting the gaudy over-furnished parlor of the day with Poe's own ideal of restrained, harmonious domestic design.
  sources:
    - https://www.eapoe.org/works/info/petpf.htm

- id: edgar-allan-poe/a-few-words-on-secret-writing
  title: "A Few Words on Secret Writing"
  authorIds: [edgar-allan-poe]
  published: 1841
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    An essay on cryptography claiming that human ingenuity cannot construct
    a cipher that human ingenuity cannot resolve, issued as a public
    challenge inviting readers to submit ciphers for Poe to solve - the
    same fascination that resurfaces in "The Gold-Bug."
  note: Followed by three addenda (August, October and December 1841) reporting on ciphers submitted in response.
  sources:
    - https://www.eapoe.org/works/info/peswr.htm

- id: edgar-allan-poe/the-journal-of-julius-rodman
  title: "The Journal of Julius Rodman"
  authorIds: [edgar-allan-poe]
  published: 1840
  subseries: null
  canonTier: extended
  synopsis: >
    An unfinished serialized adventure novel, framed as the recovered diary
    of a fictional 1792 expedition that crosses the Rocky Mountains decades
    before Lewis and Clark. Poe abandoned it after six installments when he
    left Burton's Gentleman's Magazine.
  sources:
    - https://en.wikipedia.org/wiki/The_Journal_of_Julius_Rodman

- id: edgar-allan-poe/the-conchologists-first-book
  title: "The Conchologist's First Book"
  authorIds: [edgar-allan-poe]
  published: 1839
  subseries: null
  canonTier: apocrypha
  format: reference
  authorRole: contributor
  contributionTitle: "Preface and classification text (after Cuvier); base text and plates are Thomas Wyatt's"
  synopsis: >
    An illustrated introductory textbook on shells, published under Poe's
    name at a Philadelphia publisher's request; its base text and
    illustrations came from Thomas Wyatt's more expensive Manual of
    Conchology, but Poe wrote the preface and introduction, translated
    Georges Cuvier's French classification text, and reorganized the
    material into a cheaper student edition.
  note: >
    The only one of Poe's books to reach a second edition in the United
    States during his lifetime (a third followed in 1845); real and
    purchasable, but built on another author's work rather than an original
    composition, hence apocrypha rather than core or extended. The title
    page credited it to Poe alone, which the market saw at the time; the
    surviving record of who wrote which part is closer to a contributor's
    credit (preface, introduction, a translated classification section)
    atop Wyatt's base text and plates, which is what authorRole records
    here.
  sources:
    - https://en.wikipedia.org/wiki/The_Conchologist%27s_First_Book
    - https://www.eapoe.org/works/editions/index.htm

- id: edgar-allan-poe/politian
  title: "Politian"
  authorIds: [edgar-allan-poe]
  published: 1835
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    Poe's only known attempt at a play: a blank-verse tragedy transplanting
    a real 1825 Kentucky murder case to 16th-century Rome. Only two scenes
    were ever published, in successive 1835-1836 issues of the Southern
    Literary Messenger, before Poe abandoned it and returned to short
    fiction.
  sources:
    - https://en.wikipedia.org/wiki/Politian_(play)
