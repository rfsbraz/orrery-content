# Bibliography (Works) - the abstract poems/tales/novel/nonfiction; editions
# and covers are a separate layer. IDs are STABLE and permanent (user data
# references them).
#
# STRUCTURAL CALL: the atomic unit here is the individual poem or tale, not
# the handful of books Poe assembled in his own lifetime. This departs from
# this catalogue's usual convention (a short-story collection is one work -
# see agatha-christie/works.yaml, jo-nesbo/works.yaml) deliberately, and the
# reasoning is checked, not assumed. Poe published exactly three tale
# collections and four poetry collections in his lifetime (Poe Society of
# Baltimore's own "Books Published by Poe" list, cross-checked against
# Wikipedia's bibliography, which agree completely): Tamerlane and Other
# Poems (1827), Al Aaraaf, Tamerlane, and Minor Poems (1829), Poems (1831),
# Tales of the Grotesque and Arabesque (1840, 25 of his tales),
# The Prose Romances of Edgar A. Poe (1843, only one number ever issued,
# containing just two tales, both already collected elsewhere), Tales
# (1845, 12 tales selected by his editor Evert Duyckinck - Poe himself was
# unhappy with the selection and it omitted "Ligeia," which he considered
# his best story), and The Raven and Other Poems (1845). Together these
# seven books cover a minority of his sixty-nine tales (eapoe.org's own
# count, "both short fiction and novels") and stop, for the poems, in 1845 -
# four years before his death and before "Ulalume," "Annabel Lee," "The
# Bells," "Eldorado," "For Annie" and "A Dream Within a Dream" even
# existed. He died before any "complete tales" or "complete poems" of his
# own assembling could exist. Treating the seven lifetime books as the
# works would either omit most of what this author is actually known for,
# or require a "Collected/Complete Poe" work invented after the fact - which
# this catalogue's own rule against inventing a book that does not exist
# (SCHEMA.md, editions.yaml) forbids as firmly for a work as for an edition.
# The individual poem or tale, almost always first (and often only)
# published in a magazine or newspaper in Poe's own lifetime, is therefore
# the unit below. The seven historical books are real and significant and
# are recorded in this note and on the individual pieces they gathered,
# never invented as work entries of their own.
#
# SHAPE OF THIS WING: one novel, sixty-seven tales, sixty-six poems, and
# seven nonfiction/incomplete/disputed works (141 total) - see the section
# breaks below. This is a wide first draft, not a closed one: dates and
# venues are drawn from Wikipedia's "Edgar Allan Poe bibliography" (itself sourced
# per-item) cross-checked against the Poe Society of Baltimore's own
# sixty-nine-tale index and "Books Published by Poe" list, but individual
# synopses were written from general knowledge of these very widely taught
# and anthologized texts rather than a fresh read of each.
#
# canonTier convention for this franchise:
#   core     - a complete, attributed tale or poem published (magazine,
#              newspaper or book) in Poe's own lifetime, or a small number
#              of complete pieces first published only after his death from
#              a surviving manuscript but long since part of his accepted,
#              widely read body of work (Alone, Elizabeth). Tier here tracks
#              whether a piece is finished and accepted into the canon, not
#              fame ranking within it - a minor 1832 magazine sketch and
#              "The Raven" are both core.
#   extended - genuinely his, but occasional, minor, or off the main
#              tale/poem spine: album verse, acrostics, single-joke squibs,
#              unfinished long-form works (the Rodman novel), and the small
#              set of magazine essays substantial enough to record but never
#              gathered into a book of his own.
#   apocrypha - a single juvenile fragment (see "Poetry", 1824) and one
#              incomplete play, published only as an unfinished excerpt in
#              his lifetime.
# No contributor/editor entries: no anthology piece, introduction or
# editorial credit by another editor is on record for this author beyond
# The Conchologist's First Book, itself included below with authorRole
# recorded as accurately as the sources allow.
#
# SUBSERIES: C. Auguste Dupin (3 tales) is this wing's one genuine series -
# not merely a recurring character but an author-declared continuing
# thread: "The Mystery of Marie Rogêt" was originally subtitled "A Sequel to 'The
# Murders in the Rue Morgue'" on first publication. "The Purloined Letter"
# continues the same narrator-and-Dupin frame. No other Poe character
# recurs across separately titled works.
#
# FEATURED (cap 3): Tamerlane (1827, the actual debut, however unnoticed at
# the time), The Murders in the Rue Morgue (1841, the single most
# consequential work he wrote for literary history - it invented detective
# fiction as a form), and The Raven (1845, the poem that made him a
# household name overnight without ever making him money). Three different
# kinds of hinge, not three favourites.
#
# NOT INCLUDED, and why:
# - "O, Tempora! O, Mores!" (1825) - Wikipedia's own bibliography flags the
#   attribution to Poe as "likely incorrect"; not authenticated enough to
#   record as his.
# - "A Dream" (undated), "The Atlantis" (a serial) and "[Gaffy]" - all
#   flagged doubtful or textually lost by the Poe Society of Baltimore's
#   own index; no surviving, attributable text to record.
# - "Deep in Earth" and "Beloved Physician" (both 1847) - explicitly marked
#   incomplete fragments, never finished or published in his lifetime; the
#   record has the existence of a fragment, not a work.
# - Five essays Wikipedia's own bibliography lists alongside the three
#   included below (Maelzel's Chess Player; The Philosophy of Furniture; A
#   Few Words on Secret Writing; Morning on the Wissahiccon; "American
#   Poetry") - real magazine pieces, but minor ones judged not to clear the
#   bar this first draft is holding for nonfiction. A known gap, not a
#   silent drop.
# - Tales of the Folio Club - a projected linked collection Poe never
#   completed; its individual tales (so far as identified) are already
#   present below as standalone entries, so nothing is lost by leaving the
#   frame-collection itself out.
# - The Light-House (1849) - an incomplete fragment, unpublished in his
#   lifetime, of uncertain intended form (story or novel); the same test
#   applied to "Deep in Earth" excludes it.
# - The Philosophy of Animal Magnetism (1837) - credited to "A Gentleman of
#   Philadelphia," attributed to Poe only by modern stylometric analysis;
#   one method, uncorroborated by an independent source, is short of this
#   catalogue's bar for a non-obvious claim.
#
# externalIds are empty throughout: the enrichment bot fills these.

# --- The novel ---

- id: edgar-allan-poe/the-narrative-of-arthur-gordon-pym-of-nantucket
  title: "The Narrative of Arthur Gordon Pym of Nantucket"
  authorIds: [edgar-allan-poe]
  published: 1838
  subseries: null
  canonTier: core
  synopsis: >
    Poe's only complete novel: a young stowaway survives shipwreck, mutiny
    and cannibalism aboard the whaler Grampus before a rescue leads him and
    a fellow survivor ever further south, toward a strange and hostile
    island and an ending that breaks off in mid-sentence at the edge of the
    unknown.
  sources:
    - https://en.wikipedia.org/wiki/The_Narrative_of_Arthur_Gordon_Pym_of_Nantucket
    - https://www.eapoe.org/works/editions/index.htm

