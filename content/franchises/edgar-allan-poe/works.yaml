  title: "The Duc de L'Omelette"
  authorIds: [edgar-allan-poe]
  published: 1832
  subseries: null
  canonTier: core
  synopsis: >
    A pampered dandy, dead of disgust at the sight of an ill-dressed bird
    on his dinner plate, wakes in the Devil's apartments and finds his host
    willing to play him at cards for his soul.
  sources:
    - https://en.wikipedia.org/wiki/Edgar_Allan_Poe_bibliography
    - https://www.eapoe.org/works/tales/index.htm

