  title: "The Tell-Tale Heart"
  authorIds: [edgar-allan-poe]
  published: 1843
  subseries: null
  canonTier: core
  synopsis: A murderer's calm confession unravels under the imagined heartbeat of the old man he has killed and hidden beneath the floorboards.
  sources:
    - https://en.wikipedia.org/wiki/Edgar_Allan_Poe_bibliography
    - https://www.eapoe.org/works/tales/index.htm

- id: edgar-allan-poe/the-gold-bug
  title: "The Gold-Bug"
  authorIds: [edgar-allan-poe]
  published: 1843
  subseries: null
  canonTier: core
  synopsis: >
