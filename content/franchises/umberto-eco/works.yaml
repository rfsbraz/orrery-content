- id: umberto-eco/sugli-specchi-e-altri-saggi
  title: "Sugli specchi e altri saggi"
  authorIds: [umberto-eco]
  published: 1985
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    A 24-essay collection ranging across mirrors, theatrical signs,
