# Bibliography (Works) - the abstract books; editions/covers are separate.
# IDs are STABLE and permanent (user data references them). Titles are the
# ORIGINAL-LANGUAGE title (Italian for nearly everything; English for the
# handful of works Eco wrote or first delivered in English, noted on those
# entries), per this catalogue's rule that `title` is always the original.
#
# CROSS-CHECKED against English Wikipedia's dedicated "Umberto Eco
# bibliography" page and Eco's own article (both fetched directly, not a
# navbox template), the Italian Wikipedia "Umberto Eco" article's own
# "Opere" bibliography (publisher and ISBN given per title, the standard
# this catalogue applies to a non-anglophone author), plus the individual
# English-Wikipedia article for each of the seven novels (each carries its
# own infobox with translator, original title and both publication dates).
# ISFDB DOES carry an Umberto Eco author page (Author Record #2171,
# isfdb.org/cgi-bin/ea.cgi?Umberto_Eco) - corrected here after an earlier
# pass wrongly recorded "Author not found"; it lists only the novels, the
# two Carmi-illustrated children's books and a handful of essays, not the
# academic bibliography, which is why it under-counts against Wikipedia and
# was not the deciding source for any entry below. OpenLibrary was used
# per-title to verify original-language and first-publication year on
# several entries below (noted on those entries individually); a full sweep
# of all 67 works against it was not done. externalIds are left empty
# throughout for the enrichment bot.
#
# canonTier convention for this franchise, and the two-register question:
# Eco worked in two registers his whole career - the seven novels for a
# general reader, and a much larger body of academic semiotics, medieval
# aesthetics and cultural criticism written for specialists and often never
# translated. canonTier records publication kind, not audience or
# difficulty (docs/SCHEMA.md), and this catalogue already has a settled
# answer for exactly this shape of author: Saramago's crónicas and essays,
# Murakami's nonfiction, and Atwood's poetry and essay collections are all
# `extended` - genuinely the author's own, off the narrative-fiction reading
# spine, tiered by KIND OF BOOK, not by how demanding it is. The same rule
# is applied here rather than inventing a new field or a difficulty axis:
#   core      - the 7 novels: the fiction spine every source (Wikipedia's own
#               "Novels" heading, both English publishers' backlists) builds
#               from.
#   extended  - the academic and semiotic monographs, essay collections,
#               lecture volumes and children's books: genuinely his, off the
#               novel-reading spine. This is NOT a claim that the semiotics
#               is lesser reading - Trattato di semiotica generale and Kant
#               e l'ornitorinco are exactly as central to who Eco was as any
#               novel - only that a reader arriving for the fiction is not
#               dropped into a graduate seminar by the derived publication
#               order, the same reasoning that keeps Atwood's poetry off her
#               novel spine without demoting it.
#   apocrypha - a pen-name pamphlet, one genuinely co-authored dialogue book,
#               and two multi-author scholarly anthologies Eco edited rather
#               than wrote (see each entry).
# A curated order that walks the academic half on its own terms, rather than
# the derived publication order's straight chronology, can be built directly
# from this tiering without re-deciding which works belong to which register.
#
# THE NAME OF THE ROSE, TRANSLATION AND LATIN. See that entry's own
# translationNote: unlike the rest of this bibliography, its English text is
# not simply "translated once and left alone" - Weaver's Latin and other
# non-English passages are left untranslated, corroborated by University of
# Michigan Press's dedicated companion volume of translations for exactly
# that gap.
#
# TRANSLATORS ACROSS THE NOVELS. William Weaver translated the first
# four novels (The Name of the Rose 1983, Foucault's Pendulum 1989, The
# Island of the Day Before 1995, Baudolino 2002) and a large share of the
# nonfiction (Travels in Hyperreality, Misreadings, How to Travel with a
# Salmon, Serendipities, Postscript to The Name of the Rose, the partial
# Apocalypse Postponed) and both 1966 children's books. He did not translate
# any of the last three novels: Geoffrey Brock translated The Mysterious
# Flame of Queen Loana (2005), and Richard Dixon translated The Prague
# Cemetery (2011), Numero Zero (2015), Inventing the Enemy (2012) and
# Chronicles of a Liquid Society (2017), and also produced the 2014 revision
# of The Name of the Rose (see that entry). Weaver died in November 2013, but
# the switch to a different translator (Brock, 2005) predates that by eight
# years; no source checked here explains why. This is a real, sourced
# instance of the same pattern this catalogue's Dan Brown and Murakami wings
# already documented - no single "the" translator covers an author's whole
# backlist - and it means a completionist reader meets at least three
# distinct English voices across seven novels, not one.
#
# EXCLUDED, considered and not catalogued:
# - "11/9 La cospirazione impossibile" (2007): a group pamphlet with eight
#   co-authors (Piergiorgio Odifreddi, Michael Shermer, James Randi and five
#   others); too collective to catalogue as Eco's own book.
# - "La filosofia di Umberto Eco: Con la sua Autobiografia intellettuale"
#   (2021): its own title names it as a study OF Eco's philosophy, not a book
#   BY him, and English Wikipedia's account of the related 2017 Open Court
#   "Library of Living Philosophers" retrospective describes a multi-author
#   volume edited by Sara G. Beardsworth and Randall E. Auxier. That series'
#   usual format includes a subject-written "intellectual autobiography"
#   chapter, which may be Eco's own contribution here, but this was not
#   confirmed against the book itself.
# - "Da dove si comincia?" (2013, with Stefano Bartezzaghi): a co-authored
#   interview/dialogue book, structurally like Belief or Nonbelief? below,
#   but not independently verified.
# - "Il linguaggio della Terra Australe" (2004), "Il codice Temesvar" (2005),
#   "Nel segno della parola" (2005, with Daniele Del Giudice and Gianfranco
#   Ravasi) and "Sator Arepo eccetera" (2006): listed as standalone titles on
#   the Wikipedia bibliography page's "uncollected essays" list, but at least
#   one of these ("The Language of the Austral Land") is also the title of an
#   essay already catalogued inside Serendipities (1998); whether the others
#   are genuine standalone books or reprints/pamphlets of already-catalogued
#   material was not checked further here.
# - Prefaces, single conference papers and catalogue essays not gathered into
#   any of the volumes below (e.g. "Notes sur la sémiotique de la réception",
#   1987; the Eugenio Carmi and Beato di Liébana exhibition/manuscript notes,
#   1973; "Vocali" in Soluzioni felici, 1991; the German-only Streichholzbriefe
#   pamphlets, 1997-98) - no single dated book exists for an entry to anchor
#   to, the same standard this catalogue already applies to Saramago's
#   uncollected crónicas.
# - "Storia di una rivoluzione mai esistita: L'esperimento Vaduz. Appunti del
#   Servizio opinioni, n.292, settembre 1976" (1976, Rai - Servizio Opinioni):
#   an internal RAI opinion-research bulletin, not a trade-published book -
#   same standard as the RAI-era institutional pamphlets above.
# - "Streit der Interpretationen" (1987, Universitätsverlag Konstanz) and
#   "Conceito de texto" (1984, São Paulo, Queiroz): lecture texts published
#   only in German and Portuguese respectively, with no Italian or English
#   edition found - the same standard already applied to the Streichholzbriefe
#   pamphlets above.
# - "Carolina Invernizio, Matilde Serao, Liala" (1979, Firenze), credited on
#   the Italian Wikipedia bibliography as "con altri" (with others): a
#   multi-author collective volume, too collective to catalogue as Eco's own
#   book, the same standard applied to "11/9 La cospirazione impossibile"
#   above.
# - "La riscoperta dell'America" (1984), with Gian Paolo Ceserani and
#   Beniamino Placido: a three-way co-authored book; Eco's own separable
#   contribution was not independently verified, the same standard applied to
#   "Da dove si comincia?" above.
# - Film, television and stage adaptations of Eco's own novels (by other
#   hands) are out of scope by this catalogue's standing rule.

# --- Novels (7) ---

- id: umberto-eco/the-name-of-the-rose
  title: "Il nome della rosa"
  authorIds: [umberto-eco]
  published: 1980
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A Franciscan friar and his novice investigate a string of deaths at a
    fourteenth-century Benedictine abbey, uncovering a decades-old secret
    hidden inside the abbey's labyrinthine library. Eco's debut novel,
    combining a murder mystery with medieval theology and semiotics; it sold
    over 50 million copies worldwide.
  translationNote: >
    William Weaver's 1983 translation is not the whole story of this novel's
    English text. Eco corrected a number of anachronisms in the Italian
    original for a 2011 revised edition (the "impossible" bell-pepper dish
    among them, since peppers reached Europe over a century after the
    novel's 1327 setting), and Richard Dixon then produced the "author's
    revisions to The Name of the Rose" for the English edition in 2014 -
    Weaver had died the previous year. The novel is also dense with real and
    invented Latin quotation throughout its theological debates (Wikipedia's
    own account of the book's allusions notes this directly). This Latin,
    along with the book's other non-English passages (Greek, Provençal,
    German, medieval vernaculars), is left untranslated and unglossed in the
    standard English text: University of Michigan Press published a
    dedicated 216-page companion, "The Key to The Name of the Rose:
    Including Translations of All Non-English Passages" (Haft, White and
    White, 1999), specifically because Weaver's edition supplies none - a
    reader with no Latin is meant to feel the same friction as against the
    Italian original.
  sources:
    - https://en.wikipedia.org/wiki/The_Name_of_the_Rose
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Richard_Dixon_(translator)
    - https://en.wikipedia.org/wiki/William_Weaver
    - https://press.umich.edu/Books/T/The-Key-to-The-Name-of-the-Rose

- id: umberto-eco/foucaults-pendulum
  title: "Il pendolo di Foucault"
  authorIds: [umberto-eco]
  published: 1988
  subseries: null
  canonTier: core
  synopsis: >
    Three bored Milanese book editors feed occult manuscripts into a
    computer program to invent a fake conspiracy linking the Knights
    Templar to a plot for world domination, and find the invention taking
    on a dangerous life of its own. Translated by William Weaver.
  sources:
    - https://en.wikipedia.org/wiki/Foucault%27s_Pendulum
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/the-island-of-the-day-before
  title: "L'isola del giorno prima"
  authorIds: [umberto-eco]
  published: 1994
  subseries: null
  canonTier: core
  synopsis: >
    Shipwrecked in 1643 and stranded within swimming distance of an island
    he cannot reach, an Italian nobleman occupies himself with memory,
    philosophy and an obsession with the international date line running
    just offshore. Translated by William Weaver.
  sources:
    - https://en.wikipedia.org/wiki/The_Island_of_the_Day_Before
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/baudolino
  title: "Baudolino"
  authorIds: [umberto-eco]
  published: 2000
  subseries: null
  canonTier: core
  synopsis: >
    A gifted liar from Piedmont recounts his own life, from a peasant
    childhood through the court of Frederick Barbarossa to a legendary quest
    for the kingdom of Prester John, to the Byzantine historian Niketas
    Choniates during the sack of Constantinople. Translated by William
    Weaver.
  sources:
    - https://en.wikipedia.org/wiki/Baudolino
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/the-mysterious-flame-of-queen-loana
  title: "La misteriosa fiamma della Regina Loana"
  authorIds: [umberto-eco]
  published: 2004
  subseries: null
  canonTier: core
  synopsis: >
    An antiquarian book dealer wakes from a stroke with his personal memory
    gone but his memory for everything he ever read intact, and reconstructs
    his own childhood under Fascism through the comics, records and
    magazines of the era. Translated by Geoffrey Brock, the first of Eco's
    novels not translated by Weaver.
  sources:
    - https://en.wikipedia.org/wiki/The_Mysterious_Flame_of_Queen_Loana
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/the-prague-cemetery
  title: "Il cimitero di Praga"
  authorIds: [umberto-eco]
  published: 2010
  subseries: null
  canonTier: core
  synopsis: >
    A forger in nineteenth-century Europe fabricates the documents behind
    real historical antisemitic conspiracies, including material that fed
    the Protocols of the Elders of Zion. Translated by Richard Dixon.
  sources:
    - https://en.wikipedia.org/wiki/The_Prague_Cemetery
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/numero-zero
  title: "Numero zero"
  authorIds: [umberto-eco]
  published: 2015
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A washed-up journalist is hired to work on a Milanese newspaper that its
    owner has no intention of ever actually publishing, and is drawn into a
    colleague's conspiracy theory about Mussolini's faked death. Eco's last
    novel published in his lifetime, translated by Richard Dixon.
  sources:
    - https://en.wikipedia.org/wiki/Numero_Zero
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

# --- Academic, semiotic and essay works (50) ---
# Chronological. English title given on the same line as the Italian
# original where a translation exists; untranslated where none was found.

- id: umberto-eco/il-problema-estetico-in-san-tommaso
  title: "Il problema estetico in San Tommaso"
  authorIds: [umberto-eco]
  published: 1956
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Eco's first book, a scholarly study of Thomas Aquinas's aesthetics
    developed from his 1954 university thesis. Revised and translated as
    The Aesthetics of Thomas Aquinas (1988).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/opera-aperta
  title: "Opera aperta"
  authorIds: [umberto-eco]
  published: 1962
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Argues that a literary or musical work can be structurally "open" -
    inviting the audience to complete its meaning rather than dictating a
    single reading. One of Eco's most cited ideas. Translated as The Open
    Work (1989); revised by Eco himself in 1976.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/diario-minimo
  title: "Diario minimo"
  authorIds: [umberto-eco]
  published: 1963
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Satirical essays on mass culture, including "Fenomenologia di Mike
    Bongiorno", his best-known early piece on a popular quiz-show host.
    Translated as Misreadings (1993).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/apocalittici-e-integrati
  title: "Apocalittici e integrati"
  authorIds: [umberto-eco]
  published: 1964
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    A sociological study of mass communication and popular culture, framed
    around the "apocalyptic" critics who despise it and the "integrated"
    who embrace it uncritically. Partially translated as Apocalypse
    Postponed (1994).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/le-poetiche-di-joyce
  title: "Le poetiche di Joyce"
  authorIds: [umberto-eco]
  published: 1965
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A study of James Joyce's aesthetics from A Portrait of the Artist
    through Finnegans Wake. Translated in two separate English editions,
    The Middle Ages of James Joyce and The Aesthetics of Chaosmos (both
    1989).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/la-struttura-assente
  title: "La struttura assente"
  authorIds: [umberto-eco]
  published: 1968
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A full introduction to semiological research, covering visual
    communication, architecture, film and advertising codes. No English
    translation was found; its material is often described as
    carried forward into Eco's later semiotic writing, not verified here
    against a side-by-side comparison.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/le-forme-del-contenuto
  title: "Le forme del contenuto"
  authorIds: [umberto-eco]
  published: 1971
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Essays on the semiotics of content and meaning-structure. No English
    translation was found.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/il-costume-di-casa
  title: "Il costume di casa"
  authorIds: [umberto-eco]
  published: 1973
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Essays reading Italian and American popular culture and ideology, from
    Disneyland to Superman. Translated as Faith in Fakes: Travels in
    Hyperreality (1986).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/il-segno
  title: "Il segno"
  authorIds: [umberto-eco]
  published: 1973
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A general introduction to the sign as a semiotic concept. No English
    translation was found.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/trattato-di-semiotica-generale
  title: "Trattato di semiotica generale"
  authorIds: [umberto-eco]
  published: 1975
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Eco's major work of semiotic theory, covering codes, sign production and
    the limits of a general theory of signs; the book that won him his
    professorship at Bologna. Translated as A Theory of Semiotics (1976).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/il-superuomo-di-massa
  title: "Il superuomo di massa"
  authorIds: [umberto-eco]
  published: 1976
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Studies of the popular novel and its "superman" heroes, from Eugène Sue
    to Superman the comic-book character. No English translation exists.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/stelle-e-stellette
  title: "Stelle & stellette: La via lattea mormorò"
  authorIds: [umberto-eco]
  published: 1976
  subseries: null
  canonTier: extended
  format: picture-book
  synopsis: >
    An illustrated fable of the Milky Way, with drawings by the French
    comics artist Philippe Druillet. Published in English translation as
    "Stars and Stripes".
  sources:
    - https://it.wikipedia.org/wiki/Umberto_Eco
    - https://www.isfdb.org/cgi-bin/ea.cgi?Umberto_Eco

- id: umberto-eco/dalla-periferia-dellimpero
  title: "Dalla periferia dell'impero"
  authorIds: [umberto-eco]
  published: 1977
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    A collection of Eco's political and media essays from the mid-1970s,
    published by Bompiani. No English translation was found.
  sources:
    - https://it.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/come-si-fa-una-tesi-di-laurea
  title: "Come si fa una tesi di laurea"
  authorIds: [umberto-eco]
  published: 1977
  subseries: null
  canonTier: extended
  format: reference
  synopsis: >
    A practical guide to researching and writing an academic thesis,
    enormously popular with Italian students for decades. Translated as
    How to Write a Thesis (2015).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/lector-in-fabula
  title: "Lector in fabula"
  authorIds: [umberto-eco]
  published: 1979
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A study of the interpretive cooperation a narrative text requires of its
    reader. Its material forms part of the English-language composite volume
    The Role of the Reader, published the same year (see that entry's own
    note on the relationship between the two).
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/the-role-of-the-reader
  title: "The Role of the Reader: Explorations in the Semiotics of Texts"
  authorIds: [umberto-eco]
  published: 1979
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    An English-language volume assembling material from five of Eco's
    Italian books (Opera aperta, Apocalittici e integrati, Le forme del
    contenuto, Il superuomo di massa and Lector in fabula) into the
    Anglophone academy's standard reference for his reader-response
    semiotics.
  note: >
    Catalogued separately from the five Italian originals it draws on
    because it is the text most cited in English-language scholarship on
    Eco, with its own introduction and chapter selection, not a straight
    translation of any single one of them. Whether it is better treated as
    a distinct work or folded into a note on its Italian sources was not
    settled here.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco/de-bibliotheca
  title: "De bibliotheca"
  authorIds: [umberto-eco]
  published: 1981
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    A short personal essay on Eco's own library, published in Italian and
    French. No English translation was found.
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/postille-a-il-nome-della-rosa
  title: "Postille a «Il nome della rosa»"
  authorIds: [umberto-eco]
  published: 1983
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    Eco's own reflective essay on writing The Name of the Rose, appended to
