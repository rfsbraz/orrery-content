  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography

- id: umberto-eco/arte-e-bellezza-nellestetica-medievale
  title: "Arte e bellezza nell'estetica medievale"
  authorIds: [umberto-eco]
  published: 1987
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A survey of medieval aesthetic thought beyond the Aquinas-focused study
    of Eco's first book, from Carolingian art theory through the medieval
    idea of beauty as proportion and light. Translated as Art and Beauty in
    the Middle Ages; featured enough in Eco's own career that the Italian
    Wikipedia biography's lead image is his autograph on the book's German
    edition.
  note: >
    OpenLibrary's earliest catalogued edition of the English/French
    translation is dated 1986, a year ahead of this 1987 Italian date from
    Bompiani's own publication record (Italian Wikipedia's bibliography,
    citing publisher and place). Which edition genuinely came first was not
