# FRANCHISE-SPECIFIC events: what happened to a WORK and its reception,
# rather than to Eco the person. Author-LIFE events (the RAI corsari years,
# the 1978 "I wanted to poison a monk" origin of Il nome della rosa, the 1986
# Annaud film and the fame it brought, his death, and others) live on
# content/authors/umberto-eco.yaml instead. No global.yaml duplication: none
# of the entries below is a world event in the catalogue's sense, each is
# specific to how one Eco book was written, translated or received.
#
# Cross-checked against the English Wikipedia articles for each work named
# below, "Belief or Nonbelief?", "The Mysterious Flame of Queen Loana" and
# "William Weaver"/"Richard Dixon (translator)" for the translator record,
# Italian Wikipedia's "Opera aperta" article (its own "Genesi e storia
# editoriale" and "Ricezione" sections, citing André Peyronie's 2024
# academic study of Eco's early career) for the 1962 and 1967 entries,
# English Wikipedia's "The Name of the Rose" for its 1981/1982 prizes, the
# main Umberto Eco article's own infobox citation of Interpretation and
# Overinterpretation for the 1992 Rorty exchange, and Italian Wikipedia's
# Umberto Eco bibliography for the 2018 "Il fascismo eterno" repackaging.

- id: umberto-eco-opera-aperta-reception-1962
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 1962
  title: Opera aperta ignites a sixty-article critical brawl and gives Gruppo 63 its vocabulary
  scope: culture
  reach: franchise
  impact: high
  description: >
    [[work:umberto-eco/opera-aperta|Opera aperta]] provoked, in Eco's own
    later account, an immediate and unusually wide argument: more than
    sixty articles about the book appeared in the Italian press between
    its June 1962 publication and February 1963 alone, running from
    enthusiastic endorsement to outright rejection. Critics aligned with
    the emerging Neoavanguardia, among them Renato Barilli and Elio
    Pagliarani, took up its vocabulary of the "open work" as a theoretical
    basis for the experimental writing that coalesced the following year
    into Gruppo 63; critics writing from a Marxist position countered that
    Eco was smuggling in models borrowed from music and applying them
    where they did not belong, to literature.
  spoilerAfter: null
  sources:
    - https://it.wikipedia.org/wiki/Opera_aperta

- id: umberto-eco-opera-aperta-levi-strauss-1967
  organisation: beside
  illustration_type: symbolic-still-life
  images_required: 1
  date: 1967
  title: Claude Lévi-Strauss attacks the "open work" as a category error
  scope: culture
  reach: franchise
  impact: med
  description: >
    In 1967 the anthropologist Claude Lévi-Strauss published a direct
    challenge to [[work:umberto-eco/opera-aperta|Opera aperta]]'s central
    idea: a work, he argued, has precise structural properties, as fixed
    as the rigidity of a crystal, that an analyst must describe without
    confusing them with the interpretations later readers project onto
    it. Eco replied that structural analysis is itself always performed
    by interpreters situated in their own historical moment, and so
    cannot fully escape the history of a work's readings - a rejoinder he
    kept refining for the rest of his career, through Lector in fabula
    (1979) and into his later writing on the limits of interpretation.
  spoilerAfter: null
  sources:
    - https://it.wikipedia.org/wiki/Opera_aperta

- id: umberto-eco-name-of-the-rose-prizes-1981
  organisation: medallion
  illustration_type: emblem-seal
  images_required: 1
  date: 1981
  dateRange: "1981-1982"
  title: Il nome della rosa wins the Strega Prize, then France's Médicis Étranger
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:umberto-eco/the-name-of-the-rose|Il nome della rosa]] won Italy's
    Strega Prize in 1981, the country's most prestigious literary award,
    then the Prix Médicis Étranger in 1982 for the year's best foreign
    novel published in France - back-to-back validation from the literary
    establishment, distinct from and well ahead of the mass audience the
    1986 Annaud film would later bring the book.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Name_of_the_Rose

- id: umberto-eco-rorty-overinterpretation-1992
  organisation: beside
  illustration_type: editorial-portrait
  images_required: 1
  date: 1992
  title: Richard Rorty publicly rebuts the limits Eco sets on interpretation
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:umberto-eco/interpretation-and-overinterpretation|Interpretation
    and Overinterpretation]] collected Eco's 1990 Tanner Lectures alongside
    formal replies from the philosopher Richard Rorty and the critics
    Jonathan Culler and Christine Brooke-Rose, edited by Stefan Collini.
    Rorty pushed back hard on Eco's claim that a text sets real limits on
    how it can be read - what Eco called its intentio operis - rather than
    being open to whatever use a reader makes of it; publishing the
    argument itself, replies included, gave Eco's rebuttal, and the
    intentio lectoris he coined to name it, its canonical and most-cited
    form.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco

- id: umberto-eco-martini-dialogue-1996
  organisation: diptych
  illustration_type: editorial-portrait
  images_required: 2
  date: 1996
  title: A published dialogue with Cardinal Martini on belief without God
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:umberto-eco/belief-or-nonbelief|In cosa crede chi non crede?]]
    paired Eco, by his own account an agnostic, with Carlo Maria Martini,
    the Archbishop of Milan and one of the Catholic Church's most prominent
    intellectuals, in a book built entirely from an exchange of letters:
    each man wrote only his own side of the argument, on ethics, abortion
    and belief without God, with no reply from the other worked into the
    text. The English edition, Belief or Nonbelief? A Dialogue (2000), was
    named one of the Los Angeles Times' Best Nonfiction books of the year.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Belief_or_Nonbelief%3F
    - https://en.wikipedia.org/wiki/Carlo_Maria_Martini

- id: umberto-eco-queen-loana-translator-2005
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 2005
  title: Its English edition breaks a run of William Weaver translations
  scope: industry
  reach: franchise
  impact: med
  description: >
    When [[work:umberto-eco/the-mysterious-flame-of-queen-loana|The
    Mysterious Flame of Queen Loana]] appeared in English in spring 2005, it
    was translated by Geoffrey Brock rather than William Weaver, who had
    translated every one of Eco's previous three novels since The Name of
    the Rose (1983). Weaver did not die until 2013, eight years later, and
    no source explains the change directly; it made Brock the first of two
    further translators (Richard Dixon followed for the last two novels) to
    take over an Eco novel while Weaver was still alive and still
    translating Eco's own nonfiction.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Mysterious_Flame_of_Queen_Loana
    - https://en.wikipedia.org/wiki/William_Weaver
    - https://en.wikipedia.org/wiki/Richard_Dixon_(translator)

- id: umberto-eco-ur-fascism-reissue-2018
  organisation: artifact-spread
  illustration_type: book-object
  images_required: 1
  date: 2018
  title: Ur-Fascism resurfaces as a stand-alone book in a new political climate
  scope: culture
  reach: franchise
  impact: med
  description: >
    "Ur-Fascism" (also translated as "Eternal Fascism: Fourteen Ways of
    Looking at a Blackshirt"), the 1995 lecture and essay collected in
    [[work:umberto-eco/cinque-scritti-morali|Cinque scritti morali]] that
    lists fourteen recurring traits of fascist ideology, gained renewed
    attention in the twenty-first century and was reissued in Italy as a
    stand-alone volume, Il fascismo eterno, in 2018, more than twenty years
    after its first publication.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco
    - https://it.wikipedia.org/wiki/Umberto_Eco
