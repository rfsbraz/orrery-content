# Branding for the Umberto Eco wing (see Orrery CONCEPT §6 - the design law,
# and docs/SCHEMA.md#themeyaml). Eco's own recurring image is a structure
# built to be gotten lost in and read as a puzzle: the abbey library of
# The Name of the Rose is explicitly built as a labyrinth in the novel
# itself, and semiotics - his life's academic subject - is the study of
# working out what a sign means, the same act a maze demands of a reader's
# feet. The palette is a library at night rather than a monastery by day:
# near-black aged-oak ground, warm candlelit parchment for text, and one
# aged-bronze/verdigris accent standing in for old metal fittings, an
# inkwell hinge, a bell, or the bronze bob of the real Foucault pendulum the
# second novel takes its name from. No motif here restates a single title's
# plot (no rose, no visible pendulum swinging) - the register is the
# scholar's own recurring furniture, not an illustration of either book.
# `art:` is deliberately left unset.
preset: abbey-labyrinth
palette:
  bg: "#120f0c"          # near-black aged oak / library dark
  surface: "#1c1712"     # a hair lifted, for cards
  ink: "#ece1c8"         # warm candlelit parchment - high contrast, readable
  muted: "#8f8272"       # dust/vellum grey, for metadata
  accent: "#6f7a4c"      # aged bronze/verdigris - old metal fittings, not a genre-green
displayFace: fraunces    # from the app's implemented set (fraunces | spectral | sourceSerif)
signature: thread        # a quiet hairline - Ariadne's thread through a
                          # labyrinth, the connective structure Eco's own
                          # semiotics treats as its subject; distinct from
                          # jrr-tolkien's beam (also a scholar's-desk wing)
                          # and from every other near-black library-dark wing
                          # on this shelf
notes: >
  A library read at night rather than a monastery read by day: near-black
  aged-oak ground, warm parchment ink, one aged-bronze accent used sparingly,
  a classic serif, and a single connecting thread rather than a bold rail or
  a hard architectural rule. Restraint over genre costume - no rose, no
  swinging pendulum, no monk's habit.
