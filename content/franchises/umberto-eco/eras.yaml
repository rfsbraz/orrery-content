# Creative periods. There are none on record.
#
# No critic, scholar, reference work, obituarist, settled readership or Eco
# himself divides this career into named creative periods with recognisable
# names and boundary years, the way "the Golden Age of detective fiction" or
# "the Bachman years" are received. Searched in English and in Italian, the
# language he wrote nearly all of this shelf in; both corpora return
# chronological biography, thematic criticism and book-by-book commentary.
#
# THE SPLIT EVERYONE REACHES FOR, AND WHY THE RECORD REFUSES IT.
# The obvious shape is "semiotician until 1980, novelist afterwards": two
# decades of academic work from [[work:umberto-eco/il-problema-estetico-in-san-tommaso|Il
# problema estetico in San Tommaso]] (1956) to
# [[work:umberto-eco/lector-in-fabula|Lector in fabula]] (1979), then a fiction
# career beginning at 48 with [[work:umberto-eco/the-name-of-the-rose|Il nome
# della rosa]] (1980). The bibliography contradicts it outright. Twenty books
# precede the first novel and forty follow it without being fiction, and the
# theory does not thin: [[work:umberto-eco/semiotica-e-filosofia-del-linguaggio|Semiotica
# e filosofia del linguaggio]] (1984),
# [[work:umberto-eco/arte-e-bellezza-nellestetica-medievale|Arte e bellezza
# nell'estetica medievale]] (1987),
# [[work:umberto-eco/i-limiti-dellinterpretazione|I limiti
# dell'interpretazione]] (1990),
# [[work:umberto-eco/la-ricerca-della-lingua-perfetta|La ricerca della lingua
# perfetta]] (1993), [[work:umberto-eco/kant-e-lornitorinco|Kant e
# l'ornitorinco]] (1997), [[work:umberto-eco/serendipities|Serendipities]]
# (1998), [[work:umberto-eco/dire-quasi-la-stessa-cosa|Dire quasi la stessa
# cosa]] (2003), [[work:umberto-eco/dallalbero-al-labirinto|Dall'albero al
# labirinto]] (2007) and
# [[work:umberto-eco/scritti-sul-pensiero-medievale|Scritti sul pensiero
# medievale]] (2012) all come after the novel that is supposed to have ended
# the academic period. The two registers run in parallel for thirty-six years.
#
# The sources say the same thing in their own words, and several say it while
# handling the very framing that would license the split:
#
#  - Treccani's Enciclopedia Italiana entry (Giuseppe Antonio Camerino, V
#    Appendice, 1992) sets the alternation out in one sentence: "Dopo ulteriori
#    volumi di ricerca teorica, fra cui Semiotica e filosofia del linguaggio
#    (1984) e Arte e bellezza nell'estetica medievale (1987), E. è tornato al
#    romanzo con Il pendolo di Foucault (1988)"
#    (https://www.treccani.it/enciclopedia/umberto-eco_(Enciclopedia-Italiana)/).
#  - The New York Times obituary is headlined "Umberto Eco, 84, Best-Selling
#    Academic Who Navigated Two Worlds, Dies" and states that "rather than
#    segregate his academic life from his popular fiction, Mr. Eco infused his
#    seven novels with many of his scholarly preoccupations". It closes on
#    Eco's own account of the arrangement: "I think of myself as a serious
#    professor who, during the weekend, writes novels" (Jonathan Kandell, 19
#    February 2016,
#    https://web.archive.org/web/20180823105846/https://www.nytimes.com/2016/02/20/arts/international/umberto-eco-italian-semiotician-and-best-selling-author-dies-at-84.html).
#  - Harvard University Press describes
#    [[work:umberto-eco/confessions-of-a-young-novelist|Confessions of a Young
#    Novelist]] (2011), the book in which Eco looks back on the fiction, as
#    the author considering "his long career as a theorist and his more recent
#    work as a novelist" and exploring "their fruitful conjunction"
#    (https://www.hup.harvard.edu/books/9780674058699).
#  - Ian Thomson's Guardian obituary and Britannica both narrate the whole life
#    straight through and name no phase in it. Thomson's summary of the years
#    after the fourth novel is "his literary output continued to be prolific";
#    Britannica's only developmental claim is that "his initial studies and
#    researches were in aesthetics", from which "he went on to explore other
#    areas of communication and semiotics", a line of thought rather than a
#    period with edges
#    (https://www.theguardian.com/books/2016/feb/20/umberto-eco-obituary;
#    https://web.archive.org/web/20231224033831/https://www.britannica.com/biography/Umberto-Eco).
#
# The two-phase story does exist, in headline space: the print headline over
# the same New York Times obituary reads "Umberto Eco, Semiotics Scholar Who
# Became a Best-Selling Novelist". The body of that obituary is the correction.
#
# WHAT ELSE WAS CHECKED.
#  - English Wikipedia's dated career headings are the only period-shaped
#    scheme in any source read, and they are unusable: they overlap each other
#    (1954-1968, 1961-1964, 1965-1975), no other source uses them, they carry
#    no citation of their own, and one borrows Eco's phrase "semiological
#    guerrilla warfare" (from [[work:umberto-eco/la-struttura-assente|La
#    struttura assente]], 1968) as a heading rather than as a name anyone gives
#    a period.
#  - The two standard scholarly collections divide the work by register, not by
#    time. The Metzler Umberto Eco-Handbuch (2021) runs "Schriften zur
#    Ästhetik", "Frühe semiotische Schriften", "Spätere Schriften zur Semiotik
#    und Sprachphilosophie", "Schriften zur Interpretationstheorie",
#    "Schriften zu Politik und Zeitgeschehen" and one chapter per novel;
#    Cambridge's New Essays on Umberto Eco (ed. Peter Bondanella, 2009) is
#    thematic throughout ("Eco's semiotic theory", "Eco and popular culture",
#    "Eco's middle Ages and the historical novel"). Neither dates a boundary.
#    The book-length studies are titled for a concept rather than a period
#    (Bondanella, Umberto Eco and the Open Text, 1997; Michael Caesar, Umberto
#    Eco: Philosophy, Semiotics and the Work of Fiction, 1999), unlike the
#    Twayne volumes that periodise Stephen King in their own subtitles.
#  - The publishing record offers no boundary either. Bompiani published him
#    from 1959, when he became its senior non-fiction editor, to
#    [[work:umberto-eco/numero-zero|Numero zero]] (2015), all seven novels
#    included, which is very nearly the whole shelf. La nave di Teseo, the
#    house he co-founded in late 2015 after refusing to stay inside the merged
#    Mondadori-RCS group he called "la Mondazzoli" (la Repubblica, 20 February
#    2016), publishes only what appears after his death:
#    [[work:umberto-eco/pape-satan-aleppe|Pape Satàn Aleppe]] (2016) through
#    [[work:umberto-eco/sullarte|Sull'arte]] (2022). Naming a period after it
#    would plate four posthumous collections and no working year.
#  - Gruppo 63, which Eco helped found in 1963 and served as theorist of
#    (Treccani, above), is a movement he belonged to rather than a period drawn
#    through his own books, and the book most often attached to it,
#    [[work:umberto-eco/opera-aperta|Opera aperta]], precedes the group by a
#    year.
#
# The late fiction debut at 48 is real, well documented and worth a reader's
# attention, but it is a fact about a life rather than a body of work: there is
# no period of Eco-the-novelist to plate, because every year of it is also a
# year of Eco-the-theorist. It belongs to the biography, the way Saramago's
# thirty-year absence from the novel does.
#
# eras: [] is the honest record of a career that published in two registers at
# once for its last thirty-six years, and that nobody has cut in half.
[]
