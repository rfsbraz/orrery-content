id: umberto-eco
name: Umberto Eco
kind: author
description: >
  The Italian semiotician whose seven novels, beginning with
  [[work:umberto-eco/the-name-of-the-rose|The Name of the Rose]] (1980), sit
  beside four decades of academic and popular writing on signs,
  interpretation and medieval aesthetics - the scholarship that shaped the
  fiction, not a separate career.
authorIds: [umberto-eco]
themePreset: abbey-labyrinth
features: {}

images:
  header: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Dou%2C_Gerard_-_Astronomer_by_Candlelight_-_late_1650.jpg/1920px-Dou%2C_Gerard_-_Astronomer_by_Candlelight_-_late_1650.jpg"
  headerCredit: "Gerrit Dou, public domain (National Gallery of Art)"
  headerSource: "https://commons.wikimedia.org/wiki/File:Dou,_Gerard_-_Astronomer_by_Candlelight_-_late_1650.jpg"
  # "The Astronomer by Candlelight" (c.1650s): a single candle over a
  # crowded desk of books, hourglass and globe, the rest of the room in
  # near-black shadow - theme.yaml's own atmosphere ("a private scholar's
  # study at night: warm lamplight over a crowded desk, the rest of a
  # book-lined room left in near-black shadow") almost to the word, without
  # touching the abbey library that file's avoid list rules out. Not the
  # wing's own forger-at-his-desk emblem (no second document, no
  # copying-in-progress) - a study interior in the same register, not a
  # depiction of any of the seven novels. Rejected first: Godfried Schalken's
  # similarly-themed "A Scholar by Candlelight" (a private dealer's own
  # Commons upload, photographed in its frame with glare and no verifiable
  # provenance beyond "own collection"); an anonymous "Scholar's Study at
  # Oxford or Cambridge" drawing (MET, CC0) that reads as a bright Victorian
  # parlour, not a night interior; and Willem de Poorter's "A Scholar in His
  # Study" (Rijksmuseum, public domain) for being too dim even by this
  # wing's own dark standard once cropped to a wide band.
globalEvents:
  include:
    - world-war-ii-1939            # Ur-Fascism (1995) opens on his own eyewitness memory of partisans liberating his Piedmont town in April 1945, written to mark the war's European end at 50 years, not a general "he lived through it"
    - ebook-and-self-publishing-2007  # Non sperate di liberarvi dei libri / This Is Not the End of the Book (2009, with Jean-Claude Carriere), a book-length dialogue on whether the codex survives the digital-reading shift the Kindle opened
  exclude:
    - sept-11-2001                 # no sourced column, essay or interview ties the attacks to any specific work; his frequent public commentary (Bustina di Minerva) is not itself evidence of a worked connection
    - financial-crisis-2008        # world-events' own "weakest entry" grading holds here too; no novel or essay answers it
    - penguin-paperback-1935       # British trade-paperback shift; no sourced connection to an Italian academic publishing through Bompiani
    - armed-services-editions-1943 # American wartime book distribution; he was a child in rural Piedmont, not the readership this reached
    - lady-chatterley-trial-1960   # British obscenity-law landmark; no sourced connection to his own work or advocacy
    - fantasy-paperback-boom-1965  # writes semiotic/historical fiction, not fantasy; not the category this event created
    - carnation-revolution-1974    # Portuguese-specific; Italian author with no sourced connection to it
    - chain-bookshop-1982          # generic publishing-industry background; no sourced connection to how his books reached readers
    - online-bookselling-1995      # generic publishing-industry background; the documented digital-books reaction is the 2009 Carriere dialogue, already carried by ebook-and-self-publishing-2007
    - prestige-fantasy-adaptation-2011  # writes semiotic/historical fiction, not fantasy; unrelated genre and he had died before its cultural peak
    - portugal-bailout-2011        # Portuguese-specific; Italian author with no sourced connection to it
    - comics-code-authority-1954   # his "Myth of Superman" essay (in Apocalittici e integrati, 1964) reads an already Code-compliant hero's narrative structure; no sourced link to the Code's own censorship fight
    - world-war-i-1914             # ended eighteen years before his birth; the war his work does answer is the second, which he lived through and wrote from (already included)
    - elementary-education-act-1870  # English and Welsh schooling law; nothing in the work inherits it, and the mass readership his criticism reads is twentieth-century Italian and American media, not the Victorian reading public this Act created
    - pulp-magazines-1926          # the popular forms he wrote about are the nineteenth-century feuilleton (Il superuomo di massa, from Sue onward), American comic books ("The Myth of Superman", in Apocalittici e integrati) and the Italian comics, songs and boys' magazines Queen Loana is built from - none of them the Anglo-American genre-magazine sorting Amazing Stories began; same broad category, not the same event, the ground already taken on comics-code-authority-1954
    - covid-19-pandemic-2020       # died in February 2016; the four posthumous volumes gather writing dated 1955-2016 and none of it reaches this
    - booktok-2020                 # died in February 2016; no work or posthumous edition engages with it

# startHere: entry-path research.
#
# THE ENTRY POINT. The Name of the Rose is not a famous-book trap here; it
# was checked rather than assumed. The Guardian's 2016 obituary (Ian
# Thomson) frames it as built for broad reach, not despite its erudition but
# by design: "the book's baggage of arcane erudition was designed to
# flatter the average reader's intelligence," a "consensual success" not
# seen "since One Hundred Years of Solitude," selling over 10 million
# copies and turning Eco into, in the obituary's own phrase, "the emperor of
# international bestsellerdom." A live community recommendation
# (reddit.com/r/suggestmeabook/comments/lscwvt/is_umberto_eco_worth_reading)
# confirms the same title as the answer to "where do I start" while also
# naming the real cost, which the startHere path below carries forward: "the
# first 100-150 pages or so are meant to be hard to read."
#
# CONSIDERED AND REJECTED AS ALTERNATE ENTRY POINTS. Baudolino: AS Byatt's
# Guardian review (theguardian.com/books/2002/oct/19/fiction.asbyatt) calls
# it "Eco's most readable tale" but in the same sentence "his least
# satisfactory" and states plainly the novel "is not, as a novel, anywhere
# near as successful as The Name of the Rose" - a critic noting easier prose
# inside a mixed-to-negative verdict on the book, not a recommendation to
# start there, and promoting the phrase past what it actually argues would
# misuse it. Numero Zero: no citable critical or community consensus was
# found recommending it as an easier alternative; the only sources
# surfaced calling it more accessible were low-traffic blog listicles
# (e.g. editorsreads.com), which CURATION.md's own trap registry already
# rules out as sourcing ("anniversary listicles and aggregators are not
# sources"). Neither novel gets a startHere path.
#
# PREQUEL-SPOILER CHECK. All seven novels are standalone: different
# narrators, different centuries, no shared characters, no author-stated
# internal chronology, and no sourced example of one novel's ending being
# assumed as background by an earlier-set one. The vector this catalogue
# watches for (a later-published book set earlier, spoiling what an earlier
# book spends its length revealing) does not exist here because nothing in
# this wing is set before something else Eco had already published; each
# novel is its own closed world. Nothing to gate.
startHere:
  paths:
    - id: essentials
      title: Where to start
      description: >
        The Franciscan friar and his novice investigating a string of
        deaths at a fourteenth-century abbey - Eco's debut, his most famous
        book by a wide margin, and, on the evidence above, still the right
        door in rather than a trap dressed as one.
      workIds:
        - umberto-eco/the-name-of-the-rose
      orderId: null
      fit:
        experience: [new]
        commitment: [taste]
      note: >
        The cost is real and worth knowing before you start: the first
        hundred-odd pages move slowly through monastery ritual and
        theological argument before the mystery plot takes hold, and the
        standard English translation leaves its Latin, Greek and other
        non-English passages untranslated exactly as the Italian original
        does, so a reader with no Latin is meant to feel the same friction
        Eco built in on purpose. Push through the opening and the murder
        mystery underneath carries the rest.

    - id: beyond-the-novels
      title: His ideas, without the semiotics seminar
      description: >
        The journalism, occasional essays, illustrated cultural histories
        and public lecture series Eco wrote alongside the novels for a
        general readership, not the specialist semiotic theory that makes
        up most of his academic shelf.
      workIds: null
      orderId: umberto-eco/beyond-the-novels
      fit:
        experience: [returning, completionist]
        commitment: [taste, arc]
      note: >
        This is a curated fifth of the extended tier, not the whole of it -
        the theory he is equally known for (A Theory of Semiotics, Kant and
        the Platypus, The Role of the Reader among them) sits in the
        completionist route below, not because it is lesser Eco but because
        it asks more of a reader who is only browsing.

    - id: everything
      title: Everything, in order
      description: >
        All sixty-seven works in the order he wrote them - seven novels,
        the full academic and semiotic shelf, the children's books and the
        apocrypha - interleaved as they actually appeared across six
        decades of parallel practice as a novelist and a scholar.
      workIds: null
      orderId: default
      fit:
        experience: [completionist]
        commitment: [complete]

