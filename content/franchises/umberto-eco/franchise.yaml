id: umberto-eco
name: Umberto Eco
kind: author
description: >
  The Italian semiotician whose seven novels, beginning with
  [[work:umberto-eco/the-name-of-the-rose|The Name of the Rose]] (1980), sit
  beside four decades of academic and popular writing on signs,
  interpretation and medieval aesthetics - the scholarship that shaped the
  fiction, not a separate career.
authorIds: [umberto-eco]
themePreset: abbey-labyrinth
features: {}

globalEvents:
  include:
    - world-war-ii-1939            # Ur-Fascism (1995) opens on his own eyewitness memory of partisans liberating his Piedmont town in April 1945, written to mark the war's European end at 50 years, not a general "he lived through it"
    - ebook-and-self-publishing-2007  # Non sperate di liberarvi dei libri / This Is Not the End of the Book (2009, with Jean-Claude Carriere), a book-length dialogue on whether the codex survives the digital-reading shift the Kindle opened
  exclude:
    - sept-11-2001                 # no sourced column, essay or interview ties the attacks to any specific work; his frequent public commentary (Bustina di Minerva) is not itself evidence of a worked connection
    - financial-crisis-2008        # world-events' own "weakest entry" grading holds here too; no novel or essay answers it
    - penguin-paperback-1935       # British trade-paperback shift; no sourced connection to an Italian academic publishing through Bompiani
    - armed-services-editions-1943 # American wartime book distribution; he was a child in rural Piedmont, not the readership this reached
    - lady-chatterley-trial-1960   # British obscenity-law landmark; no sourced connection to his own work or advocacy
    - fantasy-paperback-boom-1965  # writes semiotic/historical fiction, not fantasy; not the category this event created
    - carnation-revolution-1974    # Portuguese-specific; Italian author with no sourced connection to it
    - chain-bookshop-1982          # generic publishing-industry background; no sourced connection to how his books reached readers
    - online-bookselling-1995      # generic publishing-industry background; the documented digital-books reaction is the 2009 Carriere dialogue, already carried by ebook-and-self-publishing-2007
    - prestige-fantasy-adaptation-2011  # writes semiotic/historical fiction, not fantasy; unrelated genre and he had died before its cultural peak
    - portugal-bailout-2011        # Portuguese-specific; Italian author with no sourced connection to it
    - comics-code-authority-1954   # his "Myth of Superman" essay (in Apocalittici e integrati, 1964) reads an already Code-compliant hero's narrative structure; no sourced link to the Code's own censorship fight

sources:
  - https://en.wikipedia.org/wiki/Umberto_Eco
  - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
