# Editions of Umberto Eco: built from scratch (no prior editions.yaml existed
# for this wing). 63 entries: 22 across the seven novels (7 Italian originals,
# 8 English - the seven current editions plus the 2014 revised Name of the
# Rose - and 7 Portuguese), plus 41 more spread across 24 of the 55
# extended-tier works.
#
# COVERAGE
#   Novels (7 of 7): every novel has an Italian original, a current English
#     edition and a current Portuguese edition. The Name of the Rose alone
#     carries a fourth: the 2014 Mariner Books printing that is specifically
#     Richard Dixon's "author's revisions" text (see its own note).
#   Extended tier (24 of 55): 19 of orders.yaml's `beyond-the-novels`
#     completionist order's 20 works - Diario minimo, Apocalittici e
#     integrati, Il costume di casa, Il secondo diario minimo, Interpretation
#     and Overinterpretation, Six Walks in the Fictional Woods, Cinque scritti
#     morali, Serendipities, Experiences in Translation, Sulla letteratura,
#     Storia della bellezza, A passo di gambero, Storia della bruttezza, La
#     vertigine della lista, Confessions of a Young Novelist, Costruire il
#     nemico, Storia delle terre e dei luoghi leggendari, Pape Satàn Aleppe and
#     Sulle spalle dei giganti - all have at least one edition below (only
#     Postille a «Il nome della rosa» has none; see its own gap note). Five
#     more works outside that order carry an edition too, all found
#     unprompted while researching the surrounding bibliography and fully
#     verifiable: Come si fa una tesi di laurea (it/en), Opera aperta,
#     Lector in fabula and Filosofi in libertà (pt-PT each), and Reflexões
#     sobre a Dor / Riflessioni sul dolore (pt-PT). The remaining 31
#     extended-tier works (the rest of the specialist semiotic/aesthetic
#     theory, the six children's books, the apocrypha other than Filosofi in
#     libertà) carry no edition here - unresearched, not a claim that none
#     exists.
#   No entry was invented to close a gap. Absence in this file means either
#     "not yet researched" (the 40 above) or "researched and no verifiable
#     current edition found" (Apocalittici e integrati's Italian side, La
#     vertigine della lista's Italian side, Postille's own edition - each
#     explained on the relevant entry or in the gap note below).
#
# SOURCES AND METHOD.
#   Italian: Bompiani is Eco's original and, for the seven novels and most of
#     the pre-2011 backlist, still current publisher. Since roughly 2011 a
#     second house, La nave di Teseo (a firm co-founded by Eco's own son and
#     former Bompiani colleagues after the Mondadori-Bompiani merger),
#     publishes his later and posthumous nonfiction - three entries below
#     (Come si fa una tesi di laurea, Pape Satàn Aleppe, Sulle spalle dei
#     giganti) carry a La nave di Teseo ISBN, all sharing its 978-88-9344
#     registrant block. Every Italian ISBN was checked against OpenLibrary's
#     MARC-sourced edition records (Library of Congress, Harvard, Columbia and
#     San Francisco Public Library catalogue feeds, not crowd entries) and its
#     check digit recomputed by hand; four (marked SINGLE-SOURCED AND
#     CONVERTED below) exist in OpenLibrary only as an ISBN-10, converted here
#     by dropping the old check digit, prefixing 978 and recomputing from
#     scratch.
#   English: HarperCollins is the current publisher of record for all seven
#     novels (it absorbed Houghton Mifflin Harcourt's trade list in 2021), but
#     only gave The Name of the Rose, Foucault's Pendulum and The Prague
#     Cemetery a fresh 2023/2022 paperback repackage with a new ISBN; the
#     other four novels are still sold under their long-standing
#     Harvest Books / Houghton Mifflin Harcourt paperback ISBNs, each
#     cross-checked against WorldCat (Baudolino, The Island of the Day Before)
#     or the book's own OpenLibrary MARC record citing a translator
#     contribution field (The Mysterious Flame of Queen Loana). Translators
#     were NOT copied from works.yaml's own summary for the seven novels -
#     each was independently re-verified against that novel's own English
#     Wikipedia infobox (all seven checked directly here) and, for
#     five of the seven, against the specific edition's own OpenLibrary MARC
#     "contributions"/"by_statement" field. All seven agree with each other
#     and with works.yaml: William Weaver (The Name of the Rose, Foucault's
#     Pendulum, The Island of the Day Before, Baudolino), Geoffrey Brock (The
#     Mysterious Flame of Queen Loana), Richard Dixon (The Prague Cemetery,
#     Numero Zero). Extended-tier English translators were taken from
#     works.yaml's own already-sourced synopsis credits and, where an edition
#     ISBN also carried an OpenLibrary "contributions" field, cross-checked
#     against that too (Five Moral Pieces/Alastair McEwen and
#     Serendipities/William Weaver both confirmed this way).
#   Portuguese: Gradiva holds the current Portuguese rights to all seven
#     novels and a large share of the extended-tier nonfiction; Relógio d'Água
#     and Editorial Presença hold three older titles Gradiva has not
#     republished. Every Portuguese ISBN below was confirmed at
#     catalogo.bnportugal.gov.pt (BNP's own ipac20 catalogue, queried by ISBN
#     and cited by its exact permalink), which also supplied every translator
#     credit and legal-deposit number - the one exception is the current
#     printing of O Nome da Rosa, explained on that entry. `pesquisar por
#     ISBN` on the same catalogue returned no cross-check for six of these
#     because BNP simply had the record on the first hit; the two 2026-dated
#     Gradiva printings that did NOT resolve at BNP (too recent for legal
#     deposit to have processed) are named in that entry's own note rather
#     than silently substituted for the verified 2011 printing.
#
# REGION CHECK. Every `pt-PT` ISBN below carries a 978-989 or 978-972
# registrant prefix (Portugal). One extended-tier work, Storia della
# bruttezza, has NO Portuguese-market (pt-PT) edition - only a Brazilian one
# (Editora Record, 978-85 prefix) turned up, and it is recorded below tagged
# `pt-BR`, never `pt-PT`, exactly per this catalogue's region-strict rule.
#
# THE 2014 REVISED NAME OF THE ROSE. Eco corrected a number of anachronisms
# in the Italian original (the "impossible" bell-pepper dish among them,
# since peppers reached Europe over a century after the novel's 1327 setting)
# for a revised Italian edition around 2011-2012. Richard Dixon's own
# translator bibliography (en.wikipedia.org/wiki/Richard_Dixon_(translator))
# credits "Author's revisions to The Name of the Rose by Umberto Eco, 2014"
# as a distinct, separately dated piece of work - not a new translation, a
# revision layered onto Weaver's existing 1983 English text after Weaver's
# own death in November 2013. OpenLibrary's MARC record for the resulting
# Mariner Books printing corroborates this independently: it is catalogued as
# a "New edition" (statement taken from the book's own page 577) with BOTH
# William Weaver and Richard Dixon listed as translators, and its own
# by-statement reads "translated from the Italian by William Weaver,
# including the author's postscript; [translations for the 2014 edition by
# Richard Dixon]". That is recorded below as its own edition, following this
# catalogue's established pattern for a genuinely superseded/revised text
# (chuck-palahniuk/fight-club/noticias-1999-pt): the current 2023 HarperCollins
# paperback most likely carries this same revised text (any printing after
# 2014 would), but the 2014 Mariner Books printing is the one edition that IS
# specifically, citably, the revision event itself.
#
# =============================================================================
# The seven novels - Italian originals (Bompiani)
# =============================================================================

