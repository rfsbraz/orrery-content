# =============================================================================
# GAP: Postille a «Il nome della rosa» (1983) carries no edition of its own
# here. It is Eco's short reflective essay appended to later printings of The
# Name of the Rose itself, not usually sold as a standalone object; the 1995
# Buccaneer Books "Postscript to the Name of the Rose" (a small
# library-binding reprint house) is the only English-language standalone
# printing OpenLibrary records, and was judged too marginal a retail object
# to record as this work's defining edition. A reader gets this text bundled
# inside the 2014 Mariner Books "Name of the Rose (Including Author's
# Postscript)" edition recorded above under umberto-eco/the-name-of-the-rose -
# named here so the gap reads as a decision, not an oversight.
# =============================================================================
