# ADDITIONAL orders only. The DEFAULT order - all 67 works in
# publication-chronological order - is derived automatically from works.yaml
# and is NOT listed here.
#
# One order below, pulling a curated thread out of the 55 extended-tier
# works for a reader who wants Eco's nonfiction and journalism without also
# working through the specialist semiotic theory that makes up most of that
# tier. No order groups the seven novels: they are all standalone (no
# subseries, no publisher-numbered sequence, no shared characters across
# them - see franchise.yaml's startHere header for the prequel-spoiler check
# this ruled out), so nothing about their sequence needs settling beyond the
# derived default, and a "read the novels" order restating that chronology
# over an already-chronological set would be a duplicate wearing a costume,
# the same failure this catalogue already rejects elsewhere.

- id: umberto-eco/beyond-the-novels
  name: "Beyond the novels"
  type: curated
  source: canon
  rationale: >
    A reader who has read some or all of the seven novels and wants more of
    Eco's own thinking, without enrolling in the semiotics seminar the
    extended tier's other half amounts to. Every work here is either a
    journalism or occasional-essay collection written for a newspaper
    readership, an illustrated cultural history built to be browsed rather
    than argued with, or a public lecture series (Harvard's Norton Lectures,
    Cambridge's Tanner Lectures, Toronto's Goggio Public Lectures, Emory's
    Ellmann Lectures) delivered to a general audience rather than a graduate
    seminar - and, with one partial exception noted below, all twenty were
    judged worth an English translation, a real market signal that an
    anglophone publisher expected general readers, not only Eco specialists,
    to want them. The cost is real: this is not the whole extended tier, and
    what it leaves out is not lesser Eco - Trattato di semiotica generale
    and Kant e l'ornitorinco are exactly as central to who he was as any
    novel, just not built for a browsing reader (see `debated`). It also
    leaves out his six children's and illustrated fables, a different
    register entirely, and ten further Italian journalism and essay volumes
    that share this order's genre but never found an anglophone publisher to
    translate them.
  orderedWorkIds:
    - umberto-eco/diario-minimo
    - umberto-eco/apocalittici-e-integrati
    - umberto-eco/il-costume-di-casa
    - umberto-eco/postille-a-il-nome-della-rosa
    - umberto-eco/il-secondo-diario-minimo
    - umberto-eco/interpretation-and-overinterpretation
    - umberto-eco/six-walks-in-the-fictional-woods
    - umberto-eco/cinque-scritti-morali
    - umberto-eco/serendipities
    - umberto-eco/experiences-in-translation
    - umberto-eco/sulla-letteratura
    - umberto-eco/storia-della-bellezza
    - umberto-eco/a-passo-di-gambero
    - umberto-eco/storia-della-bruttezza
    - umberto-eco/la-vertigine-della-lista
    - umberto-eco/confessions-of-a-young-novelist
    - umberto-eco/costruire-il-nemico
    - umberto-eco/storia-delle-terre-e-dei-luoghi-leggendari
    - umberto-eco/pape-satan-aleppe
    - umberto-eco/sulle-spalle-dei-giganti
  debated:
    - "This is a partial order: thirty-five of the fifty-five extended-tier
       works are not here. Eighteen are the specialist semiotic and
       aesthetic theory this order exists to set aside: Il problema estetico
       in San Tommaso, Opera aperta, Le poetiche di Joyce, La struttura
       assente, Le forme del contenuto, Il segno, Trattato di semiotica
       generale, Il superuomo di massa, Lector in fabula, The Role of the
       Reader, Semiotica e filosofia del linguaggio, Arte e bellezza
       nell'estetica medievale, I limiti dell'interpretazione, La ricerca
       della lingua perfetta, Kant e l'ornitorinco, Dire quasi la stessa
       cosa, Dall'albero al labirinto and Scritti sul pensiero medievale -
       each one a single sustained theoretical argument written for readers
       already inside the field, to be worked through rather than browsed.
       Translation history is not the line here: several of them reached
       English through general trade publishers (Kant and the Platypus from
       Harcourt/Mariner, The Search for the Perfect Language from
       Blackwell), and they are still held out, because what makes them
       demanding is the density of the argument, not the absence of an
       edition. Six are
       children's and illustrated fables (La bomba e il generale, I tre
       cosmonauti, Gli gnomi di Gnu, Ammazza l'uccellino, Stelle & stellette,
       La storia de \"I promessi sposi\") - genuinely accessible, but a
       different register (children's literature) than what this order
       curates. One, Come si fa una tesi di laurea (How to Write a Thesis),
       fits neither register: a practical study guide, not an essay
       collection or a theoretical monograph, translated but read for its
       utility rather than for Eco's ideas."
    - "Nine more (Dalla periferia dell'impero, Sugli specchi e altri saggi,
       Tra menzogna e ironia, La bustina di Minerva, La memoria vegetale e
       altri scritti di bibliofilia, De bibliotheca, Riflessioni sul dolore,
       Sulla televisione, Sull'arte) are held out on translation history
       alone, not genre: each is journalism, occasional essay or personal
       reflection in the same register as this order's contents, but no
       English-language edition of any of them was found after decades in
       print, so there is no evidence an anglophone publisher judged them
       broad enough to translate. A reader of Italian has a substantially
       larger version of this order available; this one is bounded by what
       an English reader can actually buy."
    - "Sette anni di desiderio (1983) is the thirty-fifth, and it is held
       out on a narrower ground than the nine above: it has no English
       edition of its own, but it is not untranslated. Faith in Fakes /
       Travels in Hyperreality, the English selection this order already
       carries under Il costume di casa, draws its contents from two
       Italian volumes - Il costume di casa (1973) and Sette anni di
       desiderio (1983) - so the part of it an English reader can reach is
       on this list already, inside another entry."
    - "Apocalittici e integrati is only partially translated (Apocalypse
       Postponed, 1994, an abridged selection) rather than translated whole
       like the rest of this list; it is included anyway because the
       portion that was translated is exactly its general-audience
       mass-culture material, not the parts left out."
    - "Interpretation and Overinterpretation is the most demanding book on
       this list - a genuine debate about the limits of textual
       interpretation, not a light read - and is included on venue rather
       than difficulty: the Tanner Lectures on Human Values are a public
       humanities lecture series, not a specialist seminar, and Cambridge
       University Press published it with three named respondents (Richard
       Rorty, Jonathan Culler, Christine Brooke-Rose) answering Eco in turn,
       the format of a public argument rather than a monograph."
  sources:
    - https://en.wikipedia.org/wiki/Umberto_Eco_bibliography
    - https://en.wikipedia.org/wiki/Umberto_Eco
    - https://en.wikipedia.org/wiki/Faith_in_Fakes
