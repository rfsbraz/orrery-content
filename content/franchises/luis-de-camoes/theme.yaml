# Branding for the Luís de Camões wing (see Orrery CONCEPT SS6 - the design
# law, and docs/SCHEMA.md#themeyaml). Non-art fields only - `art` is left
# entirely for the visual-language layer, once the bibliography and any eras
# are settled. Checked against every existing wing's palette
# (scripts/theme_digest.py) before choosing, including this catalogue's
# seven other Lusophone wings: joao-tordo (Atlantic blue-grey near-black),
# jose-luis-peixoto (wheat-gold, sunbaked, near-black), jose-saramago
# (volcanic basalt near-black, deep carmine), valter-hugo-mae (warm umber
# and terracotta, near-black), fernando-pessoa (muted teal-green,
# near-black), eca-de-queiros (parlour mauve, near-black) and
# jose-rodrigues-dos-santos (newsroom cardinal red, near-black). Every one of
# them commits to a dark ground - understandably, since night and interior
# light suit a study, a desk, a village at dusk. Camões's own record does
# not: two decades of it happened at sea and on tropical coasts, and its
# most famous single image, sourced above every other candidate, is a
# manuscript that came out of the ocean legible at all - saved, by tradition,
# by being held above the water through a shipwreck near the Mekong. That is
# a story about salt, sun and paper surviving exposure, not about a shuttered
# room, so this wing breaks with all seven of the others and opens the
# palette out into daylight instead: a pale, warm, salt-bleached driftwood
# ground rather than another near-black. Not a "maritime" costume of rope and
# rigging - the register is the material outcome of the maritime life
# (sun-worn paper, weathered wood, oxidized metal fittings), read the same
# way the design law asks any wing's palette to be read: as material fact
# rather than genre furniture.
#
# The single accent carries that same idea: verdigris, the blue-green patina
# salt air raises on exposed bronze and brass - ship's fittings, a navigator's
# instruments - rather than a literal ocean blue. Blue was ruled out
# deliberately: joao-tordo (hue ~202) and jo-nesbo (hue ~228, outside this
# language cluster but still an accent this catalogue already owns) between
# them already claim most of the blue range a maritime idea would reach for.
# Verdigris sits at hue ~128, in the catalogue's widest untouched span (the
# nearest accents on either side are anna-sewell's sage green at ~105 and
# agatha-christie's forest green at ~148, each roughly 20-25 degrees away and
# both lower-saturation, cooler-toned choices than this one).
preset: sun-bleached-carta
palette:
  bg: "#dfdacd"        # salt-bleached driftwood / sun-worn parchment, not
                        # another near-black - see the header note
  surface: "#eae6dc"   # a shade lifted, for cards
  ink: "#2d241b"        # dark warm brown-black text, high contrast on the
                        # pale ground
  muted: "#705943"    # warm dark brown-grey, chosen to clear the 4.5:1 AA
                        # contrast floor for metadata text against both bg
                        # and surface
  accent: "#367d3f"     # verdigris - oxidized bronze/brass patina, not a
                        # literal ocean blue (see header note)
displayFace: fraunces
signature: rule
notes: >
  A pale, sun-bleached register rather than the near-black every other
  wing in this language cluster commits to, because Camões's own record is
  the one that actually happened outdoors and at sea rather than at a desk.
  One verdigris accent - salt-air patina on bronze, not a literal ocean blue,
  which this catalogue's Atlantic- and Nordic-set wings already hold.
  `signature: rule` reads as the fixed, ruled line of a course drawn across a
  chart, or the margin of a manuscript page - a firm architectural line,
  restrained rather than decorative. Readability first throughout; no rope,
  no rigging, no compass-rose kitsch.
