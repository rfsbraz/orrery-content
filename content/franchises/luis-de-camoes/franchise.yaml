id: luis-de-camoes
name: Luís de Camões
kind: author
description: >
  A soldier who lost an eye at Ceuta, a poet who by tradition swam ashore
  from a shipwreck near the Mekong holding the only manuscript of the poem
  that made him Portugal's national voice, and, by his death in poverty in
  1580, the reason Portuguese is sometimes called "the language of Camões".
authorIds: [luis-de-camoes]
themePreset: sun-bleached-carta
features: {}

# Every event in content/events/global.yaml postdates Camões's death by at
# least 290 years (the earliest, elementary-education-act-1870, by 290; most
# by well over 300). None reaches this timeline; nothing to include.
