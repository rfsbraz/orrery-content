# Creative periods. Camões has no received periodisation, and the record makes
# that an honest gap rather than a missed one. Two independent reasons, either
# of which alone would settle it.
#
# The bibliography cannot carry a biographical period. Only one of the six
# works here, Os Lusíadas (1572), was printed while Camões was alive; the two
# undisputed comedies followed in 1587, the lyric poetry in 1595, El-Rei
# Seleuco in 1645, and the prose letters reached a dedicated edition only in
# 2011. Every phase a life of Camões marks out (Lisbon and the court, the
# Ceuta service and the lost eye, the seventeen years in Portuguese Asia, the
# 1570 return) closes before 1572, so an era cut from his biography would
# contain no works at all.
#
# The poems cannot carry a period either, because they cannot be dated. The
# lyric canon is unfixed by scholarly disagreement rather than by neglect.
# Cleonice Berardinelli's 1980 edition gathers the roughly 400 poems ever
# attributed to Camões without attempting to say which are actually his, on
# the ground that a poetry circulating by imitation, oral transmission and
# manuscript copy does not resolve into one author's fixed corpus; Leodegário
# de Azevedo Filho's seven-volume Lírica de Camões (1985-2001) goes the other
# way and admits only a "minimum corpus" of 133 sonnets carrying double
# sixteenth-century manuscript testimony. Neither yields a chronology of
# composition, and a period with no datable poems in it divides nothing.
#
# What the criticism does divide is form, not time: the standard division of
# the lyric is medida velha (the traditional short-line redondilhas) against
# medida nova (the Italianate sonnet, canção, ode, elegia and écloga). Camões
# worked in both across his whole writing life, so that division cuts across
# every candidate boundary rather than falling on one.
#
# Two near misses, recorded so a later reader does not take either for a
# periodisation. Landeg White's Collected Lyric Poems (Princeton) arranges the
# poems in the order of Camões's travels, which makes the volume read as a
# journey; that is one translator's arrangement of one book, presented and
# received as a reading. And the claim that an early classical manner gives
# way to a mannerist one belongs to the wider argument over where the
# Renaissance ends in Portugal, attaches to no date in Camões's life, and
# names no period of his career.
#
