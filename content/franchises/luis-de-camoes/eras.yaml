# Creative periods. There are none sourced here, and the record makes that
# an honest gap rather than a missed one: the five works in this wing print
# across only three years that don't cluster into any critically-named
# period (1572 for the epic; 1587 for the two undisputed comedies, printed
# together seven years after Camões's death; 1595 for the lyric poetry,
# fifteen years posthumous). Composition dates run earlier and more
# diffusely than any of those - the comedies were written across his years
# in Portuguese Asia in the 1550s, the lyric poetry across his whole working
# life - but no source consulted for this wing draws a named period out of
# that diffusion the way, for instance, the Cervantes wing's "captivity
# years" and "final decade" are each independently named in scholarship. A
# five-work shelf built almost entirely from posthumous printings has
# nothing an era boundary could meaningfully divide.
[]
