# Concrete published editions. Camões's bibliography (1572-1645, plus a 2011
# first standalone printing of the letters) predates the ISBN system for all
# but the youngest work, so coverage here is real but necessarily thin: 9
# editions across 3 of the wing's 6 works (Os Lusíadas, Rimas, Cartas).
# Filodemo, Anfitriões and El-Rei Seleuco carry none - not a research gap,
# see the OMNIBUS EXCLUSIONS note below.
#
# OS LUSÍADAS (5 editions - pt-PT x2, pt-BR x1, en x2): Porto Editora's
# September 2024 hardcover ("Edição comemorativa dos 500 anos do aniversário
# de Luís de Camões", ISBN 978-972-0-03881-4) leads as the most recent
# in-print pt-PT edition, confirmed directly on portoeditora.pt with two
# 2025 reader reviews attached. Guerra e Paz's 2016 paperback (Coleção
# Clássicos Guerra e Paz, ISBN 978-989-702-182-4) is recorded alongside it as
# a genuinely different, currently-purchasable object (standard trade
# paperback vs. the Porto Editora hardcover). Nova Fronteira's boxed
# hardcover (ISBN 978-85-209-4295-6, prepared by the poet Alexei Bueno with
# 1,200+ notes and an appendix of stanzas Camões himself omitted) is the
# pt-BR entry, confirmed on the publisher's own store; its ISBN first
# surfaced under a 2018 date on secondary sources but novafronteira.com.br's
# own product page gives the current printing as 15 September 2020, which is
# the year recorded here. The two English entries are the translations
# works.yaml's own translationNote singles out as the two most commonly
# recommended today: Landeg White's Oxford World's Classics translation
# (paperback, ISBN 978-0-19-953996-3, this printing 12 June 2008 of the 1997
# translation - confirmed via Amazon, Waterstones, Blackwell's and OUP's own
# academic listing) and William C. Atkinson's Penguin Classics prose
# translation (paperback, ISBN 978-0-14-044026-3, still in print per
# penguinrandomhouse.com's own product page, "Add to Cart" live). A separate
# ISBN, 978-0-19-160436-2, is the Kobo ebook of the White translation, not
# recorded here since the paperback is the edition a reader is pointed to.
#
# CARTAS (2 editions, both pt-PT, both Guerra e Paz - the only publisher with
# a standalone edition of the letters in print): "Quatro cartas e um bilhete
# a uma dama - seguidos de 26 poemas" (July 2024, ISBN 978-989-576-089-3,
# paperback) is the more recent of the two and leads; its own product
# description states it collects "as quatro cartas que os especialistas
# aceitam como sendo da autoria de Camões" ("the four letters experts accept
# as genuinely Camões's own"), matching works.yaml's note on the work almost
# verbatim. "Contradança - Cartas e Poemas de Camões" (2011, ISBN
# 978-989-702-035-3, cloth-bound) is the first standalone edition works.yaml
# already cites and remains listed for sale; it is recorded second as a
# genuinely different object - an illustrated art edition reproducing 30+
# 16th-century paintings, not a plain-text reprint.
#
# RIMAS (2 editions, both pt-PT): E-primatur's "Obras Completas - Lírica -
# Volume II" (paperback printing, March 2022, ISBN 978-989-8872-90-6) is a
# complete edition of Camões's lyric poetry - organised, introduced and
# annotated by Maria Vitalina Leal de Matos, described on the publisher's
# own site as the first complete-works edition of Camões in over 40 years -
# and leads for that reason over the November 2019 hardcover printing of the
# same text (ISBN 978-989-8872-08-1, same 504 pages, also still listed for
# sale), which is not recorded separately since it is the identical text in
# an earlier binding rather than a distinct object. Assírio & Alvim's
# "Sonetos de Luís de Camões" (March 2020 printing, ISBN 978-972-37-2081-5,
# hardcover, Coleção Documenta Poetica) is recorded second: real, in-print
# and genuinely a different object - a compact sonnets-only selection - but
# it is not the complete Rimas and its note says so. Checked and excluded:
# Edições Almedina's Costa Pimpão critical edition (ISBN 978-972-400-775-5,
# "Obras Clássicas da Literatura Portuguesa", the standard scholarly text)
# is marked "ESGOTADO OU NÃO DISPONÍVEL" on wook.pt; Edições Almedina's 1980
# facsimile of the 1598 edition, prepared by Vítor Aguiar e Silva, is
# likewise out of stock there, and the ISBN attached to it on wook.pt
# (978-0-12-058398-0) carries an English-language-country registrant prefix
# on a Portuguese book from a Portuguese publisher - the same kind of
# retailer-record error CURATION.md's Wee Free Men case warns about - so it
# was not going to be trusted even if the book were in stock.
#
# OMNIBUS EXCLUSIONS (per this catalogue's standing rule against an omnibus
# ISBN standing in for one work - see the Gabriel García Márquez, Jim
# Butcher and John Shirley files for the same rule applied elsewhere):
# E-primatur's own three-volume "Obras Completas de Luiz Vaz de Camões"
# (Maria Vitalina Leal de Matos, 2019-2022) splits Camões's output as
# "Épica & Cartas" (Volume I, ISBN 978-989-8872-04-3), "Lírica" (Volume II,
# recorded above), and "Teatro" (Volume III, ISBN 978-989-8872-43-2, with
# Vanda Anastácio credited for establishing the text). Volume I (latest printing ISBN
# 978-989-9130-43-2, July 2024) bundles Os Lusíadas and Cartas under one
# ISBN, and Volume III bundles all three
# surviving comedies (Filodemo, Anfitriões and the disputed El-Rei Seleuco)
# under another; neither is recorded under any of those workIds. Assírio &
# Alvim's own October 2024 "Teatro" (ISBN 978-972-37-2357-1, 392 pages,
# prefácio/notes by Sérgio Guimarães de Sousa) is the same shape - "Auto dos
# Anfitriões", "Comédia d'El-Rei Seleuco" and two versions of "Auto de
# Filodemo" under one binding - and is excluded for the same reason. No
# single-work edition of any of the three plays was found in print anywhere
# checked (Edições Caixotim's 2005 "Comédia de Filodemo", prefaced by Vanda
# Anastácio, surfaced only in academic citations with no ISBN or live
# storefront located); Filodemo, Anfitriões and El-Rei Seleuco therefore
# carry no editions.yaml entries at all, which is the honest state of the
# market rather than an oversight.

