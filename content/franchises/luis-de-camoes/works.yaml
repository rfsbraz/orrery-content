# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent. `title` is the original Portuguese
# title; `published` is the year of first print, which for every work here
# except the epic itself trails composition by years or decades - each
# entry's note says so and why `published` still follows print date, this
# catalogue's convention (see also Edgar Allan Poe's The Poetic Principle and
# Miguel de Cervantes's El trato de Argel).
#
# SHAPE OF THIS WING: five works across every literary mode Camões worked in
# - epic, lyric and drama - not the epic alone. Two, Os Lusíadas and Rimas,
# are core: the epic is the reason he has a page at all, and Rimas is named
# alongside it in every standard account of his work (the two are the pair
# named together in Portuguese Wikipedia's own opening sentence on him).
# Two of the three surviving comedies, Filodemo and Anfitriões, are extended:
# real, undisputed, but secondary to the two headline achievements, matching
# the extended tier this catalogue's Cervantes wing already sets for his own
# plays and verse.
# The third comedy, El-Rei Seleuco, is tiered apocrypha - its own entry
# explains the disputed attribution and the unsettled print date.
#
# Excluded:
#   - "O Parnaso de Luís Vaz" ("The Parnasum of Luís Vaz") - a collection of
#     poetry Camões himself referred to, lost during his lifetime and never
#     printed. No reader has ever been able to obtain a copy, in any
#     language, at any date - the same reasoning that excludes Cervantes's
#     announced-but-undelivered "Las semanas del jardín" from that wing.
#   - "Disparates da Índia" (also "Os Disbarates da Índia") - a satirical
#     poem attributed to Camões and linked by some biographers to one of his
#     Goa imprisonments. Portuguese Wikipedia's own footnote on the subject
#     records that, unlike a companion piece (the "Sátira do Torneio"), this
#     one has a documented history of erudite contestation of Camonian
#     authorship - an active, unsettled attribution question, not a
#     confirmed one. Held out on that basis, the same reasoning that excludes
#     the actively-disputed "La conquista de Jerusalén" from the Cervantes
#     wing, rather than added on one side of an open argument.
#   - "Sátira do Torneio" - mentioned by the 17th-century commentator Manuel
#     de Faria e Sousa, but with no confirmed independent print history of
#     its own distinct from his commentary; unlike Disparates da Índia, no
#     source consulted here documents even a scholarly argument over its
#     authorship, only the more basic question of whether it exists as a
#     separately publishable text at all. Left out for that gap, not for
#     disputed attribution.

- id: luis-de-camoes/os-lusiadas
  title: "Os Lusíadas"
  authorIds: [luis-de-camoes]
  published: 1572
  subseries: null
  canonTier: core
  format: poem
  featured: true
  translationNote: >
    Almost no reader of this wing reads the original 16th-century
    Portuguese, and English has no single standard Lusíadas the way some
    classics do - the major translations are genuinely different poems in
    form as much as tone. Richard Fanshawe's 1655 version, the first into
    English, renders the poem in the same ottava rima stanza Camões used,
    in period English verse; William Julius Mickle's 1776 translation is
    also verse but freely expansive rather than close, and was for a long
    stretch the most widely read English Lusíadas. Of the two 20th-century
    translations most commonly recommended today, William C. Atkinson's
    1952 Penguin Classics version is prose - readable and long the standard
    paperback choice, but by later assessment "deeply unpoetic" next to the
    original. Landeg White's 1997 Oxford World's Classics translation
    answers that in blank verse rather than prose or an attempt to hold the
    original's rhyme scheme, and is the version most contemporary critical
    editions point a new reader toward. A fifth, Richard Francis Burton's
    1880 translation by the explorer and Orientalist better known for his
    Arabian Nights, remains in print and cited but occupies a smaller place
    in current recommendations. This is true of the poem regardless of
    which specific printing a reader buys.
  synopsis: >
    An epic in ten cantos of ottava rima, telling - and constantly
    interrupting to praise, mourn or argue with - the story of Vasco da
    Gama's 1497-1499 voyage around the Cape of Good Hope to India, framed as
    the culmination of the whole sweep of Portuguese history and watched
    over, and fought over, by the classical gods of Olympus.
  note: >
    Two sets of copies survive bearing the same 1572 date, long a source of
    bibliographic confusion: they differ in fine detail down to the
    direction a pelican faces on the title page, and 17th-century scholars
    already suspected two distinct printings without being able to prove it.
    A 2024 critical edition (Rita Marnoto, Universidade de Coimbra / Centro
    Internacional de Estudos Portugueses de Genebra) settled the question
    through physical examination of a significant sample of the roughly 50
    known 1572-dated copies worldwide: typographic ligatures, the wear on
    the eleven ornamental woodblock capital letters used to open the
    dedication and each canto, and paper stock. The edition with the
    pelican's head turned left, printed without typographic ligatures, on
    paper predating 1572 and with the least-worn capitals, is the genuine
    princeps, produced under the author's own supervision; the edition with
    the pelican turned right is a later imitation, some copies datable by
    their paper to as late as 1580-81, produced under a false 1572 date -
    of the roughly 50 known copies, about two-thirds are genuine and one
    third counterfeit. (This wing does not use the informal names
    "queimados"/"esganados" sometimes associated with these two editions in
    passing recollection: no source consulted here documents that pairing,
    and the pelican-orientation distinction above is the one the current
    scholarly literature actually uses and sources.) Its subject, Vasco da
    Gama's voyage, took place a generation before Camões's own birth; its
    telling draws directly on his own years at sea and in Portuguese Asia,
    most visibly from Canto V onward, after the shipwreck tradition places
    him losing everything but this poem's own manuscript.
  sources:
    - https://en.wikipedia.org/wiki/Os_Lus%C3%ADadas
    - https://en.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es
    - https://observador.pt/2024/01/14/edicao-critica-de-os-lusiadas-prova-que-original-teve-contrafacao-e-esclarece-duvida-com-seculos/

- id: luis-de-camoes/rimas
  title: "Rimas"
  authorIds: [luis-de-camoes]
  published: 1595
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Camões's lyric poetry, gathered from manuscript after his death:
    redondilhas, odes, elegies, eclogues, sonnets and other short forms,
    ranging from Petrarch-inflected love poetry to verse written directly out
    of his years of exile and shipwreck - among them "Sôbolos rios que vão",
    the redondilha tradition links to the loss of the Lusíadas manuscript in
    the Mekong shipwreck.
  note: >
    Left uncollected at Camões's death in 1580, his scattered lyric verse was
    first gathered and printed in 1595 by Fernão Rodrigues Lobo Soropita,
    fifteen years later, and enlarged in a Segunda Parte in 1598. What
    counts as genuinely his has been unstable ever since: the 1595 edition
    carried 65 sonnets; by an 1861 edition (Juromenha) that had grown to
    352, most later identified as apocryphal accretions from other poets,
    and a 1953 edition (Aguiar e Silva) still listed 166. Faria e Sousa's
    influential 1685 edition also modernized and rewrote much of the
    original wording, a corrupted text that shaped how Camões's lyric
    poetry was read for over two centuries before Wilhelm Storck and
    Carolina Michaëlis de Vasconcelos began the critical work, continued by
    José Maria Rodrigues and Afonso Lopes Vieira's 1932 edition, of working
    back toward the 1595/1598 originals. A complete modern critical edition
    of Camões's collected works, including the Rimas, was still in progress
    as of a January 2024 press account of its editor's parallel work on Os
    Lusíadas, with the sonnets, redondilhas and canções already published
    and the oitavas, elegias, odes and éclogas still to come.
  sources:
    - https://en.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es
    - https://observador.pt/2024/01/14/edicao-critica-de-os-lusiadas-prova-que-original-teve-contrafacao-e-esclarece-duvida-com-seculos/

- id: luis-de-camoes/filodemo
  title: "Filodemo"
  authorIds: [luis-de-camoes]
  published: 1587
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A five-act comedy of manners: Filodemo, a servant of noble birth
    unknown even to himself, loves Dionisa, the daughter of the nobleman he
    serves - a plot English- and Portuguese-language commentary alike reads
    as carrying autobiographical traces of Camões's own frustrated court
    love affair.
  note: >
    Composed in Goa around 1556 and dedicated to the governor, Francisco
    Barreto, whose favor its dedication suggests Camões enjoyed at the time.
    Reached print only in 1587, seven years after Camões's death, alongside
    [[work:luis-de-camoes/anfitrioes|Anfitriões]] - both plays' first known
    printing was in the same year, in a multi-author 16th-century Portuguese
    collection of autos and comedies rather than in a volume of Camões's
    work alone. Of the three surviving comedies, critical attention
    consistently singles this one out as the most substantial, for its
    psychological detail and the range of social types it draws.
  sources:
    - https://en.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es
    - https://pt.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es

- id: luis-de-camoes/anfitrioes
  title: "Anfitriões"
  authorIds: [luis-de-camoes]
  published: 1587
  subseries: null
  canonTier: extended
  format: play
  synopsis: >
    A comic adaptation of Plautus's Amphitryon: Jupiter, disguised as the
    general Amphitryon, seduces Amphitryon's own wife while he is away at
    war, and the play plays the resulting double identities for farce
    rather than tragedy.
  note: >
    Written in redondilha menor and, in the tradition of the Portuguese
    playwright Gil Vicente, bilingual - the servant Sósia's lines run in
    Castilian, marking his low status. First printed in 1587, the same year
    as [[work:luis-de-camoes/filodemo|Filodemo]] and in the same multi-author
    collection of autos and comedies; composed considerably earlier, though
    no source consulted here fixes a specific composition date the way it
    does for Filodemo's Goa years.
  sources:
    - https://en.wikipedia.org/wiki/Anfitri%C3%B5es
    - https://pt.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es

- id: luis-de-camoes/el-rei-seleuco
  title: "El-Rei Seleuco"
  authorIds: [luis-de-camoes]
  published: 1645
  subseries: null
  canonTier: apocrypha
  format: play
  synopsis: >
    A one-act auto satirizing the nobility: an aging king intends to marry
    the woman his own son loves, drawn from a story of Antiochus and his
    stepmother Stratonice told by Plutarch and repeated by Petrarch.
  note: >
    The most doubtful of the three comedies traditionally credited to
    Camões. Its very existence is undocumented before its first print
    appearance in an edition of the Rimas from the publisher Paulo
    Craesbeeck - a specialist 2005 study of "the corpus of Camões's work"
    (Vanda Anastácio, in Península: Revista de Estudos Ibéricos) dates that
    edition to 1645 in its own title, and this entry follows that
    specialist dating; tertiary sources disagree with each other on the
    year, some giving 1616 and others 1654, and none of that disagreement
    is resolved here. The Craesbeeck edition gives no account of where the
    text came from and was carelessly edited. Set against the other two
    surviving comedies, it is markedly shorter (one act rather than five),
    opens with a prose prologue neither of the others has, and treats its
    love plot with less depth - differences some critics read as evidence
    of a different author entirely, with Gil Vicente's name proposed more
    than once as a closer stylistic fit than Camões's own. Recorded here,
    tiered apocrypha, as the traditionally attributed work it is rather than
    silently dropped, with the attribution dispute stated plainly rather
    than resolved on either side.
  sources:
    - https://pt.wikipedia.org/wiki/El-Rei_Seleuco
    - https://en.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es
