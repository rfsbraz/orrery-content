# FRANCHISE-SPECIFIC events only (things that happen to the books and to his
# reputation, not to the author himself - those are lifeEvents on
# content/authors/luis-de-camoes.yaml). Camões died in 1580 and this wing's
# newest work (Cartas) is dated 2011: a 431-year posthumous span. The eight
# entries below are the real, single-year (or tightly bounded) anchors found
# in it - 1655, 1685, 1776, 1861, 1867-1880, 1932, 1978 and 2024-2026 -
# tracing how a 16th-century soldier-poet reached English readers, had his
# lyric text corrupted and then re-inflated twice over, and then became
# Portugal's national symbol.
#
# Real years remain dark between them, on purpose rather than by omission.
# El-Rei Seleuco's disputed 1645 emergence is the one candidate found for the
# 1581-1654 stretch; its print-date dispute and the Craesbeeck dedication
# that resolves it are already carried in full, with primary-source rigor,
# in that work's own note in works.yaml, and restating the same material
# here as a dated event would pad the count rather than add anything a
# reader does not already have. The 1656-1866 stretch - the longest run in
# the whole 431-year span - was examined and is not actually dark: it holds
# three already-sourced reception moments, now the three events below (Faria
# e Sousa's 1685 rewritten Rimas, Mickle's 1776 translation, Juromenha's
# 1861 edition), leaving only the narrower gaps between and around them
# (1686-1775, 1777-1860, 1862-1866) genuinely quiet. The 1881-1931 and
# 1979-2011 stretches hold nothing beyond what the adjacent 1880, 1932 and
# 1978 entries already cover (the critical-edition project spanning into
# the 1930s; the Estado Novo framing spanning to 1974) that clears its own
# single-year bar rather than restating a neighbour's.

- id: luis-de-camoes-fanshawe-1655
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 1655
  title: "Richard Fanshawe publishes the first English Lusiads"
  scope: industry
  reach: franchise
  impact: med
  description: >
    Richard Fanshawe, a royalist diplomat-poet then out of favour under the
    English Commonwealth, publishes "The Lusiad," the first English
    translation of [[work:luis-de-camoes/os-lusiadas|Os Lusíadas]], 75 years
    after Camões's death and 83 after the poem's own first printing. He
    renders it in the same ottava rima stanza Camões used, in period English
    verse - a form none of the later, more commonly recommended English
    translations repeats. It opens the poem to the anglophone world for the
    first time and starts the still-unsettled question, alive in this wing's
    own reading notes, of which English Lusíadas a new reader should choose.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Os_Lus%C3%ADadas"
    - "https://en.wikipedia.org/wiki/Lu%C3%ADs_de_Cam%C3%B5es"

- id: luis-de-camoes-faria-e-sousa-1685
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 1685
  title: "Faria e Sousa's rewritten Rimas becomes the corrupted standard text"
  scope: industry
  reach: franchise
  impact: med
  description: >
    Manuel de Faria e Sousa, a Portuguese-born scholar who spent his career
    in Habsburg Madrid, dies in 1649 leaving a massive commentary on
    [[work:luis-de-camoes/rimas|Rimas]] unpublished; his son Pedro brings it
    to press in Lisbon in 1685. Faria e Sousa says himself that he "repaired"
    the printed text against manuscripts of his own choosing, reorganising
    the poems thematically and folding in verse - some of it later judged to
    be other poets' work, including devotional sonnets that do not fit
    Camões's own known biography - that modern scholarship no longer accepts
    as his. Portuguese sources today call him bluntly "um grande
    falsificador," a major falsifier: his rewritten, expanded Rimas becomes
    the base text later editors copy for two centuries, corruption included.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Manuel_de_Faria_e_Sousa"
    - "https://pt.wikipedia.org/wiki/Manuel_de_Faria_e_Sousa"
    - "https://pt.wikipedia.org/wiki/Rimas"

- id: luis-de-camoes-mickle-1776
  organisation: floating-object
  illustration_type: book-object
  images_required: 1
  date: 1776
  title: "Mickle's free \"Epic of Commerce\" becomes the most-read English Lusíadas"
  scope: industry
  reach: franchise
  impact: med
  description: >
    The Scottish poet William Julius Mickle publishes "The Lusiad; or, the
    Discovery of India" in Oxford, 121 years after Fanshawe's first English
    version and deliberately freer: Mickle puts Horace's warning against
    word-for-word translation on his own title page and calls his own
    approach "the Epic of Commerce," expanding
    [[work:luis-de-camoes/os-lusiadas|Os Lusíadas]] with interpolations that
    serve Britain's own imperial self-image rather than Camões's. The
    liberties did not hurt its reception: the edition ran through at least
    five further printings by 1877, and by scholarly consensus it remains
    the most read and cited English translation of the poem, eclipsing the
    more literal versions that came after it.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/William_Julius_Mickle"
    - "https://en.wikisource.org/wiki/The_Lusiads_(tr._Mickle)"
    - "https://www.scielo.br/j/tla/a/SrPZKQ9VWb5LqccYypKpyjb/abstract/?lang=pt"

- id: luis-de-camoes-juromenha-1861
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  date: 1861
  dateRange: "1860-1869"
  title: "Juromenha's edition swells the Rimas to 352 poems"
  scope: industry
  reach: franchise
  impact: med
  description: >
    The Visconde de Juromenha, João António de Lemos Pereira de Lacerda,
    publishes a six-volume edition of Camões's complete works through
    Lisbon's Imprensa Nacional between 1860 and 1869; the sonnets volume
    appears in 1861. Drawing on manuscript songbooks barely studied before,
    Juromenha grows [[work:luis-de-camoes/rimas|Rimas]]'s sonnet count from
    65 in the 1595 first edition to 352, attributing to Camões, as one
    modern editor puts it, "pretty well any poem he admired from the
    period." Later scholarship - the corrective work the 1932 "critical"
    edition claims and only partly delivers - spends the next century
    trying to unwind the inflation Juromenha's own edition set in motion.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Rimas"
    - "https://purl.pt/42825"
    - "https://www.arqnet.pt/dicionario/juromenha2v.html"

- id: luis-de-camoes-national-myth-1880
  organisation: medallion
  illustration_type: emblem-seal
  images_required: 1
  date: 1880
  dateRange: "1867-1880"
  title: "A statue, then a tricentenary: Camões becomes the nation's poet"
  scope: culture
  reach: franchise
  impact: high
  description: >
    In 1867 Lisbon unveils the Monumento a Camões, sculpted by Victor Bastos
    and paid for entirely by public subscription - the first public statue
    raised to a Portuguese writer, in what becomes the Praça Luís de Camões.
    The monument primes the third centenary of his death, 10 June 1880: a
    nationwide commemoration organised chiefly by the republican intellectual
    Teófilo Braga with Antero de Quental, Oliveira Martins, Ramalho Ortigão
    and João de Deus, timed to a death date the record does not actually fix
    with certainty. Braga himself called it the start of a new era of
    Portuguese "regeneration." The date sticks: a royal decree that same year
    declares 10 June a day of national celebration, the direct root of what
    later becomes Portugal's national holiday. This is the moment a
    16th-century soldier-poet is turned into the nation's founding cultural
    symbol - the reason, a century and a half later, Portuguese is still
    sometimes called "the language of Camões."
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Monumento_a_Cam%C3%B5es"
    - "https://pt.wikipedia.org/wiki/Dia_de_Portugal,_de_Cam%C3%B5es_e_das_Comunidades_Portuguesas"

- id: luis-de-camoes-rimas-1932-critical-edition
  organisation: layered-stack
  illustration_type: manuscript-proof
  images_required: 1
  modifier: fold-reveal
  date: 1932
  title: "A \"critical\" Rimas that still leans on the corrupted text"
  scope: industry
  reach: franchise
  impact: med
  description: >
    Two centuries of accretion had left [[work:luis-de-camoes/rimas|Rimas]]
    unrecognisable: the 1595 first edition's 65 sonnets had grown to 352 by
    an 1861 edition, most later identified as other poets' work
    misattributed to Camões, much of it filtered through Manuel de Faria e
    Sousa's heavily rewritten 1685 text. José Maria Rodrigues and Afonso
    Lopes Vieira publish a new edition of the Rimas in 1932 calling it
    "critical," a label later scholarship judges it does not fully earn:
    it still leans on large parts of Faria e Sousa's own corrupted readings
    despite the editors' claim to have worked from the 1595 and 1598
    originals. What the edition does accomplish is putting the textual
    fraud question beyond dispute for the first time, continuing work
    Wilhelm Storck and Carolina Michaëlis de Vasconcelos had begun decades
    earlier - so the "reliable" Rimas a reader buys today rests on an
    argument that was, in real terms, still being settled a century after
    Camões's own lifetime.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Rimas"

- id: luis-de-camoes-dia-de-portugal-1978
  organisation: diptych
  illustration_type: symbolic-still-life
  images_required: 2
  date: 1978
  title: "His death-day holiday is reclaimed from a colonial slogan"
  scope: culture
  reach: franchise
  impact: med
  description: >
    10 June, the date of Camões's death, becomes a national holiday for the
    first time under the Portuguese First Republic and is fixed nationally
    as "Festa de Portugal" by a 1925 law. The Estado Novo dictatorship keeps
    the date but reframes it: from 1933 it is known as the "Dia de Camões,
    de Portugal e da Raça," with "Raça" (the Portuguese "race") a term
    Salazar himself coined for it, and from 1963 it doubles as a
    celebration of the armed forces and colonial rule. After the 1974
    Carnation Revolution, the Third Republic drops the racial framing: a
    1978 law renames it "Dia de Portugal, de Camões e das Comunidades
    Portuguesas" - the day of Portugal, of Camões, and of the Portuguese
    communities abroad - the name and meaning it still carries. The same
    death date has anchored two very different national stories.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Dia_de_Portugal,_de_Cam%C3%B5es_e_das_Comunidades_Portuguesas"

- id: luis-de-camoes-quincentenary-2024
  organisation: marginalia
  illustration_type: emblem-seal
  images_required: 1
  date: 2024
  dateRange: "2024-2026"
  title: "Camões 500: a state commemoration for a birth year nobody can prove"
  scope: culture
  reach: franchise
  impact: low
  description: >
    The Portuguese government runs an official quincentenary programme for
    Camões's birth, opening 10 June 2024 and closing 10 June 2026 -
    exhibitions, prizes for schools, and a dedicated commissariat (Estrutura
    de Missão) under the National Library. The date it centres, 1524, is the
    same estimate this wing's own record can only call "the best surviving
    reckoning": built from a 1550 enlistment document giving Camões's age as
    twenty-five, not from any birth or baptismal register, none of which
    survives. A state marks a half-millennium against a number historians
    still qualify with "or 1525."
  spoilerAfter: null
  sources:
    - "https://observador.pt/2023/12/28/governo-cria-comissariado-para-comemoracoes-dos-500-anos-do-nascimento-de-camoes/"
    - "https://www.bnportugal.gov.pt/index.php?option=com_content&view=article&id=1912:comemoracao-v-centenario-de-luis-de-camoes&catid=175:2024&Itemid=1896&lang=pt"
