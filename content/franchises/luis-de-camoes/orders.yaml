# Additional reading orders only - the default (publication-chronological
# over all works) is derived from works.yaml. Empty: no publisher-numbered or
# critically-recommended alternative order has been sourced for this wing.
#
# The one real entry-path question this wing raises - which English
# translation of Os Lusíadas to start with - is recorded as a
# `translationNote` on that work in works.yaml rather than as an order here,
# since it is a translation choice within a single work, not a sequence
# across several. It is restated in reader-facing prose on franchise.yaml's
# startHere path, since translationNote itself renders nowhere in the app
# (SCHEMA.md).
#
# TWO CANDIDATES CONSIDERED AND REJECTED.
#
# 1. "The three comedies as a set" (Filodemo, Anfitriões, El-Rei Seleuco).
#    Portuguese sources do group the trio thematically as Camões's
#    love-themed theatre, and a 2024 Teatro Maizum production staged all
#    three together under the label "trilogia dramática" - but that is one
#    theatre company's framing for a single production, not a converged
#    reading-order practice, and no source checked recommends a sequence
#    among the three beyond what publication year already gives. It also
#    fails the divergence test on its own terms: Filodemo and Anfitriões
#    already tie for 1587 in the derived default (see #2 for that tie), and
#    El-Rei Seleuco is apocrypha-tier on a live authorship dispute (see its
#    own works.yaml entry) - folding it into "the plays" as a set would
#    understate exactly the doubt that entry states plainly.
#
# 2. A curated tie-break between Filodemo and Anfitriões, both published
#    1587 - the agatha-christie/poirot-novels precedent, where a curated
#    order's whole contribution is settling a real intra-year tie the
#    derived sort can't. The tie itself is real, and one physical fact is
#    even known: within their shared first printing (the multi-author
#    "Primeira Parte dos Autos e Comédias Portuguesas", Lisbon 1587, per a
#    period-bibliography source), Anfitriões begins on page 86 and Filodemo
#    on page 144. But no source checked treats that anthology's internal
#    page order as a reading recommendation - only as the physical layout of
#    a miscellany assembling multiple authors' plays, not just Camões's two.
#    Unlike Poirot's genuinely documented composition/publication sequence,
#    a printer's page order is not evidence of an intended reading order, so
#    encoding it as one would manufacture a claim the source doesn't make.
#
# A NOVELS- OR PLAYS-ONLY DEBATED PLACEMENT DOES NOT ARISE EITHER: every
# work in this wing sits in exactly one obvious slot (see works.yaml); there
# is no companion, anthology or disputed-attribution piece needing a home
# beyond what El-Rei Seleuco's own entry already states.
[]
