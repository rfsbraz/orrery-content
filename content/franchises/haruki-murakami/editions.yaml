# Concrete published editions: first English edition for every work that has
# one, plus the Portuguese-market edition wherever Casa das Letras (Leya
# group) or an earlier house published one. Every work's own `title` in
# works.yaml is the Japanese original, so unlike a Latin-script wing, EVERY
# edition here needs its own `title` + `language` - including the English
# ones - since the work is never already in that language.
#
# SOURCES. English: each work's own English Wikipedia infobox (publisher,
# translator, ISBN, year), cross-checked against OpenLibrary edition records
# and, for the current Vintage/Vintage Classics reissues, the publisher's own
# product pages (penguin.co.uk) for imprint and format. pt-PT: the
# Biblioteca Nacional de Portugal's ipac20 catalogue (catalogo.bnportugal.gov.pt),
# queried by author name and read as a browser (CURATION Sec.4's "blocked the
# way we asked" case) - 91 records swept across all pages, giving a title,
# translator, publisher, city, edition number and ISBN for every printing BNP
# holds. That catalogue is the source for every pt-PT entry below; the
# specific query cited in each entry's `sources` is the ISBN-indexed permalink
# for that exact printing: `ipac.jsp?index=ISBN&term=<isbn>&profile=bn`.
#
# WHICH EDITION. Default rule applied throughout: the most recent edition BNP
# or OpenLibrary/the publisher's own site attests, since that is what a reader
# can buy today. Where BNP shows a long reprint run under one ISBN root (the
# ordinary case here - Casa das Letras rarely changes the ISBN between print
# runs of the same translation), the latest dated printing of that root is
# cited even when the specific copy on a shelf might be an earlier printing.
#
# COVERAGE. 27 of this wing's 29 works have at least one edition; 23 of 29
# have a pt-PT edition. The two with no edition at all - Let's Meet in a Dream
# (never translated into English; no Portuguese edition found either) and The
# Tale of KAHO (July 2026, no translation yet) - both genuinely lack any
# translated printing to record, not a research gap. Four more have an
# English edition but no Portuguese one found in BNP's holdings: After the
# Quake, The Strange Library, Murakami T, Birthday Stories.
#
# THE PORTUGUESE PUBLISHER. Casa das Letras (Leya group, Cruz Quebrada then
# Alfragide) has published nearly the whole backlist since 2006 and remains
# active - its newest entry here is 2025 - under a single dominant
# translator, Maria João Lourenço, credited on every Casa das Letras/Bis/Leya
# printing found. Three earlier, since-superseded pt-PT editions predate her:
# Civilização's 2004 Norwegian Wood (trad. Alberto Gomes - a genuinely
# different Portuguese translation, recorded below the same way this
# catalogue already records chuck-palahniuk/fight-club's superseded 1999
# Notícias translation, via a plain `note`); and Notícias's own 2005 Sputnik,
# meu amor and 2006 Kafka à beira-mar / Crónica do pássaro de corda, which
# Maria João Lourenço translated too and which simply continued under Casa
# das Letras (Leya bought Notícias), so those two are not a translator change
# and get no second entry. Underground is the one title Casa das Letras never
# published in Portuguese: Tinta-da-China put out the only pt-PT edition
# found (2006, trad. Susana Serras Pereira), a different house and translator
# from the rest of the wing, worth flagging so a future pass does not assume
# a transcription error. Absolutely on Music's Portuguese edition is
# translated "do inglês" (from Jay Rubin's English translation, not directly
# from the Japanese) per its own BNP record - stated in that entry's note.
#
# NON-LITERAL PORTUGUESE TITLE. Blind Willow, Sleeping Woman is published in
# Portugal as "A Rapariga que Inventou um Sonho" ("The Girl Who Invented a
# Dream") - confirmed by matching the ISBN'S synopsis and full 24-story
# contents list (Goodreads edition record for that exact ISBN), not by title,
# per this catalogue's own method for a non-literal pair.
#
# THREE EDITION-LEVEL FACTS DELIBERATELY LEFT OUT: none of them is a
# translation of a whole work this bibliography lists, so none has a workId
# it could honestly attach to. "Sono" (Casa das Letras, 2013-2016,
# illustrated by Kat Menschik) is a single-story gift edition of "Sleep,"
# one of the seventeen stories inside The Elephant Vanishes, not the full
# collection. "Os Assaltos a Padaria" (Casa das Letras, 2015, also
# Menschik-illustrated) pairs "The Second Bakery Attack" with the revised
# "Pan" piece described in Let's Meet in a Dream's own works.yaml note -
# again not a translation of any single listed work. "O Sétimo Homem e
# Outros Contos" (Casa das Letras, 2026) is a comics adaptation by
# Jean-Christophe Deveney and PMGL, not a translation at all. Recording any
# of the three under an existing workId would send a reader looking for that
# whole book to a slim illustrated fragment of it instead.
#
# A FOURTH SUPERSEDED-TRANSLATION CASE, found independently of the three this
# wing's research already flagged (Hear the Wind Sing, Pinball 1973,
# Norwegian Wood): Hard-Boiled Wonderland and the End of the World's English
# translation was Alfred Birnbaum's (Kodansha International, 1991) for
# thirty-three years - unlike the other three, this WAS the general-release
# text throughout, never a Japan-only student edition - until Jay Rubin's
# new translation, retitled "End of the World and Hard-Boiled Wonderland"
# (word order reversed from the Japanese original's own order), replaced it
# in December 2024. Recorded the same way as the other three: current
# translation first, Birnbaum's superseded one second with a note.

