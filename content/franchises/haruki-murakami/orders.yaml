# Additional reading orders. There are none on record here.
#
# Three candidates were researched and rejected as ORDER objects; all three
# findings are instead expressed in franchise.yaml's startHere, where each
# actually belongs.
#
# 1. THE TRILOGY OF THE RAT. Real and received, not invented: Hear the Wind
#    Sing, Pinball, 1973 and A Wild Sheep Chase are independently called the
#    "so-called 'Trilogy of the Rat'" (Hear the Wind Sing's and A Wild Sheep
#    Chase's own Wikipedia articles) and the "'Trilogy of the Rat' series"
#    (Pinball, 1973's), each citing the same shared narrator, the friend
#    called "the Rat," and the bar owner J across all three - three
#    independent confirmations of one grouping, not one source repeated.
#    Dance Dance Dance is explicitly excluded by that same consensus as "the
#    later epilogue," never the fourth book, matching works.yaml's own note.
#    It still fails the order threshold: three works, already adjacent and
#    already in this exact sequence in the derived default (Let's Meet in a
#    Dream, dated 1981 and inserted between Pinball and Sheep Chase, is the
#    only thing standing between them, and dropping one unrelated interloper
#    is a filter, not a reshuffle). A curated order
#    that restates the default over three already-sequential books is a
#    duplicate wearing a costume. Shipped instead as a three-work startHere
#    path for the completionist/returning reader who wants the early period
#    as a set - not as an entry point, since nothing sourced recommends
#    entering there and one ranked list (Vulture) is actively unflattering
#    about A Wild Sheep Chase specifically.
#
# 2. A "BEYOND THE NOVELS" ORDER FOR THE EXTENDED TIER. Atwood's own version
#    of this order earns its slot by cutting 43 extended-tier works to 27;
#    here the tier is only twelve works (six story collections, six
#    nonfiction), and the real disparity found - five titles with a hard
#    external distinction (two awards, one Academy Award-winning
#    adaptation, one international stage adaptation, one book this wing's
#    own eras.yaml already leans on as the commitment-era's textual anchor)
#    against seven without one - means dropping to the weaker set only
#    excludes two or three of twelve. That does not clear the divergence
#    bar for a full order object on this size of tier; it does clear the
#    bar for a five-work startHere path, which is what shipped, naming its
#    own cost (everything it leaves out) rather than pretending to be
#    complete.
#
# 3. A TRANSLATION-ORDER FOR THE DUAL-TRANSLATION NOVELS. Considered and
#    rejected outright, matching this catalogue's own settled position on
#    Jo Nesbo's Harry Hole novels: a translation's release date is a fact
#    about a licensing deal, not about how the author should be read, and
#    carries no reading-order weight regardless of how long the gap was.
#    Hear the Wind Sing,
#    Pinball, 1973 and Norwegian Wood's Japan-only Kodansha English Library
#    editions are already fully documented in works.yaml's own header and
#    belong to editions.yaml from here; no order or startHere path exists
#    for it, and none should.
[]
