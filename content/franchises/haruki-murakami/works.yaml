  subseries: null
  canonTier: extended
  format: memoir
  synopsis: >
    A memoir on distance running, framed around training for the 2005 New
    York City Marathon, that doubles as Murakami's most direct account of his
    own working discipline as a novelist. The title plays on Raymond
    Carver's story collection "What We Talk About When We Talk About Love."
  note: >
    Hepburn romanization: Hashiru Koto ni Tsuite Kataru Toki ni Boku no
    Kataru Koto. Published Japan 2007, translated by Philip Gabriel, English
    2008 (Knopf).
  sources:
    - https://en.wikipedia.org/wiki/What_I_Talk_About_When_I_Talk_About_Running

