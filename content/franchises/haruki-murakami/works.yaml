# sweep the way jo-nesbo/works.yaml's own apocrypha section describes running
# (an introduction, foreword or single-story credit under his name in some
# other anthology). "Let's Meet in a Dream" (夢で会いましょう, 1981,
# co-written with copywriter Shigesato Itoi) is corroborated beyond its
# Japanese Wikipedia listing - Kodansha's own catalogue page and a real ISBN
# on the still-reprinting 1986 bunko edition - and recorded above under
# Short story collections, extended tier, since Murakami wrote his own full
# share of it independently rather than contributing one piece to a
# multi-author volume; see that entry's own note.

- id: haruki-murakami/birthday-stories
  title: "バースデイ・ストーリーズ"
  authorIds: [haruki-murakami]
  authorRole: editor
  contributionTitle: "Birthday Girl"
  published: 2002
  subseries: null
  canonTier: apocrypha
  format: anthology
  synopsis: >
    A themed anthology of stories about birthdays by other writers (Paul
    Theroux, Denis Johnson, Lynda Barry among others), selected and
    translated into Japanese by Murakami, who also contributed one original
    story of his own, "Birthday Girl."
  note: >
    Hepburn romanization: Bāsudei Sutōrīzu. Three overlapping editions exist:
    the 2002 Japanese original (11 stories, Chuokoron-Shinsha); the 2004
    English-language edition (Harvill Press), using the stories' existing
    English-language texts rather than fresh translations, for which
    Murakami wrote a new introduction and added a twelfth story (Claire
    Keegan's "Close to the Water's Edge"); and a 2006 Japanese reprint adding
    a thirteenth. "Birthday Girl," Murakami's own contribution, was later
    folded into his story collection Blind Willow, Sleeping Woman (2006).
  sources:
    - https://en.wikipedia.org/wiki/Birthday_Stories
