# FRANCHISE-SPECIFIC events: what happened to a WORK and its reception,
# rather than to Murakami the person. Author-LIFE events (the 1978 Yakult
# Swallows origin story, the 1995 Kobe earthquake and Tokyo subway sarin
# attack, the Jerusalem and Andersen award speeches, and others) live on
# content/authors/haruki-murakami.yaml instead. No global.yaml duplication:
# none of the three entries below is a world event in the catalogue's sense,
# each is specific to how one Murakami book was published, sold or censored.

- id: murakami-1q84-launch-2009
  organisation: beside
  illustration_type: press-media-collage
  images_required: 1
  date: 2009-05-29
  title: 1Q84 sells out on release day after a publisher-enforced news blackout
  scope: culture
  reach: franchise
  impact: med
  description: >
    Shinchosha released [[work:haruki-murakami/1q84|1Q84]] in Japan on 29 May
    2009 having disclosed nothing about its plot beforehand - neither
    publisher nor author gave interviews or cover copy - after Murakami
    concluded that critics leaking details of Kafka on the Shore in 2002 had
    spoiled that book's novelty for readers. Fans who knew only the title and
    author pre-ordered anyway; the first printing (300,000 copies of Book 1,
    280,000 of Book 2) sold out on release day, and Shinchosha reported
    680,000 copies sold within the first few days. Over the following twelve
    months 1Q84 became the first literary novel to top the Tohan Corporation's
    annual bestseller list since the distributor began compiling it in 1990.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/1Q84
    - https://www.cbc.ca/news/entertainment/secrets-surround-1st-murakami-novel-in-5-years-1.784160
    - https://www.independent.co.uk/arts-entertainment/books/news/murakamis-1q84-is-japans-bestselling-book-of-2009-5515151.html

- id: murakami-killing-commendatore-hk-censorship-2018
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  date: 2018-07-26
  dateRange: "2018-07"
  title: Hong Kong's Obscene Articles Tribunal rules Killing Commendatore "indecent"
  scope: culture
  reach: franchise
  impact: med
  description: >
    Hong Kong's Obscene Articles Tribunal gave the Chinese-language edition
    of [[work:haruki-murakami/killing-commendatore|Killing Commendatore]] an
    interim Class II ("indecent") classification on 12 July 2018, made
    official on 26 July, over its sexual content. The ruling meant the novel
    could only be sold with its cover wrapped in a warning notice and
    restricted to buyers eighteen and over, and it was pulled from the
    publisher's booth at that year's Hong Kong Book Fair; public libraries
    applied the same opaque wrappers to their own copies. The decision drew a
    petition of almost 2,000 signatures and public criticism from PEN Hong
    Kong, whose president asked why Murakami's treatment of sex was judged
    more indecent than passages taught as classics in Hong Kong schools. The
    novel had gone on sale in Japan the previous year with midnight bookstore
    openings and queues of fans, the same reception later repeated for The
    Tale of KAHO.
  spoilerAfter: null
  sources:
    - https://www.theguardian.com/books/2018/jul/25/haruki-murakami-novel-indecent-hong-kong-censors-killing-commendatore
    - https://www.info.gov.hk/gia/general/201810/31/P2018103100465.htm
    - https://hongkongfp.com/2018/07/23/hong-kongs-obscene-articles-tribunal-fire-classifying-murakamis-literary-work-indecent/

- id: murakami-kaho-midnight-launch-2026
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 2026-07-03
  title: Fans queue past midnight for The Tale of KAHO, his first novel with a sole female lead
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:haruki-murakami/the-tale-of-kaho|The Tale of KAHO]] went on sale in
    Japan on 3 July 2026 with a countdown event at a Tokyo Kinokuniya
    bookstore, where fans who had pre-ordered received their copies the
    instant the clock struck midnight. In a message posted on the publisher's
    campaign site, Murakami wrote of his protagonist: "Kaho, a picture book
    author, is just an average young woman. But truly bizarre things start
    happening around her. I wrote this novel as I put myself in her shoes" -
    a departure fans at the event singled out, since nearly all of his
    full-length protagonists before Kaho had been young or middle-aged men.
  spoilerAfter: null
  sources:
    - https://apnews.com/article/haruki-murakami-new-novel-tale-of-kaho-f2e5cd19bbc19ab2004a8e9e37a97709
    - https://apnews.com/article/haruki-murakami-japan-novel-release-kaho-04accdae3413d874b284a128ec3e4616
