# Creative periods.
#
# Two eras, and they are the same two the criticism uses. A. K. Byron's
# peer-reviewed article in New Voices in Japanese Studies opens: "The career
# of novelist Haruki Murakami has conventionally been divided into two
# periods: detachment and commitment." The labels are not the critics'
# either. They are Murakami's own, in his own katakana loanwords
# (デタッチメント / コミットメント), from his book of conversations with the
# psychologist Hayao Kawai, 村上春樹、河合隼雄に会いにいく (Iwanami Shoten,
# 5 December 1996; the conversations were recorded in November 1995), where he
# describes "moving from a position of 'detachment to commitment'". Both rungs
# hold at once: the author named the two periods and the scholarship adopted
# them.
#
# LANGUAGE. Sought in Japanese as well as English, since the consensus that
# matters for a Japanese novelist is the Japanese one. It is there: Byron
# cites Kuroko Kazuo (2007) on the 転換 ("transition"), Kuronuma (1999) on how
# much scholarship the idea went on to inform, Yoshida Haruo (1997), Watatsuki
# (2016) and Karatani Kojin (1990) on detachment as the trait that typifies
# the early work. Japanese Wikipedia's biography carries a section headed
# 「デタッチメント」から「コミットメント」へ, the same division under the same
# name. The terms are English loanwords in Japanese, so the received form and
# the English form are the same words; nothing here is translated by us.
#
# THE BOUNDARY, separately. Every account puts the hinge at The Wind-Up Bird
# Chronicle: Byron, "Murakami's transition from detachment to commitment is
# generally thought to begin in earnest ... in the novel The Wind-Up Bird
# Chronicle", and Murakami himself, of that novel, "First came the aphorism
# and the sense of detachment, and then the process of telling the story
# itself, but ultimately I came to feel that something was missing. I suppose
# this is how commitment came into it." The novel was published in Japanese
# in two instalments, Books 1 and 2 in April 1994 and Book 3 in August 1995,
# which is why sources cite it as [1995], [1994] or [1994-95] interchangeably.
# works.yaml dates it 1994, its first publication. The boundary is drawn at
# 1994 so that the novel every source names as the hinge falls on the
# commitment side of it, which is the whole point of the division. 1993 is the
# last year of the detachment span and holds The Elephant Vanishes; nothing
# falls in the join.
#
# ONE CONTESTED EDGE, kept rather than smoothed. Yoshida Haruo (1997) built a
# book on Underground (1997) as the watershed instead, and later withdrew the
# assessment. The two candidates are three years apart and the argument between
# them is about where the period starts, not whether it exists.
#
# GENRE REACH. The scheme is not novels-only, and this is not a concession:
# the two books most often produced as evidence of the commitment turn are a
# work of nonfiction (Underground, 1997) and a short-story collection (after
# the quake, 2000). Both sit inside the commitment span and belong there. The
# lighter nonfiction, though, falls inside by date and by nothing else: no
# source claims What I Talk About When I Talk About Running (2007), Absolutely
# on Music (2011) or Murakami T (2020) for a period of anything, and the same
# goes for Birthday Stories (2002), an anthology of other writers' stories that
# Murakami edited. The Elephant Vanishes (1993) collects stories written across
# 1983-1990 and sits inside the detachment span on either its compilation year
# or its writing years, so nothing turns on which is used.
#
# REJECTED PERIODISATIONS, recorded so the next reader does not re-derive them:
#   - A break at Hard-Boiled Wonderland and the End of the World (1985), where
#     the fantastic takes over. Real as a description of the books and drawn by
#     nobody as a period boundary; the criticism keeps the whole run before
#     1994 on the detachment side, and the 1985 event in the record is a prize
#     (the Tanizaki), not a turn.
#   - A break at Norwegian Wood (1987) for its swerve into straight realism.
#     Better sourced as a fact about the one book (the Paris Review calls it
#     "his first realistic novel", and notes he "has never returned to the
#     straightforward lyricism" of it) and as the commercial event that made
#     him famous enough to leave Japan in 1986. Still nobody's period boundary,
#     and Murakami's own division runs straight through it.
#   - The expatriate years, roughly 1986 to June 1995 (fellowships at
#     Princeton, Tufts and Harvard, where South of the Border, West of the Sun
#     and The Wind-Up Bird Chronicle were written). A real, dateable span, but
#     Murakami folds it into the commitment turn rather than setting it beside
#     one: he told Kawai he changed position "after staying in the United
#     States in the 1990s". It belongs to the life timeline, not to a plate.
#   - A "kitchen-table" or pre-professional first period covering the two
#     novels written while he still ran the jazz bar Peter Cat (1974-1981).
#     Murakami calls those two books "immature" and "flimsy" and kept them out
#     of general English release for over twenty-five years, but that is a
#     verdict on two books, not a period anyone draws, and carving 1979-1981
#     out would contradict the criticism, which places all three Rat Trilogy
#     novels squarely in detachment.
#   - A late style opening at 1Q84 (2009). Looked for and not found: no source
#     names a third period, and the two terms are still the ones reached for
#     when the late novels are discussed. Lee Eunlye, "Haruki Murakami's
#     'Detachment' and 'Commitment' in 1Q84" (The Korean Journal of Japanology
#     130, 2022, 207-228) reads the 2009 novel through exactly this division,
#     and dates its start the same way from a third scholarly tradition:
#     "the existing attitude of detachment and commitment which began with the
#     The Wind-Up Bird Chronicle (1994-1995, Volume 3)", triggered by "the
#     change in Haruki's view of Japan and the Japanese people from abroad, and
#     the 1995 Hanshin Earthquake and the Aum Shinrikyo subway Sarin incident".
#
# The commitment span is left open because no source closes it. Japanese
# Wikipedia's own headings after this point stop periodising and become decade
# buckets (2000年代の活動, 2010年代以降の活動), which is a chronology, not a
# third phase.
#
# Every work in the bibliography, 1979 to 2026, falls inside one of the two
# spans. There are no orphans and no interior gap.

- id: detachment
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: Detachment
  period: "1979-1993"
  themes: [the unnamed narrator, American pop culture in a Tokyo bar, loss and the thing that vanishes, the uncanny inside the ordinary, distance held on purpose]
  provenance: author
  description: >
    デタッチメント, Murakami's own word for the stance he wrote from first, and
    the one his critics in Japan fastened on: a narrator who stays cool and
    intellectually distant from whatever strange thing is happening to him,
    told in a flat, translated-sounding prose that broke with the Japanese
    literary novel of the time. The Trilogy of the Rat establishes almost
    every later habit at once, from
    [[work:haruki-murakami/hear-the-wind-sing|Hear the Wind Sing]] (1979) and
    [[work:haruki-murakami/pinball-1973|Pinball, 1973]] to
    [[work:haruki-murakami/a-wild-sheep-chase|A Wild Sheep Chase]] (1982). Then the
    fantastic takes the wheel in
    [[work:haruki-murakami/hard-boiled-wonderland-and-the-end-of-the-world|Hard-Boiled
    Wonderland and the End of the World]] (1985), realism takes it back in
    [[work:haruki-murakami/norwegian-wood|Norwegian Wood]] (1987), which sold
    in the millions and made staying in Japan impossible, and
    [[work:haruki-murakami/dance-dance-dance|Dance Dance Dance]] (1988) returns
    to the Rat's narrator one last time. Kojin Karatani read the detachment as
    a missing sense of history; Murakami, later, read it as a position he was
    ready to leave.
  note: >
    1979 is the year of the first novel, not a boundary anyone draws. The end
    of the span is the sourced half: the criticism dates the turn to The
    Wind-Up Bird Chronicle, whose first instalment is 1994, so 1993 is the last
    detachment year. "Detachment" is used here because it is the received term,
    Murakami's before it was anyone else's; the critics who used it as a
    complaint are reported rather than joined.
  sources:
    - "https://doi.org/10.21159/nvjs.09.03"
    - "https://newvoices.org.au/media/JPF-New-Voices-in-Japanese-Studies-Vol-9-byron.pdf"
    - "https://en.wikipedia.org/wiki/Haruki_Murakami"
    - "https://ja.wikipedia.org/wiki/%E6%9D%91%E4%B8%8A%E6%98%A5%E6%A8%B9"

- id: commitment
  organisation: chapter-gate
  illustration_type: atmospheric-motif-field
  images_required: 1
  title: Commitment
  period: "1994-present"
  themes: [history and what was done in it, collective trauma, violence under the surface, the interview and the document, the long novel]
  provenance: author
  description: >
    コミットメント. "More recently, I've been thinking a lot about the concept
    of commitment," Murakami told Hayao Kawai in 1996. "For example, even when
    I'm writing a novel it's become a very important thing for me. Though up
    until now detachment has been important for me." The turn shows first in
    [[work:haruki-murakami/the-wind-up-bird-chronicle|The Wind-Up Bird
    Chronicle]], which puts Japanese wartime atrocities in Manchuria inside a
    novel that begins as a man looking for his cat. He came home from the
    United States in June 1995, between the Kobe earthquake in January and the
    Aum Shinrikyo sarin attack on the Tokyo subway in March, and answered both
    directly: [[work:haruki-murakami/underground|Underground]] (1997) is
    interviews with the victims, his first book of nonfiction, and every story
    in [[work:haruki-murakami/after-the-quake|after the quake]] (2000) is set
    in the single month between the two events. The novels that follow are the
    longest and most structurally ambitious he has written, from
    [[work:haruki-murakami/kafka-on-the-shore|Kafka on the Shore]] (2002) and
    [[work:haruki-murakami/1q84|1Q84]] (2009) to
    [[work:haruki-murakami/killing-commendatore|Killing Commendatore]] (2017)
    and [[work:haruki-murakami/the-city-and-its-uncertain-walls|The City and
    Its Uncertain Walls]] (2023).
  note: >
    The span is left open because no source closes it, and the terms are still
    the ones applied to the late novels. Its start is contested by three years:
    the usual reading begins it at The Wind-Up Bird Chronicle, Haruo Yoshida
    (1997) began it at Underground instead, an argument about the edge rather
    than about the period. The lighter nonfiction inside the span falls there
    by publication year alone and carries no claim from this era.
  sources:
    - "https://doi.org/10.21159/nvjs.09.03"
    - "https://newvoices.org.au/media/JPF-New-Voices-in-Japanese-Studies-Vol-9-byron.pdf"
    - "https://doi.org/10.15532/kaja.2022.02.130.207"
    - "https://en.wikipedia.org/wiki/Haruki_Murakami"
    - "https://ja.wikipedia.org/wiki/%E6%9D%91%E4%B8%8A%E6%98%A5%E6%A8%B9"
