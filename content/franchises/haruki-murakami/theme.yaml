preset: after-hours-tokyo
palette:
  bg: "#12141c"
  surface: "#1b1e29"
  ink: "#e9e6df"
  muted: "#8b8f9c"
  accent: "#c98a3a"
displayFace: spectral
signature: thread
notes: >
  A late-night register for a writer whose novels mostly happen after dark:
  near-black indigo standing in for a Tokyo night sky and jazz-bar interiors,
  one warm whiskey-amber accent (a nod to the jazz bars and the running-shoe
  discipline underneath the surrealism, never a genre costume), a quiet
  serif and a single hairline signature rather than anything louder - the
  restraint matches the prose more than the plot.
