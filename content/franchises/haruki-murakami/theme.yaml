preset: after-hours-tokyo
palette:
  bg: "#12141c"
  surface: "#1b1e29"
  ink: "#e9e6df"
  muted: "#8b8f9c"
  accent: "#c98a3a"
displayFace: spectral
signature: thread
notes: >
  A late-night register for a writer whose novels mostly happen after dark:
  near-black indigo standing in for a Tokyo night sky and jazz-bar interiors,
  one warm whiskey-amber accent (a nod to the jazz bars and the running-shoe
  discipline underneath the surrealism, never a genre costume), a quiet
  serif and a single hairline signature rather than anything louder - the
  restraint matches the prose more than the plot.

# ART. This wing's own accent (#c98a3a) sits inside the same warm gold-amber
# family as brandon-sanderson and robert-jordan's shared #c8a24a, and all
# three wings use the spectral display face over a near-black indigo ground
# - the tightest three-way cluster on that axis in the catalogue. Neither
# fantasy wing is drawn as an object at all here: Sanderson is instrument
# (ruled, mineral, a plumb bob), Jordan is textile (flowing, woven, a
# shuttle), so this wing takes the material neither claims - domestic and
# soft-edged rather than engineered or woven, a well rather than a tool.
# jim-butcher, the fourth spectral-and-warm-amber wing, is also urban and
# nocturnal, so lineCharacter and accentUse are held to the one register
# that isn't already his: no carried light held against a much larger dark,
# no hard chiaroscuro pool of shadow. Two more neighbours claim this wing's
# other obvious reach before it gets there: michael-connelly's accent already
# stands for Bosch's own jazz listening (a trumpet bell), and joao-tordo
# already stages a late-night jazz bar as one of its motifs - so this wing's
# music motif is the record itself, held or spinning, never the venue or the
# instrument. jose-luis-peixoto's own motifs include "dry stone walls and
# wells," but that well sits in noon glare on a sunbaked Alentejo plain, lit
# by the same wheat-gold accent as the rest of that wing's daylight register
# - the opposite treatment from the one below, which is unlit, seen from
# directly above, and never in daylight.
art:
  emblem:
    object: >
      An old masonry well, its plank lid pushed aside, seen from directly
      above so the shaft drops away into a darkness the drawing does not
      resolve. No rope, bucket or figure - the opening alone, in worn,
      long-settled stone.
    why: >
      The Wind-Up Bird Chronicle's own synopsis in this bibliography names
      "a dry well" among the handful of things stated outright about that
      book, and wells and dry shafts are named on the jacket copy itself, so
      drawing one discloses nothing a reader couldn't already see on the
      cover. It is also the object that carries
      this wing's real subject without depicting any one novel's plot: a
      fixed, ordinary structure that is nonetheless a passage to somewhere
      the image declines to show, standing in for every unresolved opening
      between an ordinary Tokyo and whatever sits underneath or beside it -
      without staging the two Hard-Boiled Wonderland strands, any specific
      character's descent, or the pit Killing Commendatore's own painting
      opens.
  motifs:
    - an old, dry masonry well or shaft glimpsed in passing, its lid on or
      off, never entered and never explained
    - a record spinning on a turntable, or a small stack of albums and
      sleeves set out for a night alone
    - a plain meal cooked and eaten alone, late, at a small kitchen table -
      a pan of spaghetti, a sandwich cut in half, a pot left simmering
    - a cat, indoor or stray, watching from a sill, a step or a doorway,
      present without being remarked on
    - two identical or near-identical doors, corridors or streets that
      cannot both be where they seem, neither one resolved as the "real" one
    - an empty road at first light, or a single pair of worn running shoes
      left by a door
    - an ordinary apartment interior at night, one lamp lit, everything else
      put away and still
  atmosphere: >
    Quiet and deadpan rather than gothic or feverish: the uncanny is met in
    the same flat, matter-of-fact tone as making dinner or doing the
    laundry, never staged as dread or wonder. Night is the default register
    - a solitary interior lit by one lamp or a record player's dial, a
    nearly empty street, an all-night diner - but the flatness holds even in
    a daylight scene; this is domestic strangeness, not nocturnal spectacle
    for its own sake. Never the tension of someone on duty after dark (that
    belongs to a neighbouring wing on this shelf), never a diagram's cold
    instrumentation, never a woven pattern's warm hand-craft - closer to
    waiting alone for a kettle to boil while something impossible has
    happened two rooms away and nobody has remarked on it yet.
  lineCharacter: >
    A plain soft-pencil or fine dry-brush line, unhurried and slightly
    rounded rather than ruled or hatched, held exact and steady wherever it
    draws an ordinary object - a record sleeve, a saucepan, a shoe by the
    door - and then, without changing tool or pressure, allowed to lose its
    edge and soften into the paper's grain exactly at the point where the
    ordinary gives on to something else. The blur is local and earned, never
    a wash over the whole image: everything mundane stays in sharp, almost
    catalogue-plain focus, and only the seam where the scene tips sideways
    goes soft. Distinct from a draughtsman's ruled straightedge, from a
    flowing decorative interlace, and from a hard-edged chiaroscuro pool of
    ink held as one flat shadow - none of those three lines own an edge that
    dissolves the way this one does.
  backgroundTexture: >
    A plain, lightly toned cream sheet with almost no visible fibre or
    grain - the flat matte stock of a well-kept paperback rather than a
    textured artist's paper - broken only by the faint ghost of a circular
    ring, the way a record sleeve left face-down overnight prints a pale
    round shadow onto the page beneath it.
  accentUse: >
    Whiskey-amber on exactly one element per image, never a wash or a fill:
    the lit dial or VU needle of a record player or radio, the glass of a
    drink caught by a single lamp, or the coal of a lit cigarette. Never a
    lit window seen from outside a building down an otherwise dark street -
    that device is already the accent mark of two neighbouring wings on this
    shelf, and this wing's own light source stays domestic, held in the hand
    or standing on a shelf, not glimpsed from the street.
  avoid:
    - the two Hard-Boiled Wonderland strands (the Tokyo Calcutec, the walled
      Town) drawn as one figure, one mind or a mirrored self; keep them as
      two unrelated scenes if both appear in the same rotation
    - the small figure from the Commendatore painting, or any pit shown
      freshly opened with disturbed earth around it; this wing's own well is
      old, dry and walled in worn, settled masonry, never newly dug
    - Aomame and Tengo drawn as children, or drawn together in the same scene
    - ukiyo-e woodblock style, geisha, kimono, a pagoda roofline or any "old
      Japan" costume shorthand - a contemporary, unglamorous register, not a
      folkloric one
    - a neon Shibuya-crossing, a vending-machine-lit alley or any
      cyberpunk-Tokyo skyline cliche - too loud and too now for a wing this
      quiet
    - melting clocks, a lone giant eyeball or other generic "surrealism"
      signage borrowed from outside this author's own imagery
    - a jazz club, bar interior or brass instrument played as the music
      motif, or fedora-and-rain noir costuming; two neighbouring wings on
      this shelf already stand for jazz venues and hard-boiled costume, so
      this wing's music stays the record itself, held or spinning, never the
      room it plays in
    - a draughtsman's ruled straightedge line, a flowing decorative
      interlace, or a hard flat-ink chiaroscuro pool of shadow - each
      already belongs to a specific neighbouring wing on this shelf
    - amber used as a wash, glow or fill rather than one exact lit mark
