# Branding for the John Shirley wing (see Orrery CONCEPT SS6 - the design
# law, and docs/SCHEMA.md#themeyaml). Checked against every existing wing's
# palette/face/signature before choosing. This author crosses more genres
# than any other wing on the shelf (cyberpunk, splatterpunk horror, licensed
# tie-ins, pulp men's-adventure, Westerns), so the palette does not costume
# any one of them; it pulls the one thing true of his whole working method
# instead - a musician's and small-press writer's DIY, disposable-media
# culture (gig flyers, xeroxed zines, mass-market paperback racks), which
# runs under cyberpunk, splatterpunk and pulp Western alike.
preset: xerox-punk
palette:
  bg: "#150c12"       # near-black with a bruised magenta-black cast - a
                      # basement club after the lights come up, not any
                      # other wing's brown (King), blue-grey (Palahniuk) or
                      # violet-indigo (Jim Butcher)
  surface: "#1f131a"  # a hair lifted, for cards
  ink: "#ece2e4"      # pale bone-white with a cool cast, high contrast
  muted: "#8f7b84"    # dusty mauve-grey, for metadata
  accent: "#e0227d"   # one hot photocopy-riso magenta, unclaimed by any
                      # other wing (greens, ambers/golds, oxblood/terracotta,
                      # cobalt and heather-violet are all already spoken for)
                      # - a punk flyer's single spot color, used sparingly
displayFace: fraunces # from the app's implemented set (fraunces | spectral |
                      # sourceSerif); the most characterful of the three,
                      # fitting prose critics call "rigorously horrifying"
                      # and a career McCaffery called "postmodern Poe" -
                      # not the plain sourceSerif already used seven times,
                      # not the scholarly-calm spectral
signature: thread     # a quiet hairline the works are strung along. Not
                      # `beam` (no single connecting thread runs through
                      # cyberpunk, horror, tie-ins and Westerns the way the
                      # Dark Tower runs through Stephen King) and not `none`
                      # (unlike Jim Butcher's three walled-off series, this
                      # career genuinely is one continuous working life -
                      # the same restless, prolific hand moving between
                      # forms for five decades). A quiet line fits a career
                      # defined by constant output rather than one signature
                      # magnum opus.
art:
  emblem:
    object: >
      A single photocopied gig flyer, stapled through one corner to a
      post, its toner already starting to bleed and its edges curling -
      no band name or legible text, just the object.
    why: >
      Shirley fronted punk bands (Sado-Nation, Obsession, the Panther
      Moderns) and hand-flyered his own gigs before and alongside every one
      of his writing careers, and his small-press and men's-adventure
      paperback work moved through the same disposable, self-made,
      mass-market print culture as a xeroxed flyer - cheap, urgent, made to
      be replaced next week. It is the one object that does not costume any
      single genre on this shelf: a cyberpunk paperback, a splatterpunk
      chapbook, a licensed tie-in mass-market and a pulp Western spinner-
      rack title are all, in this sense, the same kind of object.
  motifs:
    - a chain-link fence with one flyer stapled to the post, corners curling
    - a cracked payphone-booth pane under a sodium streetlight
    - a strip-mall storefront at night, hand-lettered sign, one light left on
    - a cassette deck or reel-to-reel, its VU needles pinned into the red
    - an all-night diner counter or bus-depot bench, otherwise empty
    - a desert two-lane seen through a windshield's spiderwebbed crack
    - a paperback spinner rack, spines faded, one title askew
  atmosphere: >
    Cheap fluorescent tubes and all-night neon, never candlelit gothic. A
    working-class, disposable-media world, paperback racks, mixtapes,
    xeroxed flyers, where the horror, the future and the frontier all arrive
    through the same cracked glass rather than through separate genre
    costumes.
  lineCharacter: >
    Felt-tip marker or a chewed ballpoint, slightly smeared and urgent, as
    if drawn in the five minutes before a gig rather than studied in a
    studio. No dip-pen elegance, no polished linework.
  backgroundTexture: >
    Toner-starved photocopy paper, newsprint-grey, a faint moire from a
    fourth-generation Xerox, a staple-hole shadow in one corner.
  accentUse: >
    Hot riso-magenta on exactly one element per image, never a wash or a
    fill: a single stamped or hand-inked mark, a lit exit sign, a cassette's
    snapped-off record tab.
  avoid:
    - graphic gore or dripping-blood imagery, despite the splatterpunk
      association - the dread stays implied, never staged
    - zombie or killer-robot camp, despite the Zombies vs Robots tie-in
    - wizard-hat or sword-and-sorcery fantasy costume, despite Kamus of
      Kadizar
    - cowboy-hat-and-spurs Western kitsch for the Cleve Trewe books - a
      worked, dusty frontier, not a rodeo poster
    - glossy corporate-cyberpunk neon-grid cliches (chrome skylines, laser
      grids) - this wing's future is analog and lo-fi, not CGI
    - any depiction of The Crow's own copyrighted characters or the 1994
      film's visual identity - that credit belongs to another property
      entirely and is aura, not shelf (see franchise-research skill)
notes: >
  One restless, prolific working life, not one genre. A bruised-magenta
  basement-club near-black, bone-white type, a single hot riso-pink accent
  used the way a flyer uses its one spot color, and a quiet thread rather
  than a bold signature, because the throughline here is constant output
  across five decades and half a dozen forms, not one connecting artifact.
