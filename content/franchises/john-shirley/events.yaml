# FRANCHISE-SPECIFIC events only. Author-LIFE events (birth, his father's
# death and the Clarion break it paid for, Sado-Nation and meeting Gibson,
# the 1992 marriage) live on the author entity
# (content/authors/john-shirley.yaml). Shared world/culture events live in
# content/events/global.yaml.
#
# Eight entries, 1985-2024, weighted first toward 1983-1994 (three land
# inside it: 1985, 1989, 1992 twice over) and second toward the years after
# it, which otherwise carry nothing past the 1996 Gibson introduction.
#
# The Crow and the Blue Öyster Cult lyrics are deliberately absent from
# works.yaml - a screenplay credit and a songwriting credit, not books - so
# they live here instead; that is their only home in this wing.
#
# Candidates tested and left out:
#   - the 1998 Bram Stoker Award for Black Butterflies: already named in the
#     author bio prose, and the record gives no story behind the win beyond
#     the win itself - a second mention would restate the fact, not add to it
#   - the pseudonymous Traveler (as D. B. Drumm) and Specialist (as John
#     Cutter) work, 1984-1986: real and already carried in the author's
#     pseudonyms block; no interview or profile gives a specific, dateable
#     account of why he took the work beyond the general "I don't have a day
#     job" line reported secondhand, which is too thin to hang a dated event on
#   - a 2011 TEDx Brussels appearance (named in passing in the Ventrella
#     interview's introduction): a speaking engagement with no reported
#     content and no mark on the shelf - trivia
#   - the 2010s tie-in run itself (BioShock, Halo, Borderlands, Predator,
#     Batman, Hellblazer, 2006-2014): real and dense, but no single title in
#     it has a sourced production story distinct from "a licensed novel was
#     commissioned and delivered" - already legible from works.yaml alone

- id: john-shirley/eclipse-antifascist-origin-1985
  organisation: beside
  illustration_type: historical-context-tableau
  images_required: 1
  date: 1985
  title: A Song Called Youth begins as a warning shot from France
  scope: author-life
  reach: franchise
  impact: med
  description: >
    Some years before writing it, Shirley lived in France and watched a wave
    of neo-fascism return as the working class reacted against a new
    generation of immigrants - the mood he later associates with Jean-Marie
    Le Pen's National Front. [[work:john-shirley/eclipse|Eclipse]], opening
    the trilogy, is his answer: a deliberately antifascist science-fiction
    warning, projecting that same fear and disinformation forward into a
    near-future European police state. In later interviews he traces the
    same mechanics - lies that "take on a kind of viral life of their own" -
    forward again, into QAnon and deepfakes.
  spoilerAfter: null
  sources:
    - https://fantasy-hive.co.uk/2021/04/interview-with-john-shirley-stormland/
    - https://en.wikipedia.org/wiki/Eclipse_Trilogy

- id: john-shirley/heatseeker-1989
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 1989
  title: Heatseeker collects the short fiction, with a Gibson introduction and a Sterling co-write
  scope: culture
  reach: franchise
  impact: med
  description: >
    Scream Press publishes [[work:john-shirley/heatseeker|Heatseeker]],
    gathering stories written between 1975 and 1988. William Gibson supplies
    the introduction - seven years before the more famous one he writes for
    the 1996 [[work:john-shirley/city-come-a-walkin|City Come A-Walkin']]
    reissue - and the collection includes "The Unfolding," co-written with
    Bruce Sterling. The Locus Readers' Poll names it one of the year's best
    short-story collections, a rare piece of mainstream-genre recognition in
    a career mostly built on paperback originals and small presses.
  spoilerAfter: null
  sources:
    - http://project.cyberpunk.ru/idb/heatseeker.html
    - https://www.risingshadow.net/book/18689-heatseeker

- id: john-shirley/blue-oyster-cult-lyrics-1992
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  date: 1992
  dateRange: "1992-2020"
  title: Starts writing lyrics for Blue Öyster Cult
  scope: author-life
  reach: franchise
  impact: med
  description: >
    A mutual friend puts Shirley's lyrics in front of Blue Öyster Cult, who
    are looking for a writer; "Demon's Kiss" and "The Horsemen Arrive," his
    first two recorded lyrics for the band, appear on the soundtrack to the
    low-budget science-fiction film Bad Channels. He faxes lyric sheets to
    guitarist Buck Dharma for years, later emails them; the arrangement
    grows across Heaven Forbid (1998), Curse of the Hidden Mirror (2001) and
    The Symbol Remains (2020) into 23 recorded songs in all - a second,
    parallel writing career that started, in a sense, before his first
    novel did: [[work:john-shirley/transmaniacon|Transmaniacon]] is already
    named for one of the band's own songs.
  spoilerAfter: null
  sources:
    - https://john-shirley.com/music/BOC.html
    - https://en.wikipedia.org/wiki/John_Shirley

- id: john-shirley/the-crow-1994
  organisation: immersion
  illustration_type: portrait-of-absence
  images_required: 1
  date: 1994
  dateRange: "1989-1994"
  title: "The Crow: his screenplay, then someone else's, then a death on set"
  scope: author-life
  reach: franchise
  impact: high
  description: >
    Around the time James O'Barr's still-unfinished comic reaches its third
    issue, Shirley and producer Jeff Most option it and he writes the
    original adaptation - four drafts over roughly two years, faithful
    enough to the comic to keep its talking crow. In 1991 the production
    brings in David J. Schow to rewrite it into the harder, more wordless
    film that reaches the screen; the finished 1994 picture credits Schow's
    screenplay as "based on a screenplay by John Shirley." Star Brandon Lee
    is killed by a malfunctioning prop gun on set on March 31, 1993, days
    before filming was due to wrap; the film is finished and released
    without him, on May 11, 1994. Shirley later says he "couldn't be
    pleased" by how the production ended, whatever the finished film's own
    success.
  spoilerAfter: null
  sources:
    - https://www.mentalfloss.com/article/74690/18-fascinating-facts-about-crow
    - https://www.dreadcentral.com/news/269577/unearthed-exclusive-part-1-of-2-twenty-four-years-after-its-release-screenwriter-david-j-schow-talks-the-crow/
    - https://www.altx.com/int2/john.shirley.html
    - https://michaelaventrella.com/2012/06/07/interview-with-bram-stoker-award-winning-author-john-shirley/

- id: john-shirley/gibson-patient-zero-1996
  organisation: immersion
  illustration_type: symbolic-still-life
  images_required: 1
  date: 1996
  title: William Gibson's introduction crowns him "Cyberpunk's Patient Zero"
  scope: culture
  reach: franchise
  impact: high
  description: >
    Eyeball Books reissues
    [[work:john-shirley/city-come-a-walkin|City Come A-Walkin']] sixteen
    years after its unnoticed 1980 paperback-original release, with a new
    introduction by William Gibson naming Shirley "cyberpunk's Patient
    Zero, first locus of the virus, certifiably virulent" and admitting he
    was "somewhat chagrined, rereading it recently, to see just how much of
    my own early work takes off from this one novel." The introduction
    recasts a book that first sold below the genre's radar as the
    acknowledged root of the movement Gibson himself is credited with
    founding.
  spoilerAfter: null
  sources:
    - https://john-shirley.com/books/Gibson-on-CityComeaWalkin.html
    - https://cyberartsweb.org/cpace/scifi/cyberbib/Essays/Shirley-b.htm

- id: john-shirley/tremonti-collaboration-2018
  organisation: beside
  illustration_type: relationship-tableau
  images_required: 1
  date: 2018
  title: A booking agency pairs him with a rock guitarist to novelize a concept album
  scope: author-life
  reach: franchise
  impact: med
  description: >
    Tremonti frontman Mark Tremonti wants to write a novel version of his
    band's concept album A Dying Machine but cannot do it and record the
    record at the same time; his booking agency's literary division pairs
    him with Shirley, whose science fiction Tremonti calls "perfect for
    this" and full of "a very human side." The two build a 29-page outline
    over repeated phone calls, Tremonti narrating and Shirley writing it
    back changed, and Shirley drafts the opening chapters as the album
    releases. [[work:john-shirley/a-dying-machine|A Dying Machine]] is
    completed in June 2018 - a third parallel-medium writing partnership
    alongside the Blue Öyster Cult lyrics and The Crow, and the first time
    a musician commissions him rather than the other way around.
  spoilerAfter: null
  sources:
    - https://www.billboard.com/music/rock/mark-tremonti-discusses-concept-album-a-dying-machine-novel-john-shirley-8337818/
    - https://en.wikipedia.org/wiki/John_Shirley

- id: john-shirley/nyt-living-shadows-2008
  organisation: beside
  illustration_type: press-media-collage
  images_required: 1
  date: 2008
  title: The New York Times reviews him, three decades in
  scope: culture
  reach: franchise
  impact: med
  description: >
    Terrence Rafferty reviews
    [[work:john-shirley/living-shadows|Living Shadows]] in The New York
    Times, calling it "a greatest-hits album spanning a few decades of
    astonishingly consistent and rigorously horrifying work" and naming
    "the terrible ease with which we modern Americans have learned to look
    away from pain and suffering" as Shirley's great subject - the paper of
    record's first substantial notice of a writer nearly thirty years into
    a career reviewed, when it was reviewed at all, mostly by the genre press.
  spoilerAfter: null
  sources:
    - https://www.nytimes.com/2008/01/27/books/review/Rafferty-t.html?_r=2&pagewanted=all
    - https://en.wikipedia.org/wiki/John_Shirley

- id: john-shirley/spur-award-2024
  organisation: marginalia
  illustration_type: emblem-seal
  images_required: 1
  date: 2024
  title: Wins the Spur Award for a Western, six decades in
  scope: industry
  reach: franchise
  impact: med
  description: >
    The Western Writers of America gives
    [[work:john-shirley/gunmetal-mountain|Gunmetal Mountain]], the second
    Cleve Trewe novel, its Spur Award for Mass Market Paperback Novel - a
    trade prize in a genre Shirley enters only from 2022, in his late
