# Creative periods. There are none on record.
#
# No critic, reference work, encyclopedia or settled readership divides this
# author's career into named periods. The two reference works that assess the
# whole career both narrate it in publication order and name no phases. The
# Encyclopedia of Science Fiction moves from the first novels through "some
# horror novels" and the Traveler house-name books to "his finest sf work in
# the Cyberpunk-coloured Song Called Youth trilogy", then to "the best of his
# later books" (https://sf-encyclopedia.com/entry/shirley_john): those are
# verdicts on individual titles laid out chronologically, not a periodisation,
# and "later" is the only temporal term in the entry. The St. James Guide to
# Horror, Ghost and Gothic Writers entry (1998, pp. 531-533), quoted at length
# in the Gale Contemporary Authors record, is organised by theme rather than
# by date and offers only "has produced important and influential work ...
# distinctly his own"
# (https://www.encyclopedia.com/arts/educational-magazines/shirley-john-1953).
#
# His own long first-person career memoir narrates the career in order and
# names no period either
# (https://boingboing.net/2026/02/25/john-shirleys-guide-to-wrecking-your-career-in-science-fiction.html).
# The nearest he comes to periodising himself is unnamed and undated: of the
# licensed tie-in work he says he "had to find time to write my own
# self-inspired, completely original works in between, in this phase of my
# life" (https://in-sightpublishing.com/2023/02/03/an-interview-with-john-shirley-part-one-2/).
# That sentence describes the tie-in years as a phase without naming or
# dating one, and it is self-deprecating about the work in it, so it cannot
# carry a period title.
#
# Beyond sourcing, the shelf itself refuses to divide. Shirley works several
# genres at once in every decade, so each publishing fact that might anchor an
# era slices across the others:
#   - the pseudonymous men's-adventure run (Traveler as D. B. Drumm, The
#     Specialist as John Cutter) is a clean, dated publishing fact, 1984-1986,
#     but 1985 is also the year of Eclipse, and seven pen-name volumes appear
#     alongside it. Any span covering the pen names covers the trilogy opener
#     too.
#   - the licensed tie-in run, roughly 2005-2014, covers the very novels he
#     describes writing "in between" it: Black Glass (2008), Bleak History
#     (2009), Everything Is Broken (2012), Doyle After Death (2013) and
#     Wyatt in Wichita (2014).
#   - the Cleve Trewe westerns run from 2022, but 2023 carries both Gunmetal
#     Mountain and the science-fiction thriller SubOrbital 7.
# The pattern holds from the start: his first two books, both 1979, are a
# science-fiction novel and a horror novel, and 1988 alone carries cyberpunk,
# science fantasy, horror and heroic fantasy.
#
# The genre labels the record does attach to him - cyberpunk, splatterpunk -
# are movement names with their own received dates, and belong to the
# movements rather than to this career. Filing his books under them would date
# the author by the genre's calendar.
#
# Searched in English only, which is the corpus for an American author writing
# in English and reviewed in the anglophone genre press: the Encyclopedia of
# Science Fiction, the St. James Guide via Contemporary Authors, Wikipedia,
# his own site and memoir, and the interview record (Vice, Cemetery Dance,
# Fantasy-Hive, In-Sight, Battery). Aggregated "books in order" listing sites
# assert a strongest period; they recycle the same bibliography and cite no
# one.
#
# A named periodisation would most likely arrive with a retrospective or an
# obituary, neither of which exists for a living, still-publishing writer.
[]
