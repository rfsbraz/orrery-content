# A wing spans an author's complete published work, always, and John
# Shirley's is unusually wide even by that standard: pioneering cyberpunk,
# splatterpunk-associated horror, three
# decades of licensed tie-in novels, two personal pulp pseudonyms, two
# one-off ghostwriting jobs under someone else's house byline, and, from
# 2022, an original Western series. All of it sits in this one wing as
# subseries rather than as separate franchises, per the same reasoning the
# Jim Butcher and Stephen King wings use.
id: john-shirley
name: John Shirley
kind: author
description: >
  The complete published work of John Shirley (born 1953): the pioneering
  cyberpunk of [[work:john-shirley/city-come-a-walkin|City Come A-Walkin']]
  and the A Song Called Youth trilogy (1985-1990), the visceral horror that
  helped define splatterpunk ([[work:john-shirley/wetbones|Wetbones]], the
  Bram Stoker Award-winning collection
  [[work:john-shirley/black-butterflies|Black Butterflies]]), three decades
  of licensed tie-in novels (BioShock, Halo, Borderlands, Predator, Batman,
  Hellblazer), two 1980s men's-adventure pseudonyms (Traveler as D. B.
  Drumm, The Specialist as John Cutter), and, from 2022, the Spur
  Award-winning Cleve Trewe Westerns.
authorIds: [john-shirley]
themePreset: xerox-punk

# Capabilities auto-detect from the data (docs/SCHEMA.md). This wing earns a
# shelf and a derived order across 80+ works, but not `connections`: nothing
# here crosses between the subseries (the tie-ins are each their own closed
# licensed property; the two pseudonymous series are unrelated pulp lines),
# so it is left auto rather than forced off, and will simply stay dark. No
# achievements yet (none earned). No startHere recorded: a catalogue this
# wide and this genre-mixed (cyberpunk, horror, tie-ins, two pseudonymous
# pulp series, Westerns) needs a received, citable entry-point
# recommendation before one is asserted, and none is recorded here yet.
features:
  river: auto
  wizard: auto
  companion: auto
  editions: auto

sources:
  - https://en.wikipedia.org/wiki/John_Shirley
  - https://www.isfdb.org/cgi-bin/ea.cgi?John_Shirley
  - https://www.john-shirley.com/about.html
  - https://www.john-shirley.com/books
