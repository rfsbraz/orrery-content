- id: john-shirley/demons-novella
  title: Demons
  authorIds: [john-shirley]
  published: 2000
  subseries: null
  canonTier: extended
  synopsis: >
    His original novella: demons in seven distinct clans overrun the earth,
    killing for the pleasure of it, while a young San Francisco artist
    falls in with a circle of scientists and philosophers set on ending the
    siege.
  note: >
    A signed, numbered chapbook in the Cemetery Dance Novella Series (#9);
    nominated for the 2001 International Horror Guild award for long fiction.
    Later expanded into a full novel of the same title (Del Rey, 2002) that
    adds a second, sequel novella, "Undercurrent"; catalogued separately here
    as the earlier, standalone publication (Wikipedia's own bibliography
    likewise lists "Demons (2000, novella)" and "Demons, a new version with
    sequel novel Undercurrents (2002)" as two distinct entries).
    What lies behind the demons' arrival is what the text uncovers, so the
    synopsis stays with the opening situation, as the published copy for
    both versions does.
  sources:
    - https://www.john-shirley.com/books
    - https://www.isfdb.org/cgi-bin/title.cgi?1047420
    - https://en.wikipedia.org/wiki/John_Shirley

- id: john-shirley/demons
  title: Demons
  authorIds: [john-shirley]
  published: 2002
  subseries: null
  canonTier: core
  synopsis: >
    A horror novel of an apocalypse that surpasses all expectations: demons
    in seven clans roam a near-future earth torturing humans for sport, and
    a young San Francisco artist joins an odd group of scientists and
    philosophers trying to end the siege.
  note: >
    The expanded full-novel edition: a "novel in two parts and two separate
    novels, at once" per the first edition's own author's note, combining
    the original Demons novella (Cemetery Dance, 2000; catalogued separately,
    see john-shirley/demons-novella) with a new sequel novella, "Undercurrent".
    First published in hardcover by Del Rey/Ballantine in March 2002 (ISBN
    0-345-44647-X), reviewed in Locus that January and February; the trade
    paperback followed in April 2003. His own site's "2003" date matches
    that later paperback printing, not the first edition.
    The Del Rey jacket withholds what is behind the invasion ("the most
    shocking revelation is yet to come"), and the sequel novella is sold as
    a journey "into the center of the conspiracy"; the synopsis holds to
    that line rather than resolving either half.
  sources:
    - https://www.john-shirley.com/books
    - https://www.isfdb.org/cgi-bin/title.cgi?23012
    - https://en.wikipedia.org/wiki/John_Shirley

