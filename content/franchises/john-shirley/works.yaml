# First-draft bibliography for John Shirley (his own site: "more than
# eighty" books). Cross-checked across three
# sources: his own current bibliography (john-shirley.com/books), ISFDB's
# summary bibliography (Author Record #1276), and Wikipedia's bibliography
# section (marked "This list is incomplete" there, so treated as
# corroboration rather than a primary source). Individual short stories,
# poems and essays are not itemised here; they are represented by the
# collections that gather them, matching the rest of this catalogue's
# practice. externalIds are left empty for the enrichment bot.
#
# Two sourcing notes that affect several entries below:
# - Wetbones: his own site and Wikipedia's body prose both give 1991
#   (Mark V. Ziesing hardcover); ISFDB alone shows 1992. First publication
#   year follows the two agreeing sources.
# - Doyle After Death: Wikipedia's body prose and ISFDB both cite the
#   original October 2013 HarperCollins/Witness hardcover; his own current
#   site lists 2014, which matches a later Witness Impulse paperback/ebook
#   printing rather than the first edition.

# --- A Song Called Youth (subseries) ---

- id: john-shirley/eclipse
  title: Eclipse
  authorIds: [john-shirley]
  published: 1985
  subseries: "A Song Called Youth"
  canonTier: core
  synopsis: >
    Opens the cyberpunk trilogy (also marketed as The Eclipse Trilogy) set
    in a near-future Europe fractured by corporate war and a fascist
    resurgence.
  sources:
    - https://www.john-shirley.com/books
    - https://www.isfdb.org/cgi-bin/ea.cgi?John_Shirley
    - https://en.wikipedia.org/wiki/John_Shirley

- id: john-shirley/eclipse-penumbra
  title: Eclipse Penumbra
  authorIds: [john-shirley]
  published: 1988
  subseries: "A Song Called Youth"
  canonTier: core
  synopsis: The trilogy's second volume, continuing the war against the New Resistance.
  sources:
    - https://www.john-shirley.com/books
    - https://www.isfdb.org/cgi-bin/ea.cgi?John_Shirley

# The A Song Called Youth trilogy is three books. The Gale Contemporary
# Authors record also lists an "Eclipse Shattered" (Popular Library,
# 1989); neither the SF Encyclopedia, ISFDB nor the author's own site
# carries it, so it is not a work. Do not complete the trilogy with it.
- id: john-shirley/eclipse-corona
  title: Eclipse Corona
  authorIds: [john-shirley]
  published: 1990
  subseries: "A Song Called Youth"
  canonTier: core
  synopsis: Closes the trilogy.
  sources:
    - https://www.john-shirley.com/books
    - https://www.isfdb.org/cgi-bin/ea.cgi?John_Shirley

