- id: john-shirley/the-other-end
  title: The Other End
  authorIds: [john-shirley]
  published: 2007
  subseries: null
  canonTier: core
  synopsis: >
    An apocalyptic, politically charged novel that hands Judgment Day to
    the political left rather than the Christian right.
  note: >
    The Cemetery Dance jacket sells "a totally unexpected Judgment Day" and
    codes its politics openly (it asks the reader whether they want an
    apocalypse "without...ah...certain people", over a list running from
    Darfur to indentured servitude), which is why the reversal is stated
    here. What the apocalypse turns out to be, who delivers it and how it
    arrives are disclosed inside the book and stay out of the synopsis.
  sources:
    - https://www.john-shirley.com/books
    - https://en.wikipedia.org/wiki/John_Shirley

