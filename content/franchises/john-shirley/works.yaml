    body and soul and leaves only wet bones.
  note: >
    Every publisher's copy leaves the evil unnamed. Dorchester/Leisure:
    "comes a nameless, ancient evil, a destroyer that completely ravages
    its victims, body and soul, leaving behind only wet bones"; the current
