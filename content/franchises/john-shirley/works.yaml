- id: john-shirley/wetbones
  title: Wetbones
  authorIds: [john-shirley]
  published: 1991
  subseries: null
  canonTier: core
  synopsis: >
    A horror novel of Hollywood appetite: a struggling screenwriter
    identifies his ex-wife's emaciated, mutilated body on a morgue slab,
    and behind it finds a nameless, ancient evil that ravages its victims
    body and soul and leaves only wet bones.
  note: >
    Every publisher's copy leaves the evil unnamed. Dorchester/Leisure:
    "comes a nameless, ancient evil, a destroyer that completely ravages
    its victims, body and soul, leaving behind only wet bones"; the current
    Penguin copy opens on the morgue scene and goes no further. What the
    thing is and what it feeds on is disclosed inside the book, so the
    synopsis holds to the jacket's own line.
  sources:
    - https://www.john-shirley.com/books
