# Editions of John Shirley: 85 English (en) editions over 82 of 84 works.
# No pt-PT (or any other non-English) edition was found anywhere in this
# wing: OpenLibrary, Google Books, and the Portuguese-market providers
# (Bertrand, WOOK, Almadoslivros, Presenca) were all searched across the
# full bibliography and returned zero Portuguese-language hits. This is a
# fact about the market, not an unsearched gap - Shirley has never had a
# Portuguese publisher.
#
# COVERAGE
#   en   85 editions over 82 of 84 works. The two absences are Her Hunger
#        (only ever printed inside the multi-author anthology Night Visions
#        10, whose ISBN would misattribute a book with a dozen other names
#        on it to a single story - checked and confirmed, not unsearched)
#        and Watch Dogs: Dark Clouds (an ebook-only tie-in; no ISBN exists
#        for it, only an ASIN-style digital SKU - confirmed via the work's
#        own sourcing, not merely unfound).
#
# SOURCING. Every ISBN below was traced to a named OpenLibrary edition
# record (per-ISBN JSON, not the search index alone), cross-checked in most
# cases against a second source: an Internet Archive physical-item scan
# (identifiers quoted in the relevant notes), a Library of Congress MARC
# record, or an independent bookseller product page. Four entries that
# OpenLibrary does not carry at all (Grimm: The Icy Touch, Blood in Sweet
# River, The Feverish Stars, and the Stormland print edition) were confirmed
# instead via the publisher's own retail listing and at least one
# independent bookseller quoting the identical ISBN.
#
# THREE TRAPS THIS FILE DELIBERATELY AVOIDS, all specific to this wing:
#
# 1. THE SONG CALLED YOUTH OMNIBUS. Prime Books issued the whole trilogy
#    under one ISBN in 2012 (9781607013303, "A Song Called Youth"), and
#    Open Road Integrated Media did the same again in 2024 as an ebook
#    bundle (9781504095129, "Eclipse Trilogy: Eclipse, Eclipse: Penumbra,
#    and Eclipse"). Neither appears below under any of the three workIds:
#    an omnibus ISBN assigned to a single volume would send a reader
#    shopping for one book to a listing for three. The three entries
#    recorded instead are Dover Publications' 2017-2018 individual-volume
#    paperbacks (9780486817897, 9780486817927, 9780486817934), whose
#    catalog numbers run consecutively and which OpenLibrary confirms as
#    368/320/336-page standalone books, not a boxed set. Dover published a
#    second, unconfirmed-format ISBN trio for the same three volumes in the
#    same two years (9780486825748, 9780486829777, 9780486834986) and Open
#    Road separately reissued all three as individual ebooks in 2024
#    (9781504095099, 9781504095105, 9781504095112); neither trio is
#    recorded here, since the paperback trio is the one OpenLibrary
#    positively confirms as a physical trade edition.
#
# 2. THE TRAVELER AND SPECIALIST PSEUDONYM RUNS ARE FULLY VERIFIED, NOT A
#    GAP. Traveler was a shared house pseudonym (D. B. Drumm) written by
#    several authors; OpenLibrary's own "D. B. Drumm" author record mixes
#    in nine Traveler volumes (First You Fight, Ghost Dancers, The Prey,
#    The Children's Crusade, Hell on Earth, The Stalking Time, The Road
#    Ghost) that ISFDB does not credit to Shirley. Only the six titles
#    works.yaml already restricts to him are recorded here. The Specialist
#    run (as John Cutter, his own solo pen name) is worse-catalogued in a
#    different way: OpenLibrary's search index files nine of the eleven
#    books under bare placeholder titles ("Specialist 02" through
#    "Specialist 11"), not their real names. Every one was opened at the
#    per-ISBN record level, where the true title survives in a `subtitle`
#    or `title` field (e.g. "Specialist 05" / subtitle "Maltese
#    (Specialist)" / IA scan `maltesevengeance0000cutt` = The Maltese
#    Vengeance) - matched here one by one rather than assumed from series
#    order, which is exactly how a title could otherwise land on the wrong
#    volume.
#
# 3. TRANSMANIACON'S ZEBRA 1980 RECORD CARRIES A CAUTION, NOT A CITATION.
#    OpenLibrary's only record for the 1980 Zebra first edition
#    (9780890834176) is filed under a separate, near-empty author stub
#    ("J. Shirley", OL2666664A, distinct from the "John Shirley" key every
#    other entry in this file uses) and tagged with an unrelated "Romance"
#    subject. The title is distinctive enough that this is almost certainly
#    still his book and not a mismatched record, but given the doubt this
#    file does not cite it as a source; the entry below instead uses Start
#    Publishing's 2016 ebook reissue, catalogued cleanly under his normal
#    author key, with the Zebra original noted rather than sourced.
#
# THE DEMONS NOVELLA/NOVEL PAIR are two separate, correctly separate works
# (see works.yaml): the 2000 Cemetery Dance chapbook and the expanded 2002
# novel. The novel itself has two editions here, not one: the original
# March 2002 Ballantine hardcover (9780345446473, converted from the ISBN-10
# already cited in works.yaml's own note, 0-345-44647-X, and confirmed
# against an Internet Archive scan under LCCN 2001043478) and the April
# 2003 Del Rey trade paperback that followed it (9780345446497). The
# paperback is listed first as the standard edition; the hardcover is the
# true first edition and is recorded because both are genuinely different
# objects a reader might specifically want, not to inflate the count.
#
# THE OTHER END similarly carries two editions: the original April 2007
# Cemetery Dance limited SIGNED hardcover (9781587671500) and the current
# Open Road Integrated Media ebook (9781504021807, a 2015 reissue of an
# earlier 2007/2010 Open Road printing under a different ISBN,
# 9781480496576, not recorded separately since it is superseded by the
# 2015 number under the same imprint).
#
# BIOSHOCK: RAPTURE carries its two genuine regional first editions, Tor
# Books (US) and Titan Books (UK), both 2011, the same convention Gillian
# Flynn's file uses for a transatlantic release.
#
# BLACK GLASS's publisher is recorded as Elder Signs Press, not "Biblio
# Distribution" (the name OpenLibrary's own record shows): Biblio
# Distribution is the trade distributor, not the publisher, corrected here
# from the book's own Library of Congress-derived Dublin Core record
# (title "Black Glass: The Lost Cyberpunk Novel", Elder Signs Press, Lake
# Orion, MI, 2008), whose synopsis (Richard Candle, UnMinding, the
# Multisemblant) confirms it is the same novel as works.yaml's entry and
# not a differently titled book.
#
# FOUR GAPS THIS RESEARCH CLOSED that ISFDB does not cover at all (per the
# request issue): Wyatt in Wichita, the three Cleve Trewe Westerns, The
# Silver Revolver, and Gurdjieff all have real, verified ISBNs below, drawn
# from OpenLibrary and independent bookseller listings rather than ISFDB.
#
# TWO EDITIONS POSTDATE THEIR WORK, AND BOTH ARE LATER PRINTINGS RATHER THAN
# a wrong year in works.yaml. ISFDB lists "Z-Boyz in the Robot Graveyard
# (2012) [C]" and "The Voice of the Burning House: The Poems of John Shirley
# (2021)", which are the first-publication years works.yaml records; the only
# ISBNs in existence for them are the IDW 2017 and Jackanapes 2023 printings
# recorded below. First publication and the edition that carries an ISBN are
# different facts, and the works file holds the first.
#
# THE FEVERISH STARS is published by Independent Legions Publishing, an
# Italian small press (hence the 978-88 registrant prefix) that publishes
# English-language genre fiction for the international market; the book
# itself is in English, so `language: en` here is correct and is not a
# pt-PT/it mislabel - a 978-88 prefix on an English-language book, not a
# translation.

