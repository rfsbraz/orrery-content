# Additional reading orders only. The derived default (publication-
# chronological over every work in works.yaml) already covers this shelf;
# this file exists for the one place that default cannot do the job.
#
# Everything else on the shelf was checked and needs no order of its own:
# A Song Called Youth has a distinct publication year for each of its three
# volumes, so the derived default already gets it right (see the startHere
# path instead, which frames it as an entry strategy rather than a full
# order). The Cleve Trewe Westerns and the Borderlands and Hellblazer
# tie-ins are each dated distinctly enough, year to year, that the default
# needs no correction. The Traveler novels (as D. B. Drumm) have exactly one
# year with more than one title where the derived default's id tie-break
# disagrees with the series' own numbering - a single adjacent swap, not a
# divergence a reader can feel.

- id: john-shirley/the-specialist
  name: The Specialist - official series order
  type: official-publication
  source: canon
  rationale: >
    Shirley wrote all eleven Specialist novels under his own pen name John
    Cutter, following mercenary Jack Sullivan through an escalating run of
    contracts published roughly every two months across 1984 and 1985. Six
    of the eleven share a publication year with each other, and the other
    five share the other, so first-publication year alone cannot place them
    - and a plain alphabetical reading of the titles lands nowhere near the
    books' own cover numbering. This order restores that numbering. It
    costs a reader nothing thematically, since each book is a self-
    contained job, but it is the one place on this shelf where the derived
    default's year-then-title sort actively misleads about the sequence,
    scrambling most of the second half of the series.
  orderedWorkIds:
    - john-shirley/specialist-a-talent-for-revenge
    - john-shirley/specialist-manhattan-revenge
    - john-shirley/specialist-sullivans-revenge
    - john-shirley/specialist-the-psycho-soldiers
    - john-shirley/specialist-the-maltese-vengeance
    - john-shirley/specialist-the-big-one
    - john-shirley/specialist-the-vendetta
    - john-shirley/specialist-one-man-army
    - john-shirley/specialist-vengeance-mountain
    - john-shirley/specialist-beirut-retaliation
    - john-shirley/specialist-american-vengeance
  sources:
    - "https://www.isfdb.org/cgi-bin/ea.cgi?John_Shirley"
    - "https://www.fictiondb.com/series/specialist-john-cutter~8329.htm"
