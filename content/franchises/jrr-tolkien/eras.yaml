# Creative periods - the narrative spine of the aura. Inline references use
# [[type:id|text]] and must resolve.
#
# Tolkien's life is periodised by his authorised biographer and by his own
# estate, and where both speak they agree. Humphrey Carpenter's "J. R. R.
# Tolkien: A Biography" (George Allen & Unwin, 1977) prints its date ranges in
# its own part titles: Part 2, "1892-1916: Early years"; Part 3, "1917-1925:
# The making of a mythology"; Parts 4 and 5, "1925-1949 (I): 'In a hole in the
# ground there lived a hobbit'" and "1925-1949 (II): The third age"; Part 6,
# "1949-1966: Success"; Part 7, "1959-1973: Last years". The Tolkien Estate
# publishes its own timeline of his life in two halves, and they break at the
# same place Carpenter's Part 6 opens: 1892-1949 and 1950-2018. The three
# lifetime eras below take their spans from those two sources. The fourth takes
# its span from the second half of the Estate's timeline, which runs on past
# Tolkien's death to the last book his son published.
#
# CARPENTER'S PARTS OVERLAP; ERAS CANNOT. He tells the same years twice from
# different angles - Parts 4 and 5 both cover 1925-1949, and Part 6 (1949-1966)
# and Part 7 (1959-1973) run in parallel, the public career against the private
# life. Era membership here is computed from a work's publication year, so two
# spans claiming one year would count the same book twice. One rule resolves it
# throughout: WHERE TWO PARTS CLAIM THE SAME YEARS, THE EARLIER PART KEEPS
# THEM. That puts 1949 in the first era below, which is also where the Estate's
# timeline puts it (its first half ends with the 1949 Farmer Giles of Ham), and
# it puts 1959-1966 in "Success", so "The Last Years" opens in 1967 rather than
# at Carpenter's own 1959. That one opening year is the only date in this file
# neither source states; every other boundary is printed in one or both of
# them.
#
# THE LABEL ON THE FIRST ERA IS NOT CARPENTER'S, THOUGH THE SPAN IS. He gives
# the 1925-1949 band two titles. One is "The third age", which on a
# Middle-earth shelf names the age The Hobbit and The Lord of the Rings are set
# in, not a stretch of Tolkien's working life; a plate carrying it would tell
# almost every reader who saw it something false. The other is the Hobbit's
# first sentence, which does not survive being used as a heading. "The Hobbit
# Years" is a flat stand-in over Carpenter's own span, and it is what both of
# his titles are about: the years that hold The Hobbit and the whole writing of
# its sequel. The two later lifetime titles are his, verbatim.
#
# THE ERAS ARE DRAWN ON A LIFE; THE WORKS ARE FILED BY PUBLICATION YEAR, AND
# FOR THIS AUTHOR THE TWO COME APART HARDER THAN FOR ALMOST ANY OTHER.
# Twenty-two of the thirty-two works in this wing were published after Tolkien
# died. The
# mythology he began in 1916-17 first reached print in 1977;
# [[work:jrr-tolkien/the-fall-of-gondolin|The Fall of Gondolin]], drafted in
# hospital after the Somme, is dated 2018 here, and
# [[work:jrr-tolkien/the-story-of-kullervo|The Story of Kullervo]], begun
# around 1914, is dated 2015. Both belong biographically to years no era below
# covers, and both render under the fourth era instead, which is the era of
# their publication and is drawn for exactly that reason. Read every span below
# as the years of Tolkien's life the sources periodise, checked against
# publication because publication is the only date this catalogue holds.
#
# NO ERA IS DRAWN BEFORE 1925. Carpenter's Parts 2 and 3 are real, sourced
# periods with names of their own, and they are left out because they are
# empty, not because they are unsourced: nothing in this wing was published
# before the 1925 Gawain edition, so a plate for either would be one no reader
# ever reaches.
#
# NO ERA IS DRAWN AFTER 2018, AND THREE WORKS SIT OUTSIDE EVERY SPAN AS A
# RESULT. The Estate's timeline stops at The Fall of Gondolin and says why -
# it was Christopher Tolkien's last publication, and he died in January 2020.
# Nobody periodises what has followed. [[work:jrr-tolkien/the-nature-of-middle-earth|The
# Nature of Middle-earth]] (2021),
# [[work:jrr-tolkien/the-collected-poems-of-jrr-tolkien|The Collected Poems of
# J. R. R. Tolkien]] (2024) and
# [[work:jrr-tolkien/the-bovadium-fragments|The Bovadium Fragments]] (2025)
# therefore carry no era plate. That is the honest picture of a shelf still
# being added to, not a gap to be closed by extending the fourth era past the
# date its own source ends on.

- id: the-hobbit-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Hobbit Years
  period: "1925-1949"
  themes: [the Oxford chairs, the Inklings, philology as invention, a children's book that got away, the sequel that would not end]
  provenance: critical
  description: >
    Carpenter gives these twenty-four years two parts of his biography and no
    single name, calling them once by the Hobbit's opening sentence and once
    "the third age". They open with Tolkien elected Rawlinson and Bosworth
    Professor of Anglo-Saxon at Oxford in 1925, arriving from Leeds with the
    Middle English edition he had made there with E. V. Gordon,
    [[work:jrr-tolkien/sir-gawain-and-the-green-knight-middle-english-text|Sir
    Gawain and the Green Knight]], published that same year and a set text for
    decades after. He met C. S. Lewis in 1926, read aloud with him and the
    other Inklings for the next twenty years, delivered the 1936 British
    Academy lecture that changed how Beowulf was read, and in 1937 published
    [[work:jrr-tolkien/the-hobbit|The Hobbit]], the first fiction of his to
    reach print at all. Allen & Unwin asked for a sequel that December and
    rejected the Silmarillion material he offered instead; he began the sequel
    the same month and finished the typescript in 1949. The two other works
    dated to these years both belong to the argument underneath the fiction:
    [[work:jrr-tolkien/on-fairy-stories|On Fairy-Stories]], the 1939 Andrew
    Lang Lecture printed in 1947, and
    [[work:jrr-tolkien/farmer-giles-of-ham|Farmer Giles of Ham]] in 1949.
  note: >
    The span is Carpenter's, from both of his 1925-1949 parts; the title is
    not, for the reason set out in this file's header. 1949 is claimed by
    Carpenter's next part as well and is kept here, which is also where the
    Tolkien Estate's own timeline puts it - the first half of that timeline
    ends with Farmer Giles of Ham. The work these years were mostly spent on
    does not appear in them: [[work:jrr-tolkien/the-lord-of-the-rings|The Lord
    of the Rings]] was written between December 1937 and 1949 and reached print
    in 1954, so it renders in the era below.
  sources:
    - "https://archive.org/details/jrrtolkienbiogra00carp_0"
    - "https://tolkiengateway.net/wiki/J.R.R._Tolkien:_A_Biography"
    - "https://www.tolkienestate.com/life/timeline-1892-1949/"

- id: success
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: Success
  period: "1950-1966"
  themes: [the long wait for a publisher, mixed reviews, the paperback war, the Silmarillion still unfinished]
  provenance: critical
  description: >
    Carpenter's one-word title for the years after the manuscript was done. It
    took five of them to reach a publisher at all - Tolkien tried to place The
    Lord of the Rings and the Silmarillion together, failed, and finally let
    Allen & Unwin have the novel alone - and
    [[work:jrr-tolkien/the-lord-of-the-rings|The Lord of the Rings]] appeared
    across 1954 and 1955 in three volumes because printing costs allowed no
    other shape. The reviews split violently, W. H. Auden and C. S. Lewis
    against Edmund Wilson and Edwin Muir; the BBC condensed it into twelve
    radio episodes in 1956; and the sales so far exceeded the break-even point
    that Tolkien regretted not retiring early. What made it a phenomenon came
    later and by accident, when an unauthorised American paperback in 1965 put
    the book in every drugstore and the copyright row advertised it to millions
    who had never heard of him. The other work of these years is small and
    deliberate: the verse play
    [[work:jrr-tolkien/the-homecoming-of-beorhtnoth-beorhthelms-son|The
    Homecoming of Beorhtnoth Beorhthelm's Son]] in 1953,
    [[work:jrr-tolkien/the-adventures-of-tom-bombadil|The Adventures of Tom
    Bombadil]] in 1962, assembled at his aunt's suggestion, and
    [[work:jrr-tolkien/tree-and-leaf|Tree and Leaf]] in 1964.
  note: >
    Carpenter's part is "1949-1966: Success". 1949 is held by the era above,
    which is where the Estate's timeline also puts it, so this span opens in
    1950. Its closing year is Carpenter's own. The years 1959-1966 are claimed
    by his next part too and are kept here under the rule stated in this file's
    header.
  sources:
    - "https://archive.org/details/jrrtolkienbiogra00carp_0"
    - "https://tolkiengateway.net/wiki/J.R.R._Tolkien:_A_Biography"
    - "https://www.tolkienestate.com/life/timeline-1950-2018/"

- id: the-last-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Last Years
  period: "1967-1973"
  themes: [retirement, a fame he had not asked for, elegy, Edith]
  provenance: critical
  description: >
    Carpenter's title for the stretch that runs from Tolkien's retirement to
    his death, and the years in which he published his last two books, both in
    1967: [[work:jrr-tolkien/smith-of-wootton-major|Smith of Wootton Major]], a
    fairy story the Estate describes as written out of "the bereavement of
    'retirement', and of advancing age", and
    [[work:jrr-tolkien/the-road-goes-ever-on|The Road Goes Ever On]], his
    poems set to music by Donald Swann. He had given his valedictory address at
    Merton in June 1959; in 1968 he and Edith moved to a bungalow in Poole to
    live quietly, and by then The Lord of the Rings had become something close
    to scripture for a counterculture he had not sought and did not much
    approve of. Edith died in November 1971. He returned to Oxford, to rooms
    Merton gave him, was made a CBE in 1972, and died on 2 September 1973
    with the Silmarillion still unfinished after fifty-seven years of work.
  note: >
    Carpenter's part is "1959-1973: Last years", and it opens on a dated event,
    his retirement from the Merton chair. Those opening years are claimed by
    his previous part as well and are held there, so this span begins in 1967
    instead - the one boundary in this file that neither source states. It
    closes at his death, which is a real limit on when Tolkien could publish
    anything and not a limit on when his work would appear; more than two
    thirds of this wing was still to come.
  sources:
    - "https://archive.org/details/jrrtolkienbiogra00carp_0"
    - "https://tolkiengateway.net/wiki/J.R.R._Tolkien:_A_Biography"
    - "https://www.tolkienestate.com/life/timeline-1950-2018/"

- id: the-christopher-tolkien-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Christopher Tolkien Years
  period: "1975-2018"
  themes: [a son as editor, drafts assembled into books, forty-five years of manuscripts, the Great Tales as standalone volumes]
  provenance: publishing
  description: >
    Named in his father's 1967 letter as literary executor and as co-author of
    the Silmarillion, Christopher Tolkien took the manuscripts to his
    Oxfordshire home after the 1973 death, converted a barn into a workspace,
    and in September 1975 resigned his fellowship at New College, Oxford to
    work on nothing else. He moved to France and kept at it for forty-five
    years, publishing twenty-four volumes: [[work:jrr-tolkien/the-silmarillion|The
    Silmarillion]] in 1977, assembled into continuous narrative;
    [[work:jrr-tolkien/unfinished-tales|Unfinished Tales]] in 1980, deliberately
    left fragmentary with commentary instead;
    [[work:jrr-tolkien/the-history-of-middle-earth|The History of
    Middle-earth]] across 1983 to 1996, twelve volumes laying out draft by
    draft how the whole legendarium had been made; and then the three Great
    Tales as standalone books, [[work:jrr-tolkien/the-children-of-hurin|The
    Children of Húrin]] (2007),
    [[work:jrr-tolkien/beren-and-luthien|Beren and Lúthien]] (2017) and
    [[work:jrr-tolkien/the-fall-of-gondolin|The Fall of Gondolin]] (2018). The
    Estate's own timeline of Tolkien's life ends on that last book, with the
    note that it was Christopher Tolkien's final publication and that he had
    "dedicated more than forty-five years to studying, editing and publishing
    his father's works". He died on 16 January 2020.
  note: >
    A publishing era, not a creative one, and the only one in this file that is
    not about a period of Tolkien's own working life - he had been dead two
    years when it opens. It is drawn because it is how two thirds of this wing
    reached print and because its span is a fact about the record rather than a
    reading of the books: a dated resignation at one end, a book its own
    publisher calls the last at the other. It names the years, not a credit on
    every volume inside them. Four works here were edited by others and are
    carried inside the same span by the Estate's timeline too:
    [[work:jrr-tolkien/letters-from-father-christmas|The Father Christmas
    Letters]] (1976, Baillie Tolkien),
    [[work:jrr-tolkien/the-old-english-exodus|The Old English Exodus]] (1981,
    Joan Turville-Petre),
    [[work:jrr-tolkien/finn-and-hengest|Finn and Hengest]] (1982, Alan Bliss)
    and [[work:jrr-tolkien/roverandom|Roverandom]] (1998, Christina Scull and
    Wayne Hammond). The span opens in 1975 rather than at the 1973 death
    because that is both the year of the resignation and the year of the first
    posthumous book, the Gawain, Pearl and Sir Orfeo translations.
  sources:
    - "https://www.tolkienestate.com/life/timeline-1950-2018/"
    - "https://en.wikipedia.org/wiki/Christopher_Tolkien"
    - "https://locusmag.com/2020/01/christopher-tolkien-1924-2020/"
