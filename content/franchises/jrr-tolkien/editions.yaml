# Editions of J. R. R. Tolkien: 47 entries covering 32 of 32 works - every
# work in works.yaml carries at least one verified edition. 46 English (en),
# 1 Portuguese (pt-PT). Every isbn13 below was re-derived by hand (EAN-13
# check-digit arithmetic) and cross-checked against at least two independent
# records - a Wikipedia infobox (itself sourced to Hammond & Scull's
# "Chronology" or a named publisher/OCLC record) and the record's own
# permalink at openlibrary.org/isbn/<isbn>, opened individually. No isbn13
# below rests on a single unopened source.
#
# WHY 46 ENGLISH AND ALMOST NO PORTUGUESE. Tolkien wrote in English; this
# file's job for a native-language author is to record the buyable object,
# which for the overwhelming majority of his 32 works IS the English
# HarperCollins/Houghton Mifflin edition - there is no realistic Portuguese
# equivalent to compete with a first look. Where a genuine current UK
# HarperCollins paperback exists in the standard "978-0-261-102xxx/103xxx"
# reissue block used across this whole backlist, it is preferred (most-recent-
# in-print, per docs/CURATION.md's tiebreak order) over the original
# hardback; where Wikipedia's own infobox ISBN is the cleanest-sourced number
# and no ambiguity-free reissue turned up, that first edition is used instead
# and said so below.
#
# THE LORD OF THE RINGS: one work, five editions, not a contradiction. Per
# works.yaml's own "STRUCTURAL CALL TWO," this catalogue treats LOTR as one
# novel split into three volumes by a 1950s printing-cost decision, not three
# books - but a reader today can buy EITHER the three-volume set or a modern
# single-volume edition, and both are real, current, legitimately "the"
# edition. The precedent for one workId carrying several physical-volume
# editions already exists in this catalogue (stephen-king/editions.yaml
# records The Stand as two volumes, "volume 1 of 2" / "volume 2 of 2," on one
# workId): the same shape is used here, scaled to three volumes plus a
# single-volume alternative, all four pointing at
# jrr-tolkien/the-lord-of-the-rings.
#
# THE HISTORY OF MIDDLE-EARTH: one work, twelve editions, same reasoning at
# a larger scale. works.yaml's own "STRUCTURAL CALL THREE" keeps this a single
# grouped apocrypha entry rather than twelve work ids, because the twelve
# volumes are one 1983-1996 scholarly project, not a series a reader picks
# volumes of independently - but each of the twelve IS a real, separately
# published, separately-ISBN'd physical book, and silently picking volume 1's
# ISBN to stand in for the whole would misrepresent both the object (a reader
# who buys "the" History of Middle-earth on that ISBN gets 1/12 of it) and the
# project. All twelve are recorded below, each tagged "Volume N of 12," all on
# workId jrr-tolkien/the-history-of-middle-earth - the same King-precedent
# pattern, at 12 volumes instead of 2. The 2002 combined index volume is
# outside works.yaml's own twelve-volume scope note and is not recorded here.
#
# CRITICAL-EDITION CALLS. Three works have both a "plain" edition and a later
# edition with genuinely different content, and the entry below is the one
# matching the SCOPE works.yaml's own synopsis describes, not just the
# earliest printing:
#   - A Secret Vice: works.yaml's entry is specifically the 2016 Fimi &
#     Higgins critical edition that restores the "Fonwegian" glossary omitted
#     from every earlier printing. The isbn13 below (Wikipedia infobox,
#     cross-checked openlibrary.org/isbn/9780008131395) is that 2016 hardback,
#     not the 1983 plain text folded into The Monsters and the Critics.
#   - The Letters of J. R. R. Tolkien: works.yaml's synopsis explicitly notes
#     "Revised and expanded in 2023." The isbn13 below is the 2023 HarperCollins
#     "Revised and Expanded Edition" (one of two 2023 bindings sharing that
#     text, per openlibrary.org/isbn/9780008628765 and .../9780008628789 - the
#     other binding's ISBN is 9780008628789, recorded here as a note rather
#     than a second entry since both are the same text), not the 1981 original.
#   - The Homecoming of Beorhtnoth Beorhthelm's Son: works.yaml's own note
#     records that this was "republished on its own in 2023 as 'The Battle of
#     Maldon: together with The Homecoming of Beorhtnoth.'" That is exactly
#     the buyable object below - title recorded as printed on that jacket,
#     not translated back to the work's own title.
#
# TREE AND LEAF: works.yaml's synopsis is deliberately the ORIGINAL two-piece
# 1964 book ("On Fairy-Stories" + "Leaf by Niggle"), not the 1988 edition that
# adds the poem "Mythopoeia" or the 2001 edition that further adds "The
# Homecoming of Beorhtnoth." The 2025 HarperCollins edition below, subtitled
# "Including Leaf by Niggle" on its own cover (openlibrary.org/isbn/9780008761899),
# is the current edition whose own subtitle confirms it holds only those two
# pieces - the scope match works.yaml's synopsis needs, not a coincidence of
# convenience.
#
# WHAT WAS CHECKED (pt-PT). The Lord of the Rings carries TWO pt-PT editions
# below (The Two Towers, The Return of the King), both the same Europa-América
# 2002 "11ª edição" run - not a matched three-volume Portuguese set, because
# the Fellowship candidate below stayed out:
#   - A 2022 "O Senhor dos Anéis: A Sociedade do Anel" (Fellowship) carries
#     ISBN 978-989-777-392-1 - a 978-989 prefix, which is Portugal's own
#     registrant range - but its own openlibrary.org/isbn/9789897773921 record
#     lists "publish_places: Brazil," a direct contradiction, and the
#     Biblioteca Nacional de Portugal catalogue (catalogo.bnportugal.gov.pt)
#     holds no record at all under this ISBN. Two disagreeing signals and no
#     way to break the tie: left out rather than shipped.
#   - A matching "As Duas Torres" (Two Towers) candidate, ISBN
#     978-972-104-144-8: digits 9-7-8-9-7-2-1-0-4-1-4-4 sum to 102, forcing
#     check digit 8, which is what's printed - a valid ISBN-13. Its Open
#     Library record (openlibrary.org/books/OL18774656M) confirms the same
#     Europa-América run as the Return of the King entry, so it ships below.
# No pt-PT candidate for The Hobbit, The Silmarillion or the single-volume
# LOTR was found. Wook and Bertrand, the two pt-PT retailers with the fullest
# catalogues, both block automated fetches; a human with a browser on either
# is the next real step, not a guess from this file.

