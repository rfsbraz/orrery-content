- id: auden-wilson-reception-split-1956
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 1956
  dateRange: "1954-1956"
  title: The New York Times calls it a masterpiece; The Nation calls it juvenile trash
  scope: culture
  reach: franchise
  impact: high
  description: >
    On publication, [[work:jrr-tolkien/the-lord-of-the-rings|The Lord of the
    Rings]] split serious critics rather than winning them over. W. H. Auden,
    reviewing the final volume for the New York Times in January 1956,
    called it a masterpiece and argued it outdid John Milton's Paradise Lost
    in places. The Scottish poet Edwin Muir, reviewing The Return of the
    King in 1955, attacked its characters as "boys masquerading as adult
    heroes" who would "never come to puberty" - a complaint Tolkien answered
    angrily to his publisher. In April 1956 the critic Edmund Wilson used
    The Nation to call the whole work "juvenile trash" under the title "Oo,
    Those Awful Orcs!," writing that Tolkien had "little skill at narrative
    and no instinct for literary form." The split did not resolve in the
    book's favour at the time - it sold well in hardback despite, not
    because of, its reviews, and had no paperback edition at all until the
    following decade - and the fault line Wilson and Auden opened, between
    literary-establishment dismissal and popular acclaim, still runs through
    how the book is discussed.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/The_Lord_of_the_Rings
