# Identity + features. Standing rule: a wing spans an author's COMPLETE
# published body of work, so kind is author. Unusually for this catalogue,
# Tolkien's bibliography needs no subseries at all - see works.yaml's own
# header for why - so every work in this wing carries subseries: null.
#
# This is also the widest "two famous books vs. everything else" gap the
# request issue flags in the whole catalogue: The Hobbit and The Lord of
# the Rings are two of the best-selling novels ever printed, and the
# other 27 works below - most of it published only after Tolkien's 1973
# death, edited from manuscript by his son - are comparatively obscure even
# among readers who own both. That gap is exactly what canonTier is doing
# the work of recording here: 3 core, 11 extended, 16 apocrypha (see
# works.yaml's own header for the full tier rationale and the History of
# Middle-earth scope decision in particular).
#
# features and startHere are both left unset here: which capabilities this
# data actually earns, and which entry paths are worth recommending, are
# calls that need the rest of the wing (eras, orders, spoiler boundaries)
# to already exist before they can be made honestly.
id: jrr-tolkien
name: J. R. R. Tolkien
kind: author
description: >
  An Oxford philologist whose two novels - the children's adventure
  [[work:jrr-tolkien/the-hobbit|The Hobbit]] (1937) and its vastly larger
  sequel [[work:jrr-tolkien/the-lord-of-the-rings|The Lord of the Rings]]
  (1954-1955, one novel split into three volumes for the cost of paper, not
  a trilogy by design) - effectively founded modern fantasy as a genre. Both
  sit atop a legendarium forty years deeper than either book shows: private
  mythology begun in the trenches of the First World War, most of it left
  unpublished at his death in 1973 and edited into print across the
  following forty-five years by his son and literary executor,
  [[author:christopher-tolkien|Christopher Tolkien]].
authorIds: [jrr-tolkien, christopher-tolkien]
# Christopher Tolkien is listed here, not just via withAuthorIds on his
# individual works, for the same reason Robert Jordan's wing lists Brandon
# Sanderson and Lee Child's lists Andrew Child: this catalogue's own
# tooling (aura_density.py, wing_digest.py) reads lifeEvents only from the
# people named here. Left off, his 12 sourced lifeEvents - the 1967
# co-author letter, the Silmarillion, the 45-year editing project - would
# be invisible to the wing's own aura, on an author whose posthumous
# editorial work is a genuine authorship question (see works.yaml's
# STRUCTURAL CALL ONE), not a footnote.
themePreset: legendarium

globalEvents:
  include:
    - world-war-i-1914  # The war that shaped Tolkien's body and landscape; his 1916 Somme service, trench fever, and the deaths of T.C.B.S. friends set the legendarium in motion during his convalescence, giving it the desolate marshes and soldier's bond that marks the greatest works.
  exclude:
    - sept-11-2001  # Posthumous; no resonance with timeless legendarium
    - financial-crisis-2008  # Contemporary economic event unrelated to legendarium's composition or Christopher's editorial work
    - covid-19-pandemic-2020  # Christopher dies before the pandemic; outside both authors' working lives
    - world-war-ii-1939  # Tolkien explicitly denied it shaped LOTR's plot; finished the book before atomic weapons existed; living through it is not the same as it reaching the page
    - pulp-magazines-1926  # Tolkien's literary fiction was never pulp; transcends the category rather than being shaped by it
    - penguin-paperback-1935  # Publishing format change; predates his major publications and doesn't shape his writing
    - armed-services-editions-1943  # WWII book distribution; unrelated to Tolkien's work or Christopher's later editorial approach
    - lady-chatterley-trial-1960  # Obscenity trial; Tolkien's works were published before this and don't engage with it
    - fantasy-paperback-boom-1965  # Tolkien's LOTR created this boom; he doesn't write into it, unlike later fantasy authors who inherit the category he created
    - carnation-revolution-1974  # Portuguese censorship end; no connection to English-published Tolkien works or Christopher's France-based editorial work
    - chain-bookshop-1982  # Industry format change; Tolkien editorial project already mature by then; didn't shape the books
    - online-bookselling-1995  # Amazon launch; HoME completed same year; format didn't shape the legendarium's creation or editing
    - ebook-and-self-publishing-2007  # Kindle launch; Tolkien project decades mature; technology didn't shape the books
    - prestige-fantasy-adaptation-2011  # Game of Thrones prestige rise; different work, decades after Tolkien's publications
    - booktok-2020  # Christopher dies before BookTok; social media discovery didn't exist during creation
    - portugal-bailout-2011  # Portuguese financial crisis; no connection to Tolkien's English works or Christopher's editorial work
    - elementary-education-act-1870  # Predates Tolkien's birth; too remote a structural change; doesn't reach the page of his work
    - comics-code-authority-1954  # Comics regulation; Tolkien's work is literary fiction, not comics; didn't affect his writing

sources:
  - https://en.wikipedia.org/wiki/J._R._R._Tolkien
  - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography
  - https://en.wikipedia.org/wiki/Christopher_Tolkien
  - https://en.wikipedia.org/wiki/The_Silmarillion
