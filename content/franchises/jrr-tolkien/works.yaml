  withAuthorIds: [christopher-tolkien, humphrey-carpenter]
  authorRole: editor
  published: 1981
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    A selection of Tolkien's own correspondence - to his sons, his
    publishers, fans and fellow scholars - covering his life, his Catholic
    faith, his views on his own books, and the decades of writing behind
    them. Revised and expanded in 2023.
  note: >
    Co-edited by Christopher Tolkien and Humphrey Carpenter, Tolkien's
    authorised biographer (whose own 1977 biography is not itself a
    Tolkien work and is not catalogued here).
  sources:
    - https://en.wikipedia.org/wiki/Christopher_Tolkien
    - https://en.wikipedia.org/wiki/Humphrey_Carpenter

- id: jrr-tolkien/the-old-english-exodus
  title: "The Old English Exodus"
  authorIds: [jrr-tolkien]
  published: 1981
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    Tolkien's text, translation and commentary on the Old English poetic
    version of the Book of Exodus, prepared from his Oxford lecture notes.
  note: >
    Edited posthumously by Joan Turville-Petre, named here rather than
    given an entity on the same one-off-credit grounds as this file's
    other minor academic collaborators.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/finn-and-hengest
  title: "Finn and Hengest: The Fragment and the Episode"
  authorIds: [jrr-tolkien]
  published: 1982
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    Tolkien's scholarly reconstruction of the historical episode behind
    two fragmentary Old English poems, the "Finnsburg Fragment" and an
    episode within Beowulf.
  note: >
    Edited posthumously from Tolkien's lecture notes by Alan Bliss, named
    here rather than given an entity on the same one-off-credit grounds as
    this file's other minor academic collaborators.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-monsters-and-the-critics-and-other-essays
  title: "The Monsters and the Critics, and Other Essays"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  authorRole: editor
  published: 1983
  subseries: null
  canonTier: apocrypha
  format: essay-collection
  synopsis: >
    Five of Tolkien's academic essays gathered into one volume for the
    first time, chief among them the 1936 lecture that reshaped how
    Beowulf was read by treating its monsters as central rather than
    embarrassing, plus "On Translating Beowulf," "A Secret Vice," "English
    and Welsh," and the fuller 1947 text of "On Fairy-Stories."
  note: >
    Unlike The Fall of Númenor (excluded above), this collects essays that
    had never before been gathered into one book - scattered across a
    1937 pamphlet, academic journals and a multi-author tribute volume -
    rather than repackaging chapters from other Tolkien books.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-history-of-middle-earth
  title: "The History of Middle-earth"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  authorRole: editor
  published: 1983
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    Twelve volumes tracing, draft by draft, how The Silmarillion and The
    Lord of the Rings actually took shape across Tolkien's working life -
    the raw manuscripts, false starts, abandoned versions and Christopher
    Tolkien's own commentary connecting them.
  note: >
    ONE ENTRY for a twelve-volume, 1983-1996 project - see this file's own
    header ("STRUCTURAL CALL THREE") for the full reasoning. published is
    set to 1983, the first volume's year. The twelve constituent volumes,
    for reference: The Book of Lost Tales, Part One (1983); The Book of
    Lost Tales, Part Two (1984); The Lays of Beleriand (1985); The Shaping
    of Middle-earth (1986); The Lost Road and Other Writings (1987); The
    Return of the Shadow (1988); The Treason of Isengard (1989); The War of
    the Ring (1990); Sauron Defeated (1992, includes "The Notion Club
    Papers"); Morgoth's Ring (1993); The War of the Jewels (1994); The
    Peoples of Middle-earth (1996). A combined index volume followed in
    2002.
  sources:
    - https://en.wikipedia.org/wiki/Christopher_Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-children-of-hurin
  title: "The Children of Húrin"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  authorRole: editor
  published: 2007
  subseries: null
  canonTier: apocrypha
  synopsis: >
    Cursed by the dark lord Morgoth to watch his children's lives unravel
    from a distance, Húrin's son Túrin grows up marked by ill luck of his
    own making as much as the curse's, in one of the oldest and darkest
    tales of Tolkien's First Age.
  note: >
    Tolkien brought this story to a near-complete state between 1951 and
    1957 before setting it aside; Christopher Tolkien's synthesis draws it
    together from that late work plus earlier versions scattered across
    The Silmarillion, Unfinished Tales and The History of Middle-earth.
    First of the three "Great Tales" of the Elder Days Christopher
    published as standalone books.
  sources:
    - https://en.wikipedia.org/wiki/Christopher_Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-fall-of-arthur
  title: "The Fall of Arthur"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  published: 2013
  subseries: null
  canonTier: apocrypha
  format: poem
  synopsis: >
    An unfinished alliterative-verse retelling of Arthur's last campaign,
    begun in the early 1930s, in which Arthur takes the war to the Saxons
    abroad while Mordred's betrayal gathers at home.
  note: >
    Tiered apocrypha for what it is - Tolkien's own unfinished draft,
    abandoned mid-poem - rather than for how it reached print: unlike the
    "Great Tales" elsewhere in this section, Christopher Tolkien's edition
    presents the surviving verse as Tolkien left it rather than
    constructing a continuous narrative from multiple sources, and adds
    his own separate essays on the poem's place in the Arthurian tradition
    and the legendarium rather than new connective text of his own, so
    authorRole stays at its default here.
  sources:
    - https://en.wikipedia.org/wiki/Christopher_Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-story-of-kullervo
  title: "The Story of Kullervo"
  authorIds: [jrr-tolkien]
  withAuthorIds: [verlyn-flieger]
  authorRole: editor
  published: 2015
  subseries: null
  canonTier: apocrypha
  format: novella
  synopsis: >
    Tolkien's own unfinished retelling, begun around 1914 while he was
    still a student, of the tragic hero Kullervo from the Finnish Kalevala
    - the Kalevala being one of the deepest early influences on his
    invented mythology.
  note: >
    Breaks off mid-narrative; published with Tolkien's own related essays
    on the Kalevala as back matter, edited by Verlyn Flieger.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien
    - https://en.wikipedia.org/wiki/Verlyn_Flieger

- id: jrr-tolkien/beren-and-luthien
  title: "Beren and Lúthien"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  authorRole: editor
  published: 2017
  subseries: null
  canonTier: apocrypha
  synopsis: >
    A mortal man and an immortal elf-woman fall in love against her
    father's forbidding, and together attempt what no army has managed:
    stealing a jewel from the Dark Lord's own crown - the tale Tolkien
    called the origin of the whole legendarium, and had "Beren" carved on
    his own gravestone.
  note: >
    Traces the story's growth across Tolkien's whole writing life by
    presenting successive drafts side by side rather than a single
    finished version, unlike The Children of Húrin's continuous narrative.
    Second of the three "Great Tales."
  sources:
    - https://en.wikipedia.org/wiki/Christopher_Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien

- id: jrr-tolkien/the-fall-of-gondolin
  title: "The Fall of Gondolin"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  authorRole: editor
  published: 2018
  subseries: null
  canonTier: apocrypha
  synopsis: >
    The hidden elven city of Gondolin, built to stay lost from the Dark
    Lord's sight, falls at last through betrayal from within - the very
    first story Tolkien wrote in this whole mythology, drafted in 1916-17
    while recovering from the Somme.
  note: >
    Last of the three "Great Tales," and the one Tolkien himself called
    "the first real story of this imaginary world."
  sources:
    - https://en.wikipedia.org/wiki/Christopher_Tolkien
    - https://en.wikipedia.org/wiki/The_Silmarillion

- id: jrr-tolkien/the-nature-of-middle-earth
  title: "The Nature of Middle-earth"
  authorIds: [jrr-tolkien]
  withAuthorIds: [carl-f-hostetter]
  authorRole: editor
  published: 2021
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    Late essays, mostly never intended for publication, in which Tolkien
    works through the metaphysics, biology and chronology underlying
    Middle-earth: Elvish reincarnation and aging, the shape and history of
    Arda, and related questions his fiction never states outright.
  note: >
    Edited by Carl F. Hostetter, a Tolkien linguistics scholar, by
    arrangement with Christopher Tolkien before the latter's death in
    January 2020; the first major posthumous volume not edited by
    Christopher himself. Tolkien scholar Douglas C. Kane's review argues
    Hostetter "appears to overstep his role as editor" in places by
    reading his own interpretive framing (particularly around Catholic
    theology) into the presentation - recorded here as a genuine scholarly
    dispute, not adjudicated by this catalogue.
  sources:
    - https://en.wikipedia.org/wiki/Carl_F._Hostetter
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-collected-poems-of-jrr-tolkien
  title: "The Collected Poems of J. R. R. Tolkien"
  authorIds: [jrr-tolkien]
  authorRole: editor
  published: 2024
  subseries: null
  canonTier: apocrypha
  format: poetry-collection
  synopsis: >
    A three-volume scholarly gathering of Tolkien's poetry across his
    whole life, published and unpublished alike, from teenage verse
    through the poems inside The Lord of the Rings to late, previously
    uncollected pieces.
  note: >
    Edited by the Tolkien scholars Christina Scull and Wayne G. Hammond,
    named here rather than given entities on the same one-off-credit
    grounds as this file's other minor academic collaborators. Largely a
    definitive scholarly re-gathering of poems already published elsewhere
    (many inside The Adventures of Tom Bombadil and The History of
    Middle-earth) rather than a first publication of new material, which
    is why it sits in apocrypha rather than alongside those two despite
    being a substantial physical object; exactly how much of its content
    is genuinely first-published here versus re-gathered wants a closer
    look at the book itself rather than the secondary sources checked so
    far.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography
