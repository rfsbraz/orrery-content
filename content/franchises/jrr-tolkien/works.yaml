  authorIds: [jrr-tolkien]
  published: 1949
  subseries: null
  canonTier: extended
  format: novella
  synopsis: >
    A comic medieval fable in which an unheroic farmer, having driven off a
    dim-witted giant purely by accident, is mistaken for a dragon-slaying
    hero and finds the mistake very hard to live down once an actual dragon
    turns up.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien

- id: jrr-tolkien/the-adventures-of-tom-bombadil
  title: "The Adventures of Tom Bombadil and Other Verses from the Red Book"
  authorIds: [jrr-tolkien]
  published: 1962
  subseries: null
  canonTier: extended
  format: poetry-collection
  synopsis: >
    Sixteen light verse poems framed as further pages from the Red Book of
    Westmarch, the in-world source of The Lord of the Rings - among them
    two about Tom Bombadil himself, the enigmatic figure the Ring has no
    power over.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/tree-and-leaf
  title: "Tree and Leaf"
  authorIds: [jrr-tolkien]
  published: 1964
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Tolkien's own account of what fantasy is for and why it matters, paired
    with a short story about a painter who never finishes his masterpiece.
  note: >
    Gathers two pieces with separate earlier histories into the single book
    Tolkien himself assembled: the essay "On Fairy-Stories" (delivered as
    the 1939 Andrew Lang Lecture, first fully published in 1947 in the
    multi-author tribute volume Essays Presented to Charles Williams - see
    that original appearance catalogued separately below as an apocrypha
    contributor entry) and the short story "Leaf by Niggle" (first
    published in The Dublin Review in 1945). A later UK-only 1988 edition
    adds the poem "Mythopoeia." format: essay-collection reflects the
    book's dominant piece and intent; it also contains one short story.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien

- id: jrr-tolkien/the-road-goes-ever-on
  title: "The Road Goes Ever On: A Song Cycle"
  authorIds: [jrr-tolkien]
  published: 1967
  subseries: null
  canonTier: extended
  format: poetry-collection
  synopsis: >
    Poems from The Lord of the Rings, several in Tolkien's own invented
    languages, set to music by the composer Donald Swann and published
    with Tolkien's own notes on the verses and the languages behind them.
  note: >
    A genuine collaboration with Swann, who wrote the musical settings;
    Swann is named here rather than given a global author entity or a
    withAuthorIds credit, on the same "one-off credit" reasoning this
