    Tree and Leaf in 1964 (catalogued separately under extended) and again
    in The Monsters and the Critics and Other Essays in 1983 - this entry
    is only the original 1947 standalone appearance.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

