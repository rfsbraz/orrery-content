# ============================ APOCRYPHA (16) ============================

- id: jrr-tolkien/sir-gawain-and-the-green-knight-middle-english-text
  title: "Sir Gawain and the Green Knight"
  authorIds: [jrr-tolkien]
  authorRole: co-author
  published: 1925
  subseries: null
  canonTier: apocrypha
  format: reference
  synopsis: >
    A scholarly edition of the Middle English poem's original text, with
    introduction, notes and glossary for students rather than a
    translation for general readers.
  note: >
    Co-prepared with the philologist E. V. Gordon while both were at
    Leeds; became a standard classroom text for decades and was revised in
    1967. Not the same book as the 1975 modern-English verse translation
    catalogued above under extended - that is Tolkien's own rendering of
    the poem into readable English; this is the critical apparatus around
    the original. Gordon is named here rather than given a global author
    entity, on the same one-off-credit grounds as Guy Gavriel Kay and
    Donald Swann above.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien
    - https://en.wikipedia.org/wiki/E._V._Gordon

- id: jrr-tolkien/on-fairy-stories
  title: "On Fairy-Stories"
  authorIds: [jrr-tolkien]
  authorRole: contributor
  contributionTitle: "On Fairy-Stories"
  published: 1947
  subseries: null
  canonTier: apocrypha
  format: anthology
  synopsis: >
    Tolkien's first full statement of what he means by "fairy-story" and
    "sub-creation," and his case for fantasy as a serious form rather than
    a childish one.
  note: >
    First delivered as the 1939 Andrew Lang Lecture at St Andrews; this is
    its first full-text publication, as one contribution among several
    scholars' essays in the multi-author tribute volume Essays Presented
