# Bibliography (works). IDs are STABLE and permanent (user data references
# them). Dates are year-precision (docs/SCHEMA.md). The default reading
# order (all works in publication order) is DERIVED from this file, so the
# grouping below - core, then extended, then apocrypha, each internally
# chronological - is for a human reader of this file only and has no
# bearing on what the app computes.
#
# Corroborated throughout against Wikipedia's own "J. R. R. Tolkien
# bibliography" (which cross-cites contemporary press coverage per
# posthumous title - the Guardian, Wall Street Journal, Tolkien Society -
# for the 21st-century volumes), the "J. R. R. Tolkien" and "Christopher
# Tolkien" articles, and, for the two structural questions below, the
# dedicated "The Silmarillion" and "The Fall of Númenor" articles. This is
# a first-draft spine, not a final one: every date and credit below rests
# on a single tertiary source and wants re-verification against primary
# sources (title pages, ISFDB) before it is treated as settled.
#
# NO SUBSERIES. Unusually for this catalogue, nothing below carries a
# subseries value: there is no numbered sequence, sub-series or shared
# in-world branding comparable to the Dark Tower or the Cosmere anywhere in
# this bibliography. The Lord of the Rings is one novel, not the first of
# a trilogy (see its own entry below); the three "Great Tales" are three
# independently packaged books that happen to share Tolkien's own retrospective
# label for them (Children of Húrin's own jacket copy), not a marketed series
# with its own numbering; The History of Middle-earth is numbered 1-12 but is
# a single scholarly project grouped into one entry below, not a series a
# reader picks individual volumes of. subseries: null is set explicitly on
# every entry rather than omitted, so a reader of this file does not have to
# infer that this is a deliberate finding rather than an oversight.
#
# STRUCTURAL CALL ONE - Christopher Tolkien: editor, co-author, or neither?
# A researched, sourced, per-work answer, not a blanket rule, because his
# hand genuinely varies by book (his own Wikipedia article, "Editor or
# author" section, cites named scholars taking different positions on
# exactly this). Three outcomes below, not two:
#
#   1. CO-AUTHOR (The Silmarillion, alone). The one place a source settles
#      it outright: J. R. R. Tolkien's own 1967 letter names Christopher
#      his literary executor AND, specifically, his "co-author" for what
#      becomes The Silmarillion (Ovenden & McIlwaine 2022, cited on
#      Wikipedia's "Christopher Tolkien" article); the book's own title
#      page separately credits him and Guy Gavriel Kay as "Editor" against
#      J. R. R. Tolkien as "Author," and Christopher has admitted (a 2012
#      Le Monde interview) to inventing whole passages to close narrative
#      gaps, most extensively in "Of the Ruin of Doriath." No other book
#      below carries a comparably direct "co-author" designation from
#      Tolkien himself, so no other entry uses this role. Guy Gavriel Kay
#      is named in this note and in The Silmarillion's own sources rather
#      than given a withAuthorIds credit or a global author entity: his own
#      Wikipedia article and the Silmarillion article both describe his
#      role as "assistance" secured through a family connection, not a
#      named co-editor or co-author credit on the book itself.
#
#   2. EDITOR, tiered apocrypha (Unfinished Tales, The Monsters and the
#      Critics and Other Essays, The Letters of J. R. R. Tolkien, the three
#      "Great Tales," The History of Middle-earth): where the credited book
#      required Christopher to select, arrange, or construct continuous
#      material out of drafts, fragments or scattered pieces Tolkien never
#      assembled into that shape himself. Wikipedia's own bibliography
#      table lists him "As editor" for these, and its "Christopher Tolkien"
#      article calls the three "Great Tales" "a synthesis of these and
#      other sources" rather than new authorship - real editorial
#      construction, distinct from The Silmarillion's father-designated
#      co-authorship but also distinct from case 3 below. This catalogue's
#      schema ties authorRole: editor to canonTier: apocrypha, which reads
#      right here: a constructed or frankly unfinished volume is exactly
#      the "limited or unfinished works" case the tier exists for,
#      whatever its sales figures.
#
#   3. DEFAULT authorRole (author, left unset), tiered extended (the Sir
#      Gawain / Pearl / Sir Orfeo translations, The Legend of Sigurd and
#      Gudrún, Beowulf: A Translation and Commentary, Letters from Father
#      Christmas, Mr. Bliss): where Tolkien completed the actual text
#      himself in his own lifetime - a finished translation, a finished
#      poem, his own letters and drawings - and the credited editor's part
#      was posthumous preparation for print rather than construction.
#      Tolkien is the sole real author of these texts even though someone
#      else brought the book to shelves after his death, so authorRole
#      stays at its default and the editor is recorded only via
#      withAuthorIds plus a note. The Fall of Arthur sits in this same
#      default-authorRole camp despite carrying canonTier: apocrypha
#      rather than extended - it is Tolkien's own unfinished draft,
#      presented as he left it rather than constructed by Christopher, so
#      the apocrypha tier there tracks the WORK's own incompleteness (the
#      tier's literal "unfinished works" case) rather than any editorial
#      construction; see that entry's own note.
#
# STRUCTURAL CALL TWO - The Lord of the Rings is ONE novel, not a trilogy.
# Tolkien wrote and conceived it as a single continuous book, the direct
# sequel to The Hobbit; his own Wikipedia biography states plainly that
# "printing costs were very high in 1950s Britain, requiring The Lord of
# the Rings to be published in three volumes" - a publisher's economic
# decision made after the fact, not an authorial one, the same distinction
# this catalogue's other wings already draw for omnibus and split editions
# (see e.g. brandon-sanderson/works.yaml on Legion or michael-connelly's
# "Harry Bosch Novels" omnibuses: publication packaging is edition data,
# not a second or third work). Below, it is a single entry dated to the
# first volume's 1954 publication, with the three volume titles and their
# individual 1954-1955 dates recorded in its own note rather than as three
# ids.
#
# STRUCTURAL CALL THREE - The History of Middle-earth: one grouped entry,
# not twelve, not excluded. Three options were weighed. (a) Twelve separate
# work ids was rejected: unlike a real series a reader picks volumes of
# individually, this is explicitly one 45-year scholarly project - Charles
# Noad's assessment (quoted on Christopher Tolkien's Wikipedia article) is
# that the twelve volumes collectively "changed people's perspective" on
# the legendarium, a claim about the set, not about any one book - and
# twelve ids would flood this wing's derived default order with 1983-1996
# entries a general reader has no way to tell apart from the three "Great
# Tales" beside them. (b) Straight exclusion (the standing this-catalogue
# precedent, applied on edgar-allan-poe and hp-lovecraft, of leaving out
# posthumous editorial anthologies that only repackage already-published
# tales) does not fit either: unlike those anthologies, most of The History
# of Middle-earth is the FIRST publication of previously unseen manuscript
# material (early Silmarillion drafts, the entire draft history of The
# Lord of the Rings, poetry, invented-language essays), not a repackaging
# of books already on this shelf - which is exactly why The Fall of
# Númenor (2022), which IS a repackaging, is excluded below instead (see
# that note). (c) One grouped apocrypha entry, chosen: it records that the
# project exists and is real, without either overstating its status as
# individually-consumable "books" or erasing it as somehow not real
# Tolkien. It is best treated as a single unit for spoiler and sequencing
# purposes rather than twelve separately orderable volumes, though whether
# that holds is worth revisiting once the rest of the wing exists.
#
# NOT INCLUDED, decided rather than overlooked:
#   - The History of The Hobbit (2007) by John D. Rateliff: a scholarly
#     book ABOUT Tolkien's drafts, credited to and authored by Rateliff, not
#     a Tolkien-credited work - the same reason Humphrey Carpenter's own
#     1977 biography and Tom Shippey's criticism are excluded, even though
#     Rateliff's book "contains substantial text fragments" per the
#     Wikipedia bibliography.
#   - The Fall of Númenor (2022, ed. Brian Sibley): excluded on direct,
#     repeated scholarly authority rather than judgement call. Four
#     published reviews (Danehy-Oakes in Tolkien Studies, Dickieson in
#     Sehnsucht, Kane in Journal of Tolkien Research, Williams in Journal
#     of Inklings Studies - all cited on the book's own Wikipedia article)
#     agree it "provides nothing that was not already in print": Sibley
#     rearranges material already published in The Silmarillion, Unfinished
#     Tales, The History of Middle-earth and The Nature of Middle-earth
#     into the chronological shape of the Appendix B "Tale of Years,"
#     timed to accompany Amazon's The Rings of Power. This is exactly the
#     posthumous-repackaging case The History of Middle-earth note above
#     distinguishes itself from, and Brian Sibley accordingly gets no
#     author entity or works.yaml entry here.
#   - Omnibus regroupings of works already listed individually below: The
#     Tolkien Reader (1966), Poems and Stories (1980), A Tolkien Miscellany
#     (2002), Tales from the Perilous Realm (2008). Each repackages Farmer
#     Giles of Ham / Tree and Leaf / Smith of Wootton Major / The Adventures
#     of Tom Bombadil / Roverandom in different combinations; none adds
#     content beyond what its own entry below already covers, the same
#     edition-vs-work distinction as the omnibuses named above.
#   - The large body of narrowly technical journal pieces on Tolkien's
#     invented languages, published across four decades in Vinyar Tengwar
#     and Parma Eldalamberon (dozens of entries in the Wikipedia
#     bibliography's own "Constructed languages" section) plus his minor
#     philological journal articles in his lifetime (A Middle English
#     Vocabulary, "Sigelwara Land," "The Devil's Coach Horses," "Ancrene
#     Wisse and Hali Meiðhad," "Chaucer as a Philologist," "English and
#     Welsh," his Oxford English Dictionary and Jerusalem Bible
#     contributions): excluded as a body on the same grounds this
#     catalogue already excludes H. P. Lovecraft's amateur-press editorials
#     - too numerous, too narrowly technical, and (for the invented-
#     language pieces specifically) about his scholarship on his own
#     languages rather than narrative works in their own right.
#   - "The Bovadium Fragments" (2025, comic Latin verse squib, edited by
#     Christopher Tolkien with a historical essay by Richard Ovenden) and
#     "A Secret Vice" as a standalone 2016 volume (the 1931 lecture is
#     already collected in The Monsters and the Critics and Other Essays,
#     below): genuinely minor and not researched further here; either
#     belongs in the wing on closer look or doesn't, and nothing above
#     turns on the answer.

# ============================= CORE (3) ==============================

- id: jrr-tolkien/the-hobbit
  title: "The Hobbit"
  authorIds: [jrr-tolkien]
  published: 1937
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A comfortable, unadventurous hobbit is talked into leaving his hole by
    a wizard and thirteen dwarves bent on reclaiming their mountain home
    and its treasure from a dragon, and comes home having found rather
    more than a share of gold.
  note: >
    Written for his own children and reached publication almost by
    accident: a Tolkien manuscript in circulation among friends came to the
    attention of a publisher's employee, Susan Dagnall, who persuaded him
    to submit it. Its commercial success is what led George Allen & Unwin
    to ask for a sequel, which became The Lord of the Rings.
  sources:
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien_bibliography

- id: jrr-tolkien/the-lord-of-the-rings
  title: "The Lord of the Rings"
  authorIds: [jrr-tolkien]
  published: 1954
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    Years after his cousin Bilbo's adventure, a hobbit inherits a plain
    gold ring that turns out to be the master weapon of the Dark Lord
    Sauron, and must carry it across Middle-earth to the one place it can
    be destroyed, while armies gather for a war his errand alone can end.
  note: >
    ONE NOVEL, not a trilogy: Tolkien conceived and wrote it as a single
    continuous sequel to The Hobbit, and his own Wikipedia biography states
    that "printing costs were very high in 1950s Britain, requiring The
    Lord of the Rings to be published in three volumes" - a publisher's
    decision after the manuscript was finished, not a three-book design.
    The three volumes and their individual UK first-edition dates: The
    Fellowship of the Ring (29 July 1954), The Two Towers (11 November
    1954), The Return of the King (20 October 1955). published above is
    set to the first volume's year per this catalogue's own convention
    for a work whose parts released across a date range. Tolkien finished
    the manuscript itself in 1948, close to a decade after starting it.
  sources:
    - https://en.wikipedia.org/wiki/The_Lord_of_the_Rings
    - https://en.wikipedia.org/wiki/J._R._R._Tolkien

- id: jrr-tolkien/the-silmarillion
  title: "The Silmarillion"
  authorIds: [jrr-tolkien]
  withAuthorIds: [christopher-tolkien]
  authorRole: co-author
  published: 1977
  subseries: null
  canonTier: core
  synopsis: >
    The creation of the world and the earlier ages of Middle-earth: the
    making of the Two Trees and the jeweled Silmarils that give the book
    its name, the long wars against the first Dark Lord, and the drowning
    of the island kingdom of Númenor - the deep history Bilbo and Frodo's
    own story rests on.
  note: >
    Tolkien worked on this material from 1914 on and hoped to publish it
    alongside The Lord of the Rings, but never finished or unified it in
    his lifetime; George Allen & Unwin had already rejected an earlier,
    "too Celtic" draft in 1937, asking for a Hobbit sequel instead. What
    reached print in 1977 is Christopher Tolkien's single-volume
    construction from the surviving drafts, assisted by Guy Gavriel Kay
    (later a fantasy author in his own right); Christopher has said he had
    to "invent some passages" to close gaps and reconcile threads,
    especially in the chapter "Of the Ruin of Doriath." authorRole:
    co-author is set deliberately, on the strength of his father's own
    1967 letter naming him co-author for this material specifically - see
    this file's own header for why every OTHER Christopher Tolkien-edited
    work here carries a different role.
  sources:
    - https://en.wikipedia.org/wiki/The_Silmarillion
    - https://en.wikipedia.org/wiki/Christopher_Tolkien

