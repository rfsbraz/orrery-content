# Identity + features. This catalogue's standing rule is that a wing spans
# an author's complete published body of work, so kind is author and the
# wing spans Lovecraft's COMPLETE published body of work,
# not just the Cthulhu Mythos he is best known for; the Mythos lives inside
# this wing as a subseries (see works.yaml's header for the sourced
# boundary between his own Mythos contributions and August Derleth's
# posthumous extensions, which do not belong in this wing at all).
#
# features, startHere and globalEvents are left unset: no wizard entry
# path or additional order is sourced yet, and no shared-catalogue event's
# reach into this author's page has been ruled on yet.
id: hp-lovecraft
name: H. P. Lovecraft
kind: author
description: >
  A Providence, Rhode Island magazine contributor who spent most of his
  working life ghostwriting and revising other people's fiction for a fee,
  and who wrote, almost as a side effect, the body of short stories and
  novellas that gave 20th-century horror its cosmic register: from the
  found-manuscript dread of
  [[work:hp-lovecraft/the-call-of-cthulhu|The Call of Cthulhu]] (1928)
  through the Antarctic expedition report of
  [[work:hp-lovecraft/at-the-mountains-of-madness|At the Mountains of
  Madness]] (1936) to the last story he completed,
  [[work:hp-lovecraft/the-haunter-of-the-dark|The Haunter of the Dark]]
  (1936). Almost entirely unknown outside pulp-magazine readership at his
  death in 1937, his work survives mainly because friends founded a small
  press, Arkham House, to keep it in print.
authorIds: [hp-lovecraft]
themePreset: cosmic-antiquarian
sources:
  - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
  - "https://www.hplovecraft.com/"
