- id: hp-lovecraft/supernatural-horror-in-literature
  title: "Supernatural Horror in Literature"
  authorIds: [hp-lovecraft]
  published: 1927
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    A long critical survey of the entire weird-fiction tradition, from
    Gothic novels through Poe, Machen, Blackwood and Dunsany to Lovecraft's
    own contemporaries, still cited by scholars as a foundational work of
    horror criticism. Composed 1925-1927 for the amateur-journalism
    circular The Recluse and revised through the mid-1930s.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/notes-on-writing-weird-fiction
  title: "Notes on Writing Weird Fiction"
  authorIds: [hp-lovecraft]
  published: 1937
  subseries: null
  canonTier: extended
  format: essay
  synopsis: >
    A short, frequently reprinted essay laying out Lovecraft's own method
    for constructing a weird tale, including his habit of working out a
    story's background events in careful chronological order before
    writing a word of the narrative itself.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

