  canonTier: apocrypha
  format: novella
  authorRole: author
  synopsis: >
    A visitor to a ruined Missouri plantation hears the story of an artist
    destroyed by his own wife's inhuman, serpentine hair - a story whose
    original ending was suppressed by editors and not restored in print
    until S. T. Joshi's 1989 edition. The last of three stories Lovecraft
    ghostwrote for Zealia Bishop; not published until 1939, after his
    death.
  note: >
    Ghostwritten for Zealia Bishop, from her premise. The suppressed
    original ending turns on the revelation that a character believed white
