# ============================================================
# POETRY - see the header note on why this bibliography does not
# atomise the amateur-journalism verse corpus the way it atomises
# every prose tale
# ============================================================

- id: hp-lovecraft/fungi-from-yuggoth
  title: "Fungi from Yuggoth"
  authorIds: [hp-lovecraft]
  published: 1943
  subseries: "Cthulhu Mythos"
  canonTier: extended
  format: poetry-collection
  synopsis: >
    A cycle of thirty-six linked sonnets - dreams, cosmic vistas, and
    glimpses of things better not glimpsed, moving from an ordinary
    secondhand bookshop to visions of Yuggoth and beyond. Composed as one
    sequence over ten days in December 1929-January 1930, unlike the rest
    of Lovecraft's poetry: individual sonnets were placed in magazines
    across 1930-1932, but the complete thirty-six-sonnet cycle he actually
    composed was not published together until 1943, six years after his
    death.
  note: Two sonnets in the cycle are titled "Nyarlathotep" (XXI) and "Azathoth" (XXII) and use those entities directly, which is the basis for this work's Cthulhu Mythos tag; the cycle as a whole ranges well beyond Mythos content into dream-poetry and New England genre pieces.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

