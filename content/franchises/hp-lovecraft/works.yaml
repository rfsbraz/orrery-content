  title: "In the Walls of Eryx"
  authorIds: [hp-lovecraft]
  published: 1939
  subseries: null
  canonTier: apocrypha
  format: short-story
  authorRole: co-author
  contributionTitle: "Co-written with Kenneth Sterling"
  synopsis: >
    A Venusian prospector, hunting a valuable crystal, becomes lost inside
    an invisible maze built by the planet's native inhabitants. Sterling,
    a teenage science-fiction fan and later a physician, provided the
    original 6,000-8,000-word draft and premise; Lovecraft's rewrite
    lengthened it to 12,000 words and, though Sterling's original draft
    does not survive for comparison, is generally credited with most of
