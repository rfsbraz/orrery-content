# Bibliography (Works) - the abstract stories/poems/essays; editions and
# covers are a separate layer. IDs are STABLE and permanent (user data
# references them).
#
# STRUCTURAL CALL (the same unit-of-work question the request issue,
# orrery-content#66, raises explicitly for this author, citing Poe as
# precedent): the atomic unit for fiction below is the individual tale or
# novella, not a collection Lovecraft or a later editor assembled - the
# same call this catalogue already made for edgar-allan-poe/works.yaml, for
# the same reason. Lovecraft published no story collection of his own in
# his lifetime at all (a handful of individual tales appeared in
# anthologies edited by others); the familiar collections a reader meets
# today - Arkham House's "The Dunwich Horror and Others," "At the
# Mountains of Madness and Other Novels," Penguin Classics' three
# S.T. Joshi-edited volumes - are all posthumous editorial groupings, most
# assembled decades after his death. Treating any of them as a "work"
# would invent a book that never existed in the sense this catalogue means
# it; the individual tale, almost always first published in a magazine
# (chiefly Weird Tales), is the unit.
#
# Dates and forms for solo fiction below are taken from Wikipedia's "H. P.
# Lovecraft bibliography," itself sourced to An H. P. Lovecraft Encyclopedia
# by S. T. Joshi and D. E. Schultz (Hippocampus Press, New York, 2001) -
# https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography - cross-checked
# against the H. P. Lovecraft Archive's own electronic-text listing
# (hplovecraft.com/writings/texts/), the specialist site maintained by
# Donovan K. Loucks with the Lovecraft scholarly community's involvement.
# `published` records first publication (the convention this catalogue's
# default order and eras both key on), not composition; the two differ
# widely and sometimes by over a decade, since Lovecraft wrote for his own
# circle and for magazines that folded, rejected, or simply sat on
# manuscripts, and a large fraction of his fiction reached print only after
# his 1937 death. Synopses were written from general knowledge of these
# widely taught and anthologized texts rather than a fresh read of each.
#
# UNIT OF WORK, PART TWO - COLLABORATIONS, REVISIONS AND GHOSTWRITING: the
# issue's first named problem. Lovecraft spent a large part of his working
# life revising and ghostwriting fiction for other, usually far less
# accomplished, writers for a fee - his actual hand in these pieces ranges
# from a light polish of someone else's finished draft to writing nearly
# the whole story from a one-paragraph premise. Two things follow from
# that range, both explicit rather than assumed:
#
#   1. They are catalogued here, honestly tiered apocrypha (the schema's
#      own definition - "contributions, limited or unfinished works" -
#      fits a paid revision or ghostwrite exactly), rather than either
#      folded silently into the core bibliography as if they were ordinary
#      solo Lovecraft stories, or omitted as if the work never happened.
#      Omission would be the bigger dishonesty: several of these
#      (The Mound, The Curse of Yig, Medusa's Coil, the Hazel Heald
#      stories) carry real Mythos content and are routinely read and
#      reprinted as part of his output.
#   2. `authorRole` records the documented direction, not a shrug:
#      `author` where a primary source (Lovecraft's own letters, or a
#      scholarly consensus resting on them) establishes he wrote
#      essentially all of the prose from the other party's premise or
#      earlier draft - the Zealia Bishop trilogy, the five Hazel Heald
#      stories, the two Adolphe de Castro pieces, the Harry Houdini
#      ghostwrite, and William Lumley's "Alonzo Typer." `co-author` where
#      the record shows real two-way authorship - a Lovecraft rewrite of
#      a peer's own draft (R. H. Barlow, a teenage protege who became his
#      literary executor; Kenneth Sterling; Duane W. Rimel; Wilfred Blanch
#      Talman; Henry S. Whitehead; C. M. Eddy Jr.; his wife Sonia Greene;
#      Winifred V. Jackson; the 1935 five-author round robin), or where
#      the record does not clearly establish a one-way direction at all
#      (Anna Helen Crofts; the disputed "Thing in the Moonlight," flagged
#      below). Where a specific source gives a concrete apportionment
#      (a word count, a letter quote), it is in the work's own `note`
#      rather than asserted as a blanket rule for the whole client
#      relationship. `withAuthorIds` is left empty throughout: most of
#      these collaborators have no other bibliography in this catalogue
#      and creating a thin global author entity on the strength of one
#      credit each is its own, separate editorial decision this scaffold
#      does not make; the collaborator is named in prose and `sources`
#      instead, which records the relationship without implying a global
#      identity resolved elsewhere in the app.
#      `publishedAs` is set only where a source specifically confirms the
#      original byline (mostly the case where Lovecraft ghostwrote under
#      the client's name alone); left unset where that specific fact was
#      not separately verified even though the underlying relationship is
#      well documented.
#
# NOT INCLUDED, and why:
# - The sixteen "posthumous collaborations" August Derleth published from
#   the 1940s onward (The Lurker at the Threshold and others) are excluded
#   entirely, not merely tiered down. Wikipedia's own bibliography article
#   states plainly that Derleth wrote these himself, at most incorporating
#   short fragments of Lovecraft's unfinished notes, and that their status
#   as genuine collaborations was disputed immediately after Derleth's own
#   death. See the Cthulhu Mythos subseries note below for why this is a
#   boundary this wing draws on principle, not only on the specific
#   evidence for these sixteen pieces.
# - "The Inevitable Conflict" (Amazing Stories, Dec 1930-Jan 1931, byline
#   "Paul H. Lovering") - Wikipedia's bibliography article records that
#   statistical and other evidence has been raised against Lovecraft's
#   authorship; not solid enough to catalogue as his.
# - The five nonextant childhood pieces the record itself has no surviving
#   text for ("The Noble Eavesdropper," "The Secret of the Grave," "The
#   Haunted House," "John, the Detective," "The Picture") - the same
#   standard this catalogue already applies on the Poe wing to
#   attributed-but-lost work.
# - The great bulk of Lovecraft's amateur-journalism verse and criticism -
#   several hundred occasional poems (birthday verses, convention squibs,
#   dedication pieces to fellow amateur journalists) and as many essays and
#   editorials for small amateur-press circulars, mostly undated or dated
#   only to a year, several existing only as fragments or in duplicate
#   drafts. This is a genuinely different case from the Poe wing, which
#   atomised even Poe's minor verse: poetry and criticism are roughly half
#   of Poe's own claim on being read today, where for Lovecraft they are
#   apprentice and hobbyist work that neither he nor later scholarship
#   treats as part of what he is read for. This wing instead catalogues
#   his one true poem-cycle (Fungi from Yuggoth, below) and his one
#   landmark critical work (Supernatural Horror in Literature, below) and
#   states the rest as a documented, deliberate gap rather than inventing
#   one hundred-plus thin entries with next to nothing to say about most of
#   them. A reader who wants the rest of the poetry is pointed, in
#   Fungi from Yuggoth's own sources, at S. T. Joshi's complete edition.
#
# canonTier convention for this franchise (fiction only; poetry, nonfiction
# and every collaboration/revision/ghostwrite entry is `apocrypha` on the
# grounds given above, regardless of quality or fame within that group):
#   core     - a finished, complete solo tale or novella/novel, published in
#              a recognised venue (magazine or, posthumously, a standard
#              collection) and long accepted as part of the fiction canon.
#              Tier here tracks whether a piece is finished and accepted, not fame - an
#              obscure early tale and "The Call of Cthulhu" are both core.
#   apocrypha - genuine juvenilia (five childhood pieces with surviving
#              text, all first published only in 1959 or, for the earliest
#              substantial one, 1918); unfinished fragments Lovecraft never
#              completed (Azathoth, The Descendant, The Book); two pieces
#              that exist only as excerpts from his private letters, not as
#              stories he wrote to be published (The Very Old Folk, The
#              Evil Clergyman); and the one in-universe reference document,
#              History of the Necronomicon (tagged format: reference, the
#              closest honest fit - it is not a narrative at all).
#
# SUBSERIES, PART ONE - CTHULHU MYTHOS (the request issue's second named
# problem): the Cthulhu Mythos is a shared universe with many hands in it,
# not a boundary this catalogue draws around one author (this catalogue's
# standing rule: wings are authors, universes are subseries inside them).
# The term itself was coined by August Derleth,
# not Lovecraft - Wikipedia's Cthulhu Mythos article states this directly
# and cites Lovecraft's own letters calling his invented mythology
# "Yog-Sothothery," never "the Cthulhu Mythos" - and Derleth spent the
# decades after Lovecraft's 1937 death systematising and substantially
# reshaping it: inventing the "Elder Gods" as benevolent counterweights to
# the "Great Old Ones," recasting what had been background texture into an
# explicit good-versus-evil cosmology alien to Lovecraft's own cosmic
# indifference, and folding in other writers' creations (Clark Ashton
# Smith's Book of Eibon and more) as if they had always been one system.
# Robert M. Price's essay "H. P. Lovecraft and the Cthulhu Mythos" names
# these two stages explicitly - "the Cthulhu Mythos proper" under
# Lovecraft's own guidance during his lifetime, and Derleth's second,
# reshaping stage after it - and Richard L. Tierney's later term "Derleth
# Mythos" for the second stage, coined specifically to keep the two apart,
# is the standard scholarly shorthand for the same distinction (both cited
# on Wikipedia's Cthulhu Mythos article). This wing's Cthulhu Mythos
# subseries is Price's first stage only: Lovecraft's own contributions,
# including the ones he ghostwrote or revised into someone else's story
# (the Mythos content there is demonstrably his), tagged as a subseries
# inside his wing exactly as this catalogue's Dupin precedent (Poe) tags a
# genuine continuing thread. Derleth's own Mythos fiction, and the other
# fourteen writers' worth of Mythos fiction that followed him, is a
# different question for a different, not-yet-built wing if one is ever
# justified - never a "see also" and never folded in here to make the
# shelf look fuller.
#
# Membership test, applied to Lovecraft's own solo and revision/ghostwrite
# fiction only (never to a Derleth piece, which is excluded outright
# regardless of content): a work is tagged subseries: "Cthulhu Mythos"
# where Lovecraft's own text documentably features the Necronomicon or its
# author Abdul Alhazred, or one of the recurring named cosmic entities
# (Cthulhu, Yog-Sothoth, Nyarlathotep, Azathoth, Shub-Niggurath, Yig) or
# interlocking alien races/places (the Deep Ones and R'lyeh, the Great Race
# of Yith, the Elder Things and Mi-Go, Yuggoth). The Necronomicon
# appearances are independently confirmed, story by story with quoted
# passages, by the H. P. Lovecraft Archive's own page on the subject
# (hplovecraft.com/creation/necron/stories.aspx) - the source list this
# subseries tag rests on for most of its members; the entity-naming test
# accounts for the handful of members that page does not cover (Nyarlathotep,
# The Shadow over Innsmouth, The Curse of Yig, The Mound). Two well-known
# antecedents are deliberately left untagged rather than stretched to fit:
# "Dagon" (1917) and "The Temple" (1920) prefigure the Mythos's undersea
# themes and are widely discussed as its thematic ancestors, but neither
# names a pantheon entity or the Necronomicon, so the sourced test above
# does not reach them; a note on each records the relationship without
# claiming subseries membership the test itself will not support.
#
# SUBSERIES, PART TWO - RANDOLPH CARTER: a genuine author-continued
# character thread, on the same footing as Poe's Dupin trilogy. Four tales
# narrate or follow the same recurring protagonist and, in one case,
# explicitly continue a prior entry: "The Statement of Randolph Carter"
# (1920) introduces him; "The Silver Key" (1929) and "The Dream-Quest of
# Unknown Kadath" (1943, composed 1926-27) both centre on him; "Through the
# Gates of the Silver Key" (1934, co-written with E. Hoffmann Price) is a
# direct sequel Price proposed specifically to continue Carter's story from
# where "The Silver Key" left him, by Price's own account (cited on the
# work's entry). Two of these four also touch Cthulhu Mythos entities or
# the Necronomicon (Dream-Quest features Nyarlathotep; Through the Gates of
# the Silver Key references the Necronomicon several times) - since a work
# carries only one subseries value, the tighter, author-declared character
# thread takes precedence over the broader entity-sharing grouping for all
# four, and the Mythos touch-points are recorded in each work's own note
# instead.
#
# FEATURED (cap 3, three different kinds of hinge rather than three
# favourites - the same discipline the Poe wing already documents): The
# Call of Cthulhu (1928, the story whose title now names his entire
# legacy and the Mythos itself); The Case of Charles Dexter Ward (1941,
# his only novel-length work, a formal hinge no other entry shares); The
# Haunter of the Dark (1936, the last solo story he completed before his
# 1937 death, a closing hinge).

# ============================================================
# FICTION - the core spine (solo original fiction)
# ============================================================

- id: hp-lovecraft/the-alchemist
  title: "The Alchemist"
  authorIds: [hp-lovecraft]
  published: 1916
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    The last heir of a cursed noble line confronts, in his ancestral
    castle's ruined tower, the source of the family curse that has killed
    every count at the same age for six centuries. Written in 1908, when
    Lovecraft was seventeen - his earliest surviving mature story.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-tomb
  title: "The Tomb"
  authorIds: [hp-lovecraft]
  published: 1922
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A young man grows obsessed with a locked, sealed family tomb near his
    home and comes to believe he is possessed by an ancestor's spirit.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/dagon
  title: "Dagon"
  authorIds: [hp-lovecraft]
  published: 1919
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A shipwrecked sailor, adrift on a stretch of seabed thrust up by an
    earthquake, glimpses an immense inhuman creature at worship before a
    monolith carved with images of a sea-god. Widely read as the thematic
    seed of the undersea civilisations and worship-cults recurring across
    the later Mythos, though it names no pantheon entity itself; see the
    Cthulhu Mythos subseries note above for why it is left untagged rather
    than assumed into the subseries.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/a-reminiscence-of-dr-samuel-johnson
  title: "A Reminiscence of Dr. Samuel Johnson"
  authorIds: [hp-lovecraft]
  published: 1917
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A pastiche narrated by a fictional acquaintance of the 18th-century
    lexicographer, written in period style as an exercise in Georgian
    prose - one of several early pieces indulging Lovecraft's antiquarian
    love of the 1700s.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/polaris
  title: "Polaris"
  authorIds: [hp-lovecraft]
  published: 1920
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A dreamer watching the Pole Star from an ancient watchtower comes to
    believe his waking life is the dream and a forgotten war in a lost
    northern city is the reality.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/beyond-the-wall-of-sleep
  title: "Beyond the Wall of Sleep"
  authorIds: [hp-lovecraft]
  published: 1919
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An asylum doctor uses a wireless device to enter the dreams of a
    murderous patient and finds a vast cosmic intelligence trapped inside
    an ordinary, uneducated man's mind.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/memory
  title: "Memory"
  authorIds: [hp-lovecraft]
  published: 1923
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A very short prose-poem dialogue between a Genie and a Daemon in a
    ruined valley that was once a human city, on how completely a
    civilisation can vanish from the world's memory.
  note: Classed by Wikipedia's bibliography as "flash fiction"; short-story is the closest fit this catalogue's format list offers.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/old-bugs
  title: "Old Bugs"
  authorIds: [hp-lovecraft]
  published: 1959
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A Prohibition-era comic parable set in a Chicago speakeasy, in which a
    derelict former poet warns a young man off the drink that ruined him.
    Not published in Lovecraft's lifetime.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-transition-of-juan-romero
  title: "The Transition of Juan Romero"
  authorIds: [hp-lovecraft]
  published: 1944
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    Miners in a Southwestern mine blast open a shaft of unknown depth, and
    a Mexican labourer undergoes an inexplicable transformation the night
    something answers from below. Not published in Lovecraft's lifetime.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-white-ship
  title: "The White Ship"
  authorIds: [hp-lovecraft]
  published: 1919
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A lighthouse keeper boards a phantom ship and voyages through a series
    of dream-lands in search of ultimate beauty, in the Dunsanian mode of
    Lovecraft's early fantasy fiction.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-doom-that-came-to-sarnath
  title: "The Doom That Came to Sarnath"
  authorIds: [hp-lovecraft]
  published: 1920
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    The prosperous city of Sarnath, built on the ruins of an older city
    whose people it exterminated a thousand years before, is destroyed in
    turn on the anniversary of that massacre.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-statement-of-randolph-carter
  title: "The Statement of Randolph Carter"
  authorIds: [hp-lovecraft]
  published: 1920
  subseries: "Randolph Carter"
  canonTier: core
  format: short-story
  synopsis: >
    Randolph Carter gives police his account of his friend Harley Warren's
    disappearance in an ancient cemetery, ending with a voice from below
    that he can never adequately describe. Introduces the character; based,
    by Lovecraft's own account, on a dream.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-street
  title: "The Street"
  authorIds: [hp-lovecraft]
  published: 1920
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An allegorical history of a New England street from colonial founding
    through industrial decline, tracing Lovecraft's anxieties about
    immigration and change in overtly allegorical rather than narrative
    form.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-terrible-old-man
  title: "The Terrible Old Man"
  authorIds: [hp-lovecraft]
  published: 1921
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    Three thieves plan to rob a strange, ancient recluse in a decaying
    coastal town, unaware of what he keeps in bottles that swing like
    pendulums and answer him in tiny voices.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-cats-of-ulthar
  title: "The Cats of Ulthar"
  authorIds: [hp-lovecraft]
  published: 1920
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A fable explaining why, by ancient law, no one may kill a cat in the
    town of Ulthar - after a cruel old couple who did so vanish along with
    every cat in the district for one night.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-tree
  title: "The Tree"
  authorIds: [hp-lovecraft]
  published: 1921
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    Two rival sculptors of ancient Greece; one dies of illness, and a
    strangely shaped olive tree grows from his grave beside his rival's
    studio.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/celephais
  title: "Celephaïs"
  authorIds: [hp-lovecraft]
  published: 1922
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A poor Londoner returns again and again, in dreams, to the dream-city
    of his childhood imagination - the one place where he has not aged,
    and the only one he still wants to be in.
  note: >
    Where the dreaming finally leaves him in the waking world is the
    story's closing image and is not stated above.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/from-beyond
  title: "From Beyond"
  authorIds: [hp-lovecraft]
  published: 1934
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A scientist's machine stimulates the pineal gland to perceive beings
    that share our space but not our senses - with predictably fatal
    results once they can perceive us in turn.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-temple
  title: "The Temple"
  authorIds: [hp-lovecraft]
  published: 1925
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A German U-boat commander's log records his crew's slow disintegration
    after they recover an ivory carving from a drowned corpse, ending with
    a descent toward a sunken city glowing far below. Another widely
    discussed thematic ancestor of the Mythos's drowned-city imagery,
    predating it by name; left untagged for the same reason as "Dagon"
    (see the subseries note above).
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/nyarlathotep
  title: "Nyarlathotep"
  authorIds: [hp-lovecraft]
  published: 1920
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  synopsis: >
    A prose poem in which a figure calling himself Nyarlathotep tours the
    world demonstrating uncanny devices, leaving madness, unrest and
    apocalyptic dread in his wake. Introduces the entity by name; Lovecraft
    later wrote it came to him directly from a dream.
  note: Written in collaboration with Winifred Virginia Jackson according to some early accounts of its genesis, but published and catalogued as Lovecraft's solo work by Wikipedia's bibliography and the H. P. Lovecraft Archive alike.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-picture-in-the-house
  title: "The Picture in the House"
  authorIds: [hp-lovecraft]
  published: 1921
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A cyclist caught in a storm shelters in an isolated New England
    farmhouse with a very old, very strange occupant and a book of
    engravings depicting a Central African butcher shop.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/facts-concerning-the-late-arthur-jermyn-and-his-family
  title: "Facts Concerning the Late Arthur Jermyn and His Family"
  authorIds: [hp-lovecraft]
  published: 1921
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A scholar of his own family's Africa-trading history discovers the
    origin of a hereditary strangeness running through his line, and reacts
    by setting himself alight. First published as "The White Ape."
  note: Its ending trades on the era's scientific racism and its central "discovery" is framed around fear of interbreeding across a colour line; a fact about how the story works rather than an isolated one.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-nameless-city
  title: "The Nameless City"
  authorIds: [hp-lovecraft]
  published: 1921
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  synopsis: >
    An explorer alone in the Arabian desert enters a vast, non-human city
    buried under sand for uncounted ages, and finds evidence of the
    reptilian race that built it. The first appearance of the "Mad Arab"
    Abdul Alhazred and his couplet ("That is not dead which can eternal
    lie...") - the earliest fixed point of what became the Necronomicon,
    though the book itself is not yet named here.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-quest-of-iranon
  title: "The Quest of Iranon"
  authorIds: [hp-lovecraft]
  published: 1935
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A wandering singer searches for the lost golden city of his birth,
    Aira, refusing every comfortable ordinary life offered along the way -
    until the truth of what Aira actually was catches up with him.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-moon-bog
  title: "The Moon-Bog"
  authorIds: [hp-lovecraft]
  published: 1926
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An Irish landowner drains an ancient bog against local warnings and
    unleashes whatever the drowned Greek ruins beneath it were meant to
    keep contained.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/ex-oblivione
  title: "Ex Oblivione"
  authorIds: [hp-lovecraft]
  published: 1921
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A very short prose poem on a dreamer's longing to pass, for good,
    through a gate in a wall he has glimpsed again and again, into final
    oblivion.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-other-gods
  title: "The Other Gods"
  authorIds: [hp-lovecraft]
  published: 1933
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A priest climbs the sacred mountain Hatheg-Kla to see the earth's gods
    face to face, against every warning that they left it long ago to be
    guarded instead by something else entirely.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-outsider
  title: "The Outsider"
  authorIds: [hp-lovecraft]
  published: 1926
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A being who has lived its whole remembered life alone in a lightless
    castle climbs at last into the outside world in search of other people
    - and discovers, at a party, exactly what kind of being it is. One of
    Lovecraft's most widely reprinted and most variously interpreted
    stories.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-music-of-erich-zann
  title: "The Music of Erich Zann"
  authorIds: [hp-lovecraft]
  published: 1922
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A student lodging above a mute viol player realises his neighbour plays
    increasingly frantic, otherworldly music at his garret window each
    night to hold something back - and that the street itself may not
    exist to be found again afterward.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/sweet-ermengarde
  title: "Sweet Ermengarde"
  authorIds: [hp-lovecraft]
  published: 1943
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A broad comic parody of maudlin rural-romance melodrama, written purely
    for private amusement and never submitted for publication in
    Lovecraft's lifetime.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/hypnos
  title: "Hypnos"
  authorIds: [hp-lovecraft]
  published: 1923
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A sculptor and his companion push the boundaries of dream-travel
    together until the companion goes somewhere, or becomes something, the
    narrator will not describe.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/what-the-moon-brings
  title: "What the Moon Brings"
  authorIds: [hp-lovecraft]
  published: 1923
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A very short prose poem on a garden that turns hideous under moonlight,
    and a river that gives up its dead.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/azathoth
  title: "Azathoth"
  authorIds: [hp-lovecraft]
  published: 1938
  subseries: "Cthulhu Mythos"
  canonTier: apocrypha
  format: short-story
  synopsis: >
    An unfinished fragment, little more than an opening page, describing a
    man who seeks dreams because the ordinary waking world has grown too
    prosaic to bear. Names the "daemon-sultan" Azathoth, the blind idiot god
    at the centre of the Mythos's cosmology, but the story itself was never
    continued.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/herbert-west-reanimator
  title: "Herbert West-Reanimator"
  authorIds: [hp-lovecraft]
  published: 1922
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A medical-school reanimation experiment escalates across six
    installments, each corpse revived a little more disastrously than the
    last. Written to order as a six-part serial for a small press,
    something Lovecraft himself later dismissed as hack work, but the
    direct ancestor of the Re-Animator film franchise.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-hound
  title: "The Hound"
  authorIds: [hp-lovecraft]
  published: 1924
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  synopsis: >
    Two decadent grave-robbers steal a corpse-eating cult's amulet from a
    Dutch grave, and are hunted afterward by something that leaves paw
    prints. The first story to name the Necronomicon and its author, Abdul
    Alhazred, directly.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-lurking-fear
  title: "The Lurking Fear"
  authorIds: [hp-lovecraft]
  published: 1923
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An investigator camps out during a lightning storm on Tempest Mountain
    to learn what has been killing squatters around a ruined mansion, and
    works back through the history of the Martense family who built it and
    then vanished from it.
  note: >
    The Martense history is given early in the text and is stated above;
    what the fear itself turns out to be belongs to the last of the
    story's four instalments and is not.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-rats-in-the-walls
  title: "The Rats in the Walls"
  authorIds: [hp-lovecraft]
  published: 1924
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An American restores his ancestral English priory over local objection
    and, following the sound of rats moving inside the walls, uncovers what
    his family did there for centuries in the dark below the crypt.
  note: The narrator's cat is named with a period-typical racial slur, retained in the original text and reproduced in most standard editions; a documented fact about the text itself rather than an isolated word choice.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-unnamable
  title: "The Unnamable"
  authorIds: [hp-lovecraft]
  published: 1925
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    Two friends debating whether anything can truly be beyond description
    sit in a haunted graveyard at dusk to test the question, with the
    obvious result.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-festival
  title: "The Festival"
  authorIds: [hp-lovecraft]
  published: 1925
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  synopsis: >
    A man returns, as family custom obliges once a generation, to his
    ancestral town of Kingsport for a secret midwinter rite - and finds the
    relatives waiting for him are not what family custom implied. The
    Necronomicon appears on the page here in a lengthy quoted passage.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-shunned-house
  title: "The Shunned House"
  authorIds: [hp-lovecraft]
  published: 1937
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A Providence house with an unaccountable history of tenants' deaths is
    finally investigated in the cellar by the narrator and his uncle,
    armed with acid rather than superstition.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-horror-at-red-hook
  title: "The Horror at Red Hook"
  authorIds: [hp-lovecraft]
  published: 1927
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A New York police detective investigates a wealthy dilettante's ties to
    an immigrant Brooklyn neighbourhood he believes is a front for an
    ancient occult cult.
  note: Written during Lovecraft's own unhappy period living near Red Hook, and widely read since as one of his most openly xenophobic stories - its horror is explicitly staged through disgust at the immigrant community around the narrator, not incidental to the plot.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/he
  title: "He"
  authorIds: [hp-lovecraft]
  published: 1926
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A disillusioned New York transplant is shown, by a strange guide
    through the city's oldest hidden corners, both its colonial past and a
    glimpse of a much worse future. Lovecraft's own account of his
    disillusionment with New York, thinly fictionalised.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/in-the-vault
  title: "In the Vault"
  authorIds: [hp-lovecraft]
  published: 1925
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An undertaker locked overnight in a receiving tomb, short of usable
    caskets, improvises a fix that comes back on him.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/cool-air
  title: "Cool Air"
  authorIds: [hp-lovecraft]
  published: 1928
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A boarder in a New York rooming house befriends the eccentric doctor
    upstairs, who keeps his rooms unaccountably, obsessively cold, for
    reasons that become clear only when the refrigeration fails.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-call-of-cthulhu
  title: "The Call of Cthulhu"
  authorIds: [hp-lovecraft]
  published: 1928
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  featured: true
  synopsis: >
    A scholar assembles, from a dead relative's papers, three
    unconnected-seeming accounts - a sculptor's nightmares, a police raid on
    a Louisiana cult, and a sailor's report of a nightmare island risen from
    the Pacific - into evidence of an ancient, dreaming entity and the cult
    that waits for its return. Gave the whole Mythos its name, though
    Lovecraft himself never used that name for it.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/pickmans-model
  title: "Pickman's Model"
  authorIds: [hp-lovecraft]
  published: 1927
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    An artist recounts to a friend why he abruptly quit the Boston art
    scene, after a private viewing of an outcast painter's most recent,
    unbearably realistic canvases in his hidden North End studio. The
    painter is later said, in a different work, to have owned a copy of
    the Necronomicon.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-strange-high-house-in-the-mist
  title: "The Strange High House in the Mist"
  authorIds: [hp-lovecraft]
  published: 1931
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A philosopher climbs to a cliffside house above Kingsport that no one
    else will approach, to meet the entity said to receive very old guests
    there.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-silver-key
  title: "The Silver Key"
  authorIds: [hp-lovecraft]
  published: 1929
  subseries: "Randolph Carter"
  canonTier: core
  format: short-story
  synopsis: >
    Randolph Carter, now middle-aged and unable to reach his childhood
    dream-worlds any longer, finds a silver key among his late
    grandfather's effects and vanishes using it. Widely read as
    Lovecraft's own meditation on ageing out of the imaginative freedom of
    childhood.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-dream-quest-of-unknown-kadath
  title: "The Dream-Quest of Unknown Kadath"
  authorIds: [hp-lovecraft]
  published: 1943
  subseries: "Randolph Carter"
  canonTier: core
  format: novella
  synopsis: >
    Randolph Carter, who has dreamed three times of a marvellous sunset
    city and been shut out of it since, crosses the whole of the
    dream-world in search of the unknown gods of Kadath to ask them why.
    The longest sustained piece of dream-world fiction Lovecraft wrote,
    composed just after his own 1926 return to Providence. Never
    submitted for publication in his lifetime; first published in 1943.
  note: >
    Nyarlathotep appears here as a central figure; classed under this
    work's Randolph Carter subseries rather than Cthulhu Mythos for the
    reason given in the header note above. The standard critical reading
    of the novella against Lovecraft's own 1926 homecoming is held out of
    the synopsis deliberately: it names where the quest ends, and this
    work opens the wing's Randolph Carter reading order, so its synopsis
    is the first thing a reader on that path meets.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-case-of-charles-dexter-ward
  title: "The Case of Charles Dexter Ward"
  authorIds: [hp-lovecraft]
  published: 1941
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: novel
  featured: true
  synopsis: >
    A Providence doctor investigates his patient's family history after a
    young man in his care is replaced, by degrees, by his own long-dead
    warlock ancestor - resurrected using knowledge the ancestor never
    stopped pursuing from beyond the grave. Lovecraft's only novel-length
    work; he considered it a failure and never submitted it for
    publication, and it first appeared in 1941, four years after his death.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-colour-out-of-space
  title: "The Colour Out of Space"
  authorIds: [hp-lovecraft]
  published: 1927
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A meteorite lands on a New England farm and slowly poisons the land,
    the water, the livestock and the family living there with something
    that behaves like nothing on the periodic table. Lovecraft's own
    favourite among his stories, by his own stated preference.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-descendant
  title: "The Descendant"
  authorIds: [hp-lovecraft]
  published: 1938
  subseries: "Cthulhu Mythos"
  canonTier: apocrypha
  format: short-story
  synopsis: >
    An unfinished fragment about a nobleman whose obsessive reading of
    forbidden books, including the Necronomicon, has left him terrified of
    a specific word he will not say aloud. Never completed or titled by
    Lovecraft himself.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-very-old-folk
  title: "The Very Old Folk"
  authorIds: [hp-lovecraft]
  published: 1940
  subseries: null
  canonTier: apocrypha
  format: short-story
  synopsis: >
    A vivid account of a Roman garrison in the Pyrenees destroyed after
    interfering with a hill-tribe's midwinter rite, existing only as an
    excerpt from a letter Lovecraft wrote describing a dream, never
    written up as a story in its own right.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/history-of-the-necronomicon
  title: "History of the Necronomicon"
  authorIds: [hp-lovecraft]
  published: 1938
  subseries: "Cthulhu Mythos"
  canonTier: apocrypha
  format: reference
  synopsis: >
    A brief in-universe bibliographic history of the Necronomicon - its
    author, its Arabic and Greek and Latin titles and translators, the
    handful of surviving copies and their locations - that Lovecraft wrote
    for his own and his correspondents' reference rather than as a story.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-dunwich-horror
  title: "The Dunwich Horror"
  authorIds: [hp-lovecraft]
  published: 1929
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: novella
  synopsis: >
    Wilbur Whateley, born in strange circumstances to a degenerate rural
    Massachusetts family and grown to manhood inside a decade, works
    toward the rite his grandfather's forbidden books describe, while
    something kept boarded up on the family farm grows alongside him -
    until it is loose over the whole region and two Miskatonic University
    scholars go up Sentinel Hill after it. Carries the most extensive
    quoted passage from the Necronomicon of any Lovecraft story,
    including the "Yog-Sothoth is the key and guardian of the gate" text
    later quoted throughout Mythos fiction.
  note: >
    Wilbur Whateley by name and his Yog-Sothoth parentage both appear in
    publishers' own jacket copy for this story, so the synopsis states
    them. What the thing on the farm turns out to be is the story's
    closing sentence and appears in no jacket copy checked, so it is
    stated neither here nor in the startHere path that carries this work.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/ibid
  title: "Ibid"
  authorIds: [hp-lovecraft]
  published: 1938
  subseries: null
  canonTier: core
  format: short-story
  synopsis: >
    A parody scholarly biography of a fictional Roman-era figure, "Ibidus,"
    poking fun at the way footnote citations accumulate their own garbled
    legends. Not published in Lovecraft's lifetime.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-whisperer-in-darkness
  title: "The Whisperer in Darkness"
  authorIds: [hp-lovecraft]
  published: 1931
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: novella
  synopsis: >
    A Vermont recluse's letters to a Miskatonic professor, describing
    fungoid alien beings mining the hills near his farm, grow steadily more
    controlled and strange, ending in an invitation the professor should
    not have accepted.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/at-the-mountains-of-madness
  title: "At the Mountains of Madness"
  authorIds: [hp-lovecraft]
  published: 1936
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: novella
  synopsis: >
    A Miskatonic University Antarctic expedition uncovers, in mountains
    taller than the Himalayas, the remains of an intelligent civilisation
    that predates all life on Earth by hundreds of millions of years - and
    what that civilisation left sealed away in its deepest tunnels.
    Rejected by Weird Tales's editor as too long and grim; not published
    until 1936, five years after it was written.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-shadow-over-innsmouth
  title: "The Shadow over Innsmouth"
  authorIds: [hp-lovecraft]
  published: 1936
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: novella
  synopsis: >
    A young man's antiquarian tour of a decaying Massachusetts fishing
    town uncovers a decades-old pact between the town's founders and an
    undersea race, the Deep Ones, worshippers of Dagon and Cthulhu - and
    the town's continued interbreeding with them. Its horror is built,
    explicitly, out of the era's anxiety about racial interbreeding and
    "tainted" bloodlines; a documented, widely discussed reading of the
    text rather than an incidental theme.
  note: Not tagged in the Necronomicon-appearance source used above, but its Deep One, Dagon and Cthulhu content puts it inside the entity-naming half of the Cthulhu Mythos membership test described in the header.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-dreams-in-the-witch-house
  title: "The Dreams in the Witch House"
  authorIds: [hp-lovecraft]
  published: 1933
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  synopsis: >
    A mathematics student renting a notoriously haunted Arkham garret finds
    his geometry coursework and a 17th-century witch's alleged
    dimension-crossing may be the same problem, worked from two directions.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-thing-on-the-doorstep
  title: "The Thing on the Doorstep"
  authorIds: [hp-lovecraft]
  published: 1937
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  synopsis: >
    A man explains, to justify shooting his own best friend, the years-long
    campaign by his friend's occultist wife to swap bodies with him
    permanently.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-book
  title: "The Book"
  authorIds: [hp-lovecraft]
  published: 1938
  subseries: null
  canonTier: apocrypha
  format: short-story
  synopsis: >
    An unfinished fragment, a first-person account of acquiring a
    forbidden book from a strange bookseller and reading passages that
    unmoor the narrator's sense of the room around him. Possibly an
    intended prose companion to the Fungi from Yuggoth sonnet sequence's
    opening poem, also titled "The Book."
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-evil-clergyman
  title: "The Evil Clergyman"
  authorIds: [hp-lovecraft]
  published: 1939
  subseries: null
  canonTier: apocrypha
  format: short-story
  synopsis: >
    An account of a visit to a locked attic room once occupied by a
    clergyman who dabbled in the forbidden, existing only as an extract
    from one of Lovecraft's own letters rather than as fiction he wrote for
    publication.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-shadow-out-of-time
  title: "The Shadow Out of Time"
  authorIds: [hp-lovecraft]
  published: 1936
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: novella
  synopsis: >
    An economics professor who lost five years to a mysterious amnesia
    gradually recovers memories of having been possessed, during that gap,
    by a member of an ancient race of time-travelling minds - and finds
    physical proof in the Australian desert that his memories are literally
    true.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

- id: hp-lovecraft/the-haunter-of-the-dark
  title: "The Haunter of the Dark"
  authorIds: [hp-lovecraft]
  published: 1936
  subseries: "Cthulhu Mythos"
  canonTier: core
  format: short-story
  featured: true
  synopsis: >
    A young writer investigating an abandoned Providence church discovers
    an occult sect's relic, a "Shining Trapezohedron," still active inside
    - and that it is both a window and a summons. Written as a reply to
    Robert Bloch's own story "The Shambler from the Stars" (which had
    killed off a thinly veiled Lovecraft), it kills off a thinly veiled
    Bloch in turn, with his blessing. The last solo story Lovecraft
    completed before his 1937 death.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography
    - https://www.hplovecraft.com/creation/necron/stories.aspx

