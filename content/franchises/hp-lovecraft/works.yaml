# ============================================================

- id: hp-lovecraft/the-little-glass-bottle
  title: "The Little Glass Bottle"
  authorIds: [hp-lovecraft]
  published: 1959
  subseries: null
  canonTier: apocrypha
  format: short-story
  synopsis: >
    A short nautical adventure sketch, the earliest surviving fiction
    Lovecraft wrote, composed around age five or six and preserved among
    family papers. Not published until 1959.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

- id: hp-lovecraft/the-secret-cave-or-john-lees-adventure
  title: "The Secret Cave, or John Lee's Adventure"
  authorIds: [hp-lovecraft]
  published: 1959
  subseries: null
  canonTier: apocrypha
  format: short-story
  synopsis: >
    A boyhood adventure tale about two children trapped in a cave, written
    around age eight or nine. Not published until 1959.
  sources:
    - https://en.wikipedia.org/wiki/H._P._Lovecraft_bibliography

