- id: hp-lovecraft/the-mound
  title: "The Mound"
  authorIds: [hp-lovecraft]
  published: 1940
  subseries: "Cthulhu Mythos"
  canonTier: apocrypha
  format: novella
  authorRole: author
  synopsis: >
    A folklorist investigating an Oklahoma Indian mound said to be haunted
    by a headless ghost finds, instead, a 16th-century Spanish explorer's
    manuscript describing an entrance to a vast subterranean civilisation
    still connected, however distantly, to Cthulhu and the Great Old Ones.
    Bishop supplied only a brief plot synopsis about a haunted mound;
    Wikipedia's own infobox for the story credits Lovecraft as
    "ghostwriter" and Bishop with "original idea" only, and the resulting
