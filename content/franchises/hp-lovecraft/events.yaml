# FRANCHISE-SPECIFIC events only: what happened to the WORK and its
# standing, rather than to Lovecraft the person. Author-LIFE events live on
# the author entity (content/authors/hp-lovecraft.yaml), shared world and
# culture events in content/events/global.yaml. Inline references use
# [[type:id|text]] and must resolve.
#
# This wing needs these more than most. Lovecraft died in 1937 with no book
# of his own in print and 44 of the 111 works in works.yaml unpublished; the
# entries below are the publication and reception history that put those
# 1938-1959 dates on the shelf, and that carried him from the pulps to the
# Library of America. Dates and figures are cross-checked between Wikipedia's
# articles on the individual volumes, the H. P. Lovecraft Archive
# (hplovecraft.com, maintained by Donovan K. Loucks), and, for the 2015
# trophy decision, the Guardian's contemporaneous reporting rather than any
# summary of it.

- id: arkham-house-founded-1939
  organisation: artifact-spread
  illustration_type: book-object
  images_required: 1
  date: 1939
  dateRange: "1937-1939"
  title: Two friends invent a publishing house to keep him in print
  scope: industry
  reach: franchise
  impact: high
  description: >
    Within months of Lovecraft's death, August Derleth and Donald Wandrei
    set out to gather his best magazine fiction into a memorial volume, and
    could not interest a single hardcover publisher in it. So they built
    their own, named after his invented Massachusetts town: Arkham House, of
    Sauk City, Wisconsin, founded in 1939 for the express purpose of putting
    all of Lovecraft into hardcover. The Outsider and Others ran to over 550
    pages of small type behind a Virgil Finlay jacket, priced at $5.00 with
    advance orders at $3.50. It took 150 advance orders. It was printed in
    1,268 copies, sold slowly and steadily while Derleth subsidised the
    press out of his own earnings as a working writer, went out of print
    early in 1944, and has never been reprinted in that form. Every later
    stage of Lovecraft's reputation, including the scholarship, runs through
    this book.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/The_Outsider_and_Others"
    - "https://en.wikipedia.org/wiki/Arkham_House"
    - "https://www.hplovecraft.com/life/biograph.aspx"

- id: beyond-the-wall-of-sleep-omnibus-1943
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 1943
  title: The second omnibus, and why so much of this shelf is dated 1943
  scope: industry
  reach: franchise
  impact: med
  description: >
    Arkham House's second Lovecraft omnibus appeared in 1943 as the press
    found its footing, and it is the reason a cluster of works in this
    bibliography carries that year: it was the first appearance in print of
    a large amount of writing that had never been published at all,
    including [[work:hp-lovecraft/the-dream-quest-of-unknown-kadath|The
    Dream-Quest of Unknown Kadath]], finished in 1927 and left in a drawer.
    In the same year Winfield Townley Scott, literary editor of the
    Providence Journal, argued in his own paper that Lovecraft was one of
    Rhode Island's most significant writers and that mainstream criticism's
    neglect of him was regrettable: the first sustained defence from a
    newspaper of record, and two years ahead of the most famous attack.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Arkham_House"
    - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

- id: edmund-wilson-demolition-1945
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 1945-11-24
  title: The New Yorker's critic calls it bad taste and bad art
  scope: culture
  reach: franchise
  impact: high
  description: >
    On November 24, 1945, Edmund Wilson, then the most powerful literary
    critic in America, reviewed the Arkham House volumes in The New Yorker
    under the title "Tales of the Marvellous and the Ridiculous", and wrote
    that "the only real horror in most of these fictions is the horror of
    bad taste and bad art". He allowed, in the same piece, that Lovecraft
    wrote about his chosen field "with much intelligence", singling out
    [[work:hp-lovecraft/supernatural-horror-in-literature|Supernatural
    Horror in Literature]]. The essay was collected in Classics and
    Commercials (1950) and reprinted in H. P. Lovecraft: Four Decades of
    Criticism (1980), and it set the terms of the argument about Lovecraft's
    standing for the next half-century: most later cases for taking him
    seriously are in some measure answers to it. L. Sprague de Camp recorded
    that Wilson softened later, and was found to be reading Lovecraft's
    collected letters.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
    - "http://www.isfdb.org/cgi-bin/title.cgi?904108"

- id: derleth-mythos-1945
  organisation: layered-stack
  illustration_type: archive-stack
  images_required: 1
  date: 1945
  dateRange: "1939-1971"
  title: Derleth names the Cthulhu Mythos, and rebuilds it as good against evil
  scope: culture
  reach: franchise
  impact: high
  description: >
    The term "Cthulhu Mythos" is August Derleth's, not Lovecraft's. As well
    as publishing the work, Derleth systematised it: he sorted the entities
    into elemental categories, invented a class of benign "Elder Gods"
    ranged against them, and recast a body of fiction whose entire point was
    human insignificance as a struggle between good and evil. He also worked
    fragments from Lovecraft's commonplace book into new stories and
    published them under both names as "posthumous collaborations",
    beginning with the novel The Lurker at the Threshold in 1945. Later
    scholarship separates the two layers: Richard L. Tierney coined "the
    Derleth Mythos" for the second, and Robert M. Price's account of the
    Mythos treats Lovecraft's own version and Derleth's as distinct stages
    with distinct rules. This wing carries the 25 Mythos stories that are
    Lovecraft's and none of Derleth's continuations.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Cthulhu_Mythos"
    - "https://www.hplovecraft.com/life/myths.aspx"

# Sonia H. Davis and Winfield Townley Scott, "Howard Phillips Lovecraft as
# His Wife Remembers Him," The Providence Sunday Journal, August 22, 1948,
# Books section, pp. 8 and VI. Scanned in full in Brown University's digital
# repository (bdr:425853), which is where the quotations here were read.
- id: sonia-greene-memoir-providence-journal-1948
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  date: 1948-08-22
  title: His wife publishes her account of the marriage, in his own city's paper
  scope: culture
  reach: franchise
  impact: high
  description: >
    Under the byline Sonia H. Davis, "the former Mrs. H. P. Lovecraft", the
    Providence Sunday Journal of August 22, 1948 gave her memoir of the
    marriage two full pages of its books section. It remains the only
    sustained first-hand account of Lovecraft by an adult who lived with
    him, and a good deal of what is now standard about him reached print
    there first: the aunts sending $5 a week of the $15 he was owed from his
    own family's estate, his refusal to see a doctor no matter how ill he
    was, his sentence "It is more important to know what to hate than it is
    to know what to love", and her flat statement that it was his attitude
    to minorities and his wish to get away from them that drove him back to
    Providence. The paper's own books editor introduced it as "an article of
    the very first importance" in the field. It was reissued, expanded, as
    The Private Life of H. P. Lovecraft in 1985.
  spoilerAfter: null
  sources:
    - "https://repository.library.brown.edu/studio/item/bdr:425853/"
    - "https://en.wikipedia.org/wiki/Sonia_Greene"

- id: lovecraft-estate-and-the-john-hay-papers-1951
  organisation: layered-stack
  illustration_type: archive-stack
  images_required: 1
  date: 1951
  dateRange: "1937-1951"
  title: Who ended up owning the papers
  scope: industry
  reach: franchise
  impact: high
  description: >
    Lovecraft named R. H. Barlow, then barely out of his teens, his literary
    executor; the instruction never made it into the will, but his surviving
    aunt carried out his wishes anyway. Barlow deposited the bulk of the
    papers, including the vast correspondence, in Brown University's John
    Hay Library, which is why the archive exists at all, and set about
    ordering the rest. Derleth and Wandrei, older and far better
    established, claimed that Derleth was the true executor. He was not.
    Barlow gave way, and after his death in 1951 the two of them had
    complete control of the corpus. The copyright position built on that has
    not held: searches of the Library of Congress have found no evidence
    that the copyrights were renewed after their initial 28-year term, and
    Joshi's biography calls Derleth's claims "almost certainly fictitious".
    A reconstituted estate has asserted ownership since 1998 and scholars
    dispute it; in practice the work is treated as public domain, which is
    the reason the Mythos became a commons anyone could write in.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/H._P._Lovecraft"
    - "https://www.hplovecraft.com/life/myths.aspx"

- id: lovecraft-arrives-in-france-1954
  organisation: beside
  illustration_type: press-media-collage
  images_required: 1
  date: 1954
  title: France takes him seriously first
  scope: culture
  reach: franchise
  impact: med
  description: >
    In the autumn of 1954 Denoël's new science-fiction series Présence du
    futur published, as its fourth title, La Couleur tombée du ciel: four
    stories translated by Jacques Papy with an introduction by Jacques
    Bergier, a nuclear physicist who had corresponded with Lovecraft and had
    spent twenty years trying to interest a French publisher in him. It was
    the first Lovecraft collection published in France, and the French press
    handled it as a literary event rather than as imported pulp. Paris-Match
    covered it in October 1954, seventeen years after his death, and the
    framing that stuck was that Lovecraft, like Poe a century before him,
    had come to France for the recognition America would not give him. No
    American literary publisher would issue him for another half century.
  spoilerAfter: null
  sources:
    - "https://fr.wikipedia.org/wiki/La_Couleur_tomb%C3%A9e_du_ciel_(recueil)"
    - "https://www.retronews.fr/arts/echo-de-presse/2025/10/22/asimov-bradbury-lovecraft-quand-la-science-fiction-americaine-debarquait-en-france"

- id: the-shuttered-room-closes-the-archive-1959
  organisation: marginalia
  illustration_type: isolated-object
  images_required: 1
  date: 1959
  title: The stories he wrote as a boy finally reach print
  scope: industry
  reach: franchise
  impact: med
  description: >
    Arkham House's fifth Lovecraft volume, The Shuttered Room and Other
    Pieces (1959, 2,527 copies), swept up what was left of him. Among the
    memoirs and the annotated commonplace book it printed for the first time
    the stories he had written as a child:
    [[work:hp-lovecraft/the-little-glass-bottle|The Little Glass Bottle]],
    [[work:hp-lovecraft/the-secret-cave-or-john-lees-adventure|The Secret
    Cave]], [[work:hp-lovecraft/the-mystery-of-the-grave-yard|The Mystery of
    the Grave-Yard]] and
    [[work:hp-lovecraft/the-mysterious-ship|The Mysterious Ship]], written
    between about seven and fourteen years old. That is why five entries in
    this bibliography carry a first-publication date more than half a
    century after they were composed, and it closes the twenty-two-year tail
    of posthumous first publication that began with The Outsider and Others.
    The volume also carried two new stories Derleth built from Lovecraft's
    notes and billed as posthumous collaborations; Damon Knight reviewed the
    whole thing unfavourably in F&SF.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/The_Shuttered_Room_and_Other_Pieces"

- id: world-fantasy-award-howard-1975
  organisation: medallion
  illustration_type: emblem-seal
  images_required: 1
  date: 1975
  title: The field names its highest honour after him
  scope: culture
  reach: franchise
  impact: med
  description: >
    The first World Fantasy Convention was held in Providence in 1975 on the
    theme "The Lovecraft Circle", and the award it founded gave its winners
    a trophy in the shape of an elongated caricature bust of Lovecraft by
    the cartoonist Gahan Wilson, nicknamed "the Howard". Thirty-eight years
    after he died unknown outside the pulps, his head was one of the three
    most prestigious prizes in fantasy and science fiction, beside the Hugo
    and the Nebula. The first objection to it came from a friend: in 1984
    Donald Wandrei, who had co-founded Arkham House and had known Lovecraft
    personally, refused his Life Achievement award because he thought the
    bust a demeaning caricature.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/World_Fantasy_Award"

- id: library-of-america-canonises-lovecraft-2005
  organisation: beside
  illustration_type: book-object
  images_required: 1
  date: 2005-02
  dateRange: "1999-2005"
  title: Penguin Classics, then the Library of America
  scope: culture
  reach: franchise
  impact: high
  description: >
    S. T. Joshi edited three volumes of Lovecraft for Penguin Classics
    between 1999 and 2004, working from the manuscripts rather than from the
    corrupted Arkham House texts. In February 2005 the Library of America
    published Tales, twenty-two stories chosen by the novelist Peter Straub,
    putting Lovecraft on the same shelf as Melville, James and Wharton. It
    sold 25,000 copies in its first month and was reviewed in the New York
    Times Book Review and the Wall Street Journal. The response was mixed
    rather than triumphant - Newsweek's Malcolm Jones offered it as evidence
    that the Library of America was running out of writers, while the
    Buffalo News called it "one of the Library of America's happiest and
    most perverse moments" - but the volume itself reversed the standing
    judgement that Lovecraft sat outside the American canon, and scholars
    including Joshi and Alison Sperling treat it as the point where the
    question was settled.
  spoilerAfter: null
  sources:
    - "https://www.loa.org/books/223-tales/"
    - "https://en.wikipedia.org/wiki/H._P._Lovecraft"

- id: world-fantasy-award-retires-the-bust-2015
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2015-11-08
  dateRange: "2011-2017"
  title: The award takes his face off the trophy
  scope: culture
  reach: franchise
  impact: high
  description: >
    In December 2011 Nnedi Okorafor, who had won the World Fantasy Award for
    best novel that year, wrote about discovering the racist verse Lovecraft
    had written in 1912, and about her conflicted feelings that "a statuette
    of this racist man's head is one of my greatest honours as a writer";
    China Miéville, commenting on her post, said much the same. In 2014
    Daniel José Older opened a petition to change the trophy and gathered
    around 2,500 signatures, the 2014 best novel winner Sofia Samatar made
    the argument in her acceptance speech, and the board said it was "in
    discussion". At the 2015 ceremony in Saratoga Springs on November 8 the
    organisers announced that the Lovecraft bust would not be used again.
    They gave no reason. A replacement by Vincent Villafranca, a tree
    against a full moon, was announced in 2017.
    The reaction divided along the line it has divided on ever since. Older
    told the Guardian that the field could not keep lionising "a man who
    used literature as a weapon against entire races". S. T. Joshi -
    Lovecraft's biographer, and the editor of most of the corrected texts a
    reader today actually holds - returned both of his own World Fantasy
    Awards, called the decision "a craven yielding to the worst sort of
    political correctness", and urged a boycott of the convention. The
    Atlantic's Lenika Cruz argued that dropping the bust was not an
    indictment of the work, and that Lovecraft's reach, through Stephen
    King, Guillermo del Toro and Neil Gaiman, was in no danger from it.
  spoilerAfter: null
  sources:
    - "https://www.theguardian.com/books/2015/nov/09/world-fantasy-award-drops-hp-lovecraft-as-prize-image"
    - "https://www.theguardian.com/books/2014/sep/17/world-fantasy-awards-hp-lovecraft-racism-row-statuette"
    - "https://www.theguardian.com/books/2015/nov/11/hp-lovecraft-biographer-rages-against-ditching-of-author-as-fantasy-prize-emblem"
    - "https://en.wikipedia.org/wiki/World_Fantasy_Award"
