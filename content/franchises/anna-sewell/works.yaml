# Bibliography (Works). One entry: see franchise.yaml for the sourcing that
# establishes this is the whole shelf, not a first draft of one.
- id: anna-sewell/black-beauty
  title: "Black Beauty"
  authorIds: [anna-sewell]
  published: 1877
  subseries: null
  canonTier: core
  featured: true # her only book - inescapably the debut, the breakout and
                 # the last work at once; the hero treatment records that,
                 # not a padded shelf pretending to more than one hinge.
  synopsis: >
    The autobiography of a horse, narrated in his own voice from a well-loved
    colthood in an English pasture through years of service, under masters
    both kind and cruel, on the working streets of Victorian London - a plea,
    in fiction, for the humane treatment of horses.
  note: >
    Written 1871-77 while Sewell was seriously ill and largely confined to a
    sofa; she dictated the early chapters to her mother and, in a period of
    improved health in 1876-77, wrote the rest in pencil for her mother to
    transcribe. Her mother's transcription is a matter of record but not
    authorship: the book was published as "by Anna Sewell" alone, so no
    withAuthorIds/authorRole entry is made for her here. Sold outright to
    Jarrold & Sons for £40; published 24 November 1877 as "Black Beauty: His
    Grooms and Companions. The Autobiography of a Horse, Translated from the
    Original Equine, by Anna Sewell." Sewell died 25 April 1878, five months
    later.
  sources:
    - https://en.wikipedia.org/wiki/Black_Beauty
    - https://en.wikipedia.org/wiki/Anna_Sewell
    - https://www.gutenberg.org/files/271/271-h/271-h.htm
