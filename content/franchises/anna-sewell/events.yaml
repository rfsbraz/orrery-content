- id: black-beauty-bearing-rein-effect-1886
  date: 1886
  title: The bearing rein starts to disappear
  scope: culture
  reach: franchise
  impact: high
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  description: >
    Within a decade of publication, campaigners are crediting the book with
    changing real practice. Alfred Saunders, in Our Horses (1886): "Bearing-
    reins are less used every year. Miss Sewell's Black Beauty and the
    energetic appeals and well told facts of Mr. and Mrs. Flower on this
    subject have done wonders." The book's stated aim - "to induce kindness,
    sympathy, and an understanding treatment of horses" - is, within
    Sewell's own decade, measurably working.
  spoilerAfter: null
  sources:
    - https://www.ibby.org.uk/blackbeauty/
    - https://en.wikipedia.org/wiki/Black_Beauty

- id: black-beauty-angell-us-campaign-1890
  date: 1890
  title: Pirated into an American campaign
  scope: culture
  reach: franchise
  impact: high
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  description: >
    George T. Angell, founder of the American Humane Education Society,
    discovers the book, pirates it - Sewell's family never sees a cent from
    America - and turns it into a free-distribution campaign for drivers,
    stable hands and schoolchildren: "the sending of this book, Black
    Beauty, into every American home may be... an important step in the
    progress not only of the American, but the World's humanity and
    civilization." Between 1890 and 1910, Angell's society and its allies
    give away an estimated two to three million copies in the US alone, in
    translations Angell commissions into German, Italian, Spanish, Swedish
    and Japanese.
  spoilerAfter: null
  sources:
    - https://recess.ufl.edu/?p=492
    - https://www.ibby.org.uk/blackbeauty/
    - https://www.petspeopleandotheranimals.com/horsepower-rereading-black-beauty/
