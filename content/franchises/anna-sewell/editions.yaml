# Anna Sewell wrote one book. Coverage: 1/1 work has editions recorded here
# (a pre-ISBN first edition, a current English reading edition, a current
# pt-PT edition).
#
# Sources: Wikipedia's Black Beauty article (whose own infobox marks its isbn
# field n/a); Wook and Bertrand product pages (Porto Editora group, read from
# their JSON-LD Book blocks, cross-checked against each other); Open Library
# edition and work records.
#
# Black Beauty is a 148-year-old public-domain classic republished by
# hundreds of imprints; most of what a market search returns is a
# self-published "annotated"/"illustrated" reprint or an abridged
# young-readers retelling under the same title, neither recorded here. Only
# editions verified as the complete, unabridged text are listed.

# --- English ---

- id: anna-sewell/black-beauty/jarrold-1877-en
  workId: anna-sewell/black-beauty
  language: en
  publisher: "Jarrold & Sons"
  year: 1877
  note: >
    The first edition, published in London on 24 November 1877 under the
    full title-page reading "Black Beauty: His Grooms and Companions. The
    Autobiography of a Horse, Translated from the Original Equine." Predates
    ISBNs entirely, so isbn13 is deliberately omitted rather than left as a
    gap.
  sources:
    - "https://en.wikipedia.org/wiki/Black_Beauty"

- id: anna-sewell/black-beauty/puffin-2008-en
  workId: anna-sewell/black-beauty
  isbn13: "9780141321035"
  language: en
  format: paperback
  publisher: Puffin
  year: 2008
  note: >
    The current standard English reading edition, in the Puffin Classics
    line, unabridged. Not to be confused with "Anna Sewell's Black Beauty:
    The Graphic Novel" (isbn13 9780142404089, Puffin Graphics, 2005, adapted
    by June Brigman and Roy Richardson) - a comic-book adaptation sharing the
    Puffin imprint and a near-identical title, and not this text.
  sources:
    - "https://openlibrary.org/isbn/9780141321035"

# --- Portuguese (pt-PT) ---

- id: anna-sewell/black-beauty/minotauro-2023-pt
  workId: anna-sewell/black-beauty
  isbn13: "9789899124615"
  language: pt-PT
  title: "Beleza Negra"
  format: paperback
  publisher: Editora Minotauro
  year: 2023
  note: >
    The current pt-PT translation (270 pages), confirmed on both Wook and
    Bertrand with an identical ISBN, publisher and date. Two earlier pt-PT
    translations exist and are not current: Publicações Europa-América
    published the same title, "Beleza Negra", in 1996, under an earlier
    incarnation of that publisher that was declared insolvent in 2019; Vega
    published it in 1997 under a different title, "O Cavalo Preto" ("The
    Black Horse").
  sources:
    - "https://www.wook.pt/livro/beleza-negra-anna-sewell/28129859"
    - "https://www.bertrand.pt/livro/beleza-negra-anna-sewell/28129859"
