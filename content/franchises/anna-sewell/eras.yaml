# Creative periods. There are none, and there cannot be.
#
# An era divides a body of work into phases. Anna Sewell published one book,
# Black Beauty, in November 1877, five months before her death in April 1878
# (https://en.wikipedia.org/wiki/Anna_Sewell). Her entire publishing life is a
# single point on the timeline, so there is nothing to divide: any span drawn
# here would either contain the whole shelf or none of it.
#
# This is a stronger absence than the usual one. Elsewhere in the catalogue an
# empty eras file records that no critic or reference work has periodised a
# career that could in principle be periodised, and a future source might. Here
# the arithmetic forecloses it, and no later discovery can change the number of
# books.
#
# The biography does divide - the ankle injury at fourteen, the chronic illness
# from 1839, the confinement from 1871 - and it is tempting to draw those as
# eras, since they are the shape of the life and they are sourced. They are not
# creative periods, and this file is not the place for them: an era renders
# full-bleed across the works timeline, so a span labelled for an illness would
# render across a shelf of one book and assert a periodisation of writing that
# the record does not contain. Those turning points live where they belong, as
# lifeEvents on content/authors/anna-sewell.yaml, and the river tells the life
# through them.
[]
