# Branding for the Anna Sewell wing (see Orrery CONCEPT §6 - the design law).
# Quaker plainness as the actual design principle, not costume: no tack-shop
# leather-brown (already the catalogue's most crowded accent family - king,
# valter-hugo-mae, mccarthy, connelly, butcher, pratchett, peixoto and
# sanderson/jordan all sit in the same warm amber-to-oxblood hue band), no
# galloping-horse or gilt imagery. The one colour idea comes straight from the
# book: its opening line puts Beauty in "a large pleasant meadow with a pond
# of clear water in it" (https://www.gutenberg.org/files/271/271-h/271-h.htm)
# - a muted meadow green, checked against every other wing's accent hue and
# sitting in the widest open gap on the wheel (christie's poison-green and
# slaughter's kudzu-green are the nearest neighbours, both a full 25-45 degrees
# away and both markedly more saturated). Held against a near-black ground
# rather than christie's ivory, so two green accents never compete on the
# reading surface at once.
preset: pasture-plain
palette:
  bg: "#11140f"       # near-black with a faint meadow-green cast, not a warm brown
  surface: "#191d15"  # a hair lifted, for cards
  ink: "#e7e2d2"      # unbleached manuscript paper - high contrast, very readable
  muted: "#948c77"     # drab grey-brown, for metadata - undyed Quaker cloth
  accent: "#5a7a4f"    # one muted meadow green, for links and markers only
displayFace: sourceSerif # the plainest of the curated serifs, for Quaker plain speech
signature: thread        # a quiet hairline; the wing has one work to string on it
art:
  emblem:
    object: >
      A stub of pencil, worn down short and resharpened many times, lying
      across an unfinished sheet of ruled foolscap where the last line of
      handwriting trails off mid-word.
    why: >
      Named directly in the record: during a period of improved health she
      wrote the book out herself in pencil for her mother to transcribe,
      after years of dictating it from a sofa. It carries the wing's real
      subject better than a bridle or a horseshoe would - a woman confined
      to one room for thirty-nine years, whose only book was made a few
      worn-down inches of pencil at a time and handed on in someone else's
      hand.
  motifs:
    - a sash window seen from a chair or sofa, grey Norfolk sky beyond it
    - a lap-desk or writing board laid across a chair arm, loose sheets
      held down against a draught
    - working harness on a peg - a bit, a blinker, a plain leather rein -
      hung, not worn, and never ornamental
    - a five-barred gate or paddock fence with a working horse grazing at
      middle distance, never close enough to be a portrait
    - a stable yard - cobbles, a mounting block, a water trough, a birch
      broom against a wall
    - a shawl over a chair back, a stick propped by a door, a hot-water
      bottle - the sickroom rendered as its objects
    - a manuscript page in two hands, one script corrected or continued in
      the other
  atmosphere: >
    Plain and overcast, not picturesque: a working Norfolk agricultural
    county under low grey coastal sky, closer to a farm ledger than a
    landscape painting. Quaker restraint governs every room - undyed wool,
    bare scrubbed wood, no chintz, no gilt, nothing chosen to be looked at.
    The book this wing illustrates was written for grooms and coachmen, not
    for children, and the wing should feel like it too: patient, exact and
    morally serious rather than tender. Where the subject is illness or
    loss, the register is endurance observed at close range, never pathos.
  lineCharacter: >
    Soft graphite pencil, built by repeated parallel hatching rather than a
    single confident contour - pressure does the work ink would do
    elsewhere, so a line can run from barely-there to graphite-dark within
    one stroke. Leave the ghost of a revised or half-erased line faintly
    visible beneath the one that was kept, never inked over: the mark of a
    manuscript that was corrected, not a fair copy.
  backgroundTexture: >
    Plain unbleached foolscap or manuscript-book paper, faint horizontal
    ruling just visible as if from a copybook, no decorative wash and no
    laid-paper fibre showily on display.
  accentUse: >
    Muted meadow green on exactly one element per image, never as a fill: a
    strip of pasture grass beyond a fence rail or window, a single hedge
    line, one leaf pressed flat on a page.
  avoid:
    - greeting-card pony illustration - soulful eyes, a mane lit like a
      shampoo advert, a rainbow or sunset backdrop
    - hunting-pink and show-ring glamour - ribbons, rosettes, plaited
      manes, gleaming polished tack
    - the bearing rein or any cruelty to an animal shown in the act - the
      book itself withholds the graphic moment and shows only its
      aftermath, and the wing follows it
    - a sentimentalized sickbed - a beatific invalid, visible tears, a
      deathbed vigil staged for effect
    - thatched-cottage chocolate-box England - hollyhocks, picket fences,
      bunting
    - tack-shop leather-brown ornament or brass buckle detailing, already
      the catalogue's most crowded accent register (see note above)
notes: >
  Restraint as the point rather than a placeholder: a near-black paddock-at-
  dusk ground, unbleached-paper ink, and a single muted meadow green drawn
  from the book's own first page. No leather, no brass buckle, no ornament -
  the plainest serif in the set carries the single work.
