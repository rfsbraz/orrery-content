# Branding for the J. K. Rowling wing (see Orrery CONCEPT §6 - the design
# law). Deliberately not a "magical" costume: no wand-sparkle purple, no
# house-colour red-and-gold or green-and-silver, no gilt lettering - the
# catalogue's rule against genre costume applies here as much as it does to
# any fantasy wing, and Harry Potter's own branding is already the most
# over-used visual shorthand in the genre. The idea instead comes from her
# own account of how these books actually got made: a story that arrived
# whole on a delayed train with no pen to hand, then years written by hand in
# Edinburgh cafe windows while broke and grieving, before any of it was
# anyone's idea of magic. Ink, paper, rain on glass - the manuscript, not the
# marketing.
#
# Checked against every other wing's accent hue before picking: the
# near-black backgrounds already in use run warm brown (king, valter-hugo-mae, mccarthy, connelly),
# violet-indigo (jim-butcher, robert-jordan), blue-grey (joao-tordo),
# magenta-black (john-shirley), peaty green (tana-french), olive-green
# (karin-slaughter) and true neutral asphalt (lee-child). A cool, slightly
# damp slate-grey with the faintest ink-blue cast sits apart from all of
# them - closer to lee-child's true neutral than to any hue family, but
# pushed just far enough toward cold blue-grey stone (Edinburgh tenement
# sandstone under rain, not a studio neutral) to read as its own thing next
# to his. The accent is a muted brick/postbox red: distinct from the two
# existing warm oranges (mccarthy's ember c1662c, connelly's copper b8622c,
# both hue ~20-25°) and from the two existing magenta-reds (lee-child's
# flare-red c62f57, john-shirley's riso-magenta e0227d, both hue ~330-340°)
# by sitting at true red, hue ~5°, roughly equidistant from both clusters -
# aged and desaturated rather than a bright "Gryffindor" red, closer to a
# post box or a wax seal than a house scarf.
preset: manuscript-ink
palette:
  bg: "#111316"        # near-black, cool damp slate-grey with a faint ink-blue
                        # cast - wet stone, not a warm paper-in-lamplight brown
  surface: "#1a1d21"    # a hair lifted, for cards
  ink: "#e9e4d7"        # unbleached manuscript paper - high contrast, warm
                        # against the cool ground
  muted: "#8f8a80"      # drab grey-brown, for metadata - faded biro, not gilt
  accent: "#a1392b"     # one aged brick/postbox red, for links and markers
                        # only - never the bright house-scarf red this genre
                        # defaults to
displayFace: fraunces   # from the app's implemented set (fraunces | spectral |
                        # sourceSerif); the most characterful of the three,
                        # fitting a body of work that ranges from a children's
                        # fairy tale to hardboiled crime under a pen name -
                        # already carrying stephen-king, cormac-mccarthy,
                        # john-shirley and tana-french, but the plainer
                        # sourceSerif undersells the range and spectral's
                        # scholarly calm undersells the warmth
signature: thread       # a quiet hairline the works are strung along. Not
                        # `beam` (no single connecting artifact runs through
                        # Harry Potter, Fantastic Beasts, Cormoran Strike and
                        # The Casual Vacancy the way the Dark Tower runs
                        # through Stephen King) and not `none` (this is not a
                        # set of walled-off unrelated series either - one
                        # writing life runs underneath all of it, worth a
                        # quiet line rather than no signature at all)
notes: >
  Ink and paper instead of wand-sparkle: a cool damp-slate near-black (wet
  Edinburgh stone, not lamplit brown), unbleached manuscript-paper ink, and a
  single aged postbox red rather than any house colour. The most
  characterful of the three curated serifs carries a shelf that runs from a
  children's fairy tale to hardboiled crime under a pseudonym, strung on a
  quiet thread rather than one bold signature line, because no single object
  connects all of it the way a recurring artifact does elsewhere - only the
  one writing life underneath.
art:
  emblem:
    object: >
      A spiral-bound exercise book lying open on a small cafe table, its
      pages filled edge to edge with cramped handwriting in blue biro, a
      cooling cup pushed to one side and the edge of a pram just visible at
      the frame's border.
    why: >
      Named directly in the record: Rowling wrote much of the first book
      longhand in Edinburgh cafes (the Elephant House among them) with her
      infant daughter asleep beside her in a pram, on days she could afford
      neither heat at home nor much else. It carries the wing's real
      throughline better than any wand or crest would - not the finished
      magic, but the unglamorous, handwritten labor of making it, across a
      shelf that later reaches well past Hogwarts entirely.
  motifs:
    - a rain-streaked cafe window with a single occupied table, seen from
      outside
    - a train compartment window at dusk, condensation and a moving
      landscape blurred beyond it
    - a biro or fountain pen laid across a half-filled page, ink still wet
      on the last line
    - a stack of exercise books and loose foolscap sheets tied with string
    - a red pillar postbox on a wet grey street, the one warm note in a cold
      frame
    - a tenement stairwell or sandstone close, worn stone steps, Edinburgh
      rather than anywhere generic
    - a typewriter or early word processor beside a stack of rejection
      letters, envelopes half-visible
  atmosphere: >
    Damp, grey, working Edinburgh and Manchester rather than a lit fantasy
    stage - overcast daylight through café glass, the ordinary texture of
    being broke, grieving and still writing anyway. Warmth exists only in
    small, human-scale points (a cup, a pram blanket, the postbox red) against
    a cold, patient ground. Never twee, never a chocolate-box "wizarding
    Britain" - this is the world the books were actually written in, not the
    world they depict.
  lineCharacter: >
    A ballpoint biro's slightly dry, faintly scratchy line, built from quick
    confident strokes rather than a studied dip-pen elegance - the hand of
    someone writing fast on a café table, not illustrating for show.
  backgroundTexture: >
    Ruled exercise-book paper, faint blue-grey lines just visible, edges soft
    with handling; never a parchment or vellum finish, which belongs to the
    books' own in-world artifacts, not to the wing's own visual voice.
  accentUse: >
    The aged postbox red on exactly one element per image, never a wash or
    fill: a single postbox, a scarf, an ink cap, a train signal light.
  avoid:
    - wands, lightning-bolt scars, house crests or house-colour palettes,
      broomsticks, owls, or any other Harry Potter iconography - the books'
      own imagery belongs to the story, not to this wing's visual system
    - castle towers or spires staged to read as Hogwarts
    - generic fantasy medieval costume (cloaks, robes, "wizard" staging) for
      any part of the shelf, including the Fantastic Beasts and Cursed Child
      material
    - any likeness of a real actor or a Warner Bros. film's specific visual
      design - that credit belongs to the films, not to this wing
    - a glamorised, well-lit "cosy author" scene - the point is the grind,
      not a postcard of inspiration
