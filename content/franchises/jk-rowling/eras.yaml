# Creative periods - the narrative spine of the aura. Inline references use
# [[type:id|text]] and must resolve.
#
# TWO ERAS, AND A DELIBERATE GAP. Between the last Harry Potter title
# (December 2008) and The Casual Vacancy (September 2012) Rowling published no
# book at all, so the uncovered years 2009-2011 hold nothing and no period had
# to be drawn to hold them.
#
# NO PUBLISHED PERIODISATION OF HER CAREER WAS FOUND, so both eras rest on the
# publishing record and on Rowling's own words instead of on criticism. Gale's
# Children's Literature Review entry presents "an overview of Rowling's career
# through 2005" and names no phases within it
# (encyclopedia.com/children/academic-and-educational-journals/rowling-j-k-1966).
# The standard descriptive bibliography, Philip W. Errington's "J.K. Rowling: A
# Bibliography 1997-2013" (Bloomsbury Academic, 2015), is exhaustive on
# editions and silent on periods; its date range is the limit of its coverage,
# not a boundary it argues for.

- id: the-harry-potter-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Harry Potter Years
  period: "1997-2008"
  themes: [boarding-school fantasy, orphanhood and inheritance, death and what outlasts it, writing under sudden fame]
  provenance: publishing
  description: >
    Every book she published in these eleven years is a Harry Potter book, all
    of them from Bloomsbury in the UK. Bloomsbury issued
    [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter and
    the Philosopher's Stone]] on 26 June 1997; the seven-novel run closes with
    [[work:jk-rowling/harry-potter-and-the-deathly-hallows|Deathly Hallows]] on
    21 July 2007, and the last Potter title of all,
    [[work:jk-rowling/the-tales-of-beedle-the-bard|The Tales of Beedle the
    Bard]], follows on 4 December 2008. Announcing her next book in 2012,
    Rowling described these as the years of "the Harry Potter series, which has
    been published so brilliantly by Bloomsbury". After Beedle the Bard she
    published nothing for more than three years.
  note: >
    A publishing fact rather than a critical judgement: the Harry Potter run,
    dated at both ends. Where the press uses the phrase "the Harry Potter
    years" it usually means the seven novels, 1997 to 2007; the extra year here
    keeps the three 2008 titles (Beedle the Bard, the handwritten charity
    prequel and the foreword to Melissa Anelli's history of the fandom) inside
    the period they belong to, all three of them Harry Potter books in
    everything but form. No published criticism divides the Potter run
    internally. The often-repeated reading that the books darken from
    [[work:jk-rowling/harry-potter-and-the-goblet-of-fire|Goblet of Fire]]
    onward is a claim about the novels' tone made in reviews and fan writing,
    not a periodisation of her career, and it does not cut this era in two.
  sources:
    - https://en.wikipedia.org/wiki/Harry_Potter_and_the_Philosopher%27s_Stone
    - https://en.wikipedia.org/wiki/Harry_Potter_and_the_Deathly_Hallows
    - https://en.wikipedia.org/wiki/The_Tales_of_Beedle_the_Bard
    - https://www.lagardere.com/en/press-release/little-brown-to-publish-j-k-rowlings-first-novel-for-adults/

- id: the-post-potter-years
  organisation: chapter-gate
  illustration_type: symbolic-still-life
  images_required: 1
  title: The Post-Potter Years
  period: "2012-present"
  themes: [fiction for adults, crime under a pen name, the wizarding world on stage and screen, fairy tales for younger readers]
  provenance: author
  description: >
    The break is Rowling's own. Announcing in February 2012 that Little, Brown
    rather than Bloomsbury would publish her next book, she called them "a
    publishing team that will be a great partner in this new phase of my
    writing life". [[work:jk-rowling/the-casual-vacancy|The Casual Vacancy]]
    arrived that September, her first novel for adults;
    [[work:jk-rowling/the-cuckoos-calling|The Cuckoo's Calling]] followed in
    2013 as the supposed debut of an unknown crime writer, Robert Galbraith,
    and the Cormoran Strike novels have run under that name ever since.
    Alongside them the wizarding world returned in forms other than the novel,
    on stage in [[work:jk-rowling/harry-potter-and-the-cursed-child|Cursed
    Child]] and on screen in the
    [[work:jk-rowling/fantastic-beasts-and-where-to-find-them-original-screenplay|Fantastic
    Beasts]] screenplays, and two standalone children's books,
    [[work:jk-rowling/the-ickabog|The Ickabog]] and
    [[work:jk-rowling/the-christmas-pig|The Christmas Pig]], came in 2020 and
    2021. The press calls the whole stretch post-Potter.
  note: >
    The boundary is the author's own wording, in the 23 February 2012
    announcement that Little, Brown would publish her next book: "this new
    phase of my writing life". The Casual Vacancy (27 September 2012) was, in
    her publisher's and the press's identical phrasing, her first publication
    since the Harry Potter series. "Post-Potter" is received press shorthand,
    used in general-interest coverage as common knowledge and without
    introduction: Time, 21 July 2014, calls the Strike series "not her first
    post-Potter release", naming The Casual Vacancy as that; Time again, 17
    June 2015, writes of "her post-Potter mystery novels". The description
    therefore attributes the phrase instead of asserting it as a critical
    term. The era has no end because the period has not ended, and no source
    divides it internally. Three candidate divisions do not fit the shelf. The
    Robert Galbraith pen name is a hard publishing fact (April 2013, unmasked
    that July) but it names a strand running through these years rather than a
    stretch of them, and an era carrying that name would file The Christmas
    Pig and the Fantastic Beasts screenplays under a crime pseudonym. The 2016
    return to the wizarding world on stage and screen runs in parallel with
    four Cormoran Strike novels published in the same years, so it cannot be
    cut out of them. And a boundary in 2019 or 2020 would rest on contested
    public argument rather than on the publishing record.
  sources:
    - https://www.lagardere.com/en/press-release/little-brown-to-publish-j-k-rowlings-first-novel-for-adults/
    - https://en.wikipedia.org/wiki/The_Casual_Vacancy
    - https://time.com/3013543/jk-rowling-cormoran-strike-novels/
    - https://time.com/3924640/jk-rowling-harry-potter-let-go/
    - https://robert-galbraith.com/about-the-author/
