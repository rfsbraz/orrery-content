# Editions of J. K. Rowling: 57 editions over 26 of 37 works (English UK/US
# originals plus pt-PT translations, where they exist).
#
# COVERAGE
#   en/en-US  32 editions over 26 works. One UK edition (Bloomsbury/Little, Brown/Hachette
#             Children's, current print) per work, except: Philosopher's/
#             Sorcerer's Stone (UK + the US title variant, see below), the
#             three Fantastic Beasts screenplays and Harry Potter and the
#             Cursed Child (UK + US, both genuinely separate objects a reader
#             might buy, kept as two `en` rows since the text and title do not
#             differ - see SCHEMA's "more than one edition per work" rule).
#   pt-PT     25 editions across 25 of 37 works, one per work, all Editorial Presença, the
#             house that holds Rowling's (and Robert Galbraith's) Portuguese
#             rights almost in full. See "THE PORTUGUESE MARKET" below.
#   Not one ISBN below was accepted from a single source: every entry is
#   corroborated by at least two of {the publisher's own product page,
#   OpenLibrary's per-ISBN record, Wikipedia's infobox, a Portuguese retailer
#   record (Wook/Bertrand/Presença)}, and every check digit was recomputed by
#   hand, not copied.
#
# SOURCING METHOD. scripts/metadata/lookup.py jk-rowling --markets en,pt swept
# ~460 candidate rows in one call. Every row used below was then opened
# individually at its publisher or OpenLibrary source before being trusted -
# lookup.py finds candidates, it does not verify which market or which of two
# same-titled books an ISBN belongs to, and this wing needed exactly that
# judgement twice (see the two Fantastic Beasts collisions below). A live
# trap the sweep surfaced and did NOT get used: several "pt"-tagged rows
# (Pottermore Publishing ebooks of "Harry Potter e a Pedra Filosofal") carry
# ISBNs prefixed 978-178, a UK ebook-agency block, not 978-972/989 - a
# Pottermore digital edition reusing its UK ISBN block regardless of the
# text's language. Real, but not confidently a "pt-PT edition" by this file's
# region-prefix standard, so none is recorded; the print Presença editions
# below already cover the market properly.
#
# THE PHILOSOPHER'S STONE / SORCERER'S STONE SPLIT. works.yaml's title is
# fixed to the original UK title, permanently. The US edition is not a
# separate work, it is a separate EDITION of the same work under a different
# title, Putnam-style (SCHEMA's own en-GB/en-US rule; see Lee Child's The
# Visitor/Running Blind and Tana French's Broken Harbour/Broken Harbor for the
# pattern this follows exactly). Below: the UK edition carries no `title`
# override since it matches the work's own title; the US edition carries
# `language: en-US` and `title: "Harry Potter and the Sorcerer's Stone"`.
# This is the ONLY US title variant in the whole 37-work bibliography - every
# other Rowling/Galbraith book keeps its UK title in the US market, checked
# individually for all 36 other works (Cursed Child and the three Fantastic
# Beasts screenplays included; none retitles).
#
# THE CURSED CHILD EDITION QUESTION. The play was published twice in a
# textually different form, not just reprinted: the "Special Rehearsal
# Edition Script" (UK 31 Jul 2016, ISBN 978-0-7515-6535-5; US 9781338099133),
# corresponding to the script used in the first preview performances, and the
# "Definitive Collector's Edition" (25 Jul 2017), incorporating the changes
# made to the play after those previews and after official opening
# (en.wikipedia.org/wiki/Harry_Potter_and_the_Cursed_Child infobox and
# "Script publication" section, read directly). The two below are the
# DEFINITIVE text, per this skill's "record the complete/accurate text, not
# whichever is easiest to find" rule and its "most recent in-print edition"
# default: both are titled "...The Official Playscript of the Original West
# End Production" on the jacket (not "Special Rehearsal Edition Script"),
# both remain the current print (the UK one confirmed live on
# littlebrown.co.uk, on-sale reprint 6 Oct 2022; the US one confirmed as
# Scholastic's current paperback listing), and the Special Rehearsal Edition
# ISBNs above are recorded here in this comment, not as entries, because they
# are superseded and out of print. The Portuguese translation (Sept 2018)
# postdates the Definitive Edition by over a year, so it translates that text.
#
# THE TWO FANTASTIC BEASTS COLLISIONS. works.yaml already gives the 2001
# in-universe companion book and the 2016 film screenplay separate ids
# because English retailers and OpenLibrary both let the two collide under
# the bare title "Fantastic Beasts and Where to Find Them" - the screenplay's
# full jacket title carries ": The Original Screenplay" and the companion
# book's does not. That same collision reappears, unprompted, in the
# Portuguese editions: Editorial Presença publishes BOTH under variants of
# "Monstros Fantásticos e Onde Encontrá-los" and their bare OpenLibrary/Wook
# titles do not disambiguate them either. Resolved here by reading each
# edition's own product page rather than its title string:
#   - the companion book's 2018 Portuguese edition (isbn 9789722361545) sits
#     in Presença's "Biblioteca de Hogwarts" series, 128 pages, and its own
#     synopsis is explicit: "edição atualizada... com um novo prefácio do
#     próprio Newt e a revelação de seis monstros" - the international March
#     2017 re-edition with a new Scamander preface and six new creatures,
#     translated into Portuguese the following year. The matching English
#     (both UK and US) editions of that same 2017 re-edition are recorded on
#     the companion book below for the same reason.
#   - the screenplay's 2017 Portuguese edition (isbn 9789722359535) sits in
#     Presença's "HP Guiões e Argumentos" series, 304 pages, subtitled "O
#     Argumento Original", and its synopsis names it plainly: "assinala a
#     estreia de J.K. Rowling... como argumentista de filmes."
# The SAME care applies to the second collision this wing already flagged:
# the third screenplay is "The Complete Screenplay" (Steve Kloves co-write),
# never "The Original Screenplay" like the first two, in every market -
# confirmed on the English jackets (Scholastic's and Little, Brown's own
# product pages) AND on the Portuguese one, whose own synopsis reads
# "argumento completo e oficial". No entry below blurs an Original screenplay
# with the Complete one, or either screenplay with the companion book.
#
# THE PORTUGUESE MARKET. Editorial Presença is the sole Portuguese publisher
# for both the Rowling and the Galbraith bibliography; nothing here is
# Brazilian (every pt-PT ISBN below starts 978-972, the Portugal block;
# Brazilian Rocco/Nova Fronteira/Editora Rocco Ltda. editions surfaced by the
# lookup sweep - "Animais Fantásticos", "Morte súbita", "O Chamado do Cuco",
# etc, all pt-BR under different titles and translators - are excluded).
# Two live facts worth carrying forward rather than treating as coverage
# gaps:
#   - Presença relaunched the whole seven-novel Harry Potter septology in a
#     single "HP Clássicos" printing in October 2024 (sequential ISBNs
#     9789722375047-9789722375108, confirmed individually on presenca.pt),
#     superseding the older individual printings still current elsewhere in
#     this catalogue as of mid-2026. All seven entries below use this
#     current run.
#   - The Cormoran Strike run currently stands at 7 of 8 published novels in
#     Portuguese (Cuckoo's Calling through The Running Grave, the last as "A
#     Sepultura de Água", Feb 2025); The Hallmarked Man (English Sept 2025)
#     has no Portuguese edition yet as of mid-2026 - a market fact, not a
#     research gap, so it carries an English edition only.
#
# NOT RECORDED, DELIBERATELY.
#   - The seven apocrypha/contributor entries (forewords to Families Just
#     Like Us, Magic, Moving Britain Forward, Harry, A History; essays in A
#     Love Letter to Europe and The Women Who Wouldn't Wheesht; the 2008
#     charity postcard story). Each is a few paragraphs inside SOMEONE ELSE'S
#     book - Melissa Anelli's, Gordon Brown's, a thirteen-author charity
#     anthology's - not an object whose ISBN a reader would look up to buy
#     "the Rowling book." A reasonable boundary call about a completionist
#     bibliography's scope, not an oversight; left out rather than
#     manufacturing seven low-value store links for other authors' books.
#   - The three Pottermore Presents ebook shorts and From the Wizarding
#     Archive (2024). All four are Kindle-single/digital-only releases;
#     searched directly (OpenLibrary, publisher, retailer) and none resolves
#     to a stable, catalogued ISBN-13 the way every other work here does -
#     Hogwarts: An Incomplete and Unreliable Guide is sold by ASIN, not ISBN,
#     on every storefront checked, and From the Wizarding Archive has no
#     OpenLibrary record at all. No entry is coined for an ASIN-only release.

