# --- Harry Potter and the Cursed Child (stage continuation, 2016) ---

- id: jk-rowling/harry-potter-and-the-cursed-child
  title: "Harry Potter and the Cursed Child"
  authorIds: [jk-rowling]
  withAuthorIds: [jack-thorne, john-tiffany]
  authorRole: co-author
  published: 2016
  subseries: "Harry Potter"
  format: play
  canonTier: core
  synopsis: >
    Nineteen years after the main series ends, Harry's younger son Albus
    struggles under the weight of his father's legacy and forms an unlikely
    friendship that pulls both boys into a dangerous attempt to rewrite the
    past.
  note: >
    Credited on the published script itself as "written by Jack Thorne, from
    an original story by Jack Thorne, J. K. Rowling and John Tiffany"
    (Wikipedia's own summary of the title-page credit, corroborated by the
    Cursed Child Wikipedia article's infobox, which separately lists Thorne
    for "script & story" against Rowling and Tiffany for "story" only).
    Rowling originated the story and is one of its three credited authors,
    but the prose of the published script was written by Thorne alone; the
    authorRole/withAuthorIds pairing here records that split rather than
    implying she wrote the produced text. Premiered in the West End on 30
    July 2016 in two parts; a one-part revised edition followed later.
    On the synopsis: a play whose protagonist is Harry's son cannot be
    described without establishing that Harry lives past the seventh novel,
    and the work's own copy on jkrowling.com establishes far more than that
    ("nineteen years after the Battle of Hogwarts", "a husband, father of
    three school-age children, and an overworked employee at the Ministry of
    Magic"). The synopsis above takes only the part the premise requires and
    drops the rest: it does not name the battle, the war's outcome, who else
    survived, or the number of children. A blurb copied from that page or from
    a retail listing puts all of it back.
  images:
    cover: "https://covers.openlibrary.org/b/id/8763851-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL17360811W"
  sources:
    - https://en.wikipedia.org/wiki/Harry_Potter_and_the_Cursed_Child
    - https://en.wikipedia.org/wiki/Jack_Thorne
    - https://en.wikipedia.org/wiki/John_Tiffany

