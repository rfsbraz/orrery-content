    already collected as the 2016 Pottermore Presents trio
    ([[work:jk-rowling/hogwarts-an-incomplete-and-unreliable-guide|Hogwarts:
    An Incomplete and Unreliable Guide]] and the two Short Stories from
    Hogwarts volumes); Volume One's 45 pieces are gathered together for the
    first time here, which is what earns this its own entry rather than
    treating the whole release as an edition of the existing trio. Author
    royalties go to the Lumos Foundation.
