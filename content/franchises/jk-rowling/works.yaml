# Bibliography (works) - IDs are STABLE and permanent (user data references
# them). Dates are year-precision (docs/SCHEMA.md). The default reading order
# (all works in publication order) is DERIVED from this file.
#
# Every title, date and credit line below is corroborated against Wikipedia's
# own "Written works" bibliography table for J. K. Rowling (fetched directly,
# giving day-precision dates for every entry) cross-checked against the
# ISFDB bibliography (isfdb.org, which resolves pseudonymous and co-written
# credits down to the individual title), rowlingindex.org (a fan-run index
# that reproduces her shorter nonfiction pieces in full, used to verify the
# exact nature of each foreword and contribution below) and, for the
# disputed or easily-conflated credits, the relevant work's own Wikipedia
# article or contemporary press coverage. 37 works: the seven-novel main
# series, three companion/supplement volumes, the stage play, the three
# Fantastic Beasts screenplays, one adult novel published under her own
# name, the eight-novel Cormoran Strike series published as Robert
# Galbraith, two standalone children's novels, one nonfiction book, three
# "Pottermore Presents" ebook shorts, one 2024 curated-writing compilation,
# and seven short contributions to other people's or multi-author books.
#
# NOT included below, on purpose rather than by oversight: three newspaper
# opinion pieces and a book review (Wikipedia's "Written works" table lists
# them separately, under "Articles" rather than "Book"), which are
# journalism rather than book-form apocrypha and outside what this
# bibliography tracks; and any of the various new forewords or expanded
# content she has written for illustrated, anniversary or house-edition
# reissues of her OWN books (for example the March 2017 Fantastic Beasts and
# Where to Find Them re-edition) - these belong to specific editions of
# already-listed works, not new entries here.
#
# SUBSERIES: "Harry Potter" for the main septology and its direct stage
# continuation (Cursed Child, "the eighth story", marketed and numbered as a
# continuation of the series). The three prose/reference companion volumes
# (Quidditch Through the Ages, Fantastic Beasts and Where to Find Them, The
# Tales of Beedle the Bard) are in-universe texts ABOUT the Wizarding World,
# not installments in the reading sequence, so their subseries is left null
# per the standing rule that a companion volume is not part of the series it
# accompanies; each work's own note carries the connection. "Fantastic
# Beasts" for the three screenplay books, a self-contained prequel trilogy.
# "Cormoran Strike" for the eight Robert Galbraith novels. "Pottermore
# Presents" for the three 2016 ebook shorts, published and marketed together
# as a numbered trio (ISFDB: isfdb.org/cgi-bin/ea.cgi?6304=).
#
# CANON TIER. Core: the seven novels, Cursed Child, the three Fantastic
# Beasts screenplays (the sole published narrative form of that trilogy, not
# a supplement to anything else), The Casual Vacancy, the eight Strike
# novels, and the two standalone children's novels (Ickabog, Christmas Pig) -
# all genuine standalone narrative works, whatever their medium. Extended:
# the three in-universe companion/reference volumes, Very Good Lives
# (nonfiction), the three Pottermore Presents ebook shorts, and From the
# Wizarding Archive (2024) - genuinely hers, off the main narrative spine.
# Apocrypha: the 2008 Harry Potter prequel (an 800-word contribution to a
# thirteen-author charity anthology) plus six more contributions of the same
# kind - a book she did not write but genuinely contributed a credited piece
# to, per docs/SCHEMA.md's own worked example for authorRole: contributor
# ("a book where the author wrote only an introduction"): forewords to
# Families Just Like Us (2000), Magic (2002) and Harry, A History (2008),
# a foreword to one chapter of Gordon Brown's Moving Britain Forward (2006),
# and essays in the multi-author collections A Love Letter to Europe (2019)
# and The Women Who Wouldn't Wheesht (2024). None is a book of her own.
#
# A CORRECTION TO THE WING'S OWN SCOPING NOTES (orrery-content#83): the issue
# that requested this wing describes "the five Fantastic Beasts films," all
# "written by Rowling herself as screenplays." Only three Fantastic Beasts
# films were ever made (a planned fifth-film arc was cut short after the
# second film's reception), and only three screenplay books were published to
# match. The third, The Secrets of Dumbledore, is also not a Rowling solo
# screenplay: Warner Bros. brought on veteran Harry Potter screenwriter Steve
# Kloves as co-writer in late 2019, and the published book is credited to
# both and titled "The Complete Screenplay," not "The Original Screenplay"
# like the first two. See that work's own note.

