  authorIds: [jk-rowling]
  authorRole: contributor
  contributionTitle: "Harry Potter prequel"
  published: 2008
  subseries: null
  canonTier: apocrypha
  synopsis: >
    An 800-word, untitled short story recounting an encounter between Sirius
    Black, James Potter and Muggle police, written years before the character
    Harry.
  note: >
    Written by hand on an A5 card for the 11 June 2008 "What's Your Story?"
    charity auction at Waterstones, one contribution among thirteen authors
    for English PEN and Dyslexia Action; hers sold for £25,000 and was
    published in the resulting "What's Your Story Postcard Collection." A
    single short-story contribution to a multi-author charity anthology, not
    a book of her own, hence the contributor role and apocrypha tier rather
    than a standalone entry on the main spine.
  sources:
    - https://en.wikipedia.org/wiki/Harry_Potter_prequel
    - https://en.wikipedia.org/wiki/J._K._Rowling_bibliography
