# --- Harry Potter companion volumes (2 charity texts + 1 supplement, 2001-2008) ---

- id: jk-rowling/quidditch-through-the-ages
  title: "Quidditch Through the Ages"
  authorIds: [jk-rowling]
  published: 2001
  subseries: null
  canonTier: extended
  publishedAs: "Kennilworthy Whisp"
  synopsis: >
    A history of the wizarding sport of Quidditch, presented as the Hogwarts
    library's own copy of the textbook Harry and his classmates study from.
  note: >
    An in-universe reference text, not a narrative installment in the main
    series; published for the charity Comic Relief alongside
    [[work:jk-rowling/fantastic-beasts-and-where-to-find-them|Fantastic
    Beasts and Where to Find Them]], with which it shares a release date and
    a fictional-author device. Over 80% of the cover price went directly to
    the charity.
  sources:
    - https://en.wikipedia.org/wiki/Quidditch_Through_the_Ages
    - https://en.wikipedia.org/wiki/J._K._Rowling_bibliography

- id: jk-rowling/fantastic-beasts-and-where-to-find-them
  title: "Fantastic Beasts and Where to Find Them"
  authorIds: [jk-rowling]
  published: 2001
  subseries: null
  canonTier: extended
  publishedAs: "Newt Scamander"
  synopsis: >
    A guide to the magical creatures of the Wizarding World, presented as
    Harry's own first-year textbook, complete with margin notes in his and
    his friends' handwriting.
  note: >
    An in-universe reference text, not a narrative installment; her name did
    not appear on the first edition's cover at all, only the fictional
    author's. Not to be confused with
    [[work:jk-rowling/fantastic-beasts-and-where-to-find-them-original-screenplay|
    the 2016 film screenplay of the same title]], a wholly different, later
    work under her own name - deliberately given a distinct id here to avoid
    conflating the two.
  sources:
    - https://en.wikipedia.org/wiki/Fantastic_Beasts_and_Where_to_Find_Them_(book)
    - https://en.wikipedia.org/wiki/J._K._Rowling_bibliography

- id: jk-rowling/the-tales-of-beedle-the-bard
  title: "The Tales of Beedle the Bard"
  authorIds: [jk-rowling]
  published: 2008
  subseries: null
  canonTier: extended
  synopsis: >
    Five fairy tales from the wizarding tradition, presented in translation
    from the original runes with a commentary by Albus Dumbledore, one of
    which is central to the final Harry Potter novel.
  note: >
    An in-universe storybook, not a narrative installment in the main
    series. A single handwritten deluxe copy sold at auction in 2007 for
    £1.95 million, a record for a contemporary literary work; Rowling
    donated the proceeds to the children's charity Lumos. One of its five
    tales also plays a well-known role late in the main series; which one,
    and how, is left unstated here to stay safe for a reader who has not
    reached that point yet.
  sources:
    - https://en.wikipedia.org/wiki/The_Tales_of_Beedle_the_Bard
    - https://en.wikipedia.org/wiki/J._K._Rowling_bibliography

# --- Harry Potter and the Cursed Child (stage continuation, 2016) ---

- id: jk-rowling/harry-potter-and-the-cursed-child
  title: "Harry Potter and the Cursed Child"
  authorIds: [jk-rowling]
  withAuthorIds: [jack-thorne, john-tiffany]
  authorRole: co-author
  published: 2016
  subseries: "Harry Potter"
  format: play
  canonTier: core
  synopsis: >
    Nineteen years after the main series ends, Harry's younger son Albus
    struggles under the weight of his father's legacy and forms an unlikely
    friendship that pulls both boys into a dangerous attempt to rewrite the
    past.
  note: >
    Credited on the published script itself as "written by Jack Thorne, from
    an original story by Jack Thorne, J. K. Rowling and John Tiffany"
    (Wikipedia's own summary of the title-page credit, corroborated by the
    Cursed Child Wikipedia article's infobox, which separately lists Thorne
    for "script & story" against Rowling and Tiffany for "story" only).
    Rowling originated the story and is one of its three credited authors,
    but the prose of the published script was written by Thorne alone; the
    authorRole/withAuthorIds pairing here records that split rather than
    implying she wrote the produced text. Premiered in the West End on 30
    July 2016 in two parts; a one-part revised edition followed later.
  sources:
    - https://en.wikipedia.org/wiki/Harry_Potter_and_the_Cursed_Child
    - https://en.wikipedia.org/wiki/Jack_Thorne
    - https://en.wikipedia.org/wiki/John_Tiffany

# --- Fantastic Beasts screenplays (self-contained prequel trilogy, 2016-2022) ---

- id: jk-rowling/fantastic-beasts-and-where-to-find-them-original-screenplay
  title: "Fantastic Beasts and Where to Find Them: The Original Screenplay"
  authorIds: [jk-rowling]
  published: 2016
  subseries: "Fantastic Beasts"
  format: screenplay
  canonTier: core
  synopsis: >
    Seventy years before Harry's story begins, a magizoologist's case of
    escaped creatures throws New York's wizarding community into crisis at
    the worst possible political moment.
  note: >
    Rowling's screenwriting debut and sole credit; the published book is the
    shooting script rather than a novelisation. First of the three-film
    Fantastic Beasts series.
  sources:
    - https://en.wikipedia.org/wiki/Fantastic_Beasts_and_Where_to_Find_Them_(film)
    - https://www.isfdb.org/cgi-bin/ea.cgi?6304=

- id: jk-rowling/fantastic-beasts-the-crimes-of-grindelwald
  title: "Fantastic Beasts: The Crimes of Grindelwald - The Original Screenplay"
  authorIds: [jk-rowling]
  published: 2018
  subseries: "Fantastic Beasts"
  format: screenplay
  canonTier: core
  synopsis: >
    The escaped dark wizard Gellert Grindelwald gathers followers across
    Europe with a message that finds real support, while old loyalties among
    the people hunting him start to fracture.
  note: >
    Rowling's sole screenplay credit, as with the first film; Steve Kloves
    joins as co-writer only for the third and final film (see that work's
    note).
  sources:
    - https://en.wikipedia.org/wiki/Fantastic_Beasts:_The_Crimes_of_Grindelwald
    - https://www.isfdb.org/cgi-bin/ea.cgi?6304=

- id: jk-rowling/fantastic-beasts-the-secrets-of-dumbledore
  title: "Fantastic Beasts: The Secrets of Dumbledore - The Complete Screenplay"
  authorIds: [jk-rowling]
  withAuthorIds: [steve-kloves]
  authorRole: co-author
  published: 2022
  subseries: "Fantastic Beasts"
  format: screenplay
  canonTier: core
  synopsis: >
    As Grindelwald's political movement gains ground, Dumbledore assembles a
    small team, including his old ally Newt Scamander, to stop him, bound by
    a blood pact that keeps Dumbledore himself from acting directly.
  note: >
    A genuine co-write, not a Rowling solo screenplay like the first two:
    Warner Bros. brought on Steve Kloves, screenwriter of all but one of the
    main Harry Potter films, as co-writer in late 2019 (Wikipedia's
    production-history section, citing contemporary Warner Bros. press
    coverage), and the film's own credited "Screenplay by" line names both.
    The published book is titled "The Complete Screenplay," not "The
    Original Screenplay" like the first two - itself a signal of the
    different authorship, corroborated by the ISFDB bibliography record and
    matching retail listings (Amazon, Barnes & Noble, Pottermore Publishing).
    Also the only film of the three with a producing credit for Rowling
    alongside her writing one. The originally announced five-film arc was
    cut to three after this installment; no fourth or fifth screenplay was
    ever written or published.
  sources:
    - https://en.wikipedia.org/wiki/Fantastic_Beasts:_The_Secrets_of_Dumbledore
    - https://www.isfdb.org/cgi-bin/ea.cgi?6304=
    - https://en.wikipedia.org/wiki/Steve_Kloves

