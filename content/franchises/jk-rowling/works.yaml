- id: jk-rowling/fantastic-beasts-the-secrets-of-dumbledore
  title: "Fantastic Beasts: The Secrets of Dumbledore - The Complete Screenplay"
  authorIds: [jk-rowling]
  withAuthorIds: [steve-kloves]
  authorRole: co-author
  published: 2022
  subseries: "Fantastic Beasts"
  format: screenplay
  canonTier: core
  synopsis: >
    Grindelwald's political movement gathers ground across Europe, and
    Dumbledore, unable to stop him alone, entrusts the magizoologist Newt
    Scamander with leading a small team on a mission to thwart him.
  note: >
    The synopsis above follows the official Warner Bros. copy for this film
    ("Unable to stop him alone, he entrusts Magizoologist Newt Scamander...")
    and stops where it stops. WHY Dumbledore cannot act against Grindelwald
    himself is the closing reveal of the previous screenplay, is not in this
    film's official copy, and is stated nowhere here; longer plot summaries
    and most retail listings give it away in their first sentence.
    A genuine co-write, not a Rowling solo screenplay like the first two:
    Warner Bros. brought on Steve Kloves, screenwriter of all but one of the
    main Harry Potter films, as co-writer in late 2019 (Wikipedia's
    production-history section, citing contemporary Warner Bros. press
    coverage), and the film's own credited "Screenplay by" line names both.
    The published book is titled "The Complete Screenplay," not "The
    Original Screenplay" like the first two - itself a signal of the
    different authorship, corroborated by the ISFDB bibliography record and
    matching retail listings (Amazon, Barnes & Noble, Pottermore Publishing).
    Also the only film of the three with a producing credit for Rowling
    alongside her writing one. The originally announced five-film arc was
    cut to three after this installment; no fourth or fifth screenplay was
    ever written or published.
  # No cover: Open Library's only record for this screenplay book
  # (OL45774132W, ISBN 9781789391367) carries a single edition with no
  # cover image uploaded, and no other publisher press page grants
  # editorial-use terms for its jacket.
  sources:
    - https://en.wikipedia.org/wiki/Fantastic_Beasts:_The_Secrets_of_Dumbledore
    - https://www.isfdb.org/cgi-bin/ea.cgi?6304=
    - https://en.wikipedia.org/wiki/Steve_Kloves

