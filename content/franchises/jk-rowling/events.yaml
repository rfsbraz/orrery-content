# Franchise-level events: things that happened to the BOOKS and their
# reception, as distinct from Rowling's own life (content/authors/jk-rowling.
# yaml). scope/reach follow docs/SCHEMA.md. Each entry also carries its
# layout grammar (organisation, illustration_type, images_required); none of
# the four is staged from the fiction, since all four are industry, legal or
# publication-status facts rather than a character's own visual life
# (theme.yaml's avoid list states the same rule).

- id: philosophers-stone-quiet-launch-1997
  date: 1997-06-26
  title: A 5,650-copy first printing
  scope: industry
  reach: franchise
  impact: med
  organisation: floating-object
  illustration_type: book-object
  images_required: 1
  description: >
    Bloomsbury publishes
    [[work:jk-rowling/harry-potter-and-the-philosophers-stone|Harry Potter
    and the Philosopher's Stone]] with a first printing of 5,650 copies -
    only 500 of them hardback, of which 300 went straight to libraries - a
    limited run Sotheby's calls "standard for a first novel," with publisher
    Barry Cunningham hoping booksellers would read it and recommend it on.
    The scale of the phenomenon the book would anchor was not visible at the
    launch; a surviving first-edition hardback now sells at auction for tens
    of thousands of dollars.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Harry_Potter_and_the_Philosopher%27s_Stone
    - https://www.sothebys.com/en/buy/auction/2021/fine-books-and-manuscripts-2/rowling-j-k-one-of-only-500-copies-of-the-first

- id: stouffer-lawsuit-thrown-out-2002
  date: 2002-09-17
  title: A rival authorship claim collapses under forged evidence
  scope: industry
  reach: franchise
  impact: med
  organisation: artifact-spread
  illustration_type: document-facsimile
  images_required: 1
  description: >
    Children's author Nancy Stouffer had counterclaimed that Harry Potter
    infringed her own "Larry Potter" and "Muggles" material from the 1980s.
    Ruling on Rowling, Scholastic and Warner Bros.' motion for sanctions,
    Judge Allen G. Schwartz of the Southern District of New York finds "by
    clear and convincing evidence" that Stouffer submitted at least seven
    pieces of falsified evidence, including a "printer's proof" whose "Larry
    Potter" reference was set in a font that did not exist until 1993 - years
    after Stouffer claimed the document was made. The court dismisses her
    claims, fines her $50,000, and orders her to cover Rowling's legal costs.
  spoilerAfter: null
  sources:
    - https://www.eyrie.org/~robotech/stouffer.htm
    - https://www.rcfp.org/claim-against-potter-author-doesnt-fly-federal-judge/

- id: deathly-hallows-finale-2007
  date: 2007-07-21
  title: The series ends at 8.3 million copies in a day
  scope: culture
  reach: franchise
  impact: high
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  description: >
    [[work:jk-rowling/harry-potter-and-the-deathly-hallows|Harry Potter and
    the Deathly Hallows]] goes on sale at 00:01 local time worldwide,
    closing the seven-book series ten years after it began. Scholastic
    reports 8.3 million US copies sold in the first 24 hours - a record its
    president compared to "the Beatles' first visit to the U.S." - against a
    first printing of 12 million; the UK sells a further 2.65 million copies
    in the same window. No Harry Potter novel follows it.
  spoilerAfter: null
  sources:
    - https://www.scholastic.com/newsroom/all-news/press-release/scholastic-and-harry-potter-and-the-deathly-hallows-make-publish.html
    - https://moneyweek.com/401698/21-july-2007-the-final-harry-potter-book-hits-the-shelves

- id: cursed-child-premiere-2016
  date: 2016-07-30
  title: The eighth story opens in the West End
  scope: culture
  reach: franchise
  impact: med
  organisation: floating-object
  illustration_type: isolated-object
  images_required: 1
  description: >
    [[work:jk-rowling/harry-potter-and-the-cursed-child|Harry Potter and the
    Cursed Child]] premieres at the Palace Theatre, London, marketed as "the
    eighth story" continuing directly from
    [[work:jk-rowling/harry-potter-and-the-deathly-hallows|Deathly Hallows]].
    At the premiere Rowling confirms she will not write another Harry Potter
    novel - the first time she rules it out in her own words rather than by
    the series simply having ended. The published script sells more than two
    million print copies in North America in its first two days - well below
    Deathly Hallows' 8.3 million in a single day, but, per Scholastic, still
    among the fastest-selling works in publishing history.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Harry_Potter_and_the_Cursed_Child
    - https://www.cbsnews.com/news/potter-script-sells-more-than-2-million-copies-in-2-days
