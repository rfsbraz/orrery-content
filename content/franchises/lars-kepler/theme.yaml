# Branding for the Lars Kepler wing (see Orrery CONCEPT §6 - the design law,
# and docs/SCHEMA.md#themeyaml). Checked hue-by-hue against every existing
# wing's accent before choosing (34 wings at the time of this scaffold).
#
# The obvious first reach for a Swedish crime series is "Nordic noir cold",
# but Jo Nesbø already owns that specific register (vinterlys: pale, cold
# blue-white Norwegian daylight, a saturated cobalt accent at hue ~228). A
# second, equally obvious reach - "clinical, institutional" - is Chuck
# Palahniuk's clinical-minimal (a pale sage-teal at hue ~164). Neither reads
# true to what actually distinguishes this shelf: four of its eleven Joona
# Linna titles name a state between waking and sleep - Hypnotisören (the
# hypnotist), Sandmannen (the sandman), Sömngångaren (the sleepwalker),
# Spegelmannen (the mirror man) - and the series' recurring hypnotist-
# psychiatrist Erik Maria Bark, specialised in "psycho-traumatology and
# disaster psychiatry" per his own character page, is not incidental to that
# pattern. That is the actual, sourced, title-level throughline, not a
# genre-costume guess.
#
# Plotted against every existing accent (see scripts/fetch.py research for
# the full hue table), the widest genuinely open lane on the wheel runs
# between Tana French's cold blue-violet (bog-noir, hue ~272) and Gillian
# Flynn's warm pink-plum (heartland-noir, "bruise-plum", hue ~318) - a ~46
# degree gap. This wing's accent sits at its centre, hue ~295: a muted,
# restrained violet, cooler than Flynn's warm plum and less blue than
# French's heather, read as the half-light of a room in the seconds after a
# hypnotist's watch stops swinging - not injury or a bruise (Flynn's own
# named register), but the specific violet dusk of the hypnagogic state the
# titles keep returning to.
preset: hypnagogic-noir
palette:
  bg: "#150e16"       # near-black with a faint violet cast - the same dusk
                      # colour as the accent, almost drained of it; distinct
                      # from Edgar Allan Poe's warmer brown-violet gothic
                      # black and John Shirley's far more saturated magenta-
                      # black (xerox-punk)
  surface: "#201622"  # a shade lifted, for cards
  ink: "#eae5eb"      # pale, cool near-white - high contrast, very readable
  muted: "#a08fa3"    # dusty violet-grey, for metadata
  accent: "#974d9d"   # one muted violet, used sparingly - never a wash or a
                      # fill; see the hue note above
displayFace: sourceSerif # the plain, commercial workhorse serif this
                          # catalogue's other bestselling crime series
                          # (Coben, Flynn, Slaughter, Bryndza, Nesbø,
                          # Connelly, Gwynne) all reach for - Lars Kepler is
                          # exactly that kind of book, a translated-into-40-
                          # languages commercial phenomenon, not a self-aware
                          # literary outlier the way A. J. Finn's wing earns
                          # spectral instead
signature: thread        # a quiet hairline stringing the works together -
                          # one continuous case file running 2009-2026, with
                          # Joona Linna, Saga Bauer and the shadow of Jurek
                          # Walter carried across nearly every title
notes: >
  A violet dusk rather than Nordic cold or hospital clinical: near-black with
  a faint violet cast, pale cool ink, and one muted violet accent used once
  per surface, never as a fill. No swinging-pendant spiral, no genre-thriller
  streetlamp or blood-red - the restraint is the point, and the theme.art
  block (a later pass) is where the actual visual language gets written out
  in full.

# ART. The two wings flanking this one's accent hue set the bar for
# separation: Tana French's instrument is a chair under a bulb, drawn once
# and retraced a second time off true (an unreliable narrator's testimony
# doubling back on itself); Gillian Flynn's is a single copy-desk rule (a
# clean edit mark from her journalism years). This wing's instrument is
# neither an interrogation nor a redaction but an induction - not the
# swinging pendant ruled out above, which belongs to no author in
# particular, but the literal folk image behind this shelf's own title:
# Sandmannen takes its name from the Scandinavian sandman, who crosses a
# sleeper from waking into dream by casting sand in their eyes. Drawn as
# that threshold rather than as a figure or a folktale illustration, the
# same crossing reads across the other three hypnagogic titles
# (Hypnotisören, Sömngångaren, Spegelmannen) and the hypnotist-psychiatrist
# Erik Maria Bark, whose waking-hypnosis method walks a witness across
# exactly this same border under questioning - and extends past the
# hypnagogic four to a doctor's forensic-psychiatric ward (Medusa), a
# medium's testimony (Eldvittnet) and a soldier's forty seconds clinically
# dead (Playground): a shelf that keeps returning to evidence recovered
# from somewhere a mind cannot reach on its own. A tape recorder or
# cassette deck was the other candidate for this same induction-session
# idea - already the register of two other wings on this catalogue (John
# Shirley's cassette deck, Jose Rodrigues dos Santos's open-reel recorder)
# - so the crossing is drawn through the threshold itself, never through
# recording equipment.
art:
  emblem:
    object: >
      A fine drift of pale sand scattered across a windowsill, a raised
      door-sill or the foot of a bed, caught in one low, close band of
      light while the rest of the room stays in shadow. No footprint, no
      hand and no figure enters or crosses the frame - what crossed the
      threshold is never shown, only the trace it left.
    why: >
      Sandmannen (2012) takes its title from the Scandinavian sandman, the
      folk figure who sends a sleeper into dream by casting sand in their
      eyes - the literal image behind a title this shelf would otherwise
      have to draw only as metaphor. The same threshold-crossing is the
      throughline named in this file's own header: four of eleven Joona
      Linna titles name a state between waking and sleep, and the series'
      recurring hypnotist-psychiatrist Erik Maria Bark walks a witness
      across that same border under questioning, deliberately, book after
      book. One drift of sand at one sill carries both the folklore the
      title is drawn from and the procedure the series keeps returning to.
  motifs:
    - a fine drift of sand at a threshold - a sill, a doorway, the foot of
      a bed - lit in one close band, the rest of the room dark
    - a forensic-psychiatric ward corridor at night, one door standing
      ajar, the ward beyond it darker still
    - the Stockholm archipelago at night, black water closing over
      whatever a boat left on its surface
    - a high bridge over black water in winter, its far rail lost in the
      dark before it reaches the other side
    - a single caravan lit among winter-shuttered ones, alone in an
      otherwise dark, deserted campsite
    - a fixed, slightly grainy surveillance frame aimed at a lit window
      from outside, showing only the sill and the curtain and nothing past
      them
    - a plain postcard or envelope just visible through a letterbox or
      lying address-down on a doormat
  atmosphere: >
    Not the flat, cold daylight of Nordic-noir - a register this catalogue
    already gives to another wing - and not a hospital's clinical
    brightness either: a close, underlit half-light, the specific violet
    dusk of a room in the seconds after a witness under hypnosis is walked
    back to the surface, or a mind crossing from sleep into waking and not
    yet certain which side it's on. Interiors keep one weak source and
    never go fully black; exteriors hold the same in-between hour
    regardless of season, archipelago water gone the colour of the sky,
    a bridge or a shuttered campsite lit as if it were always dusk there.
    The dread is procedural and quiet - a fact recovered from somewhere a
    mind cannot reach on its own - never gothic shock and never forensic
    glare.
  lineCharacter: >
    A continuous dip-pen contour, drawn to hold a whole object in one
    unbroken stroke, but never fully steady: pressure drops toward nothing
    and regathers two or three times within a single line, at no fixed
    point in the frame and never the same place twice, the way a hand
    loses and recovers its grip somewhere between waking and sleep. The
    gaps this leaves are small and never a true break - the line always
    resumes on the far side rather than restarting, so the shape stays
    legible, only faintly unfinished. One line, drawn once: never a wash,
    never a scratched or retraced second pass.
  backgroundTexture: >
    A dense, matte charcoal-violet stock, fine-grained and free of foxing
    or fibre-bloom, dark enough to read as near-black at a glance but
    never flat - held close, a faint warmth surfaces in the grain exactly
    where the paper sits between the eye and whatever is lighting the
    scene, the way a dark room stops reading as pure black only once the
    eye has had a few seconds to adjust to it.
  accentUse: >
    Muted violet on exactly one element per image, never as a fill: the
    drift of sand itself where it catches the light, a single lit window
    or caravan in an otherwise dark field, one postcard or envelope corner,
    or the narrow lit gap at the edge of a ward door left ajar.
  avoid:
    - a swinging pocket watch, pendant or spiral - the obvious hypnosis
      cliche, and the one this wing is built to replace with the sand
      threshold above
    - a tape recorder, cassette deck or dictaphone drawn as the
      hypnosis-session apparatus - already the register of two other wings
      on this shelf; this wing's induction is the threshold, never the
      machine
    - Nordic-noir cold - pale blue-white daylight, snow, or a lone figure
      under a streetlamp - a register this catalogue already gives to
      another wing entirely
    - hospital-clinical brightness - fluorescent tubes, sterile white,
      antiseptic green - the ward here is dark and underlit, not clinical
    - graphic gore, a body shown in full, or crime-scene tape and chalk
      outlines - procedural shorthand belonging to no author in particular
    - a swirling hypnotic spiral or concentric-eye graphic used as a
      standalone graphic device, wherever it appears in the frame
    - the visual identity of the 2012 Hallström film or the Apple TV+
      adaptation Nocturne - their casting, title cards or colour grade
