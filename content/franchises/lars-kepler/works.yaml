- id: lars-kepler/lazarus
  title: "Lazarus"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2018
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    A dead man is found in an Oslo apartment, and what the police find in
