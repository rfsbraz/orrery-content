- id: lars-kepler/somngangaren
  title: "Sömngångaren"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2024
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    A midnight alarm reports a break-in at a winter-shuttered campsite
    outside Stockholm. The nearest patrol car answers the call and finds one
