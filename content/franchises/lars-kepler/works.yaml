  sources:
    - "https://www.albertbonniersforlag.se/bocker/208564/spegelmannen/"

- id: lars-kepler/spindeln
  title: "Spindeln"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2022
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    Three years after Saga Bauer received a postcard threatening her with a
