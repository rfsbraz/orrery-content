  sources:
    - "https://www.albertbonniersforlag.se/bocker/167288/eldvittnet/"

- id: lars-kepler/sandmannen
  title: "Sandmannen"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2012
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    A young man is found wandering a high railway bridge in Stockholm on a
    freezing winter night, suffering from Legionnaires' disease and severe
