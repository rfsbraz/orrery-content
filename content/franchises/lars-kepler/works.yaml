- id: lars-kepler/medusa
  title: "Medusa"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2026
  forthcoming: 2026-09-21
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    A doctor burns to death overnight inside Helix, a closed forensic-
    psychiatric unit; a second death on the same ward leads Saga Bauer to
    accept a covert assignment, placed as a patient among some of Sweden's
    most dangerous offenders with Joona Linna as her only contact outside.
  note: >
    Announced with a firm release date and ISBN by Albert Bonniers Förlag,
    the books' own Swedish publisher, which states directly that this is the
    eleventh Joona Linna novel.
  sources:
    - "https://www.albertbonniersforlag.se/bocker/269389/medusa/"
  # No cover: unpublished (forthcoming 2026-09-21), so no edition exists
  # yet for any catalogue to hold a jacket image for. Revisit after
  # release.

- id: lars-kepler/playground
  title: "Playground"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2015
  subseries: null
  canonTier: extended
  synopsis: >
    Lieutenant Jasmin Pascal-Anderson is shot during a deployment in Kosovo
    and clinically dead for forty seconds. Back among the living, she cannot
    stop describing a violent port city she saw in death - one she becomes
    convinced is real, and where her son is now in danger.
  note: >
    A standalone thriller, no shared characters or setting with the Joona
    Linna series found in any source checked; the original Swedish title is
    itself the English word "Playground".
  sources:
    - "https://www.albertbonniersforlag.se/bocker/194815/playground/"
    - "https://sv.wikipedia.org/wiki/Lars_Kepler"
  # No Swedish-edition cover on Open Library (its Swedish ISBN has no
  # record there). Cover is the Cargo 2015 Dutch translation - itself
  # titled plainly "Playground" with no added subtitle, unlike the 2016
  # German translation's "Playground - Leben oder Sterben" (a different,
  # separate Open Library work, OL20236225W, rejected for carrying a
  # subtitle this work's own title field does not) - ISBN 9789023495338,
  # https://openlibrary.org/books/OL28120759M.
  images:
    cover: "https://covers.openlibrary.org/b/id/9863051-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL20778007W"

- id: lars-kepler/sjomannen
  title: "Sjömannen: Sex spänningsberättelser"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2025
  format: short-story-collection
  subseries: null
  canonTier: extended
  synopsis: >
    Six suspense stories, kept locked away in a drawer for years by the
    authors' own account, gathered here for the first time - among them a
    father forced into a contract killing to save his son and a young
    journalist who falls for a suspected serial killer.
  note: >
    One of the six stories tells the backstory of Jurek Walter, the Joona
    Linna series' recurring serial killer, from childhood catastrophe to
    infamy. Bonniers' own catalogue copy describes the collection as a whole
    as drawn "from Lars Kepler's unique universe," without saying the other
    five involve any series character or event - so the correct claim is
    that Jurek's story is the only one confirmed tied to the main series,
    not that the rest are confirmed unconnected to it.
  sources:
    - "https://www.albertbonniersforlag.se/bocker/296504/sjomannen/"
    - "https://sv.wikipedia.org/wiki/Lars_Kepler"
    - "http://libris.kb.se/bib/m68d3bn8kdv86br2/data.jsonld"
  # No cover: no Open Library record exists yet for this 2025 title under
  # any spelling of its title checked (with and without the subtitle, with
  # and without diacritics). A cataloguing lag like Sömngångaren's above,
  # not a licensing gap.
