- id: lars-kepler/spegelmannen
  title: "Spegelmannen"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2020
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    A young woman vanishes on her way home from school and is found murdered
