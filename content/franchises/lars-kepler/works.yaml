# First-draft bibliography, cross-checked between English and Swedish
# Wikipedia's "Lars Kepler" articles and Albert Bonniers Förlag's own
# catalogue page for each title (the books' Swedish publisher) - not
# assumed from the request issue's recollection, which named only the first
# nine novels and missed the tenth (Sömngångaren, 2024), the eleventh
# (Medusa, forthcoming 2026), and both works standing outside the series
# (Playground, 2015; Sjömannen, 2025). `subseries: "Joona Linna"` on the
# eleven series novels matches the publisher's own numbering (Bonniers'
# catalogue lists Medusa as "den elfte boken i serien om Joona Linna och
# Saga Bauer") and Wikipedia's usage; not asserted from community consensus
# alone. The count of 13 is independently corroborated a third way: the
# Swedish National Library's LIBRIS catalogue holds a bibliographic record
# for each of the 13 titles below plus a separate one for the Black edition
# (see the next paragraph), and Bonniers' own site lists exactly 13 "other
# books by the author" on the Sjömannen product page, one of them the Black
# edition, alongside Sjömannen itself as the 14th - i.e. 14 catalogued
# products, 13 of them works in the sense this file means. English
# Wikipedia's own bibliography section is three titles behind (missing
# Sömngångaren, Medusa and Sjömannen entirely) - a live illustration of why
# a non-anglophone author needs the publisher's own catalogue and the
# national library, not an English-only sweep.
#
# STRUCTURAL CALL: "Hypnotisören - Black edition" (2019/2020, ISBN
# 9789100186777, own catalogue page at albertbonniersforlag.se/bocker/267245)
# is not catalogued as a separate work. The publisher's own news release
# (albertbonniersforlag.se/nyheter/10-arsjubilerande-lars-kepler-firar-med-
# ny-version-av-hypnotisoren/) and the edition's own catalogue-page copy
# state directly that the authors rewrote Hypnotisören for its tenth
# anniversary - tempo tightened, chapters compressed, dialogue rewritten,
# new scenes added, Joona Linna given a bigger role - while "grundberättelsen
# förstås är densamma" (the underlying story is of course the same); it
# retells Hypnotisören rather than continuing or replacing it, and page
# count and series position are unchanged. Recorded as a note on that work
# below, flagged for the editions stage rather than given its own id.
#
# Titles are the Swedish originals throughout (see franchise.yaml's TITLE
# RULING); synopses are paraphrased from each book's own publisher-catalogue
# copy, kept spoiler-free at the setup rather than the resolution.
#
# Sjömannen's title carries a subtitle, "Sex spänningsberättelser" (six
# suspense stories) - confirmed against the LIBRIS national-library record
# for the hardcover edition (ISBN 9789100809584), which catalogues the
# title-page title as "Sjömannen : sex spänningsberättelser" and separately
# records a *variant* title, "Sjömannen : spänningsberättelser" (missing
# "sex"), explicitly noted there as coming from the dust jacket rather than
# the title page. That variant is what Bonniers' own marketing copy and
# Swedish Wikipedia's bibliography both reproduce, which is why an
# English-only or web-only check would miss the "sex."

- id: lars-kepler/hypnotisoren
  title: "Hypnotisören"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2009
  subseries: "Joona Linna"
  canonTier: core
  featured: true
  synopsis: >
    A man is found brutally murdered in a changing room outside Stockholm;
    his wife and daughter are then found killed with the same frenzy in the
    family's own home, as if someone meant to wipe out the whole family.
    The son survives, severely wounded and unable to speak - but detective
    Joona Linna realizes one more family member is still alive, a sister,
    and races to find her before the killer does, turning to hypnotist Erik
    Maria Bark to reach the one witness who might know where.
  note: >
    The debut that created the pseudonym: rights sold to publishers in
    multiple countries before the book was even published in Sweden, per
    Bonniers' own catalogue copy, and it went on to become one of the
    best-selling Swedish crime novels of all time. A rewritten "Black
    Edition" (2019/2020, ISBN 9789100186777) exists for the tenth
    anniversary - see this file's header.
  sources:
    - "https://www.albertbonniersforlag.se/bocker/153581/hypnotisoren/"
    - "https://en.wikipedia.org/wiki/Lars_Kepler"
    - "https://sv.wikipedia.org/wiki/Lars_Kepler"
  # Cover is the Bonnier 2010 Swedish paperback (ISBN 9789100124045,
  # https://openlibrary.org/books/OL38238414M) - checked against this
  # work's full Open Library edition list (37 editions) to confirm the
  # Black Edition's own ISBN (9789100186777, see this file's header) is
  # not among them, so this is unambiguously the original 2009 novel, not
  # the 2019/2020 rewrite.
  images:
    cover: "https://covers.openlibrary.org/b/id/15173368-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL19754844W"

