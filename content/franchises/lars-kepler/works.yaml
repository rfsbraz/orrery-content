- id: lars-kepler/kaninjagaren
  title: "Kaninjägaren"
  authorIds: [alexandra-coelho-ahndoril, alexander-ahndoril]
  publishedAs: "Lars Kepler"
  published: 2016
  subseries: "Joona Linna"
  canonTier: core
  synopsis: >
    A masked figure watches a man through his own window and kills him
    slowly; three more victims follow. The single thread joining them is that
    each hears a child recite a rhyme about rabbits before the killer
    arrives, and Joona Linna and Saga Bauer are left to untangle one of the
    most complex cases of their careers - with the television chef Rex Müller
    and his son Sammy caught in the middle of it.
  note: >
    The Swedish publisher's own copy opens instead on Joona Linna two years
    into a sentence at Kumla prison. That situation is where the previous
    novel, Stalker, leaves him - Bonniers' page for this book says outright
    that Kaninjägaren "tar vid där den enorma succén Stalker slutade" - and
    Stalker's own jacket, in Swedish and in English, says nothing about it,
    so the premise above is taken from the case rather than from the
    detective's standing. The English-language jacket copy for this title
    (larskepler.com/books/the-rabbit-hunter) does the same, opening on the
    masked figure at the window.
  sources:
    - "https://www.albertbonniersforlag.se/bocker/190415/kaninjagaren/"
    - "https://larskepler.com/books/the-rabbit-hunter/"
  # Cover is the Albert Bonniers Förlag 2016 Swedish edition (ISBN
  # 9789100136772, https://openlibrary.org/books/OL45818580M). Open
  # Library's own work title for this record ("Lars Kepler SCHWEDISCH -
  # Kaninjägaren (Hasenjagd)") is a German import-listing label, not a
  # mistranslation or a different book - "Hasenjagd" is simply the German
  # for "Kaninjägaren"/"Rabbit Hunter", parenthesised by whoever catalogued
  # the import; the ISBN and cover art are the genuine Swedish edition.
  images:
    cover: "https://covers.openlibrary.org/b/id/15173371-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL33839232W"

