# Editions of Lars Kepler across three markets: Swedish (sv, the original),
# English (en) and Portuguese (pt-PT) - 34 editions over 13 works. Sourced
# primarily from Albert Bonniers Förlag's own product pages (the books' own
# Swedish publisher), OpenLibrary's per-ISBN edition records
# (openlibrary.org/isbn/<isbn>.json?default=false, cited per entry), Porto
# Editora's own storefront (portoeditora.pt, the exclusive Portuguese
# publisher) and the Biblioteca Nacional de Portugal catalogue
# (catalogo.bnportugal.gov.pt, browser-UA reachable per docs/CURATION.md),
# whose "Tít. orig." field independently confirmed five of the eleven
# Portuguese titles against the Swedish work each translates, rather than
# matching them by title alone.
#
# SWEDISH (sv) - 13 of 13 works, all Albert Bonniers Förlag, all the first
# hardcover ("Inbunden") edition read directly off the book's own product
# page. Medusa's ISBN (9789100182922) is a real, valid, pre-release
# registration for the announced 2026-09-21 date - not yet a published book,
# flagged as forthcoming on its entry rather than omitted, matching
# works.yaml's own treatment of it.
#
# THE BLACK EDITION. Hypnotisören carries a second Swedish entry:
# "Hypnotisören - Black edition" (Pocket, ISBN 9789100186777, 2020-08-06;
# originally released 2019-06-11 as Storpocket/E-bok/Ljudbok, ISBNs
# 9789100180447 / 9789100181444 / 9789178273034 - all four format ISBNs read
# directly off the edition's own Bonniers product page). This is not a
# reprint: it is a genuine 10th-anniversary REWRITE of the 2009 debut, per
# the publisher's own words - tempo tightened, chapters restructured, dialogue
# rewritten, new scenes added, Joona Linna given a bigger role - while
# "grundberättelsen förstås är densamma" (the underlying story is of course
# the same). Recorded here as its own edition with `title` set (rather than
# omitted, as every other sv entry does) precisely because the object on the
# shelf is titled differently from the work it retells; the note on the entry
# explains the difference so a reader choosing between the two 2009-era
# editions knows what separates them. Page count and series position are
# unchanged from the original, which is why it is an edition of
# lars-kepler/hypnotisoren rather than a work of its own (see works.yaml's
# header).
#
# ENGLISH (en) - 9 of 13 works: every Joona Linna novel through Spindeln
# (Spider, 2023). Every ISBN below is read directly off that exact edition's
# own OpenLibrary record. Translator credits follow that same record but not
# by one uniform method: where the record carries its own by_statement, the
# credit is that by-statement quoted directly; where it doesn't, the credit
# is the name attached to the record's co-author key instead, resolved and
# independently verified rather than assumed - never taken from a
# neighbouring printing of the same book either way. TRANSLATOR LINEAGE,
# confirmed per-book rather than assumed to hold across the run: Ann Long
# translated the debut (Hypnotisören, both its US Sarah Crichton Books/FSG
# and UK Blue Door editions carry the identical by-statement, "translated
# from the Swedish by Ann Long"); Laura A. Wideburg translated the following
# two (Paganinikontraktet, Eldvittnet - both explicit on their FSG records);
# Neil Smith translated the next four (Sandmannen and Stalker each carry an
# explicit by-statement; Kaninjägaren and Lazarus carry none, and are
# resolved instead from each record's own co-author key - OL7476119A and
# OL8476677A, both Neil Smith); Alice Menzies has translated the two most
# recent (Spegelmannen, Spindeln - neither carries a by-statement; both are
# mislabelled as a second "author" rather than a translator on OpenLibrary's
# own record, a data-entry quirk resolved here by checking the named
# co-author id, OL7968563A, which matches Alice Menzies with no other listed
# works of her own). No English edition exists yet for
# Sömngångaren (2024): an ISBN is reserved in Bonnier Zaffre's block
# (9781838777906, ISBN-13 check digit verified, ISBN-only OpenLibrary stub
# created 2026-06) but no publisher, date, translator, format or storefront
# listing was found anywhere checked - not shipped, per the "never guess"
# rule; the ISBN alone is not a book. No English edition exists for Medusa
# (unpublished), Playground (no translation found in any market checked) or
# Sjömannen (2025, too recent - the same negative result as the Portuguese
# search below).
#
# PORTUGUESE (pt-PT) - 11 of 13 works. Porto Editora has published Lars
# Kepler continuously since 2010 and is the sole Portuguese publisher found
# for this author; all eleven editions carry its house paperback binding
# ("Capa mole") and were confirmed on its own storefront
# (portoeditora.pt/produtos/ficha/...) with the Biblioteca Nacional de
# Portugal catalogue as a second, independent source for translator and
# title on every entry. TRANSLATOR LINEAGE, distinct from the English one
# above because these are two independent translations working from the same
# Swedish text: Jaime Bernardes (O Hipnotista) -> Ulla Baginha (O Executor)
# -> Ana Diniz (A Vidente, O homem da areia, Stalker) -> Regina Valente (O
# Porto das Almas, O Caçador, Lazarus) -> Ivan Figueiras (O Homem-Espelho, A
# Aranha, O Sonâmbulo). Two titles are not literal and were matched by
# synopsis/series-position, not title: "O Executor" (Portuguese for "The
# Executor") is Paganinikontraktet/The Nightmare, confirmed the second book
# in the series by Porto Editora's own product-page copy and reader reviews
# naming it "o segundo livro da saga"; "A Vidente" ("The Seer") is
# Eldvittnet/The Fire Witness, confirmed the third book the same way and a
# natural fit for a novel centred on a self-described spiritualist medium.
# "O Porto das Almas" ("The Port/Harbour of Souls") is not a Joona Linna
# novel at all - it is Playground, confirmed word-for-word against the
# Biblioteca Nacional's "Tít. orig.: Playground" field and against Porto
# Editora's own synopsis, which opens on "Jasmin", a Swedish soldier wounded
# in Kosovo whose near-death vision is of a "cidade portuária... um porto de
# almas" (a port city... a port of souls) - the title is the vision, not a
# mistranslation. The Portuguese "Stalker" keeps the English title on its
# spine but adds a subtitle absent from every other market checked, "O
# Regresso do Hipnotista" (The Hypnotist's Return), naming outright what the
# English and Swedish jackets both leave for the reader to discover. No
# Portuguese edition exists for Medusa (unpublished) or Sjömannen (2025, no
# result on Porto Editora's own storefront search, which otherwise lists
# every other Kepler title including the 2024 Sömngångaren).
#
# PORTUGUESE HERITAGE, CHECKED AND NOT LOAD-BEARING HERE. Co-author Alexandra
# Coelho Ahndoril has a Portuguese mother (content/authors/alexandra-coelho-
# ahndoril.yaml). Porto Editora's Portuguese program runs from 2010 -
# immediately following the 2009 Swedish debut, the same one-year gap as the
# Swedish-to-first-translation lag this catalogue already documents for
# several other authors - with no gap, acceleration or promotional framing
# tying it to that biographical fact in anything checked (the publisher's own
# author bio on every product page above is the standard house paragraph,
# naming neither Portugal nor her ancestry). The heritage and the publishing
# history are both real; nothing found connects them.
