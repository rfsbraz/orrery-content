# Creative periods. Empty: seventeen years and eleven novels (2009-2026) is
# enough span to divide, unlike a two-book shelf, but nothing outside this
# file divides it. The authors' own account, the publisher's catalogue and
# the Swedish criticism all describe one continuous series.
#
# The authors treat the Joona Linna novels as a single unbroken run rather
# than a sequence of phases. Their own FAQ answers "Can the Joona Linna
# series be read out of sequence?" with "Yes, every book can be read as a
# stand-alone [...] They are both after all our main protagonists for the
# entire series" (larskepler.com/keplers-universe/). Swedish Wikipedia puts
# the same thing in critical terms: the series is "episkt sammanhängande"
# (epically continuous) while each part reads free-standing, so the books can
# in principle be taken in any order.
#
# The publisher places every novel by its ordinal position in that one series
# and never as a member of a named group: "sin fjärde thriller" (Sandmannen),
# "den sjunde boken om Joona Linna" (Lazarus), "Lars Keplers tionde bok om
# Joona Linna" (Sömngångaren), "den elfte boken i serien om Joona Linna och
# Saga Bauer" (Medusa). The one grouping the marketing draws is a single
# book-to-book link, Kaninjägaren "tar vid där den enorma succén Stalker
# slutade" (picks up where Stalker ended), which is a sequel and not a
# period. In English the whole run carries one series brand, "A Killer
# Instinct Novel - The Joona Linna Series", applied alike to the 2009 debut
# and to the latest volume (larskepler.com/books/).
#
# Playground (2015) is not a dividing marker. The publisher catalogues it
# under a series of its own and pitches it as "en annan sida av Lars Kepler"
# (another side of Lars Kepler); Swedish Wikipedia files it under "Fristående
# verk" (free-standing works) together with Sjömannen (2025), outside the
# series rather than between phases of it. The sequence closes over it:
# Kaninjägaren (2016) resumes directly from Stalker (2014).
#
# Swedish criticism sampled across the whole run reads the books the same
# way, by number within one series: DAST Magazine's reviews from Sandmannen
# (2012) to Sömngångaren (2024), and Deckarlogg on Sömngångaren, "Detta är
# tionde boken med Joona Linna [...] Den här boken fungerar bra
# självständigt" (this is the tenth book with Joona Linna, and it works well
# on its own). Aftonbladet's archive returns no article joining this
# authorship to "trilogi".
#
