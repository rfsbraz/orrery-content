# FRANCHISE-SPECIFIC events only (things that happen to the books or the
# pseudonym, not to either author individually - those are lifeEvents on
# content/authors/alexandra-coelho-ahndoril.yaml and
# content/authors/alexander-ahndoril.yaml). This distinction matters more
# here than on a single-author wing: a fact belongs to a person only if one
# person owns it, and this wing's most interesting facts do not - deciding
# to write crime fiction together, choosing the name Lars Kepler, the 2009
# debut, being identified as its authors by the Swedish press, and any
# screen adaptation all belong to the couple jointly, so putting one on
# either author's lifeEvents would be wrong and putting it on both would
# render it twice.
#
# Six entries, 2008-2026: the pseudonym's invention, its 2009 unmasking,
# the 2012 Hallström film, Kaninjägaren's 2017 Dutch chart debut, a 2019
# audiobook prize, and the Apple TV+ adaptation. The name's own dual homage
# (Lars for Stieg Larsson, Kepler
# for Johannes Kepler) is corroborated three ways - Swedish and English
# Wikipedia's "Lars Kepler" articles and the couple's own retelling on
# larskepler.com/about, which is also the primary source for the
# invention story itself (two failed attempts to write together under
# their own names, then a third invented author neither of them). The
# August 2009 unmasking is corroborated four ways: Aftonbladet's own
# article (dated 2009-08-11 by its schema.org metadata, "Paret Ahndoril:
# Vi är Lars Kepler"), the couple's own account of being tracked to their
# holiday cottage and confirming it at a publisher press conference
# (larskepler.com/about), Svenska Dagbladet's independent joint profile of
# the couple 17 days later (svd.se/rygg-mot-rygg, published 2009-08-28),
# and the Henning Mankell false-guess picked up independently by the New
# York Times in 2011. The 2012 film is corroborated by its own dedicated
# Wikipedia article (citing The Hollywood Reporter for the Oscar-entry
# fact) plus the Swedish Film Institute's own database. Kaninjägaren's
# Dutch translation, Jager, is the first Kepler title to top the
# Netherlands' official weekly bestseller chart, De Bestseller 60 - run by
# the CPNB (the Dutch book trade's collective promotion foundation) since
# 2003 and reported in the national press - per Dutch Wikipedia's own
# dedicated table of every Kepler title's chart run, itself sourced to the
# chart's own site, which independently confirms the title, author,
# publisher and ISBN. Every earlier Kepler title's Dutch run had peaked no
# higher than No. 2. The Apple TV+
# adaptation is one production under three names, not two separate deals -
# announced 2 February 2023 as an untitled series based on "Lazarus" with
# Tom Hardy attached, shot under the working title "Parallax," and
# retitled "Nocturne" for its 30 October 2026 premiere, per Wikipedia's
# dedicated "Nocturne (TV series)" article - corroborated by the authors'
# own site's news posts announcing the same cast additions on the same
# dates.
#
# REJECTED, insufficiently or contradictorily sourced: a 2016 "Adlibris
# pris för Årets bästsäljare" (three categories, for Kaninjägaren) appears
# on Swedish Wikipedia's uncited awards list, but the authors' own site
# states directly that the Adlibris Awards "was founded in 2019" - the
# two claims cannot both be right, and nothing else checked resolves which
# prize (if either) is meant, so neither is recorded. A
# Polish "Golden Bullet" award for a translated edition and three
# unspecified, undated nominations for a Swedish Crime Writers' Academy
# prize appear on Swedish and Polish Wikipedia respectively with no
# citation, no year and no corroboration found anywhere else checked
# (including the Academy's own Wikipedia page, which names no Kepler
# title among its winners) - both held out rather than added on a single
# uncited source.
#
# THE QUIET YEARS, 2013-2016: no dated press, prize or reception event
# survives the sourcing bar for this narrower stretch, between the 2012
# film and Kaninjägaren's 2017 Dutch chart debut. This is not an
# unsearched gap - Swedish, English, French, German, Dutch and Italian
# Wikipedia, the authors' own site (About, Press, News, in full - its News
# Archive itself only reaches back to February 2020) and Albert Bonniers
# Förlag's catalogue were all checked, including archived (web.archive.org)
# copies of every New York Times and Deadline citation on English
# Wikipedia's reference list, neither of which concerns this period (the
# 2011 Henning Mankell piece and a 2026 Nocturne casting story) - it is
# what the record actually shows: three further Joona Linna novels
# (Stalker 2014, Kaninjägaren 2016, and the run-up to 2017's translation)
# and the standalone Playground (2015) appear on schedule with no
# accompanying rupture in the original Swedish market, which matches the
# couple's own description of these years elsewhere on their site - once
# the anonymity question was settled in 2009, the work itself went back to
# being unremarkable from the outside in Sweden itself: the same routine,
# the same collaboration, one book at a time. Neither author has an
# individual, dated lifeEvent in this window either - Alexandra's own
# awards list (per Swedish Wikipedia) ends in 2010 and Alexander's solo
# bibliography ended in 2009, before Lars Kepler existed.

- id: lars-kepler/pseudonym-invented-2008
  organisation: artifact-spread
  illustration_type: manuscript-proof
  images_required: 1
  date: 2008
  title: A third author is invented to save the collaboration
  scope: author-life
  reach: franchise
  impact: high
  description: >
    Alexandra and Alexander finish separate manuscripts in the same week and,
    facing the emptiness that follows, decide to write something together for
    the first time - first a children's book, then a play, both abandoned
    when two already-defined literary voices refuse to merge and every
    detail becomes an argument. Rather than try a third time under either of
    their own names, they invent a person who is neither of them: Lars, a
    homage to the crime novelist Stieg Larsson whose success drew them
    toward the genre, Kepler, a nod to the astronomer Johannes Kepler. They
    give their invention his own cover life - a former secondary-school
    teacher turned night-shift worker at a homeless hostel who writes crime
    novels by day - finish the manuscript that becomes Hypnotisören in
    total secrecy, and submit it to their own long-time publisher from a
    dedicated address, Lars.Kepler@hotmail.com, without saying who they are.
  spoilerAfter: null
  sources:
    - "https://www.larskepler.com/about/"
    - "https://sv.wikipedia.org/wiki/Lars_Kepler"
    - "https://en.wikipedia.org/wiki/Lars_Kepler"

- id: lars-kepler/aftonbladet-unmasking-2009
  organisation: mosaic
  illustration_type: press-media-collage
  images_required: 1
  date: 2009-08-11
  title: Aftonbladet unmasks the authors behind Lars Kepler
  scope: author-life
  reach: franchise
  impact: high
  description: >
    Hypnotisören sells to more than twenty countries for a record advance
    before it is even published in Sweden, and becomes "the Book of the
    Fair" at that spring's London Book Fair - which turns the identity of
    the pseudonymous "Lars Kepler" into a nationwide guessing game. British
    press names Henning Mankell, who denies it, as does the publisher; a
    television criminologist builds a live-broadcast profile of the
    unknown author; Sweden's biggest tabloid opens a 24-hour tip line. On
    11 August 2009 Aftonbladet publishes ten pieces of evidence pointing to
    Alexander and Alexandra Ahndoril and the couple confirm it is them in a
    press statement the same day - hours after two of the paper's own
    journalists find their holiday cottage on the Swedish west coast after
    dark and knock, torch and camera in hand, while their three daughters
    sleep inside. Svenska Dagbladet runs its own joint profile of "the
    Ahndoril couple" seventeen days later, treating the identity as
    established fact.
  spoilerAfter: null
  sources:
    - "https://www.aftonbladet.se/wendela/ledig/article11953495.ab"
    - "https://www.larskepler.com/about/"
    - "https://www.svd.se/rygg-mot-rygg"
    - "https://en.wikipedia.org/wiki/Lars_Kepler"
    - "https://www.nytimes.com/2011/07/17/books/review/inside-the-list.html"

- id: lars-kepler/hypnotisoren-film-oscar-entry-2012
  organisation: beside
  illustration_type: public-event-tableau
  images_required: 1
  date: 2012-09-28
  title: Hypnotisören reaches the screen, and Sweden's Oscar shortlist bid
  scope: culture
  reach: franchise
  impact: med
  description: >
    Lasse Hallström directs the first screen adaptation of a Lars Kepler
    novel, Hypnotisören (The Hypnotist), starring Tobias Zilliacus as Joona
    Linna and Mikael Persbrandt as the hypnotist Erik Maria Bark, released
    in Sweden on 28 September 2012. It is selected as Sweden's official
    entry for the Best Foreign Language Film Oscar at the 85th Academy
    Awards, though it does not make the final shortlist - the pseudonym's
    debut novel becomes the first Kepler title translated into a different
    medium as well as forty-plus languages.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/The_Hypnotist_(2012_film)"
    - "https://www.svenskfilmdatabas.se/en/item/?type=film&itemid=73094"
    - "https://en.wikipedia.org/wiki/Lars_Kepler"

- id: lars-kepler/kaninjagaren-dutch-no1-2017
  organisation: medallion
  illustration_type: book-object
  images_required: 1
  date: 2017-02-15
  title: Kaninjägaren's Dutch translation becomes Kepler's first chart-topper abroad
  scope: culture
  reach: franchise
  impact: med
  description: >
    Jager, the Dutch translation of Kaninjägaren (The Rabbit Hunter),
    enters the Netherlands' official weekly bestseller chart, De
    Bestseller 60, on 15 February 2017 and climbs to No. 1, holding the
    top spot for two weeks and staying on the chart for twenty-two weeks
    in total. Every earlier Kepler title's run on the same Dutch chart -
    Hypnose, Contract, Getuige, Slaap and Stalker among them - had peaked
    no higher than No. 2, making Jager the first Kepler book anywhere to
    top a national bestseller list outside Sweden.
  spoilerAfter: null
  sources:
    - "https://nl.wikipedia.org/wiki/Lars_Kepler"
    - "https://nl.wikipedia.org/wiki/De_Bestseller_60"
    - "https://www.debestseller60.nl/titel/9789023425984/Jager"

- id: lars-kepler/lazarus-audiobook-prize-2019
  organisation: medallion
  illustration_type: emblem-seal
  images_required: 1
  date: 2019
  title: Lazarus, read aloud, wins Sweden's Grand Audiobook Prize
  scope: culture
  reach: franchise
  impact: med
  description: >
    Lazarus, read by Jonas Malmsjö, wins the Suspense category of Stora
    Ljudbokspriset (the Grand Audiobook Prize, run by the streaming service
    Storytel) for 2019 - the sole prize win Wikipedia's own record of the
    Kepler bibliography can independently corroborate against the prize's
    own dedicated winners' list, in a decade otherwise light on dated,
    sourced recognition for the series between its debut and its television
    adaptation.
  spoilerAfter: null
  sources:
    - "https://sv.wikipedia.org/wiki/Stora_Ljudbokspriset"
    - "https://sv.wikipedia.org/wiki/Lars_Kepler"

- id: lars-kepler/nocturne-apple-tv-2023
  organisation: full-bleed-vista
  illustration_type: establishing-landscape
  images_required: 1
  date: 2023-02-02
  title: Apple TV+ options the Joona Linna novels
  scope: industry
  reach: franchise
  impact: high
  description: >
    Apple TV+, A+E Studios and Range announce development of an English-
    language series based on Lazarus and Sandmannen (The Sandman), initially
    untitled and attached to Tom Hardy and Zazie Beetz. The production is
    greenlit in May 2025 with Liev Schreiber and Stephen Graham replacing
    Hardy, fills out its cast through the summer with Bill Camp, Rory
    Culkin, Chrissy Metz and Gary Carr, films in and around Pittsburgh under
    the working title "Parallax," and is retitled Nocturne for its 30
    October 2026 premiere - created by Rowan Joffé and showrun by John
    Hlavin throughout, the first English-language screen adaptation of the
    series and, at Apple TV+'s scale, the biggest yet.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Nocturne_(TV_series)"
    - "https://www.larskepler.com/"
    - "https://en.wikipedia.org/wiki/Lars_Kepler"
