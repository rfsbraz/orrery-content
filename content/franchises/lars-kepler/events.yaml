# announced February 2023 as an untitled series based on "Lazarus" with Tom
# Hardy attached, greenlit May 2025 with Liev Schreiber and Stephen Graham
# replacing him, cast out through mid-2025 to add Bill Camp, Rory Culkin,
# Chrissy Metz and Gary Carr, shot in Pittsburgh under the working title
# "Parallax," and retitled "Nocturne" for its 30 October 2026 premiere -
# created by Rowan Joffé and developed/showran by John Hlavin throughout,
# based on the Joona Linna novels Lazarus and The Sandman, matching exactly
# the cast the authors' own site and Albert Bonniers Förlag's news page
# describe. The English "Lars Kepler" article's separate, shorter mention
