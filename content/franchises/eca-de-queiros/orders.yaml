# ADDITIONAL canon orders only. The DEFAULT order - all 9 lifetime books plus
# every posthumous one in works.yaml, publication-chronological - is derived
# automatically and is NOT listed here.
#
# One thread earns an order: the three books scholarship names as a unit,
# "a trilogia do último Eça" (R. Loureiro, Palimpsesto - Revista do Programa
# de Pós-Graduação em Letras, UERJ, 2009) - the same grouping behind the
# eras.yaml o-ultimo-eca period. Every other lifetime work is a standalone
# with no grouping to walk apart from the default, so this file holds
# exactly one entry, not a padded shelf of them. No startHere: the searches
# that would justify one turned up a single YouTube video and two low-value
# SEO listicles disagreeing on the entry point, and Brazil's FUVEST exam
# assigns a different Eça title most years for reasons unrelated to reading
# order - none of that is the converged community practice this catalogue
# requires before shipping a wizard.

- id: eca-de-queiros/trilogia-do-ultimo-eca
  name: A trilogia do último Eça
  type: curated
  source: canon
  rationale: >
    The three books scholarship names as a critical unit:
    [[work:eca-de-queiros/a-correspondencia-de-fradique-mendes|A
    Correspondência de Fradique Mendes]], [[work:eca-de-queiros/a-ilustre-casa-de-ramires|A
    Ilustre Casa de Ramires]] (both 1900) and
    [[work:eca-de-queiros/a-cidade-e-as-serras|A Cidade e as Serras]] (1901).
    Each stands alone with no shared plot or character, so nothing here is a
    story to follow strictly in sequence - the grouping is stylistic and
    thematic, not narrative. Read it instead of the full nine-book lifetime
    shelf if you want the compact, valedictory late period Carlos Reis calls
    the "deriva post-naturalista" ("post-naturalist drift"), without
    committing to the earlier social-satire novels around it. This order
    matches the derived default exactly for these three works; its whole
    contribution is naming and isolating the sourced late-period grouping as
    a walkable thread apart from the six other lifetime works around it.
  orderedWorkIds:
    - eca-de-queiros/a-correspondencia-de-fradique-mendes
    - eca-de-queiros/a-ilustre-casa-de-ramires
    - eca-de-queiros/a-cidade-e-as-serras
  sources:
    - https://www.e-publicacoes.uerj.br/palimpsesto/article/download/35680/25292
