# --- Published in his lifetime, discovered and printed only in 1980 ---

- id: eca-de-queiros/a-tragedia-da-rua-das-flores
  title: "A Tragédia da Rua das Flores"
  authorIds: [eca-de-queiros]
  published: 1980
  subseries: null
  canonTier: core
  synopsis: >
    A married Lisbon woman abandons her newborn son to run off with a lover,
    and vanishes from her family's life. Decades later, back in the city
    under a different name, she becomes the consuming obsession of a young
    man half her age. Written in 1877-78, before O Crime do Padre Amaro
    reached print, and left in manuscript for over a century.
  note: >
    Written 1877-78; first published only in 1980, eighty years after Eça's
    death. Adapted for Portuguese television in 1981 and for the stage in
    1982. The 1877-78 composition date is corroborated independently in the
    main Portuguese Wikipedia biography's own works list ("escrito
    1877-78"), not just the dedicated article - two separately-edited pages
    agreeing rather than one citing the other. The synopsis states the setup
    without confirming the two leads' family connection, matching how the
    novel's own real-world sellers describe it (a bookseller synopsis names
    the mother's abandonment of her son and, separately, the doomed Vítor/
    Genoveva romance, without its own text ever joining the two); the
    connection is the book's reveal, covered instead by the gated franchise
    event anchored on this work.
  sources:
    - https://pt.wikipedia.org/wiki/A_Trag%C3%A9dia_da_Rua_das_Flores
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
  images:
    cover: "https://covers.openlibrary.org/b/id/12964062-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/isbn/9781907650253"
    # Dedalus's own jacket (Margaret Jull Costa's translation); checked by
    # eye for a burned-in retailer watermark - none found.
