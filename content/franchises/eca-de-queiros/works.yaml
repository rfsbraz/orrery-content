    # eye for a burned-in retailer watermark - none found.

- id: eca-de-queiros/contos
  title: "Contos"
  authorIds: [eca-de-queiros]
  published: 1902
  subseries: null
  canonTier: core
  format: short-story-collection
  synopsis: >
    Eça's short fiction, written for newspapers and magazines between 1874
    and 1898 and gathered into one volume after his death: among them
    Singularidades de uma Rapariga Loura, a young man's disillusioning
    courtship; José Matias, a tragicomic study of Platonic love recounted
    entirely through what a dinner-party audience keeps interrupting; O
    Defunto and A Perfeição; and O Suave Milagre, a legend in which Christ
    steps down from the cross to save a stranger's honest lie.
  note: >
    Published posthumously; every story in it first appeared in a periodical
    (see this file's own header) and none is listed here as a separate work.
  sources:
    - https://pt.wikipedia.org/wiki/Contos_(E%C3%A7a_de_Queiroz)
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s

- id: eca-de-queiros/prosas-barbaras
  title: "Prosas Bárbaras"
  authorIds: [eca-de-queiros]
  published: 1903
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Eça's earliest writing: impressionistic, lyrical prose poems published in
    the Gazeta de Portugal during his Coimbra years and gathered into a book,
    long after his death, by his Cenáculo friend Jaime Batalha Reis.
  note: >
    Published posthumously. Tagged `essay-collection` for lack of a closer
    fit in this catalogue's `format` list (SCHEMA.md); the pieces are closer
    to prose poems than to essays proper.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s

