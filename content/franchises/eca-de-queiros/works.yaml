- id: eca-de-queiros/o-conde-de-abranhos
  title: "O Conde de Abranhos"
  authorIds: [eca-de-queiros]
  published: 1925
  subseries: null
  canonTier: extended
  format: novella
  synopsis: >
    A fawning fictional biography, "written" by the dead politician's own
    devoted secretary Z. Zagalo, of Alípio Abranhos - a caricature that folds
    the vices of every 19th-century Portuguese politician into one invented
    career. Written in 1879.
  note: >
    Published posthumously, 46 years after it was written.
  sources:
    - https://pt.wikipedia.org/wiki/O_Conde_de_Abranhos
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s

- id: eca-de-queiros/alves-e-companhia
  title: "Alves & Companhia"
  authorIds: [eca-de-queiros]
  published: 1925
  subseries: null
  canonTier: core
  format: novella
  synopsis: >
    A Lisbon merchant discovers his wife's adultery, works himself into a
    fury, and then - once ruining the affair proves more inconvenient than
    ignoring it - talks himself into forgiveness instead. A small, precise
    satire of a "country of mild habits" that finds the ridiculous
    advantageous once the scandal is priced in. Written in 1884.
  note: >
    Published posthumously, 41 years after it was written; translated into
    English as both "The Yellow Sofa" and "Alves & Co." The 1884 composition
    date is corroborated independently in the main Portuguese Wikipedia
    biography's own works list ("escrito 1884"), not just the dedicated
    article - two separately-edited pages agreeing rather than one citing
    the other. Its three English translations (1993, 1996, 2012) against
    none found for O Conde de Abranhos support this file's `core` tier
    against that novella's `extended`.
  sources:
    - https://pt.wikipedia.org/wiki/Alves_%26_Companhia
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s

- id: eca-de-queiros/o-egipto
  title: "O Egipto"
  authorIds: [eca-de-queiros]
  published: 1926
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Travel notes and journalism from Eça's 1869 journey to Egypt for the
    opening of the Suez Canal, collected into a book after his death.
  note: >
    Published posthumously. Titled with the pre-1911 spelling "Egipto"
