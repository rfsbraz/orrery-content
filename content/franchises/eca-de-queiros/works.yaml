# Bibliography (Works) - the abstract books; editions/covers are separate.
# IDs are STABLE and permanent (user data references them). Titles are the
# ORIGINAL Portuguese as first published (see franchise.yaml's own note: Eça
# wrote in Portuguese throughout, so this never conflicts with an
# English-first exception the way it does on some other wings).
#
# SOURCES. Cross-checked against English and Portuguese Wikipedia's "Eça de
# Queirós"/"Eça de Queiroz" articles (which carry, and largely agree on, a
# full list of titles and years), Portuguese Wikipedia's own navigation
# template for his books (a second, independently-edited list that stops at
# A Tragédia da Rua das Flores, 1980), and the dedicated Portuguese Wikipedia
# article for each title named below where one exists. Also cross-checked
# against the publishers' own catalogues: the Universidade de Coimbra Centro
# de Literatura Portuguesa's dated publication list for the "Edição Crítica
# das Obras de Eça de Queirós" (the ongoing scholarly critical edition,
# coordinated by Carlos Reis and published by Imprensa Nacional-Casa da
# Moeda since 1992), the Fundação Eça de Queirós's own shop descriptions,
# and period bookseller listings (bibliographias.blogspot.com, a Porto
# antiquarian dealer, for the 1925 first edition of Correspondência).
#
# POSTHUMOUS WORKS get an ordinary work entry plus a `note:` recording it,
# the same treatment this catalogue already gives José Saramago's posthumous
# volumes - no separate section, no special field. Two 1900 books
# (A Correspondência de Fradique Mendes, A Ilustre Casa de Ramires) were
# finished before Eça's death that August but reached print only weeks or
# months later; Portuguese Wikipedia's own article on the former calls this
# "semipóstumo" ("semi-posthumous"), and both are noted as such rather than
# folded silently into either the "lifetime" or "posthumous" bucket.
#
# WHAT COUNTS AS A WORK HERE. A short story that only ever appeared in a
# periodical and was then gathered into a collection is not listed
# separately - the same rule this catalogue's Fernando Pessoa wing states for
# periodical poems, applied here to periodical fiction. Checked directly:
# Singularidades de uma Rapariga Loura (1874), Um Poeta Lírico and No Moinho
# (1880), Civilização, O Tesouro and Frei Genebro (1892-93), A Aia (1894), O
# Defunto (1895), José Matias, A Perfeição and Adão e Eva no Paraíso (1897)
# and O Suave Milagre (1898) were all first printed in newspapers or
# magazines (Gazeta de Notícias, Revista Moderna, the Almanaque
# Enciclopédico) and only gathered into a book, Contos, after his death in
# 1902; none is a separate entry below, and the most-cited among them are
# named in Contos's own synopsis instead.
#
# NOT LISTED, and why. As Minas de Salomão (1885-91), Eça's own Portuguese
# translation of H. Rider Haggard's King Solomon's Mines, is absent
# deliberately. It appears on both Wikipedias' bibliographies, but it is not
# a book he wrote, and `authorRole` (SCHEMA.md: author | co-author |
# contributor | editor) has no value for "sole translator of someone else's
# novel" - the closest fits (`contributor`, `editor`) would misstate the
# relationship as much as bare `authorIds` would. Rather than force a value
# the schema does not offer, the translation is left out here: not a hole in
# Eça's own bibliography, but a hole in the schema's vocabulary for one.
# A second, later instance of the same gap: Philidor, an 1863 Joseph
# Bouchardy play Eça translated into Portuguese for the stage (staged and
# published in Lisbon; critically re-edited in the "Edição Crítica" series,
# 2021), is excluded for the identical reason - a translated stage script by
# another author, not a book of Eça's own.
#
# ALSO NOT LISTED, as a caution rather than a finding. Between 1992 and 2021
# the "Edição Crítica" series also produced new scholarly editions of most
# of the novels already listed below (O Mandarim, A Capital, O Crime do
# Padre Amaro, A Ilustre Casa de Ramires, Alves & Companhia, Contos [Vol.
# I], A Correspondência de Fradique Mendes, Os Maias, O Mistério da Estrada
# de Sintra, A Relíquia) - these are re-editions of works already in this
# file, not new works, and belong in `editions.yaml`, not here.
#
# SUBSERIES is null throughout: nothing here is a publisher-numbered or
# author-grouped sequence. Carlos Fradique Mendes, the satirical persona Eça
# co-invented with Antero de Quental and Jaime Batalha Reis (see
# content/authors/eca-de-queiros.yaml's `pseudonyms`), appears across three
# works below (O Mistério da Estrada de Sintra, A Correspondência de Fradique
# Mendes, Cartas Inéditas de Fradique Mendes) - a recurring character, not a
# series, per this catalogue's own rule; each of the three notes the other
# two instead of a shared `subseries` value.
#
# FOUR TITLES THAT LOOKED THIN, RESOLVED. Dicionário de Milagres, Contos
# Vol. II, Almanaques e Outros Dispersos and Lendas de Santos rested on a
# title and year from the two Wikipedia bibliographies alone. Each now has a
# sourced description in its own entry below (bookseller/publisher copy for
# Dicionário de Milagres; the "Edição Crítica" volume descriptions,
# corroborated across the Fundação Eça de Queirós shop and the Universidade
# de Coimbra research centre that runs the series, for the other three).
# None turned out to be wrong; all four are real, and none needed a tier
# change except Lendas de Santos (see its own note).
#
# TEXTOS DE IMPRENSA, RESOLVED. Six real, separately-dated volumes exist -
# Da Revista de Portugal (1995), Da Gazeta de Notícias (2002), Da Gazeta de
# Portugal (2004), Da Revista Moderna (2005), Do Distrito de Évora (2019)
# and a second Da Revista de Portugal volume (2024), each gathering
# previously-uncollected journalism from a different periodical Eça wrote
# for - confirmed against the Universidade de Coimbra Centro de Literatura
# Portuguesa's own dated publication list, the primary source for the
# series it runs. Grouped as ONE entry below rather than six or zero, the
# same call this catalogue already made for J. R. R. Tolkien's twelve-volume
# The History of Middle-earth: a single decades-spanning scholarly project
# assembling previously unseen material, not a series a reader picks
# individual volumes of. See that entry's own note for the twelve-volume
# precedent this follows.
#
# TWO WORKS ABSENT FROM THE WIKIPEDIA-BIBLIOGRAPHIES OVERLAP ABOVE.
# Correspondência (1925) - 84 of Eça's personal letters, mostly to Ramalho
# Ortigão and Oliveira Martins, selected and prefaced by his son José Maria
# - does appear on the main Portuguese Wikipedia article's own works list,
# distinct from its dedicated-article bibliography this file leans on
# elsewhere. Cartas Públicas (2009), his public press-published open
# letters, appears on neither Wikipedia bibliography at all and is sourced
# instead to the "Edição Crítica" series' own publication record. Both are
# real and both are added below.

# --- Published in his lifetime ---

- id: eca-de-queiros/o-misterio-da-estrada-de-sintra
  title: "O Mistério da Estrada de Sintra"
  authorIds: [eca-de-queiros]
  withAuthorIds: [ramalho-ortigao]
  authorRole: co-author
  published: 1870
  subseries: null
  canonTier: core
  synopsis: >
    Two friends are kidnapped on the road back from Sintra and wake in a
    house with a corpse. Serialised in Diário de Notícias as 66 real "letters
    to the editor," with the paper's own editor in on the hoax, it convinced
    much of Lisbon it was reading a true crime as it happened; considered the
    first Portuguese detective novel. Carlos Fradique Mendes, the satirical
    persona Eça had co-invented two years earlier, appears as a character.
  note: >
    Written jointly with Ramalho Ortigão, who was billed first in the 1870
    newspaper serial; Eça reworked the text extensively for the 1884 third
    edition, after which he was credited as the lead author of the book
    version.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://en.wikipedia.org/wiki/The_Mystery_of_the_Sintra_Road
    - https://pt.wikipedia.org/wiki/Fradique_Mendes

- id: eca-de-queiros/o-crime-do-padre-amaro
  title: "O Crime do Padre Amaro"
  authorIds: [eca-de-queiros]
  published: 1875
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A young priest posted to provincial Leiria falls into an affair with a
    devout parishioner, and the small-town Church closes around the
    consequences. Eça's first novel and the founding text of Portuguese
    literary realism, written while he was a municipal administrator in the
    same city the book is set in.
  note: >
    Substantially rewritten twice after its 1875 first edition (1876, then a
    definitive 1880 text); the 1880 version is the one now read and
    translated.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
  images:
    cover: "https://covers.openlibrary.org/b/id/13783270-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/isbn/9781907650451"
    # Dedalus's own jacket (Margaret Jull Costa's translation); checked by
    # eye for a burned-in retailer watermark - none found.

- id: eca-de-queiros/o-primo-basilio
  title: "O Primo Basílio"
  authorIds: [eca-de-queiros]
  published: 1878
  subseries: null
  canonTier: core
  synopsis: >
    A bored Lisbon wife takes up with her visiting cousin while her husband
    is away on business, and the affair is exposed by a scheming maid. Gave
    Portuguese the word "acaciano," from the novel's Conselheiro Acácio, for
    speech that is pompous, ornate and empty of content.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s

- id: eca-de-queiros/o-mandarim
  title: "O Mandarim"
  authorIds: [eca-de-queiros]
  published: 1880
  subseries: null
  canonTier: core
  format: novella
  synopsis: >
    A poor clerk is told that ringing a bell will kill an unseen mandarin in
    China and hand him the dead man's fortune - and rings it. A fantastical
    fable, written in Bristol, about the corrupting weightlessness of money
    that costs its owner nothing to obtain.
  sources:
    - https://pt.wikipedia.org/wiki/O_Mandarim
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s

- id: eca-de-queiros/a-reliquia
  title: "A Relíquia"
  authorIds: [eca-de-queiros]
  published: 1887
  subseries: null
  canonTier: core
  synopsis: >
    A young hypocrite travels to the Holy Land hoping to inherit from his
    devout aunt, and dreams his way into a blasphemous, comic version of the
    Passion he can pass off as piety. Drafted after Eça's own 1869-70 journey
    to Egypt and Palestine but held back seventeen years before publication.
  note: >
    Its resemblance to Ferdinando Petruccelli della Gattina's earlier
    "Memorie di Giuda" led some critics to accuse Eça of plagiarism.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
  images:
    cover: "https://covers.openlibrary.org/b/id/721952-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/isbn/9781912868407"
    # Dedalus's own jacket (Margaret Jull Costa's translation); checked by
    # eye for a burned-in retailer watermark - none found.

- id: eca-de-queiros/os-maias
  title: "Os Maias"
  authorIds: [eca-de-queiros]
  published: 1888
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    Three generations of a Lisbon family unravel across old money, faded
    Romanticism and a consuming love affair the grandson Carlos falls into
    with a newly arrived, mysterious woman - a portrait, through one family's
    decline, of upper-class Lisbon's own hypocrisy and complacency. Conceived
    as early as 1878, written largely during Eça's Bristol consulship and
    published the year he left for Paris; widely called the greatest
    Portuguese realist novel.
  note: >
    No English-language publisher blurb found for this novel (Dedalus,
    Penguin's older Patricia McGowan Pinheiro/Ann Stevens edition, or
    otherwise) discloses the late reveal that the woman is Carlos's own
    half-sister; every one checked stops at "family decline" and "sexual
    licence" in general terms. The synopsis above follows that convention.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
  images:
    cover: "https://covers.openlibrary.org/b/id/13552706-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/isbn/9781910213445"
    # Dedalus's 2016 jacket (Margaret Jull Costa's translation); checked by
    # eye for a burned-in retailer watermark - none found.

- id: eca-de-queiros/uma-campanha-alegre
  title: "Uma Campanha Alegre"
  authorIds: [eca-de-queiros]
  published: 1890
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    Two volumes of the satirical columns Eça himself wrote for As Farpas in
    1871-72, on religion, journalism, politics and literature - his own share
    of the co-written monthly, collected under his sole name eighteen years
    after he stopped writing it.
  note: >
    As Farpas continued as Ramalho Ortigão's own magazine alone until 1882;
    this volume gathers only Eça's contribution, not the full run.
  sources:
    - https://pt.wikipedia.org/wiki/Uma_Campanha_Alegre
    - https://pt.wikipedia.org/wiki/As_Farpas

- id: eca-de-queiros/a-correspondencia-de-fradique-mendes
  title: "A Correspondência de Fradique Mendes"
  authorIds: [eca-de-queiros]
  published: 1900
  subseries: null
  canonTier: core
  synopsis: >
    An admiring biography and seventeen letters, presented as if edited by a
    friend, giving a full life to Carlos Fradique Mendes: wealthy Azorean
    poet, tireless traveller, and the satirical persona Eça, Antero de
    Quental and Jaime Batalha Reis had first invented as a joke thirty years
    earlier. Eça worked at the character from 1885 as "a novel of a special,
    didactic, non-dramatic kind."
  note: >
    Published under Eça's own name in 1900, a few months after his death in
    August that year - Portuguese Wikipedia's own article on the book calls
    it "semipóstumo" (semi-posthumous). Fradique also appears in
    [[work:eca-de-queiros/o-misterio-da-estrada-de-sintra|O Mistério da
    Estrada de Sintra]] (1870) and in the later
    [[work:eca-de-queiros/cartas-ineditas-de-fradique-mendes|Cartas Inéditas
    de Fradique Mendes]] (1929).
  sources:
    - https://pt.wikipedia.org/wiki/A_Correspond%C3%AAncia_de_Fradique_Mendes
    - https://pt.wikipedia.org/wiki/Fradique_Mendes

- id: eca-de-queiros/a-ilustre-casa-de-ramires
  title: "A Ilustre Casa de Ramires"
  authorIds: [eca-de-queiros]
  published: 1900
  subseries: null
  canonTier: core
  synopsis: >
    A financially strapped country nobleman writes a historical romance
    glorifying his own medieval ancestors while brokering his sister's
    marriage for political advantage back home - a portrait, through one
    family, of the compromises Eça saw underneath Portugal's own decline.
  note: >
    Published in 1900, the year of Eça's death in August that year.
  sources:
    - https://pt.wikipedia.org/wiki/A_Ilustre_Casa_de_Ramires
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
  images:
    cover: "https://covers.openlibrary.org/b/id/598175-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/isbn/9780811226981"
    # New Directions's 1994 "Revived Modern Classic" jacket (Anne Stevens's
    # translation) - an earlier printing than the 2017 edition cited in
    # editions.yaml, but the same publisher and translation; checked by eye
    # for a burned-in retailer watermark, none found.

# --- Posthumous (1901-) ---

- id: eca-de-queiros/a-cidade-e-as-serras
  title: "A Cidade e as Serras"
  authorIds: [eca-de-queiros]
  published: 1901
  subseries: null
  canonTier: core
  featured: true
  synopsis: >
    A wealthy Portuguese expatriate, sated on every mechanical convenience
    1890s Paris can supply, retreats to his family's rustic mountain estate
    at Tormes and finds a life he did not know he was missing. Eça's own last
    finished book, written between 1892 and his death in 1900.
  note: >
    Published posthumously, the year after his death.
  sources:
    - https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
  images:
