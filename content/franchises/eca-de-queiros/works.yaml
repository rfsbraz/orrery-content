# --- Modern editorial gatherings (1995-) ---
# All five entries in this section belong to the "Edição Crítica das Obras
# de Eça de Queirós," the ongoing scholarly critical edition coordinated by
# Carlos Reis and published by Imprensa Nacional-Casa da Moeda since 1992 -
# the source of every "not thin any more" note below. The series also
# re-edited most of the novels already listed earlier in this file; only
# the volumes below are first publications of previously-uncollected
# material, so only they get their own entry (see this file's own header).

- id: eca-de-queiros/textos-de-imprensa
  title: "Textos de Imprensa"
  authorIds: [eca-de-queiros]
  published: 1995
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Eça's journalism, gathered volume by volume - one per periodical he
    wrote for - decades after it first ran in the press: for the Revista de
    Portugal (1995, and again 2024), the Gazeta de Notícias (2002), the
    Gazeta de Portugal (2004), the Revista Moderna (2005) and the press of
    the Distrito de Évora (2019).
  note: >
    ONE ENTRY for a six-volume, 1995-2024 project, the same call this file
    already makes for J. R. R. Tolkien's twelve-volume The History of
    Middle-earth (see that wing's works.yaml for the fuller reasoning): a
    single decades-spanning scholarly project recovering previously unseen
    material source by source, not a series a reader picks individual
    volumes of. published is set to 1995, the first volume's year. The six
    constituent volumes, by the periodical each recovers and the year its
    critical edition appeared: Da Revista de Portugal (1995); Da Gazeta de
    Notícias (2002); Da Gazeta de Portugal (2004); Da Revista Moderna
    (2005); Do Distrito de Évora (2019); a second Da Revista de Portugal
    volume (2024) - six volumes for "Vols. I-VI" on Portuguese Wikipedia's
    own bibliography, confirmed here against the dated publication list of
    the Universidade de Coimbra research centre that runs the series, the
    primary source for its own project.
  sources:
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://www.uc.pt/fluc/clp/livros-edicao-critica-das-obras-de-eca-de-queiros/

- id: eca-de-queiros/contos-vol-ii
  title: "Contos Vol. II"
  authorIds: [eca-de-queiros]
  published: 2003
  subseries: null
  canonTier: extended
  format: short-story-collection
  synopsis: >
    Four further stories left in the workshop at different stages of
    completion - "A Catástrofe," "Um Dia de Chuva," "Enghelberto" and "Sir
    Galahad" - gathered as a second volume alongside the first
    [[work:eca-de-queiros/contos|Contos]] (1902). Three had already appeared
    piecemeal in editions his sons prepared (1925, 1929, 1966); this volume
    re-edits all four from the manuscripts.
  note: >
    Not thin: a scholarly critical edition (part of the "Edição Crítica das
    Obras de Eça de Queirós" series) exists for this exact volume, naming
    all four stories and its own editorial rationale.
  sources:
    - https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s
    - https://loja.feq.pt/loja-online/edicao-critica-contos-ii/
    - https://www.uc.pt/fluc/clp/livros-edicao-critica-das-obras-de-eca-de-queiros/liv25/

- id: eca-de-queiros/cartas-publicas
  title: "Cartas Públicas"
  authorIds: [eca-de-queiros]
  published: 2009
  subseries: null
  canonTier: extended
  format: nonfiction
  synopsis: >
    Texts Eça deliberately gave epistolary form for publication in the
