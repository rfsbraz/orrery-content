- id: eca-de-queiros/a-capital
  title: "A Capital"
  authorIds: [eca-de-queiros]
  published: 1925
  subseries: null
  canonTier: extended
  synopsis: >
    A provincial young man arrives in Lisbon to make his fortune and finds
    the capital as morally compromising as anywhere he left. Written in
    1877-78 and left unfinished; prepared for print by Eça's son decades
