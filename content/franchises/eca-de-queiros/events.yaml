# FRANCHISE events: what happened to the BOOKS. Eça's own life is on the
# author entity at content/authors/eca-de-queiros.yaml, and it ends in 1900.
#
# This file exists because the shelf does not: nine books in his lifetime,
# then twenty-two more assembled by his son and, over the following century
# and a quarter, by scholarly editors (see works.yaml's own header). Without
# these entries a reader walks 123 years of posthumous books - 1901 to the
# 2023 Lendas de Santos - with no context at all. The five entries below
# anchor that span at 1875-1880, 1878, 1925, 1980-1982 and 2007; real years
# remain uncovered between them, left dark rather than padded with trivia.
#
# Append-only file; parallel branches merge here.

- id: eca-de-queiros-crime-do-padre-amaro-contested-birth-1875
  date: 1875
  dateRange: "1875-1880"
  title: The text of O Crime do Padre Amaro takes five years to settle
  scope: industry
  reach: franchise
  impact: med
  description: >
    [[work:eca-de-queiros/o-crime-do-padre-amaro|O Crime do Padre Amaro]]
    reached print by accident: Eça sent a draft to friends running a literary
    magazine expecting proofs back for correction, and they serialised it
    unedited in 1875 instead. Some critics called it a "vanguard novel", but
    it also drew accusations, later repeated by Machado de Assis from Brazil,
    that it imitated Émile Zola's La Faute de l'Abbé Mouret too closely, and
    Catholic newspapers in both Portugal and Brazil attacked it as a scandal.
    Eça's own 1876 revision went largely unnoticed. Only after
    [[work:eca-de-queiros/o-primo-basilio|O Primo Basílio]] made him famous in
    1878 did he return to the book and produce the definitive 1880 text that
    is read and translated today - the version most readers meet was in fact
    its third.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/O_Crime_do_Padre_Amaro"
    - "https://pt.wikipedia.org/wiki/O_Crime_do_Padre_Amaro"

- id: eca-de-queiros-primo-basilio-machado-critique-1878
  date: 1878
  title: Machado de Assis dissents from Brazil, and Brazil turns on Machado
  scope: culture
  reach: franchise
  impact: med
  description: >
    Portuguese critics greeted
    [[work:eca-de-queiros/o-primo-basilio|O Primo Basílio]] as a landmark:
    Teófilo Braga ranked its craft with Balzac, Flaubert and Zola, and Guerra
    Junqueiro placed Eça beside Balzac outright. From Rio de Janeiro, Machado
    de Assis publicly disagreed. In an 1878 essay he argued the plot's central
    device (a blackmailing maid who happens to intercept the incriminating
    letters) was too contrived to earn the heroine's death, warned that Eça's
    "intense and complete" realism curdled into sensationalism, and, in
    passing, repeated the charge that O Crime do Padre Amaro imitated Zola.
    The essay cost Machado standing with fellow Brazilian critics who had
    already embraced Eça, and is still cited as the moment Brazil's greatest
    novelist measured his own emerging realism against Portugal's and found
    a real disagreement, not a courtesy.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/O_Primo_Bas%C3%ADlio"
    - "https://pt.wikipedia.org/wiki/Machado_de_Assis"

- id: eca-de-queiros-1925-posthumous-wave
  date: 1925
  title: A quarter-century in a drawer, three books in one year
  scope: industry
  reach: franchise
  impact: med
  description: >
    Twenty-five years after Eça's death, three very different manuscripts
    reached print in the same year:
    [[work:eca-de-queiros/alves-e-companhia|Alves & Companhia]] (written 1884),
    [[work:eca-de-queiros/o-conde-de-abranhos|O Conde de Abranhos]] (written
    1879) and [[work:eca-de-queiros/a-capital|A Capital]], the unfinished
    novel his son José Maria completed for publication. The same year also
    saw
    [[work:eca-de-queiros/correspondencia|Correspondência]], 84 of his
    letters selected and prefaced by that same son. It is the single biggest
    cluster in the posthumous bibliography, the moment Eça's own family
    finished emptying the drawer rather than a coincidence of unrelated
    editors.
  spoilerAfter: null
  sources:
    - "https://pt.wikipedia.org/wiki/Alves_%26_Companhia"
    - "https://pt.wikipedia.org/wiki/O_Conde_de_Abranhos"
    - "https://pt.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s"
    - "https://en.wikipedia.org/wiki/E%C3%A7a_de_Queir%C3%B3s"

- id: eca-de-queiros-tragedia-rua-das-flores-1980
  date: 1980
  dateRange: "1980-1982"
  title: The novel Eça himself never dared publish reaches print, then stage and screen
  scope: culture
  reach: franchise
  impact: med
  description: >
    Eça wrote [[work:eca-de-queiros/a-tragedia-da-rua-das-flores|A Tragédia da
    Rua das Flores]] in 1877-78, before O Crime do Padre Amaro even reached
    print, and left it in manuscript for the rest of his life; its plot, a
    young man's affair with a woman who turns out to be the mother who
    abandoned him as a baby, is the likeliest reason he never sent it to a
    publisher himself. It finally appeared in book form in 1980, eighty years
    after his death, and was popular enough to be adapted for Portuguese
    television within a year (1981, starring Lourdes Norberto and Antonino
    Solmer) and for the stage the year after (1982, with Simone de Oliveira).
    A novel too dangerous for its own author's lifetime found an eager
    audience within two years of finally being allowed to exist.
  spoilerAfter: eca-de-queiros/a-tragedia-da-rua-das-flores
  sources:
    - "https://pt.wikipedia.org/wiki/A_Trag%C3%A9dia_da_Rua_das_Flores"

- id: eca-de-queiros-jull-costa-maias-2007
  date: 2007
  title: A new English Os Maias, and Saramago calls it Portugal's greatest
  scope: industry
  reach: franchise
  impact: med
  description: >
    Margaret Jull Costa's English translation of
    [[work:eca-de-queiros/os-maias|Os Maias]] was published by Dedalus in
    2007, one of what became seven Eça retranslations in Dedalus's
    Portuguese-classics programme (Cousin Bazilio in 2003 to The City and the
    Mountains in 2008) - the reason most of Eça's lifetime novels are
    currently in print in English at all. José Saramago described the
    original novel as "the greatest book by Portugal's greatest novelist":
    one Portuguese Nobel laureate, working in the same realist tradition,
    putting his name behind the writer who preceded him.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Margaret_Jull_Costa"
