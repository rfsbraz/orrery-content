# Concrete published editions, sparse by design (SCHEMA.md: "Sparse is fine").
# Eleven current, in-print editions across eleven of the wing's nine lifetime
# and two earliest-posthumous works - every ISBN below resolves on
# OpenLibrary against the title and publisher recorded here, each checked
# individually rather than taken on an aggregator's word. The other twenty,
# mostly scholarly critical-edition volumes with no discoverable
# individual ISBN, carry none; the app falls back to search links and a
# typographic cover for those; see docs/SCHEMA.md's "expect low coverage
# outside the anglophone canon, and do not pad it."
#
# No coverUrl on any entry: SCHEMA.md's image-rights rule requires looking at
# a candidate image for a burned-in watermark before writing it down (the
# João Tordo wing found 4 of 6 OpenLibrary covers it checked were retailer
# scrapes with a bookseller's watermark on them), and no candidate here has
# been inspected against that bar. The app degrades to a typographic cover by
# design for every slot left empty.
#
# TRANSLATOR CREDITS ARE PER-EDITION, NOT ASSUMED. Margaret Jull Costa is
# credited on the three Dedalus editions below where a source names her
# directly (Dedalus's own book pages); the modern Dedalus reissues of Eça
# are overwhelmingly her work as a body of translation, but this file credits
# only the specific titles checked rather than extending that pattern to the
# rest by inference.

