# FRANCHISE-SPECIFIC events only. Author-LIFE events live on the author
# entity (content/authors/harlan-coben.yaml). Shared world/culture events
# live in content/events/global.yaml (none claimed here yet - unresearched).
#
# Eleven entries, 1995-2025, weighted toward the screen-adaptation decade
# that a bibliography-only reading of this shelf otherwise leaves silent:
# nothing in the record marks 2011-2014 or 2021-2023 specifically (Stay
# Close, Six Years, Missing You and the run after the Netflix deal's
# extension landed without incident), but 2015 onward is the busiest
# adaptation run of the career and is not quiet at all. The author's own
# 1996-97 triple-award milestone lives on the author entity
# (content/authors/harlan-coben.yaml), not here, since it belongs to Coben
# rather than to any one book.
#
# Rejected: the 2023 Mystery Writers of Japan nomination for the Japanese
# edition of Win - a foreign nomination, not a win, with no mark on the book;
# the 2013 Little League Baseball Hall of Excellence induction and the
# Amherst basketball hall of fame - personal honors unconnected to the
# shelf; the 2022 Amazon Studios announcement for a Shelter series and the
# 2026 Netflix deal extension covering Myron Bolitar - both real but without
# a premiere yet to anchor a dated event to; the 2003 Bookspan "International
# Book of the Month" naming for No Second Chance - a marketing credit, not a
# rupture; Fade Away's 1997 Anthony/Barry/Dilys nominations (it won the Edgar
# and Shamus that year, already carried by the triple-award lifeEvent) and
# Back Spin's 1998 Barry Award win with Dilys and Shamus nominations - a
# secondary genre award with no mark on the book itself; the Vermeil Medal of
# Honor from the Mayor of Paris - a real civic honor with no citable date
# found and no mark on any book.

- id: coben-win-modeled-on-roommate-1995
  date: 1995
  title: Win, modeled on a real roommate
  scope: culture
  reach: franchise
  impact: low
  description: >
    Windsor Horne Lockwood III, Myron's wealthy, dangerous best friend,
    debuts alongside him in [[work:harlan-coben/deal-breaker|Deal Breaker]].
    Coben has said Win is "loosely based on my college roommate, though in
    real life, he is less, er, psychotic than his fictional counterpart." The
    character outlasts the joke: 26 years and 11 more Myron novels later, Win
    gets a standalone of his own,
    [[work:harlan-coben/win|Win]] (2021).
  spoilerAfter: null
  sources:
    - "https://www.bookbrowse.com/author_interviews/full/index.cfm/author_number/647/harlan-coben"
    - "https://en.wikipedia.org/wiki/Myron_Bolitar_series"

- id: coben-tell-no-one-standalone-2001
  date: 2001
  title: The standalone that would not work for Myron
  scope: culture
  reach: franchise
  impact: med
  description: >
    After six Myron Bolitar novels, Coben has said he "came up with a great
    idea that simply would not work for Myron" and wrote
    [[work:harlan-coben/tell-no-one|Tell No One]] as his first standalone
    since the series began. It became, in his own account, "the most
    decorated thriller of the year," and opened the standalone strand that
    now makes up 18 of this shelf's 44 works, outnumbering every series
    combined.
  spoilerAfter: null
  sources:
    - "https://www.harlancoben.com/bio/"
    - "https://en.wikipedia.org/wiki/Harlan_Coben"

- id: coben-tell-no-one-cesars-2006
  date: 2006
  title: "Ne le dis à personne sweeps the Césars"
  scope: culture
  reach: franchise
  impact: med
  description: >
    Guillaume Canet's French film of
    [[work:harlan-coben/tell-no-one|Tell No One]] opens in France on 1
    November 2006, becomes the year's top-grossing foreign-language release
    in the US, wins the Lumière for best picture, and takes four of its nine
    César nominations (best director, actor, editing and music) at the 2007
    ceremony. It is the first proof, well before Netflix, that a Coben plot
    travels intact into another language and wins on its own terms rather
    than as an American import.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Tell_No_One"
    - "https://www.harlancoben.com/bio/"

- id: coben-hold-tight-bestseller-2008
  date: 2008-04-15
  title: His first number-one debut
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:harlan-coben/hold-tight|Hold Tight]] debuts simultaneously as a
    No. 1 New York Times best seller and a Times of London best seller on 15
    April 2008, Coben's ninth standalone and his first book to open at the
    top rather than climb there. From here his releases are launched, not
    just published.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Hold_Tight_(novel)"
    - "https://en.wikipedia.org/wiki/Harlan_Coben"

- id: coben-live-wire-rba-prize-2010
  date: 2010
  title: A Spanish crime prize, and a first sign of scale abroad
  scope: culture
  reach: franchise
  impact: low
  description: >
    [[work:harlan-coben/live-wire|Live Wire]] wins Spain's RBA Prize for
    Crime Writing, worth 125,000 euros, one of the largest purses in crime
    fiction and evidence of a foreign readership as large as the domestic
    one, years before any European Netflix production existed.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Harlan_Coben"
    - "https://www.harlancoben.com/bio/"

- id: coben-no-second-chance-tv-2015
  date: 2015-10-15
  title: The first non-Tell-No-One adaptation
  scope: industry
  reach: franchise
  impact: low
  description: >
    Une chance de trop, a six-part French miniseries based on Coben's 2003
    novel [[work:harlan-coben/no-second-chance|No Second Chance]], airs on
    TF1 from 15 October 2015 with Coben as showrunner and executive
    producer. It is the first screen adaptation of a Coben novel besides
    Tell No One in nine years, and the direct lead-in to The Five and Safe.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Harlan_Coben"
    - "https://www.harlancoben.com/bio/"

- id: coben-the-five-tv-debut-2016
  date: 2016-04-15
  title: His first series that isn't adapted from a book
  scope: industry
  reach: franchise
  impact: med
  description: >
    The Five premieres on Sky1 on 15 April 2016: an idea Coben had been
    turning over for a novel with four leads, which he had "never written,"
    became instead his first wholly original television series, created and
    executive-produced by him rather than adapted from any existing book. "I
    wouldn't leave novel writing," he said at the time, "but I love
    storytelling and I really do think we've been living in a golden age of
    television." It is the pilot run for the showrunner role the Netflix
    deal formalizes two years later.
  spoilerAfter: null
  sources:
    - "https://en.wikipedia.org/wiki/Harlan_Coben"
    - "https://variety.com/2016/tv/spotlight/harlan-coben-interview-the-five-sky-1201742200/"

- id: coben-netflix-overall-deal-2018
  date: 2018
  title: The Netflix era begins
  scope: industry
  reach: franchise
  impact: high
  description: >
    Safe, Coben's second original series, premieres on Netflix in 190
    countries on 10 May 2018. On the strength of it, Netflix signs him that
    August to an exclusive five-year deal for 14 of his novels, to be
    developed as series and films worldwide with Coben as executive producer
    on every one. It is the single deal that turns a backlist of American
    standalone thrillers into an ongoing international slate - by 2026 twelve
    series across six languages - and it is why nearly every later standalone
    on this shelf now arrives with a Netflix adaptation already attached or
    assumed.
  spoilerAfter: null
  sources:
    - "https://deadline.com/2018/08/harlan-coben-overall-deal-with-netflix-tv-series-movie-adaptations-books-1202452628/"
    - "https://en.wikipedia.org/wiki/Harlan_Coben"

- id: coben-fool-me-once-global-hit-2024
  date: 2024
  title: Fool Me Once becomes his biggest adaptation yet
  scope: culture
  reach: franchise
  impact: med
  description: >
    The eight-episode Netflix adaptation of
    [[work:harlan-coben/fool-me-once|Fool Me Once]] debuts 1 January 2024,
    tops Netflix's own Global Top 10 in its first week (37.1 million views,
    238.2 million hours watched) and goes on to 98 million views in its
    first three months, the most-watched of any Coben adaptation to date.
    Its reach directly reshapes the shelf: Sami Kierce, a minor figure in the
    novel, is expanded for the screen into a lead role, and that version of
    the character is who [[work:harlan-coben/nobodys-fool|Nobody's Fool]]
    (2025) actually continues.
  spoilerAfter: null
  sources:
    - "https://screenrant.com/fool-me-once-netflix-viewership-chart-success/"
    - "https://www.tvinsider.com/1276864/harlan-coben-netflix-shows-most-watched/"

- id: coben-witherspoon-collaboration-announced-2024
  date: 2024-10-03
  title: Reese Witherspoon's idea, plotted and written together
  scope: industry
  reach: franchise
  impact: low
  description: >
    Grand Central Publishing announces on 3 October 2024 that Coben will
    co-write a suspense novel with Reese Witherspoon, her first as a
    novelist and the first true co-authorship of his career. The two built
    the concept and characters together over months before he wrote the
    chapters; it was published in 2025 as
    [[work:harlan-coben/gone-before-goodbye|Gone Before Goodbye]].
  spoilerAfter: null
  sources:
    - "https://www.hachettebookgroup.com/hachette-book-group-news/reese-witherspoon-and-harlan-coben-to-write-first-collaborative-suspense-novel/"
    - "https://www.npr.org/2025/10/14/nx-s1-5137288/for-reese-witherspoon-and-harlan-coben-new-thriller-was-a-true-collaboration"

- id: coben-nobodys-fool-tv-inspired-2025
  date: 2025
  title: A sequel to the show, not the book
  scope: industry
  reach: franchise
  impact: med
  description: >
    Coben has said [[work:harlan-coben/nobodys-fool|Nobody's Fool]] is
    "almost more of a sequel to the TV series than the book," since Sami
    Kierce and his wife "weren't major characters in the Fool Me Once book"
    and only became central through the Netflix adaptation's expansion of
    the role. "I don't know any time that's ever happened," he told The
    Hollywood Reporter. "Certainly, it hasn't happened in my career." It
    corrects the assumption a "sequel" label invites: the book this one
    follows from is the screen, not the page.
  spoilerAfter: null
  sources:
    - "https://www.hollywoodreporter.com/tv/tv-news/harlan-coben-novel-nobodys-fool-sequel-fool-me-once-series-1236171179/"
