# Editions of Harlan Coben: 42 English (en) editions over 38 of 44 works, plus
# 29 Portuguese (pt-PT) editions over 28 of 44 works (one work, Deal Breaker,
# carries two rival pt-PT translations - see below).
#
# PUBLISHING HISTORY, US side, confirmed edition by edition rather than
# assumed from the brief: Dell published the Myron Bolitar novels in mass-
# market paperback from Deal Breaker (1995) through One False Move (1999);
# Delacorte Press picked up the hardcover for The Final Detail (1999) and
# Darkest Fear (2000); Dutton became Coben's hardcover publisher from The
# Innocent (2005) onward, running through Don't Let Go (2017); Grand Central
# Publishing has published every novel since Run Away (2019), confirmed on
# each entry below by its own OpenLibrary record rather than inferred from
# neighbouring years. Play Dead (1990) and Miracle Cure (1991) predate this
# run entirely and their true first editions could not be located in this
# pass (see the note on each entry); the current Signet reissues are recorded
# instead, which is the edition a reader can actually buy.
#
# SOURCING (en). Every ISBN is taken from its own OpenLibrary edition record
# (openlibrary.org/isbn/<isbn>.json or the equivalent api/books lookup, cited
# per entry), not from a search snippet. Records vary in richness: Deal
# Breaker/Drop Shot/Fade Away/Back Spin/One False Move (Dell mass-market,
# 1995-1999) are richly catalogued (Library of Congress MARC data, series
# numbering). Hold Tight is recorded under its actual Dutton hardcover ISBN
# (9780525950608), not the unrelated non-trade-prefix ISBN 9781436203838 that
# a title-only search surfaces alongside it. The Final Detail and Darkest Fear
# are recorded under their Delacorte Press hardcover ISBNs (which carry full
# LCCN and publisher data), not the thinner Dell paperback stub records that
# share the same OpenLibrary works.
#
# SOURCING (pt-PT). Editorial Presença has published Coben continuously in
# Portugal since 2003 (Não Contes a Ninguém) and is his only Portuguese
# publisher; Círculo de Leitores (a book club) and, once, Temas e Debates also
# published a handful of the early Myron Bolitar novels under rival
# translations in the 2000s. Every pt-PT entry is corroborated by the
# Biblioteca Nacional de Portugal catalogue (catalogo.bnportugal.gov.pt,
# browser-UA reachable per docs/CURATION.md), which gives the ISBN, the
# "Tít. orig." field used to match every entry below to its English work
# (never by title alone), the translator, and the legal-deposit year. The
# eleven entries currently sold via presenca.pt (Grupo Editorial Presença's
# own storefront, its Shopify products.json feed) are double-sourced against
# that storefront besides. One entry, Gone Before Goodbye ("Antes de
# Desaparecer", published Nov 2025), rests on the Presença storefront alone:
# it postdates the newest Biblioteca Nacional record found for Coben under any
# ISBN, and carries no translator credit in Presença's own listing either.
#
# A REGISTRY CORRECTION THE RETAILER'S OWN PAGE DID NOT CARRY. Presença's
# live product page for "Um Estranho Caso de Culpa" (its current ISBN,
# 9789722367271) states "Data de Lançamento: 4/2007" in its own structured
# details - but the Biblioteca Nacional record for that exact ISBN gives
# "EDIÇÃO: 3a ed ... PUBLICAÇÃO: Barcarena: Presença, 2021", i.e. this is the
# THIRD printing, from 2021, not the first from 2007 as the retailer's stale
# release-date field implies. The 2007 date belongs to the first edition, a
# different ISBN (9789722337380, also below, translator and title identical).
# The 2021 legal-deposit year is what is recorded as this entry's `year`.
#
# DEAL BREAKER HAS TWO RIVAL PORTUGUESE TRANSLATIONS, not a duplicate-ISBN
# error: Círculo de Leitores (a book-club imprint) published it in 2004 as
# "A Última Vez que a Viram" (a non-literal title - "The Last Time She Was
# Seen"), translated by Eduardo Saló; Temas e Debates published an entirely
# separate 2008 translation as "Uma Vida em Jogo" ("A Life at Stake"), also
# by Eduardo Saló. Both are recorded, since both are real, different objects
# a completionist might already own; neither is currently in print.
#
# DROP SHOT was translated once (Helena César, as "Atirar a Matar" - "To Shoot
# to Kill") and reissued under the same title and translator by Temas e
# Debates in 2008; only the 2008 Temas e Debates ISBN is recorded, being the
# more recent of the same translation, with the 2004 Círculo de Leitores
# printing (isbn13 9789724232720) noted rather than duplicated.
#
# NON-LITERAL PORTUGUESE TITLES, matched by "Tít. orig." and synopsis, never
# by guessing from the English title:
#   No Second Chance      -> Na Pista de um Rapto      (On the Trail of an Abduction)
#   Deal Breaker (CdL)     -> A Última Vez que a Viram  (The Last Time She Was Seen)
#   Deal Breaker (TeD)     -> Uma Vida em Jogo          (A Life at Stake)
#   Drop Shot              -> Atirar a Matar            (To Shoot to Kill)
#   Fade Away              -> O Atleta Desaparecido     (The Missing Athlete)
#   One False Move         -> Um Passo em Falso         (literal)
#   The Innocent           -> Um Estranho Caso de Culpa (A Strange Case of Guilt)
#   Hold Tight             -> Invasão de Privacidade    (Invasion of Privacy)
#   Back Spin              -> Tacada Mortal             (Fatal Shot/Stroke)
#   The Final Detail       -> Perigo Final              (Final Danger)
#   Caught                 -> Falta de Provas           (Lack of Evidence)
#   Don't Let Go           -> Não Desistas               (Don't Give Up)
# The rest are literal or near-literal (Six Years -> Seis Anos Depois, "Six
# Years Later"; Missing You -> Sinto a Tua Falta, "I Miss You"; etc.) and are
# not listed again here.
#
# SIX WORKS CHECKED AND FOUND ABSENT IN PORTUGUESE, not merely unsearched:
# Darkest Fear, Live Wire and Home (all Myron Bolitar novels) return no hit
# anywhere in a 36-record Biblioteca Nacional author-name sweep for "Coben,
# Harlan", which is otherwise complete enough to catch every other Myron
# Bolitar and standalone title including two rival Deal Breaker translations;
# Stay Close likewise returns no Portuguese (only a Brazilian Touché Livros
# edition, "Fique Comigo" - excluded per the pt-BR/pt-PT rule, docs/CURATION.md
# and docs/SCHEMA.md); the entire Mickey Bolitar YA trilogy (Shelter, Seconds
# Away, Found) has no Portuguese edition at all. Play Dead and Miracle Cure,
# Coben's pre-Myron 1990-1991 novels, were never picked up by a Portuguese
# publisher either. Nobody's Fool (2025) is too recent for a Portuguese
# edition to exist yet. The four apocrypha entries and the two forthcoming/
# English-only extended works (The Magical Fantastical Fridge, Plot Twist)
# have no Portuguese edition and none is expected.
#
# ISBN-10 CONVERSIONS. Six of the older Portuguese editions (Círculo de
# Leitores and early Presença printings, 2004-2005) predate 2007 and the
# Biblioteca Nacional holds them as ISBN-10s; each was converted by dropping
# the ISBN-10 check digit, prefixing 978, and recomputing the check digit from
# scratch, flagged on each such entry.
#
# APOCRYPHA. Three of the four apocrypha works get an edition here, since
# each IS its own anthology as a published object (the same reasoning as this
# catalogue's other anthology-editor entries, e.g. Karin Slaughter's Like a
# Charm): Malice Domestic 7, Mystery Writers of America Presents Death Do Us
# Part, and The Best American Mystery Stories 2011. The fourth, The Rise and
# Fall of Super D, has no ISBN of its own by design - it was never sold
# separately from The Innocent's US hardcover (works.yaml's own sourcing) -
# and is not recorded here.

# =============================================================================
# English (en) - 42 editions, 38 of 44 works
# =============================================================================

