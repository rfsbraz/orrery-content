# Creative periods. There are none on record.
#
# No critic, reference work, settled fan consensus, or the author himself
# divides this career into named creative periods with recognisable names and
# boundary years, the way "the Golden Age of detective fiction" or "the Bachman
# years" are received. The author's own site lists his novels in a single
# chronological run and names no phases; the reading-order reference sites do
# the same, sorting by series and publication date. The two fullest career
# essays reached name no dated periods either: NoirFest's survey ("Tell
# Everyone. The work and worlds of Harlan Coben",
# https://www.noirfest.com/en/homeeng/tell-everyone-the-work-and-worlds-of-harlan-coben-eng/)
# runs under narrative section headers ("Begin at the Beginning", "Myron and
# More", "Beyond Bolitar") that carry no years and are organisation, not a
# periodisation; Martin Cid Magazine
# (https://www.martincid.com/people/harlan-coben/) names only a single "most
# recent phase" of expansion into adaptation and collaboration, and gives it no
# start year.
#
# The one genuinely received turning point is not a period boundary. Tell No One
# (2001) is widely told as Coben's breakout, the deliberate break from Myron to
# a standalone that reached a far wider audience and, in NoirFest's words,
# "marked a significant change of tone". That is a shift in a book's fortunes
# and in his reception, recorded in this wing as an aura event, not a line that
# cuts the shelf: nothing before it is a distinct named period and nothing after
# it is either.
#
# A whole-career periodisation by publication chronology fails on the record
# itself, not only on sourcing: the series and the standalones run concurrently,
# not in sequence. Myron Bolitar novels appear from Deal Breaker (1995) to Think
# Twice (2024); the standalones run from Play Dead (1990) to 2025; and after Tell
# No One, five further Myron novels (Promise Me 2006 through Think Twice 2024)
# interleave with the standalones, joined along the way by the Mickey Bolitar YA
# (2011-2014), Wilde (2020-2022), Win (2021) and Sami Kierce (2016-2025). The
# same essay that marks the 2001 pivot says so plainly: Coben "has returned to
# his favourite character, Myron Bolitar, throughout these decades, with new
# instalments interspersing the standalone novels" (NoirFest, above). An era
# renders full-bleed across the wing's whole timeline; a "standalone era from
# 2001" would render that plate over five concurrent Myron novels it does not
# describe.
#
# The 2018 Netflix overall deal is a real rupture in how the work reaches
# audiences, recorded here as the wing's highest-impact event, but it is a fact
# about adaptation, not a named creative period of the novels: no source
# periodises the books at 2018, and the output after it continues the same
# braided pattern (Wilde, Win, the Witherspoon co-authorship, the memoir).
#
# eras: [] is the honest record of a career no one has divided into named
# periods, including its author. Searched in English, his working language.
[]
