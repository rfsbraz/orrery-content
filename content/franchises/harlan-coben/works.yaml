# Bibliography (works) - IDs are STABLE and permanent (user data references
# them). Dates are year-precision (docs/SCHEMA.md). The default reading order
# (all works in publication order) is DERIVED from this file.
#
# Every title and year below is corroborated by two independent primary
# sources that agree exactly: Wikipedia's own "Published works" table
# (fetched directly, not summarised - a summarised pass of the same article
# scrambled Home and Think Twice's years against each other, caught by
# cross-checking the raw table) and the novel list on harlancoben.com, the
# author's own site. 39 works of fiction plus the forthcoming nonfiction
# memoir Plot Twist, 40 total.
#
# SUBSERIES follow the grouping both of those sources use, not an invented
# one: Myron Bolitar (the original series), Mickey Bolitar (Myron's nephew,
# YA spin-off), Sami Kierce (introduced as a minor character in Fool Me Once,
# the connective thread the Hollywood Reporter's own headline names for
# Nobody's Fool), Wilde, and Windsor Horne Lockwood III (Myron's best friend
# Win, spun off into his own novel). All five subseries share Myron Bolitar's
# continuity and recurring cast; none is catalogued as a separate wing (a wing
# is the author's complete work, not one universe within it - see
# franchise.yaml).
#
# CANON TIER is a publication-kind judgment, not a quality one (SCHEMA.md).
# The 18 standalone thrillers are core: they dominate this bibliography by
# volume and are exactly as central to Coben's shelf as any series entry, per
# his own site and Wikipedia's even-handed treatment of both. (Wikipedia's own
# "Standalone novels" row counts 19, folding in The Magical Fantastical Fridge;
# this file gives the picture book its own section below, so 18 remain here.)
# The Mickey Bolitar trilogy is extended: genuinely his and set in the same
# continuity, but a YA-imprint spin-off rather than the adult-thriller spine
# every other subseries shares. The Magical Fantastical Fridge (2016) is
# extended: an illustrated children's picture book (Dial, illustrated by Leah
# Tinari), a different genre and audience entirely from the thrillers around
# it. Plot Twist (2026, forthcoming) is extended: a nonfiction memoir on
# craft, not a novel.
#
# GONE BEFORE GOODBYE (2025) is a genuine co-authorship, not a contribution:
# Reese Witherspoon originated the concept and did much of the research,
# Coben plotted the novel's key moments and wrote the chapters (Wikipedia,
# "Background" section, citing Witherspoon's own account) - authorRole:
# co-author records that honestly rather than filing it as a solo work or
# leaving it out of a completionist bibliography.
#
# APOCRYPHA (4, 1998-2011, at the end of this file): a novel-only sweep of
# Coben's own site and Wikipedia's "Published works" table misses work filed
# under an anthology's own title rather than his. Two anthologies he edited
# each also carry an original piece of his own writing (a story, an
# introduction); one further story appeared under someone else's anthology;
# one more is a short story exclusive to a single hardcover printing of The
# Innocent. Checked and excluded: Coben's own "Essays and Shorts" page lists
# several personal essays and opinion columns (New York Times, Bloomberg,
# Parade, the Newark Star-Ledger) including "The Key to My Father" (NYT,
# 2003) - all periodical pieces never gathered into a book, the same
# reasoning that excludes uncollected periodical work in this catalogue's
# other author wings.

