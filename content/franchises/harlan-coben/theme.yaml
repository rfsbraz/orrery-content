# Branding for the Harlan Coben wing (see docs/SCHEMA.md#themeyaml). Checked
# against every existing wing before settling this palette.
#
# A warm porch-light amber was the obvious first reach for a suburban-dusk
# register, and it is ruled out on sight: it lands a few hex digits from Jim
# Butcher's own "warm sodium-amber - streetlamp glow" (#d98a3d), this
# catalogue's other after-dark-artificial-light accent, and gold/brass
# already belongs to four wings (Sanderson, Jordan, Peixoto, Pratchett) -
# a fifth would make the family a crowd. A blue-grey near-black ground reads
# just as naturally for a cool suburban dusk, and is ruled out for the same
# reason: it sits almost on top of Joao Tordo's Atlantic blue-grey
# (bg #141a1e, surface #1b232a) and, more loosely, Chuck Palahniuk's cold
# clinical blue-grey. What neither collision touches: a cool, low-chroma
# teal-grey ground (Tana French's peaty green-grey and Tordo/Palahniuk's
# blue-grey both sit fifty-plus degrees of hue away) and a cul-de-sac
# bug-light yellow accent - the actual yellow bulb sold to keep moths off a
# suburban porch, not a streetlamp's brass sodium glow.
preset: cul-de-sac-noir
palette:
  bg: "#111614"       # cool, low-chroma teal-grey near-black - an aluminum-
                      # sided street at the blue hour, neither blue-grey nor
                      # warm
  surface: "#181d1b"  # a shade lifted, for cards
  ink: "#e6ece8"      # pale, cool off-white - high contrast, very readable
  muted: "#8a958f"    # muted sage-grey, for metadata (AA-checked against
                      # surface and bg)
  accent: "#d2c83a"   # cul-de-sac bug-light yellow, for links and markers
                      # only
displayFace: sourceSerif  # from the app's implemented set (fraunces | spectral
                          # | sourceSerif); the plainest of the three, fitting
                          # a bibliography built for speed - eighteen
                          # standalones that open ordinary and pick up pace
                          # rather than linger - already used six times
                          # (Palahniuk, Flynn, Nesbo, Slaughter, Connelly,
                          # Peixoto), each for its own plain-prose reason
signature: beam       # a bold accent rail the works string along. This
                      # catalogue's other crime wings each reach for the
                      # quiet hairline `thread` instead, because each has a
                      # real recurring cast to hang it on: French's
                      # detectives, Slaughter's Sara Linton, Connelly's
                      # unbroken Bosch numbering. Coben's eighteen
                      # standalones, which dominate the shelf, share no such
                      # cast, and a hairline thread here would assert a
                      # connection the books don't have. What they do share
                      # is one repeated engine - an ordinary life, one
                      # impossible fact - and a beam reads as that engine
                      # recurring, not as a plot thread that isn't there.
# ART. This wing's four crime-fiction neighbours each commit to one drawing
# instrument: Gillian Flynn's bone-dry ballpoint copy-desk rule, Michael
# Connelly's flat felt-tip procedural line (loosened only into a haze-smudge
# for the LA basin), Karin Slaughter's warm dip-pen that blots with humidity,
# and Tana French's cold, twice-scratched dry-point doubling. Jim Butcher's
# wing sits closest in register - an ordinary contemporary world with one
# thing wrong in it - and already owns a single hard-edged, evenly-inked
# chiaroscuro line. This wing's line is instead disciplined almost everywhere
# and comes apart in exactly one place - see lineCharacter - which is the
# shape of the shelf itself: a tidy street, and one point where the tidiness
# stops being true.
art:
  emblem:
    object: >
      A basketball hoop and backboard bolted above a closed garage door at
      the top of an empty driveway, the net faded pale grey and slightly
      frayed, no ball anywhere in the frame, no house front beyond the
      garage door and the hoop itself.
    why: >
      Coben's bibliography launches with Myron Bolitar: drafted in the
      first round, eighth overall, by the Boston Celtics, his career ending
      with a shattered knee in a preseason game before he ever played one
      that counted. The same fixture - a hoop and backboard bolted over a
      garage door - is also the single most ordinary marker of the good
      suburban house the eighteen standalone thrillers that dominate the
      shelf keep opening on, before that house turns out to be hiding
      somebody's disappearance. One object carries both halves of the
      bibliography: the series' founding wound, and the standalones'
      recurring, unremarkable setting.
  motifs:
    - a center-hall colonial at the head of a cul-de-sac, its trim, roofline
      and porch light identical to every other house on the curve
    - the basketball hoop and empty driveway itself, backboard and faded
      net, never a figure shooting at it
    - bare New Jersey woods pressing right up to a mowed backyard, the grass
      ending in leaf litter with no fence or marker between them
    - a rec-league ballfield at dusk, bleachers empty, one bag or glove left
      behind on a bench
    - a school pickup line or minivan queue, headlights the only warm points
      in a grey lot, engines still running
    - an unfinished basement rec room, paneling and a pool table, the one
      room in a tidy house that doesn't match the rooms upstairs
    - a chain-link backstop at the edge of a park, a trail entrance beyond
      it leading straight into the treeline
  atmosphere: >
    Ordinary on purpose, and that is the whole unease: manicured, tended,
    a commuter's ten minutes from a train into Manhattan, not the flat open
    farmland horizon of a Midwest small town or the humid rural county of
    the deep South. The hour is early evening rather than deep night - porch
    lights just switching on, sprinklers still ticking, the school buses
    already gone - and nothing in the frame looks wrong. Nothing should. The
    dread here is that a genuinely nice street produced this, not that a
    gothic house or a gathering storm announced it: no haunting, no cosy
    village charm either, a competent, secure, upper-middle-class life with
    one fact in it that does not belong.
  lineCharacter: >
    A fine, even-weight technical line, drafting-pen level and uniform,
    held for everything tended, mown, trimmed or built - lawn edges,
    siding, driveway seams, a hedge line, a porch rail - so the picture
    reads as controlled as the street it depicts. The same pen is allowed
    to come apart in exactly one place per image: the treeline, a hedge
    gap, or whatever edge marks where the tended yard gives way to what
    borders it, where the line tangles into a dense, uneven overworking
    that doubles back on itself rather than resolving into a clean
    contour. One discipline for the manicured foreground, one specific,
    located failure of that discipline at the boundary - never scattered
    through the frame, never at the center of it.
  backgroundTexture: >
    Smooth, evenly-toned stock with almost no visible grain, foxing or
    cockle - closer to a glossy real-estate listing sheet or a homeowners'
    newsletter than to aged case-file paper, damp turf-toned paper or
    newsprint. The one crime wing in the catalogue whose paper is too
    clean for what happens on it.
  accentUse: >
    Bug-light yellow on exactly one element per image, never as a fill: a
    single porch bulb lit above a door, one lit window in an otherwise dark
    house, a school bus's stopped light, or one strand of a chain-link
    fence catching the last of the light.
  avoid:
    - haunted-house gothic staging - fog, ravens, tolling bells, a
      crumbling facade; these houses are well-kept, not decaying
    - cosy-village twee - bunting, tea-and-cake charm, a picket fence
      played for comfort rather than for the unease of everything looking
      fine
    - a missing-person flyer, a face on a poster, or any true-crime/tabloid
      lettering treatment - and no likeness of a real named person in any
      case (docs/VISUAL.md SS3)
    - warm amber or brass streetlamp-glow lighting - Jim Butcher's wing
      already owns that register; this wing's after-dark light is a cooler
      bug-bulb yellow, never sodium-amber
    - basketball jersey numbers, team logos or any real sports-league
      branding on the hoop or elsewhere - the fixture is unmarked suburban
      equipment, not sports memorabilia
    - a "spooky forest" horror-movie treatment of the woods - drawn plain
      and ordinary until the treeline breakdown described in
      lineCharacter, never staged with mist or dead trees for atmosphere
    - the visual identity of Coben's Netflix adaptations (Safe, The
      Stranger, Fool Me Once, The Innocent and others) - their casting,
      title cards or colour grade
notes: >
  A cool, tidy, early-evening register rather than a gothic or humid one:
  low-chroma teal-grey near-black, pale cool ink, one cul-de-sac bug-light
  yellow used only for links and markers - deliberately not the amber/brass
  this catalogue's Jim Butcher wing already owns, and deliberately not the
  blue-grey Atlantic near-black Joao Tordo's wing owns either. The art
  block's one instrument is a basketball hoop over an empty driveway,
  standing for both Myron Bolitar's founding wound and the ordinary house
  every standalone opens on; its line stays disciplined everywhere except
  the one place the tended yard meets what borders it.
