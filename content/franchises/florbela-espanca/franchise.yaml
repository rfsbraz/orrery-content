# A wing spans an author's complete published body of work (standing
# ruling, 2026-07-21). This is a small shelf by that standard: three
# lifetime-or-near-finished poetry collections carry the spine; two
# short-story collections, a compiled early-poems volume, a letters corpus
# and a private diary sit off it, all posthumous. See works.yaml's own
# header for the full sourcing on each.
#
# globalEvents block below: Espanca's 1894-1930 lifetime overlaps three
# shared events - the First World War (1914-1918, when she was 19-24),
# the genre-magazine boom of 1926, and Portuguese press censorship
# (28 May 1926, four years before her death). Ruled: all excluded. Her
# poetry stays intensely private and confessional throughout, never
# engaging politics or war; the pulp-magazine phenomenon was an
# English-language cultural movement unconnected to her work; and while
# censorship was real and Portuguese, it targeted political/social writing,
# not the intimate sonnets she composed. Living through events is not the
# same as writing out of them.
#
# No startHere block. This wing holds too few works for a recommended
# door to mean much on its own; naming one needs a citable basis (a prize,
# a critic's or publisher's own recommendation), which no source checked
# here supplies.
id: florbela-espanca
name: Florbela Espanca
kind: author
description: >
  Portugal's best-known woman poet of the early twentieth century: three
  sonnet collections of increasingly open erotic and confessional voice,
  the last, [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]],
  reaching print weeks after she died by suicide on her own thirty-sixth
  birthday. Fernando Pessoa called her his "twin soul".
authorIds: [florbela-espanca]
themePreset: charred-heath-bloom

# Capabilities are auto-detected from the data (docs/SCHEMA.md); nothing is
# forced here. As scaffolded, the wing carries an 8-work bibliography and a
# 4-lifeEvent author entity - enough for a thin river, not yet enough for a
# wizard (no startHere) or curated editions (no editions.yaml). No
# characters.yaml and no work connections, so the connections map stays
# dark by design.
features: {}

globalEvents:
  include: []
  exclude:
    - world-war-i-1914  # lived through it (age 19-24); no book answers it
    - pulp-magazines-1926  # English-language genre phenomenon; unconnected to her Portuguese sonnets
    - portuguese-censorship-1926  # targeted political/social writing, not her intimate confessional voice

sources:
  - "https://en.wikipedia.org/wiki/Florbela_Espanca"
  - "https://pt.wikipedia.org/wiki/Florbela_Espanca"
  - "https://www.florbelaespanca.uevora.pt/?page_id=11"
