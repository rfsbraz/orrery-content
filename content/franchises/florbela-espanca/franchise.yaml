# A wing spans an author's complete published body of work (standing
# ruling, 2026-07-21). This is a small shelf by that standard: three
# lifetime-or-near-finished poetry collections carry the spine; two
# short-story collections, a compiled early-poems volume, a letters corpus
# and a private diary sit off it, all posthumous. See works.yaml's own
# header for the full sourcing on each.
#
# No globalEvents block. Espanca's 1894-1930 lifetime overlaps the First
# World War (1914-1918, when she was 19-24) and the start of Portuguese
# press censorship (28 May 1926, four years before her death). No source
# checked for this wing connects either to her work: her poetry stays
# intensely private and confessional throughout, never political or
# war-facing.
#
# No startHere block. This wing holds too few works for a recommended
# door to mean much on its own; naming one needs a citable basis (a prize,
# a critic's or publisher's own recommendation), which no source checked
# here supplies.
id: florbela-espanca
name: Florbela Espanca
kind: author
description: >
  Portugal's best-known woman poet of the early twentieth century: three
  sonnet collections of increasingly open erotic and confessional voice,
  the last, [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]],
  reaching print weeks after she died by suicide on her own thirty-sixth
  birthday. Fernando Pessoa called her his "twin soul".
authorIds: [florbela-espanca]
themePreset: charred-heath-bloom

