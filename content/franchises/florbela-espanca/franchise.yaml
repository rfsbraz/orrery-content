# A wing spans an author's complete published body of work (standing
# ruling, 2026-07-21). This is a small shelf by that standard: three
# lifetime-or-near-finished poetry collections carry the spine; two
# short-story collections, a compiled early-poems volume, a letters corpus
# and a private diary sit off it, all posthumous. See works.yaml's own
# header for the full sourcing on each.
#
# globalEvents block below: Espanca's 1894-1930 lifetime overlaps three
# shared events - the First World War (1914-1918, when she was 19-24),
# the genre-magazine boom of 1926, and Portuguese press censorship
# (28 May 1926, four years before her death). Ruled: all excluded. Her
# poetry stays intensely private and confessional throughout, never
# engaging politics or war; the pulp-magazine phenomenon was an
# English-language cultural movement unconnected to her work; and while
# censorship was real and Portuguese, it targeted political/social writing,
# not the intimate sonnets she composed. Living through events is not the
# same as writing out of them.
#
# startHere: one path exists, sourced to Vogue Portugal's book club
# (22 Mar 2022, Pedro Vasconcelos,
# https://www.vogue.pt/voguebookclub-sonetos-florbela-espanca), which calls
# the "Sonetos" compilation - gathering Livro de Mágoas, Livro de Sóror
# Saudade, Charneca em Flor and the posthumous Reliquiae appendix (folded
# into Charneca em Flor's own entry in works.yaml, not catalogued
# separately) - "certamente a melhor forma de iniciar uma relação com a
# poesia de Florbela Espanca" (certainly the best way to begin a
# relationship with Florbela Espanca's poetry), naming this explicitly
# despite the compilation being posthumous rather than one of her own
# books. That maps almost exactly onto the three lifetime-or-near-finished
# poetry collections this catalogue already tiers apart from the
# posthumous prose/letters/notebook miscellany, which is what the
# "the-sonnets" path below points at. No source found recommends Charneca
# em Flor alone as the door, despite it being by far her most-cited and
# most-taught work (RTP Ensina calls it her "obra-prima" with no
# entry-point claim attached) - the one source with an actual entry-point
# recommendation recommends the three collections together, not the
# famous one alone. The official secondary-school curriculum (DGE,
# "Programa e Metas Curriculares de Português - Ensino Secundário", Jan
# 2014) names her only once, in the 11th-year free-reading list, as
# "Espanca, Florbela - Sonetos" - the same generic compiled-sonnets
# reference, naming no single title of hers either.
#
# No order in orders.yaml. The derived default already sequences the
# three poetry collections first by their own publication years (1919,
# 1923, 1931) ahead of the posthumous prose; the only structure a curated
# order could add is breaking Charneca em Flor's tie with three other
# 1931 works (As Máscaras do Destino, Juvenília, Cartas), whose relative
# months this catalogue's sources do not fix. On a nine-work shelf read in
# one sitting either way, that tie-break would be the order's entire
# content - short of the actionable-reason bar.
id: florbela-espanca
name: Florbela Espanca
kind: author
# The description carries no Pessoa "twin soul" line. The poem that
# calls her "irmã gémea da minha", found among Pessoa's papers and long
# published as his, is Eliezer Kamenezki's; the author entity's bio holds
# the correction and its sourcing.
description: >
  Portugal's best-known woman poet of the early twentieth century: three
  sonnet collections of increasingly open erotic and confessional voice,
  written against the reticence expected of a woman poet in 1920s
  Portugal, the last of them,
  [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]], reaching
  print weeks after she died by suicide on her own thirty-sixth birthday.
authorIds: [florbela-espanca]
themePreset: charred-heath-bloom

# Capabilities are auto-detected from the data (docs/SCHEMA.md); nothing is
# forced here. The wing carries a 4-lifeEvent author entity, two startHere
# paths (below) and an editions.yaml covering six of the nine works - enough
# for a thin river, a wizard and edition links. No characters.yaml and no
# work connections, so the connections map stays dark by design.
features: {}

globalEvents:
  include: []
  exclude:
    - world-war-i-1914  # lived through it (age 19-24); no book answers it
    - pulp-magazines-1926  # English-language genre phenomenon; unconnected to her Portuguese sonnets
    - portuguese-censorship-1926  # targeted political/social writing, not her intimate confessional voice

startHere:
  paths:
    # Source: Vogue Portugal book club, 22 Mar 2022, Pedro Vasconcelos -
    # https://www.vogue.pt/voguebookclub-sonetos-florbela-espanca. On the
    # "Sonetos" compilation (Livro de Mágoas + Livro de Sóror Saudade +
    # Charneca em Flor + the posthumous Reliquiae appendix, folded into
    # Charneca em Flor's own works.yaml entry): "é com certeza a melhor
    # forma de iniciar uma relação com a poesia de Florbela Espanca"
    # ("certainly the best way to begin a relationship with Florbela
    # Espanca's poetry"), stated despite the compilation being posthumous
    # rather than one of her own three books.
    - id: the-sonnets
      title: The three sonnet collections
      description: >
        Her sonnets, the spine of the shelf: Livro de Mágoas, Livro de
        Sóror Saudade, and Charneca em Flor, read in the order she wrote
        them. The voice moves from a young law student's grief and
        longing, through a nun's-cell renunciation of the world, to an
        open, sensual rebirth in the last book she finished.
      workIds:
        - florbela-espanca/livro-de-magoas
        - florbela-espanca/livro-de-soror-saudade
        - florbela-espanca/charneca-em-flor
      orderId: null
      fit:
        experience: [new]
        commitment: [taste]
      note: >
        The cost is the posthumous material this leaves out: her two
        short-story collections, her letters, her diary, and the notebook
        of early poems - all real and hers, but shaped for print by
        others after her death rather than by her.
    - id: everything
      title: Everything, in order
      description: >
        All nine works in publication order: the three sonnet collections
        she saw finished or near-finished, then the stories, letters,
        diary and early-poems notebook a series of editors assembled and
        published across the six decades after her death.
      workIds: null
      orderId: default
      fit:
        experience: [completionist]
        commitment: [complete]
      note: >
        The cost is exactly what the sonnets path avoids: the posthumous
        prose sits alongside books she prepared herself, so nothing here
        marks which pages she actually chose to publish and which an
        editor chose for her - only each work's own note does that.

sources:
  - "https://en.wikipedia.org/wiki/Florbela_Espanca"
  - "https://pt.wikipedia.org/wiki/Florbela_Espanca"
  - "https://www.florbelaespanca.uevora.pt/?page_id=11"
