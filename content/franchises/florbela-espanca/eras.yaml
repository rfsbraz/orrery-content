# Creative periods. There are none on record for this poet.
#
# Espanca's working life runs about thirteen years, from the selections she
# was trying and failing to place with publishers in 1916-1917 to her death
# in December 1930, and yields three poetry collections. Portuguese
# criticism treats that output as a single span. It places her in the
# matrix of a "poesia finissecular" crossing decadentist, symbolist and
# neo-romantic characters, "à maneira de um epígono de António Nobre", a
# placement of the work as a whole with no phase and no date attached
# (Infopédia, Porto Editora, citing José Carlos Seabra Pereira's preface to
# Obras Completas de Florbela Espanca, vol. I, Dom Quixote, 1985). Where
# critics trace the movement from the mourning voice of
# [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] to the open
# sensual claim of
# [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]], they describe
# a continuous change of register rather than dated phases: "à medida que
# caminhamos na sua poesia, esta torna-se mais natural e pessoal, com uma
# carga erótica impressiva" (Instituto Camões). The notices and tributes
# printed in the weeks after her death, where a periodisation of a career
# this short would first appear, are catalogued in the University of
# Évora's Florbela bibliography (the earliest of some dozens being Celestino
# David, "Florbela Espanca, poetisa alentejana", Diário de Notícias, 14
# December 1930), collected and digitised for it by Maria Lúcia Dal Farra;
# the catalogue lists them and does not carry their texts.
#
# The two scholarly editions that gather her poetry each divide it, and
# neither division is a periodisation of her career:
#
#   - The Obras Completas (Dom Quixote, 1985-1986) splits the poems into
#     two dated volumes, Poesia (1903-1917) and Poesia (1918-1930), both
#     prefaced by Seabra Pereira, whose vol. II preface is titled "De
#     rastros, com asas (Evolução neo-romântica e pulsão libertadora na
#     poesia de Florbela Espanca)". The same edition splits her letters at a
#     different year, Cartas (1906-1922) and Cartas (1923-1930): the dates
#     divide a corpus into volumes, genre by genre. Read as an era span the
#     poetry split would also misreport this shelf, since the 1903-1917
#     poems reached print in 1931 and 1994, and Charneca em Flor, written
#     well inside 1918-1930, was published in 1931.
#   - The Obras (Presença, 2009-2011), organised and introduced by Seabra
#     Pereira, divides the poetry by authorial sanction rather than by date.
#     Volume I holds the three books "por ela preparados para publicação"
#     and carried to an edition "legitimada pela sua vontade de autora"
#     (Livro de Mágoas, Livro de Sóror Saudade, Charneca em Flor); volume II
#     holds the [[work:florbela-espanca/trocando-olhares|Trocando Olhares]]
#     notebook, the scattered early poems, the posthumous Reliquiae and
#     other dispersos. That is a canon judgement, carried here by each
#     work's canonTier, and it cuts across chronology in both directions.
#
# The one biographical candidate for a boundary is her brother Apeles's
# death in June 1927 (see the author entity), after which her prose turns
# markedly darker:
# [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]] is
# dedicated to him and written out of that loss, and
# [[work:florbela-espanca/o-domino-preto|O Dominó Preto]] is set aside in
# the same stretch. It periodises the two short-story collections, not the
# poetry: her letter of 15 May 1927 already describes Charneca em Flor as
# finished, so her core poetic shelf sits on one side of that date only by
# the accident of when it reached print, not by when it was written. An era
# plated across it would report a shift in her prose as a shift in her
# poetry.
[]
