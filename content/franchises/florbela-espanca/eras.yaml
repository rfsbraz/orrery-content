# Creative periods. There are none on record here.
#
# Espanca's working life runs about thirteen years, 1917-1919 (when she
# first submitted poems for publication and Livro de Mágoas appeared) to her
# death in December 1930 - too short, and with too few books, for a
# publication-year era span to divide into more than one honest piece, and
# no source checked for this scaffold names a periodisation of her poetry at
# all.
#
# The one candidate boundary is her brother Apeles's death in June 1927
# (see the author entity's own lifeEvent), after which her prose turns
# markedly darker - the sources checked for
# [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]]
# and [[work:florbela-espanca/o-domino-preto|O Dominó Preto]] both date that
# shift to exactly this event. But it periodises the two short-story
# collections, not the poetry: a letter of hers already describes
# [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]] as finished in
# May 1927, before the crash, so her core poetic shelf sits on one side of
# the boundary only by the accident of when it reached print, not by when it
# was written. Plating an era across it would misstate that as a shift in
# her poetry when the sources checked here show it as one in her prose only.
[]
