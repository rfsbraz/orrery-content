# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent. `title` is the original Portuguese
# title; `published` is the year of first print (this catalogue's
# convention, see also Luís de Camões's Rimas and Edgar Allan Poe's The
# Poetic Principle), which for seven of the nine works below trails her own
# death by months to sixty-four years.
#
# SHAPE OF THIS WING: a poet's shelf, not a novelist's. Three poetry
# collections carry the spine - two published in her own lifetime, the third
# finished in manuscript but not yet in print when she died. Around them sit
# two short-story collections, two volumes of early poetry assembled by two
# different posthumous editors six decades apart, a letters corpus and a
# private diary, all posthumous, all real and hers, tiered by how
# deliberately she prepared each one for a reader rather than by how the
# stories read. See each entry's own note for its sourcing.
#
# A NOTE ON WHAT "PUBLISHED" MEANS FOR HER: the app's `published` field is
# always the print date, but for Charneca em Flor that print date sits after
# her death, and it would misstate the record to let a bare 1931 imply an
# editor assembled it from scratch afterward. A letter she wrote on 15 May
# 1927 to José Emídio Amaro, director of the Vila Viçosa newspaper D. Nuno,
# already describes the collection as finished; Guido Battelli, the Italian
# visiting professor at Coimbra she corresponded with in her final months,
# offered in July 1930 to find it a publisher, and she lived to review only
# its typographic proofs before her suicide that December (Charneca em Flor,
# pt.wikipedia, citing Maria Lúcia Dal Farra's critical edition "Afinado
# desconcerto" and the CITI literature portal). What Battelli's own
# posthumous editorial hand added - most concretely twenty-eight further
# sonnets folded into a second 1931 edition the same year, published
# separately as an appendix titled "Reliquiae" - is real and distinct from
# the manuscript she herself considered finished; both facts are recorded on
# that work's own entry rather than collapsed into one.
#
# EXCLUDED, sourced mainly to the DGLB (Direção-Geral do Livro) official
# biography (http://livro.dglab.gov.pt) that documents her early working
# titles, cross-checked against the University of Évora's own Florbela
# bibliography, which separately lists all nine works below as
# "bibliografia ativa" and lists none of the following:
#   - "O livro d'ele", "Minha Terra" and "O Meu Amor" - three books she
#     wanted to compile from the notebook now known as
#     [[work:florbela-espanca/trocando-olhares|Trocando Olhares]] (written
#     mostly during her Redondo years, 1915-1917), abandoned as separate
#     projects and never published under these titles in her lifetime.
#   - "Alma de Portugal" - a planned two-part book ("Na Paz" / "Na Guerra")
#     she gave up on.
#   - "Primeiros Passos" (1916) and "Primeiros Versos" (1917) - selections
#     she drew from the "Trocando Olhares" notebook and tried and failed to
#     place with a publisher (the former sent to the critic Raúl Proença for
#     comment); working selections, not published books, and unlike the
#     notebook itself neither ever became one (pt.wikipedia, "Trocando
#     Olhares", citing Dal Farra's "Afinado desconcerto" p.59).
#   - "Claustro das Quimeras" - the working title she had to abandon for
#     [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]]
#     when another author's book of the same name appeared first; not a
#     distinct lost work, an earlier name for a work already catalogued here.
#   - Two single periodical pieces the University of Évora's own Florbela
#     bibliography catalogues by original manuscript research: the poem
#     "Vão orgulho" (Portucale magazine, Jan-Feb 1931) and "Nostalgia"
#     (Portugal Feminino, 31 January 1931, sheet music co-credited to Júlia
#     Oceano Pereira). Each entry credits Maria Lúcia Dal Farra with the
#     "compulsação, recolha e digitalização" (collation, retrieval and
#     digitization) of that specific periodical text, archival-recovery work
#     that argues against either being a plain reprint of material already
#     inside the collections above. Left out here regardless as uncollected
#     single poems rather than books; a periodical poem does not earn its
#     own entry in this catalogue even where it is genuinely uncollected.

- id: florbela-espanca/livro-de-magoas
  title: "Livro de Mágoas"
  authorIds: [florbela-espanca]
  published: 1919
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Her first published book: sonnets written while she was a law student in
    Lisbon in her mid-twenties, already carrying the confessional, often
    anguished voice - grief, longing, a body's desire named directly - that
    would define her work, ahead of the more assured and sensual register of
    her later books.
  note: >
    Published in Lisbon by Tipografia Maurício while Espanca was in her
    third year of law school, the same year she suffered a miscarriage and
    began showing the first signs of the mental and physical illness that
    would recur for the rest of her life. The critic Raúl Proença, with whom
    she corresponded from her manuscript notebook "Trocando Olhares",
    compiled and edited this edition and is recorded as introducing variants
    of his own into her manuscript sonnets.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://pt.wikipedia.org/wiki/Florbela_Espanca"
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
  images:
    # Open Library's own work-level pick (cover_i on OL27628537W) is a
    # generic Project Gutenberg auto-cover (geometric shapes, no jacket
    # art) - this is the Neolivros 2008 edition's cover instead, a real
    # designed jacket for this specific work.
    cover: "https://covers.openlibrary.org/b/id/13778134-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL27628537W"

- id: florbela-espanca/livro-de-soror-saudade
  title: "Livro de Sóror Saudade"
  authorIds: [florbela-espanca]
  published: 1923
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Sonnets written in the years of her second marriage and a further
    miscarriage, taking their title from the invented figure of "Sóror
    Saudade" (Sister Longing) through whom Espanca frames a nun's-cell
    renunciation of the world against the sensual desire the poems keep
    circling back to.
  note: >
    Published in Lisbon by Tipografia A Americana. Drafted under the working
    title "Claustro das Quimeras", which Espanca had to abandon after
    another author published a book of the same name; some sources give the
    even earlier working title "Livro do Nosso Amor". The same year of
    publication, she separated from her second husband, António Guimarães,
    after a further miscarriage.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386"
    - "https://pt.wikipedia.org/wiki/Livro_de_Soror_Saudade"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
  images:
    cover: "https://covers.openlibrary.org/b/id/13008260-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL23292791W"

- id: florbela-espanca/charneca-em-flor
  title: "Charneca em Flor"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: core
  featured: true
  format: poetry-collection
  synopsis: >
    Her most celebrated collection: sonnets of renewal and open sensual
    desire, framed as a rebirth out of the mourning-nun persona of the
    earlier books - "I take off my shroud, my sackcloth, and I am no longer,
    Love, Sóror Saudade... I am the rough heath opening into flower" - that
    critics and readers alike have read as her most autobiographically
    direct and least guarded book.
  note: >
    Published by Livraria Gonçalves of Coimbra in the first days of January
    1931, about a month after Espanca's death. A letter of hers dated 15 May
    1927, addressed to José Emídio Amaro, director of the Vila Viçosa
    newspaper D. Nuno, already describes the collection as complete; she
    could not find a publisher for it until Guido Battelli, an Italian
    visiting professor at Coimbra with whom she corresponded in her final
    months, offered his help in July 1930, and she lived to review only the
    typographic proofs before her suicide that December. Its first edition
    holds fifty-six sonnets; a second edition, issued the same year, adds
    twenty-eight further sonnets Battelli assembled after her death and
    published separately as an appendix under the title "Reliquiae", which
    is real posthumous editorial work distinct from the manuscript she
    herself had already considered finished four years earlier.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://pt.wikipedia.org/wiki/Charneca_em_Flor"
    - "https://pt.wikipedia.org/wiki/Florbela_Espanca"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
  images:
    # Open Library's work-level covers are a Spanish-language anthology
    # ("Charneca en flor [antología esencial]", Editora Regional de
    # Extremadura - wrong language, rejected) and an "Obras Completas"
    # series volume (Estampa) whose cover leads with the omnibus branding.
    # This is a cleaner alternative: the Projecto Adamastor 2013 digital
    # edition (ISBN 9789898698032), a standalone Charneca em Flor cover
    # with a credited cover designer (Ana Ferreira).
    cover: "https://covers.openlibrary.org/b/id/15238864-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL29573269W"

- id: florbela-espanca/as-mascaras-do-destino
  title: "As Máscaras do Destino"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: extended
  format: short-story-collection
  synopsis: >
    Eight short stories written out of her brother Apeles's death in a 1927
    plane crash and dedicated to his memory, the book opening on the
    dedication "A meu Irmão, ao meu querido Morto" (To my Brother, my
    beloved Dead). Death and mourning run through the whole of it, and
    through its titles - "O Aviador", "A Morta", "Os Mortos não Voltam",
    "O Sobrenatural".
  note: >
    Published in Porto by Editora Marânus, dedicated "A meu Irmão, ao meu
    querido Morto" (To my Brother, my beloved Dead). The dedication and the
    finished shape of the collection argue for a manuscript she had
    substantially prepared herself, unlike
    [[work:florbela-espanca/o-domino-preto|O Dominó Preto]]'s unsigned,
    undated drafts; no source checked here names who at Marânus, if anyone
    besides Espanca, organized the final book. A fourth edition (Bertrand,
    1982) carries a preface by novelist Agustina Bessa-Luís.

    The synopsis above stays at the level of the dedication and the table
    of contents, which is where the bookseller copy for the collection also
    stops (Calçada das Letras, 2010, via wook.pt: the book is "totalmente
    dedicada ao seu irmão Apeles... inspirada pela tristeza e dor que a
    perda do irmão causa em Florbela", and names no story's content). The
    story-level summaries in wider circulation do give endings away, and
    two of them are traps: "O Aviador" is a mythic retelling of Apeles's
    own death, and "Os Mortos não Voltam" closes on the position its title
    states rather than against it ("Os mortos não voltam, e é melhor que
    assim seja... Que vergonha se voltassem!"). Neither belongs in a
    reader-facing synopsis. That same wook page also misdates the writing
    to "final de 1917" and Apeles's death to that year; both are 1927.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://pt.wikipedia.org/wiki/As_M%C3%A1scaras_do_Destino"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
  images:
    # Open Library carries two separate work records titled "As máscaras
    # do destino" (OL1680074W and OL37359830W, an uncorrected duplicate);
    # this cover belongs to OL1680074W, whose own description names it
    # "Florbela Espanca's first posthumous book" and whose edition list
    # holds the original 1931 Maranus printing - the jacket photographed
    # here.
    cover: "https://covers.openlibrary.org/b/id/7257887-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL1680074W"

- id: florbela-espanca/juvenilia
  title: "Juvenília"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: apocrypha
  format: poetry-collection
  synopsis: >
    Her scattered early poems, most predating her 1919 debut, gathered into
    a single volume only after her death.
  note: >
    Published by Livraria Gonçalves of Coimbra with a preface by Guido
    Battelli, who also brought out
    [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]] and
    [[work:florbela-espanca/cartas|Cartas]] the same year. A compilation
    assembled and titled by Battelli from dispersed manuscript poems rather
    than a book Espanca herself planned or ordered, which is why it sits
    apart from the three collections she prepared herself.
  sources:
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386"
  # No cover: Open Library's own record for this title (OL1680076W) is a
  # merged "Poems" work bundling the 1949 Juvenilia edition together with
  # unrelated Sonetos and Antologia poética selections under one work id -
  # itself a reason not to trust any cover it carried - and none of its
  # eight catalogued editions has a cover image regardless. Checked by
  # title search and by sweeping the full 44-work author record.

- id: florbela-espanca/cartas
  title: "Cartas"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    Espanca's surviving correspondence, most valuably the letters to Dona
    Júlia Alves and to Guido Battelli from her final months, read since as
    the closest first-person record of her state of mind ahead of her
    suicide.
  note: >
    First reached print the same year as her death, as "Cartas de Florbela
    Espanca (a Dona Júlia Alves e a Guido Battelli)" (Livraria Gonçalves,
    1931). A larger volume followed in 1949 (prefaces by Azinhal Abelho and
    José Emídio Amaro), and the corpus grew further across later scholarly
    editions - two dedicated letters volumes in the 1986 "Obras Completas"
    (Dom Quixote), and further curated selections in 2008 ("Perdidamente")
    and 2012 ("Sempre Tua"), both organized by Maria Lúcia Dal Farra. A
    posthumously and repeatedly re-assembled correspondence rather than a
    single planned book, the same status this catalogue gives Luís de
    Camões's own collected letters.
  sources:
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
    - "https://pt.wikipedia.org/wiki/Charneca_em_Flor"
  images:
    # Open Library files this cover at the work level (OL14987810W) rather
    # than tied to a specific edition; the two catalogued editions on that
    # record are both the 1985/1986 "Obras Completas" Dom Quixote volumes,
    # but the cover art itself (aged paper, cursive title, no Dom Quixote
    # branding) reads as a period design rather than a 1980s one, and its
    # Open Library image id sits in the same numeric run as the 1931
    # Maranus "As Máscaras do Destino" cover - consistent with, but not
    # confirmed as, the 1931 Livraria Gonçalves first edition.
    cover: "https://covers.openlibrary.org/b/id/7257888-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL14987810W"

- id: florbela-espanca/diario-do-ultimo-ano
  title: "Diário do Último Ano"
  authorIds: [florbela-espanca]
  published: 1981
  subseries: null
  canonTier: apocrypha
  format: memoir
  synopsis: >
    The private diary Espanca kept in the last months of her life, after a
    diagnosis of pulmonary edema, alongside two documented suicide attempts
    before her death that December.
  note: >
    Published as "Diário do Último Ano Seguido de um Poema Sem Título",
    fifty-one years after her death, by Bertrand, with a preface by the poet
    Natália Correia. A private record never prepared by Espanca for
    publication, unlike the three lifetime and near-finished poetry
    collections above.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://www.cm-matosinhos.pt/servicos-municipais/cultura/figuras-de-matosinhos/poi/florbela-espanca-1894-1930"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
  # No cover: Open Library's record (OL1680075W) holds two catalogued
  # editions of the 1981 Bertrand facsimile, neither carrying a cover
  # image. Checked by title search and by sweeping the full author record.

- id: florbela-espanca/o-domino-preto
  title: "O Dominó Preto"
  authorIds: [florbela-espanca]
  published: 1982
  subseries: null
  canonTier: apocrypha
  format: short-story-collection
  synopsis: >
    Six short stories, lighter in tone than
    [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]],
    written while Espanca was also translating French novels for money and
    had turned away from poetry for a time.
  note: >
    Espanca began assembling this collection around 1927, intending to
    publish it in October 1928, then set the project aside; the surviving
    manuscript of one story, "Mulher de Perdição", is undated and unsigned
    (unlike every other story she signed) and carries her own dismissive
    note calling the pieces "Primeiros ensaios (coisas para aproveitar) ou
    antes, para não aproveitar... Tolices!" (First attempts, things to make
    use of, or rather, not to... Nonsense!). Publication was delayed a
    further fifty years by a dispute over the rights, reaching print only in
    1982 (Livraria Bertrand, Lisbon), with a preface by Y. K. Centeno.
  sources:
    - "https://pt.wikipedia.org/wiki/O_Domin%C3%B3_Preto"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
  images:
    cover: "https://covers.openlibrary.org/b/id/13126471-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL1680068W"

- id: florbela-espanca/trocando-olhares
  title: "Trocando Olhares"
  authorIds: [florbela-espanca]
  published: 1994
  subseries: null
  canonTier: apocrypha
  format: poetry-collection
  synopsis: >
    Her earliest surviving poems and three short stories, written in Redondo
    between 1915 and 1917 and kept in a single manuscript notebook she never
    published in this shape, the source she drew on for two failed
    publishing attempts and for her first two books, printed whole only in
    this 1994 scholarly edition.
  note: >
    The manuscript (32.2 x 11 cm, hard cover, forty-nine leaves, held today
    in her archive at the Biblioteca Nacional de Lisboa) is the notebook
    Espanca began filling in mid-1916 while living in Redondo, drawing on
    pieces written from 1915 and completing it with later work. She drew on
    it again for the unpublished selections "Primeiros Passos" (1916) and
    "Primeiros Versos" (1917), and beyond those for
    [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] and
    [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]]
    themselves. Unlike those two published books, the notebook's own poems
    and stories reached print only decades later, as "Trocando Olhares"
    (Imprensa Nacional-Casa da Moeda, 1994, 346 p., ISBN 972-27-0751-5),
    with an introductory study, text establishment and notes by Maria Lúcia
    Dal Farra; a trade reissue followed in 2009 (Martin Claret, São Paulo).
    Catalogued here on the same footing as
    [[work:florbela-espanca/cartas|Cartas]] and
    [[work:florbela-espanca/diario-do-ultimo-ano|Diário do Último Ano]]:
    real, hers, and first published as a book only once a posthumous editor
    gave it that shape.
  sources:
    - "https://pt.wikipedia.org/wiki/Trocando_Olhares"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
    - "http://purl.pt/272/2/n10/n10_item9/index.html"
  # No cover: Open Library's record (OL1680072W) holds a single 1994
  # Imprensa Nacional-Casa da Moeda edition, no cover image attached.
