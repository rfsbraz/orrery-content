# Bibliography (Works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent. `title` is the original Portuguese
# title; `published` is the year of first print (this catalogue's
# convention, see also Luís de Camões's Rimas and Edgar Allan Poe's The
# Poetic Principle), which for five of the eight works below trails her own
# death by months to five decades.
#
# SHAPE OF THIS WING: a poet's shelf, not a novelist's. Three poetry
# collections carry the spine - two published in her own lifetime, the third
# finished in manuscript but not yet in print when she died. Around them sit
# two short-story collections, a compiled early-poems volume, a letters
# corpus and a private diary, all posthumous, all real and hers, tiered by
# how deliberately she prepared each one for a reader rather than by how the
# stories read. See each entry's own note for its sourcing.
#
# A NOTE ON WHAT "PUBLISHED" MEANS FOR HER: the app's `published` field is
# always the print date, but for Charneca em Flor that print date sits after
# her death, and it would misstate the record to let a bare 1931 imply an
# editor assembled it from scratch afterward. A letter she wrote on 15 May
# 1927 to the newspaper D. Nuno de Vila Viçosa already describes the
# collection as finished; Guido Battelli, the Italian visiting professor at
# Coimbra she corresponded with in her final months, offered in July 1930 to
# find it a publisher, and she lived to review only its typographic proofs
# before her suicide that December (Charneca em Flor, pt.wikipedia, citing
# Maria Lúcia Dal Farra's critical edition "Afinado desconcerto" and the CITI
# literature portal). What Battelli's own posthumous editorial hand added -
# most concretely twenty-eight further sonnets folded into a second 1931
# edition the same year - is real and distinct from the manuscript she
# herself considered finished; both facts are recorded on that work's own
# entry rather than collapsed into one.
#
# EXCLUDED, all sourced to the same DGLB (Direção-Geral do Livro) official
# biography (http://livro.dglab.gov.pt) that documents her early working
# titles:
#   - "O livro d'ele", "Minha Terra" and "O Meu Amor" - three books she
#     wanted to compile from the notebook now known as "Trocando Olhares"
#     (144 poems and three stories written mostly during her Redondo years,
#     1913-1915), abandoned as separate projects and never published under
#     these titles in her lifetime.
#   - "Alma de Portugal" - a planned two-part book ("Na Paz" / "Na Guerra")
#     she gave up on.
#   - "Primeiros Passos" - a compilation from "Trocando Olhares" she sent to
#     the critic Raúl Proença for comment; a working selection, not a
#     published book.
#   - "Claustro das Quimeras" - the working title she had to abandon for
#     [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror Saudade]]
#     when another author's book of the same name appeared first; not a
#     distinct lost work, an earlier name for a work already catalogued here.
#   - The "Trocando Olhares" notebook itself is held out as a work: it is
#     archival manuscript material (part of her estate at the Biblioteca
#     Nacional de Lisboa), never assembled or offered for publication by her,
#     and reached print only as scholarly editions decades later (1994, org.
#     Maria Lúcia Dal Farra; 2009, Martin Claret). The poems from it she
#     herself judged ready for a reader are the ones inside
#     [[work:florbela-espanca/livro-de-magoas|Livro de Mágoas]] and
#     [[work:florbela-espanca/livro-de-soror-saudade|Livro de Sóror
#     Saudade]].
#   - Two single periodical pieces the University of Évora's own Florbela
#     bibliography catalogues by original manuscript research (Maria Lúcia
#     Dal Farra): the poem "Vão orgulho" (Portucale magazine, Jan-Feb 1931)
#     and "Nostalgia" (Portugal Feminino, 31 January 1931, sheet music
#     co-credited to Júlia Oceano Pereira). Left out here as uncatalogued
#     stray periodical appearances rather than books; whether either is a
#     genuinely uncollected poem or already reprinted inside one of the
#     collections above was not settled by the sources checked here.

- id: florbela-espanca/livro-de-magoas
  title: "Livro de Mágoas"
  authorIds: [florbela-espanca]
  published: 1919
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Her first published book: sonnets written while she was a law student in
    Lisbon in her mid-twenties, already carrying the confessional, often
    anguished voice - grief, longing, a body's desire named directly - that
    would define her work, ahead of the more assured and sensual register of
    her later books.
  note: >
    Published in Lisbon by Tipografia Maurício while Espanca was in her
    third year of law school, the same year she suffered a miscarriage and
    began showing the first signs of the mental and physical illness that
    would recur for the rest of her life. The critic Raúl Proença, with whom
    she corresponded from her manuscript notebook "Trocando Olhares",
    compiled and edited this edition and is recorded as introducing variants
    of his own into her manuscript sonnets.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://pt.wikipedia.org/wiki/Florbela_Espanca"
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"

- id: florbela-espanca/livro-de-soror-saudade
  title: "Livro de Sóror Saudade"
  authorIds: [florbela-espanca]
  published: 1923
  subseries: null
  canonTier: core
  format: poetry-collection
  synopsis: >
    Sonnets written in the years of her second marriage and a further
    miscarriage, taking their title from the invented figure of "Sóror
    Saudade" (Sister Longing) through whom Espanca frames a nun's-cell
    renunciation of the world against the sensual desire the poems keep
    circling back to.
  note: >
    Published in Lisbon by Tipografia A Americana. Drafted under the working
    title "Claustro das Quimeras", which Espanca had to abandon after
    another author published a book of the same name; some sources give the
    even earlier working title "Livro do Nosso Amor". The same year of
    publication, she separated from her second husband, António Guimarães,
    after a further miscarriage.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386"
    - "https://pt.wikipedia.org/wiki/Livro_de_Soror_Saudade"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"

- id: florbela-espanca/charneca-em-flor
  title: "Charneca em Flor"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: core
  featured: true
  format: poetry-collection
  synopsis: >
    Her most celebrated collection: sonnets of renewal and open sensual
    desire, framed as a rebirth out of the mourning-nun persona of the
    earlier books - "I take off my shroud, my sackcloth, and I am no longer,
    Love, Sóror Saudade... I am the rough heath opening into flower" - that
    critics and readers alike have read as her most autobiographically
    direct and least guarded book.
  note: >
    Published by Livraria Gonçalves of Coimbra in the first days of January
    1931, about a month after Espanca's death. A letter of hers dated 15 May
    1927 already describes the collection as complete; she could not find a
    publisher for it until Guido Battelli, an Italian visiting professor at
    Coimbra with whom she corresponded in her final months, offered his help
    in July 1930, and she lived to review only the typographic proofs before
    her suicide that December. Its first edition holds fifty-six sonnets; a
    second edition, issued the same year, adds twenty-eight further sonnets
    Battelli assembled after her death, which is real posthumous editorial
    work distinct from the manuscript she herself had already considered
    finished four years earlier.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://pt.wikipedia.org/wiki/Charneca_em_Flor"
    - "https://pt.wikipedia.org/wiki/Florbela_Espanca"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"

- id: florbela-espanca/as-mascaras-do-destino
  title: "As Máscaras do Destino"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: extended
  format: short-story-collection
  synopsis: >
    Eight short stories turning on death, aviators and the dead who do not
    stay dead - among them "O Aviador", "A Morta" and "Os Mortos não
    Voltam" - written in the years after her brother Apeles's fatal plane
    crash and dedicated to his memory.
  note: >
    Published in Porto by Editora Marânus, dedicated "A meu Irmão, ao meu
    querido Morto" (To my Brother, my beloved Dead). The dedication and the
    finished shape of the collection argue for a manuscript she had
    substantially prepared herself, unlike
    [[work:florbela-espanca/o-domino-preto|O Dominó Preto]]'s unsigned,
    undated drafts; no source checked here names who at Marânus, if anyone
    besides Espanca, organized the final book. A fourth edition (Bertrand,
    1982) carries a preface by novelist Agustina Bessa-Luís.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://pt.wikipedia.org/wiki/As_M%C3%A1scaras_do_Destino"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"

- id: florbela-espanca/juvenilia
  title: "Juvenília"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: apocrypha
  format: poetry-collection
  synopsis: >
    Her scattered early poems, most predating her 1919 debut, gathered into
    a single volume only after her death.
  note: >
    Published by Livraria Gonçalves of Coimbra with a preface by Guido
    Battelli, who also brought out
    [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]] and
    [[work:florbela-espanca/cartas|Cartas]] the same year. A compilation
    assembled and titled by Battelli from dispersed manuscript poems rather
    than a book Espanca herself planned or ordered, which is why it sits
    apart from the three collections she prepared herself.
  sources:
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
    - "http://livro.dglab.gov.pt/sites/DGLB/Portugues/autores/Paginas/PesquisaAutores1.aspx?autorid=10386"

- id: florbela-espanca/cartas
  title: "Cartas"
  authorIds: [florbela-espanca]
  published: 1931
  subseries: null
  canonTier: apocrypha
  format: nonfiction
  synopsis: >
    Espanca's surviving correspondence, most valuably the letters to Dona
    Júlia Alves and to Guido Battelli from her final months, read since as
    the closest first-person record of her state of mind ahead of her
    suicide.
  note: >
    First reached print the same year as her death, as "Cartas de Florbela
    Espanca (a Dona Júlia Alves e a Guido Battelli)" (Livraria Gonçalves,
    1931). A larger volume followed in 1949 (prefaces by Azinhal Abelho and
    José Emídio Amaro), and the corpus grew further across later scholarly
    editions - two dedicated letters volumes in the 1986 "Obras Completas"
    (Dom Quixote), and further curated selections in 2008 ("Perdidamente")
    and 2012 ("Sempre Tua"), both organized by Maria Lúcia Dal Farra. A
    posthumously and repeatedly re-assembled correspondence rather than a
    single planned book, the same status this catalogue gives Luís de
    Camões's own collected letters.
  sources:
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
    - "https://pt.wikipedia.org/wiki/Charneca_em_Flor"

- id: florbela-espanca/diario-do-ultimo-ano
  title: "Diário do Último Ano"
  authorIds: [florbela-espanca]
  published: 1981
  subseries: null
  canonTier: apocrypha
  format: memoir
  synopsis: >
    The private diary Espanca kept in the last months of her life, after a
    diagnosis of pulmonary edema, alongside two documented suicide attempts
    before her death that December.
  note: >
    Published as "Diário do Último Ano Seguido de um Poema Sem Título",
    fifty-one years after her death, by Bertrand, with a preface by the poet
    Natália Correia. A private record never prepared by Espanca for
    publication, unlike the three lifetime and near-finished poetry
    collections above.
  sources:
    - "https://en.wikipedia.org/wiki/Florbela_Espanca"
    - "https://www.cm-matosinhos.pt/servicos-municipais/cultura/figuras-de-matosinhos/poi/florbela-espanca-1894-1930"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"

- id: florbela-espanca/o-domino-preto
  title: "O Dominó Preto"
  authorIds: [florbela-espanca]
  published: 1982
  subseries: null
  canonTier: apocrypha
  format: short-story-collection
  synopsis: >
    Six short stories, lighter in tone than
    [[work:florbela-espanca/as-mascaras-do-destino|As Máscaras do Destino]],
    written while Espanca was also translating French novels for money and
    had turned away from poetry for a time.
  note: >
    Espanca began assembling this collection around 1927, intending to
    publish it in October 1928, then set the project aside; the surviving
    manuscript of one story, "Mulher de Perdição", is undated and unsigned
    (unlike every other story she signed) and carries her own dismissive
    note calling the pieces "Primeiros ensaios (coisas para aproveitar) ou
    antes, para não aproveitar... Tolices!" (First attempts, things to make
    use of, or rather, not to... Nonsense!). Publication was delayed a
    further fifty years by a dispute over the rights, reaching print only in
    1982 (Livraria Bertrand, Lisbon), with a preface by Y. K. Centeno.
  sources:
    - "https://pt.wikipedia.org/wiki/O_Domin%C3%B3_Preto"
    - "https://www.florbelaespanca.uevora.pt/?page_id=11"
