# Branding for the Florbela Espanca wing (see docs/SCHEMA.md#themeyaml).
# PALETTE + displayFace + signature ONLY - `theme.art` is left entirely
# absent, to be composed once the bibliography and any eras have stopped
# moving. A visual law written any earlier is discovery done blind: on the
# Fernando Pessoa wing, an early art block covered barely a third of the
# eventual bibliography and had to be rewritten from scratch.
#
# Checked against every existing wing's palette (python scripts/theme_digest.py)
# before choosing, including this catalogue's eight other Lusophone wings:
# almeida-garrett (gaslit theatre amber), eca-de-queiros (violet-mauve
# parlour), fernando-pessoa (teal-green typographer's desk), joao-tordo
# (Atlantic blue-grey), jose-luis-peixoto (wheat-gold sunbaked Alentejo
# plains), jose-rodrigues-dos-santos (cardinal-red newsroom), jose-saramago
# (basalt black + carmine) and valter-hugo-mae (umber terracotta). Espanca
# is also an Alentejo author (born Vila Viçosa, raised there and in Évora),
# which jose-luis-peixoto's wing already claims with a sunbaked golden
# register - this wing deliberately does not repeat that ground, and grounds
# itself instead in her own most-quoted image rather than the region in
# general.
#
# GROUND. Her own recurring figure, named in the sonnet that gives
# [[work:florbela-espanca/charneca-em-flor|Charneca em Flor]] its title:
# "Sob as urzes queimadas nascem rosas" (under the burnt heather, roses are
# born) - urze (heather/heath scrub) that grows wild and low across the
# Alentejo, its small flowers a dusty wine-pink, set against ground scorched
# black. A single bloom breaking through char, not a sunlit plain: this
# wing's palette is that contrast held close, dark ground and one warm
# rose-wine accent, rather than Peixoto's wide sunbaked daylight.
preset: charred-heath-bloom
palette:
  bg: "#150c11"        # near-black, purple-leaning burnt umber - scorched
                       # heath rather than jose-saramago's cooler volcanic
                       # basalt (#141311) or eca-de-queiros's wine-maroon
                       # parlour (#160e12)
  surface: "#201319"   # a shade lifted, for cards
  ink: "#f0dfe1"        # warm pale rose-cream, for maximum readability
  muted: "#9c7e86"      # dusty mauve-brown for metadata
  accent: "#9c2f4a"     # a deep wine-rose, the single bloom breaking
                       # through burnt heath - kept darker and more wine-red
                       # than this catalogue's brighter pinks (lee-child's
                       # hitchhiker-noir #c62f57, robert-bryndza's harbour
                       # #c4587a) and further from its several oranges and
                       # reds (stephen-king #b04a34, jose-rodrigues-dos-santos
                       # #b23327, jk-rowling #a1392b) that a scorched-ground
                       # concept could easily have drifted toward instead
displayFace: fraunces  # from the app's implemented set (fraunces | spectral
                       # | sourceSerif | instrument-serif); fraunces's warm
                       # old-style register suits a poet working entirely
                       # in the classical sonnet form, and is shared with
                       # this catalogue's other two closest-in-register
                       # Lusophone wings (eca-de-queiros, jose-saramago)
                       # rather than reaching for novelty in a four-value set
signature: filament    # from the app's implemented set (beam | thread |
                       # rule | filament | none); a single lit thread
                       # running the length of the wing, for the one
                       # recurring image (the urze, scorched then blooming)
                       # that runs unbroken from her first book to her last
                       # - picked over the catalogue's much more common
                       # beam (9 wings already) for exactly that thread
                       # quality rather than a bold accent rail
art:
  emblem:
    object: >
      A single sheet of ruled sonnet manuscript, its fourteen lines held
      straightedge-true down the page, except in the last few lines where
      the ink leaves the rule and opens into a loose, freely made mark.
    why: >
      All three books she finished herself - Livro de Mágoas, Livro de
      Sóror Saudade, Charneca em Flor - are built entirely of sonnets, the
      fixed fourteen-line form her own critics keep naming alongside an
      erotically direct, confessional voice that broke sharply with what
      was expected of a woman poet in 1920s Portugal. The object states
      that specific tension - a form she never left, a feeling she never
      restrained inside it - rather than repeating the urze image the
      palette already carries alone.
  motifs:
    - urze (heath scrub) on scorched ground, one wine-pink bloom breaking
      through the char
    - a ruled sonnet manuscript page, its straightedge rule broken by a
      freehand line
    - a convent cell - narrow arched window, bare cot, plain stone - from
      the invented Sóror Saudade persona of "Livro de Sóror Saudade"
    - open estuary water at dusk or night, seen from a shoreline rather
      than a boat, used only where the prose collections or a life event
      are the actual subject, never as a default ground
    - two terrains held in tension - whitewashed low Alentejo walls and
      dry scrub against Lisbon's lamplit stone streets and law-school
      corridors
  atmosphere: >
    Close and body-scaled, not landscape-scaled - the opposite instinct
    from jose-luis-peixoto's wide, flat Alentejo horizons that dwarf the
    human figure: this wing stays at arm's length, in a cell, a bedroom,
    a shoreline path, never open country seen from a distance. A
    confessional heat, desire named in the body rather than implied, held
    inside a formal composure - not fernando-pessoa's typographer's-desk
    intellect, not eca-de-queiros's performed drawing-room elegance.
    Candlelit or dusk-lit more often than bright daylight, but warm
    rather than mournful: a scorched ground that flowers, not a deathbed.
    Avoid gothic mourning-shrine staging - her own last and most
    celebrated book is titled Charneca em Flor (heath in flower) and
    reads, by her critics' own account, as rebirth and open desire, not
    elegy.
  lineCharacter: >
    A dip-pen line held to two disciplines within the same drawing:
    ruled, straightedge-true for anything built, printed or codified - a
    manuscript's ruled lines, a cloister's stonework, a window's mullions
    - and a freer, more pressured, slightly uneven stroke for anything
    organic or bodily - heath scrub, hair, skin, an open bloom - so the
    drawing itself carries the tension her critics name in the work
    itself: a rigid inherited form pushed to its limit by an unrigid
    feeling. Never one uniform register throughout, the way
    jose-luis-peixoto's spare graphite line holds a single dry pressure
    everywhere: this line has two hands in it.
  backgroundTexture: >
    Near-black, faintly grained paper - burnt heath char, close in value
    to the wing's own scorched-ground palette - coarser and darker than
    laid paper's soft fibre, and the opposite of jose-luis-peixoto's
    bleached limestone-dust page: this wing's ground starts already
    burnt, before the first mark is made.
  accentUse: >
    The wine-rose accent on exactly one element per image, never a fill:
    a single open bloom, a ribbon, or the one line of ink that breaks a
    ruled margin. Never the ground itself, which stays char-dark.
  avoid:
    - gothic mourning-shrine imagery - black veils, weeping willows,
      tombstones, funerary staging; her death is a documented fact, her
      work is not an elegy
    - generic "sad woman poet" Victorian mourning-dress iconography
    - wide sunbaked Alentejo plains, cork oaks or dry-stone walls seen at
      landscape scale - already jose-luis-peixoto's ground; this wing
      stays close and body-scaled
    - any likeness of Florbela herself, her three husbands or her
      brother Apeles - draw the place, the object or the consequence,
      never the face
    - azulejo tiling, fado/saudade postcard Portugal, wine-region
      tourist gloss
notes: >
  A scorched heath with one bloom breaking through, not a sunlit Alentejo
  plain (already this catalogue's jose-luis-peixoto) and not a drawing-room
  or newsroom register. Personality through palette plus one display face
  plus one signature, readability first, no genre costume; both displayFace
  and signature are drawn only from the app's currently implemented sets.
