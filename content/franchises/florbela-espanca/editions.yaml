# Portuguese editions - the actual books a Portuguese reader buys. Espanca
# wrote in Portuguese, so every edition below is already in her own language
# and `title` is omitted throughout per SCHEMA.md: repeating "Livro de
# Mágoas" as a translated title would assert a translation event that never
# happened. No English-language market exists for her worth recording here -
# the handful of English-titled "Ilustrado" self-published print-on-demand
# listings found (CreateSpace, Independently Published, dozens of them) carry
# no verifiable publisher, editor or source behind them and are excluded.
#
# COVERAGE: 6 of 9 works carry a verified standalone edition. Three do not:
#
# - "Juvenília" has a real Colares Editora printing, but its year is itself
#   unsettled and no ISBN for it has surfaced anywhere checked. A detailed
#   Espanca bibliography (lerflorbelaespanca.blogspot.com/p/obra.html - its
#   other dates cross-check against OpenLibrary's own edition list for this
#   work) records the print history as 1ª ed. Coimbra: Livr. Gonçalves, 1931;
#   2ª ed. Coimbra, 1946; 3ª ed. Sintra: Colares, 2005 - no December 2007
#   anywhere in it, which the earlier note here claimed without a source.
#   Neither year is corroborated by an ISBN: OpenLibrary's own edition list
#   for this work carries only the two pre-ISBN Livraria Gonçalves printings
#   (1946, 1949), nothing from Colares. Wook and Bertrand product pages are
#   reachable directly - unlike their search and author-listing pages, which
#   403/404 - but that only helps once a product URL is in hand: Wook's own
#   author-listing page for Florbela Espanca answers 200 with no book data in
#   it (client-rendered), and neither wook.pt nor bertrand.pt has a
#   discoverable product page for this title - both list every other Espanca
#   title but not this one. BNP's own catalogue, queried by author (Espanca,
#   Florbela) and title (Juvenilia), returns "Não foram encontrados
#   registos" - no record. Left for a human with a browser to settle: whether
#   Wook or Bertrand stock a Juvenília listing under a title or slug a text
#   search didn't surface, and which year - 1946, 2005, or a genuine 2007
#   reprint - the Colares printing actually carries.
# - "Cartas" has no standalone modern printing at all. Its only current
#   printing bundles it with "Diário do Último Ano" under one ISBN (Bertrand,
#   "Cartas e diário", 1995, 9789722509206) - an omnibus of two catalogued
#   works, not a single-work edition, so it earns neither work a slot.
#   "Perdidamente" (Quasi Edições / Câmara Municipal de Matosinhos, 2008,
#   9789895523252) is NOT this book despite both being letters: it publishes
#   a wholly different, later-discovered correspondence - love letters from
#   1920-1925 to her second husband António Guimarães, acquired by Matosinhos
#   in 2006 - not the "Cartas" work's own 1931 content (the letters to Dona
#   Júlia Alves and Guido Battelli). Recording Perdidamente against this work
#   would misrepresent what a reader gets, so it is left out entirely rather
#   than mis-filed.
# - "Diário do Último Ano" has the same "Cartas e diário" omnibus problem
#   above, plus one standalone-looking current printing that was checked and
#   set aside rather than recorded: a 2023 Portuguese/Spanish facing-page
#   edition (El Gallo de Oro, sold via Edições Miosotis's Portuguese
#   storefront, ISBN 9788412699616 - a valid check digit). Its prefix (978-84)
#   registers the ISBN in Spain, outside this file's pt-PT scope, and the
#   press behind it could not be corroborated here as an established,
#   ongoing publisher rather than a small bilingual-poetry sideline. A real
#   find, and possibly the right call to include with the region noted - left
#   for a human to confirm rather than decided unilaterally here.
#
# EXCLUDED AS OMNIBUSES (checked and set aside, not missed): two rival
# "complete works" series exist alongside the one used below, both real,
# neither usable per work. Grupo Editorial Presença's "Obras de Florbela
# Espanca" combines rather than separates: "Obra Poética" vol. I (2009,
# 9789722342117) bundles Livro de Mágoas + Livro de Sóror Saudade + Charneca
# em Flor into one spine; vol. II (2010, 9789722343220, 248 p.) bundles
# Trocando Olhares + Reliquiae + scattered poems (corroborated across two
# independent retailer listings, Amazon and Bookmaniacs, both describing the
# identical contents); "Contos" (2011, 9789722346313) bundles As Máscaras do
# Destino + O Dominó Preto plus two uncollected stories ("A Oferta do
# Destino", "Alma de Mulher"). Every "Sonetos" / "Sonetos Completos" printing
# found across decades of Portuguese publishers (Bertrand, Relógio d'Água,
# Alêtheia, Porto Editora, Mundo de Letras, Europa-América and others,
# 1971-2021 - dozens of candidate rows) is the same pattern at smaller scale:
# Guerra & Paz's own 2023 "E Dizê-lo Cantando a Toda a Gente - Os Sonetos"
# spells out its contents as Livro de Mágoas + Livro de "Sóror Saudade" +
# Charneca em Flor + Reliquiae in one volume, and nothing checked among the
# "Sonetos" printings ties any single one of them to only one of the three
# sonnet collections rather than a selection across them. Also excluded on
# the same ground: "Obras completas de Florbela Espanca" (Publicações Dom
# Quixote, 1985, four volumes) and "Poesia completa" (Bertrand, 2003).
#
# STANDALONE EDITIONS, two families:
# - Four of the six covered works are individual volumes of Editorial
#   Estampa's own "Obras Completas de Florbela Espanca", organised by
#   Cláudia Pazos Alonso and Fabio Mario da Silva: each volume carries only
#   the one work named on its own cover - confirmed against the Biblioteca
#   Nacional de Portugal's own per-collection catalogue query (which lists
#   each volume's individual page count and collection-volume number),
#   despite the shared umbrella title. This is the opposite pattern from the
#   Presença series above, which genuinely combines works under its volume
#   numbers; same publisher-collection concept, different editorial choice.
#   Two of the four (Livro de Sóror Saudade, Charneca em Flor) also carry a
#   2013 Projecto Adamastor EPUB/MOBI ebook, recorded as a second, genuinely
#   different object for a reader who wants an ebook rather than the Estampa
#   trade paperback.
# - "O Dominó Preto" (Book Cover Editora, 2023) and "Trocando Olhares"
#   (Imprensa Nacional-Casa da Moeda, 1994) stand outside both series above.
#   Imprensa Nacional's own current catalogue lists "Trocando Olhares" for
#   promotional reference only ("apenas divulgação"), confirming it is out of
#   print; it is recorded anyway as the only pt-PT edition this work has ever
#   had (per the "only edition" precedent - see the editions skill). No
#   ISBN-13 for it is printed anywhere checked, so it is converted here from
#   the ISBN-10 given independently by both Portuguese Wikipedia and
#   OpenLibrary (972-27-0751-5, itself valid by its own ISBN-10 check digit):
#   drop the ISBN-10 check digit, prefix 978, recompute from scratch per the
#   editions skill's method. OpenLibrary's own catalogue record separately
#   carries the identical already-converted ISBN-13, corroborating the
#   arithmetic rather than just repeating the ISBN-10.
#
# PUBLIC DOMAIN: Espanca died in 1930; her copyright lapsed decades ago
# throughout the Lusophone world. Project Gutenberg carries exactly two of
# her nine works as complete Portuguese texts, both digitised from
# Biblioteca Nacional de Portugal page images of the original editions -
# "Livro de Mágoas" (ebook 17610, from the 1919 Tipografia Maurício original)
# and "Livro de 'Soror Saudade'" (ebook 68691, from the 1923 original) - and
# both carry a readUrl here. Standard Ebooks has no Espanca title. Projecto
# Adamastor, despite digitising two more of her works as ebooks (recorded
# above as regular editions, not as readUrl), was not used for readUrl: its
# EPUB/MOBI downloads sit beside a Kobo purchase link with no explicit
# licence or public-domain statement found on either product page checked,
# and this file only links a readUrl where that is verified rather than
# assumed from the author's death date alone.

