# Branding for the Karin Slaughter wing (see docs/SCHEMA.md#themeyaml).
# Checked against every existing wing before choosing. Every crime wing in
# the catalogue so far runs cold or overcast:
# Tana French (wet, peaty Irish green-grey), Gillian Flynn (pale overcast
# Midwest newsprint-grey) and Jo Nesbo (pale, cold Nordic blue-white). This is
# the catalogue's first warm, humid crime register, because Slaughter's
# Georgia is heat and kudzu, not rain and gray light.
#
# The two existing reds (Stephen King's oxblood, Valter Hugo Mae's burnt
# terracotta) were ruled out on sight - both already claim that hue family,
# and Slaughter's setting has its own, unclaimed color: kudzu, the vine that
# smothers every roadside and abandoned lot in rural Georgia. The accent below
# sits at a yellow-green hue neither of the catalogue's two existing greens
# (Agatha Christie's poison-green, Chuck Palahniuk's antiseptic teal) comes
# near.
preset: kudzu-noir
palette:
  bg: "#14170d"       # near-black with a warm, humid olive-green cast - a
                      # Georgia night under pine and kudzu, not French's cool
                      # wet peat or King's warm brown
  surface: "#1b2013"  # a shade lifted, for cards
  ink: "#eae4d1"      # warm parchment - case-file paper, high contrast
  muted: "#8f8c6a"    # dusty olive-tan, for metadata
  accent: "#7c9a3e"   # one kudzu green, for links and markers only
displayFace: sourceSerif  # from the app's implemented set (fraunces | spectral
                          # | sourceSerif); the plainest of the three, fitting
                          # prose that is fast, procedural and forensic-report
                          # plain rather than atmospheric - already used three
                          # times (Palahniuk, Flynn, Nesbo), each for its own
                          # reason, this one for Slaughter's own account of
                          # writing her debut in three months and never
                          # slowing down since
signature: thread   # a quiet hairline the works are strung along - the wing's
                    # own structure made visual: Sara Linton is a single,
                    # unbroken thread run from Grant County directly into
                    # Will Trent, not (like Tana French's use of the same
                    # signature) a rotating cast pulled into each new case
# ART. The other three crime wings each commit to one drawing instrument tied
# to a biographical fact: Tana French's is a chair under a bulb (an audition,
# then a real interrogation); Gillian Flynn's is a single copy-desk rule (her
# decade at Entertainment Weekly); Jo Nesbo's is a ruled ledger page (his years
# as a financial analyst). This wing's instrument is a stainless exam table,
# and its line is built around humidity rather than an editing or ruling
# gesture - a physical property of Georgia heat, not a tool from a former
# career, which is the deliberate difference from all three: Flynn's line
# stays bone-dry and ballpoint-clean by design, French's is a cold, twice-
# scratched dry-point line, and this one is warm ink that visibly takes on
# moisture as it is laid down. Kept forensic rather than gothic: the table is
# always empty, the case file always closed, nothing here is a body.
art:
  emblem:
    object: >
      A stainless-steel examination table, empty and wiped to a shine, one
      overhead lamp switched off above it, a few instruments laid in a single
      parallel row along its near edge, and a closed case file squared at the
      far end with a length of string still tied around it.
    why: >
      The table itself is the throughline, not what has ever crossed it: the
      same object, unchanged, sits in a small county clinic in Grant County
      and in a state facility in Atlanta, so it carries Sara Linton's own
      professional path from rural coroner to GBI-adjacent forensic work
      without needing a different look for either setting. It reads first as
      furniture - clean, orderly, unremarkable - because the method is the
      subject, never the body that isn't on it.
  motifs:
    - red Georgia clay running out to a kudzu-smothered barn, silo or fence
      line, the vine reclaiming whatever stopped moving long enough
    - a small county courthouse square - live oaks, a war memorial, a diner
      window - Grant County's Heartsdale register
    - an Atlanta government corridor, fluorescent-lit and anonymous, case
      folders stacked on a rolling cart, a GBI badge on a lanyard on a desk
    - the stainless exam table itself, empty, instruments laid parallel,
      never occupied
    - a manila case file, corner curled and slightly foxed with humidity, tied
      shut with string, resting on a porch rail or an evidence table
    - a screened porch or kitchen window in thick heat-haze, the stillness
      standing in for the cicada static a picture cannot carry
    - kudzu overtaking a chain-link fence, a telephone pole, an abandoned gas
      pump - the vine as the one constant across a rural mile
    - an investigator or examiner seen from behind or at a three-quarter
      turn, hands occupied with the work, face never the point of the frame
  atmosphere: >
    Humid and procedural rather than gothic or menacing-by-shadow: the heat
    itself is the pressure, not weather doing duty for dread. Method and
    stillness carry the register - a table wiped down, a file squared, a
    clay road running straight to the horizon - so that violence is always
    something the picture arrives after, read in order and calm rather than
    in wreckage. Grant County reads close, small and sun-bleached; Atlanta
    reads taller, cooler-lit and more anonymous; neither tips into menace on
    its own, because the discipline of the work is the mood.
  lineCharacter: >
    A fine dip-pen line laid down warm and slightly wet, so that it blots and
    softens a little at the tail of each stroke, as if the paper itself has
    taken on humidity - never enough to lose the mark, but every line carries
    that trace of damp. Forensic and procedural objects (the exam table, the
    file's straight edges, a ruled instrument) are drawn as steady and level
    as the humidity allows; foliage, heat-haze and kudzu are let go looser,
    the same pen relaxing into the wet. One consistent register throughout,
    not an alternating technical/freehand split - the humidity is constant,
    the discipline is what varies by subject.
  backgroundTexture: >
    Warm parchment paper with a faint humidity-cockle rather than a flat
    wash - the slight warp and foxing a case folder gets left in a hot
    closed car or an un-air-conditioned back office, with the occasional
    faint ring of an old water stain at a corner, never spreading to cover
    the sheet.
  accentUse: >
    Kudzu green on exactly one element per image, never as a fill: a single
    vine tendril climbing a fence post or porch rail, one case-file tab or
    evidence-bag seal, a lone surveyor's flag in red clay, or one lit exit
    sign down an Atlanta corridor.
  avoid:
    - graphic gore, visible wounds, or an autopsy shown in progress - forensic
      work is drawn as clean tools and clean surfaces only, an empty table and
      a closed file, never a body or blood
    - crime-thriller cover costume, chalk outlines, crime-scene tape and
      caution cones, a bloody knife or any weapon shown in use
    - Southern-gothic postcard kitsch, literal Spanish moss, plantation-ruin
      decay, a rocking-chair-porch nostalgia this wing's Georgia isn't selling
    - Gillian Flynn's bone-dry, ballpoint-clean copy-desk line, or Tana
      French's cold, twice-scratched interrogation-chair staging - this
      wing's line is warm and humidity-softened, not either of those
    - Atlanta reduced to skyline-postcard iconography (Peachtree signage, a
      skyline silhouette used as backdrop wallpaper) rather than its anonymous
      government corridors
    - the ABC "Will Trent" series or Netflix's "Pieces of Her" adaptation's
      visual identity - their casting, colour grade or title cards
notes: >
  A humid night register, not a cold one: near-black with a warm olive cast
  (pine and kudzu after dark), warm parchment ink, and one kudzu-green accent
  used only for links and markers. Deliberately not the reds already claimed
  in this catalogue and deliberately not cold like the other three crime
  wings - Slaughter's Georgia is heat, not rain. The single hairline signature
  stands for the wing's own defining structural fact, without narrating what
  that thread actually is.
