# Creative periods. There are none on record.
#
# Karin Slaughter's shelf divides cleanly into series - the Grant County
# procedurals (2001-2007), the long-running Will Trent thrillers (2006- ), the
# new North Falls mysteries (2025- ), and standalones throughout - but a series
# is a shelf grouping, not a period of a career. Each work already carries its
# series in `subseries`, and orders.yaml curates the two main series in reading
# order. Nobody outside this repo periodises the career itself, so no era is
# claimed and the whole 2001-2026 shelf sits outside any era by design.
#
# Four framings come close enough to record, and each falls short.
#
# The author names a starting series, not a period. "I got my start writing
# about small towns with Grant County," she says of the books that introduced
# her to readers, before branching into the Atlanta-set Will Trent series
# (CrimeReads,
# https://crimereads.com/karin-slaughter-is-writing-for-entertainment-but-firmly-planted-in-reality/).
# That is a series origin and a change of subject, given no name, no boundary
# and no claim of a phase.
#
# The two main series overlap, so there is no year to cut on. Grant County runs
# 2001-2007 and Will Trent begins in 2006: Triptych (Will Trent #1, 2006) and
# Fractured (Will Trent #2, 2008) bracket Beyond Reach (Grant County #6, 2007),
# so the series were written concurrently, not one after the other. A "Grant
# County years / Will Trent era" split at any year would put books written side
# by side into different eras and claim 2006-2007 for two periods at once. The
# crossover the publisher markets - Sara Linton's story carrying from Grant
# County into the Will Trent series from its third book - is a character bridge
# between two live series, not the end of one period and the start of another.
#
# A third of the shelf belongs to no series. Six standalones (Cop Town 2014
# through Girl, Forgotten 2022) and the short fiction run across the whole span
# and sit in neither Grant County nor Will Trent. Any series-shaped scheme would
# orphan or misfile them; no period contains them.
#
# No critic periodises the career, and there is no obituary to. Slaughter is
# alive and still publishing (North Falls, 2025-2026), so the one document that
# periodises a whole life does not exist. The fullest critical venue to cover
# her describes her evolution as a natural progression from her 2001 debut and
# names no phases (CrimeReads, above); her own site and Wikipedia are
# chronological and name none either
# (https://en.wikipedia.org/wiki/Karin_Slaughter). And there is no publisher
# transition to anchor a publishing-historical era: the 2000 three-book deal
# with William Morrow still holds, with no Bachman-years-style break to cut on.
[]
