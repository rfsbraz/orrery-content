# Recurring figures that thread the works together (docs/SCHEMA.md). A tight
# roster of genuine connective tissue: the two series leads, the two Grant
# County figures who carry across the Grant County/Will Trent boundary, Will
# Trent's GBI partner, and the standalone protagonist who links Pieces of Her
# to its own sequel.
#
# JEFFREY TOLLIVER carries this wing's one guarded fact. His entry lists his
# Grant County appearances plainly and states nothing about what becomes of
# him; the final appearance is gated behind spoilerAfter rather than described.
# Nothing here explains why Sara Linton's story continues into Will Trent -
# only that it does, which the publisher's own marketing already states
# openly.

- id: karin-slaughter/sara-linton
  name: Sara Linton
  description: >
    Heartsdale's pediatrician and Grant County's part-time coroner, whose
    forensic eye anchors the franchise's first six novels alongside her
    ex-husband, police chief Jeffrey Tolliver, and detective Lena Adams. She
    later rebuilds her career at an Atlanta trauma center and carries her
    story into the Will Trent series.
  appearsIn:
    - workId: karin-slaughter/blindsighted
      note: Her introduction as Heartsdale's medical examiner.
    - workId: karin-slaughter/kisscut
    - workId: karin-slaughter/a-faint-cold-fear
    - workId: karin-slaughter/indelible
    - workId: karin-slaughter/faithless
    - workId: karin-slaughter/beyond-reach
      note: The last Grant County novel.
    - workId: karin-slaughter/undone
      note: Where her story first crosses into the Will Trent series.
    - workId: karin-slaughter/broken
    - workId: karin-slaughter/fallen
    - workId: karin-slaughter/criminal
    - workId: karin-slaughter/unseen
    - workId: karin-slaughter/the-kept-woman
    - workId: karin-slaughter/the-last-widow
    - workId: karin-slaughter/the-silent-wife
    - workId: karin-slaughter/after-that-night
    - workId: karin-slaughter/this-is-why-we-lied
  sources:
    - https://www.karinslaughter.com/grant-county-series
    - https://www.karinslaughter.com/will-trent-series

- id: karin-slaughter/will-trent
  name: Will Trent
  description: >
    A Georgia Bureau of Investigation special agent whose partnership with
    Faith Mitchell anchors the series that bears his name; a meticulous,
    methodical investigator whose own case, in Criminal, reaches back into
    his childhood.
  appearsIn:
    - workId: karin-slaughter/triptych
      note: A supporting figure here, ahead of leading the series proper.
    - workId: karin-slaughter/fractured
      note: His first case as the series lead.
    - workId: karin-slaughter/undone
    - workId: karin-slaughter/broken
    - workId: karin-slaughter/fallen
    - workId: karin-slaughter/criminal
    - workId: karin-slaughter/unseen
    - workId: karin-slaughter/the-kept-woman
    - workId: karin-slaughter/the-last-widow
    - workId: karin-slaughter/the-silent-wife
    - workId: karin-slaughter/after-that-night
    - workId: karin-slaughter/this-is-why-we-lied
  sources:
    - https://www.karinslaughter.com/will-trent-series

- id: karin-slaughter/jeffrey-tolliver
  name: Jeffrey Tolliver
  description: >
    Chief of police in Heartsdale, Grant County, and Sara Linton's ex-husband;
    his investigations alongside Sara and detective Lena Adams open the
    franchise.
  appearsIn:
    - workId: karin-slaughter/blindsighted
      note: His introduction, leading the investigation.
    - workId: karin-slaughter/kisscut
    - workId: karin-slaughter/a-faint-cold-fear
    - workId: karin-slaughter/indelible
    - workId: karin-slaughter/faithless
    - workId: karin-slaughter/beyond-reach
      spoilerAfter: karin-slaughter/beyond-reach
  sources:
    - https://www.karinslaughter.com/grant-county-series

- id: karin-slaughter/lena-adams
  name: Lena Adams
  description: >
    A Heartsdale, Grant County detective whose reckless choices and buried
    traumas run through all six Grant County novels, resurfacing once more
    when a GBI investigation reaches back into Grant County.
  appearsIn:
    - workId: karin-slaughter/blindsighted
      note: Her introduction, investigating her own sister's murder.
    - workId: karin-slaughter/kisscut
    - workId: karin-slaughter/a-faint-cold-fear
    - workId: karin-slaughter/indelible
    - workId: karin-slaughter/faithless
    - workId: karin-slaughter/beyond-reach
    - workId: karin-slaughter/broken
      note: Her past resurfaces under Will Trent's investigation.
  sources:
    - https://www.karinslaughter.com/grant-county-series
    - https://www.karinslaughter.com/broken

- id: karin-slaughter/faith-mitchell
  name: Faith Mitchell
  description: >
    Will Trent's Georgia Bureau of Investigation partner, a former Atlanta
    beat cop, whose own family is at the center of one of the series'
    investigations.
  appearsIn:
    - workId: karin-slaughter/fractured
      note: Her introduction as Will's partner.
    - workId: karin-slaughter/fallen
      note: Her mother's disappearance is the case.
    - workId: karin-slaughter/criminal
    - workId: karin-slaughter/this-is-why-we-lied
  sources:
    - https://www.karinslaughter.com/will-trent-series

- id: karin-slaughter/andrea-oliver
  name: Andrea Oliver
  aka: ["Andrea Cooper"]
  description: >
    The daughter at the center of Pieces of Her, forced to confront her
    mother Laura's hidden past; she resurfaces under a different surname as
    a newly minted US Marshal in Girl, Forgotten, chasing a cold case tied to
    her own father.
  appearsIn:
    - workId: karin-slaughter/pieces-of-her
      note: Her introduction, as Andrea Cooper.
    - workId: karin-slaughter/girl-forgotten
      note: Returns as Andrea Oliver, a US Marshal.
  sources:
    - https://www.karinslaughter.com/pieces-of-her
    - https://www.karinslaughter.com/girl-forgotten
