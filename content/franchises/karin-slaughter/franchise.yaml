id: karin-slaughter
name: Karin Slaughter
kind: author
description: >
  Georgia crime fiction across three series and half a dozen standalones: the
  complete Grant County procedurals, the long-running
  [[character:karin-slaughter/will-trent|Will Trent]] thrillers, and the new
  North Falls mysteries. [[character:karin-slaughter/sara-linton|Sara Linton]],
  Grant County's coroner, later carries her story into the Will Trent series -
  the throughline connecting Slaughter's two main casts.
authorIds: [karin-slaughter]
themePreset: kudzu-noir

# Capabilities are auto-detected from the data (docs/SCHEMA.md); left implicit
# here. Active from what exists: connections (characters.yaml plus the
# Broken/Undone crossover and the Pieces of Her -> Girl, Forgotten link),
# hall (always-on), river plus companion (events.yaml carries the aura), and
# wizard (startHere below). eras.yaml is empty by design (no periodisation on
# record), so no era plates render. No editions.yaml, so editions stays off.

globalEvents:
  include:
  # Considered and refused. Nothing renders unless it is in `include`
  # above, so these change nothing; they are kept as the record of a
  # judgement already made, so it is not re-litigated from scratch.
  exclude:
    - sept-11-2001                     # Blindsighted's actual six-days-later launch is already told, with sourcing this generic entry lacks, by karin-slaughter-blindsighted-post-911-tour-2001
    - financial-crisis-2008            # published Undone and Broken either side of 2008; no book is plotted around the crash itself
    - covid-19-pandemic-2020           # False Witness's deliberate pandemic setting is already told, in her own words, by karin-slaughter-false-witness-pandemic-2021
    - chain-bookshop-1982              # generic bookselling backdrop; no sourced link to her career
    - online-bookselling-1995          # no documented backlist-discovery or online-retail story for this wing
    - ebook-and-self-publishing-2007   # traditionally published by William Morrow/HarperCollins throughout; no ebook or self-publishing story
    - prestige-fantasy-adaptation-2011 # a fantasy-genre event; she writes crime fiction, and her own two screen adaptations (Pieces of Her, Will Trent) are already franchise events
    - booktok-2020                     # no documented BookTok-driven surge for any title here
    - carnation-revolution-1974        # Portuguese censorship history; she is American, no bearing found
    - portugal-bailout-2011            # Portugal-specific crisis; no bearing on an American author

startHere:
  paths:
    # Structural note, not a citation: the derived default already keeps this
    # safe on its own. Every Grant County novel publishes by 2007; Sara
    # Linton does not appear in Will Trent until Undone (2009, #3;
    # characters.yaml, karin-slaughter/sara-linton) - so publication order
    # finishes Grant County before her story continues, with no curated
    # reordering needed to make that true.
    - id: everything-in-order
      title: Everything, in order
      description: >
        Every novel and short story, across Grant County, Will Trent, North
        Falls and the standalones, in publication order. The two main
        series are timed so that Grant County's ending arrives before Sara
        Linton's story continues into Will Trent, so nothing here gets
        ahead of itself.
      workIds: null
      orderId: default
      fit:
        experience: [completionist]
        commitment: [complete]
      note: >
        Includes short fiction that started life as paperback-exclusive
        bonus chapters or anthology contributions rather than as books of
        their own.

    # Source: https://www.tlbranson.com/karin-slaughter-books-in-order/
    # "Grant County is the best place to begin if you want Sara Linton's
    # story from the start... I'd read Grant County before the later Will
    # Trent books if you care about Sara Linton's full character arc."
    # Source: https://nextbookintheseries.com/articles/karin-slaughter-will-trent-grant-county/
    # "Option A - Most Rewarding: Read all 6 Grant County novels in order,
    # Begin Will Trent from Book 1."
    - id: grant-county-first
      title: Start with Grant County
      description: >
        The complete Grant County series, from the beginning, so Sara
        Linton's story is told in the order Slaughter wrote it before her
        arc continues elsewhere.
      workIds: null
      orderId: karin-slaughter/grant-county-in-order
      fit:
        experience: [new]
        commitment: [arc]
      note: >
        Blindsighted opens dark and does not soften what happens, and six
        books pass before you meet Will Trent, the GBI agent behind the
        more recent TV adaptation.

    # Derived, not stated in these words by any single guide: Sara Linton
    # does not appear in Will Trent until Undone (#3; characters.yaml,
    # karin-slaughter/sara-linton), so Triptych and Fractured carry none of
    # the Grant County crossover. Several guides describe Will Trent as
    # readable on its own and as many readers' first point of contact via
    # its TV adaptation, e.g.
    # https://nextbookintheseries.com/articles/karin-slaughter-will-trent-grant-county/
    # ("You can read the Will Trent series without reading Grant County
    # first. Slaughter designed Will Trent as a standalone series.") and
    # https://www.tlbranson.com/karin-slaughter-books-in-order/ ("Will Trent
    # is the most popular entry point for many readers, especially after
    # the TV adaptation."). Bounding the taste at book 2, before Sara's
    # first appearance, is this catalogue's own reading of where the
    # crossover actually starts.
    - id: will-trent-taste
      title: Try Will Trent
      description: >
        Will Trent's first two cases, both before Grant County's Sara
        Linton joins the series. A safe taste of the GBI agent many readers
        meet first through the TV series, with no Grant County required.
      workIds:
        - karin-slaughter/triptych
        - karin-slaughter/fractured
      orderId: null
      fit:
        experience: [new]
        commitment: [taste]
      note: >
        Will Trent continues past this point into Sara Linton's story from
        Grant County. If you plan to read Grant County too, read it before
        going further, so its ending is not spoiled out of order.

    # Source: https://nextbookintheseries.com/articles/karin-slaughter-will-trent-grant-county/
    # "Option A - Most Rewarding: Read all 6 Grant County novels in order,
    # Begin Will Trent from Book 1."
    - id: continue-into-will-trent
      title: Continue into Will Trent
      description: >
        For a reader who has finished Grant County: the complete Will Trent
        series, where Sara Linton's story continues from Undone on.
      workIds: null
      orderId: karin-slaughter/will-trent-in-order
      fit:
        experience: [returning]
        commitment: [arc]
      note: >
        Unlike Grant County's closed six-book run, Will Trent is still
        going, twelve books in and counting, so this is an open commitment
        rather than a finished shelf.

sources:
  - https://en.wikipedia.org/wiki/Karin_Slaughter
  - https://www.karinslaughter.com/books
