# ADDITIONAL canon orders only. The DEFAULT order - ALL published works in
# publication-chronological order - is derived automatically from works.yaml
# and is NOT listed here. These two are the subseries filtered to their own
# publisher-numbered sequence (karinslaughter.com labels every book "Grant
# County #N" / "Will Trent #N" on its own product pages), the same pattern
# Agatha Christie's poirot-novels/marple-novels orders use.
#
# Deliberately not attempted here: a combined order that interleaves Grant
# County and Will Trent, or any rationale that explains how the two relate -
# no spoiler boundary exists yet to route such an order safely around.

- id: karin-slaughter/grant-county-in-order
  name: The Grant County novels, in order
  type: curated
  source: canon
  rationale: >
    All six Grant County novels in publication order, numbered #1-#6 on the
    publisher's own site. The series is complete and closes with
    [[work:karin-slaughter/beyond-reach|Beyond Reach]].
  orderedWorkIds:
    - karin-slaughter/blindsighted
    - karin-slaughter/kisscut
    - karin-slaughter/a-faint-cold-fear
    - karin-slaughter/indelible
    - karin-slaughter/faithless
    - karin-slaughter/beyond-reach
  sources:
    - https://www.karinslaughter.com/grant-county-series

- id: karin-slaughter/will-trent-in-order
  name: The Will Trent novels, in order
  type: curated
  source: canon
  rationale: >
    All twelve Will Trent novels in publication order, numbered #1-#12 on the
    publisher's own site. [[character:karin-slaughter/will-trent|Will Trent]]
    is a supporting figure in the first entry, [[work:karin-slaughter/triptych|
    Triptych]], before leading the series from
    [[work:karin-slaughter/fractured|Fractured]] on.
  orderedWorkIds:
    - karin-slaughter/triptych
    - karin-slaughter/fractured
    - karin-slaughter/undone
    - karin-slaughter/broken
    - karin-slaughter/fallen
    - karin-slaughter/criminal
    - karin-slaughter/unseen
    - karin-slaughter/the-kept-woman
    - karin-slaughter/the-last-widow
    - karin-slaughter/the-silent-wife
    - karin-slaughter/after-that-night
    - karin-slaughter/this-is-why-we-lied
  sources:
    - https://www.karinslaughter.com/will-trent-series
