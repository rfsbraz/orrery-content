# Editions of Karin Slaughter: 39 English (en) editions over 39 of 43 works.
#
# COVERAGE
#   en   39 of 43 works. All 26 novels/standalones covered (Grant County 6,
#        Will Trent 12, North Falls 1 of 2, standalones 6) plus 14 of 17
#        short-fiction pieces. Four deliberate absences, explained below.
#
# ONE EDITION PER WORK, not a US/UK pair. Slaughter's US and UK editions
# usually share the same English text (unlike, say, Gillian Flynn's separate
# Crown/Weidenfeld printings with their own ISBNs), so recording both here
# would mostly duplicate the same object under two numbers rather than
# describe two different books. The one exception where the *title* differs
# (Beyond Reach / UK "Skin Privilege") is recorded as a note on the work
# already (works.yaml), not as a second edition row, per the rule that a
# translated-or-retitled edition needs its own row only when a reader would
# otherwise buy the wrong object. No `title` is set on any entry below: every
# edition is in English and the work's own title IS the published title.
#
# THE PUBLISHING HOUSES, era by era, confirmed edition by edition rather than
# assumed from the brief: William Morrow (an imprint of HarperCollins) for all
# six Grant County novels (2001-2007); Delacorte Press for Will Trent through
# 2013 (Triptych to Unseen); William Morrow again from The Kept Woman (2016)
# onward for the rest of Will Trent, all of North Falls published so far, and
# every standalone. Cop Town (2014) is the one standalone still under
# Delacorte, matching its publication year sitting inside the Delacorte Will
# Trent run rather than the later Morrow standalone run.
#
# SOURCING. Every entry is corroborated by at least the Library of Congress
# SRU gateway (lx2.loc.gov:210/lcdb, which serves full MARC records including
# the 020/264/300 fields quoted in each note) or OpenLibrary's per-ISBN record,
# and the great majority by both. Where only OpenLibrary confirms an entry,
# that is stated in the note rather than left implicit.
#
# LOC CORRECTED TWO OPENLIBRARY-DERIVED CANDIDATES the wing's own cover-source
# records had already settled on:
#   - Pretty Girls: works.yaml's coverSource OpenLibrary record carries ISBN
#     9780062430878, attributed to "William Morrow, 2015". The Library of
#     Congress CIP record for the actual 2015 First edition (LCCN 2015298108)
#     gives 9780062429056 instead, and does not list 9780062430878 anywhere,
#     not even among its cancelled/variant ("z") fields. The LOC number is
#     used here; OpenLibrary's is not repeated, since a close-but-different
#     digit run with no corroboration is exactly the kind of number this
#     skill exists to catch, not to inherit.
#   - The Kept Woman: works.yaml's coverSource carries ISBN 9780062430236.
#     The LOC CIP record (LCCN 2016590295) gives the hardcover as 9780062430212
#     instead. Both numbers pass their check digit and both sit in the same
#     "978-0-06-2430xxx" block HarperCollins evidently uses across Slaughter's
#     backlist (Pieces of Her is …0274, The Good Daughter …0243, Pretty Girls'
#     own wrong candidate above is …0878), so 9780062430236 is not a
#     transcription error so much as a DIFFERENT real printing (most likely
#     the reissue paperback that got photographed for the cover) - the LOC
#     hardcover first edition is recorded here instead, consistent with every
#     other Grant County/Will Trent entry being a first edition.
# Neither work's cover image needed to change: a work's `images.cover` and
# this file's `isbn13` are allowed to point at different real printings of
# the same book.
#
# GIRL, FORGOTTEN carries no Library of Congress record under any ISBN
# checked (a title-only LOC search returns 44 unrelated books called "Girl,
# Forgotten"; author-scoped queries against the LOC SRU gateway for this one
# ISBN returned no hit). It rests on OpenLibrary alone - the same edition
# record works.yaml already uses for the cover - which is stated plainly
# rather than presented as equally corroborated to the rest of the file.
#
# THE SHARED NECESSARY WOMEN / THE MEAN TIME ISBN IS NOT A DUPLICATE-ISBN
# BUG. Both stories were released as a single paired ebook (Random House,
# 17 October 2013, OverDrive catalog id 1213609), so both work entries below
# correctly carry the identical isbn13 9781448149193 - one real object,
# two catalogued works, the same relationship Snatched and Busted would have
# if they had shipped together instead of separately.
#
# A DATE DISCREPANCY, NOT CORRECTED HERE. Busted's OpenLibrary/publisher
# record (bwb:9781448184828) dates the ebook to 2013, one year after
# works.yaml's `published: 2012` for the same book. Busted was sold as a
# paperback-exclusive bonus for Unseen, which itself published in 2013, so a
# 2013 release date for the bonus material is at least as plausible as 2012.
# Per this skill's scope, only editions.yaml is touched here; the year in
# works.yaml is left for whoever next reviews that file, flagged in the PR.
#
# FOUR DELIBERATE ABSENCES, each checked and confirmed rather than merely
# unsearched:
#   - The Secrets We Hide: unpublished at the time this file was written (US
#     date 11 August 2026). The one OpenLibrary pre-publication record found
#     (isbn13 9781460768112) is attributed to "Arotahi Agency" - a rights
#     agency, not a trade publisher of record - carries no year, format or
#     second source, and was created within the last few months purely from a
#     rights-listing feed. A single, uncorroborated, non-publisher record is
#     not enough to ship an edition, the same reason this work has no cover
#     image either.
#   - Thorn in My Side: sold exclusively as an Amazon Kindle Single (confirmed
#     via the author's own site, whose "Buy the Book" link resolves to
#     amazon.com/.../Thorn-Side-Kindle-Single-ebook/dp/...). Kindle Singles of
#     this kind carry an ASIN, not an ISBN, and no Library of Congress or
#     OpenLibrary record exists under this title for this author. A real,
#     buyable, ISBN-less object - the schema's own documented case.
#   - The Truth About Pretty Girls: premiered as an Audible-exclusive
#     recording (30 May 2013) and later as a Kindle edition (24 December
#     2014, per its own goodreads/karinslaughter.com listings); neither the
#     Library of Congress nor OpenLibrary holds a record under this title for
#     this author. Same shape as Thorn in My Side: real, sold, no ISBN found.
#   - Short Story (the Koryta crossover): its 2019 standalone reissue is sold
#     only via a Kindle ASIN (amazon.com/dp/B07SJV4DD2, per works.yaml's own
#     sourcing), not an ISBN. Its first appearance, the MatchUp anthology
#     (Simon & Schuster, 2017), does carry real ISBNs, but those describe the
#     multi-author anthology as a whole, not Slaughter and Koryta's individual
#     contribution - recording one of those ISBNs here would misattribute a
#     book with a dozen other authors' names on it to a single-story entry,
#     the same reason First Thrills: Volume 3 itself carries no entry for
#     Cold, Cold Heart below.

