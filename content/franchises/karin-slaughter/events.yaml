# content/events/global.yaml.
#
# Eight entries spanning the debut (2001) through the Will Trent TV premiere
# (2023), aimed at the years around the Grant County originals and the long
# 2016-2021 run of Will Trent/standalone books that would otherwise sit dark.
#
# THE GRANT COUNTY SPOILER: Sara Linton's story continuing into the Will
# Trent series is stated below only as the bare, publisher-marketed fact
# already carried in franchise.yaml and characters.yaml. Nothing here states,
# or gets close to stating, what happens to Jeffrey Tolliver in Beyond Reach -
# that stays behind spoilerAfter: karin-slaughter/beyond-reach on his
# characters.yaml entry alone. No new event was added purely to restate the
# crossover: franchise.yaml's description, Sara Linton's appearsIn note on
# Undone, and the Broken -> Beyond Reach connection already carry it, and a
# fourth restatement would be padding, not a new sourced fact.
#
# Candidates tested and left out:
#   - the Bookreporter interview timed to A Faint Cold Fear (Sept 2003)
#     previews the shape of Indelible's Lena Adams arc in Slaughter's own
#     words; using it risked spoiling a book two entries ahead of it for no
#     real gain, so only the safe, spoiler-free half of that interview (how
#     the fictional Grant County borrows from her real Georgia childhood)
#     is used below
#   - Cop Town's Edgar nomination (2015, Best Novel) alongside its Steel
#     Dagger win: real, but a second award for the same book in the same
#     year is the kind of listicle padding the standard warns against; one
#     dated, judges-quoted award entry carries the reception rupture
#   - a 2025 Georgia Author of the Year honor and the 2025 Library Reads
#     Hall of Fame pick: recent recognition, but neither is tied to a
#     specific book or explains anything about how the catalogue reads;
#     texture without a text to recolor
#   - The Good Daughter's upcoming Peacock limited series (Rose Byrne,
#     Meghann Fahy): real and announced, but not yet aired, so there is no
#     reception or fact yet to date an event to

- id: karin-slaughter-blindsighted-post-911-tour-2001
  date: 2001-09-17
  title: A debut tour flown mostly alone
  scope: author-life
  reach: franchise
  impact: med
  description: >
    [[work:karin-slaughter/blindsighted|Blindsighted]] was published on
    September 17, 2001, six days after the September 11 attacks grounded
    much of American air travel. Slaughter's publisher offered to let her
    postpone the launch tour, reasoning readers were not in the mood to hear
    about more death, but she had worked toward this for years and went
    anyway: on her first flights out, she has said, it was "just me and the
    stewardess eyeballing each other." Turnout at the readings, she found,
    was better than she expected.
  spoilerAfter: null
  sources:
    - https://www.atlantamagazine.com/great-reads/karin-slaughter/
    - https://www.kirkusreviews.com/book-reviews/karin-slaughter/blindsighted/
    - https://www.publishersweekly.com/9780688174576

- id: karin-slaughter-grant-county-hometown-texture-2003
  date: 2003
  title: Grant County, built from real Saturday afternoons
  scope: author-life
  reach: franchise
  impact: low
  description: >
    Asked in 2003 how she squared a small fictional Georgia town with the
    real one she grew up in, Slaughter said the background cast of a small
    Southern town - "the town slut, the gossip, the bad families and the
    good" - was material she noticed as a child: her father would take her
    along to the hardware store on weekends, where she'd sit and listen to
    the old men talk. She has described wanting the Grant County novels to
    honor the American South rather than trade in its usual shorthand,
    naming Margaret Mitchell and Flannery O'Connor as the tradition she felt
    proudest to write inside of.
  spoilerAfter: null
  sources:
    - https://www.bookreporter.com/authors/karin-slaughter/news/interview-091803

- id: karin-slaughter-will-trent-dyslexia-origin
  date: 2006
  dateRange: "2006-2012"
  title: Giving Will Trent something to hide
  scope: author-life
  reach: franchise
  impact: high
  description: >
    [[character:karin-slaughter/will-trent|Will Trent]] has been dyslexic
    since his first appearance in [[work:karin-slaughter/triptych|Triptych]]
    (2006), a trait Slaughter explained in a 2012 interview timed to
    Criminal's UK release: "Being able to read fluently is such a natural
    thing, especially for people who read books, so I wanted to give you
    something that made you feel like an outsider. Also, your dyslexia is
    something you hide from other people, which gives you insight into the
    criminals you speak with who are, after all, hiding something." He
    remains capable of reading, she noted, just not quickly, and covers for
    it by having Faith Mitchell handle his paperwork. Every scene of Will
    concealing his dyslexia from a colleague or a suspect carries that
    deliberate parallel: a detective who reads people for a living because
    the printed page never came easily to him.
  spoilerAfter: null
  sources:
    - http://wwwshotsmagcouk.blogspot.com/2012/07/karin-slaughter-interview-with-will.html

- id: karin-slaughter-criminal-help-for-policewomen-2012
  date: 2012
  title: What The Help did for race, Criminal does for the badge
  scope: author-life
  reach: franchise
  impact: med
  description: >
    [[work:karin-slaughter/criminal|Criminal]] splits its narrative between
    the present day and 1975, when Atlanta's first women in law enforcement
    were routinely called slurs to their faces, denied a car loan or credit
    card without a man's signature, and required a corroborating trace of
    semen to bring a rape charge. Slaughter has said she set out to do for
    sexism in policing what her friend Kathryn Stockett's The Help did for
    race, researching the era at the Atlanta History Center and interviewing
    veteran policewomen directly; she named one of the novel's missing
    women "Kitty" in tribute to Stockett. The 1970s strand is not ornamental
    period detail - it is the argument the book is making.
  spoilerAfter: null
  sources:
    - https://www.atlantamagazine.com/great-reads/karin-slaughter/

- id: karin-slaughter-cop-town-steel-dagger-2015
  date: 2015-09
  title: A standalone departure wins her biggest UK prize
  scope: culture
  reach: franchise
  impact: med
  description: >
    [[work:karin-slaughter/cop-town|Cop Town]] (2014) was Slaughter's first
    standalone after thirteen years inside the Grant County and Will Trent
    series, and in September 2015 it won the Crime Writers' Association's
    Ian Fleming Steel Dagger, awarded annually to the year's best thriller.
    The judges called it "a fascinating story filled to the brim with rich
    and evocative period detail of Atlanta in 1974," with characters that
    read as "instantly real, engaging, well-drawn and convincing." It was
    also her first Edgar nomination for Best Novel: proof, alongside Cop
    Town's commercial success, that the standalone experiment paid off
    critically as well as on the bestseller lists that had carried her
    series work.
  spoilerAfter: null
  sources:
    - https://authorsguild.org/member-awards/karin-slaughter-wins-ian-flemming-steel-dagger-award/
    - https://en.wikipedia.org/wiki/Karin_Slaughter

- id: karin-slaughter-false-witness-pandemic-2021
  date: 2021-07
  title: Writing the pandemic into a thriller, on purpose
  scope: world
  reach: franchise
  impact: med
  description: >
    [[work:karin-slaughter/false-witness|False Witness]] (2021) is set during
    COVID-19 deliberately - Slaughter polled other novelists early in the
    pandemic about whether to write it into their contemporary fiction and
    found most planning to avoid it, until Michael Connelly told her he
    intended to include it: "I thought if Mike is going to do it, and he
    doesn't catch shit for it, I'm going to do it too." She has been careful
    to frame the result as a thriller that happens to take place during the
    pandemic rather than a novel about it, wanting room for the texture
    nonfiction couldn't capture - hand sanitizer that smells like tequila,
    "maskholes" who wear a mask below the nose - alongside its estranged
    sisters' reckoning with a shared past trauma.
  spoilerAfter: null
  sources:
    - https://booktrib.com/2021/07/27/itw-spotlight-karin-slaughter-captures-tragedy-in-a-way-nonfiction-cant-in-false-witness/

- id: karin-slaughter-pieces-of-her-netflix-2022
  date: 2022-03-04
  title: "Pieces of Her debuts at #1 worldwide on Netflix"
  scope: industry
  reach: franchise
  impact: med
  description: >
    The eight-episode adaptation of [[work:karin-slaughter/pieces-of-her|Pieces
    of Her]], starring Toni Collette and Bella Heathcote, premiered on
    Netflix on March 4, 2022 and debuted at #1 worldwide; between February
    27 and April 3, 2022 it was watched 227.5 million hours globally. It was
    the first of Slaughter's novels adapted for the screen, opening the door
    to the Will Trent series the following year.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Karin_Slaughter

- id: karin-slaughter-will-trent-abc-premiere-2023
  date: 2023-01-03
  title: Will Trent reaches television
  scope: industry
  reach: franchise
  impact: med
  description: >
    ABC's "Will Trent," starring Ramón Rodríguez as the GBI agent and Erika
    Christensen as Angie Polaski, premiered January 3, 2023 on ABC and Hulu.
    It gave a print series that had been running since 2006 a mainstream
    television audience for the first time, and was renewed for a fourth
    season, which premiered January 6, 2026.
  spoilerAfter: null
  sources:
    - https://en.wikipedia.org/wiki/Karin_Slaughter
    - https://www.ajc.com/life/radiotvtalk-blog/atlanta-author-karin-slaughters-will-trent-books-turned-into-abc-series/QC5I2AEWGFBVRDULGHWAVNZP6E/
