# Bibliography (works) - IDs are STABLE and permanent (user data references
# them). Dates are year-precision (docs/SCHEMA.md). Complete first draft: all
# 6 Grant County novels, all 12 Will Trent novels to date, both North Falls
# novels (the second still forthcoming), 6 standalone novels, and 10 short
# stories/novellas that clear the bar. Subseries groupings follow the
# publisher's own site (karinslaughter.com), which files every book under
# exactly one of "Will Trent Series", "North Falls Series", "Grant County
# Series" or "Standalone Novels" - no invented grouping.
#
# THE WING'S STRUCTURAL SPINE: Sara Linton is the bridge between Grant County
# and Will Trent. The publisher's own copy states the fact of the crossover
# plainly ("Sara Linton from The Grant County Series joins the Will Trent
# series"), so that much is safe to record here. What is NOT recorded in any
# synopsis, note or connection below is *why* she leaves Heartsdale for
# Atlanta. Every synopsis past Beyond Reach is written to be true without
# depending on that fact; see characters.yaml
# (karin-slaughter/jeffrey-tolliver) for where the boundary actually sits.

# --- Grant County (2001-2007, complete) ---

- id: karin-slaughter/blindsighted
  title: "Blindsighted"
  authorIds: [karin-slaughter]
  published: 2001
  subseries: "Grant County"
  canonTier: core
  synopsis: >
    A young college professor is found brutally mutilated in a small Georgia
    diner, and pediatrician-turned-coroner Sara Linton's autopsy uncovers a
    killer's twisted signature. Her ex-husband, police chief Jeffrey Tolliver,
    leads the hunt as the case turns toward Sara's own past and toward
    detective Lena Adams's hunger for justice of her own.
  sources:
    - https://www.karinslaughter.com/grant-county/blindsighted

- id: karin-slaughter/kisscut
  title: "Kisscut"
  authorIds: [karin-slaughter]
  published: 2002
  subseries: "Grant County"
  canonTier: core
  synopsis: >
    A teenage quarrel at the Heartsdale skating rink explodes into a
    shoot-out, and the abduction that follows entangles medical examiner Sara
    Linton and police chief Jeffrey Tolliver in a case darker than either
    expects, while detective Lena Adams, recovering from a staggering
    personal loss, is drawn to a young man who may hold the answers.
  sources:
    - https://www.karinslaughter.com/grant-county/kisscut

- id: karin-slaughter/a-faint-cold-fear
  title: "A Faint Cold Fear"
  authorIds: [karin-slaughter]
  published: 2003
  subseries: "Grant County"
  canonTier: core
