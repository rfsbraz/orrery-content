# Concrete published editions: the first English edition for every work that
# has one (Allende writes in Spanish; English is the second-most-published
# language across her catalogue after Portuguese), plus the current
# Portuguese-market edition for every work Portugal has actually published.
# 30 of 36 works have at least one edition; 27 of 36 have an English edition;
# 30 of 36 have a pt-PT edition. The six with none - the three 1974 Chilean
# juvenilia pieces, the two apocrypha chapbooks, and "Perla and the Princess"
# (announced for 1 September 2026, not yet released) - have no translated
# printing found in any source checked, not a research gap.
#
# SOURCES. English: each work's own English Wikipedia infobox, cross-checked
# against the specific OpenLibrary edition record for the ISBN cited (its
# `by_statement`/`contributions` fields, which come from the book's own
# copyright page) - not OpenLibrary's aggregated work-level search, which
# mixes contributors across every language and printing of a title.
# Margaret Sayers Peden's own English Wikipedia "selected translations" list
# corroborates eleven of her Allende credits directly; the rest (Eva Luna, The
# Infinite Plan, Kingdom of the Golden Dragon, Forest of the Pygmies, The Sum
# of Our Days) are confirmed instead by that title's own OpenLibrary edition
# record. Portuguese: the Biblioteca Nacional de Portugal's ipac20 catalogue
# (catalogo.bnportugal.gov.pt), queried by author name and read as a browser -
# 271 records swept across all 28 result pages, giving publisher, translator,
# city, edition/reprint number and ISBN for every printing BNP holds. The
# citation on each pt-PT entry is that printing's own ISBN-indexed permalink
# (`ipac.jsp?index=ISBN&term=<isbn>&profile=bn`).
#
# THE PORTUGUESE PUBLISHER. Difel (Lisboa, later Algés/Miraflores) published
# essentially the whole backlist from 1982 (the year of the Spanish original)
# through 2010, alongside parallel Círculo de Leitores book-club printings.
# Difel's imprint was replaced by a short-lived "Inapa" line in 2009-2010,
# then the whole backlist moved to Porto Editora from 2011 on, which remains
# the active Portuguese publisher today (its newest entry here is a 2026
# forthcoming memoir, already catalogued by BNP). Where BNP shows a long
# reprint run under one Porto Editora ISBN, the latest dated printing of that
# root is cited even when a shelf copy might be an earlier printing of it -
# three titles (A Cidade dos Deuses Selvagens, O Reino do Dragão de Ouro, O
# Bosque dos Pigmeus) show a 2019 reprint under their original 2014 ISBN,
# confirming the standard trade edition, not the parallel 2015-16 "11-17"
# budget line some of these titles also received, is the one still current.
#
# TRANSLATOR CONTINUITY AND CHANGE. Most Portuguese translators carried over
# unchanged from Difel to Porto Editora (Maria Helena Pitta across five
# titles; Carlos Martins Pereira on O Plano Infinito; Suely Bastos on De Amor
# e de Sombra). Three titles were genuinely retranslated for the Porto
# Editora relaunch, not just re-credited: A Casa dos Espíritos and Eva Luna
# (Contos de Eva Luna too) moved from Carlos Martins Pereira's 1982-2010
# Difel translation to Cristina Paixão's in 2013; Paula moved from José
# Carlos Gonzalez's 1995-2008 Difel translation to Ângela Barroqueiro's in
# 2013. On the English side, no single translator is assumed: Margaret Sayers
# Peden translated everything checked from Of Love and Shadows (1987) through
# The Sum of Our Days (2008), sixteen titles. Anne McLean
# translated Maya's Notebook (2013), Ollie Brock and Frank Wynne translated
# Ripper (2014), Nick Caistor and Amanda Hopkinson share credit on The
# Japanese Lover (2015), In the Midst of Winter (2017) and A Long Petal of
# the Sea (2019), and Frances Riddle translated Violeta (2022), The Wind
# Knows My Name (2023) and My Name Is Emilia del Valle (2025).
#
# THE BOGIN/PEDEN CONTRADICTION. works.yaml's own
# header credits Margaret Sayers Peden with translating La casa de los
# espíritus; events.yaml's 1985 English-publication event credits Magda
# Bogin. Resolved here in Bogin's favour, on four independent sources: (1)
# English Wikipedia's "The House of the Spirits" article states outright that
# Alfred A. Knopf's 12 April 1985 first English edition was "Translated by
# Magda Bogin"; (2) Magda Bogin's own English Wikipedia article lists it
# under her "Selected bibliography"; (3) OpenLibrary's aggregated contributor
# list for the work includes "Bogin, Magda" and "Magda Bogin (Translator)";
# (4) the Knopf 1985 edition's own OpenLibrary record (isbn 9780394539072)
# carries the MARC-sourced `by_statement` "Isabel Allende ; translated from
# the Spanish by Magda Bogin." Peden's own English Wikipedia "selected
# translations" list, by contrast, opens with Of Love and Shadows (1987) and
# does not include La casa de los espíritus at all. works.yaml's header
# credit to Peden for this title does not hold up against any of the four
# sources above and should read Bogin instead.
#
# TWO ISBN TRANSCRIPTION FAILURES, not fabricated around. BNP's own records
# for two Porto Editora 2013/2014 printings fail their own check digit: Contos
# de Eva Luna's "978-972-0-04448-7" needs check digit 8, not 7 (sum of the
# first twelve digits is 122); O Meu País Inventado's "978-972-0-04675-5"
# needs check digit 8, not 5 (sum is also 122 - a coincidence of the
# arithmetic, not a pattern). The second is doubly suspicious: the adjacent
# record for a DIFFERENT title, Filha da Fortuna, carries "978-972-0-04675-8"
# - a valid, different check digit on what should be a different item number
# entirely, pointing to a BNP data-entry fault rather than two genuine ISBNs
# sharing a root. No corroborating source (OpenLibrary, Google Books) holds
# either printing, so both editions are recorded below WITHOUT an isbn13
# rather than with a guessed one - publisher, translator, year and title
# are all independently attested and kept.
#
# OUT-OF-PRINT SOLE EDITIONS. Zorro: o Começo da Lenda (Difel, 2005) and
# Afrodite (Difel, 2006, 6th ed.) never reappeared under Porto Editora in any
# of the 271 records swept; each is recorded here as the only Portuguese
# edition that exists, out of print but real. BNP's own three records for
# the Zorro translator's name disagree
# with each other ("J. Teixeira de Aguillar" / "Teixeira de Aguilar" / "J.
# Teixeira de Aguilar") - the two-witness spelling is used here.
#
# NON-LITERAL TITLE. La Ciudad de las Bestias is published in Portugal as "A
# Cidade dos Deuses Selvagens" ("The City of the Savage Gods"), not a literal
# rendering of "City of Beasts" - unambiguous by content (Alexander Cold's
# Amazon expedition is the only candidate), so matched without a title-vs-
# title check.

