# ADDITIONAL canon orders only. The DEFAULT order (all 36 works, publication-
# chronological) is derived from works.yaml and is NOT listed here. No order
# is shipped below; this is a checked, not an assumed, empty state.
#
# TRILOGÍA INVOLUNTARIA - considered and rejected as a curated order.
# The grouping is real (works.yaml's own header sources it to a Penguin
# Random House Spanish-market box set), but it does not clear this
# catalogue's bar the way a comparable grouping did on two other wings:
#   - Checked her own official site directly, book by book, in both
#     languages (isabelallende.com/en/book/thehouse, /daughter, /portrait
#     and the equivalent /es/libro/ pages for La casa de los espíritus,
#     Hija de la fortuna and Retrato en sepia): none uses "trilogy" or
#     "trilogía" anywhere. Unlike
#     gabriel-garcia-marquez/tres-libros (the author's own quoted words)
#     or joao-tordo/lugares-sem-nome (his own site's blurb names the
#     trilogy), no author-acknowledged statement ties these three books
#     together; the label is a retailer's and Goodreads' alone.
#   - The grouping's own numbering is inconsistent across retailers (see
#     works.yaml's header: one retailer lists La casa de los espíritus as
#     "#3"), which is evidence against "settled community practice", not
#     for it.
#   - Even taken at face value, an order for these three would not reorder
#     anything: 1982, 1998 and 2000 are three distinct years with nothing
#     to disambiguate, so the order would be identical to the relevant
#     slice of the derived default, exactly like
#     gabriel-garcia-marquez/tres-libros - except that order's entire
#     justification for existing anyway was García Márquez's own words
#     about the three books being "really just one book," which has no
#     equivalent here.
#
# A CHRONOLOGICAL (in-universe) order for the same three books was also
# considered and rejected, on different grounds. Unlike publication order,
# this WOULD reorder them (the in-story sequence runs Hija de la fortuna's
# 1840s-50s California, then Retrato en sepia's circa-1880s-1910s Chile,
# then La casa de los espíritus's 1910s-70s), so it would clear the
# divergence test - but no source found anywhere recommends reading them
# this way (the aggregator sites that offer a "reading order" for this
# trilogy do not agree with each other, and one sequences them La casa de
# los espíritus, then Retrato en sepia, then Hija de la fortuna - internally
# inconsistent with its own stated publication years). Inventing one would
# also open a real prequel-spoiler vector this catalogue already knows to
# check for: Severo del Valle, Clara's father in La casa de los espíritus,
# is a supporting character in Retrato en sepia in his own right (his War
# of the Pacific service and the loss of a leg), and English Wikipedia's
# own character list for Portrait in Sepia states plainly that "he also
# appears in The House of the Spirits as Clara's father." Reading the
# family's story chronologically would front-load that connective tissue
# ahead of La casa de los espíritus's own reveals about Severo's household
# (Rosa's death among them); reading in publication order, which is what
# the derived default already does, meets La casa de los espíritus first
# and encounters Severo's youth in Retrato en sepia only afterward, so the
# risk stays inert as long as no chronological order ships one.
#
# No other order-shaped candidate was found. Checked and empty: an order
# built from the Alexander Cold/Nadia Santos YA trilogy as a distinct
# reading strategy (it is already a complete, self-contained subseries of
# three via `subseries`, in publication order, with nothing to reorder);
# and a memoir-first thread (Paula, Mi país inventado, La suma de los días,
# Mujeres del alma mía, La palabra mágica) - no source recommends reading
# her memoirs as a set or in a sequence other than the derived default.
#
# Checked: English and Spanish Wikipedia's articles on Isabel Allende and
# on all three Trilogía involuntaria novels; her own official site's
# individual book pages (English and Spanish); Goodreads' own "Trilogía
# Involuntaria" series listing; several books-in-order aggregator sites
# (bookseriesinorder.com, gotbookseriesinorder.com, ordenlectora.com,
# librolibre.es, editorsreads.com, lalibretadenani.com, romance.io) - none
# rising above one blog's opinion, and disagreeing with each other on the
# one question (order) they exist to answer.
#
# One further source is known to exist but was not readable: Karen Wooley
# Martin's "Isabel Allende's House of the Spirits Trilogy: Narrative
# Geographies" (Tamesis, 2010), a book-length study treating the three as
# a critical unit (cited on this wing's own eras.yaml as the reason the
# trilogy is a subseries rather than an era). Its publisher page and its
# JSTOR record were not reachable; whether it argues for any reading
# sequence, or only analyses the three as published, is not established,
# so nothing from it is carried here.
[]
