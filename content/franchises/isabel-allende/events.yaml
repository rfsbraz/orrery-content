# Franchise-specific events: what happened to the BOOKS, not the life
# (author-life events belong on content/authors/isabel-allende.yaml
# instead). Append-only; parallel branches merge here.

- id: allende-florida-book-ban-2023
  date: 2023-12
  title: Two novels pulled from Florida school shelves
  scope: culture
  reach: franchise
  impact: med
  description: >
    La casa de los espíritus (1982) and Más allá del invierno (2017) are
    among 673 titles removed from Florida classrooms under state laws
    targeting depictions of sexuality, part of a wave that also caught
    Márquez, Atwood and Dan Brown. Allende's own reaction, on the record:
    "Para mí es un honor que me hayan prohibido" ("For me it's an honor
    that they banned me") - and that a ban only makes young readers want
    the book more.
  spoilerAfter: null
  sources:
    - https://www.infobae.com/leamos/2023/12/28/prohiben-en-estados-unidos-dos-libros-de-la-autora-mas-vendida-en-argentina-por-que-frases-llego-a-la-lista-negra/
    - https://es.wikipedia.org/wiki/Isabel_Allende

- id: allende-house-of-spirits-amazon-miniseries-2026
  date: 2026-04-29
  title: La casa de los espíritus reaches the screen again, 44 years on
  scope: culture
  reach: franchise
  impact: med
  description: >
    An 8-part Amazon Prime Video miniseries adapts the novel, with
    Alfonso Herrera as Esteban Trueba, Dolores Fonzi as Clara del Valle
    Cortés and Rochi Hernández as Alba Satigny Trueba - the first
    television treatment of the book that made her name, following a
    2018 Hulu attempt that never aired.
  spoilerAfter: null
  sources:
