# Bibliography (works) - the abstract books; editions/covers are separate
# metadata. IDs are STABLE and permanent (user data references them). Dates
# are year-precision (docs/SCHEMA.md); the default reading order (all
# works, publication order) is DERIVED from this file, never written by
# hand.
#
# SCOPE. Every book credited to Allende found across English and Spanish
# Wikipedia's own articles (there is no single dedicated "bibliography"
# page on either, unlike Gabriel García Márquez's or Haruki Murakami's
# wings - the list here was assembled from Isabel_Allende's own "Works"
# section on both languages, her fifteen individual work articles, and her
# official site's own book list, isabelallende.com/en/books, cross-checked
# against each other) plus her official site's book pages, which is also
# the only source for her three most recent English-original children's
# books - none of which yet has a Wikipedia article of its own. 36 works
# total, running from her actual first published book (Civilice a Su
# Troglodita, 1974, a satirical newspaper-column collection - not the
# debut novel most sources open with) through a children's picture book
# announced for 1 September 2026. The request issue's recollection of
# "around 25 books since The House of the Spirits" undercounts the real,
# verified total by design (it explicitly flags itself as unsourced
# recollection): counting only from 1982 forward still comes to 33, and
# the wing's own ruling is that a wing spans an author's COMPLETE
# published work, so the three 1974 items are catalogued too.
#
# CANON TIER is a publication-kind judgment, not a fame or quality one
# (SCHEMA.md, CURATION.md #7) - the same discipline this catalogue already
# applies to Saramago and Grisham. CORE is the 20 novels: the
# narrative-fiction spine every source checked builds from. EXTENDED is
# genuinely hers, off the novel-reading spine: 1 short-story collection, 6
# memoirs, 3 pieces of 1974 juvenilia/journalism, a 1984 illustrated
# children's story (see this file's own note on its title), and 3
# English-original children's picture books. APOCRYPHA is for the 2 items
# that fit neither: a slim story-plus-essay chapbook and a compiled
# anthology of her own previously published love scenes.
#
# TRANSLATORS. Margaret Sayers Peden translated most of her catalogue from
# Daughter of Fortune (1998) onward into the mid-2010s and, per her own
# English Wikipedia article, La casa de los espíritus itself - but not all
# of it: Nick Caistor and Amanda Hopkinson share credit on The Japanese
# Lover (2015) and A Long Petal of the Sea (2019), and Frances Riddle
# translated Violeta (2022) and My Name Is Emilia del Valle (2025). No
# single-translator assumption is made anywhere in this file; per-edition
# translator credit belongs in editions.yaml once that stage runs.
#
# SUBSERIES - settled, both with publisher-level evidence, not guessed:
# - "Trilogía involuntaria" ("Involuntary Trilogy") groups La casa de los
#   espíritus, Hija de la fortuna and Retrato en sepia. Penguin Random
#   House's own Spanish-market box set uses exactly this title ("Reunidas
#   por primera vez bajo el título «Trilogía involuntaria»" - a retailer
#   listing for that PRH-distributed set, iberiapapeleriatoys.com); the
#   three are grouped this way on Goodreads and community sites too. Some
#   retailer listings (e.g. romance.io) number La casa de los espíritus
#   "#3" rather than "#1" - an ordering inconsistency, not a naming one -
#   so `subseries` records the label only; the derived reading order
#   still runs on each work's own `published` year.
# - "Las memorias del Águila y del Jaguar" ("Memories of the Eagle and the
#   Jaguar") groups the three Alexander Cold/Nadia Santos YA novels.
#   Sourced to the publisher directly: Penguin Random House's own series
#   page (penguinrandomhouse.com/series/MEJ) and English Wikipedia's own
#   infobox on Forest of the Pygmies, which carries `series: Las memorias
#   del águila y el jaguar` sourced to terra.org.
#
# CONSIDERED AND LEFT OUT:
# - Four plays she wrote and saw staged in Santiago before going into
#   exile - El embajador (1971), La balada del medio pelo (1973), Yo soy
#   la Tránsito Soto (1973) and Los siete espejos (1975) - are documented
#   everywhere as "estrenada" (premiered), never as published scripts; no
#   source checked here shows any of the four issued as a book, which is
#   what this catalogue requires of a work (the format:play definition in
#   docs/SCHEMA.md is explicitly "a PUBLISHED stage script").
# - "Dos Palabras" ("Two Words"), listed as its own line in English
#   Wikipedia's Fiction table under 1989, is the opening and best-known
#   story inside Cuentos de Eva Luna (catalogued below as one collection),
#   not a separately published book - the same principle already applied
#   to a title inside a collection on other wings in this catalogue.
#
# A NOTE ON TITLES. "La ninfa de porcelana" is this file's title for the
# item Alfaguara first published in 1984, illustrated by Fernando Krahn in
# its "Juvenil" (youth) series, as "La gorda de porcelana." It has its own
# English Wikipedia article, "The Porcelain Fat Lady," which calls it "a
# children's story" outright and carries it under the categories "1984
# children's books" and "Spanish-language children's books" - not a
# novella, despite the "cuento" length reading closer to a short story
# than a picture book. Her own official site (isabelallende.com/es/book/
# ninfa) now uses "La ninfa de porcelana" for the same story - same
# protagonist (Don Cornelio), same porcelain figure (Fantasía) - reissued
# in 2017 as an illustrated "cuento para colorear" (colouring-book
# edition); the retitling is a reissue, not a different work. The current
# title is used here, consistent with this catalogue's rule that a living
# author's own current usage governs where sources disagree on a title;
# `published` stays 1984, the year of the original edition.

# --- 1974: journalism and children's juvenilia ---

- id: isabel-allende/civilice-a-su-troglodita
  title: "Civilice a Su Troglodita"
  authorIds: [isabel-allende]
  published: 1974
  subseries: null
  canonTier: extended
  format: essay-collection
  synopsis: >
    A collection of the satirical humor columns Allende wrote for Chilean
    outlets in the early 1970s, illustrated by Ricardo Güiraldes.
  note: >
    By Allende's own account (English Wikipedia, sourced to her interview
    record), this collection - not a novel - is her actual first
    published book: she compiled it on the advice of poet Pablo Neruda,
    whom she had gone to interview and who told her she had too much
    imagination to be a journalist. Catalogued (National Library of
    Chile's Memoria Chilena digital collection) as Editorial Lord
    Cochrane, Santiago, 1974.
  sources:
    - https://en.wikipedia.org/wiki/Isabel_Allende
    - https://www.memoriachilena.gob.cl/602/w3-article-65095.html

- id: isabel-allende/la-abuela-panchita
  title: "La Abuela Panchita"
  authorIds: [isabel-allende]
  published: 1974
  subseries: null
  canonTier: extended
  format: picture-book
  synopsis: >
    An illustrated children's story, one of two Allende published while
    on the editorial staff of the Chilean children's magazine Mampato.
  note: >
    Illustrated by Marta Carrasco, Editorial Lord Cochrane, Santiago -
    per both English and Spanish Wikipedia's own Works sections.
  sources:
    - https://en.wikipedia.org/wiki/Isabel_Allende
    - https://es.wikipedia.org/wiki/Isabel_Allende

- id: isabel-allende/lauchas-y-lauchones-ratas-y-ratones
  title: "Lauchas y Lauchones, Ratas y Ratones"
  authorIds: [isabel-allende]
  published: 1974
  subseries: null
  canonTier: extended
  format: picture-book
  synopsis: >
    A second illustrated children's story from the same Mampato period as
    La Abuela Panchita.
  note: >
    Editorial Lord Cochrane, Santiago - per both English and Spanish
    Wikipedia's own Works sections.
  sources:
    - https://en.wikipedia.org/wiki/Isabel_Allende
    - https://es.wikipedia.org/wiki/Isabel_Allende

# --- Novels (core, 20) ---

- id: isabel-allende/la-casa-de-los-espiritus
  title: "La Casa de los Espíritus"
  authorIds: [isabel-allende]
  published: 1982
  subseries: "Trilogía involuntaria"
  canonTier: core
  featured: true
  synopsis: >
    Across three generations of the Trueba family in an unnamed South
    American country, a clairvoyant matriarch's gift for seeing the
    future and a patriarch's iron will collide with land reform,
    revolution and, in the end, a military coup that her granddaughter
    survives to tell the story.
  note: >
    Allende's literary debut, begun in January 1981 as a letter to her
    dying grandfather while she was in exile in Caracas; her own
    long-standing writing ritual is to start a new book every 8 January
    in its memory (isabelallende.com/en/timeline). First of the
    "Trilogía involuntaria" grouping - see this file's own header.
  sources:
    - https://en.wikipedia.org/wiki/The_House_of_the_Spirits
    - https://www.isabelallende.com/en/timeline

- id: isabel-allende/de-amor-y-de-sombra
  title: "De Amor y de Sombra"
  authorIds: [isabel-allende]
  published: 1984
  subseries: null
  canonTier: core
  synopsis: >
    A magazine journalist and a photographer, investigating a massacre
    hidden by a Latin American military dictatorship, uncover the
    regime's atrocities and fall in love in the course of exposing them.
  sources:
    - https://en.wikipedia.org/wiki/Of_Love_and_Shadows
    - https://es.wikipedia.org/wiki/Isabel_Allende

- id: isabel-allende/eva-luna
  title: "Eva Luna"
  authorIds: [isabel-allende]
  published: 1987
  subseries: null
  canonTier: core
  synopsis: >
    An orphaned, self-taught storyteller in an unnamed South American
    country narrates her own life from an improvised childhood through
    decades of the country's political upheaval, her voice interwoven
    with that of Rolf Carlé, an Austrian immigrant filmmaker.
  sources:
    - https://en.wikipedia.org/wiki/Eva_Luna

- id: isabel-allende/el-plan-infinito
  title: "El Plan Infinito"
  authorIds: [isabel-allende]
  published: 1991
  subseries: null
  canonTier: core
  synopsis: >
    Gregory Reeves, a North American man, is traced across five decades
    from a childhood in Los Angeles through the Vietnam War to the
    crises of his later life.
  note: >
    Her first novel with a male American protagonist rather than a South
    American setting or narrator.
  sources:
    - https://en.wikipedia.org/wiki/The_Infinite_Plan

- id: isabel-allende/hija-de-la-fortuna
  title: "Hija de la Fortuna"
  authorIds: [isabel-allende]
  published: 1998
  subseries: "Trilogía involuntaria"
  canonTier: core
  synopsis: >
    Eliza Sommers, a young Chilean woman raised by English expatriates in
    1840s Valparaíso, disguises herself and stows away to California
    during the Gold Rush in pursuit of the man she loves, and finds a
    life she did not plan on the way.
  note: >
    Second of the "Trilogía involuntaria" grouping - see this file's own
    header. An Oprah's Book Club selection, February 2000.
  sources:
    - https://en.wikipedia.org/wiki/Daughter_of_Fortune

- id: isabel-allende/retrato-en-sepia
  title: "Retrato en Sepia"
  authorIds: [isabel-allende]
  published: 2000
  subseries: "Trilogía involuntaria"
  canonTier: core
  synopsis: >
    Aurora del Valle, granddaughter of Daughter of Fortune's Eliza
    Sommers, has no memory of her own first five years and spends the
    book piecing her erased early childhood and her family's buried
    history back together.
  note: >
    Third of the "Trilogía involuntaria" grouping - see this file's own
    header. A direct sequel to Hija de la fortuna; its own family
    connections (Paulina del Valle among them) resurface decades later in
    Mi nombre es Emilia del Valle (2025) - see that work's own note.
  sources:
    - https://en.wikipedia.org/wiki/Portrait_in_Sepia

- id: isabel-allende/la-ciudad-de-las-bestias
