# --- Apocrypha (2) ---

- id: isabel-allende/los-amantes-del-guggenheim
  title: "Los Amantes del Guggenheim / El Oficio de Contar"
  authorIds: [isabel-allende]
  published: 2007
  subseries: null
  canonTier: apocrypha
  synopsis: >
    A slim volume pairing a short story - two strangers found asleep
