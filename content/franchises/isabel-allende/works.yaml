    they uncover a hidden tribe's secret.
  note: >
    First of "Las memorias del Águila y del Jaguar" - see this file's own
    header.
  sources:
    - https://en.wikipedia.org/wiki/City_of_the_Beasts

- id: isabel-allende/el-reino-del-dragon-de-oro
  title: "El Reino del Dragón de Oro"
