# --- Memoir and nonfiction, extended ---

- id: isabel-allende/paula
  title: "Paula"
  authorIds: [isabel-allende]
  published: 1994
  subseries: null
  canonTier: extended
  format: memoir
  synopsis: >
    Begun at a hospital bedside in Madrid in December 1991, when
    Allende's daughter Paula fell gravely ill and into a coma: the story
    of the family - the eccentric ancestors, the Chilean childhood, the
    1973 coup, the years of exile - set down for a daughter who could not
    hear it, and carried on past her death the following year.
  note: >
    Publisher copy for this book, in English and Spanish alike, stops at
    the coma: "In December 1991, Isabel Allende's daughter Paula became
    gravely ill and shortly thereafter fell into a coma. During months in
    the hospital, the author began to write the story of her family for
    her unconscious daughter" (isabelallende.com/en/book/paula/summary;
    HarperCollins' current edition page carries the same sentence).
    Paula Frías Allende's death on 6 December 1992 is nonetheless a
    matter of public record rather than a reveal this book holds back -
    it is dated on Allende's own timeline, it is why the Isabel Allende
    Foundation exists, and the jacket copy for the sequel memoir names it
    outright ("the death of her daughter, Paula",
    isabelallende.com/en/book/thesum/summary). It is stated here plainly
    and once, and the wing does not shield it.
  sources:
    - https://www.isabelallende.com/en/book/paula/summary
    - https://en.wikipedia.org/wiki/Paula_(memoir)
  images:
    cover: "https://covers.openlibrary.org/b/id/40271-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL1905373W"

