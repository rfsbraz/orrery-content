- id: isabel-allende/el-viento-conoce-mi-nombre
  title: "El Viento Conoce Mi Nombre"
  authorIds: [isabel-allende]
  published: 2023
  subseries: null
  canonTier: core
  synopsis: >
    Two child refugees separated from their families eight decades
