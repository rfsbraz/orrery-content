- id: isabel-allende/retrato-en-sepia
  title: "Retrato en Sepia"
  authorIds: [isabel-allende]
  published: 2000
  subseries: "Trilogía involuntaria"
  canonTier: core
  synopsis: >
    Aurora del Valle, raised in privilege by her formidable grandmother
    Paulina del Valle, carries no memory at all of the first five years
    of her life, and - betrayed by the man she loves - sets out to
    uncover the trauma that erased them and the family secrets buried
    with it.
  note: >
    Third of the "Trilogía involuntaria" grouping - see this file's own
    header. A direct sequel to Hija de la fortuna; its own family
    connections (Paulina del Valle among them) resurface decades later in
    Mi nombre es Emilia del Valle (2025) - see that work's own note.

    Aurora's descent from Hija de la fortuna's Eliza Sommers is
    deliberately not stated in the synopsis. The publisher's own copy for
    this novel, in both languages, introduces her through the grandmother
    who raised her, Paulina del Valle, and names neither Eliza nor Tao
    Chi'en (isabelallende.com/en/book/portrait/summary,
    /es/book/portrait/summary, and HarperCollins' current edition page);
    Hija de la fortuna's own copy leaves Eliza in Gold Rush California
    and says nothing about descendants. Naming the line here would
    resolve, on the shelf, an outcome the earlier book's cover withholds.
    The same holds for Severo del Valle, who appears in this novel in his
    own right - his War of the Pacific service, the leg he loses - and is
    Clara's father in La casa de los espíritus: the connection is real
    and documented (English Wikipedia's character list for Portrait in
    Sepia states it outright), but it is nowhere in either novel's jacket
    copy, and the shelf's publication order meets La casa de los
    espíritus first, so it is left unstated here rather than carried
    across the two entries.
  sources:
    - https://en.wikipedia.org/wiki/Portrait_in_Sepia
  images:
    cover: "https://covers.openlibrary.org/b/id/52791-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL1905303W"

