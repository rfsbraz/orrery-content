- id: isabel-allende/amor
  title: "Amor"
  authorIds: [isabel-allende]
  published: 2012
  subseries: null
  canonTier: apocrypha
  synopsis: >
    A compiled anthology of love and erotic scenes drawn from across her
    own previously published books, organized by stage of life, opening
    with a new essay on her own first experiences with sex.
  note: >
    Per its own official-site summary (isabelallende.com/en/book/amor,
    Spanish-only text, no English edition), first published in Germany,
    with editions in other languages following - so likely composed and
    first issued in German translation rather than Spanish, an inversion
    of every other item in this bibliography; the German edition's own
    year is not found. `published` follows the first Spanish edition
    instead, per this catalogue's rule that a non-anglophone author's
    `published` year tracks the original language, not a foreign
    first-translation. That Spanish year is itself contested: her own
    site's Spanish page (isabelallende.com/es/book/amor) reads "Primera
    edición en español (c)2011," but the Library of Congress catalog
    record for the first Plaza & Janes trade edition (ISBN
    978-84-01-35375-8, LCCN 2013369406) gives Nov 8, 2012 - kept here as
    `published` since it is a dated first-edition record, against a
    copyright-page year that may predate the book's actual public
    release; the two sources remain uncorroborated against each other.
    No `format` value in this catalogue's taxonomy
    covers a self-compiled anthology of an author's own prior fiction
    plus one new essay, so none is set here.
  sources:
    - https://www.isabelallende.com/en/book/amor/summary
    - https://openlibrary.org/works/OL16805507W/editions.json
    - https://es.wikipedia.org/wiki/Isabel_Allende
