# --- Children's story, extended ---

- id: isabel-allende/la-ninfa-de-porcelana
  title: "La Ninfa de Porcelana"
  authorIds: [isabel-allende]
  published: 1984
  subseries: null
  canonTier: extended
  format: picture-book
  synopsis: >
    A grey, rigidly punctual notary clerk falls for a porcelain figure
    named Fantasía in a shop window, spends a month's wages on her, and -
    unable to bring her into his flat - hides her at work instead, where
    his ordered life takes a wonderful turn as she sets about giving it
    colour.
  note: >
    Confirmed against the story's own English Wikipedia article (he "is
    not allowed to bring Fantasía into his flat" and "tries to hide her at
    work") rather than the publisher's own copy, which is briefer than the
    synopsis needs: "un hombre gris, cuya vida da un maravilloso vuelco un
    día de otoño [...] una ninfa llamada Fantasía, que parece decidida a
    dar color a su vida" (isabelallende.com/es/book/ninfa/summary). What
    Don Cornelio does with the life she gives him back is the story's
    whole ending, and neither source states it. There is no English
    jacket to check against: her own site's English page for this title
    reads only "This book has not been published in English."

    A children's story, not a novel or novella: Alfaguara first published
    it in 1984 as "La gorda de porcelana," illustrated by Fernando Krahn,
    in its "Juvenil" (youth) series. It has its own English Wikipedia
    article, "The Porcelain Fat Lady," which calls it outright "a
    children's story" and categorizes it under "1984 children's books."
    Her own official site now titles it "La ninfa de porcelana" for a
    2017 illustrated reissue as a "cuento para colorear" (colouring
    book) - same protagonist (Don Cornelio) and same porcelain figure
    (Fantasía), so a reissue of the same work rather than a different
    one. `published` stays 1984, the year of the original edition; the
    title follows this catalogue's rule that a living author's own
    current usage governs where sources disagree. Tiered here alongside
    her other children's books (see this file's header) rather than with
    the 20 novels - a publication-kind correction, not a judgment on the
    story's quality.
  sources:
    - https://en.wikipedia.org/wiki/The_Porcelain_Fat_Lady
    - https://www.isabelallende.com/en/book/ninfa
  images:
    cover: "https://covers.openlibrary.org/b/id/13583236-L.jpg"
    coverCredit: "Open Library"
    coverSource: "https://openlibrary.org/works/OL34817316W"
    # This is the 2017 Alfaguara "cuento para colorear" reissue jacket,
    # illustrated by Ana de Luna - not Fernando Krahn's original 1984
    # artwork, which this catalogue's other checks (Open Library, the
    # author's own site) turned up no cover for under either title ("La
    # gorda de porcelana" or "La ninfa de porcelana"). Confirmed the
    # right book, not a mismatch: same protagonist and porcelain figure
    # per the jacket's own subtitle, matching this entry's note above.
    # A same-titled second Open Library record (OL26392722W) carries an
    # identical image; a third, filed under the ORIGINAL title "La gorda
    # de porcelana" (OL1905292W, cover_i 12260971), turned out on
    # inspection to be a Turkish edition ("Porselen Peri") mismatched
    # onto that record - rejected.

