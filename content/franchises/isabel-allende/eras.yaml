# Creative periods. There are none on record.
#
# No critic, scholar, reference work, settled reader consensus or the author
# herself divides this career into named creative periods with recognisable
# names and boundary years, the way "the Golden Age of detective fiction" or
# "the Bachman years" are received. Sought in English and in Spanish, the
# language she writes in: the anglophone book-length criticism, the
# Spanish-language and Chilean scholarly indexes (Dialnet, SciELO), the
# reference works in both languages, and her own site in both. All of them
# return the same three things and nothing else: chronological biography,
# book-by-book criticism, and membership of a movement she never left.
#
# What the fullest sources actually do:
#
#  - Her own account names no phases and rather pointedly declines to. The
#    biography on her site opens by refusing the form: "It is very strange to
#    write one's biography because it is just a list of dates, events, and
#    achievements. In reality, the most important things about my life
#    happened in the secret chambers of my heart and have no place in a
#    biography." The timeline beside it runs year by year from the 1940s to
#    the present, mixing books, prizes, marriages and deaths in one
#    undifferentiated column (https://www.isabelallende.com/en/bio,
#    https://www.isabelallende.com/en/timeline).
#  - The book-length studies are organised by novel or by theme, never by
#    period. Karen Castellucci Cox's Isabel Allende: A Critical Companion
#    (Greenwood, 2003) runs a life chapter, one overview chapter titled
#    "Isabel Allende's Fiction: A Study in Contrasts", then a chapter each to
#    The House of the Spirits, Of Love and Shadows, Eva Luna, The Infinite
#    Plan, Daughter of Fortune and Portrait in Sepia
#    (https://doi.org/10.5040/9798400672842). Bonnie M. Craig's Rewriting
#    American Identity in the Fiction and Memoirs of Isabel Allende (Palgrave
#    Macmillan, 2013) is built on themes of nation and belonging that cut
#    across the whole shelf rather than along it
#    (https://doi.org/10.1057/9781137337580).
#  - Reference works run straight through. Britannica calls her "a Chilean
#    American writer in the magic realist tradition" with no end date on the
#    tradition, and sorts the work by kind rather than by era: the debut and
#    its style, then "other novels and fiction", then the nonfiction
#    (https://www.britannica.com/biography/Isabel-Allende).
#
# Four shapes look like candidate periods and fail:
#
#  - MAGICAL REALISM THEN REALISM. The most tempting split, and the author
#    contradicts it herself, book by book: "Magic realism, which was
#    overwhelmingly present in The House of the Spirits, doesn't exist in my
#    second book, Of Love and Shadows [...] There is no magic realism in The
#    Infinite Plan, Aphrodite, Daughter of Fortune or Portrait in Sepia, yet
#    there is a lot of it in [[work:isabel-allende/la-ciudad-de-las-bestias|City
#    of the Beasts]], my first novel for kids." She adds that the label never
#    fitted in the first place: "It's strange that my work has been classified
#    as magic realism because I see my novels as just being realistic
#    literature" (https://www.isabelallende.com/en/interview). The mode is
#    absent from her second book, in 1984, and abundant again in 2002. It is a
#    register she picks up and puts down, not a period she leaves.
#  - THE POST-BOOM. A real and received periodisation, but of Spanish American
#    fiction rather than of this career: her entire output sits inside it, from
#    the 1982 debut to the present. Spanish Wikipedia files the whole body of
#    work under posboom, and A History of Chilean Literature (Cambridge
#    University Press, 2021) carries Lila McDowell Carlsen's chapter "Isabel
#    Allende, the Post-Boom, and Chilean Exile Literature"
#    (https://doi.org/10.1017/9781108766616.025). Membership of a movement is
#    not a line through a shelf.
#  - THE INVOLUNTARY TRILOGY IS A SUBSERIES, NOT A PERIOD, AND THE ARITHMETIC
#    SETTLES IT. The grouping is real and is recorded on the three works
#    themselves, but its members are
#    [[work:isabel-allende/la-casa-de-los-espiritus|La Casa de los Espíritus]]
#    (1982), [[work:isabel-allende/hija-de-la-fortuna|Hija de la Fortuna]]
#    (1998) and [[work:isabel-allende/retrato-en-sepia|Retrato en Sepia]]
#    (2000): sixteen years and seven other books separate the first from the
#    second, so no span holds the three without also holding most of the
#    catalogue. The scholarship treats them as a narrative unit and says so in
#    its title, not as a phase of a life: Karen Wooley Martin, Isabel Allende's
#    House of the Spirits Trilogy: Narrative Geographies (Tamesis, 2010),
#    https://openlibrary.org/works/OL16114472W. A trap for the next reader:
#    searched on its own, "Trilogía involuntaria" in Spanish-language
#    criticism returns Mario Levrero's trilogy of that name almost
#    exclusively; for Allende the phrase is a Spanish-market box-set label,
#    which is where works.yaml sources it from.
#  - AFTER PAULA. Paula Frías fell into a porphyria coma in 1991 and died on 6
#    December 1992; [[work:isabel-allende/paula|Paula]] (1994) is the memoir
#    that came out of it, and the Isabel Allende Foundation is what Allende
#    went on to build in her name
#    (https://www.isabelallende.com/en/timeline). It is the sharpest rupture in
#    the life and it has not been read as one in the work. The scholarship on
#    it is about the book: Linda S. Maier, "Mourning Becomes 'Paula': The
#    Writing Process as Therapy for Isabel Allende", Hispania (2003),
#    https://doi.org/10.2307/20062834, which reads the memoir as a passage
#    through grief, not the catalogue as a before and an after. Nothing on
#    either side of 1992 is grouped by anyone, her included.
#
# Two further shapes are recorded so they are not mistaken for periodisations
# later. English Wikipedia's biography carries a section headed "Exile in
# Venezuela", covering the thirteen Caracas years from 1975 to the 1988 move
# to California in which her first three novels were written; it is a section
# of a life, and no source turns it into a creative period. And the historical
# novels do not arrive in a block: they begin with Hija de la Fortuna (1998)
# and Retrato en Sepia (2000), long before
# [[work:isabel-allende/ines-del-alma-mia|Inés del Alma Mía]] (2006), and they
# never take over, running beside the contemporary-set
# [[work:isabel-allende/el-cuaderno-de-maya|El Cuaderno de Maya]] (2011),
# [[work:isabel-allende/el-juego-de-ripper|El Juego de Ripper]] (2014) and
# [[work:isabel-allende/mas-alla-del-invierno|Más Allá del Invierno]] (2017).
#
# eras: [] is the honest record of a career that has published in every mode
# it ever used, in no fixed order, since 1982.
[]
