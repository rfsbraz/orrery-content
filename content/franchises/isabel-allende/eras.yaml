# Creative periods. None are claimed here. Two real shapes surfaced during
# this scaffold but are not corroborated against a primary or scholarly
# periodisation strong enough to plate as an era:
# - A "Venezuelan exile" period, 1975-1988: everything from La casa de los
#   espíritus (1982) through Eva Luna (1987) was written during her
#   thirteen years in Caracas, before her 1988 move to California. Widely
#   stated as biographical fact (English and Spanish Wikipedia both), but
#   neither source frames it as a named creative period the way both
#   describe García Márquez's "Macondo period."
# - A shift toward historical fiction grounded in specific documented
#   events (Inés del alma mía, 2006, onward through Largo pétalo de mar,
#   2019, and Violeta, 2022) versus the earlier, more contemporary-set
#   novels - a pattern visible in this file's own works.yaml, not sourced
#   to any critic or scholar naming it as such.
