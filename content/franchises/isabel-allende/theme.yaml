# Branding for the Isabel Allende wing (see Orrery CONCEPT SS6 and
# docs/SCHEMA.md#themeyaml). Not the one obvious costume - candles, ghosts
# and a green-walled house of spirits, which would flatten a
# thirty-six-work career onto its single most famous novel. The register
# instead is the recovered family document: nearly every book on this
# shelf is framed as something found or written down rather than told
# straight - La casa de los espíritus opens from clairvoyant Clara's own
# notebooks, Paula is a literal letter to a comatose daughter, Inés del
# alma mía and Violeta are both framed as an old woman's memoir addressed
# to a specific person, and Retrato en Sepia is itself named for an old
# photograph - a through-line across her fiction and her memoir alike,
# not one book's device.
#
# ART. The through-line above is itself downstream of one dated,
# biographical fact rather than a mood invented for the shelf: on 8
# January 1981, in exile in Caracas, Allende began a letter to her dying
# 99-year-old grandfather in Chile - a letter that became La casa de los
# espíritus, and a private ritual (starting a new book every 8 January in
# his memory) she has kept for every book since. What that fact repeats
# across the whole bibliography, not just the debut, is address: a
# document written by hand, by one person, for one named and often
# unreachable reader - Paula's memoir set down at a comatose daughter's
# bedside "for a daughter who could not hear it," Violeta's own life
# story "writing in old age as a letter to someone she loves," Inés del
# alma mía's memoir "addressed to her adoptive daughter," Maya writing
# her way through the year of El Cuaderno de Maya, Alma confessing a
# lifelong secret to one listener in El Amante Japonés. Retrato en Sepia
# folds in the other half of the palette's own register (the sepia
# photograph) the same way: Aurora del Valle becomes a photographer to
# recover a past she cannot remember, and the emblem below pairs the two
# real, sourced objects - the addressed page and the sepia photograph -
# rather than inventing either. Checked against theme_digest.py's
# nearest neighbours before settling: José Rodrigues dos Santos owns the
# cold broadcast-newsroom register (not shared); Gabriel García Márquez
# (the immediately prior wing) owns mechanically set, hand-corrected
# newsprint - a public, printed record two hands share, cool jungle
# green - where this wing's document is private, handwritten from the
# first word by one hand only, and warm sepia; Miguel de Cervantes owns
# an iron-gall-brown, indigo-accented world of ledgers and requisition
# slips - administrative paperwork, not a personal letter; J. R. R.
# Tolkien owns a tied bundle of loose foolscap corrected across decades
# by a second hand (an inherited, edited archive) where this wing's
# notebook is bound, single-authored and never annotated by anyone else;
# J. K. Rowling owns a disposable spiral exercise book written fast in a
# cold café for no one in particular, the opposite of a notebook kept
# for one named reader; Margaret Atwood owns a sealed, postmarked parcel
# "never shown opened" where this wing's correspondence is the reverse -
# opened, folded and reread until it goes soft; and Valter Hugo Mãe owns
# the tremulous dip-pen line and rural-Portugal umber already claimed for
# a quiet domestic register (the closest neighbour on `atmosphere` and
# `signature: thread` alike), separated here by geography (Chile,
# Venezuelan and Californian exile, not a Portuguese village), by
# instrument (a steady, unhurried hand, never a tremor), and by the
# second object no other wing carries: the sepia photograph itself.
preset: sepia-archive
palette:
  bg: "#171310"        # near-black warm sepia-brown, an old photograph or
                       # letter paper gone dark with age, not candlelit
                       # gothic black
  surface: "#1f1a15"   # a hair lifted, for cards
  ink: "#f0e6d2"        # warm parchment/cream - high contrast, very
                       # readable
  muted: "#9c8f78"      # faded ink grey-brown, for metadata
  accent: "#b8763f"     # one warm sepia-amber accent - the toning of an
                       # old photograph, used sparingly, never as a fill
                       # or a wash
displayFace: sourceSerif # from the app's implemented set (fraunces |
                       # spectral | sourceSerif); a plain, highly legible
                       # literary serif suits a "recovered document" register
                       # better than fraunces's more decorative flourish -
                       # a first, revisable pick, not checked against every
                       # other wing's own displayFace choice.
signature: thread       # a stitched binding thread - the bound notebook
                       # (Clara's own, in La casa de los espíritus) and the
                       # bound letter-manuscript are the recurring physical
                       # objects this shelf keeps returning to, not a
                       # decorative flourish.
notes: >
  A recovered-document register - old letters, notebooks and
  photographs - built from a real, sourced pattern across the fiction and
  the memoir alike, not from "magical realism" genre costume or from
  La casa de los espíritus alone. displayFace and signature are a first,
  revisable pick from the app's implemented sets.
art:
  emblem:
    object: >
      A single small photograph, its tone faded to warm sepia and its
      corners gone soft with handling, laid face-up on the last written
      page of an open, hand-stitched notebook. The page is filled edge to
      edge with dense, unhurried handwriting up to its final line; a
      plain pen rests beside it, set down rather than left mid-stroke.
    why: >
      Allende's own writing life began as a letter: on 8 January 1981, in
      exile in Caracas, she started writing to her dying grandfather in
      Chile, and the letter became La casa de los espíritus - a ritual
      she has since repeated every 8 January, book after book
      (isabel-allende-grandfather-letter-1981). The same shape - one
      hand, addressed to one person, often unreachable - recurs across
      the shelf: Paula, written at a comatose daughter's bedside; Inés
      del alma mía, a memoir addressed to an adoptive daughter; Violeta,
      "writing in old age as a letter to someone she loves"; El Cuaderno
      de Maya, a year written through rather than lived through. The
      photograph is Retrato en Sepia's own device - Aurora del Valle
      becomes a photographer to recover a past she cannot remember - and
      pairing it with the notebook states the wing's two sourced
      anchors, address and image, as one object rather than two
      competing ones.
  motifs:
    - a small sepia photograph, corners softened with handling, tucked
      between the pages of a bound notebook or propped against a lamp
    - a page filled to its last line in one continuous, unhurried hand,
      the ink of the final words still dark and wet
    - a bundle of letters, read and reread until the folds have gone
      soft, tied loosely with a worn ribbon rather than sealed
    - a bedside table at night, a low lamp or a guttering candle beside
      it, a cooling cup and papers spread within reach of someone
      writing without leaving the room
    - a steamer trunk or a small wooden chest of family papers and
      photographs, packed for a border crossing or a departing ship
    - a train or ship's window at dusk, a writing table just visible
      inside it, the country beyond the glass already leaving
    - a hand-stitched notebook spine, the binding thread visible where
      the cover has been opened flat against its own crease
  atmosphere: >
    Warm and nocturnal rather than sunlit - a lamp or a single candle
    holding back a room, not gothic candlelight and not tropical glare.
    The register is intimate testimony given to one named listener, not
    public reportage, institutional record or an inherited archive
    passed between editors: a voice speaking across a table, a bedside or
    an ocean to someone who may never read it in time. Where exile and
    political violence enter (Chile, Venezuela, Spain's civil war) they
    register as departure, a locked door, a packed trunk or a border
    crossed at night - the fact and its cost, never a staged reenactment
    of the coup or the fighting itself. Never candles-and-ghosts gothic,
    never carnival or postcard "Latin America," and never magical-realist
    spectacle played as costume - where the fantastic appears at all, it
    sits in the same steady hand as everything else on the page.
  lineCharacter: >
    A steady, unhurried fountain-pen line, evenly loaded and continuous
    across a page as though written in one sitting at day's end - no
    tremor, no second corrector's hand ever crossing it, no dry-brush
    breakup. Pressure stays constant from the first word to the last;
    where the hand changes at all, it is only the natural, gradual drift
    of one person's handwriting over decades, never an annotation by
    someone else.
  backgroundTexture: >
    Two warm surfaces sharing a frame: the soft, faintly glossy stock of
    an old photograph print, curling a little at its corners, set
    against the matte, laid paper of a bound notebook page - both gone
    the same warm sepia-brown with age, never a printed newspaper's pulp,
    a ruled schoolbook sheet, or a rag-paper manuscript leaf.
  accentUse: >
    The warm sepia-amber on exactly one element per image, never a fill:
    the thread stitching a notebook's spine, the toned edge of a
    photograph held to the light, or a single lamp flame or candle
    holding back the rest of the room.
  avoid:
    - candles, ghosts, tarot or crystal-ball props, or a green-walled
      house standing in for the whole shelf - La casa de los espíritus's
      own costume, already ruled out above and just as wrong reached for
      here
    - levitating objects, glowing auras or any "magical realism" imagery
      staged as genre spectacle rather than stated as plainly as the rest
      of the page
    - fiesta colour, carnival imagery, palm-fringed beaches or any
      postcard "Latin America" standing in for Chile, Venezuela or
      California
    - a real likeness of Allende, Paula Frías, or any other named family
      member (docs/VISUAL.md SS3) - draw the letter, the notebook or the
      photograph itself, never the face inside or behind it
    - a staged reenactment of the 1973 coup, the Spanish Civil War or any
      other political violence as action or thriller imagery - exile and
      danger register as departure and its aftermath, never combat
    - a sealed, wax-stamped or postmarked parcel shown unopened - this
      wing's correspondence is read and reread, not withheld or sealed
    - a tied bundle of loose foolscap corrected by a second hand, a
      spiral-bound exercise book, mechanically set newsprint, or a
      specimen jar or card-catalogue drawer - the neighbouring wings'
      own objects, not this one's
    - masked-vigilante or swashbuckling costume (cape, rapier, half-mask)
      standing in for the whole shelf on the strength of one authorized
      tie-in novel
